name: CI — tooling

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tooling:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run benchmarks:test
      - run: npm run e2e:check
      - run: npm run release:test
      - run: npm run ios:check
      - run: npm run logs:check
      - run: npm run logs:test
