name: Deploy docs site

on:
  # Docs-only changes pushed to the active branch.
  push:
    branches: [main]
    paths:
      - 'skellyspeak-docs/**'
      - '.github/workflows/deploy-docs.yml'
  # Rebuild after every release so the docs pick up the new version.
  # NOTE: workflow_run only triggers when THIS file is on the default branch.
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skellyspeak-docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skellyspeak-docs/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: skellyspeak-docs/build

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
