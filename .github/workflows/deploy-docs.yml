name: Deploy docs site

on:
  # Docs-only changes pushed to the active branch.
  push:
    branches: [main]
    paths:
      - 'skellyspeak-docs/**'
      - '.github/workflows/deploy-docs.yml'
  # Rebuild after every release so the docs pick up the new version.
  # NOTE: workflow_run only triggers when THIS file is on the default branch.
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skellyspeak-docs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skellyspeak-docs/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: skellyspeak-docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
