name: iOS distribute

# Builds a SIGNED iOS .ipa for TestFlight / App Store Connect distribution.
#
# iOS cannot be built on Windows or Linux — Tauri's `ios` subcommand only
# exists on macOS, and Xcode does the signing. This workflow runs on a macOS
# runner and produces the .ipa via `tauri ios build`, the canonical command:
# it starts the internal JSON-RPC "options" server that the Xcode "Build Rust
# Code" phase connects to (a raw xcodebuild invocation cannot) and exports the
# signed .ipa. The .ipa lands at src-tauri/gen/apple/build/arm64/SkellySpeak.ipa.
#
# Signing is staged MANUALLY (keychain + profile + pbxproj settings) instead of
# via Tauri's IOS_CERTIFICATE/IOS_MOBILE_PROVISION env vars: those trigger a
# tauri-cli bug that writes the quoted/bracketed signing keys outside the
# buildSettings dict of project.pbxproj, so Xcode sees CODE_SIGN_STYLE=Manual
# with no profile and fails with "requires a provisioning profile"
# (tauri-apps/tauri#14462; read-side variant #15741). With no IOS_* env vars
# set, tauri-cli leaves signing alone and only sets plain keys (safe).

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag to attach the .ipa to (e.g. v0.4.7). Leave empty to skip."
        type: string
        default: ""
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS .ipa
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios

      - run: npm ci

      # The frontend must exist before the Xcode project references it.
      - run: npm run build

      # gen/apple is gitignored — it is generated on a Mac (Xcode) and never
      # committed from Windows, exactly like the Android scaffold is regenerated
      # on CI.
      - name: Scaffold the Xcode project
        run: npx tauri ios init

      # Stage signing assets ourselves: temp keychain (full non-interactive
      # recipe, mirrors tauri-macos-sign/src/keychain.rs) + profile installed
      # under its UUID for both Xcode profile locations.
      - name: Stage signing keychain and provisioning profile
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          set -euo pipefail
          [ -n "$IOS_CERTIFICATE" ] || { echo "::error::IOS_CERTIFICATE_P12 secret is not set"; exit 1; }
          [ -n "$IOS_CERTIFICATE_PASSWORD" ] || { echo "::error::IOS_CERTIFICATE_PASSWORD secret is not set"; exit 1; }
          [ -n "$IOS_MOBILE_PROVISION" ] || { echo "::error::IOS_PROVISION_PROFILE secret is not set"; exit 1; }

          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          P12="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$IOS_MOBILE_PROVISION" | base64 -D > "$PROFILE"
          printf '%s' "$IOS_CERTIFICATE" | base64 -D > "$P12"
          head -c 16 "$PROFILE" | xxd

          PROFILE_UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -o - -)
          echo "profile UUID: $PROFILE_UUID"

          KEYCHAIN="$RUNNER_TEMP/skellyspeak-ios.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 32)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$P12" -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild \
            -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          # append (not replace) the runner's existing keychain search list
          security list-keychain -d user -s \
            $(security list-keychain -d user | tr -d '"' | tr '\n' ' ') "$KEYCHAIN"

          CERT_NAME=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Apple Distribution|iPhone Distribution/{print $2; exit}')
          [ -n "$CERT_NAME" ] || { echo "::error::no distribution identity found in keychain"; exit 1; }
          echo "signing identity: $CERT_NAME"

          # Xcode 15 and earlier read ~/Library/MobileDevice/...; Xcode 16+ reads
          # ~/Library/Developer/Xcode/UserData/... — install into both.
          PP="$HOME/Library/MobileDevice/Provisioning Profiles"
          XP="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PP" "$XP"
          cp "$PROFILE" "$PP/$PROFILE_UUID.mobileprovision"
          cp "$PROFILE" "$XP/$PROFILE_UUID.mobileprovision"

          # expose to the following steps
          {
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "CERT_NAME=$CERT_NAME"
          } >> "$GITHUB_ENV"

      # tauri-cli corrupts project.pbxproj when IT writes these keys
      # (tauri#14462), so we inject them first, correctly, and run tauri with
      # no IOS_* env vars so its helper never touches signing. Both target
      # build configurations (debug/release) get the settings.
      - name: Inject manual signing settings into the Xcode project
        env:
          APPLE_DEVELOPMENT_TEAM: U8LBJLBYPR
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os

          proj = glob.glob("src-tauri/gen/apple/*.xcodeproj/project.pbxproj")[0]
          cert = os.environ["CERT_NAME"]
          team = os.environ["APPLE_DEVELOPMENT_TEAM"]
          uuid = os.environ["PROFILE_UUID"]

          settings = [
              ("CODE_SIGN_STYLE", "Manual"),
              ("CODE_SIGN_IDENTITY", f'"{cert}"'),
              ('"CODE_SIGN_IDENTITY[sdk=iphoneos*]"', f'"{cert}"'),
              ("DEVELOPMENT_TEAM", f'"{team}"'),
              ('"DEVELOPMENT_TEAM[sdk=iphoneos*]"', f'"{team}"'),
              ("PROVISIONING_PROFILE_SPECIFIER", f'"{uuid}"'),
              ('"PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]"', f'"{uuid}"'),
          ]

          lines = open(proj).read().splitlines()
          out, patched, i = [], 0, 0
          while i < len(lines):
              line = lines[i]
              out.append(line)
              if line.strip() == "buildSettings = {":
                  j = i + 1
                  block = []
                  while lines[j].strip() != "};":
                      block.append(lines[j])
                      j += 1
                  # only the app target's configurations carry entitlements
                  if any("CODE_SIGN_ENTITLEMENTS" in l for l in block):
                      have = {l.strip().split(" = ")[0].strip() for l in block if " = " in l}
                      out.extend(f"\t\t\t\t{k} = {v};" for k, v in settings if k not in have)
                      patched += 1
                  out.extend(block)
                  out.append(lines[j])
                  i = j + 1
                  continue
              i += 1

          assert patched == 2, f"expected to patch 2 build configurations, patched {patched}"
          open(proj, "w").write("\n".join(out) + "\n")
          print(f"patched {patched} build configurations in {proj}")
          PY
          plutil -lint src-tauri/gen/apple/*.xcodeproj/project.pbxproj
          grep -n 'PROVISIONING_PROFILE_SPECIFIER' src-tauri/gen/apple/*.xcodeproj/project.pbxproj

      # Insurance for the export phase: tauri merges gen/apple/ExportOptions.plist
      # into its computed export options (tauri#15741 — its reader can miss the
      # quoted signingCertificate). Values follow tauri's own conventions:
      # provisioningProfiles keyed by bundle id -> profile UUID.
      - name: Write ExportOptions.plist
        run: |
          set -euo pipefail
          cat > src-tauri/gen/apple/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>U8LBJLBYPR</string>
            <key>signingCertificate</key>
            <string>$CERT_NAME</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.freemocap.skellyspeak</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF
          plutil -lint src-tauri/gen/apple/ExportOptions.plist

      # Build + sign + export the .ipa in one step. Deliberately NO
      # IOS_CERTIFICATE/IOS_MOBILE_PROVISION here (see note at top). CI=true is
      # already set by GitHub, which Tauri maps to --ci.
      - name: Build the signed .ipa
        env:
          APPLE_DEVELOPMENT_TEAM: U8LBJLBYPR
        run: npx tauri ios build --export-method app-store-connect

      # A green build that produced an unsigned or wrong-team .ipa must not
      # ship: assert the signature explicitly.
      - name: Verify the .ipa is signed for the right team
        run: |
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          [ -n "$ipa" ] || { echo "::error::no .ipa produced"; exit 1; }
          echo "built: $ipa"
          ls -lh "$ipa"
          unzip -q "$ipa" -d "$RUNNER_TEMP/ipa-unzipped"
          app=$(find "$RUNNER_TEMP/ipa-unzipped/Payload" -name '*.app' | head -1)
          codesign -dv --verbose=2 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q 'TeamIdentifier=U8LBJLBYPR' "$RUNNER_TEMP/codesign.txt" || {
            echo "::error::the .ipa was not signed by team U8LBJLBYPR"; exit 1; }
          echo "signature verified: team U8LBJLBYPR"

      - name: Collect the .ipa
        run: |
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          v=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          mkdir -p dist-ios
          cp "$ipa" "dist-ios/SkellySpeak_${v}.ipa"
          ls -lh dist-ios

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist-ios/*.ipa
          retention-days: 14

      # On a tag, attach the .ipa to the release draft (created by release.yml,
      # or here if this workflow is run on its own). Manual runs attach only
      # when release_tag was supplied.
      - name: Attach the .ipa to a release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --json id >/dev/null 2>err.txt; then
            if grep -qi "release not found" err.txt; then
              gh release create "$TAG" --draft --title "SkellySpeak $TAG" --notes 'iOS build attached.'
            else
              cat err.txt; exit 1
            fi
          fi
          gh release upload "$TAG" dist-ios/*.ipa --clobber
          echo "attached the .ipa to release $TAG"

# ── Uploading to TestFlight (done by hand today) ─────────────────────────────
# The .ipa is built and signed; getting it onto testers' devices is a separate
# step that needs an App Store Connect app record:
#
#   1. In App Store Connect create the app (bundle id com.freemocap.skellyspeak).
#   2. Upload the .ipa. Easiest is Apple's Transporter app (drag the .ipa in).
#   3. In TestFlight add Internal testers (team, no review) or External
#      testers (up to 10,000, one-time beta review, public link).
