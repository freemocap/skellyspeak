name: Release

# Cut a release by bumping the version and pushing the tag:
#
#   npm run set-version 0.2.0 -- --tag
#   git commit -am "v0.2.0" && git push && git push origin v0.2.0
#
# Every job attaches its artifacts to the same DRAFT GitHub Release, so
# nothing goes public until you review the assets and hit Publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # src-tauri/Cargo.toml is the single source of truth for the app version
  # (tauri.conf.json omits `version` and inherits it). Read it once here so
  # every downstream job agrees on the tag.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
      tag: v${{ steps.get.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - id: get
        run: |
          version=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          [ -n "$version" ] || { echo "::error::no version in src-tauri/Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "app version: $version"

      # A tag that disagrees with Cargo.toml would ship mislabelled binaries.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${{ github.ref_name }}" != "v${{ steps.get.outputs.version }}" ]; then
            echo "::error::tag ${{ github.ref_name }} != v${{ steps.get.outputs.version }} from Cargo.toml"
            exit 1
          fi

  desktop:
    needs: version
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            # Azure Artifact Signing runs DURING the build, not after: signing
            # a finished installer would invalidate the updater signature
            # already computed over it.
            args: '--config src-tauri/tauri.windows-signing.conf.json'
          - name: macOS (Apple Silicon)
            os: macos-latest
            rust-target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - name: macOS (Intel)
            os: macos-latest
            rust-target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - name: Linux x64
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            args: '--bundles deb,appimage,rpm'
          - name: Linux arm64
            os: ubuntu-22.04-arm
            rust-target: aarch64-unknown-linux-gnu
            # deb only for now — AppImage tooling on arm64 needs its own pass.
            args: '--bundles deb'
    steps:
      - uses: actions/checkout@v5

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential curl wget file patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust-target }}

      - run: npm ci

      # Prebuilt binary rather than `cargo install`, which would add minutes to
      # every Windows build. Tauri invokes it through bundle.windows.signCommand.
      - name: Install Azure Artifact Signing CLI
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSLo "$RUNNER_TEMP/artifact-signing-cli.exe"             https://github.com/levminer/trusted-signing-cli/releases/download/0.11.0/artifact-signing-cli.exe
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without these the build fails, because
          # tauri.conf.json declares a pubkey and createUpdaterArtifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ── Windows: Azure Artifact Signing, read by artifact-signing-cli ──
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          # Named AZURE_SIGNING_SECRET in this repo; the CLI reads it under the
          # standard Azure name.
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_SECRET }}
          # ── macOS: Developer ID signing, then notarization ──
          # The identity and team id are not secret — both are readable from
          # any signed binary — so they are literals rather than secrets.
          APPLE_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: FreeMoCap Foundation, Inc. (U8LBJLBYPR)'
          APPLE_TEAM_ID: U8LBJLBYPR
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        with:
          # Writes latest.json — the feed the running app polls. It is served
          # from the newest PUBLISHED release, so a draft reaches nobody until
          # you publish it.
          includeUpdaterJson: true
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: SkellySpeak ${{ needs.version.outputs.tag }}
          releaseBody: |
            Desktop builds are **unsigned** — Windows SmartScreen and macOS
            Gatekeeper will warn on first launch (on macOS: right-click → Open).
            The Android APK is debug-signed and sideloadable.

            Installed desktop copies offer this version automatically once the
            release is published.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # `tauri build` EXITS 0 even when it fails: a missing signing key prints
      # "A public key has been found, but no private key", and a broken sign
      # command prints "failed to bundle project" — both with status 0. Neither
      # can be caught by the exit code, so assert on the output instead.
      - name: Verify the build produced signed artifacts
        shell: bash
        env:
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          echo "tauri-action reported artifacts: ${ARTIFACTS:-<none>}"
          if [ -z "$ARTIFACTS" ] || [ "$ARTIFACTS" = "[]" ]; then
            echo "::error::tauri produced no artifacts — bundling or code signing failed. It exits 0 regardless, so this step is what catches it."
            exit 1
          fi
          sigs=$(find src-tauri/target -name '*.sig' 2>/dev/null)
          if [ -z "$sigs" ]; then
            echo "::error::No updater .sig artifacts. Check TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
            exit 1
          fi
          echo "signed updater artifacts:"
          echo "$sigs"

  android:
    # Ordered after `desktop` only so the draft release already exists.
    # `always()` keeps a desktop failure from cancelling the APK: one broken
    # platform must not withhold the others' artifacts.
    needs: [version, desktop]
    if: always() && needs.version.result == 'success'
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          link-to-sdk: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - run: npm ci

      # `tauri.settings.gradle` hardcodes an absolute path to the local cargo
      # registry, so gen/android's generated files cannot be committed and must
      # be produced here. `init` also rewrites tracked files from its templates
      # — the manifest (RECORD_AUDIO, adjustResize, roundIcon), themes.xml,
      # MainActivity.kt, BuildTask.kt and the launcher icons — so restore
      # everything git tracks immediately afterwards.
      - name: Scaffold gen/android, then restore our tracked customisations
        run: |
          npx tauri android init
          git checkout -- src-tauri/gen/android
          git status --porcelain src-tauri/gen/android
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      - name: Build APK
        run: npx tauri android build --apk --debug
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      - name: Name the APK after the release
        run: |
          src=src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          [ -f "$src" ] || { echo "::error::APK not found at $src"; exit 1; }
          mkdir -p dist-apk
          cp "$src" "dist-apk/SkellySpeak_${{ needs.version.outputs.version }}_universal.apk"

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.version.outputs.tag }}" dist-apk/*.apk --clobber
