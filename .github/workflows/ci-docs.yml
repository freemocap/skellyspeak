name: CI — docs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix docs/docs-site
      - run: npm run docs:links
      - run: npm run docs:test
      - run: npm run docs:demos
      - run: npm run typecheck --prefix docs/docs-site

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/docs-site/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: docs/docs-site
      - run: npm run build
        working-directory: docs/docs-site
