name: CI — ui

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Root npm test includes the fast gate; it already passed in its own job.
      - run: npm run test --workspace @skellyspeak/ui
      - run: npm run test:reports
      - run: npm run build
