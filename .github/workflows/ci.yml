name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:
  workflow_call:
    inputs:
      skip_validation:
        description: 'Explicit development release bypass; never set by branch or PR CI.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validation-mode:
    runs-on: ubuntu-latest
    steps:
      - name: Record validation mode
        env:
          SKIP_VALIDATION: ${{ inputs.skip_validation }}
        run: |
          if [ "$SKIP_VALIDATION" = true ]; then
            echo "Development release: CI suite explicitly bypassed. Builds and artifact checks still gate publication." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Full CI suite required." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Run inexpensive source checks before allocating compilation/build jobs.
  fast-validation:
    if: ${{ inputs.skip_validation != true }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: npm ci
      - run: npm run check:fast

  ui:
    needs: fast-validation
    if: ${{ inputs.skip_validation != true }}
    uses: ./.github/workflows/ci-ui.yml

  native:
    needs: fast-validation
    if: ${{ inputs.skip_validation != true }}
    uses: ./.github/workflows/ci-native.yml

  server:
    needs: fast-validation
    if: ${{ inputs.skip_validation != true }}
    uses: ./.github/workflows/ci-server.yml

  content:
    needs: fast-validation
    if: ${{ inputs.skip_validation != true }}
    uses: ./.github/workflows/ci-content.yml

  docs:
    needs: fast-validation
    if: ${{ inputs.skip_validation != true }}
    uses: ./.github/workflows/ci-docs.yml

  tooling:
    needs: fast-validation
    if: ${{ inputs.skip_validation != true }}
    uses: ./.github/workflows/ci-tooling.yml

  mobile:
    needs: fast-validation
    if: ${{ inputs.skip_validation != true }}
    uses: ./.github/workflows/ci-mobile.yml
