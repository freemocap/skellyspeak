name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:
  workflow_call:
    inputs:
      skip_validation:
        description: 'Explicit development release bypass; never set by branch or PR CI.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validation-mode:
    runs-on: ubuntu-latest
    steps:
      - name: Record validation mode
        env:
          SKIP_VALIDATION: ${{ inputs.skip_validation }}
        run: |
          if [ "$SKIP_VALIDATION" = true ]; then
            echo "Development release: CI suite explicitly bypassed. Builds and artifact checks still gate publication." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Full CI suite required." >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    if: ${{ inputs.skip_validation != true }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix docs/website
      - run: npm test
      - run: npm run localization:test
      - run: npm run localization:audit -- --check
      - run: npm run benchmarks:test
      - run: npm run e2e:check
      - run: npm run test:reports
      - run: npm run docs:links
      - run: npm run docs:test
      - run: npm run styles:check
      - run: npm run release:test
      - run: npm run ios:check
      - run: npm run logs:check
      - run: npm run logs:test
      - run: npm run build

  ios:
    if: ${{ inputs.skip_validation != true }}
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native
          key: ios-simulator
      - run: npm ci
      - run: npm run ios:test
      - run: npm run build
      - run: npm run tauri -- ios init --ci --config native/tauri.release.conf.json
      - name: Prepare App Store icons
        run: |
          npm run tauri -- icon ui/public/skellyspeak-logo.png --ios-color '#f3f1ea'
          swift tools/ios-icons.swift native/gen/apple/Assets.xcassets/AppIcon.appiconset
      - name: Compile and link iOS without release credentials
        run: npm run tauri -- ios build --ci --target aarch64-sim --no-sign --config native/tauri.release.conf.json

  rust:
    timeout-minutes: 30
    if: ${{ inputs.skip_validation != true }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native
      - run: cargo clippy --lib -- -D warnings
        working-directory: native
      - run: cargo run --locked --bin export-contracts -- --check
        working-directory: native
      - run: cargo run --locked --bin benchmark_gloss -- export --check
        working-directory: native
      - run: cargo fmt -- --check
        working-directory: native
      - run: cargo test --locked --lib
        timeout-minutes: 15
        working-directory: native
      - run: cargo test --locked --manifest-path tools/verify-updater/Cargo.toml

  # The Rust core also has to COMPILE on Linux, which the Windows job above
  # cannot tell you. Native dependencies differ per platform: cpal links
  # alsa-sys on Linux only, so a missing libasound2-dev breaks the Linux
  # release build while every other platform stays green. That is exactly
  # how v0.4.3 failed -- at release time, after Windows, macOS and Android
  # had all succeeded. `cargo check` runs build scripts, which is where
  # alsa-sys fails, so it catches this without a full build.
  rust-linux:
    if: ${{ inputs.skip_validation != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install the native libraries the core links against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native
      - run: cargo check --lib
        working-directory: native
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: npm run logs:test

  # The hosted API tests. They gate the deploy in deploy-server.yml too, but
  # running them here means a pull request shows the breakage before it lands
  # rather than after.
  server:
    if: ${{ inputs.skip_validation != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - run: python server/deployment/check_upload_manifest.py
      - name: Install audio decoder
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
      - run: uv run --frozen --group dev pytest -q
        working-directory: server

  docs:
    if: ${{ inputs.skip_validation != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/website/package-lock.json
      - run: npm ci
        working-directory: docs/website
      - run: npm run build
        working-directory: docs/website

  # The Android resource merger parses these, but only 4 minutes into a release
  # build. Catch malformed XML (e.g. "--" inside a comment, which the XML spec
  # forbids) here instead, in seconds, on every push.
  android-resources:
    if: ${{ inputs.skip_validation != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate Android XML resources
        run: |
          python3 - <<'EOF'
          import pathlib, sys, xml.dom.minidom as md
          failed = []
          root = pathlib.Path('native/gen/android')
          required = [root / 'app/src/main/AndroidManifest.xml', root / 'app/build.gradle.kts', root / 'app/proguard-rules.pro', root / 'app/src/main/java/com/freemocap/skellyspeak/MainActivity.kt']
          for path in required:
              if not path.is_file():
                  failed.append(f'Missing required Android source: {path}')
          for p in sorted(root.rglob('*.xml')):
              if 'build' in p.parts:
                  continue
              try:
                  md.parse(str(p))
              except Exception as e:
                  failed.append(f"{p}: {e}")
          rules = root / 'app/proguard-rules.pro'
          if rules.is_file() and 'com.freemocap.skellyspeak.RustWebView' not in rules.read_text():
              failed.append(f'Missing RustWebView JNI keep rule: {rules}')
          for f in failed:
              print(f"::error::{f}")
          print(f"checked Android XML resources, {len(failed)} malformed")
          sys.exit(1 if failed else 0)
          EOF

  android-build:
    if: ${{ inputs.skip_validation != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Command-line tools are installed by the action; the legacy tools package is unavailable.
          packages: platform-tools

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: ndk
        with:
          ndk-version: r27c
          link-to-sdk: true

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native
          key: android-check

      - run: npm ci

      # `tauri.settings.gradle` hardcodes an absolute path to the local cargo
      # registry, so gen/android's generated files cannot be committed and must
      # be produced here. `init` also rewrites tracked files from its templates
      # — the manifest (RECORD_AUDIO, adjustResize, roundIcon), themes.xml,
      # MainActivity.kt, BuildTask.kt and the launcher icons — so restore
      # everything git tracks immediately afterwards.
      - name: Scaffold gen/android, then restore our tracked customisations
        run: |
          npm run tauri -- android init --config native/tauri.release.conf.json
          git checkout -- native/gen/android
          git status --porcelain native/gen/android
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      - name: Build Android ARM64 debug APK without release credentials
        run: npm run tauri -- android build --config native/tauri.release.conf.json --debug --apk --target aarch64 --ci
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
