# yaml-language-server: $schema=../schemas/language.yaml
schema_version: 1
identity:
  id: thai
  name: Thai
  native_name: ไทย
  family: kra-dai
  review: needs_review
integrations:
  language_tag: th
  transcription: th
definitions:
  orthographies:
    modern-thai:
      script: thai
      guidance:
        - scope: target_writing
          text: Write standard Thai in Thai script, retaining vowels, tone marks and other orthographic signs.
            Use natural phrase spacing; do not insert spaces between every word or separate
            combining marks from their bases. Preserve quoted source text exactly, including its
            original spacing. Romanization belongs only in a separate reading aid.
          sources:
            - unicode17_southeast_asia
        - scope: explanation_writing
          text: Write standard Thai in Thai script, retaining vowels, tone marks and other orthographic signs.
            Use natural phrase spacing; do not insert spaces between every word or separate
            combining marks from their bases. Preserve quoted source text exactly, including its
            original spacing. Romanization belongs only in a separate reading aid.
          sources:
            - unicode17_southeast_asia
  romanization_schemes:
    paiboon:
      label: Paiboon (tone-marked)
      instructions: Use the Paiboon convention documented in the cited comparison table. Mark mid tone
        with no accent, low with grave (à), falling with circumflex (â), high with acute (á), and
        rising with caron (ǎ), placing the mark on the first vowel. Double vowels for length,
        including aa, ii, ʉʉ, uu, ee, ɛɛ, oo, ɔɔ and əə; distinguish short/long diphthongs ia/iia,
        ʉa/ʉʉa and ua/uua. Initial ก is g, ต dt, ป bp, จ j; aspirated counterparts use k, t, p and
        ch. Final stops are k, t, p. Keep voiced b/d distinct. Separate spoken syllables with
        hyphens and words with spaces. Resolve pronunciation and lexical tone in context; Thai
        written tone signs are not a direct one-to-one mapping to spoken tones. Expand repetition in
        the aid and omit silent letters there only. This is a pronunciation-oriented aid, not
        reversible spelling or evidence of the learner’s actual pronunciation. Preserve the Thai
        source exactly.
      examples:
        - original: มา
          romanized: maa
        - original: ม้า
          romanized: máa
        - original: หมา
          romanized: mǎa
        - original: ข่า
          romanized: kàa
        - original: ข้าว
          romanized: kâao
        - original: ขอบคุณ
          romanized: kɔ̀ɔp kun
      sources:
        - thai_paiboon_conventions
      review: needs_review
