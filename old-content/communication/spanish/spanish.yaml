  reasons_connections:
    title: Razones y conexiones
    introduction: Relacionar ideas mediante causas, consecuencias, condiciones, contrastes y argumentos.
    assessment: Spanish porque introduces a reason, por eso a consequence, si a condition, and pero an
      opposition. Ordinary open conditions can use si + present indicative with an appropriate
      outcome. Do not accept a connector alone as proof that the two clauses form its intended
      relation. A condition and a reason differ; primero ... después establishes sequence but not
      causation. Evidence such as the lights being on can support a stated inference. Check that the
      learner links recoverable propositions coherently.
    sections:
      - subskill: causes_reasons
        title: Causas y razones
        concept: Explicar por qué ocurre algo o se mantiene una situación.
        explanation: Porque introduce el motivo de una acción o decisión.
        examples:
          - text: Me quedo porque estoy cansada.
            meaning: El cansancio es la razón por la que me quedo.
            note: La segunda oración explica la decisión de quedarse.
      - subskill: consequences
        title: Consecuencias
        concept: Expresar el resultado o la implicación de una situación.
        explanation: Por eso presenta una consecuencia de lo que se acaba de mencionar.
        examples:
          - text: Llueve; por eso llevo paraguas.
            meaning: Llevo paraguas debido a la lluvia.
            note: Llevar paraguas se presenta como respuesta a la lluvia.
      - subskill: conditions
        title: Condiciones
        concept: Expresar que algo depende de otra circunstancia.
        explanation: Si introduce una condición. En una condición abierta, puede usarse el presente de
          indicativo.
        examples:
          - text: Si llueve, me quedo en casa.
            meaning: Quedarme en casa depende de que llueva.
            note: La lluvia es la condición para quedarse en casa.
      - subskill: contrast
        title: Contraste
        concept: Expresar oposición, excepciones o relaciones inesperadas.
        explanation: Pero conecta hechos o valoraciones que contrastan.
        examples:
          - text: Es caro, pero es útil.
            meaning: Aunque cuesta mucho, tiene utilidad.
            note: La utilidad contrasta con la valoración negativa del precio.
      - subskill: supporting_claims
        title: Apoyar una afirmación
        concept: Aportar razones para aceptar una postura o una inferencia.
        explanation: Ofrece una razón u observación que apoye la afirmación; repetirla con más énfasis no
          aporta una prueba.
        examples:
          - text: Creo que está en casa porque la luz está encendida.
            meaning: La luz encendida me lleva a pensar que esa persona está en casa.
            note: La luz funciona como indicio para la inferencia.
    varieties:
