  coordinating_action:
    title: Coordinar acciones
    introduction: Pedir, proponer y negociar lo que hará cada participante.
    assessment: Spanish can request action with an imperative or a conventional question such as ¿Puedes
      repetirlo?; do not require an imperative. Te ayudo can offer assistance; ¿Quieres venir? can
      invite participation. Podemos... can propose joint action. Acepto and lo siento, no puedo can
      accept or decline an identifiable proposal. Promise or commitment requires an undertaking in
      context, not merely a future form. Suggestions and negotiating an alternative are distinct
      functions but earn at most one group award together.
    sections:
      - subskill: requests
        title: Peticiones
        concept: Pedir a otra persona que haga o deje de hacer algo.
        explanation: Pide la acción directamente o mediante una pregunta cortés. Poder no pregunta
          necesariamente por una capacidad física.
        examples:
          - text: ¿Puedes cerrar la puerta, por favor?
            meaning: Te pido que cierres la puerta.
            note: La respuesta esperada es realizar la acción de cerrar.
      - subskill: offers_invitations
        title: Ofrecimientos e invitaciones
        concept: Ofrecer ayuda o proponer la participación de otra persona.
        explanation: Ofrece tu ayuda o invita a la otra persona a compartir una actividad.
        examples:
          - text: ¿Quieres venir a cenar?
            meaning: Te invito a cenar.
            note: En esta situación, la pregunta invita a participar.
      - subskill: suggestions
        title: Sugerencias
        concept: Proponer una acción para que se valore.
        explanation: Podemos con infinitivo puede proponer una actividad conjunta.
        examples:
          - text: Podemos ir mañana.
            meaning: Propongo que vayamos mañana.
            note: En una conversación sobre planes, se presenta una opción.
      - subskill: commitments
        title: Compromisos
        concept: Asumir la responsabilidad de realizar una acción futura.
        explanation: Usa una expresión que indique que asumes el compromiso. Mencionar el futuro no equivale
          por sí solo a prometer.
        examples:
          - text: Te prometo que voy a llamarte.
            meaning: Me comprometo a llamarte.
            note: Prometo hace explícito el compromiso.
      - subskill: accepting_declining
        title: Aceptar y rechazar
        concept: Responder a una petición, una oferta, una invitación o una propuesta.
        explanation: Una aceptación o un rechazo breve depende de la propuesta anterior. Puedes rechazar con
          cortesía sin dar una explicación larga.
        examples:
          - text: Lo siento, no puedo.
            meaning: Rechazo la propuesta y expreso que lo lamento.
            note: Después de una invitación, esta respuesta la rechaza.
      - subskill: negotiating_plans
        title: Negociar un plan
        concept: Ajustar una propuesta a las necesidades o limitaciones de quienes participan.
        explanation: Responde al plan propuesto con una alternativa que resuelva el problema.
        examples:
          - text: A las seis no puedo; ¿quedamos a las siete?
            meaning: Propongo reunirnos a las siete porque a las seis no puedo.
            note: Se modifica la hora propuesta para resolver una limitación.
    varieties:
      spanish-spain:
        assessment: These core examples are usable in Spain. Accept valid regional uses rather than
