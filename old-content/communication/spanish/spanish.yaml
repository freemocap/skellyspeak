  information_exchange:
    title: Intercambio de información
    introduction: Pedir, aportar y comprobar información pertinente.
    assessment: "Spanish questions can use interrogatives such as qué, dónde and cuándo, or yes/no
      intonation. Omitted opening punctuation alone should not defeat an otherwise correct
      conversational question. Contextually appropriate fragments can answer a question: en casa can
      answer ¿Dónde estás? Check relevance against the actual question, not sentence length. ¿Llegas
      a las ocho? can check a time; ¿Qué quieres decir? repairs understanding instead. Requests
      phrased with ¿Puedes...? need not ask for information."
    sections:
      - subskill: asking_information
        title: Pedir información
        concept: Preguntar por un dato, una descripción o una explicación.
        explanation: Elige la expresión interrogativa según la información que buscas. El contexto y la
          entonación también permiten hacer preguntas de sí o no.
        examples:
          - text: ¿Dónde está la estación?
            meaning: Pregunto por la ubicación de la estación.
            note: Dónde pide información sobre un lugar.
      - subskill: answering_information
        title: Responder de forma pertinente
        concept: Aportar la información que solicita una pregunta concreta.
        explanation: Una respuesta breve puede aportar lo solicitado sin repetir el verbo de la pregunta.
        examples:
          - text: En casa.
            meaning: La ubicación es la casa.
            note: Responde a ¿Dónde estás? Sin esa pregunta, no podemos determinar su función de respuesta.
      - subskill: checking_facts
        title: Comprobar datos
        concept: Verificar si una idea o un detalle es correcto.
        explanation: Pide confirmación de un dato que ya tienes en mente.
        examples:
          - text: ¿Llegas a las ocho?
            meaning: Quiero confirmar la hora de llegada.
            note: Al confirmar un acuerdo, la pregunta comprueba la hora propuesta.
      - subskill: useful_detail
        title: Aportar detalles útiles
        concept: Ampliar o resumir información según las necesidades de la conversación.
        explanation: Añade detalles que ayuden a responder a la pregunta. Una respuesta más larga no es
          necesariamente más útil.
        examples:
          - text: Está al lado del banco, frente al parque.
            meaning: El banco y el parque sirven de referencia para encontrarlo.
            note: En una conversación sobre direcciones, ambas referencias precisan la ubicación.
    varieties:
      spanish-spain:
        assessment: These core examples are usable in Spain. Accept valid regional uses rather than
          requiring one national norm. Both simple and compound past constructions may be
          appropriate depending on context; do not require a compound past simply because an event
          happened today. Vosotros forms are available for informal plural address; ustedes forms
          are also grammatical in their appropriate variety or register.
        detail: null
        origin: ai
