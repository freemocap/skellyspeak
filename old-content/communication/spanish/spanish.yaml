groups:
  people_places:
    title: Personas, cosas y lugares
    introduction: Identificar referentes y describir sus propiedades, ubicación, cantidad y relaciones.
    assessment: Spanish can identify with ser, describe properties with ser or estar according to
      meaning, locate with estar and prepositions, express possession with possessives or de, and
      compare with más/menos ... que. Check the construction used, including agreement where it
      establishes the description. Do not reduce ser/estar to permanent/temporary. Correct
      identification alone is sufficient for this group; a wrong description elsewhere does not
      erase it.
    sections:
      - subskill: identification
        title: Identificación
        concept: Establecer quién es una persona o qué es una cosa.
        explanation: Usa ser para identificar. Puedes omitir el pronombre sujeto si el verbo y el contexto
          permiten identificarlo.
        examples:
          - text: Soy Ana.
            meaning: La persona que habla se llama Ana.
            note: Soy identifica a la hablante.
      - subskill: qualities_states
        title: Cualidades y estados
        concept: Describir las propiedades o el estado de algo o alguien.
        explanation: Elige ser o estar según el significado. La diferencia no se reduce a lo permanente
          frente a lo temporal.
        examples:
          - text: La puerta está abierta.
            meaning: La puerta no está cerrada.
            note: Estar describe el estado actual de la puerta.
      - subskill: location_movement
        title: Ubicación y movimiento
        concept: Situar algo y describir relaciones espaciales o recorridos.
        explanation: Combina un verbo de ubicación o movimiento con una expresión de lugar o recorrido.
        examples:
          - text: El libro está en la mesa.
            meaning: El libro se encuentra sobre la mesa.
            note: Estar en sitúa el libro con respecto a la mesa.
      - subskill: possession_relations
        title: Posesión y relaciones
        concept: Expresar pertenencia, asociación o vínculos entre personas.
        explanation: Los posesivos y de expresan pertenencia o relaciones. El posesivo concuerda con lo
          poseído, no con quien lo posee.
        examples:
          - text: Es el libro de mi hermana.
            meaning: El libro pertenece a mi hermana.
            note: De indica a quién pertenece el libro.
      - subskill: quantity_comparison
        title: Cantidad y comparación
        concept: Expresar cantidades, proporciones o comparaciones.
        explanation: Usa números y expresiones de cantidad; más ... que y menos ... que comparan cualidades
          o cantidades.
        examples:
          - text: Esta caja es más grande que esa.
            meaning: Esta caja tiene mayor tamaño que la otra.
            note: Más grande que expresa la comparación y su punto de referencia.
    varieties:
      spanish-spain:
        assessment: These core examples are usable in Spain. Accept valid regional uses rather than
          requiring one national norm. Both simple and compound past constructions may be
          appropriate depending on context; do not require a compound past simply because an event
          happened today. Vosotros forms are available for informal plural address; ustedes forms
          are also grammatical in their appropriate variety or register.
        detail: null
        origin: ai
        review: needs_review
        authorship: Contenido generado por IA para esta variedad; pendiente de revisión lingüística
          independiente.
      spanish-mexico:
        assessment: These core examples are usable in Mexico. Ustedes is the usual plural address form and
          takes third-person plural agreement. Do not require vosotros or a Spain-specific
          past-tense preference. Judge the actual context and construction; valid local choices do
          not count as errors.
        detail: null
        origin: ai
