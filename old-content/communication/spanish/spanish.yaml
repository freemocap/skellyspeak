  managing_conversation:
    title: Gestionar la conversación
    introduction: Iniciar el contacto, organizar los turnos y resolver problemas de comprensión.
    assessment: Spanish interaction can open with hola and close with hasta luego, acknowledge with
      entiendo, thank with gracias, and apologize with perdón or lo siento in an appropriate
      sequence. ¿Qué quieres decir? and ¿Puedes repetirlo? request repair when linked to an unclear
      prior contribution. Quiero decir... reformulates; no, me refiero a... corrects an
      interpretation. Por cierto can introduce a topic. Require the social or repair context, not
      just a memorized phrase or the fact that a message was sent.
    sections:
      - subskill: opening_closing
        title: Abrir y cerrar la conversación
        concept: Iniciar o terminar un encuentro comunicativo.
        explanation: Usa un saludo o una despedida en el encuentro real, no solo como una palabra citada.
        examples:
          - text: Hasta luego.
            meaning: Me despido de la otra persona.
            note: Cierra un encuentro; repetirlo en un ejercicio de vocabulario no cumple esa función.
      - subskill: acknowledging
        title: Reconocer y responder
        concept: Mostrar atención, recepción o una respuesta social pertinente.
        explanation: Indica que has recibido lo dicho o responde a un acto social. Entiendo no implica
          necesariamente estar de acuerdo.
        examples:
          - text: Gracias por avisarme.
            meaning: Agradezco que me hayas informado.
            note: Reconoce la información útil y da las gracias.
      - subskill: clarification
        title: Pedir aclaraciones
        concept: Señalar un problema de audición o comprensión y pedir ayuda para resolverlo.
        explanation: Pide que repitan o expliquen algo cuando no hayas entendido la intervención anterior.
        examples:
          - text: ¿Qué quieres decir?
            meaning: Pido que expliques lo que intentas comunicar.
            note: Se pide explicar una intervención poco clara, no comprobar un dato ya entendido.
      - subskill: rephrasing
        title: Reformular
        concept: Expresar el mismo sentido de otra manera para facilitar la comprensión.
        explanation: Quiero decir introduce otra forma de expresar lo que intentabas comunicar.
        examples:
          - text: Quiero decir que llego después de las ocho.
            meaning: Aclaro que mi llegada será después de las ocho.
            note: En una secuencia de aclaración, reformula la hora de llegada.
      - subskill: correcting_misunderstanding
        title: Corregir un malentendido
        concept: Sustituir una interpretación equivocada por la intención correcta.
        explanation: Contrasta la interpretación equivocada con lo que querías decir.
        examples:
          - text: No, me refiero al martes, no al jueves.
            meaning: El día que quería indicar era el martes.
            note: Corrige qué día entendió la otra persona.
      - subskill: turns_topics
        title: Organizar turnos y temas
        concept: Coordinar quién habla y de qué trata la conversación.
        explanation: Usa una expresión de transición o de gestión de turnos al cambiar la dirección de la
          conversación.
        examples:
          - text: Por cierto, ¿cómo está tu hermana?
            meaning: Introduzco una pregunta sobre tu hermana.
            note: Por cierto señala un cambio de tema.
