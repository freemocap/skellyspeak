  feelings_viewpoints:
    title: Sentimientos y puntos de vista
    introduction: Expresar estados internos, valoraciones y posturas.
    assessment: "Spanish expresses desire with querer + infinitive for one's own action, preferences
      with preferir or gustar constructions, emotion with forms such as estar contento, and opinions
      with creo que or evaluative wording. In gustar constructions, the liked item controls
      agreement: me gusta el café; me gustan los libros. Estoy de acuerdo and no estoy de acuerdo
      respond to a position. Count a correct function, not every assertion as an opinion. A request
      framed with quiero is still an action request when context makes that its purpose."
    sections:
      - subskill: wants_intentions
        title: Deseos e intenciones
        concept: Expresar lo que se desea o se tiene intención de hacer.
        explanation: Querer con infinitivo expresa lo que el sujeto desea hacer.
        examples:
          - text: Quiero descansar.
            meaning: Tengo ganas de descansar.
            note: Quien desea es también quien descansaría.
      - subskill: preferences
        title: Preferencias
        concept: Expresar gustos, desagrados o elecciones entre alternativas.
        explanation: Preferir expresa una preferencia. Con gustar, lo que gusta funciona como sujeto gramatical.
        examples:
          - text: Me gustan estos libros.
            meaning: Estos libros son de mi agrado.
            note: Gustan concuerda con libros, que está en plural.
      - subskill: emotions
        title: Emociones
        concept: Expresar sentimientos o reacciones emocionales.
        explanation: Nombra el sentimiento con una expresión adecuada. Los adjetivos con estar concuerdan
          con la persona descrita.
        examples:
          - text: Estoy contenta.
            meaning: Me siento feliz.
            note: Una hablante usa la forma femenina contenta.
      - subskill: opinions
        title: Opiniones
        concept: Expresar una valoración o un juicio personal.
        explanation: Creo que introduce una opinión. También puedes expresar una valoración directamente.
        examples:
          - text: Creo que es una buena idea.
            meaning: En mi opinión, la idea es buena.
            note: La hablante presenta la valoración como su punto de vista.
      - subskill: agreement_disagreement
        title: Acuerdo y desacuerdo
        concept: Apoyar o rechazar una postura expresada por otra persona.
        explanation: Responde a una postura con acuerdo, desacuerdo o una matización.
        examples:
          - text: No estoy de acuerdo.
            meaning: No comparto esa postura.
            note: Necesitamos conocer la postura anterior para saber qué se rechaza.
    varieties:
      spanish-spain:
        assessment: These core examples are usable in Spain. Accept valid regional uses rather than
          requiring one national norm. Both simple and compound past constructions may be
          appropriate depending on context; do not require a compound past simply because an event
          happened today. Vosotros forms are available for informal plural address; ustedes forms
          are also grammatical in their appropriate variety or register.
        detail: null
        origin: ai
