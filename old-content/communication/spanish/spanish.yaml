          independiente.
  time_events:
    title: Tiempo y acontecimientos
    introduction: Situar los acontecimientos en el tiempo y expresar cómo se desarrollan.
    assessment: Judge the time relationship the learner actually expresses. Spanish uses present forms
      for current situations and habits; preterite for bounded past events; imperfect for past
      background or habits; and ir a + infinitive, future forms, or contextually future present
      forms for later events. Historical present can narrate past events when context supports it.
      Estar + gerund expresses an ongoing activity; ya + an appropriate completed construction can
      mark completion. Ayer fui al mercado correctly locates a completed event. Ayer yo ir al
      mercado is an unsuccessful finite past construction, not a correct past use. Ayer alone can be
      a correct contextual answer to ¿Cuándo fuiste? Missing an article elsewhere does not defeat a
      correctly formed temporal construction. Sequence does not imply cause. A hypothetical or
      polite past-form expression is not necessarily past reference.
    sections:
      - subskill: present_events
        title: Situaciones presentes
        concept: Situar un estado, una actividad o un hábito en el período actual.
        explanation: El presente puede describir situaciones actuales o hábitos. El contexto permite
          distinguirlos.
        examples:
          - text: Trabajo aquí.
            meaning: Este es mi lugar de trabajo.
            note: El presente describe la situación laboral actual.
      - subskill: past_events
        title: Acontecimientos pasados
        concept: Situar algo antes del momento actual o de otro momento de referencia.
        explanation: Elige la construcción de pasado según el significado. Fui puede presentar un viaje
          completo; iba puede describir una situación en curso o habitual. Una respuesta breve puede
          tomar su referencia temporal de la pregunta.
        examples:
          - text: Ayer fui al mercado.
            meaning: El viaje al mercado ocurrió ayer.
            note: Fui y ayer expresan un viaje anterior y completo. Un error ajeno a esta construcción no la
              invalida.
      - subskill: future_events
        title: Acontecimientos futuros
        concept: Situar algo después del momento actual o de otro momento de referencia.
        explanation: Ir a con infinitivo permite hablar de una acción futura prevista. También puedes usar
          el futuro o un presente con referencia futura clara.
        examples:
          - text: Mañana voy a cocinar.
            meaning: Tengo previsto cocinar mañana.
            note: Mañana y voy a cocinar establecen la referencia futura.
      - subskill: duration_frequency
        title: Duración y frecuencia
        concept: Expresar cuánto dura algo o con qué frecuencia ocurre.
        explanation: Usa expresiones temporales para indicar duración o frecuencia.
        examples:
          - text: Estudio español todos los días.
            meaning: Dedico tiempo al español diariamente.
            note: Todos los días expresa la frecuencia.
      - subskill: event_sequence
        title: Secuencia
        concept: Ordenar unos acontecimientos con respecto a otros.
        explanation: Primero y después ordenan acontecimientos, sin indicar necesariamente que uno cause el
          otro.
        examples:
          - text: Primero cenamos y después salimos.
            meaning: Cenamos antes de salir.
            note: El orden es explícito; el contexto permite interpretar las formas como pasadas.
      - subskill: event_phase
        title: Acontecimientos en curso y terminados
        concept: Distinguir las fases de desarrollo o finalización de una acción.
        explanation: Estar con gerundio puede presentar una actividad en curso. Para acciones terminadas,
          usa una construcción adecuada al marco temporal.
        examples:
          - text: Estoy leyendo.
            meaning: La lectura está en curso.
            note: Estoy y leyendo presentan una actividad que se está desarrollando.
    varieties:
      spanish-spain:
        assessment: These core examples are usable in Spain. Accept valid regional uses rather than
          requiring one national norm. Both simple and compound past constructions may be
          appropriate depending on context; do not require a compound past simply because an event
          happened today. Vosotros forms are available for informal plural address; ustedes forms
          are also grammatical in their appropriate variety or register.
