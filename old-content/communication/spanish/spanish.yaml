  possibilities_constraints:
    title: Posibilidades y limitaciones
    introduction: Expresar capacidades, permisos, obligaciones y límites de lo que sabemos.
    assessment: Spanish poder can express ability, permission or possibility; use the exchange to
      distinguish them. Tengo que + infinitive and hay que + infinitive express requirements; tengo
      de ir is not the corresponding tener que construction. Puede que + subjunctive expresses
      possibility. No estoy seguro expresses uncertainty. A future form can express conjecture
      rather than future time. A question such as ¿Puedes cerrar la puerta? usually requests action
      rather than testing ability. Do not credit this group from its modal form alone.
    sections:
      - subskill: ability
        title: Capacidad
        concept: Expresar lo que alguien es capaz de hacer.
        explanation: Poder con infinitivo puede expresar capacidad. Saber con infinitivo expresa que se ha
          aprendido a hacer algo.
        examples:
          - text: Sé nadar.
            meaning: Tengo la capacidad de nadar.
            note: Saber expresa una capacidad aprendida.
      - subskill: permission
        title: Permiso
        concept: Expresar si una acción está permitida.
        explanation: Una pregunta con poder puede pedir permiso. La situación ayuda a distinguir este
          significado.
        examples:
          - text: ¿Puedo entrar?
            meaning: Pido permiso para entrar.
            note: En una puerta, la pregunta se interpreta como una solicitud de permiso.
      - subskill: obligation
        title: Obligación y necesidad
        concept: Expresar deberes, requisitos o necesidades prácticas.
        explanation: Tener que con infinitivo expresa una obligación personal. Hay que puede expresar una
          necesidad general.
        examples:
          - text: Tengo que salir.
            meaning: Es necesario que salga.
            note: Que debe aparecer entre tengo y el infinitivo.
      - subskill: possibility
        title: Posibilidad
        concept: Presentar algo como posible o dependiente de las circunstancias.
        explanation: Puede que seguido de subjuntivo presenta una posibilidad.
        examples:
          - text: Puede que llueva.
            meaning: Es posible que llueva.
            note: Llueva va en subjuntivo después de puede que.
      - subskill: certainty
        title: Certeza e incertidumbre
        concept: Expresar confianza, duda o límites del conocimiento.
        explanation: No estoy seguro expresa el grado de certeza. No tiene por qué referirse a una predicción.
        examples:
          - text: No estoy seguro.
            meaning: Tengo dudas sobre lo que se está diciendo.
            note: Un hablante usa seguro para expresar incertidumbre sobre la idea en cuestión.
    varieties:
      spanish-spain:
        assessment: These core examples are usable in Spain. Accept valid regional uses rather than
          requiring one national norm. Both simple and compound past constructions may be
          appropriate depending on context; do not require a compound past simply because an event
          happened today. Vosotros forms are available for informal plural address; ustedes forms
          are also grammatical in their appropriate variety or register.
