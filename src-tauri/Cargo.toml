[package]
name = "skellyspeak"
version = "0.4.6"
description = "SkellySpeak — a standalone multilingual language tutor"
edition = "2021"

[lib]
name = "skellyspeak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
schemars = "0.8"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
uuid = { version = "1.26.0", features = ["v4"] }
sha2 = "0.11.0"
getrandom = "0.4.3"

# The updater is desktop-only: Tauri has no updater for Android or iOS, where
# app updates come from the store or a sideloaded package instead.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Microphone capture, in the core. WKWebView refuses to treat Tauri's custom
# scheme as a secure context, so `navigator.mediaDevices` does not exist in a
# packaged macOS build — and iOS has the same problem. So EVERY platform except
# Android captures in the core: cpal opens the input device, hound writes the
# WAV that Whisper is sent. Android alone keeps the webview recorder, which
# works there. On iOS, cpal's coreaudio host needs the app to configure
# AVAudioSession first — see src/audio.rs.
[target.'cfg(not(target_os = "android"))'.dependencies]
cpal = "0.15"
hound = "3.5"

# AVAudioSession configuration on iOS: the recorder needs the session category
# set to playAndRecord and activated before cpal can capture anything.
# objc2-avf-audio (NOT the objc2-av-foundation umbrella) is the canonical home
# of AVAudioSession; its 0.3 line matches the objc2 0.6.x framework crates the
# rest of the tree already resolves (objc2-foundation 0.3.2 etc.).
[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-avf-audio = "0.3"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-deep-link = "2.4.10"

[profile.release]
strip = true
lto = true
