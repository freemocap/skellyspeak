[package]
name = "skellyspeak"
version = "1.0.3"
license = "AGPL-3.0-or-later"
edition = "2024"
default-run = "skellyspeak"

[lib]
name = "skellyspeak_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
uuid = { version = "1", features = ["v4"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["sync", "time", "macros", "net", "io-util"] }
regex = "1"
unicode-segmentation = "=1.13.3"
zeroize = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tauri-plugin-opener = "2.5.5"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
cpal = "0.15"
hound = "3.5"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
keyring-core = "1"
android-native-keyring-store = "1"
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-deep-link = "2"
