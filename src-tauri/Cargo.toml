[package]
name = "skellyspeak"
version = "0.4.4"
description = "SkellySpeak — a standalone multilingual language tutor"
edition = "2021"

[lib]
name = "skellyspeak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
schemars = "0.8"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
uuid = { version = "1.26.0", features = ["v4"] }
sha2 = "0.11.0"
getrandom = "0.4.3"

# The updater is desktop-only: Tauri has no updater for Android or iOS, where
# app updates come from the store or a sideloaded package instead.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Microphone capture. WKWebView refuses to treat Tauri's custom scheme as a
# secure context, so `navigator.mediaDevices` does not exist in a packaged
# macOS build and the browser recording API is unavailable there. Desktop
# therefore captures in the core: cpal opens the input device, hound writes the
# WAV that Whisper is sent. Mobile keeps the webview recorder, which works.
cpal = "0.15"
hound = "3.5"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-deep-link = "2.4.10"

[profile.release]
strip = true
lto = true
