findings:
  - "Completed 2,304 billed requests for $0.189583968. Three responses contain invalid distributions; they are retained without retry. No transport failures. Candidate performance excludes misleading control E."
  - "Default scope is all 144 cases: 48 per language, including eight preflagged cases per language. There are 24 semantic clusters, not 144 independent scenarios. This is agreement with provisional references for two skills, not general language competence."
  - "Baseline B agreement is 86.98% in Spanish, 85.94% in Levantine Arabic, and 86.46% in Chinese. Pooled baseline is 86.46% [95% cluster interval 78.13–93.75]. The highest pooled point estimate belongs to baseline; no candidate-versus-B adjusted interval excludes zero in the pooled analysis."
  - "Strategies are not identical in observed behavior: pooled candidate agreement ranges from 78.47% for joint assessment D to 86.46% for baseline B. The uncertainty is too wide to establish those pooled differences or equivalence."
  - "In the exploratory Arabic slice, joint assessment D is 11.98 points below B [six-contrast adjusted interval −25.00 to −1.56], and decision rules G are 10.42 points below B [−22.92 to −0.52]. These intervals adjust within the slice, not across all language/skill/filter searches. They warrant inspecting failures, not declaring a general Arabic architecture rule."
  - "Matched Spanish baseline was 86.25% in the preceding run and is 86.98% now: +0.73 points on the exact same 48 cases and request bodies. This is a separate descriptive run comparison. The earlier mid-90s view excluded flagged cases; the current default does not."
  - "Control E scores 43.58% [95% interval 28.99–58.16] and remains separate from candidate performance and ranking. Its cost is included in experiment spending."
  - "Among 1,005 candidate case/strategy groups with two valid identical-input responses, 36 changed a focal choice and 949 changed probabilities. Repetitions are retained inside scenario clusters; they do not increase the independent scenario count."
  - "For the architecture discussion, B is a reasonable provisional reference, not a proven optimum. This round does not justify replacing it with longer criteria, a local-language rubric, joint decisions or examples. Next design decisions should distinguish shared skill definitions, language-owned guidance, and evaluator output structure while preserving inspectable evidence. Full guide generation and app runtime changes remain deferred."
  - "Case and translation adjudication is the main unresolved measurement issue. The same author produced prompts and references; language differences may reflect adaptation choices. This round is finished; no additional inference is started automatically."
