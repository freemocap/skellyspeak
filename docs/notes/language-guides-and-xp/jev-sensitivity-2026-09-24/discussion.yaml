findings:
  - "The misleading control establishes sensitivity to the definition text: agreement falls from 86.94% in B to 45.83% in E, a difference of −41.11 percentage points (paired 95% interval −59.03 to −23.23). E changes 208 of 360 paired focal judgments, or 57.8% (95% interval 41.8–73.6%). This is not evidence that longer or better teaching improves assessment; it shows that the model responds to deliberately changed meanings."
  - "Minimal wording scores 85.28%, 1.67 points below B (95% interval −3.78 to −0.26). This is a small exploratory effect, not a universal quality threshold. Removing disputed cases makes its interval touch zero. Its cost is about 17% lower than B."
  - "Examples score 88.89%, 1.94 points above B (95% interval −3.03 to +6.83), at about 32% higher cost. Among valid paired judgments, examples fix 13 reference mismatches and introduce 5; one additional judgment fails validation. The collection does not yet establish that the added cost buys a reliable improvement."
  - "Operational rules score 84.44%, 2.50 points below B (95% interval −7.57 to +2.11). They fix 5 mismatches and introduce 14. More explicit prose does not automatically produce better assessments."
  - "A useful concrete contrast: both rules and examples fix the successful contextual answer ‘Marta.’ But the rules introduce expression mismatches on a greeting and a quotation of the word ‘ayer’; examples improve the present/future negative controls. This points toward a focused test of absence versus unsuccessful expression, including explicit paired evidence/expression examples, rather than adding general guide length."
  - "Total reported cost is $0.06495468 for 900 requests, with no transport failures and three validation failures. Costs in the plots are per 1,000 requests: minimal $0.05488, baseline $0.06648, rules $0.08554, examples $0.08781, misleading $0.06614. For example, baseline costs about $0.00006648 per request. Every request contains four judgments; this is not a twelve-skill production cost estimate."
  - "Next: review the specific reference disagreements, then test a compact description that explicitly separates no use, failed use, and incomplete use on new cases. Keep the present cases as development data. Do not promote the misleading control or claim a production winner from these point estimates."
