findings:
  - "On the primary slice (40 fresh, unflagged cases in 23 paired-scenario groups), baseline B scores 95.25%. H, examples inside criteria, scores 96.25%; its +1.00-point difference has a multiplicity-adjusted interval of −9.75 to +11.56 points. There is no established improvement, and that broad interval does not establish equivalence either."
  - "The remaining candidate point estimates are A criteria 92.75%, C Spanish 94.50%, D joint 91.25%, F concrete questions 93.75%, and G decision rules 93.00%. Their adjusted difference intervals also include zero. The misleading control scores 49.75%, confirming sensitivity to deliberately altered meanings."
  - "The primary baseline is already near the reference ceiling on these cases. Adding prompt strategies cannot create much upward room here. Excluding the eight preflagged ambiguous fresh cases protects against treating uncertain references as gold, but also removes some of the hardest boundary questions. Inspect those separately; do not change their labels to favor a strategy."
  - "Joint classification enforces compatible evidence/expression categories, yet it does not improve reference agreement here. Consistency of output structure and correctness of language interpretation remain different properties."
  - "Exact-input audit: all 672 case/strategy groups have one unique request-body hash across five repetitions. Among 669 groups with five valid responses, 61 change a selected answer, 36 change a focal-skill answer, and 626 change a probability. Question IDs and probability keys were sorted before comparison. This demonstrates observed API variability, not a particular source of randomness or a known temperature setting."
  - "Repeated calls are useful for repeatability, but they do not supply independent language evidence. The bootstrap resamples scenario groups and keeps all their repetitions together. Future studies should emphasize more independent, reviewed cases and use a smaller repeatability subset rather than repeating everything five times."
  - "All 3,360 requests completed with reported billing; three responses failed distribution validation and remain recorded. Total cost was $0.26638584. No automatic retries or post-result prompt/reference changes occurred."
  - "Recommended next step: adjudicate the difficult reference boundaries, especially contextual completeness and absence versus failed use, before another prompt sweep. Then compare the baseline and one candidate on a larger independently authored set. The present results justify neither a production winner nor the assertion that all explanations are sufficient."
