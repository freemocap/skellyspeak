# Build and deploy the SkellySpeak API to Cloud Run.
#
# Secrets are NOT passed as substitutions — they would be visible in build
# logs and history. They are mounted from Secret Manager at run time, so the
# only thing this file knows is their names.
options:
  logging: CLOUD_LOGGING_ONLY
  # Required to expand ${PROJECT_ID} and ${BUILD_ID} inside _IMAGE. Triggers
  # do this automatically; a manual `gcloud builds submit` does not, and
  # without it the image name is passed through with the braces intact.
  dynamic_substitutions: true

steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "Build"
    args: ["build", "-t", "${_IMAGE}", "-f", "server/Dockerfile", "server"]

  - name: "gcr.io/cloud-builders/docker"
    id: "Push"
    args: ["push", "${_IMAGE}"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "Deploy"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "skellyspeak-api"
      - "--image=${_IMAGE}"
      - "--region=${_REGION}"
      - "--platform=managed"
      # Public: the app authenticates with its own session token, not IAM.
      - "--allow-unauthenticated"
      # The identity the CONTAINER runs as. Without this Cloud Run uses the
      # default compute service account, which holds roles/editor here — so any
      # code execution inside the API process would become project Editor via
      # the metadata server. This one holds Firestore and its own secrets only.
      - "--service-account=skellyspeak-run@${PROJECT_ID}.iam.gserviceaccount.com"
      # ^ commas inside a single --set-env-vars need the escaping below, so
      # each value is kept free of them.
      - "--set-env-vars=^@^PUBLIC_BASE_URL=${_PUBLIC_BASE_URL}@FREE_DAILY_MICROS=${_FREE_DAILY_MICROS}@GLOBAL_DAILY_MICROS=${_GLOBAL_DAILY_MICROS}@MAX_USERS=${_MAX_USERS}@ALLOWED_MODELS=${_ALLOWED_MODELS}@MAX_COMPLETION_TOKENS=${_MAX_COMPLETION_TOKENS}"
      - "--set-secrets=GOOGLE_CLIENT_ID=google-client-id:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,JWT_SIGNING_KEY=jwt-signing-key:latest,OPENROUTER_API_KEY=openrouter-api-key:latest,GROQ_API_KEY=groq-api-key:latest"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=4"
      # Streamed answers run long; the default 300s would cut them off.
      - "--timeout=600"

substitutions:
  _REGION: "us-central1"
  _IMAGE: "gcr.io/${PROJECT_ID}/skellyspeak-api:${BUILD_ID}"
  _PUBLIC_BASE_URL: ""
  # Closed testing. The allowance is MONEY, in micro-dollars (1000000 = $1),
  # because OpenRouter reports what each request actually cost and a token
  # budget is denominated in a unit whose price the caller picks by choosing a
  # model. Raise them with `gcloud run services update --update-env-vars` for
  # an immediate change, then mirror the new value here or the next deploy
  # reverts it.
  #
  # $0.50/user/day across at most 6 accounts, under a $2.00/day shared ceiling:
  # the most this service can spend in a day is two dollars, by arithmetic
  # rather than by hope.
  _FREE_DAILY_MICROS: "500000"
  _GLOBAL_DAILY_MICROS: "2000000"
  _MAX_USERS: "6"
  # The models this service will pay for. Comma-separated; the app needs one.
  # Anything else is refused with a message naming what IS served, because the
  # request body is otherwise forwarded untouched.
  # Two, because the app uses two: gemini-2.5-flash for every chat and
  # analysis call, and gpt-audio-mini for spoken replies, which go through the
  # same /v1/chat/completions endpoint with an audio modality.
  _ALLOWED_MODELS: "google/gemini-2.5-flash,openai/gpt-audio-mini"
  # Ceiling on a single completion, so one runaway generation cannot spend a
  # whole day's budget. Must stay ABOVE what the app itself asks for:
  # ai.rs sends 32000 on structured worker and reasoning calls, and a lower
  # value here rejects every analysis pass with a 400.
  _MAX_COMPLETION_TOKENS: "32768"

images:
  - "${_IMAGE}"
