[project]
name = "skellyspeak-api"
version = "0.1.0"
license = "AGPL-3.0-or-later"
description = "Sign-in, quota, and an authenticated AI passthrough for SkellySpeak"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "google-cloud-firestore>=2.19",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
