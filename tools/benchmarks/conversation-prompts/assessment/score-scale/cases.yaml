# Columns: preceding partner message, learner message, actual partner reply.
# Parallel scenarios are adaptations, not independently reviewed translations.
- id: clear
  expected: {grammar: [0.8, 1], conversation: [0.8, 1], understanding: [understood]}
  es: ["¿Qué hiciste ayer?", "Ayer fui al mercado y compré pan.", "¿Qué tipo de pan compraste?"]
  ar: ["شو عملت مبارح؟", "مبارح رحت عالسوق واشتريت خبز.", "أي نوع خبز اشتريت؟"]
  zh: ["你昨天做了什么？", "我昨天去市场买了面包。", "你买了什么面包？"]
