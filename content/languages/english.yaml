      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    present_situations:
      core:
        assessment: English simple present can mark habits and states; be plus ing can mark current activity.
        explanation: >-
          ### Form and meaning


          Use the simple present for habits and many states. Add -s to a regular verb with he, she
          or it. Use am, is or are plus the -ing form for an activity in progress.


          ### In use


          A present situation does not always need a progressive form: I know and I need are
          ordinary present statements. Time and context determine the intended reading.
        examples:
          - text: I work here.
            translation: I work here.
          - text: She is reading.
            translation: She is reading.
      varieties:
        english-united-states:
          assessment: English simple present can mark habits and states; be plus ing can mark current activity.
          explanation: "The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener."
          examples: []
        english-united-kingdom:
          assessment: English simple present can mark habits and states; be plus ing can mark current activity.
          explanation: "The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener."
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    past_reference:
      core:
        assessment: English refers to past events with past forms, auxiliaries and contextual time reference.
        explanation: >-
          ### Form and meaning


          Many verbs form the simple past with -ed, but common verbs such as go have irregular
          forms. Was and were are the past forms of be.


          ### In use


          After did or did not, use the base verb: did you go, not did you went. Was reading
          presents an activity already in progress at a past time.
        examples:
          - text: We arrived yesterday.
            translation: We arrived yesterday.
          - text: I was reading when she called.
            translation: I was reading when she called.
      varieties:
        english-united-states:
          assessment: English refers to past events with past forms, auxiliaries and contextual time reference.
          explanation: "The simple past is common with just, already and yet in American conversation: I just
            ate. The present perfect is also available; the intended connection to the present
            matters."
          examples: []
        english-united-kingdom:
          assessment: English refers to past events with past forms, auxiliaries and contextual time reference.
          explanation: "British usage often favors the present perfect with just, already and yet when the
            event is relevant now: I have just eaten. The simple past remains normal with a finished
            past time such as yesterday."
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    future_reference:
      core:
        assessment: English uses will, be going to and present forms with future context.
        explanation: >-
          ### Form and meaning


          Will plus a base verb can make a prediction or an immediate commitment. Be going to often
          expresses an intention or a prediction grounded in current evidence.


          ### In use


          Present forms also describe future arrangements and schedules. Tomorrow can establish
          future meaning without will.
        examples:
          - text: I am going to cook tonight.
            translation: I am going to cook tonight.
          - text: The train leaves tomorrow.
            translation: The train leaves tomorrow.
      varieties:
        english-united-states:
          assessment: English uses will, be going to and present forms with future context.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
        english-united-kingdom:
          assessment: English uses will, be going to and present forms with future context.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    wants_preferences:
      core:
        assessment: English expresses desire and preference with want, like, prefer and related constructions.
        explanation: >-
          ### Form and meaning


          Want can take a noun or to plus a verb. Like can describe enjoyment of a thing or
          activity; would like is a less direct way to express a wish.


          ### In use


          Liking an activity does not mean planning to do it now. Compare I like swimming with I
          want to swim.
        examples:
          - text: I like coffee.
            translation: I like coffee.
          - text: I would like to sit down.
            translation: I would like to sit down.
      varieties:
        english-united-states:
          assessment: English expresses desire and preference with want, like, prefer and related
            constructions.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
