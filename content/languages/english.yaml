    questions_answers:
      core:
        assessment: English questions use question words, auxiliary order or conversational intonation.
        explanation: >-
          ### Form and meaning


          In many questions, put an auxiliary before the subject. With a simple lexical verb, use do
          or does. Question words specify the information needed.


          ### In use


          A question about the subject often keeps ordinary order: who lives here? Spoken
          confirmation questions can also use statement order.
        examples:
          - text: Where do you live?
            translation: Where do you live?
          - text: Who lives here?
            translation: Who lives here?
      varieties:
