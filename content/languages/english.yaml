      sources: []
    affirm_negate:
      core:
        assessment: English negation uses not with auxiliaries or be, and do support with many lexical verbs.
        explanation: >-
          ### Form and meaning


          Put not after be or an auxiliary. With ordinary simple-present and simple-past verbs, use
          do, does or did plus not and the base verb.


          ### In use


          Not changes the proposition, while no can answer a question or modify a noun. Contractions
          such as don't are common in conversation.
        examples:
          - text: I do not know.
            translation: I do not know.
          - text: She is not here.
            translation: She is not here.
      varieties:
        english-united-states:
          assessment: English negation uses not with auxiliaries or be, and do support with many lexical verbs.
