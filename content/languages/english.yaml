  skill_guides:
    identify_describe:
      core:
        assessment: English uses be for identity, qualities and location; noun phrases can identify referents.
        explanation: >-
          ### Form and meaning


          Use a noun to identify someone or something, and an adjective to describe a quality. With
          a present description, use am, is or are between the subject and its description.


          ### In use


          A and an introduce one countable thing; the points to something identifiable in context.
          An adjective normally comes before a noun but after be.
        examples:
          - text: She is a doctor.
            translation: She is a doctor.
          - text: The room is quiet.
            translation: The room is quiet.
      varieties:
        english-united-states:
          assessment: English uses be for identity, qualities and location; noun phrases can identify
            referents.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
        english-united-kingdom:
          assessment: English uses be for identity, qualities and location; noun phrases can identify
            referents.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    possession_relationships:
      core:
        assessment: English uses have, possessive determiners and possessive noun phrases for possession and
          association.
        explanation: >-
          ### Form and meaning


          Use have to say that someone has something. My, your, his, her, its, our and their
          identify the person or group associated with a noun.


          ### In use


          My sister describes a relationship, not ownership. Compare my book with the book is mine:
          mine stands without a following noun.
        examples:
          - text: I have a bicycle.
            translation: I have a bicycle.
          - text: This is my sister.
            translation: This is my sister.
      varieties:
        english-united-states:
          assessment: English uses have, possessive determiners and possessive noun phrases for possession and
            association.
          explanation: "Have is a common possession pattern in this variety. Have got also occurs. Gotten is
            used for many past-participle meanings of get, but have got for possession does not
            become have gotten automatically."
          examples: []
        english-united-kingdom:
          assessment: English uses have, possessive determiners and possessive noun phrases for possession and
            association.
          explanation: "Have got is common for possession in conversation: I have got a bicycle. Have is also
            standard. In a question, have you got and do you have use different auxiliary patterns."
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    quantity:
      core:
        assessment: English expresses amounts with numbers and quantifiers; countability affects the form.
        explanation: >-
          ### Form and meaning


          Put a number before a countable noun, usually with a plural ending after numbers other
          than one. Use much with uncountable amounts and many with countable items.


          ### In use


          Some works with both plural nouns and uncountable nouns. A little water and a few bottles
          describe small amounts in different ways.
        examples:
          - text: We need three chairs.
            translation: We need three chairs.
          - text: There is a little water.
            translation: There is a little water.
      varieties:
        english-united-states:
          assessment: English expresses amounts with numbers and quantifiers; countability affects the form.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
        english-united-kingdom:
          assessment: English expresses amounts with numbers and quantifiers; countability affects the form.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
