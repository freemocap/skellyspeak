    ability_permission_necessity:
      core:
        assessment: English modals and related phrases express ability, permission and obligation.
        explanation: >-
          ### Form and meaning


          Can can express ability or permission, depending on the situation. Must and have to
          express necessity; should often offers advice rather than a strict requirement.


          ### In use


          After can, must or should, use the base verb without to. Not having to do something means
          it is optional; must not means it is prohibited.
        examples:
          - text: I can swim.
            translation: I can swim.
          - text: You do not have to come.
            translation: You do not have to come.
      varieties:
        english-united-states:
          assessment: English modals and related phrases express ability, permission and obligation.
