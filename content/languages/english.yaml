      sources: []
    reasons_conditions:
      core:
        assessment: English because and if connect reasons and conditions.
        explanation: >-
          ### Form and meaning


          Because introduces a reason; if introduces a condition. The two clauses explain how
          situations relate rather than merely placing them beside each other.


          ### In use


          For an ordinary possible future condition, use a present form after if: if it rains, we
          will stay home. This does not mean the rain is happening now.
        examples:
          - text: I stayed home because I was tired.
            translation: I stayed home because I was tired.
          - text: If it rains, we will stay home.
            translation: If it rains, we will stay home.
