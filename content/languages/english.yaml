    requests:
      core:
        assessment: English requests use imperatives, please and modal questions.
        explanation: >-
          ### Form and meaning


          A base verb can directly request action. Please can soften the wording, and could you or
          would you can make the request less direct.


          ### In use


          Could you open the window? usually asks for action, not a report on physical ability. The
          relationship and situation affect how direct a request sounds.
        examples:
          - text: Please sit down.
            translation: Please sit down.
          - text: Could you open the window?
            translation: Could you open the window?
      varieties:
