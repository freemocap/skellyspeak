# yaml-language-server: $schema=../schemas/language.json
schema_version: 1
identity:
  id: malayalam
  name: Malayalam
  native_name: മലയാളം
  family: dravidian
  review: needs_review
integrations:
  language_tag: ml
  transcription: ml
definitions:
  orthographies:
    malayalam:
      script: malayalam
      guidance:
      - scope: target_writing
        text: Write newly generated Malayalam in Malayalam script. Preserve source excerpts exactly, including
          vowel signs, conjuncts and joining controls. Keep newly generated target and explanation text in this script.
          Reading-aid romanization is generated by a separate operation.
        sources:
        - unicode17_indic
      - scope: explanation_writing
        text: Write newly generated Malayalam in Malayalam script. Preserve source excerpts exactly, including
          vowel signs, conjuncts and joining controls. Keep newly generated target and explanation text in this script.
          Reading-aid romanization is generated by a separate operation.
        sources:
        - unicode17_indic
  romanization_schemes:
    ala-lc-malayalam:
      label: ALA-LC Malayalam
      instructions: Use ALA-LC Malayalam (2014) orthographic transliteration with its diacritics and distinctions
        between short and long vowels, including e/ē and o/ō. Preserve consonant doubling. Chillu consonants
        carry no inherent a; follow the table for candrakkala, including its ȧ value where it represents
        the reduced vowel. Treat modern chillu letters and legacy sequences according to their intended
        letters without rewriting the source. This is transliteration, not a pronunciation guide; put
        spoken pronunciation in the separate pronunciation field.
      examples:
      - original: മീന
        romanized: mīna
      - original: പാൽ
        romanized: pāl
      - original: വീട്
        romanized: vīṭȧ
      - original: കഥ
        romanized: katha
      - original: നീല
        romanized: nīla
      sources:
      - ala_lc_malayalam
      review: needs_review
defaults:
  variety: malayalam-kerala
  orthography:
    local: malayalam
  scalars: {}
  romanization:
    mode: scheme
    scheme:
      local: ala-lc-malayalam
  supported_romanizations:
  - local: ala-lc-malayalam
traits: []
varieties:
- id: malayalam-kerala
  name: Kerala
  description: Contemporary standard Malayalam for everyday conversation in Kerala, India.
  review: needs_review
  sources: []
  overrides: {}
  guidance: []
guidance:
- scope: segmentation
  text: Select linguistic words without splitting vowel signs or conjuncts. Preserve the exact source
    encoding and let the supplied grapheme boundaries constrain annotation spans.
  sources:
  - unicode17_indic
learning:
  goal_material:
    courtesy:
      tokens:
      - നന്ദി
conversation:
  default_partner:
    name: മീന
    romanizedName: Mīna
    age: 32
    location: Kochi, Kerala, India
    occupation: Bicycle mechanic
    background: Runs a small bicycle repair workshop and shares a home with a friend.
    currentSituation: Repairing a touring bicycle and planning a ferry trip.
    interests:
    - cycling
    - cooking
    - ferry trips
    opinions:
    - Public transport should be easier to use.
    interestingFacts:
    - Keeps a notebook of places to visit.
    favoriteBooks: []
    favoriteMovies: []
    manner: Uses short everyday sentences and asks concrete follow-up questions.
    quirks:
    - Draws small maps when explaining directions.
    vibe:
    - 📚
    - 🚲
    - ☕
