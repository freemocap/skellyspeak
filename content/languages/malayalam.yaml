learning:
  goal_material:
    courtesy:
      tokens:
        - നന്ദി
  skill_guides:
    identify_describe:
      core:
        assessment: Malayalam uses nominal predicates and copular forms for identity and description.
        explanation: >-
          ### Form and meaning


          ആണ് connects many noun identities and descriptions. A descriptive expression before a noun
          may differ from the predicate used to describe the noun in a sentence.


          ### In use


          The predicate commonly comes near the end. Malayalam does not require a different verb
          ending for every grammatical person in these basic patterns.
        examples:
          - text: ഞാൻ വിദ്യാർത്ഥിയാണ്.
            translation: I am a student.
          - text: ഈ മുറി വലുതാണ്.
            translation: This room is big.
      varieties:
        malayalam-kerala:
          assessment: Malayalam uses nominal predicates and copular forms for identity and description.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    possession_relationships:
      core:
        assessment: Malayalam expresses possession with genitive forms and existential constructions.
        explanation: >-
          ### Form and meaning


          എന്റെ marks my before a noun. A construction with എനിക്ക് and ഉണ്ട് can express having
          something or a relationship.


          ### In use


          The same dative-style experiencer appears in several need and feeling constructions.
          Having and owning are not always distinguished by the presence of ഉണ്ട് alone.
        examples:
          - text: എനിക്ക് ഒരു പുസ്തകം ഉണ്ട്.
            translation: I have a book.
          - text: ഇത് എന്റെ വീടാണ്.
            translation: This is my house.
      varieties:
        malayalam-kerala:
          assessment: Malayalam expresses possession with genitive forms and existential constructions.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    quantity:
      core:
        assessment: Malayalam uses numerals and quantity words before or around noun phrases.
        explanation: >-
          ### Form and meaning


          Numbers can count objects without copying English plural marking. കുറച്ച് describes a
          small amount or number, depending on the noun.


          ### In use


          A counted object and a portion of a substance need different interpretations even if the
          quantity expression is similar. Read the noun together with the amount word.
        examples:
          - text: എനിക്ക് രണ്ട് പുസ്തകങ്ങൾ ഉണ്ട്.
            translation: I have two books.
          - text: കുറച്ച് വെള്ളം വേണം.
            translation: I want a little water.
      varieties:
        malayalam-kerala:
          assessment: Malayalam uses numerals and quantity words before or around noun phrases.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    present_situations:
      core:
        assessment: Malayalam present and progressive constructions express current situations.
        explanation: >-
          ### Form and meaning


          A form ending in -ുന്നു commonly describes a present activity or habit. Additional verbal
          constructions can emphasize that an activity is continuing.


          ### In use


          A time word such as ഇപ്പോൾ makes current-time reference explicit. Do not infer a separate
          English-style progressive distinction from every translation.
        examples:
          - text: ഞാൻ ഇവിടെ ജോലി ചെയ്യുന്നു.
            translation: I work here.
          - text: അവൾ ഇപ്പോൾ വായിക്കുന്നു.
            translation: She is reading now.
      varieties:
        malayalam-kerala:
          assessment: Malayalam present and progressive constructions express current situations.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    past_reference:
      core:
        assessment: Malayalam past reference uses past verb forms and contextual time expressions.
        explanation: >-
          ### Form and meaning


          Past forms are not created by one identical suffix on every verb. Common forms need to be
          learned with the verb, as in വരുക and വന്നു.


          ### In use


          ഇന്നലെ places an event yesterday. Past copular and existential constructions have their
          own forms, so a state and an action do not necessarily use the same pattern.
        examples:
          - text: ഞാൻ ഇന്നലെ വന്നു.
            translation: I came yesterday.
          - text: അവൾ ഒരു പുസ്തകം വായിച്ചു.
            translation: She read a book.
      varieties:
        malayalam-kerala:
          assessment: Malayalam past reference uses past verb forms and contextual time expressions.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    future_reference:
      core:
        assessment: Malayalam future reference uses forms including -ും and future context.
        explanation: >-
          ### Form and meaning


          A verb form such as വരും can refer to a future event. നാളെ and other future time
          expressions make the intended time clear.


          ### In use


          The same form can have habitual or general readings in other contexts. Do not identify
          future reference from the ending alone.
        examples:
          - text: ഞാൻ നാളെ വരും.
            translation: I will come tomorrow.
          - text: അവൾ അടുത്ത ആഴ്ച പോകും.
            translation: She will go next week.
      varieties:
        malayalam-kerala:
          assessment: Malayalam future reference uses forms including -ും and future context.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    wants_preferences:
      core:
        assessment: Malayalam expresses liking with ഇഷ്ടം and wanting with constructions such as വേണം.
        explanation: >-
          ### Form and meaning


          എനിക്ക് identifies the experiencer in common liking and wanting patterns. ഇഷ്ടമാണ് says
          that something is liked, while വേണം can express wanting or needing.


          ### In use


          The difference between desire and necessity comes partly from context. A statement of
          liking does not by itself establish a plan to act.
        examples:
          - text: എനിക്ക് ചായ ഇഷ്ടമാണ്.
            translation: I like tea.
          - text: എനിക്ക് വെള്ളം വേണം.
            translation: I want some water.
      varieties:
        malayalam-kerala:
          assessment: Malayalam expresses liking with ഇഷ്ടം and wanting with constructions such as വേണം.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    ability_permission_necessity:
      core:
        assessment: Malayalam uses കഴിയുക, പറ്റുക and other constructions for ability or necessity.
        explanation: >-
          ### Form and meaning


          A verbal action with കഴിയും can express ability or possibility. Necessity is often
          expressed with an action form ending in -ണം.


          ### In use


          The dative experiencer can identify who is able or who needs to act. Permission questions
          can resemble ability questions, so interpret the intended social action.
        examples:
          - text: എനിക്ക് നീന്താൻ കഴിയും.
            translation: I can swim.
          - text: എനിക്ക് പോകണം.
            translation: I need to go.
      varieties:
        malayalam-kerala:
          assessment: Malayalam uses കഴിയുക, പറ്റുക and other constructions for ability or necessity.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    affirm_negate:
      core:
        assessment: Malayalam uses different negative forms for actions, identity and existence.
        explanation: >-
          ### Form and meaning


          ഇല്ല expresses absence and appears in several negative patterns. അല്ല rejects many noun
          identities; verb negatives have their own constructions.


          ### In use


          Do not use a single negative word in the same position for every sentence. The predicate
          type determines the form and its connection to the verb.
        examples:
          - text: എനിക്ക് അറിയില്ല.
            translation: I do not know.
          - text: ഇത് എന്റെ പുസ്തകം അല്ല.
            translation: This is not my book.
      varieties:
        malayalam-kerala:
          assessment: Malayalam uses different negative forms for actions, identity and existence.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    questions_answers:
      core:
        assessment: Malayalam questions use question words and interrogative endings.
        explanation: >-
          ### Form and meaning


          എവിടെ asks where and ആര് asks who. Yes/no questions can use a question ending attached to
          the predicate.


          ### In use


          Question words do not require English-style auxiliary inversion. The requested information
          can appear inside the ordinary clause pattern.
        examples:
          - text: സ്റ്റേഷൻ എവിടെയാണ്?
            translation: Where is the station?
          - text: നിങ്ങൾ നാളെ വരുമോ?
            translation: Will you come tomorrow?
      varieties:
        malayalam-kerala:
          assessment: Malayalam questions use question words and interrogative endings.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    requests:
      core:
        assessment: Malayalam requests use imperative or request forms and politeness expressions.
        explanation: >-
          ### Form and meaning


          An action can be requested with a verb form such as പറയൂ. ദയവായി explicitly marks please
          in careful or polite wording.


          ### In use


          Social relationship and address matter alongside the verb. A modal question can make a
          request less direct, particularly when asking someone for help.
        examples:
          - text: ദയവായി ഇരിക്കൂ.
            translation: Please sit down.
          - text: ഒന്നുകൂടി പറയൂ.
            translation: Please say it once more.
      varieties:
        malayalam-kerala:
          assessment: Malayalam requests use imperative or request forms and politeness expressions.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    reasons_conditions:
      core:
        assessment: Malayalam condition and reason constructions can be built into clauses.
        explanation: >-
          ### Form and meaning


          A conditional form such as വന്നാൽ means if someone comes. A reason can be expressed with a
          causal clause such as ആയതിനാൽ.


          ### In use


          The connector may be attached to a verbal or copular form rather than stand as a separate
          English-style conjunction. Read the complete clause to identify the relationship.
        examples:
          - text: മഴയായതിനാൽ ഞാൻ വീട്ടിൽ ഇരിക്കുന്നു.
            translation: I am staying at home because it is raining.
          - text: മഴ വന്നാൽ ഞാൻ വീട്ടിൽ ഇരിക്കും.
            translation: If it rains, I will stay at home.
      varieties:
        malayalam-kerala:
          assessment: Malayalam condition and reason constructions can be built into clauses.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
