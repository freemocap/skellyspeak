language: irish
skill_id: managing_conversation
guidance: Recognize opening or closing, acknowledgement, clarification, rephrasing, correction
  of misunderstanding and turn or topic management. Slán go fóill closes contact. Tuigim anois
  acknowledges understanding without necessarily agreement. Abair é sin arís, le do thoil
  requests repetition of a prior contribution. Is é sin le rá introduces reformulation. Dé
  Sathairn atá i gceist agam, ní Dé hAoine corrects an interpreted day. Maidir leis an gcéad
  cheist eile frames a topic transition. A quoted greeting in a vocabulary list is absent as
  conversational work. A short tuigim can acknowledge a clear explanation contextually. Do not
  require long sentences, invent missing antecedents or treat every new information question as
  repair. Judge whether the utterance manages this exchange and preserve natural mutation and
  prepositional constructions rather than translating an English discourse marker mechanically.
