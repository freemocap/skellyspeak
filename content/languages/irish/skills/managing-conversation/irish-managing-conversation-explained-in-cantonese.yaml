sections:
  - subskill_id: opening_closing
    explanation: 探訪或通話結束時，`Slán go fóill!` 係道別，意思係暫時再見。`Slán` 係道別詞，`go fóill` 加上「暫時」；預留日後再見可能，唔係講進行中嘅動作。
    examples:
      - text: Slán go fóill!
        meaning: 下次見！ 結束今次交談時用。
        note: 試喺預計會再通話時結束對話。答案：`Slán go fóill!` 呢句放喺對話尾，清楚表達暫別；到訪開頭則唔合適。
  - subskill_id: acknowledging
    explanation: 聽完解釋而明白咗時，`Tuigim anois, go raibh maith agat` 以 `Tuigim` 講我明白，`anois` 係而家，`go raibh maith
      agat` 係對一個人講多謝。回應畀對方知解釋有幫助，唔一定表示同意每個意見。
    examples:
      - text: Tuigim anois, go raibh maith agat.
        meaning: 我而家明喇，唔該。 明白一個意見，唔等於同意。
        note: 試只確認而家明白，唔加多謝。答案：`Tuigim anois.` 保留理解狀態嘅轉變；禮貌多謝句可以省略。
  - subskill_id: clarification
    explanation: 對方上一句太快時，`Abair é sin arís, le do thoil` 請一位聽者再講。`Abair` 係命令式「講」，`é sin` 指嗰句內容，`arís`
      係再一次，`le do thoil` 係唔該。呢句要求重複原話，唔係問外面嘅事實。
    examples:
      - text: Abair é sin arís, le do thoil.
        meaning: 唔該再講一次。 `É sin` 指要重複嘅內容；要求係對一位聽者講。
        note: 試唔加禮貌片語，仍請對方重講。答案：`Abair é sin arís.` 動作、重講內容同 `arís` 保留。
  - subskill_id: rephrasing
    explanation: 對方講清楚活動要預先訂位後，`Is é sin le rá, caithfimid áit a chur in áirithe roimh ré` 用 `Is é sin le rá`
      引出換句話講。`caithfimid` 已包括我哋並講必要；`áit` 放喺 `a chur in áirithe` 前，`roimh ré` 係預先。後句要保留原本預約要求。
    examples:
      - text: Is é sin le rá, caithfimid áit a chur in áirithe roimh ré.
        meaning: 即係話，我哋要預先訂位。 解釋完訂位程序後可以咁講。
        note: 今日係活動前一日，活動聽日舉行，主辦方已講明最遲要今日訂位。試重述呢個截止時間。答案：`Is é sin le rá, caithfimid áit a chur in áirithe inniu.`
          重述標記同訂位必要性保留；「今日」係主辦方講明嘅期限。
  - subskill_id: correcting_misunderstanding
    explanation: 聽者以為約星期五，`Dé Sathairn atá i gceist agam, ní Dé hAoine` 將真正嘅星期六放前面突出。`atá i gceist agam`
      係我指嘅係，`ní Dé hAoine` 排除聽錯嘅星期五；兩個日子都講明先能修正誤會。
    examples:
      - text: Dé Sathairn atá i gceist agam, ní Dé hAoine.
        meaning: 我係指星期六，唔係星期五。 講者更正對方理解錯咗嘅日子。
        note: 試更正成原本係星期五，唔係星期六。答案：`Dé hAoine atá i gceist agam, ní Dé Sathairn.` 兩個日子互換，星期五成焦點，星期六被否定。
  - subskill_id: turns_topics
    explanation: 討論多條問題時，`Maidir leis an gcéad cheist eile, cad a cheapann tú?` 轉去下一題，再邀對方發表意見。`Maidir le`
      係關於，`leis an gcéad cheist eile` 指下一條問題；`Cad a cheapann tú?` 係你點睇，`a` 後接動詞 `cheapann`。
    examples:
      - text: Maidir leis an gcéad cheist eile, cad a cheapann tú?
        meaning: 至於下一條問題，你點睇？ 講者轉移話題，同時邀請對方接話。
        note: 試轉去呢項建議再問意見。答案：`Maidir leis an moladh seo, cad a cheapann tú?` 開頭換新話題，後半句仍請聽者講睇法。
