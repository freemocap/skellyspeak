sections:
  - subskill_id: identification
    explanation: 介紹女性鄰居時，`Is í seo mo chomharsa` 用 `is` 做身份識別；`í seo` 指眼前呢位女性，`mo chomharsa` 係我嘅鄰居。`mo` 令
      `comharsa` 開頭變 `chomharsa`。呢句講佢係邊個，唔係佢喺邊度。
    examples:
      - text: Is í seo mo chomharsa.
        meaning: 呢位係我鄰居。 `Í` 指女性鄰居；`mo` 令 `chomharsa` 出現詞首弱化。
        note: 試介紹男性鄰居。答案：`Is é seo mo chomharsa.` 指人代詞由 `í` 改 `é`；`mo chomharsa` 嘅所有關係同寫法保留。
  - subskill_id: qualities_states
    explanation: 向人描述街道時，`Tá an tsráid seo cúng` 用 `tá` 講狀態；`an tsráid seo` 係呢條街，`cúng` 係窄。`sráid` 喺呢個冠詞結構寫成
      `tsráid`；`seo` 放名詞後。呢度講性質，唔係用身份句。
    examples:
      - text: Tá an tsráid seo cúng.
        meaning: 呢條街好窄。 `Cúng` 係所描述嘅性質；`an tsráid` 展示冠詞引起嘅詞首變化。
        note: 試講嗰條街窄。答案：`Tá an tsráid sin cúng.` `seo` 改 `sin` 換指向，`tá` 同 `cúng` 保留描述結構。
  - subskill_id: location_movement
    explanation: 有人搵鎖匙時，`Tá an eochair ar an mbord` 將要搵嘅 `an eochair` 放喺 `tá` 後，再用 `ar an mbord`
      講枱面位置。呢個教學形式喺介詞加冠詞後，`bord` 寫成 `mbord`。句子講現時位置，唔係搬去枱。
    examples:
      - text: Tá an eochair ar an mbord.
        meaning: 鎖匙喺張枱上面。 標準語呢個介詞加冠詞結構入面，`ar an mbord` 用咗詞首遮蔽音變。
        note: 試講鎖匙唔喺枱面。答案：`Níl an eochair ar an mbord.` `Tá` 換否定 `Níl`；位置片語同 `mbord` 保留。
  - subskill_id: possession_relations
    explanation: 點算可用凳時，`Tá dhá chathaoir agam` 以 `tá` 講有凳，`agam` 指物主係我。`dhá` 係兩張，後面用單數名詞形式 `cathaoir` 並變首音寫成
      `chathaoir`；英文複數唔代表呢度要用愛爾蘭語複數。
    examples:
      - text: Tá dhá chathaoir agam.
        meaning: 我有兩張凳。 `Dhá chathaoir` 交代數量，同時展示相應嘅詞首弱化。
        note: 試講聽者有兩張凳。答案：`Tá dhá chathaoir agat.` 數量同 `chathaoir` 不變；`agam` 換 `agat` 先改物主。
  - subskill_id: quantity_comparison
    explanation: 揀搬邊個箱時，`Tá an bosca seo níos éadroime ná an bosca sin` 比較重量。`níos éadroime` 係較輕，`ná`
      引出比較基準；`seo` 指呢個箱，`sin` 指嗰個。被描述嘅箱放前面。
    examples:
      - text: Tá an bosca seo níos éadroime ná an bosca sin.
        meaning: 呢個箱比嗰個箱輕。 `Éadroime` 係 `éadrom` 嘅比較級；`ná` 引出比較基準。
        note: 試倒轉比較，講嗰個箱較輕。答案：`Tá an bosca sin níos éadroime ná an bosca seo.` 兩個指示詞位置對調，`ná` 仍引出基準。
