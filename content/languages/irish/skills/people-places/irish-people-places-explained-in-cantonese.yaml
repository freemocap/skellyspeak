sections:
  - subskill_id: identification
    explanation: 繫詞配合合適嘅代詞同名詞短語，可以識別一個人。
    examples:
      - text: Is í seo mo chomharsa.
        meaning: 呢位係我鄰居。
        note: Í 指女性鄰居；mo 令 chomharsa 出現詞首弱化。
  - subskill_id: qualities_states
    explanation: Tá 可以將形容詞作為主語嘅述語。
    examples:
      - text: Tá an tsráid seo cúng.
        meaning: 呢條街好窄。
        note: Cúng 係所描述嘅性質；an tsráid 展示冠詞引起嘅詞首變化。
  - subskill_id: location_movement
    explanation: Tá 配合介詞短語，可以交代物件位置。
    examples:
      - text: Tá an eochair ar an mbord.
        meaning: 鎖匙喺張枱上面。
        note: 標準語呢個介詞加冠詞結構入面，ar an mbord 用咗詞首遮蔽音變。
  - subskill_id: possession_relations
    explanation: Tá 配合 ag 表示擁有；agam 係 ag 同第一人稱代詞嘅結合。
    examples:
      - text: Tá dhá chathaoir agam.
        meaning: 我有兩張凳。
        note: Dhá chathaoir 交代數量，同時展示相應嘅詞首弱化。
  - subskill_id: quantity_comparison
    explanation: Níos 配合比較級，再用 ná 引出比較對象。
    examples:
      - text: Tá an bosca seo níos éadroime ná an bosca sin.
        meaning: 呢個箱比嗰個箱輕。
        note: Éadroime 係 éadrom 嘅比較級；ná 引出比較基準。
