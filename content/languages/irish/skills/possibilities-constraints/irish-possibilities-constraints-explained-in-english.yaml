sections:
  - subskill_id: ability
    explanation: In ann with a verbal noun can express ability.
    examples:
      - text: Tá mé in ann snámh.
        meaning: I can swim.
        note: The construction reports capability rather than permission.
  - subskill_id: permission
    explanation: Cead with ag explicitly concerns permission.
    examples:
      - text: An bhfuil cead agam an mála a fhágáil anseo?
        meaning: May I leave the bag here?
        note: Agam identifies who seeks permission; an mála precedes a fhágáil.
  - subskill_id: obligation
    explanation: Caithfidh can express necessity and take a verbal-noun construction.
    examples:
      - text: Caithfidh mé an eochair a thabhairt ar ais inniu.
        meaning: I must return the key today.
        note: The object precedes a thabhairt; inniu gives the deadline.
  - subskill_id: possibility
    explanation: B’fhéidir with a following clause presents an uncertain possibility.
    examples:
      - text: B’fhéidir go mbeidh sé ag cur báistí tráthnóna.
        meaning: It may rain in the evening.
        note: Go mbeidh introduces the possible future weather situation.
  - subskill_id: certainty
    explanation: Nílim cinnte explicitly limits confidence in a proposition.
    examples:
      - text: Nílim cinnte go bhfuil an siopa oscailte.
        meaning: I am not sure the shop is open.
        note: The speaker is uncertain and does not assert that it is closed.
