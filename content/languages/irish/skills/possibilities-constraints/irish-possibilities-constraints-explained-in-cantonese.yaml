sections:
  - subskill_id: ability
    explanation: 講自己識唔識游水時，`Tá mé in ann snámh` 用 `Tá mé` 指我，`in ann` 講能力，`snámh` 係游水活動。呢句講做得到，唔係別人准唔准你游。
    examples:
      - text: Tá mé in ann snámh.
        meaning: 我識游水。 呢個結構講能力，唔係准許。
        note: 試講聽者識游水。答案：`Tá tú in ann snámh.` `mé` 換 `tú`，有能力嘅人變咗；`in ann snámh` 保留。
  - subskill_id: permission
    explanation: 喺接待處想放低個袋時，`An bhfuil cead agam an mála a fhágáil anseo?` 以 `An bhfuil` 問，`cead agam`
      係我有冇許可。`an mála` 放喺 `a fhágáil` 前，`a` 令 `fágáil` 開頭寫成 `fhágáil`；`anseo` 係呢度。
    examples:
      - text: An bhfuil cead agam an mála a fhágáil anseo?
        meaning: 我可唔可以放個袋喺度？ `Agam` 指申請許可嘅人；`an mála` 放喺 `a fhágáil` 前面。
        note: 試問可唔可以放個袋喺嗰度。答案：`An bhfuil cead agam an mála a fhágáil ansin?` 許可同賓語先於動作嘅結構保留；地點改 `ansin`。
  - subskill_id: obligation
    explanation: 借咗鎖匙要今日還時，`Caithfidh mé an eochair a thabhairt ar ais inniu` 用 `Caithfidh mé` 講我必須；`an
      eochair` 放喺 `a thabhairt ar ais` 前，`inniu` 係今日限期。`caithfidh` 雖然有將來形式，呢度係必要，唔只係預測。
    examples:
      - text: Caithfidh mé an eochair a thabhairt ar ais inniu.
        meaning: 我今日一定要還鎖匙。 賓語放喺 `a thabhairt` 前面；`inniu` 交代限期係今日。
        note: 試改成聽日必須還。答案：`Caithfidh mé an eochair a thabhairt ar ais amárach.` 只改限期；必要性同動作次序保留。
  - subskill_id: possibility
    explanation: 安排戶外活動時，`B’fhéidir go mbeidh sé ag cur báistí tráthnóna` 用 `B’fhéidir` 標可能，`go mbeidh` 引出
      `bí` 嘅從屬將來形式；`sé ag cur báistí` 係落雨講法，`tráthnóna` 指下午或傍晚。句子冇保證一定落雨。
    examples:
      - text: B’fhéidir go mbeidh sé ag cur báistí tráthnóna.
        meaning: 夜晚可能會落雨。 `Go mbeidh` 引出可能出現嘅將來天氣情況。
        note: 試講聽日可能落雨。答案：`B’fhéidir go mbeidh sé ag cur báistí amárach.` 時間改 `amárach`；`B’fhéidir go mbeidh`
          保留不確定同將來形式。
  - subskill_id: certainty
    explanation: 出發前未肯定間舖開門，`Nílim cinnte go bhfuil an siopa oscailte` 先用 `Nílim cinnte` 講我冇把握，再用 `go bhfuil`
      引出「間舖開住」呢個待核實說法。唔肯定佢開，唔等於斷言佢閂。
    examples:
      - text: Nílim cinnte go bhfuil an siopa oscailte.
        meaning: 我唔肯定間舖頭開咗未。 講者表示唔肯定，唔係斷言間舖頭閂咗。
        note: 試講而家肯定間舖開住。答案：`Tá mé cinnte go bhfuil an siopa oscailte.` 間舖狀態冇變，改嘅係講者把握程度。
