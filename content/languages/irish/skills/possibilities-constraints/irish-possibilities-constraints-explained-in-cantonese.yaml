sections:
  - subskill_id: ability
    explanation: In ann 配合動名詞，可以表示能力。
    examples:
      - text: Tá mé in ann snámh.
        meaning: 我識游水。
        note: 呢個結構講能力，唔係准許。
  - subskill_id: permission
    explanation: Cead 配合 ag 明確表示許可。
    examples:
      - text: An bhfuil cead agam an mála a fhágáil anseo?
        meaning: 我可唔可以放個袋喺度？
        note: Agam 指申請許可嘅人；an mála 放喺 a fhágáil 前面。
  - subskill_id: obligation
    explanation: Caithfidh 可以表示必要，後面接動名詞結構。
    examples:
      - text: Caithfidh mé an eochair a thabhairt ar ais inniu.
        meaning: 我今日一定要還鎖匙。
        note: 賓語放喺 a thabhairt 前面；inniu 交代限期係今日。
  - subskill_id: possibility
    explanation: B’fhéidir 配合後面嘅分句，表達未能肯定嘅可能性。
    examples:
      - text: B’fhéidir go mbeidh sé ag cur báistí tráthnóna.
        meaning: 夜晚可能會落雨。
        note: Go mbeidh 引出可能出現嘅將來天氣情況。
  - subskill_id: certainty
    explanation: Nílim cinnte 明確表示對命題冇十足把握。
    examples:
      - text: Nílim cinnte go bhfuil an siopa oscailte.
        meaning: 我唔肯定間舖頭開咗未。
        note: 講者表示唔肯定，唔係斷言間舖頭閂咗。
