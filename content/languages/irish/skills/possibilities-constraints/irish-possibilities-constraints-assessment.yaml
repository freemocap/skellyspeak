skill_id: possibilities_constraints
guidance: Recognize ability, permission, necessity, possibility and certainty. Tá mé in ann
  snámh expresses capability. An bhfuil cead agam an mála a fhágáil anseo? explicitly asks
  permission, whereas is féidir constructions can concern ability or practical possibility.
  Caithfidh mé an eochair a thabhairt ar ais states obligation; ní gá dom removes necessity
  rather than forbidding action. B’fhéidir go mbeidh sé ag cur báistí presents a possible
  outcome. Nílim cinnte limits confidence. Tá in reply to a clear cead question can grant
  permission contextually. A copied modal phrase with no recoverable action is absent. A polite
  an féidir request does not automatically assert physical ability. Multiple plausible
  successful modal readings within this group are not alone grounds for unclear. Preserve the
  relevant prepositional pronouns, verbal-noun order and dependent verb forms without demanding
  an English modal-plus-bare-verb structure.
