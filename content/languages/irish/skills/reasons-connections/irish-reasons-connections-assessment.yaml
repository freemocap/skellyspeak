skill_id: reasons_connections
guidance: Assess causes, consequences, conditions, contrast and support for claims. Mar can
  introduce a reason and mar sin a consequence. Má bhíonn sé ag cur báistí amárach, fanfaimid sa
  bhaile establishes a condition and dependent plan. Do not impose an English word-by-word tense
  template on this construction. Ach contrasts properties, while ansin alone can merely sequence
  events. A light in a window can support an occupancy inference without causing occupancy. Mar
  bhí sé ag cur báistí can answer an identifiable why-question contextually. A copied connector
  without recoverable linked content is absent. Judge whether the evidence actually bears on the
  claim, whether the condition is hypothetical or asserted, and whether the chosen dependent or
  independent forms fit the construction. Unrelated mistakes do not erase a correctly expressed
  causal or conditional relationship.
