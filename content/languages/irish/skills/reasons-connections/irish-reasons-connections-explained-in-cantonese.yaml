sections:
  - subskill_id: causes_reasons
    explanation: 解釋點解留喺屋企時，`D’fhan mé sa bhaile mar bhí sé ag cur báistí` 先講 `D’fhan mé sa bhaile`，再用 `mar`
      引出落雨呢個原因。`bhí sé ag cur báistí` 表示當時落緊雨，唔係另一個冇關係嘅事件。
    examples:
      - text: D’fhan mé sa bhaile mar bhí sé ag cur báistí.
        meaning: 因為落雨，我留咗喺屋企。 落雨被表達成留喺屋企嘅原因。
        note: 試講因為自己病咗而留家。答案：`D’fhan mé sa bhaile mar bhí mé tinn.` 留家事件不變；`mar` 後改用病咗做原因。
  - subskill_id: consequences
    explanation: 講旅程受阻時，`Níor tháinig an bus, mar sin shiúil mé` 先話巴士冇嚟；`mar sin` 將行路標成結果。`tháinig`
      係不規則過去動詞形式，`shiúil mé` 係我行咗路；呢度唔只係先後兩件事。
    examples:
      - text: Níor tháinig an bus, mar sin shiúil mé.
        meaning: 架巴士冇嚟，所以我行路。 行路被表達成等唔到巴士之後嘅應對。
        note: 試講巴士冇嚟，所以改為留喺屋企。答案：`Níor tháinig an bus, mar sin d’fhan mé sa bhaile.` 同一件事引出新結果；`mar sin` 保留因果連接。
  - subskill_id: conditions
    explanation: 安排視乎天氣嘅計劃時，`Má bhíonn sé ag cur báistí amárach, fanfaimid sa bhaile` 用 `Má`
      引入未確定嘅條件，後面係落雨時大家會留家。`bhíonn` 係 `bí` 喺呢個條件結構嘅形式；`fanfaimid` 已包括我哋。呢句冇斷言聽日一定落雨。
    examples:
      - text: Má bhíonn sé ag cur báistí amárach, fanfaimid sa bhaile.
        meaning: 如果聽日落雨，我哋就留喺屋企。 `Bíonn` 喺 `má` 後面變成弱化形式 `bhíonn`；`fanfaimid` 交代結果。
        note: 試保留落雨條件，但改成自己留家。答案：`Má bhíonn sé ag cur báistí amárach, fanfaidh mé sa bhaile.` 條件不變；`fanfaidh mé`
          將計劃主體改為我。
  - subskill_id: contrast
    explanation: 比較行路路線時，`Tá an bealach gearr ach géar` 用 `gearr` 講短，`géar` 喺路線語境係陡峭；`ach` 指出短路都可以難行。兩種性質都描述同一條路。
    examples:
      - text: Tá an bealach gearr ach géar.
        meaning: 條路短，但好斜。 揀路線時，呢兩個特點可能有唔同影響。
        note: 試中性噉列出兩個性質。答案：`Tá an bealach gearr agus géar.` `agus` 係加上一個性質，唔再用 `ach` 突出對比。
  - subskill_id: supporting_claims
    explanation: 見到屋內有燈，`Ceapaim go bhfuil duine sa teach mar tá solas ar siúl` 用 `Ceapaim` 標示推測，`go bhfuil
      duine sa teach` 係有人喺屋內嘅判斷，`mar tá solas ar siúl` 係見到嘅根據。燈光支持推論，唔會證明係邊個，更唔係令嗰人存在嘅成因。
    examples:
      - text: Ceapaim go bhfuil duine sa teach mar tá solas ar siúl.
        meaning: 我諗屋入面有人，因為有盞燈開咗。 開燈係支持推論嘅線索，唔係造成有人喺屋內嘅原因。
        note: 試用門開住支持同一推測。答案：`Ceapaim go bhfuil duine sa teach mar tá an doras oscailte.` 證據由燈光換成開門；`Ceapaim`
          仍保留推測性。
