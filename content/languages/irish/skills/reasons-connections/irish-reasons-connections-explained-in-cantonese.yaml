sections:
  - subskill_id: causes_reasons
    explanation: Mar 可以引出原因。
    examples:
      - text: D’fhan mé sa bhaile mar bhí sé ag cur báistí.
        meaning: 因為落雨，我留咗喺屋企。
        note: 落雨被表達成留喺屋企嘅原因。
  - subskill_id: consequences
    explanation: Mar sin 可以引出結果。
    examples:
      - text: Níor tháinig an bus, mar sin shiúil mé.
        meaning: 架巴士冇嚟，所以我行路。
        note: 行路被表達成等唔到巴士之後嘅應對。
  - subskill_id: conditions
    explanation: Má 引出尚未確定嘅條件，後面交代條件成立時嘅結果。
    examples:
      - text: Má bhíonn sé ag cur báistí amárach, fanfaimid sa bhaile.
        meaning: 如果聽日落雨，我哋就留喺屋企。
        note: Bíonn 喺 má 後面變成弱化形式 bhíonn；fanfaimid 交代結果。
  - subskill_id: contrast
    explanation: Ach 將討論中有對比嘅描述連起來。
    examples:
      - text: Tá an bealach gearr ach géar.
        meaning: 條路短，但好斜。
        note: 揀路線時，呢兩個特點可能有唔同影響。
  - subskill_id: supporting_claims
    explanation: 原因分句可以為推論提供證據。
    examples:
      - text: Ceapaim go bhfuil duine sa teach mar tá solas ar siúl.
        meaning: 我諗屋入面有人，因為有盞燈開咗。
        note: 開燈係支持推論嘅線索，唔係造成有人喺屋內嘅原因。
