skill_id: coordinating_action
guidance: Assess requests, offers or invitations, suggestions, commitments, acceptance or
  refusal, and negotiation. Bog an bosca seo go dtí an doras, le do thoil requests action. Ar
  mhaith leat cupán tae? offers tea through a preference-shaped question. Glacaimis sos proposes
  a shared break. Tabharfaidh mé na huirlisí liom amárach can undertake an assigned task, but
  future marking alone is not a promise. Ní féidir liom teacht inniu declines an invitation in
  context, and a Saturday alternative can negotiate the schedule. Ba mhaith can accept a prior
  ar mhaith question contextually. A copied le do thoil without a recoverable action is absent.
  Judge the actual coordinated action and participants, allowing singular or plural address
  appropriate to the setting. Do not confuse an offer with a neutral preference survey or
  require the English word let in a shared suggestion.
