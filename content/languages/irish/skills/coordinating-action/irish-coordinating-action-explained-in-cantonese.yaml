sections:
  - subskill_id: requests
    explanation: 單數命令式加 le do thoil，可以請對方做一件事。
    examples:
      - text: Bog an bosca seo go dtí an doras, le do thoil.
        meaning: 唔該搬呢個箱去門口。
        note: Go dtí an doras 交代目的地；呢個要求係對一個人講。
  - subskill_id: offers_invitations
    explanation: Ar mhaith leat 問對方想唔想要，可以用嚟招待人。
    examples:
      - text: Ar mhaith leat cupán tae?
        meaning: 你想唔想飲杯茶？
        note: 呢度係請對方飲茶，唔係純粹調查佢嘅口味。
  - subskill_id: suggestions
    explanation: 第一人稱複數命令式可以提議一齊行動。
    examples:
      - text: Glacaimis sos gairid.
        meaning: 不如我哋抖一陣。
        note: Glacaimis 嘅提議包括講者自己。
  - subskill_id: commitments
    explanation: 共同安排事情時，將來嘅陳述可以表示願意承擔責任。
    examples:
      - text: Tabharfaidh mé na huirlisí liom amárach.
        meaning: 聽日我會帶埋啲工具嚟。
        note: 分工時可以咁講；liom 將帶工具呢件事連到講者自己。
  - subskill_id: accepting_declining
    explanation: 講自己做唔到，可以婉拒邀請。
    examples:
      - text: Tá brón orm, ní féidir liom teacht inniu.
        meaning: 唔好意思，我今日嚟唔到。
        note: 之前嘅邀請已經交代拒絕出席嘅係邊個活動。
  - subskill_id: negotiating_plans
    explanation: 先講限制，再提出具體替代方案。
    examples:
      - text: Nílim saor Dé hAoine. An mbuailfimid le chéile Dé Sathairn?
        meaning: 我星期五唔得閒。不如星期六見？
        note: 問句提議改另一日見面。
