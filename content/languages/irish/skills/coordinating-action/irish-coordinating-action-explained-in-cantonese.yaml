sections:
  - subskill_id: requests
    explanation: 有人幫你搬嘢時，`Bog an bosca seo go dtí an doras, le do thoil` 明確請一個人搬箱。`Bog` 係單數命令式，放句首；`an bosca
      seo` 係呢個箱，`go dtí an doras` 係門口目的地，`le do thoil` 係唔該。
    examples:
      - text: Bog an bosca seo go dtí an doras, le do thoil.
        meaning: 唔該搬呢個箱去門口。 `Go dtí an doras` 交代目的地；呢個要求係對一個人講。
        note: 試請佢搬嗰個箱去門口。答案：`Bog an bosca sin go dtí an doras, le do thoil.` `seo` 換 `sin` 改指向；動作、目的地同禮貌片語不變。
  - subskill_id: offers_invitations
    explanation: 招待訪客飲嘢時，`Ar mhaith leat cupán tae?` 用 `Ar mhaith leat` 問對方想唔想要，`cupán tae` 係一杯茶。`leat`
      指聽者；若講自己想要會用 `liom`，例如 `Ba mhaith liom cupán tae`。呢句係提供選擇。
    examples:
      - text: Ar mhaith leat cupán tae?
        meaning: 你想唔想飲杯茶？ 呢度係請對方飲茶，唔係純粹調查佢嘅口味。
        note: 試請訪客飲杯咖啡。答案：`Ar mhaith leat cupán caife?` `cupán` 後換飲品；`Ar mhaith leat` 仍向一位訪客提出。
  - subskill_id: suggestions
    explanation: 大家做咗一陣，`Glacaimis sos gairid` 提議一齊休息。`Glacaimis` 嘅形式已包括我哋，`sos` 係休息，形容詞 `gairid` 放名詞後表示短。相比
      `Glac sos gairid`，呢句包括講者自己。
    examples:
      - text: Glacaimis sos gairid.
        meaning: 不如我哋抖一陣。 `Glacaimis` 嘅提議包括講者自己。
        note: 試提議長啲嘅共同休息。答案：`Glacaimis sos fada.` `Glacaimis` 保留一齊做，名詞後形容詞由 `gairid` 改 `fada`。
  - subskill_id: commitments
    explanation: 分配聽日工作時，講者承擔帶工具：`Tabharfaidh mé na huirlisí liom amárach`。`Tabharfaidh` 係 `tabhair`
      嘅將來形式，`mé` 係我，`na huirlisí` 係工具，`liom` 係同我一齊帶，`amárach` 係聽日。分工語境令將來句成為承諾。
    examples:
      - text: Tabharfaidh mé na huirlisí liom amárach.
        meaning: 聽日我會帶埋啲工具嚟。 分工時可以咁講；`liom` 將帶工具呢件事連到講者自己。
        note: 若今日稍後分工，試承擔今日帶工具。答案：`Tabharfaidh mé na huirlisí liom inniu.` `inniu` 換日子；工具仍未帶到，將來行動仍可承諾。
  - subskill_id: accepting_declining
    explanation: 獲邀今日出席但去唔到時，`Tá brón orm, ní féidir liom teacht inniu` 先用 `Tá brón orm` 表歉意，`ní féidir liom`
      講我做唔到，`teacht` 係到場，`inniu` 限定今日。回應邀請時係婉拒，唔等於永遠唔去。
    examples:
      - text: Tá brón orm, ní féidir liom teacht inniu.
        meaning: 唔好意思，我今日嚟唔到。 之前嘅邀請已經交代拒絕出席嘅係邊個活動。
        note: 試婉拒聽日邀請。答案：`Tá brón orm, ní féidir liom teacht amárach.` `amárach` 改日子，歉意同無法到場保留。
  - subskill_id: negotiating_plans
    explanation: 對方提議星期五見，但你唔得，`Nílim saor Dé hAoine. An mbuailfimid le chéile Dé Sathairn?`
      先講星期五冇空，再提星期六一齊見。`An` 帶出問句寫法 `mbuailfimid`，動詞尾已包括我哋；`le chéile` 係一齊。
    examples:
      - text: Nílim saor Dé hAoine. An mbuailfimid le chéile Dé Sathairn?
        meaning: 我星期五唔得閒。不如星期六見？ 問句提議改另一日見面。
        note: 今日係星期三，聽日係星期四。試保留星期五唔得，改提聽日。答案：`Nílim saor Dé hAoine. An mbuailfimid le chéile amárach?`
          見面問句不變，只改候選時間。
