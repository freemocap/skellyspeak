sections:
  - subskill_id: asking_information
    explanation: Cén t-am 問時間，呢度後面接關係動詞結構。
    examples:
      - text: Cén t-am a dhúnann an siopa?
        meaning: 間舖頭幾點閂門？
        note: A dhúnann 將所問嘅時間連到閂門呢件事。
  - subskill_id: answering_information
    explanation: 可以只用時間短語回答，唔使重複成件事。
    examples:
      - text: Ar a cúig a chlog.
        meaning: 五點鐘。
        note: 回應舖頭閂門時間嘅問題；省略咗嘅事件由上句提供。
  - subskill_id: checking_facts
    explanation: An 配合從屬動詞形式，可以核實提出咗嘅事實。
    examples:
      - text: An ndúnann an siopa ar a cúig a chlog?
        meaning: 間舖頭係咪五點閂門？
        note: 講者提出五點，請對方確認。
  - subskill_id: useful_detail
    explanation: 位置描述可以提供有用嘅地標。
    examples:
      - text: Tá an bealach isteach taobh leis an gclós.
        meaning: 入口喺庭院隔籬。
        note: 呢個資料幫緊對方搵入口。
