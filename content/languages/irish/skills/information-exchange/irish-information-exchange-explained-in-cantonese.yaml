sections:
  - subskill_id: asking_information
    explanation: 去舖頭前需要知關門時間時，`Cén t-am a dhúnann an siopa?` 用 `Cén t-am` 問幾點；連接詞 `a` 後用 `dhúnann`，再講 `an
      siopa`。呢句索取未知鐘點，唔係先提出五點畀人核實。
    examples:
      - text: Cén t-am a dhúnann an siopa?
        meaning: 間舖頭幾點閂門？ `A dhúnann` 將所問嘅時間連到閂門呢件事。
        note: 試問關門時間但唔畀候選鐘點。答案：`Cén t-am a dhúnann an siopa?` `Cén t-am` 問空缺；`An ndúnann ...?` 係核實已提出嘅時間。
  - subskill_id: answering_information
    explanation: 上句已問舖頭幾點關時，`Ar a cúig a chlog` 單獨答五點就夠。`Ar` 引入時間，`a cúig` 係五，`a chlog` 完成鐘點講法；關門事件由前文承接。
    examples:
      - text: Ar a cúig a chlog.
        meaning: 五點鐘。 回應舖頭閂門時間嘅問題；省略咗嘅事件由上句提供。
        note: 試用完整句答五點關。答案：`Dúnann an siopa ar a cúig a chlog.` 加上關門動詞同舖頭，時間片語形式不變，句子毋須依賴上一問。
  - subskill_id: checking_facts
    explanation: 你估舖頭五點關，想核實時，`An ndúnann an siopa ar a cúig a chlog?` 先用 `An` 做是非問句，令 `dúnann` 寫成
      `ndúnann`；後面講舖頭同候選鐘點。呢句問已提出嘅事實。
    examples:
      - text: An ndúnann an siopa ar a cúig a chlog?
        meaning: 間舖頭係咪五點閂門？ 講者提出五點，請對方確認。
        note: 試用完整陳述確認五點關。答案：`Dúnann an siopa ar a cúig a chlog.` 陳述句唔用問句詞 `An`，動詞亦返去 `dúnann`。
  - subskill_id: useful_detail
    explanation: 有人搵入口時，`Tá an bealach isteach taobh leis an gclós` 指入口喺庭院旁。`an bealach isteach` 係入口，`taobh
      le` 係旁邊；介詞 `le` 加冠詞成 `leis an`，呢個形式用 `gclós`。地標幫聽者揀啱入口。
    examples:
      - text: Tá an bealach isteach taobh leis an gclós.
        meaning: 入口喺庭院隔籬。 呢個資料幫緊對方搵入口。
        note: 試講入口喺庭院入面。答案：`Tá an bealach isteach sa chlós.` `sa` 連住位置關係，呢個形式用 `chlós`；「旁邊」改成「入面」。
