sections:
  - subskill_id: wants_intentions
    explanation: When discussing something you hope to learn, `Ba mhaith liom fuáil a fhoghlaim`
      expresses I would like to learn to sew. `Ba mhaith liom` introduces the speaker’s wish.
      `Fuáil` means sewing and comes before `a fhoghlaim`, to learn. This object-before-verbal-noun
      order lets the learner say what is to be learned; `a` causes the written change from
      `foghlaim` to `fhoghlaim`.
    examples:
      - text: Ba mhaith liom fuáil a fhoghlaim.
        meaning: I would like to learn to sew.
        note: "The wish frame can introduce an activity directly: `Ba mhaith liom snámh`, I would like to
          swim. Try expressing that wish. Answer: `Ba mhaith liom snámh.` Here swimming itself is
          desired, so there is no additional learning phrase."
  - subskill_id: preferences
    explanation: Choosing between two drinks, `Is fearr liom tae ná caife` says I prefer tea to coffee.
      `Is fearr liom` gives the speaker’s preference, `tae` is the preferred option, and `ná caife`
      supplies the comparison. `Liom` makes this a personal preference; the sentence need not claim
      that tea is objectively better.
    examples:
      - text: Is fearr liom tae ná caife.
        meaning: I prefer tea to coffee.
        note: "The preferred option comes before `ná`, and the other option after it. Try saying you prefer
          coffee to tea. Answer: `Is fearr liom caife ná tae.` Reversing the two nouns reverses the
          preference while preserving the same construction."
  - subskill_id: emotions
    explanation: On receiving good news, `Tá áthas orm faoin nuacht seo` describes the speaker’s
      happiness. `Tá áthas orm` literally places happiness on me; in natural English it means I am
      happy. `Faoin nuacht seo` says about this news. Irish often names an emotion as a noun and
      identifies the experiencer with an inflected preposition such as `orm`.
    examples:
      - text: Tá áthas orm faoin nuacht seo.
        meaning: I am happy about this news.
        note: "For happiness experienced by the listener, `ort` replaces `orm`. Try telling one listener
          they are happy about this news. Answer: `Tá áthas ort faoin nuacht seo.` The emotion and
          its cause stay the same; `ort` changes who feels it."
  - subskill_id: opinions
    explanation: Comparing ways of doing a job, `Ceapaim go bhfuil an modh seo níos éasca` presents the
      speaker’s view that this method is easier. `Ceapaim` means I think; its ending includes I. `Go
      bhfuil` introduces the following statement using the dependent form of `bí`. `An modh seo` is
      this method, and `níos éasca` means easier.
    examples:
      - text: Ceapaim go bhfuil an modh seo níos éasca.
        meaning: I think this method is easier.
        note: "A direct statement would be `Tá an modh seo níos éasca`; after `Ceapaim go`, it becomes `go
          bhfuil`, not `go tá`. Try giving the same opinion about that method. Answer: `Ceapaim go
          bhfuil an modh sin níos éasca.` `Sin` changes which method is evaluated."
  - subskill_id: agreement_disagreement
    explanation: In a discussion of a proposal, `Ní aontaím leis an moladh seo` says I do not agree with
      this suggestion. `Ní` negates `aontaím`, I agree. The verb takes `le`, with; before the
      article it appears as `leis an`. `An moladh seo` identifies this proposal. The disagreement is
      about the proposal rather than a personal attack on its author.
    examples:
      - text: Ní aontaím leis an moladh seo.
        meaning: I disagree with this suggestion.
        note: "The affirmative form is `Aontaím leis an moladh seo`. Try agreeing with that proposal
          instead. Answer: `Aontaím leis an moladh sin.` Removing `Ní` makes it agreement, and `sin`
          identifies that proposal."
