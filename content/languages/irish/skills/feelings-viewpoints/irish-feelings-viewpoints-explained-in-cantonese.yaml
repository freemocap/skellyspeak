sections:
  - subskill_id: wants_intentions
    explanation: Ba mhaith liom 表達願望，後面接描述行動嘅結構。
    examples:
      - text: Ba mhaith liom fuáil a fhoghlaim.
        meaning: 我想學縫紉。
        note: Liom 指想學嘅人；a fhoghlaim 放喺賓語 fuáil 後面。
  - subskill_id: preferences
    explanation: Is fearr liom 配合 ná，可以比較兩個選項嘅喜好。
    examples:
      - text: Is fearr liom tae ná caife.
        meaning: 比起咖啡，我鍾意茶多啲。
        note: 呢個結構表達講者嘅喜好，唔係客觀排名。
  - subskill_id: emotions
    explanation: 情緒名詞配合 ar，可以描述一個人嘅感受。
    examples:
      - text: Tá áthas orm faoin nuacht seo.
        meaning: 聽到呢個消息，我好開心。
        note: Orm 指有呢種感受嘅人；faoin nuacht seo 交代係因為呢個消息。
  - subskill_id: opinions
    explanation: Ceapaim 引出信念或判斷，具體內容放喺後面分句。
    examples:
      - text: Ceapaim go bhfuil an modh seo níos éasca.
        meaning: 我覺得呢個方法容易啲。
        note: Go bhfuil 將評價連到講者嘅意見。
  - subskill_id: agreement_disagreement
    explanation: Aontaigh le 表示同意；現在式陳述加 ní，就變成否定。
    examples:
      - text: Ní aontaím leis an moladh seo.
        meaning: 我唔同意呢個建議。
        note: Leis an moladh seo 指出唔接受嘅係邊個建議。
