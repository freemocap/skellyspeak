skill_id: time_events
explanation_language: cantonese
shared_explanation: skills/time-events/time-events-explained-in-cantonese.yaml
sections:
  - subskill_id: present_events
    explanation: Tá 配合 ag 同動名詞，可以描述進行中嘅活動。
    examples:
      - text: Tá mé ag deisiú rothair anois.
        meaning: 我而家整緊單車。
        note: Rothair 係呢度配合動名詞用嘅屬格形式；anois 指明而家。
  - subskill_id: past_events
    explanation: 動詞過去式用嚟報告較早發生嘅事件。
    examples:
      - text: Dheisigh mé an rothar inné.
        meaning: 我尋日整好咗架單車。
        note: Dheisigh 係過去式；inné 交代係尋日。
  - subskill_id: future_events
    explanation: 動詞將來式可以表達之後嘅行動。
    examples:
      - text: Gheobhaidh mé na páirteanna amárach.
        meaning: 我聽日會攞到啲零件。
        note: Gheobhaidh 係 faigh 嘅將來式；amárach 指明聽日。
  - subskill_id: duration_frequency
    explanation: Bím 可以描述習慣情況，時間短語另行交代頻率。
    examples:
      - text: Bím ag snámh dhá uair sa tseachtain.
        meaning: 我一個星期游兩次水。
        note: 呢度 dhá uair 數次數；dhá uair an chloig 先係量度兩個鐘。
  - subskill_id: event_sequence
    explanation: Ar dtús 同 ansin 明確排列步驟。
    examples:
      - text: Nigh do lámha ar dtús, ansin ullmhaigh na glasraí.
        meaning: 先洗手，然後準備啲蔬菜。
        note: 呢啲單數指令交代先後，唔係因果。
  - subskill_id: event_phase
    explanation: Críochnaithe 配合 ag 同動名詞，可以表示一項活動已經完成。
    examples:
      - text: Tá mé críochnaithe ag léamh.
        meaning: 我已經睇完。
        note: 之前嘅語境交代睇緊乜嘢；呢句標示閱讀已經完成。
