skill_id: time_events
explanation_language: english
shared_explanation: skills/time-events/time-events-explained-in-english.yaml
sections:
  - subskill_id: present_events
    explanation: When someone asks what you are doing now, `Tá mé ag deisiú rothair anois` describes a
      repair in progress. `Tá mé` identifies the speaker, `ag deisiú` is repairing, and `rothair` is
      the genitive of `rothar`, a bicycle, as object of the verbal noun. `Anois` sets the time as
      now. This construction presents an ongoing activity rather than a finished repair.
    examples:
      - text: Tá mé ag deisiú rothair anois.
        meaning: I am repairing a bicycle now.
        note: "The past sentence `Dheisigh mé an rothar inné` reports yesterday’s repair instead. Try saying
          you are repairing a bicycle now without the explicit time word. Answer: `Tá mé ag deisiú
          rothair.` The ongoing construction still describes the activity; the conversation supplies
          its current time."
  - subskill_id: past_events
    explanation: Reporting yesterday’s work, `Dheisigh mé an rothar inné` says I repaired the bicycle
      yesterday. `Dheisigh` is the past of `deisigh`; its initial consonant is lenited. The verb
      comes before `mé`, and the direct object `an rothar` follows. `Inné` locates the completed
      repair in yesterday’s account.
    examples:
      - text: Dheisigh mé an rothar inné.
        meaning: I repaired the bicycle yesterday.
        note: "Compare the ongoing `Tá mé ag deisiú rothair` with this finite past verb: their object forms
          differ because the constructions differ. Try reporting that you repaired the bicycle
          today. Answer: `Dheisigh mé an rothar inniu.` `Inniu` changes the day, while the past verb
          still reports a repair already performed."
  - subskill_id: future_events
    explanation: Discussing the next stage of a repair, `Gheobhaidh mé na páirteanna amárach` says I
      will get the parts tomorrow. `Gheobhaidh` is the irregular future of `faigh`, get. `Mé`
      follows the verb, then `na páirteanna`, the parts, and finally `amárach`. The future form and
      time phrase work together to place the event ahead.
    examples:
      - text: Gheobhaidh mé na páirteanna amárach.
        meaning: I will get the parts tomorrow.
        note: "The future of `faigh` cannot be formed by simply adding a regular ending to the dictionary
          form; `gheobhaidh` is learned as its actual form. Try saying you will get the parts today.
          Answer: `Gheobhaidh mé na páirteanna inniu.` The future verb remains because the getting
          is still ahead, even within today."
  - subskill_id: duration_frequency
    explanation: Describing a routine, `Bím ag snámh dhá uair sa tseachtain` says I swim twice a week.
      `Bím` is the habitual first-person form of `bí`; `ag snámh` names swimming. `Dhá uair` counts
      two occasions, and `sa tseachtain` supplies the weekly period. The sentence describes a
      repeated habit rather than swimming at this moment.
    examples:
      - text: Bím ag snámh dhá uair sa tseachtain.
        meaning: I swim twice a week.
        note: "A duration of two hours is `dhá uair an chloig`, whereas `dhá uair` here means twice. Try
          saying you swim twice a day, using `sa lá`. Answer: `Bím ag snámh dhá uair sa lá.` The
          repeated activity and number of occasions stay; the interval changes from a week to a
          day."
  - subskill_id: event_sequence
    explanation: In cooking instructions, `Nigh do lámha ar dtús, ansin ullmhaigh na glasraí` orders two
      actions. `Nigh` tells one person to wash, and `do lámha` means your hands. `Ar dtús` marks
      that step as first; `ansin` introduces then. `Ullmhaigh na glasraí` tells the same person to
      prepare the vegetables. The linking words establish order.
    examples:
      - text: Nigh do lámha ar dtús, ansin ullmhaigh na glasraí.
        meaning: Wash your hands first, then prepare the vegetables.
        note: "The sequence words also work with two safe preparation steps. Try washing the vegetables
          first, then preparing them. Answer: `Nigh na glasraí ar dtús, ansin ullmhaigh iad.` `Nigh` and
          `ullmhaigh` address one person; `iad` refers back to the vegetables, and the order remains clear."
  - subskill_id: event_phase
    explanation: After reaching the end of your reading, `Tá mé críochnaithe ag léamh` says I have
      finished reading. `Tá mé` identifies the speaker’s state, `críochnaithe` means finished, and
      `ag léamh` identifies the activity. The sentence focuses on being finished with reading; the
      surrounding exchange can identify the book or document.
    examples:
      - text: Tá mé críochnaithe ag léamh.
        meaning: I have finished reading.
        note: "Compare `Tá mé ag léamh`, I am reading: without `críochnaithe`, the activity is presented as
          ongoing. Try telling the listener that you are still in the reading stage rather than
          finished. Answer: `Tá mé ag léamh.` Removing the finished-state word gives the ongoing
          construction."
