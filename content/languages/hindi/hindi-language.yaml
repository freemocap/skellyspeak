# yaml-language-server: $schema=../../rust-schemas/language.yaml
schema_version: 1
identity:
  id: hindi
  name: Hindi
  native_name: हिन्दी
  family: indo-european
  review: needs_review
integrations:
  language_tag: hi
  transcription: hi
definitions:
  orthographies:
    devanagari:
      script: devanagari
      guidance:
        - scope: target_writing
          text: Write newly generated Hindi in Devanagari script. Preserve source excerpts exactly, including
            vowel signs, conjuncts and joining controls. Keep newly generated target and explanation
            text in this script. Reading-aid romanization is generated by a separate operation.
          sources:
            - unicode17_indic
        - scope: explanation_writing
          text: Write newly generated Hindi in Devanagari script. Preserve source excerpts exactly, including
            vowel signs, conjuncts and joining controls. Keep newly generated target and explanation
            text in this script. Reading-aid romanization is generated by a separate operation.
          sources:
            - unicode17_indic
  romanization_schemes:
    ala-lc-hindi:
      label: ALA-LC Hindi
      instructions: Use ALA-LC Hindi (2025) orthographic transliteration with its diacritics, including ā,
        ī, ū, ṭ, ḍ, ṇ and ś. Supply the inherent a unless a vowel sign replaces it or virāma
        suppresses it; do not silently apply spoken Hindi schwa deletion to this spelling-based
        scheme. Follow the table for nukta letters and nasal signs. This is transliteration, not a
        pronunciation guide; put spoken pronunciation in the separate pronunciation field. Preserve
        the source exactly.
      examples:
        - original: पानी
          romanized: pānī
        - original: नमस्ते
          romanized: namaste
        - original: किताब
          romanized: kitāba
        - original: घर
          romanized: ghara
        - original: चाय
          romanized: cāya
      sources:
        - ala_lc_hindi
      review: needs_review
defaults:
  variety: hindi-india
  orthography:
    local: devanagari
  scalars: {}
  romanization:
    mode: scheme
    scheme:
      local: ala-lc-hindi
  supported_romanizations:
    - local: ala-lc-hindi
traits: []
varieties:
  - id: hindi-india
    name: India
    description: Contemporary standard Hindi for everyday conversation in India.
    review: needs_review
    sources: []
    overrides: {}
    guidance: []
guidance:
  - scope: segmentation
    text: Select linguistic words without splitting vowel signs or conjuncts. Preserve the exact source
      encoding and let the supplied grapheme boundaries constrain annotation spans.
    sources:
      - unicode17_indic
conversation:
  greeting:
    text: नमस्ते
    romanizations:
      hindi:ala-lc-hindi: namaste
  default_partner:
    name: आशा
    romanizedName: Āśā
    age: 32
    location: Lucknow, India
    occupation: Librarian
    background: Works at a neighbourhood library and lives with her sister.
    currentSituation: Organizing a book exchange and planning a weekend train trip.
    interests:
      - books
      - cooking
      - train journeys
    opinions:
      - Public transport should be easier to use.
    interestingFacts:
      - Keeps a notebook of places to visit.
    favoriteBooks: []
    favoriteMovies: []
    manner: Uses short everyday sentences and asks concrete follow-up questions.
    quirks:
      - Draws small maps when explaining directions.
    vibe:
      - 📚
      - 🚲
      - ☕
practice:
  review: needs_review
  sets:
    absolute_zero:
      - हाँ।
      - नहीं।
      - पानी दीजिए।
      - मैं यहाँ हूँ।
      - गर्मी है।
      - मुझे भूख लगी है।
      - यह क्या है?
      - मुझे नहीं पता।
    beginner:
      - यह कमरा बड़ा है।
      - वह डॉक्टर हैं।
      - मेरे पास एक साइकिल है।
      - यह मेरी बहन है।
      - मुझे दो किताबें चाहिए।
      - थोड़ा पानी दीजिए।
      - मैं यहाँ काम करता हूँ।
      - वह किताब पढ़ रही है।
    intermediate:
      - मैं कल आया था।
      - उसने किताब पढ़ी।
      - मैं कल आऊँगा।
      - हम अगले हफ़्ते जाएँगे।
      - मुझे चाय पसंद है।
      - मैं घर जाना चाहती हूँ।
      - मैं तैर सकता हूँ।
      - मुझे जाना है।
    advanced:
      - अगर मुझे पता होता कि बैठक इतनी लंबी चलेगी, तो मैंने घर लौटने की योजना पहले ही बदल ली होती।
      - मुझे सबसे ज़्यादा चिंता इस बात की है कि इस फ़ैसले का उन लोगों पर क्या असर पड़ेगा जिनसे राय
        नहीं ली गई।
      - हालाँकि यह प्रस्ताव आशाजनक लगता है, फिर भी हमें इसके संभावित नतीजों पर ध्यान से विचार करना
        चाहिए।
      - जल्दबाज़ी में ऐसा फ़ैसला करने से बेहतर है कि हम यात्रा टाल दें, ताकि बाद में पछताना न पड़े।
      - इस रिपोर्ट को जितनी बारीकी से पढ़ता हूँ, इसके निष्कर्ष उतने ही कम ठोस लगते हैं।
      - इस परियोजना की सफलता काफ़ी हद तक इस बात पर निर्भर करेगी कि हम ज़िम्मेदारियाँ कैसे बाँटते हैं।
      - ऐसा नहीं है कि मैं इस विचार के ख़िलाफ़ हूँ; मुझे बस यह तय नहीं लग रहा कि अभी सही समय है या
        नहीं।
      - जब तक हमें समझ आया कि क्या हुआ था, तब तक स्थिति को सुधारना बहुत मुश्किल हो चुका था।
    social:
      - नमस्ते!
      - नमस्कार!
      - आप कैसे हैं?
      - मैं ठीक हूँ, धन्यवाद।
      - आपका नाम क्या है?
      - आपसे मिलकर खुशी हुई।
      - बहुत धन्यवाद।
      - कोई बात नहीं।
      - माफ़ कीजिए।
      - ज़रा सुनिए।
      - फिर मिलेंगे।
      - अच्छा, चलता हूँ।
      - आपका दिन अच्छा हो।
      - शुभ रात्रि।
    idiomatic:
      - वह मेरी आँखों का तारा है।
      - हमने मेहमानों के लिए आँखें बिछा दीं।
      - मैं शर्म से पानी-पानी हो गया।
      - वह नौ दो ग्यारह हो गया।
      - तुमने नाक में दम कर दिया।
      - दाल में कुछ काला है।
      - सबने दाँतों तले उँगली दबा ली।
      - मेरी आँखों में धूल मत झोंको।
  varieties: {}
