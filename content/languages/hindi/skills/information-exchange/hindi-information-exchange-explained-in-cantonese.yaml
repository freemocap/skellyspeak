sections:
  - subskill_id: asking_information
    explanation: 出門前想知間舖幾點開。`कितने बजे` 問鐘點，`खुलती है` 放喺舖頭同時間疑問後面；因為 `दुकान`
      係陰性，動詞用 `खुलती`。
    examples:
      - text: दुकान कितने बजे खुलती है?
        meaning: 間舖幾點開門？ `दुकान` 係舖頭，`कितने बजे` 係未知鐘點，`खुलती है` 係開門；對方要補嘅係時間。
        note: 試問關門時間。答案：`दुकान कितने बजे बंद होती है?` 將開門換成 `बंद होती है`。`क्या दुकान
          खुलती है?` 問嘅係會唔會開，唔係幾點開。
  - subskill_id: answering_information
    explanation: 對方問幾點開門，單講鐘點就答到。數字後嘅 `बजे` 表示鐘面上嘅時間。
    examples:
      - text: आठ बजे।
        meaning: 八點。 `आठ` 係八，`बजे` 令佢變成八點；間舖同開門動作由上一句補返。
        note: 試答九點。答案：`नौ बजे।` 只換數字。`आठ घंटे` 係八個鐘頭嘅時長，答唔到幾點。
  - subskill_id: checking_facts
    explanation: 你估間舖八點開，想對方確認。先講候選時間，再喺句尾用 `है न?` 核實整個說法。
    examples:
      - text: दुकान आठ बजे खुलती है, है न?
        meaning: 間舖八點開門，係咪？ `आठ बजे` 係估計嘅鐘點，`खुलती है` 講間舖開門；句尾 `है न?` 要對方確認。
        note: 試核實係咪九點開。答案：`दुकान नौ बजे खुलती है, है न?` 只換候選時間。`दुकान कितने बजे खुलती
          है?` 係問未知時間。
  - subskill_id: useful_detail
    explanation: 訪客見到幾道門，要認出正確嗰道。`पीछे वाला` 指後面嗰道，顏色再提供可見線索。
    examples:
      - text: पीछे वाला दरवाज़ा नीला है।
        meaning: 後面嗰道門係藍色嘅。 `पीछे वाला दरवाज़ा` 係後面嗰道門，`नीला है` 係藍色；`वाला` 同 `नीला`
          都配合陽性 `दरवाज़ा`。
        note: 試講後面嗰道係紅色。答案：`पीछे वाला दरवाज़ा लाल है।` 換顏色。單講 `दरवाज़ा नीला है` 冇指出後面嗰道。
