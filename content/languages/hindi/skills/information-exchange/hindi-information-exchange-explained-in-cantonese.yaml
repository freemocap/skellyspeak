sections:
  - subskill_id: asking_information
    explanation: कितने बजे 問鐘點，呢度放動詞前面，唔需要額外疑問助動詞。
    examples:
      - text: दुकान कितने बजे खुलती है?
        meaning: 間舖幾點開門？
        note: खुलती 配合陰性 दुकान，未知資訊係開門時間。
  - subskill_id: answering_information
    explanation: 時間短語可以直接回答問題，唔使重複主語動詞；切題性由上文決定。
    examples:
      - text: आठ बजे।
        meaning: 八點。
        note: 回答開門時間；बजे 表明係鐘點。
  - subskill_id: checking_facts
    explanation: 說法後面加 है न? 可以請求確認，要讓對方識別到核實緊乜。
    examples:
      - text: दुकान आठ बजे खुलती है, है न?
        meaning: 間舖八點開門，係咪？
        note: 講者已聽過或推斷係八點，再核實呢個細節。
  - subskill_id: useful_detail
    explanation: वाला 可以識別同組其中一個對象；位置加特徵有助對方搵到。
    examples:
      - text: पीछे वाला दरवाज़ा नीला है।
        meaning: 後面嗰道門係藍色嘅。
        note: 畀訪客指路時，पीछे वाला 指邊道門，नीला 加上可見特徵。
