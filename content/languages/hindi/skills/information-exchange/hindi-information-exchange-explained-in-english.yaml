sections:
  - subskill_id: asking_information
    explanation: You need the shop opening hour before leaving home. `कितने बजे`
      asks at what clock time; `खुलती है` follows the shop and the requested
      time. The verb is feminine because `दुकान` is feminine.
    examples:
      - text: दुकान कितने बजे खुलती है?
        meaning: What time does the shop open? `दुकान` is the shop, `कितने बजे` the
          unknown hour, and `खुलती है` means opens. The question leaves only the
          clock time to supply.
        note: "Ask for the closing hour. Answer: `दुकान कितने बजे बंद होती है?` Replace
          the opening predicate with `बंद होती है`. `क्या दुकान खुलती है?`
          instead asks whether it opens."
  - subskill_id: answering_information
    explanation: When someone asks the opening hour, the time phrase alone can fill
      that gap. `बजे` makes the number an hour on the clock.
    examples:
      - text: आठ बजे।
        meaning: At eight. `आठ` means eight and `बजे` places it at eight o’clock. The
          shop and opening verb are understood from the preceding question.
        note: "Answer with nine. Answer: `नौ बजे।` Replace only the number. `आठ घंटे` is
          eight hours of duration, so it does not answer the clock-time
          question."
  - subskill_id: checking_facts
    explanation: You think the shop opens at eight and want the listener to confirm
      that claim. State the candidate hour first, then use final `है न?` to
      check it.
    examples:
      - text: दुकान आठ बजे खुलती है, है न?
        meaning: The shop opens at eight, right? `आठ बजे` gives the proposed time and
          `खुलती है` describes the shop’s opening. Final `है न?` seeks
          confirmation of that proposition.
        note: "Check whether the shop opens at nine. Answer: `दुकान नौ बजे खुलती है, है
          न?` Change the proposed hour. `दुकान कितने बजे खुलती है?` requests an
          unknown hour instead."
  - subskill_id: useful_detail
    explanation: A visitor sees several doors and needs to identify the right one.
      `पीछे वाला` selects the one at the back; the color gives a second visible
      clue.
    examples:
      - text: पीछे वाला दरवाज़ा नीला है।
        meaning: The door at the back is blue. `पीछे वाला दरवाज़ा` identifies the back
          door. `नीला है` says it is blue; `वाला` and `नीला` take masculine
          forms with `दरवाज़ा`.
        note: "Point out a red back door. Answer: `पीछे वाला दरवाज़ा लाल है।` Change the
          identifying color. `दरवाज़ा नीला है` gives a color but loses the
          back-door distinction."
