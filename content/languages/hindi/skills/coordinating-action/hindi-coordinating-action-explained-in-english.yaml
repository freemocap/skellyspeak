skill_id: coordinating_action
explanation_language: english
shared_explanation: skills/coordinating-action/coordinating-action-explained-in-english.yaml
sections:
  - subskill_id: requests
    explanation: You need the listener to place a book in a specific spot. `रखिए` is
      a respectful imperative addressed to the listener; `यहाँ` identifies the
      destination.
    examples:
      - text: किताब यहाँ रखिए।
        meaning: Please put the book here. `किताब` is the object and `यहाँ` means here.
          `रखिए` asks the listener to put it down; politeness is carried by the
          verb form without requiring `कृपया`.
        note: "Ask for the book to be placed there. Answer: `किताब वहाँ रखिए।` Change
          `यहाँ` to `वहाँ`. `किताब यहाँ है` merely reports where it is."
  - subskill_id: offers_invitations
    explanation: Someone is struggling with a task. `क्या मैं ... करूँ?` offers the
      speaker’s own action, and `आपकी मदद` specifies help for the respected
      listener.
    examples:
      - text: क्या मैं आपकी मदद करूँ?
        meaning: Shall I help you? `करूँ` is a first-person subjunctive proposal. `आपकी`
          agrees with feminine `मदद`, while the whole question invites the
          listener to accept or decline help.
        note: "Offer to bring tea instead. Answer: `क्या मैं चाय ले आऊँ?` The speaker
          still offers their own action. `आप मेरी मदद करें` would ask the
          listener to help you."
  - subskill_id: suggestions
    explanation: The group has been standing for a while. `चलिए` opens a shared
      proposal, and `बैठते हैं` suggests that speaker and listener sit together.
    examples:
      - text: चलिए, थोड़ी देर बैठते हैं।
        meaning: Let us sit for a little while. `थोड़ी देर` limits the sitting to a
          little while. In this context `बैठते हैं` is a proposal, although the
          same form can describe a habit elsewhere.
        note: "Suggest walking together for a while. Answer: `चलिए, थोड़ी देर चलते हैं।`
          Replace the action. `हम रोज़ बैठते हैं` is a habitual report."
  - subskill_id: commitments
    explanation: During group planning, you take responsibility for the tickets. `ले
      आऊँगी` says a female speaker will obtain and bring them; the planning
      exchange makes this a commitment.
    examples:
      - text: मैं टिकट ले आऊँगी।
        meaning: I will bring the tickets. `टिकट` names what the group needs, and `मैं
          ... ले आऊँगी` assigns that task to the speaker. A future form alone
          could also be a prediction in another context.
        note: "Give the same undertaking as a male speaker. Answer: `मैं टिकट ले आऊँगा।`
          Change the future gender ending. `शायद टिकट आ जाएँगे` predicts an
          outcome without taking responsibility."
  - subskill_id: accepting_declining
    explanation: Someone invites you to visit today, but you cannot. `माफ़ कीजिए`
      softens the reply and `आज मेरे पास समय नहीं है` supplies the constraint
      that declines that invitation.
    examples:
      - text: माफ़ कीजिए, आज मेरे पास समय नहीं है।
        meaning: Sorry, I do not have time today. `आज` limits the lack of time to today,
          and `मेरे पास समय नहीं है` means I do not have time. The prior
          invitation makes it a refusal rather than a free-standing schedule
          report.
        note: "Decline because you are busy today. Answer: `माफ़ कीजिए, आज मैं व्यस्त
          हूँ।` The reason changes but the reply still declines in this context.
          `हाँ, ज़रूर` would accept."
  - subskill_id: negotiating_plans
    explanation: A partner proposes Tuesday, but Wednesday works better. `मंगलवार
      नहीं` rejects the proposed day; `बुधवार को मिलते हैं` offers a replacement
      meeting plan.
    examples:
      - text: मंगलवार नहीं, बुधवार को मिलते हैं।
        meaning: Not Tuesday; let us meet on Wednesday. `बुधवार को` gives the
          alternative day. `मिलते हैं` includes the people arranging to meet;
          this is a proposal in context, not a recurring-habit report.
        note: "Counter with Thursday instead. Answer: `मंगलवार नहीं, गुरुवार को मिलते
          हैं।` Keep the rejected day and replace the proposed one. `हम हर
          बुधवार मिलते हैं` reports a routine."
