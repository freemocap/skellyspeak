skill_id: coordinating_action
explanation_language: cantonese
shared_explanation: skills/coordinating-action/coordinating-action-explained-in-cantonese.yaml
sections:
  - subskill_id: requests
    explanation: 你想對方將書放到指定位置。`रखिए` 係對聽者嘅尊稱祈使式；`यहाँ` 指放喺呢度。
    examples:
      - text: किताब यहाँ रखिए।
        meaning: 唔該將本書放喺呢度。 `किताब` 係書，`यहाँ` 係呢度；`रखिए` 請對方放低，禮貌已喺動詞形入面，唔一定加 `कृपया`。
        note: 試叫對方放嗰邊。答案：`किताब वहाँ रखिए।` `यहाँ` 換 `वहाँ`。`किताब यहाँ है` 只係報位置。
  - subskill_id: offers_invitations
    explanation: 對方做事有困難。`क्या मैं ... करूँ?` 主動提議自己做，`आपकी मदद` 指幫有禮貌稱呼嘅對方。
    examples:
      - text: क्या मैं आपकी मदद करूँ?
        meaning: 要唔要我幫你？ `करूँ` 係第一人稱虛擬式提議；`आपकी` 配陰性 `मदद`。整句畀對方接受或拒絕幫手。
        note: 試改成主動攞茶。答案：`क्या मैं चाय ले आऊँ?` 仍係自己出手。`आप मेरी मदद करें` 就係請對方幫你。
  - subskill_id: suggestions
    explanation: 大家企咗一陣。`चलिए` 開始共同建議，`बैठते हैं` 提議講者同聽者一齊坐。
    examples:
      - text: चलिए, थोड़ी देर बैठते हैं।
        meaning: 我哋坐一陣啦。 `थोड़ी देर` 限定坐一陣；呢個情境 `बैठते हैं` 係提議，但同一形式喺別處可以講習慣。
        note: 試建議一齊行一陣。答案：`चलिए, थोड़ी देर चलते हैं।` 換動作。`हम रोज़ बैठते हैं` 係習慣報告。
  - subskill_id: commitments
    explanation: 小組安排時你接手買票。`ले आऊँगी` 講女性講者會攞票返嚟；因為係分工對話，所以係承諾。
    examples:
      - text: मैं टिकट ले आऊँगी।
        meaning: 由我帶啲飛嚟。 `टिकट` 係大家要嘅票，`मैं ... ले आऊँगी` 將任務交畀講者；將來形式喺其他情境亦可只係預測。
        note: 試用男性講者承擔同一任務。答案：`मैं टिकट ले आऊँगा।` 改將來性別詞尾。`शायद टिकट आ जाएँगे`
          只係估結果，冇承擔。
  - subskill_id: accepting_declining
    explanation: 有人請你今日去探訪，但你唔得。`माफ़ कीजिए` 緩和回應，`आज मेरे पास समय नहीं है` 交代限制，因而婉拒。
    examples:
      - text: माफ़ कीजिए, आज मेरे पास समय नहीं है।
        meaning: 唔好意思，我今日冇時間。 `आज` 限定今日，`मेरे पास समय नहीं है`
          係冇時間；有上文邀請先構成拒絕，單獨講只係行程資訊。
        note: 試改成因今日忙而婉拒。答案：`माफ़ कीजिए, आज मैं व्यस्त हूँ।` 理由改咗，喺此情境仍係拒絕。`हाँ, ज़रूर`
          係接受。
  - subskill_id: negotiating_plans
    explanation: 對方提議星期二，你覺得星期三較合適。`मंगलवार नहीं` 否定原日子，`बुधवार को मिलते हैं` 提出新安排。
    examples:
      - text: मंगलवार नहीं, बुधवार को मिलते हैं।
        meaning: 唔係星期二，我哋星期三見啦。 `बुधवार को` 係替代日期；`मिलते हैं` 包括一齊約見嘅人。喺此處係提議，唔係定期習慣。
        note: 試改提議星期四。答案：`मंगलवार नहीं, गुरुवार को मिलते हैं।` 保留否定星期二，換新日期。`हम हर
          बुधवार मिलते हैं` 係講慣常安排。
