sections:
  - subskill_id: requests
    explanation: 尊稱祈使句可以請對方行動。रखिए 用於有禮貌稱呼，明示代名詞時可以配合 आप。
    examples:
      - text: किताब यहाँ रखिए।
        meaning: 唔該將本書放喺呢度。
        note: रखिए 要求擺放書本，यहाँ 交代位置；有禮貌請求唔係每次都必須加 कृपया。
  - subskill_id: offers_invitations
    explanation: 第一人稱虛擬式問句可以主動提出為對方做事。
    examples:
      - text: क्या मैं आपकी मदद करूँ?
        meaning: 要唔要我幫你？
        note: करूँ 提議講者行動；आपकी 配合陰性 मदद，亦尊稱對方。
  - subskill_id: suggestions
    explanation: चलिए 可以引入共同行動建議，後面第一人稱複數講大家一齊做乜。
    examples:
      - text: चलिए, थोड़ी देर बैठते हैं।
        meaning: 我哋坐一陣啦。
        note: बैठते हैं 包括講者同聽者，喺呢度係提議，唔係報告平時坐邊。
  - subskill_id: commitments
    explanation: 喺計劃中表達將來行動可以承擔責任，但承諾意思來自交流，唔係單靠將來詞形。
    examples:
      - text: मैं टिकट ले आऊँगी।
        meaning: 由我帶啲飛嚟。
        note: 分工攞飛時用；आऊँगी 表明講者係女性。
  - subskill_id: accepting_declining
    explanation: 簡短交代限制可以拒絕邀請；做唔到邊項行動，由上文邀請交代。
    examples:
      - text: माफ़ कीजिए, आज मेरे पास समय नहीं है।
        meaning: 唔好意思，我今日冇時間。
        note: 回應今日到訪嘅邀請，道歉加冇時間構成拒絕。
  - subskill_id: negotiating_plans
    explanation: 對比唔合適時間同替代時間；第一人稱複數可以提出新安排。
    examples:
      - text: मंगलवार नहीं, बुधवार को मिलते हैं।
        meaning: 唔係星期二，我哋星期三見啦。
        note: 回應星期二提議；बुधवार को 指替代見面日子。
