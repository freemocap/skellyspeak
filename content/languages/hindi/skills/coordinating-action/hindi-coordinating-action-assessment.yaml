skill_id: coordinating_action
guidance: Assess whether the contribution seeks action, offers help, invites, suggests, commits,
  accepts or declines, or adjusts a plan. Polite imperatives such as रखिए directly request
  action without an English please formula. क्या मैं मदद करूँ? offers help; चलिए बैठते हैं
  proposes shared action. मैं टिकट ले आऊँगी can undertake a task in planning, but a future form
  alone may merely predict. नहीं after an identifiable invitation can decline contextually; a
  free-standing negative with no action proposal is not automatically a refusal. मंगलवार नहीं,
  बुधवार को मिलते हैं revises timing when responding to an earlier plan. An isolated copied
  imperative ending is not a request, and a real information question about someone’s ability is
  not necessarily one either. आप normally requires honorific agreement; assess register in
  context rather than demanding one pronoun for every relationship. Do not collapse permission,
  recommendation and commitment simply because they concern a possible future action.
