sections:
  - subskill_id: ability
    explanation: 不定式配合 आना 可以表示識做，感受者用 मुझे，唔係照搬英文 know 句法。
    examples:
      - text: मुझे तैरना आता है।
        meaning: 我識游水。
        note: तैरना 指技能；呢度講能力，唔係有人到達。
  - subskill_id: permission
    explanation: 第一人稱虛擬式問句可以請求許可；行動同對方權責令意思清楚。
    examples:
      - text: क्या मैं यहाँ बैठूँ?
        meaning: 我可唔可以坐呢度？
        note: बैठूँ 係第一人稱虛擬式，問負責座位或地方嘅人。
  - subskill_id: obligation
    explanation: 與格人稱加不定式同 है，可以表達需要做嘅事；義務定計劃要按語境分。
    examples:
      - text: मुझे आज दवा लेनी है।
        meaning: 我今日要食藥。
        note: 按醫囑療程時表達要求；लेनी 配合陰性 दवा。
  - subskill_id: possibility
    explanation: शायद 配合虛擬式，可以提出未確定說法。
    examples:
      - text: शायद दुकान अभी खुली हो।
        meaning: 間舖可能仲開緊。
        note: हो 係虛擬式；खुली 配合 दुकान，唔係斷言肯定開門。
  - subskill_id: certainty
    explanation: नहीं पता 明示唔知道；कि 引入未知內容，या नहीं 提供另一可能。
    examples:
      - text: मुझे नहीं पता कि दुकान खुली है या नहीं।
        meaning: 我唔知間舖開唔開。
        note: 唔確定嘅係營業狀態，唔係話聽唔明之前某個詞。
