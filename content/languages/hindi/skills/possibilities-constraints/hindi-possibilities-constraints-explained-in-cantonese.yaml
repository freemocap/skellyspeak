sections:
  - subskill_id: ability
    explanation: 喺游泳堂講自己識一項技能。`मुझे` 係掌握技能嘅人，不定式 `तैरना` 係活動。
    examples:
      - text: मुझे तैरना आता है।
        meaning: 我識游水。 `तैरना` 係游水，`आता है` 表示我識做；唔係有人行到嚟。
        note: 試講識煮飯。答案：`मुझे खाना बनाना आता है।` 活動放 `आता है` 前。`मैं तैरना सकता हूँ`
          唔係一般「我識游水」句式。
  - subskill_id: permission
    explanation: 坐低前問負責呢個位嘅人。開頭 `क्या` 形成是非問句，第一人稱虛擬式 `बैठूँ` 提出自己想做嘅事，等對方批准。
    examples:
      - text: क्या मैं यहाँ बैठूँ?
        meaning: 我可唔可以坐呢度？ `मैं` 係講者，`यहाँ` 係位置，`बैठूँ` 係想坐；由對方有權決定嘅情境可知係問准許。
        note: 試問而家可唔可以走。答案：`क्या मैं अब जाऊँ?` 換動作同時間。另一情境同樣句式可能係問建議，要睇上文。
  - subskill_id: obligation
    explanation: 你跟醫囑食藥。`मुझे` 係要行動嘅人，`लेनी है` 講需要做，亦配陰性 `दवा`。
    examples:
      - text: मुझे आज दवा लेनी है।
        meaning: 我今日要食藥。 `आज` 係今日，`दवा` 係藥，`लेनी है` 係要服用；處方情境令句子有義務意思。
        note: 試講今日要食兩粒藥。答案：`मुझे आज दो गोलियाँ लेनी हैं।` 複數陰性項目配 `हैं`。`मुझे दवा पसंद
          है` 係鍾意，唔係義務。
  - subskill_id: possibility
    explanation: 你未查間舖有冇開。`शायद` 表示估計，`हो` 令狀態保持可能，未被確認。
    examples:
      - text: शायद दुकान अभी खुली हो।
        meaning: 間舖可能仲開緊。 `अभी` 喺度係而家或仍然，`खुली` 配陰性 `दुकान`，`हो` 係「係」嘅虛擬形；成句保留不確定。
        note: 試講舖可能關咗。答案：`शायद दुकान अभी बंद हो।` 換狀態。`दुकान खुली है` 就係直接當事實講。
  - subskill_id: certainty
    explanation: 有人問舖頭有冇開，但你唔知。`मुझे नहीं पता` 交代未知；`कि ... या नहीं` 指出未解決嘅是非問題。
    examples:
      - text: मुझे नहीं पता कि दुकान खुली है या नहीं।
        meaning: 我唔知間舖開唔開。 `दुकान खुली है` 係待確認嘅說法，`या नहीं` 加另一可能；`मुझे नहीं पता`
          表示揀唔到答案。
        note: 試講唔知舖頭關咗未。答案：`मुझे नहीं पता कि दुकान बंद है या नहीं।`
          改待確認說法。呢度係事實未知，唔係聽唔清字。
