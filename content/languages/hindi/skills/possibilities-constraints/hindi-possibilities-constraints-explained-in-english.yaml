sections:
  - subskill_id: ability
    explanation: At a swimming lesson, you explain an acquired skill. In `मुझे तैरना
      आता है`, `मुझे` names the person with the skill and the infinitive names
      the activity.
    examples:
      - text: मुझे तैरना आता है।
        meaning: I know how to swim. `तैरना` means to swim and `आता है` says the skill
          is known to me. This is about know-how, not a swimmer physically
          arriving.
        note: "Say you know how to cook. Answer: `मुझे खाना बनाना आता है।` Put the
          activity before `आता है`. `मैं तैरना सकता हूँ` is not the ordinary
          form for I can swim."
  - subskill_id: permission
    explanation: Before taking an available seat, ask the person responsible for the
      space. Initial `क्या` makes a yes or no question, and first-person
      subjunctive `बैठूँ` proposes your action for approval.
    examples:
      - text: क्या मैं यहाँ बैठूँ?
        meaning: May I sit here? `मैं` identifies the speaker, `यहाँ` the proposed
          place, and `बैठूँ` the possible sitting. The listener’s authority and
          setting make it a permission request.
        note: "Ask to leave now. Answer: `क्या मैं अब जाऊँ?` Replace the action and
          time. The same form could seek advice in another setting, so use the
          situation to interpret it."
  - subskill_id: obligation
    explanation: You are following a prescribed medicine schedule. `मुझे` marks who
      must act; `लेनी है` expresses a required action and agrees with feminine
      `दवा`.
    examples:
      - text: मुझे आज दवा लेनी है।
        meaning: I have to take medicine today. `आज` sets today’s time, `दवा` is
          medicine, and `लेनी है` says it has to be taken. The prescription
          gives the sentence its obligation reading.
        note: "Say you must take two tablets today. Answer: `मुझे आज दो गोलियाँ लेनी
          हैं।` The plural feminine item calls for plural `हैं`. `मुझे दवा पसंद
          है` expresses liking, not a duty."
  - subskill_id: possibility
    explanation: You have not checked whether the shop is open. `शायद` marks a
      tentative claim, and `हो` keeps the state possible rather than confirmed.
    examples:
      - text: शायद दुकान अभी खुली हो।
        meaning: Perhaps the shop is still open. `अभी` means still or now in this
          context, `खुली` agrees with feminine `दुकान`, and `हो` is a
          subjunctive form of be. The whole sentence leaves the opening
          uncertain.
        note: "Suggest that the shop may be closed. Answer: `शायद दुकान अभी बंद हो।`
          Replace the state. `दुकान खुली है` states it as a fact instead."
  - subskill_id: certainty
    explanation: Someone asks whether the shop is open, but you have no answer.
      `मुझे नहीं पता` states your lack of knowledge; `कि ... या नहीं` names the
      unresolved yes or no issue.
    examples:
      - text: मुझे नहीं पता कि दुकान खुली है या नहीं।
        meaning: I do not know whether the shop is open. `दुकान खुली है` is the
          proposition at issue. `या नहीं` adds its alternative, while `मुझे नहीं
          पता` says the speaker cannot choose between them.
        note: "Say you do not know whether the shop is closed. Answer: `मुझे नहीं पता कि
          दुकान बंद है या नहीं।` Change the proposition. This concerns factual
          uncertainty, not failure to hear a word."
