sections:
  - subskill_id: causes_reasons
    explanation: क्योंकि 引入原因，後面內容應解釋之前行動或情況。
    examples:
      - text: मैं बाहर नहीं गई क्योंकि बारिश हो रही थी।
        meaning: 我冇出街，因為落緊雨。
        note: गई 表明女性講者；落雨係留喺室內嘅原因。
  - subskill_id: consequences
    explanation: इसलिए 標示結果，唔止係將兩件事依次排列。
    examples:
      - text: बस नहीं आई, इसलिए हमें पैदल जाना पड़ा।
        meaning: 巴士冇嚟，所以我哋要行路。
        note: इसलिए 連結巴士冇嚟同要行路；जाना पड़ा 表達由此產生嘅必要。
  - subskill_id: conditions
    explanation: अगर 引入假設條件，常配合 तो。呢類結構嘅完成體動詞可以講將來可能，唔一定講過去。
    examples:
      - text: अगर बारिश हुई तो हम घर पर रहेंगे।
        meaning: 如果落雨，我哋就留喺屋企。
        note: हुई 喺條件內，冇斷言已落雨；रहेंगे 交代結果。
  - subskill_id: contrast
    explanation: लेकिन 連接對比，聽者應能從內容理解分別或出乎預期之處。
    examples:
      - text: यह कमरा छोटा है, लेकिन बहुत रोशन है।
        meaning: 間房細，但好光猛。
        note: 光猛嘅優點同面積細形成對比。
  - subskill_id: supporting_claims
    explanation: क्योंकि 可以引入支持結論嘅證據，唔單止解釋事件原因。
    examples:
      - text: दुकान खुली है, क्योंकि अंदर लोग हैं।
        meaning: 間舖開緊，因為入面有人。
        note: 有人係判斷開門嘅依據，唔係聲稱有人導致開門。
