sections:
  - subskill_id: causes_reasons
    explanation: 朋友問點解留喺屋企。先講冇出門，`क्योंकि` 再引入落雨呢個原因。
    examples:
      - text: मैं बाहर नहीं गई क्योंकि बारिश हो रही थी।
        meaning: 我冇出街，因為落緊雨。 `बाहर नहीं गई` 係冇出去，亦顯示女性講者；`बारिश हो रही थी` 係當時落緊雨，解釋決定。
        note: 試改成因為病咗。答案：`मैं बाहर नहीं गई क्योंकि मैं बीमार थी।` `क्योंकि` 後面要能解釋前句；加
          `और` 只係並列。
  - subskill_id: consequences
    explanation: 解釋點解大家要行路。`इसलिए` 指返架巴士冇嚟，標示步行係後果。
    examples:
      - text: बस नहीं आई, इसलिए हमें पैदल जाना पड़ा।
        meaning: 巴士冇嚟，所以我哋要行路。 `बस नहीं आई` 係巴士冇嚟；`हमें पैदल जाना पड़ा` 係我哋被迫行路；`इसलिए`
          將兩者接成因果。
        note: 試將後果改成要等。答案：`बस नहीं आई, इसलिए हमें इंतज़ार करना पड़ा।` 改結果；`फिर` 可能只講先後。
  - subskill_id: conditions
    explanation: 你係定落雨預案，唔係話已經落過雨。`अगर` 帶條件，`तो` 帶條件成立後嘅行動。
    examples:
      - text: अगर बारिश हुई तो हम घर पर रहेंगे।
        meaning: 如果落雨，我哋就留喺屋企。 `बारिश हुई` 喺如果子句入面，呢度完成形唔斷言過去落咗雨；`हम घर पर रहेंगे`
          係將來結果。
        note: 試講冇落雨就出門。答案：`अगर बारिश नहीं हुई तो हम बाहर जाएँगे।` 否定條件並改結果。冇條件句就只係一個計劃。
  - subskill_id: contrast
    explanation: 講間房細，但仍有優點。`लेकिन` 表示光猛同細小可能引起嘅預期相反。
    examples:
      - text: यह कमरा छोटा है, लेकिन बहुत रोशन है।
        meaning: 間房細，但好光猛。 `छोटा है` 係細，`बहुत रोशन है` 係好光猛；`लेकिन` 將兩項接成對比，唔係純列舉。
        note: 試講房大但暗。答案：`यह कमरा बड़ा है, लेकिन अँधेरा है।` 改兩個性質；`और` 只係加多項描述。
  - subskill_id: supporting_claims
    explanation: 你見到舖內有人，推斷間舖開咗。呢度 `क्योंकि` 提供支持說法嘅證據，唔係令舖頭開門嘅原因。
    examples:
      - text: दुकान खुली है, क्योंकि अंदर लोग हैं।
        meaning: 間舖開緊，因為入面有人。 `दुकान खुली है` 係結論，`अंदर लोग हैं` 係觀察根據；入面有人本身唔係開門原因。
        note: 你見到門上有鎖，推斷舖頭關咗。答案：`दुकान बंद है, क्योंकि दरवाज़े पर ताला लगा है।`
          門鎖係判斷根據，唔係令舖頭關門嘅事件；日頭冇開燈會係較弱證據。
