skill_id: reasons_connections
guidance: "Recognize actual causal, consequential, conditional, contrastive and evidential
  relations. क्योंकि can explain an action; इसलिए presents a consequence. अगर बारिश हुई तो हम घर
  पर रहेंगे makes staying home conditional on rain: the perfective in this conditional does not
  assert a past rainy event. लेकिन contrasts claims or expectations; और alone may merely add
  information. दुकान खुली है, क्योंकि अंदर लोग हैं can offer evidence for the opening claim
  rather than a cause of it. A copied क्योंकि without an intelligible reason or recoverable
  connection is absent. बारिश हो रही थी can answer an identified why-question contextually even
  without a connective. पहले and फिर order events but do not necessarily connect them causally.
  कि often introduces reported or thought content, not a reason. Judge whether the supplied
  premise actually supports the conclusion, and accept the relationship when context supplies
  omitted material without requiring an English clause pattern."
