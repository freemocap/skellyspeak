skill_id: reasons_connections
explanation_language: english
shared_explanation: skills/reasons-connections/reasons-connections-explained-in-english.yaml
sections:
  - subskill_id: causes_reasons
    explanation: क्योंकि introduces a reason. The reason should explain the action or situation just
      mentioned.
    examples:
      - text: मैं बाहर नहीं गई क्योंकि बारिश हो रही थी।
        meaning: I did not go outside because it was raining.
        note: गई identifies a female speaker. The rain is the reason for staying in.
  - subskill_id: consequences
    explanation: इसलिए marks a consequence of the preceding circumstance. It adds a causal relation
      beyond the ordering of two events.
    examples:
      - text: बस नहीं आई, इसलिए हमें पैदल जाना पड़ा।
        meaning: The bus did not come, so we had to walk.
        note: इसलिए links the absent bus to the need to walk. जाना पड़ा expresses the resulting
          necessity.
  - subskill_id: conditions
    explanation: अगर can introduce a hypothetical condition, often paired with तो. A perfective verb
      in this construction can concern a future possibility.
    examples:
      - text: अगर बारिश हुई तो हम घर पर रहेंगे।
        meaning: If it rains, we will stay at home.
        note: हुई is inside the condition; it does not assert that rain already occurred. रहेंगे gives
          the consequence.
  - subskill_id: contrast
    explanation: लेकिन connects propositions that contrast. The listener should be able to identify
      the difference or defeated expectation.
    examples:
      - text: यह कमरा छोटा है, लेकिन बहुत रोशन है।
        meaning: This room is small, but it is very bright.
        note: The favorable brightness contrasts with the room’s limited size.
  - subskill_id: supporting_claims
    explanation: क्योंकि may introduce evidence for a conclusion, not only the cause of an event.
      Say what observation supports the claim.
    examples:
      - text: दुकान खुली है, क्योंकि अंदर लोग हैं।
        meaning: The shop is open, because there are people inside.
        note: People inside are offered as grounds for the conclusion. They are not claimed to have
          caused the shop to open.
