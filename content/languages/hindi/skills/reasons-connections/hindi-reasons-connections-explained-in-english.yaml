skill_id: reasons_connections
explanation_language: english
shared_explanation: skills/reasons-connections/reasons-connections-explained-in-english.yaml
sections:
  - subskill_id: causes_reasons
    explanation: A friend asks why you stayed inside. First state what did not
      happen, then `क्योंकि` introduces the rain as the reason.
    examples:
      - text: मैं बाहर नहीं गई क्योंकि बारिश हो रही थी।
        meaning: I did not go outside because it was raining. `बाहर नहीं गई` means did
          not go outside and identifies a female speaker. `बारिश हो रही थी` says
          it was raining; this explains the decision.
        note: "Give a different reason: you were ill. Answer: `मैं बाहर नहीं गई क्योंकि
          मैं बीमार थी।` The clause after `क्योंकि` must explain the first;
          merely adding `और` would list another fact."
  - subskill_id: consequences
    explanation: You explain why the group walked. `इसलिए` points back to the absent
      bus and marks walking as the resulting course of action.
    examples:
      - text: बस नहीं आई, इसलिए हमें पैदल जाना पड़ा।
        meaning: The bus did not come, so we had to walk. `बस नहीं आई` says the bus did
          not come. `हमें पैदल जाना पड़ा` says we had to go on foot; `इसलिए`
          ties that necessity to the bus.
        note: "Give the result that you waited. Answer: `बस नहीं आई, इसलिए हमें इंतज़ार
          करना पड़ा।` Change the consequence. `फिर` could merely say what
          happened next."
  - subskill_id: conditions
    explanation: You are making a rain plan, not reporting rain that already
      happened. `अगर` opens the condition and `तो` leads to the action that
      follows if it is met.
    examples:
      - text: अगर बारिश हुई तो हम घर पर रहेंगे।
        meaning: If it rains, we will stay at home. `बारिश हुई` is inside the if-clause;
          here its perfective form does not assert a past event. `हम घर पर
          रहेंगे` is the future consequence.
        note: "Plan to go out if it does not rain. Answer: `अगर बारिश नहीं हुई तो हम
          बाहर जाएँगे।` Negate the condition and change the consequence. Without
          the condition, `हम घर पर रहेंगे` is simply a plan."
  - subskill_id: contrast
    explanation: You are describing a small room that still has an advantage.
      `लेकिन` signals that the brightness contrasts with what the size might
      lead someone to expect.
    examples:
      - text: यह कमरा छोटा है, लेकिन बहुत रोशन है।
        meaning: This room is small, but it is very bright. `छोटा है` describes limited
          size; `बहुत रोशन है` says it is very bright. `लेकिन` links the two as
          a contrast, not a mere list.
        note: "Contrast a large room that is dark. Answer: `यह कमरा बड़ा है, लेकिन
          अँधेरा है।` Change both qualities. `और` would simply add another
          description."
  - subskill_id: supporting_claims
    explanation: You infer that the shop is open after seeing people inside. Here
      `क्योंकि` supplies evidence for the claim, rather than a cause that made
      the shop open.
    examples:
      - text: दुकान खुली है, क्योंकि अंदर लोग हैं।
        meaning: The shop is open, because there are people inside. `दुकान खुली है`
          states the conclusion; `अंदर लोग हैं` is the observed reason for
          believing it. People inside do not themselves cause the opening.
        note: "You see a lock on the door and infer the shop is closed. Answer: `दुकान
          बंद है, क्योंकि दरवाज़े पर ताला लगा है।` The lock is evidence for the
          inference, not the event that caused the shop to close; an unlit
          interior in daytime would be weaker evidence."
