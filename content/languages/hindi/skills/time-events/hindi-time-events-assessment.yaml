skill_id: time_events
guidance: Distinguish habitual करता है, progressive कर रहा है and appropriate perfective forms
  in their contexts. मैंने कल खिचड़ी बनाई reports a completed past action; बनाई agrees with the
  unmarked feminine object, not the speaker. Do not impose ने on intransitives or every lexical
  verb indiscriminately. कल can mean yesterday or tomorrow; verbal form and exchange
  disambiguate it. मैं कल आऊँगी expresses a later arrival, while future morphology can elsewhere
  convey an assumption about the present. दो घंटे से with ongoing activity measures duration; हर
  रविवार gives recurrence. पहले and फिर order events, and चुका or समाप्त करना can explicitly
  mark completion. An isolated copied कल with no recoverable event is absent. सुबह can complete
  a question about when an identified action occurred. A copular property such as यह गली सँकरी
  है is not automatically temporal evidence. Agreement must be appropriate to the construction,
  but unrelated errors do not erase a correctly expressed event.
