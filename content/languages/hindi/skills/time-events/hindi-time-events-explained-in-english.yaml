skill_id: time_events
explanation_language: english
shared_explanation: skills/time-events/time-events-explained-in-english.yaml
sections:
  - subskill_id: present_events
    explanation: While someone waits for tea, say what you are doing now. `अभी`
      anchors the event in the present; verb stem plus `रही हूँ` presents it as
      ongoing for a female speaker.
    examples:
      - text: मैं अभी चाय बना रही हूँ।
        meaning: I am making tea now. `चाय` is tea and `बना रही हूँ` means I am making.
          `रही` agrees with this female speaker; a male speaker says `बना रहा
          हूँ`.
        note: "Say a male speaker is making tea now. Answer: `मैं अभी चाय बना रहा हूँ।`
          Change `रही` to `रहा`. `मैं चाय बनाती हूँ` describes a habit, not
          necessarily this moment."
  - subskill_id: past_events
    explanation: After cooking yesterday, report one completed action. In this
      transitive perfective clause, `मैंने` marks the agent and `बनाई` agrees
      with the unmarked feminine object `खिचड़ी`.
    examples:
      - text: मैंने कल खिचड़ी बनाई।
        meaning: I made khichdi yesterday. `कल` means yesterday here because `बनाई`
          reports a completed past event. `खिचड़ी` is the food made; its
          feminine gender explains `बनाई`, regardless of the cook’s gender.
        note: "Say you made tea yesterday. Answer: `मैंने कल चाय बनाई।` Keep `मैंने` and
          feminine `बनाई` with feminine `चाय`. Do not add `ने` to every past
          verb; intransitive `मैं गई` works differently."
  - subskill_id: future_events
    explanation: When arranging tomorrow’s visit, `कल` means tomorrow because the
      verb is future. `आऊँगी` expresses a female speaker’s planned arrival.
    examples:
      - text: मैं कल आऊँगी।
        meaning: I will come tomorrow. `मैं` is I, `कल` the day, and `आऊँगी` I will
          come. A male speaker uses `आऊँगा`; the contrast is in the future
          ending.
        note: "Give the same plan as a male speaker. Answer: `मैं कल आऊँगा।` Change only
          the gendered ending. `मैं कल आई` instead describes a completed arrival
          yesterday."
  - subskill_id: duration_frequency
    explanation: Someone asks whether you are still reading. `दो घंटे से` measures
      how long the activity has continued up to now; the progressive form shows
      it is still in progress.
    examples:
      - text: मैं दो घंटे से पढ़ रही हूँ।
        meaning: I have been reading for two hours. `दो घंटे से` is since two hours ago,
          and `पढ़ रही हूँ` says I am reading. Together they mean the female
          speaker started earlier and continues now.
        note: "Say the reading has lasted three hours. Answer: `मैं तीन घंटे से पढ़ रही
          हूँ।` Replace the number. `मैं दो घंटे पढ़ी` can report a finished
          duration instead."
  - subskill_id: event_sequence
    explanation: Giving cooking directions requires a clear order. `पहले` introduces
      the first action and `फिर` the next; both verbs are respectful imperatives
      addressed to the listener.
    examples:
      - text: पहले चावल धोइए, फिर पानी डालिए।
        meaning: First wash the rice, then add water. `चावल धोइए` asks the listener to
          wash the rice; `पानी डालिए` then asks them to add water. The sequence
          words make the order explicit.
        note: "Try changing the ingredient to lentils while keeping the order. Answer:
          `पहले दाल धोइए, फिर पानी डालिए।` Replace `चावल` with `दाल`; `पहले`
          still marks washing as the first step and `फिर` adding water as the
          next step."
  - subskill_id: event_phase
    explanation: After finishing a book, report completion rather than an ongoing
      reading. Verb stem plus `चुकी हूँ` presents the action as already finished
      for a female speaker.
    examples:
      - text: मैं किताब पढ़ चुकी हूँ।
        meaning: I have finished reading the book. `किताब पढ़` names reading the book.
          `चुकी हूँ` says that reading is complete and agrees with the female
          speaker; this construction has no agent `ने`.
        note: "Give the completed report as a male speaker. Answer: `मैं किताब पढ़ चुका
          हूँ।` Change `चुकी` to `चुका`. `मैं किताब पढ़ रही हूँ` says the
          reading is still happening."
