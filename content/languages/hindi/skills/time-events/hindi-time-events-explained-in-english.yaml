skill_id: time_events
explanation_language: english
shared_explanation: skills/time-events/time-events-explained-in-english.yaml
sections:
  - subskill_id: present_events
    explanation: A verb stem followed by रहा, रही or रहे and a present auxiliary describes ongoing
      activity. The progressive agrees with its subject.
    examples:
      - text: मैं अभी चाय बना रही हूँ।
        meaning: I am making tea now.
        note: रही marks a female speaker; a male speaker would use रहा. अभी places the activity now.
  - subskill_id: past_events
    explanation: Many transitive perfectives mark the agent with ने and agree with an object that
      has no blocking case marker. Learn lexical exceptions rather than attaching ने to every
      past verb.
    examples:
      - text: मैंने कल खिचड़ी बनाई।
        meaning: I made khichdi yesterday.
        note: बनाई agrees with feminine खिचड़ी. The perfective event makes कल refer to yesterday here,
          not tomorrow.
  - subskill_id: future_events
    explanation: A future verb can specify person and gender. कल receives its tomorrow reading from
      the future form and context.
    examples:
      - text: मैं कल आऊँगी।
        meaning: I will come tomorrow.
        note: आऊँगी is first-person feminine future. A male speaker would say आऊँगा.
  - subskill_id: duration_frequency
    explanation: A duration followed by से can measure how long an activity has continued. The
      ongoing Hindi construction need not copy the English present perfect.
    examples:
      - text: मैं दो घंटे से पढ़ रही हूँ।
        meaning: I have been reading for two hours.
        note: दो घंटे से gives elapsed duration; पढ़ रही हूँ says the female speaker is still reading.
  - subskill_id: event_sequence
    explanation: पहले and फिर can order steps. Polite imperatives let the speaker present a sequence
      for the listener to carry out.
    examples:
      - text: पहले चावल धोइए, फिर पानी डालिए।
        meaning: First wash the rice, then add water.
        note: धोइए and डालिए politely address the listener. The order of steps is explicit.
  - subskill_id: event_phase
    explanation: चुकना after a verb stem marks having completed an action. Its agreement is with the
      subject; this construction does not add ने to the agent.
    examples:
      - text: मैं किताब पढ़ चुकी हूँ।
        meaning: I have finished reading the book.
        note: चुकी identifies a female speaker and presents the reading as completed, rather than still
          in progress.
