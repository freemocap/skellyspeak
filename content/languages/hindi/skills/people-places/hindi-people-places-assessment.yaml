skill_id: people_places
guidance: "Identify descriptions, spatial relations, possession, quantities and comparisons, not
  just nouns. यह मेरी सहेली है identifies a relationship; यह गली सँकरी है attributes a quality.
  Postpositions follow their complements and may require oblique forms: कमरे में locates
  something in a room. मेरे पास दो टिकट हैं states possession and quantity, whereas मेरी बहन
  names a family relationship without पास. Possessives and variable adjectives agree with the
  relevant noun, not automatically with the speaker. यह गली दूसरी गली से सँकरी है compares
  width; से can mark other relations elsewhere. मेरी भाई, intended as an ordinary possessive
  phrase for my brother and with no other successful relationship, has incorrect agreement. Do
  not erase a separate correct location because of that error. कमरे में can supply a location
  contextually after an identifiable where-question. A name or number copied without
  identifying, counting or locating anything is absent. Honorific plural agreement can refer to
  one respected person."
