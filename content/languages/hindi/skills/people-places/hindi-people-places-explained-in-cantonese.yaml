sections:
  - subskill_id: identification
    explanation: 介紹朋友畀人識時，`यह` 指住對方，`मेरी सहेली` 交代關係。物主詞配合朋友名詞嘅性，唔係講者嘅性別。
    examples:
      - text: यह मेरी सहेली है।
        meaning: 呢位係我女性朋友。 `यह` 係呢位，`मेरी` 係陰性嘅「我嘅」，`सहेली` 係女性朋友；`है` 完成介紹。
        note: 試介紹哥哥或弟弟。答案：`यह मेरा भाई है।` `भाई` 係陽性，用 `मेरा`；`मेरी भाई` 配合錯。
  - subskill_id: qualities_states
    explanation: 有人問條巷點樣。`सँकरी` 講闊窄，因為 `गली` 係陰性，所以用陰性形。
    examples:
      - text: यह गली सँकरी है।
        meaning: 呢條巷窄。 `यह गली` 指呢條巷，`सँकरी है` 講佢窄；形容詞配合巷，唔係講者。
        note: 試講房間窄。答案：`यह कमरा सँकरा है।` 陽性 `कमरा` 配 `सँकरा`。單講地名冇交代特徵。
  - subskill_id: location_movement
    explanation: 你要講張椅喺邊。地點先於後置詞：`कमरे में` 係喺房入面；陽性 `कमरा` 喺 `में` 前變 `कमरे`。
    examples:
      - text: कुर्सी कमरे में है।
        meaning: 張椅喺間房入面。 `कुर्सी` 係椅，`कमरे में` 係位置，`है` 講佢喺嗰度；呢句冇講移動。
        note: 試講椅喺房外。答案：`कुर्सी कमरे के बाहर है।` `के बाहर` 係外面。`कमरा में` 少咗呢度要用嘅斜格
          `कमरे`。
  - subskill_id: possession_relations
    explanation: 喺售票處講自己已有乜。`मेरे पास` 指持有人；`दो टिकट` 係複數，所以句尾用 `हैं`。
    examples:
      - text: मेरे पास दो टिकट हैं।
        meaning: 我有兩張飛。 `मेरे पास` 係我有，`दो टिकट` 係兩張票，`हैं` 配合複數票；呢句唔係講親屬關係。
        note: 試講有一張票。答案：`मेरे पास एक टिकट है।` `दो` 換 `एक`，`हैं` 換單數 `है`。`मेरी बहन`
          只係親屬關係。
  - subskill_id: quantity_comparison
    explanation: 揀路時比較兩條巷。比較基準放喺 `से` 前；形容詞講第一條巷，配合陰性名詞。
    examples:
      - text: यह गली दूसरी गली से सँकरी है।
        meaning: 呢條巷比另一條窄。 `यह गली` 係要評估嘅巷，`दूसरी गली से` 係比另一條巷，`सँकरी है` 講第一條較窄。
        note: 試比較兩個房間。答案：`यह कमरा दूसरे कमरे से सँकरा है।` 房間係陽性，相關詞形都改；`से`
          標比較基準，唔係每次都解「比」。
