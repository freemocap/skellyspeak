shared_explanation: skills/people-places/people-places-explained-in-cantonese.yaml
sections:
  - subskill_id: identification
    explanation: यह 引入人物，關係名詞前嘅物主形式交代佢同講者嘅關係，再由繫詞連接。
    examples:
      - text: यह मेरी सहेली है।
        meaning: 呢位係我女性朋友。
        note: मेरी 配合陰性 सहेली，唔係表示講者性別。
  - subskill_id: qualities_states
    explanation: 可變形形容詞要配合被描述名詞；用 है 描述特徵，唔一定涉及動作。
    examples:
      - text: यह गली सँकरी है।
        meaning: 呢條巷窄。
        note: सँकरी 配合陰性 गली，交代物理特徵。
  - subskill_id: location_movement
    explanation: में 跟喺位置詞後面。以 आ 結尾嘅陽性名詞，喺呢個後置詞前通常轉成斜格。
    examples:
      - text: कुर्सी कमरे में है।
        meaning: 張椅喺間房入面。
        note: कमरा 喺 में 前變成 कमरे；句子交代椅子位置。
  - subskill_id: possession_relations
    explanation: 擁有人加 के पास 常表示持有物件；講自己用 मेरे पास。親屬關係亦可用物主短語，唔係每次要 पास。
    examples:
      - text: मेरे पास दो टिकट हैं।
        meaning: 我有兩張飛。
        note: हैं 配合複數 टिकट；मेरे 指擁有人。
  - subskill_id: quantity_comparison
    explanation: 比較標準後面加 से，再用配合被比較物嘅形容詞，唔需要英文式比較級詞尾。
    examples:
      - text: यह गली दूसरी गली से सँकरी है।
        meaning: 呢條巷比另一條窄。
        note: दूसरी गली से 指比較標準；सँकरी 描述 यह गली。
