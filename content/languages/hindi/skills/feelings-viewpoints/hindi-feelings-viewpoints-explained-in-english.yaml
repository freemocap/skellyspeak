sections:
  - subskill_id: wants_intentions
    explanation: You are telling a friend about a personal goal. `तैरना सीखना` names
      learning to swim, and `चाहती हूँ` expresses a female speaker’s desire to
      do it.
    examples:
      - text: मैं तैरना सीखना चाहती हूँ।
        meaning: I want to learn to swim. `तैरना` is to swim, `सीखना` to learn, and
          `चाहती हूँ` I want. The two infinitives keep the desired activity
          distinct from the wanting verb.
        note: "Say a male speaker wants to learn to swim. Answer: `मैं तैरना सीखना चाहता
          हूँ।` Only the gendered wanting form changes. A desire does not by
          itself promise to enrol."
  - subskill_id: preferences
    explanation: When choosing a drink, compare tea with coffee. `मुझे` identifies
      the person who likes it; `कॉफ़ी से ज़्यादा` sets coffee as the comparison
      standard.
    examples:
      - text: मुझे कॉफ़ी से ज़्यादा चाय पसंद है।
        meaning: I like tea more than coffee. `चाय पसंद है` says tea is liked, and
          `कॉफ़ी से ज़्यादा` says more than coffee. Tea is the preferred option,
          not the comparison baseline.
        note: "Prefer coffee to tea. Answer: `मुझे चाय से ज़्यादा कॉफ़ी पसंद है।`
          Exchange the two drink positions. `मुझे चाय पसंद है` gives liking
          without a comparison."
  - subskill_id: emotions
    explanation: You have just heard good news and explain your reaction. `इस ख़बर
      से` links the news to your happiness; `खुश` itself does not change with
      the speaker’s gender.
    examples:
      - text: मैं इस ख़बर से खुश हूँ।
        meaning: I am happy about this news. `मैं` is the person feeling it, `इस ख़बर
          से` identifies the news, and `खुश हूँ` says I am happy. The sentence
          reports an emotion, not a judgment about whether the news is correct.
        note: "Say you are sad about this news. Answer: `मैं इस ख़बर से दुखी हूँ।`
          Replace the emotion. `यह ख़बर अच्छी है` evaluates the news instead of
          naming your feeling."
  - subskill_id: opinions
    explanation: In a planning discussion, you offer your assessment of a proposal.
      `मेरे ख़याल से` marks the following claim as your view; `अच्छी` agrees
      with feminine `योजना`.
    examples:
      - text: मेरे ख़याल से यह योजना अच्छी है।
        meaning: In my opinion, this plan is good. `यह योजना` is this plan and `अच्छी
          है` says it is good. The opening phrase tells whose judgment this is.
        note: "Say you think the plan is bad. Answer: `मेरे ख़याल से यह योजना अच्छी नहीं
          है।` Negate the evaluation. `यह योजना अच्छी है` omits the explicit
          viewpoint marker."
  - subskill_id: agreement_disagreement
    explanation: After hearing a partner’s opinion, you can politely state
      opposition. `आपसे` names whose position you address, and `नहीं` negates
      `सहमत`.
    examples:
      - text: मैं आपसे सहमत नहीं हूँ।
        meaning: I do not agree with you. `मैं` identifies your stance and `आपसे सहमत
          नहीं हूँ` means I do not agree with you. The sentence opposes a view;
          it does not say you failed to understand it.
        note: "State agreement instead. Answer: `मैं आपसे सहमत हूँ।` Remove `नहीं`. `अब
          समझ में आया` says you now understand, which need not mean agreement."
