sections:
  - subskill_id: wants_intentions
    explanation: चाहना 前面嘅不定式交代想做嘅事；चाहना 習慣式要配合想做嘅人。
    examples:
      - text: मैं तैरना सीखना चाहती हूँ।
        meaning: 我想學游水。
        note: सीखना चाहती हूँ 表示女性講者願望；男性用 चाहता，唔係 चाहती。
  - subskill_id: preferences
    explanation: पसंद 結構入面，मुझे 指有喜好嘅人；ज़्यादा 加比較短語可以指出較鍾意選項。
    examples:
      - text: मुझे कॉफ़ी से ज़्यादा चाय पसंद है।
        meaning: 比起咖啡，我更鍾意茶。
        note: कॉफ़ी से 交代比較對象，चाय 係較鍾意嘅嘢。
  - subskill_id: emotions
    explanation: खुश 配合現在時繫詞描述開心；से 短語可以交代感受涉及乜。
    examples:
      - text: मैं इस ख़बर से खुश हूँ।
        meaning: 呢個消息令我開心。
        note: इस ख़बर से 連結消息同開心；खुश 唔會按講者性別變形。
  - subskill_id: opinions
    explanation: मेरे ख़याल से 引入講者評價，表明後面係個人判斷。
    examples:
      - text: मेरे ख़याल से यह योजना अच्छी है।
        meaning: 我覺得呢個計劃好。
        note: अच्छी 配合陰性 योजना；開頭短語標示觀點來源。
  - subskill_id: agreement_disagreement
    explanation: सहमत 配合 से 表示同意某人或立場；नहीं 否定同意，唔代表聽唔到。
    examples:
      - text: मैं आपसे सहमत नहीं हूँ।
        meaning: 我唔同意你。
        note: 對方講咗意見之後用；आपसे 指持有被反對立場嘅人。
