sections:
  - subskill_id: wants_intentions
    explanation: 同朋友講個人目標。`तैरना सीखना` 係學游水，`चाहती हूँ` 表示女性講者想做。
    examples:
      - text: मैं तैरना सीखना चाहती हूँ।
        meaning: 我想學游水。 `तैरना` 係游水，`सीखना` 係學，`चाहती हूँ` 係我想；兩個不定式同想做嘅動詞各有作用。
        note: 試用男性講者講想學游水。答案：`मैं तैरना सीखना चाहता हूँ।` 只換想做嘅性別形。想做唔等於已承諾報名。
  - subskill_id: preferences
    explanation: 揀飲品時比較茶同咖啡。`मुझे` 係有喜好嘅人；`कॉफ़ी से ज़्यादा` 設咖啡為比較基準。
    examples:
      - text: मुझे कॉफ़ी से ज़्यादा चाय पसंद है।
        meaning: 比起咖啡，我更鍾意茶。 `चाय पसंद है` 係鍾意茶，`कॉफ़ी से ज़्यादा` 係比咖啡更；茶先係較鍾意嗰樣。
        note: 試改成較鍾意咖啡。答案：`मुझे चाय से ज़्यादा कॉफ़ी पसंद है।` 交換兩種飲品位置。`मुझे चाय पसंद
          है` 只講鍾意，冇比較。
  - subskill_id: emotions
    explanation: 啱啱聽到好消息，你講自己感受。`इस ख़बर से` 將消息連到開心；`खुश` 唔跟講者性別變。
    examples:
      - text: मैं इस ख़बर से खुश हूँ।
        meaning: 呢個消息令我開心。 `मैं` 係感受者，`इस ख़बर से` 係相關消息，`खुश हूँ` 係我開心；呢句講情緒，唔係判斷消息真偽。
        note: 試講為消息難過。答案：`मैं इस ख़बर से दुखी हूँ।` 換情緒。`यह ख़बर अच्छी है`
          係評價消息，冇直接講自己感受。
  - subskill_id: opinions
    explanation: 傾計劃時講自己評價。`मेरे ख़याल से` 標後面係你嘅睇法；`अच्छी` 配陰性 `योजना`。
    examples:
      - text: मेरे ख़याल से यह योजना अच्छी है।
        meaning: 我覺得呢個計劃好。 `यह योजना` 係呢個計劃，`अच्छी है` 係好；開頭短語指出判斷屬於邊個。
        note: 試講你覺得計劃唔好。答案：`मेरे ख़याल से यह योजना अच्छी नहीं है।` 否定評價。單講 `यह योजना
          अच्छी है` 冇明示個人觀點來源。
  - subskill_id: agreement_disagreement
    explanation: 聽完對方意見，你可以有禮貌講唔同意。`आपसे` 指對方立場，`नहीं` 否定 `सहमत`。
    examples:
      - text: मैं आपसे सहमत नहीं हूँ।
        meaning: 我唔同意你。 `मैं` 指自己立場，`आपसे सहमत नहीं हूँ` 係我唔同意你；唔係話聽唔明。
        note: 試改成同意。答案：`मैं आपसे सहमत हूँ।` 拿走 `नहीं`。`अब समझ में आया` 係明白咗，未必同意。
