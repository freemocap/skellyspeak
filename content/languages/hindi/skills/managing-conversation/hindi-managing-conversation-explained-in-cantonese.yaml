sections:
  - subskill_id: opening_closing
    explanation: नमस्ते 可以問候或道別；提到下次見面可以清楚標示結束。
    examples:
      - text: नमस्ते, फिर मिलेंगे।
        meaning: 再見，下次見。
        note: 探訪結束時，फिर मिलेंगे 提到再見，並結束今次交流。
  - subskill_id: acknowledging
    explanation: अच्छा 配合理解用語，可以表示收到解釋，唔必定贊同。
    examples:
      - text: अच्छा, अब समझ में आया।
        meaning: 哦，我而家明喇。
        note: 難點解釋清楚之後用；समझ में आया 表示達到理解。
  - subskill_id: clarification
    explanation: 尊稱祈使句加 दोबारा 要求再講；上文交代邊段聽唔清或唔明。
    examples:
      - text: ज़रा दोबारा कहिए।
        meaning: 唔該再講一次。
        note: 聽唔清之後用；कहिए 尊稱對方，ज़रा 令請求柔和啲。
  - subskill_id: rephrasing
    explanation: यानी 引入另一個等義講法，後面要真係有幫助理解嘅重述，唔係只加標記。
    examples:
      - text: यानी, हम शाम तक रुक सकते हैं।
        meaning: 即係話，我哋可以留到傍晚。
        note: 重述可以留低過埋下晝嘅許可；शाम तक 明示終點。
  - subskill_id: correcting_misunderstanding
    explanation: मेरा मतलब 指原意，नहीं 排除錯誤選項；修正可以好簡短。
    examples:
      - text: मेरा मतलब बुधवार था, मंगलवार नहीं।
        meaning: 我意思係星期三，唔係星期二。
        note: 對方理解成星期二時用；था 配合陽性 मतलब。
  - subskill_id: turns_topics
    explanation: 第一人稱虛擬式問句可以要求發言空間，功能由目前輪次情境決定。
    examples:
      - text: क्या मैं एक बात कहूँ?
        meaning: 我可唔可以講兩句？
        note: 討論中要求發言；कहूँ 係第一人稱虛擬式，唔係聲稱識講嘢。
