sections:
  - subskill_id: opening_closing
    explanation: At the end of a visit, `नमस्ते` can take leave and `फिर मिलेंगे`
      looks toward another meeting. Position in the exchange makes this a
      closing.
    examples:
      - text: नमस्ते, फिर मिलेंगे।
        meaning: Goodbye; see you again. `फिर` means again and `मिलेंगे` means we will
          meet. Together with `नमस्ते`, the speaker ends this encounter and
          anticipates another.
        note: "Close without promising another meeting. Answer: `नमस्ते।` It can serve
          as a leave-taking in this setting. The same word at the start of a
          visit opens contact."
  - subskill_id: acknowledging
    explanation: A partner has explained a difficult point. `अच्छा` signals
      reception, and `अब समझ में आया` says understanding has arrived now.
    examples:
      - text: अच्छा, अब समझ में आया।
        meaning: Oh, now I understand. `अब` means now and `समझ में आया` means it became
          clear. The reply acknowledges comprehension; it does not automatically
          endorse the partner’s opinion.
        note: "Acknowledge that it is still unclear. Answer: `अच्छा, अभी समझ में नहीं
          आया।` Add negation to the understanding claim. `मैं सहमत हूँ` says I
          agree, a different response."
  - subskill_id: clarification
    explanation: When you miss what was just said, ask the partner to repeat it.
      `ज़रा` softens the request, `दोबारा` says again, and `कहिए` is a
      respectful imperative.
    examples:
      - text: ज़रा दोबारा कहिए।
        meaning: Please say that again. `ज़रा दोबारा कहिए` asks for another utterance.
          It repairs a hearing gap, while a question about `मतलब` would ask for
          meaning.
        note: "Ask for the meaning instead. Answer: `इसका मतलब क्या है?` That targets
          interpretation. If the sound was missed, keep `ज़रा दोबारा कहिए।`"
  - subskill_id: rephrasing
    explanation: The partner is unsure what an earlier permission means. `यानी`
      introduces a restatement that makes the practical endpoint explicit.
    examples:
      - text: यानी, हम शाम तक रुक सकते हैं।
        meaning: In other words, we can stay until evening. `हम शाम तक रुक सकते हैं`
          says we can stay until evening. `यानी` connects this to a prior
          statement with the same practical meaning; it is not enough by itself.
        note: "Suppose the earlier permission explicitly ended at five o’clock. Restate
          that endpoint: `यानी, हम पाँच बजे तक रुक सकते हैं।` The restatement is
          equivalent only because the original deadline was five; changing an
          earlier deadline would be a correction."
  - subskill_id: correcting_misunderstanding
    explanation: The listener heard Tuesday, but you intended Wednesday. `मेरा मतलब`
      identifies your intended meaning; `मंगलवार नहीं` explicitly excludes the
      mistaken day.
    examples:
      - text: मेरा मतलब बुधवार था, मंगलवार नहीं।
        meaning: I meant Wednesday, not Tuesday. `बुधवार था` says Wednesday was intended
          and `मंगलवार नहीं` says not Tuesday. `था` agrees with masculine
          `मतलब`, not with a speaker’s gender.
        note: "Correct Thursday to Friday. Answer: `मेरा मतलब शुक्रवार था, गुरुवार
          नहीं।` State both intended and mistaken days so the repair is clear."
  - subskill_id: turns_topics
    explanation: During a group discussion, you want a turn to speak. `क्या` opens a
      yes or no question and `कहूँ` proposes the speaker’s own contribution.
    examples:
      - text: क्या मैं एक बात कहूँ?
        meaning: May I say something? `एक बात` is one point or thing to say. `क्या मैं
          ... कहूँ?` asks for space in the conversation, rather than describing
          speaking ability.
        note: "Ask to pose one question. Answer: `क्या मैं एक सवाल पूछूँ?` Change the
          contribution to a question. `मैं एक बात कहूँगा` announces a future act
          without asking for a turn."
