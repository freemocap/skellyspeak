skill_id: managing_conversation
guidance: Evaluate greetings and leave-taking, reception, clarification, reformulation,
  correction and turn or topic management in their place in the exchange. नमस्ते can open or
  close contact; repeating it as a vocabulary item does neither. अच्छा after an explanation can
  register receipt without endorsing an opinion. दोबारा कहिए requests repetition when hearing or
  interpretation failed; इसका मतलब क्या है? targets meaning. मेरा मतलब बुधवार था, मंगलवार नहीं
  corrects a mistaken interpretation. यानी introduces a reformulation only when its following
  content preserves or clarifies the prior meaning. A copied यानी with no recoverable
  reformulation is absent. क्या मैं एक बात कहूँ? can seek the floor, not permission for a
  physical ability demonstration. Short formulaic contributions can be complete conversational
  acts. Use the previous exchange to distinguish acknowledgment from agreement and action
  acceptance; do not infer those stronger functions merely from a polite affirmative response.
