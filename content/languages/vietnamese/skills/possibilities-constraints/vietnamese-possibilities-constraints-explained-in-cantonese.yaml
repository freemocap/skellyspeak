sections:
  - subskill_id: ability
    explanation: Biết後接活動，可以表達識做嗰件事。
    examples:
      - text: Tôi biết sửa xe đạp.
        meaning: 我識整單車。
        note: 呢度biết講學識嘅技能，唔係知道某個事實。
  - subskill_id: permission
    explanation: 動作後加được không，可以請求許可。
    examples:
      - text: Tôi để túi ở đây được không?
        meaning: 我可唔可以放個袋喺度？
        note: 向管理地方嘅人詢問，確立許可語境。
  - subskill_id: obligation
    explanation: 動作前面嘅phải表達要求。
    examples:
      - text: Tôi phải trả chìa khóa hôm nay.
        meaning: 我今日一定要還鎖匙。
        note: Hôm nay交代限期，phải令行動成為必要。
  - subskill_id: possibility
    explanation: Có thể可以將整個命題限定為可能。
    examples:
      - text: Có thể chiều nay trời sẽ mưa.
        meaning: 今日下晝可能落雨。
        note: 即使用咗將來標記sẽ，結果仍然未肯定。
  - subskill_id: certainty
    explanation: Không chắc明確表示對命題冇十足把握。
    examples:
      - text: Tôi không chắc cửa hàng còn mở cửa.
        meaning: 我唔肯定間舖頭係咪仲開緊。
        note: 講者冇斷言舖頭閂咗。
