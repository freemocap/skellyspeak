skill_id: possibilities_constraints
guidance: Recognize ability, permission, necessity, possibility and confidence. Biết sửa xe đạp
  can describe knowing how to repair bicycles; có thể and được have several context-dependent
  modal or resultative functions. Tôi để túi ở đây được không? asks permission in a suitable
  setting. Phải trả chìa khóa gives a requirement, while không cần removes need and không được
  may prohibit an action. Có thể trời sẽ mưa presents a possible outcome. Không chắc limits
  confidence. Được can grant an earlier permission request contextually. A copied modal with no
  recoverable action is absent. A polite được không request does not necessarily establish a
  factual ability assertion. If ability and practical opportunity are both plausible successful
  meanings, subtype ambiguity alone is not unclear group use. Do not infer certainty or
  obligation from the presence of a future marker alone.
