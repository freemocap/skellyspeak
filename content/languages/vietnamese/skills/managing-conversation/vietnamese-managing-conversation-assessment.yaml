skill_id: managing_conversation
guidance: Recognize greetings or closings, acknowledgement, clarification, reformulation,
  correction of misunderstanding and turn or topic management. Hẹn gặp lại closes contact. Bây
  giờ tôi hiểu rồi acknowledges comprehension without necessarily agreeing. Bạn nói lại được
  không? asks for repetition; Nói cách khác signals a rephrasing. Ý tôi là thứ bảy, không phải
  thứ sáu repairs a mistaken interpretation. Chúng ta chuyển sang câu hỏi khác nhé proposes a
  topic transition. A greeting quoted in a vocabulary list is absent as actual interactional
  work. A short vâng or dạ can acknowledge a particular contribution contextually; its social
  meaning depends on the relationship. Do not treat every question as repair or demand a pronoun
  where the context permits omission. Preserve ordinary regional vocabulary and tone
  distinctions without pretending textual evidence establishes pronunciation.
