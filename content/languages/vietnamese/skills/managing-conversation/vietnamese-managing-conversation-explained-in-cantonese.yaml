sections:
  - subskill_id: opening_closing
    explanation: Hẹn gặp lại結束交談，並表達預期再見。
    examples:
      - text: Hẹn gặp lại tuần sau!
        meaning: 下星期見！
        note: 道別語交代下次預期接觸。
  - subskill_id: acknowledging
    explanation: Hiểu rồi確認已經理解。
    examples:
      - text: À, bây giờ tôi hiểu rồi.
        meaning: 哦，我而家明喇。
        note: 解釋後用，唔一定認同講者意見。
  - subskill_id: clarification
    explanation: 問句配合nói lại，請人重複前面發言。
    examples:
      - text: Bạn nói lại được không?
        meaning: 可唔可以再講一次？
        note: 例子用bạn稱呼同輩；前面發言交代要重複乜。
  - subskill_id: rephrasing
    explanation: Nói cách khác引出另一種講法。
    examples:
      - text: Nói cách khác, cần đặt lịch trước.
        meaning: 即係話，你要預先訂位。
        note: 解釋訂位程序後用。
  - subskill_id: correcting_misunderstanding
    explanation: Ý tôi là指出原意，可以同錯誤理解作對比。
    examples:
      - text: Ý tôi là thứ bảy, không phải thứ sáu.
        meaning: 我係指星期六，唔係星期五。
        note: 講者更正原本指邊一日。
  - subskill_id: turns_topics
    explanation: 提議可以管理對話轉換。
    examples:
      - text: Chúng ta chuyển sang câu hỏi khác nhé.
        meaning: 不如轉去另一條問題。
        note: 要求嘅行動關乎討論本身。
