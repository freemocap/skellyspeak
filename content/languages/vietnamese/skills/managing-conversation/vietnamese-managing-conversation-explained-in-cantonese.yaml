sections:
  - subskill_id: opening_closing
    explanation: 你結束見面，預期下星期再見。`Hẹn gặp lại` 係再見嘅結語，`tuần sau` 指下星期。`Gặp` 係見面，`lại` 表示再，`sau`
      跟喺星期後面指下一個。唔加 `tuần sau` 嘅 `Hẹn gặp lại!` 就冇定日期。道別可以預期下次見面，但唔等於已經約好確切時間；具體約會仲需要更多資料。
    examples:
      - text: Hẹn gặp lại tuần sau!
        meaning: 下星期見！
        note: 試下道別但唔指定邊個星期。`Hẹn gặp lại!` 可以；刪走時間片語保留再見，但下次見面時間未定。
  - subskill_id: acknowledging
    explanation: 對方解釋之後你終於明白，表示理解有咗變化。`À` 標示領會，`bây giờ` 係而家，`tôi hiểu` 係我明白。句尾 `rồi`
      表達達到咗明白呢個狀態。`Tôi hiểu rồi` 可以只確認理解，未必同意對方意見；`tôi đồng ý` 先係同意。`Rồi`
      唔只係過去式標籤，呢句有而家，係講已經達到嘅狀態。
    examples:
      - text: À, bây giờ tôi hiểu rồi.
        meaning: 哦，我而家明喇。
        note: 試下講仲未明。`Tôi chưa hiểu.` 可以；`chưa` 放喺 `hiểu` 前面表示未，唔再保留已達到狀態嘅 `rồi`。
  - subskill_id: clarification
    explanation: 你聽唔清楚同輩講咗乜，請佢重講。`Bạn` 稱呼對方，`nói lại` 係再講，`được không?`
      問可唔可以。喺呢度係請人重複，唔係測試講嘢能力；`lại` 係再一次意思嘅重要部分。重聽可以解決聽唔清楚；如果係字詞本身唔明，`“Tạm thời” nghĩa là gì?`
      就問對方講臨時係乜意思。
    examples:
      - text: Bạn nói lại được không?
        meaning: 可唔可以再講一次？
        note: 試下用 `chậm hơn` 請同輩慢啲重講。`Bạn nói lại chậm hơn được không?` 可以；`lại` 保留重複，`chậm hơn` 加上慢啲。
  - subskill_id: rephrasing
    explanation: 預約解釋有啲長，你用較簡單嘅說法講實際意思。`Nói cách khác` 係換句話講，`cần` 表達需要，`đặt lịch` 係安排預約，`trước`
      係事先。邊個要預約可以由對話提供。呢度 `trước` 冇明講另一件事，`trước khi đến` 就清楚講到達之前。開頭表示重述，所以後面應該保留原有要求。
    examples:
      - text: Nói cách khác, cần đặt lịch trước.
        meaning: 即係話，你要預先訂位。
        note: 試下講清楚要到達之前預約。`Nói cách khác, cần đặt lịch trước khi đến.` 可以；`trước khi đến`
          澄清次序，冇換成另一個要求。
  - subskill_id: correcting_misunderstanding
    explanation: 對方理解成星期五，但你指星期六。`Ý tôi là` 係我意思係，`thứ bảy` 提供正確日期，`không phải thứ sáu` 排除星期五。`Không
      phải` 可以否定身份或者識別；普通動作否定可以直接用 `không`，例如 `Tôi không đến`。呢個更正同時講正確同誤會咗嘅資料，對方唔使估邊一點要改。
    examples:
      - text: Ý tôi là thứ bảy, không phải thứ sáu.
        meaning: 我係指星期六，唔係星期五。
        note: 試下將星期六更正為星期日。`Ý tôi là chủ nhật, không phải thứ bảy.` 可以；正確日期放喺 `là` 後面，誤會咗嗰日放喺 `không
          phải` 後面。
  - subskill_id: turns_topics
    explanation: 目前問題討論過，你提議大家轉去另一條。`Chúng ta` 包括聽者，`chuyển sang` 係轉去，`câu hỏi khác` 係另一條問題。`Khác`
      放喺佢修飾嘅名詞片語後面。句尾 `nhé` 喺對話入面請大家合作。淨係講 `câu hỏi khác` 唔會交代大家要做乜；之前問題已處理好或者轉話題需要清楚時，呢個轉接較自然。
    examples:
      - text: Chúng ta chuyển sang câu hỏi khác nhé.
        meaning: 不如轉去另一條問題。
        note: 試下用 `chủ đề khác` 提議轉去另一個話題。`Chúng ta chuyển sang chủ đề khác nhé.` 可以；要換嘅改成話題，而合作式轉接保留。
