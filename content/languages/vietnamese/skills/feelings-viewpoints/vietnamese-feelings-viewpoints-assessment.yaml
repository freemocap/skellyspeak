skill_id: feelings_viewpoints
guidance: Assess desire, preference, emotion, opinion and agreement. Muốn học may express
  wanting to learn; it does not promise an action. Thích trà hơn cà phê compares preferences.
  Vui khi nghe tin này expresses an emotional response, while Tôi nghĩ introduces a personal
  judgment. Không đồng ý rejects a proposition or proposal. Hiểu rồi acknowledges comprehension
  and does not necessarily indicate agreement. Trà can answer a preference question
  contextually; the same noun in a stock list is not liking. A copied muốn without a recoverable
  wanted action is absent. Do not treat every factual assertion as opinion or every future plan
  as desire. Vietnamese does not require adjectival gender agreement or là before ordinary
  emotional predicates. Judge the stance-bearing construction in context and preserve socially
  appropriate alternatives to tôi and bạn.
