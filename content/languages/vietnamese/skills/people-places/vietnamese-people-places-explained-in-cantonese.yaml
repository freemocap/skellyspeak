sections:
  - subskill_id: identification
    explanation: Là將對象連到識別名詞短語。
    examples:
      - text: Đây là hàng xóm của tôi.
        meaning: 呢位係我鄰居。
        note: Của tôi將鄰居連到講者；句子冇指定性別。
  - subskill_id: qualities_states
    explanation: 形容詞可以直接表達性質，唔加là。
    examples:
      - text: Con đường này hẹp.
        meaning: 呢條路好窄。
        note: Này跟喺名詞短語後；hẹp交代性質。
  - subskill_id: location_movement
    explanation: Ở配合位置短語交代物件喺邊。
    examples:
      - text: Chìa khóa ở trên bàn.
        meaning: 鎖匙喺張枱上面。
        note: Trên bàn指出承托物件嘅表面。
  - subskill_id: possession_relations
    explanation: Có表示擁有；數物件時可以用量詞。
    examples:
      - text: Tôi có hai cái ghế gấp.
        meaning: 我有兩張摺凳。
        note: Hai cái ghế gấp數所擁有嘅凳；名詞冇複數詞尾。
  - subskill_id: quantity_comparison
    explanation: Hơn引出同另一件物件嘅比較。
    examples:
      - text: Cái hộp này nhẹ hơn cái kia.
        meaning: 呢個箱比嗰個輕。
        note: Cái kia指另一個箱，唔使重複hộp。
