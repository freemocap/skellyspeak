sections:
  - subskill_id: identification
    explanation: Là links a referent to an identifying noun phrase.
    examples:
      - text: Đây là hàng xóm của tôi.
        meaning: This is my neighbour.
        note: Của tôi relates the neighbour to the speaker; the sentence does not specify gender.
  - subskill_id: qualities_states
    explanation: An adjective can directly predicate a property without là.
    examples:
      - text: Con đường này hẹp.
        meaning: This road is narrow.
        note: Này follows the noun phrase and hẹp supplies its property.
  - subskill_id: location_movement
    explanation: Ở and a positional phrase locate an object.
    examples:
      - text: Chìa khóa ở trên bàn.
        meaning: The key is on the table.
        note: Trên bàn identifies the supporting surface.
  - subskill_id: possession_relations
    explanation: Có states possession, and a classifier can accompany a counted object.
    examples:
      - text: Tôi có hai cái ghế gấp.
        meaning: I have two folding chairs.
        note: Hai cái ghế gấp counts the possessed chairs; the noun has no plural ending.
  - subskill_id: quantity_comparison
    explanation: Hơn introduces the comparison with another item.
    examples:
      - text: Cái hộp này nhẹ hơn cái kia.
        meaning: This box is lighter than that one.
        note: Cái kia refers to the other box without repeating hộp.
