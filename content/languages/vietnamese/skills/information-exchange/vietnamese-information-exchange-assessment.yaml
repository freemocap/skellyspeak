schema_version: 1
revision: vietnamese-skills-2026-10-04
language: vietnamese
skill_id: information_exchange
guidance: Assess meaningful information questions, relevant answers, factual confirmation and
  useful detail. Cửa hàng đóng cửa lúc mấy giờ? asks a closing time without English-style
  inversion. Lúc năm giờ answers that question contextually. Cửa hàng đóng cửa lúc năm giờ, đúng
  không? checks a proposed fact. Bạn giúp tôi được không? normally requests help rather than
  merely asking about capability. Cửa vào ở phía sân supplies an entrance location when that is
  needed. An isolated copied gì without an identifiable question is absent; extra words alone do
  not prove useful detail. Bạn nói vậy nghĩa là gì? asks for interpretation of a contribution
  rather than confirming an external schedule. Respect ordinary brief answers and
  relationship-sensitive address terms. Do not invent omitted referents or treat a socially
  different but intelligible pronoun choice as failure of every informational function.
