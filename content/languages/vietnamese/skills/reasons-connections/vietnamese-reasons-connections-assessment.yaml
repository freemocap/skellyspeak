language: vietnamese
skill_id: reasons_connections
guidance: Assess causes, consequences, conditions, contrast and support for claims. Vì
  introduces a reason and nên can connect it to a consequence. Nếu and thì can establish a
  condition and its outcome; neither an English tense pattern nor verb conjugation is required.
  Nhưng contrasts properties, while sau đó can merely order events. Để normally introduces a
  purpose in an appropriate construction, not an already realized cause. An illuminated window
  can be evidence for an occupancy claim without causing occupancy. Vì trời mưa can answer an
  identifiable why-question contextually. A copied connector with no recoverable related
  propositions is absent. Judge whether the stated evidence supports the actual inference. Do
  not count any pair of sentences as reasoning, and do not reject an ordinary combination such
  as vì with nên solely because its literal English translation sounds redundant.
