skill_id: time_events
guidance: Judge present, past and future reference, duration or recurrence, ordering and phases
  without demanding verb conjugation. Tôi đang sửa xe đạp presents an ongoing activity; hôm qua
  can anchor a repair in the past without mandatory đã. Sẽ can mark future reference, but a
  clear future time phrase may suffice. Đã and rồi have aspectual or discourse uses and are not
  mechanical replacements for English tense endings. Mỗi tuần hai lần gives frequency; hai giờ
  can measure duration. Trước tiên and sau đó order actions, while đọc xong marks finishing
  reading. Hôm qua can answer a recoverable when-question contextually. A copied particle
  without an identifiable event is absent. A timeless property assertion does not establish
  temporal organization. Judge the meaning created by particles, time phrases and context,
  preserving natural omission rather than requiring all available markers.
