skill_id: time_events
explanation_language: english
shared_explanation: skills/time-events/time-events-explained-in-english.yaml
sections:
  - subskill_id: present_events
    explanation: Someone asks what you are doing now while you work on a bicycle. `Tôi` identifies
      you; `đang` before `sửa` marks the repair as in progress, and `xe đạp` names the bicycle.
      `Tôi sửa xe đạp` without the marker can describe the work in a suitable context, but is
      less explicit about its unfolding now. `Đang` is not an ending attached to the verb; it
      remains a separate word when the person or activity changes.
    examples:
      - text: Tôi đang sửa xe đạp.
        meaning: I am repairing a bicycle.
        note: "Say your group is repairing a bicycle now. `Chúng tôi đang sửa xe đạp.` works: `chúng
          tôi` changes the workers to we excluding the listener, while `đang sửa` stays
          unchanged."
  - subskill_id: past_events
    explanation: You recall yesterday's bicycle repair. `Hôm qua` means yesterday and anchors `tôi
      sửa xe đạp` in the past. `Sửa` itself is the same repair word used for present or future
      contexts; Vietnamese does not conjugate it into a past form. A past time phrase can make
      an additional marker unnecessary. `Tôi đã sửa xe đạp rồi` can instead emphasize that the
      repair has already been done. It adds an achieved-action reading rather than merely
      replacing yesterday with a past suffix.
    examples:
      - text: Hôm qua tôi sửa xe đạp.
        meaning: Yesterday I repaired a bicycle.
        note: "Report the same activity yesterday for your group. `Hôm qua chúng tôi sửa xe đạp.` works:
          the past anchor remains and only the person phrase changes."
  - subskill_id: future_events
    explanation: You have a plan to collect replacement parts tomorrow. `Ngày mai` gives tomorrow;
      `tôi sẽ` means I will, and `đi lấy phụ tùng` means go to collect the parts. `Đi` supplies
      going and `lấy` supplies collecting; together they form the planned activity. `Sẽ` stays
      before the action phrase, with no future ending added to either verb. With an explicit
      future context the marker may be omitted, but here it makes the forward-looking plan
      clear.
    examples:
      - text: Ngày mai tôi sẽ đi lấy phụ tùng.
        meaning: Tomorrow I will go and collect the parts.
        note: "Plan the collection for your group. `Ngày mai chúng tôi sẽ đi lấy phụ tùng.` works: only
          the person phrase changes; `sẽ đi lấy` remains the future activity."
  - subskill_id: duration_frequency
    explanation: "You explain how often you swim as part of your routine. `Mỗi tuần` means each
      week; `tôi đi bơi` means I go swimming, and `hai lần` counts two occasions. The weekly
      interval and occasion count work together to express twice a week. `Lần` is an occasion,
      not an hour: `hai tiếng` would give two hours. `Mỗi tháng` changes the interval to every
      month. The verb `bơi` does not need a habitual ending."
    examples:
      - text: Mỗi tuần tôi đi bơi hai lần.
        meaning: I go swimming twice a week.
        note: "Say you swim three times a week. `Mỗi tuần tôi đi bơi ba lần.` works: `ba lần` changes
          the occasion count without changing the weekly interval."
  - subskill_id: event_sequence
    explanation: You explain the order of preparing food. `Trước tiên` means first and introduces
      `rửa tay`, wash hands. `Sau đó` means after that or then and introduces `chuẩn bị rau`,
      prepare the vegetables. The person following the instructions is understood, so no subject
      is needed here. These phrases order two actions without asserting that the first causes
      the second. `Trước khi chuẩn bị rau, rửa tay` expresses the same ordering as wash your
      hands before preparing the vegetables.
    examples:
      - text: Trước tiên rửa tay, sau đó chuẩn bị rau.
        meaning: First wash your hands, then prepare the vegetables.
        note: "After washing hands, give cooking as the second step, using `nấu ăn`. `Trước tiên rửa
          tay, sau đó nấu ăn.` works: the order words remain and only the second action
          changes."
  - subskill_id: event_phase
    explanation: You have reached the last page of a book and report that the reading is complete.
      `Tôi đọc` means I read; `xong` after the action marks finishing, and `cuốn sách` names the
      book with classifier `cuốn`. Final `rồi` presents the completion as achieved. `Tôi đang
      đọc cuốn sách` instead describes reading in progress. Simply stopping, `Tôi ngừng đọc`,
      does not guarantee you reached the end. `Xong` expresses the endpoint of the activity
      rather than just putting it in the past.
    examples:
      - text: Tôi đọc xong cuốn sách rồi.
        meaning: I have finished reading the book.
        note: "Say your group has finished reading the book. `Chúng tôi đọc xong cuốn sách rồi.` works:
          the readers change, but `đọc xong` and `rồi` keep the achieved completion."
