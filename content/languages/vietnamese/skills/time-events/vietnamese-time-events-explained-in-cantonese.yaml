skill_id: time_events
explanation_language: cantonese
shared_explanation: skills/time-events/time-events-explained-in-cantonese.yaml
sections:
  - subskill_id: present_events
    explanation: 動詞前面嘅đang可以明確標示進行中活動。
    examples:
      - text: Tôi đang sửa xe đạp.
        meaning: 我整緊單車。
        note: 一般當前語境將活動定位到而家。
  - subskill_id: past_events
    explanation: 過去時間表達可以定位行動，唔使改動詞。
    examples:
      - text: Hôm qua tôi sửa xe đạp.
        meaning: 我尋日整咗架單車。
        note: Hôm qua提供過去時間；動詞仍然係sửa。
  - subskill_id: future_events
    explanation: Sẽ可以表達稍後行動，時間短語指定幾時。
    examples:
      - text: Ngày mai tôi sẽ đi lấy phụ tùng.
        meaning: 我聽日會去攞零件。
        note: Ngày mai交代日子；đi lấy結合去同領取。
  - subskill_id: duration_frequency
    explanation: Mỗi配合時間範圍，lần配合數字，表達頻率。
    examples:
      - text: Mỗi tuần tôi đi bơi hai lần.
        meaning: 我一個星期游兩次水。
        note: Hai lần數次數，唔係鐘數。
  - subskill_id: event_sequence
    explanation: Trước tiên同sau đó排列程序動作。
    examples:
      - text: Trước tiên rửa tay, sau đó chuẩn bị rau.
        meaning: 先洗手，再準備啲蔬菜。
        note: 指令語境交代聽者。
  - subskill_id: event_phase
    explanation: 活動後面嘅xong標示到達終點。
    examples:
      - text: Tôi đọc xong cuốn sách rồi.
        meaning: 我已經睇完本書。
        note: Đọc xong明確表示閱讀完成；rồi表達已達成狀態。
