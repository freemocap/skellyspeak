# yaml-language-server: $schema=../schemas/language.yaml
schema_version: 1
identity:
  id: korean
  name: Korean
  native_name: 한국어
  family: koreanic
  review: needs_review
integrations:
  language_tag: ko
  transcription: ko
definitions:
  orthographies:
    standard-korean:
      script: hangul
      guidance:
        - scope: target_writing
          text: Write contemporary South Korean Korean in Hangul with normal word spacing. Preserve quoted
            source text exactly, including jamo sequences; do not replace the source with
            romanization.
          sources:
            - nikl_romanization
        - scope: explanation_writing
          text: Write contemporary South Korean Korean in Hangul with normal word spacing. Preserve quoted
            source text exactly, including jamo sequences; do not replace the source with
            romanization.
          sources:
            - nikl_romanization
  romanization_schemes:
    revised-romanization:
      label: Revised Romanization
      instructions: Use the National Institute of Korean Language Revised Romanization based on standard
        pronunciation, including its assimilation and aspiration rules and exceptions for names. Use
        eo and eu, distinguish tense consonants, and use r or l by position. Keep word boundaries
        and never rewrite the Hangul source. This reading aid does not encode all pronunciation
        detail.
      examples:
        - original: 한국어
          romanized: hangugeo
        - original: 서울
          romanized: Seoul
        - original: 음악
          romanized: eumak
        - original: 감사합니다
          romanized: gamsahamnida
      sources:
        - nikl_romanization
      review: needs_review
defaults:
  variety: korean-south-korea
  orthography:
    local: standard-korean
  scalars: {}
  romanization:
    mode: scheme
    scheme: &id001
      local: revised-romanization
  supported_romanizations:
    - *id001
traits: []
varieties:
  - id: korean-south-korea
    name: South Korea
    description: Contemporary Korean in South Korea, with standard writing and context-appropriate
