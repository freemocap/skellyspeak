    advanced:
      - Toplantının bu kadar uzayacağını bilseydim, eve dönmek için daha erken bir tren seçerdim.
      - Beni en çok endişelendiren şey, bu kararın görüşü sorulmayan insanları nasıl etkileyeceği.
      - Öneri umut verici görünse de olası sonuçlarını dikkatlice değerlendirmemiz gerekiyor.
      - Sonradan pişman olacağımız bir karar vermektense yolculuğu ertelemeyi tercih ederim.
      - Raporu ne kadar dikkatli okusam da sonuçlarının yeterince gerekçelendirildiğine ikna
        olamıyorum.
      - Projenin başarılı olup olmayacağı, sorumlulukları ne kadar adil paylaşacağımıza bağlı.
      - Bu fikre karşı olduğumdan değil, şu an doğru zaman olup olmadığından emin değilim.
      - Neler olduğunu fark ettiğimizde durumu düzeltmek için yapabileceğimiz pek bir şey kalmamıştı.
