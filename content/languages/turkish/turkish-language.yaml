# yaml-language-server: $schema=../../rust-schemas/language.yaml
schema_version: 1
identity:
  id: turkish
  name: Turkish
  native_name: Türkçe
  family: turkic
  review: needs_review
integrations:
  language_tag: tr
  transcription: tr
definitions:
  orthographies:
    standard-turkish:
      script: latin
      guidance:
        - scope: target_writing
          text: Use contemporary Turkish spelling, retaining ç, ğ, ı, ö, ş and ü. Keep dotted İ/i distinct
            from dotless I/ı, including in capitals. Preserve quoted text exactly and retain
            required apostrophes in proper-name suffixes.
          sources:
            - tdk_alphabet
        - scope: explanation_writing
          text: Use contemporary Turkish spelling, retaining ç, ğ, ı, ö, ş and ü. Keep dotted İ/i distinct
            from dotless I/ı, including in capitals. Preserve quoted text exactly and retain
            required apostrophes in proper-name suffixes.
          sources:
            - tdk_alphabet
  romanization_schemes: {}
defaults:
  variety: turkish-turkiye
  orthography:
    local: standard-turkish
  scalars: {}
  romanization:
    mode: disabled
  supported_romanizations: []
traits: []
varieties:
  - id: turkish-turkiye
    name: Türkiye
    description: Contemporary Turkish in Türkiye, with standard writing and context-appropriate everyday
      conversation; no single regional accent is prescribed.
    review: needs_review
    sources:
      - tdk_alphabet
    overrides: {}
    guidance: []
guidance: []
