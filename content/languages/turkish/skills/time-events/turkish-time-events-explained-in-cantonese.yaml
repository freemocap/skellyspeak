skill_id: time_events
explanation_language: cantonese
shared_explanation: skills/time-events/time-events-explained-in-cantonese.yaml
sections:
  - subskill_id: present_events
    explanation: 有人喺你整單車時打嚟。`Şimdi` 定位到而家，`bisikleti` 標指定單車係受事，`tamir ediyorum`
      表示講者正喺度維修。時間詞同背景支持目前讀法；形式本身可以配其他時間。
    examples:
      - text: Şimdi bisikleti tamir ediyorum.
        meaning: 我而家整緊架單車。
        note: 試講你而家整緊收音機。答案：`Şimdi radyoyu tamir ediyorum.` 將受事換成 `radyoyu`；`şimdi` 同 `ediyorum`
          仍然講進行中行動。
  - subskill_id: past_events
    explanation: 同事問你尋日做咗乜。`Dün` 係尋日，`bisikleti` 指架單車，`tamir ettim` 用講者第一人稱直接過去式講已做嘅維修。動詞詞尾唔標講者性別。
    examples:
      - text: Dün bisikleti tamir ettim.
        meaning: 我尋日整咗架單車。
        note: 試報告你尋日整咗收音機。答案：`Dün radyoyu tamir ettim.` 將受事換成 `radyoyu`；`ettim` 仍然報告你過去做嘅事。
  - subskill_id: future_events
    explanation: 你計劃聽日維修，要攞零件。`Yarın` 係聽日，`parçaları` 指指定零件，`alacağım`
      表達講者之後會做嘅事。喺呢個計劃係攞到零件，唔係每個字都帶英文式時態。
    examples:
      - text: Yarın parçaları alacağım.
        meaning: 我聽日會攞零件。
        note: 試講聽日會攞工具。答案：`Yarın aletleri alacağım.` 將受事換成 `aletleri`；`alacağım` 保留第一人稱將來行動。
  - subskill_id: duration_frequency
    explanation: 有人問你幾耐游一次水。`Haftada` 係每星期，`iki kez` 數兩次，`yüzüyorum` 係重複嘅游水活動。呢個係頻率，唔係游兩個鐘嘅時長。
    examples:
      - text: Haftada iki kez yüzüyorum.
        meaning: 我一個星期游兩次水。
        note: 試講你每星期游三次水。答案：`Haftada üç kez yüzüyorum.` 將次數換成 `üç`；`haftada` 仍然係每週範圍，`kez` 數次數。
  - subskill_id: event_sequence
    explanation: 你講食物準備步驟。`Önce` 將洗手排第一，`sonra` 引出之後準備蔬菜。`ellerinizi` 禮貌噉指聽者雙手，`yıkayın` 同
      `hazırlayın` 都係對聽者禮貌或對多人講。標記排列步驟，唔係邏輯因果。
    examples:
      - text: Önce ellerinizi yıkayın, sonra sebzeleri hazırlayın.
        meaning: 先洗手，再準備啲蔬菜。
        note: 試叫同一個人先洗手，之後切蔬菜。答案：`Önce ellerinizi yıkayın, sonra sebzeleri kesin.` 保留第一步同
          `sonra`，將第二步改成具體嘅 `kesin`。
  - subskill_id: event_phase
    explanation: 朋友問你本書睇完未。`Kitabı` 係指定本書，`okumayı` 將閱讀變成行動名詞，並作為
      `bitirdim`「我完成」嘅受事。成句講閱讀已完成，唔係只講曾經睇過。
    examples:
      - text: Kitabı okumayı bitirdim.
        meaning: 我睇完本書喇。
        note: 試講你寫完封信。答案：`Mektubu yazmayı bitirdim.` 將書同閱讀換成 `Mektubu yazmayı`；`bitirdim`
          仍標明指定活動已完成。
