skill_id: time_events
guidance: Assess current, past and future events, duration or frequency, sequencing and event
  phase. Şimdi bisikleti tamir ediyorum presents an ongoing repair. Dün bisikleti tamir ettim
  uses a past form; Turkish does not mark the speaker’s gender on it. Yarın parçaları alacağım
  places collection in the future. Reported or inferred -miş forms should not be rejected merely
  because a direct past form was expected. Haftada iki kez gives recurrence, while iki saat can
  measure duration. Önce and sonra order actions; okumayı bitirdim specifies completion of
  reading. Dün can answer a recoverable when-question contextually. A copied time adverb without
  an identifiable event is absent. A bare property statement does not establish temporal skill.
  Preserve natural pronoun omission and assess suffix combinations in context; -iyor can also
  occur with planned future reference when the surrounding time expression establishes it.
