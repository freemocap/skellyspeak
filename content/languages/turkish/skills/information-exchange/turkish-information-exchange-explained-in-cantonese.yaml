sections:
  - subskill_id: asking_information
    explanation: Saat kaçta問事件喺幾點發生。
    examples:
      - text: Atölye saat kaçta kapanıyor?
        meaning: 間工場幾點閂門？
        note: Kaçta指出未知嘅關門鐘點。
  - subskill_id: answering_information
    explanation: 帶詞尾嘅時間詞可以直接回答，唔使重複事件。
    examples:
      - text: Beşte.
        meaning: 五點。
        note: 回應工場關門時間；詞尾表示喺嗰個鐘點。
  - subskill_id: checking_facts
    explanation: 命題後加değil mi，邀請確認。
    examples:
      - text: Atölye beşte kapanıyor, değil mi?
        meaning: 間工場五點閂門，係咪？
        note: 講者提出五點作待核實事實。
  - subskill_id: useful_detail
    explanation: 位置修飾語可以識別相關物件。
    examples:
      - text: Avlu tarafındaki kapıyı kullanın.
        meaning: 用庭院嗰邊道門。
        note: 聽者問用邊個入口時，修飾語區分要用嗰道門。
