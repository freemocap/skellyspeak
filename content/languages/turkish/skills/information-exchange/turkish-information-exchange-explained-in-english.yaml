skill_id: information_exchange
explanation_language: english
shared_explanation: skills/information-exchange/information-exchange-explained-in-english.yaml
sections:
  - subskill_id: asking_information
    explanation: You need the workshop’s closing time. `Atölye` identifies the workshop, `saat
      kaçta` asks at what clock hour, and `kapanıyor` names the closing event. The unknown
      is the time; this is not a yes-or-no question needing a separate `mı`.
    examples:
      - text: Atölye saat kaçta kapanıyor?
        meaning: What time does the workshop close?
        note: "Ask when the shop closes instead. Answer: `Dükkân saat kaçta kapanıyor?` Replace
          the place with `Dükkân`; `saat kaçta` still seeks the missing hour."
  - subskill_id: answering_information
    explanation: Someone has just asked when the workshop closes. `Beş` is five and the ending
      in `Beşte` means at five. The short answer is enough because the closing event is
      recoverable from the question; outside that exchange it would need context.
    examples:
      - text: Beşte.
        meaning: At five.
        note: "Answer that it closes at six instead. Answer: `Altıda.` Change the clock hour and
          keep the at-time ending; the preceding question supplies the event."
  - subskill_id: checking_facts
    explanation: You think the workshop closes at five but want the other person to verify it.
      `Atölye beşte kapanıyor` presents the candidate fact; final `değil mi?` asks for
      confirmation. This checks a proposed answer rather than asking for an unknown hour.
    examples:
      - text: Atölye beşte kapanıyor, değil mi?
        meaning: The workshop closes at five, right?
        note: "Check whether the workshop closes at six instead. Answer: `Atölye altıda kapanıyor,
          değil mi?` Change the candidate time to `altıda`; keep `değil mi?` to invite
          confirmation."
  - subskill_id: useful_detail
    explanation: A visitor sees several doors and asks which entrance to use. `Avlu
      tarafındaki` locates one on the courtyard side, `kapıyı` marks that specific door as
      the object, and `kullanın` tells the visitor to use it. The location detail resolves
      a real choice.
    examples:
      - text: Avlu tarafındaki kapıyı kullanın.
        meaning: Use the door on the courtyard side.
        note: "Direct the visitor to the door on the street side instead. Answer: `Sokak
          tarafındaki kapıyı kullanın.` Change the identifying side to `Sokak`; keep
          `kapıyı` as the specific door to use."
