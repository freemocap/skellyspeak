skill_id: coordinating_action
guidance: Assess requests, offers or invitations, suggestions, commitments, acceptance or
  refusal, and negotiation. Bu kutuyu kapıya taşıyın, lütfen requests action with a polite or
  plural imperative. Çantanızı taşıyayım mı? offers to carry the listener’s bag. Biraz ara
  verelim proposes a shared break. Aletleri yarın getireceğim can undertake an assigned task,
  while an unrelated future prediction is not automatically a promise. Bugün gelemem can decline
  an invitation; Cumartesi buluşalım proposes an alternative. Olur contextually accepts a
  concrete proposal, not every preceding assertion. An isolated copied lütfen without a
  recoverable action is absent. A modal question may be a request rather than a genuine ability
  inquiry. Judge who is to act and whether a workable contribution to coordination is made,
  allowing ordinary pronoun omission and contextually polite forms.
