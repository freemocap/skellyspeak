sections:
  - subskill_id: requests
    explanation: 禮貌或複數命令式可以請人做具體行動。
    examples:
      - text: Bu kutuyu kapıya taşıyın, lütfen.
        meaning: 唔該搬呢個箱去門口。
        note: Kutuyu標示具體物件，kapıya標示目的地。
  - subskill_id: offers_invitations
    explanation: 第一人稱願望式問句可以主動提出幫忙。
    examples:
      - text: Çantanızı taşıyayım mı?
        meaning: 要唔要我幫你拎個袋？
        note: 講者用禮貌稱呼，提出幫聽者拎袋。
  - subskill_id: suggestions
    explanation: 第一人稱複數願望式提議共同行動。
    examples:
      - text: Biraz ara verelim.
        meaning: 不如我哋抖一陣。
        note: Verelim將講者包括喺提議內。
  - subskill_id: commitments
    explanation: 將來陳述可以承擔講好咗嘅工作。
    examples:
      - text: Aletleri yarın getireceğim.
        meaning: 聽日我會帶工具嚟。
        note: 分工時用，講者接受呢項工作。
  - subskill_id: accepting_declining
    explanation: 表達冇辦法出席，可以拒絕邀請。
    examples:
      - text: Üzgünüm, bugün gelemem.
        meaning: 唔好意思，我今日嚟唔到。
        note: 之前邀請交代拒絕邊個活動。
  - subskill_id: negotiating_plans
    explanation: 先講限制，再提出替代計劃。
    examples:
      - text: Cuma günü uygun değilim. Cumartesi buluşalım.
        meaning: 我星期五冇時間。不如星期六見。
        note: 第二句提供具體替代提議。
