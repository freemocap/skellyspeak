sections:
  - subskill_id: wants_intentions
    explanation: 你講緊想學嘅技能。`Dikiş dikmeyi` 指縫紉呢個學習對象，`öğrenmek` 係學，`istiyorum` 表達願望。想學唔等於承諾幾時學成。
    examples:
      - text: Dikiş dikmeyi öğrenmek istiyorum.
        meaning: 我想學縫紉。
        note: 試講你想學煮飯。答案：`Yemek yapmayı öğrenmek istiyorum.` 將活動換成 `yemek yapmayı`；`istiyorum`
          仍然係願望，唔係分配工作嘅承諾。
  - subskill_id: preferences
    explanation: 朋友提供茶同咖啡，你揀邊樣較鍾意。`Çayı` 帶賓格，係較鍾意嘅飲品；`kahveye` 喺 `tercih ediyorum` 後標另一選項。格詞尾決定比較邊樣勝出。
    examples:
      - text: Çayı kahveye tercih ediyorum.
        meaning: 比起咖啡，我鍾意茶多啲。
        note: 試將喜好掉轉。答案：`Kahveyi çaya tercih ediyorum.` 將咖啡放喺較鍾意嘅賓格位置 `kahveyi`，茶放喺另一選項嘅位置 `çaya`。
  - subskill_id: emotions
    explanation: 有人講你知件事嘅結果，你感到高興。`Bu habere` 用與格標呢個消息係觸發點；`sevindim` 報告已發生嘅開心反應。呢句講感受，唔係評價消息準唔準。
    examples:
      - text: Bu habere sevindim.
        meaning: 聽到呢個消息，我好開心。
        note: 試講你對呢個結果感到高興。答案：`Bu sonuca sevindim.` 將與格觸發點 `habere` 換成 `sonuca`；`sevindim`
          仍然係情緒反應。
  - subskill_id: opinions
    explanation: 大家比較緊兩種維修方法，你覺得其中一種較容易。`Bence` 標明係你嘅睇法；`bu yöntem` 係呢種方法，`daha kolay`
      同上文另一方法比較難易。冇比較背景，`daha` 嘅基準就唔清楚。
    examples:
      - text: Bence bu yöntem daha kolay.
        meaning: 我覺得呢個方法容易啲。
        note: 試評價呢種方法較快。答案：`Bence bu yöntem daha hızlı.` 保留觀點標記 `Bence`，將比較性質 `kolay` 換成 `hızlı`。
  - subskill_id: agreement_disagreement
    explanation: 同事提出修改，你唔同意。`Bu öneriye` 用與格標建議係 `katılmak` 嘅對象；`katılmıyorum` 否定同意。`Anladım`
      只係話明白，唔會講出反對。
    examples:
      - text: Bu öneriye katılmıyorum.
        meaning: 我唔同意呢個建議。
        note: 試改成同意同一建議。答案：`Bu öneriye katılıyorum.` 去掉 `katılmıyorum` 入面嘅否定部分；與格 `öneriye`
          仍然指出同意乜。
