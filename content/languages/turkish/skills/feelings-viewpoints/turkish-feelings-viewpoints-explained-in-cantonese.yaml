sections:
  - subskill_id: wants_intentions
    explanation: İstemek可以接喺不定式後面，表達想做某件事。
    examples:
      - text: Dikiş dikmeyi öğrenmek istiyorum.
        meaning: 我想學縫紉。
        note: 想做嘅係學習，唔係承諾完成某項工作。
  - subskill_id: preferences
    explanation: Tercih etmek可以將受格嘅較喜歡選項，同與格嘅另一個選項比較。
    examples:
      - text: Çayı kahveye tercih ediyorum.
        meaning: 比起咖啡，我鍾意茶多啲。
        note: Çayı係較鍾意嘅飲品，kahveye指出另一個選項。
  - subskill_id: emotions
    explanation: Sevinmek配合與格補語，表示為某件事高興。
    examples:
      - text: Bu habere sevindim.
        meaning: 聽到呢個消息，我好開心。
        note: Habere指出引起情緒反應嘅事物。
  - subskill_id: opinions
    explanation: Bence將命題框定為講者觀點。
    examples:
      - text: Bence bu yöntem daha kolay.
        meaning: 我覺得呢個方法容易啲。
        note: 講者評價比較緊嘅方法。
  - subskill_id: agreement_disagreement
    explanation: Katılmak配合與格補語可以表示同意，加否定就係反對。
    examples:
      - text: Bu öneriye katılmıyorum.
        meaning: 我唔同意呢個建議。
        note: 否定動詞同öneriye指出反對嘅建議。
