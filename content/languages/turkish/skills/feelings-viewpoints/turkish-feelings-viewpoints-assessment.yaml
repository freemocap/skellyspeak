skill_id: feelings_viewpoints
guidance: Assess desire or intention, preference, emotion, opinion and agreement. Dikiş dikmeyi
  öğrenmek istiyorum names a desire rather than a commitment. Çayı kahveye tercih ediyorum
  expresses a preference with an accusative preferred item and dative alternative. Bu habere
  sevindim reports an emotional response. Bence frames a judgment; Bu öneriye katılmıyorum
  rejects a proposal. Anladım acknowledges understanding without necessarily agreeing. Çay can
  choose a preferred drink contextually; its presence in a shopping list is not preference
  evidence. A copied istiyorum with no recoverable desired action is absent. Do not count
  neutral factual reporting as opinion solely because the speaker asserts it. Turkish does not
  require gender agreement in these forms. Preserve natural omitted pronouns and check the
  relevant complement or case construction without withholding all evidence because of an
  unrelated spelling mistake.
