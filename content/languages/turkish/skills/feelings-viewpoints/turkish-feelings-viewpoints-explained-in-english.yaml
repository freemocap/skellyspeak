sections:
  - subskill_id: wants_intentions
    explanation: İstemek can follow an infinitive naming a desired action.
    examples:
      - text: Dikiş dikmeyi öğrenmek istiyorum.
        meaning: I want to learn to sew.
        note: The desired action is learning; this does not promise to complete a task.
  - subskill_id: preferences
    explanation: Tercih etmek can compare an accusative preferred option with a dative alternative.
    examples:
      - text: Çayı kahveye tercih ediyorum.
        meaning: I prefer tea to coffee.
        note: Çayı is the preferred drink and kahveye names the alternative.
  - subskill_id: emotions
    explanation: Sevinmek with a dative complement expresses being glad about something.
    examples:
      - text: Bu habere sevindim.
        meaning: I was glad to hear this news.
        note: Habere identifies what caused the emotional response.
  - subskill_id: opinions
    explanation: Bence frames the proposition as the speaker’s view.
    examples:
      - text: Bence bu yöntem daha kolay.
        meaning: I think this method is easier.
        note: The speaker evaluates a method already being compared.
  - subskill_id: agreement_disagreement
    explanation: Katılmak with a dative complement can express agreement; negation rejects it.
    examples:
      - text: Bu öneriye katılmıyorum.
        meaning: I disagree with this proposal.
        note: The negative verb and öneriye identify the rejected proposal.
