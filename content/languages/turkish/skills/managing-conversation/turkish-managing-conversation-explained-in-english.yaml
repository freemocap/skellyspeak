skill_id: managing_conversation
explanation_language: english
shared_explanation: skills/managing-conversation/managing-conversation-explained-in-english.yaml
sections:
  - subskill_id: opening_closing
    explanation: A farewell can refer to the next expected meeting.
    examples:
      - text: Gelecek hafta görüşürüz!
        meaning: See you next week!
        note: This closes the current exchange.
  - subskill_id: acknowledging
    explanation: Anladım can acknowledge successful comprehension.
    examples:
      - text: Tamam, şimdi anladım.
        meaning: Okay, now I understand.
        note: Use after an explanation; comprehension is not necessarily agreement.
  - subskill_id: clarification
    explanation: An aorist question can politely ask for repetition.
    examples:
      - text: Tekrar söyler misiniz?
        meaning: Could you say that again?
        note: The prior contribution supplies what should be repeated.
  - subskill_id: rephrasing
    explanation: Başka bir deyişle introduces a restatement.
    examples:
      - text: Başka bir deyişle, önceden randevu almak gerekiyor.
        meaning: In other words, you need to make an appointment in advance.
        note: Use after explaining how the booking procedure works.
  - subskill_id: correcting_misunderstanding
    explanation: Demek istemek can clarify what the speaker intended.
    examples:
      - text: Cuma değil, cumartesi demek istedim.
        meaning: I meant Saturday, not Friday.
        note: The speaker replaces the mistaken day with the intended one.
  - subskill_id: turns_topics
    explanation: A modal question can request a transition within the discussion.
    examples:
      - text: Başka bir soruya geçebilir miyiz?
        meaning: Can we move on to another question?
        note: The requested action concerns the conversation itself.
