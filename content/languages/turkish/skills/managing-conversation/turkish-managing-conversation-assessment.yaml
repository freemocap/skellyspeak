skill_id: managing_conversation
guidance: Assess opening or closing contact, acknowledgement, clarification, rephrasing,
  correcting misunderstanding and turn or topic management. Gelecek hafta görüşürüz closes an
  exchange with expected future contact. Şimdi anladım acknowledges understanding without
  necessarily agreement. Tekrar söyler misiniz? requests repetition of the preceding
  contribution. Başka bir deyişle introduces a reformulation. Cuma değil, cumartesi demek
  istedim corrects the listener’s interpretation. Başka bir soruya geçebilir miyiz? requests a
  conversational transition, not merely an external permission. A copied greeting in a
  vocabulary list is absent as interactional evidence. A brief tamam can acknowledge a specific
  explanation contextually, but its function depends on the exchange. Do not invent an
  antecedent, require long repair sentences or equate all questions with clarification. Preserve
  successful short and formulaic expressions when they do real conversational work.
