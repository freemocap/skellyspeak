sections:
  - subskill_id: opening_closing
    explanation: 道別可以提及預期下次見面。
    examples:
      - text: Gelecek hafta görüşürüz!
        meaning: 下星期見！
        note: 結束今次交談。
  - subskill_id: acknowledging
    explanation: Anladım可以確認成功理解。
    examples:
      - text: Tamam, şimdi anladım.
        meaning: 好，我而家明喇。
        note: 解釋後用，明白唔一定係同意。
  - subskill_id: clarification
    explanation: 一般時問句可以有禮貌噉請人重複。
    examples:
      - text: Tekrar söyler misiniz?
        meaning: 可唔可以再講一次？
        note: 前面發言交代要重複乜。
  - subskill_id: rephrasing
    explanation: Başka bir deyişle引出重述。
    examples:
      - text: Başka bir deyişle, önceden randevu almak gerekiyor.
        meaning: 即係話，你要預先預約。
        note: 解釋預約程序後用。
  - subskill_id: correcting_misunderstanding
    explanation: Demek istemek可以澄清講者原意。
    examples:
      - text: Cuma değil, cumartesi demek istedim.
        meaning: 我係指星期六，唔係星期五。
        note: 講者用原定日子取代對方誤會咗嘅日子。
  - subskill_id: turns_topics
    explanation: 情態問句可以要求討論轉到另一部分。
    examples:
      - text: Başka bir soruya geçebilir miyiz?
        meaning: 我哋可唔可以轉去另一條問題？
        note: 請求嘅行動關乎對話本身。
