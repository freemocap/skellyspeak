sections:
  - subskill_id: ability
    explanation: 能力詞尾配合進行標記，可以描述目前能力。
    examples:
      - text: Bisiklet tamir edebiliyorum.
        meaning: 我識整單車。
        note: 討論實用技能時，呢句陳述講者能力。
  - subskill_id: permission
    explanation: 第一人稱情態問句可以請求批准。
    examples:
      - text: Çantamı burada bırakabilir miyim?
        meaning: 我可唔可以放個袋喺度？
        note: 向管理地方嘅人詢問；疑問詞仍然分開寫。
  - subskill_id: obligation
    explanation: 名詞化行動配合gerekiyor，表示必要。
    examples:
      - text: Anahtarı bugün geri vermem gerekiyor.
        meaning: 我今日要還鎖匙。
        note: Vermem指出由講者歸還；bugün交代今日限期。
  - subskill_id: possibility
    explanation: 情態詞尾可以將事件表達成可能。
    examples:
      - text: Akşam yağmur yağabilir.
        meaning: 今晚可能落雨。
        note: 呢個係天氣可能性，唔係某人嘅能力。
  - subskill_id: certainty
    explanation: Emin değilim表示對所講命題唔肯定。
    examples:
      - text: Dükkânın açık olduğundan emin değilim.
        meaning: 我唔肯定間舖頭開咗未。
        note: 講者唔肯定營業狀態，唔係斷言閂咗。
