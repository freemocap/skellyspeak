sections:
  - subskill_id: ability
    explanation: An ability suffix with progressive marking can describe current capability.
    examples:
      - text: Bisiklet tamir edebiliyorum.
        meaning: I can repair bicycles.
        note: In a discussion of practical skills, this states the speaker’s capability.
  - subskill_id: permission
    explanation: A first-person modal question can request authorization.
    examples:
      - text: Çantamı burada bırakabilir miyim?
        meaning: May I leave my bag here?
        note: Ask the person responsible for the space. The question particle remains separate.
  - subskill_id: obligation
    explanation: A nominalized action with gerekiyor expresses necessity.
    examples:
      - text: Anahtarı bugün geri vermem gerekiyor.
        meaning: I need to return the key today.
        note: Vermem identifies the speaker’s returning action; bugün gives the deadline.
  - subskill_id: possibility
    explanation: The modal suffix can present an event as possible.
    examples:
      - text: Akşam yağmur yağabilir.
        meaning: It may rain this evening.
        note: This is a weather possibility, not a claim about someone’s ability.
  - subskill_id: certainty
    explanation: Emin değilim denies certainty about the supplied proposition.
    examples:
      - text: Dükkânın açık olduğundan emin değilim.
        meaning: I am not sure that the shop is open.
        note: The speaker is uncertain about opening, rather than asserting closure.
