sections:
  - subskill_id: ability
    explanation: A team asks what repairs you know how to do. `Bisiklet` names the thing
      repaired; `tamir etmek` is the compound verb for repairing, with `edebiliyorum`
      carrying ability and a current first-person form. Here the context makes it a
      practical skill claim, not permission to repair this particular bicycle.
    examples:
      - text: Bisiklet tamir edebiliyorum.
        meaning: I can repair bicycles.
        note: "State that you can repair a radio instead. Answer: `Radyo tamir edebiliyorum.`
          Change the repair object to `Radyo`; `edebiliyorum` still presents your
          capability."
  - subskill_id: permission
    explanation: At a staffed counter, you ask whether you may leave your bag there. `Çantamı`
      marks your specific bag as the object, `burada` is here, and `bırakabilir miyim?`
      asks whether you can leave it. Addressed to the person controlling the space, this
      is a permission request; `mi` is written separately.
    examples:
      - text: Çantamı burada bırakabilir miyim?
        meaning: May I leave my bag here?
        note: "Ask permission to leave your coat here instead. Answer: `Montumu burada bırakabilir
          miyim?` Replace the possessed object with `Montumu`; the same modal question
          asks the person in charge for authorization."
  - subskill_id: obligation
    explanation: You borrowed a key and it must be returned today. `Anahtarı` identifies the
      key, `bugün` sets the deadline, and `geri vermem gerekiyor` combines my returning
      action with necessity. It states a requirement; removing a requirement with `gerek
      yok` would not forbid the return.
    examples:
      - text: Anahtarı bugün geri vermem gerekiyor.
        meaning: I need to return the key today.
        note: "Say you need to return the book today. Answer: `Kitabı bugün geri vermem
          gerekiyor.` Change the object to `Kitabı`; `vermem gerekiyor` keeps the
          speaker’s required action."
  - subskill_id: possibility
    explanation: You are deciding whether an evening event should be indoors. `Akşam` locates
      the possible event in the evening, and `yağmur yağabilir` says rain may fall. Here
      the modal ending expresses uncertainty about weather, not anyone’s ability.
    examples:
      - text: Akşam yağmur yağabilir.
        meaning: It may rain this evening.
        note: "Say it may snow in the evening instead. Answer: `Akşam kar yağabilir.` Replace
          `yağmur` with `kar`; `yağabilir` still presents a possible weather event."
  - subskill_id: certainty
    explanation: Someone asks whether the shop is open, and you have not checked. `Dükkânın
      açık olduğundan` supplies the proposition about its being open; `emin değilim`
      denies confidence in that proposition. This does not assert the shop is closed.
    examples:
      - text: Dükkânın açık olduğundan emin değilim.
        meaning: I am not sure that the shop is open.
        note: "Say you are sure the shop is open. Answer: `Dükkânın açık olduğundan eminim.`
          Remove `değil` to affirm confidence; the proposition about opening stays the
          same."
