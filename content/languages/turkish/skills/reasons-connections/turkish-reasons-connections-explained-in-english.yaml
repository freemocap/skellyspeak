sections:
  - subskill_id: causes_reasons
    explanation: A friend asks why you stayed home. `Evde kaldım` states that you stayed at
      home; `çünkü yağmur başladı` supplies the reason, that the rain started. `Çünkü`
      connects an explanation to the earlier decision, not just two events in time order.
    examples:
      - text: Evde kaldım çünkü yağmur başladı.
        meaning: I stayed home because it started raining.
        note: "Explain that you stayed home because a storm started instead. Answer: `Evde kaldım
          çünkü fırtına başladı.` Replace the cause with `fırtına başladı`; `çünkü` still links it
          to staying home."
  - subskill_id: consequences
    explanation: You explain why you arrived on foot. `Otobüs gelmedi` reports the bus did not
      come, and `bu yüzden yürüdüm` presents walking as the resulting choice. `Bu yüzden`
      points back to that problem; it does not merely mark which event happened first.
    examples:
      - text: Otobüs gelmedi, bu yüzden yürüdüm.
        meaning: The bus did not come, so I walked.
        note: "Say the taxi did not come, so you walked. Answer: `Taksi gelmedi, bu yüzden
          yürüdüm.` Change the missing transport to `Taksi`; `bu yüzden` keeps the
          consequence relation."
  - subskill_id: conditions
    explanation: You make a weather-dependent plan for tomorrow. `Yarın yağmur yağarsa` means
      if it rains tomorrow, with the condition carried by `-sa`; `evde kalacağız` is the
      plan that applies in that case. The sentence does not claim it is already raining.
    examples:
      - text: Yarın yağmur yağarsa evde kalacağız.
        meaning: If it rains tomorrow, we will stay home.
        note: "Plan to stay home if it snows tomorrow. Answer: `Yarın kar yağarsa evde kalacağız.`
          Change the possible weather to `kar`; `yağarsa` still makes the home plan
          conditional."
  - subskill_id: contrast
    explanation: You are choosing a route and weighing two qualities. `Yol kısa` says the road
      is short, while `ama dik` adds that it is steep. `Ama` contrasts the convenience of
      short distance with the difficulty of a climb; it does not say one quality causes
      the other.
    examples:
      - text: Yol kısa ama dik.
        meaning: The road is short but steep.
        note: "Describe the road as short but narrow. Answer: `Yol kısa ama dar.` Replace the
          second property with `dar`; `ama` still sets a useful route-choice contrast."
  - subskill_id: supporting_claims
    explanation: At night, you see a light turn on in the house and cautiously infer someone
      may be there. `Sanırım` marks a tentative conclusion, `evde biri var` names it, and
      `çünkü ışık yanıyor` gives the observed clue. The light supports the inference but
      does not cause a person to be home.
    examples:
      - text: Sanırım evde biri var çünkü ışık yanıyor.
        meaning: I think someone is home because the light is on.
        note: "Use voices heard inside as the clue instead. Answer: `Sanırım evde biri var çünkü
          içeriden sesler geliyor.` The sounds provide evidence for the same cautious
          claim; `Sanırım` keeps it an inference, not certainty."
