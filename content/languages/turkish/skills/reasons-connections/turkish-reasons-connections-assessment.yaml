language: turkish
skill_id: reasons_connections
guidance: Assess reasons, consequences, conditions, contrast and support for claims. Çünkü
  introduces a reason; bu yüzden presents a consequence. Yarın yağmur yağarsa evde kalacağız
  makes staying home conditional, with the condition carried by -sa rather than requiring a
  separate eğer. Ama contrasts properties. Önce and sonra alone indicate order, not necessarily
  cause. An illuminated window can support an occupancy inference without causing the occupancy.
  Çünkü yağmur başladı can answer an identifiable why-question contextually. A copied connector
  or conditional ending without recoverable connected content is absent. Check whether evidence
  actually supports the claim. Do not demand an English conjunction pattern where Turkish uses a
  suffixed clause, and do not treat every clause containing için as a cause when it may express
  purpose. Judge the intended connection and the forms that establish it.
