sections:
  - subskill_id: causes_reasons
    explanation: 朋友問點解你留喺屋企。`Evde kaldım` 講你留家；`çünkü yağmur başladı` 提供原因：開始落雨。`Çünkü`
      將原因連到先前決定，唔係單純排兩件事次序。
    examples:
      - text: Evde kaldım çünkü yağmur başladı.
        meaning: 因為開始落雨，我留咗喺屋企。
        note: 試解釋因為開始有風暴所以留家。答案：`Evde kaldım çünkü fırtına başladı.` 將原因換成 `fırtına başladı`；`çünkü`
          仍然連到留家。
  - subskill_id: consequences
    explanation: 你解釋點解行路到達。`Otobüs gelmedi` 講巴士冇嚟，`bu yüzden yürüdüm` 將行路表達成由此作出嘅選擇。`Bu
      yüzden` 指返前面個問題，唔係淨係講先後。
    examples:
      - text: Otobüs gelmedi, bu yüzden yürüdüm.
        meaning: 架巴士冇嚟，所以我行路。
        note: 試講的士冇嚟，所以你行路。答案：`Taksi gelmedi, bu yüzden yürüdüm.` 將冇嚟嘅交通工具換成 `Taksi`；`bu yüzden`
          保留結果關係。
  - subskill_id: conditions
    explanation: 你訂聽日視乎天氣嘅安排。`Yarın yağmur yağarsa` 係如果聽日落雨，條件由 `-sa` 承載；`evde kalacağız`
      係嗰個情況下嘅計劃。句子冇斷言而家落緊雨。
    examples:
      - text: Yarın yağmur yağarsa evde kalacağız.
        meaning: 如果聽日落雨，我哋就留喺屋企。
        note: 試講如果聽日落雪就留家。答案：`Yarın kar yağarsa evde kalacağız.` 將可能天氣換成 `kar`；`yağarsa`
          仍令留家計劃依條件而定。
  - subskill_id: contrast
    explanation: 你揀路線，要衡量兩種性質。`Yol kısa` 係條路短，`ama dik` 補充佢斜。`Ama` 對比路程短嘅方便同上斜嘅困難，唔係話其中一樣造成另一樣。
    examples:
      - text: Yol kısa ama dik.
        meaning: 條路短，但好斜。
        note: 試講條路短但窄。答案：`Yol kısa ama dar.` 將第二個性質換成 `dar`；`ama` 仍然呈現揀路時有用嘅對比。
  - subskill_id: supporting_claims
    explanation: 夜晚你見到屋入面盞燈亮起，謹慎推測可能有人。`Sanırım` 標示估計，`evde biri var` 講推論，`çünkü ışık yanıyor`
      交代觀察到嘅線索。燈光支持推論，唔係造成有人喺屋企。
    examples:
      - text: Sanırım evde biri var çünkü ışık yanıyor.
        meaning: 我諗有人喺屋企，因為盞燈開咗。
        note: 試改用屋入面傳出人聲做線索。答案：`Sanırım evde biri var çünkü içeriden sesler geliyor.`
          聲音支持同一個謹慎推論；`Sanırım` 保留估計語氣，唔係肯定。
