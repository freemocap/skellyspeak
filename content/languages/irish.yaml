definitions:
  orthographies:
    caighdean-oifigiuil:
      script: latin
      guidance:
      - scope: target_writing
        text: Use contemporary Irish spelling following An Caighdeán Oifigiúil. Retain acute vowel accents
          (á, é, í, ó, ú), grammatical initial mutations, apostrophes and hyphens where required. Preserve
          quoted source spelling exactly. Irish is Gaeilge, not Scottish Gaelic; do not substitute Scottish
          Gaelic vocabulary or grave-accent conventions.
        sources:
        - irish_caighdean_2017
      - scope: explanation_writing
        text: Use contemporary Irish spelling following An Caighdeán Oifigiúil. Retain acute vowel accents
