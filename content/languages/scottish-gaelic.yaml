# yaml-language-server: $schema=../schemas/language.json
schema_version: 1
identity:
  id: scottish-gaelic
  name: Scottish Gaelic
  native_name: Gàidhlig
  family: indo-european
  review: needs_review
integrations:
  language_tag: gd
  transcription: null
definitions:
  orthographies:
    gaelic-orthographic-conventions:
      script: latin
      guidance:
      - scope: target_writing
        text: Use contemporary Scottish Gaelic spelling following Gaelic Orthographic Conventions. Retain
          grave vowel accents (à, è, ì, ò, ù), including on capitals, and required lenition, apostrophes
          and hyphens. Preserve quoted source spelling exactly, including older accent conventions. Scottish
          Gaelic is Gàidhlig, not Irish or Scots; do not substitute Irish acute-accent conventions.
        sources:
        - sqa_gaelic_orthography
      - scope: explanation_writing
        text: Use contemporary Scottish Gaelic spelling following Gaelic Orthographic Conventions. Retain
          grave vowel accents (à, è, ì, ò, ù), including on capitals, and required lenition, apostrophes
          and hyphens. Preserve quoted source spelling exactly, including older accent conventions. Scottish
          Gaelic is Gàidhlig, not Irish or Scots; do not substitute Irish acute-accent conventions.
        sources:
        - sqa_gaelic_orthography
  romanization_schemes: {}
defaults:
  variety: scottish-gaelic-scotland
  orthography:
    local: gaelic-orthographic-conventions
  scalars: {}
  romanization:
    mode: disabled
  supported_romanizations: []
traits: []
varieties:
- id: scottish-gaelic-scotland
  name: Scotland
  description: Contemporary Scottish Gaelic in Scotland, using Gaelic Orthographic Conventions for writing
    while allowing regional spoken variation.
  review: needs_review
  sources:
  - sqa_gaelic_orthography
  overrides: {}
  guidance: []
guidance:
- scope: assessment
  text: Distinguish modern writing conventions from regional pronunciation and older written forms. Do
    not treat a documented regional form or historical spelling as meaningless, and do not infer a pronunciation
    error from text alone.
  sources:
  - sqa_gaelic_orthography
learning:
