# yaml-language-server: $schema=../../rust-schemas/language.yaml
schema_version: 1
identity:
  id: cantonese
  name: Cantonese
  native_name: 廣東話
  family: sino-tibetan
  review: needs_review
integrations:
  language_tag: yue-Hant-HK
  transcription: yue
definitions:
  orthographies:
    traditional-chinese:
      script: traditional-chinese
      guidance:
        - scope: target_writing
          text: Write newly generated Cantonese in Traditional Chinese characters, including ordinary
            Cantonese characters such as 佢, 喺 and 嘅. Preserve quoted source text exactly; do not
            convert quotations between character forms. Script choice alone does not determine
            spoken language or register.
          sources: [cuhk_cantonese_grammar20261005]
        - scope: explanation_writing
          text: Write newly generated Cantonese in Traditional Chinese characters, including ordinary
            Cantonese characters such as 佢, 喺 and 嘅. Preserve quoted source text exactly; do not
            convert quotations between character forms. Script choice alone does not determine
            spoken language or register.
          sources: [cuhk_cantonese_grammar20261005]
  romanization_schemes:
    jyutping:
      label: Jyutping
      instructions: Use LSHK Jyutping with an ordinary ASCII tone digit 1–6 immediately after each
        Cantonese syllable, including syllabic m and ng. Preserve distinctions such as aa/a,
        oe/eo and final p/t/k; entering-tone syllables use 1, 3 or 6, not 7–9. Do not use Pinyin,
        Yale diacritics or superscript digits. Choose the reading appropriate to the word and
        context, including established changed tones; do not mechanically romanize every character
        by its first dictionary reading. Separate syllables with spaces for learner readability.
        Preserve the Chinese source exactly.
      examples:
        - original: 詩
          romanized: si1
        - original: 史
          romanized: si2
        - original: 試
          romanized: si3
        - original: 時
          romanized: si4
        - original: 市
          romanized: si5
        - original: 事
          romanized: si6
        - original: 唔
          romanized: m4
        - original: 食
          romanized: sik6
        - original: 廣東話
          romanized: gwong2 dung1 waa2
      sources: [lshk_jyutping20261005]
      review: needs_review
defaults:
  variety: cantonese-hong-kong
  orthography:
    local: traditional-chinese
  scalars:
    font_scale: 1.3
  romanization:
    mode: scheme
    scheme:
      local: jyutping
  supported_romanizations:
    - local: jyutping
traits: [tones, unspaced-words]
varieties:
  - id: cantonese-hong-kong
    name: Hong Kong
    description: Contemporary Hong Kong Cantonese for everyday conversation, written in Traditional
      characters with Jyutping reading support; formal Standard Written Chinese is a separate register.
    review: needs_review
    sources: [cuhk_cantonese_grammar20261005]
    overrides: {}
    guidance:
      - scope: target_writing
        text: &cantonese_usage Use natural conversational Hong Kong Cantonese grammar and vocabulary,
          for example 佢 for a third-person pronoun, 喺 for location, 嘅 for possession, and 唔 or 冇
          according to the construction. Do not produce Mandarin sentences with Traditional
          characters and call them Cantonese. Use sentence-final particles where the interaction
          warrants them, without adding one to every sentence or forcing slang or English mixing.
          If the task explicitly calls for Standard Written Chinese, distinguish that register
          from conversational Cantonese instead of presenting it as a correction to ordinary speech.
        sources: [cuhk_cantonese_grammar20261005]
      - scope: explanation_writing
        text: *cantonese_usage
        sources: [cuhk_cantonese_grammar20261005]
guidance:
  - scope: segmentation
    text: Select linguistic words rather than assuming spaces or individual characters define word
      boundaries.
    sources: [ud]
  - scope: assessment
    text: Assess Cantonese constructions on their own terms. Distinguish 唔, 冇 and 未 in context,
      and aspect markers such as 咗, 緊 and 過 from tense inflections. Do not require Mandarin
      vocabulary, particles or Pinyin. Written characters do not establish pronunciation, tones
      or an accent. Distinguish an explicitly requested formal written register from everyday
      Cantonese before proposing a correction.
    sources: [cuhk_cantonese_grammar20261005]
conversation:
  greeting:
    text: 你好
    romanizations:
      cantonese:jyutping: nei5 hou2
  default_partner:
    name: 阿晴
    romanizedName: aa3 cing4
    age: 27
    location: Hong Kong
    occupation: Bookshop assistant and weekend walker
    background: Grew up in Hong Kong and now shares a flat with a friend. Keeps a notebook of walks
      and second-hand book finds.
    currentSituation: Organising a small book swap and choosing a walk for the weekend.
    interests: [books, walking, cooking, local history]
    opinions:
      - A short walk is still worth taking.
      - Borrowing books is better than running out of shelf space.
    interestingFacts:
      - Keeps ticket stubs as bookmarks.
    favoriteBooks: []
    favoriteMovies: []
    manner: Practical and curious, with short conversational replies and gentle humour.
    quirks:
      - Asks what people are reading.
    vibe: [📚, 🥾, 🍵]
practice:
  review: needs_review
  sets:
    absolute_zero:
      - 係。
      - 唔係。
      - 唔該，畀杯水我。
      - 我喺呢度。
      - 好熱。
      - 我肚餓。
      - 呢個係咩？
      - 我唔知。
    beginner:
      - 佢係醫生。
      - 呢間房好靜。
      - 我有一架單車。
      - 呢個係我妹妹。
      - 我有兩本書。
      - 我想飲啲水。
      - 我喺呢度返工。
      - 佢睇緊書。
    intermediate:
      - 我噚日去咗圖書館。
      - 我以前住喺呢度。
      - 我聽日去香港。
      - 我打算下個禮拜返屋企。
      - 我鍾意飲茶。
      - 我想休息一陣。
      - 我識游水。
      - 我可唔可以坐呢度？
    advanced:
      - 早知會開咁耐，我就帶啲嘢食嚟。
      - 我最擔心嘅係，呢個決定會影響到邊啲人。
      - 雖然個計劃幾吸引，但係我哋仲要諗清楚啲細節。
      - 與其而家急住決定，不如等大家都睇過份資料先。
      - 份報告我睇得越仔細，就越覺得有啲地方要再問清楚。
      - 做唔做得成，好大程度要睇我哋點樣分工。
      - 我唔係反對，只係唔肯定而家係咪適合嘅時候。
      - 等我哋知道發生咩事，已經太遲喇。
    social:
      - 你好！
      - 早晨！
      - 你最近點呀？
      - 我幾好呀，多謝。
      - 你叫咩名呀？
      - 好高興識到你。
      - 多謝晒！
      - 唔使客氣。
      - 唔好意思。
      - 對唔住。
      - 唔緊要。
      - 再見！
      - 遲啲見！
      - 早唞！
    idiomatic:
      - 慢慢嚟。
      - 唔使急。
      - 睇情況啦。
      - 冇問題。
      - 一言為定。
      - 講笑啫。
      - 行住先。
      - 食咗飯先講啦。
  varieties: {}
