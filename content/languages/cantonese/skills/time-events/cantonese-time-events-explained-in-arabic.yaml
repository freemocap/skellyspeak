sections:
  - subskill_id: present_events
    explanation: يسألك شخص عمّا يفعله صديقك هذه اللحظة. تعرض `緊` بعد الفعل النشاط بوصفه جاريًا، فتناسب
      وصف القراءة التي تراها الآن.
    examples:
      - text: 佢睇緊書。
        meaning: ذلك الشخص يقرأ كتابًا. تشير `佢` إلى شخص واحد، وتعني `睇` القراءة أو النظر، وتعني `書` كتابًا
          أو كتبًا من دون تحديد العدد. تقع `緊` بين `睇` و`書`. تصف جريان النشاط، ولا تغيّر الفعل تبعًا
          للشخص.
        note: "جرّب أن تقول إن الصديق يأكل الآن. الإجابة: `佢食緊飯。` استبدل `睇書` بـ`食飯` مع إبقاء `緊` بعد الفعل.
          تصف `佢噚日呢個時候睇緊書` قراءةً كانت جارية في هذا الوقت أمس؛ فقد تأتي عبارة زمن ماضٍ مع علامة
          الجانب نفسها."
  - subskill_id: past_events
    explanation: بعد رحلة تسوق، تخبر بشراء كتاب أمس. تضع كلمة الزمن الحدث في الماضي؛ وتعرض `咗` الشراء
      بوصفه حدثًا أُنجز.
    examples:
      - text: 我噚日買咗本書。
        meaning: اشتريت كتابًا أمس. تعطي `我噚日` الشخص واليوم. وتعني `買咗` الشراء في هذا السياق، وتأتي `咗` بعد
          `買`؛ وتعني `本書` كتابًا باستخدام أداة التصنيف `本`. يمكن لعبارة تصنيف بلا عدد أن تقدم شيئًا
          واحدًا بعد الفعل.
        note: "جرّب أن تخبر بشراء كتابين أمس. الإجابة: `我噚日買咗兩本書。` ضع `兩` قبل `本`. وللقول إن الشراء لم يحدث،
          تستخدم `我噚日冇買書` كلمة `冇` وتحذف `咗` الدالة على الإنجاز؛ ولا يؤدي مجرد إضافة `唔` العامة هذا
          النفي المعتاد لحدث ماضٍ."
  - subskill_id: future_events
    explanation: رتبت زيارة إلى المكتبة غدًا. قد يكفي يوم المستقبل لتوضيح الخطة من دون تغيير صيغة فعل
      الحركة أو إضافة علامة مستقبل إلزامية.
    examples:
      - text: 我聽日去圖書館。
        meaning: سأذهب إلى المكتبة غدًا. تعني `我` أنا، و`聽日` غدًا، و`去圖書館` الذهاب إلى المكتبة. يأتي اليوم
          قبل `去`. وتتبع الوجهة فعل الحركة من دون كلمة إضافية تقابل حرف الجر الإنجليزي «to».
        note: "جرّب نقل الزيارة إلى السبت. الإجابة: `我星期六去圖書館。` غيّر اليوم فقط. ويمكن أن تعبّر `我聽日會去圖書館`
          أيضًا عن المستقبل باستخدام `會`؛ وهي متاحة، لكنها ليست مطلوبة لمجرد أن الزيارة غدًا."
  - subskill_id: duration_frequency
    explanation: يسألك صديق عن عدد زياراتك للمكتبة. تحدد فترة منتظمة قبل الفعل وعدد بعده التكرار؛ ويمكن
      حذف المكتبة لأنها مطروحة في الحديث.
    examples:
      - text: 我每個星期去兩次。
        meaning: أذهب مرتين كل أسبوع. تعني `每個星期` كل أسبوع، وتأتي `每` قبل عبارة الأسبوع. وتعني `去兩次` الذهاب
          مرتين؛ تعدّ `次` مرات الوقوع، وتحدد `兩` العدد اثنين. ولا تخبر الجملة بمدة كل زيارة.
        note: "جرّب أن تجعل الزيارات ثلاثًا في الأسبوع. الإجابة: `我每個星期去三次。` استبدل `兩` بـ`三`. وقد تكون
          إجابة مدة الزيارة `我每次去兩個鐘`، أي أذهب ساعتين في كل مرة؛ تحدد `每次` كل زيارة، وتقيس `兩個鐘`
          مدتها."
  - subskill_id: event_sequence
    explanation: تخطط المجموعة لإنهاء الطعام قبل مغادرة المنزل. يربط التركيب إتمام نشاط بالقيام بما
      يليه، فيتضح الترتيب من دون تكرار من ينفذ الفعلين.
    examples:
      - text: 食完飯先出門。
        meaning: اخرجوا بعد الانتهاء من الطعام. تعني `食完飯` إتمام تناول وجبة؛ تتبع `完` الفعل `食` وتفيد
          الاكتمال. وتعني `先出門` الخروج حينئذ فقط. تقع `先` هنا قبل الفعل الثاني وتجعله ينتظر اكتمال
          الأول.
        note: "جرّب الانتهاء من شرب الشاي قبل الخروج. الإجابة: `飲完茶先出門。` غيّر `食飯` إلى `飲茶` مع إبقاء `完` بعد
          الفعل الأول. وتعطي `我哋先食飯，跟住出門` أيضًا ترتيب الأكل ثم الخروج؛ لكن موضع `先` يتغير في الصياغة
          ذات العبارتين."
  - subskill_id: event_phase
    explanation: يسألك شخص هل تناولت وجبة. تقول `仲未` إن الأكل المتوقع لم يحدث حتى الآن، وتترك احتمال
      حدوثه لاحقًا.
    examples:
      - text: 我仲未食飯。
        meaning: لم أتناول الطعام بعد. تحدد `我` الشخص؛ وتعني `仲` «ما زال»، و`未` «لم يحدث بعد». وتسبقان معًا
          `食飯`، أي تناول وجبة. تصف الجملة المرحلة الحالية، ولا ترفض الأكل أو تنفي عادةً معتادة.
        note: "جرّب القول إن المجموعة كلها لم تأكل بعد. الإجابة: `我哋仲未食飯。` استبدل الشخص من دون تغيير النشاط.
          تقدم `我已經食咗飯` المقابل المكتمل؛ فهي تستخدم `已經` و`咗` الدالة على الإنجاز، بدل إضافة `咗` إلى
          جملة عدم الحدوث بعد."
