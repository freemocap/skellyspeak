sections:
  - subskill_id: wants_intentions
    explanation: تبدو لك دورة الخَبز جذابة، فتصف المهارة التي تود تعلمها. تقدم `想` الرغبة قبل النشاط،
      وتضيف `學` معنى التعلم بدل الزعم بأنك تتقن المهارة بالفعل.
    examples:
      - text: 我想學整麵包。
        meaning: "أريد أن أتعلم صنع الخبز. تعني `我` أنا، و`想學` أريد أن أتعلم، و`整麵包` صنع الخبز. تتوالى
          الأفعال المرتبطة: الرغبة، ثم التعلم، ثم الصنع. ويُفهم أن الشخص نفسه يقوم بكل منها."
        note: "جرّب التعبير عن رغبتك في تعلم الطبخ بدلًا من ذلك. الإجابة: `我想學煮飯。` استبدل النشاط بـ`煮飯`، أي
          طهو وجبة. تقول `我識整麵包` إنك تعرف الصنع بالفعل؛ أما `我想學整麵包` فلا تعبّر إلا عن رغبة التعلم،
          ولا تفيد أنك سجلت في دورة أو قدمت وعدًا."
  - subskill_id: preferences
    explanation: يُطلب منك اختيار مشروب، فتقارن مقدار إعجابك بالنشاطين. تعبّر `鍾意` عن الإعجاب، وتجعل
      `多過` النشاط الأكثر تفضيلًا قبل البديل الأقل تفضيلًا.
    examples:
      - text: 我鍾意飲茶多過飲咖啡。
        meaning: أفضل شرب الشاي على شرب القهوة. تعني `我鍾意` أحب، وتعني `飲茶` شرب الشاي، و`飲咖啡` شرب القهوة.
          تعني `多過` هنا «أكثر من»، وهي تقارن الإعجاب لأن النشاطين مرتبطان بـ`鍾意`؛ ولا تعدّ فناجين
          المشروب.
        note: "جرّب أن تفضّل القهوة بدلًا من الشاي. الإجابة: `我鍾意飲咖啡多過飲茶。` بدّل موضعي النشاطين. تعبّر
          `我鍾意飲茶` عن حب الشاي دون ترتيبه بالنسبة إلى القهوة؛ وتحتاج المقارنة إلى الخيار الآخر بعد
          `多過`."
  - subskill_id: emotions
    explanation: جعل خبر سارّ هذا اليوم سعيدًا لك. يمكن لشعور مثل `開心` أن يصف الشخص مباشرةً؛ وتبيّن `好`
      درجته من دون كلمة منفصلة بمعنى «يكون».
    examples:
      - text: 我今日好開心。
        meaning: أنا سعيد اليوم. تحدد `我` الشخص، وتحدد `今日` اليوم، وتقول `好開心` إنه سعيد أو سعيد جدًا. يأتي
          الوقت قبل الشعور. كثيرًا ما تساعد `好` على وصف إيجابي طبيعي؛ وتتوقف قوتها على السياق
          والتوكيد.
        note: "جرّب أن تقول إن مجموعتك سعيدة اليوم. الإجابة: `我哋今日好開心。` استبدل `我` بـ`我哋`؛ ولا يحمل لفظ
          الشعور علامة للشخص أو الجمع. تعبّر `我今日唔開心` عن عدم السعادة بوضع `唔` قبل `開心`، من دون إبقاء
          `好` الإيجابية."
  - subskill_id: opinions
    explanation: يقارن الناس طرقًا لحل مشكلة، فتبدي تقييمك لإحداها. تقدم `我覺得` ما تعتقده، ويشرح الوصف
      التالي تقييمك.
    examples:
      - text: 我覺得呢個辦法幾好。
        meaning: أرى أن هذه الطريقة جيدة إلى حد كبير. تشير `呢個辦法` إلى هذه الطريقة؛ تدل `呢` عليها، و`個` أداة
          تصنيفها. تعني `幾好` جيدة إلى حد كبير؛ وتبيّن `幾` الدرجة هنا. وهي لا تسأل عن العدد لأنها
          تعدّل الصفة `好` في سياق التقييم.
        note: "جرّب وصف الطريقة بأنها مفيدة إلى حد كبير. الإجابة: `我覺得呢個辦法幾有用。` استبدل `好` بـ`有用`، أي مفيدة.
          تخبر `呢個辦法有三個步驟` فقط بأن للطريقة ثلاث خطوات؛ ويسمح إطار الرأي ببيان كيفية تقييمك لها."
  - subskill_id: agreement_disagreement
    explanation: فهمت اقتراحًا لكنك لا تؤيده. يمكن أن يعترف ردك بفهم المعنى ثم يبيّن اختلافك في الرأي،
      مع إبقاء الأمرين منفصلين.
    examples:
      - text: 我明你嘅意思，不過我唔同意。
        meaning: أفهم قصدك، لكنني لا أوافق. تعني `我明` أفهم، و`你嘅意思` قصدك، وتربط `嘅` بين المخاطَب ومعناه.
          تقدم `不過` الاستدراك بمعنى «لكن»، وتضع `唔同意` النفي قبل `同意`، أي أوافق.
        note: "جرّب أن ترفض الاقتراح باسم المجموعة. الإجابة: `我哋明你嘅意思，不過我哋唔同意。` غيّر فاعل المتكلم في
          الموضعين إلى `我哋`. وللتعبير عن الموافقة بدلًا من الرفض، تحذف `我明你嘅意思，我同意。` الرفض ولا تحتاج
          إلى أداة الاستدراك `不過`."
