skill_id: reasons_connections
explanation_language: english
shared_explanation: skills/reasons-connections/reasons-connections-explained-in-english.yaml
sections:
  - subskill_id: causes_reasons
    explanation: 因為 connects the weather to the decision. Look for a causal relation, not just a connector.
    examples:
      - text: 因為落雨，我哋留喺屋企。
        meaning: Because it is raining, we are staying home.
        note: Original teaching example; interpret its function in the conversational context described
          above.
  - subskill_id: consequences
    explanation: 所以 introduces a consequence supported by the first clause.
    examples:
      - text: 間舖頭閂咗，所以我哋去第二間。
        meaning: The shop has closed, so we are going to another one.
        note: Original teaching example; interpret its function in the conversational context described
          above.
  - subskill_id: conditions
    explanation: 如果 establishes a condition and 就 introduces the dependent outcome; the condition is not
      asserted as fact.
    examples:
      - text: 如果你得閒，我哋就一齊去。
        meaning: If you are free, we will go together.
        note: Original teaching example; interpret its function in the conversational context described
          above.
  - subskill_id: contrast
    explanation: 但係 contrasts evaluations along different dimensions; the two facts are compatible.
    examples:
      - text: 呢間舖頭細，但係啲嘢幾好食。
        meaning: This shop is small, but the food is quite tasty.
        note: Original teaching example; interpret its function in the conversational context described
          above.
  - subskill_id: supporting_claims
    explanation: The station is evidence for the evaluation. Assess relevance rather than answer length.
    examples:
      - text: 我覺得呢度方便，因為附近有地鐵站。
        meaning: I think this place is convenient because there is an MTR station nearby.
        note: Original teaching example; interpret its function in the conversational context described
          above.
