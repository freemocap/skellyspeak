skill_id: reasons_connections
explanation_language: english
shared_explanation: skills/reasons-connections/reasons-connections-explained-in-english.yaml
sections:
  - subskill_id: causes_reasons
    explanation: Rain changes your group’s plan to go out. Giving the reason first with `因為` lets the
      listener understand why you are staying home; the following clause gives the decision.
    examples:
      - text: 因為落雨，我哋留喺屋企。
        meaning: "Because it is raining, we are staying home. `因為落雨` gives because of the rain, using the
          weather expression `落雨`. `我哋留喺屋企` is we stay at home: `留` means stay, `喺` introduces the
          location, and `屋企` is home."
        note: "Try it: put the decision before the reason. Answer: `我哋留喺屋企，因為落雨。` Exchange the clauses while
          keeping `因為` with the reason. `因為落雨，所以我哋留喺屋企` can make both reason and result explicit;
          both connecting expressions can appear together."
  - subskill_id: consequences
    explanation: The shop you planned to visit has closed, so the group chooses another one. `所以`
      introduces the change of plan as a consequence of the closure.
    examples:
      - text: 間舖頭閂咗，所以我哋去第二間。
        meaning: The shop has closed, so we are going to another one. `間舖頭閂咗` presents closing as
          accomplished, with `咗` after `閂`. `我哋去第二間` means we go to another shop. `第二間` can mean
          another one in this setting; it need not count a literal second item in a queue.
        note: "Try it: make going home the result. Answer: `間舖頭閂咗，所以我哋返屋企。` Replace the response with `返屋企`,
          return home. `跟住我哋返屋企` says next we return home and orders events, while `所以` explicitly
          connects the response to its reason."
  - subskill_id: conditions
    explanation: You would like to go together, but it depends on the other person being free. `如果`
      presents that open condition; `就` introduces the plan that follows if it is met.
    examples:
      - text: 如果你得閒，我哋就一齊去。
        meaning: If you are free, we will go together. `你得閒` means you are free. `我哋就一齊去` gives we then go
          together; `一齊` sits before the action. The sentence leaves the listener’s availability
          unresolved rather than stating they are free.
        note: "Try it: make going together depend on no rain. Answer: `如果聽日唔落雨，我哋就一齊去。` Replace the
          condition, keeping `就` in the result. `因為你得閒，我哋一齊去` instead presents your availability as
          the reason, not an open possibility."
  - subskill_id: contrast
    explanation: A small food shop may look unpromising, but the food gives you a positive surprise.
      `但係` contrasts the limited size with a different quality, its tasty food.
    examples:
      - text: 呢間舖頭細，但係啲嘢幾好食。
        meaning: "This shop is small, but the food is quite tasty. `呢間舖頭細` directly describes its size,
          without `係`. `啲嘢` means the things here, understood as food. `幾好食` means quite tasty: `好食`
          is the quality and `幾` marks its degree."
        note: "Try it: contrast a small shop with cheap food. Answer: `呢間舖頭細，但係啲嘢幾平。` Replace `好食` with `平`,
          inexpensive. Both statements can be true; `但係` highlights the favourable quality despite
          the initial impression rather than correcting the size statement."
  - subskill_id: supporting_claims
    explanation: Someone asks why this location is convenient. A nearby MTR station gives a concrete
      reason for your assessment, connecting ease of travel to a feature of the place.
    examples:
      - text: 我覺得呢度方便，因為附近有地鐵站。
        meaning: I think this place is convenient because there is an MTR station nearby. `我覺得` introduces
          your view, `呢度方便` evaluates this place, and `因為附近有地鐵站` gives the reason. `附近` sets the
          nearby area before `有`, which means there is in this clause.
        note: "Try it: support convenience with a nearby bus stop. Answer: `我覺得呢度方便，因為附近有巴士站。` Replace the
          facility; keep `因為` linking it to the assessment. `我覺得呢度好方便` strengthens the judgement
          with `好` but does not supply that concrete reason."
