sections:
  - subskill_id: causes_reasons
    explanation: غيّر المطر خطة مجموعتك للخروج. يساعد تقديم السبب بـ`因為` المستمع على فهم سبب بقائكم في
      المنزل؛ وتبيّن العبارة التالية القرار.
    examples:
      - text: 因為落雨，我哋留喺屋企。
        meaning: لأن المطر يهطل، نبقى في المنزل. تعطي `因為落雨` سبب المطر باستخدام تعبير الطقس `落雨`. وتعني
          `我哋留喺屋企` نبقى في البيت؛ فـ`留` تعني البقاء، و`喺` تقدم المكان، و`屋企` البيت.
        note: "جرّب تقديم القرار على السبب. الإجابة: `我哋留喺屋企，因為落雨。` بدّل موضعي العبارتين مع إبقاء `因為` مع
          السبب. ويمكن أن تصرّح `因為落雨，所以我哋留喺屋企` بالسبب والنتيجة معًا؛ إذ قد تأتي أداتا الربط
          كلتاهما."
  - subskill_id: consequences
    explanation: أُغلق المتجر الذي خططتم لزيارته، فتختار المجموعة متجرًا آخر. تقدم `所以` تغيير الخطة
      بوصفه نتيجة للإغلاق.
    examples:
      - text: 間舖頭閂咗，所以我哋去第二間。
        meaning: أُغلق المتجر، ولذلك سنذهب إلى متجر آخر. تعرض `間舖頭閂咗` الإغلاق بوصفه حدثًا وقع، مع `咗` بعد
          `閂`. وتعني `我哋去第二間` أننا نذهب إلى متجر آخر. قد تعني `第二間` متجرًا آخر في هذا السياق، ولا
          يلزم أن تعدّ عنصرًا ثانيًا حرفيًا في صف.
        note: "جرّب جعل العودة إلى البيت النتيجة. الإجابة: `間舖頭閂咗，所以我哋返屋企。` استبدل التصرف بـ`返屋企`، أي العودة
          إلى البيت. تعني `跟住我哋返屋企` «بعد ذلك نعود إلى البيت» فتسلسل الأحداث؛ أما `所以` فتربط التصرف
          بسببه صراحةً."
  - subskill_id: conditions
    explanation: تودان الذهاب معًا، لكن الخطة تتوقف على تفرغ الشخص الآخر. تقدم `如果` هذا الشرط المفتوح،
      وتقدم `就` الخطة التي تتبعه إن تحقق.
    examples:
      - text: 如果你得閒，我哋就一齊去。
        meaning: إذا كنت متفرغًا فسنذهب معًا. تعني `你得閒` أنك متفرغ. وتعني `我哋就一齊去` أننا سنذهب معًا حينئذ؛
          وتأتي `一齊` قبل الفعل. تترك الجملة تفرغ المخاطَب غير محسوم، ولا تقرر أنه متفرغ.
        note: "جرّب تعليق الذهاب معًا على عدم هطول المطر. الإجابة: `如果聽日唔落雨，我哋就一齊去。` استبدل الشرط وأبقِ `就`
          في النتيجة. أما `因為你得閒，我哋一齊去` فتقدم التفرغ سببًا قائمًا، لا احتمالًا مفتوحًا."
  - subskill_id: contrast
    explanation: قد يبدو متجر الطعام الصغير غير واعد، لكن الطعام يفاجئك بصورة إيجابية. تقابل `但係` صغر
      الحجم بصفة مختلفة هي لذة الطعام.
    examples:
      - text: 呢間舖頭細，但係啲嘢幾好食。
        meaning: هذا المتجر صغير، لكن طعامه لذيذ إلى حد كبير. تصف `呢間舖頭細` الحجم مباشرةً من دون `係`. وتعني
          `啲嘢` الأشياء هنا، والمقصود الطعام. وتعني `幾好食` لذيذ إلى حد كبير؛ `好食` هي الصفة، وتحدد `幾`
          درجتها.
        note: "جرّب مقابلة متجر صغير بطعام رخيص. الإجابة: `呢間舖頭細，但係啲嘢幾平。` استبدل `好食` بـ`平`، أي غير مكلف. قد
          تصح العبارتان معًا؛ وتبرز `但係` الصفة المحببة رغم الانطباع الأول، ولا تصحح وصف الحجم."
  - subskill_id: supporting_claims
    explanation: يسأل شخص لماذا يعدّ هذا الموقع ملائمًا. توفر محطة مترو قريبة سببًا ملموسًا لتقييمك؛ فهي
      تربط سهولة التنقل بميزة في المكان.
    examples:
      - text: 我覺得呢度方便，因為附近有地鐵站。
        meaning: أرى أن هذا المكان ملائم لوجود محطة مترو قريبة. تقدم `我覺得` رأيك، وتقيّم `呢度方便` هذا المكان،
          وتقدم `因為附近有地鐵站` السبب. تحدد `附近` المنطقة القريبة قبل `有`، التي تعني وجود شيء في هذه
          العبارة.
        note: "جرّب دعم الملاءمة بوجود موقف حافلات قريب. الإجابة: `我覺得呢度方便，因為附近有巴士站。` استبدل المرفق وأبقِ
          `因為` رابطًا له بالتقييم. تقوّي `我覺得呢度好方便` الحكم بـ`好` لكنها لا تقدم ذلك السبب الملموس."
