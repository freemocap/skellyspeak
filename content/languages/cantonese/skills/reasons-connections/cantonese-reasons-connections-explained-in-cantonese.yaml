explanation_language: cantonese
shared_explanation: skills/reasons-connections/reasons-connections-explained-in-cantonese.yaml
sections:
  - subskill_id: causes_reasons
    explanation: 因為 將天氣同決定連起嚟。要有因果意思，唔係見到連接詞就當成立。
    examples:
      - text: 因為落雨，我哋留喺屋企。
        meaning: 因為落雨，我哋留喺屋企。
        note: 落雨 係留喺屋企嘅原因。
  - subskill_id: consequences
    explanation: 所以 引入前面情況支持嘅結果。
    examples:
      - text: 間舖頭閂咗，所以我哋去第二間。
        meaning: 間舖閂咗，所以我哋去第二間。
        note: 改去第二間係因為原本嗰間已關門。
  - subskill_id: conditions
    explanation: 如果 提出條件，就 引入依賴嗰個條件嘅結果；條件唔係已被斷言嘅事實。
    examples:
      - text: 如果你得閒，我哋就一齊去。
        meaning: 如果你得閒，我哋就一齊去。
        note: 講者冇肯定你得閒；一齊去 取決於呢個條件。
  - subskill_id: contrast
    explanation: 但係 將唔同方面嘅評價作對比；兩個事實可以同時成立。
    examples:
      - text: 呢間舖頭細，但係啲嘢幾好食。
        meaning: 呢間舖細，但係啲嘢幾好食。
        note: 細 同 好食 描述唔同特徵，唔係互相否定。
  - subskill_id: supporting_claims
    explanation: 港鐵站係支持方便呢個評價嘅證據。重點係相關性，唔係答案有幾長。
    examples:
      - text: 我覺得呢度方便，因為附近有地鐵站。
        meaning: 我覺得呢度方便，因為附近有港鐵站。
        note: 附近有港鐵站 為 方便 提供具體理由。
