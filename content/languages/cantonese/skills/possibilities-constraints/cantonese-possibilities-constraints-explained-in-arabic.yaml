sections:
  - subskill_id: ability
    explanation: عند تحديد من يستطيع صنع الخبز لوجبة، يفيد بيان أنك تعلمت المهارة. تعني `識` قبل النشاط
      أنك تعرف كيف تفعله؛ أما الإذن والوقت المتاح فمسألتان أخريان.
    examples:
      - text: 我識整麵包。
        meaning: أعرف كيف أصنع الخبز. تسمي `我` المتكلم، وتفيد `識` معرفة الطريقة، وتعني `整麵包` صنع الخبز. يأتي
          النشاط بعد `識` مباشرة من دون كلمة ربط. ولا يتغير `識` أو `整` عند تبديل الفاعل.
        note: "جرّب أن تقول إن صديقك يعرف صنع الخبز. الإجابة: `佢識整麵包。` غيّر الفاعل إلى `佢`. تنفي `我唔識整麵包`
          معرفة الطريقة؛ أما `我今日唔得閒整麵包` فتقول إنك لا تملك وقتًا اليوم ولا تحدد مستوى مهارتك."
  - subskill_id: permission
    explanation: في مساحة عمل مشتركة، تسأل المسؤول هل يجوز لك استخدام طاولة. تعرض `可唔可以` خياري السماح
      والمنع؛ ويأتي الفعل المقترح بعدها.
    examples:
      - text: 我可唔可以用呢張枱？
        meaning: هل يمكنني استخدام هذه الطاولة؟ `我` هو الشخص الذي يريد القيام بالفعل، وتعني `用` استخدم،
          وتحدد `呢張枱` هذه الطاولة بأداة التصنيف `張`. `可唔可以` صيغة سؤال شائعة مبنية من `可以` بتكرار
          الإثبات والنفي. يجعلها سياق المكان طلبًا للإذن.
        note: "جرّب طلب استخدام الكرسي بدلًا منها. الإجابة: `我可唔可以用呢張椅？` استبدل `枱` بـ`椅`؛ وتستخدم كلتاهما
          `張` هنا. تمنح `可以，你用啦。` الإذن. وقد يسأل النمط نفسه عن الإمكانية العملية، لذا يساعد الشخص
          والسياق في تحديد المقصود."
  - subskill_id: obligation
    explanation: موعد تسليم الواجب اليوم، لذا فالتسليم مطلوب لا مجرد أمر مستحسن. تقوّي `一定要` الإلزام،
      ويحدد اليوم موعد تنفيذ الفعل.
    examples:
      - text: 我今日一定要交份功課。
        meaning: يجب عليّ تسليم الواجب اليوم. تحدد `我今日` الشخص واليوم؛ وتعني `一定要交` أنه يجب تسليمه حتمًا.
          تحدد `份功課` الواجب بأداة التصنيف `份` المناسبة لوثيقة أو قطعة عمل.
        note: "جرّب جعل موعد التسليم غدًا. الإجابة: `我聽日一定要交份功課。` غيّر `今日` إلى `聽日`. تزيل `我唔使交份功課`
          الالتزام؛ أما `我唔可以交份功課` فتقول إن التسليم غير مسموح أو غير ممكن. يؤدي كل نفي وظيفة
          مختلفة."
  - subskill_id: possibility
    explanation: تبقي نشرة الطقس بعض الشك بشأن جو الغد. تقدم `可能` هذا الاحتمال، وتعرض `會` المطر حدثًا
      ممكنًا في المستقبل.
    examples:
      - text: 聽日可能會落雨。
        meaning: قد تمطر غدًا. تأتي `聽日` أولًا لتحدد اليوم، وتعني `可能會` قد يحدث، و`落雨` نزول المطر. يصف
          الكانتوني هذا الحدث الجوي من دون إدخال ضمير منفصل يقابل ضمير «it» في الإنجليزية.
        note: "جرّب توقع احتمال تساقط الثلج غدًا. الإجابة: `聽日可能會落雪。` استبدل الظاهرة الجوية بـ`落雪`. تقدّم
          `聽日會落雨` التوقع بصورة أصرح؛ أما `聽日可能唔會落雨` فتترك احتمال عدم هطول المطر مفتوحًا."
  - subskill_id: certainty
    explanation: أنت واثق من أن شخصًا عاد إلى المنزل. تعبّر `我肯定` عن هذه الثقة، وتسمّي العبارة التالية
      الحدث الذي أنت متأكد منه.
    examples:
      - text: 我肯定佢已經返咗屋企。
        meaning: أنا متأكد من أن ذلك الشخص عاد إلى المنزل بالفعل. تشير `佢` إلى شخص واحد، وتعني `已經` بالفعل،
          وتعرض `返咗屋企` العودة إلى البيت بوصفها حدثًا وقع. تعني `返` العودة، وتأتي `咗` بعد الفعل،
          و`屋企` تعني البيت.
        note: "جرّب إبداء الثقة نفسها بشأن أشخاص عدة. الإجابة: `我肯定佢哋已經返咗屋企。` غيّر `佢` إلى `佢哋`، وتبقى `返咗`
          كما هي. أما `我唔肯定佢係咪返咗屋企` فتعني أنك غير متأكد هل عاد ذلك الشخص إلى البيت، وتضيف `係咪` للسؤال الذي
          لم يُحسم."
