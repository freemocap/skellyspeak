sections:
  - subskill_id: requests
    explanation: يداك مشغولتان وتحتاج إلى من يفتح الباب. تقدم `唔該` طلب المساعدة بأدب. يُفهم المخاطَب دون
      ذكر ضمير «أنت»، وتسمّي الجملة الفعل المطلوب مباشرةً بدل صياغته سؤالًا.
    examples:
      - text: 唔該，幫我開門。
        meaning: افتح الباب من فضلك. تعني `幫我` ساعدني أو افعل ذلك من أجلي، وتتبعها `開門`، أي افتح الباب. `我`
          هو المستفيد من الفعل، لا الشخص المطلوب منه فتح الباب. يأتي الفعل بعد عبارة المساعدة.
        note: "جرّب أن تطلب إغلاق الباب بدلًا من فتحه. الإجابة: `唔該，幫我閂門。` استبدل `開` بـ`閂`، أي أغلق. أما
          `我幫你開門` فتعرض فيها المساعدة من جانبك؛ وتبديل الشخصين يغيّر من يساعد من."
  - subskill_id: offers_invitations
    explanation: يفكر صديق في ما سيفعله لاحقًا، فتدعوه إلى تناول وجبة معك. تعني `一齊` «معًا»؛ ويُعرض
      النشاط عليه ليوافق أو يرفض باستخدام `好唔好`، ولا يُقدَّم بوصفه ترتيبًا محسومًا.
    examples:
      - text: 一齊去食飯，好唔好？
        meaning: هل نذهب لتناول الطعام معًا؟ تعني `去食飯` الذهاب لتناول وجبة؛ ولا تقتصر `食飯` على أكل الأرز.
          تجمع `好唔好` الخيارين الإيجابي والسلبي لتسأل هل الاقتراح مناسب. يُفهم المشاركون من سياق
          الدعوة.
        note: "جرّب أن تدعو الصديق إلى الشاي بدلًا من الوجبة. الإجابة: `一齊去飲茶，好唔好？` يتغير النشاط إلى `飲茶`
          وتبقى الدعوة مفتوحة للرد. تقبل الإجابة `好呀，一齊去。` الدعوة، وترفضها `唔好意思，我唔得閒。` بأدب."
  - subskill_id: suggestions
    explanation: تناقشون زيارة، لكن اليوم قد لا يناسب الجميع. تقدم `不如` بديلًا يستحق النظر فيه. ويمكن أن
      يحذف الاقتراح القصير الوجهة لأنها موضوع الحديث بالفعل.
    examples:
      - text: 不如聽日去。
        meaning: ما رأيكم في الذهاب غدًا؟ تعني `聽日` غدًا وتأتي قبل `去`، أي الذهاب. لا يتغير لفظ الفعل
          للدلالة على المستقبل. يطرح الاقتراح يومًا للنظر فيه، ولا يقول إن الجميع وافقوا.
        note: "جرّب اقتراح يوم السبت. الإجابة: `不如星期六去。` بدّل اليوم وأبقِ صيغة الاقتراح. تخبر `我聽日去` بترتيبك
          الشخصي، بينما تقترح `不如聽日去` خيارًا. وإضافة `先` كما في `不如聽日先去` تقترح تحديدًا الانتظار إلى
          الغد."
  - subskill_id: commitments
    explanation: يحتاج صديق إلى الكتاب فتتحمل مسؤولية إحضاره. تصرّح `我答應你` بوعد تقدمه إلى ذلك الشخص،
      وتبيّن العبارة التالية ما ستفعله ومتى.
    examples:
      - text: 我答應你，聽日會帶本書嚟。
        meaning: أعدك بأنني سأحضر الكتاب غدًا. تحدد `聽日` الغد، وتقول `會帶` إنك ستحضره، وتحدد `本書` الكتاب
          المعروف من السياق باستخدام أداة التصنيف `本`. توجه `嚟` الأخيرة الإحضار إلى مكان اللقاء
          المعني أو موقع المخاطَب.
        note: "جرّب أن تعد بإحضار الكتاب يوم الجمعة. الإجابة: `我答應你，星期五會帶本書嚟。` غيّر اليوم فقط. تعبّر
          `我可能會帶本書嚟` عن احتمال؛ وتبقي `可能` الفعل غير مؤكد، فلا تقوم مقام الوعد الصريح."
  - subskill_id: accepting_declining
    explanation: دعاك شخص إلى موعد غدًا، لكنك غير متفرغ. يتيح له اعتذار قصير يتبعه بيان عدم تفرغك أن
      يفهم أنك لا تستطيع المشاركة.
    examples:
      - text: 唔好意思，我聽日唔得閒。
        meaning: آسف، لست متفرغًا غدًا. تخفف `唔好意思` الرفض. تحدد `我聽日` من يخصه الغد، وتعني `唔得閒` غير متفرغ.
          تنفي `唔` حالة التفرغ `得閒`، ولا تعني أنك تكره الدعوة.
        note: "جرّب أن ترفض دعوة إلى يوم السبت. الإجابة: `唔好意思，我星期六唔得閒。` استبدل اليوم. ويمكن أن تكون إجابة
          القبول `好呀，我聽日得閒。` تجعل الدعوة التفرغ ذا صلة بالمشاركة؛ وخارج هذا الحوار قد تكتفي الجملة
          بوصف جدولك."
  - subskill_id: negotiating_plans
    explanation: يتعارض لقاء الساعة الثالثة مع موعد آخر. ترفض ذلك الوقت وتسأل هل تناسب الساعة الرابعة
      الطرف الآخر، فتقدّم له بديلًا محددًا للنظر فيه.
    examples:
      - text: 三點唔得，四點得唔得？
        meaning: الساعة الثالثة لا تناسبني؛ هل تناسبك الرابعة؟ تسمّي `三點` و`四點` وقتين على الساعة. ترفض `唔得`
          الترتيب الأول. تكرر `得唔得` صورتي `得` المثبتة والمنفية، بمعنى مناسب أو ممكن، لتسأل عن
          الثاني. لا حاجة إلى تكرار ذكر اللقاء.
        note: "جرّب إبقاء الثالثة غير متاحة واقتراح الخامسة. الإجابة: `三點唔得，五點得唔得？` يتغير الوقت المقترح فقط.
          تقرر `五點得` أن الخامسة مناسبة، بينما تسأل `五點得唔得` المخاطَب تأكيد ذلك بدل أن تقرر نيابة
          عنه."
