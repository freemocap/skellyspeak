language: cantonese
skill_id: coordinating_action
guidance: Assess coordinating action from the learner’s contribution in context. 唔該，幫我開門。 (Please
  open the door for me.) can demonstrate requests. 唔該 frames a request for a service; 幫我 identifies
  who benefits. A request need not be a question. 一齊去食飯，好唔好？ (Shall we go and eat together?) can
  demonstrate offers invitations. 一齊 proposes joint action; 好唔好 asks the other person to accept or
  decline. 不如聽日去。 (How about going tomorrow?) can demonstrate suggestions. 不如 introduces a proposed
  alternative; the exchange supplies the destination. 我答應你，聽日會帶本書嚟。 (I promise you I will bring the
  book tomorrow.) can demonstrate commitments. 答應 makes the commitment explicit. A future prediction
  alone is not necessarily a promise. 唔好意思，我聽日唔得閒。 (Sorry, I am not free tomorrow.) can demonstrate
  accepting declining. After an invitation, unavailability can decline it indirectly. Without that
  context it may only report a fact. 三點唔得，四點得唔得？ (Three does not work; would four work?) can
  demonstrate negotiating plans. The speaker rejects one time and checks another with 得唔得. Credit a
  function only when accomplished in the exchange; copied isolated forms are insufficient. Do not
  require Mandarin forms or infer Cantonese pronunciation from written characters.
