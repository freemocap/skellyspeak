sections:
  - subskill_id: opening_closing
    explanation: عليك المغادرة بينما قد يبقى الآخرون، وتتوقع رؤيتهم غدًا. تعلن العبارة الأولى مغادرتك؛
      وتودعهم الثانية بودّ مع الإشارة إلى اللقاء المقبل.
    examples:
      - text: 我走先喇，聽日見。
        meaning: سأنصرف الآن؛ أراكم غدًا. تعني `我走先` أنني سأذهب أولًا أو أغادر قبلكم. تشير `喇` الأخيرة إلى
          أن المغادرة صارت وشيكة الآن. وتعني `聽日見` أراكم غدًا؛ ويُفهم طرفا اللقاء من دون تكرار
          الضمائر.
        note: "جرّب أن يكون اللقاء المتوقع يوم الاثنين. الإجابة: `我走先喇，星期一見。` بدّل يوم اللقاء وأبقِ عبارة
          المغادرة. تضع `我先走` كلمة `先` قبل الفعل للتأكيد أنك تفعله أولًا، بينما تصلح `我走先` المألوفة
          عبارةً للوداع."
  - subskill_id: acknowledging
    explanation: أخبرك شخص بوقت أو تعليمات، فتبيّن أنك فهمتها وسجلتها. يجمع الرد بين الإقرار بالفهم
      والفعل العملي الذي قمت به.
    examples:
      - text: 明白，我記低咗。
        meaning: فهمت؛ دوّنت ذلك. يمكن أن تستقل `明白` لتفيد الفهم. تعني `記低` تدوين المعلومة، و`低` جزء من هذا
          التعبير. تعرض `咗` بعدها التدوين أمرًا أُنجز، ولا يتكرر المفعول لأن المعلومة معروفة.
        note: "جرّب الإقرار بالفهم مع القول إنك لم تدوّن المعلومة بعد. الإجابة: `明白，我仲未記低。` استبدل `記低咗`
          الدالة على الإنجاز بـ`仲未記低`، أي لم أدوّن بعد. وهكذا يبقى الفهم ويتغير وضع التدوين؛ والفهم
          وحده لا يعني الموافقة."
  - subskill_id: clarification
    explanation: ذكر المخاطَب متجرًا، لكن الوصف قد ينطبق على أكثر من متجر. السؤال عن أي متجر يقصده يوضح
      المرجع المبهم، بدل طلب إعادة جملة سمعتها بالفعل.
    examples:
      - text: 你講邊間舖頭呀？
        meaning: أي متجر تقصد؟ تعني `你講` هنا «تتحدث عن». وتسأل `邊間舖頭` عن هوية المتجر؛ تختار `邊` واحدًا، و`間`
          أداة تصنيف المتجر. تنهي `呀` السؤال الحواري. يبقى الشخص قبل الفعل، ويأتي المتجر المجهول
          بعده.
        note: "جرّب توضيح أي كتاب يقصده شخص. الإجابة: `你講邊本書呀？` غيّر `間舖頭` إلى `本書`؛ فتتغير أداة التصنيف مع
          الشيء. تطلب `你可唔可以再講一次？` إعادة الكلام، وقد يبقى المرجع غير واضح رغم ذلك."
  - subskill_id: rephrasing
    explanation: "أظهر النقاش حول السفر أن موعد الانطلاق الأصلي متأخر جدًا. تعيد صياغة النتيجة العملية:
      يجب أن تغادر المجموعة أبكر. تقدم `即係話` إعادة الصياغة تلك."
    examples:
      - text: 即係話，我哋要早啲出門。
        meaning: بعبارة أخرى، علينا الانطلاق أبكر. تعني `我哋` نحن، وتفيد `要` اللزوم، وتعني `早啲` أبكر أو أبكر
          قليلًا. تجعل `啲` بعد وصف الوقت التغيير نسبيًا. وتعني `出門` الخروج من المنزل أو الانطلاق.
        note: "جرّب إعادة صياغة النتيجة بأن على المجموعة الوصول أبكر. الإجابة: `即係話，我哋要早啲到。` استبدل `出門`
          بـ`到`، أي الوصول. وتعني `遲啲到` الوصول متأخرين بدلًا من ذلك، فتغيّر النتيجة العملية ولا تعيد
          صياغة شرط التبكير."
  - subskill_id: correcting_misunderstanding
    explanation: فهم المستمع أنك تقصد الاثنين، لكنك قلت الثلاثاء. يحدد ذكر اليوم المقصود واليوم
      المستبعَد معًا التصحيح بدقة تكفي لتعديل الترتيب.
    examples:
      - text: 我講星期二，唔係星期一。
        meaning: قلت الثلاثاء، لا الاثنين. تحدد `我講星期二` اليوم الذي ذكرته؛ ويبين الحديث السابق متى قلت ذلك.
          تعني `唔係星期一` «ليس الاثنين»، فتستبعد اليوم الذي فُهم خطأً. تنفي `唔係` تحديد اليوم، لا فعل
          الكلام.
        note: "جرّب تصحيح الخميس إلى الجمعة. الإجابة: `我講星期五，唔係星期四。` يأتي اليوم المقصود أولًا، ثم اليوم
          المفهوم خطأً. أما `我唔講星期一` فتعني «لا أقول الاثنين»؛ فهي تنفي `講` ولا تقدّم البديل الدقيق
          المطلوب هنا."
  - subskill_id: turns_topics
    explanation: يفتح حديث عن الطعام مجالًا للسؤال عن الطبخ. تربط `講開` السؤال الجديد بالموضوع المطروح
      بالفعل، فيسهل متابعة الانتقال.
    examples:
      - text: 講開食嘢，你鍾意煮咩呀？
        meaning: بمناسبة الحديث عن الطعام، ماذا تحب أن تطهو؟ تعني `食嘢` الأكل أو الطعام في عبارة الموضوع هذه.
          وتعني `你鍾意煮` أنك تحب الطبخ؛ وتأتي `咩` في موضع الطعام المجهول لتسأل «ماذا؟». وتناسب `呀`
          الأخيرة السؤال الحواري.
        note: "جرّب وصل حديث عن القراءة بسؤال عن الكتب. الإجابة: `講開睇書，你鍾意睇咩書呀？` يتغير موضوع الافتتاح ونشاط
          السؤال معًا. تقدم `講開睇書` رابط الموضوع، وتسأل `咩書` عن أي كتب مع إبقاء الشيء المجهول بعد
          الفعل."
