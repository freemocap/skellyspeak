skill_id: managing_conversation
explanation_language: cantonese
shared_explanation: skills/managing-conversation/managing-conversation-explained-in-cantonese.yaml
sections:
  - subskill_id: opening_closing
    explanation: 你要走，其他人可能繼續留低，而且預計聽日再見。第一部分交代自己離開，第二部分就用下次見面作道別。
    examples:
      - text: 我走先喇，聽日見。
        meaning: 意思係我先走，聽日再見。`我走先` 指自己先離開，句尾 `喇` 表示而家要轉去離開呢個階段。`聽日見` 作道別，邊啲人見面唔使再重複代詞。
        note: 試下改成星期一見：`我走先喇，星期一見。`換見面日子，離開部分保留。`我先走` 將 `先` 放動作前，突出先做；常用嘅 `我走先` 就可以直接作離開招呼。
  - subskill_id: acknowledging
    explanation: 人哋畀咗時間或者指示，你表示聽明同記低。回應既確認理解，又交代自己已經做咗記錄。
    examples:
      - text: 明白，我記低咗。
        meaning: 意思係明白，資料已記低。`明白` 可以獨立確認理解，`記低` 講記錄，`低` 屬於呢個記低表達。後面 `咗` 表示記錄已做，內容已清楚，所以唔使再講賓語。
        note: 試下表示明白但仲未記：`明白，我仲未記低。``記低咗` 換成 `仲未記低`，保留理解但改變記錄進度。聽明本身唔等於同意。
  - subskill_id: clarification
    explanation: 對方提到一間舖，但可能指幾間唔同嘅。問邊間就可以釐清對象，唔係叫佢重複已經聽到嘅句子。
    examples:
      - text: 你講邊間舖頭呀？
        meaning: 意思係問你指邊間舖。`你講` 呢度係你講緊，`邊間舖頭` 問邊一間，`邊` 問身份，`間` 配合舖嘅量詞，句尾 `呀` 配合日常問句。人喺動詞前，要釐清嘅舖喺後面。
        note: 試下問指邊本書：`你講邊本書呀？``間舖頭` 換成 `本書`，量詞跟物件改。`你可唔可以再講一次？` 只請人重講，未必釐清到對象。
  - subskill_id: rephrasing
    explanation: 傾完交通安排，知道原本出門時間太遲。可以重述實際結論：大家要早啲走。`即係話` 引出呢個換個講法嘅意思。
    examples:
      - text: 即係話，我哋要早啲出門。
        meaning: 意思係換句話講，要提早出門。`我哋` 係大家，`要` 講需要，`早啲` 係較早或者早少少，時間特徵後嘅 `啲` 表調整程度，`出門` 係出發離開屋企。
        note: 試下重述要早啲到：`即係話，我哋要早啲到。``出門` 換成 `到`。`遲啲到` 就係較遲到達，會改變實際結論，唔係重述原本提早要求。
  - subskill_id: correcting_misunderstanding
    explanation: 聽者以為係星期一，但你講星期二。兩個日子都講清楚，就知道要點改返安排。
    examples:
      - text: 我講星期二，唔係星期一。
        meaning: 意思係自己講星期二，唔係星期一。`我講星期二` 指出所講日子，之前對話提供已講過嘅時間。`唔係星期一` 排除搞錯嗰個身份，否定嘅係日子識別，唔係講嘢動作。
        note: 試下將星期四更正成星期五：`我講星期五，唔係星期四。`正確日子放先，再講搞錯嗰個。`我唔講星期一` 就否定 `講` 呢個動作，冇提供呢種清楚替代。
  - subskill_id: turns_topics
    explanation: 傾緊食嘢，可以順住問煮嘢。`講開` 將新問題連返目前話題，令轉接容易跟。
    examples:
      - text: 講開食嘢，你鍾意煮咩呀？
        meaning: 意思係講到食嘢，你鍾意煮乜。`食嘢` 喺話題片語入面講飲食，`你鍾意煮` 指煮嘢喜好，`咩` 放喺食物賓語位置問乜嘢，句尾 `呀` 配合日常問句。
        note: 試下順住閱讀話題問書：`講開睇書，你鍾意睇咩書呀？`開頭話題同問題活動一齊改。`講開睇書` 交代關係，`咩書` 問書嘅種類，未知賓語仍然喺動作後。
