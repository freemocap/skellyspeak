sections:
  - subskill_id: opening_closing
    explanation: 呢句交代準備離開，同時結束交流；喇 表示情況有轉變。
    examples:
      - text: 我走先喇，聽日見。
        meaning: 我走先喇，聽日見。
        note: 聽日見 喺離開場景係道別，唔係只講一件將來事。
  - subskill_id: acknowledging
    explanation: 表示收到資訊，唔一定等於贊同對方觀點。
    examples:
      - text: 明白，我記低咗。
        meaning: 明白，我記低咗。
        note: 記低咗 表示已經記錄；唔需要據此推斷講者同意所有內容。
  - subskill_id: clarification
    explanation: 指涉唔清楚時，邊間 要求識別對象；喺另一個語境亦可以用嚟問新資訊。
    examples:
      - text: 你講邊間舖頭呀？
        meaning: 你係指邊間舖？
        note: 呢條問題釐清對方之前講嘅舖頭係邊間。
  - subskill_id: rephrasing
    explanation: 即係話 引入重述。要確認後面保留咗上文相關意思。
    examples:
      - text: 即係話，我哋要早啲出門。
        meaning: 即係話，我哋要早啲出發。
        note: 早啲出發 概括上文安排所帶出嘅需要。
  - subskill_id: correcting_misunderstanding
    explanation: 用正確日子取代理解錯咗嘅日子，係修補意思，唔係單純表示反對。
    examples:
      - text: 我講星期二，唔係星期一。
        meaning: 我講星期二，唔係星期一。
        note: 星期二 係修正答案；唔係星期一 明確排除誤解。
  - subskill_id: turns_topics
    explanation: 講開 將新問題連到目前話題，方便對方跟住話題轉移。
    examples:
      - text: 講開食嘢，你鍾意煮咩呀？
        meaning: 講開食嘢，你鍾意煮乜？
        note: 由食物話題轉去煮食喜好，有清楚連繫。
