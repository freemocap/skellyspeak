language: cantonese
skill_id: managing_conversation
explanation_language: mandarin
shared_explanation: skills/managing-conversation/managing-conversation-explained-in-mandarin.yaml
sections:
  - subskill_id: opening_closing
    explanation: 其他人也许还留下来，但你需要先走，并预计明天再见。第一分句告诉大家自己要离开，第二分句友好道别，并提到下次见面的时间。
    examples:
      - text: 我走先喇，聽日見。
        meaning: 我先走了，明天见。`我走先` 意为我先走、比你们先离开。句末的 `喇` 表明离开这件事现在发生关联。`聽日見` 是明天见；无需重复代词，对话中的人也知道谁再见面。
        note: 试一试：预计星期一再见。答案：`我走先喇，星期一見。` 替换见面的日期，离开的表达不变。`我先走` 把 `先` 放在动作前，强调先做；熟悉的 `我走先` 则很自然地用于道别。
  - subskill_id: acknowledging
    explanation: 有人给你一个时间或一项指示，你表示已经理解并记下来。这句回答同时确认收到信息，也说出自己采取的实际行动。
    examples:
      - text: 明白，我記低咗。
        meaning: 明白，我已经记下了。`明白` 可以单独表示听懂。`記低` 意为记下；`低` 是这个记下表达的一部分。后面的 `咗` 表示记录已经完成；信息是双方已知的，所以无需再重复宾语。
        note: 试一试：表示理解，但还没有记下来。答案：`明白，我仲未記低。` 把已完成的 `記低咗` 换成 `仲未記低`，表示仍未记录。这样理解的信息不变，记录状态却改变了；听懂本身也不等于赞同。
  - subskill_id: clarification
    explanation: 对方提到一家商店，但好几家都可能符合。问清是哪一家，是在澄清不明确的指称，不是在要求重复你已经听清的句子。
    examples:
      - text: 你講邊間舖頭呀？
        meaning: 你说的是哪家商店？`你講` 在这里表示你所说的是。`邊間舖頭` 问哪家商店：`邊` 用于选择身份，`間` 是商店的量词。`呀` 结束这个日常问句。说话人放在动词前，尚未确定的商店放在后面。
        note: 试一试：问清对方说的是哪本书。答案：`你講邊本書呀？` 把 `間舖頭` 换成 `本書`；不同对象要换相应量词。`你可唔可以再講一次？` 只是请求重复，指称仍可能不清楚。
  - subskill_id: rephrasing
    explanation: 讨论行程后，大家发现原定出发时间太晚。你换一种说法重申实际结论：大家得早点出门。`即係話` 引出这种重新表述。
    examples:
      - text: 即係話，我哋要早啲出門。
        meaning: 换句话说，我们得早一点出门。`我哋` 是我们，`要` 表示需要，`早啲` 意为早一些。时间性质后面的 `啲` 标出相对调整。`出門` 意为离家出发。
        note: 试一试：改述为大家要早一点到。答案：`即係話，我哋要早啲到。` 把 `出門` 换成 `到`。`遲啲到` 却表示晚一点到，会改变实际结论，而不是重述原先的要求。
  - subskill_id: correcting_misunderstanding
    explanation: 听话人以为你说星期一，其实你说的是星期二。同时点出原定和被排除的日期，才能具体纠正安排。
    examples:
      - text: 我講星期二，唔係星期一。
        meaning: 我说的是星期二，不是星期一。`我講星期二` 确认你说出的日期；前面的对话提供当时说话的背景。`唔係星期一` 排除听错的星期一。`唔係` 否定所指的日期，并不是否定说话这一动作。
        note: 试一试：把听错的星期四纠正为星期五。答案：`我講星期五，唔係星期四。` 原意放在前，误听的日期放在后。`我唔講星期一` 则否定 `講`，说的是我不说星期一，没有提供这样明确的替代日期。
  - subskill_id: turns_topics
    explanation: 谈到食物时，可以顺势问对方喜欢做什么菜。`講開` 把新问题与正在讨论的话题连起来，使转换容易跟上。
    examples:
      - text: 講開食嘢，你鍾意煮咩呀？
        meaning: 说到吃的，你喜欢做什么？`食嘢` 在这里指吃东西或食物这个话题。`你鍾意煮` 表示你喜欢烹调；`咩` 放在食物宾语的位置，询问做什么。句末的 `呀` 符合日常问句语气。
        note: 试一试：把关于阅读的谈话接到关于书的问题。答案：`講開睇書，你鍾意睇咩書呀？` 开头的话题和问句中的活动都改变。`講開睇書` 引出联系；`咩書` 问什么书，未知对象仍放在动作后。
