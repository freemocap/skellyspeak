skill_id: managing_conversation
explanation_language: spanish
shared_explanation: skills/managing-conversation/managing-conversation-explained-in-spanish.yaml
sections:
  - subskill_id: opening_closing
    explanation: Necesitas irte mientras los demás quizá se quedan y esperas verlos mañana. La primera
      parte anuncia tu salida y la segunda se despide con referencia al próximo encuentro.
    examples:
      - text: 我走先喇，聽日見。
        meaning: Me voy ya; hasta mañana. `我走先` significa me voy primero o salgo antes que vosotros. El `喇`
          final señala que marcharse ya es relevante. `聽日見` significa hasta mañana; se sobreentiende
          quiénes se verán, sin repetir pronombres.
        note: "**Practica:** esperas verlos el lunes. Respuesta: `我走先喇，星期一見。` Cambia el día del encuentro;
          la salida queda igual. `我先走` pone `先` antes de la acción para destacar que se hace
          primero, mientras `我走先` funciona naturalmente como despedida conocida."
  - subskill_id: acknowledging
    explanation: Alguien te da una hora o una instrucción y muestras que la has comprendido y anotado.
      La respuesta reconoce el mensaje e indica qué acción práctica has realizado.
    examples:
      - text: 明白，我記低咗。
        meaning: Entendido; lo he anotado. `明白` puede expresar por sí solo que has comprendido. `記低`
          significa apuntar y `低` forma parte de esa expresión. `咗` tras ella presenta la anotación
          como realizada; no se repite el objeto porque ya se conoce la información.
        note: "**Practica:** reconoce que entendiste, pero aún no lo has anotado. Respuesta: `明白，我仲未記低。`
          Sustituye `記低咗`, ya anotado, por `仲未記低`, todavía sin anotar. Se mantiene la comprensión y
          cambia el estado de la anotación; comprender no implica aceptar."
  - subskill_id: clarification
    explanation: La otra persona menciona una tienda, pero podría referirse a varias. Preguntar cuál
      resuelve esa referencia poco clara, sin pedir que repitan una oración que ya oíste.
    examples:
      - text: 你講邊間舖頭呀？
        meaning: "¿De qué tienda hablas? `你講` significa aquí «hablas de». `邊間舖頭` pregunta qué tienda: `邊`
          selecciona la identidad y `間` clasifica la tienda. `呀` cierra la pregunta conversacional.
          La persona precede al verbo y la tienda desconocida lo sigue."
        note: "**Practica:** aclara a qué libro se refiere. Respuesta: `你講邊本書呀？` Cambia `間舖頭` por `本書`; el
          clasificador cambia con el objeto. `你可唔可以再講一次？` pide repetir, pero quizá deje sin resolver
          a qué se refiere."
  - subskill_id: rephrasing
    explanation: "La conversación sobre un viaje ha mostrado que la salida inicial es demasiado tardía.
      Reformulas la conclusión práctica: el grupo debe partir antes. `即係話` introduce esa
      reformulación."
    examples:
      - text: 即係話，我哋要早啲出門。
        meaning: En otras palabras, tenemos que salir antes. `我哋` significa nosotros, `要` indica necesidad y
          `早啲`, más temprano. `啲` tras la cualidad temporal marca un ajuste relativo. `出門` significa
          salir de casa o ponerse en camino.
        note: "**Practica:** reformula que el grupo debe llegar antes. Respuesta: `即係話，我哋要早啲到。` Sustituye
          `出門` por `到`, llegar. `遲啲到` significaría llegar más tarde y cambiaría la conclusión en vez
          de reformularla."
  - subskill_id: correcting_misunderstanding
    explanation: La otra persona entendió lunes, pero tú dijiste martes. Nombrar el día pretendido y el
      descartado precisa lo suficiente la corrección para actualizar el plan.
    examples:
      - text: 我講星期二，唔係星期一。
        meaning: Dije martes, no lunes. `我講星期二` identifica el día que dijiste; la conversación previa
          permite entender que fue antes. `唔係星期一` significa no lunes y excluye la interpretación
          errónea. `唔係` niega la identificación, no el acto de hablar.
        note: "**Practica:** corrige jueves por viernes. Respuesta: `我講星期五，唔係星期四。` Primero va el día
          pretendido, después el equivocado. `我唔講星期一` significa no digo lunes; niega `講` y no aporta
          este reemplazo preciso."
  - subskill_id: turns_topics
    explanation: Una conversación sobre comida abre la posibilidad de preguntar por la cocina. `講開`
      vincula la pregunta nueva con el tema anterior, facilitando la transición.
    examples:
      - text: 講開食嘢，你鍾意煮咩呀？
        meaning: Hablando de comida, ¿qué te gusta cocinar? `食嘢` significa comer o comida en esta frase
          temática. `你鍾意煮` es te gusta cocinar; `咩` ocupa el lugar del alimento desconocido y
          pregunta qué. El `呀` final encaja con la conversación.
        note: "**Practica:** relaciona una charla de lectura con una pregunta sobre libros. Respuesta:
          `講開睇書，你鍾意睇咩書呀？` Cambian el tema inicial y la actividad preguntada. `講開睇書` introduce el
          vínculo; `咩書` pregunta qué libros y permanece después de la acción."
