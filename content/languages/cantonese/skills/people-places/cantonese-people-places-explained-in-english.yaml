skill_id: people_places
explanation_language: english
shared_explanation: skills/people-places/people-places-explained-in-english.yaml
sections:
  - subskill_id: identification
    explanation: You introduce someone to another person and state your relationship. `呢位` politely
      points to this person; `係` connects them to the identifying noun phrase.
    examples:
      - text: 呢位係我朋友。
        meaning: This is my friend. `呢` means this and `位` is a respectful classifier for a person. `我朋友`
          means my friend; a familiar personal relationship can appear without `嘅`. `係` introduces
          the noun identification, rather than a description of mood or size.
        note: "Try it: introduce your teacher. Answer: `呢位係我老師。` Replace the relationship with `老師`.
          `呢個係我朋友` also identifies a friend with the general classifier `個`; `位` gives the
          introduction a more respectful tone."
  - subskill_id: qualities_states
    explanation: You are choosing a place to read and describe this room as quiet. A quality such as `靜`
      can serve directly as the description; `好` makes a natural positive quality phrase.
    examples:
      - text: 呢間房好靜。
        meaning: This room is quiet. `呢間房` is this room, with classifier `間` between `呢` and `房`. `好靜` says
          quiet or very quiet. There is no `係` before this ordinary adjective description; `係` is
          useful for identifying a person or thing with a noun.
        note: "Try it: describe the room as bright. Answer: `呢間房好光猛。` Replace `靜` with `光猛`, bright. `呢間房唔靜`
          says the room is not quiet, using `唔` before the quality; `呢間房係課室` identifies it as a
          classroom and therefore uses `係`."
  - subskill_id: location_movement
    explanation: You are trying to find someone, and a reply tells you they are at the library. `喺`
      locates the person; a destination with `去` would instead describe going somewhere.
    examples:
      - text: 佢喺圖書館。
        meaning: They are at the library. `佢` refers to one person and does not mark their gender; English
          singular they avoids guessing it. `喺圖書館` means at the library, with the place after `喺`.
          The sentence reports location, not the journey there.
        note: "Try it: locate the whole group there. Answer: `佢哋喺圖書館。` Replace singular `佢` with plural
          `佢哋`; the location expression stays. `佢去圖書館` means they go or are going to the library,
          with `去` giving movement towards it."
  - subskill_id: possession_relations
    explanation: Several books have been left on a table, and you identify the one belonging to you. The
      book comes first, followed by a phrase naming its owner.
    examples:
      - text: 呢本書係我嘅。
        meaning: This book is mine. `呢本書` is this book, with classifier `本`. `係我嘅` means is mine; `嘅`
          follows the owner `我` and lets the possession phrase stand without repeating the book.
          `我嘅書` would mean my book when the noun is included.
        note: "Try it: identify the listener as the owner. Answer: `呢本書係你嘅。` Change `我` to `你` after `係`.
          `我有呢本書` instead says you have this book; possession with `有` does not use the same
          owner-identification frame."
  - subskill_id: quantity_comparison
    explanation: You are counting the books available to lend. A number combines with the book’s
      classifier before the noun; the noun itself does not need a plural ending.
    examples:
      - text: 我有三本書。
        meaning: I have three books. `我有` means I have; `三本書` means three books, with number `三`, classifier
          `本` and noun `書` in that order. `有` reports what is available to the speaker.
        note: "Try it: say you have two books. Answer: `我有兩本書。` This ordinary quantity uses `兩` before the
          classifier; learn `兩本` as the counting phrase. To compare totals, `我有三本書，你有兩本，我多一本。` says
          you have one more."
