skill_id: people_places
explanation_language: english
shared_explanation: skills/people-places/people-places-explained-in-english.yaml
sections:
  - subskill_id: identification
    explanation: 係 links a person to a noun description; 位 is a respectful classifier for people.
    examples:
      - text: 呢位係我朋友。
        meaning: This is my friend.
        note: Original teaching example; interpret its function in the conversational context described
          above.
  - subskill_id: qualities_states
    explanation: 好靜 predicates a quality directly; an English “is” does not require inserting 係.
    examples:
      - text: 呢間房好靜。
        meaning: This room is quiet.
        note: Original teaching example; interpret its function in the conversational context described
          above.
  - subskill_id: location_movement
    explanation: 喺 locates the person. Singular 佢 does not encode gender like English he/she.
    examples:
      - text: 佢喺圖書館。
        meaning: They are at the library.
        note: Original teaching example; interpret its function in the conversational context described
          above.
  - subskill_id: possession_relations
    explanation: 我嘅 identifies the possessor without repeating 書.
    examples:
      - text: 呢本書係我嘅。
        meaning: This book is mine.
        note: Original teaching example; interpret its function in the conversational context described
          above.
  - subskill_id: quantity_comparison
    explanation: 本 is the classifier for 書 here. Quantity does not require a plural ending on 書.
    examples:
      - text: 我有三本書。
        meaning: I have three books.
        note: Original teaching example; interpret its function in the conversational context described
          above.
