sections:
  - subskill_id: identification
    explanation: تعرّف شخصًا إلى آخر وتذكر علاقتك به. تشير `呢位` إلى هذا الشخص بأدب؛ وتربط `係` الشخص
      بالعبارة الاسمية التي تحدد هويته.
    examples:
      - text: 呢位係我朋友。
        meaning: هذا صديقي. تعني `呢` هذا، و`位` أداة تصنيف احترام للشخص. وتعني `我朋友` صديقي؛ ويمكن أن تظهر
          علاقة شخصية مألوفة من دون `嘅`. تقدم `係` التعريف باسم، لا وصف المزاج أو الحجم.
        note: "جرّب تقديم معلّمك. الإجابة: `呢位係我老師。` استبدل العلاقة بـ`老師`. وتحدد `呢個係我朋友` الصديق أيضًا
          باستخدام أداة التصنيف العامة `個`؛ لكن `位` تضفي على التقديم احترامًا أكبر."
  - subskill_id: qualities_states
    explanation: تختار مكانًا للقراءة وتصف هذه الغرفة بالهدوء. يمكن لصفة مثل `靜` أن تأتي مباشرةً في
      الوصف؛ وتجعل `好` العبارة الوصفية الإيجابية طبيعية.
    examples:
      - text: 呢間房好靜。
        meaning: هذه الغرفة هادئة. تعني `呢間房` هذه الغرفة، وتقع أداة التصنيف `間` بين `呢` و`房`. وتعني `好靜`
          هادئة أو هادئة جدًا. لا توضع `係` قبل هذا الوصف العادي بالصفة؛ وتفيد `係` في تعريف شخص أو
          شيء باسم.
        note: "جرّب وصف الغرفة بأنها مضيئة. الإجابة: `呢間房好光猛。` استبدل `靜` بـ`光猛`، أي مضيئة. تقول `呢間房唔靜` إن
          الغرفة ليست هادئة بوضع `唔` قبل الصفة؛ وتعرّفها `呢間房係課室` بأنها فصل دراسي، ولذلك تستخدم
          `係`."
  - subskill_id: location_movement
    explanation: تبحث عن شخص، ويخبرك الرد بأنه في المكتبة. تحدد `喺` مكان الشخص؛ أما الوجهة مع `去` فتصف
      الذهاب إلى مكان.
    examples:
      - text: 佢喺圖書館。
        meaning: ذلك الشخص في المكتبة. تشير `佢` إلى شخص واحد ولا تحدد جنسه. وتعني `喺圖書館` في المكتبة، ويأتي
          المكان بعد `喺`. تخبر الجملة بالموقع، لا بالرحلة إليه.
        note: "جرّب تحديد مكان المجموعة كلها هناك. الإجابة: `佢哋喺圖書館。` استبدل المفرد `佢` بالجمع `佢哋`، وأبقِ
          عبارة المكان. تعني `佢去圖書館` أن ذلك الشخص يذهب أو هو ذاهب إلى المكتبة؛ وتدل `去` على الحركة
          نحوها."
  - subskill_id: possession_relations
    explanation: تُركت كتب عدة على طاولة، فتحدد الكتاب الذي يخصك. يأتي الكتاب أولًا، وتتلوه عبارة تحدد مالكه.
    examples:
      - text: 呢本書係我嘅。
        meaning: هذا الكتاب لي. تعني `呢本書` هذا الكتاب باستخدام أداة التصنيف `本`. وتعني `係我嘅` «هو لي»؛ تأتي
          `嘅` بعد المالك `我` وتسمح بوقوف عبارة الملكية دون تكرار الكتاب. وتعني `我嘅書` «كتابي» عندما
          يُذكر الاسم.
        note: "جرّب تحديد المخاطَب مالكًا للكتاب. الإجابة: `呢本書係你嘅。` غيّر `我` إلى `你` بعد `係`. أما `我有呢本書`
          فتقول إن الكتاب بحوزتك؛ ولا يستخدم التعبير عن الحيازة بـ`有` تركيب تحديد المالك نفسه."
  - subskill_id: quantity_comparison
    explanation: تعدّ الكتب المتاحة للإعارة. يقترن العدد بأداة تصنيف الكتاب قبل الاسم؛ ولا يحتاج الاسم
      نفسه إلى علامة جمع.
    examples:
      - text: 我有三本書。
        meaning: لدي ثلاثة كتب. تعني `我有` لدي، وتعني `三本書` ثلاثة كتب، بترتيب العدد `三` ثم أداة التصنيف `本`
          ثم الاسم `書`. تخبر `有` بما يتوافر لدى المتكلم.
        note: "جرّب أن تقول إن لديك كتابين. الإجابة: `我有兩本書。` تستخدم هذه الكمية المعتادة `兩` قبل أداة
          التصنيف؛ تعلّم `兩本` عبارةً للعد. ولمقارنة العددين تقول `我有三本書，你有兩本，我多一本。` إن لديك كتابًا
          إضافيًا."
