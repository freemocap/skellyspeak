sections:
  - subskill_id: identification
    explanation: 係 將人物同名詞描述連起嚟；位 係較有禮貌嘅人物量詞。
    examples:
      - text: 呢位係我朋友。
        meaning: 呢位係我朋友。
        note: 呢位 指人，係我朋友 交代佢同講者嘅關係。
  - subskill_id: qualities_states
    explanation: 好靜 可以直接描述特徵，唔需要因為英文有 is 就加 係。
    examples:
      - text: 呢間房好靜。
        meaning: 呢間房好靜。
        note: 好靜 係謂語，直接描述間房。
  - subskill_id: location_movement
    explanation: 喺 交代人物位置。單數 佢 唔似英文 he、she 咁區分性別。
    examples:
      - text: 佢喺圖書館。
        meaning: 佢喺圖書館。
        note: 唔可以單憑 佢 就推斷嗰個人嘅性別。
  - subskill_id: possession_relations
    explanation: 我嘅 指出擁有人，唔使再重複 書。
    examples:
      - text: 呢本書係我嘅。
        meaning: 呢本書係我嘅。
        note: 我嘅 可以獨立指「屬於我嗰本」。
  - subskill_id: quantity_comparison
    explanation: 本 喺呢度係 書 嘅量詞。表示數量時，書 唔需要複數詞尾。
    examples:
      - text: 我有三本書。
        meaning: 我有三本書。
        note: 三本 已經交代數量，唔會將 書 加成類似英文 -s 嘅形式。
