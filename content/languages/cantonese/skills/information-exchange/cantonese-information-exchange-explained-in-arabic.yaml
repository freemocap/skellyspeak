sections:
  - subskill_id: asking_information
    explanation: قبل زيارة المتجر تحتاج إلى معرفة وقت إغلاقه. تسأل `幾點` عن وقت الساعة المجهول في الموضع
      الذي يُذكر فيه الوقت؛ ويبقى المتجر في أول الجملة.
    examples:
      - text: 間舖頭幾點閂門？
        meaning: متى يغلق المتجر؟ تعني `間舖頭` المتجر؛ ويمكن لأداة التصنيف `間` تحديد المكان المطروح في الحديث.
          تسأل `幾點` «في أي ساعة؟»، وتعني `閂門` هنا إغلاق الأبواب أو إغلاق المتجر. لا يقترح السؤال
          وقتًا للإغلاق.
        note: "جرّب السؤال عن وقت فتح المتجر. الإجابة: `間舖頭幾點開門？` استبدل `閂門` بـ`開門`. قد تكون الإجابة `六點`
          أو `六點開門`؛ إذ يملأ الوقت موضع `幾點` في السؤال بدل الانتقال إلى ترتيب آخر."
  - subskill_id: answering_information
    explanation: سأل الشخص الآخر للتو عن موعد إغلاق المتجر. وبما أن المتجر والإغلاق معروفان بالفعل، يكفي
      ذكر وقت الساعة وحده للإجابة في هذا الحوار.
    examples:
      - text: 六點。
        meaning: في السادسة. تعني `六` ستة، وتحدد `點` الساعة. ويمكن أن تكون الإجابة المطولة `間舖頭六點閂門`. إن لم
          تُذكر فترة الصباح أو المساء، يحدد سياق الحوار أي ساعة سادسة مقصودة.
        note: "جرّب ذكر السادسة والنصف وقتًا للإغلاق. الإجابة: `六點半。` تضيف `半` نصف ساعة بعد السادسة. ولزيادة
          الدقة تحدد `下晝六點半` السادسة والنصف مساءً. أما مدة مثل `六個鐘` فتعني ست ساعات، ولا تعطي وقت
          الساعة المطلوب."
  - subskill_id: checking_facts
    explanation: تتذكر أن المتجر يغلق في السادسة وتريد من شخص تأكيد ذلك. تذكر العبارة الوقت الذي ترجحه،
      وتدعو `係咪呀` في نهايتها إلى التأكيد أو التصحيح.
    examples:
      - text: 間舖頭六點閂門，係咪呀？
        meaning: يغلق المتجر في السادسة، أليس كذلك؟ تضع `間舖頭六點閂門` المتجر المعروف قبل الوقت المقترح والفعل.
          `係咪` صيغة مختصرة شائعة من `係唔係`، بمعنى «أهو كذلك أم لا؟»؛ وتناسب `呀` الأخيرة السؤال
          الحواري.
        note: "جرّب التحقق من الإغلاق في السابعة. الإجابة: `間舖頭七點閂門，係咪呀？` غيّر الوقت المقترح فقط. وقد يكون
          الرد المصحح `唔係，六點閂門。` فهو يرفض المعلومة المقترحة ويقدم الوقت الصحيح بدل ترك المخاطَب
          يخمّنه."
  - subskill_id: useful_detail
    explanation: توجد طاولات عدة، لذا يجعل تحديد الطاولة قرب النافذة التعليمات قابلة للتنفيذ. يأتي وصف
      الموقع قبل العبارة التي تختار تلك الطاولة بالذات.
    examples:
      - text: 用窗口旁邊嗰張枱。
        meaning: استخدم الطاولة بجانب النافذة. تعني `用` استخدم، و`窗口旁邊` بجانب النافذة، و`嗰張枱` تلك الطاولة.
          `張` أداة تصنيف للطاولة. ويميّز الموقع واسم الإشارة معًا الطاولة من غيرها.
        note: "جرّب اختيار الطاولة بجانب الباب بدلًا من ذلك. الإجابة: `用門口旁邊嗰張枱。` استبدل علامة المكان
          بـ`門口`. تختار `嗰張枱` طاولة واحدة؛ أما `嗰啲枱` فتختار تلك الطاولات باستخدام `啲` لمجموعة
          الجمع."
