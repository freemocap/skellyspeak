sections:
  - subskill_id: asking_information
    explanation: 幾點 放喺句內問鐘點，唔需要英文式助動詞倒裝。
    examples:
      - text: 間舖頭幾點閂門？
        meaning: 間舖幾點閂門？
        note: 未知資訊係關門時間，唔係邊間舖。
  - subskill_id: answering_information
    explanation: 上文問關門時間時，簡短鐘點短語就可以完整回答；功能要睇語境。
    examples:
      - text: 六點。
        meaning: 六點。
        note: 呢度 六點 補足上一條問題所缺嘅時間。
  - subskill_id: checking_facts
    explanation: 係咪 核實一個已有候選答案，唔係完全開放咁查問資訊。
    examples:
      - text: 間舖頭六點閂門，係咪呀？
        meaning: 間舖六點閂門，係咪？
        note: 六點 已經喺問題入面提出，對方可以確認或修正。
  - subskill_id: useful_detail
    explanation: 位置描述同 嗰張 交代用邊張枱。細節要能夠解決相關分別先有用。
    examples:
      - text: 用窗口旁邊嗰張枱。
        meaning: 用窗邊嗰張枱。
        note: 窗邊 將要用嘅枱同其他枱區分開。
