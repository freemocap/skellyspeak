sections:
  - subskill_id: asking_information
    explanation: 去間舖之前，需要知道幾點關門。`幾點` 放喺時間片語位置，問缺少嘅鐘點，間舖仍然放句首。
    examples:
      - text: 間舖頭幾點閂門？
        meaning: 意思係問間舖嘅關門時間。`間舖頭` 用量詞 `間` 指大家講緊嘅舖，`幾點` 問鐘點，`閂門` 呢度係收舖關門。問題冇預先提出一個關門時間。
        note: 試下問開門時間：`間舖頭幾點開門？``閂門` 換成 `開門`。可以答 `六點` 或者 `六點開門`，時間補上 `幾點` 嗰個位置，唔使換另一種問句次序。
  - subskill_id: answering_information
    explanation: 對方啱啱問舖頭幾點關門，間舖同關門都已經清楚，所以淨係講鐘點已經答到問題。
    examples:
      - text: 六點。
        meaning: 意思係六點。`六` 係數字，`點` 交代鐘點。完整可以講 `間舖頭六點閂門`。冇講朝早定下晝時，要由對話理解係邊個六點。
        note: 試下答六點半關：`六點半。``半` 加六點之後半個鐘。要講清楚可以用 `下晝六點半`。`六個鐘` 係六小時長度，唔係所問鐘點。
  - subskill_id: checking_facts
    explanation: 你記得間舖六點關門，想請人確認。先陳述記得嘅時間，再用句尾 `係咪呀` 請對方核實或者更正。
    examples:
      - text: 間舖頭六點閂門，係咪呀？
        meaning: 意思係核實六點係咪關門時間。`間舖頭六點閂門` 先講間舖，再講提出嘅時間同動作。`係咪` 常用作 `係唔係` 嘅縮短形式，句尾 `呀` 配合日常問句語氣。
        note: 試下核實七點關：`間舖頭七點閂門，係咪呀？`只改提出嘅時間。更正可以答 `唔係，六點閂門。`，先否定再提供正確時間，唔使對方估。
  - subskill_id: useful_detail
    explanation: 有幾張枱可用，指出窗口旁邊嗰張，就知道要用邊張。位置描述放喺揀出嗰張枱嘅片語之前。
    examples:
      - text: 用窗口旁邊嗰張枱。
        meaning: 意思係用窗邊嗰張枱。`用` 講動作，`窗口旁邊` 講位置，`嗰張枱` 指嗰一張，`張` 係枱嘅量詞。位置加指示令佢同其他枱分開。
        note: 試下改用門口旁邊嗰張：`用門口旁邊嗰張枱。`地標換成 `門口`。`嗰張枱` 揀一張，`嗰啲枱` 就揀嗰幾張枱，用 `啲` 指複數組。
