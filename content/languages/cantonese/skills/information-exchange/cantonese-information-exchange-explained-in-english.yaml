skill_id: information_exchange
explanation_language: english
shared_explanation: skills/information-exchange/information-exchange-explained-in-english.yaml
sections:
  - subskill_id: asking_information
    explanation: Before visiting the shop, you need to know its closing time. `幾點` asks for the missing
      clock time in the place where a time expression belongs; the shop stays at the beginning.
    examples:
      - text: 間舖頭幾點閂門？
        meaning: What time does the shop close? `間舖頭` means the shop; the classifier `間` can identify the
          place already under discussion. `幾點` asks what time, and `閂門` means close the doors or
          close for business here. The question does not propose a closing time.
        note: "Try it: ask when the shop opens. Answer: `間舖頭幾點開門？` Replace `閂門` with `開門`. A possible answer
          is `六點` or `六點開門`; the time fills the question’s `幾點` slot instead of moving to a
          different question order."
  - subskill_id: answering_information
    explanation: The other person has just asked when the shop closes. Since the shop and closing are
      already known, a clock time alone provides a complete conversational answer.
    examples:
      - text: 六點。
        meaning: At six. `六` is six and `點` gives the clock hour. A fuller answer is `間舖頭六點閂門`. Without a
          morning or afternoon expression, the exchange determines which six o’clock is meant.
        note: "Try it: give 6:30 as the closing time. Answer: `六點半。` `半` adds half an hour after six. For
          precision, `下晝六點半` specifies the afternoon. A duration such as `六個鐘` means six hours and
          would not give the required clock time."
  - subskill_id: checking_facts
    explanation: You remember that the shop closes at six and want someone to confirm it. The statement
      gives your candidate time, and the tag `係咪呀` invites confirmation or correction.
    examples:
      - text: 間舖頭六點閂門，係咪呀？
        meaning: The shop closes at six, right? `間舖頭六點閂門` puts the known shop before the proposed time and
          action. `係咪` is a common shortened form of `係唔係`, is it or is it not; final `呀` suits the
          conversational question.
        note: "Try it: check a seven-o’clock closing time. Answer: `間舖頭七點閂門，係咪呀？` Change only the proposed
          time. A correcting reply can say `唔係，六點閂門。` It rejects the proposed fact and supplies the
          correct time rather than leaving the listener to guess."
  - subskill_id: useful_detail
    explanation: Several tables are available, so naming the one beside the window makes the instruction
      usable. The location description goes before the phrase selecting that particular table.
    examples:
      - text: 用窗口旁邊嗰張枱。
        meaning: Use the table beside the window. `用` is use, `窗口旁邊` means beside the window, and `嗰張枱`
          means that table. `張` is the classifier for the table. Together the location and
          demonstrative distinguish it from the other tables.
        note: "Try it: choose the table beside the door instead. Answer: `用門口旁邊嗰張枱。` Replace the landmark
          with `門口`. `嗰張枱` selects one table; `嗰啲枱` selects those tables, using `啲` for the plural
          group."
