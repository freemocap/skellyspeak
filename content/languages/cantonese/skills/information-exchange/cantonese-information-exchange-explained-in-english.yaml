language: cantonese
skill_id: information_exchange
explanation_language: english
shared_explanation: skills/information-exchange/information-exchange-explained-in-english.yaml
sections:
  - subskill_id: asking_information
    explanation: 幾點 asks for clock time within the clause; English-style auxiliary inversion is not required.
    examples:
      - text: 間舖頭幾點閂門？
        meaning: What time does the shop close?
        note: Original teaching example; interpret its function in the conversational context described
          above.
  - subskill_id: answering_information
    explanation: After a closing-time question, a short time phrase supplies the answer. Its function
      depends on that context.
    examples:
      - text: 六點。
        meaning: At six.
        note: Original teaching example; interpret its function in the conversational context described
          above.
  - subskill_id: checking_facts
    explanation: 係咪 checks a candidate answer rather than asking for entirely unknown information.
    examples:
      - text: 間舖頭六點閂門，係咪呀？
        meaning: The shop closes at six, right?
        note: Original teaching example; interpret its function in the conversational context described
          above.
  - subskill_id: useful_detail
    explanation: The location and 嗰張 identify which table to use. Detail is useful when it resolves a
      relevant distinction.
    examples:
      - text: 用窗口旁邊嗰張枱。
        meaning: Use the table beside the window.
        note: Original teaching example; interpret its function in the conversational context described
          above.
