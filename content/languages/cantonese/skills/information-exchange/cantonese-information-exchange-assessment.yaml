language: cantonese
skill_id: information_exchange
guidance: Assess information exchange from the learner’s contribution in context. 間舖頭幾點閂門？ (What
  time does the shop close?) can demonstrate asking information. 幾點 asks for clock time within the
  clause; English-style auxiliary inversion is not required. 六點。 (At six.) can demonstrate answering
  information. After a closing-time question, a short time phrase supplies the answer. Its function
  depends on that context. 間舖頭六點閂門，係咪呀？ (The shop closes at six, right?) can demonstrate checking
  facts. 係咪 checks a candidate answer rather than asking for entirely unknown information. 用窗口旁邊嗰張枱。
  (Use the table beside the window.) can demonstrate useful detail. The location and 嗰張 identify
  which table to use. Detail is useful when it resolves a relevant distinction. Credit a function
  only when accomplished in the exchange; copied isolated forms are insufficient. Do not require
  Mandarin forms or infer Cantonese pronunciation from written characters.
