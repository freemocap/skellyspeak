# yaml-language-server: $schema=../schemas/language.json
schema_version: 1
identity:
  id: cherokee
  name: Cherokee
  native_name: ᏣᎳᎩ
  family: iroquoian
  review: needs_review
integrations:
  language_tag: chr
definitions:
  orthographies:
    cherokee-syllabary:
      script: cherokee
      guidance:
      - scope: target_writing
        text: Write Cherokee using the Cherokee syllabary, with ordinary word spacing and punctuation.
          Preserve quoted source text exactly, including uppercase or lowercase syllabary. Keep Cherokee
          letters distinct from visually similar Latin letters. Use contemporary Oklahoma Cherokee forms
          for new conversation text.
        sources:
        - unicode17_cherokee
        - cherokee_verb_handbook2003
      - scope: explanation_writing
        text: Write Cherokee using the Cherokee syllabary, with ordinary word spacing and punctuation.
          Preserve quoted source text exactly, including uppercase or lowercase syllabary. Keep Cherokee
          letters distinct from visually similar Latin letters. Use contemporary Oklahoma Cherokee forms
          for new conversation text.
        sources:
        - unicode17_cherokee
        - cherokee_verb_handbook2003
  romanization_schemes:
    traditional-syllabary:
      label: Traditional syllabary transliteration
      instructions: Return Latin letters in romanization, never Cherokee syllabary characters. For example,
        the romanization field for ᎣᏏᏲ is osiyo, not ᎣᏏᏲ; the field for ᏩᏙ is wado, not ᏩᏙ.
        Transliterate syllabary with traditional syllable values, using a, e, i, o, u and
        v; v represents a nasal vowel, not the English consonant. Use ts, qu and tl in their corresponding
        syllable series and preserve word boundaries. Do not manufacture tone, vowel length or glottal
        stops absent from the source; explain those separately when established in context. Preserve supplied
        linguistic transcriptions verbatim. Never replace the Cherokee source with romanization.
      examples:
      - original: ᎣᏏᏲ
        romanized: osiyo
      - original: ᏩᏙ
        romanized: wado
      - original: ᏣᎳᎩ
        romanized: tsalagi
      sources:
      - cherokee_verb_handbook2003
      - unicode17_cherokee
      review: needs_review
defaults:
  variety: cherokee-oklahoma
  orthography:
    local: cherokee-syllabary
  scalars: {}
  romanization:
    mode: scheme
    scheme:
      local: traditional-syllabary
  supported_romanizations:
  - local: traditional-syllabary
traits:
- tones
varieties:
- id: cherokee-oklahoma
  name: Oklahoma
  description: Contemporary Oklahoma Cherokee, using the Cherokee syllabary and traditional syllabary
    transliteration.
  review: needs_review
  sources:
  - cherokee_verb_handbook2003
  overrides: {}
  guidance: []
guidance:
- scope: segmentation
  text: Keep complete written words intact while identifying meaningful verb stems and affixes. Do not
    force Cherokee grammatical structure into an English word-for-word template.
  sources:
  - cherokee_verb_handbook2003
- scope: assessment
  text: Evaluate the meaning and context of the complete Cherokee form. Distinguish syllabary spelling
    from tone, vowel length and glottal-stop information; do not infer a pronunciation mistake from unmarked
    writing alone.
  sources:
  - cherokee_verb_handbook2003
learning:
  goal_material:
    courtesy:
      tokens:
      - ᏩᏙ
conversation:
  greeting:
    text: ᎣᏏᏲ
    romanizations:
      cherokee:traditional-syllabary: osiyo
  default_partner:
    name: ᏌᎵ
    romanizedName: Sali
    age: 34
    location: Tahlequah, Oklahoma
    occupation: Repairs bicycles at a neighbourhood workshop
    background: Grew up near Tahlequah speaking Cherokee with family. Enjoys practical projects and spending
      time with friends.
    currentSituation: Repairing a bicycle and planning a visit with family.
    interests:
    - repairing bicycles
    - walking
    - photography
    opinions:
    - A useful repair should be explained clearly.
    interestingFacts:
    - Keeps a notebook of repairs and sketches.
    favoriteBooks:
    - The Little Prince — Antoine de Saint-Exupéry
    favoriteMovies:
    - My Neighbor Totoro (1988)
    manner: Direct and patient. Uses everyday Oklahoma Cherokee and concrete situations.
    quirks:
    - Saves useful spare parts in labelled jars.
    vibe:
    - 🚲
    - 📓
