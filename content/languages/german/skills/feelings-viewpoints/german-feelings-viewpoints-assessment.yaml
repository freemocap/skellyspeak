skill_id: feelings_viewpoints
guidance: Look for desire or intention, preference, emotion, evaluation, or alignment with an
  identifiable position. Ich will den Kurs wechseln expresses an intention or wish, not an
  automatic promise. Möchte can express a wish, but in a service exchange it can primarily
  request something. Ich fahre lieber mit dem Zug expresses preference; a neutral speed
  comparison alone does not. Ich freue mich über die Nachricht uses a reflexive emotional
  construction. Ich freue über die Nachricht, when intended as that construction, is
  unsuccessful if no other correct feeling or viewpoint is expressed. Meiner Meinung nach ist
  der Weg zu lang explicitly frames an evaluation; an ordinary factual report need not be an
  opinion. Da bin ich anderer Meinung responds to a prior position. Ja after a factual opinion
  can align contextually, but after an invitation it may accept action, and after an explanation
  it may simply acknowledge receipt. Establish the antecedent rather than assigning all these
  functions. Third-person feelings may be reported correctly without being the learner's own
  stance.
