sections:
  - subskill_id: wants_intentions
    explanation: A course you plan to take in autumn can be presented as something you want to do. `Ich
      will` expresses the speaker’s intention or wish; German `will` is a form of `wollen`, not a
      future auxiliary.
    examples:
      - text: Ich will im Herbst einen Sprachkurs besuchen.
        meaning: "**The example.** I want to attend a language course in the autumn. `im Herbst` means in
          autumn; `im` combines `in dem`. `einen Sprachkurs` is a language course, a masculine
          accusative object. `besuchen` here means attend and stays in the infinitive at the end
          after `will`."
        note: "`Ich möchte` presents a wish more gently than `Ich will`. Try it: express the same wish with
          that softer wording. Answer: `Ich möchte im Herbst einen Sprachkurs besuchen`. The course,
          season and infinitive stay unchanged; the modal changes the tone."
  - subskill_id: preferences
    explanation: "When two ways of travelling are available, `lieber` identifies the one you prefer. It
      is the comparative of `gern`: `gern` says you enjoy something, while `lieber` ranks it against
      another choice."
    examples:
      - text: Ich fahre lieber mit dem Zug als mit dem Bus.
        meaning: "**The example.** I prefer travelling by train to travelling by bus. `Ich fahre` is I
          travel or go by transport. `mit dem Zug` means by train and `mit dem Bus` by bus; `mit`
          takes dative `dem`. `lieber … als` connects the preferred choice with the less preferred
          one."
        note: "Try it: prefer the bus instead. Answer: `Ich fahre lieber mit dem Bus als mit dem Zug`.
          Exchange the two transport phrases; keep `lieber` before the preferred choice and `als`
          before the other. `Ich fahre gern mit dem Zug` expresses enjoyment without this ranking."
  - subskill_id: emotions
    explanation: A welcome message has arrived, and you want to say it makes you happy. `sich freuen
      über` expresses pleasure about something; the reflexive pronoun belongs with the person who
      feels it.
    examples:
      - text: Ich freue mich über deine Nachricht.
        meaning: "**The example.** I am happy about your message. `Ich freue mich` means I am happy; `mich`
          goes with `ich`. `über deine Nachricht` names the reason, your message. Feminine
          accusative `deine` agrees with `Nachricht` after `über` in this expression."
        note: "`Ich freue mich auf deinen Besuch` means I look forward to your visit: `auf` introduces
          something anticipated. Try it: say your whole group is pleased about the message. Answer:
          `Wir freuen uns über deine Nachricht`. `wir` takes `freuen` and reflexive `uns`; the
          reason stays unchanged."
  - subskill_id: opinions
    explanation: People choosing a route may disagree about whether it is suitable. `Meiner Meinung
      nach` marks the following judgement as your opinion; `zu lang` says its length exceeds what is
      acceptable.
    examples:
      - text: Meiner Meinung nach ist dieser Weg zu lang.
        meaning: "**The example.** In my opinion, this route is too long. `Meiner Meinung nach` means in my
          opinion and occupies the first position. The finite verb `ist` comes next, before the
          subject `dieser Weg`, this route. `zu` before `lang` means too, rather than very."
        note: "Try it: judge the route too short instead. Answer: `Meiner Meinung nach ist dieser Weg zu
          kurz`. Only the adjective changes. `sehr lang` means very long and does not itself say the
          length is unsuitable; `zu lang` makes that judgement."
  - subskill_id: agreement_disagreement
    explanation: "Someone says the repair is no longer worthwhile. A reply can disagree and give a
      different assessment: `anderer Meinung sein` means to hold a different opinion."
    examples:
      - text: "Da bin ich anderer Meinung: Die Reparatur lohnt sich noch."
        meaning: "**The example.** I disagree on that point: the repair is still worthwhile. `Da` points
          back to that claim. `bin ich anderer Meinung` is I have a different opinion, with `bin`
          before `ich` after the opening. `Die Reparatur lohnt sich noch` means the repair is still
          worthwhile; `noch` stresses that it remains worth doing."
        note: "To agree, `Das sehe ich auch so` means I see it that way too. Try it: disagree on behalf of
          your group. Answer: `Da sind wir anderer Meinung: Die Reparatur lohnt sich noch`. `bin
          ich` becomes `sind wir`; the repair remains the singular subject of `lohnt`."
