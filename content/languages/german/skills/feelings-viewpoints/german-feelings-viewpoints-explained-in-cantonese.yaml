sections:
  - subskill_id: wants_intentions
    explanation: 想秋天報讀課程，可以講自己打算做乜。`Ich will` 表達講者嘅意願或者打算；德文 `will` 係 `wollen` 嘅形式，唔係未來助動詞。
    examples:
      - text: Ich will im Herbst einen Sprachkurs besuchen.
        meaning: "**例句。** 我想秋天去上語言班。 `im Herbst` 係秋天，`im` 合埋 `in dem`。`einen Sprachkurs`
          係語言課程，男性賓格賓語。`besuchen` 呢度係就讀，喺 `will` 後以原形放句尾。"
        note: "`Ich möchte` 比 `Ich will` 柔和。試下用較柔和講法表達同一願望：`Ich möchte im Herbst einen Sprachkurs
          besuchen`。課程、季節同原形唔變，情態動詞改變語氣。"
  - subskill_id: preferences
    explanation: 有兩種交通選擇時，`lieber` 指你比較鍾意嗰種。佢係 `gern` 嘅比較級：`gern` 講鍾意做，`lieber` 就同另一選擇比較。
    examples:
      - text: Ich fahre lieber mit dem Zug als mit dem Bus.
        meaning: "**例句。** 比起搭巴士，我更鍾意搭火車。 `Ich fahre` 係我乘交通工具去。`mit dem Zug` 係搭火車，`mit dem Bus` 係搭巴士；`mit`
          用與格 `dem`。`lieber … als` 連起較鍾意同較唔鍾意嘅選擇。"
        note: 試下改成比較鍾意巴士：`Ich fahre lieber mit dem Bus als mit dem Zug`。交換兩個交通短語，較鍾意嗰個前用 `lieber`，另一個前用
          `als`。`Ich fahre gern mit dem Zug` 只講鍾意搭火車，冇比較。
  - subskill_id: emotions
    explanation: 收到開心嘅消息，想話自己好高興。`sich freuen über` 表達因某件事而開心，反身代詞配合感到開心嗰個人。
    examples:
      - text: Ich freue mich über deine Nachricht.
        meaning: "**例句。** 收到你嘅訊息，我好開心。 `Ich freue mich` 係我好開心，`mich` 配合 `ich`。`über deine Nachricht`
          指原因：你嘅消息。呢個表達入面 `über` 後嘅女性賓格 `deine` 配合 `Nachricht`。"
        note: "`Ich freue mich auf deinen Besuch` 係期待你探訪，`auf` 引出期待嘅事。試下話成班人都因消息開心：`Wir freuen uns über
          deine Nachricht`。`wir` 配合 `freuen` 同反身 `uns`，原因唔變。"
  - subskill_id: opinions
    explanation: 揀路線時，大家可能唔同意條路合唔合適。`Meiner Meinung nach` 將後面判斷標示成自己意見，`zu lang` 話長度超出可接受範圍。
    examples:
      - text: Meiner Meinung nach ist dieser Weg zu lang.
        meaning: "**例句。** 我覺得呢條路太長。 `Meiner Meinung nach` 係我認為，佔句首第一位置；變位動詞 `ist` 跟住，然後先係主語 `dieser
          Weg`，呢條路。`lang` 前嘅 `zu` 係太，唔係好。"
        note: 試下改成條路太短：`Meiner Meinung nach ist dieser Weg zu kurz`。只換形容詞。`sehr lang` 係好長，本身冇話唔合適；`zu lang`
          就有呢個判斷。
  - subskill_id: agreement_disagreement
    explanation: 有人話維修已經唔值得，可以回應唔同意並講另一判斷：`anderer Meinung sein` 係持唔同意見。
    examples:
      - text: "Da bin ich anderer Meinung: Die Reparatur lohnt sich noch."
        meaning: "**例句。** 呢點我唔同意：維修仍然值得。 `Da` 指返前面主張。`bin ich anderer Meinung` 係我有唔同意見，句首之後 `bin` 喺 `ich`
          前。`Die Reparatur lohnt sich noch` 係維修仍然值得，`noch` 強調仲值得做。"
        note: "同意可以講 `Das sehe ich auch so`，我都咁睇。試下代表成班人唔同意：`Da sind wir anderer Meinung: Die Reparatur
          lohnt sich noch`。`bin ich` 改成 `sind wir`，維修仍然係 `lohnt` 嘅單數主語。"
