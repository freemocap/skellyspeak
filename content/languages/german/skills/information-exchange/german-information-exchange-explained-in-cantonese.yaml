sections:
  - subskill_id: asking_information
    explanation: wann、wo 等疑問詞或短語後面，通常跟限定動詞。是非問句可以直接由限定動詞開始。
    examples:
      - text: Wann öffnet die Werkstatt morgen?
        meaning: 間維修舖聽日幾點開門？
        note: wann 問時間，öffnet 跟住佢。呢句查問資訊，唔係請夥伴開門。
  - subskill_id: answering_information
    explanation: 切題答案可以只係短語，冇限定動詞；但意思要由清楚嘅上文問題提供。
    examples:
      - text: Um halb neun.
        meaning: 八點半。
        note: 回答維修舖幾點開。德文 halb neun 係距離九點仲有半個鐘，即八點半，唔係九點半。
  - subskill_id: checking_facts
    explanation: stimmt es, dass …? 核實說法真偽。呢種書面 dass 子句嘅限定動詞放句尾。
    examples:
      - text: Stimmt es, dass der Laden heute geschlossen ist?
        meaning: 間舖今日冇開，係咪真？
        note: 核實轉述嘅關門消息；ist 喺從句句尾。問 geschlossen 係咩意思就屬於釐清詞義。
  - subskill_id: useful_detail
    explanation: 加上能解決當下資訊需要嘅具體細節；可以用另一個主句或合適短語，唔係越長越有用。
    examples:
      - text: Der Eingang ist auf der Hofseite, direkt neben dem Aufzug.
        meaning: 入口喺庭院嗰邊，就喺升降機隔籬。
        note: 對搵入口嘅人，後面短語縮窄位置。auf der 同 neben dem 用表示位置嘅第三格。
