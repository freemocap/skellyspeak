skill_id: information_exchange
explanation_language: english
shared_explanation: skills/information-exchange/information-exchange-explained-in-english.yaml
sections:
  - subskill_id: asking_information
    explanation: In a question with wann, wo or another question word, the finite verb normally
      follows that word or phrase. A yes/no question can begin with the finite verb.
    examples:
      - text: Wann öffnet die Werkstatt morgen?
        meaning: When does the workshop open tomorrow?
        note: Wann asks for a time; öffnet follows it. The question seeks information rather than asking
          the partner to open the workshop.
  - subskill_id: answering_information
    explanation: A relevant German answer can be a phrase without a finite verb. Its meaning must be
      supplied by an identifiable question, not by guessing missing context.
    examples:
      - text: Um halb neun.
        meaning: At half past eight.
        note: Answer to a question asking when the workshop opens. German halb neun means half an hour
          before nine, not half past nine.
  - subskill_id: checking_facts
    explanation: Stimmt es, dass …? asks whether a proposition is true. The finite verb in the dass
      clause comes at the end in this written construction.
    examples:
      - text: Stimmt es, dass der Laden heute geschlossen ist?
        meaning: Is it true that the shop is closed today?
        note: This checks a reported closure; ist closes the subordinate clause. Asking what geschlossen
          means would instead seek clarification.
  - subskill_id: useful_detail
    explanation: Add a specific distinction that helps with the current information need. German can
      use a second main clause or a suitable phrase; more words alone do not make the detail
      useful.
    examples:
      - text: Der Eingang ist auf der Hofseite, direkt neben dem Aufzug.
        meaning: The entrance is on the courtyard side, right next to the lift.
        note: In response to someone looking for the entrance, the final phrase narrows the location.
          Auf der and neben dem use spatial dative.
