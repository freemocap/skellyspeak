sections:
  - subskill_id: asking_information
    explanation: Before going to the workshop tomorrow, you need its opening time. `Wann` asks when; the
      question places the finite verb immediately after that question word.
    examples:
      - text: Wann öffnet die Werkstatt morgen?
        meaning: "**The example.** When does the workshop open tomorrow? `öffnet` means opens and agrees
          with singular `die Werkstatt`, the workshop. `morgen` means tomorrow. The subject follows
          the verb: `Wann öffnet die Werkstatt morgen?` asks for a time, rather than whether it
          opens at all."
        note: "Try it: ask about today. Answer: `Wann öffnet die Werkstatt heute?` Replace the day with
          `heute`; the question order stays unchanged. `Öffnet die Werkstatt morgen?` instead begins
          with the verb and invites a yes-or-no answer."
  - subskill_id: answering_information
    explanation: An opening-time question can be answered with just the time, because the workshop and
      action are already understood. `um` introduces a clock time; German `halb` counts towards the
      next hour.
    examples:
      - text: Um halb neun.
        meaning: "**The example.** At half past eight. `Um halb neun` means at half past eight, 8:30: it is
          halfway towards nine. The phrase supplies the missing time without repeating the
          question’s subject and verb."
        note: "Try it: give an opening time of 9:30. Answer: `Um halb zehn`. The named hour is ten, the
          coming hour. A full answer for the original time is `Die Werkstatt öffnet um halb neun`;
          both versions give 8:30."
  - subskill_id: checking_facts
    explanation: You have heard the shop is closed today and want confirmation before travelling.
      `Stimmt es, dass` asks whether the reported information is true, then introduces exactly what
      needs checking.
    examples:
      - text: Stimmt es, dass der Laden heute geschlossen ist?
        meaning: "**The example.** Is it true that the shop is closed today? `Stimmt es` means is it true.
          `dass der Laden heute geschlossen ist` means that the shop is closed today. After `dass`,
          the finite verb `ist` comes at the end; `geschlossen` describes the closed state."
        note: "Try it: check tomorrow instead. Answer: `Stimmt es, dass der Laden morgen geschlossen ist?`
          Replace `heute` with `morgen`, keeping final `ist`. A direct question is `Ist der Laden
          heute geschlossen?`; it asks about the shop without explicitly referring to a reported
          claim."
  - subskill_id: useful_detail
    explanation: Someone looking for an entrance needs a usable landmark. This answer first identifies
      the side of the building, then narrows the location to beside the lift.
    examples:
      - text: Der Eingang ist auf der Hofseite, direkt neben dem Aufzug.
        meaning: "**The example.** The entrance is on the courtyard side, right next to the lift. `Der
          Eingang` is the entrance. `auf der Hofseite` means on the courtyard side. `direkt neben
          dem Aufzug` means right beside the lift. Both place phrases locate the entrance, with
          dative `der` for feminine `Hofseite` and `dem` for masculine `Aufzug`."
        note: "Try it: locate it beside the bakery instead of the lift. Answer: `Der Eingang ist auf der
          Hofseite, direkt neben der Bäckerei`. Feminine `Bäckerei` takes dative `der`. Keeping the
          side of the building and changing the nearby landmark gives the listener two useful
          clues."
