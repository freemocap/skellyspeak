skill_id: information_exchange
guidance: Assess genuine information questions, relevant answers, factual checks and useful
  elaboration. Wann fährt der nächste Bus? uses a question word followed by the finite verb;
  fährt der Bus heute? is a verb-first yes/no question. German needs no English do-support.
  Context can license a declarative confirmation question such as der Bus fährt um acht?; do not
  demand inversion in every conversational check. Um acht Uhr after Wann fährt er? is a
  contextual answer, not an incomplete failure. The same fragment without a recoverable
  information need does not establish answering. Stimmt es, dass der Laden heute geschlossen
  ist? checks the truth of a proposition; requesting repetition because words were missed
  repairs understanding instead. Bei Gleis vier, neben dem Aufzug adds useful location detail in
  response to a platform question. A bare question word copied from a list is absent use.
  Könntest du den Koffer tragen? ordinarily seeks action, not knowledge about carrying ability.
  Use unclear when the exchange leaves the intended information or response role unresolved.
