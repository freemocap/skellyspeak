sections:
  - subskill_id: causes_reasons
    explanation: 單車壞咗，解釋點解揀巴士。`weil` 引出原因，並改變原因分句入面嘅動詞次序。
    examples:
      - text: Ich nehme den Bus, weil mein Fahrrad kaputt ist.
        meaning: "**例句。** 我搭巴士，因為架單車壞咗。 `Ich nehme den Bus` 係我搭巴士，男性賓格用 `den`。`mein Fahrrad` 係我架單車，`kaputt`
          係壞咗。`weil` 後面變位 `ist` 放句尾：`weil mein Fahrrad kaputt ist`。"
        note: "`denn` 都可以引出原因，但保留普通主句次序。試下用 `denn`：`Ich nehme den Bus, denn mein Fahrrad ist
          kaputt`。換連接詞時，`ist` 移到 `kaputt` 前，原因唔變。"
  - subskill_id: consequences
    explanation: 道路封閉，要改路線。`Deshalb` 將封路連到後果：因為條路唔通，所以改經橋。
    examples:
      - text: Die Straße ist gesperrt. Deshalb fahren wir über die Brücke.
        meaning: "**例句。** 條路封咗，所以我哋經條橋行。 `Die Straße ist gesperrt` 係道路封閉。`Deshalb` 係所以，佔下一句第一位置；變位 `fahren`
          喺第二，主語 `wir` 跟後。`über die Brücke` 講經橋嘅路線。"
        note: 試下第二句主語放先：`Die Straße ist gesperrt. Wir fahren deshalb über die Brücke`。`fahren`
          保持第二，`deshalb` 移後。`danach` 係之後，只講時間次序，本身冇表達因果。
  - subskill_id: conditions
    explanation: 聽日安排視乎天氣。`Falls` 引出未定條件：如果落雨就留喺屋企，但冇話一定落雨。
    examples:
      - text: Falls es morgen regnet, bleiben wir zu Hause.
        meaning: "**例句。** 如果聽日落雨，我哋就留喺屋企。 `Falls es morgen regnet` 係如果聽日落雨，`falls` 後嘅 `regnet`
          放句尾。成個條件放先，所以主句先係 `bleiben`，再係 `wir`。`zu Hause` 係喺屋企。現在形式可以講呢個未來安排。"
        note: 試下先講安排，條件放後：`Wir bleiben zu Hause, falls es morgen regnet`。主句改由 `wir` 開始，條件仍然由 `regnet`
          結尾。`weil` 會將落雨講成原因，唔係未定條件。
  - subskill_id: contrast
    explanation: 較短路線可能斜得多，行起嚟仍然辛苦。`aber` 連起優點同缺點，解釋點解淨係短未決定揀邊條。
    examples:
      - text: Der neue Weg ist kürzer, aber er ist viel steiler.
        meaning: "**例句。** 新路線短啲，但斜好多。 `Der neue Weg` 係新路線。`kürzer` 由 `kurz` 加變音同比較級詞尾，係更短。`viel steiler`
          係斜得多，由 `steil` 變成。`aber` 後 `er ist` 保留主語再動詞，`er` 指男性 `Weg`。"
        note: 試下話較長但平坦得多：`Der neue Weg ist länger, aber er ist viel flacher`。`lang` 變 `länger`，`flach` 變
          `flacher`。兩個新比較形容詞改變利弊，`viel` 加強第二個比較。
  - subskill_id: supporting_claims
    explanation: 話維修店可靠，如果交代相關經驗會更有說服力。呢句先評價間店，再用每次準時修好單車支持判斷。
    examples:
      - text: Ich halte die Werkstatt für zuverlässig, denn unsere Fahrräder waren jedes Mal pünktlich
          fertig.
        meaning: "**例句。** 我覺得間維修舖可靠，因為我哋啲單車每次都準時整好。 `Ich halte die Werkstatt für zuverlässig`
          係我認為維修店可靠，`halten … für` 引出評價。`denn` 講原因，唔將動詞移去句尾。`unsere Fahrräder waren`
          係我哋啲單車之前係，`jedes Mal` 係每次，`pünktlich fertig` 係準時整好。"
        note: 試下用 `weil` 支持同一主張：`Ich halte die Werkstatt für zuverlässig, weil unsere Fahrräder jedes Mal
          pünktlich fertig waren`。`waren` 移到原因分句句尾。證據仍然係每次準時整好單車，唔係淨係再話間店好。
