skill_id: reasons_connections
guidance: Assess expressed reasons, results, dependencies, contrasts or grounds supporting a
  claim. Ich bleibe zu Hause, weil ich krank bin gives a reason with the finite verb at the end
  of the weil clause. Denn can also give a reason while retaining main-clause order. Deshalb
  nehmen wir den Bus presents a consequence when the preceding situation explains that choice;
  danach merely orders events. Falls es regnet, bleiben wir drinnen makes the outcome
  conditional. Wenn may introduce a time or a contingency, so do not assign a condition from the
  word alone. Der Weg ist kurz, aber steil contrasts properties. Der Weg ist kurz und steil
  gives both properties without necessarily opposing an expectation. Die Werkstatt ist
  zuverlässig; sie hat unsere Räder jedes Mal pünktlich repariert supplies grounds for the
  judgment. Repeating zuverlässig more loudly adds no grounds. A reason fragment after Warum?
  may work contextually. A bare weil or deshalb copied as vocabulary is absent use. Do not treat
  conversational weil with main-clause order as universally incorrect; interpret register and
  discourse role.
