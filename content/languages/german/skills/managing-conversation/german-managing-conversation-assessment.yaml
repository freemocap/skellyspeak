skill_id: managing_conversation
guidance: Look for a successful opening or closing, acknowledgment, clarification,
  reformulation, correction of interpretation or management of turns and topics. Guten Tag opens
  an encounter; bis morgen can close one with an expected later meeting. Quoting Guten Tag in a
  vocabulary list does not perform a greeting. Ah, jetzt verstehe ich acknowledges an
  explanation without necessarily agreeing or accepting a plan. Was meinst du mit vorläufig?
  repairs a word-meaning problem when that expression was used earlier; an unrelated factual
  question does not. Anders gesagt introduces rephrasing only when the new content restates or
  clarifies an available contribution. Ich meinte den Hintereingang, nicht den Haupteingang
  repairs a mistaken interpretation; correcting spelling alone need not do so. Darf ich noch
  etwas zum Preis sagen? can request the floor. A modal permission form here manages
  participation rather than outside-world access. A bare repair marker without recoverable
  reformulation is absent use; if the intended repair target is unresolved, use unclear. Allow
  conventional fragments and appropriate du or Sie register.
