skill_id: managing_conversation
explanation_language: english
shared_explanation: skills/managing-conversation/managing-conversation-explained-in-english.yaml
sections:
  - subskill_id: opening_closing
    explanation: When you need to leave a conversation, a short explanation followed by a farewell makes
      the transition clear. `Ich muss jetzt los` says you must go now, and `Bis morgen` looks ahead
      to seeing the listener tomorrow.
    examples:
      - text: Ich muss jetzt los. Bis morgen!
        meaning: "**The example.** I have to go now. See you tomorrow! `muss` expresses necessity, `jetzt`
          means now, and `los` conveys setting off; an infinitive such as `gehen` can be understood
          in this familiar expression. `Bis morgen` literally means until tomorrow and works as a
          farewell."
        note: "Try it: leave now but expect to meet on Friday. Answer: `Ich muss jetzt los. Bis Freitag!`
          Replace the farewell’s time with `Freitag`. `Guten Morgen` is a greeting in the morning;
          `Bis morgen` looks forward to tomorrow regardless of the current time."
  - subskill_id: acknowledging
    explanation: After someone explains a difference, you can signal that it is now clear. `verstehen`
      expresses understanding; this reply acknowledges the explanation without necessarily agreeing
      with a judgement.
    examples:
      - text: Ah, jetzt verstehe ich den Unterschied.
        meaning: "**The example.** Ah, now I understand the difference. `Ah` marks the moment of
          recognition. `jetzt` means now and comes first, followed by finite `verstehe` and subject
          `ich`. `den Unterschied` is the difference, a masculine accusative object."
        note: "Try it: start the statement with yourself instead of the time. Answer: `Ah, ich verstehe
          jetzt den Unterschied`. `ich` takes the first position, `verstehe` remains second, and
          `jetzt` moves later. `Ich bin einverstanden` expresses agreement rather than just
          understanding."
  - subskill_id: clarification
    explanation: A word such as provisional may be unclear in someone’s instructions. `Was meinst du
      mit` asks what they mean by that particular word, rather than asking them to repeat the whole
      message.
    examples:
      - text: Was meinst du mit „vorläufig“?
        meaning: "**The example.** What do you mean by “provisional”? `Was` means what, `meinst du` means do
          you mean, and `mit` introduces the quoted expression. `vorläufig` means provisional or for
          the time being; quoting it makes clear which part needs explanation."
        note: "Try it: ask an unfamiliar adult formally. Answer: `Was meinen Sie mit „vorläufig“?` `du`
          changes to `Sie` and `meinst` to `meinen`; the quoted word stays unchanged. `Kannst du das
          wiederholen?` instead asks for repetition, which may still leave the meaning unclear."
  - subskill_id: rephrasing
    explanation: A booking discussion can become clearer when you restate what must happen first.
      `Anders gesagt` introduces another formulation of the same point, here the need for
      confirmation before booking.
    examples:
      - text: "Anders gesagt: Wir brauchen die Zusage vor der Buchung."
        meaning: "**The example.** In other words, we need confirmation before booking. `Anders gesagt`
          means put differently. `Wir brauchen` is we need; `die Zusage` means the confirmation or
          agreement. `vor der Buchung` means before the booking, with dative `der` after temporal
          `vor`."
        note: "Try it: make this your own requirement instead of the group’s. Answer: `Anders gesagt: Ich
          brauche die Zusage vor der Buchung`. Change `wir brauchen` to `ich brauche`. `nach der
          Buchung` would mean after booking and would reverse the intended order."
  - subskill_id: correcting_misunderstanding
    explanation: Someone has understood you to mean the main entrance. You can repair the
      misunderstanding by naming the intended entrance and explicitly excluding the other one.
    examples:
      - text: Ich meinte den Hintereingang, nicht den Haupteingang.
        meaning: "**The example.** I meant the rear entrance, not the main entrance. `Ich meinte` means I
          meant and refers back to what you said. `den Hintereingang` is the rear entrance; `nicht
          den Haupteingang` is not the main entrance. Both nouns are masculine accusative objects of
          the intended reference."
        note: "Try it: correct the misunderstanding in the opposite direction. Answer: `Ich meinte den
          Haupteingang, nicht den Hintereingang`. Exchange the entrance phrases. The intended one
          comes before `nicht`; the excluded one follows it, so the listener can act on the
          correction."
  - subskill_id: turns_topics
    explanation: During a discussion you may want to add something about the price. `Darf ich` asks to
      take the floor, and the topic phrase tells others what your contribution concerns.
    examples:
      - text: Darf ich noch etwas zum Preis sagen?
        meaning: "**The example.** May I say something else about the price? `noch etwas` means something
          else or something further. `zum Preis` means about the price and combines `zu dem`.
          `sagen` means say and remains in the infinitive at the end after `Darf`."
        note: "Try it: ask to add something about the booking. Answer: `Darf ich noch etwas zur Buchung
          sagen?` `zur` combines `zu der`, because `Buchung` is feminine. The polite question
          requests a turn; a question such as `Wie viel kostet es?` directly requests price
          information."
