sections:
  - subskill_id: opening_closing
    explanation: guten Tag 可以作中性問候。auf Wiedersehen 或 bis morgen 可以道別，後者亦提到下次見面。
    examples:
      - text: Ich muss jetzt los. Bis morgen!
        meaning: 我而家要走喇，聽日見！
        note: 先交代離開，再用 bis morgen 結束交流，唔需要完整句子先可以道別。
  - subskill_id: acknowledging
    explanation: ah, jetzt verstehe ich 可以表示理解。明白一個立場，唔一定等於贊同。
    examples:
      - text: Ah, jetzt verstehe ich den Unterschied.
        meaning: 哦，我而家明白個分別喇。
        note: 回應對方對兩個選項嘅解釋。jetzt 後面係 verstehe，ich 放動詞後面。
  - subskill_id: clarification
    explanation: was meinst du mit …? 可以問對方意思，亦可以要求重複。要針對上文唔清楚嘅部分。
    examples:
      - text: Was meinst du mit „vorläufig“?
        meaning: 你講「暫定」係咩意思？
        note: 對方形容計劃為 vorläufig 後，用呢句釐清。du 指一位熟悉對象；引用詞保留德文。
  - subskill_id: rephrasing
    explanation: anders gesagt 引入較清楚重述，要保留或解釋已有意思，唔係另開話題。
    examples:
      - text: "Anders gesagt: Wir brauchen die Zusage vor der Buchung."
        meaning: 即係話，我哋要先收到確認，之後先預訂。
        note: 重述預訂要先確認嘅條件。引入短語只標示重述，真正內容仍然要喺後面講清楚。
  - subskill_id: correcting_misunderstanding
    explanation: ich meinte …, nicht … 用正確意思取代誤解。meinte 係 meinen 過去式，指之前想表達嘅內容。
    examples:
      - text: Ich meinte den Hintereingang, nicht den Haupteingang.
        meaning: 我意思係後面個入口，唔係正門。
        note: 對方以為係正門時，兩個第四格名詞短語分別指出正確同錯誤選項。
  - subskill_id: turns_topics
    explanation: darf ich noch etwas zu … sagen? 可以就某話題要求再發言，唔等於直接發送一則相關訊息。
    examples:
      - text: Darf ich noch etwas zum Preis sagen?
        meaning: 我可唔可以再講少少價錢方面嘅事？
        note: 討論接近決定時請求發言。zum 係 zu dem，不定式 sagen 配合情態動詞。
