skill_id: coordinating_action
explanation_language: cantonese
shared_explanation: skills/coordinating-action/coordinating-action-explained-in-cantonese.yaml
sections:
  - subskill_id: requests
    explanation: 有人搬緊嘢，可能需要你幫手開庭院門。`Könntest du bitte` 係客氣噉請一位熟人做嘢。`könntest` 令語氣柔和，動作原形放喺最後。
    examples:
      - text: Könntest du bitte die Tür zum Hof öffnen?
        meaning: "**例句。** 你可唔可以幫手開通去庭院道門？ `die Tür` 係道門，`zum Hof` 係通往庭院，`zum` 合埋 `zu dem`。`öffnen` 係打開。問題先用
          `Könntest`，再指出聽者 `du`，最後先放動作。"
        note: 試下正式問唔熟嘅成年人：`Könnten Sie bitte die Tür zum Hof öffnen?`。`Sie` 同 `Könnten` 換走 `du` 同
          `Könntest`，原形唔變，客氣形式講而家嘅請求。
  - subskill_id: offers_invitations
    explanation: 同行朋友個袋好重。`Soll ich` 可以主動提出幫忙，畀對方接受或者婉拒。提議做幫手嘅係講者，唔係聽者。
    examples:
      - text: Soll ich deine Tasche zum Bahnhof tragen?
        meaning: "**例句。** 要唔要我幫你拎個袋去車站？ `deine Tasche` 係你個袋，`zum Bahnhof` 係去車站，`tragen` 係搬、拎，喺 `Soll ich`
          後面放句尾。熟人所有格 `deine` 配合女性名詞 `Tasche`。"
        note: 試下正式提出同樣幫忙：`Soll ich Ihre Tasche zum Bahnhof tragen?`。`Ihre` 正式稱呼袋嘅主人，`ich` 仍然係幫手嗰個。`Können
          Sie meine Tasche tragen?` 就係請對方幫自己。
  - subskill_id: suggestions
    explanation: 大家揀緊星期日做乜。`Wir könnten` 係提出可能計劃畀大家商量，唔係宣布所有人已同意。活動用原形短語放喺句尾。
    examples:
      - text: Wir könnten am Sonntag am Fluss spazieren gehen.
        meaning: "**例句。** 我哋星期日可以考慮去河邊散步。 `am Sonntag` 係星期日，`am Fluss` 係河邊，兩個 `am` 都合埋 `an dem`。`spazieren
          gehen` 係散步；呢個兩詞動作喺 `könnten` 後面一齊放句尾。"
        note: 改星期六用 `am Samstag`。試下建議星期六：`Wir könnten am Samstag am Fluss spazieren gehen`。保留 `könnten`
          係建議，`Wir gehen …` 就較直接陳述出去行。
  - subskill_id: commitments
    explanation: 分工帶野餐用品時，話自己帶氈就係接下呢項責任。德語可以用普通現在式作承諾，安排情境提供將來意思。
    examples:
      - text: Ich bringe die Decke mit.
        meaning: "**例句。** 由我帶張氈嚟。 `Ich bringe` 係我帶，`die Decke` 係張氈。最後 `mit` 屬於
          `mitbringen`「帶埋」，動詞喺主句拆開，所以最後短詞係動作一部分，唔係多一個物件。"
        note: 試下代表成班人接責任：`Wir bringen die Decke mit`。主語同詞尾改成我哋，`mit` 留最後。`Ich habe die Decke` 只話有張氈，未講承諾帶埋。
  - subskill_id: accepting_declining
    explanation: 你多謝人哋邀請，但星期六去唔到。多謝係接住邀請，清楚否定就避免對方以為客氣等於答應。
    examples:
      - text: Danke für die Einladung, aber ich kann am Samstag leider nicht kommen.
        meaning: "**例句。** 多謝邀請，不過可惜我星期六嚟唔到。 `Danke für die Einladung` 係多謝邀請，`aber` 帶出限制。`ich kann` 係我可以，`am
          Samstag` 係星期六，`leider nicht kommen` 係可惜嚟唔到。最後原形同 `kann` 配合。"
        note: 星期日用 `am Sonntag`。試下婉拒星期日邀請：`Danke für die Einladung, aber ich kann am Sonntag leider nicht
          kommen`。保留動作前嘅 `nicht`，漏咗就變成可以嚟。
  - subskill_id: negotiating_plans
    explanation: 人哋提議星期五，但你唔方便。商量時提出具體另一個日子，就可以保留見面計劃。`stattdessen` 係改為，將星期六同先前提議連起。
    examples:
      - text: Am Freitag kann ich nicht. Können wir uns stattdessen am Samstag treffen?
        meaning: "**例句。** 星期五我唔得。可唔可以改星期六見？ `Am Freitag kann ich nicht` 係星期五唔得，動作由情境補足。`Können wir uns …
          treffen?` 問我哋可唔可以見面，`uns` 指雙方互相見。`am Samstag` 提供新日子，`treffen` 放最後。"
        note: 試下保留星期五唔得，但改提議星期日：`Am Freitag kann ich nicht. Können wir uns stattdessen am Sonntag
          treffen?`。只改新日子。第一句時間放先，所以 `kann` 喺 `ich` 前；問題就由 `Können` 開始。
