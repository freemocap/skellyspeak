skill_id: time_events
explanation_language: cantonese
shared_explanation: skills/time-events/time-events-explained-in-cantonese.yaml
sections:
  - subskill_id: present_events
    explanation: 出發踩單車之前，人哋問你做緊乜。`Ich prüfe` 係我檢查，`gerade` 將動作放喺而家。德語用呢個普通現在形式講進行中動作，亦可以講日常習慣。
    examples:
      - text: Ich prüfe gerade die Reifen.
        meaning: "**例句。** 我而家檢查緊啲車胎。 `die Reifen` 係輪胎，`prüfe` 帶我嘅詞尾，跟住 `Ich`。`gerade`
          令呢個情境明確係檢查緊，唔需要另加進行式助動詞。"
        note: 試下將而家放先：`Gerade prüfe ich die Reifen`。`Gerade` 佔第一位置，後面係 `prüfe`，再係 `ich`。比較 `Ich prüfe die
          Reifen jeden Freitag`「每星期五檢查」，時間詞改變意思。
  - subskill_id: past_events
    explanation: 修好單車籃之後，可以報告昨日做咗乜。呢個口語過去式合埋 `habe` 同分詞 `repariert`，一部分表示人稱，另一部分指出完成嘅修理。
    examples:
      - text: Gestern habe ich den Fahrradkorb repariert.
        meaning: "**例句。** 噚日我整咗個單車籃。 `Gestern` 係昨日，後面接 `habe`，再接 `ich`。`den Fahrradkorb` 係單車籃，男性賓語冠詞用
          `den`。`repariert` 放句尾；例如 `reparieren` 呢類以 `-ieren` 收尾嘅動詞，分詞唔加 `ge-`。"
        note: 試下我放先：`Ich habe gestern den Fahrradkorb repariert`。時間移入句中，`habe` 仍然第二，`repariert`
          仍然最後。保留兩個動詞部分，就保留呢個過去句式。
  - subskill_id: future_events
    explanation: 火車時間表講稍後出發。德語可以用現在動詞加將來日期講已安排事件。`Nächsten Freitag` 將出發放喺下星期五，唔係而家做緊。
    examples:
      - text: Nächsten Freitag fährt unser Zug um sieben Uhr ab.
        meaning: "**例句。** 下星期五，我哋班火車七點開。 `unser Zug` 係我哋班火車，`um sieben Uhr` 係七點，`fährt … ab` 由 `abfahren`
          拆開，係出發。完整日期短語放先，之後係 `fährt`，前綴 `ab` 放句尾。"
        note: 試下將出發改成八點：`Nächsten Freitag fährt unser Zug um acht Uhr ab`。只改時鐘數字。呢度唔使加
          `werden`，將來日期已經清楚交代時間。
  - subskill_id: duration_frequency
    explanation: 你兩星期前開始喺工場做，而家仍然做緊。`seit` 將之前開始連到而家。德語講呢種持續情況，通常保留現在式。
    examples:
      - text: Ich arbeite seit zwei Wochen in dieser Werkstatt.
        meaning: "**例句。** 我喺呢間維修舖返工兩個禮拜喇。 `Ich arbeite` 係我工作。`seit zwei Wochen` 係由兩星期前到而家，`in dieser
          Werkstatt` 係喺呢間工場。`seit` 接與格，複數時間名詞係 `Wochen`；位置亦用與格 `dieser`。"
        note: 試下改成做咗三星期而家仍然做：`Ich arbeite seit drei Wochen in dieser Werkstatt`，改數字但保留現在式。比較 `Ich habe zwei
          Wochen dort gearbeitet`「之前喺嗰度做咗兩星期」，過去報告本身未話而家仲做。
  - subskill_id: event_sequence
    explanation: 一齊出門前，大家要執袋同鎖門。`erst` 同 `dann` 交代次序。每個詞開始自己嘅陳述，後面接嗰句配合人稱嘅動詞。
    examples:
      - text: Erst packen wir die Taschen, dann schließen wir die Tür ab.
        meaning: "**例句。** 我哋先執好啲袋，再鎖門。 `packen wir die Taschen` 係我哋執袋，`schließen wir die Tür ab` 係我哋鎖門，`ab`
          屬於 `abschließen`。`Erst` 同 `dann` 佔第一位置，所以兩個分句都係動詞先、`wir` 後。"
        note: 試下先鎖門，再執袋：`Erst schließen wir die Tür ab, dann packen wir die Taschen`。成個分句一齊移，`ab`
          跟住鎖門動作。`dann` 交代次序，本身唔解釋因果。
  - subskill_id: event_phase
    explanation: 人哋想知份報告仲使唔使做。`mit dem Bericht fertig sein` 係份報告完成，`noch am Bericht arbeiten`
      係仲做緊。講明任務，就清楚「完成」指乜。
    examples:
      - text: Ich bin jetzt mit dem Bericht fertig.
        meaning: "**例句。** 我而家寫完份報告喇。 `Ich bin` 係我係，`jetzt` 係而家。`mit dem Bericht` 指份報告，`mit` 後面用與格
          `dem`；`fertig` 係完成。呢句着重任務而家已完成嘅狀態。"
        note: 試下代表成班人話完成：`Wir sind jetzt mit dem Bericht fertig`。`Ich bin` 改成 `Wir
          sind`，任務短語保留與格。比較下一例，同一任務可以係已完成，或者仲做緊。
      - text: Ich arbeite noch am Bericht.
        meaning: "**例句。** 我仲做緊份報告。 `Ich arbeite` 係我工作，`noch` 係仲，`am Bericht` 係做份報告。`am` 合埋 `an
          dem`，`arbeiten an` 呢度用與格。`noch` 明確表示繼續，唔係完成。"
        note: 試下話成班人仲做緊：`Wir arbeiten noch am Bericht`，主語同動詞一齊改，保留 `noch`。想話完成就用 `Wir sind mit dem Bericht
          fertig`，唔好保留「仲」。
