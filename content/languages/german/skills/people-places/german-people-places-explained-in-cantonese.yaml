sections:
  - subskill_id: identification
    explanation: das ist 後接名詞短語可以識別人或物。物主限定詞詞尾要配合名詞短語。
    examples:
      - text: Das ist unsere Nachbarin aus dem zweiten Stock.
        meaning: 嗰位係住二樓嘅女鄰居。
        note: unsere 配合陰性單數 Nachbarin；對應男性名詞係 Nachbar。
  - subskill_id: qualities_states
    explanation: 形容詞喺 sein 後面描述主語，通常唔加形容詞詞尾；放名詞前就係另一套規則。
    examples:
      - text: Der Rucksack ist schwer, aber die Tasche ist leicht.
        meaning: 背囊重，但手袋輕。
        note: schwer 同 leicht 喺謂語位置唔加詞尾；aber 引入對比。
  - subskill_id: location_movement
    explanation: 空間用法嘅 in，第三格表示活動位置，第四格表示目的地。唔可以只睇有冇郁動嚟決定格。
    examples:
      - text: Die Kinder laufen im Garten.
        meaning: 啲小朋友喺花園入面跑緊。
        note: im 係 in dem：第三格表明花園係跑步所在位置。
      - text: Die Kinder laufen in den Garten.
        meaning: 啲小朋友跑入花園。
        note: in den Garten 用陽性第四格表示進入嘅目的地。分別係「喺入面」同「入去」，唔係靜止同郁動。
  - subskill_id: possession_relations
    explanation: haben 加第四格受詞可以表達擁有；mein 等物主限定詞亦可交代擁有或關係，詞尾要配合名詞。
    examples:
      - text: Ich habe ein Fahrrad. Meine Schwester hat zwei.
        meaning: 我有一架單車，我姊妹有兩架。
        note: ein Fahrrad 係 habe 嘅受詞；meine Schwester 交代親屬，zwei 指返單車。
  - subskill_id: quantity_comparison
    explanation: 數字交代數量。德文形容詞比較級常加 -er；als 引入不等比較嘅另一方。
    examples:
      - text: Wir haben drei Kisten. Diese Kiste ist leichter als die anderen.
        meaning: 我哋有三個箱。呢個箱比其他嗰啲輕。
        note: drei 計箱數，leichter als 比較重量，各有各嘅關係。
