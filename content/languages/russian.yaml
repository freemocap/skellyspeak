  name: Russian
  native_name: Русский
  family: indo-european
  review: needs_review
integrations:
  language_tag: ru
  transcription: ru
definitions:
  orthographies:
    modern-russian:
      script: cyrillic
      guidance:
        - scope: target_writing
          text: Write modern Russian in Cyrillic. Preserve ё when it is present and use it in new text where
            needed to make the intended word clear. Retain ъ and ь; never silently rewrite quoted
            spelling, add stress marks to source text, or replace Russian with Latin letters.
          sources:
            - ala_lc_russian2012
        - scope: explanation_writing
          text: Write modern Russian in Cyrillic. Preserve ё when it is present and use it in new text where
            needed to make the intended word clear. Retain ъ and ь; never silently rewrite quoted
            spelling, add stress marks to source text, or replace Russian with Latin letters.
          sources:
            - ala_lc_russian2012
  romanization_schemes:
    ala-lc-russian:
      label: ALA-LC Russian
      instructions: Use the ALA-LC Russian table as a spelling-based aid, not a phonetic transcription.
        Preserve е as e, ё as ë, й as ĭ, ы as y, э as ė, ъ as ʺ and ь as ʹ. Use zh, kh, ch, sh and
        shch; use tied t͡s, i͡u and i͡a for ц, ю and я. Preserve case and word boundaries. Do not
        add unmarked stress or rewrite the Cyrillic source.
      examples:
        - original: спасибо
          romanized: spasibo
        - original: ёлка
          romanized: ëlka
        - original: семья
          romanized: semʹi͡a
        - original: чай
          romanized: chaĭ
      sources:
        - ala_lc_russian2012
      review: needs_review
