      - Si j'avais su que la réunion durerait aussi longtemps, je serais rentré plus tôt.
      - Ce qui me préoccupe le plus, c'est l'effet de cette décision sur les personnes qui n'ont pas
        été consultées.
      - Bien que la proposition semble prometteuse, il faudrait en examiner les conséquences
        possibles.
      - Je préférerais que nous reportions le voyage plutôt que de prendre une décision précipitée.
      - Plus je relis ce rapport, moins ses conclusions me paraissent convaincantes.
      - La réussite du projet dépendra en grande partie de la manière dont nous partagerons les
        responsabilités.
      - Ce n'est pas que je sois contre cette idée, mais je doute que le moment soit bien choisi.
      - Quand nous avons compris ce qui s'était passé, il était déjà difficile de changer les choses.
