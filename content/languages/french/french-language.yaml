# yaml-language-server: $schema=../../rust-schemas/language.yaml
schema_version: 1
identity:
  id: french
  name: French
  native_name: Français
  family: indo-european
  review: needs_review
integrations:
  language_tag: fr
  transcription: fr
definitions:
  orthographies: {}
  romanization_schemes: {}
