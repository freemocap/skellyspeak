skill_id: information_exchange
language: french
explanation_language: english
shared_explanation: skills/information-exchange/information-exchange-explained-in-english.yaml
sections:
  - subskill_id: asking_information
    explanation: You need the shop's closing time before making a trip. `À quelle heure` asks at
      what time; `est-ce que` marks the question, and `le magasin ferme` means the shop closes.
      After `est-ce que`, the subject still comes before the verb. `À quelle heure est-ce que le
      train arrive ?` reuses the question with a different event. `Est-ce que le magasin ferme à
      six heures ?` instead proposes a time and asks for confirmation, rather than leaving the
      answer open.
    examples:
      - text: À quelle heure est-ce que le magasin ferme ?
        meaning: What time does the shop close?
        note: "Ask when the shop opens. `À quelle heure est-ce que le magasin ouvre ?` works: `ouvre`
          changes closing to opening while the question still requests a time."
  - subskill_id: answering_information
    explanation: The shop's closing time is already the topic, so a time phrase can answer without
      repeating the whole question. `À dix-huit heures` means at eighteen hours, or 6 p.m. `À`
      introduces the time, and `heures` is plural because there are eighteen. A fuller answer is
      `Le magasin ferme à dix-huit heures.` In a timetable or precise arrangement, the
      twenty-four-hour clock avoids confusion between morning and evening. `Dix-huit heures` is
      a time of day here, not a duration of eighteen hours.
    examples:
      - text: À dix-huit heures.
        meaning: At six in the evening.
        note: Answer with 7 p.m. `À dix-neuf heures.` is enough when the closing-time question is
          shared. `Dix-neuf` is nineteen on the twenty-four-hour clock.
  - subskill_id: checking_facts
    explanation: You think an appointment is on Thursday and want to check it before putting it in
      your diary. `Le rendez-vous` names the appointment, and `bien jeudi` presents Thursday as
      the information to confirm. Here `bien` reinforces the proposed fact rather than meaning
      well. `C’est ça ?` asks is that right? This form makes your current belief explicit,
      unlike the open question `Quel jour est le rendez-vous ?` The other person can confirm it
      or correct the day.
    examples:
      - text: Le rendez-vous est bien jeudi, c’est ça ?
        meaning: The appointment is on Thursday, is that right?
        note: Check whether the appointment is Tuesday. `Le rendez-vous est bien mardi, c’est ça ?`
          works because the proposed fact is now Tuesday, while the confirmation frame stays the
          same.
  - subskill_id: useful_detail
    explanation: "A visitor is looking for a particular café, so two landmarks help them find it.
      `Le café que tu cherches` means the café you are looking for: `que` stands for the café as
      the object of `cherches`, with `tu` doing the looking. `Au deuxième étage` gives the
      second floor, and `près de l’escalier` adds near the staircase. `Au` combines `à` with
      `le`. A café that itself serves food could be `le café qui sert des repas`: `qui` does the
      action, whereas `que` receives it."
    examples:
      - text: Le café que tu cherches est au deuxième étage, près de l’escalier.
        meaning: The café you are looking for is on the second floor, near the stairs.
        note: "Locate it on the third floor instead. `Le café que tu cherches est au troisième étage,
          près de l’escalier.` works: `troisième` changes the floor, and `que tu cherches` still
          identifies the café."
