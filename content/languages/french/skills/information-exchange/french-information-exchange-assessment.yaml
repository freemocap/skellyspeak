schema_version: 1
revision: french-skills-2026-10-04
skill_id: information_exchange
language: french
guidance: >-
  Judge whether the learner asks for, supplies, checks or usefully specifies information
  in this exchange. Accept grammatical questions with est-ce que, inversion or
  conversational declarative order; do not require inversion. À dix-huit heures can
  correctly answer a time question without a finite verb. Où est la gare ? asks for
  location; a correctly formed pourquoi question does not answer a request for a location.
  C’est bien jeudi ? can check an already proposed date. A question mark or an
  interrogative word alone is not sufficient evidence when the requested information is
  unclear. Additional detail must identify or resolve something relevant, not merely
  lengthen the message. Credit requires correct use of the function, not merely an
  attempt. Unrelated errors do not erase a successful instance. Use unclear when the
  available exchange does not establish the function. Examples illustrate possibilities,
  not an exhaustive whitelist. Accept appropriate France and Canadian French usage and
  conversational register; do not impose another variety’s lexical preference.
