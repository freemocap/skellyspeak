sections:
  - subskill_id: ability
    explanation: A bicycle needs a repair, and you have learned the necessary skill. `Je sais` means
      I know how, and `réparer une roue de vélo` means repair a bicycle wheel. `Savoir` followed
      by an infinitive expresses learned know-how; the action verb does not take `de` here. `Je
      peux réparer la roue` can instead describe being able to do it in the current
      circumstances, for example having the tools and time. `Nous savons réparer` changes who
      has the skill while keeping the infinitive.
    examples:
      - text: Je sais réparer une roue de vélo.
        meaning: I know how to repair a bicycle wheel.
        note: "Say that your group knows how to repair a bicycle. `Nous savons réparer un vélo.` works:
          `savons` agrees with `nous`, and `réparer` still describes the learned skill."
  - subskill_id: permission
    explanation: A room feels warm, but opening its window affects other people, so you ask for
      permission. `Est-ce que` introduces the question; `je peux` means may I or can I, and
      `ouvrir la fenêtre` names the proposed action. Context makes this a permission question
      rather than a test of physical ability. `Vous pouvez ouvrir la fenêtre` can grant
      permission. A negative reply, `Vous ne pouvez pas ouvrir la fenêtre`, denies it; `ne` and
      `pas` surround the conjugated verb.
    examples:
      - text: Est-ce que je peux ouvrir la fenêtre ?
        meaning: May I open the window?
        note: "Ask permission to close the door. `Est-ce que je peux fermer la porte ?` works: the
          permission frame remains, and the infinitive phrase supplies the new action."
  - subskill_id: obligation
    explanation: You are leaving a rented room, and returning the keys before noon is required.
      `Nous devons` means we must or we have to; `rendre les clés` is return the keys, and
      `avant midi` sets the deadline. `Devons` agrees with `nous`, while `rendre` stays
      infinitive. `Nous ne devons pas garder les clés` says we must not keep them. It does not
      mean we do not have to keep them; absence of necessity can be expressed with `Nous n’avons
      pas besoin de garder les clés.`
    examples:
      - text: Nous devons rendre les clés avant midi.
        meaning: We must return the keys before noon.
        note: "Give the obligation to a person addressed as `vous`. `Vous devez rendre les clés avant
          midi.` works: only the subject and matching form of `devoir` change."
  - subskill_id: possibility
    explanation: The forecast is uncertain, so you say snow may fall tonight. `Il va neiger` means
      it is going to snow; the weather subject `il` does not refer to a person. `Peut-être`
      means perhaps and makes the prediction uncertain. `Cette nuit` gives tonight. The phrase
      can also begin the sentence as `Peut-être qu’il va neiger cette nuit.` Without
      `peut-être`, `Il va neiger cette nuit` presents a more definite prediction. This
      uncertainty word has a hyphen; it is different from two separate words meaning can be.
    examples:
      - text: Il va peut-être neiger cette nuit.
        meaning: It may snow tonight.
        note: "Make the same uncertain forecast for rain. `Il va peut-être pleuvoir cette nuit.` works:
          `pleuvoir` replaces the weather event and stays infinitive after `va`."
  - subskill_id: certainty
    explanation: You have just checked the service counter, so you state confidently that it is
      closed. `Je suis certaine que` means I am certain that; `le guichet est fermé` supplies
      the fact. `Je viens de vérifier` says I have just checked and gives the basis for
      confidence. `Certaine` is the feminine form describing the speaker; the masculine is
      `certain`. `Fermé` agrees with masculine `guichet`, not with the speaker. `Je pense que`
      would make the claim less explicit about certainty.
    examples:
      - text: "Je suis certaine que le guichet est fermé : je viens de vérifier."
        meaning: I am certain that the counter is closed; I have just checked.
        note: "Keep the same checked fact for a masculine speaker. `Je suis certain que le guichet est
          fermé : je viens de vérifier.` works: only `certain` changes because the counter and
          the checking remain the same."
