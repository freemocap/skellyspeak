skill_id: possibilities_constraints
language: french
guidance: >-
  Judge the intended modal function in context. Je sais réparer une roue demonstrates
  know-how; je peux sortir may express ability, opportunity or permission. Il doit être
  chez lui may be an inference, while nous devons rendre les clés can state an obligation.
  Do not award every modal subskill merely because pouvoir or devoir occurs. Je dois
  partir is correctly formed; je dois de partir is not the ordinary devoir-plus-infinitive
  construction. Il faut que tu partes can correctly express necessity with a subordinate
  clause. Peut-être and certainty expressions must fit the proposition and intended degree
  of commitment. Do not verify real-world truth or infer certainty from confident
  punctuation. Credit requires correct use of the function, not merely an attempt.
  Unrelated errors do not erase a successful instance. Use unclear when the available
  exchange does not establish the function. Examples illustrate possibilities, not an
  exhaustive whitelist. Accept appropriate France and Canadian French usage and
  conversational register; do not impose another variety’s lexical preference.
