shared_explanation: skills/possibilities-constraints/possibilities-constraints-explained-in-cantonese.yaml
sections:
  - subskill_id: ability
    explanation: savoir 加不定式表達學識嘅技能；pouvoir 可以表達能力或條件容許。要按語境同許可區分。
    examples:
      - text: Je sais réparer une roue de vélo.
        meaning: 我識整單車輪。
        note: sais réparer 表達識做，唔保證手上工具足以即刻維修。
  - subskill_id: permission
    explanation: 當對方有權決定行動時，pouvoir 問句可以請求許可；其他語境亦可講能力。
    examples:
      - text: Est-ce que je peux ouvrir la fenêtre ?
        meaning: 我可唔可以開窗？
        note: 共用房間入面，呢句問准唔准開窗，唔係測試身體能力。
  - subskill_id: obligation
    explanation: devoir 加不定式可以表達義務；il faut 表達必要，il faut que 後面接有自己主語同虛擬式嘅子句。
    examples:
      - text: Nous devons rendre les clés avant midi.
        meaning: 我哋中午前一定要還鎖匙。
        note: devons rendre 將責任放喺 nous；avant midi 交代期限。
  - subskill_id: possibility
    explanation: peut-être 或合適情態結構可以保留不確定性。句式要配合把握程度。
    examples:
      - text: Il va peut-être neiger cette nuit.
        meaning: 今晚可能落雪。
        note: peut-être 限定預測，唔係確定宣告會落雪。
  - subskill_id: certainty
    explanation: je suis certain que 等用語表示對說法有把握。devoir 亦可以表達推論，唔可以見到佢就判定係義務或肯定。
    examples:
      - text: "Je suis certaine que le guichet est fermé : je viens de vérifier."
        meaning: 我肯定櫃位閂咗，我啱啱查過。
        note: certaine 配合女性講者；後面交代理據，但唔代表應用程式已核實真實世界情況。
