skill_id: managing_conversation
language: french
guidance: >-
  Judge whether the learner manages this interaction using an appropriate greeting or
  closing, acknowledgement, clarification, reformulation, repair or turn/topic transition.
  Je vois can acknowledge an explanation without agreeing with it. Tu peux répéter ? can
  repair an audibility problem; qu’est-ce que tu veux dire par… ? targets meaning. Je
  voulais dire mardi, pas jeudi repairs a mistaken interpretation. Autrement dit signals
  rephrasing only if the content actually reformulates the prior contribution. A connector
  recited alone is not successful interaction management. Retain normal conversational
  ellipsis and register variation; do not demand a full sentence for a greeting or
  acknowledgement. Unrelated factual questions are not clarification merely because they
  use a question form. Credit requires correct use of the function, not merely an attempt.
  Unrelated errors do not erase a successful instance. Use unclear when the available
  exchange does not establish the function. Examples illustrate possibilities, not an
  exhaustive whitelist. Accept appropriate France and Canadian French usage and
  conversational register; do not impose another variety’s lexical preference.
