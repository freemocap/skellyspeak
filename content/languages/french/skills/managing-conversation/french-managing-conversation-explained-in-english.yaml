skill_id: managing_conversation
language: french
explanation_language: english
shared_explanation: skills/managing-conversation/managing-conversation-explained-in-english.yaml
sections:
  - subskill_id: opening_closing
    explanation: >-
      Use a greeting or closing appropriate to the interaction. Bonjour and au revoir
      serve different positions in an encounter; a closing can also refer to a future
      meeting.
    examples:
      - text: "Je dois partir. À demain !"
        meaning: >-
          I have to go. See you tomorrow!
        note: >-
          The departure statement prepares the closing; à demain ends the exchange while
          anticipating another meeting.
  - subskill_id: acknowledging
    explanation: >-
      Use a short response such as je vois or d’accord to show receipt or understanding.
      Whether it also expresses agreement depends on what it responds to.
    examples:
      - text: "Ah, je vois ce que tu veux dire."
        meaning: >-
          Oh, I see what you mean.
        note: >-
          This acknowledges the previous explanation; it need not endorse the partner’s
          opinion.
  - subskill_id: clarification
    explanation: >-
      Identify the word or point that needs explanation. Qu’est-ce que… veut dire can ask
      about meaning; a request to repeat addresses audibility instead.
    examples:
      - text: "Qu’est-ce que tu veux dire par « provisoire » ?"
        meaning: >-
          What do you mean by “temporary”?
        note: >-
          Par names the expression being queried; the question repairs understanding of
          the previous contribution.
  - subskill_id: rephrasing
    explanation: >-
      Introduce another formulation with autrement dit or c’est-à-dire when your earlier
      meaning was unclear. The new wording must preserve or clarify that meaning.
    examples:
      - text: "Autrement dit, nous devons réserver avant de payer."
        meaning: >-
          In other words, we need to book before paying.
        note: >-
          Autrement dit links the reformulation to prior speech. An unrelated new fact
          would not be a successful rephrasing.
  - subskill_id: correcting_misunderstanding
    explanation: >-
      Contrast the interpretation the partner received with the intended one. Je voulais
      dire commonly introduces this repair without requiring a full retelling.
    examples:
      - text: "Je voulais dire mardi, pas jeudi."
        meaning: >-
          I meant Tuesday, not Thursday.
        note: >-
          Voulais dire introduces the correction and pas jeudi identifies the mistaken
          alternative.
  - subskill_id: turns_topics
    explanation: >-
      Use an explicit transition or turn request so the other participant can follow a
      change of focus. Au fait often introduces a related new point.
    examples:
      - text: "Avant de changer de sujet, puis-je poser une question sur le prix ?"
        meaning: >-
          Before changing the subject, may I ask a question about the price?
        note: >-
          The opening phrase manages the discussion; puis-je requests the floor rather
          than locating an outside event in time.
