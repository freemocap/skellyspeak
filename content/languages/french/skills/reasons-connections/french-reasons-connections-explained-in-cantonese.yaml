sections:
  - subskill_id: causes_reasons
    explanation: parce que 引入原因；puisque 可以將原因表達為雙方已接受嘅資訊。理由短語可直接回答 pourquoi。
    examples:
      - text: Nous attendons parce que la route est fermée.
        meaning: 我哋等緊，因為條路封咗。
        note: parce que 將封路表達為等候原因，唔係單純同時發生。
  - subskill_id: consequences
    explanation: donc、alors 等結果結構可以連結情況同後果；要由內容判斷係咪真有因果意思。
    examples:
      - text: Le dernier bus est parti, donc nous allons rentrer à pied.
        meaning: 尾班巴士走咗，所以我哋會行路返屋企。
        note: donc 將行路返屋企表達為錯過巴士嘅結果，唔止係下一步。
  - subskill_id: conditions
    explanation: 開放將來條件通常用 si 加現在式，結果可用將來式；假設條件可以配合未完成過去式同條件式。要按意思選擇。
    examples:
      - text: Si la bibliothèque est ouverte, nous y travaillerons.
        meaning: 如果圖書館開門，我哋就喺嗰度做嘢。
        note: 條件 si 後面用現在式 est；travaillerons 表達將來結果，y 指返圖書館。
  - subskill_id: contrast
    explanation: mais 連接對比；pourtant 可以標示出乎預期嘅對比。連起嚟嘅意思本身要支持呢種關係。
    examples:
      - text: Le sac est petit, mais il contient tout mon matériel.
        meaning: 個袋細，但裝得晒我啲器材。
        note: mais 對比體積同容量；後半句唔係更正前半句。
  - subskill_id: supporting_claims
    explanation: 用相關觀察、例子或解釋支持論點，唔好只更強烈咁重複同一評價。
    examples:
      - text: "Ce trajet est plus rapide : hier, j’ai gagné vingt minutes."
        meaning: 呢條路快啲；噚日我慳咗二十分鐘。
        note: 所講嘅時間節省支持比較。呢個係講者證據，唔係應用程式獨立核實過嘅事實。
