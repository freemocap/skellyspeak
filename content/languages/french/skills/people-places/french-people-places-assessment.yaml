skill_id: people_places
language: french
guidance: >-
  Judge correctly expressed identification, description, location or movement, possession
  or relationship, quantity or comparison. C’est ma voisine and elle est médecin are
  ordinary identification patterns; elle est un médecin needs a licensing context or a
  modified noun rather than being assumed equivalent everywhere. Ma sœur and son frère
  distinguish noun agreement from the possessor’s gender. Cette valise est plus légère que
  le sac correctly compares weight; plus meilleur is not the ordinary comparative.
  Consider agreement and prepositions where they carry the assessed relation. A bare noun
  copied from a list is not contextual identification. A short identifying reply can count
  when its referent is clear. Credit requires correct use of the function, not merely an
  attempt. Unrelated errors do not erase a successful instance. Use unclear when the
  available exchange does not establish the function. Examples illustrate possibilities,
  not an exhaustive whitelist. Accept appropriate France and Canadian French usage and
  conversational register; do not impose another variety’s lexical preference.
