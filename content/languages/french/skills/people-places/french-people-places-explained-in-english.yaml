skill_id: people_places
language: french
explanation_language: english
shared_explanation: skills/people-places/people-places-explained-in-english.yaml
sections:
  - subskill_id: identification
    explanation: "You introduce a neighbour and then tell someone his occupation. `C’est mon voisin`
      identifies him: `c’est` means this is, and `mon voisin` means my neighbour. `Il est
      vétérinaire` describes his occupation. An unmodified profession after `il est` normally
      has no article; `C’est un vétérinaire` identifies someone as a veterinarian and includes
      `un`. For a woman, `C’est ma voisine. Elle est vétérinaire.` changes the relationship and
      pronoun; `vétérinaire` itself has the same form here."
    examples:
      - text: C’est mon voisin. Il est vétérinaire.
        meaning: That is my neighbour. He is a vet.
        note: "Introduce a female neighbour who is a veterinarian. `C’est ma voisine. Elle est
          vétérinaire.` works: `ma voisine` and `elle` identify her, and the profession still
          has no article after `elle est`."
  - subskill_id: qualities_states
    explanation: You are describing a kitchen in a flat, including its size and the light it gets.
      `La petite cuisine` means the small kitchen; `est lumineuse` says it is bright. Both
      `petite` and `lumineuse` agree with feminine singular `cuisine`. The common size adjective
      `petite` comes before the noun here, while the brightness description follows `est`. With
      masculine `salon`, the forms become `Le petit salon est lumineux.` French does not give
      every adjective the same position, so the noun and familiar phrase matter.
    examples:
      - text: La petite cuisine est lumineuse.
        meaning: The small kitchen is bright.
        note: Describe a small, bright living room. `Le petit salon est lumineux.` works because the
          article and both adjectives take masculine singular forms for `salon`.
  - subskill_id: location_movement
    explanation: A group is heading to a museum, and a station helps identify which one. `Nous
      allons` means we are going; `au musée` supplies the destination, and `près de la gare`
      means near the station. `Au` combines `à` and `le`; before a feminine noun the words
      remain separate, as in `à la gare`. This sentence describes movement towards a place.
      `Nous sommes au musée` instead says where the group already is. The same place phrase can
      appear with different verbs, so the verb carries that difference.
    examples:
      - text: Nous allons au musée près de la gare.
        meaning: We are going to the museum near the station.
        note: "Say that you are already at the museum. `Nous sommes au musée près de la gare.` works:
          `sommes` describes location rather than the journey there."
  - subskill_id: possession_relations
    explanation: "You identify someone through her connection to a colleague. `C’est la sœur` means
      this is the sister, and `de mon collègue` tells whose sister she is. French uses `de` to
      connect these nouns rather than adding an English possessive ending. `Mon` agrees with
      masculine singular `collègue` here; with a female colleague, `de ma collègue` is possible.
      Possessive words agree with the noun they introduce: `sa sœur` can mean his sister or her
      sister because `sœur` is feminine, regardless of the sibling's gender."
    examples:
      - text: C’est la sœur de mon collègue.
        meaning: That is my colleague’s sister.
        note: "Identify your colleague's brother. `C’est le frère de mon collègue.` works: the relation
          becomes masculine `le frère`, while the `de` phrase still identifies the colleague."
  - subskill_id: quantity_comparison
    explanation: You compare two pieces of luggage before carrying them. `Cette valise` means this
      suitcase; `plus légère que mon sac` says lighter than my bag. `Plus` makes the comparison,
      and `que` introduces the other item. `Légère` agrees with feminine `valise`; `Ce sac est
      plus léger que ma valise` instead describes masculine `sac`. For an equal weight, `aussi
      légère que` means as light as. A number such as `deux valises` gives a quantity, but it
      does not itself compare their weight.
    examples:
      - text: Cette valise est plus légère que mon sac.
        meaning: This suitcase is lighter than my bag.
        note: "Say that your bag is lighter than your suitcase. `Mon sac est plus léger que ma valise.`
          works: `léger` agrees with the bag being described, not with the item after `que`."
