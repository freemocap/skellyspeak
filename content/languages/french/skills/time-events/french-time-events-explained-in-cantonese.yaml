skill_id: time_events
language: french
explanation_language: cantonese
shared_explanation: skills/time-events/time-events-explained-in-cantonese.yaml
sections:
  - subskill_id: present_events
    explanation: 現在式可以講習慣、目前狀態或即時活動。en ce moment 可以明確交代而家做緊，唔需要另設進行時態。
    examples:
      - text: Je prépare le dîner en ce moment.
        meaning: 我而家準備緊晚餐。
        note: prépare 係現在式；en ce moment 指出今次當下活動，唔係一般習慣。
  - subskill_id: past_events
    explanation: 過去時結構要配合事件呈現方式。複合過去式常推進敘事；未完成過去式常交代持續背景或習慣。唔係見到某個時間詞就必定用其中一種。
    examples:
      - text: Hier, il pleuvait quand nous avons quitté la maison.
        meaning: 噚日我哋離開屋企嗰陣，落緊雨。
        note: pleuvait 交代持續背景；avons quitté 將離開呈現為背景中發生嘅事件。
  - subskill_id: future_events
    explanation: 現在式 aller 加不定式可以講計劃；亦可以用簡單將來式，或者有清楚將來語境嘅現在式。
    examples:
      - text: Nous allons visiter le jardin demain.
        meaning: 我哋聽日會去參觀花園。
        note: allons visiter 表達計劃；demain 定位將來。aller 有變位，visiter 保持不定式。
  - subskill_id: duration_frequency
    explanation: depuis 配合持續至今嘅情況，常用嚟計已經幾耐；pendant 計時長，chaque 同頻率副詞講重複。
    examples:
      - text: Je travaille ici depuis trois mois.
        meaning: 我喺呢度返工三個月喇。
        note: 法文用現在式配合 depuis 描述延續至今嘅情況。英文譯法用完成式，唔代表法文都要用完成式。
  - subskill_id: event_sequence
    explanation: d’abord、puis、ensuite 交代次序。before、after 對應嘅法文結構各有補語要求；次序本身唔表達因果。
    examples:
      - text: D’abord, nous avons acheté les billets, puis nous avons choisi nos places.
        meaning: 我哋先買飛，之後先揀位。
        note: d’abord 同 puis 排列先後，冇話買飛導致揀位。
  - subskill_id: event_phase
    explanation: commencer à、être en train de、finir de 加不定式，可以交代活動開始、進行或完成等階段。
    examples:
      - text: Je viens de finir de ranger la cuisine.
        meaning: 我啱啱執完廚房。
        note: finir de 標示完成；viens de 進一步交代係啱啱完成。
