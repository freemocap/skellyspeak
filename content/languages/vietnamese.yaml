# yaml-language-server: $schema=../schemas/language.json
schema_version: 1
identity:
  id: vietnamese
  name: Vietnamese
  native_name: Tiếng Việt
  family: austroasiatic
  review: needs_review
integrations:
  language_tag: vi
  transcription: vi
definitions:
  orthographies:
    quoc-ngu:
      script: latin
      guidance:
      - scope: target_writing
        text: Write Vietnamese in chữ Quốc ngữ, retaining vowel distinctions, đ and all tone marks, including
          stacked diacritics. Preserve quoted source spelling and Unicode sequences exactly. Do not strip
          accents or replace Vietnamese text with an ASCII approximation.
        sources:
        - unicode17_europe
      - scope: explanation_writing
        text: Write Vietnamese in chữ Quốc ngữ, retaining vowel distinctions, đ and all tone marks, including
          stacked diacritics. Preserve quoted source spelling and Unicode sequences exactly. Do not strip
          accents or replace Vietnamese text with an ASCII approximation.
        sources:
        - unicode17_europe
  romanization_schemes: {}
defaults:
  variety: vietnamese-vietnam
  orthography:
    local: quoc-ngu
  scalars: {}
  romanization:
    mode: disabled
  supported_romanizations: []
traits:
- tones
varieties:
- id: vietnamese-vietnam
  name: Vietnam
  description: Contemporary Vietnamese in Vietnam, with standard writing and context-appropriate everyday
    conversation; no single regional accent is prescribed.
  review: needs_review
  sources:
  - unicode17_europe
  overrides: {}
  guidance: []
guidance: []
learning:
  goal_material:
    courtesy:
      tokens:
      - cảm ơn
      - xin lỗi
