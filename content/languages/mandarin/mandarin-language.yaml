      - 不好意思。
      - 对不起。
      - 没关系。
      - 再见！
      - 回头见！
      - 晚安！
    idiomatic:
      - 别半途而废。
      - 她一心一意地学习。
      - 我对这件事半信半疑。
      - 这只是冰山一角。
      - 这本书让我爱不释手。
      - 我的钥匙不翼而飞了。
      - 别愁眉苦脸的。
      - 我一时不知所措。
  varieties: {}
