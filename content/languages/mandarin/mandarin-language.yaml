# yaml-language-server: $schema=../../rust-schemas/language.yaml
schema_version: 1
identity:
  id: mandarin
  name: Mandarin
  native_name: 中文（简体）
  family: sino-tibetan
  review: needs_review
integrations:
  language_tag: zh
  transcription: zh
definitions:
  orthographies:
    simplified-chinese:
      script: simplified-chinese
      guidance:
        - scope: target_writing
          text: Write newly generated Mandarin text in Simplified Chinese characters. When reproducing a
            source excerpt verbatim, preserve it exactly. This does not prevent translating text
            when translation is requested.
          sources:
            - pinyin_orthography2012
        - scope: explanation_writing
          text: Write newly generated Mandarin text in Simplified Chinese characters. When reproducing a
            source excerpt verbatim, preserve it exactly. This does not prevent translating text
            when translation is requested.
          sources:
            - pinyin_orthography2012
  romanization_schemes:
    pinyin:
      label: Hanyu Pinyin
      instructions: Always mark lexical tones 1–4 with vowel diacritics (ā, á, ǎ, à); never use tone
        numbers or omit lexical tone marks. Neutral-tone syllables remain unmarked. Put the mark on
        the main vowel; in iu and ui mark the last vowel. Preserve ü where required (nǚ, lǜ), never
        v or u:. Use lexical tones, including yī and bù, rather than contextual tone sandhi. Keep
        standard word joining and syllable-separating apostrophes. Never alter the Chinese source.
      examples:
        - original: 妈
          romanized: mā
        - original: 麻
          romanized: má
        - original: 马
          romanized: mǎ
        - original: 骂
          romanized: mà
        - original: 吗
          romanized: ma
        - original: 女
          romanized: nǚ
        - original: 流水
          romanized: liúshuǐ
        - original: 西安
          romanized: Xī'ān
      sources:
        - pinyin_orthography2012
      review: needs_review
defaults:
  variety: mandarin-mainland-china
  orthography:
    local: simplified-chinese
  scalars:
    font_scale: 1.3
  romanization:
    mode: scheme
    scheme:
      local: pinyin
  supported_romanizations:
    - local: pinyin
traits:
  - tones
  - unspaced-words
varieties:
  - id: mandarin-mainland-china
    name: Mainland China
    description: Mainland China
    review: needs_review
    sources: []
    overrides: {}
    guidance: []
guidance:
  - scope: segmentation
    text: Select linguistic words rather than assuming spaces or individual characters define word
      boundaries.
    sources:
      - ud
conversation:
  greeting:
    text: 你好
    romanizations:
      mandarin:pinyin: nǐ hǎo
  default_partner:
    name: 小林
    romanizedName: Xiǎo Lín
    age: 26
    location: Chengdu, China
    occupation: Bike courier saving up for a tea shop
    background: Moved to Chengdu from a small town in Yunnan. Shares a flat with two friends and far too
      many plants.
    currentSituation: Saving money, learning to brew pu'er properly, and training for a hundred-kilometre ride.
    interests:
      - night rides through the city
      - street food
      - tea
      - cheap science-fiction paperbacks
    opinions:
      - The best food is always in the least attractive shop.
      - Mornings should start later.
    interestingFacts:
      - Knows the steepest street in every district.
      - Can fix a flat tyre in four minutes.
    favoriteBooks:
      - The Three-Body Problem — Liu Cixin
      - To Live — Yu Hua
    favoriteMovies:
      - Spirited Away (2001)
      - In the Mood for Love (2000)
    manner: Relaxed and funny. Short replies, and often steers the subject back to food.
    quirks:
      - Rates every meal out of ten.
    vibe:
      - 🚲
      - 🍜
      - 🍃
practice:
  review: needs_review
  sets:
    absolute_zero:
      - 是。
      - 不是。
      - 请给我水。
      - 我在这里。
      - 很热。
      - 我饿了。
      - 这是什么？
      - 我不知道。
    beginner:
      - 她是医生。
      - 这个房间很安静。
      - 我有一辆自行车。
      - 这是我妹妹。
      - 我有两本书。
      - 我想喝一点儿水。
      - 我在这里工作。
      - 她正在看书。
    intermediate:
      - 我昨天去了学校。
      - 我以前住在这里。
      - 我明天去北京。
      - 我打算下周回家。
      - 我喜欢喝茶。
      - 我想休息一下。
      - 我会游泳。
      - 我可以坐这里吗？
    advanced:
      - 早知道会议会开这么久，我就提前安排好回家的交通了。
      - 我最担心的是，这个决定会对那些没有参与讨论的人造成什么影响。
      - 虽然这个方案看起来很有前景，但我们还是应该仔细考虑它可能带来的后果。
      - 与其仓促做出一个将来可能后悔的决定，我宁愿把旅行推迟。
      - 这份报告我读得越仔细，就越觉得它的结论缺乏足够的依据。
      - 这个项目能否成功，在很大程度上取决于我们如何分配责任。
      - 我并不是反对这个想法，只是不确定现在是不是合适的时机。
      - 等我们弄清楚究竟发生了什么，已经很难采取措施来挽回局面了。
    social:
