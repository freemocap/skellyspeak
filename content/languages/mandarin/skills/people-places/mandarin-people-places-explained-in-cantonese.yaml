skill_id: people_places
explanation_language: cantonese
shared_explanation: skills/people-places/people-places-explained-in-cantonese.yaml
sections:
  - subskill_id: identification
    explanation: 介紹鄰居時，要話畀人知眼前係邊位，同你有咩關係。`这是` 開始身份介紹，`我的邻居` 交代關係，唔係描述性質。
    examples:
      - text: 这是我的邻居。
        meaning: "**例句。** 呢位係我嘅鄰居。`这` 指眼前呢位，`是` 接去身份短語，`邻居` 係鄰居。`我的` 係我嘅：相關嘅人放 `的` 前，名詞喺後。"
        note: 試下介紹對方嘅鄰居：`这是你的邻居。` 將 `的` 前嘅 `我` 換成 `你`。`这是我姐姐` 都係介紹關係；`姐姐` 呢類親近家人稱呼，通常可以唔用 `的`。
  - subskill_id: qualities_states
    explanation: 搬大件嘢揀路時，闊窄好重要。`窄` 直接描述窄。呢個普通描述入面，`很` 令形容詞陳述自然，未必特別強調好窄。
    examples:
      - text: 这条路很窄。
        meaning: "**例句。** 呢條路窄。`这条路` 係呢條路：`这` 指呢條，`条` 係量詞，`路` 係路。`很窄` 交代性質。呢個中性形容詞描述唔喺路同形容詞之間加 `是`。"
        note: 試下話條路闊：`这条路很宽。` `窄` 換成 `宽`。想話唔窄用 `这条路不窄`，否定 `不` 放形容詞前，唔保留 `很`。
  - subskill_id: location_movement
    explanation: 人哋搵唔到鎖匙，講清楚位置就幫到佢。`在` 將鎖匙接到地方。先講參照物，再講方位，所以先講枱，後講上面。
    examples:
      - text: 钥匙在桌子上。
        meaning: "**例句。** 鎖匙喺枱上面。`钥匙` 係鎖匙，`桌子` 係枱，`上` 係上面；合埋 `桌子上` 係枱上面。`在桌子上` 講鎖匙喺邊，唔係向枱移動。"
        note: 試下話鎖匙喺枱下面：`钥匙在桌子下。` 將 `上` 換成 `下`。`把钥匙放在桌子上` 係將鎖匙放上枱，`放` 加咗擺放動作；原句只交代位置。
  - subskill_id: possession_relations
    explanation: 安排座位前，講有幾多張椅，就知道有咩用品。`有` 表擁有，數字同量詞放喺被數嘅物件前。
    examples:
      - text: 我有两把折叠椅。
        meaning: "**例句。** 我有兩張摺椅。`我有` 係我有，`两` 喺呢個數量短語係二，`把` 係呢度數椅嘅量詞，`折叠椅` 係摺椅。名詞唔使另加複數詞尾。"
        note: 試下話有三張摺椅：`我有三把折叠椅。` 將 `两` 換成 `三`，保留 `把`。呢度 `把` 數椅；`把椅子搬到门口` 係搬張椅去門口，嗰個 `把` 就引出被移動嘅物件。
  - subskill_id: quantity_comparison
    explanation: 一個箱易搬啲，重量比較就幫到分工。`比` 先引出另一個箱，再講比較嘅性質；性質後嘅 `一点` 話差別細。
    examples:
      - text: 这个箱子比那个轻一点。
        meaning: "**例句。** 呢個箱比嗰個輕少少。`这个箱子` 係呢個箱，`比那个` 係同嗰個比較，`轻` 係輕，`一点` 係少少。已經知道講緊箱，所以 `那个` 後面唔使再重複名詞。"
        note: 試下話重少少：`这个箱子比那个重一点。` 將 `轻` 換成 `重`，保留比較同細差別。一樣重用 `这个箱子和那个一样重`，講相同重量而唔係差別。
