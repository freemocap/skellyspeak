sections:
  - subskill_id: identification
    explanation: 是 將對象同識別身分嘅名詞短語連起嚟。的 可以交代人物同講者嘅關係。
    examples:
      - text: 这是我的邻居。
        meaning: 呢位係我鄰居。
        note: 这 引入人物，我的邻居 交代佢同講者嘅關係。
  - subskill_id: qualities_states
    explanation: 形容詞可以直接做謂語，唔一定加 是。很 經常令一般描述句更自然，未必強調「非常」。唔好見到 很 就一律當成程度好強。
    examples:
      - text: 这条路很窄。
        meaning: 呢條路好窄。
        note: 条 係呢條路嘅量詞；很窄 描述闊度。
  - subskill_id: location_movement
    explanation: 在 加位置短語可以交代位置；上 等方位詞交代同參照物嘅關係。
    examples:
      - text: 钥匙在桌子上。
        meaning: 條鎖匙喺張枱上面。
        note: 桌子上 交代位置；在 將鎖匙同嗰個位置連起嚟。解說用 喺，普通話例句仍然用 在。
  - subskill_id: possession_relations
    explanation: 有 表達擁有。數詞同量詞可以交代擁有幾多件乜嘢。
    examples:
      - text: 我有两把折叠椅。
        meaning: 我有兩張摺椅。
        note: 两把 用 把 做椅子嘅量詞；廣東話譯文用「兩張」唔代表普通話例句都要改成 张。有 喺呢度唔表示過去事件。
  - subskill_id: quantity_comparison
    explanation: 比 同比較對象放喺形容詞前面；程度短語可以交代差幾多。
    examples:
      - text: 这个箱子比那个轻一点。
        meaning: 呢個箱比嗰個輕少少。
        note: 一点 表示重量差距唔大。那个 後面嘅名詞可以由語境補足，唔使重複。
