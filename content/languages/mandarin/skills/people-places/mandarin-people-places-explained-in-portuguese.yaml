skill_id: people_places
explanation_language: portuguese
shared_explanation: skills/people-places/people-places-explained-in-portuguese.yaml
sections:
  - subskill_id: identification
    explanation: Apresentar uma pessoa como sua vizinha informa quem ela é e como você a conhece. `这是` inicia a
      identificação; `我的邻居` apresenta a relação, não uma qualidade.
    examples:
      - text: 这是我的邻居。
        meaning: "**O exemplo.** Esta pessoa é minha vizinha. `这` aponta para ela, `是` liga a pessoa à expressão
          identificadora, e `邻居` significa vizinho ou vizinha. `我的` significa meu ou minha: a pessoa
          relacionada vem antes de `的`, seguida do substantivo."
        note: "Experimente apresentar o vizinho da outra pessoa. Resposta: `这是你的邻居。` Troque `我` por `你` antes de `的`.
          `这是我姐姐` também apresenta uma relação; termos próximos de família como `姐姐`, irmã mais velha,
          aparecem frequentemente sem `的`."
  - subskill_id: qualities_states
    explanation: Ao escolher um caminho para carregar algo volumoso, a largura da estrada importa. `窄` descreve
      diretamente uma via estreita. Nessa descrição comum, `很` torna natural a frase com adjetivo sem
      necessariamente enfatizar que ela é muito estreita.
    examples:
      - text: 这条路很窄。
        meaning: "**O exemplo.** Esta estrada é estreita. `这条路` significa esta estrada: `这` aponta para ela, `条` é seu
          classificador e `路` significa estrada. `很窄` dá a qualidade. Não há `是` entre a estrada e essa
          descrição adjetival neutra."
        note: "Experimente dizer que a estrada é larga. Resposta: `这条路很宽。` Troque `窄` por `宽`, largo. Para dizer que
          não é estreita, use `这条路不窄`; `不` vem antes do adjetivo em vez de conservar `很`."
  - subskill_id: location_movement
    explanation: "Quando alguém não encontra a chave, sua posição ajuda a recuperá-la. `在` liga a chave a um
      lugar. O objeto de referência vem antes da palavra de posição: mesa antes de « em cima »."
    examples:
      - text: 钥匙在桌子上。
        meaning: "**O exemplo.** A chave está sobre a mesa. `钥匙` significa chave, `桌子` mesa e `上` em cima; juntos,
          `桌子上` significa sobre a mesa. `在桌子上` indica onde está a chave, não um movimento até a mesa."
        note: "Experimente situar a chave debaixo da mesa. Resposta: `钥匙在桌子下。` Troque `上` por `下`, embaixo. Em
          `把钥匙放在桌子上`, colocar a chave sobre a mesa, `放` acrescenta a ação de posicioná-la; a frase original
          apenas descreve sua localização."
  - subskill_id: possession_relations
    explanation: Antes de organizar os assentos, informar quantas cadeiras você tem esclarece o material
      disponível. `有` exprime posse, e o número e o classificador vêm antes do objeto contado.
    examples:
      - text: 我有两把折叠椅。
        meaning: "**O exemplo.** Tenho duas cadeiras dobráveis. `我有` significa eu tenho, `两` é dois nessa expressão de
          contagem, `把` é aqui o classificador de cadeiras e `折叠椅` significa cadeira dobrável. O substantivo
          não recebe uma terminação extra de plural."
        note: "Experimente dizer que tem três cadeiras dobráveis. Resposta: `我有三把折叠椅。` Troque `两` por `三`, conservando
          `把`. Aqui `把` conta cadeiras; em `把椅子搬到门口`, mover a cadeira até a entrada, introduz o objeto a ser
          movido."
  - subskill_id: quantity_comparison
    explanation: Se uma caixa é mais fácil de carregar, comparar seu peso ajuda a decidir quem a leva. `比`
      apresenta a outra caixa antes da qualidade comparada; `一点` depois dessa qualidade indica uma pequena
      diferença.
    examples:
      - text: 这个箱子比那个轻一点。
        meaning: "**O exemplo.** Esta caixa é um pouco mais leve que aquela. `这个箱子` é esta caixa, `比那个` é comparada
          com aquela, `轻` é leve e `一点` é um pouco. `那个` representa a outra caixa porque as caixas já são
          conhecidas."
        note: "Experimente dizer que esta caixa é um pouco mais pesada. Resposta: `这个箱子比那个重一点。` Troque `轻` por `重`;
          mantenha a comparação e a pequena diferença. Para peso igual, `这个箱子和那个一样重` diz que as duas caixas
          têm o mesmo peso, em vez de comparar uma diferença."
