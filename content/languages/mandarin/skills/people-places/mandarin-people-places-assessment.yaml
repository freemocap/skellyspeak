language: mandarin
skill_id: people_places
guidance: Assess identification, properties, location or movement, possession or relationships,
  and quantity or comparison. 这是我的邻居 identifies a person; 这条路很窄 predicates a property without
  requiring 是 before an adjective. 很 in a neutral adjective predicate need not mean an emphatic
  very. 在桌子上 locates an object; 到公园去 expresses a destination. 的 can mark possession, but
  ordinary close relationships such as 我姐姐 can omit it. 两把椅子 counts chairs with a classifier;
  二号车 may identify a vehicle without counting two. 比 compares properties, while 更喜欢 expresses a
  preference. A copied 的 or a noun list without an identifiable relation is absent. 桌子上 can
  answer a where-question contextually. Do not invent gender agreement or English plural
  endings. Judge an actual malformed construction rather than rejecting a legitimate
  topic-comment order, an omitted recoverable noun or a contrastive use of 是.
