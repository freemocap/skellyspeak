sections:
  - subskill_id: identification
    explanation: يخبر التعريف بالجار المستمع من يكون الشخص وما علاقتك به. تبدأ `这是` تحديد الهوية؛ وتذكر
      `我的邻居` العلاقة بدل وصف صفة.
    examples:
      - text: 这是我的邻居。
        meaning: "**المثال.** هذا جاري. تشير `这` إلى هذا الشخص، وتربط `是` بينه وبين عبارة التعريف، وتعني
          `邻居` جارًا. وتعني `我的` «لي»: يأتي صاحب العلاقة قبل `的`، ويأتي الاسم بعدها."
        note: "**جرّب:** عرّف بجار الشخص الآخر. الإجابة: `这是你的邻居。` استبدل `我` بـ`你` قبل `的`. تقدّم `这是我姐姐`
          علاقةً أيضًا؛ فكلمات القرابة القريبة مثل `姐姐`، أي الأخت الكبرى، تأتي كثيرًا من غير `的`."
  - subskill_id: qualities_states
    explanation: عند اختيار طريق لحمل شيء كبير، يهم عرض الطريق. تصف `窄` الضيق مباشرةً. في هذا الوصف
      المعتاد، تجعل `很` جملة الصفة طبيعية من غير أن تؤكد بالضرورة معنى «ضيق جدًا».
    examples:
      - text: 这条路很窄。
        meaning: "**المثال.** هذا الطريق ضيق. `这条路` هو هذا الطريق: تشير `这` إليه، و`条` أداة عده، و`路`
          الطريق. تقدّم `很窄` الصفة. لا تأتي `是` بين الطريق وهذا الوصف المحايد بالصفة."
        note: "**جرّب:** قل إن هذا الطريق واسع. الإجابة: `这条路很宽。` استبدل `窄` بـ`宽`، أي واسع. وللقول إنه ليس
          ضيقًا استعمل `这条路不窄`؛ تسبق `不` الصفة بدل إبقاء `很`."
  - subskill_id: location_movement
    explanation: عندما لا يجد شخص المفتاح، تساعده تسمية موضعه على أخذه. تربط `在` المفتاح بمكان. يأتي
      الشيء المرجعي قبل كلمة الموضع، فتذكر الطاولة قبل «فوق».
    examples:
      - text: 钥匙在桌子上。
        meaning: "**المثال.** المفتاح على الطاولة. `钥匙` مفتاح، و`桌子` طاولة، وتعني `上` فوق أو على؛ وتشكل
          `桌子上` معًا «على الطاولة». تحدد `在桌子上` مكان المفتاح لا حركةً نحو الطاولة."
        note: "**جرّب:** ضع المفتاح تحت الطاولة في وصفك. الإجابة: `钥匙在桌子下。` استبدل `上` بـ`下`، أي تحت. تضيف
          `放` في `把钥匙放在桌子上`، أي «ضع المفتاح على الطاولة»، فعلَ وضع؛ أما الجملة الأصلية فتصف الموقع
          فقط."
  - subskill_id: possession_relations
    explanation: قبل ترتيب المقاعد، يوضح ذكر عدد الكراسي التي تملكها الموارد المتاحة. تعبّر `有` عن
      الامتلاك، ويسبق العدد وأداة العد الشيءَ المعدود.
    examples:
      - text: 我有两把折叠椅。
        meaning: "**المثال.** لدي كرسيان قابلان للطي. تعني `我有` أن لدي، و`两` اثنين في هذا التعبير العددي،
          و`把` أداة عد الكراسي هنا، و`折叠椅` كرسيًا قابلًا للطي. لا تُضاف إلى الاسم نهاية جمع."
        note: "**جرّب:** قل إن لديك ثلاثة كراسٍ قابلة للطي. الإجابة: `我有三把折叠椅。` استبدل `两` بـ`三` مع إبقاء
          `把`. تعد `把` الكراسي هنا؛ أما في `把椅子搬到门口`، أي نقل الكرسي إلى المدخل، فتقدّم المفعول
          المنقول."
  - subskill_id: quantity_comparison
    explanation: إذا كان حمل صندوق أسهل، تساعد مقارنة الوزن على توزيعه. تسمّي `比` الصندوق الآخر قبل
      الصفة المقارَنة؛ وتبين `一点` بعد الصفة أن الفرق صغير.
    examples:
      - text: 这个箱子比那个轻一点。
        meaning: "**المثال.** هذا الصندوق أخف قليلًا من ذاك. `这个箱子` هو هذا الصندوق، و`比那个` تعني مقارنةً
          بذاك، و`轻` خفيف، و`一点` قليلًا. تحل `那个` محل الصندوق الآخر لأن الحديث عن الصناديق واضح."
        note: "**جرّب:** قل إن هذا الصندوق أثقل قليلًا. الإجابة: `这个箱子比那个重一点。` استبدل `轻` بـ`重`، وأبقِ
          المقارنة ومقدار الفرق الصغير. ولتساوي الوزن تقول `这个箱子和那个一样重` إن وزن هذا الصندوق وذاك
          متساوٍ بدل ذكر فرق."
