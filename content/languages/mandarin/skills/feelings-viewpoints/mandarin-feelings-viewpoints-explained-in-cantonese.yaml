sections:
  - subskill_id: wants_intentions
    explanation: 想 放喺行動前面，可以表達想做。学 引入想學識嘅技能。
    examples:
      - text: 我想学修自行车。
        meaning: 我想學整單車。
        note: 想学 交代學習願望；修自行车 交代活動。呢句唔係承諾。
  - subskill_id: preferences
    explanation: 更喜欢 表達比較鍾意邊個選項。可以先用一個話題式短語列出選項。
    examples:
      - text: 咖啡和红茶，我更喜欢红茶。
        meaning: 咖啡同紅茶之間，我比較鍾意紅茶。
        note: 開頭短語列出選項；更喜欢 表達偏好，唔係比較物件大小等特徵。
  - subskill_id: emotions
    explanation: 高兴 描述開心。可以先交代引起感受嘅事，再講情緒反應。
    examples:
      - text: 听到这个消息，我很高兴。
        meaning: 聽到呢個消息，我好開心。
        note: 听到 交代引起感受嘅事；高兴 係講者嘅情緒反應。
  - subskill_id: opinions
    explanation: 觉得 可以將之後嘅內容表達為講者嘅判斷。
    examples:
      - text: 我觉得这个办法不错。
        meaning: 我覺得呢個方法幾好。
        note: 不错 喺呢度係正面評價，唔係只話有呢個方法。
  - subskill_id: agreement_disagreement
    explanation: 也 同 这么想 可以將自己嘅看法連到上文觀點。究竟「咁諗」係點諗，要睇之前講咗乜。
    examples:
      - text: 我也这么想。
        meaning: 我都係咁諗。
        note: 回應一個清楚嘅方法評價。呢句贊同嗰個觀點，唔係只表示聽到或聽明。
