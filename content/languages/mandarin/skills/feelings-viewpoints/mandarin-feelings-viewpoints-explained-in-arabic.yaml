sections:
  - subskill_id: wants_intentions
    explanation: قد يكون إصلاح الدراجة مهارةً تريد تعلمها قبل أن تستطيع فعلها. تعبّر `想` قبل النشاط عن
      هذه الرغبة؛ وتقدّم `学` ما تريد تعلمه.
    examples:
      - text: 我想学修自行车。
        meaning: "**المثال.** أريد تعلم إصلاح الدراجات. تعني `我想` «أريد»، و`学` «أتعلّم»، و`修自行车` إصلاح
          الدراجات. يأتي نشاط الإصلاح كاملًا بعد `学`؛ وتتعلق `想` بالرغبة في تعلمه."
        note: "**جرّب:** قل إن المجموعة تريد تعلم هذه المهارة. الإجابة: `我们想学修自行车。` غيّر `我` إلى `我们` من غير
          تغيير نهاية الفعل. تقول `我会修自行车` إنك تعرف الإصلاح بالفعل؛ وتعبّر `我想学` عن رغبتك في اكتساب
          المهارة."
  - subskill_id: preferences
    explanation: عند اختيار مشروب، يمكنك تسمية البديلين أولًا ثم ذكر تفضيلك. تحدد `更喜欢` الخيار الذي
      يعجبك أكثر، لا فرق السعر أو الحجم.
    examples:
      - text: 咖啡和红茶，我更喜欢红茶。
        meaning: "**المثال.** بين القهوة والشاي الأسود، أفضّل الشاي الأسود. تعرض `咖啡和红茶` القهوة والشاي
          الأسود؛ وتصل `和` بينهما. وتعني `我更喜欢红茶` أنني أحب الشاي الأسود أكثر. تأتي `更` قبل `喜欢`،
          ويليهما المشروب المفضّل."
        note: "**جرّب:** فضّل القهوة بدلًا من ذلك. الإجابة: `咖啡和红茶，我更喜欢咖啡。` غيّر المشروب بعد `更喜欢` وحده.
          تعبّر `我喜欢红茶` عن حب الشاي الأسود، لكنها لا تقارنه بالقهوة بذاتها."
  - subskill_id: emotions
    explanation: قد يدفعك خبر سار إلى مشاركة شعورك. يأتي سماع الخبر أولًا ثم ردك العاطفي. تعبّر `高兴` عن
      السعادة مباشرةً من غير حاجة إلى فعل ربط منفصل.
    examples:
      - text: 听到这个消息，我很高兴。
        meaning: "**المثال.** يسعدني سماع هذا الخبر. تعني `听到` السماع، وتحدد `到` وصول الخبر إليك. `这个消息` هو
          هذا الخبر. وبعد الفاصلة تقدّم `我很高兴` الاستجابة: أنا سعيد. لا تعني `很` بالضرورة «جدًا»
          للتوكيد هنا."
        note: "**جرّب:** أخبر عن سعادة المجموعة. الإجابة: `听到这个消息，我们很高兴。` غيّر صاحب الشعور إلى `我们`، وأبقِ
          عبارة السماع. تذكر `我听到这个消息` سماع الخبر فقط وتترك الشعور غير مذكور."
  - subskill_id: opinions
    explanation: بعد مناقشة طريقة لحل مشكلة، يمكنك إبداء تقييمك الخاص. تؤطر `我觉得` ما يليها بوصفه حكمك،
      وتقدّم `不错` تقييمًا إيجابيًا.
    examples:
      - text: 我觉得这个办法不错。
        meaning: "**المثال.** أرى أن هذه الطريقة جيدة. `这个办法` تعني هذه الطريقة أو هذا النهج. تحتوي `不错`
          حرفيًا «لا» و«خطأ»، لكنها هنا تعبير مألوف إيجابي بمعنى «ليس سيئًا». تقدّم `觉得` التقييم ولا
          تدل على اللمس الجسدي."
        note: "**جرّب:** قيّم طريقةً أخرى. الإجابة: `我觉得那个办法不错。` استبدل `这个` بـ`那个`. تقول `这个办法很贵` إن النهج
          غالٍ؛ وتجعل إضافة `我觉得` ذلك حكمك أنت."
  - subskill_id: agreement_disagreement
    explanation: عبّر شخص عن رأيه في طريقة، وأنت تشاركه الرأي. تضيفك `也` إلى من يعتقدون ذلك؛ وتعود `这么`
      إلى الرأي المذكور بالفعل.
    examples:
      - text: 我也这么想。
        meaning: "**المثال.** أظن ذلك أيضًا. `我` تعني أنا، و`也` أيضًا، و`这么` بهذه الطريقة، و`想` التفكير هنا.
          يأتي الترتيب بـ`也` قبل عبارة التفكير. يحتاج المستمع إلى الرأي السابق ليعرف ما توافق عليه."
        note: "**جرّب:** عبّر عن الاختلاف بدلًا من ذلك. الإجابة: `我不这么想。` استبدل `也` بـ`不`؛ فلم تعد تشارك
          الرأي. تعني `我明白了` أنك فهمت الشرح الآن، وقد يصح ذلك حتى إن اختلفت معه."
