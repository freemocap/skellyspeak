language: mandarin
skill_id: feelings_viewpoints
guidance: Assess desire, preference, emotion, personal judgment and agreement. 我想学修自行车 expresses
  a desire with 想 before an action, while 想 followed by a person can instead concern missing or
  thinking about them. 我更喜欢红茶 expresses preference; 我很高兴 expresses emotion without an English
  copula. 我觉得这个办法不错 marks a judgment. 我也这么想 can align with an identifiable opinion, but 我明白了 may
  only acknowledge comprehension. 红茶 can choose the preferred drink contextually after a
  preference question; a drink name in a list is not automatically liking. A copied 喜欢 without a
  recoverable experiencer or object is absent. A neutral factual report does not become opinion
  merely because it is asserted. Distinguish wanting an action from offering or promising it.
  Correct stance expression survives unrelated errors, and assess constructions rather than
  demanding pronouns or 的 where ordinary Mandarin permits omission.
