sections:
  - subskill_id: wants_intentions
    explanation: A bicycle repair can be a skill you want to learn, even before you can do it. `想`
      before an activity expresses that wish; `学` introduces what you want to learn.
    examples:
      - text: 我想学修自行车。
        meaning: "**The example.** I want to learn to repair bicycles. `我想` is I want to, `学` is learn, and
          `修自行车` is repair bicycles. The whole repair activity follows `学`; `想` applies to learning
          it."
        note: "Try saying the group wants to learn this skill. Answer: `我们想学修自行车。` Change `我` to `我们`, with
          no verb ending change. `我会修自行车` says you already know how; `我想学` expresses a wish to
          acquire the skill."
  - subskill_id: preferences
    explanation: When choosing a drink, you can name the alternatives first and then give your
      preference. `更喜欢` identifies the option you like more, rather than a difference in price or
      size.
    examples:
      - text: 咖啡和红茶，我更喜欢红茶。
        meaning: "**The example.** Between coffee and black tea, I prefer black tea. `咖啡和红茶` sets up coffee
          and black tea; `和` joins the two. `我更喜欢红茶` says I like black tea more. `更` comes before
          `喜欢`, and the preferred drink follows it."
        note: "Try preferring coffee instead. Answer: `咖啡和红茶，我更喜欢咖啡。` Change only the drink after `更喜欢`.
          `我喜欢红茶` expresses liking black tea but does not itself compare it with coffee."
  - subskill_id: emotions
    explanation: Good news can prompt a feeling you want to share. The hearing comes first, followed by
      your emotional response. `高兴` expresses happiness directly rather than needing a separate
      linking verb.
    examples:
      - text: 听到这个消息，我很高兴。
        meaning: "**The example.** I am happy to hear this news. `听到` means hear, with `到` marking that the
          news reaches you. `这个消息` is this news. After the comma, `我很高兴` gives the response: I am
          happy. `很` does not necessarily mean emphatically very here."
        note: "Try reporting the group’s happiness. Answer: `听到这个消息，我们很高兴。` Change the person feeling it to
          `我们`; the hearing phrase stays. `我听到这个消息` only reports hearing the news and leaves the
          feeling unstated."
  - subskill_id: opinions
    explanation: After discussing a way to solve a problem, you can give your own evaluation. `我觉得`
      frames what follows as your judgement, and `不错` gives a positive assessment.
    examples:
      - text: 我觉得这个办法不错。
        meaning: "**The example.** I think this method is quite good. `这个办法` is this method or approach.
          `不错` literally contains not and wrong, but here it is the familiar positive judgement not
          bad. `觉得` introduces that evaluation rather than physical touch."
        note: "Try evaluating a different method. Answer: `我觉得那个办法不错。` Replace `这个` with `那个`. `这个办法很贵` says
          the approach is expensive; adding `我觉得` presents that assessment as your own judgement."
  - subskill_id: agreement_disagreement
    explanation: Someone has given an opinion about a method, and you share that view. `也` adds you to
      the people thinking it; `这么` refers back to the opinion already expressed.
    examples:
      - text: 我也这么想。
        meaning: "**The example.** I think so too. `我` is I, `也` is also, `这么` is this way, and `想` is think
          here. The order puts `也` before the thinking phrase. The listener needs the earlier
          opinion to know what you agree with."
        note: "Try expressing disagreement instead. Answer: `我不这么想。` Replace `也` with `不`; you no longer
          share the view. `我明白了` says you now understand the explanation, which can be true even
          when you disagree."
