sections:
  - subskill_id: causes_reasons
    explanation: 因为 引入解釋。可以先講決定，再喺後面補原因。
    examples:
      - text: 我坐公交车，因为自行车坏了。
        meaning: 我搭巴士，因為架單車壞咗。
        note: 單車壞咗解釋咗交通選擇。了 表達單車狀況出現改變。
  - subskill_id: consequences
    explanation: 所以 引入前面情況嘅結果。因果關係要由兩個子句嘅內容支持。
    examples:
      - text: 桥封了，所以我们换了一条路。
        meaning: 條橋封咗，所以我哋改行另一條路。
        note: 封橋解釋咗點解改路線。一条路 用 条 做路或路線嘅量詞。
  - subskill_id: conditions
    explanation: 如果 引入條件，就 連結結果。唔需要特別嘅條件式動詞變位。
    examples:
      - text: 如果明天下雨，我们就改天去。
        meaning: 如果聽日落雨，我哋就改日先去。
        note: 落雨係假設條件；改天 交代條件成立時嘅替代安排。
  - subskill_id: contrast
    explanation: 虽然 同 但是 可以成對使用，先讓步，再帶出相反重點。呢種配搭喺普通話係正常嘅，唔好照搬英文 although 通常唔同 but 並用嘅限制。
    examples:
      - text: 虽然路很短，但是坡很陡。
        meaning: 雖然條路短，但個斜坡好斜。
        note: 即使路程短，斜坡陡仍然係一個不利因素。
  - subskill_id: supporting_claims
    explanation: 觉得 可以引入推論，因为 引入支持觀察。要分清支持相信某事嘅證據，同令件事發生嘅原因。
    examples:
      - text: 我觉得里面还有人，因为灯还亮着。
        meaning: 我諗入面仲有人，因為盞燈仲着住。
        note: 燈光支持有人嘅推論；还 表示持續。句子冇話係盞燈令某個人留喺入面。
