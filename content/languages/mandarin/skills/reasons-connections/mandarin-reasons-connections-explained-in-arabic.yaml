sections:
  - subskill_id: causes_reasons
    explanation: قد تفسر الدراجة المعطلة اختيارك الحافلة اليوم. يأتي القرار أولًا، ثم تقدّم `因为` سببه.
      وتسمح الماندرينية أيضًا بوضع السبب أولًا عندما يناسب الحوار أكثر.
    examples:
      - text: 我坐公交车，因为自行车坏了。
        meaning: "**المثال.** أركب الحافلة لأن دراجتي تعطلت. تعني `坐公交车` ركوب الحافلة. وتعني `因为` «لأن»،
          وتقول `自行车坏了` إن الدراجة صارت معطلة: تصف `坏` الحالة المعطوبة، وتدل `了` الأخيرة على تغير
          الوضع."
        note: "**جرّب:** ضع السبب أولًا. الإجابة: `因为自行车坏了，所以我坐公交车。` تقدّم `所以` النتيجة بعد السبب. قد تأتي
          أداتا الربط معًا بصورة طبيعية؛ ولا تحدد `了` وحدها هل حدث العطل اليوم أم قبل ذلك."
  - subskill_id: consequences
    explanation: يفرض إغلاق جسر تغيير الطريق. تصل `所以` هذه المشكلة بما فعلته المجموعة نتيجةً لها، فتوضح
      العلاقة أكثر من سرد حدثين فقط.
    examples:
      - text: 桥封了，所以我们换了一条路。
        meaning: "**المثال.** أُغلق الجسر، لذلك سلكنا طريقًا آخر. تعني `桥封了` أن الجسر صار مغلقًا. وتبلغ
          `我们换了一条路` عن تغيير الطريق: تعني `换` التغيير، وتحدد `了` التالية وقوعه، وتعد `一条路` طريقًا
          واحدًا باستعمال `条`."
        note: "**جرّب:** قل إنكم غيّرتم الطريق لأن الطريق الأول كان مغلقًا. الإجابة: `路封了，所以我们换了一条路。` استبدل
          `桥` بـ`路` في الجملة الأولى. تعني `然后` «ثم» وقد ترتب الأحداث من غير بيان العلاقة السببية
          التي تعطيها `所以`."
  - subskill_id: conditions
    explanation: قد تعتمد نزهة الغد على الطقس. تقدّم `如果` حدثًا لم يُحسم، وتصل `就` الشرطَ باستجابة
      المجموعة إذا وقع.
    examples:
      - text: 如果明天下雨，我们就改天去。
        meaning: "**المثال.** إذا أمطرت غدًا، فسنذهب يومًا آخر. تعني `明天下雨` هطول المطر غدًا. وتعني `我们就改天去`
          أننا سنذهب يومًا آخر حينئذ: `改天` في يوم آخر، و`去` الذهاب. تتغير الخطة فقط عند تحقق شرط
          المطر."
        note: "**جرّب:** استعمل البرد شرطًا. الإجابة: `如果明天很冷，我们就改天去。` استبدل `下雨` بـ`很冷`، أي الجو بارد.
          تقدّم `因为明天下雨` المطر سببًا؛ أما `如果` فتبقيه شرطًا من غير الجزم بحدوثه."
  - subskill_id: contrast
    explanation: قد يكون الطريق القصير صعب المشي بسبب منحدر شديد. تقدّم `虽然` النقطة الملائمة، وتبرز `但是`
      العيب الذي يحد من فائدتها.
    examples:
      - text: 虽然路很短，但是坡很陡。
        meaning: "**المثال.** مع أن الطريق قصير، فإن المنحدر شديد. تعني `路很短` أن الطريق قصير، و`坡很陡` أن
          المنحدر حاد. توصف كل صفة مباشرة بـ`很`؛ وتصل `虽然` و`但是` بينهما بوصفهما تنازلًا وتباينًا."
        note: "**جرّب:** قل إن الطريق طويل لكن المنحدر لطيف. الإجابة: `虽然路很长，但是坡很缓。` استبدل `短` بـ`长`، و`陡`
          بـ`缓`. يأتي اقتران `虽然` و`但是` بصورة مألوفة في الماندرينية؛ ولا يلزم اتباع قواعد الإنجليزية
          في جمع although وbut."
  - subskill_id: supporting_claims
    explanation: قد يوحي بقاء ضوء مضاء بأن شخصًا في الداخل. يبيّن ذكر الملاحظة بعد `因为` سبب اعتقادك،
      وتبقي `我觉得` الاستنتاج حكمًا منك لا معرفة يقينية.
    examples:
      - text: 我觉得里面还有人，因为灯还亮着。
        meaning: "**المثال.** أظن أن شخصًا ما لا يزال في الداخل لأن الضوء لا يزال مضاءً. `里面` تعني الداخل،
          وتقول `还有人` إن أحدًا ما لا يزال هناك: تعبّر `有` عن الوجود. وتعني `灯还亮着` أن الضوء لا يزال
          مضاءً، حيث تعني `还` «ما زال» وتبقي `着` حالة الإضاءة حاضرة."
        note: "**جرّب:** ادعم الاستنتاج نفسه بسماع أصوات مستمرة. الإجابة: `我觉得里面还有人，因为里面还有说话声。` تعني `说话声`
          صوت الكلام. تدعم الملاحظة الاعتقاد؛ ولا تسبب وجود الناس في الداخل. ولا تجعل أي من
          العلامتين الاستنتاج يقينيًا."
