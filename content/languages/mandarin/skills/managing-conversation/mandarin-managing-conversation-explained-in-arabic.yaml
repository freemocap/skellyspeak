sections:
  - subskill_id: opening_closing
    explanation: عند مغادرة زيارة، يمكنك إعلان انصرافك والتطلع إلى لقاء آخر. `我先走了` عبارة وداع طبيعية
      حتى وأنت لا تزال تودّع الشخص.
    examples:
      - text: 我先走了，下次见！
        meaning: "**المثال.** سأذهب الآن. إلى اللقاء في المرة القادمة! تعني `先` هنا أنني أنصرف قبل الآخرين،
          وتعني `走` المغادرة. تعرض `了` الأخيرة وضع الانصراف الجديد؛ ولا تثبت أنك غادرت بالفعل. وتعني
          `下次见` إلى اللقاء في المرة القادمة."
        note: "**جرّب:** قل «إلى اللقاء غدًا» بدلًا من ذلك. الإجابة: `我先走了，明天见！` استبدل `下次` بـ`明天`. تشير
          `我昨天走了` إلى مغادرة أمس لأن `昨天` تحدد الماضي؛ أما الوداع الأصلي فيتعلق بالمغادرة الآن."
  - subskill_id: acknowledging
    explanation: بعد شرح إجراء، يمكنك إظهار أن الشرح صار واضحًا لك. تسجّل `明白了` هذا الفهم الجديد من غير
      أن تلزمك بالموافقة على كل رأي في الشرح.
    examples:
      - text: 哦，我明白了。
        meaning: "**المثال.** آه، فهمت الآن. تشير `哦` إلى الإدراك، و`我` إلى المتكلم، و`明白` إلى الفهم. تدل
          `了` الأخيرة على الانتقال إلى حالة الفهم. يرتبط الرد مباشرة بالشرح الذي سمعته."
        note: "**جرّب:** قل إن المجموعة فهمت الآن. الإجابة: `哦，我们明白了。` غيّر `我` إلى `我们`؛ ويبقى التعبير
          نفسه. أما `我也这么想` فتشارك رأيًا سبق ذكره، لا تكتفي بالإقرار بأنه واضح."
  - subskill_id: clarification
    explanation: إذا فاتك ما قاله شخص للتو، فإن طلب التكرار يحدد له وسيلةً واضحة لإصلاح الفهم. تطلب
      `再说一遍` إعادة القول كاملًا مرة أخرى.
    examples:
      - text: 不好意思，请再说一遍。
        meaning: "**المثال.** عذرًا، من فضلك كرر ما قلت. تعتذر `不好意思` عن المقاطعة، وتقدّم `请` الطلب بأدب.
          تعني `再` مجددًا، و`说` القول، وتحسب `一遍` تكرارًا كاملًا واحدًا. يحدد الكلام السابق ما ينبغي
          تكراره."
        note: "**جرّب:** اطلب منه قراءته مرة أخرى بدل قوله. الإجابة: `不好意思，请再读一遍。` استبدل `说` بـ`读`، أي
          القراءة. وإذا سمعت الكلمات لكن لم تفهمها، تسأل `这是什么意思？` عن المعنى بدل طلب تكرارها."
  - subskill_id: rephrasing
    explanation: يمكن إعادة شرح أن الزيارات لا تُرتب عند الوصول في صورة متطلب عملي. تشير `换句话说` إلى
      صياغة أخرى للنقطة نفسها، يليها ما ينبغي أن تفعله المجموعة.
    examples:
      - text: 换句话说，我们得提前预约。
        meaning: "**المثال.** بعبارة أخرى، علينا الحجز مسبقًا. تعني `换句话说` قول الشيء بطريقة أخرى. وتعني
          `我们得` «علينا»، وتُقرأ `得` هنا `děi`. وتعني `提前` «مسبقًا» وتأتي قبل `预约`، أي تحديد موعد أو
          حجز."
        note: "**جرّب:** اجعل المتطلب خاصًا بك. الإجابة: `换句话说，我得提前预约。` استبدل `我们` بـ`我`. تسبق `得` الفعل
          هنا وتعبر عن الضرورة؛ أما `得` الخفيفة في `说得很清楚`، أي «يقول بوضوح»، فتأتي بعد الفعل ولها
          وظيفة أخرى."
  - subskill_id: correcting_misunderstanding
    explanation: فهم المستمع أن يومك المقترح هو الجمعة، لكنك قصدت السبت. تسمية اليوم المقصود واستبعاد
      الخاطئ يصلحان سوء الفهم مباشرة.
    examples:
      - text: 我说的是周六，不是周五。
        meaning: "**المثال.** قلت السبت، لا الجمعة. تعود `我说的` إلى ما قلته؛ وتحدده `是周六` بأنه السبت. وتستبعد
          `不是周五` الجمعة. تأتي عبارتا اليوم بعد `是` و`不是`، فيصبح التباين صريحًا."
        note: "**جرّب:** صحح سوء الفهم في الاتجاه المعاكس. الإجابة: `我说的是周五，不是周六。` بدّل اليومين. تقول
          `我没说周六` فقط إنك لم تقل السبت، ولا تذكر اليوم المقصود."
  - subskill_id: turns_topics
    explanation: أثناء نقاش، قد تريد الانتقال إلى خطط الأسبوع المقبل. يساعد إعلان الانتقال وتسمية
      الموضوع الجديد المستمع على المتابعة. تسأل `可以吗` هل يرضى بهذا التغيير.
    examples:
      - text: 我想换个话题，聊聊下周的安排，可以吗？
        meaning: "**المثال.** أود تغيير الموضوع والحديث قليلًا عن خطط الأسبوع المقبل. هل يناسبك ذلك؟ تعني
          `我想` «أود»، و`换个话题` تغيير الموضوع، و`聊聊` الدردشة قليلًا. `下周的安排` هي ترتيبات الأسبوع
          المقبل، وتصل `的` الوقتَ بالترتيبات."
        note: "**جرّب:** انتقل إلى خطط الغد. الإجابة: `我想换个话题，聊聊明天的安排，可以吗？` استبدل `下周` بـ`明天`. يجعل تكرار
          `聊` الحديث المقترح خفيفًا وحواريًا؛ ولا يعلن ذكر تاريخ جديد وحده انتقال الموضوع بوضوح."
