language: mandarin
skill_id: managing_conversation
guidance: Recognize contact opening or closing, acknowledgment, clarification, reformulation,
  correction and topic or floor management. 下次见 can take leave in an encounter, while quoting it
  as vocabulary does not. 我明白了 registers comprehension without necessarily endorsing an opinion.
  请再说一遍 requests repetition after unclear speech; 你说的是什么意思 asks about interpretation. 换句话说
  introduces a reformulation only when the following words clarify the same prior meaning.
  我说的是周六，不是周五 corrects a misunderstood day. 说到交通 can link a new contribution to a relevant
  topic, while 我想换个话题 explicitly proposes a topic change. A copied 换句话说 without any
  reformulation is absent. Short 好 or 对 responses require their preceding contribution to
  distinguish acknowledgment, factual agreement and action acceptance. Do not require subjects
  where referents are available or reward every question as conversational repair.
