sections:
  - subskill_id: requests
    explanation: 個箱阻住做嘢位置，可以講清楚要搬去邊。`请` 令直接請求客氣啲，`把` 將已知物件放動作同目的地前。
    examples:
      - text: 请把这个箱子搬到门口。
        meaning: "**例句。** 請將呢個箱搬去門口。`这个箱子` 係呢個箱，由 `把` 引出。`搬` 係搬大件嘢，`到` 引出去到嘅地方，`门口` 係門口。`搬到门口` 交代要點處理個箱。"
        note: 試下叫人搬嗰個箱去同一地方：`请把那个箱子搬到门口。` `这个` 換成 `那个`，完整動作同目的地保留。`请搬箱子` 只叫人搬箱，冇指定呢個箱同搬去邊。
  - subskill_id: offers_invitations
    explanation: 同行朋友要拎工具，你可以主動提出幫忙。`要不要` 問對方想唔想接受。幫手嗰個明確係 `我`，所以係提供自己行動，唔係叫對方做。
    examples:
      - text: 要不要我帮你拿工具？
        meaning: "**例句。** 要唔要我幫你拎工具？`要不要` 問要或唔要，`我帮你` 係我幫你，`拿工具` 係拎工具。角色清楚：我幫，對方受幫助，工具被拎。"
        note: 試下提出幫拎袋：`要不要我帮你拿包？` 將 `工具` 換成 `包`。`你能帮我拿工具吗？` 就倒轉角色，請對方幫自己。
  - subskill_id: suggestions
    explanation: 行咗一陣，大家可能需要短休息。`我们` 包括講者，句尾 `吧` 將休息提出成畀大家考慮嘅建議。
    examples:
      - text: 我们在这里休息一下吧。
        meaning: "**例句。** 我哋喺呢度休息一陣啦。`在这里` 係喺呢度，放喺 `休息` 前。`一下` 令休息短啲，`吧` 帶出商量語氣。呢句唔係報告大家已經休息緊。"
        note: 試下建議喺嗰度休息：`我们在那里休息一下吧。` 將 `这里` 換成 `那里`，地方保留喺動作前。`我们在这里休息` 可以陳述休息地點；呢度句尾 `吧` 清楚提出建議。
  - subskill_id: commitments
    explanation: 分配聽日工作時，自告奮勇帶工具，就定咗邊個負責。呢個計劃情境入面，`我来` 將任務接到自己身上，唔一定另指向聽者行過嚟。
    examples:
      - text: 明天我来带工具。
        meaning: "**例句。** 聽日由我帶工具。`明天` 係聽日，`我来` 係由我負責，`带工具` 係帶工具。先講時間，再講接任務嘅人同工作，唔使加將來詞尾。"
        note: 試下改承諾帶水：`明天我来带水。` `工具` 換成 `水`，分工對話保留 `我来`。`明天可能下雨` 只預測可能事件，冇人接下責任。
  - subskill_id: accepting_declining
    explanation: 今晚邀請可能去唔到。先簡單道歉，再交代出席問題，拒絕就清楚。`来不了` 話做唔到過嚟。
    examples:
      - text: 不好意思，我今晚来不了。
        meaning: "**例句。** 唔好意思，我今晚嚟唔到。`不好意思` 係道歉開頭，`我今晚` 係我今晚，`来不了` 係嚟唔到。呢個表達嘅 `了` 讀 `liǎo`，唔係句尾助詞
          `le`；成個結尾表示冇辦法完成動作。"
        note: 試下拒絕聽晚邀請：`不好意思，我明晚来不了。` 將 `今晚` 換成 `明晚`。`我今晚不来` 只話今晚唔嚟，冇同樣明講有阻礙或做唔到。
  - subskill_id: negotiating_plans
    explanation: 人哋提議星期五見，但你唔得。提出另一日就繼續商量。新日子後面嘅 `怎么样` 問對方覺得呢個選擇點。
    examples:
      - text: 周五不行，周六怎么样？
        meaning: "**例句。** 星期五唔得，星期六點呀？`周五` 係星期五，`不行` 排除嗰日。`周六` 係星期六，後面 `怎么样` 問呢個選擇點。已經傾緊見面，所以唔使再講個動作。"
        note: 試下改提議星期日：`周五不行，周日怎么样？` 只換另一個日子。`周六可以` 話星期六得；`周六怎么样` 就先邀請對方回應，未定案。
