sections:
  - subskill_id: requests
    explanation: عندما يسد صندوق مساحة العمل، يستطيع الطلب تحديد المكان الذي يجب نقله إليه. تجعل `请`
      الطلب المباشر مهذبًا، وتضع `把` الشيء المعروف قبل الفعل ووجهته.
    examples:
      - text: 请把这个箱子搬到门口。
        meaning: "**المثال.** من فضلك انقل هذا الصندوق إلى المدخل. `这个箱子` هو هذا الصندوق، وتقدّمه `把`. تعني
          `搬` نقل غرض كبير أو حمله، وتقدّم `到` وجهته، و`门口` هو المدخل. تخبر `搬到门口` بما ينبغي أن يحدث
          للصندوق."
        note: "**جرّب:** اطلب نقل صندوق آخر إلى الوجهة نفسها. الإجابة: `请把那个箱子搬到门口。` استبدل `这个` بـ`那个`،
          وأبقِ الفعل والوجهة كاملين. تطلب `请搬箱子` نقل صناديق بوجه عام من غير تحديد هذا الصندوق أو
          مكان وصوله."
  - subskill_id: offers_invitations
    explanation: لدى رفيق أدوات يحملها، ويمكنك عرض مساعدتك. تسأل `要不要` هل يريد المخاطَب المساعدة
      المقترحة. المساعد هو `我` صراحةً، لذا تعرض فعلك أنت بدل أن تطلب من المخاطَب الفعل.
    examples:
      - text: 要不要我帮你拿工具？
        meaning: "**المثال.** هل تريد أن أساعدك في حمل الأدوات؟ تعرض `要不要` الاختيار بين الرغبة وعدمها. `我帮你`
          تعني أنني أساعدك، و`拿工具` حمل الأدوات أو أخذها. تبقى الأدوار واضحة: أنا أساعد، وأنت تتلقى
          المساعدة، والأدوات تُحمل."
        note: "**جرّب:** اعرض المساعدة في حمل حقيبة. الإجابة: `要不要我帮你拿包？` استبدل `工具` بـ`包`. تعكس
          `你能帮我拿工具吗？` الأدوار وتطلب من الشخص الآخر مساعدتك."
  - subskill_id: suggestions
    explanation: بعد المشي فترة، قد تحتاج المجموعة إلى استراحة قصيرة. تشمل `我们` المتحدث في النشاط
      المقترح. وتعرض `吧` الأخيرة الراحة اقتراحًا للمجموعة.
    examples:
      - text: 我们在这里休息一下吧。
        meaning: "**المثال.** لنسترح هنا قليلًا. تعني `在这里` «هنا» وتسبق `休息`، أي الاستراحة. تجعل `一下`
          الاستراحة قصيرة، وتعطي `吧` الاقتراح نبرته الحوارية. لا تخبر الجملة أن المجموعة تستريح
          بالفعل."
        note: "**جرّب:** اقترح الاستراحة هناك. الإجابة: `我们在那里休息一下吧。` استبدل `这里` بـ`那里`، مع إبقاء المكان
          قبل الفعل. قد تذكر `我们在这里休息` مكان استراحة المجموعة؛ وتجعل `吧` الأخيرة الاقتراح صريحًا
          هنا."
  - subskill_id: commitments
    explanation: عند تقسيم مهام الغد، يحدد تطوعك لإحضار الأدوات من يتحمل المسؤولية. تسند `我来` المهمة
      إليك في سياق التخطيط. ولا تقتضي `来` هنا رحلة مستقلة نحو المخاطَب.
    examples:
      - text: 明天我来带工具。
        meaning: "**المثال.** سأحضر الأدوات غدًا. تعني `明天` غدًا، و`我来` أنني سأتولى ذلك، و`带工具` إحضار
          الأدوات. يذكر الوقت أولًا، ثم المتطوع والمهمة. ولا تُضاف نهاية مستقبلية إلى الفعل."
        note: "**جرّب:** تطوع بإحضار الماء بدلًا من ذلك. الإجابة: `明天我来带水。` استبدل `工具` بـ`水`، وأبقِ `我来` في
          حوار توزيع المهام. تتنبأ `明天可能下雨` بحدث محتمل ولا تُسند مسؤوليةً لأحد."
  - subskill_id: accepting_declining
    explanation: قد يتعذر قبول دعوة لهذه الليلة. يجعل الاعتذار الموجز ثم ذكر عائق الحضور الرفضَ واضحًا.
      تقول `来不了` إنك لا تستطيع المجيء.
    examples:
      - text: 不好意思，我今晚来不了。
        meaning: "**المثال.** آسف، لا أستطيع الحضور الليلة. `不好意思` افتتاح اعتذاري، و`我今晚` تشير إلى المتحدث
          وهذه الليلة، و`来不了` تعني عدم القدرة على المجيء. تُقرأ `了` في هذا التعبير `liǎo`، لا مثل
          أداة الجملة `le`؛ وتعبّر النهاية كلها عن تعذر تنفيذ الفعل."
        note: "**جرّب:** ارفض دعوة مساء الغد. الإجابة: `不好意思，我明晚来不了。` استبدل `今晚` بـ`明晚`. تقول `我今晚不来` إنك
          لن تأتي الليلة، لكنها لا تذكر العائق أو عدم القدرة الذي تعبّر عنه `来不了`."
  - subskill_id: negotiating_plans
    explanation: يقترح شخص اللقاء يوم الجمعة، لكن هذا اليوم لا يناسبك. يبقي ذكر بديل الخطة مفتوحة. تسأل
      `怎么样` بعد اليوم الجديد كيف يناسب هذا الخيار المخاطَب.
    examples:
      - text: 周五不行，周六怎么样？
        meaning: "**المثال.** الجمعة لا تناسبني. ماذا عن السبت؟ `周五` الجمعة، وتستبعدها `不行`. `周六` السبت،
          وتتبعها `怎么样` بمعنى «ما رأيك؟». يجوز ترك اللقاء غير مذكور لأنه موضوع النقاش بالفعل."
        note: "**جرّب:** اقترح الأحد بدلًا من ذلك. الإجابة: `周五不行，周日怎么样？` غيّر اليوم البديل فقط. تقول `周六可以`
          إن السبت مناسب؛ وتدعو `周六怎么样` الطرف الآخر للرد قبل حسمه."
