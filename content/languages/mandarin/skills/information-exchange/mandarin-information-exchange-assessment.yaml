language: mandarin
skill_id: information_exchange
guidance: Look for meaningful information questions, relevant answers, factual confirmation and
  useful detail. 商店几点关门？ asks a closing time with the interrogative in its ordinary clause
  position. 五点 answers that question contextually. 商店五点关门，对吗？ checks a proposed fact; an
  alternative question may use 还是 without adding 吗. 你能帮我搬箱子吗？ normally asks for help rather than
  merely testing the truth of a capability claim. An isolated copied 什么 without an identifiable
  question or repair need is absent. 靠窗的那张桌子 can specify which table the listener needs;
  verbosity alone does not establish useful detail. 你说的是什么意思？ addresses trouble interpreting an
  earlier contribution, not simply uncertainty about a schedule’s truth. Do not require English
  auxiliary inversion, a full subject in a contextual answer, or a universal yes/no word when a
  repeated predicate supplies a natural answer.
