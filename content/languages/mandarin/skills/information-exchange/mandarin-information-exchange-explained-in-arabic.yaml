sections:
  - subskill_id: asking_information
    explanation: قبل زيارة متجر، تساعدك معرفة ساعة إغلاقه على الوصول في الوقت المناسب. تسأل `几点` عن هذه
      الساعة في الموضع نفسه الذي تأتي فيه إجابة مثل `五点`. يبقى المتجر في أول الجملة.
    examples:
      - text: 商店几点关门？
        meaning: "**المثال.** في أي ساعة يغلق المتجر؟ `商店` هو المتجر، و`几点` تسأل عن الوقت، و`关门` إغلاق
          العمل. الترتيب هو المتجر، ثم الساعة المجهولة، ثم فعل الإغلاق؛ وتؤدي أداة السؤال وظيفتها من
          غير `吗` أخيرة."
        note: "**جرّب:** اسأل متى يفتح المتجر. الإجابة: `商店几点开门？` استبدل `关门` بـ`开门`، أي فتح العمل. أما
          `商店五点关门吗？` فتسأل هل الخامسة وقت الإغلاق، فتقترح ساعةً وتختم بـ`吗`."
  - subskill_id: answering_information
    explanation: بعد سؤال عن وقت الإغلاق يكون الحدث واضحًا بالفعل. تكفي عبارة ساعة جوابًا مباشرًا. تحدد
      `点` بعد العدد ساعةً على الساعة لا عدد أغراض.
    examples:
      - text: 五点。
        meaning: "**المثال.** في الخامسة. `五` خمسة، وتدل `点` على وقت الساعة. يذكر الجواب القصير الساعة
          الناقصة تحديدًا في `商店几点关门？`؛ ولا يحتاج إلى تكرار المتجر أو فعل الإغلاق."
        note: "**جرّب:** أجب بالسادسة. الإجابة: `六点。` غيّر العدد وأبقِ `点`. والجواب الأكمل هو `商店六点关门。` يصلح
          كلاهما بعد سؤال وقت الإغلاق؛ أما `六个` فيعد ستة أشياء ولا يدل على وقت."
  - subskill_id: checking_facts
    explanation: سمعت أن المتجر يغلق في الخامسة وتريد التحقق قبل المغادرة. تتبع `对吗` المعلومة المقترحة
      وتسأل هل هي صحيحة. تمنح المستمع واقعة محددة ليؤكدها أو يصححها.
    examples:
      - text: 商店五点关门，对吗？
        meaning: "**المثال.** يغلق المتجر في الخامسة، صحيح؟ تقدّم `商店五点关门` المتجر والساعة والإغلاق. تعني `对`
          «صحيح»، وتجعل `吗` العبارة سؤال تحقق قصيرًا. تفصل الفاصلة هذا التحقق عن الواقعة المقترحة."
        note: "**جرّب:** تحقق من إغلاق في السادسة. الإجابة: `商店六点关门，对吗？` غيّر الساعة المقترحة. وإذا لم تُعرف
          الساعة أصلًا، تسأل `商店几点关门？` سؤالًا مفتوحًا بدل تقديم جواب للتحقق منه."
  - subskill_id: useful_detail
    explanation: عندما يسأل شخص أي طاولة يستعمل، يميزها معلم قريب. تصف `靠窗的` الطاولة قبل تسميتها، وتشير
      `那张` إلى تلك الطاولة المحددة.
    examples:
      - text: 请用靠窗的那张桌子。
        meaning: "**المثال.** من فضلك استعمل الطاولة قرب النافذة. `请用` تعني «استعمل من فضلك»، و`靠窗` قرب
          النافذة، وتصل `的` هذا الوصف بـ`桌子`، أي الطاولة. تعني `那` «تلك»، و`张` أداة العد المستعملة
          للطاولات هنا. تأتي العبارة المحددة كلها بعد `用`."
        note: "**جرّب:** حدد الطاولة قرب الباب. الإجابة: `请用靠门的那张桌子。` استبدل `窗` بـ`门` داخل الوصف. تقول
          `请用桌子` فقط «استعمل طاولة» وتفقد العلامة اللازمة للاختيار بينها."
