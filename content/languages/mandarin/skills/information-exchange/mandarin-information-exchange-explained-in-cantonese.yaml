sections:
  - subskill_id: asking_information
    explanation: 几点 問鐘點，喺呢個例子放喺事件謂語前面。唔需要英文式嘅助動詞倒裝。
    examples:
      - text: 商店几点关门？
        meaning: 間舖幾點閂門？
        note: 几点 問未知嘅關門時間；关门 喺呢度係停止營業。
  - subskill_id: answering_information
    explanation: 簡短時間短語可以直接回答，唔使重複件事。問緊邊件事嘅時間，由上文問題交代。
    examples:
      - text: 五点。
        meaning: 五點。
        note: 回應間舖幾點關門。点 表示鐘點，唔係五件物件。
  - subskill_id: checking_facts
    explanation: 一句說法後面加 对吗，可以核實已有資訊係咪正確。
    examples:
      - text: 商店五点关门，对吗？
        meaning: 間舖五點閂門，係咪？
        note: 講者確認五點呢個時間，唔係完全開放咁問幾點。
  - subskill_id: useful_detail
    explanation: 描述放喺 的 前面，可以指明邊件物件；再加指示詞同量詞會更清楚。保留普通話例句嘅 的，唔好改成廣東話 嘅。
    examples:
      - text: 请用靠窗的那张桌子。
        meaning: 唔該用靠窗嗰張枱。
        note: 對方問用邊張枱時，靠窗的 交代識別位置，嗰張枱則由 那张 指出。
