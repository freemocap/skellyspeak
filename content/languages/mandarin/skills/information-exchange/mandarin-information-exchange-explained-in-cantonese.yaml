sections:
  - subskill_id: asking_information
    explanation: 去間舖之前，知道幾點閂門就容易趕得切。`几点` 問鐘點，位置同答案例如 `五点` 一樣。間舖仍然放句首。
    examples:
      - text: 商店几点关门？
        meaning: "**例句。** 間舖幾點閂門？`商店` 係店舖，`几点` 係幾點，`关门` 係停止營業。次序係店舖、未知鐘點、閂門動作。疑問詞已經提出問題，唔再加句尾 `吗`。"
        note: 試下問開門時間：`商店几点开门？` 將 `关门` 換成 `开门`。`商店五点关门吗？` 就提出五點呢個時間，再用 `吗` 問係咪正確。
  - subskill_id: answering_information
    explanation: 問過閂門時間之後，事件已經清楚，可以直接答鐘點。數字後面嘅 `点` 表示時鐘時間，唔係數物件。
    examples:
      - text: 五点。
        meaning: "**例句。** 五點。`五` 係五，`点` 標示鐘點。呢個簡答正好補上 `商店几点关门？` 問緊嘅時間，唔使再講店舖同閂門。"
        note: 試下答六點：`六点。` 換數字，保留 `点`。完整答法係 `商店六点关门。` 問閂門時間後，兩種都得；`六个` 就數六件嘢，唔係鐘點。
  - subskill_id: checking_facts
    explanation: 聽講間舖五點閂，出門前想確認。`对吗` 放喺已提出嘅資料後，問係咪啱，對方就可以確認或者糾正一個具體事實。
    examples:
      - text: 商店五点关门，对吗？
        meaning: "**例句。** 間舖五點閂門，係咪？`商店五点关门` 交代店舖、鐘點同閂門。`对` 係啱，`吗` 將呢個簡短確認變成問題，逗號將確認同前面資料分開。"
        note: 試下確認係咪六點閂：`商店六点关门，对吗？` 換提出嘅鐘點。如果完全唔知時間，`商店几点关门？` 就係開放問時間，冇先提供候選答案。
  - subskill_id: useful_detail
    explanation: 人哋問用邊張枱，附近地標可以分清楚。`靠窗的` 先描述靠窗，再講枱；`那张` 指向特定嗰張。
    examples:
      - text: 请用靠窗的那张桌子。
        meaning: "**例句。** 請用靠窗嗰張枱。`请用` 係請用，`靠窗` 係近窗，`的` 將描述接到 `桌子`。`那` 係嗰個，`张` 係呢度數枱嘅量詞。成個指出邊張枱嘅短語放喺 `用` 後。"
        note: 試下指出靠門嗰張：`请用靠门的那张桌子。` 喺描述入面將 `窗` 換成 `门`。`请用桌子` 只話用枱，冇咗幫人揀邊張嘅線索。
