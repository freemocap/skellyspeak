skill_id: possibilities_constraints
explanation_language: english
shared_explanation: skills/possibilities-constraints/possibilities-constraints-explained-in-english.yaml
sections:
  - subskill_id: ability
    explanation: When a bicycle breaks, the group needs to know who has the skill to repair it. `会`
      before an activity expresses learned ability here. `我会修自行车` answers that practical question;
      it does not promise a repair at a particular time.
    examples:
      - text: 我会修自行车。
        meaning: "**The example.** I know how to repair bicycles. `我` is I, `会` is know how to, `修` is
          repair, and `自行车` is bicycle. The activity follows `会`, with the thing repaired after `修`.
          The verb has no separate ending for I or we."
        note: "To report lack of this skill, `不会` goes before the activity. Try saying your group knows how
          to repair bicycles. Answer: `我们会修自行车。` Change `我` to `我们`; `会` and the activity stay
          unchanged. `我今天不能修自行车` instead says you cannot do the repair today, perhaps because you
          lack time or tools."
  - subskill_id: permission
    explanation: Before putting a bag in someone else’s space, asking the person responsible makes
      permission clear. `我可以` introduces the proposed action, and final `吗` turns the statement into
      a yes/no question. The bag is named before its placement.
    examples:
      - text: 我可以把包放在这里吗？
        meaning: "**The example.** May I put my bag here? `把包` brings the bag forward as the object being
          handled. `放在这里` says put it here: `放` is put and `在这里` gives its resulting location. `可以`
          precedes the whole action, while `吗` comes last."
        note: "Try asking to put the bag there instead. Answer: `我可以把包放在那里吗？` Replace `这里` with `那里`; keep
          the location after `放在`. A permission answer can simply be `可以`, yes, you may. `我把包放在这里`
          states the placement without asking permission."
  - subskill_id: obligation
    explanation: A library deadline can make returning books necessary today. `必须` states that
      requirement rather than a wish. The day comes before `必须`, and the action follows it.
    examples:
      - text: 我们今天必须还书。
        meaning: "**The example.** We must return the books today. `我们` is we, `今天` is today, and `还书` is
          return books. Here `还` is read `huán`, return, rather than `hái`, still. `必须` applies to
          the returning action."
        note: "Try removing the requirement. Answer: `我们今天不用还书。` `不用` means do not need to; it does not
          forbid returning them. `我们今天不能还书` instead says returning is not possible or not allowed,
          depending on the situation."
  - subskill_id: possibility
    explanation: When deciding whether to go out, uncertain weather matters. `可能` leaves rain as a
      possibility rather than a definite forecast. The afternoon gives the time, followed by
      uncertainty and then the event.
    examples:
      - text: 下午可能下雨。
        meaning: "**The example.** It may rain in the afternoon. `下午` means afternoon, `可能` means possibly,
          and `下雨` means rain. Mandarin does not need a separate weather subject corresponding to
          English it in this sentence."
        note: "Try placing the possible rain tomorrow instead. Answer: `明天可能下雨。` Replace the time with `明天`;
          keep `可能` before `下雨`. `下午下雨` presents rain as a statement, while `下午可能不下雨` leaves open
          the possibility that it will not rain."
  - subskill_id: certainty
    explanation: Before arranging tomorrow’s work, you may not know whether it is a day off. `不确定`
      states your uncertainty, and the following `是不是` presents the unresolved alternatives within
      that statement.
    examples:
      - text: 我不确定明天是不是休息日。
        meaning: "**The example.** I am not sure whether tomorrow is a day off. `我不确定` is I am not sure.
          `明天` is tomorrow, `是不是` is whether it is or is not, and `休息日` is a day off. The two
          alternatives are being considered, not asserted."
        note: "Try expressing the group’s uncertainty. Answer: `我们不确定明天是不是休息日。` Only `我` changes to `我们`.
          `明天不是休息日` says tomorrow is not a day off; it removes the uncertainty instead of expressing
          it."
