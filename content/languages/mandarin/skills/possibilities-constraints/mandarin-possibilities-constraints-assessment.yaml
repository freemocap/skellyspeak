language: mandarin
skill_id: possibilities_constraints
guidance: Recognize ability, permission, requirements, possible outcomes and confidence. 会 can
  express learned ability, 能 capacity or circumstances, and 可以 permission or practical
  acceptability; their meanings are not a one-to-one English can mapping. 我会修自行车 reports a
  skill. 我可以坐这里吗 asks permission, not someone else’s ability. 必须 marks necessity; 不用 removes
  need and 不能 can prohibit or express inability according to context. 可能下雨 presents possibility,
  while 不确定 limits confidence. An unqualified weather report alone does not establish
  possibility. A copied modal with no recoverable action or proposition is absent. 可以 from the
  responsible person after a permission request can grant it contextually. A cooperative 能
  request need not assert physical capability. When both capacity and opportunity readings
  establish correct group use, subtype ambiguity alone is not unclear. Do not treat every 会 as
  learned skill when the actual sentence predicts an outcome.
