sections:
  - subskill_id: ability
    explanation: 單車壞咗時，大家需要知道邊個識整。活動前嘅 `会` 呢度表示學識咗嘅能力。`我会修自行车` 回答識唔識整，冇承諾幾時整。
    examples:
      - text: 我会修自行车。
        meaning: "**例句。** 我識整單車。`我` 係講者，`会` 係識做，`修` 係修理，`自行车` 係單車。活動放喺 `会` 後，被修理嘅嘢放喺 `修` 後。換咗人稱，動詞唔使加另一套詞尾。"
        note: 冇呢種技能用 `不会`，放喺活動前。試下講成班人識整：`我们会修自行车。` 主語改成 `我们`，其餘保留。`我今天不能修自行车` 係今日做唔到，可能冇時間或工具，未必唔識。
  - subskill_id: permission
    explanation: 想喺人哋地方擺袋，向負責人問准就清楚。`我可以` 帶出想做嘅事，句尾 `吗` 將陳述變成問准唔准嘅問題。袋先講，之後先交代放去邊。
    examples:
      - text: 我可以把包放在这里吗？
        meaning: "**例句。** 我可唔可以將個袋放喺呢度？`把包` 將被處理嘅袋放喺動作前。`放在这里` 係放喺呢度：`放` 係放，`在这里` 交代放好後嘅位置。`可以` 放成個動作前，`吗`
          放最後。"
        note: 試下改問可唔可以放喺嗰度：`我可以把包放在那里吗？` 將 `这里` 換成 `那里`，位置仍然跟喺 `放在` 後。對方可以簡答 `可以`，即係准。`我把包放在这里` 就係陳述擺放，冇問准。
  - subskill_id: obligation
    explanation: 圖書館限期可以令還書變成今日一定要做嘅事。`必须` 表示要求，唔係願望。日期喺 `必须` 前，動作喺後。
    examples:
      - text: 我们今天必须还书。
        meaning: "**例句。** 我哋今日必須還書。`我们` 係我哋，`今天` 係今日，`还书` 係還書。呢度 `还` 讀 `huán`，係歸還，唔係讀 `hái` 嘅「仲」。`必须`
          指還書呢個動作有必要做。"
        note: 試下改成今日唔使還：`我们今天不用还书。` `不用` 取消必要性，唔係禁止還。`我们今天不能还书` 就可能係做唔到或者唔准，要睇情境。
  - subskill_id: possibility
    explanation: 決定出唔出門時，未肯定嘅天氣都重要。`可能` 將落雨講成可能發生，唔係肯定預報。先講下午，再講不確定，之後先講事件。
    examples:
      - text: 下午可能下雨。
        meaning: "**例句。** 下午可能落雨。`下午` 係下晝，`可能` 係有可能，`下雨` 係落雨。呢句唔使另加一個對應英文天氣主語嘅代詞。"
        note: 試下改成聽日可能落雨：`明天可能下雨。` 時間換成 `明天`，`可能` 留喺 `下雨` 前。`下午下雨` 直接陳述落雨；`下午可能不下雨` 就保留唔落雨嘅可能。
  - subskill_id: certainty
    explanation: 安排聽日工作之前，可能未知道係咪休息日。`不确定` 講自己未肯定，後面 `是不是` 喺呢個陳述入面提出未解決嘅兩種可能。
    examples:
      - text: 我不确定明天是不是休息日。
        meaning: "**例句。** 我唔肯定聽日係咪休息日。`我不确定` 係我唔肯定，`明天` 係聽日，`是不是` 係係或唔係，`休息日` 係休息日。兩個可能仍然考慮緊，未有肯定其中一個。"
        note: 試下話成班人未肯定：`我们不确定明天是不是休息日。` 只將 `我` 改成 `我们`。`明天不是休息日` 就肯定話聽日唔係休息日，唔再表達不確定。
