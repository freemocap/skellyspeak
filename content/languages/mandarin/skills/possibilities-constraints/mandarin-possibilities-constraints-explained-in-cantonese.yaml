sections:
  - subskill_id: ability
    explanation: 会 放喺活動前面，常用嚟講學返嚟嘅技能；其他情態詞可能講當下條件或許可，唔好全部當成廣東話「會」。
    examples:
      - text: 我会修自行车。
        meaning: 我識整單車。
        note: 討論實用技能時，会 表達識做，唔係預測某次維修將會發生。
  - subskill_id: permission
    explanation: 第一人稱問句用 可以，可以請求許可。對方身分同場合會令意思清楚。
    examples:
      - text: 我可以把包放在这里吗？
        meaning: 我可唔可以將個袋放喺呢度？
        note: 把包 引入要擺放嘅物件。適合問負責呢個地方嘅人。
  - subskill_id: obligation
    explanation: 必须 放喺謂語前面，表示必須做，比單純表達偏好強。
    examples:
      - text: 我们今天必须还书。
        meaning: 我哋今日一定要還書。
        note: 今天 交代期限；必须 表示還書係必要。
  - subskill_id: possibility
    explanation: 可能 放喺一個說法前面，表示有機會發生，唔係肯定會發生。
    examples:
      - text: 下午可能下雨。
        meaning: 下晝可能落雨。
        note: 可能 限定 下雨 嘅確定程度；下午 交代可能發生嘅時段。
  - subskill_id: certainty
    explanation: 不确定 表示冇把握。內嵌嘅 是不是 問句指出唔肯定嘅內容。
    examples:
      - text: 我不确定明天是不是休息日。
        meaning: 我唔肯定聽日係咪放假。
        note: 是不是 喺不確定陳述入面列出兩種可能，唔係斷言聽日唔放假。
