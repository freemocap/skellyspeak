sections:
  - subskill_id: ability
    explanation: عندما تتعطل دراجة، تحتاج المجموعة إلى معرفة من يملك مهارة إصلاحها. تعبّر `会` قبل النشاط
      هنا عن قدرة مكتسبة. تجيب `我会修自行车` عن هذا السؤال العملي، ولا تعد بإصلاحها في وقت محدد.
    examples:
      - text: 我会修自行车。
        meaning: "**المثال.** أعرف كيف أصلح الدراجات. `我` تعني أنا، و`会` معرفة الكيفية، و`修` الإصلاح، و`自行车`
          الدراجة. يأتي النشاط بعد `会`، ثم الشيء المُصلح بعد `修`. ليست للفعل نهاية منفصلة للمتكلم أو
          للجمع."
        note: "لذكر غياب هذه المهارة تأتي `不会` قبل النشاط. **جرّب:** قل إن مجموعتك تعرف إصلاح الدراجات.
          الإجابة: `我们会修自行车。` غيّر `我` إلى `我们`؛ وتبقى `会` والنشاط كما هما. أما `我今天不能修自行车` فتقول
          إنك لا تستطيع الإصلاح اليوم، ربما لقلة الوقت أو الأدوات."
  - subskill_id: permission
    explanation: قبل وضع حقيبة في مساحة شخص آخر، يجعل سؤالك للمسؤول الإذن واضحًا. تقدّم `我可以` الفعل
      المقترح، وتحول `吗` الأخيرة الجملة إلى سؤال نعم أو لا. تُسمّى الحقيبة قبل موضع وضعها.
    examples:
      - text: 我可以把包放在这里吗？
        meaning: "**المثال.** هل يجوز لي وضع حقيبتي هنا؟ تقدّم `把包` الحقيبةَ مفعولًا يجري التعامل معه. تعني
          `放在这里` وضعها هنا: `放` وضع، و`在这里` مكانها الناتج. تسبق `可以` الفعل كله، بينما تأتي `吗` في
          النهاية."
        note: "**جرّب:** اطلب وضع الحقيبة هناك بدلًا من هنا. الإجابة: `我可以把包放在那里吗？` استبدل `这里` بـ`那里`؛
          وأبقِ المكان بعد `放在`. قد يكون جواب الإذن `可以` فقط، أي نعم يجوز. أما `我把包放在这里` فتخبر عن
          وضعها من غير طلب الإذن."
  - subskill_id: obligation
    explanation: قد يجعل موعد المكتبة النهائي إعادة الكتب اليوم ضرورية. تذكر `必须` هذا الإلزام لا مجرد
      رغبة. يأتي اليوم قبل `必须`، ويليه الفعل المطلوب.
    examples:
      - text: 我们今天必须还书。
        meaning: "**المثال.** علينا إعادة الكتب اليوم. `我们` نحن، و`今天` اليوم، و`还书` إعادة الكتب. تُقرأ `还`
          هنا `huán` بمعنى الإعادة، لا `hái` بمعنى «ما زال». تنطبق `必须` على فعل الإعادة."
        note: "**جرّب:** أزل الإلزام. الإجابة: `我们今天不用还书。` تعني `不用` «لا حاجة إلى»؛ ولا تمنع الإعادة. أما
          `我们今天不能还书` فتقول إن الإعادة غير ممكنة أو غير مسموحة بحسب الموقف."
  - subskill_id: possibility
    explanation: عند تقرير الخروج، يهم الطقس غير المؤكد. تترك `可能` المطر احتمالًا بدل توقع جازم. يذكر
      «بعد الظهر» الوقت، ثم يأتي الشك فالحدث.
    examples:
      - text: 下午可能下雨。
        meaning: "**المثال.** قد تمطر بعد الظهر. تعني `下午` بعد الظهر، و`可能` «من الممكن»، و`下雨` هطول المطر.
          لا تحتاج الماندرينية هنا إلى فاعل منفصل للطقس يقابل «it» الإنجليزية."
        note: "**جرّب:** اجعل المطر المحتمل غدًا. الإجابة: `明天可能下雨。` غيّر الوقت إلى `明天`؛ وأبقِ `可能` قبل
          `下雨`. تعرض `下午下雨` المطر خبرًا، بينما تبقي `下午可能不下雨` احتمال عدم هطوله مفتوحًا."
  - subskill_id: certainty
    explanation: قبل ترتيب عمل الغد، قد لا تعرف هل هو يوم عطلة. تذكر `不确定` شكك، وتعرض `是不是` التالية
      البديلين غير المحسومين داخل القول.
    examples:
      - text: 我不确定明天是不是休息日。
        meaning: "**المثال.** لست متأكدًا هل الغد يوم عطلة. `我不确定` تعني لست متأكدًا. `明天` هو الغد، و`是不是`
          تسأل هل هو كذلك أم لا، و`休息日` يوم عطلة. يُنظر في البديلين ولا يُجزم بأي منهما."
        note: "**جرّب:** عبّر عن شك المجموعة. الإجابة: `我们不确定明天是不是休息日。` تتغير `我` وحدها إلى `我们`. تقول
          `明天不是休息日` إن الغد ليس يوم عطلة، فتزيل الشك بدل التعبير عنه."
