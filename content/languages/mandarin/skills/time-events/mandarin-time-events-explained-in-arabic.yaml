sections:
  - subskill_id: present_events
    explanation: يسألك شخص عمّا تفعله وأنت تعدّ إرشادات الطريق. تأتي `正在` قبل الفعل لتُظهر أنه جارٍ. في
      هذا الحديث يحدث الفعل الآن، لكن سياقًا زمنيًا آخر قد يضع فعلًا جاريًا في وقت مختلف.
    examples:
      - text: 我正在画地图。
        meaning: "**المثال.** أرسم خريطة الآن. `我` تعني أنا، و`正在` تدل على الاستمرار في الفعل، و`画` تعني
          يرسم، و`地图` تعني خريطة. تسبق علامة الاستمرار الفعل، ويأتي الشيء المرسوم بعده. لا تتغير `画`
          بحسب الشخص الذي يقوم بالرسم."
        note: "جرّب أن تقول إن مجموعتك ترسم الخريطة. الإجابة: `我们正在画地图。` استبدل `我` بـ`我们` واترك `正在画` كما
          هي. أما `我每周画地图` فتصف عادة أسبوعية، ولا تُظهر أن الرسم جارٍ الآن."
  - subskill_id: past_events
    explanation: بعد إصلاح الدراجة، يمكنك ذكر وقت حدوثه. تحدد `昨天` أن الحدث وقع أمس، وتأتي `了` بعد `修`
      لتعرض الإصلاح حدثًا وقع. لا يحمل الفعل نفسه لاحقة للماضي.
    examples:
      - text: 昨天我修了自行车。
        meaning: "**المثال.** أصلحت الدراجة أمس. `昨天` تعني أمس، و`我` تعني أنا، و`修自行车` تعني إصلاح الدراجة.
          في `修了自行车` تأتي علامة وقوع الحدث بعد الفعل وقبل مفعوله. تخبر الجملة بحدوث الإصلاح دون أن
          تصرّح باكتمال كل خطوة منه."
        note: "جرّب أن تخبر بأنك لم تصلحها أمس. الإجابة: `昨天我没修自行车。` ضع `没` قبل `修` واحذف `了` الدالة على
          وقوع الحدث. أما `修好了自行车` فتصرّح بأن إصلاح الدراجة نجح؛ والجملة الأصلية لا تتضمن كلمة
          النتيجة تلك."
  - subskill_id: future_events
    explanation: يمكن تحديد موعد مشوار مخطّط له بذكر الغد. تحدد `明天` موعد الذهاب، ثم يبيّن الفعل التالي
      ما ستأخذه.
    examples:
      - text: 明天我去取零件。
        meaning: "**المثال.** سأذهب غدًا لأخذ قطع الغيار. `明天` تعني غدًا، و`我` أنا، و`去` الذهاب، و`取` أخذ
          الشيء، و`零件` قطع الغيار. تجمع `去取` بين الذهاب والغرض منه، وهو أخذ القطع. لا يحمل أيّ من
          الفعلين لاحقة للمستقبل."
        note: "جرّب نقل المشوار إلى بعد غد. الإجابة: `后天我去取零件。` استبدل `明天` بـ`后天`. وقد تعبّر `我会修自行车` عن
          مهارة متعلَّمة في إصلاح الدراجة؛ فلا حاجة إلى إضافة `会` لتحديد وقت المشوار الأصلي في
          المستقبل."
  - subskill_id: duration_frequency
    explanation: عند الحديث عن روتين رياضي منتظم، يبيّن التكرار عدد مرات حدوث النشاط. تحدد `每周` الفترة
      الأسبوعية، وتأتي `两次` بعد النشاط لتعدّ مرات حدوثه خلالها.
    examples:
      - text: 我每周游泳两次。
        meaning: "**المثال.** أسبح مرتين في الأسبوع. `我` تعني أنا، و`每` كل، و`周` أسبوع، و`游泳` السباحة. تعني
          `两次` مرتين، وتعدّ `次` مرات حدوث الفعل. تأتي الفترة الزمنية قبل السباحة، ويأتي عدد المرات
          بعدها."
        note: "جرّب أن تقول إنك تسبح ثلاث مرات في الأسبوع. الإجابة: `我每周游泳三次。` استبدل `两次` بـ`三次`. أما
          `我每次游泳半小时` فتقول إن كل سباحة تستغرق نصف ساعة؛ تحدد `每次` كل مرة، وتحدد `半小时` مدتها."
  - subskill_id: event_sequence
    explanation: يحتاج إجراء تحضير الطعام إلى ترتيب خطواته. تقدم `先` الفعل الأول، وتقدم `再` الفعل الذي
      يليه. يمكن ترك الشخص الذي سينفذ الخطوات دون ذكر.
    examples:
      - text: 先洗手，再准备食材。
        meaning: "**المثال.** اغسل يديك أولًا، ثم حضّر المكونات. تعني `洗手` غسل اليدين، وتعني `准备食材` تحضير
          المكونات. تأتي كل كلمة ترتيب قبل الفعل الذي تنظمه. تشير `食材` إلى مكونات الطبخ."
        note: "جرّب أن تجعل تحضير الأدوات الخطوة الثانية. الإجابة: `先洗手，再准备工具。` استبدل `食材` بـ`工具`، أي
          الأدوات. تشير `再` هنا إلى الفعل التالي في الإجراء؛ أما `所以` فتقدم نتيجة ولا تعبّر عن
          الترتيب البسيط نفسه."
  - subskill_id: event_phase
    explanation: يريد شخص أن يعرف هل بقي عليك شيء من قراءة التعليمات. تفيد `看完` صراحةً أن القراءة بلغت
      نهايتها، وتضع `已经` هذا الإنجاز قبل اللحظة الحالية.
    examples:
      - text: 我已经看完说明书了。
        meaning: "**المثال.** أنهيت قراءة دليل التعليمات بالفعل. تعني `我已经` «أنا بالفعل»، وتعني `看` القراءة
          هنا، وتفيد `完` بعدها الإنهاء. `说明书` هو دليل التعليمات. تعرض `了` الأخيرة اكتمال القراءة
          بوصفه الحال الآن."
        note: "جرّب أن تقول إنك لم تنتهِ بعد. الإجابة: `我还没看完说明书。` استبدل `已经` بـ`还没` واحذف `了` الأخيرة.
          أبقِ `完` لأن السؤال ما زال عمّا إذا بلغت القراءة نهايتها. تخبر `我看了说明书` بحدوث القراءة،
          لكنها لا تصرّح بأنك أنهيت الدليل كله."
