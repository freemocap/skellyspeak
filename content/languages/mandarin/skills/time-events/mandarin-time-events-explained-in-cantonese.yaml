shared_explanation: skills/time-events/time-events-explained-in-cantonese.yaml
sections:
  - subskill_id: present_events
    explanation: 正在 放喺動作動詞前面，明確表示活動進行中。動詞唔會因為人稱或時態而變位；亦唔好將 正在 放到廣東話 緊 慣用嘅動詞後位置。
    examples:
      - text: 我正在画地图。
        meaning: 我畫緊地圖。
        note: 正在 明確標示進行中，呢個例子由語境定位為而家。
  - subskill_id: past_events
    explanation: 時間詞可以將活動放喺過去。動詞後嘅 了 可以將活動呈現為一個有界限事件，但 了 唔等於過去式，亦唔係所有廣東話 咗 都可以機械式換成 了。
    examples:
      - text: 昨天我修了自行车。
        meaning: 噚日我整咗架單車。
        note: 昨天 交代過去時間；修了 報告維修事件。
  - subskill_id: future_events
    explanation: 將來時間詞可以將計劃中活動定位喺之後，唔需要專門嘅將來時詞尾。
    examples:
      - text: 明天我去取零件。
        meaning: 聽日我去攞零件。
        note: 明天 交代將來時間；去取 將前往同取件目的連起嚟。
  - subskill_id: duration_frequency
    explanation: 每 加時段，再加次數，可以表達頻率。次 計活動發生次數，唔係物件數目。
    examples:
      - text: 我每周游泳两次。
        meaning: 我每個禮拜游兩次水。
        note: 每周 交代時段；两次 交代當中游水嘅次數。
  - subskill_id: event_sequence
    explanation: 先 同 再 交代第一步同後續步驟。佢哋表達次序，本身唔保證有因果關係。
    examples:
      - text: 先洗手，再准备食材。
        meaning: 先洗手，再準備食材。
        note: 先 同 再 排列兩項動作；省略咗嘅行動者係跟住步驟做嘅人。
  - subskill_id: event_phase
    explanation: 完 放喺動作動詞後面，可以表示活動達到終點；已经 明確指出已達到嗰個狀態。
    examples:
      - text: 我已经看完说明书了。
        meaning: 我已經睇完說明書喇。
        note: 看完 明確表示閱讀完成，比單純話發生過閱讀活動更具體。
