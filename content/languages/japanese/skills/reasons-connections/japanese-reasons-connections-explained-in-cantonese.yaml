sections:
  - subskill_id: causes_reasons
    explanation: ので將原因連到行動或決定；呢個例子喺ので前面用普通體動詞。
    examples:
      - text: 雨が降っているので、歩くのはやめます。
        meaning: 因為落雨，我唔行路喇。
        note: 落雨解釋決定；歩くの將行路名詞化，成為放棄嘅活動。
  - subskill_id: consequences
    explanation: そのため引出前述情況嘅結果，兩個分句要有合理關聯。
    examples:
      - text: 橋が通れません。そのため、別の道を使います。
        meaning: 條橋用唔到，所以我會行第二條路。
        note: 條橋唔通促使改路；その指返呢個情況。
  - subskill_id: conditions
    explanation: たら形可以設定可能條件；雖然形式包含た，唔一定講已發生嘅事。
    examples:
      - text: 雨が降ったら、中で作業します。
        meaning: 如果落雨，我就喺入面做嘢。
        note: 降ったら提出條件；室內工作係條件成立時嘅應對。
  - subskill_id: contrast
    explanation: 口語けど可以對比兩個性質或考慮因素，兩邊要有足夠內容顯示對比。
    examples:
      - text: この道は短いですけど、坂が急です。
        meaning: 呢條路短，但個斜坡好斜。
        note: 斜坡係短路程以外嘅缺點；呢度係明確對比，唔係淨係用句尾緩和語氣。
  - subskill_id: supporting_claims
    explanation: 用ので同と思います，可以將觀察作為結論理據；觀察係支持信念嘅證據，未必係事件成因。
    examples:
      - text: 中から声が聞こえるので、誰かいると思います。
        meaning: 我諗入面有人，因為聽到入面有人聲。
        note: 聽到人聲支持有人喺度嘅結論，但結論仍然係推論。
