language: japanese
skill_id: possibilities_constraints
guidance: Identify ability, permission, necessity, possibility and confidence or uncertainty.
  直すことができます expresses ability; potential forms provide another route. 座ってもいいですか requests
  permission rather than asserting capacity. 返さなければなりません expresses necessity, while 返さなくてもいい
  removes a requirement and 返してはいけない prohibits an action. 雨が降るかもしれません presents a possibility;
  certainty can be qualified with 確か or 自信がない. A plain report of rain alone is not evidence of
  possibility. 座るてもいい, intended as the ordinary permission construction and standing alone,
  fails to form the required て-form. どうぞ from an appropriate listener after a permission request
  may grant permission contextually. Potential wording in a request is not automatically
  evidence of physical ability. Ambiguity between correct capacity and opportunity readings does
  not make the entire group unclear. Accept appropriate conversational contractions instead of
  requiring the most formal negative obligation form.
