sections:
  - subskill_id: ability
    explanation: 辭書形動詞加ことができます，表示有能力做某件事；亦可以用動詞可能形。
    examples:
      - text: 簡単な家具を直すことができます。
        meaning: 我識整簡單傢俬。
        note: 直す交代講者識做嘅活動；句子關乎實際能力。
  - subskill_id: permission
    explanation: 動詞て形加もいいですか，問某個行動獲唔獲准；語境交代向邊個請求許可。
    examples:
      - text: ここに荷物を置いてもいいですか。
        meaning: 我可唔可以放啲行李喺度？
        note: 置いて係置く嘅て形；向管理地方嘅人詢問。
  - subskill_id: obligation
    explanation: 將否定動詞尾嘅ない換成なければなりません，表示必要。雖然組件有否定，整體意思係必須做。
    examples:
      - text: 今日、鍵を返さなければなりません。
        meaning: 我今日一定要還鎖匙。
        note: 返さない提供返さなければ嘅基礎；呢句要求還鎖匙，唔係禁止歸還。
  - subskill_id: possibility
    explanation: 普通體命題後加かもしれません，表示可能，結果仍然未肯定。
    examples:
      - text: 午後は風が強くなるかもしれません。
        meaning: 下晝可能會大風啲。
        note: 強くなる描述變強；かもしれません將呢個變化表達成可能。
  - subskill_id: certainty
    explanation: 自信がありません明確表示冇把握；前面可以用疑問分句指出唔肯定乜嘢。
    examples:
      - text: この答えで合っているか、自信がありません。
        meaning: 我唔肯定呢個答案啱唔啱。
        note: か將正確與否嵌入句內；講者表示唔肯定，唔係斷言答案錯。
