shared_explanation: skills/information-exchange/information-exchange-explained-in-cantonese.yaml
sections:
  - subskill_id: asking_information
    explanation: "你去圖書館前要知關門時間。`図書館は何時に閉まりますか` 問未知嘅鐘點：`図書館は` 將圖書館設為話題，`何時に` 問幾點，`閉まります` 係關門，句尾 `か` 組成禮貌問句。`閉まる` 講圖書館關門；`閉める` 係有人閂佢。`図書館は五時に閉まりますか` 先提出五點，再問係咪。"
    examples:
      - text: 図書館は何時に閉まりますか。
        meaning: 圖書館幾點閂門？
        note: "改問圖書館幾點開：`図書館は何時に開きますか。`。`何時に` 仍然問未知時間，`開きます` 改問開門。"
  - subskill_id: answering_information
    explanation: "有人問圖書館幾點關。`五時です` 唔重複整個事件，已經畀到時間：`五時` 係五點，`です` 令短答有禮貌。前一句問題講明係乜嘢喺五點發生。`五時間です` 係五個鐘頭嘅時長，唔係鐘點。換數字、保留 `時です` 就可答另一個關門時間。"
    examples:
      - text: 五時です。
        meaning: 五點。
        note: "答六點關門：`六時です。`。喺關門時間問題之後呢句完整；`六時` 補出未知鐘點，圖書館關門由上文提供。"
  - subskill_id: checking_facts
    explanation: "聽完時間表，你估圖書館五點關，想核實理解。`図書館は五時に閉まるんですね` 先提出說法，再請對方確認：`五時に` 係五點，`閉まる` 係放喺 `んです` 前嘅普通形，句尾 `ね` 邀請對方認同。佢亦可以表示啱啱明白咗新資訊，所以要睇上文。`図書館は何時に閉まりますか` 就係問未知時間。若估六點，就用 `六時に`。"
    examples:
      - text: 図書館は五時に閉まるんですね。
        meaning: 即係圖書館五點閂門，係咪？
        note: "核實啱啱聽到六點關門：`図書館は六時に閉まるんですね。`。`六時に` 係待確認時間，`んですね` 表示核實自己理解。"
  - subskill_id: useful_detail
    explanation: "訪客見到多個入口，問應該行邊個。`入口は、公園に近いほうです` 收窄選擇：`入口は` 將入口設為話題，`公園に近い` 係近公園，`ほう` 係幾個選項入面嗰一邊。公園係有用地標，因為可以同另一個入口分開。`入口は公園に近いです` 只講入口近公園；`ほう` 更明確揀出其中一個。詳情要解決訪客實際選擇先有用。"
    examples:
      - text: 入口は、公園に近いほうです。
        meaning: 入口係近公園嗰邊。
        note: "改指近車站嘅入口：`入口は、駅に近いほうです。`。有多個選項時，`駅に近いほう` 選出近車站嗰個。"
