sections:
  - subskill_id: asking_information
    explanation: 何時問鐘點，に接喺時間表達後面；句尾か標示禮貌問句。
    examples:
      - text: 図書館は何時に閉まりますか。
        meaning: 圖書館幾點閂門？
        note: 問句想知關門時間。閉まります描述圖書館關門，唔係某個人關上一件物件。
  - subskill_id: answering_information
    explanation: 時間加です可以直接回答；大家已經知道講緊乜事件。
    examples:
      - text: 五時です。
        meaning: 五點。
        note: 回應圖書館關門時間；五係鐘點，唔係書本數量。
  - subskill_id: checking_facts
    explanation: 提出一個時間再問，可以核實事實；ですね亦可以確認啱啱得知或推斷嘅資料。
    examples:
      - text: 図書館は五時に閉まるんですね。
        meaning: 即係圖書館五點閂門，係咪？
        note: 聽完時間表解釋後用；んですね核實講者對具體時間嘅理解。
  - subskill_id: useful_detail
    explanation: 名詞短語加ほう，可以喺兩邊或兩個選項之間分辨。前面嘅描述交代邊一個。
    examples:
      - text: 入口は、公園に近いほうです。
        meaning: 入口係近公園嗰邊。
        note: 講完建築物位置後，再區分可用入口同另一個入口。
