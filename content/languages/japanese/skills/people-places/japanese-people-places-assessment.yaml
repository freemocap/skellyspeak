skill_id: people_places
guidance: Recognize identification, attributes, location or movement, possession or
  relationships, and quantity or comparison. こちらは同僚の田中さんです identifies a colleague; この道は狭いです
  describes a property. に with あります locates a nonliving object, while で often locates an
  activity; destination に or へ is different again. の can relate an owner and object without an
  English possessive ending. 三冊 counts books, whereas 三番 can identify a numbered item without
  giving a quantity. より or のほうが can make a comparison. An isolated copied particle の without a
  relation is absent. 棚の上 can answer an identifiable where-question contextually. Omitted
  subjects are normal when recoverable, and は and が are not interchangeable English subject
  labels. この道は狭いだです, offered as an ordinary adjective predicate with no separate successful use,
  is malformed. Do not reject a valid plain-style description solely because a guide illustrates
  polite です.
