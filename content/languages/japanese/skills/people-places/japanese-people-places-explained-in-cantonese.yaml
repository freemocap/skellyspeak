skill_id: people_places
explanation_language: cantonese
shared_explanation: skills/people-places/people-places-explained-in-cantonese.yaml
sections:
  - subskill_id: identification
    explanation: こちら可以有禮貌噉介紹人；の連接同事關係同姓名，さん放喺人名後面表示尊重。
    examples:
      - text: こちらは同僚の田中さんです。
        meaning: 呢位係我同事田中。
        note: 語境交代係邊個嘅同事，唔需要明講私の。
  - subskill_id: qualities_states
    explanation: い形容詞可以描述性質。禮貌語體喺形容詞後加です，唔使再加だ。
    examples:
      - text: この道は狭いです。
        meaning: 呢條路好窄。
        note: 狭い係形容詞；は將この道標示為描述緊嘅話題。
  - subskill_id: location_movement
    explanation: に配合あります，可以交代非生物物件位置；上等關係名詞交代相對位置。
    examples:
      - text: 鍵は棚の上にあります。
        meaning: 鎖匙喺個架上面。
        note: 棚の上係架嘅上面；に將嗰度標示為鎖匙位置。
  - subskill_id: possession_relations
    explanation: 人稱後面加の可以表達所有關係；物件已知時，の後面唔使重複名詞。
    examples:
      - text: この傘は姉のです。
        meaning: 呢把遮係我家姐嘅。
        note: 呢度姉指講者家姐；の表示擁有，省略咗已知嘅傘。
  - subskill_id: quantity_comparison
    explanation: 比較基準可放喺より前面，要突出嘅另一邊放喺のほうが前面，句尾形容詞交代比較性質。
    examples:
      - text: あの箱より、この箱のほうが軽いです。
        meaning: 呢個箱比嗰個箱輕。
        note: 軽い比較重量；句子本身唔表示鍾意揀邊個箱。
