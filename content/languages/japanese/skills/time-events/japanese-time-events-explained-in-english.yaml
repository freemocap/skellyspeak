language: japanese
skill_id: time_events
explanation_language: english
shared_explanation: skills/time-events/time-events-explained-in-english.yaml
sections:
  - subskill_id: present_events
    explanation: "Someone asks what you are doing at this moment. `今、地図を描いています` presents the map drawing as in progress: `今` means now, `地図を` names the object, and `描いています` joins the `て` form of `描く` to `います`. The speaker can be omitted because the question identifies them. `地図を描きます` can describe a habit or a later plan, depending on context. The `ている` pattern can also describe a resulting state with other verbs, so the verb and setting matter."
    examples:
      - text: 今、地図を描いています。
        meaning: I am drawing a map now.
        note: "Say you are drawing a picture now. `今、絵を描いています。` is a full current-activity report; `絵を` changes the object and `描いています` keeps the action in progress."
  - subskill_id: past_events
    explanation: "A friend asks what you made yesterday. `昨日、木の箱を作りました` reports a completed earlier action: `昨日` anchors it to yesterday, `木の箱を` is the wooden box made, and `作りました` is the polite past of `作る`. `木の` describes the material; it does not say the box belongs to a tree. `作ります` is non-past and needs another context for future or habitual meaning. A past form inside a condition, such as `作ったら`, need not report an actual past event."
    examples:
      - text: 昨日、木の箱を作りました。
        meaning: Yesterday I made a wooden box.
        note: "Report making a wooden shelf yesterday. `昨日、木の棚を作りました。` is a full past report; `木の棚を` changes the item and `作りました` keeps the completed earlier action."
  - subskill_id: future_events
    explanation: "You are arranging tomorrow’s library trip. `明日、図書館で本を返します` places the return in the future with `明日`; `図書館で` marks where the action takes place, `本を` names the books, and non-past `返します` states the planned return. Japanese does not need a separate future-tense ending here. `図書館に行きます` would use `に` for the destination of going, while `で` in the principal sentence marks the site of returning. In a task-sharing exchange, the same statement might also undertake responsibility."
    examples:
      - text: 明日、図書館で本を返します。
        meaning: Tomorrow I will return the books at the library.
        note: "You borrowed a study-room key from the library. Plan to return it there tomorrow. `明日、図書館で鍵を返します。` is a full later plan; `鍵を` changes the object and `明日` fixes the future time."
  - subskill_id: duration_frequency
    explanation: "You are describing your weekly swimming routine. `毎週、二時間泳ぎます` gives both frequency and duration: `毎週` means every week, `二時間` means two hours, and `泳ぎます` is the non-past verb for swim. The time quantity measures how long each swim lasts; `二時` would mean two o’clock on the clock. `毎日、二時間泳ぎます` changes the recurrence to daily while keeping the duration. The sentence reports a routine, not one swim happening right now."
    examples:
      - text: 毎週、二時間泳ぎます。
        meaning: I swim for two hours every week.
        note: "Say you swim for one hour every week. `毎週、一時間泳ぎます。` is a full routine statement; `毎週` retains the frequency and `一時間` changes each session’s length."
  - subskill_id: event_sequence
    explanation: "You are explaining how to begin cooking safely. `手を洗ってから、料理を始めます` places washing before cooking: `手を洗って` is wash the hands in `て` form, `から` means after that action, and `料理を始めます` is begin cooking. This `てから` sequence orders actions; it is different from `雨だから` giving a reason. `料理を始めてから、手を洗います` would reverse the order and change the procedure. The original order makes the hand-washing step come first."
    examples:
      - text: 手を洗ってから、料理を始めます。
        meaning: I wash my hands before starting to cook.
        note: "Place washing vegetables before cooking. `野菜を洗ってから、料理を始めます。` is a full sequence; `洗ってから` puts washing first, and `始めます` begins cooking afterward."
  - subskill_id: event_phase
    explanation: "Someone asks whether you are finished with a book. `その本を読み終わりました` says the reading reached its endpoint: `その本を` identifies that book, `読み` is the combining stem of `読む`, `終わる` adds completion, and `ました` makes the report polite past. `その本を読んでいます` would instead present reading as in progress. A plain `読みました` reports reading in the past but does not make the finishing phase as explicit as `読み終わりました`."
    examples:
      - text: その本を読み終わりました。
        meaning: I finished reading that book.
        note: "Say you finished writing that letter. `その手紙を書き終わりました。` is a full completion report; `書き` joins to `終わりました` to mark the endpoint of writing."
