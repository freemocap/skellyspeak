sections:
  - subskill_id: requests
    explanation: 動詞て形加ください，請對方做一件事。加埋賓語同目的地，要求會更清楚。
    examples:
      - text: この箱を入口まで運んでください。
        meaning: 唔該搬呢個箱去入口。
        note: 運んで係運ぶ嘅て形；まで交代要搬到邊度。
  - subskill_id: offers_invitations
    explanation: ましょうか可以主動提出幫忙，問句將接唔接受嘅決定交畀對方。
    examples:
      - text: 荷物を持ちましょうか。
        meaning: 要唔要我幫你拎行李？
        note: 對方拎住袋時用。持ちましょうか係提出幫忙，唔係宣布已經講好嘅承諾。
  - subskill_id: suggestions
    explanation: ましょう可以提議講者同聽者一齊行動，參與者唔一定要明講。
    examples:
      - text: ここで少し休みましょう。
        meaning: 不如我哋喺度抖一陣。
        note: 休みましょう提議休息；で標示活動地點。
  - subskill_id: commitments
    explanation: 非過去式可以表示承擔獲分配嘅工作。明講私が，可以指出由自己負責。
    examples:
      - text: 私が道具を持ってきます。
        meaning: 我會帶工具。
        note: 活動分工時用；が指出負責人。如果只係中性報告將來事件，對話作用就唔同。
  - subskill_id: accepting_declining
    explanation: 禮貌道歉加否定能力句，可以拒絕邀請。邀請本身交代咗建議嘅行程。
    examples:
      - text: すみません、今日は行けません。
        meaning: 唔好意思，我今日嚟唔到。
        note: 回應今日嘅邀請。行けません係行く嘅否定可能形，唔係話個目的地不存在。
  - subskill_id: negotiating_plans
    explanation: 將唔合適嘅日子同可行日子作對比；なら將替代方案框定為可以接受安排嘅條件。
    examples:
      - text: 金曜日は難しいですが、土曜日なら大丈夫です。
        meaning: 星期五唔係咁方便，但星期六就得。
        note: 回應星期五見面嘅提議。難しい委婉表示有困難；土曜日なら提供可行選擇。
