sections:
  - subskill_id: requests
    explanation: "你需要同事將箱搬到入口。`この箱を入口まで運んでください` 係請對方做事：`この箱` 係呢個箱，`を` 標搬運對象，`入口まで` 係搬到入口為止，`運んでください` 係 `運ぶ` 嘅請求式。動詞嘅 `て` 形連到 `ください`；`まで` 講終點，唔係邊個搬。某啲場合 `運んでもらえませんか` 更婉轉，`運びます` 則係陳述會搬。"
    examples:
      - text: この箱を入口まで運んでください。
        meaning: 唔該搬呢個箱去入口。
        note: "改請同事將呢個袋搬到入口：`このかばんを入口まで運んでください。`。`このかばんを` 改咗物件，`入口まで` 保留同一終點。"
  - subskill_id: offers_invitations
    explanation: "對方拎住太多嘢。`荷物を持ちましょうか` 係主動幫忙：`荷物を` 係要拎嘅行李，`持ち` 係 `持つ` 嘅詞幹，`ましょうか` 問對方想唔想由你做。情境已經清楚係你提供幫手，所以可以省略主語。`荷物を持ってください` 反而係請對方拎。問句畀對方接受或婉拒嘅空間。"
    examples:
      - text: 荷物を持ちましょうか。
        meaning: 要唔要我幫你拎行李？
        note: "改為主動拎箱：`箱を持ちましょうか。`。講者仍然提出自己幫手，`箱を` 取代行李做對象。"
  - subskill_id: suggestions
    explanation: "大家做咗一陣嘢，需要休息。`ここで少し休みましょう` 提議一齊行動：`ここで` 係喺呢度休息，`少し` 係一陣，`休みましょう` 係「我哋休息啦」。大家知道參與者係邊個，就唔使講出主語。`休みます` 可以只係報告安排或個人動作；`ましょう` 先將其他人帶入建議。`休みましょうか` 則可以問係咪休息。"
    examples:
      - text: ここで少し休みましょう。
        meaning: 不如我哋喺度抖一陣。
        note: "提議去外面休息一陣：`外で少し休みましょう。`。`外で` 改地點，`休みましょう` 保留共同提議。"
  - subskill_id: commitments
    explanation: "隊伍分配用品，有人問邊個帶工具。`私が道具を持ってきます` 接受工作：`私が` 特別指出由講者負責，`道具を` 係工具，`持ってきます` 係帶嚟共同目的地。日語非過去 `ます` 可以講之後嘅安排；分工語境令呢句成為承諾，唔只係預測。大家已知邊個時可以省略 `私が`，但明講就回應「邊個」。"
    examples:
      - text: 私が道具を持ってきます。
        meaning: 我會帶工具。
        note: "改為負責帶地圖：`私が地図を持ってきます。`。共同安排下呢句係完整承擔；`私が` 指邊個負責，`地図を` 改用品。"
  - subskill_id: accepting_declining
    explanation: "朋友請你今日一齊去，但你去唔到。`すみません、今日は行けません` 用道歉同原因婉拒：`すみません` 緩和語氣，`今日は` 限定今日，`行けません` 係 `行く` 嘅禮貌否定可能形，表示去唔到。邀請已講咗目的地同活動，所以可以省略。`今日は行きません` 只講唔去，語氣同「去唔到」有別；上文邀請先顯示回應係拒絕。"
    examples:
      - text: すみません、今日は行けません。
        meaning: 唔好意思，我今日嚟唔到。
        note: "改為婉拒聽日嘅探訪：`すみません、明日は行けません。`。`明日は` 改咗原定日子，`行けません` 仍表示無法參與。"
  - subskill_id: negotiating_plans
    explanation: "對方提議星期五見面，但你星期六得。`金曜日は難しいですが、土曜日なら大丈夫です` 先講星期五有困難，再提出星期六可行。`は` 將兩日列為話題，`ですが` 有禮貌噉接對比，`なら` 係「如果係星期六」或「至於星期六」。呢度 `大丈夫です` 係個安排得。因為正回應原有計劃，所以係協商；冇上文可能只係講空閒時間。`金曜日は難しいですが` 係婉轉拒絕星期五，唔係話呢日天生困難。"
    examples:
      - text: 金曜日は難しいですが、土曜日なら大丈夫です。
        meaning: 星期五唔係咁方便，但星期六就得。
        note: "星期五唔得，改提星期日：`金曜日は難しいですが、日曜日なら大丈夫です。`。前半婉拒星期五，`日曜日なら` 提出可行替代。"
