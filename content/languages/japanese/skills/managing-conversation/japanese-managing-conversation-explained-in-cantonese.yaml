skill_id: managing_conversation
explanation_language: cantonese
shared_explanation: skills/managing-conversation/managing-conversation-explained-in-cantonese.yaml
sections:
  - subskill_id: opening_closing
    explanation: では可以帶入結束對話嘅話語；また加時間，表示期待下次見面。
    examples:
      - text: では、また来週。
        meaning: 咁下星期見喇。
        note: 聚會完結時用。来週已經交代下次時間，唔使明講見面動詞。
  - subskill_id: acknowledging
    explanation: なるほど表示聽者覺得解釋講得通，唔一定係認同意見。
    examples:
      - text: なるほど、そういうことですね。
        meaning: 原來係咁，你係呢個意思。
        note: 解釋消除咗疑惑後，講者確認理解內容。
  - subskill_id: clarification
    explanation: もう一度係再一次，配合お願いします可以請人重複頭先聽唔清嘅說話。
    examples:
      - text: すみません、もう一度お願いします。
        meaning: 唔好意思，可唔可以再講一次？
        note: 要重複嘅內容由上句提供，唔係核實已經聽明嘅事實真唔真。
  - subskill_id: rephrasing
    explanation: つまり引出前述重點嘅清楚總結，新講法要保留相關意思。
    examples:
      - text: つまり、予約が必要ということです。
        meaning: 即係話，要預約。
        note: 之前解釋訪客要提早安排，呢句簡化重點；ということです交代實際意思。
  - subskill_id: correcting_misunderstanding
    explanation: ではなく將誤解同真正意思作對比；つもりでした可以解釋原本想點。
    examples:
      - text: 土曜日ではなく、日曜日のつもりでした。
        meaning: 我係指星期日，唔係星期六。
        note: 對方以為約星期六見面，用呢句明確更正原定安排。
  - subskill_id: turns_topics
    explanation: 話は変わりますが宣布轉話題，後面要講新主題，唔好只留低過場句。
    examples:
      - text: 話は変わりますが、来週の予定を確認してもいいですか。
        meaning: 講開另一件事，我可唔可以確認吓下星期嘅安排？
        note: 開場處理話題轉換，問句就引出下一個討論內容。
