      - はい。
      - いいえ。
      - 水をください。
      - ここです。
      - 暑いです。
      - おなかがすきました。
      - これは何ですか。
      - わかりません。
    beginner:
      - 私は学生です。
      - この部屋は静かです。
      - これは私の本です。
      - 妹がいます。
      - 本が三冊あります。
      - 水を少しください。
      - 毎日ここで働きます。
      - 今、本を読んでいます。
    intermediate:
      - 昨日、映画を見ました。
      - 昨日は寒かったです。
      - 明日、東京に行きます。
      - 来年、日本語を勉強するつもりです。
      - コーヒーが好きです。
      - 少し休みたいです。
      - 日本語を話すことができます。
      - ここに座ってもいいですか。
    advanced:
      - 会議がこんなに長引くとわかっていたら、帰りの予定を変えておいたのですが。
      - 最も気になるのは、話し合いに参加できなかった人たちに、この決定がどのような影響を与えるかという点です。
      - この提案は有望に見えますが、実施した場合に生じうる問題についても検討する必要があります。
      - 後で後悔するような決断を急ぐくらいなら、旅行を延期したほうがいいと思います。
      - 報告書を詳しく読めば読むほど、その結論には十分な根拠がないように感じられます。
      - この計画が成功するかどうかは、私たちがどのように責任を分担するかにかかっています。
      - その考えに反対しているわけではなく、今が適切な時期なのか確信が持てないのです。
      - 何が起きたのか理解した頃には、状況を立て直すためにできることはほとんど残っていませんでした。
