# yaml-language-server: $schema=../schemas/language.yaml
schema_version: 1
identity:
  id: greek
  name: Greek
  native_name: Ελληνικά
  family: indo-european
  review: needs_review
integrations:
  language_tag: el
  transcription: el
definitions:
  orthographies:
    modern-greek:
      script: greek
      guidance:
        - scope: target_writing
          text: Write contemporary Modern Greek in Greek script with monotonic accents and diaeresis where
            required. Preserve the distinction between medial σ and final ς. Keep question
            punctuation and source quotations exactly as written; do not convert quotations, names
            or learner evidence to monotonic spelling or Latin letters.
          sources:
            - unicode17_europe
        - scope: explanation_writing
          text: Write contemporary Modern Greek in Greek script with monotonic accents and diaeresis where
            required. Preserve the distinction between medial σ and final ς. Keep question
            punctuation and source quotations exactly as written; do not convert quotations, names
            or learner evidence to monotonic spelling or Latin letters.
          sources:
            - unicode17_europe
  romanization_schemes:
    ala-lc-greek:
      label: ALA-LC Greek
      instructions: "Use the Modern Greek ALA-LC table (2010), not Ancient Greek sound values: β v, η ē, ω
        ō, θ th, φ ph, χ ch, ψ ps, σ/ς s. Use γγ ng, γξ nx, γχ nch; γκ is gk initially/finally and
        nk medially. Initial μπ is b and initial ντ is d̲; elsewhere use mp and nt. Render υ as y
        except u in αυ, ευ, ηυ, ου, υι and ωυ. Apply the table’s historical rough-breathing h rule,
        including where appropriate in monotonic words; rho takes rh only with an explicit rough
        breathing. Omit other accents and diaeresis only in the separate romanized aid. This
        bibliographic transliteration does not encode stress or reliably represent modern
        pronunciation. Never modify the Greek source."
      examples:
        - original: καλημέρα
          romanized: kalēmera
        - original: ευχαριστώ
          romanized: eucharistō
        - original: θάλασσα
          romanized: thalassa
        - original: Ελλάδα
          romanized: Hellada
      sources:
        - ala_lc_greek
      review: needs_review
defaults:
  variety: greek-greece
  orthography:
    local: modern-greek
  scalars: {}
  romanization:
    mode: scheme
    scheme:
      local: ala-lc-greek
  supported_romanizations:
    - local: ala-lc-greek
