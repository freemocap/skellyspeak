learning:
  goal_material:
    courtesy:
      tokens:
        - धन्यवाद
        - शुक्रिया
  skill_guides:
    identify_describe:
      core:
        assessment: Hindi uses होना with noun or adjective predicates and marks agreement in many descriptions.
        explanation: >-
          ### Form and meaning


          A present identity or description often ends in हूँ, है or हैं, according to the subject
          and level of respect. Many adjectives change form for gender and number.


          ### In use


          Not all adjectives inflect. Word order is often subject–description–copula, and respectful
          reference can require plural-form agreement for one person.
        examples:
          - text: यह कमरा बड़ा है।
            translation: This room is big.
          - text: वह डॉक्टर हैं।
            translation: They are a doctor, with respectful reference.
      varieties:
        hindi-india:
          assessment: Hindi uses होना with noun or adjective predicates and marks agreement in many
            descriptions.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    possession_relationships:
      core:
        assessment: Hindi uses के पास, possessive का forms and relationship constructions.
        explanation: >-
          ### Form and meaning


          के पास with a person commonly expresses having or access to an object. मेरा, मेरी and मेरे
          agree with the noun being referred to, not the possessor.


          ### In use


          Family relationships do not always use the same construction as owning an object. Keep the
          relationship noun and its agreement together.
        examples:
          - text: मेरे पास एक साइकिल है।
            translation: I have a bicycle.
          - text: यह मेरी बहन है।
            translation: This is my sister.
      varieties:
        hindi-india:
          assessment: Hindi uses के पास, possessive का forms and relationship constructions.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    quantity:
      core:
        assessment: Hindi expresses quantity with numbers and amount words, with noun forms reflecting context.
        explanation: >-
          ### Form and meaning


          A numeral precedes the noun. Quantifiers such as थोड़ा can change form according to the
          noun, while some other quantity words do not.


          ### In use


          दो किताबें counts books; थोड़ा पानी describes an amount of water. Noun forms can also
          change before postpositions, so a counted phrase is not always just the dictionary noun.
        examples:
          - text: मुझे दो किताबें चाहिए।
            translation: I need two books.
          - text: थोड़ा पानी दीजिए।
            translation: Please give me a little water.
      varieties:
        hindi-india:
          assessment: Hindi expresses quantity with numbers and amount words, with noun forms reflecting
            context.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    present_situations:
      core:
        assessment: Hindi habitual and progressive constructions distinguish repeated activity from activity
          in progress.
        explanation: >-
          ### Form and meaning


          A habitual form such as करता plus a form of होना describes routines. A progressive form
          uses रहा, रही or रहे with an auxiliary.


          ### In use


          The participial form reflects gender and number or respectful agreement. A current state
          may use a different predicate and need no progressive form.
        examples:
          - text: मैं यहाँ काम करता हूँ।
            translation: I work here, said by a man.
          - text: वह किताब पढ़ रही है।
            translation: She is reading a book.
      varieties:
        hindi-india:
          assessment: Hindi habitual and progressive constructions distinguish repeated activity from activity
            in progress.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    past_reference:
      core:
        assessment: Hindi past reference uses past auxiliaries and perfective or other aspect forms.
        explanation: >-
          ### Form and meaning


          था, थी and थे can place a state in the past. Completed transitive events often use ने on
          the agent, with agreement following a different pattern from the present.


          ### In use


          Do not add ने to every past sentence. Intransitive verbs and different aspect
          constructions follow different patterns.
        examples:
          - text: मैं कल आया था।
            translation: I came yesterday, said by a man.
          - text: उसने किताब पढ़ी।
            translation: They read the book.
      varieties:
        hindi-india:
          assessment: Hindi past reference uses past auxiliaries and perfective or other aspect forms.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    future_reference:
      core:
        assessment: Hindi uses future forms and contextual constructions to refer ahead in time.
        explanation: >-
          ### Form and meaning


          Future verb endings change with person, number and gender. A time word such as कल needs
          context because it can mean yesterday or tomorrow.


          ### In use


          A future form helps disambiguate the time. Plans can also be expressed with other
          constructions, so look at the meaning of the whole phrase.
        examples:
          - text: मैं कल आऊँगा।
            translation: I will come tomorrow, said by a man.
          - text: हम अगले हफ़्ते जाएँगे।
            translation: We will go next week.
      varieties:
        hindi-india:
          assessment: Hindi uses future forms and contextual constructions to refer ahead in time.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    wants_preferences:
      core:
        assessment: Hindi uses चाहना, पसंद and चाहिए constructions for wants and preferences.
        explanation: >-
          ### Form and meaning


          चाहना can take an infinitive to express wanting to do something. पसंद with a dative
          experiencer expresses liking.


          ### In use


          मुझे चाय पसंद है states a preference; मुझे चाय चाहिए expresses wanting or needing tea. The
          second does not by itself explain whether the need is urgent.
        examples:
          - text: मुझे चाय पसंद है।
            translation: I like tea.
          - text: मैं घर जाना चाहती हूँ।
            translation: I want to go home, said by a woman.
      varieties:
        hindi-india:
          assessment: Hindi uses चाहना, पसंद and चाहिए constructions for wants and preferences.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    ability_permission_necessity:
      core:
        assessment: Hindi uses सकना, permission constructions and obligation expressions.
        explanation: >-
          ### Form and meaning


          सकना with a verb expresses ability or possibility. पड़ना, होना and चाहिए participate in
          several necessity and obligation patterns.


          ### In use


          सकता can also be used in a permission question. The construction and context distinguish
          practical ability, permission and advice.
        examples:
          - text: मैं तैर सकता हूँ।
            translation: I can swim, said by a man.
          - text: मुझे जाना है।
            translation: I have to go.
      varieties:
        hindi-india:
          assessment: Hindi uses सकना, permission constructions and obligation expressions.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    affirm_negate:
      core:
        assessment: Hindi uses नहीं for ordinary negation and मत in many prohibitions.
        explanation: >-
          ### Form and meaning


          नहीं commonly appears before the main verb or predicate. मत is used to tell someone not to
          perform an action.


          ### In use


          The position of the negative word and the predicate determine what is denied. A
          prohibition is a request or instruction as well as negative meaning.
        examples:
          - text: मुझे नहीं पता।
            translation: I do not know.
          - text: यह महँगा नहीं है।
            translation: This is not expensive.
      varieties:
        hindi-india:
          assessment: Hindi uses नहीं for ordinary negation and मत in many prohibitions.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    questions_answers:
      core:
        assessment: Hindi questions use question words and optional initial क्या for yes/no questions.
        explanation: >-
          ### Form and meaning


          क्या at the beginning can mark a yes/no question. कहाँ, कब and कौन ask for place, time and
          person respectively.


          ### In use


          क्या also means what in an information question. Its position and the rest of the sentence
          determine which function it has.
        examples:
          - text: क्या आप कल आएँगे?
            translation: Will you come tomorrow?
          - text: स्टेशन कहाँ है?
            translation: Where is the station?
      varieties:
        hindi-india:
          assessment: Hindi questions use question words and optional initial क्या for yes/no questions.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    requests:
      core:
        assessment: Hindi requests use imperative forms that distinguish levels of address.
        explanation: >-
          ### Form and meaning


          Verb forms differ with तू, तुम and आप. A request to someone addressed respectfully often
          uses a form such as दीजिए or कीजिए.


          ### In use


          कृपया can mark politeness in formal wording, but appropriate address and verb form matter
          in ordinary conversation. Do not mix a respectful pronoun with a familiar command
          accidentally.
        examples:
          - text: कृपया बैठिए।
            translation: Please sit down.
          - text: फिर से कहिए।
            translation: Please say that again.
      varieties:
        hindi-india:
          assessment: Hindi requests use imperative forms that distinguish levels of address.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
    reasons_conditions:
      core:
        assessment: Hindi क्योंकि and अगर…तो connect reasons and conditions.
        explanation: >-
          ### Form and meaning


          क्योंकि introduces a reason. अगर introduces a condition, often paired with तो at the start
          of its result.


          ### In use


          The verb forms distinguish possible future situations from other kinds of hypothetical
          relation. A complete conditional can make the intended time clearer than a single isolated
          verb.
        examples:
          - text: मैं घर पर हूँ क्योंकि मैं बीमार हूँ।
            translation: I am at home because I am ill.
          - text: अगर बारिश हुई तो हम घर पर रहेंगे।
            translation: If it rains, we will stay at home.
      varieties:
        hindi-india:
          assessment: Hindi क्योंकि and अगर…तो connect reasons and conditions.
          explanation: The core patterns and examples apply to this variety. Use the forms of address
            appropriate to the speaker and listener.
          examples: []
      review: needs_review
      authorship: Authored teaching draft; linguistic review pending.
      sources: []
