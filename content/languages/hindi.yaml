# yaml-language-server: $schema=../schemas/language.json
schema_version: 1
identity:
  id: hindi
  name: Hindi
  native_name: हिन्दी
  family: indo-european
  review: needs_review
integrations:
  language_tag: hi
  transcription: hi
definitions:
  orthographies:
    devanagari:
      script: devanagari
      guidance:
      - scope: target_writing
        text: Write newly generated Hindi in Devanagari script. Preserve source excerpts exactly, including
          vowel signs, conjuncts and joining controls. Keep newly generated target and explanation text in this script.
          Reading-aid romanization is generated by a separate operation.
        sources:
        - unicode17_indic
      - scope: explanation_writing
        text: Write newly generated Hindi in Devanagari script. Preserve source excerpts exactly, including
          vowel signs, conjuncts and joining controls. Keep newly generated target and explanation text in this script.
          Reading-aid romanization is generated by a separate operation.
        sources:
        - unicode17_indic
  romanization_schemes:
    ala-lc-hindi:
      label: ALA-LC Hindi
      instructions: Use ALA-LC Hindi (2025) orthographic transliteration with its diacritics, including
        ā, ī, ū, ṭ, ḍ, ṇ and ś. Supply the inherent a unless a vowel sign replaces it or virāma suppresses
        it; do not silently apply spoken Hindi schwa deletion to this spelling-based scheme. Follow the
        table for nukta letters and nasal signs. This is transliteration, not a pronunciation guide; put
        spoken pronunciation in the separate pronunciation field. Preserve the source exactly.
      examples:
      - original: पानी
        romanized: pānī
      - original: नमस्ते
        romanized: namaste
      - original: किताब
        romanized: kitāba
      - original: घर
        romanized: ghara
      - original: चाय
        romanized: cāya
      sources:
      - ala_lc_hindi
      review: needs_review
defaults:
  variety: hindi-india
  orthography:
    local: devanagari
  scalars: {}
  romanization:
    mode: scheme
    scheme:
      local: ala-lc-hindi
  supported_romanizations:
  - local: ala-lc-hindi
traits: []
varieties:
- id: hindi-india
  name: India
  description: Contemporary standard Hindi for everyday conversation in India.
  review: needs_review
  sources: []
  overrides: {}
  guidance: []
guidance:
- scope: segmentation
  text: Select linguistic words without splitting vowel signs or conjuncts. Preserve the exact source
    encoding and let the supplied grapheme boundaries constrain annotation spans.
  sources:
  - unicode17_indic
learning:
  goal_material:
    courtesy:
      tokens:
      - धन्यवाद
      - शुक्रिया
conversation:
  greeting:
    text: नमस्ते
    romanizations:
      "hindi:ala-lc-hindi": namaste
  default_partner:
    name: आशा
    romanizedName: Āśā
    age: 32
    location: Lucknow, India
    occupation: Librarian
    background: Works at a neighbourhood library and lives with her sister.
    currentSituation: Organizing a book exchange and planning a weekend train trip.
    interests:
    - books
    - cooking
    - train journeys
    opinions:
    - Public transport should be easier to use.
    interestingFacts:
    - Keeps a notebook of places to visit.
    favoriteBooks: []
    favoriteMovies: []
    manner: Uses short everyday sentences and asks concrete follow-up questions.
    quirks:
    - Draws small maps when explaining directions.
    vibe:
    - 📚
    - 🚲
    - ☕
