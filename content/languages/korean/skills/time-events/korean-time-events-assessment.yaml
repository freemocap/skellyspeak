skill_id: time_events
guidance: Look for temporal reference, duration or recurrence, sequence and event phase. 지금 라디오를
  고치고 있어요 presents an ongoing repair; a suitable simple present can describe a routine. 어제 고쳤어요
  locates a repair earlier. 내일 갈 거예요 anticipates a later event, while 겠 can express intention,
  inference or conventional acknowledgment and is not automatically future timing. 매주 marks
  recurrence and 두 시간 동안 duration. 먼저 and 그다음 order actions; 다 읽었어요 explicitly presents a
  completed reading. An isolated copied 어제 without an event or contextual answer is absent. 어제
  저녁에 can answer a question about when an identified action happened. A current quality such as
  방이 넓어요 does not automatically demonstrate temporal skill. Do not demand an English progressive
  or perfect counterpart in every translation, and distinguish an appropriate shorter
  conversational predicate from a genuinely broken tense or aspect construction.
