sections:
  - subskill_id: wants_intentions
    explanation: 動作詞幹後加고 싶어요，表示想做嗰件事，講者可以省略。
    examples:
      - text: 가구를 만드는 법을 배우고 싶어요.
        meaning: 我想學整傢俬。
        note: 배우고 싶어요表達願望；만드는 법指出想學嘅方法或技能。
  - subskill_id: preferences
    explanation: 좋아하다可以將喜歡嘅事物作賓語；보다同더可以比較喜好程度。
    examples:
      - text: 저는 커피보다 차를 더 좋아해요.
        meaning: 比起咖啡，我鍾意茶多啲。
        note: 차를將茶標示為喜歡嘅對象；커피보다提供比較基準。
  - subskill_id: emotions
    explanation: 기쁘다直接描述開心，配合禮貌詞尾；原因分句交代情緒由來。
    examples:
      - text: 다시 만나서 기뻐요.
        meaning: 再見到你，我好開心。
        note: 만나서將見面同心情連起來；省略嘅參與者由見面情境交代。
  - subskill_id: opinions
    explanation: 命題配合引述形式다고同생각해요，可以陳述個人判斷；被引述述語要用相應普通體。
    examples:
      - text: 이 방법이 좋다고 생각해요.
        meaning: 我覺得呢個方法好。
        note: 좋다고引述描述性述語좋다；講者評價呢個方法。
  - subskill_id: agreement_disagreement
    explanation: 그렇게指返他人嘅想法；도表示講者都持有同樣觀點。
    examples:
      - text: 저도 그렇게 생각해요.
        meaning: 我都係咁諗。
        note: 回應對方法嘅具體意見，表示認同，唔係淨係確認聽到。
