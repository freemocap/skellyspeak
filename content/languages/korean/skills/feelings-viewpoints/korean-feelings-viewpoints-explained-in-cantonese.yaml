sections:
  - subskill_id: wants_intentions
    explanation: 你喺傢俬工場講學習目標。`가구를 만드는 법을` 係製作傢俬嘅方法，標示為想學嘅對象；`배우고 싶어요` 表示講者想學。`-고 싶어요` 接動作，唔係英文不定式。
    examples:
      - text: 가구를 만드는 법을 배우고 싶어요.
        meaning: 我想學整傢俬。 배우고 싶어요表達願望；만드는 법指出想學嘅方法或技能。
        note: 試吓話想學整單車。答案：`자전거를 고치는 법을 배우고 싶어요`。技能片語改 `자전거를 고치는 법을`，保留 `배우고 싶어요` 表願望。
  - subskill_id: preferences
    explanation: 你揀飲品。`저는` 指講者；`커피보다` 將咖啡作比較基準，`차를` 標示茶係喜歡嘅對象。`더 좋아해요` 表示較鍾意。比較 `차가 좋아요`：嗰句將茶描述成令人喜歡。
    examples:
      - text: 저는 커피보다 차를 더 좋아해요.
        meaning: 比起咖啡，我鍾意茶多啲。 차를將茶標示為喜歡嘅對象；커피보다提供比較基準。
        note: 試吓話比起茶更鍾意咖啡。答案：`저는 차보다 커피를 더 좋아해요`。對調比較基準同喜好對象；較鍾意嘅飲品仍用賓語標記 `를`。
  - subskill_id: emotions
    explanation: 隔咗一段時間再見到對方。`다시 만나서` 指再次見面呢個感受來源；`기뻐요` 直接用禮貌句尾表達開心。參與者由見面語境可知。
    examples:
      - text: 다시 만나서 기뻐요.
        meaning: 再見到你，我好開心。 만나서將見面同心情連起來；省略嘅參與者由見面情境交代。
        note: 試吓話再次見到朋友好開心。答案：`친구를 다시 만나서 기뻐요`。加 `친구를` 指見到邊個；`기뻐요` 仍係講自己感受。
  - subskill_id: opinions
    explanation: 你評價一個建議方法。`이 방법이` 指討論中嘅方法；`좋다고` 包住「好」呢個判斷，`생각해요` 表示係講者嘅睇法。呢句係意見，唔係要求澄清事實。
    examples:
      - text: 이 방법이 좋다고 생각해요.
        meaning: 我覺得呢個方法好。 좋다고引述描述性述語좋다；講者評價呢個方法。
        note: 試吓話你認為呢個方法容易。答案：`이 방법이 쉽다고 생각해요`。描述性原形 `쉽다` 接 `-고` 成 `쉽다고`，再保留 `생각해요`。
  - subskill_id: agreement_disagreement
    explanation: 同伴啱啱話方法好，你都同意。`저도` 係我都係；`그렇게` 指返對方評價，`생각해요` 講自己點諗。前面嘅意見令簡短指代有對象。
    examples:
      - text: 저도 그렇게 생각해요.
        meaning: 我都係咁諗。 回應對方法嘅具體意見，表示認同，唔係淨係確認聽到。
        note: 試吓明確表示唔同意。答案：`저는 그렇게 생각하지 않아요`。將 `저도` 換成 `저는`，否定 `생각해요`；`그렇게` 仍指已知睇法。
