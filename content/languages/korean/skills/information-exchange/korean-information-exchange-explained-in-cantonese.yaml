sections:
  - subskill_id: asking_information
    explanation: 去舖頭前，講者需要知道幾點關門。`가게가` 指間舖；`몇 시에` 問幾點，`닫아요?` 係禮貌問關門。韓語時間片語放喺句尾述語前，唔使英文式助動詞。
    examples:
      - text: 가게가 몇 시에 닫아요?
        meaning: 間舖頭幾點閂門？ 問句想知關門時間；問號標示疑問解讀。
        note: 試吓問舖頭幾點開。答案：`가게가 몇 시에 열어요?`。保留 `몇 시에` 問未知鐘點，將 `닫아요` 換成 `열어요`。
  - subskill_id: answering_information
    explanation: 對方啱啱問間舖幾點關。`다섯 시에요` 喺呢段問答可分析為 `다섯 시에`（五點時）加禮貌 `요`，關門動作由問題承接。呢個係時間短答；獨立講「而家係五點」通常用 `다섯 시예요`。
    examples:
      - text: 다섯 시에요.
        meaning: 五點鐘。回應舖頭幾點閂門；呢度係 `다섯 시에` 加禮貌 `요`，關門動作由問題承接，唔係獨立報時嘅 `다섯 시예요`。
        note: 試吓答六點關。答案：`여섯 시에요`。喺同一條「幾點關門」問題後，`에` 標示時間，`요` 令簡短答案禮貌；省略嘅動作仍然清楚。
  - subskill_id: checking_facts
    explanation: 你以為舖頭五點關，但想核實。`가게가 다섯 시에 닫죠?` 先提出你認為嘅事實，再用 `죠?` 請對方確認。`몇 시에` 則係問未知鐘點。
    examples:
      - text: 가게가 다섯 시에 닫죠?
        meaning: 間舖頭五點閂門，係咪？ 講者核實提出咗嘅時間；呢度죠尋求確認，唔係問完全未知嘅鐘點。
        note: 試吓核實舖頭係咪六點關。答案：`가게가 여섯 시에 닫죠?`。提出六點關門呢個說法，再用 `죠?` 求證。
  - subskill_id: useful_detail
    explanation: 對方見到幾張椅，問用邊張。`창문 옆에 있는` 放喺 `의자` 前，指定窗旁嗰張；`쓰세요` 請對方用佢。位置細節消除選擇含糊。
    examples:
      - text: 창문 옆에 있는 의자를 쓰세요.
        meaning: 用窗口隔籬嗰張凳。 對方問用邊張凳時，창문 옆에 있는提供分辨位置。
        note: 試吓叫佢用門旁嗰張椅。答案：`문 옆에 있는 의자를 쓰세요`。地標由 `창문` 換成 `문`；`있는` 仍放喺被識別嘅名詞前。
