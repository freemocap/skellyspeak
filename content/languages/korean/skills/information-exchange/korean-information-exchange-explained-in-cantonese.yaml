sections:
  - subskill_id: asking_information
    explanation: 몇 시問鐘點，에接喺時間後面；禮貌句唔使額外疑問助動詞都可以做問句。
    examples:
      - text: 가게가 몇 시에 닫아요?
        meaning: 間舖頭幾點閂門？
        note: 問句想知關門時間；問號標示疑問解讀。
  - subskill_id: answering_information
    explanation: 時間表達加禮貌요，可以直接回答，唔使重複成個分句。
    examples:
      - text: 다섯 시에요.
        meaning: 五點鐘。
        note: 回應舖頭幾點閂門；呢度係다섯 시에加요，唔係將繫詞예요寫錯。
  - subskill_id: checking_facts
    explanation: 지요常縮成죠，可以請對方確認假定或之前提過嘅命題。
    examples:
      - text: 가게가 다섯 시에 닫죠?
        meaning: 間舖頭五點閂門，係咪？
        note: 講者核實提出咗嘅時間；呢度죠尋求確認，唔係問完全未知嘅鐘點。
  - subskill_id: useful_detail
    explanation: 名詞前嘅分句可以識別物件；있다用있는將位置描述連到名詞。
    examples:
      - text: 창문 옆에 있는 의자를 쓰세요.
        meaning: 用窗口隔籬嗰張凳。
        note: 對方問用邊張凳時，창문 옆에 있는提供分辨位置。
