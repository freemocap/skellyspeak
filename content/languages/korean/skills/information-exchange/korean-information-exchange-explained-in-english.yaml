sections:
  - subskill_id: asking_information
    explanation: Before visiting a shop, the speaker needs its closing time. `가게가` identifies the shop; `몇
      시에` asks at what hour, and `닫아요?` is the polite closing question. Korean keeps the time phrase
      before the final predicate; no English-style auxiliary is needed.
    examples:
      - text: 가게가 몇 시에 닫아요?
        meaning: What time does the shop close? The question seeks a closing hour. The question mark represents
          the interrogative reading.
        note: "Try it: ask when the shop opens. Answer: `가게가 몇 시에 열어요?`. Keep `몇 시에` for the unknown hour and
          replace closing `닫아요` with opening `열어요`."
  - subskill_id: answering_information
    explanation: The other person has just asked when the shop closes. `다섯 시에요` can be heard as `다섯 시에` (at
      five) plus polite `요`, with the closing action understood. It is a time-answer fragment; a
      standalone predication “it is five” is normally `다섯 시예요`.
    examples:
      - text: 다섯 시에요.
        meaning: "At five o’clock. This answers when the shop closes: `다섯 시에` plus polite `요`, with closing
          understood from the question. It is a time fragment, not the standalone clock-time statement
          `다섯 시예요`."
        note: "Try it: answer that it closes at six. Answer: `여섯 시에요`. In this same when-question context, `에`
          marks the closing time and `요` makes the short answer polite; the omitted action remains
          recoverable."
  - subskill_id: checking_facts
    explanation: You think the shop closes at five but want confirmation. `가게가 다섯 시에 닫죠?` states the proposed
      fact, then `죠?` invites the listener to verify it. This differs from `몇 시에`, which asks for an
      unknown hour.
    examples:
      - text: 가게가 다섯 시에 닫죠?
        meaning: The shop closes at five, right? The speaker checks a proposed closing time. 죠 here seeks
          confirmation rather than introducing an entirely unknown hour.
        note: "Try it: check whether the shop closes at six. Answer: `가게가 여섯 시에 닫죠?`. State the six-o’clock
          proposition and use `죠?` for confirmation."
  - subskill_id: useful_detail
    explanation: A person can see several chairs and asks which one to use. `창문 옆에 있는` is a clause before
      `의자` that picks out the chair next to the window. `쓰세요` then asks the listener to use that chair;
      the location detail resolves the choice.
    examples:
      - text: 창문 옆에 있는 의자를 쓰세요.
        meaning: Use the chair next to the window. When the listener asks which chair to use, 창문 옆에 있는 supplies
          the distinguishing location.
        note: "Try it: direct them to the chair by the door. Answer: `문 옆에 있는 의자를 쓰세요`. Replace the landmark `창문`
          with `문`; keep `있는` before the noun it identifies."
