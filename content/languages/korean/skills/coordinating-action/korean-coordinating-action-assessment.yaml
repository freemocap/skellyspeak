skill_id: coordinating_action
guidance: Assess requests, offers, suggestions, undertakings, acceptance or refusal and changes
  to plans. 옮겨 주세요 asks help with moving something; 도와드릴까요 offers the speaker’s help, and 같이 쉴까요
  proposes shared action in context. 제가 가져올게요 can undertake responsibility with a
  listener-oriented intention, whereas a prediction in 을 거예요 need not promise. 좋아요 after a
  concrete invitation can accept contextually; elsewhere it may just evaluate an object. 오늘은
  어려워요 can decline a proposed activity indirectly when the difficulty is clear. 토요일은 어때요 adjusts
  timing in response to a Friday conflict. An isolated copied 주세요 without an object or
  recoverable request is absent. A question about capability is not automatically a request.
  Honorific and speech-level choices should fit the relationship, but do not require maximal
  formality in ordinary conversation or explicit pronouns when the participants are clear.
