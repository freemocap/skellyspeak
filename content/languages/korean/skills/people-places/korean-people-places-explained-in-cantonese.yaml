shared_explanation: skills/people-places/people-places-explained-in-cantonese.yaml
sections:
  - subskill_id: identification
    explanation: 이분禮貌噉指介紹緊嘅人；元音結尾名詞喺呢類禮貌識別句用예요。
    examples:
      - text: 이분은 제 동료예요.
        meaning: 呢位係我同事。
        note: 제係謙遜嘅「我嘅」；동료예요識別同事關係。
  - subskill_id: qualities_states
    explanation: 描述性述語直接接句尾形式；넓다變넓어요，唔使加繫詞。
    examples:
      - text: 이 방은 넓어요.
        meaning: 呢間房好闊落。
        note: 은將房間標示為話題；넓어요交代物理特徵。
  - subskill_id: location_movement
    explanation: 位置表達配合에同있다，交代物件喺邊；위指另一件物件上面。
    examples:
      - text: 열쇠가 책상 위에 있어요.
        meaning: 鎖匙喺書枱上面。
        note: 책상 위에係位置；있어요表示喺嗰度，唔係喺嗰度做某個動作。
  - subskill_id: possession_relations
    explanation: 제修飾所擁有名詞；것可以代替已知物件，거예요係常見嘅禮貌縮約形式。
    examples:
      - text: 이 우산은 제 거예요.
        meaning: 呢把遮係我嘅。
        note: 제 거識別物主，唔使重複우산，亦唔表示講者性別。
  - subskill_id: quantity_comparison
    explanation: 보다接喺比較基準後面，더可以標示更高程度；描述性述語仍用正常句尾形式。
    examples:
      - text: 이 상자가 저 상자보다 더 가벼워요.
        meaning: 呢個箱比嗰個箱輕。
        note: 가벼워요係가볍다嘅變化形式；보다就重量比較兩個箱。
