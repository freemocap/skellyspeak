skill_id: people_places
explanation_language: cantonese
shared_explanation: skills/people-places/people-places-explained-in-cantonese.yaml
sections:
  - subskill_id: identification
    explanation: 初次見面時禮貌噉介紹同事。`이분은` 將呢位人士設為話題，`제` 謙遜噉表示「我嘅」；`동료예요` 指同事關係。元音結尾名詞接 `예요`。
    examples:
      - text: 이분은 제 동료예요.
        meaning: 呢位係我同事。 제係謙遜嘅「我嘅」；동료예요識別同事關係。
        note: 試吓改為介紹老師。答案：`이분은 제 선생님이에요`。`선생님` 以輔音結尾，所以名詞後用禮貌句尾 `이에요`，唔係 `예요`。
  - subskill_id: qualities_states
    explanation: 有人問呢間房點樣。`이 방은` 將房間設為話題；`넓어요` 直接講房間闊落。描述性述語已經有禮貌句尾，毋須另加「係」。
    examples:
      - text: 이 방은 넓어요.
        meaning: 呢間房好闊落。 은將房間標示為話題；넓어요交代物理特徵。
        note: 試吓話間房細。答案：`이 방은 작아요`。保留話題片語，直接用描述性述語 `작아요`，唔加繫詞。
  - subskill_id: location_movement
    explanation: 你幫人搵鎖匙。`열쇠가` 標示要搵嘅鎖匙；`책상 위에` 係書枱上面，`있어요` 話佢喺嗰度。`에` 標示靜態位置；喺書枱做動作通常用 `에서`。
    examples:
      - text: 열쇠가 책상 위에 있어요.
        meaning: 鎖匙喺書枱上面。 책상 위에係位置；있어요表示喺嗰度，唔係喺嗰度做某個動作。
        note: 試吓話鎖匙喺書枱下面。答案：`열쇠가 책상 아래에 있어요`。將 `위에` 換成 `아래에`；`있어요` 仍表示位於某處。
  - subskill_id: possession_relations
    explanation: 有人問把遮係邊個嘅。`이 우산은` 將呢把遮設為話題；`제 거예요` 係我嘅。`거` 係 `것` 嘅日常縮約形式，毋須重複「遮」；`제` 唔表示講者性別。
    examples:
      - text: 이 우산은 제 거예요.
        meaning: 呢把遮係我嘅。 제 거識別物主，唔使重複우산，亦唔表示講者性別。
        note: 試吓話呢個袋係你嘅。答案：`이 가방은 제 거예요`。物件換成 `가방`，物主不變，所以保留 `제 거예요`。
  - subskill_id: quantity_comparison
    explanation: 你要揀搬邊個箱。`저 상자보다` 將嗰個箱作比較基準；`이 상자가` 係被描述嘅箱。`더 가벼워요` 表示較輕，`가볍다` 變成禮貌形式。
    examples:
      - text: 이 상자가 저 상자보다 더 가벼워요.
        meaning: 呢個箱比嗰個箱輕。 가벼워요係가볍다嘅變化形式；보다就重量比較兩個箱。
        note: 試吓話呢個箱比嗰個重。答案：`이 상자가 저 상자보다 더 무거워요`。保留比較結構，重量述語改做 `무거워요`。
