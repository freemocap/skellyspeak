sections:
  - subskill_id: ability
    explanation: 動詞詞幹配合을 수 있어요，可以表示能力；依存名詞수喺正常書寫要分開。
    examples:
      - text: 간단한 고장은 고칠 수 있어요.
        meaning: 簡單故障我識整。
        note: 고칠 수 있어요描述實際能力；은將簡單故障標示為話題或能力範圍。
  - subskill_id: permission
    explanation: 아도或어도後接돼요，可以問某個行動獲唔獲准；聽者身份提供批准權限。
    examples:
      - text: 여기에 자전거를 세워도 돼요?
        meaning: 我可唔可以泊架單車喺度？
        note: 세워도來自세우다；向管理地方嘅人詢問。
  - subskill_id: obligation
    explanation: 아야或어야配合해요，表示必須做嘅行動，要求有別於願望。
    examples:
      - text: 오늘 이 책을 돌려줘야 해요.
        meaning: 我今日一定要還呢本書。
        note: 돌려줘야 해요表示責任，오늘交代時間；唔係話已經還咗。
  - subskill_id: possibility
    explanation: 을 수도 있어요可以將事件表達為可能結果之一，唔一定講實際技能。
    examples:
      - text: 오후에 비가 올 수도 있어요.
        meaning: 下晝可能落雨。
        note: 비가 올交代可能事件；도幫助將佢表達成多種可能之一。
  - subskill_id: certainty
    explanation: 확실하지 않아요明確否定確定性；話題短語可以指出邊件事未肯定。
    examples:
      - text: 정확한 날짜는 아직 확실하지 않아요.
        meaning: 確實日期仲未定。
        note: 아직表示仍然未肯定，唔係話建議日期一定錯。
