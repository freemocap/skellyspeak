skill_id: coordinating_action
guidance: Identify requests, offers or invitations, suggestions, undertakings, acceptance or
  refusal, and revisions of shared plans. Puoi chiudere la finestra, per favore? can request an
  action in a cooperative exchange rather than test ability. Puoi chiudi la finestra
  unsuccessfully forms that modal request when no separate successful action move occurs. Vuoi
  venire al laboratorio con noi? can invite participation; potremmo fare una pausa proposes an
  option. Porto i pennelli per tutti undertakes a contribution in a supplies discussion, even
  with a present verb. A prediction about tomorrow's rain undertakes nothing. Volentieri after
  an invitation can accept contextually; grazie alone may just acknowledge it. Possiamo spostare
  l'incontro a sabato? negotiates a change when another day has been proposed. Desire stated
  with voglio does not itself settle coordinated action. Accept suitable imperatives, indicative
  requests and polite conditionals according to relationship and setting; one special polite
  form is not mandatory. Without context, do not invent a commitment from a future event report.
