language: italian
skill_id: coordinating_action
explanation_language: cantonese
shared_explanation: skills/coordinating-action/coordinating-action-explained-in-cantonese.yaml
sections:
  - subskill_id: requests
    explanation: 間房凍，請人閂窗就提供清楚嘅行動。`puoi` 問句係向一個人作出熟悉稱呼請求嘅常見方式。呢個情境係請佢合作，唔只係測試體力。
    examples:
      - text: Puoi chiudere la finestra, per favore?
        meaning: 意思係「唔該，你可唔可以閂窗？」`Puoi` 用熟悉單數稱呼，`chiudere` 指閂，`la finestra` 指窗。`Per favore` 加上唔該。`Puoi`
          後面動作保持不定式。
        note: >-
          **改一改。** `Può chiudere la finestra, per favore?` 用正式稱呼 `Lei`。`Potresti chiudere la
          finestra?` 就令熟悉稱呼嘅請求婉轉啲。


          **試吓。** 用 `aprire la porta` 請熟人開門。答案：`Puoi aprire la porta, per favore?`。換活動同物件，保留 `puoi`。
  - subskill_id: offers_invitations
    explanation: 邀請畀對方機會參加活動。`vuoi` 問句問佢願唔願意。呢度工作坊同同行嘅人，講清楚參與包括乜。
    examples:
      - text: Vuoi venire al laboratorio con noi?
        meaning: 意思係「你想唔想同我哋嚟工作坊？」`Vuoi` 問想唔想，`venire` 係嚟。`Al laboratorio` 講目的地，`con noi` 係同我哋。`Al` 由 `a` 同
          `il` 合成。
        note: |-
          **比較。** `Vuoi venire?` 留畀情境交代目的地。`Devi venire` 表達要求，唔係邀請。原句容許對方接受或者拒絕。

          **試吓。** 用 `il parco` 邀請對方同你哋去公園。答案：`Vuoi venire al parco con noi?`。換目的地，保留邀請開頭。
  - subskill_id: suggestions
    explanation: 一齊工作時，休息可以係下一個選項。`potremmo` 提出我哋可以做嘅事，留畀大家商量。佢係 potere 嘅條件式；呢個建議唔係講過去。
    examples:
      - text: Potremmo fare una pausa in giardino.
        meaning: 意思係「我哋可以去花園休息吓」。`Potremmo` 嘅我哋包括講者。`Fare una pausa` 係休息，`in giardino` 講地方。活動 `fare` 保持不定式。
        note: |-
          **比較。** `Dobbiamo fare una pausa` 表達必要性。`Possiamo fare una pausa` 可以較直接講可行選項。條件式令提議婉轉啲。

          **試吓。** 用 `prendere un caffè` 提議飲杯咖啡。答案：`Potremmo prendere un caffè`。保留包括大家嘅婉轉提議，換活動。
  - subskill_id: commitments
    explanation: 分配工作坊用品時，講自己會帶乜，可以承擔一個任務。商量計劃入面，現在式陳述可以成為承諾。同一啲字喺另一個情境亦可能只講習慣。
    examples:
      - text: Porto i pennelli per tutti.
        meaning: 意思係「我會帶畫筆畀大家」。`Porto` 係我帶，`i pennelli` 指畫筆，`per tutti` 係畀所有人。計劃情境提供承諾同將來理解。
        note: >-
          **比較。** `Porto i pennelli ogni settimana` 描述習慣。`Ti prometto che porto i pennelli`
          明確承諾。單有將來時間詞，唔一定就係承諾。


          **試吓。** 用 `i colori` 承擔帶顏料任務。喺計劃對話回答：`Porto i colori per tutti`。換用品，情境仍然提供承擔意思。
  - subskill_id: accepting_declining
    explanation: 邀請你去工作坊嘅人需要清楚答案。先道謝，再講嗰日去唔到，就可以回應同拒絕邀請，唔使長篇交代私人原因。
    examples:
      - text: Grazie, ma domani non posso venire.
        meaning: 意思係「多謝，但聽日我嚟唔到」。`Grazie` 回應邀請。`Ma` 引出拒絕，`domani` 指日子，`non posso venire` 講嚟唔到。`Non` 喺變位動詞之前。
        note: |-
          **比較。** `Sì, grazie, vengo volentieri` 係樂意接受。`Non voglio venire` 係唔想嚟，同嚟唔到唔同。

          **試吓。** 用 `venerdì` 講星期五嚟唔到。答案：`Grazie, ma venerdì non posso venire`。換日子，保留有禮貌嘅拒絕。
  - subskill_id: negotiating_plans
    explanation: 星期五唔得，提出星期六就畀大家另一個方案。有效商量會講限制，再提出具體調整。`possiamo` 問句保留畀大家同意嘅空間。
    examples:
      - text: Venerdì non posso. Possiamo spostare l’incontro a sabato?
        meaning: 意思係「星期五我唔得。我哋可唔可以將會面改到星期六？」`Venerdì non posso` 講唔得嘅日子。`Possiamo spostare l’incontro`
          問可唔可以改會面，`a sabato` 指新日子。
        note: >-
          **比較。** `L’incontro è sabato` 宣布日子，唔係提議改期。只講 `Non posso` 冇提供替代方案。`Possiamo` 後面嘅 `spostare`
          用不定式。


          **試吓。** 星期五唔得，用 `domenica` 提議星期日。答案：`Venerdì non posso. Possiamo spostare l’incontro a
          domenica?`。只換建議日子。
