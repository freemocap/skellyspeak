sections:
  - subskill_id: wants_intentions
    explanation: Voglio 加不定式可以表達願望或意圖；vorrei 語氣柔和啲。係願望定請求，兩者都要靠語境分辨。
    examples:
      - text: Voglio frequentare un corso di disegno.
        meaning: 我想報讀畫畫班。
        note: Voglio 係 volere 嘅第一人稱形式，frequentare 維持不定式。呢句係願望，唔係約定咗嘅承諾。
  - subskill_id: preferences
    explanation: Preferire 可以比較兩種活動嘅喜好。如果兩個動作由同一個人做，後面可以接不定式。
    examples:
      - text: Preferisco camminare invece di prendere l’autobus.
        meaning: 比起搭巴士，我鍾意行路多啲。
        note: Preferisco 引出較鍾意嘅活動；invece di 引出另一個選項。
  - subskill_id: emotions
    explanation: Essere 加合適形容詞可以表達情緒。Felice 嘅男女單數形式相同，複數就係 felici。
    examples:
      - text: Sono felice del risultato.
        meaning: 我對個結果好滿意。
        note: Sono felice 描述講者心情；del risultato 交代為乜嘢開心。
  - subskill_id: opinions
    explanation: Secondo me 引出個人判斷，後面嘅評價交代具體立場。
    examples:
      - text: Secondo me, questo progetto costa troppo.
        meaning: 我覺得呢個計劃太貴。
        note: Secondo me 將判斷歸於講者；troppo 係評價成本過高，唔係單純報金額。
  - subskill_id: agreement_disagreement
    explanation: Non sono d’accordo 可以反對已知立場。有需要時，講清楚分歧喺邊。
    examples:
      - text: "Non sono d’accordo: il percorso è troppo lungo."
        meaning: 我唔同意：條路太長。
        note: 回應人哋話呢條路適合短途散步；第二個分句解釋反對原因。
