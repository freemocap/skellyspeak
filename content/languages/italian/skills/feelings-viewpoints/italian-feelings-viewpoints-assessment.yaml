skill_id: feelings_viewpoints
guidance: Identify wants or intentions, preference, emotional states, personal evaluations and
  agreement or disagreement. Voglio frequentare un corso expresses a wish or intended action; it
  does not promise participation. Preferisco camminare selects a preference; mi piacciono i
  funghi describes liking with plural agreement. Mi piace i funghi, intended as that
  construction, is unsuccessful if no separate correct viewpoint function occurs. Sono felice
  del risultato expresses emotion. Secondo me, il progetto costa troppo frames an evaluation; an
  ordinary factual assertion alone need not express a personal opinion. Non sono d'accordo needs
  a recoverable position being disputed. Sì after an evaluative claim can align contextually,
  but after an invitation may accept action and after an explanation may merely acknowledge.
  Vorrei can soften a wish or a service request; determine its role from the exchange. The same
  wording can have more than one supported function, but never infer feelings from punctuation
  or the partner's evaluation alone.
