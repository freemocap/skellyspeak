sections:
  - subskill_id: opening_closing
    explanation: Ciao 可以非正式噉打招呼或道別；a domani 道別兼表示預計聽日再見。
    examples:
      - text: Devo andare. A domani!
        meaning: 我要走喇，聽日見！
        note: 第一句交代要離開；a domani 唔使完整句都可以結束交談。
  - subskill_id: acknowledging
    explanation: Ho capito 等回應可以表示明白頭先嘅解釋。收到或理解訊息，唔自動等於同意內容。
    examples:
      - text: Ora ho capito la differenza.
        meaning: 我而家明白有乜分別喇。
        note: 對方解釋兩個選項後，呢句確認理解。Ho capito 係 capire 嘅複合形式。
  - subskill_id: clarification
    explanation: Che cosa intendi con …? 問對方某個表達係乜意思；要澄清嘅詞要喺前文搵得返。
    examples:
      - text: Che cosa intendi con «provvisorio»?
        meaning: 你講「暫定」係咩意思？
        note: 對方形容計劃係 provvisorio 後，用呢句問清楚。Intendi 非正式噉稱呼一個人。
  - subskill_id: rephrasing
    explanation: In altre parole 引出另一種講法，應保留或解釋原意，唔好突然轉去無關資料。
    examples:
      - text: In altre parole, dobbiamo confermare prima di prenotare.
        meaning: 即係話，我哋要確認咗先訂。
        note: 解釋預訂需要先確認後，再直接講清楚呢個次序。
  - subskill_id: correcting_misunderstanding
    explanation: Intendevo …, non … 用正確意思取代誤解；對比要針對一個可識別嘅誤會。
    examples:
      - text: Intendevo il cortile, non il parcheggio.
        meaning: 我係指庭院，唔係停車場。
        note: 對方以為約喺停車場見，講者就指出真正地點並排除錯誤嗰個。
  - subskill_id: turns_topics
    explanation: Posso aggiungere 問句可以爭取就話題補充發言，作用係攞發言機會，唔係單純陳述資料。
    examples:
      - text: Posso aggiungere una cosa sul prezzo?
        meaning: 關於價錢，我可唔可以補充少少？
        note: 討論快作決定時，就價錢要求發言。Sul 係 su 加 il。
