sections:
  - subskill_id: identification
    explanation: When introducing a colleague, you can identify the person and explain your connection
      to them. Italian uses a form of `essere`, to be, with the identifying noun phrase. Here the
      colleague is Sara, and the words referring to her have feminine singular agreement.
    examples:
      - text: Questa è la mia collega Sara.
        meaning: “This is my colleague Sara.” `Questa` points to her, `è` identifies her and `la mia collega
          Sara` gives the relationship and name. `Collega` can refer to a man or woman; `la mia`
          makes the feminine agreement clear here.
        note: >-
          **Adapt it.** `Questo è il mio collega Luca` introduces a male colleague: the article,
          possessive and demonstrative change, but `collega` keeps its ending. Ordinary possessive
          phrases such as `la mia collega` include the article.


          **Try it.** Introduce your female colleague Anna. Answer: `Questa è la mia collega Anna`.
          Replace the name and keep the feminine forms.
  - subskill_id: qualities_states
    explanation: Before leaving a room, it may matter whether the windows are open. An adjective after
      `essere` describes their state and agrees with the subject. Italian does not require a
      separate verb simply because a state may change.
    examples:
      - text: Le finestre sono aperte.
        meaning: “The windows are open.” `Le finestre` is feminine plural; `sono` is the plural verb.
          `Aperte` means open and takes feminine plural agreement with the windows, even though it
          follows the verb.
        note: >-
          **Adapt it.** `La finestra è aperta` describes one window. `Le finestre sono chiuse`
          describes the opposite state. The adjective must still agree after the verb.


          **Try it.** Say the door is open with `la porta`. Answer: `La porta è aperta`. Use
          singular `è` and feminine singular `aperta`.
  - subskill_id: location_movement
    explanation: Someone looking for a pharmacy needs a landmark they can find. A location phrase can
      place the pharmacy relative to a station. The expression `accanto a` means next to; its final
      preposition combines with the landmark’s article.
    examples:
      - text: La farmacia è accanto alla stazione.
        meaning: “The pharmacy is next to the station.” `La farmacia` is the place to find, `è` locates it
          and `accanto alla stazione` gives the reference point. `Alla` combines `a` with feminine
          singular `la`.
        note: >-
          **Compare.** `Vado alla stazione` describes going to the station, not being beside it.
          `Accanto al museo` changes the landmark; `a` and `il` combine as `al`.


          **Try it.** Locate the pharmacy beside the museum. Answer: `La farmacia è accanto al
          museo`. Keep the whole expression `accanto a` and combine its preposition with the
          article.
  - subskill_id: possession_relations
    explanation: If you want to borrow equipment, naming the person who has it can help. This sentence
      first identifies a family relationship, then says what the sister owns. Italian normally omits
      the article before an unmodified singular close-family noun with a possessive such as `mia`.
    examples:
      - text: Mia sorella ha una macchina da cucire.
        meaning: “My sister has a sewing machine.” `Mia sorella` identifies the speaker’s sister. `Ha` means
          has, while `una macchina da cucire` names a sewing machine. Here `da cucire` describes
          what the machine is for.
        note: >-
          **Compare.** `Le mie sorelle` names several sisters and includes the article. `La mia
          macchina` also needs an article: the singular-family exception does not apply to an
          object.


          **Try it.** Say your brother has a sewing machine with `mio fratello`. Answer: `Mio
          fratello ha una macchina da cucire`. The owner changes; `ha` still refers to one person.
  - subskill_id: quantity_comparison
    explanation: Choosing furniture may involve both counting what is available and comparing its
      weight. A number gives the quantity. The expression `più` followed by an adjective compares a
      quality, and di introduces the other items being compared here.
    examples:
      - text: Abbiamo quattro sedie. Questa sedia è più leggera delle altre.
        meaning: "“We have four chairs. This chair is lighter than the others.” `Abbiamo quattro sedie`
          gives the count. `Questa sedia` selects one chair; `più leggera` says lighter. `Delle
          altre` means than the others: `delle` combines `di` and plural `le`."
        note: >-
          **Adapt it.** `Questo tavolo è più leggero degli altri` compares masculine tables, so the
          agreement and combined article change. Keep the accent in `più`.


          **Try it.** Say this chair is heavier than the others with `pesante`. Answer: `Questa
          sedia è più pesante delle altre`. Replace the quality; the feminine comparison group stays
          the same.
