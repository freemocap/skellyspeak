skill_id: time_events
guidance: Evaluate current or habitual events, past and future reference, duration or
  recurrence, sequence and event phase. Sto sistemando gli attrezzi presents an activity in
  progress; a suitable simple present also works. Ho comprato i pennelli ieri reports a past
  event with an auxiliary and participle. Ieri ho comprare, intended as that ordinary compound
  past, is unsuccessful alone. Accept contextually appropriate imperfetto and passato remoto
  rather than prescribing one past form throughout Italy. Domani il corso comincia alle nove
  expresses future scheduling without requiring a future inflection. Lavoro qui da sei mesi
  measures a situation continuing now; ogni venerdì marks recurrence. Prima prepariamo il
  tavolo, poi mettiamo i piatti orders actions, without asserting causation. Ho finito di
  dipingere marks completion; smettere can instead mean interruption. After Quando hai
  telefonato?, Ieri sera completes earlier-event reference contextually. A property statement
  with è alone need not establish temporal meaning. A conditional used to soften a current
  request is not past-event evidence.
