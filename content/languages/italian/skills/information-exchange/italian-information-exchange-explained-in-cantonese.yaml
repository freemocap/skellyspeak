sections:
  - subskill_id: asking_information
    explanation: 想參加課程，開始時間就係要問嘅資料。`a che ora` 問幾點。問句講出活動同日子，對方先知道你要邊個開始時間。
    examples:
      - text: A che ora comincia il corso domani?
        meaning: 意思係「聽日個課程幾點開始？」`A che ora` 問鐘點。`Comincia` 係開始，`il corso` 指活動，`domani`
          指日子。呢度主語喺動詞後面，唔使加另一個問句動詞。
        note: |-
          **比較。** `Dove comincia il corso?` 改問地方。`Quando comincia il corso?` 問時間較廣，可以用日期回答。

          **試吓。** 用 `la riunione` 問會議幾點開始。答案：`A che ora comincia la riunione?`。換活動，保留單數動詞。
  - subskill_id: answering_information
    explanation: 問完開始時間，用短短鐘點短語就可以回答，唔使重複成個活動。之前問題已經指出乜活動同邊日，回答只需補上時間。
    examples:
      - text: Alle nove.
        meaning: 意思係「九點」。`Alle` 由 `a` 同 `le` 合成，`nove` 指鐘點。接住 `A che ora comincia il corso?`，對方會理解為課程九點開始。
        note: |-
          **改一改。** `Alle dieci` 換成十點。一點嘅表達用單數：`all’una`。只講鐘點唔可以回答課程喺邊度。

          **試吓。** 用一點回答開始時間。答案：`All’una`。用單數鐘點表達，唔係 `alle`。
  - subskill_id: checking_facts
    explanation: 記得課程九點開始，可以請人核實。陳述後面加 `vero`? 提出你記得嘅資料，請對方同意或者更正。呢種唔同完全開放嘅時間問題。
    examples:
      - text: Il corso comincia alle nove, vero?
        meaning: 意思係「課程九點開始，係咪？」`Il corso comincia alle nove` 講預期時間。`Vero?`
          呢度解係咪，令句子成為確認請求。對方可以確認，亦可以提供另一個時間。
        note: |-
          **比較。** `A che ora comincia il corso?` 冇提出時間。`No, alle dieci` 直接更正估計。陳述主語換咗，`vero?` 都保持一樣。

          **試吓。** 核實會議十點開始。答案：`La riunione comincia alle dieci, vero?`。先講要核實嘅資料，再加確認語。
  - subskill_id: useful_detail
    explanation: 第一次去某棟樓，對方可能需要唔只地址。指出入口喺邊一面，再加附近地標，有助揀啱路入去。兩個地方短語可以更準確描述同一個入口。
    examples:
      - text: L’ingresso è sul retro, vicino al parcheggio.
        meaning: 意思係「入口喺後面，近停車場」。`L’ingresso` 指入口。`Sul retro` 指後面；`vicino al parcheggio` 提供地標。`Sul` 由 `su` 同
          `il` 合成；`al` 由 `a` 同 `il` 合成。
        note: |-
          **改一改。** `Vicino alla stazione` 換成車站，改用陰性 `alla`。加長答案時，每段資料有助搵入口先有用。

          **試吓。** 講入口近車站。答案：`L’ingresso è vicino alla stazione`。`Vicino a` 保留介詞，同 `la` 合成一個字。
