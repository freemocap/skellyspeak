sections:
  - subskill_id: asking_information
    explanation: If you plan to attend a course, its starting time is a useful missing detail. `A che
      ora` asks at what time. The question names the event and day so the listener knows which start
      time you need.
    examples:
      - text: A che ora comincia il corso domani?
        meaning: “What time does the course start tomorrow?” `A che ora` asks the clock time. `Comincia`
          means starts; `il corso` identifies the event and `domani` identifies the day. The subject
          follows the verb here; Italian does not insert an extra question verb.
        note: >-
          **Compare.** `Dove comincia il corso?` asks where instead. `Quando comincia il corso?`
          asks when more broadly and may be answered with a date.


          **Try it.** Ask what time the meeting starts with `la riunione`. Answer: `A che ora
          comincia la riunione?`. Replace the event while keeping the singular verb.
  - subskill_id: answering_information
    explanation: After a question about a start time, a short time phrase can answer without repeating
      the whole event. The earlier question supplies what starts and on which day. The reply only
      needs to supply the missing clock time.
    examples:
      - text: Alle nove.
        meaning: “At nine.” `Alle` combines `a` with `le`; `nove` gives the hour. After `A che ora comincia
          il corso?`, the listener understands that nine is the course’s starting time.
        note: >-
          **Adapt it.** `Alle dieci` changes the answer to ten. For one o’clock the phrase is
          singular: `all’una`. An hour alone would not answer a question asking where the course
          takes place.


          **Try it.** Answer the starting-time question with one o’clock. Answer: `All’una`. Use the
          singular hour expression rather than `alle`.
  - subskill_id: checking_facts
    explanation: If you remember a course starting at nine, you can ask someone to confirm that detail.
      A statement followed by `vero`? proposes the information and invites agreement or correction.
      It is different from asking a completely open time question.
    examples:
      - text: Il corso comincia alle nove, vero?
        meaning: “The course starts at nine, right?” `Il corso comincia alle nove` states the expected time.
          `Vero?` means right? here and turns it into a confirmation request. The listener can
          confirm it or supply a different time.
        note: >-
          **Compare.** `A che ora comincia il corso?` does not propose a time. `No, alle dieci`
          corrects the guess directly. `Vero?` stays the same when the statement’s subject changes.


          **Try it.** Check that the meeting starts at ten. Answer: `La riunione comincia alle
          dieci, vero?`. Put the proposed fact before the confirmation tag.
  - subskill_id: useful_detail
    explanation: Someone arriving at an unfamiliar building may need more than its address. Naming the
      entrance’s side and a nearby landmark helps them choose the right way in. Two place phrases
      can locate the same entrance more precisely.
    examples:
      - text: L’ingresso è sul retro, vicino al parcheggio.
        meaning: “The entrance is at the back, near the car park.” `L’ingresso` names the entrance. `Sul
          retro` locates it at the back; `vicino al parcheggio` gives a landmark. `Sul` combines
          `su` and `il`; `al` combines `a` and `il`.
        note: >-
          **Adapt it.** `Vicino alla stazione` changes the landmark to the station and uses feminine
          `alla`. A longer answer is useful when each added detail helps locate the entrance.


          **Try it.** Say the entrance is near the station. Answer: `L’ingresso è vicino alla
          stazione`. The expression `vicino a` keeps its preposition, combined with `la`.
