language: italian
skill_id: information_exchange
guidance: "Assess information questions, relevant answers, checking a proposition and helpful
  precision. A che ora comincia il corso? asks for an unknown time; comincia alle nove, vero?
  checks a proposed time. Italian questions need no English-style do auxiliary. In an ordinary
  exchange, puoi chiudere la finestra? primarily requests action rather than missing
  information. A copied a che ora with no intelligible information need is absent. Alle nove
  after a question about the start time can answer contextually without a full clause. Short
  answers need their actual question: do not infer a time or place from an isolated sì.
  L'ingresso è sul retro, vicino al parcheggio supplies useful detail when someone needs the
  entrance; verbosity alone is not precision. Che cosa vuol dire provvisorio? can repair
  understanding of the partner's word rather than check a fact. A confirmation question is
  direct when it clearly presents the proposition being checked; question punctuation alone does
  not establish the intended function."
