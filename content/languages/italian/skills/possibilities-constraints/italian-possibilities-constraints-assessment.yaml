skill_id: possibilities_constraints
guidance: "Look for ability, permission, obligation, possible outcomes and certainty or doubt.
  So riparare una ruota expresses learned ability; posso entrare? can seek permission from the
  responsible person. Dobbiamo mostrare i biglietti states a requirement. In these modal
  constructions the following action remains infinitive: devo partire works, while devo parto is
  unsuccessful alone. Potere can express practical opportunity, ability or permission; if
  plausible readings all correctly demonstrate a function in this group, subtype ambiguity alone
  does not justify unclear. Forse il negozio è ancora aperto marks a possible state; non so se
  il negozio è aperto establishes a knowledge limit. A simple unqualified assertion does not
  independently demonstrate confidence. A modal question directed at someone else's action can
  be a request, so puoi aprire la porta? need not show their ability. Posso after a clearly
  identified permission question can complete the modal meaning contextually. A copied posso
  with no recoverable proposition is insufficient; inspect the exchange before inferring the
  function."
