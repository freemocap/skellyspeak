sections:
  - subskill_id: ability
    explanation: 個轆要整，對方想知你識唔識。`sapere` 加不定式可以表達識點做。佢講學識嘅能力，唔係今日有冇工具或者時間。
    examples:
      - text: So riparare una ruota.
        meaning: 意思係「我識整轆」。`So` 係 `sapere` 表示講者嘅形式；`riparare` 用不定式指出技能。`Una ruota` 係一個轆。`So` 同 `riparare`
          之間冇介詞。
        note: >-
          **比較。** `Posso riparare la ruota oggi` 講今日情況容許整。識點做同今日做唔做到可以唔同。`Non so riparare una ruota`
          否定技能。


          **試吓。** 講佢識整轆。答案：`Sa riparare una ruota`。將 `so` 換成 `sa`，活動保持不定式。
  - subskill_id: permission
    explanation: 將袋放喺人哋地方之前，可能要先問准。`posso` 問句問自己嘅行動可唔可以。不定式指出你想獲准做乜。
    examples:
      - text: Posso lasciare la borsa qui?
        meaning: 意思係「我可唔可以將個袋放喺呢度？」`Posso` 指講者，`lasciare` 係留下，`la borsa` 指個袋，`qui` 指呢度。向負責地方嘅人問，就係請求准許。
        note: >-
          **比較。** `Puoi lasciare la borsa qui?` 換成問對方嘅行動。`Potrei lasciare la borsa qui?`
          就係自己較婉轉嘅請求。語氣同情境都重要。


          **試吓。** 用 `il cappotto` 問准將外套放喺呢度。答案：`Posso lasciare il cappotto qui?`。換物件，保留問自己准許嘅
          `posso`。
  - subskill_id: obligation
    explanation: 活動入口可能要求成班人出示門票。dovere 加不定式表達大家一定要做乜。句子講要求，情境提供邊個作出要求。
    examples:
      - text: Dobbiamo mostrare i biglietti all’ingresso.
        meaning: 意思係「我哋要喺入口出示門票」。`Dobbiamo` 指我哋同必要性。`Mostrare` 係出示，`i biglietti` 指門票。`All’ingresso` 提供地方，由
          `a` 同 `l’ingresso` 合成。
        note: >-
          **改一改。** `Devo mostrare il biglietto` 將人物換成我，門票換成一張。想清楚講出示門票唔係必要，可以用 `Non è necessario
          mostrare il biglietto`，避免只否定義務帶來歧義。


          **試吓。** 用 `il documento` 講我哋要出示文件。答案：`Dobbiamo mostrare il documento`。物件變單數，人物仍然係我哋。
  - subskill_id: possibility
    explanation: 諗緊去唔去間舖，可能估佢仲開住但未肯定。`forse` 將陳述標成可能性。句子其餘部分講你考慮緊嘅情況。
    examples:
      - text: Forse il negozio è ancora aperto.
        meaning: 意思係「可能間舖仲開住」。`Forse` 表達唔確定，`il negozio è aperto` 描述間舖狀態，`ancora` 係仍然。`Aperto` 配合陽性單數
          `negozio`。
        note: >-
          **比較。** 刪走 `forse`，`Il negozio è ancora aperto` 就係肯定陳述，唔係估計。`È già chiuso`
          係已經閂咗，改變狀態同時間關係。


          **試吓。** 用 `la farmacia` 講藥房可能仲開住。答案：`Forse la farmacia è ancora aperta`。換名詞，`aperta` 改用陰性。
  - subskill_id: certainty
    explanation: 有時你冇資料確認間舖開唔開。`non so se` 引出未知道答案嘅問題。佢講你唔知乜，唔係話間舖已經閂咗。
    examples:
      - text: Non so se il negozio è aperto.
        meaning: 意思係「我唔知間舖開唔開」。`Non so` 係我唔知。`Se il negozio è aperto` 提供未知內容：間舖開唔開。呢度 `se`
          引出間接問句，唔係另一個行動嘅條件。
        note: >-
          **比較。** `Se il negozio è aperto, entriamo` 係條件：開就入去。`So che il negozio è aperto` 聲稱知道，用
          `che` 引出已知事實。


          **試吓。** 講唔知課程係咪九點開始。答案：`Non so se il corso comincia alle nove`。保留未知開頭，換後面嘅問題。
