language: russian
skill_id: information_exchange
guidance: Look for actual information questions, relevant answers, factual checking and useful
  detail. Во сколько закрывается мастерская? asks a closing time; В пять часов answers it
  contextually without repeating the event. Мастерская закрывается в пять, верно? checks a
  proposed fact. A question about whether the listener can help often requests an action rather
  than merely seeking a capability report. Вход со стороны двора can supply the identifying
  detail needed to find an entrance. More words are not automatically more useful information. A
  copied вопрос or сколько without an intelligible question is absent. Переспросите, пожалуйста
  asks for conversational repair rather than confirming an external fact. Preserve ordinary
  short answers and flexible question order; do not require English auxiliary inversion. If the
  preceding exchange is unavailable, do not invent the referent that would make an otherwise
  ambiguous fragment a successful answer.
