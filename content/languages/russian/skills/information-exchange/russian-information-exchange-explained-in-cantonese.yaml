sections:
  - subskill_id: asking_information
    explanation: Во сколько問事件喺幾點發生。
    examples:
      - text: Во сколько закрывается мастерская?
        meaning: 間工場幾點閂門？
        note: 未知資料係關門時間，唔係有冇工場。
  - subskill_id: answering_information
    explanation: 介詞時間短語可以直接回答上句。
    examples:
      - text: В пять часов.
        meaning: 五點鐘。
        note: 回應關門時間問題，前文提供省略咗嘅事件。
  - subskill_id: checking_facts
    explanation: 命題後加верно，邀請確認所提供資料。
    examples:
      - text: Мастерская закрывается в пять, верно?
        meaning: 間工場五點閂門，係咪？
        note: 提出五點作待核實資料。
  - subskill_id: useful_detail
    explanation: 位置描述可以幫聽者分辨所需入口。
    examples:
      - text: Вход со стороны двора.
        meaning: 入口喺庭院嗰邊。
        note: 回應點搵入口嘅問題，提供有用地標。
