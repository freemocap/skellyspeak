sections:
  - subskill_id: identification
    explanation: You point out a neighbour to someone meeting her. `Это` introduces the person being identified;
      `моя соседка` is feminine singular, so possessive `моя` matches `соседка`. A present-tense “is” is
      normally omitted in this direct identification.
    examples:
      - text: Это моя соседка.
        meaning: This is my neighbour.
        note: "Try introducing your sister. Answer: `Это моя сестра.` `Это` still identifies a person; feminine `моя`
          matches `сестра`."
  - subskill_id: qualities_states
    explanation: Someone asks what this street is like. `Эта улица` is feminine singular, so demonstrative `эта`
      and adjective `узкая` agree with `улица`. The adjective directly predicates a property in the present;
      Russian does not need a separate present-tense linking verb here.
    examples:
      - text: Эта улица узкая.
        meaning: This street is narrow.
        note: "Try describing this room as narrow. Answer: `Эта комната узкая.` Both `эта` and `узкая` remain feminine
          singular to match `комната`."
  - subskill_id: location_movement
    explanation: Someone is looking for a key lying on a shelf. `Ключ` is the thing located; `лежит` describes its
      resting position. `На полке` uses `на` plus prepositional case for a static place on a surface. Movement
      onto a shelf would require a different construction, such as `положить на полку`.
    examples:
      - text: Ключ лежит на полке.
        meaning: The key is on the shelf.
        note: "Try saying the key is lying on the table. Answer: `Ключ лежит на столе.` `Лежит` still describes a
          resting position; `на столе` changes the static location."
  - subskill_id: possession_relations
    explanation: You are counting boxes available for a task. `У меня` uses `у` plus genitive to identify the
      possessor; `есть` asserts that the boxes exist in your possession. `Две` is the feminine form of two,
      matching `коробка`; after this numeral the counted noun appears as `коробки`. This differs from using a
      direct equivalent of English “I have.”
    examples:
      - text: У меня есть две коробки.
        meaning: I have two boxes.
        note: "Try saying you have three boxes. Answer: `У меня есть три коробки.` The possession frame remains; `три
          коробки` counts three with the appropriate noun form."
  - subskill_id: quantity_comparison
    explanation: You are choosing which box is easier to carry. `Эта коробка` identifies the box being compared;
      `легче` means lighter. `Той` is the genitive form of “that one,” supplying the comparison standard
      without `чем`. The form compares weights, not the number of boxes.
    examples:
      - text: Эта коробка легче той.
        meaning: This box is lighter than that one.
        note: "Try saying this box is heavier than that one. Answer: `Эта коробка тяжелее той.` `Тяжелее` reverses the
          weight judgment; genitive `той` remains the comparison standard."
