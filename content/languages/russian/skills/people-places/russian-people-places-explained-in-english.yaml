sections:
  - subskill_id: identification
    explanation: Это introduces an identification. A present-tense linking verb is normally unnecessary.
    examples:
      - text: Это моя соседка.
        meaning: This is my neighbour.
        note: Моя agrees with the feminine noun соседка; the identified neighbour is female.
  - subskill_id: qualities_states
    explanation: A property can be predicated directly, with the adjective agreeing with its subject.
    examples:
      - text: Эта улица узкая.
        meaning: This street is narrow.
        note: Эта and узкая are feminine singular, matching улица.
  - subskill_id: location_movement
    explanation: На with the prepositional case locates the key on a surface. The verb describes its
      position.
    examples:
      - text: Ключ лежит на полке.
        meaning: The key is on the shelf.
        note: Полке is the prepositional form of полка. A destination would require a different
          construction.
  - subskill_id: possession_relations
    explanation: У plus a genitive possessor and есть can express possession. Counted nouns have
      number-dependent forms.
    examples:
      - text: У меня есть две коробки.
        meaning: I have two boxes.
        note: Меня follows у; две agrees with the feminine counted noun, whose form here is коробки.
  - subskill_id: quantity_comparison
    explanation: A comparative can take a genitive standard without чем.
    examples:
      - text: Эта коробка легче той.
        meaning: This box is lighter than that one.
        note: Легче compares weight. Той stands for the other box, so the noun need not be repeated.
