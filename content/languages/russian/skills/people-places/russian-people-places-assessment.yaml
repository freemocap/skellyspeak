skill_id: people_places
guidance: Assess identification, properties, location or movement, possession or relationships,
  and quantity or comparison. Это моя соседка identifies a person without an obligatory present
  copula. Эта улица узкая predicates a property; relevant adjective and demonstrative agreement
  matters. Ключ лежит на полке locates an object; к двери expresses a destination with the
  dative. У меня есть две коробки states possession with у and the genitive, not an
  English-style have verb. Две коробки counts objects, whereas автобус номер два identifies a
  route. Легче compares weight without an obligatory чем when the standard is genitive. На полке
  can answer a where-question contextually. An isolated copied preposition with no recoverable
  relation is absent. Flexible word order is not itself incorrect. Judge the case or agreement
  involved in the demonstrated relation without making unrelated mistakes erase correct
  evidence.
