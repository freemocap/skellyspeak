sections:
  - subskill_id: identification
    explanation: 你向人介紹一位女鄰居。`Это` 引出要辨認嘅人；`моя соседка` 係陰性單數，所以物主詞 `моя` 配合 `соседка`。呢種直接介紹一般唔加現在式嘅「係」。
    examples:
      - text: Это моя соседка.
        meaning: 呢位係我鄰居。
        note: 試吓介紹你嘅姐姐或妹妹。答案：`Это моя сестра.` `Это` 仍用嚟辨認人物；陰性 `моя` 配合 `сестра`。
  - subskill_id: qualities_states
    explanation: 有人問呢條街點樣。`Эта улица` 係陰性單數，指示詞 `эта` 同形容詞 `узкая` 都配合 `улица`。形容詞直接講目前特質，俄語呢度毋須另加現在式繫詞。
    examples:
      - text: Эта улица узкая.
        meaning: 呢條街好窄。
        note: 試吓話呢間房窄。答案：`Эта комната узкая.` `эта` 同 `узкая` 都保持陰性單數，配合 `комната`。
  - subskill_id: location_movement
    explanation: 有人搵放喺架上嘅鎖匙。`Ключ` 係被定位嘅物件；`лежит` 講佢平放嘅狀態。`на полке` 用 `на` 加前置格表示表面上嘅靜態位置；搬上架就要另一種結構，例如
      `положить на полку`。
    examples:
      - text: Ключ лежит на полке.
        meaning: 鎖匙喺個架上面。
        note: 試吓話鎖匙平放喺枱面。答案：`Ключ лежит на столе.` `лежит` 仍講靜態位置；`на столе` 改成喺枱面。
  - subskill_id: possession_relations
    explanation: 你點算手上可用嘅箱。`У меня` 用 `у` 加屬格指出持有人；`есть` 肯定有呢啲箱。`Две` 係「二」嘅陰性形式，配合 `коробка`；數詞後名詞用
      `коробки`。句式唔係逐字照英文「我有」砌。
    examples:
      - text: У меня есть две коробки.
        meaning: 我有兩個箱。
        note: 試吓話你有三個箱。答案：`У меня есть три коробки.` 持有結構不變；`три коробки` 用相應名詞形式數三個。
  - subskill_id: quantity_comparison
    explanation: 你揀邊個箱容易搬。`Эта коробка` 指被比較嘅箱；`легче` 係較輕。`Той` 係「嗰個」嘅屬格，不用 `чем` 都可以做比較基準。句子比較重量，唔係箱嘅數量。
    examples:
      - text: Эта коробка легче той.
        meaning: 呢個箱比嗰個輕。
        note: 試吓話呢個箱比嗰個重。答案：`Эта коробка тяжелее той.` `тяжелее` 將重量判斷反轉；屬格 `той` 仍係比較基準。
