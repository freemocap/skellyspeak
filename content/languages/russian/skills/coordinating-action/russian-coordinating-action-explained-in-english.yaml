skill_id: coordinating_action
explanation_language: english
shared_explanation: skills/coordinating-action/coordinating-action-explained-in-english.yaml
sections:
  - subskill_id: requests
    explanation: A colleague is loading boxes through the door, and you ask them to bring a particular box near
      it. `Перенесите` is the completed-action imperative addressed politely to one person or to several
      people. `Эту коробку` names the object in the accusative; `к двери` gives the destination with `к` plus
      dative. `Пожалуйста` softens the request; the verb form alone does not determine courtesy.
    examples:
      - text: Перенесите эту коробку к двери, пожалуйста.
        meaning: Please move this box to the door.
        note: "Try asking for that box to be moved to the window instead. Answer: `Перенесите эту коробку к окну,
          пожалуйста.` The request keeps the same polite imperative and accusative object; `к окну` changes
          the destination to the window."
  - subskill_id: offers_invitations
    explanation: Someone is carrying a heavy bag and you offer to help. `Вам` identifies the person who would
      receive the help; `помочь` is an infinitive, so the question offers an action by the speaker rather than
      asking whether the other person has the ability. `С сумкой` uses `с` plus instrumental to name what the
      help concerns.
    examples:
      - text: Вам помочь с сумкой?
        meaning: Shall I help you with the bag?
        note: "Try offering help with a box. Answer: `Вам помочь с коробкой?` The infinitive question still offers
          your own help; `с коробкой` names the new item in the instrumental."
  - subskill_id: suggestions
    explanation: The group has been working for a while, so you propose a shared break. `Давайте` includes the
      listeners in a proposal; `сделаем` is first-person plural perfective, presenting taking the break as the
      next bounded action. This is a joint suggestion, not an instruction for the listener alone.
    examples:
      - text: Давайте сделаем перерыв.
        meaning: Let’s take a break.
        note: "Try proposing that the group check the list together. Answer: `Давайте проверим список.` `Давайте`
          includes everyone, and first-person plural `проверим` names the proposed completed check."
  - subskill_id: commitments
    explanation: The team is dividing tasks, and you take responsibility for bringing the tools. `Я` names the
      person taking the task; `принесу` is a perfective nonpast form with future reference, and `завтра` fixes
      the time. The surrounding allocation makes the statement a commitment; the future form by itself can
      also simply predict an event.
    examples:
      - text: Я принесу инструменты завтра.
        meaning: I will bring the tools tomorrow.
        note: "Try taking responsibility for bringing the key tomorrow. Answer: `Я принесу ключ завтра.` `Я` keeps the
          speaker responsible, and perfective future `принесу` presents the delivery as one completed task."
  - subskill_id: accepting_declining
    explanation: A colleague has invited you today, but you cannot come. `Извините` acknowledges the social cost of
      declining; `сегодня` limits the inability to today. `Не могу прийти` expresses that you cannot attend,
      with `прийти` naming arrival at the event. In context it refuses the invitation, even without an
      explicit word for no.
    examples:
      - text: Извините, сегодня я не могу прийти.
        meaning: Sorry, I cannot come today.
        note: "Try declining a visit tomorrow. Answer: `Извините, завтра я не могу прийти.` The apology remains, while
          `завтра` shifts the relevant invitation to tomorrow."
  - subskill_id: negotiating_plans
    explanation: A Friday meeting conflicts with your schedule, but Saturday is free. `В пятницу` names the day of
      the conflict; `я не могу` leaves the unavailable action recoverable from the invitation. `Давайте
      встретимся` proposes a shared meeting, and `в субботу` supplies the replacement day. The second sentence
      moves the plan forward instead of merely refusing.
    examples:
      - text: В пятницу я не могу. Давайте встретимся в субботу.
        meaning: I cannot on Friday. Let’s meet on Saturday.
        note: "Try saying Friday is impossible and proposing Sunday instead. Answer: `В пятницу я не могу. Давайте
          встретимся в воскресенье.` The first sentence preserves the constraint; `в воскресенье` supplies the
          alternative."
