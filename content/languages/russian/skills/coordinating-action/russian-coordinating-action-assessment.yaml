skill_id: coordinating_action
guidance: Assess requests, offers or invitations, suggestions, commitments, acceptance or
  refusal, and plan negotiation. Перенесите коробку, пожалуйста requests action; Вам помочь?
  offers help through a question with an infinitive. Давайте сделаем перерыв proposes a shared
  next step. Я принесу инструменты завтра can commit to an agreed task, but an unrelated future
  prediction is not automatically a promise. Сегодня не могу прийти declines a contextually
  identifiable invitation; naming Saturday instead can negotiate an alternative. Да contextually
  accepts an actual offer, not every preceding assertion. A copied давайте without a recoverable
  proposal is absent. Imperfective and perfective imperatives have discourse-sensitive uses;
  neither aspect alone proves politeness or error. Judge whether the action and participants are
  successfully coordinated, allowing ordinary omitted pronouns and polite plural forms for a
  single addressee.
