skill_id: coordinating_action
explanation_language: cantonese
shared_explanation: skills/coordinating-action/coordinating-action-explained-in-cantonese.yaml
sections:
  - subskill_id: requests
    explanation: 同事準備由門口搬箱出去，你請佢將指定嘅箱搬到門邊。`Перенесите` 係完成動作嘅命令式，可禮貌噉對一人或多人講；`эту коробку` 係受動作影響嘅箱，用賓格；`к двери`
      用 `к` 加與格講目的地。`пожалуйста` 緩和要求，單靠動詞形式唔能夠判斷禮貌程度。
    examples:
      - text: Перенесите эту коробку к двери, пожалуйста.
        meaning: 唔該搬呢個箱去門口。
        note: 試吓改為請對方搬同一個箱去窗邊。答案：`Перенесите эту коробку к окну, пожалуйста.` 命令式同賓格物件不變；`к окну` 將目的地改成窗邊。
  - subskill_id: offers_invitations
    explanation: 對方拎住重袋，你提出幫手。`Вам` 指受幫助嘅人；`помочь` 係不定式，呢條問句係提出由講者幫忙，唔係查問對方有冇能力。`с сумкой` 用 `с` 加工具格講幫忙處理乜。
    examples:
      - text: Вам помочь с сумкой?
        meaning: 要唔要我幫你拎個袋？
        note: 試吓提出幫對方處理個箱。答案：`Вам помочь с коробкой?` 不定式問句仍係由你提出幫忙；`с коробкой` 用工具格指出新物件。
  - subskill_id: suggestions
    explanation: 大家做咗一陣工，你提議一齊休息。`Давайте` 將聽者包括喺提議入面；`сделаем` 係第一人稱複數完成體，將休息視為下一項有界動作。呢句係共同建議，唔係淨係叫對方做。
    examples:
      - text: Давайте сделаем перерыв.
        meaning: 不如我哋抖吓。
        note: 試吓提議大家一齊檢查清單。答案：`Давайте проверим список.` `Давайте` 包括大家；第一人稱複數 `проверим` 講明建議完成嘅檢查。
  - subskill_id: commitments
    explanation: 小組分配工作，你承擔聽日帶工具。`Я` 指負責嗰個人；`принесу` 係完成體非過去形式，喺度指將來，`завтра` 指定時間。分工語境令句子成為承諾；單靠將來形式都可以只係預測。
    examples:
      - text: Я принесу инструменты завтра.
        meaning: 聽日我會帶工具嚟。
        note: 試吓承擔聽日帶鎖匙。答案：`Я принесу ключ завтра.` `Я` 保留講者責任；完成體將來式 `принесу` 將帶嚟視為一項完成嘅任務。
  - subskill_id: accepting_declining
    explanation: 同事邀請你今日去，但你去唔到。`Извините` 為拒絕帶來嘅不便致歉；`сегодня` 將限制放喺今日。`не могу прийти` 表示無法到場；喺邀請語境，即使冇直接講「唔」，都係拒絕。
    examples:
      - text: Извините, сегодня я не могу прийти.
        meaning: 唔好意思，我今日嚟唔到。
        note: 試吓拒絕聽日嗰次拜訪。答案：`Извините, завтра я не могу прийти.` 道歉保留，`завтра` 將相關邀請轉到聽日。
  - subskill_id: negotiating_plans
    explanation: 星期五開會同你行程撞咗，但星期六得閒。`В пятницу` 指衝突日子；`я не могу` 省略咗對話已知嘅活動。`Давайте встретимся` 提議一齊見面，`в
      субботу` 補上替代日子。第二句令安排繼續，而唔只係拒絕。
    examples:
      - text: В пятницу я не могу. Давайте встретимся в субботу.
        meaning: 我星期五唔得。不如星期六見。
        note: 試吓講星期五唔得，改提星期日。答案：`В пятницу я не могу. Давайте встретимся в воскресенье.` 第一句保留限制；`в воскресенье`
          提供替代日子。
