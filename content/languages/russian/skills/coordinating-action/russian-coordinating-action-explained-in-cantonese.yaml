sections:
  - subskill_id: requests
    explanation: 禮貌或複數命令式配合пожалуйста，可以請對方行動。
    examples:
      - text: Перенесите эту коробку к двери, пожалуйста.
        meaning: 唔該搬呢個箱去門口。
        note: К двери指出目的地；完成體命令式要求完成今次搬動。
  - subskill_id: offers_invitations
    explanation: 不定式問句可以主動提出幫忙。
    examples:
      - text: Вам помочь с сумкой?
        meaning: 要唔要我幫你拎個袋？
        note: Вам指接受幫助嘅人；講者提出由自己行動。
  - subskill_id: suggestions
    explanation: Давайте配合第一人稱複數形式，提議共同行動。
    examples:
      - text: Давайте сделаем перерыв.
        meaning: 不如我哋抖吓。
        note: 講者將自己包括喺休息提議內。
  - subskill_id: commitments
    explanation: 分配工作時，將來陳述可以承擔一項工作。
    examples:
      - text: Я принесу инструменты завтра.
        meaning: 聽日我會帶工具嚟。
        note: 安排事情時用，表示接受帶工具嘅責任。
  - subskill_id: accepting_declining
    explanation: 適當語境下，表達冇辦法出席可以婉拒邀請。
    examples:
      - text: Извините, сегодня я не могу прийти.
        meaning: 唔好意思，我今日嚟唔到。
        note: 收到今日嘅邀請後用，清楚交代拒絕嘅行動。
  - subskill_id: negotiating_plans
    explanation: 先講限制，再提出另一個時間，繼續協商。
    examples:
      - text: В пятницу я не могу. Давайте встретимся в субботу.
        meaning: 我星期五唔得。不如星期六見。
        note: 第一句依賴之前嘅見面提議，第二句提供具體替代安排。
