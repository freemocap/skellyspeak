language: russian
skill_id: feelings_viewpoints
guidance: Assess wishes or intentions, preferences, emotions, opinions and alignment with
  another view. Хочу научиться шить expresses a desire to acquire a skill; it is not a promise.
  Мне больше нравится чай, чем кофе compares preferences with a dative experiencer. Я рада этой
  новости expresses emotion, while По-моему marks personal judgment. Я не согласна с этим
  предложением explicitly rejects a proposal. Понятно can acknowledge comprehension without
  agreement. Чай can choose a preferred drink contextually after a preference question; the same
  noun in an inventory is not preference evidence. An isolated copied хочу without a recoverable
  desired action is absent. A neutral fact does not automatically count as an opinion. Assess
  stance-bearing constructions and their relevant agreement, allowing recoverable omitted
  subjects and avoiding assumptions about the speaker’s gender from the user profile alone.
