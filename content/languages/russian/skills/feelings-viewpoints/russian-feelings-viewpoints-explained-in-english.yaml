sections:
  - subskill_id: wants_intentions
    explanation: You are describing a skill you hope to acquire. `Я хочу` expresses the speaker’s wish;
      `научиться` is a perfective infinitive meaning to learn to do something successfully, and `шить` names
      the activity of sewing. Wanting to learn is a desire, not a promise that the skill has already been
      acquired.
    examples:
      - text: Я хочу научиться шить.
        meaning: I want to learn to sew.
        note: "Try expressing a wish to learn to cook. Answer: `Я хочу научиться готовить.` `Хочу` still carries the
          wish; `научиться` plus `готовить` names the skill to acquire."
  - subskill_id: preferences
    explanation: "You are choosing between tea and coffee. `Мне` is the dative experiencer: the person to whom
      something is pleasing. `Нравится` agrees here with singular `чай`; `больше` and `чем кофе` make tea the
      stronger preference and coffee the comparison point. This pattern is different from treating the speaker
      as the grammatical subject of an English like-verb."
    examples:
      - text: Мне больше нравится чай, чем кофе.
        meaning: I prefer tea to coffee.
        note: "Try preferring coffee to tea. Answer: `Мне больше нравится кофе, чем чай.` `Мне` stays the experiencer;
          the two drinks exchange roles around `чем`."
  - subskill_id: emotions
    explanation: You have heard good news and express your own reaction. `Рада` is the feminine singular short
      form of `рад`, matching the speaker in this example; a speaker using masculine singular would say `рад`.
      `Этой новости` is dative and identifies the news that prompts the feeling. The form reports gladness
      rather than a general factual evaluation of the news.
    examples:
      - text: Я рада этой новости.
        meaning: I am glad about this news.
        note: "Try saying, as the same feminine speaker, that you are glad about a friend’s arrival. Answer: `Я рада
          приезду друга.` `Рада` still agrees with the speaker; `приезду друга` identifies the event that
          prompts gladness."
  - subskill_id: opinions
    explanation: You are evaluating a proposed method, not reporting a measured fact. `По-моему` marks the
      judgment as your own view. `Этот способ` is the method under discussion, while comparative `удобнее`
      says it is more convenient than an understood alternative; the comparison standard can stay unstated
      when the conversation supplies it.
    examples:
      - text: По-моему, этот способ удобнее.
        meaning: In my opinion, this method is more convenient.
        note: "Try giving your view that this route is shorter than the other one under discussion. Answer: `По-моему,
          этот путь короче.` `По-моему` marks the personal judgment, and `короче` expresses the comparison."
  - subskill_id: agreement_disagreement
    explanation: A colleague proposes a change, and you reject that proposal. `Я не согласна` is feminine singular
      agreement with the speaker; `не` negates the stance. `С этим предложением` uses `с` plus instrumental to
      identify what you disagree with. The pattern concerns alignment with a view, not whether a factual
      answer is correct.
    examples:
      - text: Я не согласна с этим предложением.
        meaning: I disagree with this proposal.
        note: "Try disagreeing with this plan as the same feminine speaker. Answer: `Я не согласна с этим планом.` The
          negative stance remains, and `с этим планом` gives the new object of disagreement in the
          instrumental."
