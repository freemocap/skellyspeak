sections:
  - subskill_id: wants_intentions
    explanation: 你講想學識一項技能。`Я хочу` 表示講者願望；完成體不定式 `научиться` 係學到識做，`шить` 指縫紉活動。想學唔等於已經學識，亦唔係承諾。
    examples:
      - text: Я хочу научиться шить.
        meaning: 我想學縫紉。
        note: 試吓話想學煮嘢食。答案：`Я хочу научиться готовить.` `хочу` 仍表願望；`научиться` 加 `готовить` 指想習得嘅技能。
  - subskill_id: preferences
    explanation: 你喺茶同咖啡之間揀。`Мне` 係與格感受者，即覺得某樣嘢討好自己嘅人。`нравится` 喺呢度配合單數 `чай`；`больше` 同 `чем кофе`
      表示茶更合心意，咖啡係比較基準。呢個句式唔似英文將「我」當喜歡動詞嘅主語。
    examples:
      - text: Мне больше нравится чай, чем кофе.
        meaning: 比起咖啡，我鍾意茶多啲。
        note: 試吓話比起茶更鍾意咖啡。答案：`Мне больше нравится кофе, чем чай.` `Мне` 仍係感受者；兩種飲品喺 `чем` 前後交換角色。
  - subskill_id: emotions
    explanation: 你聽到好消息，講自己嘅反應。`Рада` 係短尾形容詞 `рад` 嘅陰性單數形式，同呢句嘅講者配合；用陽性單數嘅講者會講 `рад`。`этой новости`
      用與格指出令你高興嘅消息。句子講情緒，唔係純粹評價消息真偽。
    examples:
      - text: Я рада этой новости.
        meaning: 我好高興聽到呢個消息。
        note: 試吓由同一位女性講者話朋友到來令佢高興。答案：`Я рада приезду друга.` `рада` 仍配合講者；`приезду друга` 指令佢高興嘅事情。
  - subskill_id: opinions
    explanation: 你評價討論中嘅方法，唔係報告一個量度結果。`По-моему` 標示係你自己嘅睇法。`этот способ` 指目前方法；比較級 `удобнее` 話佢比語境中另一方法方便，已知比較對象可以唔講出嚟。
    examples:
      - text: По-моему, этот способ удобнее.
        meaning: 我覺得呢個方法方便啲。
        note: 試吓表示你認為呢條路比另一條短。答案：`По-моему, этот путь короче.` `По-моему` 標示個人判斷；`короче` 講比較。
  - subskill_id: agreement_disagreement
    explanation: 同事提出改動，你表明唔同意。`Я не согласна` 喺呢句用陰性單數配合講者；`не` 否定立場。`с этим предложением` 用 `с`
      加工具格指出反對嘅建議。呢個係對觀點表態，唔係查證答案啱唔啱。
    examples:
      - text: Я не согласна с этим предложением.
        meaning: 我唔同意呢個建議。
        note: 試吓由同一位女性講者反對呢個計劃。答案：`Я не согласна с этим планом.` 否定立場不變；`с этим планом` 用工具格指出新嘅反對對象。
