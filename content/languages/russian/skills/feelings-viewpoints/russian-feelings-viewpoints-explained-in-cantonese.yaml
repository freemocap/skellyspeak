sections:
  - subskill_id: wants_intentions
    explanation: Хочу後接不定式，交代講者想做乜。
    examples:
      - text: Я хочу научиться шить.
        meaning: 我想學縫紉。
        note: Научиться突出學識呢種能力；呢個係願望，唔係承諾。
  - subskill_id: preferences
    explanation: Нравится用與格標示有喜好嘅人；больше同чем比較喜好。
    examples:
      - text: Мне больше нравится чай, чем кофе.
        meaning: 比起咖啡，我鍾意茶多啲。
        note: Мне指出邊個嘅喜好；兩種飲品係比較選項。
  - subskill_id: emotions
    explanation: Рад表示高興，要同感受者配合。
    examples:
      - text: Я рада этой новости.
        meaning: 我好高興聽到呢個消息。
        note: 女性講者用рада；形容詞後嘅этой новости係與格。
  - subskill_id: opinions
    explanation: По-моему將後面評價框定為講者觀點。
    examples:
      - text: По-моему, этот способ удобнее.
        meaning: 我覺得呢個方法方便啲。
        note: 比較係評價討論緊嘅方法。
  - subskill_id: agreement_disagreement
    explanation: Согласен配合с同工具格，表示同意；加не就反過來。
    examples:
      - text: Я не согласна с этим предложением.
        meaning: 我唔同意呢個建議。
        note: 講者用陰性согласна，並指出反對嘅建議。
