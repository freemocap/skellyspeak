skill_id: possibilities_constraints
guidance: Recognize ability, permission, obligation, possibility and degrees of confidence. Умею
  чинить names a learned skill. Можно здесь оставить сумку? asks permission from someone
  responsible for the space; можно can also concern practical possibility. Мне нужно вернуть
  ключ expresses necessity with a dative experiencer and infinitive. Нельзя may prohibit an
  action or report that it cannot be achieved; не нужно removes a requirement rather than
  prohibiting it. Возможно, вечером будет дождь leaves an outcome open. Не уверена limits
  certainty about a proposition. Можно can grant a prior permission request contextually. A
  copied modal without a recoverable proposition is absent. Do not count a polite можете request
  automatically as a factual ability assertion. If two plausible readings both demonstrate
  correct group use, subtype uncertainty alone does not make the whole group unclear.
