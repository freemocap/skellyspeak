sections:
  - subskill_id: ability
    explanation: Уметь加不定式描述學識嘅能力。
    examples:
      - text: Я умею чинить велосипеды.
        meaning: 我識整單車。
        note: 句子講實際技能，唔係做今次維修嘅許可。
  - subskill_id: permission
    explanation: Можно加不定式，可以問行動獲唔獲准。
    examples:
      - text: Можно здесь оставить сумку?
        meaning: 我可唔可以放個袋喺度？
        note: 向管理地方嘅人講，呢個語境確立許可意思。
  - subskill_id: obligation
    explanation: Нужно加不定式表示必要；與格短語指出邊個要做。
    examples:
      - text: Мне нужно вернуть ключ сегодня.
        meaning: 我今日要還鎖匙。
        note: Мне指出負責人，сегодня交代今日限期。
  - subskill_id: possibility
    explanation: Возможно將後面命題限定為可能。
    examples:
      - text: Возможно, вечером будет дождь.
        meaning: 今晚可能落雨。
        note: 天氣結果未肯定，唔係斷言一定發生。
  - subskill_id: certainty
    explanation: Не уверен可以對что引出嘅分句表示唔肯定。
    examples:
      - text: Я не уверена, что магазин открыт.
        meaning: 我唔肯定間舖頭開咗未。
        note: 女性講者表達不確定，冇斷言舖頭閂咗。
