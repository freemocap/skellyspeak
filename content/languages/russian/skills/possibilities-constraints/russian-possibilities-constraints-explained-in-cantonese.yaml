sections:
  - subskill_id: ability
    explanation: 朋友問你識唔識整單車。`Я умею` 講學識咗嘅技能；未完成體不定式 `чинить` 指你識做嘅維修，`велосипеды` 係物件。呢個同今日有冇工具而做到某一次維修嘅實際可能性唔同。
    examples:
      - text: Я умею чинить велосипеды.
        meaning: 我識整單車。
        note: 試吓話你識整手錶。答案：`Я умею чинить часы.` `умею` 仍表示習得能力；`чинить часы` 指新維修技能。
  - subskill_id: permission
    explanation: 你喺共用地方問負責人可唔可以留低個袋。`Можно` 加不定式 `оставить` 問行動准唔准；`здесь` 指呢度。呢個社交語境令問句係問許可，但 `можно` 喺其他語境亦可以講實際可能性。
    examples:
      - text: Можно здесь оставить сумку?
        meaning: 我可唔可以放個袋喺度？
        note: 試吓問可唔可以喺呢度留低單車。答案：`Можно здесь оставить велосипед?` `Можно` 仍係求准許；物件改成 `велосипед`。
  - subskill_id: obligation
    explanation: 你借咗鎖匙，今日要還。`Мне` 係與格，指出邊個有義務；`нужно` 表需要。完成體不定式 `вернуть` 將歸還視為要完成嘅事，`сегодня` 指限期。`Не нужно` 係唔使做，唔係唔准做。
    examples:
      - text: Мне нужно вернуть ключ сегодня.
        meaning: 我今日要還鎖匙。
        note: 試吓話今日要還本書。答案：`Мне нужно вернуть книгу сегодня.` `Мне нужно` 保留你嘅義務；`вернуть книгу` 指要完成嘅歸還行動。
  - subskill_id: possibility
    explanation: 你考慮夜晚戶外活動合唔合適。`Возможно` 將後面說法標成可能，唔係肯定。`Вечером` 指時間；`будет дождь` 講將來可能落雨。句子講天氣會否發生，唔係某人有冇技能或許可。
    examples:
      - text: Возможно, вечером будет дождь.
        meaning: 今晚可能落雨。
        note: 試吓話聽日可能落雨。答案：`Возможно, завтра будет дождь.` `Возможно` 保留不確定；`завтра` 改變時間。
  - subskill_id: certainty
    explanation: 有人問間舖有冇開，但你唔肯定。`Я не уверена` 係女性講者表示冇把握；陽性單數會用 `уверен`。`Что магазин открыт` 指被懷疑嘅說法。呢句限制信心，唔係斷言間舖關咗。
    examples:
      - text: Я не уверена, что магазин открыт.
        meaning: 我唔肯定間舖頭開咗未。
        note: 試吓由同一位女性講者話唔肯定門有冇開。答案：`Я не уверена, что дверь открыта.` `не уверена` 保留不確定立場；`что` 子句換成新嘅疑問內容。
