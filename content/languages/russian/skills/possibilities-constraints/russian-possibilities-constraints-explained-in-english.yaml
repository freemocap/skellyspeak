sections:
  - subskill_id: ability
    explanation: Уметь with an infinitive describes learned ability.
    examples:
      - text: Я умею чинить велосипеды.
        meaning: I know how to repair bicycles.
        note: The statement concerns a practical skill, not permission to perform a particular repair.
  - subskill_id: permission
    explanation: Можно with an infinitive can ask whether an action is permitted.
    examples:
      - text: Можно здесь оставить сумку?
        meaning: May I leave my bag here?
        note: Address the person responsible for the space; that context establishes permission.
  - subskill_id: obligation
    explanation: Нужно with an infinitive states necessity; a dative phrase identifies who must act.
    examples:
      - text: Мне нужно вернуть ключ сегодня.
        meaning: I need to return the key today.
        note: Мне identifies the responsible person and сегодня gives the deadline.
  - subskill_id: possibility
    explanation: Возможно qualifies the following proposition as possible.
    examples:
      - text: Возможно, вечером будет дождь.
        meaning: It may rain this evening.
        note: This leaves the weather outcome open instead of asserting it as certain.
  - subskill_id: certainty
    explanation: Не уверен can state uncertainty about a clause introduced by что.
    examples:
      - text: Я не уверена, что магазин открыт.
        meaning: I am not sure that the shop is open.
        note: The feminine speaker expresses uncertainty; she does not assert that it is closed.
