skill_id: possibilities_constraints
explanation_language: english
shared_explanation: skills/possibilities-constraints/possibilities-constraints-explained-in-english.yaml
sections:
  - subskill_id: ability
    explanation: A friend asks whether you can repair a bicycle. `Я умею` describes a learned skill, and
      imperfective infinitive `чинить` names the kind of work you know how to do; `велосипеды` is the object.
      This differs from a one-off practical possibility such as whether tools are available today.
    examples:
      - text: Я умею чинить велосипеды.
        meaning: I know how to repair bicycles.
        note: "Try saying you know how to repair watches. Answer: `Я умею чинить часы.` `Умею` still asserts learned
          ability; `чинить часы` names the new repair skill."
  - subskill_id: permission
    explanation: You are in a shared space and ask the person responsible whether you may leave a bag there.
      `Можно` plus infinitive `оставить` asks whether the action is allowed; `здесь` specifies the place. The
      social setting makes permission the intended reading, although `можно` can also concern practical
      possibility in other contexts.
    examples:
      - text: Можно здесь оставить сумку?
        meaning: May I leave my bag here?
        note: "Try asking whether you may leave a bicycle here. Answer: `Можно здесь оставить велосипед?` `Можно`
          still seeks permission; the object changes to `велосипед`."
  - subskill_id: obligation
    explanation: You borrowed a key and it must be returned today. `Мне` is dative and identifies who must act;
      `нужно` expresses necessity. Perfective infinitive `вернуть` presents returning the key as a task to
      complete, and `сегодня` gives the deadline. `Не нужно` would remove the requirement, not prohibit
      returning it.
    examples:
      - text: Мне нужно вернуть ключ сегодня.
        meaning: I need to return the key today.
        note: "Try saying you must return the book today. Answer: `Мне нужно вернуть книгу сегодня.` `Мне нужно` keeps
          the obligation on you; `вернуть книгу` names the required completed action."
  - subskill_id: possibility
    explanation: You are deciding whether an evening outdoor activity is sensible. `Возможно` marks the following
      proposition as a possibility rather than a certainty. `Вечером` sets the time; `будет дождь` presents
      rain as a future event. The sentence concerns whether weather may occur, not whether anyone has a skill
      or permission.
    examples:
      - text: Возможно, вечером будет дождь.
        meaning: It may rain this evening.
        note: "Try saying it may rain tomorrow. Answer: `Возможно, завтра будет дождь.` `Возможно` keeps the claim
          uncertain; `завтра` changes the time."
  - subskill_id: certainty
    explanation: Someone asks whether a shop is open, but you do not know. `Я не уверена` is a feminine speaker
      saying she is not certain; masculine singular would be `уверен`. `Что магазин открыт` gives the
      proposition in doubt. This limits confidence rather than asserting that the shop is closed.
    examples:
      - text: Я не уверена, что магазин открыт.
        meaning: I am not sure that the shop is open.
        note: "Try saying, as the same feminine speaker, that you are not sure the door is open. Answer: `Я не
          уверена, что дверь открыта.` `Не уверена` keeps the uncertain stance; the `что` clause changes what
          is uncertain."
