sections:
  - subskill_id: causes_reasons
    explanation: A friend asks why you stayed home. `Я осталась дома` reports the result using feminine singular
      past `осталась`; `потому что` introduces the reason. `Пошёл дождь` says rain began, with masculine past
      agreement to `дождь`. The connector answers why you stayed, not what you did next.
    examples:
      - text: Я осталась дома, потому что пошёл дождь.
        meaning: I stayed home because it started raining.
        note: "Try explaining that you stayed home because snow began. Answer: `Я осталась дома, потому что пошёл
          снег.` The first clause stays the same; `потому что` still introduces the reason, now `пошёл снег`."
  - subskill_id: consequences
    explanation: The bus failed to arrive and you explain your response. `Автобус не пришёл` gives the situation;
      `поэтому` marks what followed as a consequence. `Я пошла пешком` means the feminine speaker went on
      foot. Unlike `потому что`, which introduces a reason after a claim, `поэтому` introduces the resulting
      action.
    examples:
      - text: Автобус не пришёл, поэтому я пошла пешком.
        meaning: The bus did not come, so I walked.
        note: "Try saying you took the metro because the bus did not arrive. Answer: `Автобус не пришёл, поэтому я
          поехала на метро.` `Поэтому` still links the failed bus to your response; `поехала на метро` gives a
          different means of travel."
  - subskill_id: conditions
    explanation: The group is deciding tomorrow’s plan around the weather. `Если` introduces the condition;
      `завтра пойдёт дождь` treats rain starting tomorrow as a possible future event. `Мы останемся дома` is
      the resulting plan if that condition holds. Russian can use future reference in both clauses; the
      English “if” rule does not transfer mechanically.
    examples:
      - text: Если завтра пойдёт дождь, мы останемся дома.
        meaning: If it rains tomorrow, we will stay home.
        note: "Try planning a walk if tomorrow is warm. Answer: `Если завтра будет тепло, мы пойдём гулять.` `Если`
          still sets the condition; the second clause states what the group will do if it is met."
  - subskill_id: contrast
    explanation: "You are choosing a route. `Дорога короткая` gives an advantage: it is short. `Но крутая` adds a
      drawback: it is steep. `Но` connects two qualities that pull the decision in different directions; the
      adjective after it still describes the same road."
    examples:
      - text: Дорога короткая, но крутая.
        meaning: The road is short but steep.
        note: "Try describing a route that is long but level. Answer: `Дорога длинная, но ровная.` `Но` still
          contrasts practical qualities; `ровная` says the road is level despite its length."
  - subskill_id: supporting_claims
    explanation: You see a light in a home’s window and cautiously infer that somebody may be inside. `Думаю`
      marks the conclusion as your inference; `кто-то есть дома` is the tentative claim. `Потому что в окне
      горит свет` supplies the observation supporting it. A light is evidence, not proof; it does not cause
      the person to be there.
    examples:
      - text: Думаю, кто-то есть дома, потому что в окне горит свет.
        meaning: I think someone is home because there is a light on in the window.
        note: "Try making the same cautious inference from audible voices inside. Answer: `Думаю, кто-то есть дома,
          потому что слышны голоса.` `Думаю` keeps the claim tentative, while `слышны голоса` gives stronger
          observable support."
