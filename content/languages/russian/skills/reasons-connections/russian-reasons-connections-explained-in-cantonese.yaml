sections:
  - subskill_id: causes_reasons
    explanation: 朋友問你點解留喺屋企。`Я осталась дома` 用陰性單數過去式 `осталась` 講結果；`потому что` 引出原因。`Пошёл дождь`
      表示開始落雨，陽性過去式配合 `дождь`。連接詞答「點解」，唔係講下一步。
    examples:
      - text: Я осталась дома, потому что пошёл дождь.
        meaning: 因為開始落雨，我留咗喺屋企。
        note: 試吓解釋因為開始落雪所以留喺屋企。答案：`Я осталась дома, потому что пошёл снег.` 第一句不變；`потому что` 仍引出原因，改為 `пошёл снег`。
  - subskill_id: consequences
    explanation: 巴士冇嚟，你講自己點應對。`Автобус не пришёл` 交代情況；`поэтому` 將後面標成結果。`Я пошла пешком` 係女性講者步行。`потому что`
      係喺說法後補原因；`поэтому` 係引出結果。
    examples:
      - text: Автобус не пришёл, поэтому я пошла пешком.
        meaning: 架巴士冇嚟，所以我行路。
        note: 試吓話巴士冇嚟，所以你搭地鐵。答案：`Автобус не пришёл, поэтому я поехала на метро.` `поэтому` 仍連接巴士問題同你嘅應對；`поехала на
          метро` 換咗交通方式。
  - subskill_id: conditions
    explanation: 大家按聽日天氣定計劃。`Если` 引出條件；`завтра пойдёт дождь` 將聽日開始落雨視為可能嘅將來事件。`Мы останемся дома`
      係條件成立時嘅安排。俄語兩個子句都可以指將來，唔可以機械照搬英文 if 子句規則。
    examples:
      - text: Если завтра пойдёт дождь, мы останемся дома.
        meaning: 如果聽日落雨，我哋就留喺屋企。
        note: 試吓話如果聽日暖，就去散步。答案：`Если завтра будет тепло, мы пойдём гулять.` `Если` 仍設條件；第二句講條件成立時大家會做乜。
  - subskill_id: contrast
    explanation: 你揀行邊條路。`Дорога короткая` 講優點：路短；`но крутая` 補上缺點：路斜。`Но` 連接兩個對決定有相反影響嘅特質；後面形容詞仍講同一條路。
    examples:
      - text: Дорога короткая, но крутая.
        meaning: 條路短，但好斜。
        note: 試吓形容條路長，但平坦。答案：`Дорога длинная, но ровная.` `но` 仍對比實際特質；`ровная` 話雖然長，但路面平。
  - subskill_id: supporting_claims
    explanation: 你見到屋企窗內有燈，審慎推測可能有人。`Думаю` 標示呢個係推斷；`кто-то есть дома` 係未完全確定嘅主張。`Потому что в окне горит свет`
      交代支持推斷嘅觀察。燈光係線索，唔係證明，亦唔係令人喺屋企嘅原因。
    examples:
      - text: Думаю, кто-то есть дома, потому что в окне горит свет.
        meaning: 我諗有人喺屋企，因為窗口有燈光。
        note: 試吓根據屋內傳出人聲作同樣審慎推斷。答案：`Думаю, кто-то есть дома, потому что слышны голоса.` `Думаю` 保留推測語氣；`слышны голоса`
          提供更強嘅可觀察線索。
