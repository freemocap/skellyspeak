sections:
  - subskill_id: causes_reasons
    explanation: Потому что引出前述情況嘅原因。
    examples:
      - text: Я осталась дома, потому что пошёл дождь.
        meaning: 因為開始落雨，我留咗喺屋企。
        note: 女性講者將落雨講成留家原因。
  - subskill_id: consequences
    explanation: Поэтому將情況連到結果。
    examples:
      - text: Автобус не пришёл, поэтому я пошла пешком.
        meaning: 架巴士冇嚟，所以我行路。
        note: 女性講者將行路表達成巴士冇嚟嘅結果。
  - subskill_id: conditions
    explanation: Если引出條件，兩個分句都可以指將來事件。
    examples:
      - text: Если завтра пойдёт дождь, мы останемся дома.
        meaning: 如果聽日落雨，我哋就留喺屋企。
        note: 留家係有條件嘅，唔係無條件宣布計劃。
  - subskill_id: contrast
    explanation: Но連接當前討論中有對比嘅描述。
    examples:
      - text: Дорога короткая, но крутая.
        meaning: 條路短，但好斜。
        note: 對比長度同斜度，兩者揀路線時有唔同影響。
  - subskill_id: supporting_claims
    explanation: 觀察可以作為推論證據。
    examples:
      - text: Думаю, кто-то есть дома, потому что в окне горит свет.
        meaning: 我諗有人喺屋企，因為窗口有燈光。
        note: 燈光支持推論，唔係造成有人喺屋企嘅原因。
