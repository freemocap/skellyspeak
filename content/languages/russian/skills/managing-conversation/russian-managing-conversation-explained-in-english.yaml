skill_id: managing_conversation
explanation_language: english
shared_explanation: skills/managing-conversation/managing-conversation-explained-in-english.yaml
sections:
  - subskill_id: opening_closing
    explanation: You are leaving a colleague after arranging to meet again next week. `До встречи` is a farewell
      that anticipates another meeting; `на следующей неделе` fixes when that meeting is expected. The phrase
      closes the current exchange rather than asking for a new appointment.
    examples:
      - text: До встречи на следующей неделе!
        meaning: See you next week!
        note: "Try closing the conversation with an expected meeting tomorrow. Answer: `До встречи завтра!` `До
          встречи` remains the farewell, while `завтра` changes the next meeting time."
  - subskill_id: acknowledging
    explanation: A colleague has just explained a confusing step. `А` marks your moment of recognition, and
      `теперь понятно` says the explanation is clear now. The person who understands is supplied by the
      conversation. Acknowledging understanding does not by itself mean you agree with the explanation’s
      recommendation.
    examples:
      - text: А, теперь понятно.
        meaning: Ah, now I understand.
        note: "Try acknowledging comprehension without the opening interjection. Answer: `Теперь понятно.` The phrase
          still tells the colleague that the explanation has become clear."
  - subskill_id: clarification
    explanation: You did not hear or understand the previous instruction. `Повторите` is a polite singular-address
      or plural imperative asking the other person to repeat it; `пожалуйста` softens the interruption. This
      repairs trouble with what was said, rather than checking whether an external fact is true.
    examples:
      - text: Повторите, пожалуйста.
        meaning: Please repeat that.
        note: "Try asking the speaker to explain once more rather than simply repeat. Answer: `Объясните ещё раз,
          пожалуйста.` The polite imperative changes to `объясните`, while `ещё раз` requests another
          explanation."
  - subskill_id: rephrasing
    explanation: A visitor heard that this service requires a booking made before arrival. `Другими словами`
      signals that you are restating the same rule. `Нужно записаться` gives the practical requirement to
      register or book, and `заранее` specifies in advance. A useful rephrasing keeps the prior rule intact
      while making its consequence clearer.
    examples:
      - text: Другими словами, нужно записаться заранее.
        meaning: In other words, you need to book in advance.
        note: "Try restating the advance-booking rule as booking before the visit. Answer: `Другими словами, нужно
          записаться до визита.` `Другими словами` signals a restatement; `до визита` makes the deadline
          explicit."
  - subskill_id: correcting_misunderstanding
    explanation: A listener thought you said Friday, but you meant Saturday. `Я имела в виду` means “I meant”;
      `имела` is feminine singular past, so this example is voiced by a feminine speaker. `Субботу, не
      пятницу` gives both the intended day and the mistaken one in the accusative, making the repair
      unambiguous.
    examples:
      - text: Я имела в виду субботу, не пятницу.
        meaning: I meant Saturday, not Friday.
        note: "Try correcting someone who heard Saturday when this same feminine speaker meant Sunday. Answer: `Я
          имела в виду воскресенье, не субботу.` The intended day comes first; `не субботу` rejects the
          mistaken day."
  - subskill_id: turns_topics
    explanation: The group has finished one issue and you want to ask about another. `Можно я` asks permission to
      take the next conversational move; `перейду` is perfective future for moving to the next topic. `К
      другому вопросу` names that topic with `к` plus dative. The question manages the discussion, not
      physical movement.
    examples:
      - text: Можно я перейду к другому вопросу?
        meaning: May I move on to another question?
        note: "Try asking to move on to the schedule. Answer: `Можно я перейду к расписанию?` `Можно я перейду` still
          requests the floor; `к расписанию` names the new topic."
