skill_id: time_events
explanation_language: cantonese
shared_explanation: skills/time-events/time-events-explained-in-cantonese.yaml
sections:
  - subskill_id: present_events
    explanation: 未完成體現在式可以描述目前進行中嘅活動。
    examples:
      - text: Сейчас я чиню велосипед.
        meaning: 我而家整緊單車。
        note: Сейчас將чиню定位為當前活動，唔係一般習慣。
  - subskill_id: past_events
    explanation: 完成體過去式可以將維修表達成已完成事件；單數過去式會標示性別。
    examples:
      - text: Вчера я починила велосипед.
        meaning: 我尋日整好咗架單車。
        note: 講者用陰性починила；男性講者會用починил。
  - subskill_id: future_events
    explanation: 完成體非過去式可以指將來事件。
    examples:
      - text: Завтра я заберу детали.
        meaning: 我聽日會攞零件。
        note: Завтра提供時間；заберу將領取表達成有界限嘅事件。
  - subskill_id: duration_frequency
    explanation: Раз數次數，в неделю設定重複周期。
    examples:
      - text: Я плаваю два раза в неделю.
        meaning: 我一個星期游兩次水。
        note: 呢個描述頻率，唔係一次游幾耐。
  - subskill_id: event_sequence
    explanation: Сначала同потом明確排列動作。
    examples:
      - text: Сначала вымойте руки, потом начинайте готовить.
        meaning: 先洗手，再開始煮飯。
        note: 禮貌或複數指令提供次序，唔係斷言一件事造成另一件。
  - subskill_id: event_phase
    explanation: Дочитать入面嘅前綴表示一直讀到完。
    examples:
      - text: Я дочитала книгу.
        meaning: 我睇完本書喇。
        note: 女性講者報告讀到終點，唔係淨係讀過一部分。
