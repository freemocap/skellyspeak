language: indonesian
skill_id: time_events
explanation_language: english
shared_explanation: skills/time-events/time-events-explained-in-english.yaml
sections:
  - subskill_id: present_events
    explanation: A colleague asks what you are doing now. `sedang` before
      `menggambar` presents drawing as in progress. The verb does not acquire an
      English-style present tense ending.
    examples:
      - text: Saya sedang menggambar peta.
        meaning: I am drawing a map. `Saya` is the speaker, `sedang menggambar` the
          ongoing drawing, and `peta` the map. The sentence does not say the map
          is finished.
        note: "Say you are drawing a poster now. Answer: `Saya sedang menggambar
          poster.` Replace the object; keep `sedang` for an ongoing activity.
          `Saya menggambar poster` could be habitual in another context."
  - subskill_id: past_events
    explanation: You report yesterday’s printing. `Kemarin` places the event in the
      past; `mencetak` itself has no past-tense ending. The surrounding time
      word supplies the temporal reading.
    examples:
      - text: Kemarin saya mencetak poster.
        meaning: Yesterday I printed posters. `Saya mencetak poster` says the speaker
          printed posters, and initial `Kemarin` says when. It reports an event
          rather than merely naming a poster.
        note: "Move the printing to tomorrow. Answer: `Besok saya mencetak poster.`
          Replace `kemarin` with `besok`; the verb form can remain the same when
          the time context changes."
  - subskill_id: future_events
    explanation: You tell the team about tomorrow’s poster work. `Besok` fixes the
      day, `akan` presents the plan as later, and `kami` includes the speaker’s
      group but excludes the listener.
    examples:
      - text: Besok kami akan memasang poster.
        meaning: Tomorrow we will put up posters. `memasang poster` means putting up
          posters. The future reading comes from `besok` and `akan`, not an
          ending on `memasang`.
        note: "Include the listener in the plan. Answer: `Besok kita akan memasang
          poster.` Replace `kami` with `kita`; the action and time stay the same
          but the participants change."
  - subskill_id: duration_frequency
    explanation: You are explaining a weekly practice schedule. `selama dua jam`
      measures each session’s duration, while `setiap Jumat` says how often it
      repeats.
    examples:
      - text: Kami berlatih selama dua jam setiap Jumat.
        meaning: We practise for two hours every Friday. `Kami berlatih` names the
          group’s practice and excludes the listener from that group. `dua jam`
          is two hours of duration, unlike clock time `jam dua`.
        note: "Make each Friday session three hours. Answer: `Kami berlatih selama tiga
          jam setiap Jumat.` Change only `dua` to `tiga`; keep the weekly
          marker."
  - subskill_id: event_sequence
    explanation: You are giving the order for preparing paint. `Pertama` labels the
      first step; `Lalu` leads to the next. These markers order actions without
      claiming the first causes the second.
    examples:
      - text: Pertama, pilih warna. Lalu, campurkan cat.
        meaning: First, choose a colour. Then mix the paint. `Pilih warna` tells the
          listener to choose a colour, then `campurkan cat` asks them to mix the
          paint. The command forms address the listener directly.
        note: "Choose green, then mix blue and yellow paint to make it. Answer:
          `Pertama, pilih warna hijau. Lalu, campurkan cat biru dan kuning.`
          The chosen colour guides the following paint-mixing step; `Pertama`
          and `Lalu` retain the order."
  - subskill_id: event_phase
    explanation: A colleague asks whether the posters are ready. `sudah selesai
      mencetak` explicitly says printing is finished; `sudah` alone can mark a
      changed state in other sentences, so name the finished task.
    examples:
      - text: Saya sudah selesai mencetak poster.
        meaning: I have finished printing the posters. `Saya` identifies the speaker and
          `mencetak poster` the task. `selesai` is the completion word; the
          sentence goes beyond merely saying the printing happened yesterday.
        note: "Say the printing is not finished yet. Answer: `Saya belum selesai
          mencetak poster.` Replace `sudah` with `belum`; `belum` means not yet,
          not a timeless no."
