language: indonesian
skill_id: time_events
explanation_language: english
shared_explanation: skills/time-events/time-events-explained-in-english.yaml
sections:
  - subskill_id: present_events
    explanation: Sedang before a verb makes an ongoing activity explicit. The verb is not conjugated
      for the speaker’s person.
    examples:
      - text: Saya sedang menggambar peta.
        meaning: I am drawing a map.
        note: Sedang presents drawing as in progress. It does not say the map is finished.
  - subskill_id: past_events
    explanation: A time expression such as kemarin can locate an event in the past. The verb itself
      does not need a past-tense ending.
    examples:
      - text: Kemarin saya mencetak poster.
        meaning: Yesterday I printed posters.
        note: Kemarin anchors the printing yesterday; mencetak remains the same verb form used in other
          time contexts.
  - subskill_id: future_events
    explanation: Akan can mark an anticipated action, and besok specifies tomorrow. Future reference
      is also possible from a time expression and context without akan.
    examples:
      - text: Besok kami akan memasang poster.
        meaning: Tomorrow we will put up posters.
        note: Kami excludes the listener from we. Akan and besok place the installation later.
  - subskill_id: duration_frequency
    explanation: Selama with a time quantity states duration. A separate expression such as setiap
      Jumat gives recurrence.
    examples:
      - text: Kami berlatih selama dua jam setiap Jumat.
        meaning: We practise for two hours every Friday.
        note: Dua jam measures each practice period, not an hour on the clock. Setiap Jumat gives the
          schedule.
  - subskill_id: event_sequence
    explanation: Pertama and lalu order steps in a procedure. Imperatives can state what to do at each step.
    examples:
      - text: Pertama, pilih warna. Lalu, campurkan cat.
        meaning: First, choose a colour. Then mix the paint.
        note: The markers order the actions without claiming that choosing a colour causes the mixing.
  - subskill_id: event_phase
    explanation: Selesai can explicitly mark finishing an activity. Sudah presents that completion
      as achieved.
    examples:
      - text: Saya sudah selesai mencetak poster.
        meaning: I have finished printing the posters.
        note: Selesai mencetak names the completed task; this says more than simply locating some
          printing yesterday.
