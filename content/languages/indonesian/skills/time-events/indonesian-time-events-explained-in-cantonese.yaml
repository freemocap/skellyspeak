language: indonesian
skill_id: time_events
explanation_language: cantonese
shared_explanation: skills/time-events/time-events-explained-in-cantonese.yaml
sections:
  - subskill_id: present_events
    explanation: 同事問你而家做緊乜。`sedang` 放 `menggambar` 前，表明畫緊；動詞唔加英文式現在時詞尾。
    examples:
      - text: Saya sedang menggambar peta.
        meaning: 我畫緊地圖。 `Saya` 係講者，`sedang menggambar` 係畫緊，`peta` 係地圖；句子冇話已畫完。
        note: 試講而家畫緊海報。答案：`Saya sedang menggambar poster.` 換賓語，保留 `sedang`；`Saya
          menggambar poster` 喺別處可講習慣。
  - subskill_id: past_events
    explanation: 你報告噚日印嘢。`Kemarin` 定位過去；`mencetak` 本身冇過去時詞尾，時間由上下文提供。
    examples:
      - text: Kemarin saya mencetak poster.
        meaning: 我尋日印咗海報。 `Saya mencetak poster` 係我印海報，開頭 `Kemarin` 講幾時；句子報事件，唔係只講海報個名。
        note: 試改成聽日印。答案：`Besok saya mencetak poster.` `kemarin` 換 `besok`；改時間唔一定改動詞形。
  - subskill_id: future_events
    explanation: 同團隊講聽日貼海報。`Besok` 係聽日，`akan` 指稍後計劃，`kami` 包括講者一方但唔包括聽者。
    examples:
      - text: Besok kami akan memasang poster.
        meaning: 聽日我哋會貼海報。 `memasang poster` 係貼海報；將來意思由 `besok` 同 `akan` 提供，唔係動詞詞尾。
        note: 試將聽者都算入計劃。答案：`Besok kita akan memasang poster.` `kami` 換
          `kita`；時間動作一樣，參與者變。
  - subskill_id: duration_frequency
    explanation: 你講每星期練習安排。`selama dua jam` 量每次時長，`setiap Jumat` 講逢星期五重複。
    examples:
      - text: Kami berlatih selama dua jam setiap Jumat.
        meaning: 我哋逢星期五練習兩個鐘。 `Kami berlatih` 係我哋練習，但唔包括聽者；`dua jam` 係兩個鐘頭，同鐘點 `jam dua`
          唔同。
        note: 試改每次三個鐘。答案：`Kami berlatih selama tiga jam setiap Jumat.` 只換 `dua` 做
          `tiga`，保留每週標記。
  - subskill_id: event_sequence
    explanation: 你教人調顏料。`Pertama` 標第一步，`Lalu` 帶下一步；呢啲詞講次序，唔聲稱第一步必然造成第二步。
    examples:
      - text: Pertama, pilih warna. Lalu, campurkan cat.
        meaning: 首先揀隻色，然後調油。 `Pilih warna` 叫聽者揀顏色，之後 `campurkan cat` 叫佢混合顏料；命令式直接對聽者講。
        note: 試講先揀綠色，再混藍色同黃色顏料調出嚟。答案：`Pertama, pilih warna hijau. Lalu, campurkan cat biru dan kuning.` 先定目標顏色，再調顏料；`Pertama` 同 `Lalu` 保留次序。
  - subskill_id: event_phase
    explanation: 同事問海報準備好未。`sudah selesai mencetak` 明講印刷完成；`sudah` 喺其他句可標狀態轉變，所以呢度要指出完成嘅工作。
    examples:
      - text: Saya sudah selesai mencetak poster.
        meaning: 我已經印完啲海報。 `Saya` 係講者，`mencetak poster` 係工作，`selesai` 係完成；句子唔止講噚日印過。
        note: 試講仲未印完。答案：`Saya belum selesai mencetak poster.` `sudah` 換 `belum`；`belum`
          係尚未，唔係永遠唔會。
