skill_id: reasons_connections
guidance: Judge the relationship between propositions, not isolated connective words. Karena can
  give a cause or reason, jadi or oleh karena itu a consequence, kalau or jika a condition, and
  tetapi or meskipun contrast or concession. Kalau hujan, kita bekerja di dalam makes indoor
  work conditional without requiring a special subjunctive ending. Lebih jelas can support a
  design preference if explicitly offered as its basis; repeating a preference more loudly
  supplies no grounds. A copied karena with no recoverable reason is absent. Karena tintanya
  habis can answer an identifiable why-question contextually. Lalu can order printing and
  packing without asserting a causal link. Yang identifying an item is not automatically a
  logical connection between claims. Distinguish a reason for an action from evidence for
  believing a proposition, and accept ordinary colloquial connectors when they correctly convey
  the relationship rather than prescribing formal written transitions throughout conversation.
