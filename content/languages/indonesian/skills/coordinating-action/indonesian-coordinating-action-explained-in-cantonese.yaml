skill_id: coordinating_action
explanation_language: cantonese
shared_explanation: skills/coordinating-action/coordinating-action-explained-in-cantonese.yaml
sections:
  - subskill_id: requests
    explanation: 張椅擋住工作位，你請對方搬走。`Tolong` 表示請幫忙，`pindahkan` 叫聽者移動後面嗰件物件。
    examples:
      - text: Tolong pindahkan kursi ini.
        meaning: 唔該幫手搬開張凳。 `kursi ini` 係呢張椅；請求要改位置，唔係問對方有冇能力搬。
        note: 試請對方搬呢張枱。答案：`Tolong pindahkan meja ini.` 換物件；`Meja ini di sini` 只係報位置。
  - subskill_id: offers_invitations
    explanation: 訪客到，你請佢飲茶。喺呢個對話，簡短 `Mau ...?` 問聽者要唔要提供嘅嘢；聽者可省略。
    examples:
      - text: Mau secangkir teh?
        meaning: 你想唔想飲杯茶？ `secangkir teh` 係一杯茶；問句係提供飲品，唔係查訪客有乜財物。
        note: 試提供一杯咖啡。答案：`Mau secangkir kopi?` 換飲品；`Saya mau teh` 係講自己想飲，唔係請訪客。
  - subskill_id: suggestions
    explanation: 你同聽者要核對顏色。`Mari kita` 提議共同做，明確包括聽者；`bersama` 再強調一齊。
    examples:
      - text: Mari kita periksa warnanya bersama.
        meaning: 不如我哋一齊檢查吓隻色。 `periksa warnanya` 係檢查顏色；`kita` 包括雙方，`kami` 則唔包括聽者。
        note: 試提議一齊檢查尺寸。答案：`Mari kita periksa ukurannya bersama.` 換被檢查嘅性質；`Mari kami`
          同邀請聽者參與相衝。
  - subskill_id: commitments
    explanation: 分工時你自願聽日帶工具。`Saya akan membawa` 講自己稍後行動；分工語境令佢成為承諾，唔只係預測。
    examples:
      - text: Saya akan membawa alatnya besok.
        meaning: 聽日我會帶嗰啲器材嚟。 `besok` 指聽日，`alatnya` 指大家已談及嘅工具；`-nya` 指返已知物件。
        note: 試承擔聽日帶顏料。答案：`Saya akan membawa catnya besok.` 換物件，保留任務；單靠 `akan` 唔保證係承諾。
  - subskill_id: accepting_declining
    explanation: 有人約你今晚見，但你去唔到。`Maaf` 緩和答覆，`tidak bisa datang malam ini` 講限制，婉拒嗰次邀請。
    examples:
      - text: Maaf, saya tidak bisa datang malam ini.
        meaning: 唔好意思，我今晚嚟唔到。 `malam ini` 限定今晚；冇上文邀請，同一句亦可能只係講可唔可以出席。
        note: 試改成因今晚忙而婉拒。答案：`Maaf, saya sibuk malam ini.` 回應邀請時係拒絕理由；`Ya, saya datang`
          係接受。
  - subskill_id: negotiating_plans
    explanation: 對方提議星期五，但你忙。先講衝突，再用 `Bagaimana kalau ...?` 提星期六畀雙方考慮。
    examples:
      - text: Jumat saya sibuk. Bagaimana kalau kita bertemu Sabtu?
        meaning: 我星期五冇時間。不如星期六見？ `Jumat saya sibuk` 排除星期五，`kita bertemu Sabtu`
          將聽者包括喺新會面；問句徵求同意。
        note: 試改提星期日。答案：`Jumat saya sibuk. Bagaimana kalau kita bertemu Minggu?`
          換新日期，保留原衝突。
