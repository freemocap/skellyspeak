skill_id: coordinating_action
guidance: Assess requests, offers, suggestions, undertakings, acceptance or refusal and
  negotiated changes. Tolong pindahkan kursi ini directly asks action; silakan can invite or
  permit a listener to proceed. Mau saya bantu? can offer the speaker’s help; mari or ayo with a
  shared action can suggest participation. Saya akan membawa alatnya commits in a
  task-allocation exchange, but akan alone is not a promise. Tidak bisa after a concrete
  invitation may decline contextually; the same words elsewhere can simply report inability.
  Bagaimana kalau Sabtu? proposes a revised day if Friday has been ruled out. Merely naming
  Sabtu without any proposal or recoverable exchange is absent. A question about physical
  capability is not automatically a request. Accept appropriate everyday register without
  requiring every active-voice prefix in conversational imperatives. Kita includes the listener,
  whereas kami excludes them; use that distinction when identifying who is being asked or
  committed to act.
