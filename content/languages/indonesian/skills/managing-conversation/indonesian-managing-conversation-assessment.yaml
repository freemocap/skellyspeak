language: indonesian
skill_id: managing_conversation
guidance: "Look for contact management, acknowledgment, clarification, reformulation, correction
  and topic or floor management. Sampai besok can take leave, while quoting that phrase as
  vocabulary does not close contact. Saya mengerti responds to an explanation without
  necessarily agreeing. Bisa diulangi? can request repetition after an unclear utterance; apa
  maksudnya? asks about meaning. Maksud saya hari Sabtu, bukan Jumat replaces the listener’s
  mistaken day. Dengan kata lain introduces a reformulation only if the new content actually
  clarifies an earlier meaning. A copied marker without any such relationship is absent. Boleh
  saya menambahkan sesuatu? can seek a turn in a discussion, not merely ask about abstract
  permission. A short ya or baik must be interpreted relative to the preceding contribution:
  receipt, agreement and accepting a task are different functions. Do not demand a full subject
  and verb for conventional greetings, acknowledgments or contextually sufficient repair
  requests."
