sections:
  - subskill_id: opening_closing
    explanation: 探訪完要走，預期聽日再見。`Sampai besok` 係簡短道別，講下次見面；放喺探訪開始唔係收尾。
    examples:
      - text: Sampai besok!
        meaning: 聽日見！ `Sampai` 喺呢句指向下次見面，`besok` 係聽日；喺對話尾先有道別作用。
        note: 試改成下星期再見。答案：`Sampai minggu depan!` 換下次時間；喺詞彙表引用呢句唔算道別。
  - subskill_id: acknowledging
    explanation: 有人解釋工具點用。`Oh` 表示收到新資訊，`sekarang saya mengerti` 係而家明白；唔自動代表同意建議。
    examples:
      - text: Oh, sekarang saya mengerti.
        meaning: 哦，我而家明喇。 `sekarang` 係而家，`mengerti` 係明白；回應畀對方知解釋已傳到。
        note: 試唔提時間就確認明白。答案：`Oh, saya mengerti.` 去掉 `sekarang`；`Saya setuju` 係同意。
  - subskill_id: clarification
    explanation: 你聽漏咗對方上一句。`Bisa diulangi?` 請佢重講；連住寫嘅 `di-` 係被動動詞一部分，同分開寫嘅地點 `di` 唔同。
    examples:
      - text: Bisa diulangi?
        meaning: 可唔可以再講一次？ `diulangi` 係重複；簡短問句靠緊接上文知道要重講乜。
        note: 試改成問意思。答案：`Apa maksudnya?` 呢句處理理解；只係聽漏就用 `Bisa diulangi?`
  - subskill_id: rephrasing
    explanation: 對方解釋當日落單做唔切。`Dengan kata lain` 引入實際重述：大家要早啲訂。
    examples:
      - text: Dengan kata lain, kita perlu memesan lebih awal.
        meaning: 換句話講，我哋要早啲落單。 `kita` 包括聽者，`perlu` 係需要，`memesan lebih awal`
          係早啲訂；第二種講法保留原本限制，冇改規則。
        note: 試將「要預早落單」重述成「我哋要早啲訂」。答案：`Pesanan harus dibuat lebih awal. Dengan kata
          lain, kita perlu memesan lebih awal.` 第二句保留同一時間要求。
  - subskill_id: correcting_misunderstanding
    explanation: 對方以為星期五，但你本意係星期六。`Maksud saya` 講本意，`bukan Jumat` 排除聽錯嗰日。
    examples:
      - text: Maksud saya hari Sabtu, bukan Jumat.
        meaning: 我係指星期六，唔係星期五。 `hari Sabtu` 係原意，`Jumat` 係排除嘅日子；對比修正時間，唔使重講全個計劃。
        note: 試將聽錯嘅星期日更正為星期一。答案：`Maksud saya hari Senin, bukan Minggu.` 先講本意，再講排除嘅日子。
  - subskill_id: turns_topics
    explanation: 討論時你想插入發言。`Boleh saya ...?` 請求發言空間，`menambahkan sesuatu` 暫時唔講具體內容。
    examples:
      - text: Boleh saya menambahkan sesuatu?
        meaning: 我可唔可以補充少少？ `saya` 係想發言嘅人，`menambahkan` 係補充，`sesuatu` 係一啲嘢；問句管理對話，唔係測體力。
        note: 試問可唔可以提一條問題。答案：`Boleh saya mengajukan satu pertanyaan?`
          呢句同樣請求發言，但講明內容；`Saya menambahkan sesuatu` 係宣布，冇請求發言。
