sections:
  - subskill_id: opening_closing
    explanation: Sampai 配合下次見面嘅時間，係慣常嘅道別講法，唔使講完整句。
    examples:
      - text: Sampai besok!
        meaning: 聽日見！
        note: 探訪結束、預計聽日會再見時可以咁講。
  - subskill_id: acknowledging
    explanation: Mengerti 可以表示明白頭先嘅解釋；加 sekarang，就突出而家先明白。
    examples:
      - text: Oh, sekarang saya mengerti.
        meaning: 哦，我而家明喇。
        note: 對方解釋完工具點用之後，咁講係表示理解，唔係承諾會用。
  - subskill_id: clarification
    explanation: 用被動式 diulangi 問句請人重複，唔使明講邊個負責再講。要重複嘅內容由上一句提供。
    examples:
      - text: Bisa diulangi?
        meaning: 可唔可以再講一次？
        note: 聽漏對方一部分說話時用。呢度 di- 係動詞前綴，要連住寫。
  - subskill_id: rephrasing
    explanation: Dengan kata lain 引出同一個意思嘅另一種講法；後面嘅內容應該令之前嘅解釋更清楚。
    examples:
      - text: Dengan kata lain, kita perlu memesan lebih awal.
        meaning: 換句話講，我哋要早啲落單。
        note: 對方解釋活動當日落單會趕唔切，呢句就講出實際含意；lebih awal 表示要提早。
  - subskill_id: correcting_misunderstanding
    explanation: Maksud saya 指明自己想講嘅意思；bukan 用嚟排除對方誤會咗嘅名詞選項。
    examples:
      - text: Maksud saya hari Sabtu, bukan Jumat.
        meaning: 我係指星期六，唔係星期五。
        note: 對方誤以為約星期五見面時，用呢句更正。
  - subskill_id: turns_topics
    explanation: Boleh 可以用嚟爭取發言機會。喺討論場景入面，呢個要求係管理發言輪次。
    examples:
      - text: Boleh saya menambahkan sesuatu?
        meaning: 我可唔可以補充少少？
        note: 想加入當前討論時用；sesuatu 暫時唔交代補充乜嘢，等獲得發言機會先講。
