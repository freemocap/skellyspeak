sections:
  - subskill_id: ability
    explanation: Someone asks what repairs you can do. `bisa` before the action
      expresses practical ability here. It does not itself say someone has
      permitted the work.
    examples:
      - text: Saya bisa memperbaiki sepeda.
        meaning: I can repair bicycles. `Saya` is the speaker, `bisa` means can, and
          `memperbaiki sepeda` means repair bicycles. The skill discussion
          selects the ability reading.
        note: "Say you can repair tables. Answer: `Saya bisa memperbaiki meja.` Replace
          the object. In a permission discussion, `bisa` may instead concern
          opportunity, so attend to context."
  - subskill_id: permission
    explanation: At a shared workspace, you ask the person in charge before using a
      table. `Boleh saya ...?` requests permission for the speaker’s action,
      with `meja ini` naming this table.
    examples:
      - text: Boleh saya memakai meja ini?
        meaning: May I use this table? `memakai` means use and `meja ini` means this
          table. The question seeks a decision from the listener, not a report
          of the speaker’s physical skill.
        note: "Ask to use this chair. Answer: `Boleh saya memakai kursi ini?` Replace
          the object. A responsible person could answer `Boleh` to grant
          permission."
  - subskill_id: obligation
    explanation: You and the listener borrowed a tool that is due today. `kita`
      includes both of you, and `harus` makes returning it a requirement.
    examples:
      - text: Kita harus mengembalikan alat ini hari ini.
        meaning: We must return this tool today. `mengembalikan alat ini` names the
          return action and object; `hari ini` supplies the deadline. `harus` is
          about necessity, not ability.
        note: "Say the return is not required today. Answer: `Kita tidak harus
          mengembalikan alat ini hari ini.` `tidak harus` removes the
          requirement; `tidak boleh` would forbid the return."
  - subskill_id: possibility
    explanation: You are planning an outdoor job and the weather is uncertain.
      `Mungkin` marks rain as possible, and `nanti` places it later.
    examples:
      - text: Mungkin nanti hujan.
        meaning: It may rain later. `hujan` names rain; the sentence forecasts a
          possibility rather than stating rain is already falling.
        note: "Say it may rain tomorrow. Answer: `Mungkin besok hujan.` Change the time
          word. `Besok hujan` gives a forecast without explicitly marking
          uncertainty."
  - subskill_id: certainty
    explanation: Someone asks whether this method is safe, but you have not checked
      enough. `belum yakin` says your confidence is not there yet; `bahwa`
      introduces the claim being evaluated.
    examples:
      - text: Saya belum yakin bahwa cara ini aman.
        meaning: I am not yet sure that this method is safe. `cara ini aman` is the
          safety proposition. `Saya belum yakin` limits the speaker’s certainty
          about it, rather than saying a word was misunderstood.
        note: "Say you are already sure this method is safe. Answer: `Saya sudah yakin
          bahwa cara ini aman.` Replace `belum` with `sudah`; that changes the
          degree of certainty."
