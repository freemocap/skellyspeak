sections:
  - subskill_id: ability
    explanation: 活動前加 bisa，可以表示能力。後面嘅動詞唔會因人稱或者時態而變詞尾。
    examples:
      - text: Saya bisa memperbaiki sepeda.
        meaning: 我識整單車。
        note: 討論實用技能時，bisa 係講能力，唔會自動變成准許。
  - subskill_id: permission
    explanation: Boleh 可以問某個行動獲唔獲准。對方嘅身份同權限，會令問句有請求批准嘅意思。
    examples:
      - text: Boleh saya memakai meja ini?
        meaning: 我可唔可以用呢張枱？
        note: 問管理工作地方嘅人，為自己想做嘅事請求批准。
  - subskill_id: obligation
    explanation: 動詞前面嘅 harus 表示必要；tidak harus 係唔一定要，tidak boleh 先係唔准。
    examples:
      - text: Kita harus mengembalikan alat ini hari ini.
        meaning: 我哋今日一定要還返呢件工具。
        note: Kita 包括聽者。Harus 表示歸還係必要嘅，hari ini 交代限期係今日。
  - subskill_id: possibility
    explanation: Mungkin 表示某個結果有可能發生，唔係肯定會發生。
    examples:
      - text: Mungkin nanti hujan.
        meaning: 陣間可能落雨。
        note: Mungkin 限定預測嘅確定程度；nanti 將可能落雨嘅時間放喺稍後。
  - subskill_id: certainty
    explanation: Yakin 描述有信心；加 belum，就表示暫時仲未有把握。
    examples:
      - text: Saya belum yakin bahwa cara ini aman.
        meaning: 我仲未肯定呢個方法係安全嘅。
        note: Bahwa 引出要判斷嘅命題；唔肯定嘅係安全性，唔係詞語意思。
