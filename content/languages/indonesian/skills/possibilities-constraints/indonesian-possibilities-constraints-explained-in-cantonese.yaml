sections:
  - subskill_id: ability
    explanation: 有人問你識做邊種維修。`bisa` 喺動作前，呢度表示實際能力；佢本身唔代表有人批准。
    examples:
      - text: Saya bisa memperbaiki sepeda.
        meaning: 我識整單車。 `Saya` 係講者，`bisa` 係能夠，`memperbaiki sepeda` 係修單車；技能話題令佢解能力。
        note: 試講識修枱。答案：`Saya bisa memperbaiki meja.` 換賓語；喺許可話題 `bisa` 亦可能講機會，要睇語境。
  - subskill_id: permission
    explanation: 共用工作間，你用枱前問負責人。`Boleh saya ...?` 請求批准講者嘅行動，`meja ini` 指呢張枱。
    examples:
      - text: Boleh saya memakai meja ini?
        meaning: 我可唔可以用呢張枱？ `memakai` 係使用，`meja ini` 係呢張枱；句子要聽者決定，唔係問自己有冇體力。
        note: 試問可唔可以用呢張椅。答案：`Boleh saya memakai kursi ini?` 換物件；負責人可答 `Boleh` 表示批准。
  - subskill_id: obligation
    explanation: 你同聽者借咗工具，今日到期。`kita` 包括兩個人，`harus` 講必須歸還。
    examples:
      - text: Kita harus mengembalikan alat ini hari ini.
        meaning: 我哋今日一定要還返呢件工具。 `mengembalikan alat ini` 係還呢件工具，`hari ini` 係期限；`harus`
          講必要，唔係能力。
        note: 試講今日唔一定要還。答案：`Kita tidak harus mengembalikan alat ini hari ini.` `tidak
          harus` 取消義務；`tidak boleh` 係禁止還。
  - subskill_id: possibility
    explanation: 你安排戶外工作，天氣未肯定。`Mungkin` 標可能落雨，`nanti` 指稍後。
    examples:
      - text: Mungkin nanti hujan.
        meaning: 陣間可能落雨。 `hujan` 係落雨；句子估一個可能，唔係話而家正落。
        note: 試講聽日可能落雨。答案：`Mungkin besok hujan.` 換時間詞；`Besok hujan` 係預報，冇明示不確定。
  - subskill_id: certainty
    explanation: 有人問方法安唔安全，但你未查夠。`belum yakin` 係仍未有把握，`bahwa` 引入待評估說法。
    examples:
      - text: Saya belum yakin bahwa cara ini aman.
        meaning: 我仲未肯定呢個方法係安全嘅。 `cara ini aman` 係方法安全呢個命題；`Saya belum yakin`
          限定講者把握，唔係聽唔明字。
        note: 試講已經肯定安全。答案：`Saya sudah yakin bahwa cara ini aman.` `belum` 換
          `sudah`，把握程度改變。
