skill_id: possibilities_constraints
guidance: Recognize ability, permission, requirements, possibility and confidence. Bisa can
  express ability or practical opportunity; boleh commonly expresses permission. Saya tidak
  harus datang removes a requirement, while saya tidak boleh datang forbids coming. Mungkin
  hujan nanti presents possible rain; saya belum yakin states incomplete confidence. A
  straightforward rain report without a qualifier does not express possibility merely because
  rain could occur. A copied harus with no identifiable action or contextual requirement is
  absent. Boleh from the responsible person after a permission question can grant permission
  contextually. Distinguish harus as an obligation from any inference supported by context. A
  bisa question used to request another person’s help does not automatically assert their
  physical capacity. Ambiguity between correctly expressed ability and opportunity does not
  itself make group use unclear. Belum adds not-yet meaning and should not be treated as
  interchangeable with an unrestricted negative.
