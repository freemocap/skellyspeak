sections:
  - subskill_id: wants_intentions
    explanation: 活動前面加 ingin，表示想做嗰件事。之後可以用 belajar 交代想學嘅技能。
    examples:
      - text: Saya ingin belajar menjahit.
        meaning: 我想學縫紉。
        note: Ingin 表示 saya 嘅意願，唔等於向人承諾一定會去學。
  - subskill_id: preferences
    explanation: Lebih suka 比較喜好；daripada 引出相對冇咁鍾意嘅選項。
    examples:
      - text: Saya lebih suka menggambar daripada menulis.
        meaning: 比起寫嘢，我鍾意畫畫多啲。
        note: 呢個係講者自己嘅喜好比較，唔係替兩種活動作客觀排名。
  - subskill_id: emotions
    explanation: Senang 可以形容開心嘅感受；dengan 可以交代對乜嘢感到滿意。
    examples:
      - text: Saya senang dengan hasilnya.
        meaning: 我對個結果好滿意。
        note: 詞尾 -nya 將結果連返大家講緊嘅工作；senang 描述講者嘅反應。
  - subskill_id: opinions
    explanation: Menurut saya 引出個人判斷，後面嘅命題先係具體評價。
    examples:
      - text: Menurut saya, warna ini terlalu gelap.
        meaning: 我覺得呢隻色太深。
        note: Terlalu 表示超出講者用途或者標準所需嘅程度。
  - subskill_id: agreement_disagreement
    explanation: Setuju 表示同意，加 tidak 就變成唔同意；dengan 可以交代針對邊個立場。
    examples:
      - text: Saya tidak setuju dengan usulan itu.
        meaning: 我唔同意嗰個建議。
        note: 回應人哋提出嘅建議或觀點，表示反對，唔係單純聽唔明。
