sections:
  - subskill_id: wants_intentions
    explanation: You are discussing a personal learning goal. `ingin` before
      `belajar menjahit` expresses your desire to learn sewing; it does not
      promise that you have already begun.
    examples:
      - text: Saya ingin belajar menjahit.
        meaning: I want to learn to sew. `Saya` names the person wanting it, `belajar`
          means learn, and `menjahit` names sewing. The verbs do not take gender
          endings.
        note: "Say you want to learn to paint. Answer: `Saya ingin belajar melukis.`
          Replace the skill. `Saya bisa melukis` would instead assert ability."
  - subskill_id: preferences
    explanation: You are choosing between two activities. `lebih suka ... daripada
      ...` compares your liking for drawing with writing, rather than ranking
      either activity objectively.
    examples:
      - text: Saya lebih suka menggambar daripada menulis.
        meaning: I prefer drawing to writing. `Saya` is the person with the preference.
          `menggambar` follows `lebih suka` as the preferred activity; `menulis`
          after `daripada` is the comparison option.
        note: "Prefer writing to drawing. Answer: `Saya lebih suka menulis daripada
          menggambar.` Exchange the two activities. `Lebih murah` would compare
          price, not liking."
  - subskill_id: emotions
    explanation: A colleague shows you the finished work and asks how you feel.
      `senang dengan` links your positive feeling to the result under
      discussion.
    examples:
      - text: Saya senang dengan hasilnya.
        meaning: I am happy with the result. `Saya senang` says the speaker is happy;
          `hasilnya` is the result being discussed, with `-nya` referring back
          to that work.
        note: "Say you are disappointed with the result. Answer: `Saya kecewa dengan
          hasilnya.` Replace the emotion; the referent of `hasilnya` stays the
          same."
  - subskill_id: opinions
    explanation: While reviewing a design, you judge its colour too dark for the
      intended use. `Menurut saya` attributes the evaluation to you; `terlalu`
      marks a degree beyond your acceptable standard.
    examples:
      - text: Menurut saya, warna ini terlalu gelap.
        meaning: In my opinion, this colour is too dark. `warna ini` is this colour and
          `gelap` means dark. With `terlalu`, the claim is too dark for the
          purpose, not just a neutral description.
        note: "Say you think the colour is too bright. Answer: `Menurut saya, warna ini
          terlalu terang.` Change the evaluated quality; keep the viewpoint
          marker."
  - subskill_id: agreement_disagreement
    explanation: A partner has just proposed a change. `tidak setuju dengan` states
      that you disagree with that identifiable proposal, rather than saying you
      failed to understand it.
    examples:
      - text: Saya tidak setuju dengan usulan itu.
        meaning: I disagree with that proposal. `Saya` gives your stance, `usulan itu`
          points back to that proposal, and `tidak` negates `setuju`.
        note: "State agreement instead. Answer: `Saya setuju dengan usulan itu.` Remove
          `tidak`. `Saya mengerti` would only state understanding."
