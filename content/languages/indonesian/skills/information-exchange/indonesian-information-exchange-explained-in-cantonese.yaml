sections:
  - subskill_id: asking_information
    explanation: Jam berapa 問幾點，可以放喺述語後面，唔使倒裝或者額外加助動詞。
    examples:
      - text: Toko itu buka jam berapa?
        meaning: 嗰間舖頭幾點開門？
        note: 呢句問開門時間；berapa 問時間表達入面嘅數字。
  - subskill_id: answering_information
    explanation: 回答開門時間，可以直接講鐘點。表示幾點鐘時，jam 放喺數字前面。
    examples:
      - text: Jam delapan.
        meaning: 八點鐘。
        note: 回應舖頭幾點開門；留意 delapan jam 係八個鐘，唔係八點。
  - subskill_id: checking_facts
    explanation: 口語 kan 可以就雙方已經提過嘅命題尋求確認，實際作用要睇對話。
    examples:
      - text: Toko itu buka jam delapan, kan?
        meaning: 嗰間舖頭八點開門，係咪？
        note: 講者核實已經有人提過嘅開門時間，唔係由零開始問幾點。
  - subskill_id: useful_detail
    explanation: Yang 可以引出描述，分辨要揀邊件物品。位置資料有助喺幾個選項之中認出目標。
    examples:
      - text: Pakai meja yang dekat jendela.
        meaning: 用近窗口嗰張枱。
        note: 對方問用邊張枱時，yang dekat jendela 提供所需嘅區分。
