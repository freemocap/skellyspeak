sections:
  - subskill_id: asking_information
    explanation: 出發去舖頭前要知幾點開。`jam berapa` 問鐘點，`buka` 講開門；時間問題放事件後面，唔使照英文加助動詞。
    examples:
      - text: Toko itu buka jam berapa?
        meaning: 嗰間舖頭幾點開門？ `Toko itu` 指嗰間舖，`buka` 係開門，`jam berapa` 留低未知時間畀對方答。
        note: 試問關門時間。答案：`Toko itu tutup jam berapa?` 將 `buka` 換 `tutup`。`Toko itu buka?`
          係核實會唔會開。
  - subskill_id: answering_information
    explanation: 上句已經問咗邊間舖幾點開，單講鐘點就夠。`jam` 放喺鐘點數字前。
    examples:
      - text: Jam delapan.
        meaning: 八點鐘。 `Jam delapan` 係八點；開門事件由問題承接。倒轉成 `delapan jam` 就係八個鐘頭。
        note: 試答九點。答案：`Jam sembilan.` 換 `jam` 後面數字；`sembilan jam` 係時長。
  - subskill_id: checking_facts
    explanation: 你聽講間舖八點開，想核實。先講候選時間，再用句尾 `kan?` 請對方確認。
    examples:
      - text: Toko itu buka jam delapan, kan?
        meaning: 嗰間舖頭八點開門，係咪？ `Toko itu buka jam delapan` 係待核實說法；`kan?` 問啱唔啱，唔係問未知鐘點。
        note: 試核實九點開。答案：`Toko itu buka jam sembilan, kan?` 只換候選時間；`jam berapa?` 係由頭問時間。
  - subskill_id: useful_detail
    explanation: 有幾張枱，聽者要知用邊張。`yang dekat jendela` 將 `meja` 限定為窗邊嗰張。
    examples:
      - text: Pakai meja yang dekat jendela.
        meaning: 用近窗口嗰張枱。 `Pakai meja` 叫對方用枱，`yang dekat jendela` 加可辨認位置；因為有多張枱，呢個細節有用。
        note: 試指門邊嗰張。答案：`Pakai meja yang dekat pintu.` `jendela` 換 `pintu`；只講 `Pakai
          meja` 未解決邊張。
