sections:
  - subskill_id: asking_information
    explanation: Before going to the shop, you need its opening hour. `jam berapa`
      asks which clock time; `buka` states the event. The question phrase
      follows the event it measures, with no English-style auxiliary.
    examples:
      - text: Toko itu buka jam berapa?
        meaning: What time does that shop open? `Toko itu` points to that shop, `buka`
          means opens, and `jam berapa` leaves the hour unknown.
        note: "Ask for its closing hour. Answer: `Toko itu tutup jam berapa?` Replace
          `buka` with `tutup`. `Toko itu buka?` instead checks whether it
          opens."
  - subskill_id: answering_information
    explanation: "The opening-time question already names the shop. A clock-time
      phrase alone fills the missing detail: `jam` comes before the hour
      number."
    examples:
      - text: Jam delapan.
        meaning: At eight o’clock. `Jam delapan` means eight o’clock. The opening event
          is understood from the question; `delapan jam` reverses the order and
          means eight hours.
        note: "Answer nine o’clock. Answer: `Jam sembilan.` Change the number after
          `jam`. `Sembilan jam` is a duration, not the opening time."
  - subskill_id: checking_facts
    explanation: You have heard that the shop opens at eight and want confirmation.
      The proposed time comes before final `kan?`, which invites the listener to
      verify it.
    examples:
      - text: Toko itu buka jam delapan, kan?
        meaning: That shop opens at eight, right? `Toko itu buka jam delapan` gives the
          candidate fact. `kan?` asks whether that fact is right, rather than
          requesting an unknown hour.
        note: "Check a nine-o’clock opening. Answer: `Toko itu buka jam sembilan, kan?`
          Change only the proposed hour. `Jam berapa?` would ask for the hour
          from scratch."
  - subskill_id: useful_detail
    explanation: Several tables are available, so the listener needs a way to pick
      one. `yang dekat jendela` restricts `meja` to the table near the window.
    examples:
      - text: Pakai meja yang dekat jendela.
        meaning: Use the table near the window. `Pakai meja` asks the listener to use a
          table; `yang dekat jendela` supplies the distinguishing location. The
          phrase is useful because more than one table is in view.
        note: "Point to the table near the door. Answer: `Pakai meja yang dekat pintu.`
          Replace `jendela` with `pintu`. `Pakai meja` alone leaves the choice
          unresolved."
