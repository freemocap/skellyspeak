sections:
  - subskill_id: identification
    explanation: 向初次見 Rina 嘅人介紹佢。`Ini` 指呢位，`teman saya` 講同你嘅關係；呢種名詞述語唔使加 `adalah`。
    examples:
      - text: Ini teman saya, Rina.
        meaning: 呢位係我朋友 Rina。 `Teman` 係朋友，後面 `saya` 係我嘅，`Rina` 係姓名；句子介紹人物，唔係列財物。
        note: 試介紹 Budi。答案：`Ini teman saya, Budi.` 換姓名；`teman saya` 唔會因性別變形。
  - subskill_id: qualities_states
    explanation: 訪客問房間點樣。形容詞喺名詞片語後：`Kamar ini` 指呢間房，`terang` 講光猛；唔使加相當於英文 is 嘅詞。
    examples:
      - text: Kamar ini terang.
        meaning: 呢間房好光猛。 `Kamar` 係房，`ini` 指呢間，`terang` 係光猛；呢句講性質，唔係位置。
        note: 試講呢間房暗。答案：`Kamar ini gelap.` `terang` 換 `gelap`；唔好因英文有 is 就加繫詞。
  - subskill_id: location_movement
    explanation: 有人搵唔到你個袋。`di bawah meja` 指枱底；呢個分開寫嘅 `di` 係地點介詞，唔係動詞前綴 `di-`。
    examples:
      - text: Tas saya di bawah meja.
        meaning: 我個袋喺張枱下面。 `Tas saya` 係我個袋，`di bawah meja` 交代位置；句子講靜止位置，唔係目的地。
        note: 試講袋喺枱面。答案：`Tas saya di atas meja.` `bawah` 換 `atas`；`ke meja` 係向枱嘅目的地。
  - subskill_id: possession_relations
    explanation: 打包前點算物資。`Saya punya` 講邊個有物品，`tiga kotak` 數三個箱；數字已經講明數量。
    examples:
      - text: Saya punya tiga kotak.
        meaning: 我有三個箱。 `Saya` 係持有人，`punya` 係日常語境嘅有，`tiga kotak` 係三個箱；數字後名詞唔使重疊。
        note: 試講有兩個箱。答案：`Saya punya dua kotak.` `tiga` 換 `dua`。`Kotak saya` 係我嘅箱，未講數目。
  - subskill_id: quantity_comparison
    explanation: 搬箱前比較兩個箱。`lebih ringan daripada` 比重量，`daripada` 後面嗰個箱係基準。
    examples:
      - text: Kotak ini lebih ringan daripada kotak itu.
        meaning: 呢個箱比嗰個箱輕。 `Kotak ini` 係呢個箱，`kotak itu` 係嗰個；`lebih ringan`
          講第一個較輕，指示詞都喺名詞後。
        note: 試講呢個較重。答案：`Kotak ini lebih berat daripada kotak itu.` 性質換 `berat`，保留比較基準。
