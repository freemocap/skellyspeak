skill_id: people_places
guidance: Look for identification, attributes, spatial relations, possession and comparison or
  quantity. Ini teman saya identifies a person without obligatory adalah; kamar ini terang
  predicates an adjective without English be. Di locates, ke marks a destination, and dari gives
  an origin. Keep the separate preposition di distinct from the verbal prefix di-. Saya punya
  tiga kotak expresses possession and count; kotak saya identifies the possessor after the noun.
  Lebih ringan daripada compares a property, whereas saya lebih suka selects a preference. A
  numbered label such as bus tiga need not quantify three buses. A copied noun list with no
  identifiable relation is absent. Di sebelah pintu can answer a where-question contextually. Do
  not require plural reduplication after a number or grammatical gender agreement. Indonesian
  has meaningful word order and morphology despite lacking English inflection; assess the
  construction actually used. Register-appropriate punya is not invalid merely because mempunyai
  appears in formal teaching.
