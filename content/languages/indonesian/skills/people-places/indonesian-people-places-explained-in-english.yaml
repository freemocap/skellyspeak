sections:
  - subskill_id: identification
    explanation: You introduce Rina to someone meeting her for the first time. `Ini`
      points to the person and `teman saya` identifies your relationship to her.
      A noun predicate here needs no `adalah`.
    examples:
      - text: Ini teman saya, Rina.
        meaning: This is my friend Rina. `Teman` means friend and `saya` after it means
          my; `Rina` supplies the person’s name. The sentence identifies a
          person, not a possession inventory.
        note: "Introduce Budi as your friend. Answer: `Ini teman saya, Budi.` Replace
          the name; there is no gender agreement to change in `teman saya`."
  - subskill_id: qualities_states
    explanation: "A visitor asks what the room is like. The adjective follows the
      noun phrase: `Kamar ini` names this room and `terang` describes its
      brightness. No word equivalent to English is is required."
    examples:
      - text: Kamar ini terang.
        meaning: This room is bright. `Kamar` is room, `ini` selects this one, and
          `terang` means bright. It gives a property rather than a location.
        note: "Describe this room as dark. Answer: `Kamar ini gelap.` Replace `terang`
          with `gelap`; do not insert a copula just because English uses is."
  - subskill_id: location_movement
    explanation: Someone cannot find your bag. `di bawah meja` locates it under the
      table; this separate `di` is a place preposition, unlike attached verbal
      `di-` in a passive verb.
    examples:
      - text: Tas saya di bawah meja.
        meaning: My bag is under the table. `Tas saya` is my bag, and `di bawah meja`
          tells where it is. The sentence reports a static position, not a
          destination.
        note: "Locate the bag on the table. Answer: `Tas saya di atas meja.` Replace
          `bawah` with `atas`. `Ke meja` would point toward a destination
          instead."
  - subskill_id: possession_relations
    explanation: You are checking supplies before packing. `Saya punya` states who
      has the items, and `tiga kotak` counts three boxes. A numeral before the
      noun already gives the quantity.
    examples:
      - text: Saya punya tiga kotak.
        meaning: I have three boxes. `Saya` is the holder, `punya` means have in this
          everyday sentence, and `tiga kotak` means three boxes. The noun is not
          reduplicated after the number.
        note: "Say you have two boxes. Answer: `Saya punya dua kotak.` Change `tiga` to
          `dua`. `Kotak saya` means my box or boxes but does not itself state a
          count."
  - subskill_id: quantity_comparison
    explanation: You compare two boxes before deciding which to carry. `lebih ringan
      daripada` compares weight, with the box after `daripada` as the standard.
    examples:
      - text: Kotak ini lebih ringan daripada kotak itu.
        meaning: This box is lighter than that box. `Kotak ini` is this box and `kotak
          itu` that box. `Lebih ringan` says the first weighs less; the
          demonstratives follow their nouns.
        note: "Say this box is heavier than that one. Answer: `Kotak ini lebih berat
          daripada kotak itu.` Change the quality to `berat`; keep the
          comparison standard."
