            including di- versus di, and retain appropriate reduplication hyphens. Preserve quoted
            source spelling exactly.
          sources:
            - indonesian_eyd_v
        - scope: explanation_writing
          text: Use contemporary Indonesian spelling following EYD V. Keep affixes and prepositions distinct,
            including di- versus di, and retain appropriate reduplication hyphens. Preserve quoted
            source spelling exactly.
          sources:
            - indonesian_eyd_v
