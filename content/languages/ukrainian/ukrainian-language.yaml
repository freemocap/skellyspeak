      - Привіт!
      - Доброго ранку!
      - Добрий вечір!
      - Як справи?
      - Добре, дякую.
      - Як вас звати?
      - Дуже приємно.
      - Щиро дякую.
      - Нема за що.
      - Перепрошую.
      - Вибачте, будь ласка.
      - До побачення!
      - До зустрічі!
      - Гарного дня!
    idiomatic:
      - Не бий байдики.
      - Він пече раків.
      - Не замилюй мені очі.
      - У нього сім п’ятниць на тиждень.
      - Йому як з гуски вода.
      - У мене серце не на місці.
      - Грошей як кіт наплакав.
