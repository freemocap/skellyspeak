# yaml-language-server: $schema=../../rust-schemas/language.yaml
schema_version: 1
identity:
  id: ukrainian
  name: Ukrainian
  native_name: Українська
  family: indo-european
  review: needs_review
integrations:
  language_tag: uk
  transcription: uk
definitions:
  orthographies:
    modern-ukrainian:
      script: cyrillic
      guidance:
        - scope: target_writing
          text: Write contemporary Ukrainian in Ukrainian Cyrillic, preserving ґ, є, і, ї and the apostrophe.
            Keep г distinct from ґ. Preserve quoted source text exactly. Do not substitute Russian
            letters, vocabulary or romanization rules for Ukrainian.
          sources:
            - ala_lc_ukrainian2011
        - scope: explanation_writing
          text: Write contemporary Ukrainian in Ukrainian Cyrillic, preserving ґ, є, і, ї and the apostrophe.
            Keep г distinct from ґ. Preserve quoted source text exactly. Do not substitute Russian
            letters, vocabulary or romanization rules for Ukrainian.
          sources:
            - ala_lc_ukrainian2011
  romanization_schemes:
    ala-lc-ukrainian:
      label: ALA-LC Ukrainian
      instructions: Use the ALA-LC Ukrainian table as a spelling-based reading aid. Distinguish г h from ґ
        g, и y from і i, ї ï and й ĭ. Use tied i͡e, z͡h, t͡s, i͡u and i͡a for є, ж, ц, ю and я; use
        kh, ch, sh and shch. Retain ь as ʹ and preserve the source apostrophe. Do not use Russian
        letter mappings. Keep case and word boundaries; pronunciation and stress require separate
        explanation.
      examples:
        - original: Україна
          romanized: Ukraïna
        - original: ґанок
          romanized: ganok
        - original: гора
          romanized: hora
        - original: дякую
          romanized: di͡akui͡u
      sources:
        - ala_lc_ukrainian2011
      review: needs_review
defaults:
  variety: ukrainian-ukraine
  orthography:
    local: modern-ukrainian
  scalars: {}
  romanization:
    mode: scheme
    scheme: &a1
      local: ala-lc-ukrainian
  supported_romanizations:
    - *a1
traits: []
varieties:
  - id: ukrainian-ukraine
    name: Ukraine
    description: Contemporary Ukrainian in Ukraine, with standard writing and context-appropriate
      everyday conversation; no single regional accent is prescribed.
    review: needs_review
    sources:
      - ala_lc_ukrainian2011
    overrides: {}
    guidance: []
guidance: []
conversation:
  greeting:
    text: Добрий день
    romanizations:
      ukrainian:ala-lc-ukrainian: Dobryĭ denʹ
  default_partner:
    name: Олена
    romanizedName: Olena
    age: 31
    location: Lviv, Ukraine
    occupation: Works in a bookbinding studio
    background: Grew up in Lviv and learned bookbinding while helping at a local library.
    currentSituation: Repairing a family photo album and planning a walk with a friend.
    interests:
      - bookbinding
      - urban sketching
    opinions:
      - A repaired book should remain comfortable to use.
    interestingFacts:
      - Makes small notebooks from leftover paper.
    favoriteBooks:
      - The Little Prince — Antoine de Saint-Exupéry
    favoriteMovies:
      - My Neighbor Totoro (1988)
    manner: Attentive and direct. Uses everyday Ukrainian and concrete examples.
    quirks:
      - Dates every sketch.
    vibe:
      - 📖
      - ✏️
practice:
  review: needs_review
  sets:
    absolute_zero:
      - Так.
      - Ні.
      - Води, будь ласка.
      - Я тут.
      - Спекотно.
      - Я хочу їсти.
      - Що це?
      - Я не знаю.
    beginner:
      - Вона лікарка.
      - Ця кімната тиха.
      - У мене є велосипед.
      - Це моя сестра.
      - Нам потрібні два стільці.
      - У мене мало часу.
      - Я працюю тут.
      - Вона зараз читає.
    intermediate:
      - Я читала вчора.
      - Вона прочитала книжку.
      - Я буду працювати завтра.
      - Я прочитаю цю книжку.
      - Мені подобається чай.
      - Я хочу додому.
      - Я вмію плавати.
      - Мені треба йти.
    advanced:
      - Якби ми знали, що зустріч так затягнеться, то заздалегідь змінили б свої плани.
      - Найбільше мене непокоїть, як це рішення вплине на людей, з якими ніхто не порадився.
      - Хоча пропозиція здається перспективною, варто уважно оцінити її можливі наслідки.
      - Мені хотілося б, щоб ми відклали подорож, а не ухвалювали рішення поспіхом.
      - Що уважніше я читаю звіт, то менше довіри викликають у мене його висновки.
      - Успіх проєкту значною мірою залежатиме від того, наскільки розумно ми розподілимо обов'язки.
      - Річ не в тім, що я проти цієї ідеї; просто зараз, на мою думку, не найкращий час.
      - Коли ми зрозуміли, що сталося, виправити ситуацію було вже важко.
    social:
