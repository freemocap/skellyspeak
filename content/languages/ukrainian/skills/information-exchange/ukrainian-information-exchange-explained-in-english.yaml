sections:
  - subskill_id: asking_information
    explanation: Before visiting a workshop, the speaker needs its closing time. `О котрій годині` asks at
      which hour, and `зачиняється` names the closing event. The question targets an unknown time, rather
      than checking a proposed hour.
    examples:
      - text: О котрій годині зачиняється майстерня?
        meaning: What time does the workshop close? The speaker seeks the closing hour.
        note: "Ask when the workshop opens. Answer: `О котрій годині відчиняється майстерня?` Keep the time
          question and change the event from closing to opening."
  - subskill_id: answering_information
    explanation: "The workshop-closing question already supplies the event. `О п’ятій` is a sufficient time
      answer: `о` marks the clock-time relation and `п’ятій` is the feminine ordinal form agreeing with
      the understood hour `годині`."
    examples:
      - text: О п’ятій.
        meaning: At five o’clock. Reply to the workshop closing-time question; the ordinal form identifies the
          hour.
        note: "Answer that it closes at six. Answer: `О шостій.` Keep `о` and use the feminine ordinal for the
          sixth hour; the closing event remains recoverable."
  - subskill_id: checking_facts
    explanation: You heard the workshop closes at five and want confirmation. `Майстерня зачиняється о
      п’ятій` states the candidate fact; final `так?` invites verification. This differs from `о котрій
      годині`, which leaves the hour unknown.
    examples:
      - text: Майстерня зачиняється о п’ятій, так?
        meaning: The workshop closes at five, right? The speaker checks five o’clock rather than asking an open
          question.
        note: "Check whether the workshop closes at six. Answer: `Майстерня зачиняється о шостій, так?` Change
          the proposed hour and retain the confirmation tag."
  - subskill_id: useful_detail
    explanation: A visitor has reached the building but cannot find the entrance. `Вхід` identifies the
      needed feature; `з боку двору` locates it on the courtyard side. The side detail helps choose among
      entrances, rather than merely repeating the building name.
    examples:
      - text: Вхід з боку двору.
        meaning: The entrance is on the courtyard side. This answers a question about finding the entrance with a
          relevant landmark.
        note: "Direct the visitor to the entrance on the street side. Answer: `Вхід з боку вулиці.` Replace the
          landmark while preserving the useful side-of-building relation."
