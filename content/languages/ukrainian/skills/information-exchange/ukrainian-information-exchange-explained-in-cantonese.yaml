sections:
  - subskill_id: asking_information
    explanation: О котрій годині問事件嘅鐘點。
    examples:
      - text: О котрій годині зачиняється майстерня?
        meaning: 間工場幾點閂門？
        note: 講者想知關門時間。
  - subskill_id: answering_information
    explanation: 前面問題已經交代事件時，可以直接用時間短語回答。
    examples:
      - text: О п’ятій.
        meaning: 五點鐘。
        note: 回應工場關門時間；序數形式識別鐘點。
  - subskill_id: checking_facts
    explanation: 命題後面嘅так可以就候選事實尋求確認。
    examples:
      - text: Майстерня зачиняється о п’ятій, так?
        meaning: 間工場五點閂門，係咪？
        note: 講者核實五點，唔係開放式問幾點。
  - subskill_id: useful_detail
    explanation: 位置短語可以分辨聽者要搵嘅入口。
    examples:
      - text: Вхід з боку двору.
        meaning: 入口喺庭院嗰邊。
        note: 用相關地標回答點搵入口。
