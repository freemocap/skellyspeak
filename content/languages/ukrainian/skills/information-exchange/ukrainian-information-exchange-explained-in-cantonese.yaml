sections:
  - subskill_id: asking_information
    explanation: 去工場前，講者需要知道幾點關門。`О котрій годині` 問鐘點，`зачиняється` 講關門；問句索取未知時間，唔係核實已提出嘅時間。
    examples:
      - text: О котрій годині зачиняється майстерня?
        meaning: 間工場幾點閂門？ 講者想知關門時間。
        note: 試問工場幾點開門。答案：`О котрій годині відчиняється майстерня?` 保留時間問句，將關門改成開門。
  - subskill_id: answering_information
    explanation: 上句已經問工場幾點關，`О п’ятій` 單獨就可以答時間：`о` 標鐘點，`п’ятій` 係同省略咗嘅 `годині` 配合嘅陰性序數形式。
    examples:
      - text: О п’ятій.
        meaning: 五點鐘。 回應工場關門時間；序數形式識別鐘點。
        note: 試答六點關。答案：`О шостій.` 保留 `о`，第六個鐘點用陰性序數；關門事件仍由上文承接。
  - subskill_id: checking_facts
    explanation: 你聽講工場五點關，想核實。`Майстерня зачиняється о п’ятій` 先提出候選說法，句尾 `так?` 請對方確認；`о котрій годині` 則問未知鐘點。
    examples:
      - text: Майстерня зачиняється о п’ятій, так?
        meaning: 間工場五點閂門，係咪？ 講者核實五點，唔係開放式問幾點。
        note: 試核實工場係咪六點關。答案：`Майстерня зачиняється о шостій, так?` 換候選時間，保留確認語尾。
  - subskill_id: useful_detail
    explanation: 訪客到咗大樓但搵唔到入口。`Вхід` 係要搵嘅入口，`з боку двору` 指庭院嗰邊。位置細節幫佢分辨入口，唔係重複大樓名稱。
    examples:
      - text: Вхід з боку двору.
        meaning: 入口喺庭院嗰邊。 用相關地標回答點搵入口。
        note: 試指街嗰邊嘅入口。答案：`Вхід з боку вулиці.` 換地標，保留從大樓邊側定位嘅關係。
