sections:
  - subskill_id: causes_reasons
    explanation: Тому що引出前述情況原因。
    examples:
      - text: Я залишилася вдома, тому що пішов дощ.
        meaning: 因為開始落雨，我留咗喺屋企。
        note: 女性講者指出原因係落雨。
  - subskill_id: consequences
    explanation: Тому可以引出由此而起嘅結果。
    examples:
      - text: Автобус не приїхав, тому я пішла пішки.
        meaning: 架巴士冇嚟，所以我行路。
        note: 女性講者將行路表達成結果。
  - subskill_id: conditions
    explanation: Якщо引出可能實現嘅條件，結果可以用將來形式表達。
    examples:
      - text: Якщо завтра піде дощ, ми залишимося вдома.
        meaning: 如果聽日落雨，我哋就留喺屋企。
        note: 兩個分句都用將來形式；留家取決於條件。
  - subskill_id: contrast
    explanation: Але連接討論中有不同方向嘅描述。
    examples:
      - text: Дорога коротка, але крута.
        meaning: 條路短，但好斜。
        note: 比較路線時，呢個對比有實際作用。
  - subskill_id: supporting_claims
    explanation: 可觀察事實可以支持帶保留嘅結論。
    examples:
      - text: Думаю, хтось є вдома, тому що у вікні горить світло.
        meaning: 我諗有人喺屋企，因為窗口有燈光。
        note: 燈光係推論證據，唔係實際成因。
