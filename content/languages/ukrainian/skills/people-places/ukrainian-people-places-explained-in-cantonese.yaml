sections:
  - subskill_id: identification
    explanation: Це引出識別名詞短語，唔需要現在時繫詞。
    examples:
      - text: Це моя сусідка.
        meaning: 呢位係我鄰居。
        note: Моя配合陰性сусідка；鄰居係女性。
  - subskill_id: qualities_states
    explanation: 述語形容詞要同描述嘅主語配合。
    examples:
      - text: Ця вулиця вузька.
        meaning: 呢條街好窄。
        note: Ця同вузька都係陰性單數，配合вулиця。
  - subskill_id: location_movement
    explanation: На配合位置格，將物件定位喺表面。
    examples:
      - text: Ключ лежить на полиці.
        meaning: 鎖匙喺個架上面。
        note: 呢個結構嘅полиці係полиця嘅位置格。
  - subskill_id: possession_relations
    explanation: У加屬格擁有者，配合є，表示擁有。
    examples:
      - text: У мене є два стільці.
        meaning: 我有兩張凳。
        note: Мене指出擁有者；два стільці交代物件數量。
  - subskill_id: quantity_comparison
    explanation: 比較級可以用за引出基準。
    examples:
      - text: Ця коробка легша за ту.
        meaning: 呢個箱比嗰個輕。
        note: Легша配合коробка；ту指另一個箱，唔重複名詞。
