sections:
  - subskill_id: identification
    explanation: 介紹住喺附近嘅女性時，`Це` 指向呢個人；`моя сусідка` 講佢同你嘅關係。`моя` 同 `сусідка` 都係陰性單數，呢種現在時身份句唔使明講「係」。
    examples:
      - text: Це моя сусідка.
        meaning: 呢位係我鄰居。 `Моя`配合陰性`сусідка`；鄰居係女性。
        note: 試改為介紹女性朋友。答案：`Це моя подруга.` `Подруга` 仍係陰性，所以保留 `моя`；名詞轉換人物關係。
  - subskill_id: qualities_states
    explanation: 訪客問前面條街點樣。`Ця вулиця` 係呢條街，`вузька` 係窄；`ця` 同 `вузька` 都用陰性單數，配合 `вулиця`，唔使現在時繫詞。
    examples:
      - text: Ця вулиця вузька.
        meaning: 呢條街好窄。 `Ця`同`вузька`都係陰性單數，配合`вулиця`。
        note: 試講呢條街闊。答案：`Ця вулиця широка.` 保留陰性主語，用陰性 `широка` 講相反性質。
  - subskill_id: location_movement
    explanation: 有人搵鎖匙。`Ключ` 係要搵嘅物件，`лежить` 講佢放喺度，`на полиці` 係架上面。靜態位置嘅 `на` 後，`полиця` 變 `полиці`；移上去係另一種關係。
    examples:
      - text: Ключ лежить на полиці.
        meaning: 鎖匙喺個架上面。 呢個結構嘅`полиці`係`полиця`嘅位置格。
        note: 試講鎖匙喺枱面。答案：`Ключ лежить на столі.` 靜態 `на` 同 `лежить` 保留；新表面用位置格 `столі`。
  - subskill_id: possession_relations
    explanation: 點算傢俬時，講者話自己有兩張凳。`У мене є` 指物主同物件存在，`два стільці` 講數量。`у` 後用 `мене`，唔係主格 `я`。
    examples:
      - text: У мене є два стільці.
        meaning: 我有兩張凳。 `Мене`指出擁有者；`два стільці`交代物件數量。
        note: 試改成有兩張枱。答案：`У мене є два столи.` 保留物主結構，兩張枱用 `два столи`。
  - subskill_id: quantity_comparison
    explanation: 揀搬邊個箱時，`Ця коробка` 係被比較嘅箱；陰性比較級 `легша` 配合佢。`за ту` 用陰性形式指出另一個箱做基準，毋須重複 `коробка`。
    examples:
      - text: Ця коробка легша за ту.
        meaning: 呢個箱比嗰個輕。 `Легша`配合`коробка`；`ту`指另一個箱，唔重複名詞。
        note: 試講呢個箱比嗰個重。答案：`Ця коробка важча за ту.` 保留比較基準，用陰性 `важча` 講較重。
