skill_id: people_places
guidance: Assess identification, properties, location or movement, possession or relationships,
  and quantity or comparison. Це моя сусідка identifies a person without requiring an
  English-style present copula. Ця вулиця вузька predicates a property with relevant agreement.
  На полиці locates an object; до майстерні expresses a destination with the genitive. У мене є
  два стільці states possession. Два стільці counts items, while автобус номер два identifies a
  route without demonstrating a quantity relation. Легша за ту compares weight. A contextual На
  полиці can answer a where-question; a copied на without a recoverable relation is absent. Do
  not penalize natural word-order variation, omitted recoverable referents or ordinary у/в
  alternation. Check Ukrainian forms on their own terms rather than imposing Russian vocabulary
  or declension. Credit demonstrated relations even when an unrelated word elsewhere is
  imperfect.
