sections:
  - subskill_id: requests
    explanation: 禮貌或複數命令式配合будь ласка，請人做具體行動。
    examples:
      - text: Перенесіть цю коробку до дверей, будь ласка.
        meaning: 唔該搬呢個箱去門口。
        note: До дверей交代目的地。
  - subskill_id: offers_invitations
    explanation: 不定式問句可以向與格所指對象提供幫助。
    examples:
      - text: Вам допомогти із сумкою?
        meaning: 要唔要我幫你拎個袋？
        note: 講者提出自己行動；вам指出受助者。
  - subskill_id: suggestions
    explanation: 第一人稱複數命令式，可以提議包括講者嘅行動。
    examples:
      - text: Зробімо перерву.
        meaning: 不如我哋抖吓。
        note: Зробімо邀請共同參與，唔係只命令聽者。
  - subskill_id: commitments
    explanation: 將來陳述可以喺約定計劃中承擔責任。
    examples:
      - text: Я принесу інструменти завтра.
        meaning: 聽日我會帶工具嚟。
        note: 分工時用，講者負責工具。
  - subskill_id: accepting_declining
    explanation: 禮貌噉講自己出席唔到，可以拒絕之前嘅邀請。
    examples:
      - text: Перепрошую, сьогодні я не можу прийти.
        meaning: 唔好意思，我今日嚟唔到。
        note: 明確拒絕出席，之前邀請交代活動背景。
  - subskill_id: negotiating_plans
    explanation: 先講時間限制，再提可行替代方案。
    examples:
      - text: У п’ятницю я не можу. Зустріньмося в суботу.
        meaning: 我星期五唔得。不如星期六見。
        note: 第一個分句依賴之前嘅見面提議，第二個分句建議替代日子。
