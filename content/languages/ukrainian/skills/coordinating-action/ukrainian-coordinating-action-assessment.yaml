skill_id: coordinating_action
guidance: Look for requests, offers or invitations, proposals, commitments, acceptance or
  refusal, and negotiation. Перенесіть коробку, будь ласка requests an action. Вам допомогти?
  offers the speaker’s help through an infinitive question. Зробімо перерву proposes joint
  action with a first-person plural imperative. Я принесу інструменти завтра can accept an
  allocated task, but future reference alone does not establish commitment. Сьогодні не можу
  прийти declines a contextually identifiable invitation. Naming Saturday instead negotiates an
  alternative. Так can accept an actual offer contextually, not every preceding fact. A copied
  будь ласка without a recoverable request or response is absent. Imperative aspect, number and
  politeness depend on the action and relationship; do not require one fixed formula. Judge
  successful coordination rather than merely finding a command ending or modal word.
