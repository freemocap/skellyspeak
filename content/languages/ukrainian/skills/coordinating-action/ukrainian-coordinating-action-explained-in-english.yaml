sections:
  - subskill_id: requests
    explanation: A box is ready for pickup, and the speaker needs it brought near the door. `Перенесіть` is a polite/plural
      imperative addressed to the listener; `цю коробку` is its feminine accusative object, and `до
      дверей` gives the destination. `Будь ласка` softens the request.
    examples:
      - text: Перенесіть цю коробку до дверей, будь ласка.
        meaning: Please move this box to the door. `До дверей` gives the destination.
        note: "Ask them to move this box to the window. Answer: `Перенесіть цю коробку до вікна, будь ласка.`
          Change the destination after `до`; retain the polite imperative and object."
  - subskill_id: offers_invitations
    explanation: Someone is carrying a bag and could use help. `Вам` marks the respectful/plural person who
      would benefit; infinitive question `допомогти` offers the speaker’s action, and `із сумкою` names
      what they need help with. It does not ask whether the listener is able to help.
    examples:
      - text: Вам допомогти із сумкою?
        meaning: Shall I help you with the bag? The speaker offers to act; `вам` identifies the recipient.
        note: "Offer to help with the box instead. Answer: `Вам допомогти з коробкою?` Keep the offer and dative
          recipient; change the item in the help phrase."
  - subskill_id: suggestions
    explanation: The group has worked for a while and could pause. `Зробімо` is a first-person plural
      imperative proposing a joint action; `перерву` names a break as its object. It includes the
      speaker, rather than commanding only the listener.
    examples:
      - text: Зробімо перерву.
        meaning: Let’s take a break. `Зробімо` invites joint action rather than ordering only the listener.
        note: "Suggest doing the check together. Answer: `Зробімо перевірку.` Keep the inclusive first-person
          plural directive and change the shared action."
  - subskill_id: commitments
    explanation: While dividing repair tasks, the speaker takes responsibility for the tools. `Я принесу` is
      first-person perfective future for bringing them; `завтра` fixes the day. The task-allocation
      exchange makes this an undertaking, whereas future form alone could simply predict an event.
    examples:
      - text: Я принесу інструменти завтра.
        meaning: I will bring the tools tomorrow. Use while assigning tasks; the speaker takes responsibility for
          the tools.
        note: "Undertake to bring the radio tomorrow. Answer: `Я принесу радіо завтра.` Change the item while
          retaining the first-person future and responsibility context."
  - subskill_id: accepting_declining
    explanation: Someone invited the speaker to come today, but attendance is impossible. `Перепрошую` marks
      the social apology; `сьогодні я не можу прийти` states today’s constraint. In reply to that
      invitation it declines, while without the invitation it could merely report availability.
    examples:
      - text: Перепрошую, сьогодні я не можу прийти.
        meaning: Sorry, I cannot come today. The declined attendance is explicit; the previous invitation
          supplies its setting.
        note: "Someone now invites you to a different event tomorrow. Decline that invitation. Answer:
          `Перепрошую, завтра я не можу прийти.` Change the day; the new invitation makes the inability a refusal."
  - subskill_id: negotiating_plans
    explanation: A meeting was proposed for Friday, but the speaker cannot attend then. `У п’ятницю я не
      можу` states the conflict with an understood meeting; `Зустріньмося в суботу` proposes a shared
      meeting on Saturday. The second clause repairs the plan rather than merely naming a day.
    examples:
      - text: У п’ятницю я не можу. Зустріньмося в суботу.
        meaning: I cannot on Friday. Let’s meet on Saturday. The first clause relies on the proposed meeting, and
          the second proposes a replacement day.
        note: "Reject Friday and propose Sunday. Answer: `У п’ятницю я не можу. Зустріньмося в неділю.` Retain
          the conflict and change the proposed meeting day."
