skill_id: managing_conversation
guidance: Assess opening or closing, acknowledgement, clarification, rephrasing, correcting
  misunderstanding and managing turns or topics. До зустрічі closes contact. Тепер зрозуміло
  acknowledges understanding without necessarily agreeing. Повторіть, будь ласка requests
  repetition; Іншими словами introduces a reformulation of something already explained. Я мала
  на увазі суботу, не п’ятницю corrects a mistaken interpretation. Можна перейти до іншого
  питання? requests a conversational transition rather than permission for an unrelated external
  action. A copied greeting word embedded in a vocabulary list is absent as interactional
  evidence. A brief так may acknowledge a specific contribution contextually, but its function
  depends on that exchange. Do not require long sentences for effective repair, invent missing
  antecedents, or reject natural subject omission. A new question about an external fact is not
  automatically a clarification of wording.
