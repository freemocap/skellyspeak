sections:
  - subskill_id: opening_closing
    explanation: 探訪完結，雙方預計下星期再見。`До зустрічі` 係道別，`наступного тижня` 講下次見面時間。喺詞彙表引用同一句唔等於真係道別。
    examples:
      - text: До зустрічі наступного тижня!
        meaning: 下星期見！ 呢句結束今次交談。
        note: 試改成聽日再見。答案：`До зустрічі завтра!` 保留道別語，換下次接觸時間。
  - subskill_id: acknowledging
    explanation: 對方啱啱解釋操作。`А` 表示收到新資訊，`тепер зрозуміло` 講而家清楚，毋須明講邊個明白。呢句接收解釋，但唔一定同意對方意見。
    examples:
      - text: А, тепер зрозуміло.
        meaning: 哦，我而家明喇。 解釋後用；理解唔一定表示同意。
        note: 試唔講「而家」而表示明白。答案：`А, зрозуміло.` 前文交代明白咗乜，唔暗示贊成。
  - subskill_id: clarification
    explanation: 你聽漏咗上句。`Повторіть` 係禮貌／複數命令式，請對方重講；`будь ласка` 令請求更客氣。前文交代要重複乜。
    examples:
      - text: Повторіть, будь ласка.
        meaning: 唔該再講一次。 前面發言交代要重複乜。
        note: 試請對方重講最後一個字。答案：`Повторіть останнє слово, будь ласка.` 講明聽漏嘅部分，保留禮貌命令式同請求詞。
  - subskill_id: rephrasing
    explanation: 預約程序規定要提前訂位，聽者需要較清楚講法。`Іншими словами` 表示下句重述同一要求；`потрібно записатися заздалегідь` 講要預先預約。
    examples:
      - text: Іншими словами, потрібно записатися заздалегідь.
        meaning: 即係話，你要預先訂位。 解釋預約程序之後用。
        note: 聽者啱啱解釋呢個預約規則適用於你。試重述成自己需要預約。答案：`Іншими словами, мені потрібно записатися заздалегідь.` 與格 `мені` 指你係要預約嘅人；提前預約要求不變。
  - subskill_id: correcting_misunderstanding
    explanation: 聽者以為你指星期五，女性講者其實指星期六。`Мала на увазі` 係女性講者過去表達本意嘅形式；`суботу, не п’ятницю` 先講原意，再否定聽錯嘅日子。
    examples:
      - text: Я мала на увазі суботу, не п’ятницю.
        meaning: 我係指星期六，唔係星期五。 女性講者更正聽者理解錯咗嘅日子。
        note: 同一位女性講者試將聽錯嘅星期日更正為星期一。答案：`Я мала на увазі понеділок, не неділю.` 先講本意星期一，再排除星期日。
  - subskill_id: turns_topics
    explanation: 共同討論時，講者想轉去另一件事。`Можна` 問可唔可以轉，`перейти до іншого питання` 指新話題。小組語境交代邊啲人會繼續傾。
    examples:
      - text: Можна перейти до іншого питання?
        meaning: 我哋可唔可以轉去另一條問題？ 共同討論時，語境識別省略咗嘅行動者；要求係轉換對話內容。
        note: 試問可唔可以改講時間表。答案：`Можна перейти до розкладу?` `до` 後換新話題，保留管理對話轉場嘅問法。
