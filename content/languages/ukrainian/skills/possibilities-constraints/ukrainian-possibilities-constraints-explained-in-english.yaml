sections:
  - subskill_id: ability
    explanation: Уміти with an infinitive names a learned capability.
    examples:
      - text: Я вмію лагодити велосипеди.
        meaning: I know how to repair bicycles.
        note: Вмію states a practical skill, not permission to work on a particular bicycle.
  - subskill_id: permission
    explanation: Можна with an infinitive can ask whether an action is allowed.
    examples:
      - text: Можна тут залишити сумку?
        meaning: May I leave my bag here?
        note: Ask the person responsible for the space to establish the permission context.
  - subskill_id: obligation
    explanation: Потрібно with an infinitive expresses necessity and can take a dative experiencer.
    examples:
      - text: Мені потрібно повернути ключ сьогодні.
        meaning: I need to return the key today.
        note: Мені identifies who must act; сьогодні gives the deadline.
  - subskill_id: possibility
    explanation: Можливо qualifies a proposition as possible.
    examples:
      - text: Можливо, ввечері буде дощ.
        meaning: It may rain this evening.
        note: The sentence leaves the weather outcome open.
  - subskill_id: certainty
    explanation: Не впевнений expresses lack of confidence in the following proposition.
    examples:
      - text: Я не впевнена, що крамниця відчинена.
        meaning: I am not sure that the shop is open.
        note: The feminine speaker is uncertain; she does not assert that the shop is closed.
