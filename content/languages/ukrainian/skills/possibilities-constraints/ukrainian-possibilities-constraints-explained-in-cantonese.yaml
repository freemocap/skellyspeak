sections:
  - subskill_id: ability
    explanation: Уміти加不定式交代學識嘅能力。
    examples:
      - text: Я вмію лагодити велосипеди.
        meaning: 我識整單車。
        note: Вмію陳述實際技能，唔係整某架單車嘅許可。
  - subskill_id: permission
    explanation: Можна加不定式可以問行動獲唔獲准。
    examples:
      - text: Можна тут залишити сумку?
        meaning: 我可唔可以放個袋喺度？
        note: 向管理地方嘅人詢問，確立許可語境。
  - subskill_id: obligation
    explanation: Потрібно加不定式表示必要，可以帶與格感受者。
    examples:
      - text: Мені потрібно повернути ключ сьогодні.
        meaning: 我今日要還鎖匙。
        note: Мені指出邊個要做，сьогодні交代限期。
  - subskill_id: possibility
    explanation: Можливо將命題限定為可能。
    examples:
      - text: Можливо, ввечері буде дощ.
        meaning: 今晚可能落雨。
        note: 句子保留天氣結果嘅不確定性。
  - subskill_id: certainty
    explanation: Не впевнений表達對後面命題冇把握。
    examples:
      - text: Я не впевнена, що крамниця відчинена.
        meaning: 我唔肯定間舖頭開咗未。
        note: 女性講者表示唔肯定，冇斷言間舖頭閂咗。
