sections:
  - subskill_id: present_events
    explanation: A colleague asks what is happening at the repair bench now. `Зараз` fixes the present
      moment; `ремонтую` is first-person imperfective present and presents the bicycle repair as ongoing.
      It does not claim the job is finished.
    examples:
      - text: Зараз я ремонтую велосипед.
        meaning: I am repairing a bicycle now. `Зараз` anchors the activity to the present situation.
        note: "Say you are repairing a radio now. Answer: `Зараз я ремонтую радіо.` Change the object; retain
          `зараз` and imperfective `ремонтую` for an action in progress."
  - subskill_id: past_events
    explanation: A speaker reports a bicycle repair completed yesterday. `Учора` locates it in the past;
      perfective `полагодила` presents a bounded repair and its `-ла` form agrees with a feminine
      singular speaker. A masculine speaker would say `полагодив`.
    examples:
      - text: Учора я полагодила велосипед.
        meaning: Yesterday I repaired a bicycle. `Полагодила` is feminine singular; a masculine speaker would use
          `полагодив`.
        note: "For the same feminine speaker, say she repaired a radio yesterday. Answer: `Учора я полагодила
          радіо.` The object changes, while `полагодила` retains past completion and feminine agreement."
  - subskill_id: future_events
    explanation: You arrange to collect repair parts tomorrow. `Завтра` names the day; `заберу` is
      first-person singular perfective future, presenting the collection as a single bounded event. It
      does not need a separate `буду` auxiliary.
    examples:
      - text: Завтра я заберу деталі.
        meaning: Tomorrow I will collect the parts. `Заберу` is first-person singular; `завтра` gives the day.
        note: "Say you will collect the bicycle tomorrow. Answer: `Завтра я заберу велосипед.` Change what is
          collected; retain `заберу` for the planned bounded pickup."
  - subskill_id: duration_frequency
    explanation: Someone asks about your swimming routine. `Двічі` counts two occurrences, and `на тиждень`
      states the weekly interval. This is frequency; `дві години` would measure time spent in one
      session.
    examples:
      - text: Я плаваю двічі на тиждень.
        meaning: I swim twice a week. This gives frequency, not the length of one swimming session.
        note: "Say you swim three times a week. Answer: `Я плаваю тричі на тиждень.` Change the occurrence count
          to `тричі`; keep the weekly interval."
  - subskill_id: event_sequence
    explanation: The speaker gives a food-preparation order. `Спочатку` puts washing hands first; `потім`
      introduces preparing vegetables afterward. `Вимийте` is a polite/plural perfective directive to
      finish washing, while `готуйте` presents the subsequent preparation activity.
    examples:
      - text: Спочатку вимийте руки, потім готуйте овочі.
        meaning: First wash your hands, then prepare the vegetables. The polite or plural imperatives describe a
          procedure.
        note: "Keep washing first, then ask the listener to cut the vegetables. Answer: `Спочатку вимийте руки,
          потім наріжте овочі.` `Наріжте` gives a bounded next step; the sequence markers preserve the
          safe order."
  - subskill_id: event_phase
    explanation: A friend asks whether you have finished the book. `Дочитала` says the reading reached its
      endpoint, with feminine singular past agreement. It differs from `читала`, which can report reading
      without by itself guaranteeing the endpoint.
    examples:
      - text: Я дочитала книжку.
        meaning: I finished reading the book. The feminine speaker reports finishing the reading, not simply
          spending time on it.
        note: "For the same feminine speaker, say she finished reading the newspaper. Answer: `Я дочитала
          газету.` Keep `дочитала` for completion and change the read object to accusative `газету`."
