skill_id: time_events
guidance: Assess temporal reference, duration or recurrence, ordering and phases of events.
  Зараз я ремонтую велосипед describes an ongoing activity with an imperfective present. Учора я
  полагодила велосипед uses a feminine past form for a bounded repair. Завтра я заберу деталі
  uses a perfective future; буду читати and читатиму are both legitimate imperfective futures.
  Do not require an auxiliary in every future sentence or infer noncompletion from every
  imperfective past. Двічі на тиждень gives frequency; дві години can measure duration. Спочатку
  and потім sequence actions; дочитала marks reaching the reading endpoint. Учора can answer a
  specific when-question contextually. A copied time word without an identifiable event is
  absent. A property assertion alone is not evidence of temporal organization. Judge the
  relevant aspect and agreement while preserving contextual subject omission and without
  inferring the speaker’s gender from unrelated information.
