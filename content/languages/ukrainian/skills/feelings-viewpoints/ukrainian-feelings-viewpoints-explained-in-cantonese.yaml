sections:
  - subskill_id: wants_intentions
    explanation: 喺縫紉工作坊，講者講學習目標。`Я хочу` 係想做，完成體不定式 `навчитися` 聚焦學識技能，`шити` 係縫紉。想學唔代表已開始上堂。
    examples:
      - text: Я хочу навчитися шити.
        meaning: 我想學縫紉。 `Навчитися`關乎學識技能；句子表達願望。
        note: 試講想學煮食。答案：`Я хочу навчитися готувати.` 保留願望同學識技能結構，技能不定式改 `готувати`。
  - subskill_id: preferences
    explanation: 揀飲品時，講者比較茶同咖啡。`Мені` 係感受喜好嘅與格形式；`більше подобається чай` 講茶更合心意，`ніж кава`
      係另一選項。較鍾意嘅飲品係句法主語，唔係英文 like 後嘅賓語。
    examples:
      - text: Мені більше подобається чай, ніж кава.
        meaning: 比起咖啡，我鍾意茶多啲。 `Мені`指出描述緊邊個嘅喜好。
        note: 試改成較鍾意咖啡。答案：`Мені більше подобається кава, ніж чай.` 對調兩種飲品，保留與格感受者 `мені`。
  - subskill_id: emotions
    explanation: 女性講者聽到好消息。`Рада` 表示開心，並配合女性講者；`цій новині` 係與格，指出令佢開心嘅消息。男性講者會用 `радий`，消息片語唔變。
    examples:
      - text: Я рада цій новині.
        meaning: 聽到呢個消息，我好開心。 `Цій новині`係與格；男性講者會用`радий`。
        note: 試由男性講者表達同樣感受。答案：`Я радий цій новині.` 將 `рада` 改 `радий` 配合講者；`цій новині` 仍係與格。
  - subskill_id: opinions
    explanation: 討論做法時，`На мою думку` 將評價標成講者觀點。`Цей спосіб` 係被評估嘅陽性「方法」；比較級 `зручніший` 配合佢，講比另一選項方便。
    examples:
      - text: На мою думку, цей спосіб зручніший.
        meaning: 我覺得呢個方法方便啲。 講者評價討論緊嘅方法。
        note: 試講呢個方法冇咁方便。答案：`На мою думку, цей спосіб менш зручний.` 保留觀點標記；`менш зручний` 反轉評價並配合 `спосіб`。
  - subskill_id: agreement_disagreement
    explanation: 同事提出改動。`Я не погоджуюся` 係唔同意；`з цією пропозицією` 係 `з` 後工具格形式，指出邊個建議。理解建議同接受建議係兩回事。
    examples:
      - text: Я не погоджуюся з цією пропозицією.
        meaning: 我唔同意呢個建議。 `З цією пропозицією`指出反對嘅建議。
        note: 試改成同意同一建議。答案：`Я погоджуюся з цією пропозицією.` 去掉 `не`；`з` 後保留工具格建議片語。
