sections:
  - subskill_id: wants_intentions
    explanation: Хочу加不定式交代想做嘅行動。
    examples:
      - text: Я хочу навчитися шити.
        meaning: 我想學縫紉。
        note: Навчитися關乎學識技能；句子表達願望。
  - subskill_id: preferences
    explanation: Подобається用與格標示感受者；більше同ніж比較選項。
    examples:
      - text: Мені більше подобається чай, ніж кава.
        meaning: 比起咖啡，我鍾意茶多啲。
        note: Мені指出描述緊邊個嘅喜好。
  - subskill_id: emotions
    explanation: Рада表示高興，配合女性感受者。
    examples:
      - text: Я рада цій новині.
        meaning: 聽到呢個消息，我好開心。
        note: Цій новині係與格；男性講者會用радий。
  - subskill_id: opinions
    explanation: На мою думку將後面命題標示為個人評價。
    examples:
      - text: На мою думку, цей спосіб зручніший.
        meaning: 我覺得呢個方法方便啲。
        note: 講者評價討論緊嘅方法。
  - subskill_id: agreement_disagreement
    explanation: Погоджуватися з將同意連到人或建議；не作否定。
    examples:
      - text: Я не погоджуюся з цією пропозицією.
        meaning: 我唔同意呢個建議。
        note: З цією пропозицією指出反對嘅建議。
