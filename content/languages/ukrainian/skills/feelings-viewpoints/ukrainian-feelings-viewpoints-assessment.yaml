skill_id: feelings_viewpoints
guidance: Judge desire or intention, preference, emotion, opinion and agreement. Я хочу
  навчитися шити expresses wanting to acquire a skill, not a promise to complete a task. Мені
  більше подобається чай, ніж кава compares preferences with a dative experiencer. Я рада цій
  новині expresses gladness; На мою думку frames a personal evaluation. Я не погоджуюся з цією
  пропозицією rejects a proposal. Зрозуміло acknowledges comprehension without necessarily
  endorsing the view. Чай can select a preferred drink contextually after a preference question;
  naming it in an inventory is not preference evidence. A copied хочу with no recoverable
  desired action is absent. Do not treat every factual assertion as opinion. Assess Ukrainian
  stance constructions and their relevant agreement without demanding a redundant personal
  pronoun or importing another language’s preferred expression.
