sections:
  - subskill_id: wants_intentions
    explanation: At a sewing workshop, the speaker describes a learning goal. `Я хочу` gives the desire;
      perfective infinitive `навчитися` focuses on acquiring the skill, and `шити` names sewing. Wanting
      to learn does not assert that the training has begun.
    examples:
      - text: Я хочу навчитися шити.
        meaning: I want to learn to sew. `Навчитися` concerns acquiring the ability; the sentence expresses
          desire.
        note: "Say you want to learn to cook. Answer: `Я хочу навчитися готувати.` Keep the desire and learning
          frame; change the skill infinitive to `готувати`."
  - subskill_id: preferences
    explanation: While choosing drinks, the speaker compares tea with coffee. `Мені` is the dative person
      experiencing the liking; `більше подобається чай` says tea appeals more, and `ніж кава` names the
      alternative. The preferred item is grammatical subject, not an object after an English-style like
      verb.
    examples:
      - text: Мені більше подобається чай, ніж кава.
        meaning: I prefer tea to coffee. `Мені` identifies whose preference is being described.
        note: "Prefer coffee to tea instead. Answer: `Мені більше подобається кава, ніж чай.` Swap the two drink
          nouns while retaining the dative experiencer `мені`."
  - subskill_id: emotions
    explanation: A feminine speaker has heard welcome news. `Рада` expresses gladness and agrees with her;
      `цій новині` is dative, naming the news that prompts the feeling. A masculine speaker would use
      `радий` with the same news phrase.
    examples:
      - text: Я рада цій новині.
        meaning: I am glad about this news. `Цій новині` is dative; a masculine speaker would use `радий`.
        note: "For a masculine speaker, express the same gladness. Answer: `Я радий цій новині.` Change `рада` to
          `радий` for the speaker; `цій новині` remains dative."
  - subskill_id: opinions
    explanation: In a discussion of methods, `На мою думку` marks the assessment as the speaker’s view. `Цей
      спосіб` is the masculine method being judged; comparative `зручніший` agrees with it and says it is
      more convenient relative to another option.
    examples:
      - text: На мою думку, цей спосіб зручніший.
        meaning: In my opinion, this method is more convenient. The speaker evaluates a method under discussion.
        note: "Say this method is less convenient. Answer: `На мою думку, цей спосіб менш зручний.` Keep the
          viewpoint marker; `менш зручний` reverses the evaluation and agrees with `спосіб`."
  - subskill_id: agreement_disagreement
    explanation: A colleague has proposed a change. `Я не погоджуюся` states disagreement; `з цією
      пропозицією` names the proposal in the instrumental after `з`. Understanding the proposal would be
      a separate act from accepting it.
    examples:
      - text: Я не погоджуюся з цією пропозицією.
        meaning: I disagree with this proposal. `З цією пропозицією` identifies the proposal being rejected.
        note: "State agreement with the same proposal. Answer: `Я погоджуюся з цією пропозицією.` Remove `не`;
          keep the instrumental proposal phrase after `з`."
