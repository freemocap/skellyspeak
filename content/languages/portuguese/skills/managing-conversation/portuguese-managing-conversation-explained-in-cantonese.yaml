shared_explanation: skills/managing-conversation/managing-conversation-explained-in-cantonese.yaml
sections:
  - subskill_id: opening_closing
    explanation: "夜晚傾完偈，你預計聽日再見。`Até amanhã! Boa noite!` 用嚟結束對話：`até` 指向下一次見面，`amanhã` 係聽日，`boa noite` 係祝對方晚安。喺見面結束時，呢啲字有道別作用，唔只係日期同夜晚描述。下星期再見可以講 `Até a semana que vem!`。開頭打招呼就係另一種對話動作。"
    examples:
      - text: Até amanhã! Boa noite!
        meaning: 聽日見！早唞！
        note: "預計星期六再見，結束對話：`Até sábado! Boa noite!`。佢講明下次見面日子同夜晚道別；`sábado` 取代 `amanhã`。"
  - subskill_id: acknowledging
    explanation: "有人解釋借返嚟嘅書點還。即時答 `Entendi`，就係「我明白喇」。佢係 `entender` 嘅第一身完成過去式，但喺呢度表示啱啱收到解釋，唔係另講尋日發生嘅事；主語「我」已包含喺動詞。聽明解釋唔一定同意其中意見；`concordo` 先明確表示同意。"
    examples:
      - text: Entendi.
        meaning: 我明喇。
        note: "回應指示並道謝：男講者可講 `Entendi, obrigado.`，女講者可講 `Entendi, obrigada.`。兩句都由 `Entendi` 表示明白。"
  - subskill_id: clarification
    explanation: "對方話開放時間係暫定，你唔明佢所講嘅字。`O que você quer dizer com provisório?` 係請佢澄清：`o que` 問「乜嘢」，`você quer dizer` 係「你想表達」，`com provisório` 指出有疑問嘅詞。佢修補對字義嘅理解，唔係核實某個開門時間係咪真。之前嗰句令問題有明確對象。"
    examples:
      - text: O que você quer dizer com provisório?
        meaning: 你講「暫定」係咩意思？
        note: "改問 `temporário` 呢個字：`O que você quer dizer com temporário?`。對方用咗呢個字之後，問句就完整；`com` 帶出需要解釋嘅詞。"
  - subskill_id: rephrasing
    explanation: "借書人聽唔明「借期星期五屆滿」嘅解釋。`Em outras palavras, você pode ficar com o livro até sexta` 用另一種講法表達同一個實際限制。`Em outras palavras` 標示改述，`você pode ficar com o livro` 係可以保留本書，`até sexta` 係到星期五為止。佢將抽象規則改成借書人可以做乜。若原本截止星期五，改講 `até segunda` 就改變咗意思，唔再係忠實改述。"
    examples:
      - text: Em outras palavras, você pode ficar com o livro até sexta.
        meaning: 即係話，你可以留住本書到星期五。
        note: "如果原本規則係星期一到期，就改述為 `Em outras palavras, você pode ficar com o livro até segunda.`。呢句完整保留星期一截止，`até segunda` 將終點講清楚。"
  - subskill_id: correcting_misunderstanding
    explanation: "對方重複星期五，但你原意係星期六。`Eu quis dizer sábado, não sexta` 修正誤會：`eu quis dizer` 係「我意思係」，`sábado` 係原本想講嘅日子，`não sexta` 明確否定聽錯嘅日子。`Quis` 喺呢個講法入面係 `querer` 嘅第一身過去式。熟人間單答 `sábado` 有時都得，但完整句更清楚。"
    examples:
      - text: Eu quis dizer sábado, não sexta.
        meaning: 我係指星期六，唔係星期五。
        note: "對方將星期六聽成星期四：`Eu quis dizer sábado, não quinta.`。一句同時指出正確日子同要否定嘅理解。"
  - subskill_id: turns_topics
    explanation: "大家揀完書，開始傾實際安排。`Posso falar dos horários agora?` 係請求輪到自己講時間表：`posso` 係「我可唔可以」，`falar de` 係講關於，`dos` 由 `de` 同複數 `os` 合成，`agora` 係而家。喺呢個對話，你係請求發言同轉話題，唔係問自己有冇能力講嘢。"
    examples:
      - text: Posso falar dos horários agora?
        meaning: 我而家可唔可以講吓時間安排？
        note: "改為請求討論價錢：`Posso falar dos preços agora?`。呢句完整地請求轉話題；`dos preços` 取代 `dos horários`。"
