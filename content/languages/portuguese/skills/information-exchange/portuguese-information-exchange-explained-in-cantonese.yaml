sections:
  - subskill_id: asking_information
    explanation: "你想聽日去圖書館，要先知開門時間。`A que horas a biblioteca abre amanhã?` 問幾點：`a que horas` 係「喺幾點」，`a biblioteca` 係主語，`abre` 係開門，`amanhã` 係聽日。巴西葡語問句入面主語可以留喺動詞前，唔使加英文 do。相反，`A biblioteca abre às oito?` 提出八點，係請人確認。"
    examples:
      - text: A que horas a biblioteca abre amanhã?
        meaning: 圖書館聽日幾點開門？
        note: "問聽日幾點關門：`A que horas a biblioteca fecha amanhã?`。呢句完整地問未知時間；`fecha` 取代 `abre`，`a que horas` 仍然問缺少嘅鐘點。"
  - subskill_id: answering_information
    explanation: "對方啱啱問圖書館幾點開。`Às oito` 唔使重複全句，已經答到八點。`Às` 係表示時間嘅 `a` 同複數冠詞 `as` 合成；大家明白係鐘點時可以唔講 `horas`。短答之所以完整，係因為前一句問題已講明邊件事喺嗰個時間發生；單獨一句就唔知講緊邊度開門。"
    examples:
      - text: Às oito.
        meaning: 八點。
        note: "答九點開：`Às nove.`。喺開門時間問題後已經足夠；`nove` 取代 `oito`，其他意思由共同問題提供。"
  - subskill_id: checking_facts
    explanation: "你聽講圖書館八點開，出門前想核實。`A biblioteca abre às oito, não é?` 先提出你相信嘅事實；`não é?` 再請對方確認，近似「係咪？」。`Às oito` 係八點，`às` 由 `a` 加 `as` 合成。對方可以確認，亦可以糾正八點。`A que horas a biblioteca abre?` 就冇先提出時間，而係開放式發問。"
    examples:
      - text: A biblioteca abre às oito, não é?
        meaning: 圖書館八點開門，係咪？
        note: "核實係咪九點開：`A biblioteca abre às nove, não é?`。先提出九點呢個事實，再請對方確認；改變嘅係鐘點 `nove`。"
  - subskill_id: useful_detail
    explanation: "訪客知道棟樓，但搵唔到入口。`A entrada fica na lateral, ao lado do jardim` 畀兩個有用地標：`fica` 表示位置，`na lateral` 係側面（`em` 加 `a`），`ao lado do jardim` 係花園旁邊（`a` 加 `o`；`de` 加 `o`）。第二段令訪客知道應該搵邊一側。只講 `A entrada fica na lateral` 可能仲要四圍搵；加上花園先真正收窄位置。詳情有助消除實際含糊先有用。"
    examples:
      - text: A entrada fica na lateral, ao lado do jardim.
        meaning: 入口喺側邊，花園隔籬。
        note: "只用花園作地標：`A entrada fica ao lado do jardim.`。仍然講明入口位置；`ao lado do` 指明同花園嘅空間關係，唔再講較籠統嘅側面。"
