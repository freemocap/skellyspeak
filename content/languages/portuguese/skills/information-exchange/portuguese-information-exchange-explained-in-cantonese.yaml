sections:
  - subskill_id: asking_information
    explanation: A que horas問時間。一般巴西葡文問句嘅主語可以留喺限定動詞前，唔使加英文do類助動詞。
    examples:
      - text: A que horas a biblioteca abre amanhã?
        meaning: 圖書館聽日幾點開門？
        note: A que horas問開門時間；a biblioteca喺abre前面，句子仍然可以係問句。
  - subskill_id: answering_information
    explanation: 相關回答可以只係短語，但前文要交代佢回答乜問題。
    examples:
      - text: Às oito.
        meaning: 八點。
        note: 回應圖書館幾點開門；às喺時間表達入面結合a同as。
  - subskill_id: checking_facts
    explanation: 命題後加não é?，可以請聽者確認；要確認嘅內容應該喺句子同語境中辨認到。
    examples:
      - text: A biblioteca abre às oito, não é?
        meaning: 圖書館八點開門，係咪？
        note: 之前有人提出八點，講者再核實呢個開門時間。
  - subskill_id: useful_detail
    explanation: 補充空間表達可以縮窄所需位置；ao係a加o，do係de加o。
    examples:
      - text: A entrada fica na lateral, ao lado do jardim.
        meaning: 入口喺側邊，花園隔籬。
        note: 第二個位置短語指出邊一側有入口，幫對方搵路入去。
