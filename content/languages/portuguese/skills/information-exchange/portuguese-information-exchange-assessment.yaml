skill_id: information_exchange
guidance: Assess questions for missing information, relevant answers, confirmation and useful
  precision. A que horas a biblioteca abre? asks for an opening time. A biblioteca abre às oito,
  não é? checks a proposition already under consideration. Brazilian Portuguese questions do not
  require English do or obligatory subject–verb inversion. In a normal cooperative exchange,
  você pode abrir a janela? usually requests an action rather than asking for unknown facts. A
  copied question word with no identifiable information need is absent. Às oito can answer the
  actual opening-time question contextually; its missing full clause is not a failure. Verbal
  replies such as abre, sim may confirm an identified proposition; an isolated sim has no
  recoverable content without context. A entrada fica na lateral, ao lado do jardim narrows a
  useful location when someone needs the entrance. Extra length alone is not helpful detail. O
  que você quer dizer com isso? can address a comprehension problem; distinguish that repair
  from checking whether a fact is true.
