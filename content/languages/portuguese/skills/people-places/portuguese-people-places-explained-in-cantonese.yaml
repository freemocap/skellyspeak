shared_explanation: skills/people-places/people-places-explained-in-cantonese.yaml
sections:
  - subskill_id: identification
    explanation: "你要介紹 Ana 畀未識佢嘅人。`Esta é minha colega Ana` 係認人：`esta` 指講者附近嘅女性，`é` 係 `ser` 嘅現在式，`minha` 配合陰性名詞 `colega`。`Colega` 本身可以講男同事或女同事，呢度其他詞顯示係女。若要講 Ana 今日點樣，就用狀態句，例如 `Ana está cansada`，唔係介紹身份。"
    examples:
      - text: Esta é minha colega Ana.
        meaning: 呢位係我同事Ana。
        note: "介紹 Beatriz 係你同事：`Esta é minha colega Beatriz.`。呢句係完整介紹；`esta` 同 `minha` 配合陰性所指。"
  - subskill_id: qualities_states
    explanation: "你睇到幾盆植物需要澆水。`As plantas estão secas` 描述佢哋而家嘅狀態：`as plantas` 係陰性複數，`estão` 係配合複數嘅 `estar`，`secas` 係陰性複數形容詞。詞尾重要，因為乾嘅係多盆植物。呢度 `estar` 講目前點樣，唔係身份或固定分類。"
    examples:
      - text: As plantas estão secas.
        meaning: 啲植物乾晒。
        note: "描述一盆乾咗嘅植物：`A planta está seca.`。單數 `a planta` 配 `está` 同單數 `seca`。"
  - subskill_id: location_movement
    explanation: "訪客問圖書館喺邊。`A biblioteca fica perto da praça` 指位置：`fica` 係 `ficar` 表位置嘅用法，`perto de` 係附近，`da` 由 `de` 同陰性 `a` 合成，接 `praça`。呢句講棟樓喺邊，唔係話佢變成圖書館。`Vou à biblioteca` 則講去向。"
    examples:
      - text: A biblioteca fica perto da praça.
        meaning: 圖書館喺廣場附近。
        note: "講圖書館近公園：`A biblioteca fica perto do parque.`。句子完整；`parque` 配陽性 `o`，所以 `da` 轉成 `do`。"
  - subskill_id: possession_relations
    explanation: "你同人講家庭同哥哥擁有嘅物品。`Meu irmão tem uma bicicleta` 有兩個關係：`meu irmão` 係我兄弟，`tem uma bicicleta` 係佢有架單車。`Meu` 用陽性，因為 `irmão` 係陽性，唔取決於講者性別；`tem` 係 `ter` 嘅第三身現在式，配合兄弟。呢句係講擁有，唔係計單車數量。"
    examples:
      - text: Meu irmão tem uma bicicleta.
        meaning: 我兄弟有架單車。
        note: "講你姊妹有架單車：`Minha irmã tem uma bicicleta.`。`minha` 配合陰性 `irmã`，`tem` 仍然講佢擁有乜嘢。"
  - subskill_id: quantity_comparison
    explanation: "你哋有三個箱，要揀一個搬。`Temos três caixas. Esta caixa é mais leve que as outras` 先數箱，再比較重量。`Temos` 係我哋有，`três` 係數量，`mais leve que` 係比其他更輕。`Esta` 指其中一個箱，`as outras` 代替其餘啲箱，係陰性複數。`Esta caixa é mais pesada que as outras` 就反過來講更重，所以唔好只睇 `mais` 就判斷意思。"
    examples:
      - text: Temos três caixas. Esta caixa é mais leve que as outras.
        meaning: 我哋有三個箱。呢個箱比其他嗰啲輕。
        note: "講呢個箱比其他更重：`Temos três caixas. Esta caixa é mais pesada que as outras.`。保留數量同比較結構；`pesada` 改變比較性質，並配合 `caixa`。"
