sections:
  - subskill_id: identification
    explanation: Ser配合名詞短語識別人；esta同minha配合女性對象，colega可以按配合形式指男或女。
    examples:
      - text: Esta é minha colega Ana.
        meaning: 呢位係我同事Ana。
        note: Esta同minha指出女性；é識別身份，唔係描述心情。
  - subskill_id: qualities_states
    explanation: Estar配合形容詞可以描述目前狀態；形容詞同動詞仍然要同主語配合。
    examples:
      - text: As plantas estão secas.
        meaning: 啲植物乾晒。
        note: Plantas係陰性複數；estão係複數，secas亦係陰性複數，描述目前狀態。
  - subskill_id: location_movement
    explanation: Ficar可以交代建築物等固定地方嘅位置；perto de加a時，de同陰性冠詞結合成da。
    examples:
      - text: A biblioteca fica perto da praça.
        meaning: 圖書館喺廣場附近。
        note: 呢度fica係位於；perto da交代空間關係，唔係變成圖書館。
  - subskill_id: possession_relations
    explanation: Ter表示擁有；meu同minha配合所擁有物件或關係嘅名詞，唔係配合講者性別。
    examples:
      - text: Meu irmão tem uma bicicleta.
        meaning: 我兄弟有架單車。
        note: Meu配合陽性irmão，介紹親屬關係；tem交代佢有乜。
  - subskill_id: quantity_comparison
    explanation: 數詞數物件；mais加形容詞，再加que或do que，比較兩件物件嘅性質。
    examples:
      - text: Temos três caixas. Esta caixa é mais leve que as outras.
        meaning: 我哋有三個箱。呢個箱比其他嗰啲輕。
        note: Três提供數量；mais leve que比較重量，esta同outras配合陰性caixa同caixas。
