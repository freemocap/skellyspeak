shared_explanation: skills/feelings-viewpoints/feelings-viewpoints-explained-in-cantonese.yaml
sections:
  - subskill_id: wants_intentions
    explanation: "你想學一種廚藝。`Quero aprender a fazer pão` 有兩個動作：`quero` 表示你想要，`aprender a fazer` 係「學識做」。另一個不定式之前嘅 `a` 屬於 `aprender a` 呢個結構；`quero` 嘅主語係講者。學游水可以同樣講 `Quero aprender a nadar`。表示願望，唔等於已經承諾報班。"
    examples:
      - text: Quero aprender a fazer pão.
        meaning: 我想學整麵包。
        note: "想講學整湯：`Quero aprender a fazer sopa.`。保留 `quero aprender a fazer`，將製作嘅嘢換成 `sopa`。"
  - subskill_id: preferences
    explanation: "你一般鍾意煮嘢，但有得揀就較想整麵包。`Gosto de cozinhar, mas prefiro fazer pão` 將喜好同選擇連起來。`Gostar` 後面講明鍾意嘅事要用 `de`，呢度接不定式 `cozinhar`；`gosto` 跟鍾意嗰個人配合。`Prefiro` 係「我較鍾意」，直接接 `fazer pão`，唔使 `de`。`Mas` 對比一般興趣同優先選項。亦可以講 `Gosto de ler, mas prefiro escrever`。"
    examples:
      - text: Gosto de cozinhar, mas prefiro fazer pão.
        meaning: 我鍾意煮飯，不過更鍾意整麵包。
        note: "仍然鍾意煮嘢，但較想整湯：`Gosto de cozinhar, mas prefiro fazer sopa.`。`gosto` 後面仍有 `de`；`prefiro` 直接接 `fazer`。"
  - subskill_id: emotions
    explanation: "你啱啱睇到計劃結果，覺得開心。`Estou contente com o resultado` 用 `estou`（`estar` 嘅第一身現在式）講當下狀態。`Contente` 係高興，單數男或女講者都用同一形態；`com o resultado` 指出情緒關乎個結果。呢句報告感受，唔係客觀判定結果一定好。轉為擔心可以講 `Estou preocupado com o resultado`；呢個形容詞會因講者而變。"
    examples:
      - text: Estou contente com o resultado.
        meaning: 我對個結果感到開心。
        note: "講自己對消息感到高興：`Estou contente com a notícia.`。佢講齊感受同所關心嘅事；`com a notícia` 取代 `com o resultado`。"
  - subskill_id: opinions
    explanation: "討論圖書館時，你認為要多啲枱。`Acho que a biblioteca precisa de mais mesas` 用 `acho que`（我認為）引出判斷。`que` 後面係主張：`a biblioteca` 係主語，`precisa de` 係需要，`mais mesas` 係更多枱。講明需要乜嘢時，`precisar` 後面有 `de`。呢句係意見，唔係請人重講聽唔明嘅說話。"
    examples:
      - text: Acho que a biblioteca precisa de mais mesas.
        meaning: 我覺得圖書館要多啲枱。
        note: "講圖書館需要更多椅：`Acho que a biblioteca precisa de mais cadeiras.`。保留意見句式同必要嘅 `de`，只將枱換成椅。"
  - subskill_id: agreement_disagreement
    explanation: "有人提議星期六閂圖書館，你反對。`Não concordo com essa ideia` 將 `não` 放喺 `concordo` 前面表示唔同意；`com essa ideia` 指明反對嗰個提議。`Concordar com` 可以將同意連到一個人或主意。`essa ideia` 指返之前提過嘅主意，所以語境重要。"
    examples:
      - text: Não concordo com essa ideia.
        meaning: 我唔同意嗰個想法。
        note: "改為贊成提議：`Concordo com essa ideia.`。已知主意下，呢句係完整回應；刪去 `não` 就改變立場，而 `com` 仍然連到提議。"
