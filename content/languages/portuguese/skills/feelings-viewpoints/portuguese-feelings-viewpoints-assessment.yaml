skill_id: feelings_viewpoints
guidance: "Look for desire or intention, likes or preference, emotion, opinion, agreement or
  disagreement. Quero aprender a fazer pão expresses a want; prefiro ir de ônibus selects an
  option. Gostar takes de with an expressed complement, and the experiencer determines the verb
  form: eu gosto de cozinhar. Eu gosto cozinhar, intended as the ordinary liking construction
  and standing alone, fails to form it. Do not erase another successful viewpoint because of
  that separate error. Estou contente com o resultado expresses emotion; acho que a biblioteca
  precisa de mais mesas states a judgment, not necessarily uncertainty about a fact. A listener
  saying concordo with an identified opinion can express agreement without restating it, while
  concordo com essa ideia explicitly identifies its object. Entendi may acknowledge comprehension without
  agreement. Não concordo, não is a documented Brazilian negation pattern rather than two
  negatives cancelling out. A reported preference of the partner is not the learner's stance.
  Establish whose feeling or viewpoint is expressed before interpreting a subjectless verb or an
  isolated adjective."
