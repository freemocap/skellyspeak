sections:
  - subskill_id: ability
    explanation: Saber加不定式可以表示識做某件事；sei係第一人稱現在式，知道某個事實則係saber另一個用法。
    examples:
      - text: Sei consertar uma bicicleta.
        meaning: 我識整單車。
        note: Sei後接consertar表示實際技能，唔係知道一個命題。
  - subskill_id: permission
    explanation: Poder加不定式可以問行動獲唔獲准；語境分辨係問許可、身體能力定機會。
    examples:
      - text: Posso usar esta mesa?
        meaning: 我可唔可以用呢張枱？
        note: 向共用工作地方嘅管理者詢問使用許可。
  - subskill_id: obligation
    explanation: Ter que加不定式表示要求；tenho係第一人稱現在式，que後嘅動詞維持不定式。
    examples:
      - text: Tenho que devolver os livros hoje.
        meaning: 我今日一定要還書。
        note: Tenho que表示要求，hoje交代時間，唔係話已經還咗。
  - subskill_id: possibility
    explanation: 呢個結構嘅é possível que配合虛擬式引出未確定事件；chova係chover嘅現在虛擬式。
    examples:
      - text: É possível que chova amanhã.
        meaning: 聽日可能落雨。
        note: 落雨只係可能；雖然chova形式係現在虛擬式，amanhã仍然指將來。
  - subskill_id: certainty
    explanation: Não sei se表示唔知命題真唔真；se引出間接是非問句，唔係另一個行動嘅假設條件。
    examples:
      - text: Não sei se a biblioteca está aberta.
        meaning: 我唔知圖書館開咗未。
        note: 唔肯定嘅係目前開放狀態；間接問句入面嘅está係直陳式。
