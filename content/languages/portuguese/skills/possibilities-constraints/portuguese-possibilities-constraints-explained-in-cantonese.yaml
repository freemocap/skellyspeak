sections:
  - subskill_id: ability
    explanation: "鄰居問你識唔識整單車。`Sei consertar uma bicicleta` 係話你識得點做：`sei` 係 `saber` 嘅第一身現在式，不定式 `consertar` 指實際技能，`uma bicicleta` 係維修對象。`Sei onde está a bicicleta` 則係知道架車喺邊，屬於事實知識。"
    examples:
      - text: Sei consertar uma bicicleta.
        meaning: 我識整單車。
        note: "講你識整收音機：`Sei consertar um rádio.`。呢句完整表達能力；`sei` 後面嘅不定式講明識做乜。"
  - subskill_id: permission
    explanation: "你喺共用工作間，向負責人問張枱可唔可以用。`Posso usar esta mesa?` 用 `posso`（`poder` 嘅第一身現在式）加不定式 `usar`，問「我可唔可以用？」；`esta mesa` 指呢張枱。對方有權批准或拒絕，所以係問許可。換個情境，同一個情態動詞亦可以問實際可行性。"
    examples:
      - text: Posso usar esta mesa?
        meaning: 我可唔可以用呢張枱？
        note: "問可唔可以用呢張椅：`Posso usar esta cadeira?`。向有權決定嘅人問時，呢句完整；`cadeira` 取代 `mesa`，`esta` 仍配陰性名詞。"
  - subskill_id: obligation
    explanation: "圖書館啲書今日到期。`Tenho que devolver os livros hoje` 表示必須做：`tenho` 係我有，`que` 將佢連到不定式 `devolver`，`hoje` 指今日期限。呢句唔表示已經還咗。`Não preciso devolver hoje` 係今日唔需要還，唔係禁止還。用 `ter que` 呢個結構要保留 `que`。"
    examples:
      - text: Tenho que devolver os livros hoje.
        meaning: 我今日一定要還書。
        note: "講聽日必須還書：`Tenho que devolver os livros amanhã.`。呢句完整表達要求；`amanhã` 改期限，`tenho que devolver` 保持連住。"
  - subskill_id: possibility
    explanation: "你安排戶外活動，但唔知會唔會落雨。`É possível que chova amanhã` 係「聽日可能落雨」。`É possível que` 引出未確定事件；`chova` 係呢個結構下 `chover` 嘅現在虛擬式，`amanhã` 指將來時間。`Está chovendo` 係報告而家落緊雨，唔係講可能性。"
    examples:
      - text: É possível que chova amanhã.
        meaning: 聽日可能落雨。
        note: "講圖書館聽日可能關門：`É possível que a biblioteca feche amanhã.`。呢句完整表達可能性；`é possível que` 後面用 `feche` 講未確定嘅關門。"
  - subskill_id: certainty
    explanation: "出門前你唔知圖書館有冇開。`Não sei se a biblioteca está aberta` 講明知識限制：`não sei` 係我唔知道，呢度 `se` 係「是否」，引出間接是非問句，`está aberta` 係開門狀態。未有答案，所以講者唔係斷言已關門。呢個 `se` 同將來條件句 `Se chover, fico em casa` 嘅用法唔同。"
    examples:
      - text: Não sei se a biblioteca está aberta.
        meaning: 我唔知圖書館開咗未。
        note: "講唔知圖書館係咪關咗：`Não sei se a biblioteca está fechada.`。呢句完整表達未確定；`fechada` 改變被查問嘅狀態。"
