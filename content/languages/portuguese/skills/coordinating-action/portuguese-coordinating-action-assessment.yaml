skill_id: coordinating_action
guidance: "Assess requests, offers or invitations, proposals, commitments, acceptance or
  refusal, and adjusting shared plans. Você pode guardar estes livros, por favor? normally
  requests the addressee's action; it need not seek an ability report. Quer uma fatia de pão? is
  an offer when the speaker can provide it. Vamos organizar a troca no sábado proposes joint
  action, while eu levo as caixas amanhã commits the speaker to a task in a planning exchange. A
  copied por favor without a recoverable requested action is absent. Posso, sim can accept an
  identified task contextually; its shortness is not failure. Não posso ir na sexta; podemos
  combinar no sábado? refuses one timing and proposes another. A general schedule description is
  not negotiation without an existing shared plan. Vou plus infinitive can state a future
  intention without automatically becoming a promise; use conversational responsibility to
  distinguish it. A bare sim may accept or merely acknowledge: recover the preceding move. Do
  not require one imperative form or reject documented colloquial Brazilian negative responses."
