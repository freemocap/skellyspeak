sections:
  - subskill_id: requests
    explanation: "You are handing books to a colleague and need them put away. `Você pode guardar estes livros, por favor?` uses `você` for the addressee, `pode` for can, and the infinitive `guardar` for the requested action. `Estes livros` identifies the books near the speaker. In this setting the question functions as a polite request, even though `poder` can also describe ability. The same frame with another infinitive, `Você pode fechar a porta, por favor?`, requests that the person close the door."
    examples:
      - text: Você pode guardar estes livros, por favor?
        meaning: Could you put these books away, please?
        note: "Ask the colleague to put these boxes away instead. `Você pode guardar estas caixas, por favor?` is a full request. `Estas caixas` replaces `estes livros`; the demonstrative changes to feminine plural to agree with `caixas`."
  - subskill_id: offers_invitations
    explanation: "You have fresh bread and can give someone a piece. `Quer uma fatia de pão?` means would you like a slice of bread? `Quer` is the present form of `querer` for the person addressed; `uma fatia` is one slice, and `de pão` says what the slice is of. With the bread available, this asks whether to accept an offer. Without that setting, the same words could merely ask about a preference. `Quer um pouco de água?` reuses the offer for water."
    examples:
      - text: Quer uma fatia de pão?
        meaning: Would you like a slice of bread?
        note: "Offer a glass of water instead. `Quer um copo de água?` is a complete offer when you can serve it; `um copo de` supplies the amount and its contents."
  - subskill_id: suggestions
    explanation: "The group is choosing a day for a book exchange. `Vamos organizar a troca de livros no sábado?` proposes doing it together: `vamos` is we go or let us, `organizar` stays in the infinitive, and `no sábado` means on Saturday (`em` + `o`). The rising question asks the others to consider the plan. `Vamos organizar ...` can also describe an intended action, so a planning exchange shows that it is a suggestion. `Vamos organizar a troca no domingo?` proposes a different day."
    examples:
      - text: Vamos organizar a troca de livros no sábado?
        meaning: Shall we organize the book exchange on Saturday?
        note: "Suggest Sunday instead. `Vamos organizar a troca de livros no domingo?` keeps the joint-action frame and changes `no sábado` to `no domingo`."
  - subskill_id: commitments
    explanation: "The group needs someone to bring boxes. By saying `Eu levo as caixas amanhã`, you take that job: `eu` explicitly names the person responsible, `levo` is a present form of `levar`, and `amanhã` places the action tomorrow. Portuguese can use a present form for a settled future arrangement. The same words outside a shared plan could simply report a schedule; here they answer who will do it."
    examples:
      - text: Eu levo as caixas amanhã.
        meaning: I will bring the boxes tomorrow.
        note: "Commit to bringing the books tomorrow. `Eu levo os livros amanhã.` works because `eu levo` takes the task and `amanhã` fixes its later time."
  - subskill_id: accepting_declining
    explanation: "Someone invites you to help at the exchange today, but you cannot attend. `Não posso ir hoje` gives a relevant refusal: `não` precedes the finite verb `posso`, `ir` is the action you cannot do, and `hoje` limits it to today. The invitation supplies the destination, so it need not be repeated. A short `Posso, sim` could accept a known task instead."
    examples:
      - text: Não posso ir hoje.
        meaning: I cannot go today.
        note: "Decline tomorrow rather than today. `Não posso ir amanhã.` is complete in reply to the invitation; changing `hoje` to `amanhã` changes the time you cannot attend."
  - subskill_id: negotiating_plans
    explanation: "A friend proposes Friday, but Friday does not work. `Na sexta não posso. Podemos combinar no sábado?` first states the constraint, then offers an alternative. `Na sexta` means on Friday (`em` + `a`); `não posso` leaves the already discussed meeting understood. `Podemos` is can we, and `combinar` asks to arrange the meeting; `no sábado` proposes Saturday. This is negotiation because it responds to an existing plan. The alternative changes to Sunday in `Podemos combinar no domingo?`"
    examples:
      - text: Na sexta não posso. Podemos combinar no sábado?
        meaning: I cannot on Friday. Can we arrange it for Saturday?
        note: "Keep Friday as the problem and propose Sunday. `Na sexta não posso. Podemos combinar no domingo?` is a full answer: the first sentence rejects the proposed time, and the second offers a workable replacement."
