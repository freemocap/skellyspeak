skill_id: time_events
explanation_language: cantonese
shared_explanation: skills/time-events/time-events-explained-in-cantonese.yaml
sections:
  - subskill_id: present_events
    explanation: "有人問你而家喺廚房做緊乜。`Estou preparando a massa do pão` 表示動作進行中：`estou` 係 `estar` 嘅第一身現在式，`preparando` 係 `preparar` 嘅動名詞，`a massa do pão` 係麵包麵團（`do` 由 `de` 加 `o` 合成）。`Preparo pão toda semana` 則講習慣。"
    examples:
      - text: Estou preparando a massa do pão.
        meaning: 我準備緊整麵包嘅麵糰。
        note: "講而家焗緊麵包：`Estou assando o pão.`。呢句完整表示動作進行中；`assando` 取代 `preparando`。"
  - subskill_id: past_events
    explanation: "朋友問你尋日對架單車做咗乜。`Ontem troquei o pneu da bicicleta` 報告已完成嘅過去動作：`ontem` 定位喺尋日，`troquei` 係我換咗，`o pneu da bicicleta` 係單車車胎。`Troquei` 係 `trocar` 嘅第一身簡單完成過去式；`qu` 保持 `ei` 前面嘅硬輔音。呢種完成事件唔使加相當於英文 have 嘅助動詞。"
    examples:
      - text: Ontem troquei o pneu da bicicleta.
        meaning: 我尋日換咗單車胎。
        note: "報告尋日換咗單車鏈：`Ontem troquei a corrente da bicicleta.`。呢句完整講過去事件；`troquei` 仍係完成動作，`a corrente` 改變對象。"
  - subskill_id: future_events
    explanation: "你安排聽日去圖書館。`Amanhã vou levar os livros à biblioteca` 用 `amanhã` 同 `vou levar` 指將來：`vou` 係「我」用嘅 `ir` 現在式，`levar` 保持不定式。`À biblioteca` 係去圖書館；`à` 由表示方向嘅 `a` 同陰性冠詞 `a` 合成。`Hoje levo os livros` 可以講今日安排。將來意圖唔一定係向別人承諾。"
    examples:
      - text: Amanhã vou levar os livros à biblioteca.
        meaning: 我聽日會拎啲書去圖書館。
        note: "計劃聽日帶箱去圖書館：`Amanhã vou levar as caixas à biblioteca.`。`vou levar` 表示之後打算做，`as caixas` 指新嘅物品。"
  - subskill_id: duration_frequency
    explanation: "有人問你喺呢度做咗幾耐。`Trabalho aqui há seis meses` 係六個月前開始，現在仍然做緊：`trabalho` 係現在式，`aqui` 係呢度，`há seis meses` 量度已過嘅時間。英文 have been working 唔可以機械地轉成葡語 `tenho trabalhado`；後者常帶近期重複或持續活動嘅意思。`Trabalho aqui toda sexta-feira` 則講幾密做一次，唔係做咗幾耐。"
    examples:
      - text: Trabalho aqui há seis meses.
        meaning: 我喺呢度做咗六個月。
        note: "講你喺呢度做咗兩年：`Trabalho aqui há dois anos.`。現在式表示情況仍持續，`há dois anos` 指持續長度。"
  - subskill_id: event_sequence
    explanation: "你講解食譜步驟。`Primeiro misturo a farinha, depois acrescento a água` 清楚講先後：`primeiro` 係首先，`misturo` 係我攪拌，`depois` 係之後，`acrescento` 係我加入。兩個動詞都用現在式講程序。`Depois` 只講一件事跟住另一件事，唔會單靠佢解釋原因。"
    examples:
      - text: Primeiro misturo a farinha, depois acrescento a água.
        meaning: 我先拌麵粉，再加水。
        note: "講一個合理嘅蔬菜準備程序：`Primeiro lavo os legumes, depois corto os legumes.`。呢句完整；`primeiro` 將清洗放喺切菜之前，`depois` 帶出下一步。"
  - subskill_id: event_phase
    explanation: "有人問你本書讀完未。`Já terminei a leitura do livro` 表示已到終點：`já` 係已經，`terminei` 係我完成咗，`a leitura do livro` 指讀呢本書。雖然英文可能用 I have finished，葡語呢度用簡單過去式。若仍然讀緊，就講 `Ainda estou lendo o livro`：`ainda` 係仍然，`estou lendo` 表示進行中。兩個答案講同一件事嘅相反階段。"
    examples:
      - text: Já terminei a leitura do livro.
        meaning: 我已經睇完本書。
        note: "講已經讀完文章：`Já terminei a leitura do artigo.`。呢句完整表示完成；`do artigo` 取代 `do livro`，`já terminei` 表示已到終點。"
      - text: Ainda estou lendo o livro.
        meaning: 我仲睇緊本書。
        note: "講仲讀緊文章：`Ainda estou lendo o artigo.`。呢句完整表示未完；`ainda` 同 `estou lendo` 講持續，唔係完成。"
