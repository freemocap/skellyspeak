skill_id: time_events
guidance: "Look for current or habitual activity, earlier and later events, duration or
  frequency, order and event phase. Estou preparando a massa explicitly presents progress; the
  simple present can also express suitable current or habitual activity. Ontem troquei o pneu
  reports a completed past action; ontem eu trocar, alone as an attempted ordinary past report,
  is unsuccessful. Do not map every English perfect meaning to tenho plus participle: the
  Portuguese compound commonly expresses activity repeated or continuing across a recent period.
  Vou levar os livros amanhã marks a later intention, and a scheduled present can also refer to
  the future. Trabalho aqui há seis meses measures continuing duration; toda sexta-feira gives
  frequency. Primeiro and depois order steps without necessarily asserting cause. Já terminei a
  leitura establishes completion; ainda estou lendo continuation. After Quando você chegou?,
  Ontem à noite can answer contextually. A bare date copied from the partner is insufficient,
  and an ongoing state is not automatically an explicit duration."
