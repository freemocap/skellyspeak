sections:
  - subskill_id: causes_reasons
    explanation: Porque連接行動或情況同原因；要同詢問點解嘅問句形式分開。
    examples:
      - text: Fiquei em casa porque estava chovendo.
        meaning: 因為落緊雨，我留咗喺屋企。
        note: Fiquei報告決定；porque連到estava chovendo所表達嘅持續落雨。
  - subskill_id: consequences
    explanation: Por isso將後續行動或結論表達成前述情況嘅結果，比只列下一件事更具體。
    examples:
      - text: O pneu furou, por isso voltei a pé.
        meaning: 個轆爆胎，所以我行路返去。
        note: Por isso明確連接爆胎同返程方式；voltei係過去事件，a pé係行路。
  - subskill_id: conditions
    explanation: 預計嘅將來條件可以用se加將來虛擬式；規則動詞chover嘅呢個形式似不定式，語境交代文法作用。
    examples:
      - text: Se chover amanhã, vamos fazer a troca de livros na biblioteca.
        meaning: 如果聽日落雨，我哋就喺圖書館搞換書活動。
        note: Se chover提出條件，vamos fazer交代計劃結果；落雨係可能，唔係已發生。
  - subskill_id: contrast
    explanation: Mas可以對比原定意圖或預期同障礙或不同結果，兩個分句要真係有呢種關係。
    examples:
      - text: Quero ir de bicicleta, mas o pneu está furado.
        meaning: 我想踩單車去，但個轆爆咗胎。
        note: Mas將交通喜好連到阻礙實行嘅問題。
  - subskill_id: supporting_claims
    explanation: 判斷可以由另一句交代依據嘅陳述支持，唔一定每次都用porque開頭。
    examples:
      - text: "Acho que este caminho é melhor: é mais curto."
        meaning: 我覺得呢條路好啲：短啲。
        note: 距離短支持melhor嘅評價，兩句係主張同理據嘅關係。
