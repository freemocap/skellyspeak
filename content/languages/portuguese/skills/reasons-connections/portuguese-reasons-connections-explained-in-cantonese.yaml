sections:
  - subskill_id: causes_reasons
    explanation: "朋友問你點解冇出街。`Fiquei em casa porque estava chovendo` 講原因：`fiquei em casa` 係我留喺屋企，`porque` 係因為，`estava chovendo` 表示當時持續落雨。後半句解釋決定，唔只係另一件無關嘅事。問「點解」時寫 `por que`；呢度解釋原因用一個字 `porque`。"
    examples:
      - text: Fiquei em casa porque estava chovendo.
        meaning: 因為落緊雨，我留咗喺屋企。
        note: "以生病解釋留喺屋企：`Fiquei em casa porque estava doente.`。`porque` 將行動同原因連起來；`estava doente` 講明原因。"
  - subskill_id: consequences
    explanation: "旅途中單車車胎穿咗，你唯有行返去。`O pneu furou, por isso voltei a pé` 講結果：`furou` 係車胎穿咗，`por isso` 係因此，`voltei` 係我返去，`a pé` 係行路。連接詞指返之前嘅爆胎，解釋點解要行。`O pneu furou, depois voltei a pé` 主要講先後，未必明確講因果。`Por isso` 就將後果講清楚。"
    examples:
      - text: O pneu furou, por isso voltei a pé.
        meaning: 個轆爆胎，所以我行路返去。
        note: "巴士遲咗，解釋點解你遲到：`O ônibus atrasou, por isso cheguei tarde.`。`por isso` 將遲到連到巴士延誤，唔只講先後。"
  - subskill_id: conditions
    explanation: "你計劃聽日換書，地點要睇落唔落雨。`Se chover amanhã, vamos fazer a troca de livros na biblioteca` 有條件同結果：`se` 係如果，`chover` 係 `chover` 嘅將來虛擬式，`vamos fazer` 係落雨時嘅計劃。規則動詞嘅呢個形態剛好似不定式。換成不規則動詞就較清楚：`Se tivermos tempo, vamos fazer a troca` 係如果我哋有時間。兩句都冇話雨已經落、時間已經有。"
    examples:
      - text: Se chover amanhã, vamos fazer a troca de livros na biblioteca.
        meaning: 如果聽日落雨，我哋就喺圖書館搞換書活動。
        note: "改為有時間先做：`Se tivermos tempo, vamos fazer a troca de livros na biblioteca.`。呢句係完整將來條件；`tivermos` 係「我哋」用嘅 `ter` 將來虛擬式。"
  - subskill_id: contrast
    explanation: "你想踩單車去，但車胎穿咗。`Quero ir de bicicleta, mas o pneu está furado` 對比意願同障礙：`quero ir` 係想去，`de bicicleta` 係踩單車，`mas` 係但係，`está furado` 講車胎而家嘅狀態。後半句重要，因為佢阻礙前半句。`Mas` 後面隨便加無關事實就唔構成有用對比。"
    examples:
      - text: Quero ir de bicicleta, mas o pneu está furado.
        meaning: 我想踩單車去，但個轆爆咗胎。
        note: "對比想行路同落雨：`Quero ir a pé, mas está chovendo.`。呢句對比完整；落雨令原本想做嘅步行較難實行。"
  - subskill_id: supporting_claims
    explanation: "你向人推薦其中一條路。`Acho que este caminho é melhor: é mais curto` 先提出判斷，再講根據。`Acho que` 表示你嘅看法，`este caminho` 係呢條路，`é melhor` 係較好，`é mais curto` 解釋佢較短。第二句同判斷有關，所以就算冇 `porque`，都係支持理由。主張後面隨便加無關事實，就唔算支持。"
    examples:
      - text: "Acho que este caminho é melhor: é mais curto."
        meaning: 我覺得呢條路好啲：短啲。
        note: "以安全支持同一推薦：`Acho que este caminho é melhor: é mais seguro.`。`é mais seguro` 提供同揀路有關嘅理由。"
