skill_id: reasons_connections
explanation_language: english
shared_explanation: skills/reasons-connections/reasons-connections-explained-in-english.yaml
sections:
  - subskill_id: causes_reasons
    explanation: Porque can connect an action or situation to its reason. Distinguish this
      explanatory porque from question forms asking why.
    examples:
      - text: Fiquei em casa porque estava chovendo.
        meaning: I stayed home because it was raining.
        note: Fiquei reports the decision; porque links it to the ongoing rain expressed by estava
          chovendo.
  - subskill_id: consequences
    explanation: Por isso presents the following action or conclusion as a consequence of what came
      before. It is more specific than simply naming the next event.
    examples:
      - text: O pneu furou, por isso voltei a pé.
        meaning: The tire got punctured, so I walked back.
        note: Por isso explicitly relates walking back to the puncture. Voltei is a past event and a pé
          means on foot.
  - subskill_id: conditions
    explanation: For a projected future condition, se can introduce the future subjunctive. With
      regular chover, that form looks like the infinitive; the context gives its grammatical
      role.
    examples:
      - text: Se chover amanhã, vamos fazer a troca de livros na biblioteca.
        meaning: If it rains tomorrow, we will hold the book exchange at the library.
        note: Se chover gives the condition; vamos fazer gives the planned consequence. Rain is possible
          rather than reported as having occurred.
  - subskill_id: contrast
    explanation: Mas can contrast an initial intention or expectation with an obstacle or different
      outcome. The two clauses must actually stand in that relation.
    examples:
      - text: Quero ir de bicicleta, mas o pneu está furado.
        meaning: I want to go by bicycle, but the tire is punctured.
        note: Mas links the travel preference to a problem that interferes with it.
  - subskill_id: supporting_claims
    explanation: A judgment can be supported by a further assertion that explains its basis. The
      support need not always begin with porque.
    examples:
      - text: "Acho que este caminho é melhor: é mais curto."
        meaning: "I think this route is better: it is shorter."
        note: The shorter distance is offered as grounds for the judgment melhor. The two assertions are
          related as claim and support.
