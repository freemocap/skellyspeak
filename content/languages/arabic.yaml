# yaml-language-server: $schema=../schemas/language.json
schema_version: 1
identity:
  id: arabic
  name: Arabic
  native_name: العربية
  family: afro-asiatic
  review: needs_review
integrations:
  language_tag: ar
  transcription: ar
definitions:
  orthographies:
    arabic-unvocalized:
      script: arabic
      guidance: []
  romanization_schemes:
    ala-lc-arabic:
      label: ALA-LC Arabic
      instructions: Use ā, ī, ū for long vowels; final alif maqṣūrah is á. Preserve ḥ, ṣ, ḍ, ṭ, ẓ; use
        th, kh, dh, sh, gh. Represent ayn with ‘ and medial/final hamzah with ’ (the table's distinct
        signs); omit initial hamzah. Retain al- before sun letters without assimilation; after inseparable
        prefixes retain al-, except li + article becomes lil-. Tā’ marbūṭah is h outside construct state,
        t in construct state, tan in adverbial use. Omit noun/adjective case vowels except before pronominal
        suffixes or in verse. Normally omit tanwīn, retaining it for indefinite defective-root nouns and
        adverbials. Retain verb final inflections except in pause. For shaddah use ūw or aww over wāw,
        medial īy or ayy over yā’, and final ī for the nisbah; otherwise double the consonant or digraph.
        Use ʹ to separate adjacent consonants that could be mistaken for a digraph. These are transliteration
        rules, not a pronunciation respelling. Never alter the Arabic source.
      examples:
      - original: كتاب
        romanized: kitāb
      - original: صورة
        romanized: ṣūrah
      - original: على
        romanized: ‘alá
      - original: مسألة
        romanized: mas’alah
      - original: إيمان
        romanized: īmān
      - original: الشمس
        romanized: al-shams
      - original: وزارة التربية
        romanized: Wizārat al-Tarbiyah
      - original: فجأةً
        romanized: faj’atan
      - original: قاضٍ
        romanized: qāḍin
      - original: أدهم
        romanized: Adʹham
      sources:
      - ala_lc_arabic
      review: needs_review
