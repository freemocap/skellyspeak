      - 🔧
practice:
  review: needs_review
  sets:
    absolute_zero:
      - Ναι.
      - Όχι.
      - Νερό, παρακαλώ.
      - Είμαι εδώ.
      - Κάνει ζέστη.
      - Πεινάω.
      - Τι είναι αυτό;
      - Δεν ξέρω.
    beginner:
      - Είναι γιατρός.
      - Αυτό το δωμάτιο είναι μικρό.
      - Έχω ένα ποδήλατο.
      - Αυτή είναι η αδελφή μου.
      - Χρειαζόμαστε δύο καρέκλες.
      - Έχω λίγο χρόνο.
      - Δουλεύω εδώ.
      - Τώρα διαβάζει.
    intermediate:
      - Χθες πήγα στην αγορά.
      - Έχω διαβάσει αυτό το βιβλίο.
      - Θα έρθω αύριο.
      - Θα δουλεύω όλο το πρωί.
      - Μου αρέσει ο καφές.
      - Θέλω να πάω σπίτι.
      - Μπορείτε να το πείτε ξανά;
      - Δεν χρειάζεται να έρθεις.
    advanced:
      - Αν είχα περισσότερο χρόνο, θα μάθαινα να παίζω κιθάρα.
      - Παρόλο που έβρεχε, αποφασίσαμε να συνεχίσουμε τη βόλτα μας.
      - Θα προτιμούσα να το συζητήσουμε πριν πάρουμε μια απόφαση.
      - Όσο περισσότερο διαβάζω την έκθεση, τόσο περισσότερες απορίες έχω.
      - Μέχρι να φτάσουμε στον σταθμό, το τρένο είχε ήδη φύγει.
      - Δεν είναι ότι διαφωνώ μαζί σου, αλλά χρειάζομαι περισσότερες πληροφορίες.
      - Αυτό που με ανησυχεί είναι πώς θα επηρεάσει η αλλαγή τους άλλους.
      - Αν μας είχες ειδοποιήσει νωρίτερα, θα είχαμε αλλάξει τα σχέδιά μας.
    social:
      - Γεια σας!
      - Καλημέρα!
      - Καλησπέρα!
      - Τι κάνετε;
      - Καλά, ευχαριστώ.
      - Πώς σας λένε;
      - Χάρηκα πολύ.
      - Συγγνώμη.
      - Ευχαριστώ πολύ.
      - Παρακαλώ.
      - Τα λέμε!
      - Καλό βράδυ!
    idiomatic:
      - Τα έκανα θάλασσα.
      - Κάνω την πάπια.
      - Βάζω νερό στο κρασί μου.
      - Μου βγήκε ξινό.
      - Τα κάνω άνω κάτω.
      - Έγινε άλλος άνθρωπος.
      - Βγήκα από τα ρούχα μου.
      - Όποιος βιάζεται σκοντάφτει.
  varieties: {}
