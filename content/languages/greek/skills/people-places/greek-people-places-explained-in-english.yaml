sections:
  - subskill_id: identification
    explanation: "You are pointing out Nikos to someone who has not met him. `Αυτός` is a masculine
      form meaning this one or he in this context; `είναι` links him to an identity, and `ο φίλος μου` says how you know him. In an ordinary
      introduction the personal name appears with `ο`: `ο Νίκος`."
    examples:
      - text: Αυτός είναι ο φίλος μου, ο Νίκος.
        meaning: This is my friend Nikos. `Αυτός` points to a male person; `ο φίλος μου` identifies him as
          my friend, and `ο Νίκος` supplies his name.
        note: "Try it: identify Maria as your friend. Answer: `Αυτή είναι η φίλη μου, η Μαρία`. Use feminine
          `αυτή`, `η φίλη`, and the article `η` before the name."
  - subskill_id: qualities_states
    explanation: Someone asks whether a bridge is easy to cross. `Η γέφυρα` is a feminine singular noun
      phrase; after `είναι`, its describing adjective still agrees, so narrow appears as `στενή`.
      This describes the bridge rather than a separate object.
    examples:
      - text: Η γέφυρα είναι στενή.
        meaning: The bridge is narrow. `Η γέφυρα` is feminine singular, and `στενή` has the matching
          feminine singular form even after `είναι`.
        note: "Try it: say the bridge is wide. Answer: `Η γέφυρα είναι φαρδιά`. Keep the same subject and
          verb; choose feminine `φαρδιά` for the bridge."
  - subskill_id: location_movement
    explanation: You need to locate the repair shop and then say where you are going. `κοντά στην
      πλατεία` gives proximity to the square; `στην` combines `σε` and `την`. With `πάω`, `στο
      συνεργείο` names the destination. The verb and context determine the relation.
    examples:
      - text: Το συνεργείο είναι κοντά στην πλατεία.
        meaning: The repair shop is near the square. `κοντά στην πλατεία` tells where the shop is; `στην` is
          `σε` plus the feminine accusative article `την`.
        note: "Try it: say you are going to the square. Answer: `Πάω στην πλατεία`. `πάω` expresses going,
          so `στην πλατεία` is the destination, not a static location."
      - text: Πάω στο συνεργείο.
        meaning: I am going to the repair shop. `Πάω` is I go, so `στο συνεργείο` is the destination; the
          same preposition can occur in a static place phrase with a different verb.
        note: "Try it: say the bicycle is at the shop. Answer: `Το ποδήλατο είναι στο συνεργείο`. Replace
          the motion verb with `είναι`; the phrase now locates the bicycle."
  - subskill_id: possession_relations
    explanation: Someone asks whose bicycle this is. The noun phrase `το ποδήλατό μου` puts the weak
      possessive `μου` after the noun. The extra written accent on `ποδήλατό` keeps the stress
      pattern when the clitic follows; the article `το` remains.
    examples:
      - text: Αυτό είναι το ποδήλατό μου.
        meaning: This is my bicycle. `το ποδήλατό` is the bicycle, and following `μου` identifies its owner
          as the speaker. The second accent belongs to this noun plus clitic combination.
        note: "Try it: say it is your bicycle to one familiar person. Answer: `Αυτό είναι το ποδήλατό σου`.
          Replace `μου` with `σου`; retain `το` and the extra accent on `ποδήλατό`."
  - subskill_id: quantity_comparison
    explanation: You are choosing which box to carry. `τρία κουτιά` counts three neuter plural boxes;
      `αυτό το κουτί` singles one out. `πιο βαρύ από τα άλλα` compares that box with the others. The
      adjective `βαρύ` agrees with the singular neuter box, while `πιο` does not change.
    examples:
      - text: Χρειαζόμαστε τρία κουτιά. Αυτό το κουτί είναι πιο βαρύ από τα άλλα.
        meaning: We need three boxes. This box is heavier than the others. `τρία κουτιά` gives the count;
          `πιο βαρύ` means heavier and `από τα άλλα` names the comparison group.
        note: "Try it: say this box is lighter than the others. Answer: `Αυτό το κουτί είναι πιο ελαφρύ από
          τα άλλα`. Replace `βαρύ` with neuter singular `ελαφρύ`; keep the comparison frame."
