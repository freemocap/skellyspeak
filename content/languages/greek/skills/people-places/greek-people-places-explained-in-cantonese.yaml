sections:
  - subskill_id: identification
    explanation: αυτός、αυτή、αυτό 要按所指對象選擇。είναι 將人物同身分名詞連起嚟；一般介紹人名時通常帶定冠詞。
    examples:
      - text: Αυτός είναι ο φίλος μου, ο Νίκος.
        meaning: 呢位係我朋友 Nikos。
        note: αυτός 指男性；ο φίλος μου 交代朋友關係，ο Νίκος 係姓名。
  - subskill_id: qualities_states
    explanation: 形容詞即使放喺 είναι 後面，亦要配合名詞嘅性同數。學名詞時連冠詞一齊學，有助選對形式。
    examples:
      - text: Η γέφυρα είναι στενή.
        meaning: 條橋窄。
        note: γέφυρα 係陰性單數，所以謂語形容詞用 στενή。
  - subskill_id: location_movement
    explanation: κοντά σε 表示靠近；σε 同定冠詞合成 στον、στην、στο 等。同一介詞配合移動動詞可講目的地，要睇動詞同語境。
    examples:
      - text: Το συνεργείο είναι κοντά στην πλατεία.
        meaning: 間維修舖喺廣場附近。
        note: κοντά στην πλατεία 交代位置；στην 係 σε 加 την，名詞用賓格。
      - text: Πάω στο συνεργείο.
        meaning: 我去維修舖。
        note: 配合 πάω，στο συνεργείο 指目的地，唔係講者而家所在位置。
  - subskill_id: possession_relations
    explanation: 弱讀屬格物主代名詞跟喺名詞後面，μου 表示我嘅；名詞通常保留冠詞。原本倒數第三音節重讀嘅名詞，喺呢種附着詞前會加另一個重音符號。
    examples:
      - text: Αυτό είναι το ποδήλατό μου.
        meaning: 呢架係我嘅單車。
        note: μου 喺呢度表示我嘅；ποδήλατό 嘅額外重音符號反映同後面附着詞結合後嘅重音安排。
  - subskill_id: quantity_comparison
    explanation: 數詞交代數量；πιο 加形容詞同 από 可同指定標準比較。形容詞配合被描述物，πιο 本身唔變。
    examples:
      - text: Χρειαζόμαστε τρία κουτιά. Αυτό το κουτί είναι πιο βαρύ από τα άλλα.
        meaning: 我哋需要三個箱。呢個箱比其他嗰啲重。
        note: τρία、κουτιά 係中性複數；βαρύ 描述中性單數 κουτί，από τα άλλα 指比較組。
