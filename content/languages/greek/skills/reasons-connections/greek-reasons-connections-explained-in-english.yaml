sections:
  - subskill_id: causes_reasons
    explanation: You explain why you are not riding your bicycle. The first clause gives the decision;
      `επειδή` introduces the reason, and `το λάστιχο είναι χαλασμένο` says the tyre is damaged.
      `χαλασμένο` agrees with neuter `λάστιχο`.
    examples:
      - text: Δεν παίρνω το ποδήλατο επειδή το λάστιχο είναι χαλασμένο.
        meaning: I am not taking the bicycle because the tyre is damaged. `Δεν παίρνω` negates taking it;
          `επειδή` connects that decision to the damaged tyre.
        note: "Try it: explain that you are not taking the bicycle because the shop is closed. Answer: `Δεν
          παίρνω το ποδήλατο επειδή το συνεργείο είναι κλειστό`. The new clause after `επειδή` gives
          the reason."
  - subskill_id: consequences
    explanation: The repair shop is closed today, so you need another visit. `Γι’ αυτό` points back to
      the closure and introduces the resulting decision; `θα έρθω αύριο` states what you will do.
      The result belongs to the earlier situation.
    examples:
      - text: Το συνεργείο είναι κλειστό. Γι’ αυτό θα έρθω αύριο.
        meaning: The repair shop is closed. That is why I will come tomorrow. `Γι’ αυτό` means for that
          reason; `θα έρθω αύριο` gives the resulting plan.
        note: "Try it: say the shop is open, so you will come today. Answer: `Το συνεργείο είναι ανοιχτό.
          Γι’ αυτό θα έρθω σήμερα`. Change both the condition and the resulting visit time."
  - subskill_id: conditions
    explanation: You are making a transport plan that depends on tomorrow’s weather. `Αν βρέξει αύριο`
      states the possible condition; `θα πάμε με το λεωφορείο` gives the plan if it happens.
      `βρέξει` presents a rain event, not a statement that it already rained.
    examples:
      - text: Αν βρέξει αύριο, θα πάμε με το λεωφορείο.
        meaning: If it rains tomorrow, we will go by bus. `Αν` marks the condition; `θα πάμε` introduces the
          planned consequence, and `με το λεωφορείο` names the transport.
        note: "Try it: say that if it rains today, you will go by bus. Answer: `Αν βρέξει σήμερα, θα πάμε με
          το λεωφορείο`. Change the condition’s day to `σήμερα`; the dependent plan remains."
  - subskill_id: contrast
    explanation: You like the route but need to warn a cycling companion about traffic. `αλλά` joins the
      positive description to a drawback. `πολλή` is feminine singular to go with `κίνηση`, which
      here means traffic.
    examples:
      - text: Η διαδρομή είναι όμορφη, αλλά έχει πολλή κίνηση.
        meaning: The route is beautiful, but it has a lot of traffic. `αλλά` signals the contrast; `πολλή
          κίνηση` is a lot of traffic.
        note: "Try it: say the route is short but has a lot of traffic. Answer: `Η διαδρομή είναι σύντομη,
          αλλά έχει πολλή κίνηση`. `σύντομη` agrees with feminine `διαδρομή`; the warning remains."
  - subskill_id: supporting_claims
    explanation: You infer that the repair shop is open because you see a light inside. `Νομίζω ότι`
      marks this as your judgement, not confirmed fact. `γιατί έχει φως μέσα` gives evidence for
      that judgement; the light does not cause the shop to open.
    examples:
      - text: Νομίζω ότι το συνεργείο είναι ανοιχτό, γιατί έχει φως μέσα.
        meaning: I think the repair shop is open because there is a light on inside. `νομίζω ότι` introduces
          the conclusion; `γιατί` links it to the observed light.
        note: "Try it: say you think the shop is closed because it is dark inside. Answer: `Νομίζω ότι το
          συνεργείο είναι κλειστό, γιατί είναι σκοτεινά μέσα`. The observation supports the
          conclusion; it does not prove it."
