sections:
  - subskill_id: causes_reasons
    explanation: 你解釋點解唔踩單車。前半句係決定；`επειδή` 引出原因，`το λάστιχο είναι χαλασμένο` 表示輪胎壞咗。`χαλασμένο` 配合中性 `λάστιχο`。
    examples:
      - text: Δεν παίρνω το ποδήλατο επειδή το λάστιχο είναι χαλασμένο.
        meaning: 我唔帶架單車，因為輪胎壞咗。`Δεν παίρνω` 否定帶走；`επειδή` 將決定同原因連起嚟。
        note: 試吓話因為維修舖關門，所以唔帶單車。答案：`Δεν παίρνω το ποδήλατο επειδή το συνεργείο είναι κλειστό`。`επειδή`
          後面嘅新分句交代原因。
  - subskill_id: consequences
    explanation: 維修舖今日關門，所以要另約時間。`Γι’ αυτό` 指返關門呢件事，引出結果；`θα έρθω αύριο` 交代你下一步點做。
    examples:
      - text: Το συνεργείο είναι κλειστό. Γι’ αυτό θα έρθω αύριο.
        meaning: 維修舖關門，所以我聽日嚟。`Γι’ αυτό` 即係因此；`θα έρθω αύριο` 係由此而來嘅安排。
        note: 試吓話維修舖開門，所以你今日嚟。答案：`Το συνεργείο είναι ανοιχτό. Γι’ αυτό θα έρθω σήμερα`。前提同到訪日子都要改。
  - subskill_id: conditions
    explanation: 你根據聽日天氣安排交通。`Αν βρέξει αύριο` 係可能發生嘅條件；`θα πάμε με το λεωφορείο` 係如果落雨就採取嘅方案。`βρέξει` 唔係話已經落咗雨。
    examples:
      - text: Αν βρέξει αύριο, θα πάμε με το λεωφορείο.
        meaning: 如果聽日落雨，我哋會搭巴士。`Αν` 標示條件，`θα πάμε` 引出後果，`με το λεωφορείο` 指交通工具。
        note: 試吓改成如果今日落雨就搭巴士。答案：`Αν βρέξει σήμερα, θα πάμε με το λεωφορείο`。條件日期改 `σήμερα`，後面方案保持。
  - subskill_id: contrast
    explanation: 你鍾意條路，但要提醒踩車同伴車多。`αλλά` 將正面描述同缺點連起嚟。`πολλή` 係陰性單數，配合呢度解作交通嘅 `κίνηση`。
    examples:
      - text: Η διαδρομή είναι όμορφη, αλλά έχει πολλή κίνηση.
        meaning: 條路好靚，但車好多。`αλλά` 標示對比；`πολλή κίνηση` 係交通繁忙。
        note: 試吓話條路短，但車好多。答案：`Η διαδρομή είναι σύντομη, αλλά έχει πολλή κίνηση`。`σύντομη` 配合陰性
          `διαδρομή`，後面警告保留。
  - subskill_id: supporting_claims
    explanation: 你見到舖內有燈，推測維修舖開門。`Νομίζω ότι` 表示呢個係判斷，未經證實；`γιατί έχει φως μέσα` 提供推測依據，唔係話燈令舖頭開門。
    examples:
      - text: Νομίζω ότι το συνεργείο είναι ανοιχτό, γιατί έχει φως μέσα.
        meaning: 我覺得維修舖開門，因為入面有燈。`νομίζω ότι` 引出推測；`γιατί` 將推測同觀察到嘅燈連起嚟。
        note: 試吓話你覺得舖頭關咗，因為入面好黑。答案：`Νομίζω ότι το συνεργείο είναι κλειστό, γιατί είναι σκοτεινά
          μέσα`。觀察支持推測，但唔等於證明。
