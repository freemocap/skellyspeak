sections:
  - subskill_id: ability
    explanation: "A friend asks whether you need help with the bicycle. Personal `Μπορώ` says I can, and
      the verb after `να` names the action I can perform: `αλλάξω το λάστιχο`. `μόνος μου` says I
      will do it by myself and has the masculine form for this speaker."
    examples:
      - text: Μπορώ να αλλάξω το λάστιχο μόνος μου.
        meaning: I can change the tyre on my own. `Μπορώ να αλλάξω` identifies the speaker and possible
          action; `μόνος μου` says without help.
        note: "Try it: say you can open the door on your own, as a male speaker. Answer: `Μπορώ να ανοίξω
          την πόρτα μόνος μου`. Keep `μπορώ να`; use first-person `ανοίξω` for the new action."
  - subskill_id: permission
    explanation: At a repair shop, you need to ask whether you may leave your bicycle in this spot. A
      first-person `να` question, `Να αφήσω…;`, proposes your action and seeks the person’s
      permission. `εδώ` specifies the spot.
    examples:
      - text: Να αφήσω το ποδήλατο εδώ;
        meaning: May I leave the bicycle here? `Να αφήσω` asks about the speaker leaving it; `το ποδήλατο`
          is the object and `εδώ` means here.
        note: "Try it: ask whether you may open the door. Answer: `Να ανοίξω την πόρτα;`. Use first-person
          `ανοίξω` because you would perform the action; ask the person responsible."
  - subskill_id: obligation
    explanation: You are closing the shop with a colleague. Impersonal `Πρέπει` says something is
      necessary; the following `να κλείσουμε` is first-person plural, so both of you must close the
      door. `πριν φύγουμε` puts departure after that action.
    examples:
      - text: Πρέπει να κλείσουμε την πόρτα πριν φύγουμε.
        meaning: We must close the door before we leave. `Πρέπει` expresses necessity; `κλείσουμε` and
          `φύγουμε` are both first-person plural and include the speaker and colleague.
        note: "Try it: say you must open the door before leaving. Answer: `Πρέπει να ανοίξουμε την πόρτα
          πριν φύγουμε`. Keep impersonal `πρέπει`; change the required action to plural
          `ανοίξουμε`."
  - subskill_id: possibility
    explanation: Your arrival time is undecided. Impersonal `Μπορεί` means it may be the case; `να έρθω`
      specifies that I may come. The first word stays third-person singular even though the coming
      is first-person.
    examples:
      - text: Μπορεί να έρθω αργότερα.
        meaning: I may come later. `Μπορεί` marks possibility, `έρθω` is the speaker’s coming, and
          `αργότερα` means later.
        note: "Try it: say you may come tomorrow. Answer: `Μπορεί να έρθω αύριο`. Keep impersonal `μπορεί`
          and first-person `έρθω`; change the time."
  - subskill_id: certainty
    explanation: Someone is unsure which day the meeting is scheduled. `σίγουρα` lets you present the
      date as certain within the whole proposition `Η συνάντηση είναι … αύριο`. It expresses
      confidence in the date, rather than an obligation or permission.
    examples:
      - text: Η συνάντηση είναι σίγουρα αύριο.
        meaning: The meeting is definitely tomorrow. `Η συνάντηση` is the meeting; `σίγουρα` strengthens the
          claim that it is `αύριο`.
        note: "Try it: state confidently that the meeting is today. Answer: `Η συνάντηση είναι σίγουρα
          σήμερα`. Replace the date with `σήμερα`; keep `σίγουρα` to mark certainty."
