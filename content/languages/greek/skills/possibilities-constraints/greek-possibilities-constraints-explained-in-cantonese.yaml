sections:
  - subskill_id: ability
    explanation: 朋友問你整車使唔使幫手。`Μπορώ` 係「我能夠」，`να` 後嘅 `αλλάξω το λάστιχο` 講可做嘅動作。`μόνος μου` 表示自己做，呢個形式配合男性講者。
    examples:
      - text: Μπορώ να αλλάξω το λάστιχο μόνος μου.
        meaning: 我可以自己換輪胎。`Μπορώ να αλλάξω` 指講者同佢做到嘅動作；`μόνος μου` 係唔使人幫手。
        note: 試吓以男性講者身分話自己可以開門。答案：`Μπορώ να ανοίξω την πόρτα μόνος μου`。保留 `μπορώ να`，新動作用第一人稱 `ανοίξω`。
  - subskill_id: permission
    explanation: 喺維修舖，你想問可唔可以將單車放呢度。第一人稱 `να` 問句 `Να αφήσω…;` 提出自己想做嘅動作，徵求負責人准許；`εδώ` 指呢個位置。
    examples:
      - text: Να αφήσω το ποδήλατο εδώ;
        meaning: 我可唔可以將單車放喺呢度？`Να αφήσω` 問自己可否放低，`το ποδήλατο` 係單車，`εδώ` 係呢度。
        note: 試吓問可唔可以開門。答案：`Να ανοίξω την πόρτα;`。由你做動作，所以用第一人稱 `ανοίξω`，並問有權決定嘅人。
  - subskill_id: obligation
    explanation: 你同同事準備關舖。無人稱 `Πρέπει` 表示必須；後面第一人稱複數 `να κλείσουμε` 表示你哋一齊關門。`πριν φύγουμε` 將離開放喺關門之後。
    examples:
      - text: Πρέπει να κλείσουμε την πόρτα πριν φύγουμε.
        meaning: 我哋離開前必須關門。`Πρέπει` 表示需要；`κλείσουμε` 同 `φύγουμε` 都係第一人稱複數，包含講者同同事。
        note: 試吓話離開前必須開門。答案：`Πρέπει να ανοίξουμε την πόρτα πριν φύγουμε`。`πρέπει` 不變，必須做嘅動作用複數 `ανοίξουμε`。
  - subskill_id: possibility
    explanation: 你未確定到達時間。無人稱 `Μπορεί` 表示可能發生；`να έρθω` 指「我可能嚟」。雖然嚟嘅人係我，第一個詞仍係第三人稱單數。
    examples:
      - text: Μπορεί να έρθω αργότερα.
        meaning: 我可能遲啲嚟。`Μπορεί` 表示可能，`έρθω` 係我嚟，`αργότερα` 係遲啲。
        note: 試吓話你可能聽日嚟。答案：`Μπορεί να έρθω αύριο`。無人稱 `μπορεί` 同第一人稱 `έρθω` 不變，只改時間。
  - subskill_id: certainty
    explanation: 有人唔肯定會議定咗邊日。`σίγουρα` 令整句 `Η συνάντηση είναι … αύριο` 表示你肯定日期；講嘅係把握，唔係義務或許可。
    examples:
      - text: Η συνάντηση είναι σίγουρα αύριο.
        meaning: 會議肯定喺聽日。`Η συνάντηση` 係會議；`σίγουρα` 加強對 `αύριο` 呢個日期嘅肯定。
        note: 試吓肯定咁話會議喺今日。答案：`Η συνάντηση είναι σίγουρα σήμερα`。日期改 `σήμερα`，保留 `σίγουρα` 表示肯定。
