skill_id: possibilities_constraints
guidance: "Personal μπορώ with να can express ability; the impersonal μπορεί can express
  possibility even when its following verb is first person. Permission can be requested with
  μπορώ or a standalone να question, and granted by an appropriate respondent in context. Πρέπει
  with να can state necessity; δεν χρειάζεται removes a need rather than prohibiting an action.
  Ίσως or μπορεί να may qualify a possibility, while σίγουρα and comparable expressions can
  communicate certainty about a proposition. For example, μπορεί να έρθω αργότερα expresses a
  possible arrival, not somebody else’s ability. A copied isolated πρέπει without an
  identifiable requirement or other successful modal function is absent. Ναι from the
  responsible person after a permission question can grant permission contextually. Ο Νίκος
  μπορεί να οδηγήσει may describe ability or a possible action: either established correct
  reading can demonstrate this group; subtype ambiguity alone does not require unclear. A polite
  μπορείτε να request does not automatically describe ability. Judge negation scope and the
  actual meaning, not every modal-looking token."
