skill_id: information_exchange
explanation_language: english
shared_explanation: skills/information-exchange/information-exchange-explained-in-english.yaml
sections:
  - subskill_id: asking_information
    explanation: You need tomorrow’s opening time before taking a bicycle in. `Πότε` asks when;
      `ανοίγει` means opens and agrees with singular `το συνεργείο`. `αύριο` fixes the day, leaving
      the clock time for the answer. Greek uses a semicolon-shaped question mark.
    examples:
      - text: Πότε ανοίγει το συνεργείο αύριο;
        meaning: When does the repair shop open tomorrow? `Πότε` requests the time; `αύριο` says which day,
          and `το συνεργείο` is the shop whose opening is in question.
        note: "Try it: ask when the shop closes tomorrow. Answer: `Πότε κλείνει το συνεργείο αύριο;`.
          Replace `ανοίγει` with `κλείνει`; keep `Πότε` because the missing information is still a
          time."
  - subskill_id: answering_information
    explanation: When the question already names the shop and the day, you can answer with the clock
      time alone. `στις` introduces a time such as `στις εννέα`; `το πρωί` makes clear that it is
      morning. The earlier question supplies the omitted verb and subject.
    examples:
      - text: Στις εννέα το πρωί.
        meaning: At nine in the morning. `Στις εννέα` gives the clock time and `το πρωί` distinguishes
          morning from evening. This short answer is complete in the opening-time exchange.
        note: "Try it: answer that it opens at eight in the morning. Answer: `Στις οκτώ το πρωί`. Only the
          hour changes; the shop and opening action remain understood from the question."
  - subskill_id: checking_facts
    explanation: You heard an opening time and want to verify it before travelling. State the proposed
      fact, then add `σωστά;` to ask whether it is right. This checks the time itself; asking what a
      word means would be a different question.
    examples:
      - text: Το συνεργείο ανοίγει στις εννέα, σωστά;
        meaning: The repair shop opens at nine, right? `Το συνεργείο ανοίγει στις εννέα` states the time you
          think you heard; `σωστά;` invites confirmation or correction.
        note: "Try it: check whether the shop closes at six. Answer: `Το συνεργείο κλείνει στις έξι,
          σωστά;`. State the specific closing time and use `σωστά;` to verify it."
  - subskill_id: useful_detail
    explanation: An address may get someone to the building but not to its entrance. `Η είσοδος είναι`
      introduces the location of the entrance; `στην πίσω πλευρά` narrows it to the rear side, and
      `του κτιρίου` links that side to the building.
    examples:
      - text: Η είσοδος είναι στην πίσω πλευρά του κτιρίου.
        meaning: The entrance is at the back of the building. `στην πίσω πλευρά` locates the entrance on the
          back side; genitive `του κτιρίου` specifies which building.
        note: "Try it: tell someone the entrance is at the front of the building. Answer: `Η είσοδος είναι
          στην μπροστινή πλευρά του κτιρίου`. Change the side description; keep `του κτιρίου` to
          identify the building."
