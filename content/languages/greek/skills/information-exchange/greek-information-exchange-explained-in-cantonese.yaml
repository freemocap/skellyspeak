sections:
  - subskill_id: asking_information
    explanation: 送單車維修前，你要知聽日開門時間。`Πότε` 問幾時，`ανοίγει` 係開門，配合單數 `το συνεργείο`；`αύριο` 限定日子，留下鐘點畀對方答。希臘文問號外形似分號。
    examples:
      - text: Πότε ανοίγει το συνεργείο αύριο;
        meaning: 問維修舖聽日幾點開。`Πότε` 問時間；`αύριο` 指聽日，`το συνεργείο` 係被問嘅維修舖。
        note: 試吓問聽日幾點關門。答案：`Πότε κλείνει το συνεργείο αύριο;`。將 `ανοίγει` 換成 `κλείνει`；仍然用 `Πότε` 問時間。
  - subskill_id: answering_information
    explanation: 對方已經問咗維修舖聽日幾點開，回答可以只講鐘點。`στις` 引出時間，例如 `στις εννέα`；`το πρωί` 講明係朝早。主語同動詞由前一句補足。
    examples:
      - text: Στις εννέα το πρωί.
        meaning: 朝早九點。`Στις εννέα` 係鐘點，`το πρωί` 分清朝早同夜晚；喺呢段對話中，簡短答案已經完整。
        note: 試吓答朝早八點開。答案：`Στις οκτώ το πρωί`。只改鐘點；維修舖同開門呢件事由問題承接。
  - subskill_id: checking_facts
    explanation: 出發前想核實聽到嘅開門時間，可以先講你認為正確嘅資料，再加 `σωστά;` 問係咪啱。呢度核實事實；問某個詞係咩意思係另一種問題。
    examples:
      - text: Το συνεργείο ανοίγει στις εννέα, σωστά;
        meaning: 維修舖九點開，啱唔啱？`Το συνεργείο ανοίγει στις εννέα` 講出待核實嘅時間；`σωστά;` 請對方確認或改正。
        note: 試吓核實維修舖係咪六點關門。答案：`Το συνεργείο κλείνει στις έξι, σωστά;`。講明待核實嘅關門時間，再用 `σωστά;`。
  - subskill_id: useful_detail
    explanation: 地址可能只帶人去到大樓，未必搵到入口。`Η είσοδος είναι` 引出入口位置；`στην πίσω πλευρά` 縮窄到後面，`του κτιρίου` 指明係嗰棟樓。
    examples:
      - text: Η είσοδος είναι στην πίσω πλευρά του κτιρίου.
        meaning: 入口喺大樓後面。`στην πίσω πλευρά` 交代後側位置；屬格 `του κτιρίου` 指明係邊棟樓。
        note: 試吓話入口喺大樓前面。答案：`Η είσοδος είναι στην μπροστινή πλευρά του κτιρίου`。改前後位置，保留 `του κτιρίου` 指大樓。
