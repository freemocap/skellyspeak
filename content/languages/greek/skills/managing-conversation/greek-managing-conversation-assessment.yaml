skill_id: managing_conversation
guidance: Γεια σας can open an encounter with respectful address; closing expressions depend on
  the point reached in the exchange, not a greeting token in isolation. Κατάλαβα or other short
  responses can acknowledge receipt of an explanation without necessarily endorsing it. Repair
  questions can request a repetition or ask τι εννοείτε με a quoted term. Δηλαδή can clarify a
  prior formulation or, as a question, ask for a clearer one; it is not proof of repair when
  used in another discourse role. Εννοώ plus a contrast can correct an interpretation, while
  requests to speak and reference phrases such as σχετικά με can manage turns or introduce a
  topic. For example, εννοώ το Σάββατο, όχι την Παρασκευή identifies the intended day against
  the mistaken one. Quoting γεια σας as vocabulary does not greet the partner. Κατάλαβα after a
  recoverable explanation may acknowledge contextually. Check whether a question addresses
  trouble in hearing or meaning, or only verifies an external fact; punctuation and a question
  word cannot decide this alone.
