sections:
  - subskill_id: opening_closing
    explanation: You meet a person at the repair shop for the first time. `Γεια σας` greets one person
      respectfully or several people; `Τι κάνετε;` follows with the matching second-person plural
      verb. With a familiar single person, the corresponding forms are `Γεια σου` and `Τι κάνεις;`.
    examples:
      - text: Γεια σας! Τι κάνετε;
        meaning: Hello! How are you? `σας` and `κάνετε` maintain respectful or plural address throughout the
          greeting.
        note: "Try it: greet one familiar friend and ask how they are. Answer: `Γεια σου! Τι κάνεις;`.
          Switch both the greeting pronoun and verb to singular familiar address."
  - subskill_id: acknowledging
    explanation: The mechanic has just explained where to leave the bicycle. `Κατάλαβα` acknowledges
      that you understood the explanation; `ευχαριστώ` thanks them. This does not mean you agree
      with an opinion or authorize a plan.
    examples:
      - text: Κατάλαβα, ευχαριστώ.
        meaning: I understand, thank you. `Κατάλαβα` reports comprehension of the instruction and
          `ευχαριστώ` responds politely.
        note: "Try it: acknowledge the instruction without adding thanks. Answer: `Κατάλαβα`. This works
          because the preceding explanation makes clear what you understood."
  - subskill_id: clarification
    explanation: The mechanic mentions a back entrance, but you are unsure which doorway they mean. `Τι
      εννοείτε με` asks what they mean by the quoted expression; `εννοείτε` uses respectful or
      plural address. This seeks meaning, not whether the entrance exists.
    examples:
      - text: Τι εννοείτε με «πίσω είσοδο»;
        meaning: What do you mean by “back entrance”? `Τι εννοείτε με` asks for an explanation of the quoted
          words `πίσω είσοδο`.
        note: "Try it: ask what they mean by “side entrance.” Answer: `Τι εννοείτε με «πλαϊνή είσοδο»;`.
          Keep the clarification frame and replace only the expression needing explanation."
  - subskill_id: rephrasing
    explanation: "A customer may not understand “it needs more work.” `Δηλαδή` introduces a plainer
      restatement: the repair is not ready. The second sentence explains the first; it does not
      report a second unrelated problem."
    examples:
      - text: Χρειάζεται ακόμα δουλειά. Δηλαδή, η επισκευή δεν είναι έτοιμη.
        meaning: It still needs work. In other words, the repair is not ready. `Δηλαδή` signals that `η
          επισκευή δεν είναι έτοιμη` restates the unfinished state.
        note: "Try it: rephrase “The shop is closed” as “It is not open.” Answer: `Το συνεργείο είναι
          κλειστό. Δηλαδή, δεν είναι ανοιχτό`. Use `Δηλαδή` only because the second clause explains
          the first."
  - subskill_id: correcting_misunderstanding
    explanation: The other person thinks you said Friday, but you meant Saturday. `Εννοώ` introduces the
      intended day; `όχι` directly rejects the mistaken one. Both day expressions are accusative
      time phrases.
    examples:
      - text: Εννοώ το Σάββατο, όχι την Παρασκευή.
        meaning: I mean Saturday, not Friday. `το Σάββατο` is the corrected day; `όχι την Παρασκευή`
          explicitly removes Friday from the plan.
        note: "Try it: correct someone who thought you meant Saturday when you meant Friday. Answer: `Εννοώ
          την Παρασκευή, όχι το Σάββατο`. Swap the days and keep each day’s article."
  - subskill_id: turns_topics
    explanation: During a group discussion, you want a turn to discuss the route. `Μπορώ να πω κάτι`
      asks to say something; `σχετικά με τη διαδρομή` identifies the topic. The question seeks the
      floor rather than testing your physical ability to speak.
    examples:
      - text: Μπορώ να πω κάτι σχετικά με τη διαδρομή;
        meaning: May I say something about the route? `Μπορώ να πω κάτι` requests a turn; `σχετικά με τη
          διαδρομή` says what the comment concerns.
        note: "Try it: ask to say something about the repair. Answer: `Μπορώ να πω κάτι σχετικά με την
          επισκευή;`. Keep the turn request; change the topic phrase to feminine accusative `την
          επισκευή`."
