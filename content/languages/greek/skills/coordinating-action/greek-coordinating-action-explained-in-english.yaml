skill_id: coordinating_action
explanation_language: english
shared_explanation: skills/coordinating-action/coordinating-action-explained-in-english.yaml
sections:
  - subskill_id: requests
    explanation: Your hands are full and you need another person to open a door. `Μπορείτε να ανοίξετε`
      forms a polite request using second-person plural forms, which can address one person
      respectfully. `παρακαλώ` adds please; the question asks for action, not a report about
      ability.
    examples:
      - text: Μπορείτε να ανοίξετε την πόρτα, παρακαλώ;
        meaning: Could you open the door, please? `Μπορείτε` and `ανοίξετε` address the listener politely;
          `την πόρτα` is what you want opened.
        note: "Try it: politely ask someone to close the door. Answer: `Μπορείτε να κλείσετε την πόρτα,
          παρακαλώ;`. Keep the respectful request frame and replace the action with `κλείσετε`."
  - subskill_id: offers_invitations
    explanation: You are going on an outing and want to invite another person along. `Θέλετε να έρθετε`
      asks whether they would like to come; both verbs use respectful or plural address. `μαζί μας`
      makes the invitation include your group.
    examples:
      - text: Θέλετε να έρθετε μαζί μας στη βόλτα;
        meaning: Would you like to come with us on the outing? `έρθετε` is the listener’s coming; `μαζί μας`
          means with us and `στη βόλτα` names the outing.
        note: "Try it: invite someone to come with you to the repair shop. Answer: `Θέλετε να έρθετε μαζί μας στο
          συνεργείο;`. Keep the invitation and change the destination to `στο συνεργείο`."
  - subskill_id: suggestions
    explanation: You and a friend are choosing a route. First-person plural `Να πάμε…;` proposes an
      action for both of you. `από τον πιο ήσυχο δρόμο` identifies the route, with `πιο ήσυχο`
      expressing the comparison in context.
    examples:
      - text: Να πάμε από τον πιο ήσυχο δρόμο;
        meaning: Shall we take the quieter street? `Να πάμε` proposes that we go; `από τον πιο ήσυχο δρόμο`
          names the route to take.
        note: "Try it: suggest taking the shorter street. Answer: `Να πάμε από τον πιο σύντομο δρόμο;`. Keep
          first-person plural `Να πάμε` and change the route description."
  - subskill_id: commitments
    explanation: While sharing the repair tasks, you take responsibility for the tools. `Θα φέρω` is a
      first-person future action; the extra `εγώ` highlights that you, rather than the other person,
      will bring them. In this planning context it is a commitment.
    examples:
      - text: Θα φέρω εγώ τα εργαλεία.
        meaning: I will bring the tools. `Θα φέρω` states the future action, `εγώ` emphasizes the speaker’s
          responsibility, and `τα εργαλεία` names what will be brought.
        note: "Try it: take responsibility for bringing the bicycle. Answer: `Θα φέρω εγώ το ποδήλατο`. Keep
          the emphasized speaker and change the object to the bicycle."
  - subskill_id: accepting_declining
    explanation: Someone offers to carry your bag. `Ναι, ευχαριστώ πολύ` accepts that specific offer and
      thanks them; the offer makes the short `Ναι` meaningful. Without a preceding offer, the same
      words would not identify what help you accepted.
    examples:
      - text: Ναι, ευχαριστώ πολύ.
        meaning: Yes, thank you very much. Here `Ναι` accepts the offered help with the bag and `ευχαριστώ
          πολύ` thanks the person.
        note: "Try it: decline the offer politely. Answer: `Όχι, ευχαριστώ πολύ`. `Όχι` rejects the
          identified offer; the thanks acknowledges the person’s kindness."
  - subskill_id: negotiating_plans
    explanation: A friend proposes Friday, but you cannot come then. `Την Παρασκευή δεν μπορώ` states
      the conflict; `Να έρθω το Σάββατο;` proposes Saturday and asks for agreement. The two
      sentences together negotiate a replacement time.
    examples:
      - text: Την Παρασκευή δεν μπορώ. Να έρθω το Σάββατο;
        meaning: I cannot make it on Friday. Shall I come on Saturday? `δεν μπορώ` marks unavailability; the
          first-person `Να έρθω` asks whether the substitute visit works.
        note: "Try it: say you cannot come Saturday and propose Sunday. Answer: `Το Σάββατο δεν μπορώ. Να
          έρθω την Κυριακή;`. Change both day phrases; keep the constraint followed by a proposed
          alternative."
