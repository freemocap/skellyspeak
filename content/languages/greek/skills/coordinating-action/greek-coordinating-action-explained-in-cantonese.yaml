skill_id: coordinating_action
explanation_language: cantonese
shared_explanation: skills/coordinating-action/coordinating-action-explained-in-cantonese.yaml
sections:
  - subskill_id: requests
    explanation: Μπορείτε να 後接行動，可以有禮貌咁請人做事。複數形式可對多人，亦可尊稱一人。後面動詞仍要配合人稱，唔係英文式不變不定式。
    examples:
      - text: Μπορείτε να ανοίξετε την πόρτα, παρακαλώ;
        meaning: 唔該，你可唔可以開門？
        note: Μπορείτε 同 ανοίξετε 喺呢度尊稱對方；重點係請求行動，唔係測試能力。
  - subskill_id: offers_invitations
    explanation: Θέλετε να 可以邀請參與；後面動詞交代邊個參與。尊稱問題問對方，μαζί μας 則將講者一行人包括在內。
    examples:
      - text: Θέλετε να έρθετε μαζί μας στη βόλτα;
        meaning: 你想唔想同我哋一齊去郊遊？
        note: έρθετε 係第二人稱複數，亦可尊稱一人；μαζί μας 表明邀請加入。
  - subskill_id: suggestions
    explanation: 第一人稱複數 να 問句可以提議共同行動。詞尾包括講者同同行者；語境令佢成為建議，唔係獨自行動許可。
    examples:
      - text: Να πάμε από τον πιο ήσυχο δρόμο;
        meaning: 我哋行條靜啲嘅街，好唔好？
        note: πάμε 提議「我哋」嘅行動；από τον πιο ήσυχο δρόμο 指較靜路線，比較對象來自討論。
  - subskill_id: commitments
    explanation: 第一人稱將來表達可以喺計劃中承擔責任。θα 本身唔等於承諾，仍要睇講者行動同分工語境。
    examples:
      - text: Θα φέρω εγώ τα εργαλεία.
        meaning: 由我帶工具嚟。
        note: 維修分工時用；明示 εγώ 強調自己負責，一般將來陳述可以省略。
  - subskill_id: accepting_declining
    explanation: 簡短 ναι 加道謝可以接受已有提議；冇提議語境時，同一講法亦可能只係確認資訊。
    examples:
      - text: Ναι, ευχαριστώ πολύ.
        meaning: 好呀，多謝晒。
        note: 對方提出幫你拎袋之後用，係接受協助，唔係贊同觀點。
  - subskill_id: negotiating_plans
    explanation: 交代限制再提出替代，留空間畀對方同意。να 問句可提出新行動或日子；日子作時間短語時通常用賓格。
    examples:
      - text: Την Παρασκευή δεν μπορώ. Να έρθω το Σάββατο;
        meaning: 星期五我唔得。改為星期六嚟，好唔好？
        note: 第一句拒絕原定時間，第二句問替代安排；το Σάββατο 交代到訪日期。
