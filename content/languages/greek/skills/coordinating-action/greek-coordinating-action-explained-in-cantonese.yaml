sections:
  - subskill_id: requests
    explanation: 你雙手拎滿嘢，要請人開門。`Μπορείτε να ανοίξετε` 用第二人稱複數作禮貌請求，可尊稱一個人；`παρακαλώ` 加上「唔該」。呢度請對方做事，唔係問佢有冇能力。
    examples:
      - text: Μπορείτε να ανοίξετε την πόρτα, παρακαλώ;
        meaning: 可唔可以幫手開門？`Μπορείτε` 同 `ανοίξετε` 禮貌稱呼對方；`την πόρτα` 係要開嘅門。
        note: 試吓禮貌地請對方關門。答案：`Μπορείτε να κλείσετε την πόρτα, παρακαλώ;`。保留尊稱請求句式，動作改 `κλείσετε`。
  - subskill_id: offers_invitations
    explanation: 你哋去散步，想邀請另一個人同行。`Θέλετε να έρθετε` 問佢想唔想嚟；兩個動詞都用禮貌或複數稱呼。`μαζί μας` 表示同我哋一齊。
    examples:
      - text: Θέλετε να έρθετε μαζί μας στη βόλτα;
        meaning: 你想唔想同我哋去散步？`έρθετε` 指對方嚟，`μαζί μας` 係同我哋一齊，`στη βόλτα` 指散步。
        note: 試吓邀請對方同你哋去維修舖。答案：`Θέλετε να έρθετε μαζί μας στο συνεργείο;`。保留邀請句式，目的地改 `στο συνεργείο`。
  - subskill_id: suggestions
    explanation: 你同朋友揀路。第一人稱複數 `Να πάμε…;` 提議大家一齊做。`από τον πιο ήσυχο δρόμο` 指要行嘅路；`πιο ήσυχο` 按語境表示較安靜。
    examples:
      - text: Να πάμε από τον πιο ήσυχο δρόμο;
        meaning: 我哋行比較靜嗰條街，好唔好？`Να πάμε` 係提議我哋去，`από τον πιο ήσυχο δρόμο` 指路線。
        note: 試吓建議行較短嗰條街。答案：`Να πάμε από τον πιο σύντομο δρόμο;`。保留第一人稱複數 `Να πάμε`，改路線描述。
  - subskill_id: commitments
    explanation: 分配維修工作時，你負責工具。`Θα φέρω` 係第一人稱將來動作；額外嘅 `εγώ` 強調由你帶，唔係另一個人。喺呢個安排語境中，佢係承諾。
    examples:
      - text: Θα φέρω εγώ τα εργαλεία.
        meaning: 我會帶工具。`Θα φέρω` 係將來動作，`εγώ` 強調責任喺講者，`τα εργαλεία` 指要帶嘅工具。
        note: 試吓承擔帶單車嘅責任。答案：`Θα φέρω εγώ το ποδήλατο`。保留強調講者嘅形式，賓語改單車。
  - subskill_id: accepting_declining
    explanation: 有人提出幫你拎袋。`Ναι, ευχαριστώ πολύ` 接受呢個具體幫忙並道謝；前面嘅提議令簡短 `Ναι` 有明確對象。若無提議，句子唔會講明接受乜。
    examples:
      - text: Ναι, ευχαριστώ πολύ.
        meaning: 好，多謝晒。呢度 `Ναι` 接受幫手拎袋，`ευχαριστώ πολύ` 向對方道謝。
        note: 試吓有禮貌地婉拒。答案：`Όχι, ευχαριστώ πολύ`。`Όχι` 拒絕已知提議，道謝仍然表示感謝對方好意。
  - subskill_id: negotiating_plans
    explanation: 朋友提議星期五，但你嗰日嚟唔到。`Την Παρασκευή δεν μπορώ` 交代衝突；`Να έρθω το Σάββατο;` 提議星期六，並問對方可唔可以。兩句一齊協商替代時間。
    examples:
      - text: Την Παρασκευή δεν μπορώ. Να έρθω το Σάββατο;
        meaning: 星期五我唔得；星期六嚟得唔得？`δεν μπορώ` 表示嗰日無法赴約；第一人稱 `Να έρθω` 問替代安排可否。
        note: 試吓話星期六唔得，提議星期日。答案：`Το Σάββατο δεν μπορώ. Να έρθω την Κυριακή;`。兩個日期都要改，仍先講限制再提新方案。
