skill_id: time_events
guidance: "The present can describe an action happening now, a routine, a scheduled event or an
  activity continuing from earlier; English progressive or perfect wording does not demand a
  matching Greek compound tense. Past reference can use an aorist such as άλλαξα, or an
  imperfect when an ongoing or repeated perspective suits the meaning. Θα with a suitable verb
  form can locate a future event. Aspect also matters: perfective presentation is not a rule
  that every event lasted an instant. Bare accusative time expressions can state duration, dates
  or frequency; κάθε Παρασκευή indicates repetition and τρεις ώρες a duration. Πρώτα and μετά
  can order actions. Τελείωσα explicitly reports finishing, while ακόμα with a present action
  can show continuation. A copied χθες unconnected to any event is not successful past-event
  use. Χθες το πρωί can complete a recoverable event-time question contextually. Do not count
  every θα token as a future event: discourse can give it another modal or interpersonal role."
