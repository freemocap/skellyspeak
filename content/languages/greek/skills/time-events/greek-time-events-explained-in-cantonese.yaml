shared_explanation: skills/time-events/time-events-explained-in-cantonese.yaml
sections:
  - subskill_id: present_events
    explanation: 有人問你而家對架單車做緊乜。`Τώρα` 指而家；第一人稱單數現在式 `φτιάχνω` 喺呢度可解作「我修理緊」。現在式亦可講習慣，所以時間詞同語境都重要。
    examples:
      - text: Τώρα φτιάχνω το ποδήλατο.
        meaning: 我而家修理緊架單車。`Τώρα` 係而家，`φτιάχνω` 係我修理，`το ποδήλατο` 指被修理嘅單車。
        note: 試吓話你而家打開個箱。答案：`Τώρα ανοίγω το κουτί`。`ανοίγω` 係第一人稱現在式；`τώρα` 明確指當下。
  - subskill_id: past_events
    explanation: 你報告尋日完成咗嘅維修。`Χθες` 放喺過去；`άλλαξα` 係 `αλλάζω` 嘅第一人稱不定過去式，將換輪胎視作一件完整事件，唔代表動作一定好快。
    examples:
      - text: Χθες άλλαξα το λάστιχο.
        meaning: 尋日我換咗輪胎。`Χθες` 係尋日，`άλλαξα` 報告我換咗，`το λάστιχο` 係輪胎。
        note: 試吓話你尋日換咗道門。答案：`Χθες άλλαξα την πόρτα`。保留 `άλλαξα`；新賓語用陰性賓格 `την πόρτα`。
  - subskill_id: future_events
    explanation: 你同朋友計劃聽日整車。`Αύριο` 指聽日；`θα φέρω` 將帶工具講成未來一件完整事件。呢度 `θα` 後用 `φέρω`；講平時帶乜可見現在式 `φέρνω`。
    examples:
      - text: Αύριο θα φέρω τα εργαλεία.
        meaning: 聽日我會帶工具。`Αύριο` 係聽日，`θα φέρω` 表示將來帶嚟，`τα εργαλεία` 係工具。
        note: 試吓承諾聽日帶單車。答案：`Αύριο θα φέρω το ποδήλατο`。保留 `θα φέρω`，賓語改為單數 `το ποδήλατο`。
  - subskill_id: duration_frequency
    explanation: 你解釋星期五嘅工作慣例。`τρεις ώρες` 表示每次工作三個鐘，毋須另加「持續」介詞；`κάθε Παρασκευή` 表示逢星期五。現在式 `δουλεύω` 可講慣常動作。
    examples:
      - text: Δουλεύω εδώ τρεις ώρες κάθε Παρασκευή.
        meaning: 我每個星期五喺度做三個鐘。`τρεις ώρες` 係每次時長，`κάθε Παρασκευή` 係頻率。
        note: 試吓話你每個星期五做兩個鐘。答案：`Δουλεύω εδώ δύο ώρες κάθε Παρασκευή`。時長改成 `δύο ώρες`，重複日子不變。
  - subskill_id: event_sequence
    explanation: 你解釋維修步驟先後。`Πρώτα` 將開箱放先；`και μετά` 連接之後取出工具。兩個動詞都係現在式，主語都係省略嘅「我」；副詞負責交代次序。
    examples:
      - text: Πρώτα ανοίγω το κουτί και μετά βγάζω τα εργαλεία.
        meaning: 首先開箱，然後取出工具。`Πρώτα` 同 `μετά` 排列 `ανοίγω`、`βγάζω`；`και` 連接兩個動作。
        note: 試吓話你先取出工具，然後整單車。答案：`Πρώτα βγάζω τα εργαλεία και μετά φτιάχνω το ποδήλατο`。兩個時間詞清楚標示合理次序。
  - subskill_id: event_phase
    explanation: 朋友問架單車整好未。`Τελείωσα` 明確話我完成咗維修；單用過去式只會講工作喺過去。相反，`ακόμα` 配現在式 `φτιάχνω` 表示仲做緊。
    examples:
      - text: Τελείωσα την επισκευή.
        meaning: 我完成咗維修。`Τελείωσα` 直接講完成，`την επισκευή` 指完成嘅維修工作。
        note: 試吓話你仲整緊架單車。答案：`Ακόμα φτιάχνω το ποδήλατο`。用 `ακόμα` 加現在式 `φτιάχνω` 表示繼續，唔用 `τελείωσα`。
      - text: Ακόμα φτιάχνω το ποδήλατο.
        meaning: 我仲整緊架單車。`Ακόμα` 係仲；現在式 `φτιάχνω` 描述此刻仍然繼續嘅工作。
        note: 試吓報告維修已完成。答案：`Τελείωσα την επισκευή`。用 `τελείωσα` 明確講完成，唔用表示繼續嘅 `ακόμα`。
