skill_id: time_events
explanation_language: english
shared_explanation: skills/time-events/time-events-explained-in-english.yaml
sections:
  - subskill_id: present_events
    explanation: Someone asks what you are doing with the bicycle now. `Τώρα` fixes the action at the
      present moment; `φτιάχνω` is first-person singular present and can mean I am fixing here. The
      present can also describe routines, so the time word and context matter.
    examples:
      - text: Τώρα φτιάχνω το ποδήλατο.
        meaning: I am fixing the bicycle now. `Τώρα` means now, `φτιάχνω` says I am fixing, and `το
          ποδήλατο` names the bicycle being repaired.
        note: "Try it: say you are opening the box now. Answer: `Τώρα ανοίγω το κουτί`. `ανοίγω` is
          first-person present; `τώρα` makes the current-event reading clear."
  - subskill_id: past_events
    explanation: You report a repair completed yesterday. `Χθες` places it in the past; `άλλαξα` is the
      first-person aorist of `αλλάζω` and presents changing the tyre as a whole event. The aorist
      does not mean the work happened instantly.
    examples:
      - text: Χθες άλλαξα το λάστιχο.
        meaning: Yesterday I changed the tyre. `Χθες` supplies yesterday; `άλλαξα` reports my completed
          change, and `το λάστιχο` is the tyre.
        note: "Try it: say you changed the door yesterday. Answer: `Χθες άλλαξα την πόρτα`. Keep the aorist
          `άλλαξα`; use feminine accusative `την πόρτα` for the new object."
  - subskill_id: future_events
    explanation: You and a friend plan a repair tomorrow. `Αύριο` fixes the day, while `θα φέρω`
      presents bringing the tools as a future whole event. `φέρω` is the form used here after `θα`;
      compare present `φέρνω` when describing what you usually bring.
    examples:
      - text: Αύριο θα φέρω τα εργαλεία.
        meaning: Tomorrow I will bring the tools. `Αύριο` means tomorrow; `θα φέρω` expresses the future
          bringing, and `τα εργαλεία` are the tools.
        note: "Try it: promise to bring the bicycle tomorrow. Answer: `Αύριο θα φέρω το ποδήλατο`. Keep `θα
          φέρω`; change the object to singular `το ποδήλατο`."
  - subskill_id: duration_frequency
    explanation: You explain your Friday work routine. `τρεις ώρες` tells how long each work period
      lasts without an extra word for for; `κάθε Παρασκευή` says it recurs every Friday. The present
      `δουλεύω` fits a routine.
    examples:
      - text: Δουλεύω εδώ τρεις ώρες κάθε Παρασκευή.
        meaning: I work here for three hours every Friday. `τρεις ώρες` is the duration of each shift; `κάθε
          Παρασκευή` gives its frequency.
        note: "Try it: say you work here two hours every Friday. Answer: `Δουλεύω εδώ δύο ώρες κάθε
          Παρασκευή`. Change the duration to `δύο ώρες`; keep the recurring day."
  - subskill_id: event_sequence
    explanation: You are giving the order of steps for a repair. `Πρώτα` puts opening the box first;
      `και μετά` links the later action of taking out the tools. Both verbs are present and share
      the understood first-person subject; the adverbs carry the order.
    examples:
      - text: Πρώτα ανοίγω το κουτί και μετά βγάζω τα εργαλεία.
        meaning: First I open the box and then I take out the tools. `Πρώτα` and `μετά` sequence `ανοίγω`
          and `βγάζω`; `και` joins the two actions.
        note: "Try it: say you first take out the tools and then fix the bicycle. Answer: `Πρώτα βγάζω τα
          εργαλεία και μετά φτιάχνω το ποδήλατο`. The two time words make the sensible order
          explicit."
  - subskill_id: event_phase
    explanation: A friend asks if the bicycle is ready. `Τελείωσα` explicitly says I finished the
      repair; a past tense alone would only place work in the past. By contrast, `ακόμα` with
      present `φτιάχνω` says the work is continuing.
    examples:
      - text: Τελείωσα την επισκευή.
        meaning: I finished the repair. `Τελείωσα` states completion and `την επισκευή` names the repair
          that is finished.
        note: "Try it: say you are still fixing the bicycle. Answer: `Ακόμα φτιάχνω το ποδήλατο`. Use
          `ακόμα` plus present `φτιάχνω` for continuing work, not `τελείωσα`."
      - text: Ακόμα φτιάχνω το ποδήλατο.
        meaning: I am still fixing the bicycle. `Ακόμα` means still; present `φτιάχνω` describes work
          continuing at this point.
        note: "Try it: report that the repair is finished. Answer: `Τελείωσα την επισκευή`. Use `τελείωσα`
          for explicit completion instead of `ακόμα` for continuation."
