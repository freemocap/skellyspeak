sections:
  - subskill_id: wants_intentions
    explanation: You are explaining a personal learning goal at the repair shop. `Θέλω να μάθω` says I
      want to learn; the second `να φτιάχνω` names the skill of repairing bicycles. Both verbs after
      `να` have forms appropriate to the speaker; `να` is not an unchanging English infinitive.
    examples:
      - text: Θέλω να μάθω να φτιάχνω ποδήλατα.
        meaning: I want to learn to repair bicycles. `Θέλω` expresses my wish, `να μάθω` the learning goal,
          and `να φτιάχνω ποδήλατα` the repeated skill I hope to acquire.
        note: "Try it: at the repair workshop, say you want to learn to fix damaged doors. Answer: `Θέλω να μάθω να φτιάχνω χαλασμένες πόρτες`. Keep
          the two learning layers; `χαλασμένες` makes the repair reading explicit and agrees with plural feminine `πόρτες`."
  - subskill_id: preferences
    explanation: You are choosing a cycling route. Greek `μου αρέσουν` puts the liked plural thing, `οι
      ήσυχοι δρόμοι`, in subject position; `μου` identifies the person who likes it. With one
      singular street, the verb would be `αρέσει`.
    examples:
      - text: Μου αρέσουν οι ήσυχοι δρόμοι.
        meaning: I like quiet streets. `μου` means to me here; plural `οι ήσυχοι δρόμοι` controls plural
          `αρέσουν`.
        note: "Try it: say you like the quiet street. Answer: `Μου αρέσει ο ήσυχος δρόμος`. The liked
          subject is now singular, so use `αρέσει`; the adjective and article also become masculine
          singular."
  - subskill_id: emotions
    explanation: You explain why you avoid a street with large dogs. `Φοβάμαι` directly expresses I am
      afraid; `τα μεγάλα σκυλιά` names what frightens you. The adjective `μεγάλα` agrees with neuter
      plural `σκυλιά`.
    examples:
      - text: Φοβάμαι τα μεγάλα σκυλιά.
        meaning: I am afraid of large dogs. `Φοβάμαι` names the speaker’s feeling; `τα μεγάλα σκυλιά`
          identifies its object, not another person’s fear.
        note: "Try it: say you are afraid of the large dog. Answer: `Φοβάμαι το μεγάλο σκυλί`. Use singular
          neuter `το μεγάλο σκυλί` for one dog."
  - subskill_id: opinions
    explanation: You are comparing two routes but have not confirmed their safety. `Νομίζω ότι`
      introduces your view; `αυτή η διαδρομή` is the route you mean, and `πιο ασφαλής` evaluates it
      as safer than a route already in discussion.
    examples:
      - text: Νομίζω ότι αυτή η διαδρομή είναι πιο ασφαλής.
        meaning: I think this route is safer. `Νομίζω ότι` marks an opinion; `αυτή η διαδρομή` is feminine
          singular and `πιο ασφαλής` gives the comparison.
        note: "Try it: say you think this route is shorter. Answer: `Νομίζω ότι αυτή η διαδρομή είναι πιο
          σύντομη`. Keep the opinion frame; `σύντομη` agrees with feminine `διαδρομή`."
  - subskill_id: agreement_disagreement
    explanation: A companion proposes a route that you do not support. `Διαφωνώ` states disagreement;
      `με αυτή την πρόταση` identifies the proposal you disagree with. Naming the target makes your
      position clear without needing to repeat the proposal.
    examples:
      - text: Διαφωνώ με αυτή την πρόταση.
        meaning: I disagree with this proposal. `Διαφωνώ` states the stance; `με αυτή την πρόταση` names the
          particular proposal.
        note: "Try it: say you agree with this proposal. Answer: `Συμφωνώ με αυτή την πρόταση`. Change the
          stance verb to `Συμφωνώ`; the target phrase remains."
