sections:
  - subskill_id: wants_intentions
    explanation: 你喺維修舖講自己嘅學習目標。`Θέλω να μάθω` 係我想學；第二個 `να φτιάχνω` 指學識修理單車呢種技能。`να` 後面嘅動詞都有配合講者嘅形式。
    examples:
      - text: Θέλω να μάθω να φτιάχνω ποδήλατα.
        meaning: 我想學整單車。`Θέλω` 表示願望，`να μάθω` 係學習目標，`να φτιάχνω ποδήλατα` 係希望掌握嘅維修技能。
        note: 試吓喺維修工場話你想學修理壞咗嘅門。答案：`Θέλω να μάθω να φτιάχνω χαλασμένες πόρτες`。保留兩層學習意思；`χαλασμένες` 配合陰性複數 `πόρτες`，亦講明門係壞咗。
  - subskill_id: preferences
    explanation: 你揀踩車路線。希臘文 `μου αρέσουν` 將受喜歡嘅複數事物 `οι ήσυχοι δρόμοι` 放喺主語位置；`μου` 指喜歡嘅人。若係一條單數街道，動詞會用
      `αρέσει`。
    examples:
      - text: Μου αρέσουν οι ήσυχοι δρόμοι.
        meaning: 我鍾意安靜嘅街道。呢度 `μου` 即係「對我嚟講」；複數 `οι ήσυχοι δρόμοι` 配合複數動詞 `αρέσουν`。
        note: 試吓話你鍾意嗰條安靜街道。答案：`Μου αρέσει ο ήσυχος δρόμος`。受喜歡嘅主語改成單數，用 `αρέσει`；冠詞同形容詞亦改男性單數。
  - subskill_id: emotions
    explanation: 你解釋點解避開有大狗嘅街。`Φοβάμαι` 直接表達「我驚」；`τα μεγάλα σκυλιά` 指令你驚嘅對象。`μεγάλα` 配合中性複數 `σκυλιά`。
    examples:
      - text: Φοβάμαι τα μεγάλα σκυλιά.
        meaning: 我驚大狗。`Φοβάμαι` 係講者嘅感受；`τα μεγάλα σκυλιά` 指驚嘅對象。
        note: 試吓話你驚嗰隻大狗。答案：`Φοβάμαι το μεγάλο σκυλί`。一隻狗用中性單數 `το μεγάλο σκυλί`。
  - subskill_id: opinions
    explanation: 你比較兩條路，但未證實安全程度。`Νομίζω ότι` 引出個人睇法；`αυτή η διαδρομή` 指呢條路，`πιο ασφαλής` 評價佢比已討論嘅另一條更安全。
    examples:
      - text: Νομίζω ότι αυτή η διαδρομή είναι πιο ασφαλής.
        meaning: 我覺得呢條路安全啲。`Νομίζω ότι` 標示意見；`αυτή η διαδρομή` 係陰性單數，`πιο ασφαλής` 作比較。
        note: 試吓話你覺得呢條路短啲。答案：`Νομίζω ότι αυτή η διαδρομή είναι πιο σύντομη`。保留意見結構；`σύντομη` 配合陰性
          `διαδρομή`。
  - subskill_id: agreement_disagreement
    explanation: 同伴提議一條你唔贊成嘅路線。`Διαφωνώ` 表示反對；`με αυτή την πρόταση` 指明你反對邊個提議。講明對象，毋須重講整個提議。
    examples:
      - text: Διαφωνώ με αυτή την πρόταση.
        meaning: 我唔同意呢個提議。`Διαφωνώ` 表達立場；`με αυτή την πρόταση` 指特定提議。
        note: 試吓話你同意呢個提議。答案：`Συμφωνώ με αυτή την πρόταση`。立場動詞改 `Συμφωνώ`，對象片語不變。
