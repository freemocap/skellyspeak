      - Once cycled from Valencia to Sagunto on a dare.
    favoriteBooks:
      - La sombra del viento — Carlos Ruiz Zafón
      - Nada — Carmen Laforet
    favoriteMovies:
      - Volver (2006)
      - Mar adentro (2004)
    manner: Warm and quick. Short sentences, plenty of questions, and gentle teasing once she is
      comfortable.
    quirks:
      - Describes food by its smell.
      - Sends voice notes instead of writing.
    vibe:
      - 🌿
      - 🌊
      - 🍊
