sections:
  - subskill_id: ability
    explanation: Spanish distinguishes knowing how to do something from being able to do it in a
      particular situation. For a learned skill, such as swimming or cooking, `saber` followed by an
      infinitive means ‘know how to’. An infinitive is the dictionary form of a verb, such as
      `nadar`. The example below describes a skill the speaker has learned.
    examples:
      - text: Sé nadar.
        meaning: "**How it works.** This means “I know how to swim.” `Sé` already identifies the speaker, so
          `yo` is optional. `Nadar` stays in its infinitive form. Keep the written accent in `sé`;
          `se` without it is a different word."
        note: >-
          **Compare.** `Puedo nadar hoy` means I can swim today: circumstances allow it. You can
          know how to swim but be unable to swim today. Put `no` before the first verb for a
          negative: `No sé nadar`.


          **Try it.** Say that she knows how to cook, using `cocinar`. Answer: `Ella sabe cocinar`.
          Change the first verb; leave the activity in the infinitive.
  - subskill_id: permission
    explanation: When an action needs someone else's agreement, a question with `poder` can ask for
      permission. `¿Puedo…?` asks whether I may do something; it is a useful everyday pattern at a
      doorway, in a shared space or before borrowing an object. The action follows as an infinitive,
      such as `entrar`, to enter.
    examples:
      - text: ¿Puedo entrar?
        meaning: "**How it works.** “May I come in?” combines `puedo`, asking whether I may, with `entrar`,
          to enter. At a doorway, the listener can grant or refuse permission. There is no extra
          word corresponding to English “do” in this question."
        note: >-
          **Change the person.** `¿Puedes entrar?` asks whether you can enter; it no longer asks
          permission for me. `¿Podría entrar?` is a more tentative way to ask for myself. Tone and
          the relationship still matter.


          **Try it.** Ask permission to use a chair with `usar esta silla`. Answer: `¿Puedo usar
          esta silla?` A possible reply is `Sí, claro`: yes, of course.
  - subskill_id: obligation
    explanation: A requirement is something someone needs or is expected to do. Spanish commonly
      expresses this with `tener que` followed by an infinitive. In the example, the speaker needs
      to leave. The sentence tells us about that necessity; the conversation can supply the reason,
      such as an appointment or a closing time.
    examples:
      - text: Tengo que salir.
        meaning: "**How it works.** “I have to leave” uses `tengo` for I. To talk about another person,
          change that word: `Ella tiene que salir`. Keep `que salir` unchanged. The sentence states
          the requirement; the surrounding conversation explains why leaving is necessary."
        note: >-
          **Compare.** `Hay que salir` states that leaving is necessary without naming a particular
          person. `No tengo que salir` normally means I do not have to leave, not that leaving is
          forbidden.


          **Try it.** Say that you have to return the key, using `devolver la llave`. Answer: `Tengo
          que devolver la llave`. Do not drop `que` between the two verbs.
  - subskill_id: possibility
    explanation: "Sometimes you want to mention an outcome without claiming it will happen. Spanish uses
      `puede que` for this kind of possibility. The following verb takes the subjunctive, a verb
      form that this construction requires. A weather prediction provides a useful example: the
      speaker allows for rain but does not promise it."
    examples:
      - text: Puede que llueva.
        meaning: "**How it works.** “It may rain” uses `llueva`, from `llover`, to rain. Compare `Llueve`,
          it is raining, with `Puede que llueva`, it may rain. Spanish does not need a separate
          subject word corresponding to the weather “it” in English."
        note: >-
          **Change the possibility.** Put `no` after `que` to allow for no rain: `Puede que no
          llueva`. This still leaves the outcome uncertain. Add `mañana` for tomorrow: `Puede que
          llueva mañana`.


          **Try it.** Say it may not rain tomorrow. Answer: `Puede que no llueva mañana`. Keep
          `llueva` in this pattern; do not replace it with `llueve`.
  - subskill_id: certainty
    explanation: You may know something about a situation without being ready to confirm it. `No estoy
      seguro` or `No estoy segura` expresses that lack of certainty. It describes your confidence
      rather than saying the claim is false. The ending of `seguro` or `segura` agrees with the
      speaker.
    examples:
      - text: No estoy seguro.
        meaning: "**How it works.** “I am not sure” uses the masculine form. A speaker using feminine
          agreement says `No estoy segura`. The adjective describes the speaker, not the grammatical
          gender of the thing being discussed. Neither version says that the other person is wrong."
        note: >-
          **Give the uncertainty a subject.** `No estoy seguro de la hora` means I am not sure about
          the time. `No sé` instead says I do not know; it can be a direct answer when you lack the
          information.


          **Try it.** A woman cannot confirm the time. One answer: `No estoy segura de la hora`.
          Keep `estoy` for I and change only the adjective's ending.
