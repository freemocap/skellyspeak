sections:
  - subskill_id: ability
    explanation: Poder plus an infinitive can express ability. Saber plus an infinitive can express
      knowing how to do something.
    examples:
      - text: Sé nadar.
        meaning: I know how to swim.
        note: Saber describes learned ability.
  - subskill_id: permission
    explanation: A question with poder can ask whether an action is allowed; the situation identifies
      the permission reading.
    examples:
      - text: ¿Puedo entrar?
        meaning: May I come in?
        note: At a doorway, the speaker asks for permission.
  - subskill_id: obligation
    explanation: Tener que plus an infinitive states a personal requirement. Hay que can state a general
      requirement.
    examples:
      - text: Tengo que salir.
        meaning: I have to leave.
        note: Que belongs between tengo and the infinitive.
  - subskill_id: possibility
    explanation: Puede que plus a subjunctive clause presents something as possible.
    examples:
      - text: Puede que llueva.
        meaning: It may rain.
        note: Llueva follows puede que in this possibility construction.
  - subskill_id: certainty
    explanation: Expressions such as no estoy seguro state how certain the speaker is. They need not
      predict an event.
    examples:
      - text: No estoy seguro.
        meaning: I am not sure.
        note: A masculine speaker marks uncertainty about the current proposition.
