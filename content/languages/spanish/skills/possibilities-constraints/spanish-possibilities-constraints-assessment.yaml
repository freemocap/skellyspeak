language: spanish
guidance: Spanish poder can express ability, permission or possibility; use the exchange to
  distinguish them. Tengo que + infinitive and hay que + infinitive express requirements; tengo de
  ir is not the corresponding tener que construction. Puede que + subjunctive expresses possibility.
  No estoy seguro expresses uncertainty. A future form can express conjecture rather than future
  time. A question such as ¿Puedes cerrar la puerta? usually requests action rather than testing
  ability. Do not credit this group from its modal form alone.
