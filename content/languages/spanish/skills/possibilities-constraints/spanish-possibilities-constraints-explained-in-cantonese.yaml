skill_id: possibilities_constraints
language: spanish
explanation_language: cantonese
shared_explanation: skills/possibilities-constraints/possibilities-constraints-explained-in-cantonese.yaml
sections:
  - subskill_id: ability
    explanation: Poder加不定式可以表達能力；saber加不定式可以表達識做某件事。
    examples:
      - text: Sé nadar.
        meaning: 我識游水。
        note: Saber描述學識嘅能力。
  - subskill_id: permission
    explanation: Poder問句可以問行動獲唔獲准；情境確立許可解讀。
    examples:
      - text: ¿Puedo entrar?
        meaning: 我可唔可以入嚟？
        note: 講者喺門口請求許可。
  - subskill_id: obligation
    explanation: Tener que加不定式表示個人要求；hay que可以陳述一般要求。
    examples:
      - text: Tengo que salir.
        meaning: 我要走喇。
        note: Que要放喺tengo同不定式之間。
  - subskill_id: possibility
    explanation: Puede que加虛擬式分句，將事件表達成可能。
    examples:
      - text: Puede que llueva.
        meaning: 可能落雨。
        note: 呢個可能性結構用llueva接喺puede que後面。
  - subskill_id: certainty
    explanation: No estoy seguro等表達交代有幾肯定，唔一定預測事件。
    examples:
      - text: No estoy seguro.
        meaning: 我唔肯定。
        note: 男性講者對當前命題表示不確定。
