sections:
  - subskill_id: ability
    explanation: 西班牙文會分開講「識得點做」同「喺某個情況做得到」。游水、煮飯等學返嚟嘅技能，可以用 `saber` 加不定式，表示識得點做。不定式係動詞嘅字典形式，例如
      `nadar`。下面例句講講者學識咗一項技能。
    examples:
      - text: Sé nadar.
        meaning: "**拆開睇。** 呢句意思係「我識游水」。`Sé` 已經指出係我，所以可以唔寫 `yo`。`Nadar` 保持不定式。`Sé` 嘅重音符號要保留；冇重音符號嘅 `se`
          係另一個字。"
        note: |-
          **比較。** `Puedo nadar hoy` 係今日情況容許我游水。識游水，唔代表今日一定游到。否定時，喺第一個動詞前加 `no`：`No sé nadar`。

          **試吓。** 用 `cocinar` 講佢識煮飯。答案：`Ella sabe cocinar`。第一個動詞要變，活動本身保持不定式。
  - subskill_id: permission
    explanation: 做某件事要得到對方同意時，可以用 `poder` 問許可。`¿Puedo…?` 問我可唔可以做，適合喺門口、共用地方或者借嘢之前用。後面嘅動作用不定式，例如 `entrar`（進入）。
    examples:
      - text: ¿Puedo entrar?
        meaning: "**拆開睇。** 呢句係「我可以入嚟嗎？」`puedo` 問我可唔可以，`entrar` 係進入。喺門口問，對方可以批准或者拒絕。呢種問句唔使另外加一個相當於英文助動詞 “do”
          嘅字。"
        note: >-
          **轉人物。** `¿Puedes entrar?` 問你可唔可以入去，唔再係問我可唔可以。`¿Podría entrar?`
          係為自己問許可時較婉轉嘅講法；語氣同雙方關係仍然重要。


          **試吓。** 用 `usar esta silla` 問可唔可以用張凳。答案：`¿Puedo usar esta silla?` 對方可以答 `Sí,
          claro`，即係可以，當然。
  - subskill_id: obligation
    explanation: 必要性講一個人有需要或者被要求做嘅事。西班牙文常用 `tener que` 加不定式表達。下面例句講講者有需要離開；至於因為約咗人，定係就嚟閂門，就由對話語境交代。
    examples:
      - text: Tengo que salir.
        meaning: "**拆開睇。** 「我必須離開」用 `tengo` 表示我。講另一個人時，改呢個字：`Ella tiene que salir`。`Que salir`
          保持不變。句子交代需要，點解要走就由對話語境補充。"
        note: >-
          **比較。** `Hay que salir` 講有需要離開，冇指明邊個。`No tengo que salir` 通常係我唔使走，唔係禁止我走。


          **試吓。** 用 `devolver la llave` 講自己必須還鎖匙。答案：`Tengo que devolver la llave`。兩個動詞之間嘅 `que`
          唔可以漏。
  - subskill_id: possibility
    explanation: 有時你想提出一個可能結果，但唔想話一定會發生。西班牙文可以用 `puede que`，後面接呢個結構要求嘅虛擬式動詞。天氣預測係一個例子：講者話可能落雨，唔係保證一定落。
    examples:
      - text: Puede que llueva.
        meaning: "**拆開睇。** 「可能落雨」入面嘅 `llueva` 來自 `llover`。比較 `Llueve`（落緊雨）同 `Puede que
          llueva`（可能落雨）。西班牙文講天氣唔使另外加一個相當於英文 “it” 嘅主語。"
        note: >-
          **改變可能嘅情況。** 喺 `que` 後面加 `no`：`Puede que no llueva`，即係可能唔落雨，結果仍然未肯定。加 `mañana` 表示聽日：`Puede
          que llueva mañana`。


          **試吓。** 講聽日可能唔落雨。答案：`Puede que no llueva mañana`。呢個結構保留 `llueva`，唔好換成 `llueve`。
  - subskill_id: certainty
    explanation: 你可能知道一啲情況，但未夠把握確認。`No estoy seguro` 或 `No estoy segura`
      可以表達呢種唔肯定，講嘅係自己有幾大把握，唔係話件事一定唔係真。`Seguro` 或 `segura` 嘅字尾跟講者配合。
    examples:
      - text: No estoy seguro.
        meaning: "**拆開睇。** 呢句「我唔肯定」用陽性形式。用陰性配合嘅講者會講 `No estoy segura`。形容詞形容講者，唔係跟討論緊嗰樣嘢嘅文法性別。兩種講法都唔代表對方講錯。"
        note: |-
          **指出唔肯定啲乜。** `No estoy seguro de la hora` 係我對時間唔肯定。`No sé` 則係我唔知道，冇資料時可以直接咁答。

          **試吓。** 一位女性未能確認時間。一個答案係 `No estoy segura de la hora`。保留表示我嘅 `estoy`，只改形容詞字尾。
