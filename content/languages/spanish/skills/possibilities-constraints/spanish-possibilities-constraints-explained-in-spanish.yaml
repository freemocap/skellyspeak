sections:
  - subskill_id: ability
    explanation: Poder con infinitivo puede expresar capacidad. Saber con infinitivo expresa que se ha
      aprendido a hacer algo.
    examples:
      - text: Sé nadar.
        meaning: Tengo la capacidad de nadar.
        note: Saber expresa una capacidad aprendida.
  - subskill_id: permission
    explanation: Una pregunta con poder puede pedir permiso. La situación ayuda a distinguir este significado.
    examples:
      - text: ¿Puedo entrar?
        meaning: Pido permiso para entrar.
        note: En una puerta, la pregunta se interpreta como una solicitud de permiso.
  - subskill_id: obligation
    explanation: Tener que con infinitivo expresa una obligación personal. Hay que puede expresar una
      necesidad general.
    examples:
      - text: Tengo que salir.
        meaning: Es necesario que salga.
        note: Que debe aparecer entre tengo y el infinitivo.
  - subskill_id: possibility
    explanation: Puede que seguido de subjuntivo presenta una posibilidad.
    examples:
      - text: Puede que llueva.
        meaning: Es posible que llueva.
        note: Llueva va en subjuntivo después de puede que.
  - subskill_id: certainty
    explanation: No estoy seguro expresa el grado de certeza. No tiene por qué referirse a una predicción.
    examples:
      - text: No estoy seguro.
        meaning: Tengo dudas sobre lo que se está diciendo.
        note: Un hablante usa seguro para expresar incertidumbre sobre la idea en cuestión.
