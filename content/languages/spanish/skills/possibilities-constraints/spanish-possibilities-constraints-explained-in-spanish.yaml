sections:
  - subskill_id: ability
    explanation: Saber hacer una actividad y poder hacerla en una situación concreta no son lo mismo.
      Para una habilidad aprendida, como nadar, `saber` seguido de un infinitivo expresa que sabes
      cómo hacerlo. El infinitivo es la forma de diccionario del verbo, como `nadar`.
    examples:
      - text: Sé nadar.
        meaning: "`Sé` indica que quien habla tiene esa habilidad; `nadar` nombra la actividad sin cambiar
          de forma. `Yo` es opcional porque `sé` ya identifica a la persona. Conserva la tilde: `se`
          sin tilde es otra palabra."
        note: >-
          **Compara.** `Puedo nadar hoy` indica que las circunstancias te permiten nadar hoy. Puedes
          saber nadar y no poder hacerlo hoy. Para negar la habilidad, pon `no` delante: `No sé
          nadar`.


          **Prueba.** Di que ella sabe cocinar usando `cocinar`. Respuesta: `Ella sabe cocinar`.
          Cambia el primer verbo y deja la actividad en infinitivo.
  - subskill_id: permission
    explanation: Cuando necesitas que otra persona permita una acción, una pregunta con `poder` puede
      pedir permiso. `¿Puedo…?` pregunta si tú puedes hacerla. Es útil al entrar en un espacio
      compartido o antes de usar un objeto ajeno. La acción va en infinitivo, como `entrar`.
    examples:
      - text: ¿Puedo entrar?
        meaning: "`Puedo` pregunta por el permiso para quien habla y `entrar` nombra la acción. Ante una
          puerta, la otra persona puede permitir o impedir la entrada. Los signos y la entonación
          convierten la frase en pregunta."
        note: >-
          **Adáptalo.** `¿Puedes entrar?` pregunta por la otra persona, no pide permiso para ti.
          `¿Podría entrar?` hace la petición más tentativa; también importan el tono y la relación.


          **Prueba.** Pide permiso para usar una silla con `usar esta silla`. Respuesta: `¿Puedo
          usar esta silla?`. Una respuesta posible es `Sí, claro`.
  - subskill_id: obligation
    explanation: Una obligación indica algo que una persona necesita hacer o que se espera de ella.
      `Tener que` seguido de un infinitivo permite expresarla. Aquí quien habla necesita salir; la
      conversación puede explicar si es por una cita o porque el lugar cierra.
    examples:
      - text: Tengo que salir.
        meaning: "`Tengo` corresponde a quien habla; `que salir` expresa la acción necesaria. Para hablar de
          otra persona, cambia el primer verbo: `Ella tiene que salir`. La frase afirma la necesidad
          sin dar todavía su motivo."
        note: >-
          **Compara.** `Hay que salir` expresa una necesidad sin nombrar a una persona concreta. `No
          tengo que salir` normalmente significa que salir no es obligatorio, no que esté prohibido.


          **Prueba.** Di que tienes que devolver la llave con `devolver la llave`. Respuesta: `Tengo
          que devolver la llave`. Conserva `que` entre los verbos.
  - subskill_id: possibility
    explanation: A veces quieres mencionar un resultado posible sin afirmar que ocurrirá. `Puede que`
      expresa esa posibilidad. El verbo siguiente va en subjuntivo, una forma que exige esta
      construcción. Ante una previsión de lluvia, quien habla deja abierta esa posibilidad.
    examples:
      - text: Puede que llueva.
        meaning: "`Puede que llueva` presenta la lluvia como posible. `Llueva` viene de `llover`. Compara
          `Llueve`, que afirma la lluvia, con `Puede que llueva`, que no la da por segura. No hace
          falta un pronombre sujeto para este verbo del tiempo."
        note: >-
          **Adáptalo.** `Puede que no llueva` deja abierta la posibilidad de que no haya lluvia.
          Añade `mañana` para indicar el día: `Puede que llueva mañana`.


          **Prueba.** Di que quizá no llueva mañana. Respuesta: `Puede que no llueva mañana`.
          Conserva `llueva`, no lo sustituyas por `llueve` en este patrón.
  - subskill_id: certainty
    explanation: Puedes tener alguna información sin estar en condiciones de confirmarla. `No estoy
      seguro` o `No estoy segura` expresa esa falta de certeza. Describe tu confianza, no afirma que
      la otra persona esté equivocada. El adjetivo concuerda con quien habla.
    examples:
      - text: No estoy seguro.
        meaning: "`No` niega la certeza; `estoy` identifica a quien habla y `seguro` lleva concordancia
          masculina. Con concordancia femenina se dice `No estoy segura`. El adjetivo describe a la
          persona, no el género del asunto discutido."
        note: >-
          **Adáptalo.** `No estoy seguro de la hora` indica sobre qué tienes dudas. `No sé` expresa
          que no tienes la información, en lugar de valorar tu grado de confianza.


          **Prueba.** Una mujer no puede confirmar la hora. Una respuesta: `No estoy segura de la
          hora`. Conserva `estoy` y cambia la terminación del adjetivo.
