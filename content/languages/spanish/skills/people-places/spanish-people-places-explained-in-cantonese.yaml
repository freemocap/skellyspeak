sections:
  - subskill_id: identification
    explanation: Ser用嚟識別人或物；動詞同語境足以識別主語時，西班牙文可以省略主語代詞。
    examples:
      - text: Soy Ana.
        meaning: 我係Ana。
        note: Soy識別講者身份。
  - subskill_id: qualities_states
    explanation: 按想表達嘅描述揀ser或estar；兩者可以改變意思，唔能夠只用永久與否判斷。
    examples:
      - text: La puerta está abierta.
        meaning: 道門開住。
        note: Estar描述門目前嘅狀態。
  - subskill_id: location_movement
    explanation: 位置或移動動詞配合地點或路徑短語。
    examples:
      - text: El libro está en la mesa.
        meaning: 本書喺張枱上面。
        note: Estar en交代本書相對張枱嘅位置。
  - subskill_id: possession_relations
    explanation: 所有詞同de可以表達擁有或關係；所有詞配合被擁有名詞，唔係物主。
    examples:
      - text: Es el libro de mi hermana.
        meaning: 本書係我姊妹嘅。
        note: De指出同本書嘅關係。
  - subskill_id: quantity_comparison
    explanation: 數詞同數量詞交代數量；más ... que同menos ... que比較性質或數量。
    examples:
      - text: Esta caja es más grande que esa.
        meaning: 呢個箱比嗰個大。
        note: Más grande que提供比較同基準。
