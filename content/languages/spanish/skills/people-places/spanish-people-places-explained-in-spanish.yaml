sections:
  - subskill_id: identification
    explanation: Usa ser para identificar. Puedes omitir el pronombre sujeto si el verbo y el contexto
      permiten identificarlo.
    examples:
      - text: Soy Ana.
        meaning: La persona que habla se llama Ana.
        note: Soy identifica a la hablante.
  - subskill_id: qualities_states
    explanation: Elige ser o estar según el significado. La diferencia no se reduce a lo permanente
      frente a lo temporal.
    examples:
      - text: La puerta está abierta.
        meaning: La puerta no está cerrada.
        note: Estar describe el estado actual de la puerta.
  - subskill_id: location_movement
    explanation: Combina un verbo de ubicación o movimiento con una expresión de lugar o recorrido.
    examples:
      - text: El libro está en la mesa.
        meaning: El libro se encuentra sobre la mesa.
        note: Estar en sitúa el libro con respecto a la mesa.
  - subskill_id: possession_relations
    explanation: Los posesivos y de expresan pertenencia o relaciones. El posesivo concuerda con lo
      poseído, no con quien lo posee.
    examples:
      - text: Es el libro de mi hermana.
        meaning: El libro pertenece a mi hermana.
        note: De indica a quién pertenece el libro.
  - subskill_id: quantity_comparison
    explanation: Usa números y expresiones de cantidad; más ... que y menos ... que comparan cualidades
      o cantidades.
    examples:
      - text: Esta caja es más grande que esa.
        meaning: Esta caja tiene mayor tamaño que la otra.
        note: Más grande que expresa la comparación y su punto de referencia.
