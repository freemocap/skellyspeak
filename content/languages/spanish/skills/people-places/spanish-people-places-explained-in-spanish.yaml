sections:
  - subskill_id: identification
    explanation: "Al conocer a alguien, una presentación breve permite decir quién eres. Para expresar
      identidad se usa `ser`: `soy` corresponde a la persona que habla. El verbo ya indica esa
      persona, así que no hace falta añadir `yo`."
    examples:
      - text: Soy Ana.
        meaning: "`Soy Ana` presenta a la persona que habla. `Soy` indica quién se presenta y `Ana` da su
          nombre. En esta presentación no se pone artículo delante del nombre."
        note: >-
          **Adáptalo.** `Soy Luis` presenta a Luis; `Ella es Ana` identifica a otra persona. Con
          `ella`, cambia `soy` por `es`. `Estoy Ana` no expresa esta identidad.


          **Prueba.** Preséntate con el nombre Marta. Respuesta: `Soy Marta`. Conserva `soy` y
          cambia el nombre.
  - subskill_id: qualities_states
    explanation: Antes de entrar en una habitación, puede ser útil decir si la puerta está abierta.
      `Estar` describe el estado en que la encuentras. `Ser` y `estar` permiten descripciones
      distintas; preguntar solamente si algo es permanente no basta para elegir.
    examples:
      - text: La puerta está abierta.
        meaning: "`La puerta` nombra el objeto, `está` presenta su estado y `abierta` dice cuál es. La
          terminación de `abierta` concuerda con el nombre femenino singular `puerta`."
        note: >-
          **Adáptalo.** `Las puertas están abiertas` habla de varias puertas: cambian el verbo y el
          adjetivo. `La puerta es grande` describe una cualidad, su tamaño.


          **Prueba.** Di que la puerta está cerrada usando `cerrada`. Respuesta: `La puerta está
          cerrada`. Cambia el estado y conserva el sujeto y el verbo.
  - subskill_id: location_movement
    explanation: Cuando alguien busca un libro, indicar su ubicación le ayuda a encontrarlo. `Estar`
      sitúa a una persona o un objeto y una expresión de lugar completa la información. Aquí el
      libro se encuentra sobre una mesa.
    examples:
      - text: El libro está en la mesa.
        meaning: "`El libro` identifica el objeto, `está` lo sitúa y `en la mesa` indica el lugar. `En`
          puede señalar el interior o la superficie; la relación entre los objetos aclara el
          sentido."
        note: >-
          **Compara.** `Voy a la mesa` expresa movimiento hacia la mesa. `El libro está aquí`
          sustituye toda la expresión de lugar por `aquí`.


          **Prueba.** Sitúa el libro dentro de una mochila usando `la mochila`. Respuesta: `El libro
          está en la mochila`. Para esta ubicación usa `en`, no la `a` de dirección.
  - subskill_id: possession_relations
    explanation: "Si dos personas tienen libros parecidos, nombrar al propietario ayuda a distinguirlos.
      Se puede poner `de` después del objeto y luego nombrar a su dueño. Un posesivo como `mi`
      también identifica una relación: aquí indica de quién es hermana."
    examples:
      - text: Es el libro de mi hermana.
        meaning: "`Es` identifica el libro del que se habla y `el libro` nombra el objeto. `De mi hermana`
          indica que pertenece a mi hermana. `Mi` relaciona a la hermana con quien habla; no
          describe el libro."
        note: >-
          **Adáptalo.** `Es mi libro` dice que el libro es mío. `Son mis libros` habla de varios
          libros: `mis` concuerda con los libros, no con el número de propietarios. Aquí no se usa
          un apóstrofo posesivo.


          **Prueba.** Di que es el libro de tu hermano, hablando desde tu perspectiva con `mi
          hermano`. Respuesta: `Es el libro de mi hermano`. Conserva `de` delante del propietario.
  - subskill_id: quantity_comparison
    explanation: Para elegir una caja, puede ser útil compararla con otra. Se coloca `más` delante de la
      cualidad y `que` delante del término de comparación. Esta frase compara tamaños, no el número
      de cajas.
    examples:
      - text: Esta caja es más grande que esa.
        meaning: "`Esta caja` señala la caja cercana; `es más grande` dice que tiene mayor tamaño. `Que esa`
          señala la otra sin repetir `caja`. `Esta` y `esa` concuerdan con el nombre femenino."
        note: >-
          **Adáptalo.** `Esta caja es menos grande que esa` invierte la comparación. `Tengo más
          cajas` habla de una cantidad mayor de cajas. Conserva `que` cuando nombras con qué
          comparas.


          **Prueba.** Compara dos libros con `este libro` y `ese`. Respuesta: `Este libro es más
          grande que ese`. Los demostrativos pasan al masculino porque `libro` es masculino.
