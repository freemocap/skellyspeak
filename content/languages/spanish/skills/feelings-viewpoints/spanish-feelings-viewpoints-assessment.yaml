language: spanish
guidance: "Spanish expresses desire with querer + infinitive for one's own action, preferences with
  preferir or gustar constructions, emotion with forms such as estar contento, and opinions with
  creo que or evaluative wording. In gustar constructions, the liked item controls agreement: me
  gusta el café; me gustan los libros. Estoy de acuerdo and no estoy de acuerdo respond to a
  position. Count a correct function, not every assertion as an opinion. A request framed with
  quiero is still an action request when context makes that its purpose."
