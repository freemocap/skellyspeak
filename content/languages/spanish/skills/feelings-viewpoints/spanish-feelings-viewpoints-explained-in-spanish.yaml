sections:
  - subskill_id: wants_intentions
    explanation: Después de un día ocupado, quizá quieras descansar en vez de hacer otra actividad.
      `Querer` seguido de un infinitivo expresa lo que deseas hacer tú. Describe un deseo; la frase
      por sí sola no promete que lo cumplirás.
    examples:
      - text: Quiero descansar.
        meaning: "`Quiero` expresa el deseo de quien habla y `descansar` nombra la actividad. Solo el primer
          verbo cambia según la persona; la actividad conserva el infinitivo."
        note: >-
          **Adáptalo.** `Ella quiere descansar` describe su deseo. `Voy a descansar` presenta el
          descanso como un plan. No conjugues los dos verbos como `quiero descanso`.


          **Prueba.** Di que quieres comer usando `comer`. Respuesta: `Quiero comer`. Conserva
          `quiero` y cambia el infinitivo.
  - subskill_id: preferences
    explanation: Hablar de los libros que disfrutas permite explicar tus gustos. Con `gustar`, la frase
      se organiza alrededor de lo que resulta agradable y un pronombre indica a quién le gusta. El
      verbo concuerda con aquello que gusta.
    examples:
      - text: Me gustan estos libros.
        meaning: "`Me` señala a la persona que disfruta de los libros: quien habla. `Gustan` está en plural
          porque `estos libros` es plural. Los libros son el sujeto gramatical de esta
          construcción."
        note: >-
          **Adáptalo.** `Me gusta este libro` habla de un libro, con verbo singular. `Me gusta leer`
          expresa gusto por una actividad en infinitivo y también lleva `gusta`.


          **Prueba.** Di que te gustan estas películas con `estas películas`. Respuesta: `Me gustan
          estas películas`. Haz concordar `gustan` con las películas, no con `me`.
  - subskill_id: emotions
    explanation: Si una amistad pregunta cómo te sientes, un adjetivo con `estar` permite nombrar tu
      estado emocional. El adjetivo concuerda con la persona que siente esa emoción. Aquí quien
      habla se siente contenta.
    examples:
      - text: Estoy contenta.
        meaning: "`Estoy` presenta el estado de quien habla. `Contenta` es femenino singular; con
          concordancia masculina se dice `contento`. La terminación describe a la persona, no la
          causa de su alegría."
        note: >-
          **Compara.** `Estoy triste` expresa tristeza; `triste` no cambia entre masculino y
          femenino. `Soy una persona alegre` describe una manera de ser, no solo una emoción del
          momento.


          **Prueba.** Expresa alegría con concordancia masculina. Respuesta: `Estoy contento`.
          Cambia la terminación del adjetivo y conserva `estoy`.
  - subskill_id: opinions
    explanation: Al hablar de un plan, puedes dar tu valoración sin atribuírsela a todo el mundo. `Creo
      que` introduce lo que piensas. La oración que sigue expresa la opinión, por ejemplo si la idea
      propuesta te parece buena.
    examples:
      - text: Creo que es una buena idea.
        meaning: "`Creo` indica tu opinión, `que` la conecta con su contenido y `es una buena idea` valora
          la propuesta. `Buena` concuerda con el nombre femenino `idea`."
        note: >-
          **Adáptalo.** `Creo que es una mala idea` cambia la valoración. Para expresar que no lo
          crees y expresar esa duda, puedes decir `No creo que sea una buena idea`. Para este
          sentido de duda, usa el subjuntivo `sea` en lugar de `es`.


          **Prueba.** Di que crees que es útil usando `útil`. Respuesta: `Creo que es útil`.
          Conserva `que` para unir las dos partes.
  - subskill_id: agreement_disagreement
    explanation: Dos personas pueden entender una propuesta y tener opiniones distintas. `Estar de
      acuerdo` expresa coincidencia de opiniones; `no` delante del verbo expresa desacuerdo. La
      frase responde a la opinión que se está comentando.
    examples:
      - text: No estoy de acuerdo.
        meaning: "`No` niega `estoy`, que identifica a quien habla. `De acuerdo` es la expresión de
          coincidencia. La frase muestra una posición distinta sin explicar todavía el motivo."
        note: >-
          **Adáptalo.** `Estoy de acuerdo contigo` expresa coincidencia contigo. `No estoy de
          acuerdo con el plan` identifica la propuesta que rechazas. Conserva `de` en la expresión y
          usa `con` para introducir la persona o propuesta.


          **Prueba.** Expresa acuerdo con `el plan`. Respuesta: `Estoy de acuerdo con el plan`.
          Quita `no` y añade con qué estás de acuerdo.
