sections:
  - subskill_id: wants_intentions
    explanation: 忙完一日，你可能想休息，唔想再做其他活動。`Querer` 後面加不定式，表達自己想做乜。呢句講願望，單憑佢唔代表承諾一定會做。
    examples:
      - text: Quiero descansar.
        meaning: 意思係「我想休息」。`Quiero` 表達講者嘅願望，`descansar` 指休息。只有第一個動詞跟人物變位；活動保持不定式。
        note: >-
          **改一改。** `Ella quiere descansar` 講佢想休息。`Voy a descansar` 就將休息講成計劃。唔好將兩個動詞都變位成 `quiero
          descanso`。


          **試吓。** 用 `comer` 講想食嘢。答案：`Quiero comer`。保留表示自己嘅 `quiero`，換不定式。
  - subskill_id: preferences
    explanation: 講鍾意邊啲書，可以畀對方了解你嘅喜好。西班牙文用 `gustar` 時，以令人喜歡嘅事物組織句子，再用代詞指出邊個鍾意。動詞跟被喜歡嘅事物配合。
    examples:
      - text: Me gustan estos libros.
        meaning: 意思係「我鍾意呢啲書」。`Me` 指鍾意佢哋嘅人係我。`Gustan` 用複數，因為 `estos libros` 呢啲書係複數。書先係呢個句式嘅文法主語。
        note: >-
          **改一改。** `Me gusta este libro` 講一本書，所以動詞用單數。`Me gusta leer` 講鍾意閱讀，不定式活動亦用單數 `gusta`。


          **試吓。** 用 `estas películas` 講鍾意呢啲電影。答案：`Me gustan estas películas`。`Gustan` 配合複數電影，唔係配合
          `me`。
  - subskill_id: emotions
    explanation: 朋友問你心情點時，可以用 `estar` 加形容詞講情緒狀態。形容詞配合有嗰種感受嘅人。呢度講者覺得開心或者滿意。
    examples:
      - text: Estoy contenta.
        meaning: 意思係「我好開心」。`Estoy` 指講者嘅狀態。`Contenta` 係陰性單數形容詞；用陽性配合嘅講者會講 `contento`。詞尾配合講者，唔係令佢開心嗰件事。
        note: |-
          **比較。** `Estoy triste` 係唔開心；`triste` 嘅陽性同陰性形式一樣。`Soy una persona alegre` 描述開朗性格，唔只係當刻心情。

          **試吓。** 用陽性配合講自己開心。答案：`Estoy contento`。換形容詞詞尾，保留 `estoy`。
  - subskill_id: opinions
    explanation: 討論計劃時，可以講自己點睇，唔需要當成所有人嘅意見。`Creo que` 引出你嘅想法，後面嘅分句講具體判斷，例如個主意好唔好。
    examples:
      - text: Creo que es una buena idea.
        meaning: 意思係「我覺得係個好主意」。`Creo` 係我覺得，`que` 連接意見內容，`es una buena idea` 評價個提議。`Buena` 配合陰性名詞 `idea`。
        note: >-
          **改一改。** `Creo que es una mala idea` 換成負面評價。想表達唔相信而有疑慮，可以講 `No creo que sea una buena idea`。
          呢度表達疑慮，用虛擬式 `sea`，而唔係 `es`。


          **試吓。** 用 `útil` 講你覺得有用。答案：`Creo que es útil`。保留 `que` 連接意見內容。
  - subskill_id: agreement_disagreement
    explanation: 兩個人可以都明白個提議，但意見唔同。`Estar de acuerdo` 表達同意；喺動詞前面加 `no` 就表達唔同意。呢句回應緊大家討論嗰個看法。
    examples:
      - text: No estoy de acuerdo.
        meaning: 意思係「我唔同意」。`No` 否定 `estoy`，而 `estoy` 指講者。`De acuerdo` 係同意嘅慣用表達。呢句指出立場唔同，但未講原因。
        note: >-
          **改一改。** `Estoy de acuerdo contigo` 係我同意你。`No estoy de acuerdo con el plan`
          指出唔同意個計劃。保留表達入面嘅 `de`，用 `con` 引出人或者提議。


          **試吓。** 用 `el plan` 講同意個計劃。答案：`Estoy de acuerdo con el plan`。刪走 `no`，加上同意嘅對象。
