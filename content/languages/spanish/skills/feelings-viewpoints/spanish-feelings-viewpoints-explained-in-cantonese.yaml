sections:
  - subskill_id: wants_intentions
    explanation: Querer後接不定式，可以表達主語想做乜。
    examples:
      - text: Quiero descansar.
        meaning: 我想休息。
        note: 想嘅人，同預計休息嘅人係同一個。
  - subskill_id: preferences
    explanation: Preferir陳述偏好；gustar就以被喜歡嘅事物做文法主語。
    examples:
      - text: Me gustan estos libros.
        meaning: 我鍾意呢啲書。
        note: Gustan配合複數libros。
  - subskill_id: emotions
    explanation: 用合適表達講出感受。配合estar嘅形容詞，要同描述緊嘅人配合。
    examples:
      - text: Estoy contenta.
        meaning: 我好開心。
        note: 女性講者描述自己嘅情緒狀態。
  - subskill_id: opinions
    explanation: Creo que引出對命題嘅個人看法；亦可以直接用評價表達意見。
    examples:
      - text: Creo que es una buena idea.
        meaning: 我覺得係個好主意。
        note: 講者將評價表達成自己嘅觀點。
  - subskill_id: agreement_disagreement
    explanation: 對已知立場表示同意、反對，或者加上保留條件。
    examples:
      - text: No estoy de acuerdo.
        meaning: 我唔同意。
        note: 要知道反對乜嘢，就要睇前面嘅立場。
