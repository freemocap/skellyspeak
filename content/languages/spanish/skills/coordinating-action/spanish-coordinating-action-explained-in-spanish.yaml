skill_id: coordinating_action
language: spanish
explanation_language: spanish
shared_explanation: skills/coordinating-action/coordinating-action-explained-in-spanish.yaml
sections:
  - subskill_id: requests
    explanation: Si hace frío en una habitación, puedes pedir a otra persona que cierre la puerta. Una
      pregunta con `poder` es una manera habitual de pedir una acción. En esta situación buscas que
      haga algo, no comprobar su capacidad física.
    examples:
      - text: ¿Puedes cerrar la puerta, por favor?
        meaning: "`Puedes` se dirige a una persona con trato de tú, `cerrar` nombra la acción y `la puerta`
          su objeto. `Por favor` añade cortesía. Después de `puedes`, la acción queda en
          infinitivo."
        note: >-
          **Adáptalo.** `¿Puede cerrar la puerta, por favor?` usa el trato de usted. `¿Puedes abrir
          la puerta?` pide la acción contraria. La cortesía también depende del tono y de la
          situación.


          **Prueba.** Pide con trato de tú que abran la ventana usando `abrir la ventana`.
          Respuesta: `¿Puedes abrir la ventana, por favor?`. Mantén la acción en infinitivo.
  - subskill_id: offers_invitations
    explanation: Invitar a alguien a cenar le ofrece la posibilidad de acompañarte. Una pregunta con
      `querer` permite saber si desea participar. La situación convierte la pregunta en una
      invitación, que la otra persona puede aceptar o rechazar.
    examples:
      - text: ¿Quieres venir a cenar?
        meaning: "`Quieres` pregunta por el deseo de la persona a quien hablas, `venir` indica que se
          acerque y `a cenar` expresa para qué: compartir la cena. La pregunta usa el trato de tú."
        note: >-
          **Adáptalo.** `¿Quieres venir a comer?` invita a una comida con `comer`. `¿Quieres cenar?`
          pregunta si quiere cenar, sin decir expresamente que venga a un lugar.


          **Prueba.** Invita a alguien a venir a dar un paseo usando `pasear`. Respuesta: `¿Quieres
          venir a pasear?`. Conserva `venir a` y cambia la actividad.
  - subskill_id: suggestions
    explanation: Al organizar una salida, puedes proponer una opción para que los demás la consideren.
      `Podemos` seguido de una actividad permite sugerir algo que haríais juntos. Presenta una
      posibilidad, no una orden ni un acuerdo cerrado.
    examples:
      - text: Podemos ir mañana.
        meaning: "`Podemos` incluye a quien habla en el grupo; `ir` nombra la acción y `mañana` indica el
          día. En una conversación sobre planes, propone mañana como una opción."
        note: >-
          **Compara.** `Tenemos que ir mañana` añade una obligación. `Podemos ir hoy` mantiene la
          sugerencia y cambia el día.


          **Prueba.** Propón comer aquí con `comer aquí`. Respuesta: `Podemos comer aquí`. Cambia la
          actividad después de `podemos` y mantenla en infinitivo.
  - subskill_id: commitments
    explanation: Cuando alguien necesita contar contigo, una promesa explícita aclara tu
      responsabilidad. Hablar del futuro puede limitarse a describir un plan; `prometo` indica que
      te comprometes a cumplirlo.
    examples:
      - text: Te prometo que voy a llamarte.
        meaning: "`Te` señala a quien recibe la promesa. `Prometo que` introduce lo prometido; `voy a
          llamarte` dice que vas a llamar a esa persona. El `te` unido a `llamarte` identifica a
          quien recibe la llamada."
        note: >-
          **Adáptalo.** `Voy a llamarte` expresa un plan sin una promesa explícita. También puedes
          decir `Te voy a llamar`: el pronombre puede ir delante del verbo conjugado.


          **Prueba.** Promete llamar mañana. Respuesta: `Te prometo que voy a llamarte mañana`.
          Añade el día sin cambiar quién promete ni a quién llama.
  - subskill_id: accepting_declining
    explanation: Una invitación no exige una respuesta larga. Si no puedes participar, una disculpa
      breve seguida de una negativa aclara tu respuesta sin dar detalles privados. La invitación
      aporta la actividad que no repites.
    examples:
      - text: Lo siento, no puedo.
        meaning: "`Lo siento` es una disculpa habitual; `no puedo` indica que no puedes realizar la
          actividad propuesta. Después de una invitación a cenar, se entiende que no puedes asistir
          a esa cena."
        note: >-
          **Compara.** `Sí, gracias` acepta la invitación. `No quiero` expresa falta de deseo, que
          no es lo mismo que no poder. `No puedo ir` hace explícita la acción.


          **Prueba.** Rechaza una invitación diciendo que hoy no puedes ir. Respuesta: `Lo siento,
          hoy no puedo ir`. `Hoy` indica el día e `ir` nombra la acción.
  - subskill_id: negotiating_plans
    explanation: Si la hora propuesta no te viene bien, ofrecer otra ayuda a llegar a un acuerdo.
      Primero puedes explicar el obstáculo y después proponer una alternativa viable. Las dos partes
      muestran qué necesita cambiar.
    examples:
      - text: A las seis no puedo; ¿quedamos a las siete?
        meaning: "`A las seis` indica la hora que no te sirve y `no puedo` explica el problema. `¿Quedamos a
          las siete?` propone reunirse a las siete; `quedamos` incluye a las dos personas."
        note: >-
          **Adáptalo.** `¿Nos vemos a las siete?` también propone un encuentro a esa hora. `No
          puedo` por sí solo rechaza la hora sin ofrecer otra. La pregunta sigue siendo una
          propuesta hasta que la otra persona acepta.


          **Prueba.** No puedes a las siete; propone las ocho. Respuesta: `A las siete no puedo;
          ¿quedamos a las ocho?`. Pon primero la hora rechazada y luego la nueva.
