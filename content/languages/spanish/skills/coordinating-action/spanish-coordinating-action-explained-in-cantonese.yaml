sections:
  - subskill_id: requests
    explanation: 可以直接要求行動，或者用慣常嘅禮貌問句。請求入面嘅poder唔一定問身體能力。
    examples:
      - text: ¿Puedes cerrar la puerta, por favor?
        meaning: 唔該可唔可以閂門？
        note: 預期對方做嘅係閂門。
  - subskill_id: offers_invitations
    explanation: 提出幫忙，或者邀請對方參加活動。
    examples:
      - text: ¿Quieres venir a cenar?
        meaning: 你想唔想嚟食晚飯？
        note: 呢個情境下，問句係邀請參與。
  - subskill_id: suggestions
    explanation: Podemos後接不定式，可以提議一齊做嘢。
    examples:
      - text: Podemos ir mañana.
        meaning: 我哋可以聽日去。
        note: 討論安排時，呢句提出一個選項。
  - subskill_id: commitments
    explanation: 作出承諾要用承擔責任嘅措辭；單純講將來唔等於承諾。
    examples:
      - text: Te prometo que voy a llamarte.
        meaning: 我答應你，我會打電話畀你。
        note: Prometo明確表示承諾。
  - subskill_id: accepting_declining
    explanation: 簡短接受或拒絕要靠所回應嘅提議理解；可以有禮貌噉拒絕，唔使長篇解釋。
    examples:
      - text: Lo siento, no puedo.
        meaning: 唔好意思，我唔得。
        note: 邀請之後咁講，就係拒絕。
  - subskill_id: negotiating_plans
    explanation: 回應計劃時，提出可以解決障礙嘅替代方案。
    examples:
      - text: A las seis no puedo; ¿quedamos a las siete?
        meaning: 我六點唔得，七點見好唔好？
        note: 講者改時間，處理原有時間限制。
