skill_id: time_events
language: spanish
guidance: Judge the time relationship the learner actually expresses. Spanish uses present forms for
  current situations and habits; preterite for bounded past events; imperfect for past background or
  habits; and ir a + infinitive, future forms, or contextually future present forms for later
  events. Historical present can narrate past events when context supports it. Estar + gerund
  expresses an ongoing activity; ya + an appropriate completed construction can mark completion.
  Ayer fui al mercado correctly locates a completed event. Ayer yo ir al mercado is an unsuccessful
  finite past construction, not a correct past use. Ayer alone can be a correct contextual answer to
  ¿Cuándo fuiste? Missing an article elsewhere does not defeat a correctly formed temporal
  construction. Sequence does not imply cause. A hypothetical or polite past-form expression is not
  necessarily past reference.
