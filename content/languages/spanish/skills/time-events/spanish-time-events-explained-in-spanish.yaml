skill_id: time_events
language: spanish
explanation_language: spanish
shared_explanation: skills/time-events/time-events-explained-in-spanish.yaml
sections:
  - subskill_id: present_events
    explanation: Cuando alguien pregunta por tu empleo, el presente puede describir tu situación laboral
      actual. No tiene que significar que trabajas justo en este segundo. El lugar y el contexto
      aclaran la situación que quieres expresar.
    examples:
      - text: Trabajo aquí.
        meaning: "`Trabajo` es la forma de presente de `trabajar` para quien habla; `aquí` indica este
          lugar. La terminación ya identifica a la persona, así que puedes omitir `yo`. Al
          presentarte en un lugar de trabajo, describes dónde trabajas."
        note: >-
          **Adáptalo.** `Ella trabaja aquí` cambia la persona. `Estoy trabajando` destaca una
          actividad en curso. El presente simple también puede expresar acciones en marcha; el
          progresivo no es obligatorio para todas ellas.


          **Prueba.** Di que trabajas en casa. Respuesta: `Trabajo en casa`. Cambia el lugar y
          conserva `trabajo`.
  - subskill_id: past_events
    explanation: Contar una visita al mercado de ayer presenta un hecho terminado. El pretérito permite
      mostrar así la visita. Otras formas pasadas pueden presentar un hábito o un fondo; la elección
      depende de cómo cuentas el hecho.
    examples:
      - text: Ayer fui al mercado.
        meaning: "`Ayer` sitúa el hecho en el día anterior; `fui` es el pretérito de `ir` para quien habla.
          `Al mercado` indica el destino: `al` une `a` y `el`. El conjunto describe una visita
          terminada."
        note: >-
          **Compara.** `Iba al mercado todos los días` describe una rutina pasada con el imperfecto
          `iba`. `Fui` también puede ser una forma de `ser`, pero aquí el destino aclara que
          significa ir.


          **Prueba.** Di que ella fue al mercado ayer. Respuesta: `Ayer fue al mercado`. Cambia
          `fui` por `fue` y conserva el día y el destino.
  - subskill_id: future_events
    explanation: Un plan para mañana se refiere a una acción que todavía no ha ocurrido. `Ir a` seguido
      de un infinitivo es una forma habitual de expresarlo. La forma de `ir` indica quién tiene ese
      plan.
    examples:
      - text: Mañana voy a cocinar.
        meaning: "`Mañana` indica el día; `voy` identifica a quien habla y `a cocinar` da la acción
          prevista. Aquí `voy a` expresa futuro, no necesariamente un desplazamiento a otro lugar."
        note: >-
          **Adáptalo.** `Ella va a cocinar` cambia la persona; `cocinar` sigue en infinitivo.
          `Cocinaré mañana` también expresa futuro. No omitas la `a` entre `voy` y la actividad.


          **Prueba.** Di que mañana vas a estudiar usando `estudiar`. Respuesta: `Mañana voy a
          estudiar`. Conserva `voy a` y cambia la actividad.
  - subskill_id: duration_frequency
    explanation: "Puedes describir una rutina de estudio por su frecuencia o por la duración de cada
      sesión. Son preguntas distintas. `Todos los días` indica frecuencia: la actividad ocurre cada
      día, sin decir cuántos minutos dura."
    examples:
      - text: Estudio español todos los días.
        meaning: "`Estudio` identifica la actividad de quien habla; `español` nombra lo que estudia. `Todos
          los días` expresa una frecuencia diaria. El nombre de la lengua se escribe aquí con
          inicial minúscula."
        note: >-
          **Compara.** `Estudio español durante una hora` da la duración de una sesión, no su
          frecuencia. `Dos veces por semana` indica dos ocasiones semanales. Conserva `los` en
          `todos los días`.


          **Prueba.** Di que estudias español dos veces por semana. Respuesta: `Estudio español dos
          veces por semana`. Sustituye la frecuencia y conserva la actividad.
  - subskill_id: event_sequence
    explanation: Al contar una noche, ordenar los hechos ayuda a seguir el relato. `Primero` señala el
      primer paso y `después` introduce uno posterior. Indican orden sin afirmar que un hecho causó
      el otro.
    examples:
      - text: Primero cenamos y después salimos.
        meaning: En un relato de anoche, `primero cenamos` da el primer hecho y `y después salimos` añade el
          siguiente. `Cenamos` y `salimos` pueden ser formas de presente o de pretérito; el relato
          aporta la interpretación pasada.
        note: >-
          **Compara.** En un plan para esta noche, las mismas formas pueden referirse al futuro.
          Añadir `anoche` aclara que hablas del pasado. `Por eso` expresaría una consecuencia, no
          solamente un orden.


          **Prueba.** Cuenta que anoche el grupo cenó y luego salió, incluyendo a quien habla en el
          grupo. Respuesta: `Anoche primero cenamos y después salimos`. `Anoche` aclara el contexto
          pasado.
  - subskill_id: event_phase
    explanation: Si alguien te interrumpe mientras tienes un libro abierto, puedes decir que la lectura
      está en curso. `Estar` con gerundio destaca una actividad en marcha. El gerundio es la forma
      de acción usada aquí, como `leyendo`, de `leer`.
    examples:
      - text: Estoy leyendo.
        meaning: "`Estoy` identifica a quien habla y sitúa la actividad en el presente; `leyendo` da la
          acción en curso. El gerundio no cambia por género ni número. `Estamos leyendo` cambia solo
          el primer verbo para hablar del grupo."
        note: >-
          **Compara.** `Leo todos los días` describe una rutina. `Ya terminé de leer` indica que la
          lectura terminó. No pongas el infinitivo `leer` directamente después de `estoy` para este
          sentido.


          **Prueba.** Di que ella está leyendo. Respuesta: `Ella está leyendo`. Cambia `estoy` por
          `está` y conserva `leyendo`.
