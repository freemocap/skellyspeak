sections:
  - subskill_id: present_events
    explanation: 現在式可以描述目前情況或習慣；具體意思由成段對話交代。
    examples:
      - text: Trabajo aquí.
        meaning: 我喺呢度做嘢。
        note: 現在式描述講者目前工作情況。
  - subskill_id: past_events
    explanation: 按意思揀過去結構：fui可以描述完成咗嘅行程，iba可以描述過去進行中或習慣情況；短答亦可承接問題嘅時間框架。
    examples:
      - text: Ayer fui al mercado.
        meaning: 我尋日去咗街市。
        note: Fui配合ayer表示已完成嘅較早行程；無關嘅冠詞錯誤唔會改變呢個時間結構。
  - subskill_id: future_events
    explanation: Ir a加不定式可以講計劃中嘅將來行動；亦可以用將來式，或靠語境有將來意思嘅現在式。
    examples:
      - text: Mañana voy a cocinar.
        meaning: 我聽日會煮飯。
        note: Mañana同voy a cocinar確立將來指向。
  - subskill_id: duration_frequency
    explanation: 用時間短語交代做幾耐或幾密。
    examples:
      - text: Estudio español todos los días.
        meaning: 我每日學西班牙文。
        note: Todos los días交代頻率。
  - subskill_id: event_sequence
    explanation: Primero、después等連接表達排列事件，唔會自動表示因果。
    examples:
      - text: Primero cenamos y después salimos.
        meaning: 我哋先食晚飯，然後出街。
        note: 兩件事有明確先後，過去解讀由語境提供。
  - subskill_id: event_phase
    explanation: Estar配合副動詞可以描述進行中活動；完成動作要用配合時間框架嘅其他結構。
    examples:
      - text: Estoy leyendo.
        meaning: 我睇緊書。
        note: Estoy加leyendo將活動表達成進行中。
