skill_id: time_events
language: spanish
explanation_language: cantonese
shared_explanation: skills/time-events/time-events-explained-in-cantonese.yaml
sections:
  - subskill_id: present_events
    explanation: 有人問你工作時，現在式可以描述目前嘅工作情況，唔一定代表你正喺呢一秒做緊嘢。地方同對話情境幫對方明白你講邊種情況。
    examples:
      - text: Trabajo aquí.
        meaning: 意思係「我喺呢度返工」。`Trabajo` 係 `trabajar` 表示講者嘅現在式；`aquí` 係呢度。詞尾已經指出係我，所以可以唔講
          `yo`。喺工作場所介紹自己，呢句講返工地點。
        note: >-
          **改一改。** `Ella trabaja aquí` 換成佢返工。`Estoy trabajando` 強調做緊嘢。西班牙文亦可以用簡單現在式講進行中嘅動作，唔好見英文
          -ing 就自動改用進行式。


          **試吓。** 講喺屋企工作。答案：`Trabajo en casa`。換地方，保留表示自己嘅 `trabajo`。
  - subskill_id: past_events
    explanation: 講尋日去街市，可以將一次行程講成已完成事件。西班牙文用簡單過去式呈現呢種完整行程。其他過去形式可以講習慣或者背景，所以要睇你點講件事。
    examples:
      - text: Ayer fui al mercado.
        meaning: 意思係「尋日我去咗街市」。`Ayer` 指尋日；`fui` 係 `ir` 表示講者嘅簡單過去式。`Al mercado` 講目的地，`al` 由 `a` 同 `el`
          合成。成句講一次完成咗嘅行程。
        note: >-
          **比較。** `Iba al mercado todos los días` 用未完成過去式 `iba` 講以前每日去街市嘅習慣。`Fui` 亦可以係 `ser`
          嘅形式，但呢度有目的地，所以清楚係「去」。


          **試吓。** 講佢尋日去咗街市。答案：`Ayer fue al mercado`。`Fui` 改成表示佢嘅 `fue`，保留時間同目的地。
  - subskill_id: future_events
    explanation: 聽日嘅計劃係仲未發生嘅行動。`Ir a` 後面加不定式，係常見嘅表達方式。`Ir` 嘅形式指出邊個有呢個計劃。
    examples:
      - text: Mañana voy a cocinar.
        meaning: 意思係「聽日我會煮嘢食」。`Mañana` 係聽日；`voy` 指講者。`A cocinar` 提供計劃嘅活動。呢度 `voy a` 表達將來，唔代表講者要去另一個地方。
        note: >-
          **改一改。** `Ella va a cocinar` 換人物，`cocinar` 保持不定式。`Cocinaré mañana` 亦表達將來。`Voy` 同活動之間唔好漏咗
          `a`。


          **試吓。** 用 `estudiar` 講聽日會讀書。答案：`Mañana voy a estudiar`。保留 `voy a`，換活動。
  - subskill_id: duration_frequency
    explanation: 讀書習慣可以講幾密練習，亦可以講一次幾耐。兩樣回答唔同問題。`Todos los días` 講頻率：每日都有做，但冇講每次幾多分鐘。
    examples:
      - text: Estudio español todos los días.
        meaning: 意思係「我每日學西班牙文」。`Estudio` 指講者嘅活動，`español` 指學嘅語言。`Todos los días` 係每日。呢度語言名稱嘅首字母用小寫。
        note: >-
          **比較。** `Estudio español durante una hora` 講一次讀一個鐘，唔係頻率。`Dos veces por semana` 係每星期兩次。日常表達
          `todos los días` 要保留 `los`。


          **試吓。** 講每星期學西班牙文兩次。答案：`Estudio español dos veces por semana`。換頻率描述，活動唔變。
  - subskill_id: event_sequence
    explanation: 講一晚做過啲乜，按次序講會容易跟。`Primero` 指第一步，`después` 引出之後一步。佢哋講先後，唔表示前一件事導致後一件事。
    examples:
      - text: Primero cenamos y después salimos.
        meaning: 講緊尋晚時，意思係「我哋先食晚飯，之後出街」。`Primero cenamos` 講第一件事，`y después salimos` 加下一件。`Cenamos` 同
          `salimos` 可以係現在式或者簡單過去式；故事背景指出係過去。
        note: |-
          **比較。** 講今晚計劃時，同一啲形式亦可以用現在式指將來。加 `anoche` 就講明係尋晚。`Por eso` 講結果，唔只係先後。

          **試吓。** 講尋晚先食晚飯再出街。答案：`Anoche primero cenamos y después salimos`。`Anoche` 講清楚過去背景。
  - subskill_id: event_phase
    explanation: 你打開住本書時，有人打斷你，可以講閱讀正進行緊。`Estar` 加副動詞形式，強調進行中嘅活動。呢度用嘅活動形式例如由 `leer` 變成嘅 `leyendo`。
    examples:
      - text: Estoy leyendo.
        meaning: 意思係「我睇緊書」。`Estoy` 指講者，將活動放喺現在；`leyendo` 係進行中嘅閱讀。副動詞形式唔跟性別或者數量改變。`Estamos leyendo`
          換成我哋，只改第一個動詞。
        note: >-
          **比較。** `Leo todos los días` 講每日閱讀嘅習慣。`Ya terminé de leer` 講已經睇完。呢個進行中意思唔可以喺 `estoy`
          後面直接放不定式 `leer`。


          **試吓。** 講佢睇緊書。答案：`Ella está leyendo`。將 `estoy` 換成 `está`，保留 `leyendo`。
