skill_id: time_events
language: spanish
explanation_language: english
shared_explanation: skills/time-events/time-events-explained-in-english.yaml
sections:
  - subskill_id: present_events
    explanation: When someone asks about your job, the present tense can describe your current work
      situation. It does not have to mean you are working at this exact second. Place and
      conversation context help the listener understand the intended situation.
    examples:
      - text: Trabajo aquí.
        meaning: “I work here.” `Trabajo` is the speaker’s present form of `trabajar`; `aquí` means here.
          The ending already identifies I, so `yo` can be omitted. In a workplace introduction, this
          describes where you work.
        note: >-
          **Adapt it.** `Ella trabaja aquí` changes the worker to she. `Estoy trabajando` emphasizes
          work in progress. Spanish can also use the simple present for ongoing actions, so an
          English -ing form is not an automatic reason to choose the progressive.


          **Try it.** Say you work at home. Answer: `Trabajo en casa`. Replace the location, keeping
          `trabajo` for I.
  - subskill_id: past_events
    explanation: Telling someone about yesterday’s shopping trip presents an event as completed. Spanish
      uses the preterite for this view of the trip. Other past forms can present a habit or
      background instead, so the form depends on how you tell the event.
    examples:
      - text: Ayer fui al mercado.
        meaning: “Yesterday I went to the market.” `Ayer` places the event yesterday; `fui` is the speaker’s
          preterite of `ir`. `Al mercado` gives the destination, with `al` joining `a` and `el`.
          Together they describe one completed trip.
        note: >-
          **Compare.** `Iba al mercado todos los días` describes a past routine using imperfect
          `iba`. `Fui` can also be a form of `ser`, but the destination here makes the meaning went
          clear.


          **Try it.** Say she went to the market yesterday. Answer: `Ayer fue al mercado`. Change
          `fui` to `fue` for she; keep the time and destination.
  - subskill_id: future_events
    explanation: A plan for tomorrow refers to an action that has not happened yet. `Ir a` followed by
      an infinitive is a common way to express such a plan. The form of `ir` tells us whose plan it
      is.
    examples:
      - text: Mañana voy a cocinar.
        meaning: “Tomorrow I am going to cook.” `Mañana` gives tomorrow; `voy` identifies the speaker. `A
          cocinar` supplies the planned action. Here `voy a` is a future construction, not a claim
          that the speaker is travelling somewhere.
        note: >-
          **Adapt it.** `Ella va a cocinar` changes the person, while `cocinar` stays in the
          infinitive. `Cocinaré mañana` also expresses future time. Do not omit the `a` between
          `voy` and the activity.


          **Try it.** Say you are going to study tomorrow using `estudiar`. Answer: `Mañana voy a
          estudiar`. Keep `voy a` and replace the activity.
  - subskill_id: duration_frequency
    explanation: "A study routine can be described by how often you practise or how long a session
      lasts. These answer different questions. `Todos los días` gives frequency: the activity
      happens every day, without saying how many minutes it takes."
    examples:
      - text: Estudio español todos los días.
        meaning: “I study Spanish every day.” `Estudio` identifies the speaker’s activity; `español` names
          the subject studied. `Todos los días` means every day. The language name is written with a
          lowercase initial in this use.
        note: >-
          **Compare.** `Estudio español durante una hora` gives the duration of a session, not its
          frequency. `Dos veces por semana` means twice a week. Keep `los` in the everyday
          expression `todos los días`.


          **Try it.** Say you study Spanish twice a week. Answer: `Estudio español dos veces por
          semana`. Replace the frequency phrase; do not change the activity.
  - subskill_id: event_sequence
    explanation: When telling someone about an evening, putting events in order helps them follow the
      story. `Primero` names the first step and `después` introduces a later one. These expressions
      show order without saying that one event caused the other.
    examples:
      - text: Primero cenamos y después salimos.
        meaning: "In a story about last night: “First we had dinner and then we went out.” `Primero cenamos`
          gives the first event; `y después salimos` adds the next. `Cenamos` and `salimos` can be
          present or preterite forms; the surrounding story supplies the past reading."
        note: >-
          **Compare.** In a plan for tonight, the same forms can have a present form with future
          reference. Add `anoche` to make a past evening explicit. `Por eso` would express a
          consequence rather than simple sequence.


          **Try it.** Say that last night you first dined and then went out. Answer: `Anoche primero
          cenamos y después salimos`. `Anoche` makes the past context clear.
  - subskill_id: event_phase
    explanation: If someone interrupts while you have a book open, you can say the reading is in
      progress. `Estar` with a gerund focuses on an activity underway. The gerund is the action form
      used here, such as `leyendo` from `leer`.
    examples:
      - text: Estoy leyendo.
        meaning: “I am reading.” `Estoy` identifies the speaker and anchors the activity in the present;
          `leyendo` gives the ongoing action. The gerund does not change for gender or number.
          `Estamos leyendo` changes only the first verb for we.
        note: >-
          **Compare.** `Leo todos los días` describes a routine. `Ya terminé de leer` says the
          reading has finished. Do not put the infinitive `leer` directly after `estoy` for this
          ongoing meaning.


          **Try it.** Say she is reading. Answer: `Ella está leyendo`. Change `estoy` to `está` and
          keep `leyendo` unchanged.
