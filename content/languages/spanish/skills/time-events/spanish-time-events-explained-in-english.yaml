sections:
  - subskill_id: present_events
    explanation: Present-tense forms can describe current situations or habits. The surrounding exchange
      tells you which meaning applies.
    examples:
      - text: Trabajo aquí.
        meaning: I work here.
        note: The present describes the speaker's current work situation.
  - subskill_id: past_events
    explanation: Use a past construction that matches what you mean. Fui can describe a completed trip;
      iba can describe an ongoing or habitual past situation. A short answer can inherit its time
      frame from the question.
    examples:
      - text: Ayer fui al mercado.
        meaning: Yesterday I went to the market.
        note: Fui with ayer expresses a completed earlier trip; an unrelated article mistake would not
          change that temporal construction.
  - subskill_id: future_events
    explanation: Ir a followed by an infinitive is one way to talk about a planned future action. Future
      forms and contextually future present forms are also possible.
    examples:
      - text: Mañana voy a cocinar.
        meaning: Tomorrow I am going to cook.
        note: Mañana and voy a cocinar establish future reference.
  - subskill_id: duration_frequency
    explanation: Use time phrases to state how long or how often something happens.
    examples:
      - text: Estudio español todos los días.
        meaning: I study Spanish every day.
        note: Todos los días states the frequency.
  - subskill_id: event_sequence
    explanation: Primero, después and other linking expressions can place events in order without
      claiming that one caused another.
    examples:
      - text: Primero cenamos y después salimos.
        meaning: First we had dinner and then we went out.
        note: The two events have an explicit order; context supplies their past reading.
  - subskill_id: event_phase
    explanation: Estar with a gerund can describe an activity in progress. Completed actions use other
      constructions appropriate to the time frame.
    examples:
      - text: Estoy leyendo.
        meaning: I am reading.
        note: Estoy plus leyendo presents the activity as ongoing.
