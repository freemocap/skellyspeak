sections:
  - subskill_id: causes_reasons
    explanation: Porque introduce el motivo de una acción o decisión.
    examples:
      - text: Me quedo porque estoy cansada.
        meaning: El cansancio es la razón por la que me quedo.
        note: La segunda oración explica la decisión de quedarse.
  - subskill_id: consequences
    explanation: Por eso presenta una consecuencia de lo que se acaba de mencionar.
    examples:
      - text: Llueve; por eso llevo paraguas.
        meaning: Llevo paraguas debido a la lluvia.
        note: Llevar paraguas se presenta como respuesta a la lluvia.
  - subskill_id: conditions
    explanation: Si introduce una condición. En una condición abierta, puede usarse el presente de indicativo.
    examples:
      - text: Si llueve, me quedo en casa.
        meaning: Quedarme en casa depende de que llueva.
        note: La lluvia es la condición para quedarse en casa.
  - subskill_id: contrast
    explanation: Pero conecta hechos o valoraciones que contrastan.
    examples:
      - text: Es caro, pero es útil.
        meaning: Aunque cuesta mucho, tiene utilidad.
        note: La utilidad contrasta con la valoración negativa del precio.
  - subskill_id: supporting_claims
    explanation: Ofrece una razón u observación que apoye la afirmación; repetirla con más énfasis no
      aporta una prueba.
    examples:
      - text: Creo que está en casa porque la luz está encendida.
        meaning: La luz encendida me lleva a pensar que esa persona está en casa.
        note: La luz funciona como indicio para la inferencia.
