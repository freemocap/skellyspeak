sections:
  - subskill_id: causes_reasons
    explanation: Si alguien pregunta por qué te quedas, explicar el motivo permite entender tu decisión.
      `Porque` une la acción con su explicación. Aquí el cansancio explica que quien habla se quede
      en vez de salir.
    examples:
      - text: Me quedo porque estoy cansada.
        meaning: "`Me quedo` expresa que no te vas; el pronombre forma parte de `quedarse` con este sentido.
          `Porque` introduce el motivo y `estoy cansada` nombra el estado de quien habla. `Cansada`
          lleva concordancia femenina."
        note: >-
          **Compara.** `¿Por qué te quedas?` pregunta el motivo con dos palabras y tilde. En la
          respuesta, `porque` es una palabra sin tilde. Con concordancia masculina se dice
          `cansado`.


          **Prueba.** Explica que te quedas por enfermedad con `estoy enfermo`. Respuesta: `Me quedo
          porque estoy enfermo`. Pon el motivo después de `porque`.
  - subskill_id: consequences
    explanation: Una situación puede explicar la acción que tomas como respuesta. `Por eso` remite a esa
      situación e introduce su resultado. Aquí la lluvia explica por qué quien habla lleva paraguas.
    examples:
      - text: Llueve; por eso llevo paraguas.
        meaning: "`Llueve` afirma que hay lluvia; no hace falta un pronombre sujeto para el tiempo. `Por
          eso` significa por ese motivo. `Llevo paraguas` presenta la respuesta a la lluvia."
        note: >-
          **Compara.** `Llevo paraguas porque llueve` empieza por la acción y luego la explica. Con
          `por eso`, primero aparece el motivo y después el resultado. No lo uses solo para unir
          hechos sin relación.


          **Prueba.** Llueve y, por ese motivo, te quedas en casa. Respuesta: `Llueve; por eso me
          quedo en casa`. La segunda parte se explica por la lluvia.
  - subskill_id: conditions
    explanation: Algunos planes dependen de lo que ocurra. `Si` introduce la condición necesaria para
      que se aplique la otra parte de la frase. Aquí quedarse en casa es el plan en caso de lluvia;
      no se afirma que vaya a llover.
    examples:
      - text: Si llueve, me quedo en casa.
        meaning: "`Si llueve` presenta la condición con `llueve` en presente de indicativo. `Me quedo en
          casa` da el plan que depende de ella. Aunque los verbos están en presente, el contexto de
          planificación puede situarlos en el futuro."
        note: >-
          **Compara.** `Porque llueve, me quedo en casa` presenta la lluvia como un motivo real. La
          condición abierta usa `si llueve`, no `si llueva`. `Sí` con tilde afirma; el `si`
          condicional no lleva tilde.


          **Prueba.** Di que sales si no llueve. Respuesta: `Si no llueve, salgo`. `No` niega la
          condición y `salgo` presenta el plan.
  - subskill_id: contrast
    explanation: Un precio puede ser un inconveniente y la utilidad seguir siendo una ventaja. `Pero`
      une dos hechos cuya combinación contrasta con una expectativa. Aquí se equilibra una
      valoración negativa con otra positiva.
    examples:
      - text: Es caro, pero es útil.
        meaning: "`Es caro` valora el precio; `pero` introduce el contraste y `es útil` presenta la ventaja.
          Las dos descripciones se refieren al mismo objeto ya mencionado en la conversación."
        note: >-
          **Adáptalo.** `Es cara, pero es útil` describe un nombre femenino como `la herramienta`.
          `Útil` mantiene su forma; `caro` cambia a `cara`. `Y` añadiría un dato sin señalar el
          contraste.


          **Prueba.** Describe una herramienta cara pero útil. Respuesta: `La herramienta es cara,
          pero es útil`. Haz concordar `cara` con el nombre femenino.
  - subskill_id: supporting_claims
    explanation: Si no puedes ver directamente si alguien está en casa, una observación puede apoyar tu
      suposición. `Creo que` introduce la conclusión y `porque` explica en qué te basas. La
      observación la apoya sin demostrarla por completo.
    examples:
      - text: Creo que está en casa porque la luz está encendida.
        meaning: "`Creo que` señala tu creencia; `está en casa` es la conclusión sobre una persona. `Porque
          la luz está encendida` aporta la observación. `Encendida` concuerda con el nombre femenino
          `luz`."
        note: >-
          **Compara.** Repetir `Está en casa` no aporta una razón. `Sé que está en casa` afirma
          conocimiento en vez de una suposición. La luz podría quedar encendida sin nadie en casa,
          por eso la frase original admite que te equivoques.


          **Prueba.** Apoya la misma suposición con `su coche está aquí`. Respuesta: `Creo que está
          en casa porque su coche está aquí`. El coche es una observación, no una certeza.
