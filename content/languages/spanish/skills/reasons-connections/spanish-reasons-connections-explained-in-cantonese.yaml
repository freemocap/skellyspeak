sections:
  - subskill_id: causes_reasons
    explanation: Porque將事件或選擇連到原因。
    examples:
      - text: Me quedo porque estoy cansada.
        meaning: 我留低，因為我攰。
        note: 第二個分句提供留低嘅原因。
  - subskill_id: consequences
    explanation: Por eso引出前述情況嘅結果。
    examples:
      - text: Llueve; por eso llevo paraguas.
        meaning: 落緊雨，所以我帶住把遮。
        note: 帶遮係對落雨嘅應對。
  - subskill_id: conditions
    explanation: Si引出條件；尚未確定嘅條件可以用現在直陳式。
    examples:
      - text: Si llueve, me quedo en casa.
        meaning: 如果落雨，我就留喺屋企。
        note: 留家取決於落唔落雨。
  - subskill_id: contrast
    explanation: Pero可以連接互相對照嘅事實或預期。
    examples:
      - text: Es caro, pero es útil.
        meaning: 佢貴，但有用。
        note: 第二個評價同第一個作對比。
  - subskill_id: supporting_claims
    explanation: 提供支持主張嘅理由或觀察，唔係只用更強語氣重複。
    examples:
      - text: Creo que está en casa porque la luz está encendida.
        meaning: 我諗佢哋喺屋企，因為盞燈開咗。
        note: 燈光係支持推論嘅證據。
