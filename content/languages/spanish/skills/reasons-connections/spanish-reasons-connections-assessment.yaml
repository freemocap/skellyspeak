skill_id: reasons_connections
language: spanish
guidance: Spanish porque introduces a reason, por eso a consequence, si a condition, and pero an
  opposition. Ordinary open conditions can use si + present indicative with an appropriate outcome.
  Do not accept a connector alone as proof that the two clauses form its intended relation. A
  condition and a reason differ; primero ... después establishes sequence but not causation.
  Evidence such as the lights being on can support a stated inference. Check that the learner links
  recoverable propositions coherently.
