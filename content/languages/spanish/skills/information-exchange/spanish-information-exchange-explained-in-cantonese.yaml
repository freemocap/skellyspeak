sections:
  - subskill_id: asking_information
    explanation: 揀配合資料需要嘅疑問表達；語境同語調亦可以構成是非問句。
    examples:
      - text: ¿Dónde está la estación?
        meaning: 車站喺邊度？
        note: Dónde問位置。
  - subskill_id: answering_information
    explanation: 相關嘅短答可以直接提供所問資料，唔使重複動詞。
    examples:
      - text: En casa.
        meaning: 喺屋企。
        note: 呢句回答¿Dónde estás?；冇呢條問題，回答作用就未清楚。
  - subskill_id: checking_facts
    explanation: 就心目中已有嘅命題或細節尋求確認。
    examples:
      - text: ¿Llegas a las ocho?
        meaning: 你八點到？
        note: 確認安排時，呢句核實建議到達時間。
  - subskill_id: useful_detail
    explanation: 補充真正回答問題嘅資料；答得長唔一定有用。
    examples:
      - text: Está al lado del banco, frente al parque.
        meaning: 喺銀行隔籬，公園對面。
        note: 問路時，兩個地標令位置更清楚。
