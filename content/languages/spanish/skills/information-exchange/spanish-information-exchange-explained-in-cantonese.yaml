sections:
  - subskill_id: asking_information
    explanation: 資料問句要講清楚想知啲乜。西班牙文用 `dónde` 問位置、`cuándo` 問時間、`qué` 問事物或者解釋。下面例句想知車站位置。問人或者物件喺邊度時，用
      `estar` 嘅適當形式。
    examples:
      - text: ¿Dónde está la estación?
        meaning: "**拆開睇。** 「車站喺邊度？」分三部分：`dónde` 問位置，`está` 係單數動詞，`la estación` 指出要搵嘅地方。`Dónde` 同 `está`
          嘅重音符號，同埋前後問號，都要保留。"
        note: >-
          **改成複數。** `¿Dónde están las llaves?` 問啲鎖匙喺邊度。`Están` 同 `las llaves` 都係複數。回答可以只講位置：`En la
          mesa`，喺枱上。


          **試吓。** 用 `el baño` 問洗手間喺邊度。答案：`¿Dónde está el baño?` 問一個洗手間，所以用單數 `está`。
  - subskill_id: answering_information
    explanation: 有人問你喺邊度時，短短一句地方就可以提供所需資料。問題已經交代咗人物同動詞，回答可以只講地方。呢種係自然對話，唔係答漏咗。
    examples:
      - text: En casa.
        meaning: 意思係「喺屋企」。`En` 引出位置，`casa` 喺呢度係屋企。接住 `¿Dónde estás?`，呢句就回答答緊嗰個人喺邊度。日常講 `en casa` 唔加冠詞。
        note: |-
          **比較。** `En la casa de Ana` 指特定一間屋：Ana 嘅屋。地方答案唔可以回答問到達時間嘅 `¿Cuándo llegas?`。

          **試吓。** 用 `el parque` 回答 `¿Dónde estás?`。答案：`En el parque`。呢個名詞短語要保留冠詞。
  - subskill_id: checking_facts
    explanation: 你以為客人八點到，可以核實呢個時間，唔使由頭問起。西班牙文可以用語調同書面問號，將普通陳述變成係非問句。
    examples:
      - text: ¿Llegas a las ocho?
        meaning: 意思係「你八點到？」`Llegas` 係你到達，`a las ocho` 係八點。呢度用現在式講已安排嘅到達。唔使加英文問句入面嗰種額外助動詞。
        note: >-
          **比較。** `¿A qué hora llegas?` 直接問幾點到，冇提出八點。可以用 `No, a las nueve` 更正時間。一點要講 `a la
          una`，冠詞用單數。


          **試吓。** 核實係咪九點到。答案：`¿Llegas a las nueve?`。只換時間就得。
  - subskill_id: useful_detail
    explanation: 指路時，得一個地標可能仲未夠清楚。加多一個就可以縮窄位置。西班牙文可以將兩段地方描述放埋一齊，用兩個參照點指出同一個地方。
    examples:
      - text: Está al lado del banco, frente al parque.
        meaning: 意思係「喺銀行隔籬，公園對面」。`Está` 指已經講緊嗰個地方。`Al lado del banco` 係銀行隔籬，`frente al parque` 係公園對面。`Del` 由
          `de` 同 `el` 合成；`al` 由 `a` 同 `el` 合成。
        note: |-
          **改一改。** `Está al lado de la farmacia` 換成喺藥房隔籬。`De la` 唔合併；只有 `de el` 合成 `del`。揀對方搵得到嘅地標。

          **試吓。** 講喺銀行對面。答案：`Está frente al banco`。呢個表達用 `a`，同 `el` 合成 `al`。
