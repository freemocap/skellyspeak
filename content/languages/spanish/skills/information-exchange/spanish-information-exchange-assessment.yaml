language: spanish
guidance: "Spanish questions can use interrogatives such as qué, dónde and cuándo, or yes/no
  intonation. Omitted opening punctuation alone should not defeat an otherwise correct
  conversational question. Contextually appropriate fragments can answer a question: en casa can
  answer ¿Dónde estás? Check relevance against the actual question, not sentence length. ¿Llegas a
  las ocho? can check a time; ¿Qué quieres decir? repairs understanding instead. Requests phrased
  with ¿Puedes...? need not ask for information."
