sections:
  - subskill_id: asking_information
    explanation: An information question makes clear what you want to find out. Spanish uses `dónde` for
      a location, `cuándo` for a time and `qué` for a thing or an explanation. In the example, the
      missing information is the station's location. Questions about where a person or an object is
      use a form of `estar`.
    examples:
      - text: ¿Dónde está la estación?
        meaning: "**How it works.** “Where is the station?” has three parts: `dónde` asks for the location,
          `está` is the singular verb, and `la estación` identifies the place you need. Keep the
          accents in both `dónde` and `está`, as well as the opening and closing question marks."
        note: >-
          **Change the number.** `¿Dónde están las llaves?` asks where the keys are. Both `están`
          and `las llaves` are plural. An answer can simply give the location: `En la mesa`, on the
          table.


          **Try it.** Ask where the bathroom is, using `el baño`. Answer: `¿Dónde está el baño?` Use
          the singular `está` because you are asking about one bathroom.
  - subskill_id: answering_information
    explanation: When someone asks where you are, a short place phrase can give all the information they
      need. The question supplies the person and verb, so the reply can simply name the place. This
      is ordinary conversation, not an incomplete answer.
    examples:
      - text: En casa.
        meaning: “At home.” `En` introduces the location and `casa` means home here. After `¿Dónde estás?`,
          the phrase answers where the person replying is. `En casa` has no article in this everyday
          expression.
        note: >-
          **Compare.** `En la casa de Ana` names a particular house: Ana’s. A place answer would not
          answer `¿Cuándo llegas?`, which asks when you arrive.


          **Try it.** Answer `¿Dónde estás?` with the park, `el parque`. Answer: `En el parque`.
          Keep the article that belongs to this noun phrase.
  - subskill_id: checking_facts
    explanation: If you think a visitor is arriving at eight, you can check that detail rather than ask
      an entirely open question. Spanish can turn an ordinary statement into a yes-or-no question
      through intonation and written question marks.
    examples:
      - text: ¿Llegas a las ocho?
        meaning: “Are you arriving at eight?” `Llegas` means you arrive and `a las ocho` gives the time. The
          present tense refers to an arranged arrival here. There is no extra question verb
          corresponding to English “do”.
        note: >-
          **Compare.** `¿A qué hora llegas?` asks for the time without proposing eight. A useful
          correction is `No, a las nueve`. For one o’clock the expression is `a la una`, with a
          singular article.


          **Try it.** Check whether the arrival is at nine. Answer: `¿Llegas a las nueve?`. Replace
          only the time.
  - subskill_id: useful_detail
    explanation: When giving directions, one landmark may still leave someone unsure which place you
      mean. A second landmark can narrow the location down. Spanish place phrases can be combined to
      describe the same location from two useful reference points.
    examples:
      - text: Está al lado del banco, frente al parque.
        meaning: “It is beside the bank, opposite the park.” `Está` refers to the place already being
          discussed. `Al lado del banco` means beside the bank; `frente al parque` means opposite
          the park. `Del` joins `de` and `el`; `al` joins `a` and `el`.
        note: >-
          **Adapt it.** `Está al lado de la farmacia` changes the landmark to the pharmacy. `De la`
          stays separate, because only `de el` contracts to `del`. Choose landmarks the listener can
          find.


          **Try it.** Say it is opposite the bank. Answer: `Está frente al banco`. The expression
          uses `a`, which combines with `el`.
