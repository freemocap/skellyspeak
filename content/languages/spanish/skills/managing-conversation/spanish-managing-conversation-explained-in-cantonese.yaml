sections:
  - subskill_id: opening_closing
    explanation: 喺實際見面時打招呼或道別，同單純引述呢個詞唔同。
    examples:
      - text: Hasta luego.
        meaning: 遲啲見。
        note: 呢句結束一次見面；喺詞彙練習重複佢，就冇呢個作用。
  - subskill_id: acknowledging
    explanation: 表示收到對方發言，或者回應社交行為；entiendo唔一定表示同意。
    examples:
      - text: Gracias por avisarme.
        meaning: 多謝你話我知。
        note: 回應確認收到有用資料，同時多謝講者。
  - subskill_id: clarification
    explanation: 跟唔上前面內容時，請人重複或者解釋。
    examples:
      - text: ¿Qué quieres decir?
        meaning: 你係咩意思？
        note: 請對方解釋唔清楚嘅發言，唔係核實已理解嘅事實。
  - subskill_id: rephrasing
    explanation: Quiero decir引出另一種講法，表達自己原意。
    examples:
      - text: Quiero decir que llego después de las ocho.
        meaning: 我意思係我八點之後先到。
        note: 修正對話入面，呢句重述講者到達時間。
  - subskill_id: correcting_misunderstanding
    explanation: 將錯誤理解同原意作對比。
    examples:
      - text: No, me refiero al martes, no al jueves.
        meaning: 唔係，我係指星期二，唔係星期四。
        note: 講者更正對方理解嘅日子。
  - subskill_id: turns_topics
    explanation: 轉換對話方向時，用過渡語或管理發言嘅表達。
    examples:
      - text: Por cierto, ¿cómo está tu hermana?
        meaning: 係喎，你姊妹近排點呀？
        note: Por cierto標示轉去另一個話題。
