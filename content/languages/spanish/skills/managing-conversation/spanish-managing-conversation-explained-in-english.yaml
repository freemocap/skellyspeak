skill_id: managing_conversation
language: spanish
explanation_language: english
shared_explanation: skills/managing-conversation/managing-conversation-explained-in-english.yaml
sections:
  - subskill_id: opening_closing
    explanation: At the end of a friendly conversation, a farewell makes the ending clear. `Hasta luego`
      is a common way to say goodbye. It suggests seeing the person later, but ordinary use does not
      require a specific meeting time.
    examples:
      - text: Hasta luego.
        meaning: “See you later.” `Hasta` means until and `luego` means later. Together they form a
          conventional farewell; translating each word alone misses how the phrase closes a
          conversation.
        note: >-
          **Adapt it.** `Hasta mañana` says see you tomorrow, when tomorrow is relevant. `Hola`
          opens a conversation instead. A farewell does not by itself arrange the next meeting.


          **Try it.** Close a conversation before meeting again tomorrow. Answer: `Hasta mañana`.
          Replace `luego` with the intended day.
  - subskill_id: acknowledging
    explanation: If someone warns you about a change of plan, thanking them shows that you received and
      value the message. Spanish can use `gracias por` to thank someone for a particular action. The
      action after `por` takes an infinitive here.
    examples:
      - text: Gracias por avisarme.
        meaning: "“Thanks for letting me know.” `Gracias` expresses thanks; `por avisarme` gives the reason.
          `Avisar` means to notify and the attached `me` says who was notified: the speaker."
        note: >-
          **Adapt it.** `Gracias por ayudarme` thanks someone for helping you. `Entendido` simply
          acknowledges that you understood, without expressing thanks. Do not change the action to a
          conjugated verb directly after `por`.


          **Try it.** Thank someone for calling you with `llamarme`. Answer: `Gracias por llamarme`.
          The attached `me` identifies the recipient of the call.
  - subskill_id: clarification
    explanation: Sometimes you hear all the words but still do not understand what someone means. A
      clarification question asks them to explain the intended meaning. It helps repair the
      conversation before you answer on the wrong assumption.
    examples:
      - text: ¿Qué quieres decir?
        meaning: “What do you mean?” `Qué` asks what, `quieres` refers to the listener, and `decir` means
          say. The whole expression `querer decir` asks about meaning here, rather than simply
          wanting to speak.
        note: >-
          **Compare.** `¿Puedes repetirlo?` asks for repetition; that may help if you did not hear.
          `¿Qué significa esta palabra?` asks about a word’s meaning. Keep the accent in question
          word `qué`.


          **Try it.** You heard a sentence but do not understand the intended message. Ask `¿Qué
          quieres decir?`. It requests an explanation, not merely the same words again.
  - subskill_id: rephrasing
    explanation: If your first explanation was unclear, you can state the intended message more plainly.
      `Quiero decir que` introduces what you mean. The following clause should resolve the confusion
      by giving the important detail.
    examples:
      - text: Quiero decir que llego después de las ocho.
        meaning: “I mean that I arrive after eight.” `Quiero decir que` introduces the explanation; `llego`
          says I arrive. `Después de las ocho` places the arrival later than eight, rather than
          exactly at eight.
        note: >-
          **Compare.** `Llego a las ocho` fixes the arrival at eight. `Llego antes de las ocho` says
          before eight. After `después`, keep `de` before the clock time.


          **Try it.** Clarify that you arrive before nine. Answer: `Quiero decir que llego antes de
          las nueve`. Change the time phrase while keeping the explanation frame.
  - subskill_id: correcting_misunderstanding
    explanation: If someone has confused two days, a useful correction names both the intended day and
      the mistaken one. `Me refiero a` introduces what you mean. This makes the repair precise
      instead of leaving the listener to guess after a bare no.
    examples:
      - text: No, me refiero al martes, no al jueves.
        meaning: “No, I mean Tuesday, not Thursday.” `No` rejects the mistaken interpretation. `Me refiero
          al martes` identifies Tuesday as the intended day; `no al jueves` excludes Thursday. `Al`
          combines `a` with `el`.
        note: >-
          **Adapt it.** `Me refiero a Ana, no a Luis` corrects a person’s identity. The preposition
          `a` remains, but these names do not take the article used with the days.


          **Try it.** Correct Thursday to Friday. Answer: `No, me refiero al viernes, no al jueves`.
          Name the intended day first and the mistaken day second.
  - subskill_id: turns_topics
    explanation: A conversation can move to a related thought that has just occurred to you. `Por
      cierto` signals this change so the listener can follow it. Here the speaker moves from the
      previous topic to asking about the listener’s sister.
    examples:
      - text: Por cierto, ¿cómo está tu hermana?
        meaning: “By the way, how is your sister?” `Por cierto` introduces the side topic; `cómo está` asks
          about her condition. `Tu hermana` names the person. `Cómo` has a question accent, while
          possessive `tu` has none.
        note: >-
          **Compare.** `¿Dónde está tu hermana?` asks where she is, rather than how she is. `Por
          cierto` signals a new point; it is not a word for the reason something happened.


          **Try it.** Bring up the listener’s brother with `tu hermano`. Answer: `Por cierto, ¿cómo
          está tu hermano?`. Replace the person while keeping the topic signal and question.
