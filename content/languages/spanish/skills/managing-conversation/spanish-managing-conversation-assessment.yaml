skill_id: managing_conversation
language: spanish
guidance: Spanish interaction can open with hola and close with hasta luego, acknowledge with
  entiendo, thank with gracias, and apologize with perdón or lo siento in an appropriate sequence.
  ¿Qué quieres decir? and ¿Puedes repetirlo? request repair when linked to an unclear prior
  contribution. Quiero decir... reformulates; no, me refiero a... corrects an interpretation. Por
  cierto can introduce a topic. Require the social or repair context, not just a memorized phrase or
  the fact that a message was sent.
