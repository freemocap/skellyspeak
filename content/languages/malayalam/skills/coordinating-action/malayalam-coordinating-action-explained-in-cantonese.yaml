skill_id: coordinating_action
explanation_language: cantonese
shared_explanation: skills/coordinating-action/coordinating-action-explained-in-cantonese.yaml
sections:
  - subskill_id: requests
    explanation: 問句入面嘅受益複合動詞，可以有禮貌噉請對方幫自己做嘢。
    examples:
      - text: ഈ പെട്ടി വാതിലിനടുത്തേക്ക് മാറ്റിത്തരാമോ?
        meaning: 可唔可以幫我搬呢個箱去門邊？
        note: 目的地明確，做動作嘅人由語境理解為聽者。
  - subskill_id: offers_invitations
    explanation: 第一人稱問句配合ട്ടെ，可以主動提出幫忙。
    examples:
      - text: ഞാൻ ബാഗ് എടുത്തുതരട്ടെ?
        meaning: 要唔要我幫你拎起個袋？
        note: 講者自願幫忙，唔係指示聽者去做。
  - subskill_id: suggestions
    explanation: നമുക്ക്配合ആം形式，可以提議一齊行動。
    examples:
      - text: നമുക്ക് ഒരു ചെറിയ ഇടവേള എടുക്കാം.
        meaning: 不如我哋抖一陣。
        note: നമുക്ക്將聽者包括喺建議行動內。
  - subskill_id: commitments
    explanation: 適當分工語境下，ആം形式可以承擔工作。
    examples:
      - text: നാളെ ഞാൻ ഉപകരണങ്ങൾ കൊണ്ടുവരാം.
        meaning: 聽日我會帶工具嚟。
        note: 分工時用，講者負責帶工具。
  - subskill_id: accepting_declining
    explanation: 講自己做唔到，可以婉拒之前嘅邀請。
    examples:
      - text: ക്ഷമിക്കണം, ഇന്ന് എനിക്ക് വരാൻ കഴിയില്ല.
        meaning: 唔好意思，我今日嚟唔到。
        note: 之前嘅邀請交代咗拒絕邊個活動。
  - subskill_id: negotiating_plans
    explanation: 先講限制，再提議另一個時間。
    examples:
      - text: വെള്ളിയാഴ്ച എനിക്ക് തിരക്കാണ്. ശനിയാഴ്ച കാണാമോ?
        meaning: 我星期五唔得閒。可唔可以星期六見？
        note: 問句提供具體替代日子。
