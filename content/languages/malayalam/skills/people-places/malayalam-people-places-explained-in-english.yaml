skill_id: people_places
explanation_language: english
shared_explanation: skills/people-places/people-places-explained-in-english.yaml
sections:
  - subskill_id: identification
    explanation: When showing someone a house, you can identify it as yours. `ഇത്` points to this one
      and `എന്റെ` gives the relationship to you. The identifying noun joins to `ആണ്` at the end.
    examples:
      - text: ഇത് എന്റെ വീടാണ്.
        meaning: "**The example.** This is my house. `വീട്` means house, and `വീടാണ്` is its joined form
          with `ആണ്`, is. `എന്റെ വീട്` means my house, with the possessor before the noun. The whole
          identifying phrase follows `ഇത്`."
        note: "Try pointing to that house instead. Answer: `അത് എന്റെ വീടാണ്.` Replace `ഇത്` with `അത്`,
          that. `എനിക്ക് വീടുണ്ട്` instead says you have a house; it uses the possession frame
          rather than identifying the house in front of you."
  - subskill_id: qualities_states
    explanation: Before choosing a route for a large load, you need to know whether the path is narrow.
      `ഈ വഴി` names this path. The descriptive expression ends in a nominal form joined to `ആണ്`.
    examples:
      - text: ഈ വഴി ഇടുങ്ങിയതാണ്.
        meaning: "**The example.** This path is narrow. `ഈ` is this, `വഴി` is path or way, and `ഇടുങ്ങിയ`
          describes narrowness. `ഇടുങ്ങിയതാണ്` packages that description as a predicate, combining
          the nominalized form with `ആണ്`. It is not an English adjective with gender agreement."
        note: "Try describing that path rather than this one. Answer: `ആ വഴി ഇടുങ്ങിയതാണ്.` Replace `ഈ` with
          `ആ`, that before a noun. Keep the whole predicate. `ഇടുങ്ങിയ വഴി` instead means a narrow
          path, with the description before the noun rather than a complete statement about it."
  - subskill_id: location_movement
    explanation: When someone is looking for a key, a table provides a recognizable location. The place
      expression precedes the existence or location predicate `ഉണ്ട്`; its joined spelling is part
      of the written phrase.
    examples:
      - text: താക്കോൽ മേശപ്പുറത്തുണ്ട്.
        meaning: "**The example.** The key is on the table. `താക്കോൽ` is key and `മേശ` is table.
          `മേശപ്പുറത്ത്` means on the table, and `മേശപ്പുറത്തുണ്ട്` joins that location to `ഉണ്ട്`,
          is there. The sentence locates the key rather than directing its movement."
        note: "Try locating a bag on the table. Answer: `ബാഗ് മേശപ്പുറത്തുണ്ട്.` Replace the object with
          `ബാഗ്`. `മേശപ്പുറത്ത്` alone can answer a question about where the key is; it need not
          repeat the already known object."
  - subskill_id: possession_relations
    explanation: When arranging seats, saying you have two chairs tells the group what is available.
      `എനിക്ക്` introduces you as the possessor, and the things possessed come before final `ഉണ്ട്`.
    examples:
      - text: എനിക്ക് രണ്ട് കസേരകളുണ്ട്.
        meaning: "**The example.** I have two chairs. `രണ്ട്` is two, and `കസേരകൾ` is chairs, with the
          plural ending on `കസേര`. `കസേരകളുണ്ട്` joins that plural form to `ഉണ്ട്`. The construction
          expresses possession without a separate verb directly matching English have."
        note: "Try saying you have three chairs. Answer: `എനിക്ക് മൂന്ന് കസേരകളുണ്ട്.` Replace `രണ്ട്` with
          `മൂന്ന്`. `എന്റെ കസേരകൾ` means my chairs inside a noun phrase; it does not itself make the
          possession statement expressed with `എനിക്ക്` and `ഉണ്ട്`."
  - subskill_id: quantity_comparison
    explanation: Two boxes need carrying, and their weights differ. This comparison describes one box as
      having less weight than the other. The reference box is introduced with a than-expression
      before the measured property.
    examples:
      - text: ഈ പെട്ടിക്ക് അതിനെക്കാൾ ഭാരം കുറവാണ്.
        meaning: "**The example.** This box is lighter than that one. `ഈ പെട്ടിക്ക്` is for this box,
          `അതിനെക്കാൾ` is than that one, and `ഭാരം` is weight. `കുറവാണ്` says is less. The phrase
          compares the boxes through lower weight rather than an English-style lighter ending."
        note: "Try comparing the other way round. Answer: `ആ പെട്ടിക്ക് ഇതിനെക്കാൾ ഭാരം കുറവാണ്.` `ആ
          പെട്ടിക്ക്` selects that box and `ഇതിനെക്കാൾ` compares it with this one. Switching both
          references reverses the comparison; changing only one could make the box compared with
          itself."
