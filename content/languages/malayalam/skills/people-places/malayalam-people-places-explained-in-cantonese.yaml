sections:
  - subskill_id: identification
    explanation: 你帶人睇間屋，指出呢間係你嘅。`ഇത്` 指呢個，`എന്റെ` 標你嘅關係；`വീടാണ്` 將「屋」同「係」接埋，成句用嚟識別眼前嘅屋。
    examples:
      - text: ഇത് എന്റെ വീടാണ്.
        meaning: 呢間係我屋企。`വീട്` 係屋，接 `ആണ്` 成 `വീടാണ്`；`എന്റെ` 放喺名詞前，表示我嘅屋。
        note: 試指嗰間屋係你嘅。答案：`അത് എന്റെ വീടാണ്.` 將 `ഇത്` 換成 `അത്`；`എനിക്ക് വീടുണ്ട്` 係講你有屋，唔係識別眼前嗰間。
  - subskill_id: qualities_states
    explanation: 運大件物品之前，你要講條路窄唔窄。`ഈ വഴി` 係呢條路；`ഇടുങ്ങിയതാണ്` 將窄嘅描述變成完整述語，唔需要照英文加性別一致形式。
    examples:
      - text: ഈ വഴി ഇടുങ്ങിയതാണ്.
        meaning: 呢條路好窄。`ഈ` 係呢，`വഴി` 係路；`ഇടുങ്ങിയ` 描述窄，`ഇടുങ്ങിയതാണ്` 將描述同 `ആണ്` 接埋作陳述。
        note: 試講嗰條路窄。答案：`ആ വഴി ഇടുങ്ങിയതാണ്.` 將指示詞 `ഈ` 換成 `ആ`，保留完整述語；`ഇടുങ്ങിയ വഴി` 只係「一條窄路」名詞短語。
  - subskill_id: location_movement
    explanation: 有人搵鎖匙，你指出佢喺枱面。`താക്കോൽ` 係鎖匙；`മേശപ്പുറത്ത്` 係枱上，接 `ഉണ്ട്` 寫成
      `മേശപ്പുറത്തുണ്ട്`，講所在位置，唔係叫人搬鎖匙。
    examples:
      - text: താക്കോൽ മേശപ്പുറത്തുണ്ട്.
        meaning: 鎖匙喺枱面。`മേശ` 係枱；`മേശപ്പുറത്തുണ്ട്` 將枱上嘅位置形式同「有／喺」`ഉണ്ട്` 接埋。
        note: 試講袋喺枱面。答案：`ബാഗ് മേശപ്പുറത്തുണ്ട്.` 將被定位物件換成 `ബാഗ്`；位置表達不變。若上文已講鎖匙，單答 `മേശപ്പുറത്ത്`
          亦可指出所在。
  - subskill_id: possession_relations
    explanation: 安排座位時，你講自己有兩張凳。`എനിക്ക്` 標擁有者，`രണ്ട്` 數兩張；`കസേരകളുണ്ട്` 將凳嘅複數形式同 `ഉണ്ട്` 接埋，表達有幾多凳。
    examples:
      - text: എനിക്ക് രണ്ട് കസേരകളുണ്ട്.
        meaning: 我有兩張凳。`കസേരകൾ` 係多張凳，`കസേരകളുണ്ട്` 接上 `ഉണ്ട്`；句子用 `എനിക്ക്` 加存在表達所有關係。
        note: 試講你有三張凳。答案：`എനിക്ക് മൂന്ന് കസേരകളുണ്ട്.` 將 `രണ്ട്` 換成 `മൂന്ന്`；`എന്റെ കസേരകൾ`
          只係「我嘅凳」名詞短語，未講有幾多可用。
  - subskill_id: quantity_comparison
    explanation: 兩個箱要搬，你比較重量。`ഈ പെട്ടിക്ക്` 指呢個箱，`അതിനെക്കാൾ` 以嗰個箱做「比起」基準；`ഭാരം കുറവാണ്` 講重量較少，即係呢個較輕。
    examples:
      - text: ഈ പെട്ടിക്ക് അതിനെക്കാൾ ഭാരം കുറവാണ്.
        meaning: 呢個箱比嗰個輕。`ഭാരം` 係重量，`കുറവാണ്` 係較少；`അതിനെക്കാൾ` 指明同嗰個比較，唔係兩個箱都單獨話輕。
        note: 試將比較方向反過來。答案：`ആ പെട്ടിക്ക് ഇതിനെക്കാൾ ഭാരം കുറവാണ്.` `ആ പെട്ടിക്ക്`
          改揀嗰個箱，`ഇതിനെക്കാൾ` 改同呢個比；兩個參照都要換，先唔會變成同自己比較。
