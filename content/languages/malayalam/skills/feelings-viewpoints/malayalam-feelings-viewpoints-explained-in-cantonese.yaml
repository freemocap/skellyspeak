sections:
  - subskill_id: wants_intentions
    explanation: 與格感受者配合ആഗ്രഹമുണ്ട്，可以表達想做某件事。
    examples:
      - text: എനിക്ക് തയ്യൽ പഠിക്കാൻ ആഗ്രഹമുണ്ട്.
        meaning: 我想學縫紉。
        note: പഠിക്കാൻ指出想學嘅行動，冇作出承諾。
  - subskill_id: preferences
    explanation: ഇഷ്ടം配合與格感受者同另一個比較選項，可以表達喜好。
    examples:
      - text: എനിക്ക് കാപ്പിയെക്കാൾ ചായയാണ് ഇഷ്ടം.
        meaning: 比起咖啡，我鍾意茶多啲。
        note: ചായയാണ്將茶突出為較鍾意嘅選項。
  - subskill_id: emotions
    explanation: 感受結構可以描述聽到消息後嘅情緒反應。
    examples:
      - text: ഈ വാർത്ത കേട്ടപ്പോൾ എനിക്ക് സന്തോഷമായി.
        meaning: 聽到呢個消息，我好開心。
        note: എനിക്ക്指出感到開心嘅人。
  - subskill_id: opinions
    explanation: തോന്നുന്നു可以將前面或後面嘅命題表達成個人印象。
    examples:
      - text: ഈ രീതി എളുപ്പമാണെന്ന് എനിക്ക് തോന്നുന്നു.
        meaning: 我覺得呢個方法容易。
        note: എന്ന്連接印象嘅具體內容。
  - subskill_id: agreement_disagreement
    explanation: യോജിക്കുക配合適當補語表示同意，加否定就係反對。
    examples:
      - text: ഞാൻ ഈ നിർദ്ദേശത്തോട് യോജിക്കുന്നില്ല.
        meaning: 我唔同意呢個建議。
        note: നിർദ്ദേശത്തോട്指出反對嘅建議。
