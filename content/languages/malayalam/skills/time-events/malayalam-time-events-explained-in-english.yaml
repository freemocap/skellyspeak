sections:
  - subskill_id: present_events
    explanation: A verbal-noun construction with ആണ് can present an action as ongoing.
    examples:
      - text: ഇപ്പോൾ ഞാൻ സൈക്കിൾ നന്നാക്കുകയാണ്.
        meaning: I am repairing a bicycle now.
        note: ഇപ്പോൾ anchors the repair to now.
  - subskill_id: past_events
    explanation: A past verb form can report an earlier completed action.
    examples:
      - text: ഇന്നലെ ഞാൻ സൈക്കിൾ നന്നാക്കി.
        meaning: Yesterday I repaired a bicycle.
        note: നന്നാക്കി is past; it does not change for the speaker’s gender.
  - subskill_id: future_events
    explanation: A future verb form can describe a later plan.
    examples:
      - text: നാളെ ഞാൻ സാധനങ്ങൾ വാങ്ങും.
        meaning: Tomorrow I will buy the supplies.
        note: നാളെ establishes future time for വാങ്ങും.
  - subskill_id: duration_frequency
    explanation: A time interval and occurrence count express frequency.
    examples:
      - text: ഞാൻ ആഴ്ചയിൽ രണ്ടു പ്രാവശ്യം നീന്താറുണ്ട്.
        meaning: I swim twice a week.
        note: നീന്താറുണ്ട് presents a habitual activity; രണ്ടു പ്രാവശ്യം counts occasions.
  - subskill_id: event_sequence
    explanation: ആദ്യം and പിന്നെ establish first and subsequent steps.
    examples:
      - text: ആദ്യം കൈ കഴുകുക, പിന്നെ പച്ചക്കറി മുറിക്കുക.
        meaning: First wash your hands, then cut the vegetables.
        note: These procedural instructions give order rather than cause.
  - subskill_id: event_phase
    explanation: A compound with തീർക്കുക can specify finishing an activity.
    examples:
      - text: ഞാൻ പുസ്തകം വായിച്ചു തീർത്തു.
        meaning: I finished reading the book.
        note: The reading reaches its endpoint, rather than merely occurring in the past.
