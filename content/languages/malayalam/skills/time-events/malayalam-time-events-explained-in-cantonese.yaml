sections:
  - subskill_id: present_events
    explanation: 動名詞結構配合ആണ്，可以表達進行中行動。
    examples:
      - text: ഇപ്പോൾ ഞാൻ സൈക്കിൾ നന്നാക്കുകയാണ്.
        meaning: 我而家整緊單車。
        note: ഇപ്പോൾ將維修定位到而家。
  - subskill_id: past_events
    explanation: 動詞過去式可以報告較早完成嘅動作。
    examples:
      - text: ഇന്നലെ ഞാൻ സൈക്കിൾ നന്നാക്കി.
        meaning: 我尋日整咗架單車。
        note: നന്നാക്കി係過去式，唔會按講者性別改變。
  - subskill_id: future_events
    explanation: 動詞將來式可以描述稍後計劃。
    examples:
      - text: നാളെ ഞാൻ സാധനങ്ങൾ വാങ്ങും.
        meaning: 我聽日會買用品。
        note: നാളെ為വാങ്ങും設定將來時間。
  - subskill_id: duration_frequency
    explanation: 時間範圍加次數，可以表達頻率。
    examples:
      - text: ഞാൻ ആഴ്ചയിൽ രണ്ടു പ്രാവശ്യം നീന്താറുണ്ട്.
        meaning: 我一個星期游兩次水。
        note: നീന്താറുണ്ട്表達習慣活動；രണ്ടു പ്രാവശ്യം數次數。
  - subskill_id: event_sequence
    explanation: ആദ്യം同പിന്നെ交代第一步同之後步驟。
    examples:
      - text: ആദ്യം കൈ കഴുകുക, പിന്നെ പച്ചക്കറി മുറിക്കുക.
        meaning: 先洗手，再切蔬菜。
        note: 程序指令交代次序，唔係因果。
  - subskill_id: event_phase
    explanation: 配合തീർക്കുക嘅複合結構，可以指明完成活動。
    examples:
      - text: ഞാൻ പുസ്തകം വായിച്ചു തീർത്തു.
        meaning: 我睇完本書喇。
        note: 閱讀達到終點，唔係淨係喺過去發生過。
