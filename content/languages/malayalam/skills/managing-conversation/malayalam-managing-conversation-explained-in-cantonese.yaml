sections:
  - subskill_id: opening_closing
    explanation: 簡短嘅將來取向表達可以結束交談。
    examples:
      - text: പിന്നെ കാണാം!
        meaning: 遲啲見！
        note: 呢個係對話中嘅道別，唔係純粹預測視覺感知。
  - subskill_id: acknowledging
    explanation: മനസ്സിലായി可以表示理解。
    examples:
      - text: ശരി, ഇപ്പോൾ മനസ്സിലായി.
        meaning: 好，我而家明喇。
        note: 聽完解釋後用，唔一定代表同意觀點。
  - subskill_id: clarification
    explanation: 問句配合ഒന്നുകൂടി，請對方再講一次。
    examples:
      - text: ഒന്നുകൂടി പറയാമോ?
        meaning: 可唔可以再講一次？
        note: 之前嘅發言交代要重複乜嘢。
  - subskill_id: rephrasing
    explanation: മറ്റൊരു രീതിയിൽ പറഞ്ഞാൽ引出另一種講法。
    examples:
      - text: മറ്റൊരു രീതിയിൽ പറഞ്ഞാൽ, മുൻകൂട്ടി ബുക്ക് ചെയ്യണം.
        meaning: 即係話，你要預先訂位。
        note: 解釋訂位程序後用；ബുക്ക്係慣用借詞，用馬拉雅拉姆文字寫。
  - subskill_id: correcting_misunderstanding
    explanation: ഉദ്ദേശിച്ചത്指出講者原意。
    examples:
      - text: ഞാൻ ഉദ്ദേശിച്ചത് ശനിയാഴ്ചയാണ്, വെള്ളിയാഴ്ചയല്ല.
        meaning: 我係指星期六，唔係星期五。
        note: 講者更正聽者理解錯咗嘅日子。
  - subskill_id: turns_topics
    explanation: 問句可以提議轉去下一個話題。
    examples:
      - text: അടുത്ത ചോദ്യത്തിലേക്ക് കടക്കാമോ?
        meaning: 我哋可唔可以轉去下一條問題？
        note: 要求嘅轉換關乎討論本身。
