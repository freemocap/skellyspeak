sections:
  - subskill_id: causes_reasons
    explanation: 朋友問點解你留喺屋企。`ഞാൻ വീട്ടിൽ നിന്നു` 先講留家；`കാരണം` 之後用 `മഴ പെയ്യുന്നുണ്ടായിരുന്നു`
      提供當時落緊雨呢個原因，唔係單純列兩件事嘅先後。
    examples:
      - text: ഞാൻ വീട്ടിൽ നിന്നു, കാരണം മഴ പെയ്യുന്നുണ്ടായിരുന്നു.
        meaning: 我留喺屋企，因為當時落緊雨。`ഞാൻ` 係我，`വീട്ടിൽ` 係屋企，`മഴ` 係雨；`പെയ്യുന്നുണ്ടായിരുന്നു`
          將落雨放喺過去進行背景。
        note: 練習：邊部分答「點解留家」？答案：`മഴ പെയ്യുന്നുണ്ടായിരുന്നു`，因為佢講落雨呢個理由；`ഞാൻ വീട്ടിൽ നിന്നു`
          係要解釋嘅結果。
  - subskill_id: consequences
    explanation: 巴士冇嚟，你唯有行路。`ബസ് വന്നില്ല` 先交代問題，`അതുകൊണ്ട്` 之後引出由此作出嘅行動；`നടന്നു പോയി`
      將行路同過去離開連成同一趟行程。
    examples:
      - text: ബസ് വന്നില്ല. അതുകൊണ്ട് ഞാൻ നടന്നു പോയി.
        meaning: 巴士冇嚟，所以我行路過去。`വന്നില്ല` 係冇嚟，`ഞാൻ നടന്നു പോയി` 係我行住去；`അതുകൊണ്ട്` 指向前面原因，帶出後果。
        note: 練習：巴士冇嚟之後，第二句應用邊個連接詞？答案：`അതുകൊണ്ട്`，因為行路係巴士冇嚟之後嘅結果；`കാരണം` 會引出原因。
  - subskill_id: conditions
    explanation: 聽日安排視乎會唔會落雨。`നാളെ` 係聽日，`മഴ പെയ്താൽ` 係如果落雨；`ഞങ്ങൾ വീട്ടിലിരിക്കും`
      係相應留家計劃。`ഞങ്ങൾ` 係唔包括聽者嘅我哋，條件句唔表示雨已經落過。
    examples:
      - text: നാളെ മഴ പെയ്താൽ ഞങ്ങൾ വീട്ടിലിരിക്കും.
        meaning: 如果聽日落雨，我哋會留喺屋企。`പെയ്താൽ` 係條件形式，雖然建基於過去形式，但 `നാളെ` 將可能事件放喺將來；`വീട്ടിലിരിക്കും`
          係條件成立時嘅計劃。
        note: 練習：`പെയ്താൽ` 喺呢度係咪話尋日落咗雨？答案：唔係。佢係「如果落雨」；`നാളെ` 講明呢個可能情況喺聽日。
  - subskill_id: contrast
    explanation: 揀路線時，一條路短但斜。`ഈ വഴി` 係呢條路，`ചെറുതാണ്` 話短，`കുത്തനെയാണ്` 話斜；`പക്ഷേ`
      將短路程嘅好處同上斜嘅困難放埋一齊，兩樣都可以真。
    examples:
      - text: ഈ വഴി ചെറുതാണ്, പക്ഷേ കുത്തനെയാണ്.
        meaning: 呢條路短，但好斜。兩個描述尾部都構成完整陳述；`പക്ഷേ` 標示實際選路時嘅對比，唔係否定條路短。
        note: 練習：講者係咪將「短」更正成「斜」？答案：唔係。`ചെറുതാണ്` 同 `കുത്തനെയാണ്` 都描述條路；`പക്ഷേ` 將缺點同好處對照。
  - subskill_id: supporting_claims
    explanation: 夜晚你見到屋入面盞燈亮住，推測可能有人。`വീട്ടിൽ ആരോ ഉണ്ടെന്ന് തോന്നുന്നു` 用 `തോന്നുന്നു`
      標成印象；`കാരണം വിളക്ക് തെളിഞ്ഞിരിക്കുന്നു` 提供燈亮呢個線索，唔係講燈造成有人喺屋企。
    examples:
      - text: വീട്ടിൽ ആരോ ഉണ്ടെന്ന് തോന്നുന്നു, കാരണം വിളക്ക് തെളിഞ്ഞിരിക്കുന്നു.
        meaning: 好似有人喺屋企，因為盞燈亮住。`ആരോ` 係某人，`വിളക്ക്` 係燈，`തെളിഞ്ഞിരിക്കുന്നു` 係亮住；講者係根據線索推論，冇話親眼見到人。
        note: 練習：邊個詞令「有人」聽落唔係肯定？答案：`തോന്നുന്നു`，意思係似乎；講者根據燈光作推論，唔係直接報告見到人。
