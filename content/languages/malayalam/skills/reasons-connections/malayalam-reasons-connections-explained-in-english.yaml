skill_id: reasons_connections
explanation_language: english
shared_explanation: skills/reasons-connections/reasons-connections-explained-in-english.yaml
sections:
  - subskill_id: causes_reasons
    explanation: When someone asks why you stayed home, the reason follows the event with `കാരണം`,
      “because.” The first clause gives what happened; the second explains it. Here `ഞാൻ` is “I,”
      `വീട്ടിൽ` is “at home,” and `നിന്നു` describes staying. `മഴ` is “rain”; `മഴ
      പെയ്യുന്നുണ്ടായിരുന്നു` places the raining in the past.
    examples:
      - text: ഞാൻ വീട്ടിൽ നിന്നു, കാരണം മഴ പെയ്യുന്നുണ്ടായിരുന്നു.
        meaning: I stayed home because it was raining.
        note: >-
          `കാരണം` connects the decision to its reason. The rain clause describes an ongoing
          situation, rather than just naming rain as a thing.


          Practice: Which part answers “why”: `ഞാൻ വീട്ടിൽ നിന്നു` or `മഴ പെയ്യുന്നുണ്ടായിരുന്നു`?
          Answer: `മഴ പെയ്യുന്നുണ്ടായിരുന്നു`, because the rain explains why the speaker stayed
          home.
  - subskill_id: consequences
    explanation: "If the bus fails to arrive and you choose to walk, the outcome can follow with
      `അതുകൊണ്ട്`, “so/therefore.” `ബസ് വന്നില്ല` means “the bus did not come”: `വന്നില്ല` is a
      negative past form of coming. In `ഞാൻ നടന്നു പോയി`, `നടന്നു` describes walking and `പോയി`
      supplies the past movement away. The two verbs describe one journey on foot."
    examples:
      - text: ബസ് വന്നില്ല. അതുകൊണ്ട് ഞാൻ നടന്നു പോയി.
        meaning: The bus did not come. So I walked there.
        note: >-
          The direction of the explanation matters: `കാരണം` introduces a reason, whereas `അതുകൊണ്ട്`
          introduces what follows from a reason already given.


          Practice: Which connector fits the second sentence after `ബസ് വന്നില്ല`: `കാരണം` or
          `അതുകൊണ്ട്`? Answer: `അതുകൊണ്ട്`, because walking is the consequence, not the reason the
          bus failed to come.
  - subskill_id: conditions
    explanation: A plan can depend on an event that has not yet happened. `നാളെ` means “tomorrow,” and
      `മഴ പെയ്താൽ` means “if it rains.” The conditional `പെയ്താൽ` uses a past-based verb form with
      the conditional ending, but it does not put tomorrow’s rain in the past. `ഞങ്ങൾ` is “we,”
      excluding the listener, and `വീട്ടിലിരിക്കും` gives the resulting plan to stay at home.
    examples:
      - text: നാളെ മഴ പെയ്താൽ ഞങ്ങൾ വീട്ടിലിരിക്കും.
        meaning: If it rains tomorrow, we will stay home.
        note: >-
          The rain is a condition, not a prediction that it will certainly rain. The result clause
          follows the condition; `നാളെ` establishes the future setting.


          Practice: Does `പെയ്താൽ` here say that it rained yesterday? Answer: No. It means “if it
          rains,” and `നാളെ` places that possible event tomorrow.
  - subskill_id: contrast
    explanation: A route may have one helpful feature and another less helpful one. `ഈ വഴി` means “this
      route”; `ചെറുതാണ്` says it is short, and `കുത്തനെയാണ്` says it is steep. `പക്ഷേ`, “but,”
      connects the features because a short route might otherwise sound like an easy choice. Both
      descriptions can be true.
    examples:
      - text: ഈ വഴി ചെറുതാണ്, പക്ഷേ കുത്തനെയാണ്.
        meaning: This route is short but steep.
        note: >-
          The ending in each description makes a complete statement about the route. `പക്ഷേ` signals
          the practical contrast; it does not negate the first description.


          Practice: Is the speaker correcting “short” to “steep”? Answer: No. `ചെറുതാണ്` and
          `കുത്തനെയാണ്` both describe the route; `പക്ഷേ` highlights the drawback alongside the
          advantage.
  - subskill_id: supporting_claims
    explanation: "A visible light can support a guess about who is home. `വീട്ടിൽ` means “at home,”
      `ആരോ` means “someone,” and `ഉണ്ടെന്ന് തോന്നുന്നു` reports an impression that someone is there.
      `കാരണം` introduces the evidence: `വിളക്ക്` is “lamp/light,” and `തെളിഞ്ഞിരിക്കുന്നു` describes
      it as lit. The speaker presents an inference, not direct observation of the person."
    examples:
      - text: വീട്ടിൽ ആരോ ഉണ്ടെന്ന് തോന്നുന്നു, കാരണം വിളക്ക് തെളിഞ്ഞിരിക്കുന്നു.
        meaning: It seems someone is home because the light is on.
        note: >-
          `തോന്നുന്നു` keeps the claim at the level of an impression. The light is evidence for
          someone’s presence; it is not what makes a person be at home.


          Practice: Which words keep the claim from sounding certain? Answer: `തോന്നുന്നു`, “it
          seems,” because the speaker is drawing a conclusion from the light rather than reporting
          seeing someone.
