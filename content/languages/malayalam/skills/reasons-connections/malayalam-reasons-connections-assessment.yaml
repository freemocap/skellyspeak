skill_id: reasons_connections
guidance: Assess causes, consequences, conditions, contrast and support for claims. കാരണം can
  introduce a reason and അതുകൊണ്ട് a consequence. നാളെ മഴ പെയ്താൽ ഞങ്ങൾ വീട്ടിലിരിക്കും
  establishes a condition through -ആൽ rather than requiring an English if word. പക്ഷേ contrasts
  properties, while പിന്നെ can simply sequence actions. A light being on may support an
  occupancy inference without causing someone to be there. മഴ പെയ്തതുകൊണ്ട് can answer an
  identifiable why-question contextually. A copied connector without recoverable related content
  is absent. Judge whether the claimed reason or evidence actually supports the outcome or
  conclusion. Do not require each dependent action to be a separate finite English-shaped
  clause. Preserve case, verbal compounds and natural word order, and do not let unrelated
  errors erase a correctly expressed connection.
