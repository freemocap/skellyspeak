skill_id: information_exchange
explanation_language: english
shared_explanation: skills/information-exchange/information-exchange-explained-in-english.yaml
sections:
  - subskill_id: asking_information
    explanation: എത്ര മണിക്ക് asks at what clock time an event occurs.
    examples:
      - text: കട എത്ര മണിക്കാണ് അടയ്ക്കുന്നത്?
        meaning: What time does the shop close?
        note: The question asks for the shop’s closing hour.
  - subskill_id: answering_information
    explanation: A dative-marked clock time can answer a preceding time question.
    examples:
      - text: അഞ്ചു മണിക്ക്.
        meaning: At five o’clock.
        note: Reply to the shop closing-time question; the event need not be repeated.
  - subskill_id: checking_facts
    explanation: അല്ലേ after a proposition can ask for confirmation.
    examples:
      - text: കട അഞ്ചു മണിക്കാണ് അടയ്ക്കുന്നത്, അല്ലേ?
        meaning: The shop closes at five, right?
        note: The speaker supplies five as a candidate fact.
  - subskill_id: useful_detail
    explanation: A location predicate can distinguish an entrance for the listener.
    examples:
      - text: പ്രവേശനം മുറ്റത്തിന്റെ വശത്താണ്.
        meaning: The entrance is on the courtyard side.
        note: Use when the listener is trying to locate the entrance.
