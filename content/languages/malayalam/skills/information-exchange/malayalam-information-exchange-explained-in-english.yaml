skill_id: information_exchange
explanation_language: english
shared_explanation: skills/information-exchange/information-exchange-explained-in-english.yaml
sections:
  - subskill_id: asking_information
    explanation: Before visiting a shop, you need its closing hour. `എത്ര മണിക്ക്` asks at what clock
      time. The final closing expression stays after the shop and the requested time, rather than
      using English question inversion.
    examples:
      - text: കട എത്ര മണിക്കാണ് അടയ്ക്കുന്നത്?
        meaning: "**The example.** What time does the shop close? `കട` is shop. In `എത്ര മണിക്കാണ്`, the
          time question joins to `ആണ്`; `അടയ്ക്കുന്നത്` names the closing action. The question
          highlights the unknown time at which that closing happens."
        note: "Try asking for the opening hour. Answer: `കട എത്ര മണിക്കാണ് തുറക്കുന്നത്?` Replace
          `അടയ്ക്കുന്നത്` with `തുറക്കുന്നത്`, opening. `കട അഞ്ചു മണിക്കാണ് അടയ്ക്കുന്നത്` supplies
          five in the same time position instead of asking for an unknown hour."
  - subskill_id: answering_information
    explanation: Once the shop's closing time has been asked, a time phrase can give the answer
      directly. The shop and closing event need not be repeated. The ending on the hour gives the
      meaning at.
    examples:
      - text: അഞ്ചു മണിക്ക്.
        meaning: "**The example.** At five o'clock. `അഞ്ചു` is five and `മണി` means hour or clock time.
          `മണിക്ക്` is the form used for at that hour. Together `അഞ്ചു മണിക്ക്` supplies the missing
          time in the closing-time question."
        note: "Try answering six o'clock. Answer: `ആറു മണിക്ക്.` Replace `അഞ്ചു` with `ആറു`. Keep the
          at-time form `മണിക്ക്`. `അഞ്ചു മണിക്കൂർ` means five hours of duration and would not
          identify the shop's closing hour."
  - subskill_id: checking_facts
    explanation: You remember a five-o'clock closing time and want to confirm it. The sentence first
      supplies that candidate fact. Final `അല്ലേ` asks whether the listener agrees that it is
      correct.
    examples:
      - text: കട അഞ്ചു മണിക്കാണ് അടയ്ക്കുന്നത്, അല്ലേ?
        meaning: "**The example.** The shop closes at five, right? `കട അഞ്ചു മണിക്കാണ് അടയ്ക്കുന്നത്` gives
          the shop, proposed hour and closing event. `മണിക്കാണ്` joins the at-hour form to `ആണ്`.
          The tag `അല്ലേ` checks that whole proposition."
        note: "Try checking six as the closing hour. Answer: `കട ആറു മണിക്കാണ് അടയ്ക്കുന്നത്, അല്ലേ?` Change
          only the hour. `കട എത്ര മണിക്കാണ് അടയ്ക്കുന്നത്?` asks for an unknown time rather than
          proposing one for confirmation."
  - subskill_id: useful_detail
    explanation: When someone cannot find the entrance, identifying the courtyard side helps them choose
      the correct approach. The courtyard is named as the reference point, followed by the side and
      its location ending.
    examples:
      - text: പ്രവേശനം മുറ്റത്തിന്റെ വശത്താണ്.
        meaning: "**The example.** The entrance is on the courtyard side. `പ്രവേശനം` is entrance or entry
          here. `മുറ്റത്തിന്റെ` means of the courtyard, and `വശത്താണ്` means is on the side, joining
          a location form to `ആണ്`. Together they locate the entry."
        note: "Try locating the entrance on the other side. Answer: `പ്രവേശനം മറുവശത്താണ്.` `മറുവശത്താണ്`
          means is on the other side. The listener needs to know which side you are contrasting; a
          location clue is useful only when its reference can be identified."
