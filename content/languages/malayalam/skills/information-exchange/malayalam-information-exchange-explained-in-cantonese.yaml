sections:
  - subskill_id: asking_information
    explanation: എത്ര മണിക്ക്問事件喺幾點發生。
    examples:
      - text: കട എത്ര മണിക്കാണ് അടയ്ക്കുന്നത്?
        meaning: 間舖頭幾點閂門？
        note: 問句想知舖頭關門嘅鐘點。
  - subskill_id: answering_information
    explanation: 與格標記嘅鐘點，可以回答前面嘅時間問題。
    examples:
      - text: അഞ്ചു മണിക്ക്.
        meaning: 五點鐘。
        note: 回應舖頭閂門時間，唔使重複事件。
  - subskill_id: checking_facts
    explanation: 命題後面加അല്ലേ，可以尋求確認。
    examples:
      - text: കട അഞ്ചു മണിക്കാണ് അടയ്ക്കുന്നത്, അല്ലേ?
        meaning: 間舖頭五點閂門，係咪？
        note: 講者提出五點作候選答案。
  - subskill_id: useful_detail
    explanation: 位置述語可以幫聽者分辨入口。
    examples:
      - text: പ്രവേശനം മുറ്റത്തിന്റെ വശത്താണ്.
        meaning: 入口喺庭院嗰邊。
        note: 聽者搵緊入口時用。
