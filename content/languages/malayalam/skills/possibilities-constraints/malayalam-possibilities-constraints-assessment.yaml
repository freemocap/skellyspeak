skill_id: possibilities_constraints
guidance: "Recognize ability, permission, obligation, possibility and confidence. എനിക്ക്
  നീന്താൻ കഴിയും expresses capability with an infinitive. ഇവിടെ ബാഗ് വെക്കാമോ? can ask
  permission from the person responsible for a space. ഞാൻ ഇന്ന് താക്കോൽ തിരികെ കൊടുക്കണം states
  an obligation. വേണ്ട can remove need or express refusal, while പാടില്ല can prohibit; do not
  treat every negative modal as the same meaning. മഴ പെയ്തേക്കാം presents possibility and
  ഉറപ്പില്ല limits certainty. വെക്കാം can grant a preceding permission request contextually. A
  copied modal ending with no recoverable proposition is absent. Dative and nominative frames
  can affect modal meaning, but context still matters: do not enforce a simplistic
  case-to-meaning lookup. A polite capability-shaped request need not assert ability. Ambiguity
  between successful group subtypes alone does not make the whole group unclear."
