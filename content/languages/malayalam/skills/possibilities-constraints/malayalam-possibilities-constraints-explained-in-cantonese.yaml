sections:
  - subskill_id: ability
    explanation: 不定式配合കഴിയും，可以表示能力。
    examples:
      - text: എനിക്ക് നീന്താൻ കഴിയും.
        meaning: 我識游水。
        note: എനിക്ക്指出有呢種能力嘅人。
  - subskill_id: permission
    explanation: ആമോ結尾問句，可以問某個行動獲唔獲准。
    examples:
      - text: ഇവിടെ ബാഗ് വെക്കാമോ?
        meaning: 我可唔可以放個袋喺度？
        note: 向管理地方嘅人詢問；行動者由語境辨認。
  - subskill_id: obligation
    explanation: കൊടുക്കണം入面嘅詞尾可以表達必要行動。
    examples:
      - text: ഞാൻ ഇന്ന് താക്കോൽ തിരികെ കൊടുക്കണം.
        meaning: 我今日一定要還鎖匙。
        note: 語境係歸還限期，所以係義務，唔係願望。
  - subskill_id: possibility
    explanation: 含有ഏക്കാം嘅形式可以表達可能事件。
    examples:
      - text: വൈകുന്നേരം മഴ പെയ്തേക്കാം.
        meaning: 夜晚可能落雨。
        note: 天氣結果仍然未肯定。
  - subskill_id: certainty
    explanation: ഉറപ്പില്ല表示對命題冇把握。
    examples:
      - text: കട തുറന്നിട്ടുണ്ടോ എന്ന് എനിക്ക് ഉറപ്പില്ല.
        meaning: 我唔肯定間舖頭開咗未。
        note: 嵌入問句指出唔肯定乜嘢，冇斷言舖頭閂咗。
