# yaml-language-server: $schema=../../rust-schemas/language.yaml
schema_version: 1
identity:
  id: malayalam
  name: Malayalam
  native_name: മലയാളം
  family: dravidian
  review: needs_review
integrations:
  language_tag: ml
  transcription: ml
definitions:
  orthographies:
    malayalam:
      script: malayalam
      guidance:
        - scope: target_writing
          text: Write newly generated Malayalam in Malayalam script. Preserve source excerpts exactly,
            including vowel signs, conjuncts and joining controls. Keep newly generated target and
            explanation text in this script. Reading-aid romanization is generated by a separate
            operation.
          sources:
            - unicode17_indic
        - scope: explanation_writing
          text: Write newly generated Malayalam in Malayalam script. Preserve source excerpts exactly,
            including vowel signs, conjuncts and joining controls. Keep newly generated target and
            explanation text in this script. Reading-aid romanization is generated by a separate
            operation.
          sources:
            - unicode17_indic
  romanization_schemes:
    ala-lc-malayalam:
      label: ALA-LC Malayalam
      instructions: Use ALA-LC Malayalam (2014) orthographic transliteration with its diacritics and
        distinctions between short and long vowels, including e/ē and o/ō. Preserve consonant
        doubling. Chillu consonants carry no inherent a; follow the table for candrakkala, including
        its ȧ value where it represents the reduced vowel. Treat modern chillu letters and legacy
        sequences according to their intended letters without rewriting the source. This is
        transliteration, not a pronunciation guide; put spoken pronunciation in the separate
        pronunciation field.
      examples:
        - original: മീന
          romanized: mīna
        - original: പാൽ
          romanized: pāl
        - original: വീട്
          romanized: vīṭȧ
        - original: കഥ
          romanized: katha
        - original: നീല
          romanized: nīla
      sources:
        - ala_lc_malayalam
      review: needs_review
defaults:
  variety: malayalam-kerala
  orthography:
    local: malayalam
  scalars: {}
  romanization:
    mode: scheme
    scheme:
      local: ala-lc-malayalam
  supported_romanizations:
    - local: ala-lc-malayalam
traits: []
varieties:
  - id: malayalam-kerala
    name: Kerala
    description: Contemporary standard Malayalam for everyday conversation in Kerala, India.
    review: needs_review
    sources: []
    overrides: {}
    guidance: []
guidance:
  - scope: segmentation
    text: Select linguistic words without splitting vowel signs or conjuncts. Preserve the exact source
      encoding and let the supplied grapheme boundaries constrain annotation spans.
    sources:
      - unicode17_indic
conversation:
  greeting:
    text: നമസ്കാരം
    romanizations:
      malayalam:ala-lc-malayalam: namaskāraṁ
  default_partner:
    name: മീന
    romanizedName: Mīna
    age: 32
    location: Kochi, Kerala, India
    occupation: Bicycle mechanic
    background: Runs a small bicycle repair workshop and shares a home with a friend.
    currentSituation: Repairing a touring bicycle and planning a ferry trip.
    interests:
      - cycling
      - cooking
      - ferry trips
    opinions:
      - Public transport should be easier to use.
    interestingFacts:
      - Keeps a notebook of places to visit.
    favoriteBooks: []
    favoriteMovies: []
    manner: Uses short everyday sentences and asks concrete follow-up questions.
    quirks:
      - Draws small maps when explaining directions.
    vibe:
      - 📚
      - 🚲
      - ☕
practice:
  review: needs_review
  sets:
    absolute_zero:
      - അതെ.
      - അല്ല.
      - വെള്ളം തരൂ.
      - ഞാൻ ഇവിടെയുണ്ട്.
      - ചൂടാണ്.
      - എനിക്ക് വിശക്കുന്നു.
      - ഇതെന്താണ്?
      - എനിക്ക് അറിയില്ല.
    beginner:
      - ഞാൻ വിദ്യാർത്ഥിയാണ്.
      - ഈ മുറി വലുതാണ്.
      - എനിക്ക് ഒരു പുസ്തകം ഉണ്ട്.
      - ഇത് എന്റെ വീടാണ്.
      - എനിക്ക് രണ്ട് പുസ്തകങ്ങൾ ഉണ്ട്.
      - കുറച്ച് വെള്ളം വേണം.
      - ഞാൻ ഇവിടെ ജോലി ചെയ്യുന്നു.
      - അവൾ ഇപ്പോൾ വായിക്കുന്നു.
    intermediate:
      - ഞാൻ ഇന്നലെ വന്നു.
      - അവൾ ഒരു പുസ്തകം വായിച്ചു.
      - ഞാൻ നാളെ വരും.
      - അവൾ അടുത്ത ആഴ്ച പോകും.
      - എനിക്ക് ചായ ഇഷ്ടമാണ്.
      - എനിക്ക് വെള്ളം വേണം.
      - എനിക്ക് നീന്താൻ കഴിയും.
      - എനിക്ക് പോകണം.
    advanced:
      - യോഗം ഇത്രയും നീളുമെന്ന് അറിയാമായിരുന്നെങ്കിൽ, വീട്ടിലേക്ക് മടങ്ങാനുള്ള പദ്ധതി ഞാൻ നേരത്തേ
        മാറ്റുമായിരുന്നു.
      - അഭിപ്രായം ചോദിക്കാത്ത ആളുകളെ ഈ തീരുമാനം എങ്ങനെ ബാധിക്കുമെന്നതാണ് എന്നെ ഏറ്റവും കൂടുതൽ
        ആശങ്കപ്പെടുത്തുന്നത്.
      - ഈ നിർദേശം പ്രതീക്ഷ നൽകുന്നതാണെങ്കിലും, അതിന്റെ അനന്തരഫലങ്ങളെക്കുറിച്ച് നാം ശ്രദ്ധയോടെ
        ചിന്തിക്കണം.
      - പിന്നീട് ഖേദിക്കേണ്ടിവരുന്ന ഒരു തീരുമാനം തിടുക്കത്തിൽ എടുക്കുന്നതിനേക്കാൾ യാത്ര
        മാറ്റിവെക്കുന്നതാണ് നല്ലത്.
      - ഈ റിപ്പോർട്ട് കൂടുതൽ ശ്രദ്ധയോടെ വായിക്കുമ്പോൾ, അതിലെ നിഗമനങ്ങൾക്ക് മതിയായ തെളിവില്ലെന്ന്
        എനിക്ക് തോന്നുന്നു.
      - ഈ പദ്ധതിയുടെ വിജയം നാം ഉത്തരവാദിത്തങ്ങൾ എങ്ങനെ പങ്കിടുന്നു എന്നതിനെ ഏറെ ആശ്രയിച്ചിരിക്കും.
      - ഈ ആശയത്തോട് എനിക്ക് എതിർപ്പില്ല; പക്ഷേ, ഇത് നടപ്പാക്കാൻ അനുയോജ്യമായ സമയം ഇപ്പോഴാണോ എന്ന്
        ഉറപ്പില്ല.
      - എന്താണ് സംഭവിച്ചതെന്ന് ഞങ്ങൾക്ക് മനസ്സിലായപ്പോഴേക്കും, സ്ഥിതി ശരിയാക്കുന്നത് വളരെ
        ബുദ്ധിമുട്ടായിക്കഴിഞ്ഞിരുന്നു.
    social:
      - നമസ്കാരം!
      - സുഖമാണോ?
      - സുഖമാണ്, നന്ദി.
      - നിങ്ങളുടെ പേരെന്താണ്?
      - പരിചയപ്പെട്ടതിൽ സന്തോഷം.
      - വളരെ നന്ദി.
      - സാരമില്ല.
      - ക്ഷമിക്കണം.
      - ഒരു കാര്യം ചോദിക്കട്ടെ?
      - ഞാൻ പോകട്ടെ.
      - പിന്നെ കാണാം.
      - വീണ്ടും വരൂ.
      - ശുഭരാത്രി!
      - ശുഭയാത്ര!
    idiomatic:
      - അകം തുറക്കുക.
      - കണ്ണിൽ പൊടിയിടുക.
      - കാടും പടലും തല്ലുക.
      - കിണറ്റിലെ തവള.
      - കൂനിന്മേൽ കുരു.
      - കയ്യാലപ്പുറത്തെ തേങ്ങ.
      - മുതലക്കണ്ണീർ.
      - നട്ടം തിരിയുക.
