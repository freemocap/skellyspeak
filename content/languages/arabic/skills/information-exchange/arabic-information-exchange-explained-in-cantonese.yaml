sections:
  - subskill_id: asking_information
    explanation: 疑問時間短語可以問事件發生嘅鐘點。
    examples:
      - text: فِي أَيِّ سَاعَةٍ يُغْلِقُ الْمَحَلُّ؟
        meaning: 間舖幾點閂門？
        note: 現代標準阿拉伯語。問題問關門時間。
      - text: أَيّ سَاعَة بِيْسَكِّرْ الْمَحَلّ؟
        meaning: 間舖幾點閂門？
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。問題問關門時間。
  - subskill_id: answering_information
    explanation: 鐘點短語可以獨立回答之前條問題。
    examples:
      - text: فِي السَّاعَةِ الْخَامِسَةِ.
        meaning: 五點。
        note: 現代標準阿拉伯語。回答關門時間，唔需要完整句子。
      - text: عَ السَّاعَة خَمْسِة.
        meaning: 五點。
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。回答關門時間，唔需要完整句子。
  - subskill_id: checking_facts
    explanation: 先提出一個說法，再加確認問題，可以核實候選事實。
    examples:
      - text: الْمَحَلُّ مُغْلَقٌ الْيَوْمَ، أَلَيْسَ كَذٰلِكَ؟
        meaning: 間舖今日冇開，係咪？
        note: 現代標準阿拉伯語。講者提出冇開門呢個可能答案，請對方確認。
      - text: الْمَحَلّ مْسَكَّرْ الْيَوْمْ، صَحّ؟
        meaning: 間舖今日冇開，係咪？
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。講者提出冇開門呢個可能答案，請對方確認。
  - subskill_id: useful_detail
    explanation: 位置細節可以分清對方要搵嘅入口。
    examples:
      - text: الْمَدْخَلُ بِجَانِبِ الْمَخْبَزِ.
        meaning: 入口喺麵包舖隔籬。
        note: 現代標準阿拉伯語。對方搵緊入口時用。
      - text: الْمَدْخَلْ جَنْبْ الْمَخْبَزْ.
        meaning: 入口喺麵包舖隔籬。
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。對方搵緊入口時用。
