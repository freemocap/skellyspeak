variety_sections:
  arabic-levantine:
    - subskill_id: asking_information
      explanation: 問時間可以幫你安排行動，例如趕喺間舖閂門之前去到。`أَيّ سَاعَة` 問幾點，其餘部分交代你想知道邊件事嘅時間。下面例句問間舖幾點閂門。
      examples:
        - text: أَيّ سَاعَة بِيْسَكِّرْ الْمَحَلّ؟
          meaning: "**例句解說。** 「間舖幾點閂門？」`أَيّ سَاعَة` 問邊個鐘點，`بِيْسَكِّرْ` 喺呢個口語結構係關門，`الْمَحَلّ` 指間舖。呢個一般現在式動詞有
            b 前綴。"
          note: |-
            **砌答案。** 呢個口語示例用 `عَ السَّاعَة خَمْسِة` 講喺五點，可以淨係用時間短語回答。

            **試吓。** 淨係答係，算唔算答咗？唔算，要交代閂門時間。疑問詞指出缺少邊項資料。
    - subskill_id: answering_information
      explanation: 人哋問間舖幾點閂，欠嘅資訊就係時間。問題已經講咗間舖同動作，所以單講時間都係完整嘅對話回答。
      examples:
        - text: عَ السَّاعَة خَمْسِة.
          meaning: "**例句。** 五點。 `عَ` 帶出時間，`السَّاعَة` 係小時，`خَمْسِة` 係五，合埋係五點。呢個口語時鐘格式用數字，回答唔使再講一次「閂」。"
          note: 六點用 `عَ السَّاعَة سِتِّة`。如果有歧義，就要交代朝早定夜晚。試下：呢個短語係咪話間舖開五個鐘？唔係；佢講時鐘時間，唔係時長。
    - subskill_id: checking_facts
      explanation: 你估間舖今日閂，但想確認先安排。先講你以為係真嘅資訊，再加短問題，畀對方確認或者更正。
      examples:
        - text: الْمَحَلّ مْسَكَّرْ الْيَوْمْ، صَحّ؟
          meaning: "**例句。** 間舖今日冇開，係咪？ `الْمَحَلّ مْسَكَّرْ` 係間舖閂咗，`الْيَوْمْ` 係今日。最後 `صَحّ؟`
            係「啱唔啱？」佢請對方確認前面陳述，唔係問新話題。"
          note: 冇咗 `صَحّ؟`，句子就可以淨係宣布閂舖。疑問語氣令資訊保留更正空間。試下改問聽日：`الْمَحَلّ مْسَكَّرْ بُكْرَا، صَحّ؟`；日子改咗，確認請求保留。
    - subskill_id: useful_detail
      explanation: 聽者搵緊入口。講附近地標，可以幫佢分清入口喺邊，呢項細節直接幫助佢下一步行動。
      examples:
        - text: الْمَدْخَلْ جَنْبْ الْمَخْبَزْ.
          meaning: "**例句。** 入口喺麵包舖隔籬。 `الْمَدْخَلْ` 係入口，`جَنْبْ` 係旁邊，`الْمَخْبَزْ`
            係麵包舖。地標放喺位置詞後面。成句話畀人知搵邊度，唔係淨係列出兩個地方。"
          note: 換成辦公室地標，用 `الْمَدْخَلْ جَنْبْ الْمَكْتَبْ`。保留關係詞，新地標先有用。試下：淨係講麵包舖，會少咗乜？答案係佢同入口嘅位置關係，`جَنْبْ`
            提供嗰個關係。
