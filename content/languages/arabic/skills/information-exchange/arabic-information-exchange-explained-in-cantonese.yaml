sections:
  - subskill_id: asking_information
    explanation: 知道一件事會發生，但唔知幾點，就要問缺少嘅時間資料。`فِي أَيِّ سَاعَةٍ` 係喺幾點。下面例句問間舖幾點閂門，所以有用嘅答案要交代鐘點，唔只係係或者唔係。
    examples:
      - text: فِي أَيِّ سَاعَةٍ يُغْلِقُ الْمَحَلُّ؟
        meaning: "**例句解說。** 「間舖幾點閂門？」`فِي أَيِّ سَاعَةٍ` 係喺邊個鐘點，`يُغْلِقُ` 係關門，`الْمَحَلُّ` 係間舖。時間表達由介詞
          `فِي` 開頭；呢個例句動詞放喺間舖前。"
        note: |-
          **砌答案。** `فِي السَّاعَةِ الْخَامِسَةِ` 係喺五點。問題已經交代間舖同關門動作，所以可以淨係用時間短語回答。

          **試吓。** 答案要補返邊個短語嘅資料？答案：`فِي أَيِّ سَاعَةٍ`。
  - subskill_id: answering_information
    explanation: 人哋問間舖幾點閂，欠嘅資訊就係時間。問題已經講咗間舖同動作，所以單講時間都係完整嘅對話回答。
    examples:
      - text: فِي السَّاعَةِ الْخَامِسَةِ.
        meaning: "**例句。** 五點。 `فِي` 呢度係喺某個時間，`السَّاعَةِ` 係小時，`الْخَامِسَةِ`
          係第五，合埋係五點。呢個時鐘表達用序數形容詞，配合女性名詞小時。"
        note: 六點用 `فِي السَّاعَةِ السَّادِسَةِ`。五點唔同持續五個鐘。試下回答六點閂：`فِي السَّاعَةِ السَّادِسَةِ`；改序數，保留時間框架。
  - subskill_id: checking_facts
    explanation: 你估間舖今日閂，但想確認先安排。先講你以為係真嘅資訊，再加短問題，畀對方確認或者更正。
    examples:
      - text: الْمَحَلُّ مُغْلَقٌ الْيَوْمَ، أَلَيْسَ كَذٰلِكَ؟
        meaning: "**例句。** 間舖今日冇開，係咪？ `الْمَحَلُّ مُغْلَقٌ` 係間舖閂咗，`الْيَوْمَ` 係今日。`أَلَيْسَ كَذٰلِكَ؟`
          係「係咪噉？」前面提出待確認事實，後面問係咪正確。"
        note: 將 `الْيَوْمَ` 換成 `غَدًا`，就係確認聽日閂唔閂。呢句唔係開放式問幾點閂，而係提出一個具體事實。試下：有用嘅更正要答乜？答案係今日係咪閂，唔係淨係講無關嘅開門時間。
  - subskill_id: useful_detail
    explanation: 聽者搵緊入口。講附近地標，可以幫佢分清入口喺邊，呢項細節直接幫助佢下一步行動。
    examples:
      - text: الْمَدْخَلُ بِجَانِبِ الْمَخْبَزِ.
        meaning: "**例句。** 入口喺麵包舖隔籬。 `الْمَدْخَلُ` 係入口，`بِجَانِبِ` 係旁邊，`الْمَخْبَزِ`
          係麵包舖。地方短語利用地標指出入口位置，唔使另加現在式嘅「係」。"
        note: 可以將地標換成辦公室 `الْمَكْتَبِ`：`الْمَدْخَلُ بِجَانِبِ
          الْمَكْتَبِ`。旁邊唔係入面。試下：聽者應該搵邊度？答案係麵包舖旁邊，唔係舖入面；關係短語指出呢個分別。
