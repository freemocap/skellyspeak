sections:
  - subskill_id: asking_information
    explanation: 知道一件事會發生，但唔知幾點，就要問缺少嘅時間資料。`فِي أَيِّ سَاعَةٍ` 係喺幾點。下面例句問間舖幾點閂門，所以有用嘅答案要交代鐘點，唔只係係或者唔係。
    examples:
      - text: فِي أَيِّ سَاعَةٍ يُغْلِقُ الْمَحَلُّ؟
        meaning: "**例句解說。** 「間舖幾點閂門？」`فِي أَيِّ سَاعَةٍ` 係喺邊個鐘點，`يُغْلِقُ` 係關門，`الْمَحَلُّ` 係間舖。時間表達由介詞
          `فِي` 開頭；呢個例句動詞放喺間舖前。"
        note: |-
          **砌答案。** `فِي السَّاعَةِ الْخَامِسَةِ` 係喺五點。問題已經交代間舖同關門動作，所以可以淨係用時間短語回答。

          **試吓。** 答案要補返邊個短語嘅資料？答案：`فِي أَيِّ سَاعَةٍ`。
  - subskill_id: answering_information
    explanation: 鐘點短語可以獨立回答之前條問題。
    examples:
      - text: فِي السَّاعَةِ الْخَامِسَةِ.
        meaning: 五點。
        note: 現代標準阿拉伯語。回答關門時間，唔需要完整句子。
  - subskill_id: checking_facts
    explanation: 先提出一個說法，再加確認問題，可以核實候選事實。
    examples:
      - text: الْمَحَلُّ مُغْلَقٌ الْيَوْمَ، أَلَيْسَ كَذٰلِكَ؟
        meaning: 間舖今日冇開，係咪？
        note: 現代標準阿拉伯語。講者提出冇開門呢個可能答案，請對方確認。
  - subskill_id: useful_detail
    explanation: 位置細節可以分清對方要搵嘅入口。
    examples:
      - text: الْمَدْخَلُ بِجَانِبِ الْمَخْبَزِ.
        meaning: 入口喺麵包舖隔籬。
        note: 現代標準阿拉伯語。對方搵緊入口時用。
