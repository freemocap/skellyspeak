variety_sections:
  arabic-levantine:
    - subskill_id: asking_information
      explanation: A question about time helps you plan an action, such as reaching a shop before it
        closes. `أَيّ سَاعَة` asks ‘what time’. The rest of the question identifies the event you
        need to plan around. In this example, you are asking when the shop closes.
      examples:
        - text: أَيّ سَاعَة بِيْسَكِّرْ الْمَحَلّ؟
          meaning: "**The example.** “What time does the shop close?” `أَيّ سَاعَة` asks which hour;
            `بِيْسَكِّرْ` means closes in this spoken pattern; `الْمَحَلّ` names the shop. Notice
            the b-prefix on this ordinary present-tense verb."
          note: >-
            **Build an answer.** `عَ السَّاعَة خَمْسِة` means at five o'clock in this spoken model.
            The time phrase alone can answer the question.


            **Try it.** Would a bare yes answer the question? No: give the closing time. The
            question words tell you which information is missing.
    - subskill_id: answering_information
      explanation: A clock-time phrase can answer the preceding question on its own.
      examples:
        - text: عَ السَّاعَة خَمْسِة.
          meaning: At five o’clock.
          note: Levantine Arabic; conversational wording, with regional alternatives possible. Answer to the
            shop closing-time question; no full sentence is needed.
    - subskill_id: checking_facts
      explanation: A proposition followed by a confirmation question checks a candidate fact.
      examples:
        - text: الْمَحَلّ مْسَكَّرْ الْيَوْمْ، صَحّ؟
          meaning: The shop is closed today, right?
          note: Levantine Arabic; conversational wording, with regional alternatives possible. The speaker
            proposes closure and asks for confirmation.
    - subskill_id: useful_detail
      explanation: A location detail can distinguish the entrance a listener needs.
      examples:
        - text: الْمَدْخَلْ جَنْبْ الْمَخْبَزْ.
          meaning: The entrance is beside the bakery.
          note: Levantine Arabic; conversational wording, with regional alternatives possible. Use when the
            listener is trying to find the entrance.
