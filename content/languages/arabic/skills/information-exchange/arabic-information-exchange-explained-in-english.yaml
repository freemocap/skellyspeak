sections:
  - subskill_id: asking_information
    explanation: An interrogative time expression asks for the hour when an event happens.
    examples:
      - text: فِي أَيِّ سَاعَةٍ يُغْلِقُ الْمَحَلُّ؟
        meaning: What time does the shop close?
        note: Modern Standard Arabic. The question requests a closing time.
      - text: أَيّ سَاعَة بِيْسَكِّرْ الْمَحَلّ؟
        meaning: What time does the shop close?
        note: Levantine Arabic; conversational wording, with regional alternatives possible. The
          question requests a closing time.
  - subskill_id: answering_information
    explanation: A clock-time phrase can answer the preceding question on its own.
    examples:
      - text: فِي السَّاعَةِ الْخَامِسَةِ.
        meaning: At five o’clock.
        note: Modern Standard Arabic. Answer to the shop closing-time question; no full sentence is
          needed.
      - text: عَ السَّاعَة خَمْسِة.
        meaning: At five o’clock.
        note: Levantine Arabic; conversational wording, with regional alternatives possible. Answer to
          the shop closing-time question; no full sentence is needed.
  - subskill_id: checking_facts
    explanation: A proposition followed by a confirmation question checks a candidate fact.
    examples:
      - text: الْمَحَلُّ مُغْلَقٌ الْيَوْمَ، أَلَيْسَ كَذٰلِكَ؟
        meaning: The shop is closed today, right?
        note: Modern Standard Arabic. The speaker proposes closure and asks for confirmation.
      - text: الْمَحَلّ مْسَكَّرْ الْيَوْمْ، صَحّ؟
        meaning: The shop is closed today, right?
        note: Levantine Arabic; conversational wording, with regional alternatives possible. The speaker
          proposes closure and asks for confirmation.
  - subskill_id: useful_detail
    explanation: A location detail can distinguish the entrance a listener needs.
    examples:
      - text: الْمَدْخَلُ بِجَانِبِ الْمَخْبَزِ.
        meaning: The entrance is beside the bakery.
        note: Modern Standard Arabic. Use when the listener is trying to find the entrance.
      - text: الْمَدْخَلْ جَنْبْ الْمَخْبَزْ.
        meaning: The entrance is beside the bakery.
        note: Levantine Arabic; conversational wording, with regional alternatives possible. Use when
          the listener is trying to find the entrance.
