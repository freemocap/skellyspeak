sections:
  - subskill_id: asking_information
    explanation: When you know an event happens but do not know its time, you need a question that asks
      for that missing detail. `فِي أَيِّ سَاعَةٍ` means ‘at what time’. The example asks about a
      shop's closing time, so a useful answer gives an hour rather than just yes or no.
    examples:
      - text: فِي أَيِّ سَاعَةٍ يُغْلِقُ الْمَحَلُّ؟
        meaning: "**The example.** “What time does the shop close?” `فِي أَيِّ سَاعَةٍ` means at which hour.
          `يُغْلِقُ` is closes and `الْمَحَلُّ` is the shop. The preposition `فِي` begins the time
          expression; the verb precedes the shop in this example."
        note: >-
          **Build an answer.** `فِي السَّاعَةِ الْخَامِسَةِ` means at five o'clock. You can answer
          with this time phrase alone because the question already supplies the shop and action.


          **Try it.** Which phrase must the answer replace? Answer: `فِي أَيِّ سَاعَةٍ`.
  - subskill_id: answering_information
    explanation: When someone asks a shop’s closing time, the missing piece is the hour. A time phrase
      alone can be a complete conversational answer because the question already names the shop and
      action.
    examples:
      - text: فِي السَّاعَةِ الْخَامِسَةِ.
        meaning: "**The example.** At five o’clock. `فِي` means at here. `السَّاعَةِ` is the hour and
          `الْخَامِسَةِ` is fifth, giving at five o’clock. The clock expression uses an ordinal
          adjective that agrees with the feminine word for hour."
        note: "For six o’clock, use `فِي السَّاعَةِ السَّادِسَةِ`. Do not confuse at five with a duration of
          five hours. Try it: answer a closing-time question with six. Answer: `فِي السَّاعَةِ
          السَّادِسَةِ`; the ordinal changes while the time frame remains."
  - subskill_id: checking_facts
    explanation: You think the shop is closed today but want confirmation before making plans. State the
      information you believe and add a short question that lets the listener confirm or correct it.
    examples:
      - text: الْمَحَلُّ مُغْلَقٌ الْيَوْمَ، أَلَيْسَ كَذٰلِكَ؟
        meaning: "**The example.** The shop is closed today, right? `الْمَحَلُّ مُغْلَقٌ` says the shop is
          closed; `الْيَوْمَ` means today. `أَلَيْسَ كَذٰلِكَ؟` means isn’t that so? The statement
          names the candidate fact, and the final question checks it."
        note: "Replacing `الْيَوْمَ` with `غَدًا` checks tomorrow’s closure instead. This is not an open
          question about closing time; it proposes one specific fact. Try it: what should a useful
          correction address? Answer: whether the shop is closed today, rather than merely naming an
          unrelated opening hour."
  - subskill_id: useful_detail
    explanation: A listener is trying to find an entrance. Naming a nearby landmark helps them
      distinguish this entrance from other places, so the detail directly serves their next action.
    examples:
      - text: الْمَدْخَلُ بِجَانِبِ الْمَخْبَزِ.
        meaning: "**The example.** The entrance is beside the bakery. `الْمَدْخَلُ` is the entrance.
          `بِجَانِبِ` means beside, and `الْمَخْبَزِ` is the bakery. The place phrase locates the
          entrance relative to a landmark, without a separate present-tense is."
        note: "You can replace the landmark with `الْمَكْتَبِ`, the office: `الْمَدْخَلُ بِجَانِبِ
          الْمَكْتَبِ`. Beside does not mean inside. Try it: where should the listener look? Answer:
          next to the bakery, not in it; the relational phrase supplies that distinction."
