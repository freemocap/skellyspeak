varieties:
  arabic-levantine:
    disposition: supplement
    text: Conversational questions do not need an English-style auxiliary or a formal interrogative
      particle. شُو and إِيشْ are regional options for what.
    provenance: *a1
  arabic-modern-standard:
    disposition: supplement
    text: Modern Standard questions use formal interrogative expressions. A short relevant answer
      can omit information already supplied by the question.
    provenance: *a1
