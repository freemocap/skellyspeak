variety_sections:
  arabic-levantine:
    - subskill_id: asking_information
      explanation: A question about time helps you plan an action, such as reaching a shop before it
        closes. `أَيّ سَاعَة` asks ‘what time’. The rest of the question identifies the event you
        need to plan around. In this example, you are asking when the shop closes.
      examples:
        - text: أَيّ سَاعَة بِيْسَكِّرْ الْمَحَلّ؟
          meaning: "**The example.** “What time does the shop close?” `أَيّ سَاعَة` asks which hour;
            `بِيْسَكِّرْ` means closes in this spoken pattern; `الْمَحَلّ` names the shop. Notice
            the b-prefix on this ordinary present-tense verb."
          note: >-
            **Build an answer.** `عَ السَّاعَة خَمْسِة` means at five o'clock in this spoken model.
            The time phrase alone can answer the question.


            **Try it.** Would a bare yes answer the question? No: give the closing time. The
            question words tell you which information is missing.
    - subskill_id: answering_information
      explanation: When someone asks a shop’s closing time, the missing piece is the hour. A time phrase
        alone can be a complete conversational answer because the question already names the shop
        and action.
      examples:
        - text: عَ السَّاعَة خَمْسِة.
          meaning: "**The example.** At five o’clock. `عَ` introduces the time; `السَّاعَة` means the hour and
            `خَمْسِة` is five. Together the phrase gives at five o’clock. The spoken clock pattern
            uses the number here, and the answer need not repeat closes."
          note: "For six, use `عَ السَّاعَة سِتِّة`. Add morning or evening context if the hour could be
            ambiguous. Try it: does the phrase say the shop stays open for five hours? Answer: no;
            it gives the time on the clock, not the duration."
    - subskill_id: checking_facts
      explanation: You think the shop is closed today but want confirmation before making plans. State the
        information you believe and add a short question that lets the listener confirm or correct
        it.
      examples:
        - text: الْمَحَلّ مْسَكَّرْ الْيَوْمْ، صَحّ؟
          meaning: "**The example.** The shop is closed today, right? `الْمَحَلّ مْسَكَّرْ` means the shop is
            closed; `الْيَوْمْ` is today. The final `صَحّ؟` means right? It invites confirmation of
            the preceding statement rather than asking the listener for a new topic."
          note: "Without `صَحّ؟`, the words can simply announce closure. A questioning tone keeps the
            information open to correction. Try it: replace today with tomorrow. Answer: `الْمَحَلّ
            مْسَكَّرْ بُكْرَا، صَحّ؟`; the day changes, but the confirmation request remains."
    - subskill_id: useful_detail
      explanation: A listener is trying to find an entrance. Naming a nearby landmark helps them
        distinguish this entrance from other places, so the detail directly serves their next
        action.
      examples:
        - text: الْمَدْخَلْ جَنْبْ الْمَخْبَزْ.
          meaning: "**The example.** The entrance is beside the bakery. `الْمَدْخَلْ` is the entrance,
            `جَنْبْ` means beside, and `الْمَخْبَزْ` is the bakery. The landmark follows the
            location word. The whole sentence tells the listener where to look, rather than just
            listing two places."
          note: "For an office landmark, use `الْمَدْخَلْ جَنْبْ الْمَكْتَبْ`. Keep the relation word so the
            new landmark remains useful. Try it: what is lost if you only name the bakery? Answer:
            the relation between it and the entrance; `جَنْبْ` provides that relation."
