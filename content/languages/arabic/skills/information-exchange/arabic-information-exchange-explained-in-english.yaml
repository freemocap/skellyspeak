sections:
  - subskill_id: asking_information
    explanation: When you know an event happens but do not know its time, you need a question that asks
      for that missing detail. `فِي أَيِّ سَاعَةٍ` means ‘at what time’. The example asks about a
      shop's closing time, so a useful answer gives an hour rather than just yes or no.
    examples:
      - text: فِي أَيِّ سَاعَةٍ يُغْلِقُ الْمَحَلُّ؟
        meaning: "**The example.** “What time does the shop close?” `فِي أَيِّ سَاعَةٍ` means at which hour.
          `يُغْلِقُ` is closes and `الْمَحَلُّ` is the shop. The preposition `فِي` begins the time
          expression; the verb precedes the shop in this example."
        note: >-
          **Build an answer.** `فِي السَّاعَةِ الْخَامِسَةِ` means at five o'clock. You can answer
          with this time phrase alone because the question already supplies the shop and action.


          **Try it.** Which phrase must the answer replace? Answer: `فِي أَيِّ سَاعَةٍ`.
  - subskill_id: answering_information
    explanation: A clock-time phrase can answer the preceding question on its own.
    examples:
      - text: فِي السَّاعَةِ الْخَامِسَةِ.
        meaning: At five o’clock.
        note: Modern Standard Arabic. Answer to the shop closing-time question; no full sentence is needed.
  - subskill_id: checking_facts
    explanation: A proposition followed by a confirmation question checks a candidate fact.
    examples:
      - text: الْمَحَلُّ مُغْلَقٌ الْيَوْمَ، أَلَيْسَ كَذٰلِكَ؟
        meaning: The shop is closed today, right?
        note: Modern Standard Arabic. The speaker proposes closure and asks for confirmation.
  - subskill_id: useful_detail
    explanation: A location detail can distinguish the entrance a listener needs.
    examples:
      - text: الْمَدْخَلُ بِجَانِبِ الْمَخْبَزِ.
        meaning: The entrance is beside the bakery.
        note: Modern Standard Arabic. Use when the listener is trying to find the entrance.
