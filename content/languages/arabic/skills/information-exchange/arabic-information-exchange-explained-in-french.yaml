variety_sections:
  arabic-levantine:
    - subskill_id: asking_information
      explanation: "Une question sur l’heure vous aide à préparer une action, par exemple arriver au magasin avant
        sa fermeture. `أَيّ سَاعَة` demande « à quelle heure ». Le reste de la question nomme l’événement
        concerné : ici, la fermeture du magasin."
      examples:
        - text: أَيّ سَاعَة بِيْسَكِّرْ الْمَحَلّ؟
          meaning: "**L’exemple.** « À quelle heure ferme le magasin ? » `أَيّ سَاعَة` demande l’heure ; `بِيْسَكِّرْ`
            signifie « ferme » dans ce modèle parlé ; `الْمَحَلّ` désigne le magasin. Remarquez le préfixe b-
            du verbe au présent ordinaire."
          note: >-
            **Construisez une réponse.** `عَ السَّاعَة خَمْسِة` signifie « à cinq heures » dans ce modèle
            parlé. Cette seule expression horaire peut répondre à la question.


            **À vous.** Un simple oui répondrait-il ? Non : il faut donner l’heure de fermeture. Les mots
            interrogatifs indiquent l’information manquante.
    - subskill_id: answering_information
      explanation: Quand quelqu’un demande l’heure de fermeture d’un magasin, il manque seulement l’heure. Une
        expression horaire suffit comme réponse dans la conversation, puisque la question nomme déjà le
        magasin et l’action.
      examples:
        - text: عَ السَّاعَة خَمْسِة.
          meaning: "**L’exemple.** À cinq heures. `عَ` introduit l’heure ; `السَّاعَة` désigne l’heure et `خَمْسِة`
            signifie cinq. Ensemble, ils donnent le moment de cinq heures. Ce modèle oral emploie ici le
            nombre ; la réponse n’a pas besoin de répéter le verbe « fermer »."
          note: "Pour six heures, employez `عَ السَّاعَة سِتِّة`. Précisez le matin ou le soir si l’heure peut prêter à
            confusion. Essayez : cette expression signifie-t-elle que le magasin reste ouvert pendant cinq
            heures ? Réponse : non ; elle donne l’heure sur l’horloge, pas une durée."
    - subskill_id: checking_facts
      explanation: Vous pensez que le magasin est fermé aujourd’hui, mais voulez le confirmer avant de faire des
        projets. Énoncez l’information supposée et ajoutez une courte question permettant à l’autre personne
        de la confirmer ou de la corriger.
      examples:
        - text: الْمَحَلّ مْسَكَّرْ الْيَوْمْ، صَحّ؟
          meaning: "**L’exemple.** Le magasin est fermé aujourd’hui, c’est bien ça ? `الْمَحَلّ مْسَكَّرْ` exprime la
            fermeture ; `الْيَوْمْ` signifie aujourd’hui. Le `صَحّ؟` final demande confirmation de ce qui
            précède, et non des informations sur un nouveau sujet."
          note: "Sans `صَحّ؟`, la phrase pourrait simplement annoncer la fermeture. Une intonation interrogative laisse
            place à une correction. Essayez : remplacez aujourd’hui par demain. Réponse : `الْمَحَلّ مْسَكَّرْ
            بُكْرَا، صَحّ؟` ; le jour change, mais la demande de confirmation reste."
    - subskill_id: useful_detail
      explanation: Une personne cherche une entrée. Nommer un repère voisin lui permet de distinguer cette entrée
        d’autres lieux ; le détail sert directement son déplacement suivant.
      examples:
        - text: الْمَدْخَلْ جَنْبْ الْمَخْبَزْ.
          meaning: "**L’exemple.** L’entrée est à côté de la boulangerie. `الْمَدْخَلْ` désigne l’entrée, `جَنْبْ`
            signifie « à côté de » et `الْمَخْبَزْ` la boulangerie. Le repère suit le mot de relation.
            L’ensemble indique où chercher, plutôt que de simplement énumérer deux lieux."
          note: "Pour un bureau comme repère, employez `الْمَدْخَلْ جَنْبْ الْمَكْتَبْ`. Gardez le mot de relation afin
            que le nouveau repère reste utile. Essayez : que perd-on en nommant seulement la boulangerie ?
            Réponse : son lien spatial avec l’entrée ; `جَنْبْ` fournit ce lien."
