schema_version: 1
revision: arabic-skills-2026-10-04
language: arabic
skill_id: information_exchange
guidance: Look for an actual information question, relevant answer, factual check or useful
  detail. Questions can use an interrogative expression or suitable interrogative delivery;
  English-style auxiliary inversion is not required. A clock time can answer a recoverable
  closing-time question without repeating the event. Confirmation supplies a candidate
  proposition and asks whether it holds. Detail must help resolve the current information need,
  not merely lengthen a message. A copied question word without an identifiable request is
  absent. A capability-shaped question asking the listener to do something usually coordinates
  action rather than merely asking about capacity. A request to repeat an unheard message
  repairs conversation. Judge question forms and short answers in the selected variety,
  including colloquial particles and omitted material recoverable from the exchange.
