variety_sections:
  arabic-levantine:
    - subskill_id: asking_information
      explanation: "Una pregunta sobre la hora ayuda a planear una acción, como llegar a una tienda antes
        del cierre. `أَيّ سَاعَة` pregunta a qué hora. El resto identifica el suceso que necesitas
        tener en cuenta: aquí, el cierre de la tienda."
      examples:
        - text: أَيّ سَاعَة بِيْسَكِّرْ الْمَحَلّ؟
          meaning: "**El ejemplo.** ¿A qué hora cierra la tienda? `أَيّ سَاعَة` pregunta qué hora;
            `بِيْسَكِّرْ` significa cierra en este patrón hablado y `الْمَحَلّ` nombra la tienda.
            Observa el prefijo b de este presente habitual."
          note: >-
            **Construye una respuesta.** `عَ السَّاعَة خَمْسِة` significa a las cinco en este modelo
            hablado. La expresión horaria basta para contestar.


            **Practica.** ¿Responder solo sí resolvería la pregunta? No: hay que dar la hora de
            cierre. Las palabras interrogativas indican el dato faltante.
    - subskill_id: answering_information
      explanation: Si alguien pregunta a qué hora cierra una tienda, falta la hora. Una expresión de
        tiempo puede responder por completo en la conversación porque la pregunta ya nombra la
        tienda y el cierre.
      examples:
        - text: عَ السَّاعَة خَمْسِة.
          meaning: "**El ejemplo.** A las cinco. `عَ` introduce la hora; `السَّاعَة` significa la hora y
            `خَمْسِة`, cinco. Juntas forman la hora del reloj. Este patrón hablado usa aquí el
            número, sin repetir el verbo cerrar."
          note: "Para las seis, usa `عَ السَّاعَة سِتِّة`. Añade contexto de mañana o tarde si la hora puede
            confundirse. **Practica:** ¿dice la frase que la tienda permanece abierta cinco horas?
            Respuesta: no; da una hora del reloj, no una duración."
    - subskill_id: checking_facts
      explanation: Crees que la tienda está cerrada hoy, pero quieres confirmarlo antes de hacer planes.
        Enuncia lo que crees y añade una pregunta breve para que la otra persona lo confirme o
        corrija.
      examples:
        - text: الْمَحَلّ مْسَكَّرْ الْيَوْمْ، صَحّ؟
          meaning: "**El ejemplo.** La tienda está cerrada hoy, ¿verdad? `الْمَحَلّ مْسَكَّرْ` significa que
            está cerrada; `الْيَوْمْ` es hoy. El `صَحّ؟` final equivale a ¿verdad? e invita a
            confirmar la afirmación anterior."
          note: "Sin `صَحّ؟`, las palabras pueden simplemente anunciar el cierre. La entonación interrogativa
            permite corregir el dato. **Practica:** sustituye hoy por mañana. Respuesta: `الْمَحَلّ
            مْسَكَّرْ بُكْرَا، صَحّ؟`; cambia el día y se mantiene la petición de confirmación."
    - subskill_id: useful_detail
      explanation: Alguien intenta encontrar una entrada. Nombrar un punto de referencia cercano permite
        distinguirla de otros lugares; el detalle sirve directamente a su próxima acción.
      examples:
        - text: الْمَدْخَلْ جَنْبْ الْمَخْبَزْ.
          meaning: "**El ejemplo.** La entrada está junto a la panadería. `الْمَدْخَلْ` es la entrada,
            `جَنْبْ` significa al lado de y `الْمَخْبَزْ`, la panadería. La referencia sigue a la
            palabra de ubicación. La frase entera indica dónde mirar, no solo enumera dos lugares."
          note: "Para usar una oficina de referencia, di `الْمَدْخَلْ جَنْبْ الْمَكْتَبْ`. Conserva la palabra
            de relación para que el nuevo punto sea útil. **Practica:** ¿qué se pierde si solo
            nombras la panadería? Respuesta: la relación entre ella y la entrada; `جَنْبْ` la
            especifica."
