sections:
  - subskill_id: asking_information
    explanation: Si sabes que un suceso ocurre pero desconoces cuándo, necesitas preguntar por ese dato.
      `فِي أَيِّ سَاعَةٍ` significa a qué hora. El ejemplo pregunta por el cierre de una tienda, así
      que una respuesta útil indica una hora, no solo sí o no.
    examples:
      - text: فِي أَيِّ سَاعَةٍ يُغْلِقُ الْمَحَلُّ؟
        meaning: "**El ejemplo.** ¿A qué hora cierra la tienda? `فِي أَيِّ سَاعَةٍ` pregunta en qué hora.
          `يُغْلِقُ` significa cierra y `الْمَحَلُّ`, la tienda. La preposición `فِي` inicia la
          expresión temporal; en este ejemplo el verbo precede a la tienda."
        note: >-
          **Construye una respuesta.** `فِي السَّاعَةِ الْخَامِسَةِ` significa a las cinco. Basta
          con esa expresión de tiempo porque la pregunta ya identifica la tienda y la acción.


          **Practica.** ¿Qué expresión debe sustituir la respuesta? Respuesta: `فِي أَيِّ سَاعَةٍ`.
  - subskill_id: answering_information
    explanation: Si alguien pregunta a qué hora cierra una tienda, falta la hora. Una expresión de
      tiempo puede responder por completo en la conversación porque la pregunta ya nombra la tienda
      y el cierre.
    examples:
      - text: فِي السَّاعَةِ الْخَامِسَةِ.
        meaning: "**El ejemplo.** A las cinco. Aquí `فِي` significa a. `السَّاعَةِ` es la hora y
          `الْخَامِسَةِ`, quinta; juntos indican las cinco. La expresión horaria usa un ordinal que
          concuerda con la palabra femenina para hora."
        note: "Para las seis, usa `فِي السَّاعَةِ السَّادِسَةِ`. No confundas la hora cinco con una duración
          de cinco horas. **Practica:** contesta que la tienda cierra a las seis. Respuesta: `فِي
          السَّاعَةِ السَّادِسَةِ`; cambia el ordinal y se conserva la estructura horaria."
  - subskill_id: checking_facts
    explanation: Crees que la tienda está cerrada hoy, pero quieres confirmarlo antes de hacer planes.
      Enuncia lo que crees y añade una pregunta breve para que la otra persona lo confirme o
      corrija.
    examples:
      - text: الْمَحَلُّ مُغْلَقٌ الْيَوْمَ، أَلَيْسَ كَذٰلِكَ؟
        meaning: "**El ejemplo.** La tienda está cerrada hoy, ¿verdad? `الْمَحَلُّ مُغْلَقٌ` indica que la
          tienda está cerrada; `الْيَوْمَ` es hoy. `أَلَيْسَ كَذٰلِكَ؟` significa ¿no es así? La
          afirmación plantea el dato y la pregunta final lo comprueba."
        note: "Cambiar `الْيَوْمَ` por `غَدًا` comprueba si estará cerrada mañana. No es una pregunta
          abierta sobre la hora de cierre; propone un hecho específico. **Practica:** ¿a qué debe
          referirse una corrección útil? Respuesta: a si la tienda está cerrada hoy, no a una hora
          de apertura sin relación."
  - subskill_id: useful_detail
    explanation: Alguien intenta encontrar una entrada. Nombrar un punto de referencia cercano permite
      distinguirla de otros lugares; el detalle sirve directamente a su próxima acción.
    examples:
      - text: الْمَدْخَلُ بِجَانِبِ الْمَخْبَزِ.
        meaning: "**El ejemplo.** La entrada está junto a la panadería. `الْمَدْخَلُ` es la entrada.
          `بِجَانِبِ` significa junto a y `الْمَخْبَزِ`, la panadería. La expresión sitúa la entrada
          respecto de una referencia, sin un verbo presente separado equivalente a está."
        note: "Puedes usar `الْمَكْتَبِ`, la oficina, como nueva referencia: `الْمَدْخَلُ بِجَانِبِ
          الْمَكْتَبِ`. Junto a no significa dentro. **Practica:** ¿dónde debe buscarse la entrada?
          Respuesta: al lado de la panadería, no dentro; la expresión de relación marca esa
          diferencia."
