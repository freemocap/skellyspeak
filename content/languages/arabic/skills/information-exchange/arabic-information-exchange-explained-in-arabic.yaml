variety_sections:
  arabic-levantine:
    - subskill_id: asking_information
      explanation: يساعدك سؤال الوقت على التخطيط لفعل، مثل الوصول إلى متجر قبل إغلاقه. تسأل `أَيّ سَاعَة`
        عن الوقت. وتحدد بقية الجملة الحدث الذي تخطط حوله. في هذا المثال تسأل متى يغلق المتجر.
      examples:
        - text: أَيّ سَاعَة بِيْسَكِّرْ الْمَحَلّ؟
          meaning: "**المثال.** في أي ساعة يغلق المتجر؟ تسأل `أَيّ سَاعَة` عن الساعة؛ وتعني `بِيْسَكِّرْ`
            «يغلق» في هذا النمط المنطوق؛ ويسمّي `الْمَحَلّ` المتجر. لاحظ باء المضارع في هذا الفعل
            الحاضر المعتاد."
          note: >-
            **كوّن جوابًا.** تعني `عَ السَّاعَة خَمْسِة` «في الخامسة» في هذا النموذج المنطوق. تكفي
            عبارة الوقت وحدها للإجابة.


            **جرّب.** هل تجيب «نعم» وحدها عن السؤال؟ لا؛ اذكر وقت الإغلاق. تبيّن كلمات السؤال
            المعلومة الناقصة.
    - subskill_id: answering_information
      explanation: عندما يسأل شخص عن وقت إغلاق متجر، تكون الساعة هي المعلومة الناقصة. قد تكون عبارة الوقت
        وحدها جوابًا كاملًا في الحوار لأن السؤال يسمّي المتجر والفعل بالفعل.
      examples:
        - text: عَ السَّاعَة خَمْسِة.
          meaning: "**المثال.** في الساعة الخامسة. تقدّم `عَ` الوقت؛ وتعني `السَّاعَة` الساعة، و`خَمْسِة`
            خمسة. تحدد العبارة معًا موعد الخامسة. يستعمل نمط الساعة المنطوق العدد هنا، ولا يحتاج
            الجواب إلى تكرار فعل الإغلاق."
          note: "للسادسة استعمل `عَ السَّاعَة سِتِّة`. أضف سياق الصباح أو المساء إذا احتمل الوقت اللبس.
            **جرّب:** هل تقول العبارة إن المتجر يظل مفتوحًا خمس ساعات؟ الإجابة: لا؛ تحدد وقتًا على
            الساعة لا مدة."
    - subskill_id: checking_facts
      explanation: تظن أن المتجر مغلق اليوم لكنك تريد التأكد قبل وضع الخطط. اذكر المعلومة التي تعتقدها، ثم
        أضف سؤالًا قصيرًا يتيح للمخاطَب تأكيدها أو تصحيحها.
      examples:
        - text: الْمَحَلّ مْسَكَّرْ الْيَوْمْ، صَحّ؟
          meaning: "**المثال.** المتجر مغلق اليوم، صحيح؟ تعني `الْمَحَلّ مْسَكَّرْ` أن المتجر مغلق؛
            و`الْيَوْمْ` اليوم. تعني `صَحّ؟` الأخيرة «صحيح؟». تطلب تأكيد الجملة السابقة بدل فتح
            موضوع جديد."
          note: "من دون `صَحّ؟` قد تعلن الكلمات الإغلاق فقط. وتبقي نبرة السؤال المعلومة قابلة للتصحيح.
            **جرّب:** استبدل اليوم بالغد. الإجابة: `الْمَحَلّ مْسَكَّرْ بُكْرَا، صَحّ؟`؛ يتغير اليوم
            ويبقى طلب التأكيد."
    - subskill_id: useful_detail
      explanation: يحاول المستمع العثور على مدخل. يساعد ذكر معلم قريب على تمييزه من أماكن أخرى، فيخدم
        التفصيل خطوته التالية مباشرة.
      examples:
        - text: الْمَدْخَلْ جَنْبْ الْمَخْبَزْ.
          meaning: "**المثال.** المدخل بجانب المخبز. `الْمَدْخَلْ` هو المدخل، وتعني `جَنْبْ` «بجانب»،
            و`الْمَخْبَزْ` هو المخبز. يأتي المعلم بعد كلمة الموقع. تخبر الجملة كلها المستمع أين ينظر
            بدل مجرد سرد مكانين."
          note: "إذا كان المعلم مكتبًا، استعمل `الْمَدْخَلْ جَنْبْ الْمَكْتَبْ`. أبقِ كلمة العلاقة كي يظل
            المعلم الجديد مفيدًا. **جرّب:** ما الذي تفقده إذا ذكرت المخبز وحده؟ الإجابة: العلاقة
            بينه وبين المدخل؛ وتقدّم `جَنْبْ` تلك العلاقة."
