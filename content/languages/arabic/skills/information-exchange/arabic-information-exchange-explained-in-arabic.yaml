sections:
  - subskill_id: asking_information
    explanation: عندما تعرف أن حدثًا سيقع لكنك لا تعرف وقته، تحتاج إلى سؤال عن هذا التفصيل الناقص. تعني
      `فِي أَيِّ سَاعَةٍ` «في أي وقت». يسأل المثال عن وقت إغلاق متجر، لذا يذكر الجواب المفيد ساعةً
      بدل «نعم» أو «لا» فقط.
    examples:
      - text: فِي أَيِّ سَاعَةٍ يُغْلِقُ الْمَحَلُّ؟
        meaning: "**المثال.** في أي ساعة يغلق المتجر؟ تعني `فِي أَيِّ سَاعَةٍ` السؤال عن الساعة. وتعني
          `يُغْلِقُ` «يغلق»، و`الْمَحَلُّ` «المتجر». يبدأ حرف الجر `فِي` تعبير الوقت؛ ويسبق الفعل
          المتجر في هذا المثال."
        note: >-
          **كوّن جوابًا.** تعني `فِي السَّاعَةِ الْخَامِسَةِ` الساعة الخامسة. يمكنك الإجابة بعبارة
          الوقت وحدها لأن السؤال قد ذكر المتجر والفعل.


          **جرّب.** أي عبارة ينبغي أن يستبدلها الجواب؟ الإجابة: `فِي أَيِّ سَاعَةٍ`.
  - subskill_id: answering_information
    explanation: عندما يسأل شخص عن وقت إغلاق متجر، تكون الساعة هي المعلومة الناقصة. قد تكون عبارة الوقت
      وحدها جوابًا كاملًا في الحوار لأن السؤال يسمّي المتجر والفعل بالفعل.
    examples:
      - text: فِي السَّاعَةِ الْخَامِسَةِ.
        meaning: "**المثال.** في الساعة الخامسة. تعني `فِي` هنا «في». `السَّاعَةِ` هي الساعة،
          و`الْخَامِسَةِ` ترتيبها الخامس، فتحددان الخامسة. يستعمل تعبير الساعة صفةً ترتيبية تطابق
          كلمة «ساعة» المؤنثة."
        note: "للسادسة استعمل `فِي السَّاعَةِ السَّادِسَةِ`. لا تخلط بين موعد الخامسة ومدة خمس ساعات.
          **جرّب:** أجب عن سؤال وقت الإغلاق بالسادسة. الإجابة: `فِي السَّاعَةِ السَّادِسَةِ`؛ تتغير
          الصفة الترتيبية ويبقى إطار الوقت."
  - subskill_id: checking_facts
    explanation: تظن أن المتجر مغلق اليوم لكنك تريد التأكد قبل وضع الخطط. اذكر المعلومة التي تعتقدها، ثم
      أضف سؤالًا قصيرًا يتيح للمخاطَب تأكيدها أو تصحيحها.
    examples:
      - text: الْمَحَلُّ مُغْلَقٌ الْيَوْمَ، أَلَيْسَ كَذٰلِكَ؟
        meaning: "**المثال.** المتجر مغلق اليوم، أليس كذلك؟ تقول `الْمَحَلُّ مُغْلَقٌ` إن المتجر مغلق؛ وتعني
          `الْيَوْمَ` «اليوم». وتعني `أَلَيْسَ كَذٰلِكَ؟` «أليس كذلك؟». تسمّي الجملة المعلومة
          المقترحة، ويتحقق منها السؤال الأخير."
        note: "إذا استبدلت `الْيَوْمَ` بـ`غَدًا` تحققت من إغلاق الغد بدلًا من اليوم. ليس هذا سؤالًا مفتوحًا
          عن وقت الإغلاق؛ بل يقترح واقعة محددة. **جرّب:** ماذا ينبغي أن يتناول التصحيح المفيد؟
          الإجابة: هل المتجر مغلق اليوم، لا مجرد ذكر ساعة فتح غير مرتبطة."
  - subskill_id: useful_detail
    explanation: يحاول المستمع العثور على مدخل. يساعد ذكر معلم قريب على تمييزه من أماكن أخرى، فيخدم
      التفصيل خطوته التالية مباشرة.
    examples:
      - text: الْمَدْخَلُ بِجَانِبِ الْمَخْبَزِ.
        meaning: "**المثال.** المدخل بجانب المخبز. `الْمَدْخَلُ` هو المدخل. وتعني `بِجَانِبِ` «بجانب»،
          و`الْمَخْبَزِ` هو المخبز. تحدد عبارة المكان المدخل بالنسبة إلى معلم، من غير فعل حاضر منفصل
          بمعنى «is»."
        note: "يمكنك استبدال المعلم بـ`الْمَكْتَبِ`، أي المكتب: `الْمَدْخَلُ بِجَانِبِ الْمَكْتَبِ`. لا تعني
          «بجانب» «داخل». **جرّب:** أين ينبغي أن ينظر المستمع؟ الإجابة: بجوار المخبز لا داخله؛ وتوضح
          عبارة العلاقة هذا الفرق."
