sections:
  - subskill_id: asking_information
    explanation: Quando você sabe que um acontecimento ocorrerá, mas não sabe a hora, precisa perguntar pelo
      detalhe ausente. `فِي أَيِّ سَاعَةٍ` significa em que horário. O exemplo pergunta a hora de fechamento
      de uma loja; uma resposta útil fornece uma hora, não apenas sim ou não.
    examples:
      - text: فِي أَيِّ سَاعَةٍ يُغْلِقُ الْمَحَلُّ؟
        meaning: "**O exemplo.** A que horas a loja fecha? `فِي أَيِّ سَاعَةٍ` significa em qual hora. `يُغْلِقُ`
          significa fecha e `الْمَحَلُّ` é a loja. A preposição `فِي` inicia a expressão temporal; neste
          exemplo, o verbo precede a loja."
        note: >-
          **Forme uma resposta.** `فِي السَّاعَةِ الْخَامِسَةِ` significa às cinco. Essa expressão de horário
          pode responder sozinha porque a pergunta já indica a loja e a ação.


          **Experimente.** Que parte a resposta deve substituir? Resposta: `فِي أَيِّ سَاعَةٍ`.
  - subskill_id: answering_information
    explanation: Quando alguém pergunta a hora de fechamento de uma loja, a informação ausente é a hora. A
      expressão temporal sozinha pode ser uma resposta completa na conversa porque a pergunta já nomeia a loja
      e a ação.
    examples:
      - text: فِي السَّاعَةِ الْخَامِسَةِ.
        meaning: "**O exemplo.** Às cinco. `فِي` significa aqui em ou às. `السَّاعَةِ` é a hora e `الْخَامِسَةِ` é
          quinta, formando cinco horas. A expressão usa um adjetivo ordinal que concorda com a palavra
          feminina para hora."
        note: "Para seis horas, use `فِي السَّاعَةِ السَّادِسَةِ`. Não confunda « às cinco » com uma duração de cinco
          horas. Experimente responder a uma pergunta sobre fechamento com seis. Resposta: `فِي السَّاعَةِ
          السَّادِسَةِ`; o ordinal muda, enquanto a estrutura horária permanece."
  - subskill_id: checking_facts
    explanation: Você pensa que a loja está fechada hoje, mas quer confirmar antes de fazer planos. Apresente a
      informação que acredita ser verdadeira e acrescente uma pergunta curta que permita confirmação ou
      correção.
    examples:
      - text: الْمَحَلُّ مُغْلَقٌ الْيَوْمَ، أَلَيْسَ كَذٰلِكَ؟
        meaning: "**O exemplo.** A loja está fechada hoje, certo? `الْمَحَلُّ مُغْلَقٌ` diz que a loja está fechada;
          `الْيَوْمَ` significa hoje. `أَلَيْسَ كَذٰلِكَ؟` significa não é assim? A afirmação apresenta o fato
          proposto e a pergunta final o verifica."
        note: "Substituir `الْيَوْمَ` por `غَدًا` verifica o fechamento de amanhã. Esta não é uma pergunta aberta
          sobre horário de fechamento; propõe um fato específico. Experimente: o que uma correção útil deve
          abordar? Resposta: se a loja está fechada hoje, em vez de apenas mencionar uma hora de abertura sem
          relação."
  - subskill_id: useful_detail
    explanation: A outra pessoa tenta encontrar uma entrada. Nomear um ponto de referência próximo a ajuda a
      distinguir essa entrada de outros lugares; o detalhe serve diretamente à sua próxima ação.
    examples:
      - text: الْمَدْخَلُ بِجَانِبِ الْمَخْبَزِ.
        meaning: "**O exemplo.** A entrada fica ao lado da padaria. `الْمَدْخَلُ` é a entrada. `بِجَانِبِ` significa
          ao lado de, e `الْمَخْبَزِ` é a padaria. A expressão de lugar situa a entrada em relação ao marco,
          sem um verbo separado para « ser » no presente."
        note: "É possível trocar o marco por `الْمَكْتَبِ`, o escritório: `الْمَدْخَلُ بِجَانِبِ الْمَكْتَبِ`. Ao lado
          não significa dentro. Experimente: onde a pessoa deve procurar? Resposta: ao lado da padaria, não
          dentro dela; a expressão relacional traz essa distinção."
