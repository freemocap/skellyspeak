variety_sections:
  arabic-levantine:
    - subskill_id: asking_information
      explanation: "Perguntar a hora ajuda a planejar uma ação, como chegar à loja antes de ela fechar. `أَيّ
        سَاعَة` pergunta qual hora. O restante da pergunta identifica o acontecimento que orienta seu plano:
        aqui, o fechamento da loja."
      examples:
        - text: أَيّ سَاعَة بِيْسَكِّرْ الْمَحَلّ؟
          meaning: "**O exemplo.** A que horas a loja fecha? `أَيّ سَاعَة` pergunta a hora; `بِيْسَكِّرْ` significa
            fecha nesse padrão falado; `الْمَحَلّ` nomeia a loja. Observe o prefixo b- nesse verbo comum do
            presente."
          note: >-
            **Forme uma resposta.** `عَ السَّاعَة خَمْسِة` significa às cinco nesse modelo falado. A expressão
            de horário pode responder sozinha.


            **Experimente.** Um simples sim responderia à pergunta? Não: é preciso dar a hora de fechamento.
            As palavras interrogativas mostram qual informação falta.
    - subskill_id: answering_information
      explanation: Quando alguém pergunta a hora de fechamento de uma loja, falta a hora. Uma expressão temporal
        sozinha pode dar uma resposta conversacional completa porque loja e ação já foram nomeadas.
      examples:
        - text: عَ السَّاعَة خَمْسِة.
          meaning: "**O exemplo.** Às cinco. `عَ` introduz o horário; `السَّاعَة` significa a hora e `خَمْسِة` é cinco.
            Juntas, as palavras indicam cinco horas. O padrão falado usa o número aqui, sem precisar repetir o
            verbo fechar."
          note: "Para seis, use `عَ السَّاعَة سِتِّة`. Acrescente contexto de manhã ou noite se a hora for ambígua.
            Experimente: a expressão diz que a loja fica aberta por cinco horas? Resposta: não; ela fornece a
            hora no relógio, não uma duração."
    - subskill_id: checking_facts
      explanation: Você acha que a loja está fechada hoje, mas quer confirmação antes de planejar. Diga o que
        acredita e acrescente uma pergunta curta que permita corrigir ou confirmar o fato.
      examples:
        - text: الْمَحَلّ مْسَكَّرْ الْيَوْمْ، صَحّ؟
          meaning: "**O exemplo.** A loja está fechada hoje, certo? `الْمَحَلّ مْسَكَّرْ` significa que a loja está
            fechada; `الْيَوْمْ` é hoje. O `صَحّ؟` final significa certo? Ele pede confirmação da afirmação
            anterior, em vez de iniciar outro assunto."
          note: "Sem `صَحّ؟`, as palavras podem simplesmente anunciar o fechamento. A entonação de pergunta mantém a
            informação aberta a correção. Experimente trocar hoje por amanhã. Resposta: `الْمَحَلّ مْسَكَّرْ
            بُكْرَا، صَحّ؟`; o dia muda, mas o pedido de confirmação permanece."
    - subskill_id: useful_detail
      explanation: A outra pessoa procura uma entrada. Nomear um marco próximo ajuda a distingui-la de outros
        lugares e serve diretamente à ação de encontrá-la.
      examples:
        - text: الْمَدْخَلْ جَنْبْ الْمَخْبَزْ.
          meaning: "**O exemplo.** A entrada fica ao lado da padaria. `الْمَدْخَلْ` é a entrada, `جَنْبْ` significa ao
            lado e `الْمَخْبَزْ` é a padaria. O marco vem depois da palavra de localização. A frase inteira
            indica onde procurar, em vez de apenas enumerar dois lugares."
          note: "Com um escritório como marco, use `الْمَدْخَلْ جَنْبْ الْمَكْتَبْ`. Mantenha a palavra de relação para
            que o novo marco seja útil. Experimente: o que se perde se você só disser « a padaria »? Resposta:
            a relação entre ela e a entrada; `جَنْبْ` fornece essa relação."
