varieties:
  arabic-levantine:
    disposition: supplement
    text: Recognize conversational reason, result and contrast forms such as لِأَنّ, عَشَانْ هَيْكْ
      and بَسّ. Conditional verb forms depend on meaning and construction; do not transfer
      formal mood endings into speech.
    provenance: *a1
  arabic-modern-standard:
    disposition: supplement
    text: Evaluate formal causal and conditional syntax, including clause linking appropriate to the
      consequence. A perfect-form verb after إِذَا can refer to a future condition.
    provenance: *a1
