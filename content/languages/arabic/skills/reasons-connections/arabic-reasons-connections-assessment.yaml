language: arabic
skill_id: reasons_connections
guidance: Assess causes, consequences, conditions, contrast and support for a claim. A reason
  connective links an outcome to its cause or motivation. A result expression presents the
  following event as a consequence. A conditional establishes a dependency rather than asserting
  that its antecedent happened. Contrast requires opposed expectations or alternatives, not just
  two adjacent clauses. Supporting a claim requires relevant evidence and a recoverable claim;
  naming a connective alone is absent. A because-fragment can succeed after a clear
  why-question. Do not impose English conditional tense matching on Arabic constructions.
  Recognize selected-variety connectives and evaluate the relationship actually expressed,
  allowing natural omitted material without inventing the missing relationship.
