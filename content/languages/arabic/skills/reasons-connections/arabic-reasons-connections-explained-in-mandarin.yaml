sections:
  - subskill_id: causes_reasons
    explanation: 别人问你为什么待在家里时，说明自己生病，就把决定与促成它的情况连起来。这里说话人是女性。
    examples:
      - text: بَقِيتُ فِي الْبَيْتِ لِأَنَّنِي مَرِيضَةٌ.
        meaning: "**例句。** 我因生病而待在家里。`بَقِيتُ` 意为我留着，`فِي الْبَيْتِ` 是在家，`لِأَنَّنِي` 意为因为我。`مَرِيضَةٌ`
          是与女性说话人一致的生病。过去式动词把待在家的事放到以前；原因分句解释当时的决定。"
        note: 男性说话人用 `مَرِيضٌ`；“我待着”的动词形式不变。原因跟在“因为”后，并非第二件无关事件。试一试：哪部分回答了为什么？答案：`لِأَنَّنِي مَرِيضَةٌ`，把生病与待在家里连起来。
  - subskill_id: consequences
    explanation: 你到商店发现已关门，于是决定明天再来。结果表达让听话人知道新计划怎样由眼前情况引出。
    examples:
      - text: الْمَحَلُّ مُغْلَقٌ، لِذٰلِكَ سَنَعُودُ غَدًا.
        meaning: "**例句。** 商店关门了，所以我们明天回来。`الْمَحَلُّ مُغْلَقٌ` 表示商店关着。`لِذٰلِكَ` 意为因此。`سَنَعُودُ` 是我们会回来，`غَدًا`
          是明天。第一句给出情况，第二句是对此采取的行动。"
        note: 将来前缀 `سَـ` 附在“我们”形式 `نَعُودُ` 前。比较普通的“和”：它未必解释为什么计划回来。试一试：哪个短语明确把关门与新计划连起来？答案：`لِذٰلِكَ`；它指回商店关着这个原因。
  - subskill_id: conditions
    explanation: 你在说明到达后的安排，但不知道对方是否会早到。条件分句使等待指示只在早到时适用。
    examples:
      - text: إِذَا وَصَلْتَ مُبَكِّرًا، فَانْتَظِرْ هُنَا.
        meaning: "**例句。** 如果你早到，就在这里等。`إِذَا` 引出如果；`وَصَلْتَ` 形式上是对一名男子说的“你到了”。这里它描述未来可能的到达，不是已发生的过去事实。`مُبَكِّرًا`
          是早；`فَانْتَظِرْ هُنَا` 告诉他那就等在这里。"
        note: 附着的 `فَـ` 把条件与这个命令连起来。不能因为 `إِذَا` 后动词是完成式形态，就自动读成过去。试一试：即使没有早到，听话人也必须等吗？答案：这句话只在所述早到条件下给出等待指示。
  - subskill_id: contrast
    explanation: 小箱子看上去可能容易提，却很重。“但是”把两个真实描述连在一起，并说明为什么第二点可能让人意外。
    examples:
      - text: هٰذَا الصُّنْدُوقُ صَغِيرٌ وَلٰكِنَّهُ ثَقِيلٌ.
        meaning: "**例句。** 这个箱子小，但很重。`هٰذَا الصُّنْدُوقُ` 指这个箱子；`صَغِيرٌ` 是小。`وَلٰكِنَّهُ` 意为但是它，词尾指回箱子。`ثَقِيلٌ`
          意为重。对比并没有否认箱子小。"
        note: "`وَلٰكِنَّهُ` 的词尾与阳性的“箱子”名词相应。若所指对象不同，词尾和形容词可能都要改变。试一试：哪两种性质仍都为真？答案：小和重；“但是”对比的是预期，不是否定事实。"
  - subskill_id: supporting_claims
    explanation: 如果你推荐某条路线较短，别人可能问你凭什么知道。提到测量结果，会为比较提供具体依据，而不是重复个人偏好。
    examples:
      - text: هٰذَا الطَّرِيقُ أَقْصَرُ، لِأَنَّنَا قِسْنَا الْمَسَافَةَ.
        meaning: "**例句。** 这条路更短，因为我们测了距离。`هٰذَا الطَّرِيقُ أَقْصَرُ` 表示这条路较短。`لِأَنَّنَا` 意为因为我们；`قِسْنَا`
          是我们测量了，`الْمَسَافَةَ` 是距离。过去式动词里的“我们”词尾指出测量的人。"
        note: 只有测量与所比较的路线相关，它才是依据。别处的“因为”分句可能说明个人动机；这里它说明何以知道。试一试：哪些词指出证据？答案：`قِسْنَا الْمَسَافَةَ`，报告支持主张的测量。
