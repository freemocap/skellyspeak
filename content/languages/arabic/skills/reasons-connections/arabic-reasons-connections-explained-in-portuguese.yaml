sections:
  - subskill_id: causes_reasons
    explanation: Uma mulher explica por que ficou em casa. A relação causal liga sua doença à decisão, em vez de
      apresentar dois fatos sem conexão.
    examples:
      - text: بَقِيتُ فِي الْبَيْتِ لِأَنَّنِي مَرِيضَةٌ.
        meaning: "**O exemplo.** Fiquei em casa porque estava doente. `بَقِيتُ` significa eu fiquei, `فِي الْبَيْتِ`
          indica em casa, e `لِأَنَّنِي` significa porque eu. `مَرِيضَةٌ` expressa a doença com concordância
          feminina. O verbo situa a permanência no passado; a oração final explica sua razão."
        note: "Um homem usa `مَرِيضٌ`; a forma de « eu fiquei » não muda. A causa segue a palavra « porque », em vez
          de ser outro acontecimento sem relação. Experimente: que parte responde « por quê »? Resposta:
          `لِأَنَّنِي مَرِيضَةٌ`, ligando a doença ao fato de ficar em casa."
  - subskill_id: consequences
    explanation: Você chega a uma loja fechada e decide voltar amanhã. Uma expressão de consequência mostra como o
      novo plano decorre da situação encontrada.
    examples:
      - text: الْمَحَلُّ مُغْلَقٌ، لِذٰلِكَ سَنَعُودُ غَدًا.
        meaning: "**O exemplo.** A loja está fechada, então voltaremos amanhã. `الْمَحَلُّ مُغْلَقٌ` informa o
          fechamento. `لِذٰلِكَ` significa portanto ou por essa razão. `سَنَعُودُ` significa voltaremos e
          `غَدًا` amanhã. A primeira oração apresenta a situação; a segunda dá a reação a ela."
        note: "O prefixo de futuro `سَـ` se liga à forma de « nós voltamos » `نَعُودُ`. Um simples « e » não precisa
          explicar por que a volta foi planejada. Experimente: que expressão liga explicitamente o fechamento
          ao plano? Resposta: `لِذٰلِكَ`; ela retoma a loja fechada como razão."
  - subskill_id: conditions
    explanation: Você dá orientações para a chegada, mas não sabe se a pessoa virá cedo. Uma oração com « se » faz
      a instrução de esperar valer apenas nessa circunstância.
    examples:
      - text: إِذَا وَصَلْتَ مُبَكِّرًا، فَانْتَظِرْ هُنَا.
        meaning: "**O exemplo.** Se você chegar cedo, espere aqui. `إِذَا` introduz « se »; `وَصَلْتَ` tem a forma de
          « você chegou », dirigida a um homem, mas aqui descreve uma chegada futura possível, não um fato
          passado. `مُبَكِّرًا` significa cedo; `فَانْتَظِرْ هُنَا` manda então esperar aqui."
        note: "O `فَـ` ligado relaciona a condição à ordem. Uma forma verbal completiva depois de `إِذَا` não indica
          passado automaticamente. Experimente: é preciso esperar mesmo sem chegar cedo? Resposta: esta frase
          só dá a instrução sob a condição de chegada antecipada."
  - subskill_id: contrast
    explanation: Uma caixa pequena pode parecer fácil de levantar e ainda assim ser pesada. O contraste liga duas
      descrições verdadeiras e mostra por que a segunda pode surpreender.
    examples:
      - text: هٰذَا الصُّنْدُوقُ صَغِيرٌ وَلٰكِنَّهُ ثَقِيلٌ.
        meaning: "**O exemplo.** Esta caixa é pequena, mas pesada. `هٰذَا الصُّنْدُوقُ` designa esta caixa; `صَغِيرٌ`
          significa pequena. `وَلٰكِنَّهُ` significa mas ela, com sufixo que retoma o nome árabe da caixa.
          `ثَقِيلٌ` significa pesada. O contraste não nega o tamanho pequeno."
        note: "O sufixo de `وَلٰكِنَّهُ` concorda com o nome árabe masculino da caixa. Outro referente pode exigir
          outro sufixo e outros adjetivos. Experimente: quais propriedades continuam verdadeiras? Resposta:
          pequena e pesada; « mas » opõe uma expectativa aos fatos sem negá-los."
  - subskill_id: supporting_claims
    explanation: Ao recomendar um caminho como mais curto, alguém pode perguntar como você sabe. A referência a
      uma medida fornece uma base concreta para a comparação, em vez de apenas repetir sua preferência.
    examples:
      - text: هٰذَا الطَّرِيقُ أَقْصَرُ، لِأَنَّنَا قِسْنَا الْمَسَافَةَ.
        meaning: "**O exemplo.** Este caminho é mais curto porque medimos a distância. `هٰذَا الطَّرِيقُ أَقْصَرُ` diz
          que este caminho é mais curto. `لِأَنَّنَا` significa porque nós; `قِسْنَا` significa medimos e
          `الْمَسَافَةَ` é a distância. A terminação do verbo passado identifica quem mediu."
        note: "A medida só serve de prova se diz respeito aos caminhos comparados. Em outro contexto, uma oração com «
          porque » pode fornecer um motivo pessoal; aqui, sustenta a comparação. Experimente: que palavras
          identificam a prova? Resposta: `قِسْنَا الْمَسَافَةَ`, relatando a medida."
