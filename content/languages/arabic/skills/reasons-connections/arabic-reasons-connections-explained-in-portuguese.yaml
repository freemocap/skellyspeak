variety_sections:
  arabic-levantine:
    - subskill_id: causes_reasons
      explanation: Uma mulher explica por que ficou em casa. A doença é apresentada como motivo da decisão.
      examples:
        - text: ضَلِّيتْ بِالْبَيْتْ لِأَنِّي مَرِيضَة.
          meaning: "**O exemplo.** Fiquei em casa porque estava doente. `ضَلِّيتْ` significa aqui eu fiquei.
            `بِالْبَيْتْ` significa em casa; `لِأَنِّي` é porque eu, e `مَرِيضَة` é doente com concordância
            feminina. A permanência passada e a doença são ligadas como ação e razão."
          note: "Um homem troca o adjetivo por `مَرِيضْ`. A expressão com « porque » explica o motivo; um simples « e »
            só juntaria informações. Experimente: estar doente é consequência de ficar em casa? Resposta: não;
            é apresentado como a razão para ficar."
    - subskill_id: consequences
      explanation: Você chega a uma loja fechada e decide voltar amanhã. Uma expressão de resultado mostra como o
        novo plano decorre dessa situação.
      examples:
        - text: الْمَحَلّ مْسَكَّرْ، عَشَانْ هَيْكْ رَحْ نِرْجَعْ بُكْرَا.
          meaning: "**O exemplo.** A loja está fechada, então voltaremos amanhã. `الْمَحَلّ مْسَكَّرْ` informa o
            fechamento; `عَشَانْ هَيْكْ` significa portanto ou por essa razão. `رَحْ نِرْجَعْ` significa
            voltaremos; `بُكْرَا` é amanhã. O verbo depois de `رَحْ` não leva seu prefixo b- comum."
          note: "A forma `مْسَكَّرْ` descreve o estado da loja; não é uma ordem para fechá-la. Experimente: qual oração
            dá a consequência? Resposta: `رَحْ نِرْجَعْ بُكْرَا`, o plano novo motivado pelo fechamento."
    - subskill_id: conditions
      explanation: Você dá orientações de chegada sem saber se a pessoa virá cedo. A espera só se aplica na
        circunstância apresentada.
      examples:
        - text: إِذَا وِصِلْتْ بَكِّيرْ، اِسْتَنَّى هُونْ.
          meaning: "**O exemplo.** Se você chegar cedo, espere aqui. `إِذَا` significa se, `وِصِلْتْ` expressa a chegada
            neste contexto condicional e `بَكِّيرْ` significa cedo. `اِسْتَنَّى` manda um homem esperar;
            `هُونْ` é aqui. A primeira oração fixa a condição, e a segunda dá a instrução."
          note: "A forma da chegada pode parecer passada, mas o contexto com « se » a torna uma possibilidade aberta. A
            frase não relata que a pessoa já chegou. Experimente: que palavra torna a espera condicional?
            Resposta: `إِذَا`; sem ela, a instrução não ficaria limitada da mesma maneira."
    - subskill_id: contrast
      explanation: Uma caixa pequena pode parecer fácil de carregar e ainda assim pesar muito. O contraste assinala
        essa diferença entre expectativa e realidade.
      examples:
        - text: هَادْ الصُّنْدُوقْ صْغِيرْ بَسّ تْقِيلْ.
          meaning: "**O exemplo.** Esta caixa é pequena, mas pesada. `هَادْ الصُّنْدُوقْ` é esta caixa; `صْغِيرْ`
            significa pequena. `بَسّ` significa mas nesta frase e `تْقِيلْ` pesada. A mesma caixa tem as duas
            propriedades; não é preciso um verbo separado para « ser » no presente."
          note: "Em outro contexto, `بَسّ` pode significar apenas; aqui, liga duas descrições e indica surpresa.
            Experimente: a segunda descrição substitui a primeira? Resposta: não; a caixa continua pequena e
            também é pesada."
    - subskill_id: supporting_claims
      explanation: Ao recomendar um caminho mais curto, alguém pode perguntar como você sabe. Uma medida da
        distância fornece uma base concreta para a comparação.
      examples:
        - text: هَادْ الطَّرِيقْ أَقْصَرْ، لِأَنُّه إِحْنَا قِسْنَا الْمَسَافَة.
          meaning: "**O exemplo.** Este caminho é mais curto porque medimos a distância. `هَادْ الطَّرِيقْ أَقْصَرْ`
            apresenta a comparação. Aqui `لِأَنُّه` funciona como « porque » antes da oração `إِحْنَا قِسْنَا
            الْمَسَافَة`, nós medimos a distância. `إِحْنَا` nomeia nós explicitamente, e `قِسْنَا` também
            leva a terminação de nós."
          note: "Não traduza o conector mecanicamente como « porque ele »: a oração seguinte fornece a razão. A medida
            deve realmente sustentar a comparação. Experimente: quem mediu? Resposta: nós, expresso por
            `إِحْنَا` e pela terminação de `قِسْنَا`, não pelo som final do conector."
