varieties:
  arabic-levantine:
    disposition: supplement
    text: Conversational connectives include لِأَنّ for because, عَشَانْ هَيْكْ for so and بَسّ for
      but. Regional alternatives are common.
    provenance: *a1
  arabic-modern-standard:
    disposition: supplement
    text: A perfect-form verb after إِذَا can describe an open future condition. The condition does
      not assert that the event already happened.
    provenance: *a1
