variety_sections:
  arabic-levantine:
    - subskill_id: causes_reasons
      explanation: When someone asks why you stayed home, giving your illness as the reason connects your
        decision to what prompted it. The speaker here is a woman.
      examples:
        - text: ضَلِّيتْ بِالْبَيْتْ لِأَنِّي مَرِيضَة.
          meaning: "**The example.** I stayed home because I was ill. `ضَلِّيتْ` means I stayed in this
            context. `بِالْبَيْتْ` means at home; `لِأَنِّي` is because I, and `مَرِيضَة` is ill
            with feminine agreement. The past staying and the illness are joined as action and
            reason."
          note: "A man changes the adjective to `مَرِيضْ`. The because phrase explains why, while a simple and
            would only join information. Try it: is being ill the consequence of staying home in
            this sentence? Answer: no; it is presented as the reason for staying."
    - subskill_id: consequences
      explanation: You arrive at a closed shop and decide to return tomorrow. A result expression helps
        the listener see how your new plan follows from the situation you found.
      examples:
        - text: الْمَحَلّ مْسَكَّرْ، عَشَانْ هَيْكْ رَحْ نِرْجَعْ بُكْرَا.
          meaning: "**The example.** The shop is closed, so we will return tomorrow. `الْمَحَلّ مْسَكَّرْ`
            means the shop is closed. `عَشَانْ هَيْكْ` means so or for that reason. `رَحْ نِرْجَعْ`
            is we will return; `بُكْرَا` is tomorrow. The action after `رَحْ` has no ordinary
            b-prefix."
          note: "The shop’s state is expressed by `مْسَكَّرْ`; it is not a command to close it. Try it: which
            clause gives the consequence? Answer: `رَحْ نِرْجَعْ بُكْرَا`, the new plan motivated by
            the closure."
    - subskill_id: conditions
      explanation: You are giving arrival instructions but do not know whether the person will be early.
        An if-clause makes waiting apply only when that situation occurs.
      examples:
        - text: إِذَا وِصِلْتْ بَكِّيرْ، اِسْتَنَّى هُونْ.
          meaning: "**The example.** If you arrive early, wait here. `إِذَا` means if, `وِصِلْتْ` is you
            arrive in this conditional context, and `بَكِّيرْ` is early. `اِسْتَنَّى` tells one man
            to wait; `هُونْ` means here. The first clause sets the situation and the second gives
            the instruction."
          note: "The arrival form can look past, but the if-context makes it an open possibility here. A
            conditional instruction does not report that the person has already arrived. Try it:
            which word makes waiting conditional? Answer: `إِذَا`; without that frame, the
            instruction would no longer be limited in the same way."
    - subskill_id: contrast
      explanation: A small box might look easy to lift, yet be heavy. But joins the two true descriptions
        while showing why the second may surprise the listener.
      examples:
        - text: هَادْ الصُّنْدُوقْ صْغِيرْ بَسّ تْقِيلْ.
          meaning: "**The example.** This box is small, but it is heavy. `هَادْ الصُّنْدُوقْ` is this box;
            `صْغِيرْ` is small. `بَسّ` means but in this sentence, and `تْقِيلْ` is heavy. The same
            box has both properties; no separate present-tense is is needed."
          note: "In other contexts `بَسّ` can mean only, so use the whole sentence to interpret it. Here it
            connects descriptions and signals surprise. Try it: does the second description replace
            the first? Answer: no; the box is still small, and it is also heavy."
    - subskill_id: supporting_claims
      explanation: If you recommend a route as shorter, someone may ask how you know. Referring to a
        measurement supplies a concrete basis for the comparison rather than simply repeating your
        preference.
      examples:
        - text: هَادْ الطَّرِيقْ أَقْصَرْ، لِأَنُّه إِحْنَا قِسْنَا الْمَسَافَة.
          meaning: "**The example.** This route is shorter because we measured the distance. `هَادْ الطَّرِيقْ
            أَقْصَرْ` means this route is shorter. Here `لِأَنُّه` functions as because before the
            clause `إِحْنَا قِسْنَا الْمَسَافَة`, we measured the distance. `إِحْنَا` explicitly
            names we and `قِسْنَا` also carries the we ending."
          note: "Do not translate the connector here mechanically as because he: the following we-clause
            supplies the reason. Measurements must actually support the comparison. Try it: who
            measured? Answer: we, expressed by `إِحْنَا` and the ending of `قِسْنَا`, not by the
            connector’s final sound."
