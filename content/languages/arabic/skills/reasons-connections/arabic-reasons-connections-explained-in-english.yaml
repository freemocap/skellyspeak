skill_id: reasons_connections
explanation_language: english
shared_explanation: skills/reasons-connections/reasons-connections-explained-in-english.yaml
sections:
  - subskill_id: causes_reasons
    explanation: When someone asks why you stayed home, giving your illness as the reason connects your
      decision to what prompted it. The speaker here is a woman.
    examples:
      - text: بَقِيتُ فِي الْبَيْتِ لِأَنَّنِي مَرِيضَةٌ.
        meaning: "**The example.** I stayed home because I was ill. `بَقِيتُ` means I stayed, `فِي
          الْبَيْتِ` is at home, and `لِأَنَّنِي` means because I. `مَرِيضَةٌ` means ill with
          feminine agreement. The past verb locates the staying earlier; the reason clause explains
          that earlier decision."
        note: "A man uses `مَرِيضٌ`; the I-form of stayed remains unchanged. The cause follows because,
          rather than being a second unrelated event. Try it: which part answers why? Answer:
          `لِأَنَّنِي مَرِيضَةٌ`, linking illness to staying home."
  - subskill_id: consequences
    explanation: You arrive at a closed shop and decide to return tomorrow. A result expression helps
      the listener see how your new plan follows from the situation you found.
    examples:
      - text: الْمَحَلُّ مُغْلَقٌ، لِذٰلِكَ سَنَعُودُ غَدًا.
        meaning: "**The example.** The shop is closed, so we will return tomorrow. `الْمَحَلُّ مُغْلَقٌ`
          says the shop is closed. `لِذٰلِكَ` means therefore or for that reason. `سَنَعُودُ` is we
          will return and `غَدًا` is tomorrow. The first statement supplies the situation; the
          second gives the response to it."
        note: "The future prefix `سَـ` attaches to the we-form `نَعُودُ`. Compare a simple and: it need not
          explain why the return is planned. Try it: which phrase explicitly links closure to the
          plan? Answer: `لِذٰلِكَ`; it points back to the closed shop as the reason."
  - subskill_id: conditions
    explanation: You are giving arrival instructions but do not know whether the person will be early.
      An if-clause makes waiting apply only when that situation occurs.
    examples:
      - text: إِذَا وَصَلْتَ مُبَكِّرًا، فَانْتَظِرْ هُنَا.
        meaning: "**The example.** If you arrive early, wait here. `إِذَا` introduces if; `وَصَلْتَ` is you
          arrived in form, addressing one man. Here it describes a possible future arrival, not a
          past fact. `مُبَكِّرًا` is early; `فَانْتَظِرْ هُنَا` tells him then wait here."
        note: "The attached `فَـ` links the condition to this command. Do not read a perfect-form verb after
          `إِذَا` as automatically past. Try it: must the listener wait even if not early? Answer:
          this sentence only gives that instruction under the stated early-arrival condition."
  - subskill_id: contrast
    explanation: A small box might look easy to lift, yet be heavy. But joins the two true descriptions
      while showing why the second may surprise the listener.
    examples:
      - text: هٰذَا الصُّنْدُوقُ صَغِيرٌ وَلٰكِنَّهُ ثَقِيلٌ.
        meaning: "**The example.** This box is small, but it is heavy. `هٰذَا الصُّنْدُوقُ` is this box;
          `صَغِيرٌ` is small. `وَلٰكِنَّهُ` means but it, with a suffix pointing back to the box.
          `ثَقِيلٌ` means heavy. The contrast does not deny that the box is small."
        note: "The suffix in `وَلٰكِنَّهُ` agrees with the masculine box noun. A different referent may
          require a different suffix and adjectives. Try it: which two properties remain true?
          Answer: small and heavy; but contrasts an expectation, not the facts themselves."
  - subskill_id: supporting_claims
    explanation: If you recommend a route as shorter, someone may ask how you know. Referring to a
      measurement supplies a concrete basis for the comparison rather than simply repeating your
      preference.
    examples:
      - text: هٰذَا الطَّرِيقُ أَقْصَرُ، لِأَنَّنَا قِسْنَا الْمَسَافَةَ.
        meaning: "**The example.** This route is shorter because we measured the distance. `هٰذَا الطَّرِيقُ
          أَقْصَرُ` says this route is shorter. `لِأَنَّنَا` means because we; `قِسْنَا` means we
          measured and `الْمَسَافَةَ` is the distance. The we suffix on the past verb identifies who
          made the measurement."
        note: "The measurement is evidence only if it relates to the routes being compared. A because-clause
          can give a personal motive elsewhere; here it gives a basis for knowing. Try it: which
          words identify the evidence? Answer: `قِسْنَا الْمَسَافَةَ`, reporting the measurement
          behind the claim."
