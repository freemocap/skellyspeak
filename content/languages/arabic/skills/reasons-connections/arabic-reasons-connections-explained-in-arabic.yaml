sections:
  - subskill_id: causes_reasons
    explanation: عندما يسألك شخص لماذا بقيت في المنزل، فإن ذكر مرضك سببًا يربط قرارك بما دفع إليه.
      المتحدثة هنا امرأة.
    examples:
      - text: بَقِيتُ فِي الْبَيْتِ لِأَنَّنِي مَرِيضَةٌ.
        meaning: "**المثال.** بقيت في البيت لأنني مريضة. تعني `بَقِيتُ` «بقيتُ»، و`فِي الْبَيْتِ` «في
          البيت»، و`لِأَنَّنِي` «لأنني». وتعني `مَرِيضَةٌ` مريضة بصيغة التأنيث. يضع فعل الماضي
          البقاء في وقت سابق؛ وتشرح جملة السبب ذلك القرار السابق."
        note: "يستعمل الرجل `مَرِيضٌ`؛ ولا تتغير صيغة المتكلم في فعل البقاء. يأتي السبب بعد «لأن» ولا يكون
          حدثًا ثانيًا منفصلًا. **جرّب:** أي جزء يجيب عن «لماذا»؟ الإجابة: `لِأَنَّنِي مَرِيضَةٌ`،
          فهو يربط المرض بالبقاء في البيت."
  - subskill_id: consequences
    explanation: تصل إلى متجر مغلق وتقرر العودة غدًا. يساعد تعبير النتيجة المستمع على فهم كيف تتبع خطتك
      الجديدة الحالة التي وجدتها.
    examples:
      - text: الْمَحَلُّ مُغْلَقٌ، لِذٰلِكَ سَنَعُودُ غَدًا.
        meaning: "**المثال.** المتجر مغلق، لذلك سنعود غدًا. تقول `الْمَحَلُّ مُغْلَقٌ` إن المتجر مغلق. وتعني
          `لِذٰلِكَ` «لذلك». `سَنَعُودُ` تعني سنعود، و`غَدًا` غدًا. تقدّم الجملة الأولى الحالة،
          وتقدّم الثانية الاستجابة لها."
        note: "تتصل علامة المستقبل `سَـ` بصيغة «نحن» `نَعُودُ`. قارن بالواو العاطفة وحدها؛ فقد لا تفسر سبب
          خطة العودة. **جرّب:** أي عبارة تربط الإغلاق بالخطة صراحةً؟ الإجابة: `لِذٰلِكَ`؛ فهي تعود
          إلى إغلاق المتجر سببًا."
  - subskill_id: conditions
    explanation: تعطي تعليمات للوصول لكنك لا تعرف هل سيصل الشخص مبكرًا. تجعل جملة الشرط الانتظارَ
      مطلوبًا في تلك الحالة فقط.
    examples:
      - text: إِذَا وَصَلْتَ مُبَكِّرًا، فَانْتَظِرْ هُنَا.
        meaning: "**المثال.** إذا وصلت مبكرًا، فانتظر هنا. تقدّم `إِذَا` الشرط؛ وصيغة `وَصَلْتَ` ماضية شكلًا
          وتخاطب رجلًا واحدًا. تصف هنا وصولًا مستقبليًا محتملًا لا واقعة ماضية. وتعني `مُبَكِّرًا`
          مبكرًا؛ وتأمره `فَانْتَظِرْ هُنَا` بالانتظار هنا عندئذ."
        note: "تصل `فَـ` المتصلة الشرطَ بهذا الأمر. لا تقرأ الفعل ذي الصيغة الماضية بعد `إِذَا` دائمًا
          ماضيًا في المعنى. **جرّب:** هل يجب على المخاطَب الانتظار ولو لم يصل مبكرًا؟ الإجابة: تذكر
          الجملة هذا التوجيه فقط عند تحقق شرط الوصول المبكر."
  - subskill_id: contrast
    explanation: قد يبدو الصندوق الصغير سهل الرفع، لكنه ثقيل. تصل أداة الاستدراك بين الوصفين الصحيحين
      وتبين لماذا قد يفاجئ الثاني المستمع.
    examples:
      - text: هٰذَا الصُّنْدُوقُ صَغِيرٌ وَلٰكِنَّهُ ثَقِيلٌ.
        meaning: "**المثال.** هذا الصندوق صغير لكنه ثقيل. `هٰذَا الصُّنْدُوقُ` هو هذا الصندوق؛ و`صَغِيرٌ`
          صغير. وتعني `وَلٰكِنَّهُ` «ولكنه»، وتتصل بها لاحقة تعود إلى الصندوق. وتعني `ثَقِيلٌ` ثقيل.
          لا ينفي التباين صغر الصندوق."
        note: "تطابق اللاحقة في `وَلٰكِنَّهُ` الاسم المذكر للصندوق. وقد يحتاج مرجع آخر إلى لاحقة وصفات
          مختلفة. **جرّب:** أي صفتين تظلان صحيحتين؟ الإجابة: صغير وثقيل؛ فالأداة تخالف توقعًا لا
          الواقعتين."
  - subskill_id: supporting_claims
    explanation: إذا أوصيت بطريق لأنه أقصر، فقد يسأل شخص كيف عرفت. يقدّم ذكر قياس أساسًا ملموسًا
      للمقارنة بدل تكرار تفضيلك فقط.
    examples:
      - text: هٰذَا الطَّرِيقُ أَقْصَرُ، لِأَنَّنَا قِسْنَا الْمَسَافَةَ.
        meaning: "**المثال.** هذا الطريق أقصر لأننا قسنا المسافة. تقول `هٰذَا الطَّرِيقُ أَقْصَرُ` إن هذا
          الطريق أقصر. وتعني `لِأَنَّنَا` «لأننا»؛ وتعني `قِسْنَا` «قسنا»، و`الْمَسَافَةَ` المسافة.
          تحدد لاحقة «نحن» على الفعل الماضي من قام بالقياس."
        note: "يكون القياس دليلًا إذا تعلق بالطريقين المقارنين. قد تذكر جملة «لأن» دافعًا شخصيًا في سياق
          آخر؛ لكنها هنا تذكر أساس معرفة. **جرّب:** أي كلمات تحدد الدليل؟ الإجابة: `قِسْنَا
          الْمَسَافَةَ`، فهي تبلغ عن القياس وراء القول."
