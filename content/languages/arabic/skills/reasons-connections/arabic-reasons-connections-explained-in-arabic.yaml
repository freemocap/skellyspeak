variety_sections:
  arabic-levantine:
    - subskill_id: causes_reasons
      explanation: عندما يسألك شخص لماذا بقيت في المنزل، فإن ذكر مرضك سببًا يربط قرارك بما دفع إليه.
        المتحدثة هنا امرأة.
      examples:
        - text: ضَلِّيتْ بِالْبَيْتْ لِأَنِّي مَرِيضَة.
          meaning: "**المثال.** بقيت في البيت لأنني مريضة. تعني `ضَلِّيتْ` «بقيت» هنا. وتعني `بِالْبَيْتْ` في
            البيت؛ و`لِأَنِّي` لأنني، و`مَرِيضَة` مريضة بصيغة التأنيث. يرتبط البقاء الماضي والمرض
            بوصفهما فعلًا وسببًا."
          note: "يغيّر الرجل الصفة إلى `مَرِيضْ`. تفسر عبارة «لأن» السبب، بينما تصل الواو البسيطة المعلومات
            فقط. **جرّب:** هل المرض نتيجة البقاء في المنزل في هذه الجملة؟ الإجابة: لا؛ يُعرض سببًا
            للبقاء."
    - subskill_id: consequences
      explanation: تصل إلى متجر مغلق وتقرر العودة غدًا. يساعد تعبير النتيجة المستمع على فهم كيف تتبع خطتك
        الجديدة الحالة التي وجدتها.
      examples:
        - text: الْمَحَلّ مْسَكَّرْ، عَشَانْ هَيْكْ رَحْ نِرْجَعْ بُكْرَا.
          meaning: "**المثال.** المتجر مغلق، لذلك سنعود غدًا. تعني `الْمَحَلّ مْسَكَّرْ` أن المتجر مغلق. وتعني
            `عَشَانْ هَيْكْ` «لذلك». وتعني `رَحْ نِرْجَعْ` «سنعود»؛ و`بُكْرَا` غدًا. لا يأخذ الفعل
            بعد `رَحْ` باء المضارع المعتادة."
          note: "تعبّر `مْسَكَّرْ` عن حالة المتجر؛ وليست أمرًا بإغلاقه. **جرّب:** أي جزء يذكر النتيجة؟
            الإجابة: `رَحْ نِرْجَعْ بُكْرَا`، أي الخطة الجديدة الناتجة عن الإغلاق."
    - subskill_id: conditions
      explanation: تعطي تعليمات للوصول لكنك لا تعرف هل سيصل الشخص مبكرًا. تجعل جملة الشرط الانتظارَ
        مطلوبًا في تلك الحالة فقط.
      examples:
        - text: إِذَا وِصِلْتْ بَكِّيرْ، اِسْتَنَّى هُونْ.
          meaning: "**المثال.** إذا وصلت مبكرًا، فانتظر هنا. تعني `إِذَا` «إذا»، و`وِصِلْتْ` وصول المخاطَب في
            هذا السياق الشرطي، و`بَكِّيرْ` مبكرًا. تأمر `اِسْتَنَّى` رجلًا واحدًا بالانتظار؛ وتعني
            `هُونْ` هنا. تحدد الجملة الأولى الحالة، وتقدّم الثانية التوجيه."
          note: "قد تبدو صيغة الوصول ماضية، لكن سياق «إذا» يجعلها احتمالًا مفتوحًا هنا. لا تخبر التعليمات
            الشرطية أن الشخص وصل بالفعل. **جرّب:** أي كلمة تجعل الانتظار مشروطًا؟ الإجابة: `إِذَا`؛
            فمن دون إطارها لا يظل التوجيه مقيدًا بالطريقة نفسها."
    - subskill_id: contrast
      explanation: قد يبدو الصندوق الصغير سهل الرفع، لكنه ثقيل. تصل أداة الاستدراك بين الوصفين الصحيحين
        وتبين لماذا قد يفاجئ الثاني المستمع.
      examples:
        - text: هَادْ الصُّنْدُوقْ صْغِيرْ بَسّ تْقِيلْ.
          meaning: "**المثال.** هذا الصندوق صغير لكنه ثقيل. `هَادْ الصُّنْدُوقْ` هو هذا الصندوق؛ و`صْغِيرْ`
            صغير. وتعني `بَسّ` «لكن» في هذه الجملة، و`تْقِيلْ` ثقيل. يحمل الصندوق نفسه الصفتين؛ ولا
            حاجة إلى فعل حاضر منفصل بمعنى «is»."
          note: "قد تعني `بَسّ` في سياقات أخرى «فقط»، لذا افهمها ضمن الجملة كاملة. تصل هنا بين وصفين وتدل على
            مفاجأة. **جرّب:** هل يحل الوصف الثاني محل الأول؟ الإجابة: لا؛ يبقى الصندوق صغيرًا وهو
            ثقيل أيضًا."
    - subskill_id: supporting_claims
      explanation: إذا أوصيت بطريق لأنه أقصر، فقد يسأل شخص كيف عرفت. يقدّم ذكر قياس أساسًا ملموسًا
        للمقارنة بدل تكرار تفضيلك فقط.
      examples:
        - text: هَادْ الطَّرِيقْ أَقْصَرْ، لِأَنُّه إِحْنَا قِسْنَا الْمَسَافَة.
          meaning: "**المثال.** هذا الطريق أقصر لأننا قسنا المسافة. تعني `هَادْ الطَّرِيقْ أَقْصَرْ` أن هذا
            الطريق أقصر. تعمل `لِأَنُّه` هنا بمعنى «لأن» قبل الجملة `إِحْنَا قِسْنَا الْمَسَافَة`،
            أي قسنا المسافة. تسمّي `إِحْنَا` «نحن» صراحةً، وتحمل `قِسْنَا` نهاية «نحن» أيضًا."
          note: "لا تترجم أداة الربط هنا آليًا بمعنى «لأنه هو»: فالجملة التالية بصيغة «نحن» تذكر السبب. ينبغي
            أن يدعم القياس المقارنة فعلًا. **جرّب:** من قاس؟ الإجابة: نحن، ويظهر ذلك في `إِحْنَا`
            ونهاية `قِسْنَا`، لا في الصوت الأخير لأداة الربط."
