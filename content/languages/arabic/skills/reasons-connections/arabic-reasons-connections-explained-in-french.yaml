variety_sections:
  arabic-levantine:
    - subskill_id: causes_reasons
      explanation: Une femme explique pourquoi elle est restée chez elle. La maladie est présentée comme le motif de
        sa décision.
      examples:
        - text: ضَلِّيتْ بِالْبَيْتْ لِأَنِّي مَرِيضَة.
          meaning: "**L’exemple.** Je suis restée chez moi parce que j’étais malade. `ضَلِّيتْ` signifie ici « je suis
            restée ». `بِالْبَيْتْ` signifie « à la maison », `لِأَنِّي` « parce que je » et `مَرِيضَة` «
            malade », au féminin. Le séjour passé et la maladie sont liés comme action et raison."
          note: "Un homme emploie l’adjectif `مَرِيضْ`. La proposition de cause explique pourquoi, tandis qu’un simple «
            et » ne ferait que juxtaposer des informations. Essayez : la maladie est-elle la conséquence du
            séjour chez soi ? Réponse : non ; elle en est présentée comme la raison."
    - subskill_id: consequences
      explanation: Vous trouvez un magasin fermé et décidez de revenir demain. La seconde proposition indique ce qui
        résulte de la situation.
      examples:
        - text: الْمَحَلّ مْسَكَّرْ، عَشَانْ هَيْكْ رَحْ نِرْجَعْ بُكْرَا.
          meaning: "**L’exemple.** Le magasin est fermé, donc nous reviendrons demain. `الْمَحَلّ مْسَكَّرْ` indique la
            fermeture ; `عَشَانْ هَيْكْ` signifie « donc » ou « pour cette raison ». `رَحْ نِرْجَعْ` signifie
            « nous reviendrons » et `بُكْرَا` « demain ». Le verbe après le marqueur futur `رَحْ` n’a pas ici
            son préfixe b- ordinaire."
          note: "La forme `مْسَكَّرْ` décrit l’état du magasin ; ce n’est pas un ordre de le fermer. Essayez : quelle
            proposition donne la conséquence ? Réponse : `رَحْ نِرْجَعْ بُكْرَا`, le projet de revenir motivé
            par la fermeture."
    - subskill_id: conditions
      explanation: Vous donnez des consignes d’arrivée sans savoir si la personne sera en avance. L’ordre d’attendre
        vaut seulement dans le cas annoncé.
      examples:
        - text: إِذَا وِصِلْتْ بَكِّيرْ، اِسْتَنَّى هُونْ.
          meaning: "**L’exemple.** Si tu arrives en avance, attends ici. `إِذَا` signifie « si », `وِصِلْتْ` exprime
            l’arrivée dans cette condition et `بَكِّيرْ` signifie « tôt ». `اِسْتَنَّى` demande à un homme
            d’attendre ; `هُونْ` signifie « ici ». La première proposition pose la condition, la seconde donne
            la consigne."
          note: "La forme de l’arrivée peut évoquer le passé, mais le contexte en « si » présente ici une possibilité
            ouverte. La phrase ne rapporte pas une arrivée déjà accomplie. Essayez : quel mot rend la consigne
            conditionnelle ? Réponse : `إِذَا` ; sans ce cadre, l’ordre ne serait plus limité de la même
            manière."
    - subskill_id: contrast
      explanation: Une petite boîte peut paraître facile à porter tout en étant lourde. Le contraste signale cette
        différence entre attente et réalité.
      examples:
        - text: هَادْ الصُّنْدُوقْ صْغِيرْ بَسّ تْقِيلْ.
          meaning: "**L’exemple.** Cette boîte est petite, mais lourde. `هَادْ الصُّنْدُوقْ` désigne cette boîte ;
            `صْغِيرْ` signifie « petite ». `بَسّ` signifie « mais » dans cette phrase et `تْقِيلْ` « lourde ».
            Les deux propriétés concernent la même boîte ; aucun verbe « être » distinct n’est nécessaire au
            présent."
          note: "Dans un autre contexte, `بَسّ` peut signifier « seulement » ; ici, il relie deux descriptions
            contrastées. Essayez : la seconde remplace-t-elle la première ? Réponse : non ; la boîte reste
            petite et elle est aussi lourde."
    - subskill_id: supporting_claims
      explanation: Vous recommandez un itinéraire plus court et quelqu’un demande sur quoi repose cette comparaison.
        La mesure de la distance fournit un élément concret.
      examples:
        - text: هَادْ الطَّرِيقْ أَقْصَرْ، لِأَنُّه إِحْنَا قِسْنَا الْمَسَافَة.
          meaning: "**L’exemple.** Cet itinéraire est plus court parce que nous avons mesuré la distance. `هَادْ
            الطَّرِيقْ أَقْصَرْ` donne la comparaison. Ici, `لِأَنُّه` joue le rôle de « parce que » devant
            `إِحْنَا قِسْنَا الْمَسَافَة`, « nous avons mesuré la distance ». `إِحْنَا` exprime explicitement
            « nous » ; `قِسْنَا` porte aussi la terminaison correspondante."
          note: "Ne traduisez pas mécaniquement cette conjonction par « parce qu’il » : la proposition suivante indique
            la raison. La mesure doit réellement étayer la comparaison. Essayez : qui a mesuré ? Réponse : «
            nous », indiqué par `إِحْنَا` et la terminaison de `قِسْنَا`, pas par le son final de la
            conjonction."
