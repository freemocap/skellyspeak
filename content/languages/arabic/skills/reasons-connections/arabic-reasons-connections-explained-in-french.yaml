sections:
  - subskill_id: causes_reasons
    explanation: Une femme explique pourquoi elle est restée chez elle. Le lien de cause rattache sa maladie à sa
      décision, au lieu de présenter deux faits sans rapport.
    examples:
      - text: بَقِيتُ فِي الْبَيْتِ لِأَنَّنِي مَرِيضَةٌ.
        meaning: "**L’exemple.** Je suis restée chez moi parce que j’étais malade. `بَقِيتُ` signifie « je suis restée
          », `فِي الْبَيْتِ` indique « à la maison » et `لِأَنَّنِي` signifie « parce que je ». `مَرِيضَةٌ`
          exprime la maladie avec un accord féminin. Le verbe situe le séjour dans le passé ; la dernière
          proposition en donne la raison."
        note: "Un homme emploie `مَرِيضٌ` ; la forme de « je suis resté » ne change pas. La cause suit le mot « parce
          que ». Essayez : quelle partie répond à « pourquoi » ? Réponse : `لِأَنَّنِي مَرِيضَةٌ` ; elle relie
          la maladie au séjour chez soi."
  - subskill_id: consequences
    explanation: Vous trouvez un magasin fermé et décidez de revenir demain. Une expression de conséquence montre
      comment cette nouvelle décision découle de la fermeture.
    examples:
      - text: الْمَحَلُّ مُغْلَقٌ، لِذٰلِكَ سَنَعُودُ غَدًا.
        meaning: "**L’exemple.** Le magasin est fermé, donc nous reviendrons demain. `الْمَحَلُّ مُغْلَقٌ` indique que
          le magasin est fermé. `لِذٰلِكَ` signifie « donc » ou « pour cette raison ». `سَنَعُودُ` signifie «
          nous reviendrons » et `غَدًا` « demain ». La première proposition donne la situation ; la seconde
          donne la décision qui en résulte."
        note: "Le préfixe futur `سَـ` s’attache à la forme « nous revenons » `نَعُودُ`. Une simple coordination par «
          et » ne préciserait pas nécessairement pourquoi le retour est prévu. Essayez : quelle expression
          relie explicitement la fermeture au projet ? Réponse : `لِذٰلِكَ` ; elle renvoie à la fermeture
          comme raison."
  - subskill_id: conditions
    explanation: Vous donnez des consignes d’arrivée sans savoir si la personne arrivera en avance. La proposition
      en « si » limite l’ordre d’attendre à cette possibilité.
    examples:
      - text: إِذَا وَصَلْتَ مُبَكِّرًا، فَانْتَظِرْ هُنَا.
        meaning: "**L’exemple.** Si tu arrives en avance, attends ici. `إِذَا` introduit la condition ; `وَصَلْتَ` a
          la forme « tu es arrivé », adressée ici à un homme, mais renvoie dans cette condition à une arrivée
          future possible. `مُبَكِّرًا` signifie « tôt » ; `فَانْتَظِرْ هُنَا` donne ensuite l’ordre
          d’attendre ici."
        note: "Le `فَـ` initial rattache l’ordre à la condition. Une forme verbale dite accomplie après `إِذَا` ne se
          lit donc pas automatiquement comme un fait passé. Essayez : faut-il attendre même sans arrivée en
          avance ? Réponse : cette phrase ne donne l’ordre que dans la condition indiquée."
  - subskill_id: contrast
    explanation: Une petite boîte peut paraître facile à soulever tout en étant lourde. Le contraste réunit deux
      descriptions vraies et signale pourquoi la seconde surprend.
    examples:
      - text: هٰذَا الصُّنْدُوقُ صَغِيرٌ وَلٰكِنَّهُ ثَقِيلٌ.
        meaning: "**L’exemple.** Cette boîte est petite, mais elle est lourde. `هٰذَا الصُّنْدُوقُ` désigne cette
          boîte ; `صَغِيرٌ` signifie « petite ». `وَلٰكِنَّهُ` signifie « mais elle », avec un suffixe
          renvoyant au nom arabe de la boîte. `ثَقِيلٌ` signifie « lourde ». Le contraste n’annule pas sa
          petite taille."
        note: "Le suffixe de `وَلٰكِنَّهُ` s’accorde avec le nom arabe masculin de la boîte. Un autre référent
          pourrait changer ce suffixe et les adjectifs. Essayez : quelles deux propriétés restent vraies ?
          Réponse : la boîte est petite et lourde ; « mais » oppose une attente aux faits, sans nier ces
          faits."
  - subskill_id: supporting_claims
    explanation: Vous recommandez un itinéraire plus court et quelqu’un demande comment vous le savez. Une mesure
      fournit un fondement concret à la comparaison.
    examples:
      - text: هٰذَا الطَّرِيقُ أَقْصَرُ، لِأَنَّنَا قِسْنَا الْمَسَافَةَ.
        meaning: "**L’exemple.** Cet itinéraire est plus court parce que nous avons mesuré la distance. `هٰذَا
          الطَّرِيقُ أَقْصَرُ` affirme qu’il est plus court. `لِأَنَّنَا` signifie « parce que nous » ;
          `قِسْنَا` signifie « nous avons mesuré » et `الْمَسَافَةَ` « la distance ». La terminaison du verbe
          passé indique qui a fait la mesure."
        note: "La mesure ne constitue une preuve que si elle porte sur les itinéraires comparés. Ailleurs, une
          proposition en « parce que » peut donner un simple motif personnel ; ici, elle fonde la comparaison.
          Essayez : quels mots nomment la preuve ? Réponse : `قِسْنَا الْمَسَافَةَ` ; ils rapportent la
          mesure."
