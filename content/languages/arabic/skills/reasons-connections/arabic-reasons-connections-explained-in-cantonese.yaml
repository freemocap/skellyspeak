sections:
  - subskill_id: causes_reasons
    explanation: 有人問點解你留喺屋企，用生病做理由，就可以連起決定同原因。呢句由女性講出。
    examples:
      - text: بَقِيتُ فِي الْبَيْتِ لِأَنَّنِي مَرِيضَةٌ.
        meaning: "**例句。** 我留喺屋企，因為我病咗。 `بَقِيتُ` 係我留咗，`فِي الْبَيْتِ` 係喺屋企，`لِأَنَّنِي` 係因為我。`مَرِيضَةٌ`
          係配合女性嘅生病形容詞。過去動詞指之前留低，理由分句解釋嗰次決定。"
        note: 男性用 `مَرِيضٌ`，留低嘅第一人稱動詞唔使改。原因跟住「因為」，唔係另一件無關事件。試下：邊部分答點解？答案係 `لِأَنَّنِي مَرِيضَةٌ`，將生病同留喺屋企連起。
  - subskill_id: consequences
    explanation: 去到間舖發現閂咗，就決定聽日再嚟。結果表達令聽者知道，新安排點樣由眼前情況引起。
    examples:
      - text: الْمَحَلُّ مُغْلَقٌ، لِذٰلِكَ سَنَعُودُ غَدًا.
        meaning: "**例句。** 間舖閂咗，所以我哋聽日再嚟。 `الْمَحَلُّ مُغْلَقٌ` 話間舖閂咗。`لِذٰلِكَ` 係所以，`سَنَعُودُ`
          係我哋會返嚟，`غَدًا` 係聽日。第一句交代情況，第二句講因應情況而做嘅安排。"
        note: 將來前綴 `سَـ` 連住「我哋」形式 `نَعُودُ`。普通「同埋」未必會解釋返嚟嘅原因。試下：邊個短語明示閂舖同計劃嘅關係？答案係 `لِذٰلِكَ`，指返閂舖係理由。
  - subskill_id: conditions
    explanation: 你交代到達時點做，但唔知對方會唔會早到。「如果」分句令等候指示只喺早到嗰個情況適用。
    examples:
      - text: إِذَا وَصَلْتَ مُبَكِّرًا، فَانْتَظِرْ هُنَا.
        meaning: "**例句。** 如果你早到，就喺呢度等。 `إِذَا` 帶出如果；`وَصَلْتَ`
          形式上係向男性講「你到咗」，呢度卻指可能嘅將來到達，唔係已發生事實。`مُبَكِّرًا` 係早，`فَانْتَظِرْ هُنَا` 係咁就喺呢度等。"
        note: 連住嘅 `فَـ` 將條件接到呢個命令。唔好見到 `إِذَا` 後面完成式就一律當過去。試下：冇早到係咪都一定要等？呢句只講早到嗰個條件下要噉做。
  - subskill_id: contrast
    explanation: 細箱睇落可能易搬，卻可以好重。「但係」連起兩個都係真嘅描述，同時指出後面嗰點點解令人意外。
    examples:
      - text: هٰذَا الصُّنْدُوقُ صَغِيرٌ وَلٰكِنَّهُ ثَقِيلٌ.
        meaning: "**例句。** 呢個箱細，但係好重。 `هٰذَا الصُّنْدُوقُ` 係呢個箱，`صَغِيرٌ` 係細。`وَلٰكِنَّهُ`
          係「但係佢」，後綴指返個箱。`ثَقِيلٌ` 係重。呢個轉折冇否定個箱細。"
        note: "`وَلٰكِنَّهُ` 嘅後綴配合男性名詞箱。換另一個所指物，後綴同形容詞可能都要改。試下：邊兩個特徵仍然成立？答案係細同重；「但係」轉折嘅係預期，唔係推翻事實。"
  - subskill_id: supporting_claims
    explanation: 你話一條路較短，人哋可能問你點知。提到量過距離，就係提供具體根據，唔止係重複自己鍾意邊條路。
    examples:
      - text: هٰذَا الطَّرِيقُ أَقْصَرُ، لِأَنَّنَا قِسْنَا الْمَسَافَةَ.
        meaning: "**例句。** 呢條路較短，因為我哋量過距離。 `هٰذَا الطَّرِيقُ أَقْصَرُ` 係呢條路較短。`لِأَنَّنَا` 係因為我哋，`قِسْنَا`
          係我哋量過，`الْمَسَافَةَ` 係距離。過去動詞嘅「我哋」後綴指出邊個量度。"
        note: 量度要同所比較路線有關，先係支持呢個判斷嘅證據。「因為」喺其他句可以講個人動機，呢度就係知識根據。試下：邊部分交代證據？答案係 `قِسْنَا
          الْمَسَافَةَ`，講出判斷背後嘅量度。
