variety_sections:
  arabic-levantine:
    - subskill_id: causes_reasons
      explanation: 有人問點解你留喺屋企，用生病做理由，就可以連起決定同原因。呢句由女性講出。
      examples:
        - text: ضَلِّيتْ بِالْبَيْتْ لِأَنِّي مَرِيضَة.
          meaning: "**例句。** 我留喺屋企，因為我病咗。 `ضَلِّيتْ` 喺呢個情境係我留咗，`بِالْبَيْتْ` 係喺屋企，`لِأَنِّي` 係因為我，`مَرِيضَة`
            係配合女性嘅生病形容詞。之前留低同生病，連成動作同理由。"
          note: 男性改用形容詞 `مَرِيضْ`。「因為」短語解釋原因；普通「同埋」只會連起資訊。試下：呢句係咪話留喺屋企導致生病？唔係；生病係留喺屋企嘅理由。
    - subskill_id: consequences
      explanation: 去到間舖發現閂咗，就決定聽日再嚟。結果表達令聽者知道，新安排點樣由眼前情況引起。
      examples:
        - text: الْمَحَلّ مْسَكَّرْ، عَشَانْ هَيْكْ رَحْ نِرْجَعْ بُكْرَا.
          meaning: "**例句。** 間舖閂咗，所以我哋聽日再嚟。 `الْمَحَلّ مْسَكَّرْ` 係間舖閂咗。`عَشَانْ هَيْكْ` 係所以、因為噉。`رَحْ
            نِرْجَعْ` 係我哋會返嚟，`بُكْرَا` 係聽日。`رَحْ` 後面動作冇一般 b 前綴。"
          note: "`مْسَكَّرْ` 描述間舖嘅狀態，唔係命令閂舖。試下：邊個分句交代結果？答案係 `رَحْ نِرْجَعْ بُكْرَا`，因為閂舖而定嘅新計劃。"
    - subskill_id: conditions
      explanation: 你交代到達時點做，但唔知對方會唔會早到。「如果」分句令等候指示只喺早到嗰個情況適用。
      examples:
        - text: إِذَا وِصِلْتْ بَكِّيرْ، اِسْتَنَّى هُونْ.
          meaning: "**例句。** 如果你早到，就喺呢度等。 `إِذَا` 係如果，`وِصِلْتْ` 喺呢個條件情境係你到達，`بَكِّيرْ` 係早。`اِسْتَنَّى`
            叫一位男性等，`هُونْ` 係呢度。前半設定情況，後半交代指示。"
          note: 到達形式睇落似過去，但呢度「如果」令佢係未確定嘅可能。條件指示唔係報告對方已到。試下：邊個詞令等候有條件？答案係 `إِذَا`；冇咗呢個框架，指示就冇同樣限制。
    - subskill_id: contrast
      explanation: 細箱睇落可能易搬，卻可以好重。「但係」連起兩個都係真嘅描述，同時指出後面嗰點點解令人意外。
      examples:
        - text: هَادْ الصُّنْدُوقْ صْغِيرْ بَسّ تْقِيلْ.
          meaning: "**例句。** 呢個箱細，但係好重。 `هَادْ الصُّنْدُوقْ` 係呢個箱，`صْغِيرْ` 係細。`بَسّ` 呢句係但係，`تْقِيلْ`
            係重。同一個箱有兩個特徵，現在式唔使另加「係」。"
          note: 其他情境下 `بَسّ` 可以係「只係」，所以要睇成句。呢度佢接起描述並標示意外。試下：第二個描述係咪取代第一個？唔係；個箱仍然細，同時亦重。
    - subskill_id: supporting_claims
      explanation: 你話一條路較短，人哋可能問你點知。提到量過距離，就係提供具體根據，唔止係重複自己鍾意邊條路。
      examples:
        - text: هَادْ الطَّرِيقْ أَقْصَرْ، لِأَنُّه إِحْنَا قِسْنَا الْمَسَافَة.
          meaning: "**例句。** 呢條路較短，因為我哋量過距離。 `هَادْ الطَّرِيقْ أَقْصَرْ` 係呢條路較短。呢度 `لِأَنُّه` 喺 `إِحْنَا
            قِسْنَا الْمَسَافَة`「我哋量過距離」之前用作因為。`إِحْنَا` 明講我哋，`قِسْنَا` 亦帶「我哋」詞尾。"
          note: 唔好將呢度連接詞機械地譯成「因為佢」；後面「我哋」分句先係理由。量度亦要真係支持比較。試下：邊個量度？答案係我哋，由 `إِحْنَا` 同 `قِسْنَا`
            嘅詞尾指出，唔係由連接詞最後個音決定。
