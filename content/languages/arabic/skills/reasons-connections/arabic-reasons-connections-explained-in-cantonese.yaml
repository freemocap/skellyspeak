sections:
  - subskill_id: causes_reasons
    explanation: 原因子句可以解釋採取行動嘅理由。
    examples:
      - text: بَقِيتُ فِي الْبَيْتِ لِأَنَّنِي مَرِيضَةٌ.
        meaning: 我留喺屋企，因為我病咗。
        note: 現代標準阿拉伯語。女性講者解釋留喺屋企嘅決定。
      - text: ضَلِّيتْ بِالْبَيْتْ لِأَنِّي مَرِيضَة.
        meaning: 我留喺屋企，因為我病咗。
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。女性講者解釋留喺屋企嘅決定。
  - subskill_id: consequences
    explanation: 結果用語將一個情況同後果連起嚟。
    examples:
      - text: الْمَحَلُّ مُغْلَقٌ، لِذٰلِكَ سَنَعُودُ غَدًا.
        meaning: 間舖閂咗，所以我哋聽日再嚟。
        note: 現代標準阿拉伯語。關門係稍後再嚟嘅原因。
      - text: الْمَحَلّ مْسَكَّرْ، عَشَانْ هَيْكْ رَحْ نِرْجَعْ بُكْرَا.
        meaning: 間舖閂咗，所以我哋聽日再嚟。
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。關門係稍後再嚟嘅原因。
  - subskill_id: conditions
    explanation: إِذَا 可以引入開放條件，結果取決於條件係咪成立。
    examples:
      - text: إِذَا وَصَلْتَ مُبَكِّرًا، فَانْتَظِرْ هُنَا.
        meaning: 如果你早到，就喺呢度等。
        note: 現代標準阿拉伯語。對一位男性講；到達係條件，唔係斷言已發生嘅過去事實。
      - text: إِذَا وِصِلْتْ بَكِّيرْ، اِسْتَنَّى هُونْ.
        meaning: 如果你早到，就喺呢度等。
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。對一位男性講；到達係條件，唔係斷言已發生嘅過去事實。
  - subskill_id: contrast
    explanation: 「但係」子句可以對比兩個特徵，而唔否定任何一個。
    examples:
      - text: هٰذَا الصُّنْدُوقُ صَغِيرٌ وَلٰكِنَّهُ ثَقِيلٌ.
        meaning: 呢個箱細，但係好重。
        note: 現代標準阿拉伯語。重量同人根據體積作出嘅預期形成對比。
      - text: هَادْ الصُّنْدُوقْ صْغِيرْ بَسّ تْقِيلْ.
        meaning: 呢個箱細，但係好重。
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。重量同人根據體積作出嘅預期形成對比。
  - subskill_id: supporting_claims
    explanation: 可以用具體觀察作理由，支持一個說法。
    examples:
      - text: هٰذَا الطَّرِيقُ أَقْصَرُ، لِأَنَّنَا قِسْنَا الْمَسَافَةَ.
        meaning: 呢條路較短，因為我哋量過距離。
        note: 現代標準阿拉伯語。量度結果支持比較判斷，唔係只描述另一件事。
      - text: هَادْ الطَّرِيقْ أَقْصَرْ، لِأَنُّه إِحْنَا قِسْنَا الْمَسَافَة.
        meaning: 呢條路較短，因為我哋量過距離。
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。量度結果支持比較判斷，唔係只描述另一件事。
