variety_sections:
  arabic-levantine:
    - subskill_id: present_events
      explanation: Alguém pergunta o que você está fazendo agora. O marcador de ação em curso junto de « agora »
        deixa claro que a atividade está acontecendo neste momento.
      examples:
        - text: هَلَّقْ عَمْ بَكْتُبْ رِسَالِة.
          meaning: "**O exemplo.** Estou escrevendo uma carta agora. `هَلَّقْ` significa agora. `عَمْ` marca a atividade
            em andamento; `بَكْتُبْ` significa eu escrevo, e `رِسَالِة` é uma carta. O marcador progressivo
            mostra a escrita acontecendo, não uma carta já concluída."
          note: "Compare `بَكْتُبْ رِسَالِة`, eu escrevo uma carta: sem a construção progressiva, o contexto pode
            indicar um hábito. Experimente dizer que está escrevendo um livro agora. Resposta: `هَلَّقْ عَمْ
            بَكْتُبْ كِتَابْ`; troque o objeto e mantenha o quadro de ação em curso."
    - subskill_id: past_events
      explanation: Para contar o que você fez ontem, use uma ação passada e uma expressão temporal. Aqui, a pessoa
        relata ter escrito uma carta, não uma atividade atual.
      examples:
        - text: كَتَبْتْ رِسَالِة مْبَارِحْ.
          meaning: "**O exemplo.** Escrevi uma carta ontem. `كَتَبْتْ` significa eu escrevi neste contexto; `رِسَالِة` é
            uma carta e `مْبَارِحْ` é ontem. A terminação marca uma forma passada. Neste modelo falado, a
            grafia também pode ocorrer ao dirigir-se a um homem; o contexto ajuda a identificar a pessoa."
          note: "Acrescentar `أَنَا` torna explícita a leitura de « eu ». Experimente dizer que nós escrevemos uma carta
            ontem. Resposta: `كَتَبْنَا رِسَالِة مْبَارِحْ`. A terminação « nós » `نَا` identifica o grupo; o
            tempo e o objeto ficam iguais."
    - subskill_id: future_events
      explanation: Você fala de uma visita planejada para amanhã. O marcador de futuro situa a ação depois de agora;
        o amigo e o dia especificam o plano.
      examples:
        - text: رَحْ أَزُورْ صَاحْبِي بُكْرَا.
          meaning: "**O exemplo.** Visitarei meu amigo amanhã. `رَحْ` marca o futuro e `أَزُورْ` é a forma dependente de
            « eu visito » que o segue. `صَاحْبِي` significa meu amigo, homem, e `بُكْرَا` é amanhã. O verbo
            depois de `رَحْ` não leva seu prefixo b- comum."
          note: "Mantenha `رَحْ` antes da ação dependente. Experimente passar a visita para hoje. Resposta: `رَحْ
            أَزُورْ صَاحْبِي الْيَوْمْ`. Substituir `بُكْرَا` muda o dia, não a construção futura nem quem
            fará a visita."
    - subskill_id: duration_frequency
      explanation: Uma pergunta sobre rotina pode pedir quantas vezes por semana você nada. O exemplo conta
        ocasiões, não a duração de cada sessão.
      examples:
        - text: بَسْبَحْ مَرَّتَيْنْ بِالْأُسْبُوعْ.
          meaning: "**O exemplo.** Nado duas vezes por semana. `بَسْبَحْ` é a forma comum de primeira pessoa do presente
            habitual. `مَرَّتَيْنْ` significa duas vezes e `بِالْأُسْبُوعْ` significa por semana. O prefixo b-
            combina com o relato de rotina; o dual conta as ocasiões."
          note: "Para uma vez por semana, diga `بَسْبَحْ مَرَّة بِالْأُسْبُوعْ`. O dual conta ocasiões, não pessoas
            nadando. Experimente: a frase original informa quanto dura cada sessão? Resposta: não; dá a
            frequência. Uma duração exigiria outra expressão."
    - subskill_id: event_sequence
      explanation: Ao organizar uma noite em grupo, « primeiro » e « depois » indicam a ordem das atividades sem
        afirmar que uma causa a outra.
      examples:
        - text: أَوَّلْ شِي بِنَاكُلْ، بَعْدَيْنْ بِنِطْلَعْ.
          meaning: "**O exemplo.** Primeiro comemos, depois saímos. `أَوَّلْ شِي` significa primeiro; `بِنَاكُلْ` é nós
            comemos nesse modelo falado. `بَعْدَيْنْ` significa depois e `بِنِطْلَعْ` nós saímos. As formas
            comuns com prefixo b- descrevem a sequência planejada para o grupo."
          note: "As expressões de ordem podem ficar enquanto você troca as atividades. Experimente dizer que primeiro
            saímos e depois comemos. Resposta: `أَوَّلْ شِي بِنِطْلَعْ، بَعْدَيْنْ بِنَاكُلْ`. Os verbos mudam
            de posição; a sequência se inverte sem mudar quem participa."
    - subskill_id: event_phase
      explanation: Alguém quer saber se você ainda está lendo um livro. Dizer que terminou marca o ponto final, mais
        específico do que apenas dizer que leu antes.
      examples:
        - text: خَلَّصْتْ قِرَايِة الْكِتَابْ.
          meaning: "**O exemplo.** Terminei de ler o livro. `خَلَّصْتْ` significa eu terminei neste contexto. `قِرَايِة`
            é a leitura e `الْكِتَابْ` o livro. O nome de atividade diz o que foi concluído; a forma passada
            de terminar indica o ponto final."
          note: "Quando o contexto não basta, `أَنَا` pode deixar explícita a pessoa que fala. Ler parte do livro não é
            o mesmo que terminá-lo. Experimente: a frase responde naturalmente a « você ainda está lendo? »
            Resposta: sim; diz que a leitura acabou, não apenas que aconteceu antes."
