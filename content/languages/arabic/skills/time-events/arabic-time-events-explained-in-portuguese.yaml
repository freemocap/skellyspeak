sections:
  - subskill_id: present_events
    explanation: Alguém pergunta o que você está fazendo agora. Nomear a ação junto de « agora » deixa claro que
      se trata de uma atividade em andamento.
    examples:
      - text: أَكْتُبُ رِسَالَةً الْآنَ.
        meaning: "**O exemplo.** Estou escrevendo uma carta agora. `أَكْتُبُ` significa eu escrevo; `رِسَالَةً` é uma
          carta, e `الْآنَ` significa agora. A forma de primeira pessoa identifica quem escreve. Com esse
          contexto temporal, o árabe transmite uma ação em curso sem um auxiliar separado."
        note: "O mesmo verbo pode indicar um hábito em outro contexto. Experimente trocar a carta por um livro
          mantendo a ação atual. Resposta: `أَكْتُبُ كِتَابًا الْآنَ`. O objeto muda para `كِتَابًا`; a forma
          de primeira pessoa e « agora » ficam."
  - subskill_id: past_events
    explanation: Para contar o que você fez ontem, use uma ação passada e uma expressão temporal. Aqui, a pessoa
      relata a escrita de uma carta, não uma atividade atual.
    examples:
      - text: كَتَبْتُ رِسَالَةً أَمْسِ.
        meaning: "**O exemplo.** Escrevi uma carta ontem. `كَتَبْتُ` significa eu escrevi; a terminação marca « eu ».
          `رِسَالَةً` significa carta e `أَمْسِ` ontem. O verbo já situa a ação no passado; « ontem »
          especifica o dia."
        note: "Compare `كَتَبْتَ`, você escreveu para um homem, com `كَتَبْتُ`, eu escrevi. Experimente dizer que nós
          escrevemos uma carta ontem. Resposta: `كَتَبْنَا رِسَالَةً أَمْسِ`. A terminação do passado passa a
          `نَا`; a carta e o dia permanecem."
  - subskill_id: future_events
    explanation: Você fala de uma visita planejada para amanhã. Uma expressão futura coloca a ação depois de
      agora; o amigo e o dia dão concretude ao plano.
    examples:
      - text: سَأَزُورُ صَدِيقِي غَدًا.
        meaning: "**O exemplo.** Visitarei meu amigo amanhã. `سَأَزُورُ` combina futuro `سَـ` com eu visito.
          `صَدِيقِي` significa meu amigo, homem, com sufixo de « meu » ligado. `غَدًا` significa amanhã. A
          frase afirma um plano; só se torna promessa em uma conversa apropriada."
        note: "Sem `سَـ`, o verbo pode descrever uma visita presente ou habitual conforme o contexto. Experimente
          passar a visita para hoje. Resposta: `سَأَزُورُ صَدِيقِي الْيَوْمَ`. O marcador de futuro ainda
          coloca a visita depois de agora; hoje indica em que dia."
  - subskill_id: duration_frequency
    explanation: Uma pergunta sobre sua rotina costuma pedir frequência, como quantas vezes por semana. Este
      exemplo conta ocasiões de natação, não a duração de uma sessão.
    examples:
      - text: أَسْبَحُ مَرَّتَيْنِ فِي الْأُسْبُوعِ.
        meaning: "**O exemplo.** Nado duas vezes por semana. `أَسْبَحُ` significa eu nado. `مَرَّتَيْنِ` significa
          duas vezes, com o dual de « ocasião »; `فِي الْأُسْبُوعِ` significa por semana aqui. O intervalo e a
          quantidade juntos indicam a frequência."
        note: "Para uma vez por semana, use `مَرَّةً فِي الْأُسْبُوعِ`. « Duas vezes » não significa duas horas;
          duração exige uma expressão de unidade temporal. Experimente mudar a rotina para uma vez por semana.
          Resposta: `أَسْبَحُ مَرَّةً فِي الْأُسْبُوعِ`; o intervalo continua semanal."
  - subskill_id: event_sequence
    explanation: Ao organizar uma noite em grupo, « primeiro » e « depois » indicam a ordem. A sequência não
      significa necessariamente que o primeiro evento causa o segundo.
    examples:
      - text: أَوَّلًا نَأْكُلُ، ثُمَّ نَخْرُجُ.
        meaning: "**O exemplo.** Primeiro comemos, depois saímos. `أَوَّلًا` significa primeiro; `نَأْكُلُ` é nós
          comemos. `ثُمَّ` significa depois e `نَخْرُجُ` é nós saímos. Ambos os verbos têm forma de « nós » e
          descrevem uma sequência para o grupo, não só para um ouvinte."
        note: "Experimente dizer que primeiro saímos e depois comemos. Resposta: `أَوَّلًا نَخْرُجُ، ثُمَّ نَأْكُلُ`.
          Coloque cada ação completa na nova posição. `ثُمَّ` marca sequência; para um resultado seria
          necessária outra expressão, como `لِذٰلِكَ`, portanto."
  - subskill_id: event_phase
    explanation: Alguém quer saber se você ainda está lendo um livro. Dizer que terminou indica o ponto final da
      atividade, informação mais específica do que dizer que leu antes.
    examples:
      - text: أَنْهَيْتُ قِرَاءَةَ الْكِتَابِ.
        meaning: "**O exemplo.** Terminei de ler o livro. `أَنْهَيْتُ` significa eu terminei. `قِرَاءَةَ` é leitura, e
          `الْكِتَابِ` identifica o livro lido. A leitura é um nome de atividade depois do verbo de conclusão;
          a terminação passada de « eu » está em `أَنْهَيْتُ`."
        note: "Dizer apenas que leu antes não prova que concluiu. Mantenha o verbo de conclusão quando quiser informar
          que toda a atividade chegou ao fim. Experimente: que parte prova que a leitura terminou? Resposta:
          `أَنْهَيْتُ`; a expressão do livro só identifica o objeto lido."
