varieties:
  arabic-levantine:
    disposition: supplement
    text: Evaluate past, habitual b-prefixed forms, progressive عَمْ and future رَحْ in context.
      Progressive patterns and prefix vowels vary regionally. Examples use Southern Levantine
      first-person future forms; do not require one regional realization throughout the Levant.
    provenance: *a1
  arabic-modern-standard:
    disposition: supplement
    text: Evaluate past and imperfect morphology, contextual time and future سَـ or سَوْفَ. Do not
      demand an explicit pronoun when conjugation supplies the subject. Formal agreement depends
      on the actual construction.
    provenance: *a1
