language: arabic
skill_id: time_events
guidance: Assess current, past and future events, duration or recurrence, sequence and event
  phase. Past conjugation can locate an event before the speech time; future particles combine
  with a suitable verb form. Time adverbs and the exchange can establish reference without a
  unique mandatory tense marker. Frequency requires a recurring interval or equivalent context.
  Finishing an activity is event-phase evidence, whereas a past event alone need not entail
  completion. An answer meaning yesterday can succeed after a clear when-question. A copied time
  word with no recoverable event is absent. Do not demand English progressive auxiliaries or
  overt subject pronouns. Evaluate verbal prefixes, aspect and negation within the selected
  variety; do not mistake a legitimate colloquial form for broken Modern Standard Arabic.
