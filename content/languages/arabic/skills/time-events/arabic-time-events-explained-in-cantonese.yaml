sections:
  - subskill_id: present_events
    explanation: 有人問你而家做緊乜。動作加埋「而家」，就清楚表示進行中嘅活動。
    examples:
      - text: أَكْتُبُ رِسَالَةً الْآنَ.
        meaning: "**例句。** 我而家寫緊信。 `أَكْتُبُ` 係「我寫」，`رِسَالَةً` 係一封信，`الْآنَ`
          係而家。動詞指出寫嘅係我。呢個動詞形式配合時間情境，就可以表達「寫緊」，唔使另加進行式助動詞。"
        note: 另一個情境下，同一動詞可以描述習慣。試下將信改成書，保留而家做緊：`أَكْتُبُ كِتَابًا الْآنَ`。物件改成 `كِتَابًا`，我嘅動詞同而家保留。
  - subskill_id: past_events
    explanation: 想講昨日做咗乜，就可以用過去動作加時間詞。呢度講者報告寫咗信，唔係而家寫緊。
    examples:
      - text: كَتَبْتُ رِسَالَةً أَمْسِ.
        meaning: "**例句。** 我噚日寫咗封信。 `كَتَبْتُ` 係「我寫咗」，詞尾指出我。`رِسَالَةً` 係一封信，`أَمْسِ`
          係昨日。動詞本身已有過去指向，昨日就交代邊一日。"
        note: 比較向男性講「你寫咗」嘅 `كَتَبْتَ` 同「我寫咗」嘅 `كَتَبْتُ`。試下話我哋昨日寫咗信：`كَتَبْنَا رِسَالَةً أَمْسِ`。過去詞尾改成
          `نَا`，信同日子保留。
  - subskill_id: future_events
    explanation: 你想講聽日嘅探訪。將來表達將動作放喺而家之後，再講朋友同日子，就清楚交代計劃。
    examples:
      - text: سَأَزُورُ صَدِيقِي غَدًا.
        meaning: "**例句。** 聽日我會去探朋友。 `سَأَزُورُ` 將表示將來嘅 `سَـ` 同「我探訪」合埋。`صَدِيقِي` 係我嘅男性朋友，帶連住嘅「我嘅」後綴。`غَدًا`
          係聽日。呢句講計劃，喺合適對話先會成為承諾。"
        note: 冇將來 `سَـ`，動詞可以按情境表示現在或慣常探訪。試下改成今日探：`سَأَزُورُ صَدِيقِي الْيَوْمَ`。將來標記仍然將探訪放喺而家之後，今日就交代日子。
  - subskill_id: duration_frequency
    explanation: 人哋問日常習慣，通常要知道幾密，例如一星期幾次。呢句數游水次數，唔係一次游幾耐。
    examples:
      - text: أَسْبَحُ مَرَّتَيْنِ فِي الْأُسْبُوعِ.
        meaning: "**例句。** 我每個禮拜游兩次水。 `أَسْبَحُ` 係「我游水」。`مَرَّتَيْنِ` 用「次」嘅雙數表示兩次；`فِي الْأُسْبُوعِ`
          呢度係「每星期」。次數加埋時間範圍，就交代幾密做呢件事。"
        note: 一星期一次用 `مَرَّةً فِي الْأُسْبُوعِ`。兩次唔係兩個鐘，時長要另一個時間單位短語。試下改成每星期一次：`أَسْبَحُ مَرَّةً فِي
          الْأُسْبُوعِ`；時間範圍仍然係一星期。
  - subskill_id: event_sequence
    explanation: 一齊安排晚上活動時，「先」同「之後」交代次序。先做嗰件事唔一定係後面嗰件事嘅原因。
    examples:
      - text: أَوَّلًا نَأْكُلُ، ثُمَّ نَخْرُجُ.
        meaning: "**例句。** 我哋先食飯，然後出街。 `أَوَّلًا` 係先，`نَأْكُلُ` 係我哋食。`ثُمَّ` 係然後，`نَخْرُجُ`
          係我哋出去。兩個動詞都用「我哋」，所以係大家嘅安排，唔係淨係聽者一個人。"
        note: 試下話先出去，再食嘢：`أَوَّلًا نَخْرُجُ، ثُمَّ نَأْكُلُ`。成個動作移到新位置。`ثُمَّ` 交代次序；想表達結果，就要用例如
          `لِذٰلِكَ`「所以」。
  - subskill_id: event_phase
    explanation: 有人想知你仲讀唔讀緊本書。話已經讀完，就指出終點，比淨係話之前讀過更清楚。
    examples:
      - text: أَنْهَيْتُ قِرَاءَةَ الْكِتَابِ.
        meaning: "**例句。** 我睇完本書喇。 `أَنْهَيْتُ` 係我完成咗，`قِرَاءَةَ` 係閱讀，`الْكِتَابِ`
          指讀緊嘅本書。「閱讀」喺完成動詞後面用活動名詞；過去式「我」嘅詞尾喺 `أَنْهَيْتُ` 上面。"
        note: 淨係話過去讀過，未代表讀完。想講成個活動到達終點，就要保留完成動詞。試下：邊部分指出閱讀完成？答案係 `أَنْهَيْتُ`；書嘅短語只指出讀乜。
