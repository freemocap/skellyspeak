variety_sections:
  arabic-levantine:
    - subskill_id: present_events
      explanation: 有人問你而家做緊乜。動作加埋「而家」，就清楚表示進行中嘅活動。
      examples:
        - text: هَلَّقْ عَمْ بَكْتُبْ رِسَالِة.
          meaning: "**例句。** 我而家寫緊信。 `هَلَّقْ` 係而家，`عَمْ` 標示進行中活動，`بَكْتُبْ` 係「我寫」，`رِسَالِة`
            係一封信。進行標記話畀聽者知你寫緊，唔係報告已經寫完。"
          note: 比較 `بَكْتُبْ رِسَالِة`「我寫信」：冇進行框架時，情境可以令佢表示習慣。試下講而家寫緊一本書：`هَلَّقْ عَمْ بَكْتُبْ
            كِتَابْ`；只換物件，保留進行中框架。
    - subskill_id: past_events
      explanation: 想講昨日做咗乜，就可以用過去動作加時間詞。呢度講者報告寫咗信，唔係而家寫緊。
      examples:
        - text: كَتَبْتْ رِسَالِة مْبَارِحْ.
          meaning: "**例句。** 我噚日寫咗封信。 `كَتَبْتْ` 喺呢個情境係「我寫咗」，`رِسَالِة` 係一封信，`مْبَارِحْ`
            係昨日。詞尾係過去形式。呢個口語寫法亦可以用嚟向男性講「你寫咗」，所以要靠情境認人稱。"
          note: 加 `أَنَا` 可以明示我。試下話我哋昨日寫咗信：`كَتَبْنَا رِسَالِة مْبَارِحْ`。「我哋」詞尾 `نَا` 指出成班人，時間同物件保留。
    - subskill_id: future_events
      explanation: 你想講聽日嘅探訪。將來表達將動作放喺而家之後，再講朋友同日子，就清楚交代計劃。
      examples:
        - text: رَحْ أَزُورْ صَاحْبِي بُكْرَا.
          meaning: "**例句。** 聽日我會去探朋友。 `رَحْ` 標示將來，後面依附形式 `أَزُورْ` 係「我探訪」。`صَاحْبِي` 係我嘅男性朋友，`بُكْرَا`
            係聽日。`رَحْ` 後面動作冇一般 b 前綴。"
          note: 依附動作前保留 `رَحْ`。試下改成今日探：`رَحْ أَزُورْ صَاحْبِي الْيَوْمْ`。換走 `بُكْرَا` 只改日子，將來句式同探訪者保留。
    - subskill_id: duration_frequency
      explanation: 人哋問日常習慣，通常要知道幾密，例如一星期幾次。呢句數游水次數，唔係一次游幾耐。
      examples:
        - text: بَسْبَحْ مَرَّتَيْنْ بِالْأُسْبُوعْ.
          meaning: "**例句。** 我每個禮拜游兩次水。 `بَسْبَحْ` 係一般習慣現在式「我游水」。`مَرَّتَيْنْ` 係兩次，`بِالْأُسْبُوعْ` 係每星期。b
            前綴配合日常習慣陳述，次數就話畀人知做幾次。"
          note: 每星期一次可以講 `بَسْبَحْ مَرَّة بِالْأُسْبُوعْ`。雙數數嘅係次數，唔係游水嘅人。試下：原句有冇講每次游幾耐？冇；佢講頻率，時長要另外交代。
    - subskill_id: event_sequence
      explanation: 一齊安排晚上活動時，「先」同「之後」交代次序。先做嗰件事唔一定係後面嗰件事嘅原因。
      examples:
        - text: أَوَّلْ شِي بِنَاكُلْ، بَعْدَيْنْ بِنِطْلَعْ.
          meaning: "**例句。** 我哋先食飯，然後出街。 `أَوَّلْ شِي` 係先，呢個口語形式 `بِنَاكُلْ` 係我哋食。`بَعْدَيْنْ` 係之後，`بِنِطْلَعْ`
            係我哋出去。帶 b 前綴嘅一般形式交代大家安排嘅次序。"
          note: 交換活動時，次序短語可以保留。試下話先出去，再食嘢：`أَوَّلْ شِي بِنِطْلَعْ، بَعْدَيْنْ
            بِنَاكُلْ`。兩個動詞交換位置，次序反過來，但參與者冇改。
    - subskill_id: event_phase
      explanation: 有人想知你仲讀唔讀緊本書。話已經讀完，就指出終點，比淨係話之前讀過更清楚。
      examples:
        - text: خَلَّصْتْ قِرَايِة الْكِتَابْ.
          meaning: "**例句。** 我睇完本書喇。 `خَلَّصْتْ` 喺呢個情境係我完成咗。`قِرَايِة` 係閱讀，`الْكِتَابْ`
            係本書。活動名詞指出完成乜，完成動詞嘅過去式就交代終點。"
          note: 情境唔清楚，可以加 `أَنَا` 表明係自己。讀咗一部分唔等於成個閱讀活動完成。試下：原句可唔可以答「你仲讀緊？」可以；佢話閱讀已經結束，唔止係之前發生過。
