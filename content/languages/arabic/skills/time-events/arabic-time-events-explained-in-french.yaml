sections:
  - subskill_id: present_events
    explanation: Quelqu’un demande ce que vous faites en ce moment. Le verbe et « maintenant » situent ensemble
      une activité en cours.
    examples:
      - text: أَكْتُبُ رِسَالَةً الْآنَ.
        meaning: "**L’exemple.** J’écris une lettre maintenant. `أَكْتُبُ` signifie « j’écris », `رِسَالَةً` « une
          lettre » et `الْآنَ` « maintenant ». La forme du verbe indique la première personne. Avec ce
          contexte temporel, elle exprime l’action en cours sans verbe auxiliaire distinct."
        note: "Le même verbe peut désigner une habitude dans un autre contexte. Essayez : remplacez la lettre par un
          livre, tout en gardant l’action en cours. Réponse : `أَكْتُبُ كِتَابًا الْآنَ`. L’objet devient
          `كِتَابًا` ; la forme « je » et « maintenant » restent."
  - subskill_id: past_events
    explanation: Vous racontez ce que vous avez fait hier. Un verbe au passé et une indication du jour distinguent
      ce fait d’une activité actuelle.
    examples:
      - text: كَتَبْتُ رِسَالَةً أَمْسِ.
        meaning: "**L’exemple.** J’ai écrit une lettre hier. `كَتَبْتُ` signifie « j’ai écrit » ; sa terminaison
          indique « je ». `رِسَالَةً` signifie « une lettre » et `أَمْسِ` « hier ». Le verbe situe déjà
          l’action dans le passé ; le dernier mot précise le jour."
        note: "Comparez `كَتَبْتَ`, « tu as écrit » en s’adressant à un homme, et `كَتَبْتُ`, la forme « je ». Essayez
          : dites que nous avons écrit une lettre hier. Réponse : `كَتَبْنَا رِسَالَةً أَمْسِ`. La terminaison
          devient `نَا` ; l’objet et le jour restent identiques."
  - subskill_id: future_events
    explanation: Vous annoncez une visite prévue demain. La forme future place l’action après le moment où vous
      parlez ; l’ami et le jour précisent le projet.
    examples:
      - text: سَأَزُورُ صَدِيقِي غَدًا.
        meaning: "**L’exemple.** Je rendrai visite à mon ami demain. `سَأَزُورُ` associe le futur `سَـ` à la forme «
          je rends visite ». `صَدِيقِي` désigne mon ami, un homme, avec un suffixe possessif. `غَدًا` signifie
          « demain ». La phrase présente un projet ; elle ne devient une promesse que dans un échange
          approprié."
        note: "Sans `سَـ`, le verbe peut décrire une visite présente ou habituelle selon le contexte. Essayez : placez
          la visite aujourd’hui. Réponse : `سَأَزُورُ صَدِيقِي الْيَوْمَ`. Le marqueur futur situe toujours la
          visite après le moment présent ; « aujourd’hui » en donne le jour."
  - subskill_id: duration_frequency
    explanation: Pour décrire votre routine, vous pouvez indiquer combien de fois vous nagez chaque semaine. Ce
      nombre d’occasions diffère de la durée d’une séance.
    examples:
      - text: أَسْبَحُ مَرَّتَيْنِ فِي الْأُسْبُوعِ.
        meaning: "**L’exemple.** Je nage deux fois par semaine. `أَسْبَحُ` signifie « je nage ». `مَرَّتَيْنِ`
          signifie « deux fois » avec le duel du mot « fois » ; `فِي الْأُسْبُوعِ` signifie ici « par semaine
          ». Le nombre et l’intervalle donnent ensemble la fréquence."
        note: "Pour une seule fois par semaine, employez `مَرَّةً فِي الْأُسْبُوعِ`. « Deux fois » ne signifie pas «
          deux heures » ; la durée demanderait une expression de temps différente. Essayez : passez à une fois
          par semaine. Réponse : `أَسْبَحُ مَرَّةً فِي الْأُسْبُوعِ` ; l’intervalle reste la semaine."
  - subskill_id: event_sequence
    explanation: Un groupe organise sa soirée. « D’abord » et « ensuite » indiquent dans quel ordre les activités
      auront lieu ; cet ordre n’implique pas à lui seul un rapport de cause.
    examples:
      - text: أَوَّلًا نَأْكُلُ، ثُمَّ نَخْرُجُ.
        meaning: "**L’exemple.** D’abord nous mangeons, puis nous sortons. `أَوَّلًا` signifie « d’abord » et
          `نَأْكُلُ` « nous mangeons ». `ثُمَّ` signifie « ensuite » et `نَخْرُجُ` « nous sortons ». Les deux
          verbes sont à la forme « nous » et concernent le groupe."
        note: "Essayez : dites que le groupe sort d’abord et mange ensuite. Réponse : `أَوَّلًا نَخْرُجُ، ثُمَّ
          نَأْكُلُ`. Déplacez chaque action complète à sa nouvelle place. `ثُمَّ` indique l’ordre ; un
          résultat demanderait plutôt une expression telle que `لِذٰلِكَ`, « donc »."
  - subskill_id: event_phase
    explanation: Quelqu’un veut savoir si vous lisez encore un livre. Dire que vous l’avez terminé précise que
      l’activité est arrivée à son terme, et pas seulement qu’elle a eu lieu.
    examples:
      - text: أَنْهَيْتُ قِرَاءَةَ الْكِتَابِ.
        meaning: "**L’exemple.** J’ai fini de lire le livre. `أَنْهَيْتُ` signifie « j’ai terminé ». `قِرَاءَةَ` nomme
          la lecture et `الْكِتَابِ` identifie le livre lu. L’activité est exprimée par un nom après le verbe
          « finir » ; la terminaison passée « je » se trouve dans `أَنْهَيْتُ`."
        note: "Dire seulement que vous avez lu dans le passé n’établit pas que vous avez fini. Gardez le verbe
          d’achèvement pour indiquer la fin de toute l’activité. Essayez : quel élément prouve que la lecture
          est terminée ? Réponse : `أَنْهَيْتُ` ; l’expression du livre ne fait qu’identifier l’objet lu."
