variety_sections:
  arabic-levantine:
    - subskill_id: present_events
      explanation: Quelqu’un demande ce que vous faites en ce moment. Le marqueur de progression et l’indication «
        maintenant » montrent que l’activité est en cours.
      examples:
        - text: هَلَّقْ عَمْ بَكْتُبْ رِسَالِة.
          meaning: "**L’exemple.** J’écris une lettre maintenant. `هَلَّقْ` signifie « maintenant ». `عَمْ` marque une
            action en cours ; `بَكْتُبْ` signifie « j’écris » et `رِسَالِة` « une lettre ». Le marqueur de
            progression présente l’écriture comme actuelle, plutôt que de rapporter une lettre achevée."
          note: "Comparez `بَكْتُبْ رِسَالِة`, « j’écris une lettre » : sans le cadre progressif, le contexte pourrait
            donner une lecture habituelle. Essayez : dites que vous écrivez un livre maintenant. Réponse :
            `هَلَّقْ عَمْ بَكْتُبْ كِتَابْ` ; changez l’objet en gardant le cadre d’action en cours."
    - subskill_id: past_events
      explanation: Vous racontez ce que vous avez fait hier. La forme passée et le mot « hier » distinguent ce fait
        d’une activité actuelle.
      examples:
        - text: كَتَبْتْ رِسَالِة مْبَارِحْ.
          meaning: "**L’exemple.** J’ai écrit une lettre hier. `كَتَبْتْ` signifie ici « j’ai écrit » ; `رِسَالِة`
            désigne une lettre et `مْبَارِحْ` signifie « hier ». La terminaison marque une forme passée. Dans
            ce modèle parlé, la graphie peut aussi servir en s’adressant à un homme ; le contexte aide à
            identifier la personne."
          note: "Ajouter `أَنَا` rend la lecture « je » explicite. Essayez : dites que nous avons écrit une lettre hier.
            Réponse : `كَتَبْنَا رِسَالِة مْبَارِحْ`. La terminaison « nous » `نَا` identifie le groupe ;
            l’objet et le temps restent les mêmes."
    - subskill_id: future_events
      explanation: Vous annoncez la visite d’un ami demain. Le marqueur futur situe l’action après le présent, et le
        jour précise le projet.
      examples:
        - text: رَحْ أَزُورْ صَاحْبِي بُكْرَا.
          meaning: "**L’exemple.** Je rendrai visite à mon ami demain. `رَحْ` marque le futur et `أَزُورْ` est la forme
            dépendante « je rends visite » qui suit. `صَاحْبِي` signifie « mon ami », un homme, et `بُكْرَا` «
            demain ». Le verbe après `رَحْ` n’a pas son préfixe b- ordinaire."
          note: "Gardez `رَحْ` avant l’action à la forme dépendante. Essayez : placez la visite aujourd’hui. Réponse :
            `رَحْ أَزُورْ صَاحْبِي الْيَوْمْ`. Remplacer `بُكْرَا` change le jour, sans changer la
            construction future ni la personne qui rend visite."
    - subskill_id: duration_frequency
      explanation: Pour décrire votre routine, vous pouvez compter combien de fois vous nagez chaque semaine. Ce
        nombre d’occasions ne dit pas combien de temps dure une séance.
      examples:
        - text: بَسْبَحْ مَرَّتَيْنْ بِالْأُسْبُوعْ.
          meaning: "**L’exemple.** Je nage deux fois par semaine. `بَسْبَحْ` est une forme habituelle de « je nage ».
            `مَرَّتَيْنْ` signifie « deux fois » et `بِالْأُسْبُوعْ` « par semaine ». Le préfixe b- convient à
            la routine ; le duel compte les occasions."
          note: "Pour une seule fois par semaine, dites `بَسْبَحْ مَرَّة بِالْأُسْبُوعْ`. Le duel compte des occasions,
            pas les personnes qui nagent. Essayez : la phrase initiale indique-t-elle la durée de chaque
            séance ? Réponse : non ; elle donne la fréquence. La durée demanderait une autre expression."
    - subskill_id: event_sequence
      explanation: Un groupe organise sa soirée. « D’abord » et « ensuite » fixent l’ordre des activités sans
        affirmer que la première cause la seconde.
      examples:
        - text: أَوَّلْ شِي بِنَاكُلْ، بَعْدَيْنْ بِنِطْلَعْ.
          meaning: "**L’exemple.** D’abord nous mangeons, puis nous sortons. `أَوَّلْ شِي` signifie « d’abord » ;
            `بِنَاكُلْ` « nous mangeons » dans ce modèle parlé. `بَعْدَيْنْ` signifie « ensuite » et
            `بِنِطْلَعْ` « nous sortons ». Les deux formes préfixées par b- décrivent le programme du groupe."
          note: "Les mots d’ordre peuvent rester en place quand les activités sont inversées. Essayez : dites que le
            groupe sort d’abord et mange ensuite. Réponse : `أَوَّلْ شِي بِنِطْلَعْ، بَعْدَيْنْ بِنَاكُلْ`.
            Les verbes échangent leur place ; les participants ne changent pas."
    - subskill_id: event_phase
      explanation: Quelqu’un veut savoir si vous lisez encore un livre. Dire que vous l’avez terminé marque la fin
        de l’activité, ce qui est plus précis que dire seulement « j’ai lu ».
      examples:
        - text: خَلَّصْتْ قِرَايِة الْكِتَابْ.
          meaning: "**L’exemple.** J’ai fini de lire le livre. `خَلَّصْتْ` signifie ici « j’ai fini ». `قِرَايِة`
            désigne la lecture et `الْكِتَابْ` le livre. Le nom d’activité dit ce qui est achevé ; la forme
            passée de « finir » marque la fin."
          note: "Quand le contexte ne suffit pas, `أَنَا` peut rendre explicite la personne qui parle. Avoir lu une
            partie du livre ne revient pas à l’avoir fini. Essayez : la phrase répond-elle naturellement à «
            Le lis-tu encore ? » Réponse : oui ; elle dit que la lecture est terminée, et pas seulement
            qu’elle a eu lieu auparavant."
