variety_sections:
  arabic-levantine:
    - subskill_id: present_events
      explanation: 有人问你此刻在做什么。说出动作并加上“现在”，就能明确你描述的是正在进行的活动。
      examples:
        - text: هَلَّقْ عَمْ بَكْتُبْ رِسَالِة.
          meaning: "**例句。** 我现在正在写一封信。`هَلَّقْ` 意为现在。`عَمْ` 标明活动进行中；`بَكْتُبْ` 是我写，`رِسَالِة`
            是一封信。进行标记告诉听话人写信尚在进行，而不是报告信已写完。"
          note: 比较 `بَكْتُبْ رِسَالِة`，意为我写信；没有进行框架时，语境可能使它读作习惯。试一试：改成我现在正在写一本书。答案：`هَلَّقْ عَمْ بَكْتُبْ
            كِتَابْ`；替换宾语，保留进行中表达。
    - subskill_id: past_events
      explanation: 告诉别人昨天完成了什么时，用过去动作加时间短语。这里说话人报告写了一封信，不是说眼下正在写。
      examples:
        - text: كَتَبْتْ رِسَالِة مْبَارِحْ.
          meaning: "**例句。** 昨天我写了一封信。`كَتَبْتْ` 在这里意为我写了；`رِسَالِة` 是一封信，`مْبَارِحْ`
            是昨天。词尾标记过去形式。在这个口语范例中，书写形式也可能用于称呼一名男子，因此需要语境帮助辨认人称。"
          note: 加 `أَنَا` 可以明确“我”的读法。试一试：说昨天我们写了一封信。答案：`كَتَبْنَا رِسَالِة مْبَارِحْ`。表示“我们”的词尾 `نَا` 指出小组；时间和宾语不变。
    - subskill_id: future_events
      explanation: 你告诉别人明天的探访计划。未来表达把行动放在现在之后；朋友与日期使计划具体。
      examples:
        - text: رَحْ أَزُورْ صَاحْبِي بُكْرَا.
          meaning: "**例句。** 我明天会探望朋友。`رَحْ` 标记未来，后面的 `أَزُورْ` 是依附形式的我探访。`صَاحْبِي` 指我的男性朋友，`بُكْرَا` 是明天。`رَحْ`
            后的动作没有普通 b- 前缀。"
          note: 把 `رَحْ` 保留在从属动作前。试一试：把探访改到今天。答案：`رَحْ أَزُورْ صَاحْبِي الْيَوْمْ`。换掉 `بُكْرَا` 改变日期，但不改变未来结构或探访的人。
    - subskill_id: duration_frequency
      explanation: 询问日常活动时，常需要频率，例如每周几次。这个例子数的是游泳的次数，不是每次游多久。
      examples:
        - text: بَسْبَحْ مَرَّتَيْنْ بِالْأُسْبُوعْ.
          meaning: "**例句。** 我每周游泳两次。`بَسْبَحْ` 是报告常规习惯时的“我游泳”。`مَرَّتَيْنْ` 意为两次，`بِالْأُسْبُوعْ` 意为每周。b-
            前缀适合报告习惯，数字说明发生几回。"
          note: 每周一次说 `بَسْبَحْ مَرَّة بِالْأُسْبُوعْ`。双数计量发生次数，不是游泳的人数。试一试：原句说明每次游多久吗？答案：没有；它说的是频率，时长需要另一短语。
    - subskill_id: event_sequence
      explanation: 大家在安排晚上的活动时，“先”和“然后”说明遵循什么顺序。先后不等于前一件事导致后一件。
      examples:
        - text: أَوَّلْ شِي بِنَاكُلْ، بَعْدَيْنْ بِنِطْلَعْ.
          meaning: "**例句。** 我们先吃饭，然后出门。`أَوَّلْ شِي` 意为首先；`بِنَاكُلْ` 在这个口语范例中是我们吃。`بَعْدَيْنْ` 是然后，`بِنِطْلَعْ`
            是我们出去。普通的带 b- 前缀形式描述大家已安排的顺序。"
          note: 表示先后的短语可以保留，同时交换两个活动。试一试：说先出门，然后吃饭。答案：`أَوَّلْ شِي بِنِطْلَعْ، بَعْدَيْنْ
            بِنَاكُلْ`。两个动词交换位置，顺序随之反转，参与的人不变。
    - subskill_id: event_phase
      explanation: 有人想知道你是否还在读一本书。说已经读完，明确指出达到了终点，比只说早些时候读过更具体。
      examples:
        - text: خَلَّصْتْ قِرَايِة الْكِتَابْ.
          meaning: "**例句。** 我读完这本书了。`خَلَّصْتْ` 在这里意为我完成了。`قِرَايِة` 是阅读，`الْكِتَابْ` 是这本书。活动名词说出完成的是什么；“完成”的过去式形式标明终点。"
          note: 若语境不清，可加 `أَنَا` 明确说话人。读过一部分不等于读完。试一试：原句能自然回答“你还在读吗”？答案：能；它说阅读已经结束，而不只是过去曾读过。
