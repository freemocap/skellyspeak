variety_sections:
  arabic-levantine:
    - subskill_id: present_events
      explanation: يسألك شخص عما تفعله الآن. تسمية الفعل مع كلمة «الآن» توضح أنك تصف نشاطًا جاريًا.
      examples:
        - text: هَلَّقْ عَمْ بَكْتُبْ رِسَالِة.
          meaning: "**المثال.** أكتب رسالة الآن. تعني `هَلَّقْ` الآن. وتدل `عَمْ` على نشاط جارٍ؛ و`بَكْتُبْ`
            أكتب، و`رِسَالِة` رسالة. تخبر علامة الاستمرار المستمع بأنك في أثناء الكتابة، لا أنك تبلغ
            عن رسالة مكتملة."
          note: "قارن `بَكْتُبْ رِسَالِة`، أي أكتب رسالة: من غير إطار الاستمرار، قد يعطي السياق معنى العادة.
            **جرّب:** اجعل المثال يقول إنك تكتب كتابًا الآن. الإجابة: `هَلَّقْ عَمْ بَكْتُبْ
            كِتَابْ`؛ غيّر المفعول وأبقِ إطار الفعل الجاري."
    - subskill_id: past_events
      explanation: لإخبار شخص بما أنجزت أمس، استعمل فعلًا ماضيًا وتعبيرًا للوقت. يبلغ المتحدث هنا عن كتابة
        رسالة لا عن نشاط جارٍ.
      examples:
        - text: كَتَبْتْ رِسَالِة مْبَارِحْ.
          meaning: "**المثال.** كتبت رسالة أمس. تعني `كَتَبْتْ` «كتبت» في هذا السياق؛ و`رِسَالِة` رسالة،
            و`مْبَارِحْ` أمس. تحدد النهاية صيغة ماضية. في هذا النموذج المنطوق قد تظهر الكتابة نفسها
            عند مخاطبة رجل واحد، لذا يساعد السياق على تحديد الشخص."
          note: "قد تجعل `أَنَا` معنى المتكلم صريحًا. **جرّب:** قل إننا كتبنا رسالة أمس. الإجابة: `كَتَبْنَا
            رِسَالِة مْبَارِحْ`. تحدد نهاية «نحن» `نَا` المجموعة؛ ويبقى الوقت والمفعول كما هما."
    - subskill_id: future_events
      explanation: تخبر شخصًا بزيارة الغد. يضع تعبير المستقبل الفعل بعد الآن، ويجعل ذكر الصديق واليوم
        الخطة محددة.
      examples:
        - text: رَحْ أَزُورْ صَاحْبِي بُكْرَا.
          meaning: "**المثال.** سأزور صديقي غدًا. تحدد `رَحْ` المستقبل، و`أَزُورْ` «أزور» في الصيغة التابعة
            بعدها. وتعني `صَاحْبِي` صديقي الذكر، و`بُكْرَا` غدًا. لا يأخذ الفعل بعد `رَحْ` باء
            المضارع المعتادة."
          note: "أبقِ `رَحْ` قبل الفعل التابع. **جرّب:** انقل الزيارة إلى اليوم. الإجابة: `رَحْ أَزُورْ
            صَاحْبِي الْيَوْمْ`. يغيّر استبدال `بُكْرَا` اليوم، ولا يغيّر تركيب المستقبل أو صاحب
            الزيارة."
    - subskill_id: duration_frequency
      explanation: يحتاج السؤال عن عادتك غالبًا إلى تكرار، مثل عدد المرات في كل أسبوع. يعدّ المثال مناسبات
        السباحة لا مدة سباحة واحدة.
      examples:
        - text: بَسْبَحْ مَرَّتَيْنْ بِالْأُسْبُوعْ.
          meaning: "**المثال.** أسبح مرتين في الأسبوع. `بَسْبَحْ` صيغة متكلم حاضرة معتادة بمعنى أسبح. وتعني
            `مَرَّتَيْنْ` مرتين، و`بِالْأُسْبُوعْ` في الأسبوع. تلائم باء المضارع الإخبار عن عادة،
            بينما يحدد العدد عدد المناسبات."
          note: "للمرة الواحدة أسبوعيًا قل `بَسْبَحْ مَرَّة بِالْأُسْبُوعْ`. يعدّ المثنى المناسبات لا الأشخاص
            الذين يسبحون. **جرّب:** هل يذكر المثال مدة كل سباحة؟ الإجابة: لا؛ يذكر التكرار، وتحتاج
            المدة إلى عبارة أخرى."
    - subskill_id: event_sequence
      explanation: عند ترتيب أمسية مشتركة، تخبر «أولًا» و«ثم» المجموعةَ بتسلسل الأفعال. لا يلزم من الترتيب
        أن الأول سبب الثاني.
      examples:
        - text: أَوَّلْ شِي بِنَاكُلْ، بَعْدَيْنْ بِنِطْلَعْ.
          meaning: "**المثال.** نأكل أولًا ثم نخرج. تعني `أَوَّلْ شِي` أولًا؛ و`بِنَاكُلْ` نأكل في هذا النموذج
            المنطوق. وتعني `بَعْدَيْنْ` ثم، و`بِنِطْلَعْ` نخرج. تصف الصيغ المعتادة ذات الباء التسلسل
            المرتب للمجموعة."
          note: "يمكن لعبارتي الترتيب أن تبقيا مع تبادل النشاطين. **جرّب:** قل إننا نخرج أولًا ثم نأكل.
            الإجابة: `أَوَّلْ شِي بِنِطْلَعْ، بَعْدَيْنْ بِنَاكُلْ`. يتبادل الفعلان الموقع، فينعكس
            الترتيب من غير تغيير المشاركين."
    - subskill_id: event_phase
      explanation: يسأل شخص هل ما زلت تقرأ كتابًا. يحدد قولك إنك انتهيت نقطة النهاية، وهو أدق من القول إنك
        قرأت من قبل.
      examples:
        - text: خَلَّصْتْ قِرَايِة الْكِتَابْ.
          meaning: "**المثال.** أنهيت قراءة الكتاب. تعني `خَلَّصْتْ` «أنهيت» في هذا السياق. و`قِرَايِة`
            القراءة، و`الْكِتَابْ` الكتاب. يسمّي اسم النشاط ما اكتمل؛ وتقدّم صيغة الماضي لفعل
            الإنهاء نقطة النهاية."
          note: "يمكنك توضيح المتحدث بـ`أَنَا` إذا غمض السياق. لا تساوِ بين «قرأت بعضه» و«أنهيت قراءته».
            **جرّب:** هل تصلح الجملة الأصلية جوابًا طبيعيًا عن سؤال «هل ما زلت تقرأه؟» الإجابة: نعم؛
            فهي تقول إن القراءة انتهت، لا أنها حدثت سابقًا فحسب."
