sections:
  - subskill_id: present_events
    explanation: يسألك شخص عما تفعله الآن. تسمية الفعل مع كلمة «الآن» توضح أنك تصف نشاطًا جاريًا.
    examples:
      - text: أَكْتُبُ رِسَالَةً الْآنَ.
        meaning: "**المثال.** أكتب رسالة الآن. تعني `أَكْتُبُ` «أكتب»؛ و`رِسَالَةً` رسالة؛ و`الْآنَ` الآن.
          تحدد صيغة المتكلم الكاتب. تعبّر العربية بهذه الصيغة مع سياق الوقت عن الكتابة الجارية، بدل
          إضافة كلمة منفصلة بمعنى «am»."
        note: "قد يصف الفعل نفسه عادةً في سياق آخر. **جرّب:** بدّل المفعول من رسالة إلى كتاب مع إبقاء الفعل
          جاريًا. الإجابة: `أَكْتُبُ كِتَابًا الْآنَ`. يتغير المفعول إلى `كِتَابًا`؛ وتبقى صيغة
          المتكلم و«الآن» كما هما."
  - subskill_id: past_events
    explanation: لإخبار شخص بما أنجزت أمس، استعمل فعلًا ماضيًا وتعبيرًا للوقت. يبلغ المتحدث هنا عن كتابة
      رسالة لا عن نشاط جارٍ.
    examples:
      - text: كَتَبْتُ رِسَالَةً أَمْسِ.
        meaning: "**المثال.** كتبت رسالة أمس. تعني `كَتَبْتُ` «كتبتُ»؛ وتحدد نهايتها المتكلم. وتعني
          `رِسَالَةً` رسالة، و`أَمْسِ` أمس. يحمل الفعل دلالة الماضي أصلًا؛ ويحدد «أمس» اليوم
          المعني."
        note: "قارن `كَتَبْتَ`، أي كتبتَ لمخاطَب واحد، بصيغة المتكلم `كَتَبْتُ`. **جرّب:** أخبر أنكم كتبتم
          رسالة أمس. الإجابة: `كَتَبْنَا رِسَالَةً أَمْسِ`. تتغير نهاية الماضي إلى `نَا`؛ وتبقى
          الرسالة واليوم."
  - subskill_id: future_events
    explanation: تخبر شخصًا بزيارة الغد. يضع تعبير المستقبل الفعل بعد الآن، ويجعل ذكر الصديق واليوم الخطة محددة.
    examples:
      - text: سَأَزُورُ صَدِيقِي غَدًا.
        meaning: "**المثال.** سأزور صديقي غدًا. تجمع `سَأَزُورُ` علامة المستقبل `سَـ` وصيغة «أزور». وتعني
          `صَدِيقِي` صديقي الذكر مع لاحقة الملكية المتصلة. وتعني `غَدًا` غدًا. تذكر الجملة خطةً؛ ولا
          تصير وعدًا إلا في حوار يناسب ذلك."
        note: "من دون علامة المستقبل `سَـ`، قد يصف الفعل زيارةً حاضرة أو معتادة بحسب السياق. **جرّب:** انقل
          الزيارة إلى اليوم. الإجابة: `سَأَزُورُ صَدِيقِي الْيَوْمَ`. تظل علامة المستقبل تضع الزيارة
          بعد الآن؛ ويحدد «اليوم» يومها."
  - subskill_id: duration_frequency
    explanation: يحتاج السؤال عن عادتك غالبًا إلى تكرار، مثل عدد المرات في كل أسبوع. يعدّ المثال مناسبات
      السباحة لا مدة سباحة واحدة.
    examples:
      - text: أَسْبَحُ مَرَّتَيْنِ فِي الْأُسْبُوعِ.
        meaning: "**المثال.** أسبح مرتين في الأسبوع. تعني `أَسْبَحُ` «أسبح». وتعني `مَرَّتَيْنِ` مرتين بصيغة
          مثنى «مرة»؛ وتعني `فِي الْأُسْبُوعِ` هنا في الأسبوع. يوضح الفاصل الزمني والعدد معًا كم مرة
          يحدث النشاط."
        note: "للمرة الواحدة في الأسبوع استعمل `مَرَّةً فِي الْأُسْبُوعِ`. لا تعني مرتين ساعتين؛ فالمدة
          تحتاج إلى عبارة بوحدة زمن. **جرّب:** غيّر العادة إلى مرة أسبوعيًا. الإجابة: `أَسْبَحُ
          مَرَّةً فِي الْأُسْبُوعِ`؛ ويبقى الفاصل أسبوعيًا."
  - subskill_id: event_sequence
    explanation: عند ترتيب أمسية مشتركة، تخبر «أولًا» و«ثم» المجموعةَ بتسلسل الأفعال. لا يلزم من الترتيب
      أن الأول سبب الثاني.
    examples:
      - text: أَوَّلًا نَأْكُلُ، ثُمَّ نَخْرُجُ.
        meaning: "**المثال.** نأكل أولًا ثم نخرج. تعني `أَوَّلًا` أولًا؛ و`نَأْكُلُ` نأكل. وتعني `ثُمَّ` ثم،
          و`نَخْرُجُ` نخرج. يستعمل الفعلان صيغة «نحن»، فتصف الجملة تسلسلًا للمجموعة لا للمخاطَب
          وحده."
        note: "**جرّب:** قل إننا نخرج أولًا ثم نأكل. الإجابة: `أَوَّلًا نَخْرُجُ، ثُمَّ نَأْكُلُ`. انقل كل
          فعل كاملًا إلى موضعه الجديد. تحدد `ثُمَّ` التسلسل؛ وللنتيجة تحتاج إلى تعبير مثل
          `لِذٰلِكَ`، أي لذلك."
  - subskill_id: event_phase
    explanation: يسأل شخص هل ما زلت تقرأ كتابًا. يحدد قولك إنك انتهيت نقطة النهاية، وهو أدق من القول إنك
      قرأت من قبل.
    examples:
      - text: أَنْهَيْتُ قِرَاءَةَ الْكِتَابِ.
        meaning: "**المثال.** أنهيت قراءة الكتاب. تعني `أَنْهَيْتُ` «أنهيت». وتعني `قِرَاءَةَ` القراءة،
          وتحدد `الْكِتَابِ` الكتاب المقروء. تأتي القراءة اسمَ نشاط بعد فعل الإنهاء؛ وتحمل
          `أَنْهَيْتُ` نهاية الماضي للمتكلم."
        note: "لا تثبت القراءة الماضية وحدها اكتمالها. أبقِ فعل الإنهاء عندما تريد القول إن النشاط بلغ
          نهايته. **جرّب:** أي جزء يثبت اكتمال القراءة؟ الإجابة: `أَنْهَيْتُ`؛ فعبارة الكتاب تحدد
          المقروء فقط."
