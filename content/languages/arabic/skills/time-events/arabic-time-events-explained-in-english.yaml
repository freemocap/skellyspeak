variety_sections:
  arabic-levantine:
    - subskill_id: present_events
      explanation: Someone asks what you are doing at this moment. Naming the action together with now
        makes it clear that you are describing an activity in progress.
      examples:
        - text: هَلَّقْ عَمْ بَكْتُبْ رِسَالِة.
          meaning: "**The example.** I am writing a letter now. `هَلَّقْ` means now. `عَمْ` marks an activity
            in progress; `بَكْتُبْ` is I write and `رِسَالِة` is a letter. The progressive marker
            tells the listener you are in the middle of writing, rather than reporting a completed
            letter."
          note: "Compare `بَكْتُبْ رِسَالِة`, I write a letter: without the progressive frame, context may
            give a habitual reading. Try it: make the original say I am writing a book now. Answer:
            `هَلَّقْ عَمْ بَكْتُبْ كِتَابْ`; replace the object and retain the ongoing-action
            frame."
    - subskill_id: past_events
      explanation: To tell someone what you accomplished yesterday, use a past action and a time
        expression. Here the speaker reports writing a letter, rather than a current activity.
      examples:
        - text: كَتَبْتْ رِسَالِة مْبَارِحْ.
          meaning: "**The example.** I wrote a letter yesterday. `كَتَبْتْ` means I wrote in this context;
            `رِسَالِة` is a letter and `مْبَارِحْ` is yesterday. The ending marks a past form. In
            this spoken model, the written form can also occur when addressing one man, so context
            helps identify the person."
          note: "Adding `أَنَا` can make the I reading explicit. Try it: say we wrote a letter yesterday.
            Answer: `كَتَبْنَا رِسَالِة مْبَارِحْ`. The we ending `نَا` identifies the group; the
            time expression and object stay the same."
    - subskill_id: future_events
      explanation: You are telling someone about tomorrow’s visit. A future expression places the action
        after now, while the friend and day make the plan concrete.
      examples:
        - text: رَحْ أَزُورْ صَاحْبِي بُكْرَا.
          meaning: "**The example.** I will visit my friend tomorrow. `رَحْ` marks the future and `أَزُورْ` is
            I visit in the following dependent form. `صَاحْبِي` means my male friend, and `بُكْرَا`
            means tomorrow. The action after `رَحْ` has no ordinary b-prefix."
          note: "Keep `رَحْ` before the dependent action. Try it: move the visit to today. Answer: `رَحْ
            أَزُورْ صَاحْبِي الْيَوْمْ`. Replacing `بُكْرَا` changes the day; it does not change the
            future construction or who will visit."
    - subskill_id: duration_frequency
      explanation: A question about your routine often needs a frequency, such as how many times each
        week. This example counts swimming occasions rather than the length of one swim.
      examples:
        - text: بَسْبَحْ مَرَّتَيْنْ بِالْأُسْبُوعْ.
          meaning: "**The example.** I swim twice a week. `بَسْبَحْ` is I swim in an ordinary habitual present
            form. `مَرَّتَيْنْ` means twice and `بِالْأُسْبُوعْ` means per week. The b-prefix fits
            reporting a routine, while the count tells us the number of occasions."
          note: "For once weekly, say `بَسْبَحْ مَرَّة بِالْأُسْبُوعْ`. The dual counts occasions, not people
            swimming. Try it: does the original say how long each swim lasts? Answer: no; it gives
            frequency, and you would need another phrase for duration."
    - subskill_id: event_sequence
      explanation: When arranging an evening together, first and then tell the group what order to follow.
        The order need not mean that the first event causes the second.
      examples:
        - text: أَوَّلْ شِي بِنَاكُلْ، بَعْدَيْنْ بِنِطْلَعْ.
          meaning: "**The example.** First we eat, then we go out. `أَوَّلْ شِي` means first; `بِنَاكُلْ` is
            we eat in this spoken model. `بَعْدَيْنْ` is then and `بِنِطْلَعْ` is we go out. The
            ordinary b-prefixed forms describe the arranged sequence for the group."
          note: "The ordering phrases can stay while you exchange the activities. Try it: say first we go out,
            then we eat. Answer: `أَوَّلْ شِي بِنِطْلَعْ، بَعْدَيْنْ بِنَاكُلْ`. The two verbs
            change positions, so the sequence reverses without changing who takes part."
    - subskill_id: event_phase
      explanation: Someone wants to know whether you are still reading a book. Saying you finished
        identifies the endpoint, which is more specific than saying you read earlier.
      examples:
        - text: خَلَّصْتْ قِرَايِة الْكِتَابْ.
          meaning: "**The example.** I finished reading the book. `خَلَّصْتْ` means I finished in this
            context. `قِرَايِة` is reading and `الْكِتَابْ` is the book. The activity noun names
            what was completed; the past form of finish supplies the endpoint."
          note: "You can make the speaker explicit with `أَنَا` when context is unclear. Do not equate I read
            some of it with I finished reading it. Try it: could the original naturally answer “Are
            you still reading it?” Answer: yes; it says the reading has ended, rather than merely
            happened before."
