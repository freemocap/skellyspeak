skill_id: time_events
explanation_language: english
shared_explanation: skills/time-events/time-events-explained-in-english.yaml
sections:
  - subskill_id: present_events
    explanation: Someone asks what you are doing at this moment. Naming the action together with now
      makes it clear that you are describing an activity in progress.
    examples:
      - text: أَكْتُبُ رِسَالَةً الْآنَ.
        meaning: "**The example.** I am writing a letter now. `أَكْتُبُ` means I write; `رِسَالَةً` is a
          letter; `الْآنَ` is now. The I-form identifies the writer. Arabic uses this verb form with
          the time context to convey I am writing, rather than adding a separate am."
        note: "The same verb can describe a habit in another context. Try it: change the object from a
          letter to a book while keeping the action current. Answer: `أَكْتُبُ كِتَابًا الْآنَ`. The
          object changes to `كِتَابًا`; the I-form and now stay intact."
  - subskill_id: past_events
    explanation: To tell someone what you accomplished yesterday, use a past action and a time
      expression. Here the speaker reports writing a letter, rather than a current activity.
    examples:
      - text: كَتَبْتُ رِسَالَةً أَمْسِ.
        meaning: "**The example.** I wrote a letter yesterday. `كَتَبْتُ` means I wrote; its ending
          identifies I. `رِسَالَةً` means a letter and `أَمْسِ` means yesterday. The verb already
          has past reference; yesterday supplies the particular day."
        note: "Compare `كَتَبْتَ`, you wrote to one man, with the I-form `كَتَبْتُ`. Try it: report that we
          wrote a letter yesterday. Answer: `كَتَبْنَا رِسَالَةً أَمْسِ`. The past ending changes to
          `نَا`; the letter and day remain."
  - subskill_id: future_events
    explanation: You are telling someone about tomorrow’s visit. A future expression places the action
      after now, while the friend and day make the plan concrete.
    examples:
      - text: سَأَزُورُ صَدِيقِي غَدًا.
        meaning: "**The example.** I will visit my friend tomorrow. `سَأَزُورُ` combines future `سَـ` with I
          visit. `صَدِيقِي` means my male friend, with the my suffix attached. `غَدًا` means
          tomorrow. This sentence states a plan; it can become a promise only in an appropriate
          exchange."
        note: "Without future `سَـ`, the verb can describe a present or regular visit in context. Try it:
          move the visit to today. Answer: `سَأَزُورُ صَدِيقِي الْيَوْمَ`. The future marker still
          places the visit after now; today specifies its day."
  - subskill_id: duration_frequency
    explanation: A question about your routine often needs a frequency, such as how many times each
      week. This example counts swimming occasions rather than the length of one swim.
    examples:
      - text: أَسْبَحُ مَرَّتَيْنِ فِي الْأُسْبُوعِ.
        meaning: "**The example.** I swim twice a week. `أَسْبَحُ` means I swim. `مَرَّتَيْنِ` means twice,
          using the dual of occasion; `فِي الْأُسْبُوعِ` is per week here. The interval and count
          together explain how often the activity happens."
        note: "For once a week, use `مَرَّةً فِي الْأُسْبُوعِ`. Twice does not mean two hours; duration
          needs a time-unit phrase. Try it: change the routine to once weekly. Answer: `أَسْبَحُ
          مَرَّةً فِي الْأُسْبُوعِ`; the interval stays weekly."
  - subskill_id: event_sequence
    explanation: When arranging an evening together, first and then tell the group what order to follow.
      The order need not mean that the first event causes the second.
    examples:
      - text: أَوَّلًا نَأْكُلُ، ثُمَّ نَخْرُجُ.
        meaning: "**The example.** First we eat, then we go out. `أَوَّلًا` means first; `نَأْكُلُ` is we
          eat. `ثُمَّ` means then and `نَخْرُجُ` is we go out. Both verbs use the we-form, making
          this a sequence for the group rather than for one listener alone."
        note: "Try it: say first we go out, then we eat. Answer: `أَوَّلًا نَخْرُجُ، ثُمَّ نَأْكُلُ`. Move
          each complete action into its new position. `ثُمَّ` marks sequence; for a result you would
          need wording such as `لِذٰلِكَ`, therefore."
  - subskill_id: event_phase
    explanation: Someone wants to know whether you are still reading a book. Saying you finished
      identifies the endpoint, which is more specific than saying you read earlier.
    examples:
      - text: أَنْهَيْتُ قِرَاءَةَ الْكِتَابِ.
        meaning: "**The example.** I finished reading the book. `أَنْهَيْتُ` means I finished. `قِرَاءَةَ`
          means reading, and `الْكِتَابِ` identifies the book being read. Reading is expressed as an
          activity noun after the finishing verb; the past I-ending is on `أَنْهَيْتُ`."
        note: "Past reading alone does not establish completion. Keep the finishing verb when you need to
          say the whole activity reached its endpoint. Try it: which part proves the reading is
          complete? Answer: `أَنْهَيْتُ`; the book phrase only identifies what was read."
