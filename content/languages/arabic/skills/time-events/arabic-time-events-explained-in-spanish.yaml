variety_sections:
  arabic-levantine:
    - subskill_id: present_events
      explanation: Alguien pregunta qué estás haciendo en este momento. Nombrar la acción junto con ahora
        deja claro que describes una actividad en curso.
      examples:
        - text: هَلَّقْ عَمْ بَكْتُبْ رِسَالِة.
          meaning: "**El ejemplo.** Estoy escribiendo una carta ahora. `هَلَّقْ` significa ahora. `عَمْ` marca
            la actividad en curso; `بَكْتُبْ` es escribo y `رِسَالِة`, una carta. La marca
            progresiva indica que estás en pleno proceso de escritura, no informando de una carta
            terminada."
          note: "Compara `بَكْتُبْ رِسَالِة`, escribo una carta: sin la estructura progresiva, el contexto
            puede indicar costumbre. **Practica:** di que escribes un libro ahora. Respuesta:
            `هَلَّقْ عَمْ بَكْتُبْ كِتَابْ`; cambia el objeto y conserva la actividad en curso."
    - subskill_id: past_events
      explanation: Para contar qué hiciste ayer, usa una acción pasada y una expresión de tiempo. Aquí se
        informa de una carta escrita, no de una actividad actual.
      examples:
        - text: كَتَبْتْ رِسَالِة مْبَارِحْ.
          meaning: "**El ejemplo.** Escribí una carta ayer. `كَتَبْتْ` significa escribí en este contexto;
            `رِسَالِة` es una carta y `مْبَارِحْ`, ayer. La terminación marca pasado. En este modelo
            hablado, la forma escrita también puede aparecer dirigida a un hombre; el contexto
            identifica a la persona."
          note: "Añadir `أَنَا` aclara que significa yo. **Practica:** di que nosotros escribimos una carta
            ayer. Respuesta: `كَتَبْنَا رِسَالِة مْبَارِحْ`. La terminación de nosotros `نَا`
            identifica el grupo; el objeto y el tiempo no cambian."
    - subskill_id: future_events
      explanation: Cuentas a alguien que visitarás a una amistad mañana. La expresión de futuro sitúa la
        acción después de ahora; la persona y el día concretan el plan.
      examples:
        - text: رَحْ أَزُورْ صَاحْبِي بُكْرَا.
          meaning: "**El ejemplo.** Visitaré a mi amigo mañana. `رَحْ` marca el futuro y `أَزُورْ` significa
            visito en la forma dependiente siguiente. `صَاحْبِي` es mi amigo y `بُكْرَا`, mañana. La
            acción tras `رَحْ` no lleva el prefijo b habitual."
          note: "Conserva `رَحْ` antes de la acción dependiente. **Practica:** adelanta la visita a hoy.
            Respuesta: `رَحْ أَزُورْ صَاحْبِي الْيَوْمْ`. Sustituir `بُكْرَا` cambia el día, no la
            construcción futura ni quien hará la visita."
    - subskill_id: duration_frequency
      explanation: "Una pregunta sobre tu rutina suele requerir frecuencia: cuántas veces por semana
        sucede algo. Aquí se cuentan ocasiones de nadar, no la duración de una sesión."
      examples:
        - text: بَسْبَحْ مَرَّتَيْنْ بِالْأُسْبُوعْ.
          meaning: "**El ejemplo.** Nado dos veces por semana. `بَسْبَحْ` es nado en presente habitual.
            `مَرَّتَيْنْ` significa dos veces y `بِالْأُسْبُوعْ`, por semana. El prefijo b encaja
            con una rutina y la cantidad cuenta sus ocasiones."
          note: "Para una vez por semana, di `بَسْبَحْ مَرَّة بِالْأُسْبُوعْ`. El dual cuenta ocasiones, no
            personas que nadan. **Practica:** ¿dice el ejemplo cuánto dura cada sesión? Respuesta:
            no; expresa frecuencia y haría falta otra frase para la duración."
    - subskill_id: event_sequence
      explanation: Al organizar una tarde juntos, primero y después indican al grupo el orden previsto. El
        orden no implica necesariamente que la primera acción cause la segunda.
      examples:
        - text: أَوَّلْ شِي بِنَاكُلْ، بَعْدَيْنْ بِنِطْلَعْ.
          meaning: "**El ejemplo.** Primero comemos y después salimos. `أَوَّلْ شِي` significa primero;
            `بِنَاكُلْ` es comemos en este modelo hablado. `بَعْدَيْنْ` es después y `بِنِطْلَعْ`,
            salimos. Las formas habituales con prefijo b describen la secuencia acordada para el
            grupo."
          note: "Las expresiones de orden pueden conservarse si intercambias las acciones. **Practica:** di
            que primero salís y después coméis. Respuesta: `أَوَّلْ شِي بِنِطْلَعْ، بَعْدَيْنْ
            بِنَاكُلْ`. Los dos verbos cambian de lugar y la secuencia se invierte sin cambiar
            participantes."
    - subskill_id: event_phase
      explanation: Alguien pregunta si sigues leyendo un libro. Decir que terminaste identifica el final
        de la actividad; es más preciso que decir simplemente que leíste antes.
      examples:
        - text: خَلَّصْتْ قِرَايِة الْكِتَابْ.
          meaning: "**El ejemplo.** Terminé de leer el libro. `خَلَّصْتْ` significa terminé en este contexto.
            `قِرَايِة` es lectura y `الْكِتَابْ`, el libro. El nombre de la actividad indica qué
            acabó; la forma pasada de terminar aporta el punto final."
          note: "Puedes hacer explícito al hablante con `أَنَا` si el contexto no está claro. No equipares
            leer una parte con terminar el libro. **Practica:** ¿puede el ejemplo contestar
            naturalmente a «¿aún lo lees?» Respuesta: sí; dice que la lectura acabó, no solo que
            ocurrió antes."
