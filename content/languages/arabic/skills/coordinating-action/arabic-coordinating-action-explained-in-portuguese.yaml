variety_sections:
  arabic-levantine:
    - subskill_id: requests
      explanation: "Um pedido solicita que outra pessoa faça algo. Imagine uma corrente de ar entrando pela porta
        aberta: você quer fechá-la e acrescenta uma expressão de cortesia."
      examples:
        - text: سَكِّرْ الْبَابْ، لَوْ سَمَحْتْ.
          meaning: "**O exemplo.** Feche a porta, por favor. `سَكِّرْ` é a ordem de fechar dirigida a um homem;
            `الْبَابْ` é a porta. `لَوْ سَمَحْتْ` é uma expressão convencional de cortesia, literalmente « se
            você permitir ». Aprenda o conjunto como « por favor », não como uma condição real a completar."
          note: "Para uma mulher, use `سَكِّرِي` e `لَوْ سَمَحْتِي`. Experimente fazer o pedido completo a uma mulher.
            Resposta: `سَكِّرِي الْبَابْ، لَوْ سَمَحْتِي`. As duas terminações mudam; a porta e a ação pedida
            permanecem."
    - subskill_id: offers_invitations
      explanation: Quando alguém tem dificuldade com uma tarefa, você pode oferecer a própria ajuda, em vez de pedir
        ajuda à outra pessoa. Uma pergunta curta permite aceitar ou recusar.
      examples:
        - text: أَسَاعْدَكْ؟
          meaning: "**O exemplo.** Quer que eu ajude? `أَسَاعْدَكْ` combina « eu ajudo » com o sufixo « você », dirigido
            aqui a um homem. O tom interrogativo transforma a ação possível em oferta. O verbo não tem o
            prefixo b- comum nesse padrão de oferta."
          note: "Para oferecer ajuda a uma mulher, use `أَسَاعْدِكْ؟` neste modelo falado. Compare `تْسَاعْدْنِي؟`, «
            você pode me ajudar? », que solicita ajuda ao ouvinte. Experimente escolher a oferta quando você
            se voluntaria. Resposta: `أَسَاعْدَكْ؟` para um homem; a forma inicial de « eu » mantém você como
            ajudante."
    - subskill_id: suggestions
      explanation: Um grupo precisa de um lugar para sentar. Uma pergunta de « por que não? » apresenta este lugar
        como opção comum sem mandar alguém escolhê-lo.
      examples:
        - text: لَيْشْ مَا نِقْعُدْ هُونْ؟
          meaning: "**O exemplo.** Por que não nos sentamos aqui? `لَيْشْ` significa por quê, `مَا` é não, `نِقْعُدْ`
            significa nós nos sentamos e `هُونْ` significa aqui. Juntos, sugerem uma ação comum. A forma « nós
            » inclui quem fala; não é uma ordem apenas para o ouvinte."
          note: "Troque `هُونْ` por `هُنِيكْ` para sugerir lá. Aprenda a sugestão como padrão falado; em outra situação,
            a mesma pergunta poderia pedir uma razão real contra a ideia. Experimente: qual palavra inclui
            quem fala no plano? Resposta: `نِقْعُدْ`, a forma « nós »."
    - subskill_id: commitments
      explanation: Alguém precisa trazer as chaves. Ao assumir essa responsabilidade, nomear sua ação futura informa
        aos demais com o que podem contar.
      examples:
        - text: رَحْ أَجِيبْ الْمَفَاتِيحْ بُكْرَا.
          meaning: "**O exemplo.** Vou trazer as chaves amanhã. `رَحْ` indica futuro, `أَجِيبْ` significa eu trago,
            `الْمَفَاتِيحْ` são as chaves e `بُكْرَا` é amanhã. Depois de `رَحْ`, esse verbo aparece sem o
            prefixo b- comum. Há compromisso porque você aceitou a tarefa."
          note: "Depois de `رَحْ`, mantenha a ação sem o prefixo b- comum. Experimente prometer trazer as chaves hoje.
            Resposta: `رَحْ أَجِيبْ الْمَفَاتِيحْ الْيَوْمْ`. Trocar `بُكْرَا` por `الْيَوْمْ` altera o dia,
            sem tirar de você a responsabilidade pela ação."
    - subskill_id: accepting_declining
      explanation: Você foi convidado para hoje, mas não consegue comparecer. Agradecer antes de dar o impedimento
        torna a recusa clara e cortês.
      examples:
        - text: شُكْرًا، بَسّ مَا بَقْدَرْ أَجِي الْيَوْمْ.
          meaning: "**O exemplo.** Obrigado, mas não posso vir hoje. `شُكْرًا` agradece a quem convidou, e `بَسّ`
            introduz « mas ». `مَا بَقْدَرْ` significa « não consigo »; `أَجِي` é vir como ação dependente
            seguinte, sem prefixo b-. `الْيَوْمْ` significa hoje. A incapacidade explica a recusa."
          note: "Use `بُكْرَا` para um convite de amanhã, mantendo `مَا` antes do verbo de capacidade. Experimente
            recusar o convite de amanhã. Resposta: `شُكْرًا، بَسّ مَا بَقْدَرْ أَجِي بُكْرَا`. A forma
            dependente de vir continua sem prefixo b-; só o tempo muda."
    - subskill_id: negotiating_plans
      explanation: Um encontro está marcado para hoje, mas amanhã seria melhor. Negociar é propor mudar uma parte
        sem apagar o plano comum.
      examples:
        - text: مُمْكِنْ نِلْتَقِي بُكْرَا بَدَلْ الْيَوْمْ؟
          meaning: "**O exemplo.** Podemos nos encontrar amanhã em vez de hoje? `مُمْكِنْ` abre uma pergunta de
            possibilidade, e `نِلْتَقِي` significa nós nos encontramos. `بُكْرَا` é amanhã; `بَدَلْ الْيَوْمْ`
            significa em vez de hoje. A forma « nós » inclui os dois participantes, e as expressões temporais
            isolam a mudança pedida."
          note: "A ação depois de `مُمْكِنْ` não tem o prefixo b- comum nesta proposta. Inverter os dias inverte a
            mudança pedida. Experimente: você está cancelando o encontro por completo? Resposta: não;
            `نِلْتَقِي` continua sendo o plano, e só o dia está sendo renegociado."
