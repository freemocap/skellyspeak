schema_version: 1
revision: arabic-skills-2026-10-04
language: arabic
skill_id: coordinating_action
guidance: Assess requests, offers or invitations, suggestions, commitments, acceptance or
  refusal, and negotiation of plans. A request tries to get an addressee to act; an offer makes
  the speaker’s help available. A suggestion proposes a shared option without necessarily
  settling it. A future statement becomes a commitment only when the exchange supports an
  undertaking. A short acceptance can succeed after an identifiable invitation. A copied polite
  formula without a recoverable action is absent. Distinguish permission questions from action
  requests using context, rather than crediting every possible action function. Evaluate
  addressee agreement and politeness in the selected variety. Do not require a particular
  courtesy phrase or formal imperative when an ordinary conversational request is already
  successful.
