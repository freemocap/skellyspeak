varieties:
  arabic-levantine:
    disposition: supplement
    text: Evaluate colloquial imperatives, offers, لَيْشْ مَا suggestions and commitments in
      context. Accept regional invitation and politeness forms; do not require formal
      interrogative particles in ordinary spoken questions.
    provenance: *a1
  arabic-modern-standard:
    disposition: supplement
    text: Evaluate imperative and interrogative request constructions with their actual addressee.
      Formal agreement and linking vowels are relevant to the form used, but one isolated error
      need not erase a clearly successful action function.
    provenance: *a1
