skill_id: coordinating_action
explanation_language: mandarin
shared_explanation: skills/coordinating-action/coordinating-action-explained-in-mandarin.yaml
sections:
  - subskill_id: requests
    explanation: 请求是请别人做一件事。想象门开着，冷风吹进来：你希望有人关门，并加一句礼貌表达来缓和语气。
    examples:
      - text: أَغْلِقِ الْبَابَ، مِنْ فَضْلِكَ.
        meaning: "**例句。** 请关门。`أَغْلِقِ` 是对一名男子说的“关上”；`الْبَابَ` 是门。`مِنْ فَضْلِكَ`
          是对这名男子说的“请”。在仔细连读时，命令式末尾的短元音有助于连接下一个词。"
        note: 称呼一名女子时，用 `أَغْلِقِي` 和礼貌形式 `مِنْ فَضْلِكِ`。试一试：请一名女子关门。答案：`أَغْلِقِي الْبَابَ، مِنْ
          فَضْلِكِ`。命令式末尾增加长元音，礼貌短语的词尾也随听话人改变。
  - subskill_id: offers_invitations
    explanation: 别人做一件事很吃力时，你可以主动帮对方，而不是请求对方帮你。简短问句让对方有接受或拒绝的余地。
    examples:
      - text: هَلْ أُسَاعِدُكَ؟
        meaning: "**例句。** 要我帮你吗？`هَلْ` 引出是非问句。`أُسَاعِدُ` 意为我帮助，附着的 `كَ` 指“你”，这里称呼一名男子。第一人称形式说明潜在帮忙的人是说话人，词尾指出接受帮助的人。"
        note: 对一名女子说时，用 `هَلْ أُسَاعِدُكِ؟`。比较对一名男子说的 `هَلْ
          تُسَاعِدُنِي؟`，意为你能帮我吗：现在帮忙的人变成你，接受帮助的人是我。试一试：向女子提出帮忙。答案：`هَلْ أُسَاعِدُكِ؟`；保留第一人称形式，改变听话人的词尾。
  - subskill_id: suggestions
    explanation: 大家需要找个地方坐。用“为什么不”的问句，可以把这里作为共同考虑的选项，而不是命令任何人选这里。
    examples:
      - text: لِمَاذَا لَا نَجْلِسُ هُنَا؟
        meaning: "**例句。** 我们为什么不坐在这里？`لِمَاذَا` 意为为什么，`لَا` 否定后面的动作。`نَجْلِسُ` 表示我们坐，`هُنَا`
          是这里。在这种情境中，整个问句是在建议坐这里，并非真正要求详细解释反对原因。"
        note: 若要建议坐在那里，可改用 `هُنَاكَ`，保留包含说话人的“我们”形式。换一种语境或语气，同样的“为什么不”也可以真正在问有什么障碍。试一试：建议坐在那里。答案：`لِمَاذَا لَا
          نَجْلِسُ هُنَاكَ؟`；只改变地点。
  - subskill_id: commitments
    explanation: 有人得把钥匙带来。你接下这项责任时，说出未来会做的事，就让其他人知道可以指望你。
    examples:
      - text: سَأُحْضِرُ الْمَفَاتِيحَ غَدًا.
        meaning: "**例句。** 我明天会带钥匙。`سَأُحْضِرُ` 中附着的 `سَـ` 标记未来；`أُحْضِرُ` 意为我带来。`الْمَفَاتِيحَ` 指钥匙，`غَدًا`
          是明天。在接下任务的语境里，这个将来陈述具有承诺的作用。"
        note: 若安排改到今天，用 `الْيَوْمَ`。将来时动词本身也可能只是预测，并不自动构成承诺。试一试：把承诺改到今天。答案：`سَأُحْضِرُ الْمَفَاتِيحَ الْيَوْمَ`
          保留动作，只改变时间。
  - subskill_id: accepting_declining
    explanation: 有人邀请你今天参加活动，但你来不了。先感谢邀请者，再说明阻碍，能清楚而礼貌地婉拒。
    examples:
      - text: شُكْرًا، لٰكِنَّنِي لَا أَسْتَطِيعُ الْحُضُورَ الْيَوْمَ.
        meaning: "**例句。** 谢谢，但我今天无法出席。`شُكْرًا` 表示感谢。`لٰكِنَّنِي` 意为但是我；`لَا أَسْتَطِيعُ` 意为我不能。`الْحُضُورَ`
          指出席，`الْيَوْمَ` 把拒绝限于今天。这里能力动词后接一个表示活动的名词。"
        note: 若邀请在明天，把 `الْيَوْمَ` 换成 `غَدًا`。保留 `لَا`，拒绝才不变。试一试：婉拒明天的邀请。答案：`شُكْرًا، لٰكِنَّنِي لَا أَسْتَطِيعُ
          الْحُضُورَ غَدًا`。感谢和无法出席不变，只改日期。
  - subskill_id: negotiating_plans
    explanation: 原本约好今天见面，但明天更合适。协商是在保留共同计划的前提下，提出改变其中一个部分。
    examples:
      - text: هَلْ يُمْكِنُ أَنْ نَلْتَقِيَ غَدًا بَدَلًا مِنَ الْيَوْمِ؟
        meaning: "**例句。** 能改成明天见，而不是今天吗？`هَلْ يُمْكِنُ` 问是否可能。`أَنْ نَلْتَقِيَ` 说出双方共同的行动，即我们见面。`غَدًا`
          是新提议的日子；`بَدَلًا مِنَ الْيَوْمِ` 意为取代今天，指出要改掉什么。"
        note: 把新日期放在“取代”短语前，两种选择才清楚。这是在征求同意，并未宣布改期已定。试一试：被替换的是哪一天？答案：今天，在 `بَدَلًا مِنَ` 后指出；明天是新提议。
