sections:
  - subskill_id: requests
    explanation: "Une demande invite l’autre personne à agir. Imaginez un courant d’air venant d’une porte ouverte
      : vous voulez qu’elle la ferme et ajoutez une formule de politesse pour adoucir votre demande."
    examples:
      - text: أَغْلِقِ الْبَابَ، مِنْ فَضْلِكَ.
        meaning: "**L’exemple.** Ferme la porte, s’il te plaît. `أَغْلِقِ` ordonne à un homme de fermer quelque chose
          ; `الْبَابَ` désigne la porte. `مِنْ فَضْلِكَ` signifie « s’il te plaît » pour cet homme. La voyelle
          brève à la fin de l’impératif facilite la liaison avec le mot suivant dans une prononciation soignée
          et continue."
        note: "Pour vous adresser à une femme, employez `أَغْلِقِي` et la formule de politesse `مِنْ فَضْلِكِ`.
          Essayez : demandez poliment à une femme de fermer la porte. Réponse : `أَغْلِقِي الْبَابَ، مِنْ
          فَضْلِكِ`. L’impératif gagne une voyelle longue finale et le suffixe de politesse change selon
          l’interlocutrice."
  - subskill_id: offers_invitations
    explanation: Lorsqu’une personne peine à accomplir une tâche, vous pouvez proposer votre propre aide au lieu
      de lui en demander. Une question brève lui laisse la possibilité d’accepter ou de refuser.
    examples:
      - text: هَلْ أُسَاعِدُكَ؟
        meaning: "**L’exemple.** Puis-je t’aider ? `هَلْ` introduit une question fermée. `أُسَاعِدُ` signifie « j’aide
          », et le `كَ` attaché signifie « toi », pour un homme. La forme en « je » fait de la personne qui
          parle l’aide possible ; le suffixe désigne la personne aidée."
        note: "Pour une femme, employez `هَلْ أُسَاعِدُكِ؟`. Comparez `هَلْ تُسَاعِدُنِي؟`, « vas-tu m’aider ? »,
          adressé à un homme : celui qui aide devient l’interlocuteur et celui qui reçoit l’aide devient « moi
          ». Essayez : proposez votre aide à une femme. Réponse : `هَلْ أُسَاعِدُكِ؟` ; gardez la forme en «
          je » et changez le suffixe de l’interlocutrice."
  - subskill_id: suggestions
    explanation: Un groupe cherche un endroit où s’asseoir. Une question du type « pourquoi pas » peut proposer
      cette place comme option commune sans ordonner à qui que ce soit de la choisir.
    examples:
      - text: لِمَاذَا لَا نَجْلِسُ هُنَا؟
        meaning: "**L’exemple.** Pourquoi ne nous asseyons-nous pas ici ? `لِمَاذَا` signifie pourquoi et `لَا` nie
          l’action suivante. `نَجْلِسُ` signifie « nous nous asseyons » ; `هُنَا` indique ici. Dans ce
          contexte, la question entière suggère de s’asseoir ici, plutôt que de demander une raison détaillée
          de ne pas le faire."
        note: "Employez `هُنَاكَ` pour « là-bas » en gardant la forme qui inclut « nous ». Dans un autre contexte ou
          avec un autre ton, la question pourrait réellement porter sur un obstacle. Essayez : proposez de
          vous asseoir là-bas. Réponse : `لِمَاذَا لَا نَجْلِسُ هُنَاكَ؟` ; seul le lieu change."
  - subskill_id: commitments
    explanation: Quelqu’un doit apporter les clés. Quand vous prenez cette responsabilité, annoncer votre action
      future indique aux autres ce qu’ils peuvent attendre de vous.
    examples:
      - text: سَأُحْضِرُ الْمَفَاتِيحَ غَدًا.
        meaning: "**L’exemple.** J’apporterai les clés demain. Le `سَـ` attaché dans `سَأُحْضِرُ` marque l’avenir ;
          `أُحْضِرُ` signifie « j’apporte ». `الْمَفَاتِيحَ` désigne les clés et `غَدًا` signifie demain.
          C’est l’acceptation de la tâche dans le contexte qui donne à cette phrase future la valeur d’un
          engagement."
        note: "Employez `الْيَوْمَ` pour « aujourd’hui » si le projet change. Un verbe futur seul peut aussi faire une
          prévision : il ne constitue pas automatiquement une promesse. Essayez : déplacez l’engagement à
          aujourd’hui. Réponse : `سَأُحْضِرُ الْمَفَاتِيحَ الْيَوْمَ` ; l’action reste et le moment change."
  - subskill_id: accepting_declining
    explanation: On vous a invité quelque part aujourd’hui, mais vous ne pouvez pas y aller. Remercier la personne
      avant de nommer votre empêchement rend le refus clair et courtois.
    examples:
      - text: شُكْرًا، لٰكِنَّنِي لَا أَسْتَطِيعُ الْحُضُورَ الْيَوْمَ.
        meaning: "**L’exemple.** Merci, mais je ne peux pas venir aujourd’hui. `شُكْرًا` remercie. `لٰكِنَّنِي`
          signifie « mais moi » ; `لَا أَسْتَطِيعُ` signifie « je ne peux pas ». `الْحُضُورَ` désigne la
          présence, et `الْيَوْمَ` limite le refus à aujourd’hui. Ici, le verbe de capacité est suivi d’un nom
          qui désigne l’activité."
        note: "Pour une invitation demain, remplacez `الْيَوْمَ` par `غَدًا`. Gardez `لَا` pour conserver le refus.
          Essayez : refusez l’invitation de demain. Réponse : `شُكْرًا، لٰكِنَّنِي لَا أَسْتَطِيعُ الْحُضُورَ
          غَدًا`. Le remerciement et l’impossibilité restent ; seule la date change."
  - subskill_id: negotiating_plans
    explanation: Une rencontre est prévue aujourd’hui, mais demain conviendrait mieux. Négocier consiste à
      proposer la modification d’un élément tout en conservant le projet commun identifiable.
    examples:
      - text: هَلْ يُمْكِنُ أَنْ نَلْتَقِيَ غَدًا بَدَلًا مِنَ الْيَوْمِ؟
        meaning: "**L’exemple.** Pourrions-nous nous voir demain au lieu d’aujourd’hui ? `هَلْ يُمْكِنُ` demande si
          quelque chose est possible. `أَنْ نَلْتَقِيَ` donne l’action commune, se rencontrer. `غَدًا` est le
          jour proposé ; `بَدَلًا مِنَ الْيَوْمِ` signifie « au lieu d’aujourd’hui » et nomme le jour à
          remplacer."
        note: "Gardez le nouveau jour avant l’expression de remplacement pour que les deux possibilités soient
          claires. Cette question sollicite l’accord ; elle n’annonce pas que le changement est décidé.
          Essayez : quel jour est remplacé ? Réponse : aujourd’hui, nommé après `بَدَلًا مِنَ` ; demain est le
          jour proposé."
