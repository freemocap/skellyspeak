variety_sections:
  arabic-levantine:
    - subskill_id: requests
      explanation: "Une demande invite l’autre personne à agir. Imaginez un courant d’air venant d’une porte ouverte
        : vous voulez qu’elle la ferme et ajoutez une formule de politesse pour adoucir votre demande."
      examples:
        - text: سَكِّرْ الْبَابْ، لَوْ سَمَحْتْ.
          meaning: "**L’exemple.** Ferme la porte, s’il te plaît. `سَكِّرْ` est un impératif adressé à un homme ;
            `الْبَابْ` désigne la porte. `لَوْ سَمَحْتْ` est une formule de politesse conventionnelle.
            Apprenez-la comme formule, et non comme une condition à réaliser."
          note: "Pour une femme, employez `سَكِّرِي` et `لَوْ سَمَحْتِي`. Essayez : formulez la demande complète à une
            femme. Réponse : `سَكِّرِي الْبَابْ، لَوْ سَمَحْتِي`. Les deux terminaisons changent ; la porte et
            l’action demandée restent les mêmes."
    - subskill_id: offers_invitations
      explanation: Lorsqu’une personne peine à accomplir une tâche, vous pouvez proposer votre propre aide au lieu
        de lui en demander. Une question brève lui laisse la possibilité d’accepter ou de refuser.
      examples:
        - text: أَسَاعْدَكْ؟
          meaning: "**L’exemple.** Puis-je t’aider ? `أَسَاعْدَكْ` réunit « je t’aide » et un suffixe signifiant « toi
            », adressé ici à un homme. L’intonation interrogative transforme l’action possible en offre. Dans
            ce modèle d’offre, le verbe n’a pas son préfixe ordinaire b-."
          note: "Pour proposer l’aide à une femme, employez `أَسَاعْدِكْ؟` dans ce modèle parlé. Comparez
            `تْسَاعْدْنِي؟`, qui demande à l’autre personne de vous aider. Essayez : choisissez l’offre
            lorsque c’est vous qui vous portez volontaire. Réponse : `أَسَاعْدَكْ؟` pour un homme ; la forme
            initiale en « je » garde votre rôle d’aide."
    - subskill_id: suggestions
      explanation: Un groupe cherche un endroit où s’asseoir. Une question du type « pourquoi pas » peut proposer
        cette place comme option commune sans ordonner à qui que ce soit de la choisir.
      examples:
        - text: لَيْشْ مَا نِقْعُدْ هُونْ؟
          meaning: "**L’exemple.** Pourquoi ne nous asseyons-nous pas ici ? `لَيْشْ` signifie pourquoi, `مَا` marque la
            négation, `نِقْعُدْ` signifie « nous nous asseyons » et `هُونْ` signifie ici. Ensemble, ces mots
            suggèrent une action commune. La forme en « nous » inclut la personne qui parle ; ce n’est pas un
            ordre adressé seulement à l’autre."
          note: "Remplacez `هُونْ` par `هُنِيكْ` pour suggérer là-bas. Apprenez la suggestion comme une formule parlée
            complète ; dans une autre situation, la même question peut porter sur un obstacle réel. Essayez :
            quel mot inclut la personne qui parle dans le projet ? Réponse : `نِقْعُدْ`, la forme en « nous
            »."
    - subskill_id: commitments
      explanation: Quelqu’un doit apporter les clés. Quand vous prenez cette responsabilité, annoncer votre action
        future indique aux autres ce qu’ils peuvent attendre de vous.
      examples:
        - text: رَحْ أَجِيبْ الْمَفَاتِيحْ بُكْرَا.
          meaning: "**L’exemple.** J’apporterai les clés demain. `رَحْ` marque l’avenir, `أَجِيبْ` signifie « j’apporte
            », `الْمَفَاتِيحْ` désigne les clés et `بُكْرَا` demain. Après `رَحْ`, ce verbe n’a pas son
            préfixe ordinaire b-. La phrase devient un engagement parce que vous avez accepté la tâche."
          note: "Après `رَحْ`, gardez le verbe d’action sans son préfixe ordinaire b-. Essayez : promettez d’apporter
            les clés aujourd’hui plutôt que demain. Réponse : `رَحْ أَجِيبْ الْمَفَاتِيحْ الْيَوْمْ`.
            Remplacer `بُكْرَا` par `الْيَوْمْ` change le jour, mais vous gardez la même responsabilité."
    - subskill_id: accepting_declining
      explanation: On vous a invité quelque part aujourd’hui, mais vous ne pouvez pas y aller. Remercier la personne
        avant de nommer votre empêchement rend le refus clair et courtois.
      examples:
        - text: شُكْرًا، بَسّ مَا بَقْدَرْ أَجِي الْيَوْمْ.
          meaning: "**L’exemple.** Merci, mais je ne peux pas venir aujourd’hui. `شُكْرًا` remercie l’hôte et `بَسّ`
            introduit l’opposition. `مَا بَقْدَرْ` signifie « je ne peux pas » ; `أَجِي` est l’action
            dépendante « venir », sans préfixe b-. `الْيَوْمْ` signifie aujourd’hui. L’impossibilité explique
            le refus."
          note: "Employez `بُكْرَا` pour une invitation demain, tout en gardant `مَا` avant le verbe de capacité.
            Essayez : refusez l’invitation de demain. Réponse : `شُكْرًا، بَسّ مَا بَقْدَرْ أَجِي بُكْرَا`. La
            forme dépendante de « venir » garde l’absence du préfixe b- ; seul le moment change."
    - subskill_id: negotiating_plans
      explanation: Une rencontre est prévue aujourd’hui, mais demain conviendrait mieux. Négocier consiste à
        proposer la modification d’un élément tout en conservant le projet commun identifiable.
      examples:
        - text: مُمْكِنْ نِلْتَقِي بُكْرَا بَدَلْ الْيَوْمْ؟
          meaning: "**L’exemple.** Pourrions-nous nous voir demain au lieu d’aujourd’hui ? `مُمْكِنْ` ouvre une question
            sur la possibilité et `نِلْتَقِي` signifie que nous nous rencontrons. `بُكْرَا` désigne demain ;
            `بَدَلْ الْيَوْمْ` signifie « au lieu d’aujourd’hui ». La forme en « nous » inclut les deux
            personnes, et les deux expressions de temps isolent le changement demandé."
          note: "Après `مُمْكِنْ`, l’action n’a pas de préfixe ordinaire b-. Inverser les deux jours inverse le
            changement demandé. Essayez : annulez-vous entièrement la rencontre ? Réponse : non ; `نِلْتَقِي`
            reste le projet et seul son jour est renégocié."
