variety_sections:
  arabic-levantine:
    - subskill_id: requests
      explanation: 請求係想對方做一件事。例如門開住，風吹入嚟，你想對方閂門，就可以加一句客氣說話。
      examples:
        - text: سَكِّرْ الْبَابْ، لَوْ سَمَحْتْ.
          meaning: "**例句。** 唔該閂門。 `سَكِّرْ` 係叫一位男性「閂上」；`الْبَابْ` 係道門。`لَوْ سَمَحْتْ`
            係慣用嘅「唔該」，字面係「如果你容許」。呢度係客氣語，唔係未講完嘅條件。"
          note: 向一位女性講，用 `سَكِّرِي` 同 `لَوْ سَمَحْتِي`。試下講完整請求：`سَكِّرِي الْبَابْ، لَوْ
            سَمَحْتِي`。兩個詞尾都改，門同要求動作保留。
    - subskill_id: offers_invitations
      explanation: 見到人做一件事有困難，你可以主動提出幫忙。用一個簡短問題，對方就可以接受或者婉拒。
      examples:
        - text: أَسَاعْدَكْ؟
          meaning: "**例句。** 要唔要我幫你？ `أَسَاعْدَكْ` 合埋「我幫助」同表示「你」嘅後綴，呢度向一位男性講。疑問語氣令呢個可能做嘅動作變成提議幫忙；呢個提議格式冇一般現在式嘅
            b 前綴。"
          note: 呢個口語示例向女性提出幫忙，用 `أَسَاعْدِكْ؟`。比較 `تْسَاعْدْنِي؟`「你幫我好嗎？」係請聽者幫手。試下：你主動幫一位男性，揀邊句？答案係
            `أَسَاعْدَكْ؟`，開頭我嘅形式保留你做幫手者。
    - subskill_id: suggestions
      explanation: 一班人想搵地方坐。問「不如坐呢度？」可以提出共同選擇，唔需要命令人一定照做。
      examples:
        - text: لَيْشْ مَا نِقْعُدْ هُونْ؟
          meaning: "**例句。** 不如我哋坐喺呢度？ `لَيْشْ` 係「點解」，`مَا` 係否定，`نِقْعُدْ` 係「我哋坐」，`هُونْ`
            係「呢度」。合埋係提出一齊做嘅事。「我哋」包括講者，唔係淨係叫聽者坐。"
          note: 將 `هُونْ` 換成 `هُنِيكْ`，就係建議坐嗰度。可以成個口語句式一齊學；另一個情境下，同樣嘅「點解唔」可能真係問阻礙。試下：邊個詞將講者包括喺計劃入面？答案係「我哋」形式
            `نِقْعُدْ`。
    - subskill_id: commitments
      explanation: 大家需要有人帶鎖匙。你接咗呢項責任，講清楚自己會做乜，其他人就知道可以點樣安排。
      examples:
        - text: رَحْ أَجِيبْ الْمَفَاتِيحْ بُكْرَا.
          meaning: "**例句。** 聽日我會帶鎖匙嚟。 `رَحْ` 指將來，`أَجِيبْ` 係「我帶嚟」，`الْمَفَاتِيحْ` 係鎖匙，`بُكْرَا` 係聽日。`رَحْ`
            後面呢個動詞唔加一般 b 前綴。因為你接下咗任務，所以呢句係承諾。"
          note: "`رَحْ` 後面保留冇一般 b 前綴嘅動作。試下承諾今日帶鎖匙：`رَحْ أَجِيبْ الْمَفَاتِيحْ الْيَوْمْ`。`بُكْرَا` 換成
            `الْيَوْمْ` 就改日子，責任同動作保留。"
    - subskill_id: accepting_declining
      explanation: 有人邀請你今日出席，但你去唔到。先多謝對方，再講清楚限制，可以客氣而明確噉婉拒。
      examples:
        - text: شُكْرًا، بَسّ مَا بَقْدَرْ أَجِي الْيَوْمْ.
          meaning: "**例句。** 多謝，不過我今日嚟唔到。 `شُكْرًا` 多謝邀請者，`بَسّ` 帶出「但係」。`مَا بَقْدَرْ` 係「我唔能夠」；後面 `أَجِي`
            係「嚟」，呢個依附動作冇 b 前綴。`الْيَوْمْ` 係今日；去唔到係婉拒嘅原因。"
          note: 聽日邀請用 `بُكْرَا`，能力動詞前保留 `مَا`。試下婉拒聽日邀請：`شُكْرًا، بَسّ مَا بَقْدَرْ أَجِي بُكْرَا`。依附嘅「嚟」形式仍然冇
            b 前綴，只改時間。
    - subskill_id: negotiating_plans
      explanation: 本來約咗今日見面，但聽日會方便啲。商量安排時，可以提出改一部分，同時保留原本要見面嘅計劃。
      examples:
        - text: مُمْكِنْ نِلْتَقِي بُكْرَا بَدَلْ الْيَوْمْ؟
          meaning: "**例句。** 可唔可以改為聽日見，唔係今日？ `مُمْكِنْ` 開始一個問可唔可行嘅問題，`نِلْتَقِي` 係「我哋見面」。`بُكْرَا` 係聽日，`بَدَلْ
            الْيَوْمْ` 係「代替今日」。「我哋」包括雙方，兩個時間詞就指出要改嘅部分。"
          note: "`مُمْكِنْ` 後面呢個提議動作冇一般 b 前綴。將兩個日子調轉，改期方向亦會相反。試下：係咪完全取消見面？唔係；`نِلْتَقِي` 仍然係計劃，只係再商量日子。"
