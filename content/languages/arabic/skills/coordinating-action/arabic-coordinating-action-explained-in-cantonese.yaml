sections:
  - subskill_id: requests
    explanation: 請求係想對方做一件事。例如門開住，風吹入嚟，你想對方閂門，就可以加一句客氣說話。
    examples:
      - text: أَغْلِقِ الْبَابَ، مِنْ فَضْلِكَ.
        meaning: "**例句。** 唔該閂門。 `أَغْلِقِ` 叫一位男性閂上某樣嘢；`الْبَابَ` 係道門。`مِنْ فَضْلِكَ`
          係向嗰位男性講「唔該」。仔細連讀時，命令詞尾嘅短元音幫助接上下一個詞。"
        note: 向一位女性講，用 `أَغْلِقِي` 同客氣語 `مِنْ فَضْلِكِ`。試下請一位女性閂門：`أَغْلِقِي الْبَابَ، مِنْ
          فَضْلِكِ`。命令加咗長詞尾元音，客氣語後綴亦配合聽者。
  - subskill_id: offers_invitations
    explanation: 見到人做一件事有困難，你可以主動提出幫忙。用一個簡短問題，對方就可以接受或者婉拒。
    examples:
      - text: هَلْ أُسَاعِدُكَ؟
        meaning: "**例句。** 要唔要我幫你？ `هَلْ` 帶出可以答係或唔係嘅問題。`أُسَاعِدُ` 係「我幫助」，連住嘅 `كَ`
          係「你」，對象係一位男性。「我」嘅動詞形式指出提出幫手嘅人；後綴指出接受幫助嘅人。"
        note: 向一位女性問，用 `هَلْ أُسَاعِدُكِ؟`。比較向男性問 `هَلْ تُسَاعِدُنِي؟`「你幫我好嗎？」：幫手者變成你，接受者變成我。試下向女性提出幫忙：`هَلْ
          أُسَاعِدُكِ؟`，保留我嘅動詞，只改聽者後綴。
  - subskill_id: suggestions
    explanation: 一班人想搵地方坐。問「不如坐呢度？」可以提出共同選擇，唔需要命令人一定照做。
    examples:
      - text: لِمَاذَا لَا نَجْلِسُ هُنَا؟
        meaning: "**例句。** 不如我哋坐喺呢度？ `لِمَاذَا` 係「點解」，`لَا` 否定後面嘅動作。`نَجْلِسُ` 係「我哋坐」，`هُنَا`
          係「呢度」。喺呢個情境，成句係建議坐呢度，唔一定真係追問反對理由。"
        note: 用 `هُنَاكَ` 表示「嗰度」，保留「我哋」嘅動詞。換咗情境或語氣，「點解唔」亦可以真係問有乜阻礙。試下建議坐嗰度：`لِمَاذَا لَا نَجْلِسُ
          هُنَاكَ؟`，只改地方。
  - subskill_id: commitments
    explanation: 大家需要有人帶鎖匙。你接咗呢項責任，講清楚自己會做乜，其他人就知道可以點樣安排。
    examples:
      - text: سَأُحْضِرُ الْمَفَاتِيحَ غَدًا.
        meaning: "**例句。** 聽日我會帶鎖匙嚟。 `سَأُحْضِرُ` 開頭嘅 `سَـ` 表示將來；`أُحْضِرُ` 係「我帶嚟」。`الْمَفَاتِيحَ`
          係鎖匙，`غَدًا` 係聽日。因為係接下責任嘅情境，呢句將來陳述就成為承諾。"
        note: 安排改咗，可以用 `الْيَوْمَ` 表示今日。將來動詞亦可以講預測，唔係每句都係承諾。試下將承諾改成今日：`سَأُحْضِرُ الْمَفَاتِيحَ
          الْيَوْمَ`，動作保留，只改時間。
  - subskill_id: accepting_declining
    explanation: 有人邀請你今日出席，但你去唔到。先多謝對方，再講清楚限制，可以客氣而明確噉婉拒。
    examples:
      - text: شُكْرًا، لٰكِنَّنِي لَا أَسْتَطِيعُ الْحُضُورَ الْيَوْمَ.
        meaning: "**例句。** 多謝，不過我今日嚟唔到。 `شُكْرًا` 係多謝，`لٰكِنَّنِي` 係「但係我」，`لَا أَسْتَطِيعُ`
          係「我唔能夠」。`الْحُضُورَ` 係出席，`الْيَوْمَ` 將限制放喺今日。呢度能力動詞後面接活動名詞。"
        note: 邀請係聽日，就用 `غَدًا` 換走 `الْيَوْمَ`，保留否定詞 `لَا`。試下婉拒聽日邀請：`شُكْرًا، لٰكِنَّنِي لَا أَسْتَطِيعُ
          الْحُضُورَ غَدًا`。多謝同去唔到保留，只改日期。
  - subskill_id: negotiating_plans
    explanation: 本來約咗今日見面，但聽日會方便啲。商量安排時，可以提出改一部分，同時保留原本要見面嘅計劃。
    examples:
      - text: هَلْ يُمْكِنُ أَنْ نَلْتَقِيَ غَدًا بَدَلًا مِنَ الْيَوْمِ؟
        meaning: "**例句。** 可唔可以改為聽日見，唔係今日？ `هَلْ يُمْكِنُ` 問係咪可行。`أَنْ نَلْتَقِيَ` 指共同動作「我哋見面」。`غَدًا`
          係提議嘅日子；`بَدَلًا مِنَ الْيَوْمِ` 係「代替今日」，指出想改邊部分。"
        note: 新日子放喺「代替」短語之前，兩個選擇就清楚。呢句係問對方同唔同意，唔係宣布已經改好。試下：被取代嘅係邊日？答案係 `بَدَلًا مِنَ` 後面嘅今日；聽日先係新提議。
