shared_explanation: skills/coordinating-action/coordinating-action-explained-in-cantonese.yaml
sections:
  - subskill_id: requests
    explanation: 祈使句加禮貌用語，可以請人採取行動。
    examples:
      - text: أَغْلِقِ الْبَابَ، مِنْ فَضْلِكَ.
        meaning: 唔該閂門。
        note: 現代標準阿拉伯語。對一位男性講；要求嘅行動係閂門。
      - text: سَكِّرْ الْبَابْ، لَوْ سَمَحْتْ.
        meaning: 唔該閂門。
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。對一位男性講；要求嘅行動係閂門。
  - subskill_id: offers_invitations
    explanation: 問對方需唔需要自己幫忙，可以構成主動提議。
    examples:
      - text: هَلْ أُسَاعِدُكَ؟
        meaning: 要唔要我幫你？
        note: 現代標準阿拉伯語。對一位男性講；講者主動提出幫忙。
      - text: أَسَاعْدَكْ؟
        meaning: 要唔要我幫你？
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。對一位男性講；講者主動提出幫忙。
  - subskill_id: suggestions
    explanation: 「點解唔……」形式嘅問題，可以建議大家一齊做某件事。
    examples:
      - text: لِمَاذَا لَا نَجْلِسُ هُنَا؟
        meaning: 不如我哋坐喺呢度？
        note: 現代標準阿拉伯語。呢個係畀大家嘅建議，唔一定要求解釋原因。
      - text: لَيْشْ مَا نِقْعُدْ هُونْ؟
        meaning: 不如我哋坐喺呢度？
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。呢個係畀大家嘅建議，唔一定要求解釋原因。
  - subskill_id: commitments
    explanation: 喺對話中接受責任時，講將來會做嘅事可以構成承諾。
    examples:
      - text: سَأُحْضِرُ الْمَفَاتِيحَ غَدًا.
        meaning: 聽日我會帶鎖匙嚟。
        note: 現代標準阿拉伯語。答應負責帶鎖匙時用。
      - text: رَحْ أَجِيبْ الْمَفَاتِيحْ بُكْرَا.
        meaning: 聽日我會帶鎖匙嚟。
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。答應負責帶鎖匙時用。
  - subskill_id: accepting_declining
    explanation: 表示做唔到嘅否定能力句，可以有禮貌咁拒絕邀請。
    examples:
      - text: شُكْرًا، لٰكِنَّنِي لَا أَسْتَطِيعُ الْحُضُورَ الْيَوْمَ.
        meaning: 多謝，不過我今日嚟唔到。
        note: 現代標準阿拉伯語。回應今日嘅邀請。
      - text: شُكْرًا، بَسّ مَا بَقْدَرْ أَجِي الْيَوْمْ.
        meaning: 多謝，不過我今日嚟唔到。
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。回應今日嘅邀請。
  - subskill_id: negotiating_plans
    explanation: 可以用新時間取代之前商量緊嘅時間。
    examples:
      - text: هَلْ يُمْكِنُ أَنْ نَلْتَقِيَ غَدًا بَدَلًا مِنَ الْيَوْمِ؟
        meaning: 可唔可以改為聽日見，唔係今日？
        note: 現代標準阿拉伯語。講者修改原有計劃嘅其中一部分。
      - text: مُمْكِنْ نِلْتَقِي بُكْرَا بَدَلْ الْيَوْمْ؟
        meaning: 可唔可以改為聽日見，唔係今日？
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。講者修改原有計劃嘅其中一部分。
