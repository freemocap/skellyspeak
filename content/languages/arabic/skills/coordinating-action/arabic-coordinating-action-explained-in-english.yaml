variety_sections:
  arabic-levantine:
    - subskill_id: requests
      explanation: "A request asks another person to do something. Imagine a draught coming through an
        open door: you want it closed and add a courtesy phrase to soften the request."
      examples:
        - text: سَكِّرْ الْبَابْ، لَوْ سَمَحْتْ.
          meaning: "**The example.** Close the door, please. `سَكِّرْ` is close, as a command to one man;
            `الْبَابْ` is the door. `لَوْ سَمَحْتْ` is a conventional please, literally if you
            permit. Learn it as a courtesy phrase rather than an actual condition to be completed."
          note: "For one woman, use `سَكِّرِي` and `لَوْ سَمَحْتِي`. Try it: make the complete request to a
            woman. Answer: `سَكِّرِي الْبَابْ، لَوْ سَمَحْتِي`. Both endings change; the door and
            the requested action remain the same."
    - subskill_id: offers_invitations
      explanation: When someone is struggling with a task, you can offer your own help rather than asking
        them to help you. A short question lets them accept or decline.
      examples:
        - text: أَسَاعْدَكْ؟
          meaning: "**The example.** Shall I help you? `أَسَاعْدَكْ` combines I help with a suffix meaning
            you, addressed here to one man. The questioning tone turns the potential action into an
            offer. The verb has no ordinary b-prefix in this offer pattern."
          note: "To offer help to a woman, use `أَسَاعْدِكْ؟` in this spoken model. Compare `تْسَاعْدْنِي؟`,
            can you help me?, which asks the listener for help. Try it: choose the offer when you
            are volunteering. Answer: `أَسَاعْدَكْ؟` for a man; the initial I-form keeps you as
            helper."
    - subskill_id: suggestions
      explanation: A group needs somewhere to sit. A why-not question can put forward this place as a
        shared option without ordering anyone to choose it.
      examples:
        - text: لَيْشْ مَا نِقْعُدْ هُونْ؟
          meaning: "**The example.** Why don’t we sit here? `لَيْشْ` is why, `مَا` is not, `نِقْعُدْ` is we
            sit, and `هُونْ` means here. Together they suggest a shared action. The we-form includes
            the speaker; it is not a command telling only the listener to sit."
          note: "Replace `هُونْ` with `هُنِيكْ` to suggest there. Learn the whole suggestion as a spoken
            pattern; the same why-not wording can ask about a real obstacle in another situation.
            Try it: which word includes the speaker in the plan? Answer: `نِقْعُدْ`, the we-form."
    - subskill_id: commitments
      explanation: Someone must bring the keys. When you take that responsibility, naming your future
        action tells the others what they can rely on you to do.
      examples:
        - text: رَحْ أَجِيبْ الْمَفَاتِيحْ بُكْرَا.
          meaning: "**The example.** I will bring the keys tomorrow. `رَحْ` points to the future, `أَجِيبْ`
            means I bring, `الْمَفَاتِيحْ` is the keys, and `بُكْرَا` is tomorrow. After `رَحْ`,
            this verb appears without its ordinary b-prefix. You are committing to an action because
            you have accepted the task."
          note: "After `رَحْ`, keep the action without an ordinary b-prefix. Try it: promise to bring the keys
            today instead. Answer: `رَحْ أَجِيبْ الْمَفَاتِيحْ الْيَوْمْ`. Replacing `بُكْرَا` with
            `الْيَوْمْ` changes the day, while you retain responsibility for the same action."
    - subskill_id: accepting_declining
      explanation: You have been invited somewhere today but cannot attend. Thanking the person before
        giving the obstacle helps make a refusal clear and courteous.
      examples:
        - text: شُكْرًا، بَسّ مَا بَقْدَرْ أَجِي الْيَوْمْ.
          meaning: "**The example.** Thank you, but I cannot come today. `شُكْرًا` thanks the inviter and
            `بَسّ` introduces but. `مَا بَقْدَرْ` means I cannot; `أَجِي` is come in the following
            dependent action, without a b-prefix. `الْيَوْمْ` means today. The inability is the
            reason for declining."
          note: "Use `بُكْرَا` for an invitation tomorrow, keeping `مَا` before the ability verb. Try it:
            decline tomorrow’s invitation. Answer: `شُكْرًا، بَسّ مَا بَقْدَرْ أَجِي بُكْرَا`. The
            dependent coming form still has no b-prefix; the time is the only changed detail."
    - subskill_id: negotiating_plans
      explanation: A meeting is already planned for today, but tomorrow would work better. Negotiating
        means proposing that one part change while keeping the shared plan recognizable.
      examples:
        - text: مُمْكِنْ نِلْتَقِي بُكْرَا بَدَلْ الْيَوْمْ؟
          meaning: "**The example.** Could we meet tomorrow instead of today? `مُمْكِنْ` opens a possibility
            question and `نِلْتَقِي` means we meet. `بُكْرَا` is tomorrow; `بَدَلْ الْيَوْمْ` means
            instead of today. The we-form includes both parties, while the two time expressions
            isolate the requested change."
          note: "The action after `مُمْكِنْ` has no ordinary b-prefix in this proposal. Reversing the two days
            reverses the requested change. Try it: are you cancelling the meeting entirely? Answer:
            no; `نِلْتَقِي` remains the plan, and only its day is being renegotiated."
