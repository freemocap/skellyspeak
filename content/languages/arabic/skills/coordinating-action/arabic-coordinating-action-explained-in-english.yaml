skill_id: coordinating_action
explanation_language: english
shared_explanation: skills/coordinating-action/coordinating-action-explained-in-english.yaml
sections:
  - subskill_id: requests
    explanation: "A request asks another person to do something. Imagine a draught coming through an
      open door: you want it closed and add a courtesy phrase to soften the request."
    examples:
      - text: أَغْلِقِ الْبَابَ، مِنْ فَضْلِكَ.
        meaning: "**The example.** Close the door, please. `أَغْلِقِ` tells one man to close something;
          `الْبَابَ` is the door. `مِنْ فَضْلِكَ` means please, addressed to that man. The short
          vowel at the end of the command helps connect it to the following word in careful
          connected speech."
        note: "To address one woman, use `أَغْلِقِي` and the courtesy form `مِنْ فَضْلِكِ`. Try it: ask a
          woman to close the door, please. Answer: `أَغْلِقِي الْبَابَ، مِنْ فَضْلِكِ`. The command
          gains a long final vowel and the courtesy suffix changes to match the listener."
  - subskill_id: offers_invitations
    explanation: When someone is struggling with a task, you can offer your own help rather than asking
      them to help you. A short question lets them accept or decline.
    examples:
      - text: هَلْ أُسَاعِدُكَ؟
        meaning: "**The example.** Shall I help you? `هَلْ` introduces a yes/no question. `أُسَاعِدُ` means
          I help, and the attached `كَ` means you, addressing one man. The I-form makes the speaker
          the potential helper; the suffix identifies the person receiving help."
        note: "For one woman, use `هَلْ أُسَاعِدُكِ؟`. Compare `هَلْ تُسَاعِدُنِي؟`, will you help me?,
          addressed to one man: the helper is now you and the receiver is me. Try it: offer help to
          a woman. Answer: `هَلْ أُسَاعِدُكِ؟`; keep the I-form and change the listener suffix."
  - subskill_id: suggestions
    explanation: A group needs somewhere to sit. A why-not question can put forward this place as a
      shared option without ordering anyone to choose it.
    examples:
      - text: لِمَاذَا لَا نَجْلِسُ هُنَا؟
        meaning: "**The example.** Why don’t we sit here? `لِمَاذَا` means why and `لَا` negates the
          following action. `نَجْلِسُ` means we sit; `هُنَا` is here. In this situation, the whole
          question suggests sitting here rather than asking for a detailed reason against it."
        note: "Use `هُنَاكَ` for there while keeping the shared we-form. With a different context or tone,
          why don’t we can be a genuine question about an obstacle. Try it: propose sitting there.
          Answer: `لِمَاذَا لَا نَجْلِسُ هُنَاكَ؟`; only the place changes."
  - subskill_id: commitments
    explanation: Someone must bring the keys. When you take that responsibility, naming your future
      action tells the others what they can rely on you to do.
    examples:
      - text: سَأُحْضِرُ الْمَفَاتِيحَ غَدًا.
        meaning: "**The example.** I will bring the keys tomorrow. The attached `سَـ` in `سَأُحْضِرُ` marks
          future reference; `أُحْضِرُ` means I bring. `الْمَفَاتِيحَ` names the keys and `غَدًا`
          means tomorrow. The context of accepting responsibility gives this future statement its
          force as a commitment."
        note: "Use `الْيَوْمَ` for today if the arrangement changes. A future verb alone can also describe a
          prediction; it is not automatically a promise. Try it: move the commitment to today.
          Answer: `سَأُحْضِرُ الْمَفَاتِيحَ الْيَوْمَ` keeps the action and changes the time."
  - subskill_id: accepting_declining
    explanation: You have been invited somewhere today but cannot attend. Thanking the person before
      giving the obstacle helps make a refusal clear and courteous.
    examples:
      - text: شُكْرًا، لٰكِنَّنِي لَا أَسْتَطِيعُ الْحُضُورَ الْيَوْمَ.
        meaning: "**The example.** Thank you, but I cannot come today. `شُكْرًا` is thank you. `لٰكِنَّنِي`
          means but I; `لَا أَسْتَطِيعُ` means I cannot. `الْحُضُورَ` names attendance, and
          `الْيَوْمَ` limits the refusal to today. Here the ability verb is followed by a noun for
          the activity."
        note: "For an invitation tomorrow, replace `الْيَوْمَ` with `غَدًا`. Keep `لَا` to preserve the
          refusal. Try it: decline tomorrow’s invitation. Answer: `شُكْرًا، لٰكِنَّنِي لَا
          أَسْتَطِيعُ الْحُضُورَ غَدًا`. The thanks and inability stay the same; only the date
          changes."
  - subskill_id: negotiating_plans
    explanation: A meeting is already planned for today, but tomorrow would work better. Negotiating
      means proposing that one part change while keeping the shared plan recognizable.
    examples:
      - text: هَلْ يُمْكِنُ أَنْ نَلْتَقِيَ غَدًا بَدَلًا مِنَ الْيَوْمِ؟
        meaning: "**The example.** Could we meet tomorrow instead of today? `هَلْ يُمْكِنُ` asks whether
          something is possible. `أَنْ نَلْتَقِيَ` supplies the shared action, that we meet. `غَدًا`
          is the proposed day; `بَدَلًا مِنَ الْيَوْمِ` means instead of today and identifies what
          you want to replace."
        note: "Keep the new day before the instead-of phrase so the alternatives are clear. This asks for
          agreement; it does not announce that the change is settled. Try it: which day is being
          replaced? Answer: today, named after `بَدَلًا مِنَ`; tomorrow is the proposed
          replacement."
