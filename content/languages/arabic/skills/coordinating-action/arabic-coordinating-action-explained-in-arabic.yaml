          meaning: "**المثال.** شكرًا، لكنني لا أستطيع المجيء اليوم. تشكر `شُكْرًا` الداعي، وتقدّم `بَسّ` معنى
            «لكن». وتعني `مَا بَقْدَرْ` «لا أستطيع»؛ و`أَجِي` فعل المجيء التابع بعدها من غير باء
            المضارع. وتعني `الْيَوْمْ` «اليوم». عدم الاستطاعة هو سبب الرفض."
          note: "استعمل `بُكْرَا` لدعوة غد مع إبقاء `مَا` قبل فعل القدرة. **جرّب:** ارفض دعوة الغد. الإجابة:
