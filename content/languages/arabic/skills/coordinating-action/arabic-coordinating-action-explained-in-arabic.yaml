sections:
  - subskill_id: requests
    explanation: "الطلب يدعو شخصًا آخر إلى فعل شيء. تخيّل تيارًا باردًا يدخل من باب مفتوح: تريد إغلاقه
      وتضيف عبارة مجاملة لتلطيف الطلب."
    examples:
      - text: أَغْلِقِ الْبَابَ، مِنْ فَضْلِكَ.
        meaning: "**المثال.** أغلق الباب، من فضلك. `أَغْلِقِ` أمر لرجل واحد بإغلاق شيء؛ و`الْبَابَ` هو
          الباب. وتعني `مِنْ فَضْلِكَ` «من فضلك» عند مخاطبة هذا الرجل. تساعد الحركة القصيرة في آخر
          فعل الأمر على وصله بالكلمة التالية عند النطق المتصل المتأني."
        note: "لمخاطبة امرأة واحدة، استعمل `أَغْلِقِي` وعبارة المجاملة `مِنْ فَضْلِكِ`. **جرّب:** اطلب من
          امرأة إغلاق الباب من فضلك. الإجابة: `أَغْلِقِي الْبَابَ، مِنْ فَضْلِكِ`. يكتسب الأمر صوت
          مدّ في آخره وتتغير لاحقة المجاملة لتطابق المخاطَبة."
  - subskill_id: offers_invitations
    explanation: عندما يواجه شخص صعوبة في مهمة، يمكنك عرض مساعدتك أنت بدل طلب مساعدته لك. يتيح له السؤال
      القصير القبول أو الرفض.
    examples:
      - text: هَلْ أُسَاعِدُكَ؟
        meaning: "**المثال.** هل أساعدك؟ تقدّم `هَلْ` سؤال نعم أو لا. تعني `أُسَاعِدُ` «أنا أساعد»، وتعني
          اللاحقة `كَ` «أنت» عند مخاطبة رجل واحد. تجعل صيغة المتكلم صاحب العرض مساعدًا محتملًا؛
          وتحدد اللاحقة متلقي المساعدة."
        note: "لامرأة واحدة استعمل `هَلْ أُسَاعِدُكِ؟`. قارن بـ`هَلْ تُسَاعِدُنِي؟`، أي هل تساعدني، عند
          مخاطبة رجل واحد: صار المساعد أنت والمتلقي أنا. **جرّب:** اعرض المساعدة على امرأة. الإجابة:
          `هَلْ أُسَاعِدُكِ؟`؛ أبقِ صيغة المتكلم وغيّر لاحقة المخاطَبة."
  - subskill_id: suggestions
    explanation: تحتاج مجموعة إلى مكان للجلوس. يمكن لسؤال «لماذا لا» أن يطرح هذا المكان خيارًا مشتركًا
      من غير أمر أي شخص باختياره.
    examples:
      - text: لِمَاذَا لَا نَجْلِسُ هُنَا؟
        meaning: "**المثال.** لماذا لا نجلس هنا؟ تعني `لِمَاذَا` «لماذا»، وتنفي `لَا` الفعل التالي. وتعني
          `نَجْلِسُ` «نجلس»، و`هُنَا` «هنا». يقترح السؤال كله الجلوس هنا في هذا الموقف بدل طلب سبب
          مفصل يمنع ذلك."
        note: "استعمل `هُنَاكَ` لـ«هناك» مع الإبقاء على صيغة «نحن». وفي سياق أو نبرة مختلفين، قد يكون سؤال
          «لماذا لا» سؤالًا حقيقيًا عن عائق. **جرّب:** اقترح الجلوس هناك. الإجابة: `لِمَاذَا لَا
          نَجْلِسُ هُنَاكَ؟`؛ يتغير المكان وحده."
  - subskill_id: commitments
    explanation: يجب أن يحضر شخص المفاتيح. عندما تتحمل هذه المسؤولية، فإن تسمية فعلك المستقبلي تخبر
      الآخرين بما يمكنهم الاعتماد عليك لفعله.
    examples:
      - text: سَأُحْضِرُ الْمَفَاتِيحَ غَدًا.
        meaning: "**المثال.** سأحضر المفاتيح غدًا. تدل `سَـ` المتصلة في `سَأُحْضِرُ` على المستقبل؛ وتعني
          `أُحْضِرُ` «أحضر». تسمّي `الْمَفَاتِيحَ` المفاتيح، وتعني `غَدًا` غدًا. يجعل سياق قبول
          المسؤولية لهذا الخبر المستقبلي قوةَ الالتزام."
        note: "استعمل `الْيَوْمَ` لليوم إذا تغيّر الترتيب. وقد يصف فعل المستقبل وحده توقعًا أيضًا؛ فهو ليس
          وعدًا تلقائيًا. **جرّب:** انقل الالتزام إلى اليوم. الإجابة: `سَأُحْضِرُ الْمَفَاتِيحَ
          الْيَوْمَ`؛ يبقى الفعل ويتغير الوقت."
  - subskill_id: accepting_declining
    explanation: دُعيت إلى مكان اليوم لكنك لا تستطيع الحضور. شكر الشخص قبل ذكر العائق يجعل الرفض واضحًا ومهذبًا.
    examples:
      - text: شُكْرًا، لٰكِنَّنِي لَا أَسْتَطِيعُ الْحُضُورَ الْيَوْمَ.
        meaning: "**المثال.** شكرًا، لكنني لا أستطيع الحضور اليوم. `شُكْرًا` للشكر. تعني `لٰكِنَّنِي`
          «لكنني»؛ وتعني `لَا أَسْتَطِيعُ` «لا أستطيع». تسمّي `الْحُضُورَ` الحضور، وتحصر `الْيَوْمَ`
          الرفض في اليوم. يتبع فعل القدرة هنا اسمٌ للنشاط."
        note: "إذا كانت الدعوة غدًا، استبدل `الْيَوْمَ` بـ`غَدًا`. أبقِ `لَا` للمحافظة على الرفض. **جرّب:**
          ارفض دعوة غد. الإجابة: `شُكْرًا، لٰكِنَّنِي لَا أَسْتَطِيعُ الْحُضُورَ غَدًا`. يبقى الشكر
          وعدم القدرة كما هما؛ ويتغير اليوم فقط."
  - subskill_id: negotiating_plans
    explanation: هناك لقاء مقرر اليوم، لكن الغد أنسب. يعني التفاوض اقتراح تغيير جزء واحد مع إبقاء الخطة
      المشتركة واضحة.
    examples:
      - text: هَلْ يُمْكِنُ أَنْ نَلْتَقِيَ غَدًا بَدَلًا مِنَ الْيَوْمِ؟
        meaning: "**المثال.** هل يمكن أن نلتقي غدًا بدل اليوم؟ تسأل `هَلْ يُمْكِنُ` عن الإمكان. وتقدّم `أَنْ
          نَلْتَقِيَ` الفعل المشترك، أي لقاءنا. `غَدًا` هو اليوم المقترح؛ وتعني `بَدَلًا مِنَ
          الْيَوْمِ` «بدل اليوم» وتحدد ما تريد استبداله."
        note: "أبقِ اليوم الجديد قبل عبارة الاستبدال لتتضح البدائل. يطلب السؤال الموافقة ولا يعلن أن التغيير
          حُسم. **جرّب:** أي يوم يجري استبداله؟ الإجابة: اليوم المذكور بعد `بَدَلًا مِنَ`؛ والغد هو
          البديل المقترح."
