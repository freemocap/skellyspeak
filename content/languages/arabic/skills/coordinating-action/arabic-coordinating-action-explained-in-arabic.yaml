            والوقت هو التفصيل الوحيد المتغير."
    - subskill_id: negotiating_plans
      explanation: هناك لقاء مقرر اليوم، لكن الغد أنسب. يعني التفاوض اقتراح تغيير جزء واحد مع إبقاء الخطة
