          meaning: "**المثال.** سأحضر المفاتيح غدًا. تشير `رَحْ` إلى المستقبل، وتعني `أَجِيبْ` «أحضر»،
            و`الْمَفَاتِيحْ` «المفاتيح»، و`بُكْرَا` «غدًا». بعد `رَحْ` يأتي هذا الفعل من غير باء
            المضارع المعتادة. أنت تتعهد بالفعل لأنك قبلت المهمة."
          note: "بعد `رَحْ` أبقِ الفعل بلا باء المضارع المعتادة. **جرّب:** تعهّد بإحضار المفاتيح اليوم بدلًا
            من الغد. الإجابة: `رَحْ أَجِيبْ الْمَفَاتِيحْ الْيَوْمْ`. يغيّر استبدال `بُكْرَا`
            بـ`الْيَوْمْ` اليوم، وتبقى مسؤولًا عن الفعل نفسه."
    - subskill_id: accepting_declining
      explanation: دُعيت إلى مكان اليوم لكنك لا تستطيع الحضور. شكر الشخص قبل ذكر العائق يجعل الرفض واضحًا
        ومهذبًا.
      examples:
