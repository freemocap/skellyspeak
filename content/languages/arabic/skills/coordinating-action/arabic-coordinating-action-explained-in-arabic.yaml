      examples:
        - text: مُمْكِنْ نِلْتَقِي بُكْرَا بَدَلْ الْيَوْمْ؟
          meaning: "**المثال.** هل يمكن أن نلتقي غدًا بدل اليوم؟ تبدأ `مُمْكِنْ` سؤال الإمكان، وتعني
            `نِلْتَقِي` «نلتقي». `بُكْرَا` غدًا؛ وتعني `بَدَلْ الْيَوْمْ` «بدل اليوم». تشمل صيغة
            «نحن» الطرفين، ويحدّد تعبِيرا الوقت التغييرَ المطلوب."
