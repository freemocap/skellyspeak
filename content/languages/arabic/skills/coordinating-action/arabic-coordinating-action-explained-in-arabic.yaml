variety_sections:
  arabic-levantine:
    - subskill_id: requests
      explanation: "الطلب يدعو شخصًا آخر إلى فعل شيء. تخيّل تيارًا باردًا يدخل من باب مفتوح: تريد إغلاقه
        وتضيف عبارة مجاملة لتلطيف الطلب."
      examples:
        - text: سَكِّرْ الْبَابْ، لَوْ سَمَحْتْ.
          meaning: "**المثال.** سكّر الباب، من فضلك. `سَكِّرْ` فعل أمر لرجل واحد بمعنى الإغلاق؛ و`الْبَابْ` هو
            الباب. `لَوْ سَمَحْتْ` عبارة مجاملة مألوفة بمعنى «من فضلك»، وحرفيًا «إن سمحت». تعلّمها
            عبارةَ مجاملة لا شرطًا فعليًا مطلوبًا تحقيقه."
          note: "لامرأة واحدة استعمل `سَكِّرِي` و`لَوْ سَمَحْتِي`. **جرّب:** اطلب الطلب كاملًا من امرأة.
            الإجابة: `سَكِّرِي الْبَابْ، لَوْ سَمَحْتِي`. تتغير النهايتان؛ ويبقى الباب والفعل
            المطلوب كما هما."
    - subskill_id: offers_invitations
      explanation: عندما يواجه شخص صعوبة في مهمة، يمكنك عرض مساعدتك أنت بدل طلب مساعدته لك. يتيح له السؤال
        القصير القبول أو الرفض.
      examples:
        - text: أَسَاعْدَكْ؟
          meaning: "**المثال.** هل أساعدك؟ تجمع `أَسَاعْدَكْ` معنى «أنا أساعد» ولاحقةً تعني «أنت»، هنا عند
            مخاطبة رجل واحد. تحوّل نبرة السؤال الفعل المحتمل إلى عرض. لا يأخذ الفعل باء المضارع
            المعتادة في نمط هذا العرض."
          note: "لعرض المساعدة على امرأة، استعمل `أَسَاعْدِكْ؟` في هذا النموذج المنطوق. قارن
            بـ`تْسَاعْدْنِي؟`، أي «هل تساعدني؟»، وهي تطلب المساعدة من المخاطَب. **جرّب:** اختر صيغة
            العرض عندما تتطوع أنت. الإجابة: `أَسَاعْدَكْ؟` لرجل؛ تبقي صيغة المتكلم الأولى دور
            المساعد لك."
    - subskill_id: suggestions
      explanation: تحتاج مجموعة إلى مكان للجلوس. يمكن لسؤال «لماذا لا» أن يطرح هذا المكان خيارًا مشتركًا
        من غير أمر أي شخص باختياره.
      examples:
        - text: لَيْشْ مَا نِقْعُدْ هُونْ؟
          meaning: "**المثال.** لماذا لا نجلس هنا؟ تعني `لَيْشْ` «لماذا»، و`مَا` «لا»، و`نِقْعُدْ` «نجلس»،
            و`هُونْ` «هنا». تقترح معًا فعلًا مشتركًا. تشمل صيغة «نحن» المتحدث؛ وليست أمرًا للمستمع
            وحده بالجلوس."
          note: "استبدل `هُونْ` بـ`هُنِيكْ` لاقتراح الجلوس هناك. تعلّم الاقتراح كاملًا نمطًا منطوقًا؛ فقد تسأل
            الصيغة نفسها عن عائق حقيقي في موقف آخر. **جرّب:** أي كلمة تشمل المتحدث في الخطة؟
            الإجابة: `نِقْعُدْ`، صيغة «نحن»."
    - subskill_id: commitments
      explanation: يجب أن يحضر شخص المفاتيح. عندما تتحمل هذه المسؤولية، فإن تسمية فعلك المستقبلي تخبر
        الآخرين بما يمكنهم الاعتماد عليك لفعله.
      examples:
