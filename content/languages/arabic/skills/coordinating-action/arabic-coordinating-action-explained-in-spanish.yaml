shared_explanation: skills/coordinating-action/coordinating-action-explained-in-spanish.yaml
sections:
  - subskill_id: requests
    explanation: "Una petición pide a otra persona que actúe. Imagina una corriente de aire por una
      puerta abierta: quieres que la cierren y añades una fórmula de cortesía para suavizar la
      orden."
    examples:
      - text: أَغْلِقِ الْبَابَ، مِنْ فَضْلِكَ.
        meaning: "**El ejemplo.** Cierra la puerta, por favor. `أَغْلِقِ` ordena a un hombre cerrar algo;
          `الْبَابَ` es la puerta. `مِنْ فَضْلِكَ` significa por favor al dirigirse a ese hombre. La
          vocal breve final del imperativo enlaza con la palabra siguiente en una pronunciación
          cuidada."
        note: "Para dirigirse a una mujer, se usan `أَغْلِقِي` y la cortesía `مِنْ فَضْلِكِ`. **Practica:**
          pídele que cierre la puerta. Respuesta: `أَغْلِقِي الْبَابَ، مِنْ فَضْلِكِ`. El imperativo
          adquiere una vocal final larga y el sufijo cortés también cambia para concordar con la
          oyente."
  - subskill_id: offers_invitations
    explanation: Si alguien tiene dificultades con una tarea, puedes ofrecer tu propia ayuda en vez de
      pedirle que te ayude. Una pregunta breve le permite aceptar o rechazar la oferta.
    examples:
      - text: هَلْ أُسَاعِدُكَ؟
        meaning: "**El ejemplo.** ¿Te ayudo? `هَلْ` introduce una pregunta de sí o no. `أُسَاعِدُ` significa
          ayudo y el `كَ` unido al verbo significa a ti, dirigido a un hombre. La forma de primera
          persona hace que quien habla sea el posible ayudante; el sufijo identifica a quien recibe
          la ayuda."
        note: "Para una mujer, usa `هَلْ أُسَاعِدُكِ؟`. Compara `هَلْ تُسَاعِدُنِي؟`, ¿me ayudas tú?,
          dirigido a un hombre: ahora ayuda la otra persona y yo recibo la ayuda. **Practica:**
          ofrece ayuda a una mujer. Respuesta: `هَلْ أُسَاعِدُكِ؟`; conserva la forma de yo y cambia
          el sufijo de la oyente."
  - subskill_id: suggestions
    explanation: Un grupo necesita dónde sentarse. Una pregunta equivalente a por qué no propone este
      lugar como opción compartida sin ordenar que lo elijan.
    examples:
      - text: لِمَاذَا لَا نَجْلِسُ هُنَا؟
        meaning: "**El ejemplo.** ¿Por qué no nos sentamos aquí? `لِمَاذَا` significa por qué y `لَا` niega
          la acción siguiente. `نَجْلِسُ` significa nos sentamos; `هُنَا` es aquí. En este contexto,
          la pregunta entera sugiere sentarse, no pide una explicación detallada contra esa
          posibilidad."
        note: "Usa `هُنَاكَ` para allí y conserva la forma de nosotros. Con otro tono o contexto, por qué no
          puede preguntar por un obstáculo real. **Practica:** propón sentarse allí. Respuesta:
          `لِمَاذَا لَا نَجْلِسُ هُنَاكَ؟`; solo cambia el lugar."
  - subskill_id: commitments
    explanation: Alguien debe traer las llaves. Cuando asumes esa responsabilidad, nombrar tu acción
      futura permite a los demás contar contigo.
    examples:
      - text: سَأُحْضِرُ الْمَفَاتِيحَ غَدًا.
        meaning: "**El ejemplo.** Traeré las llaves mañana. El `سَـ` unido a `سَأُحْضِرُ` señala el futuro;
          `أُحْضِرُ` significa traigo. `الْمَفَاتِيحَ` son las llaves y `غَدًا` significa mañana.
          Haber aceptado la responsabilidad convierte esta frase de futuro en un compromiso."
        note: "Usa `الْيَوْمَ` para hoy si cambia el acuerdo. Un verbo de futuro también puede expresar una
          predicción; no siempre es una promesa. **Practica:** adelanta el compromiso a hoy.
          Respuesta: `سَأُحْضِرُ الْمَفَاتِيحَ الْيَوْمَ`; la acción se conserva y cambia el
          tiempo."
  - subskill_id: accepting_declining
    explanation: Te han invitado a un lugar hoy, pero no puedes asistir. Agradecer la invitación antes
      de explicar el impedimento comunica la negativa con claridad y cortesía.
    examples:
      - text: شُكْرًا، لٰكِنَّنِي لَا أَسْتَطِيعُ الْحُضُورَ الْيَوْمَ.
        meaning: "**El ejemplo.** Gracias, pero hoy no puedo asistir. `شُكْرًا` agradece. `لٰكِنَّنِي`
          significa pero yo; `لَا أَسْتَطِيعُ` significa no puedo. `الْحُضُورَ` nombra la asistencia
          y `الْيَوْمَ` limita la negativa a hoy. Aquí el verbo de capacidad va seguido de un
          sustantivo que nombra la actividad."
        note: "Si la invitación es para mañana, sustituye `الْيَوْمَ` por `غَدًا`. Conserva `لَا` para
          mantener la negativa. **Practica:** rechaza la invitación de mañana. Respuesta: `شُكْرًا،
          لٰكِنَّنِي لَا أَسْتَطِيعُ الْحُضُورَ غَدًا`. El agradecimiento y la imposibilidad siguen
          iguales; solo cambia el día."
  - subskill_id: negotiating_plans
    explanation: Ya hay una reunión prevista para hoy, pero mañana te convendría más. Negociar consiste
      en proponer un cambio concreto mientras se conserva el plan compartido.
    examples:
      - text: هَلْ يُمْكِنُ أَنْ نَلْتَقِيَ غَدًا بَدَلًا مِنَ الْيَوْمِ؟
        meaning: "**El ejemplo.** ¿Podríamos reunirnos mañana en vez de hoy? `هَلْ يُمْكِنُ` pregunta si
          algo es posible. `أَنْ نَلْتَقِيَ` aporta la acción compartida de reunirnos. `غَدًا` es el
          día propuesto; `بَدَلًا مِنَ الْيَوْمِ` significa en vez de hoy e identifica lo que deseas
          sustituir."
        note: "Mantén el día nuevo antes de la expresión de sustitución para distinguir las opciones. Es una
          petición de acuerdo, no un anuncio de que ya se ha cambiado la cita. **Practica:** ¿qué
          día se sustituye? Respuesta: hoy, mencionado después de `بَدَلًا مِنَ`; mañana es la
          alternativa propuesta."
