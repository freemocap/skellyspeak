sections:
  - subskill_id: opening_closing
    explanation: Un saludo matinal permite iniciar una conversación con alguien que encuentras. La
      respuesta puede usar otra fórmula habitual sin repetir literalmente el saludo.
    examples:
      - text: صَبَاحُ الْخَيْرِ!
        meaning: "**El ejemplo.** ¡Buenos días! `صَبَاحُ` significa mañana y `الْخَيْرِ`, bondad. Juntas
          forman el saludo habitual. Aprende la expresión como saludo, sin buscar una palabra árabe
          independiente para cada palabra española."
        note: "Una respuesta tradicional es `صَبَاحُ النُّورِ`, literalmente mañana de luz. Para saludar por
          la tarde o noche, usa `مَسَاءُ الْخَيْرِ`. **Practica:** saluda al anochecer. Respuesta:
          `مَسَاءُ الْخَيْرِ`; cambia el nombre del momento del día y se mantiene el patrón."
  - subskill_id: acknowledging
    explanation: Después de que alguien explique una tarea, puedes indicar que has comprendido. Decirlo
      no significa necesariamente que aceptes el plan.
    examples:
      - text: حَسَنًا، فَهِمْتُ.
        meaning: "**El ejemplo.** De acuerdo, entiendo. `حَسَنًا` significa bien o de acuerdo; `فَهِمْتُ`
          significa comprendí. La forma pasada presenta la comprensión como lograda y, en esta
          respuesta, equivale naturalmente a entiendo. Su terminación identifica a quien habla."
        note: "Para un grupo, `حَسَنًا، فَهِمْنَا` significa bien, hemos entendido. Distingue comprender de
          manifestar acuerdo cuando no sean lo mismo. **Practica:** reconoce la explicación por tu
          grupo. Respuesta: `حَسَنًا، فَهِمْنَا`; la terminación pasa de yo a nosotros."
  - subskill_id: clarification
    explanation: Oír una frase no siempre implica comprender lo que la otra persona quiere decir.
      `مَاذَا تَقْصِدُ بِهٰذَا؟` pide que explique su intención. El ejemplo se dirige a un hombre y
      remite a algo que acaba de decir.
    examples:
      - text: مَاذَا تَقْصِدُ بِهٰذَا؟
        meaning: "**El ejemplo.** ¿Qué quieres decir con eso? `مَاذَا` pregunta qué; `تَقْصِدُ` significa
          quieres decir aquí. `بِهٰذَا` une la preposición `بِـ` con `هٰذَا`, esto, y señala lo
          dicho antes."
        note: >-
          **Cambia la persona oyente.** Para una mujer, usa `مَاذَا تَقْصِدِينَ بِهٰذَا؟`. La forma
          verbal cambia para marcar a quién preguntas.


          **Practica.** ¿Qué parte identifica la expresión que quieres aclarar? Respuesta:
          `بِهٰذَا`.
  - subskill_id: rephrasing
    explanation: Una explicación de reservas quizá resulte complicada. Reformular conserva el sentido
      práctico, pero expresa más sencillamente el requisito principal sin añadir otra instrucción.
    examples:
      - text: بِعِبَارَةٍ أَبْسَطَ، يَجِبُ أَنْ نَحْجِزَ مُسْبَقًا.
        meaning: "**El ejemplo.** Dicho más sencillamente, tenemos que reservar con antelación. `بِعِبَارَةٍ
          أَبْسَطَ` significa con una expresión más sencilla. `يَجِبُ أَنْ` introduce la obligación;
          `نَحْجِزَ` significa reservamos en la forma que sigue a `أَنْ`. `مُسْبَقًا` indica con
          antelación. El comienzo anuncia que se repite la misma idea."
        note: "Para mi propia reserva, usa `يَجِبُ أَنْ أَحْجِزَ مُسْبَقًا`. La persona se marca en el verbo
          reservar. **Practica:** expresa el mismo requisito solo para ti. Respuesta: `بِعِبَارَةٍ
          أَبْسَطَ، يَجِبُ أَنْ أَحْجِزَ مُسْبَقًا`; cambia nosotros por yo y se conserva la
          obligación."
  - subskill_id: correcting_misunderstanding
    explanation: La otra persona entendió hoy, pero querías decir mañana. Una corrección nombra primero
      el dato pretendido y rechaza expresamente el equivocado.
    examples:
      - text: أَقْصِدُ غَدًا، وَلَيْسَ الْيَوْمَ.
        meaning: "**El ejemplo.** Quiero decir mañana, no hoy. `أَقْصِدُ` significa quiero decir. `غَدًا` es
          mañana; `وَلَيْسَ الْيَوْمَ` significa y no hoy. Las dos expresiones temporales precisan
          qué debe sustituir la otra persona."
        note: "Invierte los días para la corrección contraria: `أَقْصِدُ الْيَوْمَ، وَلَيْسَ غَدًا`.
          Corregir un dato no equivale a rechazar toda la reunión. **Practica:** corrige a quien
          entendió mañana cuando querías decir hoy. Respuesta: usa esa oración invertida; el tiempo
          pretendido va primero."
  - subskill_id: turns_topics
    explanation: La conversación se ha alejado de una cita, pero aún necesitas acordar su hora. Nombrar
      el tema antes de preguntar ayuda a seguir el cambio.
    examples:
      - text: بِخُصُوصِ الْمَوْعِدِ، هَلْ نَلْتَقِي صَبَاحًا؟
        meaning: "**El ejemplo.** Sobre la cita, ¿nos reunimos por la mañana? `بِخُصُوصِ الْمَوْعِدِ`
          significa respecto de la cita. `هَلْ` introduce una pregunta de sí o no; `نَلْتَقِي`
          significa nos reunimos y `صَبَاحًا`, por la mañana. La frase inicial sitúa el tema, sin
          responder la pregunta."
        note: "Usa `مَسَاءً` para por la tarde o noche. **Practica:** vuelve a la cita y propone ese
          horario. Respuesta: `بِخُصُوصِ الْمَوْعِدِ، هَلْ نَلْتَقِي مَسَاءً؟`; el tema y la acción
          común permanecen, cambia el momento."
