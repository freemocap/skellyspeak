variety_sections:
  arabic-levantine:
    - subskill_id: opening_closing
      explanation: Conventional greetings can open an exchange in either variety.
      examples:
        - text: صَبَاحْ الْخَيْرْ!
          meaning: Good morning!
          note: Levantine Arabic; conversational wording, with regional alternatives possible. An opening
            greeting; the Levantine form has no formal case ending.
    - subskill_id: acknowledging
      explanation: A short response can acknowledge that a message has been understood.
      examples:
        - text: طَيِّبْ، فِهِمْتْ.
          meaning: Okay, I understand.
          note: Levantine Arabic; conversational wording, with regional alternatives possible. Receipt of the
            explanation does not necessarily mean agreement.
    - subskill_id: clarification
      explanation: Sometimes the words are clear but the intended meaning is not. `شُو قَصْدَكْ بِهَادْ؟`
        asks the other person to explain what they mean by something they just said. The example
        addresses one man. A calm tone makes the request easier to distinguish from a challenge.
      examples:
        - text: شُو قَصْدَكْ بِهَادْ؟
          meaning: "**The example.** “What do you mean by that?” `شُو` is what. `قَصْدَكْ` uses a noun for
            intention or meaning plus a suffix for your, addressed here to a man. `بِهَادْ` points
            back to this or that expression. The suffix identifies whose intention you mean."
          note: >-
            **Choose the repair.** This asks for an explanation, so repeating the same words may not
            solve the problem. You can point to the particular word you did not understand.


            **Try it.** Identify the part meaning your intention. Answer: `قَصْدَكْ`. Keep that
            whole word together when learning the expression.
    - subskill_id: rephrasing
      explanation: A simpler restatement can clarify an existing instruction.
      examples:
        - text: بِكَلَامْ أَبْسَطْ، لَازِمْ نِحْجِزْ مِنْ قَبْلْ.
          meaning: More simply, we need to book in advance.
          note: Levantine Arabic; conversational wording, with regional alternatives possible. Use to restate
            a more complicated booking explanation.
    - subskill_id: correcting_misunderstanding
      explanation: A correction can replace a mistaken time with the intended one.
      examples:
        - text: قَصْدِي بُكْرَا، مِشْ الْيَوْمْ.
          meaning: I mean tomorrow, not today.
          note: Levantine Arabic; conversational wording, with regional alternatives possible. The listener
            had understood today.
    - subskill_id: turns_topics
      explanation: A topic marker can introduce a related scheduling question.
      examples:
        - text: بِالنِّسْبِة لِلْمَوْعِدْ، نِلْتَقِي الصُّبْحْ؟
          meaning: About the appointment, shall we meet in the morning?
          note: Levantine Arabic; conversational wording, with regional alternatives possible. The opening
            phrase shifts attention to the appointment.
