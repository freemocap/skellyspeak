variety_sections:
  arabic-levantine:
    - subskill_id: opening_closing
      explanation: A morning greeting gives you a simple way to begin an exchange with someone you meet.
        The reply can use a different conventional phrase; it need not repeat the greeting word for
        word.
      examples:
        - text: صَبَاحْ الْخَيْرْ!
          meaning: "**The example.** Good morning! `صَبَاحْ` means morning and `الْخَيْرْ` means goodness. The
            whole phrase is good morning, used to open a spoken exchange. It is a conventional
            greeting rather than a report about what happened this morning."
          note: "A familiar reply is `صَبَاحْ النُّورْ`, literally morning of light. An evening greeting is
            `مَسَا الْخَيْرْ`. Try it: reply to the morning greeting. Answer: `صَبَاحْ النُّورْ`;
            you acknowledge the greeting with its conventional response."
    - subskill_id: acknowledging
      explanation: After someone explains how a task works, you can let them know the explanation has
        reached you. Saying you understood does not necessarily mean that you agree with the plan.
      examples:
        - text: طَيِّبْ، فِهِمْتْ.
          meaning: "**The example.** Okay, I understand. `طَيِّبْ` means okay in this reply; `فِهِمْتْ` means
            I understood. A short response is enough to show that the explanation is now clear. The
            past form focuses on reaching understanding rather than narrating a long earlier event."
          note: "`طَيِّبْ، فِهِمْنَا` gives the response for we. Use a separate agreement expression if you
            also want to accept the proposal. Try it: acknowledge for two or more people. Answer:
            `طَيِّبْ، فِهِمْنَا`; the plural speaker ending makes the group explicit."
    - subskill_id: clarification
      explanation: Sometimes the words are clear but the intended meaning is not. `شُو قَصْدَكْ بِهَادْ؟`
        asks the other person to explain what they mean by something they just said. The example
        addresses one man. A calm tone makes the request easier to distinguish from a challenge.
      examples:
        - text: شُو قَصْدَكْ بِهَادْ؟
          meaning: "**The example.** “What do you mean by that?” `شُو` is what. `قَصْدَكْ` uses a noun for
            intention or meaning plus a suffix for your, addressed here to a man. `بِهَادْ` points
            back to this or that expression. The suffix identifies whose intention you mean."
          note: >-
            **Choose the repair.** This asks for an explanation, so repeating the same words may not
            solve the problem. You can point to the particular word you did not understand.


            **Try it.** Identify the part meaning your intention. Answer: `قَصْدَكْ`. Keep that
            whole word together when learning the expression.
    - subskill_id: rephrasing
      explanation: A booking explanation may be too complicated. Rephrasing keeps its practical meaning
        but expresses the main requirement more simply, rather than adding a different instruction.
      examples:
        - text: بِكَلَامْ أَبْسَطْ، لَازِمْ نِحْجِزْ مِنْ قَبْلْ.
          meaning: "**The example.** More simply, we need to book in advance. `بِكَلَامْ أَبْسَطْ` means in
            simpler words. `لَازِمْ` expresses need; `نِحْجِزْ` is we book, and `مِنْ قَبْلْ` gives
            in advance here. The booking action after `لَازِمْ` has no ordinary b-prefix."
          note: "For I need to book, use `لَازِمْ أَحْجِزْ مِنْ قَبْلْ`. A rephrasing should preserve the
            earlier requirement, not quietly change its day or person. Try it: state the same
            requirement for yourself. Answer: `بِكَلَامْ أَبْسَطْ، لَازِمْ أَحْجِزْ مِنْ قَبْلْ`;
            the new I-form is explicit."
    - subskill_id: correcting_misunderstanding
      explanation: The listener heard today, but you meant tomorrow. A correction names your intended
        information first and explicitly rules out the mistaken version.
      examples:
        - text: قَصْدِي بُكْرَا، مِشْ الْيَوْمْ.
          meaning: "**The example.** I mean tomorrow, not today. `قَصْدِي` means my intention or what I mean.
            `بُكْرَا` is tomorrow; `مِشْ الْيَوْمْ` means not today. The attached my suffix makes
            the correction about your intended message."
          note: "For the opposite correction, say `قَصْدِي الْيَوْمْ، مِشْ بُكْرَا`. Keep the rejected
            information after the negative word. Try it: correct tomorrow to today. Answer: `قَصْدِي
            الْيَوْمْ، مِشْ بُكْرَا`; the intended day now comes before the rejected one."
    - subskill_id: turns_topics
      explanation: A conversation has moved away from an appointment, and you need to settle its time.
        Naming the topic before your question helps the listener follow the shift.
      examples:
        - text: بِالنِّسْبِة لِلْمَوْعِدْ، نِلْتَقِي الصُّبْحْ؟
          meaning: "**The example.** About the appointment, shall we meet in the morning? `بِالنِّسْبِة
            لِلْمَوْعِدْ` means regarding the appointment. `نِلْتَقِي` is we meet and `الصُّبْحْ`
            means in the morning here. A questioning tone presents the meeting time for agreement,
            while the opening phrase guides the topic shift."
          note: "For an evening proposal, replace the time with `بِالْمَسَا`. Try it: ask about meeting in the
            evening. Answer: `بِالنِّسْبِة لِلْمَوْعِدْ، نِلْتَقِي بِالْمَسَا؟`; keep the topic
            phrase but change the time expression as a whole."
