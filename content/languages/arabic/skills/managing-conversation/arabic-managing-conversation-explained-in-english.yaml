sections:
  - subskill_id: opening_closing
    explanation: Conventional greetings can open an exchange in either variety.
    examples:
      - text: صَبَاحُ الْخَيْرِ!
        meaning: Good morning!
        note: Modern Standard Arabic. An opening greeting; the Levantine form has no formal case ending.
  - subskill_id: acknowledging
    explanation: A short response can acknowledge that a message has been understood.
    examples:
      - text: حَسَنًا، فَهِمْتُ.
        meaning: Okay, I understand.
        note: Modern Standard Arabic. Receipt of the explanation does not necessarily mean agreement.
  - subskill_id: clarification
    explanation: Hearing a sentence does not always mean understanding what the speaker intends. `مَاذَا
      تَقْصِدُ بِهٰذَا؟` asks the other person to explain what they mean. The example addresses one
      man and points back to something he has just said.
    examples:
      - text: مَاذَا تَقْصِدُ بِهٰذَا؟
        meaning: "**The example.** “What do you mean by that?” `مَاذَا` asks what; `تَقْصِدُ` means you
          intend or mean here. `بِهٰذَا` combines the attached preposition `بِـ`, by, with `هٰذَا`,
          this, pointing back to what was said."
        note: >-
          **Change the listener.** To address one woman, use `مَاذَا تَقْصِدِينَ بِهٰذَا؟`. The
          change is in the verb; it marks whom you are asking.


          **Try it.** Which part identifies the expression you want explained? Answer: `بِهٰذَا`.
  - subskill_id: rephrasing
    explanation: A simpler restatement can clarify an existing instruction.
    examples:
      - text: بِعِبَارَةٍ أَبْسَطَ، يَجِبُ أَنْ نَحْجِزَ مُسْبَقًا.
        meaning: More simply, we need to book in advance.
        note: Modern Standard Arabic. Use to restate a more complicated booking explanation.
  - subskill_id: correcting_misunderstanding
    explanation: A correction can replace a mistaken time with the intended one.
    examples:
      - text: أَقْصِدُ غَدًا، وَلَيْسَ الْيَوْمَ.
        meaning: I mean tomorrow, not today.
        note: Modern Standard Arabic. The listener had understood today.
  - subskill_id: turns_topics
    explanation: A topic marker can introduce a related scheduling question.
    examples:
      - text: بِخُصُوصِ الْمَوْعِدِ، هَلْ نَلْتَقِي صَبَاحًا؟
        meaning: About the appointment, shall we meet in the morning?
        note: Modern Standard Arabic. The opening phrase shifts attention to the appointment.
