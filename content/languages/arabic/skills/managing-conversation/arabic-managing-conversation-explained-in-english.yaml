sections:
  - subskill_id: opening_closing
    explanation: A morning greeting gives you a simple way to begin an exchange with someone you meet.
      The reply can use a different conventional phrase; it need not repeat the greeting word for
      word.
    examples:
      - text: صَبَاحُ الْخَيْرِ!
        meaning: "**The example.** Good morning! `صَبَاحُ` means morning and `الْخَيْرِ` means goodness.
          Together this is the conventional greeting good morning. Learn the phrase as a greeting,
          rather than trying to translate every English word into a separate Arabic word."
        note: "A conventional reply is `صَبَاحُ النُّورِ`, literally morning of light. For an evening
          greeting, use `مَسَاءُ الْخَيْرِ`. Try it: greet someone in the evening. Answer: `مَسَاءُ
          الْخَيْرِ`; the time-of-day noun changes while the greeting pattern remains."
  - subskill_id: acknowledging
    explanation: After someone explains how a task works, you can let them know the explanation has
      reached you. Saying you understood does not necessarily mean that you agree with the plan.
    examples:
      - text: حَسَنًا، فَهِمْتُ.
        meaning: "**The example.** Okay, I understand. `حَسَنًا` is okay or all right; `فَهِمْتُ` means I
          understood. The past form presents understanding as achieved, which naturally gives I
          understand in this reply. Its ending identifies the speaker."
        note: "For a group, `حَسَنًا، فَهِمْنَا` says okay, we understood. Keep understanding distinct from
          an agreement statement when the two differ. Try it: acknowledge on behalf of your group.
          Answer: `حَسَنًا، فَهِمْنَا`; the ending changes from I to we."
  - subskill_id: clarification
    explanation: Hearing a sentence does not always mean understanding what the speaker intends. `مَاذَا
      تَقْصِدُ بِهٰذَا؟` asks the other person to explain what they mean. The example addresses one
      man and points back to something he has just said.
    examples:
      - text: مَاذَا تَقْصِدُ بِهٰذَا؟
        meaning: "**The example.** “What do you mean by that?” `مَاذَا` asks what; `تَقْصِدُ` means you
          intend or mean here. `بِهٰذَا` combines the attached preposition `بِـ`, by, with `هٰذَا`,
          this, pointing back to what was said."
        note: >-
          **Change the listener.** To address one woman, use `مَاذَا تَقْصِدِينَ بِهٰذَا؟`. The
          change is in the verb; it marks whom you are asking.


          **Try it.** Which part identifies the expression you want explained? Answer: `بِهٰذَا`.
  - subskill_id: rephrasing
    explanation: A booking explanation may be too complicated. Rephrasing keeps its practical meaning
      but expresses the main requirement more simply, rather than adding a different instruction.
    examples:
      - text: بِعِبَارَةٍ أَبْسَطَ، يَجِبُ أَنْ نَحْجِزَ مُسْبَقًا.
        meaning: "**The example.** More simply, we need to book in advance. `بِعِبَارَةٍ أَبْسَطَ` means in
          a simpler expression. `يَجِبُ أَنْ` introduces a requirement; `نَحْجِزَ` means we book, in
          the form following `أَنْ`. `مُسْبَقًا` is in advance. The opening tells the listener this
          is a restatement."
        note: "For my own booking, use `يَجِبُ أَنْ أَحْجِزَ مُسْبَقًا`. The person marking is on the
          booking verb. Try it: restate the requirement for yourself alone. Answer: `بِعِبَارَةٍ
          أَبْسَطَ، يَجِبُ أَنْ أَحْجِزَ مُسْبَقًا`; change we to I, keeping the requirement."
  - subskill_id: correcting_misunderstanding
    explanation: The listener heard today, but you meant tomorrow. A correction names your intended
      information first and explicitly rules out the mistaken version.
    examples:
      - text: أَقْصِدُ غَدًا، وَلَيْسَ الْيَوْمَ.
        meaning: "**The example.** I mean tomorrow, not today. `أَقْصِدُ` means I mean or intend. `غَدًا` is
          tomorrow; `وَلَيْسَ الْيَوْمَ` means and not today. The two time expressions make the
          correction specific, so the listener knows exactly what to replace."
        note: "Reverse the days for the opposite correction: `أَقْصِدُ الْيَوْمَ، وَلَيْسَ غَدًا`.
          Correcting a detail is different from rejecting the whole meeting. Try it: correct someone
          who heard tomorrow when you meant today. Answer: use that reversed sentence; intended time
          comes first."
  - subskill_id: turns_topics
    explanation: A conversation has moved away from an appointment, and you need to settle its time.
      Naming the topic before your question helps the listener follow the shift.
    examples:
      - text: بِخُصُوصِ الْمَوْعِدِ، هَلْ نَلْتَقِي صَبَاحًا؟
        meaning: "**The example.** About the appointment, shall we meet in the morning? `بِخُصُوصِ
          الْمَوْعِدِ` means regarding the appointment. `هَلْ` introduces a yes/no question;
          `نَلْتَقِي` means we meet and `صَبَاحًا` means in the morning. The topic phrase frames the
          question rather than answering it."
        note: "Use `مَسَاءً` for in the evening. Try it: return to the appointment and propose evening.
          Answer: `بِخُصُوصِ الْمَوْعِدِ، هَلْ نَلْتَقِي مَسَاءً؟`; the topic and shared action
          remain, while the proposed time changes."
