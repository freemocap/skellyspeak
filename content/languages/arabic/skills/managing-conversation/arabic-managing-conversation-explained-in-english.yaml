    disposition: supplement
    text: Conversational طَيِّبْ can acknowledge receipt, and قَصْدِي introduces an intended meaning
      or correction. These do not require formal case endings.
    provenance: *a1
  arabic-modern-standard:
    disposition: supplement
    text: Modern Standard has formal clarification and restatement formulas, but a brief
      conventional acknowledgement can still be sufficient.
    provenance: *a1
