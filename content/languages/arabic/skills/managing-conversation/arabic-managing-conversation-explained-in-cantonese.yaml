variety_sections:
  arabic-levantine:
    - subskill_id: opening_closing
      explanation: 朝早見到人，可以用一句慣用問候開始對話。回覆亦有自己嘅慣用講法，唔使逐字重複對方。
      examples:
        - text: صَبَاحْ الْخَيْرْ!
          meaning: "**例句。** 早晨！ `صَبَاحْ` 係早晨，`الْخَيْرْ` 係好、善，成個短語係口語早晨問候。佢係慣用招呼，唔係報告朝早發生咗乜。"
          note: 常見回覆係 `صَبَاحْ النُّورْ`，字面係光嘅早晨。晚間可以講 `مَسَا الْخَيْرْ`。試下回覆早晨問候：答案係 `صَبَاحْ
            النُّورْ`，用慣用回應接住對方。
    - subskill_id: acknowledging
      explanation: 人哋解釋完點做，你可以話畀佢知自己明白咗。聽明唔一定等於贊成個計劃。
      examples:
        - text: طَيِّبْ، فِهِمْتْ.
          meaning: "**例句。** 好，我明白。 `طَيِّبْ` 呢度係好、好啦，`فِهِمْتْ`
            係我明白咗。簡短回應就足以話對方知解釋而家清楚。過去形式着重理解已經達成，唔係講一段長篇往事。"
          note: "`طَيِّبْ، فِهِمْنَا` 係「我哋」嘅回應。想同時接受提議，可以再加同意表達。試下代表兩個或更多人回應：答案係 `طَيِّبْ،
            فِهِمْنَا`，複數講者詞尾指出成班人。"
    - subskill_id: clarification
      explanation: 有時啲字聽得清楚，但唔明對方想表達乜。`شُو قَصْدَكْ بِهَادْ؟` 請對方解釋頭先說話嘅意思。下面例句向一位男性問；平和語氣可以減少聽落似質問。
      examples:
        - text: شُو قَصْدَكْ بِهَادْ؟
          meaning: "**例句解說。** 「你咁講係乜嘢意思？」`شُو` 係乜嘢。`قَصْدَكْ` 用表示意圖或者意思嘅名詞，加表示你嘅後綴，呢度向男性問。`بِهَادْ`
            指返呢句或者嗰句說話。後綴指出係邊個嘅意思。"
          note: |-
            **揀啱補救方法。** 呢句係請對方解釋，淨係重複原句未必解決問題。你可以指出邊個字唔明。

            **試吓。** 邊部分係你嘅意思？答案：`قَصْدَكْ`。學呢個表達時，將成個字一齊記。
    - subskill_id: rephrasing
      explanation: 訂位解釋可能太複雜。換個講法係保留實際意思，簡單交代主要要求，唔係加一項新指示。
      examples:
        - text: بِكَلَامْ أَبْسَطْ، لَازِمْ نِحْجِزْ مِنْ قَبْلْ.
          meaning: "**例句。** 簡單啲講，我哋要預先預約。 `بِكَلَامْ أَبْسَطْ` 係用更簡單說話。`لَازِمْ` 表示需要，`نِحْجِزْ` 係我哋訂位，`مِنْ
            قَبْلْ` 呢度係預先。`لَازِمْ` 後面訂位動作冇一般 b 前綴。"
          note: 我需要訂位用 `لَازِمْ أَحْجِزْ مِنْ قَبْلْ`。重述應該保留原本要求，唔好無聲無息改日子或者對象。試下改成自己嘅要求：`بِكَلَامْ أَبْسَطْ،
            لَازِمْ أَحْجِزْ مِنْ قَبْلْ`，用我嘅形式。
    - subskill_id: correcting_misunderstanding
      explanation: 聽者以為你講今日，但你意思係聽日。更正先講清楚自己想講嘅資訊，再排除聽錯嗰個版本。
      examples:
        - text: قَصْدِي بُكْرَا، مِشْ الْيَوْمْ.
          meaning: "**例句。** 我意思係聽日，唔係今日。 `قَصْدِي` 係我嘅意思，`بُكْرَا` 係聽日，`مِشْ الْيَوْمْ`
            係唔係今日。連住嘅「我嘅」後綴指出更正係關於自己原意。"
          note: 反方向用 `قَصْدِي الْيَوْمْ، مِشْ بُكْرَا`。否定詞後面放聽錯嘅資訊。試下將聽日更正成今日：`قَصْدِي الْيَوْمْ، مِشْ
            بُكْرَا`；先講正確日子，再排除錯嘅。
    - subskill_id: turns_topics
      explanation: 對話傾咗去其他事，但你想落實約會時間。問題之前先指出話題，聽者就容易跟到轉變。
      examples:
        - text: بِالنِّسْبِة لِلْمَوْعِدْ، نِلْتَقِي الصُّبْحْ؟
          meaning: "**例句。** 講返個約會，我哋朝早見好唔好？ `بِالنِّسْبِة لِلْمَوْعِدْ` 係關於約會，`نِلْتَقِي` 係我哋見面，`الصُّبْحْ`
            呢度係朝早。疑問語氣提出時間畀對方同意，開頭短語就引導話題轉換。"
          note: 建議傍晚可以用 `بِالْمَسَا`。試下問傍晚見面：`بِالنِّسْبِة لِلْمَوْعِدْ، نِلْتَقِي
            بِالْمَسَا؟`；保留話題短語，成個時間表達一齊換。
