variety_sections:
  arabic-levantine:
    - subskill_id: opening_closing
      explanation: 兩種變體都可以用慣常問候語開始交流。
      examples:
        - text: صَبَاحْ الْخَيْرْ!
          meaning: 早晨！
          note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。開場問候語唔帶正式格尾。
    - subskill_id: acknowledging
      explanation: 簡短回應可以表示明白咗訊息。
      examples:
        - text: طَيِّبْ، فِهِمْتْ.
          meaning: 好，我明白。
          note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。收到解釋唔一定等於同意。
    - subskill_id: clarification
      explanation: 有時啲字聽得清楚，但唔明對方想表達乜。`شُو قَصْدَكْ بِهَادْ؟` 請對方解釋頭先說話嘅意思。下面例句向一位男性問；平和語氣可以減少聽落似質問。
      examples:
        - text: شُو قَصْدَكْ بِهَادْ؟
          meaning: "**例句解說。** 「你咁講係乜嘢意思？」`شُو` 係乜嘢。`قَصْدَكْ` 用表示意圖或者意思嘅名詞，加表示你嘅後綴，呢度向男性問。`بِهَادْ`
            指返呢句或者嗰句說話。後綴指出係邊個嘅意思。"
          note: |-
            **揀啱補救方法。** 呢句係請對方解釋，淨係重複原句未必解決問題。你可以指出邊個字唔明。

            **試吓。** 邊部分係你嘅意思？答案：`قَصْدَكْ`。學呢個表達時，將成個字一齊記。
    - subskill_id: rephrasing
      explanation: 用簡單啲嘅講法重述，可以釐清原有指示。
      examples:
        - text: بِكَلَامْ أَبْسَطْ، لَازِمْ نِحْجِزْ مِنْ قَبْلْ.
          meaning: 簡單啲講，我哋要預先預約。
          note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。用嚟重述較複雜嘅預約解釋。
    - subskill_id: correcting_misunderstanding
      explanation: 可以用正確時間取代理解錯咗嘅時間。
      examples:
        - text: قَصْدِي بُكْرَا، مِشْ الْيَوْمْ.
          meaning: 我意思係聽日，唔係今日。
          note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。對方之前理解成今日。
    - subskill_id: turns_topics
      explanation: 話題標記可以引入相關嘅時間安排問題。
      examples:
        - text: بِالنِّسْبِة لِلْمَوْعِدْ، نِلْتَقِي الصُّبْحْ؟
          meaning: 講返個約會，我哋朝早見好唔好？
          note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。開頭短語將焦點轉到見面安排。
