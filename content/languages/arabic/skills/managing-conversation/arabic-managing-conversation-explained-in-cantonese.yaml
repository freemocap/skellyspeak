sections:
  - subskill_id: opening_closing
    explanation: 朝早見到人，可以用一句慣用問候開始對話。回覆亦有自己嘅慣用講法，唔使逐字重複對方。
    examples:
      - text: صَبَاحُ الْخَيْرِ!
        meaning: "**例句。** 早晨！ `صَبَاحُ` 係早晨，`الْخَيْرِ` 係好、善，合埋係慣用嘅早晨問候。成個短語一齊學，唔使將其他語言每一個字都逐個譯返。"
        note: 慣用回覆係 `صَبَاحُ النُّورِ`，字面係光嘅早晨。晚間問候用 `مَسَاءُ الْخَيْرِ`。試下晚間同人打招呼：答案係 `مَسَاءُ
          الْخَيْرِ`，換咗時段名詞，保留問候格式。
  - subskill_id: acknowledging
    explanation: 人哋解釋完點做，你可以話畀佢知自己明白咗。聽明唔一定等於贊成個計劃。
    examples:
      - text: حَسَنًا، فَهِمْتُ.
        meaning: "**例句。** 好，我明白。 `حَسَنًا` 係好、好啦，`فَهِمْتُ` 係我明白咗。過去形式表示已達到理解，所以喺回應度自然相當於「我明白」。詞尾指出講者。"
        note: 代表一班人可以講 `حَسَنًا، فَهِمْنَا`，即「好，我哋明白咗」。如果聽明但唔贊成，就要分開講。試下代表大家回應：答案係 `حَسَنًا،
          فَهِمْنَا`，詞尾由我改成我哋。
  - subskill_id: clarification
    explanation: 聽到一句說話，唔代表明白講者想表達乜。`مَاذَا تَقْصِدُ بِهٰذَا؟` 請對方解釋意思。下面例句向一位男性問，指返佢頭先講嘅說話。
    examples:
      - text: مَاذَا تَقْصِدُ بِهٰذَا؟
        meaning: "**例句解說。** 「你咁講係乜嘢意思？」`مَاذَا` 問乜嘢，`تَقْصِدُ` 喺呢度係你意指。`بِهٰذَا` 將附加介詞 `بِـ` 同
          `هٰذَا`（呢個）連埋，指返頭先講嘅說話。"
        note: |-
          **轉聽者。** 向一位女性問，用 `مَاذَا تَقْصِدِينَ بِهٰذَا؟`。動詞變化指出你問邊個。

          **試吓。** 邊部分指返想請對方解釋嘅說話？答案：`بِهٰذَا`。
  - subskill_id: rephrasing
    explanation: 訂位解釋可能太複雜。換個講法係保留實際意思，簡單交代主要要求，唔係加一項新指示。
    examples:
      - text: بِعِبَارَةٍ أَبْسَطَ، يَجِبُ أَنْ نَحْجِزَ مُسْبَقًا.
        meaning: "**例句。** 簡單啲講，我哋要預先預約。 `بِعِبَارَةٍ أَبْسَطَ` 係用更簡單講法。`يَجِبُ أَنْ` 帶出要求；`نَحْجِزَ` 係
          `أَنْ` 後面嘅「我哋訂位」形式，`مُسْبَقًا` 係預先。開頭話畀聽者知呢句係重述。"
        note: 自己一個訂位用 `يَجِبُ أَنْ أَحْجِزَ مُسْبَقًا`。人稱喺訂位動詞上面。試下重述自己嘅要求：`بِعِبَارَةٍ أَبْسَطَ، يَجِبُ
          أَنْ أَحْجِزَ مُسْبَقًا`；我哋改成我，要求保留。
  - subskill_id: correcting_misunderstanding
    explanation: 聽者以為你講今日，但你意思係聽日。更正先講清楚自己想講嘅資訊，再排除聽錯嗰個版本。
    examples:
      - text: أَقْصِدُ غَدًا، وَلَيْسَ الْيَوْمَ.
        meaning: "**例句。** 我意思係聽日，唔係今日。 `أَقْصِدُ` 係我意思係，`غَدًا` 係聽日，`وَلَيْسَ الْيَوْمَ`
          係而唔係今日。兩個時間詞令更正具體，聽者知道要換邊項資訊。"
        note: 反方向更正可以講 `أَقْصِدُ الْيَوْمَ، وَلَيْسَ
          غَدًا`。改一項細節唔等於否定成個約會。試下：對方聽咗聽日，但你係講今日，點答？用呢句調轉嘅句子，正確時間放先。
  - subskill_id: turns_topics
    explanation: 對話傾咗去其他事，但你想落實約會時間。問題之前先指出話題，聽者就容易跟到轉變。
    examples:
      - text: بِخُصُوصِ الْمَوْعِدِ، هَلْ نَلْتَقِي صَبَاحًا؟
        meaning: "**例句。** 講返個約會，我哋朝早見好唔好？ `بِخُصُوصِ الْمَوْعِدِ` 係關於約會。`هَلْ` 帶出係或唔係嘅問題，`نَلْتَقِي`
          係我哋見面，`صَبَاحًا` 係朝早。話題短語設定問題範圍，唔係答案。"
        note: 傍晚用 `مَسَاءً`。試下轉返約會話題並建議傍晚：`بِخُصُوصِ الْمَوْعِدِ، هَلْ نَلْتَقِي مَسَاءً؟`；話題同共同動作保留，只改提議時間。
