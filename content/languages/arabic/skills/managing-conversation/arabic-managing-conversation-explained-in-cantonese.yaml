sections:
  - subskill_id: opening_closing
    explanation: 兩種變體都可以用慣常問候語開始交流。
    examples:
      - text: صَبَاحُ الْخَيْرِ!
        meaning: 早晨！
        note: 現代標準阿拉伯語。呢句用嚟開場；同組黎凡特形式唔帶正式格尾。
  - subskill_id: acknowledging
    explanation: 簡短回應可以表示明白咗訊息。
    examples:
      - text: حَسَنًا، فَهِمْتُ.
        meaning: 好，我明白。
        note: 現代標準阿拉伯語。收到解釋唔一定等於同意。
  - subskill_id: clarification
    explanation: 聽到一句說話，唔代表明白講者想表達乜。`مَاذَا تَقْصِدُ بِهٰذَا؟` 請對方解釋意思。下面例句向一位男性問，指返佢頭先講嘅說話。
    examples:
      - text: مَاذَا تَقْصِدُ بِهٰذَا؟
        meaning: "**例句解說。** 「你咁講係乜嘢意思？」`مَاذَا` 問乜嘢，`تَقْصِدُ` 喺呢度係你意指。`بِهٰذَا` 將附加介詞 `بِـ` 同
          `هٰذَا`（呢個）連埋，指返頭先講嘅說話。"
        note: |-
          **轉聽者。** 向一位女性問，用 `مَاذَا تَقْصِدِينَ بِهٰذَا؟`。動詞變化指出你問邊個。

          **試吓。** 邊部分指返想請對方解釋嘅說話？答案：`بِهٰذَا`。
  - subskill_id: rephrasing
    explanation: 用簡單啲嘅講法重述，可以釐清原有指示。
    examples:
      - text: بِعِبَارَةٍ أَبْسَطَ، يَجِبُ أَنْ نَحْجِزَ مُسْبَقًا.
        meaning: 簡單啲講，我哋要預先預約。
        note: 現代標準阿拉伯語。用嚟重述較複雜嘅預約解釋。
  - subskill_id: correcting_misunderstanding
    explanation: 可以用正確時間取代理解錯咗嘅時間。
    examples:
      - text: أَقْصِدُ غَدًا، وَلَيْسَ الْيَوْمَ.
        meaning: 我意思係聽日，唔係今日。
        note: 現代標準阿拉伯語。對方之前理解成今日。
  - subskill_id: turns_topics
    explanation: 話題標記可以引入相關嘅時間安排問題。
    examples:
      - text: بِخُصُوصِ الْمَوْعِدِ، هَلْ نَلْتَقِي صَبَاحًا؟
        meaning: 講返個約會，我哋朝早見好唔好？
        note: 現代標準阿拉伯語。開頭短語將焦點轉到見面安排。
