variety_sections:
  arabic-levantine:
    - subskill_id: opening_closing
      explanation: تمنحك التحية الصباحية طريقة بسيطة لبدء الحديث مع شخص تلقاه. قد يستعمل الرد عبارةً
        مألوفة مختلفة؛ فلا يلزم أن يكرر التحية حرفيًا.
      examples:
        - text: صَبَاحْ الْخَيْرْ!
          meaning: "**المثال.** صباح الخير! تعني `صَبَاحْ` الصباح و`الْخَيْرْ` الخير. العبارة كلها تحية «صباح
            الخير» لبدء حديث منطوق؛ وليست تقريرًا عما حدث هذا الصباح."
          note: "من الردود المألوفة `صَبَاحْ النُّورْ`، أي حرفيًا «صباح النور». والتحية المسائية هي `مَسَا
            الْخَيْرْ`. **جرّب:** رد على التحية الصباحية. الإجابة: `صَبَاحْ النُّورْ`؛ تقر بالتحية
            بردها المألوف."
    - subskill_id: acknowledging
      explanation: بعد أن يشرح شخص طريقة عمل مهمة، يمكنك إبلاغه بأن الشرح وصل إليك. لا تعني عبارة الفهم
        بالضرورة أنك توافق على الخطة.
      examples:
        - text: طَيِّبْ، فِهِمْتْ.
          meaning: "**المثال.** حسنًا، فهمت. تعني `طَيِّبْ` «حسنًا» في هذا الرد؛ وتعني `فِهِمْتْ` «فهمت». يكفي
            الرد القصير لإظهار أن الشرح صار واضحًا. تركز صيغة الماضي على بلوغ الفهم، لا على سرد حدث
            سابق طويل."
          note: "تعطي `طَيِّبْ، فِهِمْنَا` الرد بصيغة «نحن». استعمل تعبير موافقة منفصلًا إذا أردت قبول
            الاقتراح أيضًا. **جرّب:** أقرّ بالفهم عن شخصين أو أكثر. الإجابة: `طَيِّبْ، فِهِمْنَا`؛
            توضح نهاية المتكلمين أن المجموعة هي التي فهمت."
    - subskill_id: clarification
      explanation: قد تكون الكلمات واضحة لكن المقصود غير واضح. تطلب `شُو قَصْدَكْ بِهَادْ؟` من الطرف الآخر
        شرح ما يعنيه بما قاله للتو. يخاطب المثال رجلًا واحدًا. وتساعد النبرة الهادئة على تمييز الطلب
        من الاعتراض.
      examples:
        - text: شُو قَصْدَكْ بِهَادْ؟
          meaning: "**المثال.** ماذا تقصد بهذا؟ تعني `شُو` «ماذا». تستعمل `قَصْدَكْ` اسمًا للقصد أو المعنى مع
            لاحقة «ك»، هنا لمخاطبة رجل. وتعود `بِهَادْ` إلى هذا التعبير أو ذاك. تحدد اللاحقة صاحب
            القصد الذي تسأل عنه."
          note: >-
            **اختر طريقة إصلاح الفهم.** يطلب هذا السؤال تفسيرًا؛ فقد لا يحل تكرار الكلمات نفسها
            المشكلة. ويمكنك الإشارة إلى الكلمة المحددة التي لم تفهمها.


            **جرّب.** حدد الجزء الذي يعني «قصدك». الإجابة: `قَصْدَكْ`. تعلّم هذه الكلمة كاملةً ضمن
            العبارة.
    - subskill_id: rephrasing
      explanation: قد يكون شرح الحجز معقدًا. تحتفظ إعادة الصياغة بمعناه العملي لكنها تعرض المتطلب الأساسي
        ببساطة أكبر بدل إضافة توجيه مختلف.
      examples:
        - text: بِكَلَامْ أَبْسَطْ، لَازِمْ نِحْجِزْ مِنْ قَبْلْ.
          meaning: "**المثال.** بكلام أبسط، يلزم أن نحجز مسبقًا. تعني `بِكَلَامْ أَبْسَطْ` «بكلام أبسط». تعبّر
            `لَازِمْ` عن الضرورة؛ وتعني `نِحْجِزْ` «نحجز»، وتفيد `مِنْ قَبْلْ` معنى «مسبقًا» هنا. لا
            يأخذ فعل الحجز بعد `لَازِمْ` باء المضارع المعتادة."
          note: "للتعبير عن حاجتي إلى الحجز، استعمل `لَازِمْ أَحْجِزْ مِنْ قَبْلْ`. ينبغي لإعادة الصياغة حفظ
            الإلزام السابق لا تغيير يومه أو شخصه خفيةً. **جرّب:** قل الإلزام نفسه لنفسك. الإجابة:
            `بِكَلَامْ أَبْسَطْ، لَازِمْ أَحْجِزْ مِنْ قَبْلْ`؛ صيغة المتكلم الجديدة صريحة."
    - subskill_id: correcting_misunderstanding
      explanation: سمع المستمع «اليوم» لكنك قصدت «غدًا». يسمّي التصحيح المعلومة المقصودة أولًا ويستبعد
        الصيغة الخاطئة صراحةً.
      examples:
        - text: قَصْدِي بُكْرَا، مِشْ الْيَوْمْ.
          meaning: "**المثال.** أقصد غدًا لا اليوم. تعني `قَصْدِي` قصدي أو ما أعنيه. `بُكْرَا` غدًا؛ وتعني
            `مِشْ الْيَوْمْ` «ليس اليوم». تجعل لاحقة المتكلم التصحيح متعلقًا برسالتك المقصودة."
          note: "للتصحيح المعاكس قل `قَصْدِي الْيَوْمْ، مِشْ بُكْرَا`. أبقِ المعلومة المستبعدة بعد أداة النفي.
            **جرّب:** صحّح «غدًا» إلى «اليوم». الإجابة: `قَصْدِي الْيَوْمْ، مِشْ بُكْرَا`؛ يأتي
            اليوم المقصود قبل المستبعد."
    - subskill_id: turns_topics
      explanation: انتقلت المحادثة عن موعد، وتحتاج إلى حسم وقته. تساعد تسمية الموضوع قبل السؤال المستمع
        على متابعة الانتقال.
      examples:
        - text: بِالنِّسْبِة لِلْمَوْعِدْ، نِلْتَقِي الصُّبْحْ؟
          meaning: "**المثال.** بخصوص الموعد، هل نلتقي صباحًا؟ تعني `بِالنِّسْبِة لِلْمَوْعِدْ` «بخصوص
            الموعد». `نِلْتَقِي` هي «نلتقي»، وتعني `الصُّبْحْ` «صباحًا» هنا. تعرض نبرة السؤال موعد
            اللقاء للموافقة، بينما توجه العبارة الأولى الانتقال بين الموضوعات."
          note: "لاقتراح المساء استبدل عبارة الوقت بـ`بِالْمَسَا`. **جرّب:** اسأل عن اللقاء مساءً. الإجابة:
            `بِالنِّسْبِة لِلْمَوْعِدْ، نِلْتَقِي بِالْمَسَا؟`؛ أبقِ عبارة الموضوع وغيّر تعبير الوقت
            كاملًا."
