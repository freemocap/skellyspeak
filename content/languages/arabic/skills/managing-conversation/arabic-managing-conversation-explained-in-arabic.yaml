sections:
  - subskill_id: opening_closing
    explanation: تمنحك التحية الصباحية طريقة بسيطة لبدء الحديث مع شخص تلقاه. قد يستعمل الرد عبارةً
      مألوفة مختلفة؛ فلا يلزم أن يكرر التحية حرفيًا.
    examples:
      - text: صَبَاحُ الْخَيْرِ!
        meaning: "**المثال.** صباح الخير! تعني `صَبَاحُ` الصباح و`الْخَيْرِ` الخير. تشكلان معًا تحية «صباح
          الخير» المعتادة. تعلّم العبارة تحيةً، بدل محاولة ترجمة كل كلمة إنجليزية إلى كلمة عربية
          منفصلة."
        note: "من الردود المألوفة `صَبَاحُ النُّورِ`، أي حرفيًا «صباح النور». وللتحية المسائية استعمل
          `مَسَاءُ الْخَيْرِ`. **جرّب:** حيّ شخصًا مساءً. الإجابة: `مَسَاءُ الْخَيْرِ`؛ يتغير اسم
          وقت اليوم ويبقى نمط التحية."
  - subskill_id: acknowledging
    explanation: بعد أن يشرح شخص طريقة عمل مهمة، يمكنك إبلاغه بأن الشرح وصل إليك. لا تعني عبارة الفهم
      بالضرورة أنك توافق على الخطة.
    examples:
      - text: حَسَنًا، فَهِمْتُ.
        meaning: "**المثال.** حسنًا، فهمت. تعني `حَسَنًا` «حسنًا»، وتعني `فَهِمْتُ` «فهمت». تعرض صيغة الماضي
          تحقق الفهم، فتؤدي معنى «أفهم الآن» طبيعيًا في هذا الرد. وتحدد نهايتها المتحدث."
        note: "للمجموعة تقول `حَسَنًا، فَهِمْنَا` إننا فهمنا. ميّز بين الفهم والتصريح بالموافقة عندما
          يختلفان. **جرّب:** أقرّ بالفهم باسم مجموعتك. الإجابة: `حَسَنًا، فَهِمْنَا`؛ تتغير النهاية
          من «أنا» إلى «نحن»."
  - subskill_id: clarification
    explanation: سماع جملة لا يعني دائمًا فهم قصد المتحدث. تطلب `مَاذَا تَقْصِدُ بِهٰذَا؟` من الطرف
      الآخر توضيح ما يعنيه. يخاطب المثال رجلًا واحدًا ويعود إلى ما قاله للتو.
    examples:
      - text: مَاذَا تَقْصِدُ بِهٰذَا؟
        meaning: "**المثال.** ماذا تقصد بهذا؟ تسأل `مَاذَا` «ماذا»؛ وتعني `تَقْصِدُ` «تقصد» هنا. تجمع
          `بِهٰذَا` حرف الجر المتصل `بِـ`، أي «بـ»، و`هٰذَا` الذي يشير إلى ما قيل."
        note: >-
          **غيّر المخاطَب.** لمخاطبة امرأة واحدة استعمل `مَاذَا تَقْصِدِينَ بِهٰذَا؟`. يقع التغيير
          في الفعل ويحدد من تسأله.


          **جرّب.** أي جزء يحدد التعبير الذي تريد شرحه؟ الإجابة: `بِهٰذَا`.
  - subskill_id: rephrasing
    explanation: قد يكون شرح الحجز معقدًا. تحتفظ إعادة الصياغة بمعناه العملي لكنها تعرض المتطلب الأساسي
      ببساطة أكبر بدل إضافة توجيه مختلف.
    examples:
      - text: بِعِبَارَةٍ أَبْسَطَ، يَجِبُ أَنْ نَحْجِزَ مُسْبَقًا.
        meaning: "**المثال.** بعبارة أبسط، يجب أن نحجز مسبقًا. تعني `بِعِبَارَةٍ أَبْسَطَ` «بعبارة أبسط».
          تقدّم `يَجِبُ أَنْ` الإلزام؛ وتعني `نَحْجِزَ` «نحجز» بصيغتها بعد `أَنْ`. وتعني `مُسْبَقًا`
          «مسبقًا». تخبر البداية المستمع أن الجملة إعادة صياغة."
        note: "لحجزي أنا استعمل `يَجِبُ أَنْ أَحْجِزَ مُسْبَقًا`. تظهر علامة الشخص على فعل الحجز. **جرّب:**
          أعد ذكر الإلزام لنفسك وحدك. الإجابة: `بِعِبَارَةٍ أَبْسَطَ، يَجِبُ أَنْ أَحْجِزَ
          مُسْبَقًا`؛ غيّر «نحن» إلى «أنا» مع إبقاء الإلزام."
  - subskill_id: correcting_misunderstanding
    explanation: سمع المستمع «اليوم» لكنك قصدت «غدًا». يسمّي التصحيح المعلومة المقصودة أولًا ويستبعد
      الصيغة الخاطئة صراحةً.
    examples:
      - text: أَقْصِدُ غَدًا، وَلَيْسَ الْيَوْمَ.
        meaning: "**المثال.** أقصد غدًا لا اليوم. تعني `أَقْصِدُ` «أعني» أو «أنوي». `غَدًا` هو الغد؛ وتعني
          `وَلَيْسَ الْيَوْمَ` «وليس اليوم». يجعل تعبِيرا الوقت التصحيح محددًا، فيعرف المستمع بالضبط
          ما يجب استبداله."
        note: "اعكس اليومين للتصحيح المعاكس: `أَقْصِدُ الْيَوْمَ، وَلَيْسَ غَدًا`. يختلف تصحيح تفصيل عن
          إلغاء اللقاء كله. **جرّب:** صحّح من سمع «غدًا» وأنت تقصد «اليوم». الإجابة: استعمل الجملة
          المعكوسة؛ فالوقت المقصود يأتي أولًا."
  - subskill_id: turns_topics
    explanation: انتقلت المحادثة عن موعد، وتحتاج إلى حسم وقته. تساعد تسمية الموضوع قبل السؤال المستمع
      على متابعة الانتقال.
    examples:
      - text: بِخُصُوصِ الْمَوْعِدِ، هَلْ نَلْتَقِي صَبَاحًا؟
        meaning: "**المثال.** بخصوص الموعد، هل نلتقي صباحًا؟ تعني `بِخُصُوصِ الْمَوْعِدِ` «بخصوص الموعد».
          تقدّم `هَلْ` سؤال نعم أو لا؛ وتعني `نَلْتَقِي` «نلتقي»، و`صَبَاحًا` «صباحًا». تؤطر عبارة
          الموضوع السؤال ولا تجيب عنه."
        note: "استعمل `مَسَاءً` للمساء. **جرّب:** عُد إلى موضوع الموعد واقترح المساء. الإجابة: `بِخُصُوصِ
          الْمَوْعِدِ، هَلْ نَلْتَقِي مَسَاءً؟`؛ يبقى الموضوع والفعل المشترك، ويتغير الوقت المقترح."
