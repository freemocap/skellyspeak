variety_sections:
  arabic-levantine:
    - subskill_id: opening_closing
      explanation: Uma saudação matinal permite iniciar a conversa. A resposta pode usar outra expressão
        convencional, sem repetir exatamente as mesmas palavras.
      examples:
        - text: صَبَاحْ الْخَيْرْ!
          meaning: "**O exemplo.** Bom dia! `صَبَاحْ` significa manhã, e `الْخَيْرْ` significa bondade. A expressão
            inteira é uma saudação matinal que abre a conversa. Ela não relata algo que aconteceu de manhã."
          note: "Uma resposta comum é `صَبَاحْ النُّورْ`, literalmente « manhã de luz ». À noite, usa-se `مَسَا
            الْخَيْرْ`. Experimente responder à saudação da manhã. Resposta: `صَبَاحْ النُّورْ`; você
            reconhece o cumprimento com sua resposta convencional."
    - subskill_id: acknowledging
      explanation: Depois que alguém explica uma tarefa, você pode mostrar que a explicação foi entendida.
        Compreender não implica necessariamente aceitar o plano.
      examples:
        - text: طَيِّبْ، فِهِمْتْ.
          meaning: "**O exemplo.** Certo, entendi. `طَيِّبْ` significa certo nessa resposta; `فِهِمْتْ` significa eu
            entendi. Uma resposta curta basta para mostrar que a explicação agora está clara. A forma passada
            se concentra em alcançar a compreensão, não em narrar um acontecimento anterior longo."
          note: "`طَيِّبْ، فِهِمْنَا` dá a resposta para « nós ». Use outra expressão de concordância se também quiser
            aceitar a proposta. Experimente responder por duas ou mais pessoas. Resposta: `طَيِّبْ،
            فِهِمْنَا`; a terminação plural torna o grupo explícito."
    - subskill_id: clarification
      explanation: Às vezes as palavras são claras, mas a intenção não. `شُو قَصْدَكْ بِهَادْ؟` pede que a outra
        pessoa explique o que quis dizer há pouco. O exemplo se dirige a um homem. Um tom calmo ajuda a
        distinguir o pedido de uma contestação.
      examples:
        - text: شُو قَصْدَكْ بِهَادْ؟
          meaning: "**O exemplo.** O que você quer dizer com isso? `شُو` significa o quê. `قَصْدَكْ` combina um nome de
            intenção ou significado com o sufixo « seu », dirigido aqui a um homem. `بِهَادْ` retoma esta
            expressão. O sufixo indica de quem é a intenção."
          note: >-
            **Escolha o reparo.** Esta frase pede explicação, portanto repetir as mesmas palavras talvez não
            resolva a dúvida. Você pode apontar para a palavra específica que não entendeu.


            **Experimente.** Qual parte significa « sua intenção »? Resposta: `قَصْدَكْ`. Aprenda essa palavra
            inteira como parte da expressão.
    - subskill_id: rephrasing
      explanation: Uma explicação sobre reserva pode estar complicada. A reformulação mantém o sentido prático e
        apresenta a exigência principal com mais simplicidade, sem mudar a instrução.
      examples:
        - text: بِكَلَامْ أَبْسَطْ، لَازِمْ نِحْجِزْ مِنْ قَبْلْ.
          meaning: "**O exemplo.** Em termos mais simples, precisamos reservar antes. `بِكَلَامْ أَبْسَطْ` significa em
            palavras mais simples. `لَازِمْ` expressa necessidade; `نِحْجِزْ` significa nós reservamos, e
            `مِنْ قَبْلْ` indica antecipadamente aqui. A ação depois de `لَازِمْ` não tem o prefixo b- comum."
          note: "Para dizer que eu preciso reservar, use `لَازِمْ أَحْجِزْ مِنْ قَبْلْ`. Uma reformulação deve preservar
            a exigência anterior, sem mudar discretamente a data ou a pessoa. Experimente formular a mesma
            necessidade para você. Resposta: `بِكَلَامْ أَبْسَطْ، لَازِمْ أَحْجِزْ مِنْ قَبْلْ`; a nova forma
            de « eu » fica explícita."
    - subskill_id: correcting_misunderstanding
      explanation: A pessoa ouviu hoje, mas você quis dizer amanhã. Uma correção nomeia primeiro o dia pretendido e
        exclui o que foi entendido por engano.
      examples:
        - text: قَصْدِي بُكْرَا، مِشْ الْيَوْمْ.
          meaning: "**O exemplo.** Quero dizer amanhã, não hoje. `قَصْدِي` significa minha intenção ou o que eu quero
            dizer. `بُكْرَا` é amanhã; `مِشْ الْيَوْمْ` significa não hoje. O sufixo ligado de « meu »
            relaciona a correção à sua mensagem pretendida."
          note: "Para corrigir no sentido oposto, diga `قَصْدِي الْيَوْمْ، مِشْ بُكْرَا`. Ponha a informação rejeitada
            depois da palavra negativa. Experimente corrigir amanhã para hoje. Resposta: `قَصْدِي الْيَوْمْ،
            مِشْ بُكْرَا`; o dia pretendido vem antes do rejeitado."
    - subskill_id: turns_topics
      explanation: A conversa se afastou de um compromisso, e você precisa acertar sua hora. Nomear o assunto antes
        da pergunta ajuda a outra pessoa a acompanhar a mudança.
      examples:
        - text: بِالنِّسْبِة لِلْمَوْعِدْ، نِلْتَقِي الصُّبْحْ؟
          meaning: "**O exemplo.** Sobre o compromisso, vamos nos encontrar de manhã? `بِالنِّسْبِة لِلْمَوْعِدْ`
            significa a respeito do compromisso. `نِلْتَقِي` é nós nos encontramos, e `الصُّبْحْ` indica de
            manhã aqui. O tom interrogativo apresenta a hora para acordo; a abertura orienta a mudança de
            assunto."
          note: "Para propor à noite, troque a expressão temporal por `بِالْمَسَا`. Experimente perguntar se o encontro
            pode ser à noite. Resposta: `بِالنِّسْبِة لِلْمَوْعِدْ، نِلْتَقِي بِالْمَسَا؟`; mantenha o assunto
            e mude toda a expressão de tempo."
