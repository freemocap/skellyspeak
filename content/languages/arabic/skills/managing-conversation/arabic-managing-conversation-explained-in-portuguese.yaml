sections:
  - subskill_id: opening_closing
    explanation: Uma saudação matinal é uma maneira simples de iniciar uma conversa. A resposta pode empregar
      outra expressão convencional; não precisa repetir a saudação palavra por palavra.
    examples:
      - text: صَبَاحُ الْخَيْرِ!
        meaning: "**O exemplo.** Bom dia! `صَبَاحُ` significa manhã e `الْخَيْرِ` significa bondade. Juntas, as
          palavras formam a saudação convencional « bom dia ». Aprenda a frase como saudação, sem tentar dar a
          cada palavra portuguesa uma palavra árabe separada."
        note: "Uma resposta convencional é `صَبَاحُ النُّورِ`, literalmente « manhã de luz ». Para saudar à noite, use
          `مَسَاءُ الْخَيْرِ`. Experimente cumprimentar alguém à noite. Resposta: `مَسَاءُ الْخَيْرِ`; a
          palavra do período muda e a estrutura de saudação permanece."
  - subskill_id: acknowledging
    explanation: Depois que alguém explica uma tarefa, você pode demonstrar que entendeu. Dizer que compreendeu
      não implica necessariamente concordar com o plano.
    examples:
      - text: حَسَنًا، فَهِمْتُ.
        meaning: "**O exemplo.** Certo, entendi. `حَسَنًا` significa certo ou está bem; `فَهِمْتُ` significa eu
          entendi. A forma passada apresenta a compreensão como alcançada e funciona naturalmente como «
          entendo » nessa resposta. A terminação identifica quem fala."
        note: "Para um grupo, `حَسَنًا، فَهِمْنَا` significa « certo, entendemos ». Diferencie compreensão de
          concordância quando não são a mesma coisa. Experimente reconhecer a explicação pelo grupo. Resposta:
          `حَسَنًا، فَهِمْنَا`; a terminação passa de « eu » para « nós »."
  - subskill_id: clarification
    explanation: Ouvir uma frase nem sempre significa compreender a intenção de quem fala. `مَاذَا تَقْصِدُ
      بِهٰذَا؟` pede que a pessoa explique o que quis dizer. O exemplo fala com um homem e retoma algo que ele
      acabou de dizer.
    examples:
      - text: مَاذَا تَقْصِدُ بِهٰذَا؟
        meaning: "**O exemplo.** O que você quer dizer com isso? `مَاذَا` pergunta « o quê »; `تَقْصِدُ` significa
          você pretende ou quer dizer. `بِهٰذَا` combina a preposição ligada `بِـ`, por ou com, com `هٰذَا`,
          isto, retomando o que foi dito."
        note: >-
          **Mude o interlocutor.** Para falar com uma mulher, use `مَاذَا تَقْصِدِينَ بِهٰذَا؟`. A mudança
          está no verbo e indica a quem você pergunta.


          **Experimente.** Que parte identifica a expressão a ser explicada? Resposta: `بِهٰذَا`.
  - subskill_id: rephrasing
    explanation: Uma explicação sobre reserva pode ser complicada. Reformular conserva seu sentido prático, mas
      enuncia a exigência principal de maneira mais simples, sem acrescentar outra instrução.
    examples:
      - text: بِعِبَارَةٍ أَبْسَطَ، يَجِبُ أَنْ نَحْجِزَ مُسْبَقًا.
        meaning: "**O exemplo.** Em termos mais simples, precisamos reservar antecipadamente. `بِعِبَارَةٍ أَبْسَطَ`
          significa com uma expressão mais simples. `يَجِبُ أَنْ` introduz uma obrigação; `نَحْجِزَ` significa
          nós reservamos na forma que segue `أَنْ`. `مُسْبَقًا` significa antecipadamente. A abertura avisa
          que se trata de uma reformulação."
        note: "Para minha própria reserva, use `يَجِبُ أَنْ أَحْجِزَ مُسْبَقًا`. A marca de pessoa está no verbo
          reservar. Experimente formular a exigência apenas para você. Resposta: `بِعِبَارَةٍ أَبْسَطَ، يَجِبُ
          أَنْ أَحْجِزَ مُسْبَقًا`; passe de nós para eu e mantenha a obrigação."
  - subskill_id: correcting_misunderstanding
    explanation: A outra pessoa ouviu hoje, mas você queria dizer amanhã. Uma correção nomeia primeiro a
      informação pretendida e exclui expressamente a versão errada.
    examples:
      - text: أَقْصِدُ غَدًا، وَلَيْسَ الْيَوْمَ.
        meaning: "**O exemplo.** Quero dizer amanhã, não hoje. `أَقْصِدُ` significa quero dizer ou pretendo. `غَدًا` é
          amanhã; `وَلَيْسَ الْيَوْمَ` significa e não hoje. As duas expressões temporais tornam a correção
          específica, mostrando exatamente o que substituir."
        note: "Inverta os dias para a correção oposta: `أَقْصِدُ الْيَوْمَ، وَلَيْسَ غَدًا`. Corrigir um detalhe não é
          rejeitar todo o encontro. Experimente corrigir alguém que ouviu amanhã quando você queria dizer
          hoje. Resposta: use essa frase invertida; o dia pretendido vem primeiro."
  - subskill_id: turns_topics
    explanation: A conversa se afastou de um compromisso, e você precisa acertar a hora. Nomear o tópico antes da
      pergunta ajuda a outra pessoa a acompanhar a mudança.
    examples:
      - text: بِخُصُوصِ الْمَوْعِدِ، هَلْ نَلْتَقِي صَبَاحًا؟
        meaning: "**O exemplo.** Sobre o compromisso, podemos nos encontrar de manhã? `بِخُصُوصِ الْمَوْعِدِ`
          significa a respeito do compromisso. `هَلْ` introduz pergunta de sim ou não; `نَلْتَقِي` significa
          nós nos encontramos e `صَبَاحًا` significa de manhã. A expressão inicial apresenta o tema, não
          responde à pergunta."
        note: "Use `مَسَاءً` para de noite. Experimente retomar o compromisso e propor a noite. Resposta: `بِخُصُوصِ
          الْمَوْعِدِ، هَلْ نَلْتَقِي مَسَاءً؟`; o tema e a ação conjunta permanecem, enquanto o período
          proposto muda."
