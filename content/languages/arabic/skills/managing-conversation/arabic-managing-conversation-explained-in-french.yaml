sections:
  - subskill_id: opening_closing
    explanation: Une salutation du matin permet d’ouvrir simplement un échange avec une personne rencontrée. La
      réponse peut employer une autre formule conventionnelle ; elle n’a pas besoin de répéter mot pour mot la
      salutation.
    examples:
      - text: صَبَاحُ الْخَيْرِ!
        meaning: "**L’exemple.** Bonjour ! `صَبَاحُ` signifie « matin » et `الْخَيْرِ` évoque le bien. Ensemble, ils
          forment une salutation conventionnelle du matin. Apprenez l’expression comme formule de salutation,
          sans chercher un mot arabe distinct pour chaque mot de la traduction française."
        note: "Une réponse conventionnelle est `صَبَاحُ النُّورِ`, littéralement « matin de lumière ». Pour saluer le
          soir, employez `مَسَاءُ الْخَيْرِ`. Essayez : saluez quelqu’un le soir. Réponse : `مَسَاءُ
          الْخَيْرِ` ; le nom du moment de la journée change, mais la formule reste."
  - subskill_id: acknowledging
    explanation: Après une explication sur le fonctionnement d’une tâche, vous pouvez faire savoir que le message
      est compris. Dire que vous avez compris ne signifie pas nécessairement que vous approuvez le projet.
    examples:
      - text: حَسَنًا، فَهِمْتُ.
        meaning: "**L’exemple.** D’accord, j’ai compris. `حَسَنًا` signifie « bien » ou « d’accord » ; `فَهِمْتُ`
          signifie « j’ai compris ». Le passé présente la compréhension comme acquise, d’où sa valeur
          naturelle de « je comprends » dans cette réponse. Sa terminaison identifie la personne qui parle."
        note: "Pour un groupe, `حَسَنًا، فَهِمْنَا` dit que nous avons compris. Distinguez la compréhension d’une
          déclaration d’accord lorsque ces deux choses diffèrent. Essayez : confirmez la compréhension au nom
          du groupe. Réponse : `حَسَنًا، فَهِمْنَا` ; la terminaison passe de « je » à « nous »."
  - subskill_id: clarification
    explanation: Entendre une phrase ne signifie pas toujours comprendre l’intention de la personne qui parle.
      `مَاذَا تَقْصِدُ بِهٰذَا؟` lui demande d’expliquer ce qu’elle veut dire. L’exemple s’adresse à un homme
      et renvoie à une chose qu’il vient de dire.
    examples:
      - text: مَاذَا تَقْصِدُ بِهٰذَا؟
        meaning: "**L’exemple.** « Que veux-tu dire par là ? » `مَاذَا` demande quoi ; `تَقْصِدُ` signifie ici « tu
          veux dire ». `بِهٰذَا` réunit la préposition attachée `بِـ`, « par », et `هٰذَا`, « ceci », qui
          renvoie aux paroles précédentes."
        note: >-
          **Changez d’interlocutrice.** Pour vous adresser à une femme, employez `مَاذَا تَقْصِدِينَ
          بِهٰذَا؟`. Le changement porte sur le verbe et indique à qui s’adresse la question.


          **À vous.** Quelle partie désigne l’expression à expliquer ? Réponse : `بِهٰذَا`.
  - subskill_id: rephrasing
    explanation: Une explication sur la réservation peut être trop compliquée. La reformulation en garde le sens
      pratique, mais exprime plus simplement l’exigence principale, sans ajouter une consigne différente.
    examples:
      - text: بِعِبَارَةٍ أَبْسَطَ، يَجِبُ أَنْ نَحْجِزَ مُسْبَقًا.
        meaning: "**L’exemple.** Plus simplement, nous devons réserver à l’avance. `بِعِبَارَةٍ أَبْسَطَ` annonce une
          expression plus simple. `يَجِبُ أَنْ` introduit une obligation ; `نَحْجِزَ` signifie « nous
          réservons » sous la forme qui suit `أَنْ`. `مُسْبَقًا` signifie à l’avance. L’ouverture indique
          qu’il s’agit d’une reformulation."
        note: "Pour une réservation qui ne concerne que moi, employez `يَجِبُ أَنْ أَحْجِزَ مُسْبَقًا`. La marque de
          personne se trouve sur le verbe « réserver ». Essayez : reformulez l’obligation pour vous seul.
          Réponse : `بِعِبَارَةٍ أَبْسَطَ، يَجِبُ أَنْ أَحْجِزَ مُسْبَقًا` ; remplacez « nous » par « je » en
          gardant l’obligation."
  - subskill_id: correcting_misunderstanding
    explanation: L’autre personne a compris « aujourd’hui », alors que vous vouliez dire « demain ». Une
      correction nomme d’abord le moment voulu, puis écarte explicitement la version erronée.
    examples:
      - text: أَقْصِدُ غَدًا، وَلَيْسَ الْيَوْمَ.
        meaning: "**L’exemple.** Je veux dire demain, pas aujourd’hui. `أَقْصِدُ` exprime ce que je veux dire. `غَدًا`
          signifie demain ; `وَلَيْسَ الْيَوْمَ` signifie « et non aujourd’hui ». Les deux expressions de
          temps rendent la correction précise : l’autre personne sait quoi remplacer."
        note: "Inversez les jours pour la correction opposée : `أَقْصِدُ الْيَوْمَ، وَلَيْسَ غَدًا`. Corriger un
          détail n’équivaut pas à annuler toute la rencontre. Essayez : corrigez une personne qui a compris
          demain alors que vous vouliez dire aujourd’hui. Réponse : employez cette phrase inversée ; le moment
          voulu vient en premier."
  - subskill_id: turns_topics
    explanation: La conversation s’est éloignée d’un rendez-vous et vous devez en fixer l’heure. Nommer le sujet
      avant la question aide l’autre personne à suivre le changement.
    examples:
      - text: بِخُصُوصِ الْمَوْعِدِ، هَلْ نَلْتَقِي صَبَاحًا؟
        meaning: "**L’exemple.** À propos du rendez-vous, nous voyons-nous le matin ? `بِخُصُوصِ الْمَوْعِدِ` signifie
          « au sujet du rendez-vous ». `هَلْ` ouvre une question fermée ; `نَلْتَقِي` signifie « nous nous
          rencontrons » et `صَبَاحًا` « le matin ». L’expression initiale situe le sujet ; elle ne répond pas
          à la question."
        note: "Employez `مَسَاءً` pour le soir. Essayez : revenez au rendez-vous et proposez le soir. Réponse :
          `بِخُصُوصِ الْمَوْعِدِ، هَلْ نَلْتَقِي مَسَاءً؟` ; le sujet et l’action commune restent, seul le
          moment proposé change."
