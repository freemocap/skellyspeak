varieties:
  arabic-levantine:
    disposition: supplement
    text: Recognize conversational greeting, receipt and repair formulas such as طَيِّبْ and
      قَصْدِي. Regional wording differences are not themselves failed repair. Spelling and vowel
      choices represent spoken forms, not formal case inflection.
    provenance: *a1
  arabic-modern-standard:
    disposition: supplement
    text: Recognize formal greetings, clarification and restatement formulas. A successful brief
      acknowledgement need not be expanded into a formal full sentence.
    provenance: *a1
