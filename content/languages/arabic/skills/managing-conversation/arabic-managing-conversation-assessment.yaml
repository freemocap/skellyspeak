language: arabic
skill_id: managing_conversation
guidance: Assess opening or closing an exchange, acknowledging, asking for clarification,
  rephrasing, correcting misunderstanding, and managing turns or topics. A greeting can open
  contact. An acknowledgement may show receipt without agreement. A clarification question
  targets unclear wording or reference in the current exchange. Rephrasing makes an existing
  meaning clearer; correcting misunderstanding replaces an incorrect interpretation. A topic
  transition manages the conversation rather than merely mentioning a noun. A short conventional
  formula can work when its interactional purpose is clear. A copied greeting in a vocabulary
  list is absent. Do not invent a preceding misunderstanding to credit an isolated unrelated
  sentence. Evaluate conversational formulas and addressee forms within the selected variety
  without making Modern Standard prose the default measure of natural colloquial interaction.
