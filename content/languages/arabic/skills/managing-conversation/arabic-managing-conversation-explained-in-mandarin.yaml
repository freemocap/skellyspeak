variety_sections:
  arabic-levantine:
    - subskill_id: opening_closing
      explanation: 早晨问候是与你遇见的人开始交谈的一种简单方式。回应可以使用另一句惯用表达，不必逐字重复问候。
      examples:
        - text: صَبَاحْ الْخَيْرْ!
          meaning: "**例句。** 早上好！`صَبَاحْ` 是早晨，`الْخَيْرْ` 是美好。整句是开始口语交谈的早安问候，是惯用表达，并非报告今天早晨发生了什么。"
          note: 熟悉的回答是 `صَبَاحْ النُّورْ`，字面上是光明的早晨。傍晚问候可说 `مَسَا الْخَيْرْ`。试一试：回答早安问候。答案：`صَبَاحْ
            النُّورْ`；使用这句惯用回应表示收到问候。
    - subskill_id: acknowledging
      explanation: 有人解释一项任务怎样做，你可以让对方知道自己已经听懂。说自己明白了，并不一定表示赞同这个计划。
      examples:
        - text: طَيِّبْ، فِهِمْتْ.
          meaning: "**例句。** 好的，我明白了。`طَيِّبْ` 在这句答话里表示好的；`فِهِمْتْ`
            意为我理解了。简短回答就能表示解释现在已清楚。过去形式着重达到理解的时刻，而不是在讲述很久以前的一件事。"
          note: "`طَيِّبْ، فِهِمْنَا` 是“我们”形式。若也想接受提议，还需要另用表达赞同的话。试一试：代表两人或更多人表示理解。答案：`طَيِّبْ،
            فِهِمْنَا`；复数说话人词尾明确指出整个小组。"
    - subskill_id: clarification
      explanation: 有时词句听清了，本意却不明白。`شُو قَصْدَكْ بِهَادْ؟` 请对方解释刚才那句话是什么意思。例句称呼一名男子。平和的语气有助于把请求澄清与质疑区分开。
      examples:
        - text: شُو قَصْدَكْ بِهَادْ؟
          meaning: "**例句。** “你说的那个是什么意思？” `شُو` 意为什么。`قَصْدَكْ` 用表示意图或意思的名词加“你的”词尾，这里称呼一名男子。`بِهَادْ`
            指回刚才的说法。词尾指出你问的是谁的本意。"
          note: |-
            **选择修复方式。** 这个问句要的是解释，所以单纯重复相同的词未必能解决问题。你也可以指出具体哪一个词不明白。

            **练一练。** 指出哪个词意为“你的意思”。答案：`قَصْدَكْ`。学习这个表达时，把整个词连在一起。
    - subskill_id: rephrasing
      explanation: 预订规则的解释可能太复杂。改述应保留实际意思，用更简单的话说出主要要求，而不是加入另一条指示。
      examples:
        - text: بِكَلَامْ أَبْسَطْ، لَازِمْ نِحْجِزْ مِنْ قَبْلْ.
          meaning: "**例句。** 简单来说，我们需要提前预订。`بِكَلَامْ أَبْسَطْ` 意为用更简单的话说。`لَازِمْ` 表示必须；`نِحْجِزْ` 是我们预订，`مِنْ قَبْلْ`
            在这里表示提前。`لَازِمْ` 后的预订动作不带普通 b- 前缀。"
          note: 说自己必须预订时，用 `لَازِمْ أَحْجِزْ مِنْ قَبْلْ`。改述应保留之前的要求，不能悄悄改变日期或责任人。试一试：把同一要求改为自己承担。答案：`بِكَلَامْ
            أَبْسَطْ، لَازِمْ أَحْجِزْ مِنْ قَبْلْ`；新的第一人称形式明确指出“我”。
    - subskill_id: correcting_misunderstanding
      explanation: 听话人以为你说今天，但原意是明天。纠正时先给出原定信息，再明确排除误听的版本。
      examples:
        - text: قَصْدِي بُكْرَا، مِشْ الْيَوْمْ.
          meaning: "**例句。** 我说的是明天，不是今天。`قَصْدِي` 意为我的本意。`بُكْرَا` 是明天；`مِشْ الْيَوْمْ` 意为不是今天。附着的“我的”词尾表明是在纠正自己想传达的信息。"
          note: 相反方向可说 `قَصْدِي الْيَوْمْ، مِشْ بُكْرَا`。被否定的信息放在否定词后。试一试：把误听的明天纠正为今天。答案：`قَصْدِي الْيَوْمْ، مِشْ
            بُكْرَا`；原定日期现在放在误听日期前。
    - subskill_id: turns_topics
      explanation: 交谈已经离开约会话题，但你仍要确定时间。先指出话题，再提出问题，听话人便能跟上转换。
      examples:
        - text: بِالنِّسْبِة لِلْمَوْعِدْ، نِلْتَقِي الصُّبْحْ؟
          meaning: "**例句。** 关于这次约会，我们早上见面好吗？`بِالنِّسْبِة لِلْمَوْعِدْ` 意为关于约会。`نِلْتَقِي` 是我们见面，`الصُّبْحْ`
            在这里是早上。疑问语调把见面时刻交给对方商量，开头短语提示话题转换。"
          note: 若要提议晚上，把时间换成 `بِالْمَسَا`。试一试：询问晚上见面如何。答案：`بِالنِّسْبِة لِلْمَوْعِدْ، نِلْتَقِي
            بِالْمَسَا؟`；话题短语保留，时间短语整体改变。
