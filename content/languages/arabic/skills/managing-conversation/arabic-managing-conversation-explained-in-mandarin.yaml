skill_id: managing_conversation
explanation_language: mandarin
shared_explanation: skills/managing-conversation/managing-conversation-explained-in-mandarin.yaml
sections:
  - subskill_id: opening_closing
    explanation: 早晨问候是与你遇见的人开始交谈的一种简单方式。回应可以使用另一句惯用表达，不必逐字重复问候。
    examples:
      - text: صَبَاحُ الْخَيْرِ!
        meaning: "**例句。** 早上好！`صَبَاحُ` 意为早晨，`الْخَيْرِ` 意为善或美好。合起来是惯用的早安问候。要把整句当作问候语来学，不必替英语的每个词都找一个单独的阿拉伯语对应词。"
        note: 惯用回答是 `صَبَاحُ النُّورِ`，字面上是光明的早晨。傍晚问候可用 `مَسَاءُ الْخَيْرِ`。试一试：晚上向人问好。答案：`مَسَاءُ
          الْخَيْرِ`；一天中的时间名词改变，问候句式仍在。
  - subskill_id: acknowledging
    explanation: 有人解释一项任务怎样做，你可以让对方知道自己已经听懂。说自己明白了，并不一定表示赞同这个计划。
    examples:
      - text: حَسَنًا، فَهِمْتُ.
        meaning: "**例句。** 好的，我明白了。`حَسَنًا` 表示好的；`فَهِمْتُ` 意为我理解了。过去形式把理解呈现为已经达到的状态，因此在这样的答话里自然译为“我明白了”。词尾指出说话人。"
        note: 代表一组人可说 `حَسَنًا، فَهِمْنَا`，意为好的，我们明白了。若理解与赞同不同，要把两者分开。试一试：代表小组表示听懂。答案：`حَسَنًا،
          فَهِمْنَا`；词尾从“我”变为“我们”。
  - subskill_id: clarification
    explanation: 听到一个句子，不代表明白说话人的本意。`مَاذَا تَقْصِدُ بِهٰذَا؟` 请对方解释他是什么意思。这个例子称呼一名男子，并指回他刚说的话。
    examples:
      - text: مَاذَا تَقْصِدُ بِهٰذَا؟
        meaning: "**例句。** “你说的那个是什么意思？” `مَاذَا` 问什么；`تَقْصِدُ` 在这里意为你打算表达或你指的是。`بِهٰذَا` 由附着介词 `بِـ` 与表示这个的 `هٰذَا`
          组成，指回刚才的话。"
        note: |-
          **改变听话人。** 称呼一名女子时，用 `مَاذَا تَقْصِدِينَ بِهٰذَا؟`。变化在动词上，标明你问的是谁。

          **练一练。** 哪一部分指向需要解释的表达？答案：`بِهٰذَا`。
  - subskill_id: rephrasing
    explanation: 预订规则的解释可能太复杂。改述应保留实际意思，用更简单的话说出主要要求，而不是加入另一条指示。
    examples:
      - text: بِعِبَارَةٍ أَبْسَطَ، يَجِبُ أَنْ نَحْجِزَ مُسْبَقًا.
        meaning: "**例句。** 简单来说，我们需要提前预订。`بِعِبَارَةٍ أَبْسَطَ` 意为用更简单的话说。`يَجِبُ أَنْ` 引出要求；`نَحْجِزَ` 是 `أَنْ`
          后表示我们预订的形式。`مُسْبَقًا` 是提前。开头告诉听话人，这里是在重述。"
        note: 若只有自己要预订，用 `يَجِبُ أَنْ أَحْجِزَ مُسْبَقًا`。人称标记体现在预订动词上。试一试：把同一要求改成只针对自己。答案：`بِعِبَارَةٍ أَبْسَطَ،
          يَجِبُ أَنْ أَحْجِزَ مُسْبَقًا`；把“我们”改成“我”，要求不变。
  - subskill_id: correcting_misunderstanding
    explanation: 听话人以为你说今天，但原意是明天。纠正时先给出原定信息，再明确排除误听的版本。
    examples:
      - text: أَقْصِدُ غَدًا، وَلَيْسَ الْيَوْمَ.
        meaning: "**例句。** 我说的是明天，不是今天。`أَقْصِدُ` 意为我指的是。`غَدًا` 是明天；`وَلَيْسَ الْيَوْمَ`
          意为而不是今天。两个时间短语使纠正具体，听话人知道该替换哪一处。"
        note: 若要反过来纠正日期，就说 `أَقْصِدُ الْيَوْمَ، وَلَيْسَ
          غَدًا`。纠正一个细节与取消整次见面不同。试一试：对方听成明天，你本意是今天。答案：用刚才对调日期的句子；原定时间先说。
  - subskill_id: turns_topics
    explanation: 交谈已经离开约会话题，但你仍要确定时间。先指出话题，再提出问题，听话人便能跟上转换。
    examples:
      - text: بِخُصُوصِ الْمَوْعِدِ، هَلْ نَلْتَقِي صَبَاحًا؟
        meaning: "**例句。** 关于这次约会，我们早上见面好吗？`بِخُصُوصِ الْمَوْعِدِ` 意为关于这次约会。`هَلْ` 引出是非问句；`نَلْتَقِي` 意为我们见面，`صَبَاحًا`
          意为在早上。话题短语为问句设定背景，并不是回答。"
        note: 若改为晚上，用 `مَسَاءً`。试一试：回到约会话题，提议晚上见。答案：`بِخُصُوصِ الْمَوْعِدِ، هَلْ نَلْتَقِي
          مَسَاءً؟`；话题和共同见面的行动不变，所提议的时间改变。
