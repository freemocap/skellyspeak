variety_sections:
  arabic-levantine:
    - subskill_id: ability
      explanation: 谈能力时，可以说明自己能做什么，无论是已学会的技能，还是当前条件下可做到的事。黎凡特阿拉伯语中，表示我能的常见表达是 `بَقْدَرْ`，后接说明活动的动词。这里说话人表示自己会游泳。
      examples:
        - text: بَقْدَرْ أَسْبَحْ.
          meaning: "**例句。** “我会游泳。” `بَقْدَرْ` 意为我能。`أَسْبَحْ` 给出动作，不带普通现在时的 b- 前缀。两个动词直接相连，指同一人。"
          note: |-
            **把句式连起来学。** `بَقْدَرْ` 上的前缀，不表示后一个动词也要照样加上。不同地区还有其他说法，包括北部用于“我能”的 `فِينِي`。

            **练一练。** 哪部分指出活动？答案：`أَسْبَحْ`。只说能力表达，听话人还不知道你能做什么。
    - subskill_id: permission
      explanation: 行动前想征求别人同意时，可以用 `مُمْكِنْ` 开始请求许可的问句。谈到一个空位时，`مُمْكِنْ أَقْعُدْ هُونْ؟` 问我能否坐在这里。所问的人应有权决定这个座位能否使用。
      examples:
        - text: مُمْكِنْ أَقْعُدْ هُونْ؟
          meaning: "**例句。** “我可以坐在这里吗？” `مُمْكِنْ` 引出许可问题；`أَقْعُدْ` 指我的动作——坐下；`هُونْ` 意为这里。疑问语调，以及等待听话人回答，使这句话成为请求。"
          note: |-
            **留意第二个动词。** 在这个句式里，`مُمْكِنْ` 后的动作不带普通的 b- 前缀。动词指出要做的事，地点词告诉对方在哪里。

            **练一练。** 哪个词说明座位位置？答案：`هُونْ`。
    - subskill_id: obligation
      explanation: 借来的东西可能必须在约定时间归还。黎凡特阿拉伯语用 `لَازِمْ` 后接动词，表示一项行动是必要的。动词指出谁必须做。例句里，说话人今天要还钥匙。
      examples:
        - text: لَازِمْ أَرَجِّعْ الْمِفْتَاحْ الْيَوْمْ.
          meaning: "**例句。** “我今天必须还钥匙。” `لَازِمْ` 表示要求。`أَرَجِّعْ` 在这里意为我归还，后接表示钥匙的 `الْمِفْتَاحْ` 和表示今天的
            `الْيَوْمْ`。`أَرَجِّعْ` 中间的双辅音属于这个动词形式。"
          note: |-
            **保留结构。** 这里 `لَازِمْ` 后的动词没有普通 b- 前缀，但它仍指出行动者。要求表达直接连到动作。

            **练一练。** 去掉期限。答案：`لَازِمْ أَرَجِّعْ الْمِفْتَاحْ`。义务仍在，但句子不再说何时归还。
    - subskill_id: possibility
      explanation: 延误还未证实时，你可能先听到它有可能发生。在这种情境里，`يُمْكِنْ` 意为也许，让你提到延误而不声称它一定发生。例句是在陈述火车可能会怎样。
      examples:
        - text: يُمْكِنْ الْقِطَارْ يِتْأَخَّرْ.
          meaning: "**例句。** “火车可能晚点。” `يُمْكِنْ` 在这里意为也许。`الْقِطَارْ` 在表示动作的 `يِتْأَخَّرْ` 前。整句表达事件的可能性，不是在谈火车是否有能力做某事。"
          note: |-
            **结合语境。** 讨论尚未确认的延误时，这样说有用。它本身不是向任何人请求许可的问句。

            **练一练。** 有人把这句话当作已经确认的延误，你该指出哪个词？答案：`يُمْكِنْ`；说话人并未排除其他结果。
    - subskill_id: certainty
      explanation: 无法确认别人说的话时，可以用 `أَنَا مِشْ مُتْأَكِّدِة` 描述不确定。这表示我不确定，形容词与女性说话人一致。它让问题继续开放，而不是宣布对方错了。
      examples:
        - text: أَنَا مِشْ مُتْأَكِّدِة مِنْ هَادْ.
          meaning: "**例句。** `أَنَا` 是我，`مِشْ` 否定形容词，`مُتْأَكِّدِة` 以阴性一致形式描述说话人确信。`مِنْ هَادْ` 指回那件事。这个现在时句式没有独立对应英语 am
            的词。"
          note: |-
            **否定。** `مِشْ` 否定形容词。去掉它，说话人就表示自己确信。

            **练一练。** 要表达确定，应删掉哪个词？答案：`مِشْ`。
