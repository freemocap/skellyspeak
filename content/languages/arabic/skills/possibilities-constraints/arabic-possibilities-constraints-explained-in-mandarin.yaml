sections:
  - subskill_id: ability
    explanation: 描述能力时，你在说某个人能做什么。在现代标准阿拉伯语中，`أَسْتَطِيعُ` 意为我能够。它后面可以接 `أَنْ` 和表示具体动作的动词。例句描述说话人的游泳能力。
    examples:
      - text: أَسْتَطِيعُ أَنْ أَسْبَحَ.
        meaning: "**例句。** “我会游泳。” `أَسْتَطِيعُ` 意为我能够；`أَنْ` 引出动作；在这个结构里，`أَسْبَحَ` 表示我游泳。两个动词都指同一个第一人称主语，所以无需另加表示我的
          `أَنَا`。"
        note: |-
          **留意形式。** 带完整元音标记时，`أَنْ` 后这个动词以短 a 元音结尾：`أَسْبَحَ`。它仍标明第一人称，并不是完全不变的词典形式。

          **练一练。** 哪个词把能力与动作连起来？答案：`أَنْ`。
  - subskill_id: permission
    explanation: 使用别人的空间或物品前，你可能需要问是否获准行动。在现代标准阿拉伯语中，`هَلْ يُمْكِنُنِي` 是询问“我可以……吗”的一种方式。例句中，说话人希望得到允许，坐在某个位置。
    examples:
      - text: هَلْ يُمْكِنُنِي أَنْ أَجْلِسَ هُنَا؟
        meaning: "**例句。** “我可以坐在这里吗？” `هَلْ` 开始是非问句。`يُمْكِنُنِي` 中的词尾 `نِي` 指我。`أَنْ أَجْلِسَ` 给出坐下这个动作，`هُنَا`
          意为这里。"
        note: |-
          **改变地点。** 把 `هُنَا` 换成 `هُنَاكَ`，表示那里。请求许可的句式不变。

          **练一练。** 请求坐在那里。答案：`هَلْ يُمْكِنُنِي أَنْ أَجْلِسَ هُنَاكَ؟`。动作动词前保留 `أَنْ`。
  - subskill_id: obligation
    explanation: 期限或约定可能使某个行动成为必须。在现代标准阿拉伯语中，`يَجِبُ أَنْ` 后接动词表达要求。后面的动词指出谁必须行动。这里归还钥匙是说话人的责任。
    examples:
      - text: يَجِبُ أَنْ أُعِيدَ الْمِفْتَاحَ الْيَوْمَ.
        meaning: "**例句。** “我今天必须还钥匙。” `يَجِبُ` 说出必要性。`أَنْ أُعِيدَ` 给出我的行动：归还。`الْمِفْتَاحَ` 是要还的钥匙，`الْيَوْمَ`
          是今天。第一人称标记在 `أُعِيدَ` 上，不在 `يَجِبُ` 上。"
        note: |-
          **改变期限。** 明天用 `غَدًا`。

          **练一练。** 把期限改为明天。答案：`يَجِبُ أَنْ أُعِيدَ الْمِفْتَاحَ غَدًا`。归还行动不变，只替换时间短语。
  - subskill_id: possibility
    explanation: 结果不确定时，你可以提及它，却不把它当成事实。`رُبَّمَا` 意为也许，可以引出这种可能。例句说火车可能晚点，同时也保留准点到达的可能。
    examples:
      - text: رُبَّمَا يَتَأَخَّرُ الْقِطَارُ.
        meaning: "**例句。** “火车可能晚点。” `رُبَّمَا` 意为也许。`يَتَأَخَّرُ` 表示晚点，`الْقِطَارُ` 是火车。这个例子把动词放在主语前。`رُبَّمَا`
          限定整个陈述，没有断言火车一定会晚。"
        note: |-
          **比较。** 没有 `رُبَّمَا` 时，`يَتَأَخَّرُ الْقِطَارُ` 直接陈述火车晚点或会延误，具体时间由语境决定。

          **练一练。** 原句哪个词使说法不确定？答案：`رُبَّمَا`。
  - subskill_id: certainty
    explanation: 你可以告诉别人自己还不能确认某个说法。`لَسْتُ مُتَأَكِّدًا` 或 `لَسْتُ مُتَأَكِّدَةً`
      意为我不确定。形容词与说话人一致；例句使用阴性一致形式。它表达没有把握，不是表达反对。
    examples:
      - text: لَسْتُ مُتَأَكِّدَةً مِنْ ذٰلِكَ.
        meaning: "**例句。** `لَسْتُ` 意为我不是。`مُتَأَكِّدَةً` 是这里所需的阴性形式，表示确信；`مِنْ ذٰلِكَ` 意为对那件事。带完整元音标记的标准阿拉伯语中，这个形容词在
          `لَسْتُ` 后有宾格词尾。"
        note: |-
          **改变说话人。** 阳性一致形式是 `لَسْتُ مُتَأَكِّدًا مِنْ ذٰلِكَ`。表示我的 `لَسْتُ` 不变。

          **练一练。** 哪部分指回先前的说法？答案：`مِنْ ذٰلِكَ`。不确定不等于断言对方所说为假。
