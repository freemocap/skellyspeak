sections:
  - subskill_id: ability
    explanation: 講能力，就係講一個人做得到啲乜。現代標準阿拉伯語嘅 `أَسْتَطِيعُ` 係我有能力，後面可以接 `أَنْ` 同表示動作嘅動詞。下面例句講講者有能力游水。
    examples:
      - text: أَسْتَطِيعُ أَنْ أَسْبَحَ.
        meaning: "**例句解說。** 「我可以游水。」`أَسْتَطِيعُ` 係我有能力；`أَنْ` 帶出動作；`أَسْبَحَ`
          喺呢個結構表示我游水。兩個動詞都指出第一人稱，所以唔使另外加 `أَنَا`（我）。"
        note: |-
          **留意形式。** 喺標齊元音嘅寫法，`أَنْ` 後面呢個動詞用短 a 元音結尾：`أَسْبَحَ`。佢仍然有「我」嘅人物資訊，唔係冇變化嘅字典形式。

          **試吓。** 邊個字連接能力同動作？答案：`أَنْ`。
  - subskill_id: permission
    explanation: 用人哋嘅地方或者物品之前，可能要先問可唔可以。現代標準語可以用 `هَلْ يُمْكِنُنِي` 問我可唔可以。下面例句講講者想得到許可，坐喺某個位置。
    examples:
      - text: هَلْ يُمْكِنُنِي أَنْ أَجْلِسَ هُنَا؟
        meaning: "**例句解說。** 「我可以坐呢度嗎？」`هَلْ` 帶出是非問句。`يُمْكِنُنِي` 入面嘅 `نِي` 指我。`أَنْ أَجْلِسَ`
          交代坐低呢個動作，`هُنَا` 係呢度。"
        note: |-
          **轉地點。** 用 `هُنَاكَ`（嗰度）換走 `هُنَا`，問許可嘅結構保持不變。

          **試吓。** 問可唔可以坐嗰度。答案：`هَلْ يُمْكِنُنِي أَنْ أَجْلِسَ هُنَاكَ؟` 動作動詞前面保留 `أَنْ`。
  - subskill_id: obligation
    explanation: 期限或者約定，可以令一個動作變成有需要做。現代標準語用 `يَجِبُ أَنْ` 加動詞表達必要；後面動詞指出邊個要做。呢度還鎖匙係講者嘅責任。
    examples:
      - text: يَجِبُ أَنْ أُعِيدَ الْمِفْتَاحَ الْيَوْمَ.
        meaning: "**例句解說。** 「我今日必須還鎖匙。」`يَجِبُ` 表示必要，`أَنْ أُعِيدَ` 指我歸還嘅動作，`الْمِفْتَاحَ`
          係要還嘅鎖匙，`الْيَوْمَ` 係今日。「我」嘅人物資訊喺 `أُعِيدَ`，唔係喺 `يَجِبُ`。"
        note: |-
          **改期限。** 聽日係 `غَدًا`。

          **試吓。** 將期限改做聽日。答案：`يَجِبُ أَنْ أُعِيدَ الْمِفْتَاحَ غَدًا`。動作保持不變，只換時間表達。
  - subskill_id: possibility
    explanation: 結果未肯定時，可以提出可能性，而唔當成事實講。`رُبَّمَا` 係可能，可以帶出呢種意思。下面例句話火車可能遲，但仍然可能準時。
    examples:
      - text: رُبَّمَا يَتَأَخَّرُ الْقِطَارُ.
        meaning: "**例句解說。** 「火車可能遲到。」`رُبَّمَا` 係可能，`يَتَأَخَّرُ` 講遲到，`الْقِطَارُ` 係火車。呢句動詞放喺主語前。`رُبَّمَا`
          保留不確定，唔係話火車一定遲。"
        note: |-
          **比較。** 去掉 `رُبَّمَا`，`يَتَأَخَّرُ الْقِطَارُ` 就陳述火車遲到或者會延誤，具體時間意思由語境決定。

          **試吓。** 原句邊個字保留不確定？答案：`رُبَّمَا`。
  - subskill_id: certainty
    explanation: 你可以話畀人知，自己未夠把握確認一個講法。`لَسْتُ مُتَأَكِّدًا` 或 `لَسْتُ مُتَأَكِّدَةً`
      係我唔肯定。形容詞跟講者配合，下面例句用陰性。意思係未肯定，唔係唔同意。
    examples:
      - text: لَسْتُ مُتَأَكِّدَةً مِنْ ذٰلِكَ.
        meaning: "**例句解說。** `لَسْتُ` 係我唔係；`مُتَأَكِّدَةً` 係呢度所需嘅陰性「肯定」；`مِنْ ذٰلِكَ`
          係對嗰件事。標齊元音嘅標準語入面，`لَسْتُ` 後面形容詞用賓格字尾。"
        note: |-
          **轉講者。** 用陽性配合就係 `لَسْتُ مُتَأَكِّدًا مِنْ ذٰلِكَ`。表示我嘅 `لَسْتُ` 唔變。

          **試吓。** 邊部分指返頭先嘅主張？答案：`مِنْ ذٰلِكَ`。唔肯定，唔等於斷言嗰個主張係假。
