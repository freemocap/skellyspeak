variety_sections:
  arabic-levantine:
    - subskill_id: ability
      explanation: 講能力，可以交代你做得到啲乜，包括學識嘅技能或者當時情況容許嘅行動。黎凡特口語常用 `بَقْدَرْ` 表示我可以，後面接表示活動嘅動詞。呢度講者話自己可以游水。
      examples:
        - text: بَقْدَرْ أَسْبَحْ.
          meaning: "**例句解說。** 「我可以游水。」`بَقْدَرْ` 係我可以。`أَسْبَحْ` 交代動作，冇加一般現在式嘅 b 前綴。兩個動詞直接連埋，講同一個人。"
          note: |-
            **成套結構一齊學。** `بَقْدَرْ` 有前綴，唔代表後面嘅動詞都要照加。各地亦有其他講法，例如北部用 `فِينِي` 講我可以。

            **試吓。** 邊部分指出做乜？答案：`أَسْبَحْ`。淨係講有能力，對方仍然唔知你做得到啲乜。
    - subskill_id: permission
      explanation: 做之前想得到對方同意，可以用 `مُمْكِنْ` 引出許可問題。講到一個空位時，`مُمْكِنْ أَقْعُدْ هُونْ؟` 問我可唔可以坐呢度。應該向可以決定座位點用嘅人問。
      examples:
        - text: مُمْكِنْ أَقْعُدْ هُونْ؟
          meaning: "**例句解說。** 「我可以坐呢度嗎？」`مُمْكِنْ` 引出許可問題，`أَقْعُدْ` 係我坐低，`هُونْ` 係呢度。問句語調同等待對方回答，令呢句成為一個請求。"
          note: |-
            **留意後面嘅動詞。** 呢個結構喺 `مُمْكِنْ` 後面用冇一般 b 前綴嘅動詞。動詞指出做乜，地點詞指出喺邊度。

            **試吓。** 邊個字指出座位位置？答案：`هُونْ`。
    - subskill_id: obligation
      explanation: 借咗嘢，可能要按約定時間歸還。黎凡特口語用 `لَازِمْ` 加動詞，表示有需要做。動詞指出邊個要做。下面例句講講者今日要還鎖匙。
      examples:
        - text: لَازِمْ أَرَجِّعْ الْمِفْتَاحْ الْيَوْمْ.
          meaning: "**例句解說。** 「我今日必須還鎖匙。」`لَازِمْ` 表示有需要，`أَرَجِّعْ` 喺呢度係我歸還一樣嘢，後面接 `الْمِفْتَاحْ`（鎖匙）同
            `الْيَوْمْ`（今日）。`أَرَجِّعْ` 中間嘅雙輔音係呢個動詞形式嘅一部分。"
          note: |-
            **保留結構。** 呢度 `لَازِمْ` 後面嘅動詞冇一般 b 前綴，但仍然指出邊個做。必要性表達直接接動作。

            **試吓。** 去掉期限。答案：`لَازِمْ أَرَجِّعْ الْمِفْتَاحْ`。仍然有需要還，但冇再講幾時。
    - subskill_id: possibility
      explanation: 延誤未確認之前，你可能已經聽到消息。呢個情況可以用 `يُمْكِنْ`（可能），提出延誤而唔話一定發生。下面例句講火車可能出現嘅情況。
      examples:
        - text: يُمْكِنْ الْقِطَارْ يِتْأَخَّرْ.
          meaning: "**例句解說。** 「火車可能遲到。」`يُمْكِنْ` 喺呢度解可能。`الْقِطَارْ` 放喺動作 `يِتْأَخَّرْ`
            前面。呢句講成件事嘅可能性，唔係講火車有冇能力。"
          note: |-
            **睇語境。** 未確認延誤時可以用呢句。佢本身唔係向人問許可嘅問題。

            **試吓。** 對方以為延誤已經確認，你應該指出邊個字？答案：`يُمْكِنْ`，講者仍然保留其他可能。
    - subskill_id: certainty
      explanation: 未能確認對方嘅說話時，可以用 `أَنَا مِشْ مُتْأَكِّدِة` 表達唔肯定。呢句係我唔肯定，用陰性配合講者。問題仍然未有定論，唔係話對方錯。
      examples:
        - text: أَنَا مِشْ مُتْأَكِّدِة مِنْ هَادْ.
          meaning: "**例句解說。** `أَنَا` 係我，`مِشْ` 否定形容詞，`مُتْأَكِّدِة` 用陰性形式講肯定。`مِنْ هَادْ`
            指返嗰件事。呢個現在時間結構冇獨立嘅字對應英文 “am”。"
          note: |-
            **否定。** `مِشْ` 否定形容詞。冇咗佢，講者就話自己肯定。

            **練習。** 想表達肯定，要去掉邊個字？答案：`مِشْ`。
