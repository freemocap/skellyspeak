sections:
  - subskill_id: ability
    explanation: 能力謂語可以引入講者做得到嘅行動。
    examples:
      - text: أَسْتَطِيعُ أَنْ أَسْبَحَ.
        meaning: 我識游水。
        note: 現代標準阿拉伯語。喺討論游水技能時報告能力。
      - text: بَقْدَرْ أَسْبَحْ.
        meaning: 我識游水。
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。喺討論游水技能時報告能力。
  - subskill_id: permission
    explanation: 喺合適語境，問某件事可唔可行，可以用嚟請求許可。
    examples:
      - text: هَلْ يُمْكِنُنِي أَنْ أَجْلِسَ هُنَا؟
        meaning: 我可唔可以坐呢度？
        note: 現代標準阿拉伯語。問負責座位嘅人，重點係許可。
      - text: مُمْكِنْ أَقْعُدْ هُونْ؟
        meaning: 我可唔可以坐呢度？
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。問負責座位嘅人，重點係許可。
  - subskill_id: obligation
    explanation: 義務用語後面接行動，可以交代要求。
    examples:
      - text: يَجِبُ أَنْ أُعِيدَ الْمِفْتَاحَ الْيَوْمَ.
        meaning: 我今日一定要還鎖匙。
        note: 現代標準阿拉伯語。歸還期限帶出必要性。
      - text: لَازِمْ أَرَجِّعْ الْمِفْتَاحْ الْيَوْمْ.
        meaning: 我今日一定要還鎖匙。
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。歸還期限帶出必要性。
  - subskill_id: possibility
    explanation: 表示可能嘅詞可以限定一個說法，而唔肯定佢一定成立。
    examples:
      - text: رُبَّمَا يَتَأَخَّرُ الْقِطَارُ.
        meaning: 架火車可能會遲到。
        note: 現代標準阿拉伯語。講者保留結果未定嘅空間。
      - text: يُمْكِنْ الْقِطَارْ يِتْأَخَّرْ.
        meaning: 架火車可能會遲到。
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。講者保留結果未定嘅空間。
  - subskill_id: certainty
    explanation: 否定肯定程度嘅謂語，可以限制自己對一個說法嘅把握。
    examples:
      - text: لَسْتُ مُتَأَكِّدَةً مِنْ ذٰلِكَ.
        meaning: 我對呢點唔肯定。
        note: 現代標準阿拉伯語。女性講者回應之前嘅說法。
      - text: أَنَا مِشْ مُتْأَكِّدِة مِنْ هَادْ.
        meaning: 我對呢點唔肯定。
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。女性講者回應之前嘅說法。
