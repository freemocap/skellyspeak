sections:
  - subskill_id: ability
    explanation: Décrire une capacité consiste à dire ce qu’une personne peut faire. En arabe standard moderne,
      `أَسْتَطِيعُ` signifie « je suis capable ». Cette forme peut être suivie de `أَنْ` et d’un verbe qui
      nomme l’action. L’exemple parle de la capacité à nager.
    examples:
      - text: أَسْتَطِيعُ أَنْ أَسْبَحَ.
        meaning: "**L’exemple.** « Je peux nager. » `أَسْتَطِيعُ` exprime la capacité ; `أَنْ` introduit l’action ;
          `أَسْبَحَ` signifie « je nage » dans cette construction. Les deux verbes ont le même sujet à la
          première personne, donc le pronom distinct `أَنَا` n’est pas nécessaire."
        note: >-
          **Observez la forme.** Après `أَنْ`, ce verbe finit par une voyelle a brève dans l’écriture
          entièrement vocalisée : `أَسْبَحَ`. Il reste marqué pour « je » ; ce n’est pas une forme de
          dictionnaire invariable.


          **À vous.** Quel mot relie la capacité à l’action ? Réponse : `أَنْ`.
  - subskill_id: permission
    explanation: Avant d’utiliser l’espace ou les affaires d’autrui, vous pouvez avoir besoin de demander si
      l’action est permise. En arabe standard moderne, `هَلْ يُمْكِنُنِي` permet de demander la permission
      d’agir. Dans l’exemple, la personne veut s’asseoir à un endroit précis.
    examples:
      - text: هَلْ يُمْكِنُنِي أَنْ أَجْلِسَ هُنَا؟
        meaning: "**L’exemple.** « Puis-je m’asseoir ici ? » `هَلْ` ouvre une question fermée. Dans `يُمْكِنُنِي`, la
          terminaison `نِي` renvoie à « moi ». `أَنْ أَجْلِسَ` nomme l’action de s’asseoir et `هُنَا` signifie
          ici."
        note: >-
          **Changez le lieu.** Remplacez `هُنَا` par `هُنَاكَ` pour dire « là-bas ». Le modèle de permission
          reste intact.


          **À vous.** Demandez à vous asseoir là-bas. Réponse : `هَلْ يُمْكِنُنِي أَنْ أَجْلِسَ هُنَاكَ؟`
          Gardez `أَنْ` avant le verbe d’action.
  - subskill_id: obligation
    explanation: Une échéance ou un accord peut rendre une action nécessaire. L’arabe standard moderne emploie
      `يَجِبُ أَنْ` suivi d’un verbe pour exprimer une obligation. Ce verbe indique qui doit agir. Ici, la
      personne qui parle doit rendre une clé.
    examples:
      - text: يَجِبُ أَنْ أُعِيدَ الْمِفْتَاحَ الْيَوْمَ.
        meaning: "**L’exemple.** « Je dois rendre la clé aujourd’hui. » `يَجِبُ` exprime la nécessité. `أَنْ أُعِيدَ`
          nomme mon action de rendre quelque chose. `الْمِفْتَاحَ` est la clé rendue et `الْيَوْمَ` situe
          l’action aujourd’hui. La marque de première personne se trouve sur `أُعِيدَ`, pas sur `يَجِبُ`."
        note: >-
          **Changez l’échéance.** Employez `غَدًا` pour demain.


          **À vous.** Déplacez l’échéance à demain. Réponse : `يَجِبُ أَنْ أُعِيدَ الْمِفْتَاحَ غَدًا`. Gardez
          la même action et changez seulement l’expression de temps.
  - subskill_id: possibility
    explanation: Quand un résultat est incertain, vous pouvez l’évoquer sans le présenter comme un fait.
      `رُبَّمَا` signifie « peut-être » et introduit cette possibilité. L’exemple permet d’envisager un retard
      du train tout en laissant possible son arrivée à l’heure.
    examples:
      - text: رُبَّمَا يَتَأَخَّرُ الْقِطَارُ.
        meaning: "**L’exemple.** « Le train pourrait être en retard. » `رُبَّمَا` signifie peut-être. `يَتَأَخَّرُ`
          nomme le retard ; `الْقِطَارُ` est le train. Le verbe précède ici le sujet. `رُبَّمَا` nuance la
          phrase sans affirmer que le train sera certainement en retard."
        note: >-
          **Comparez.** Sans `رُبَّمَا`, `يَتَأَخَّرُ الْقِطَارُ` affirme que le train est ou devient en
          retard ; le contexte fixe la lecture temporelle.


          **À vous.** Quel mot rend la phrase initiale incertaine ? Réponse : `رُبَّمَا`.
  - subskill_id: certainty
    explanation: Vous pouvez dire que vous n’êtes pas prêt à confirmer une affirmation. `لَسْتُ مُتَأَكِّدًا` ou
      `لَسْتُ مُتَأَكِّدَةً` signifie « je ne suis pas sûr ». L’adjectif s’accorde avec la personne qui parle
      ; l’exemple utilise le féminin. Cela exprime l’incertitude, pas le désaccord.
    examples:
      - text: لَسْتُ مُتَأَكِّدَةً مِنْ ذٰلِكَ.
        meaning: "**L’exemple.** `لَسْتُ` signifie « je ne suis pas ». `مُتَأَكِّدَةً` signifie sûre avec la forme
          féminine requise ici ; `مِنْ ذٰلِكَ` signifie « à ce sujet ». Dans l’arabe standard entièrement
          vocalisé, l’adjectif porte une terminaison à l’accusatif après `لَسْتُ`."
        note: >-
          **Changez de personne.** L’accord masculin donne `لَسْتُ مُتَأَكِّدًا مِنْ ذٰلِكَ`. `لَسْتُ` reste
          la forme « je ».


          **À vous.** Quelle partie renvoie à l’affirmation précédente ? Réponse : `مِنْ ذٰلِكَ`. Être
          incertain ne revient pas à dire que l’affirmation est fausse.
