variety_sections:
  arabic-levantine:
    - subskill_id: ability
      explanation: Parler de capacité indique ce que vous pouvez faire, qu’il s’agisse d’une compétence apprise ou
        d’une possibilité offerte par la situation. En levantin, `بَقْدَرْ` est une expression courante pour «
        je peux ». Un verbe nommant l’activité suit. Ici, la personne dit qu’elle sait nager.
      examples:
        - text: بَقْدَرْ أَسْبَحْ.
          meaning: "**L’exemple.** « Je peux nager. » `بَقْدَرْ` signifie « je peux ». `أَسْبَحْ` donne l’action sans le
            préfixe b- ordinaire du présent. Les deux verbes se suivent directement et renvoient à la même
            personne."
          note: >-
            **Gardez le modèle ensemble.** Le préfixe de `بَقْدَرْ` ne doit pas être recopié sur le verbe
            suivant. Il existe des variantes régionales, dont la forme septentrionale `فِينِي` pour « je peux
            ».


            **À vous.** Quelle partie nomme l’activité ? Réponse : `أَسْبَحْ`. L’expression de capacité seule
            ne dit pas ce que vous savez faire.
    - subskill_id: permission
      explanation: Si vous souhaitez l’accord d’une personne avant d’agir, `مُمْكِنْ` peut introduire une demande de
        permission. Dans une conversation sur un siège libre, `مُمْكِنْ أَقْعُدْ هُونْ؟` demande si vous
        pouvez vous asseoir ici. La personne interrogée doit pouvoir décider de l’usage du siège.
      examples:
        - text: مُمْكِنْ أَقْعُدْ هُونْ؟
          meaning: "**L’exemple.** « Puis-je m’asseoir ici ? » `مُمْكِنْ` introduit la demande de permission ;
            `أَقْعُدْ` désigne mon action de m’asseoir et `هُونْ` signifie ici. L’intonation interrogative et
            l’attente de la réponse en font une demande."
          note: >-
            **Observez le second verbe.** Après `مُمْكِنْ` dans ce modèle, le verbe d’action n’a pas son
            préfixe b- ordinaire. Il nomme l’action et le mot de lieu indique où elle se ferait.


            **À vous.** Quel mot situe le siège ? Réponse : `هُونْ`.
    - subskill_id: obligation
      explanation: Un objet emprunté peut devoir être rendu à une heure convenue. Le levantin emploie `لَازِمْ`
        suivi d’un verbe pour dire qu’une action est nécessaire. Le verbe indique qui doit agir. Dans
        l’exemple, la personne doit rendre une clé aujourd’hui.
      examples:
        - text: لَازِمْ أَرَجِّعْ الْمِفْتَاحْ الْيَوْمْ.
          meaning: "**L’exemple.** « Je dois rendre la clé aujourd’hui. » `لَازِمْ` exprime l’obligation. `أَرَجِّعْ`
            signifie ici « je rends », suivi de `الْمِفْتَاحْ`, la clé, et de `الْيَوْمْ`, aujourd’hui. Le
            redoublement de la consonne médiane appartient à la forme `أَرَجِّعْ`."
          note: >-
            **Gardez la construction.** Le verbe après `لَازِمْ` n’a pas ici son préfixe b- ordinaire, mais
            continue à indiquer la personne qui agit. L’expression de nécessité se lie directement à l’action.


            **À vous.** Supprimez la date limite. Réponse : `لَازِمْ أَرَجِّعْ الْمِفْتَاحْ`. L’obligation
            reste, mais la phrase ne précise plus quand.
    - subskill_id: possibility
      explanation: Vous pouvez entendre parler d’un retard possible avant sa confirmation. Dans cette situation,
        `يُمْكِنْ` signifie « peut-être » et permet d’évoquer le retard sans le présenter comme certain.
        L’exemple énonce ce qui pourrait arriver au train.
      examples:
        - text: يُمْكِنْ الْقِطَارْ يِتْأَخَّرْ.
          meaning: "**L’exemple.** « Le train pourrait être en retard. » `يُمْكِنْ` signifie ici « peut-être ».
            `الْقِطَارْ` précède `يِتْأَخَّرْ`, l’action. Lisez la phrase comme une possibilité portant sur
            tout l’événement, pas comme une affirmation de la capacité du train."
          note: >-
            **Tenez compte du contexte.** La phrase sert à parler d’un retard non confirmé. Elle ne demande
            pas la permission de quelqu’un.


            **À vous.** Une personne traite ce retard comme confirmé. Quel mot faut-il lui montrer ? Réponse :
            `يُمْكِنْ` ; l’issue reste ouverte.
    - subskill_id: certainty
      explanation: Quand vous ne pouvez pas confirmer ce que quelqu’un a dit, `أَنَا مِشْ مُتْأَكِّدِة` exprime
        votre incertitude. La forme féminine décrit ici la personne qui parle. La question reste ouverte, sans
        déclarer que l’autre a tort.
      examples:
        - text: أَنَا مِشْ مُتْأَكِّدِة مِنْ هَادْ.
          meaning: "**L’exemple.** `أَنَا` signifie « je », `مِشْ` nie l’adjectif et `مُتْأَكِّدِة` décrit la personne
            comme sûre avec l’accord féminin. `مِنْ هَادْ` renvoie à cette question. Dans ce modèle au
            présent, aucun mot distinct ne correspond au « am » anglais."
          note: |-
            **Négation.** `مِشْ` nie l’adjectif. Sans ce mot, la personne affirme sa certitude.

            **À vous.** Quel mot faut-il enlever pour exprimer la certitude ? Réponse : `مِشْ`.
