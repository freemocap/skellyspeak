variety_sections:
  arabic-levantine:
    - subskill_id: ability
      explanation: Falar de capacidade permite explicar o que você consegue fazer, seja uma habilidade aprendida ou
        uma possibilidade da situação. Uma expressão levantina comum para « eu posso » é `بَقْدَرْ`, seguida
        do verbo da atividade. Aqui, a pessoa diz que sabe nadar.
      examples:
        - text: بَقْدَرْ أَسْبَحْ.
          meaning: "**O exemplo.** Posso nadar. `بَقْدَرْ` significa « eu posso ». `أَسْبَحْ` nomeia a ação sem o
            prefixo b- comum do presente. Os verbos vêm juntos e se referem à mesma pessoa."
          note: >-
            **Conserve a estrutura.** O prefixo de `بَقْدَرْ` não deve ser copiado para o verbo seguinte. Há
            alternativas regionais, inclusive a forma setentrional `فِينِي` para « eu posso ».


            **Experimente.** Que parte nomeia a atividade? Resposta: `أَسْبَحْ`. A expressão de capacidade
            sozinha não diz o que você consegue fazer.
    - subskill_id: permission
      explanation: Quando você precisa do acordo de alguém antes de agir, `مُمْكِنْ` pode introduzir um pedido de
        permissão. Em uma conversa sobre um lugar vago, `مُمْكِنْ أَقْعُدْ هُونْ؟` pergunta se você pode se
        sentar aqui. A pessoa consultada deve poder decidir sobre o assento.
      examples:
        - text: مُمْكِنْ أَقْعُدْ هُونْ؟
          meaning: "**O exemplo.** Posso sentar aqui? `مُمْكِنْ` introduz a pergunta de permissão; `أَقْعُدْ` nomeia
            minha ação de sentar, e `هُونْ` significa aqui. A entonação interrogativa e a espera pela resposta
            tornam a frase um pedido."
          note: >-
            **Observe o segundo verbo.** Depois de `مُمْكِنْ` nesta construção, a ação não recebe seu prefixo
            b- comum. O verbo nomeia a ação, e a palavra de lugar indica onde ela aconteceria.


            **Experimente.** Qual palavra situa o assento? Resposta: `هُونْ`.
    - subskill_id: obligation
      explanation: Um objeto emprestado pode precisar ser devolvido na hora combinada. O árabe levantino usa
        `لَازِمْ` seguido de um verbo para dizer que a ação é necessária. Esse verbo indica quem deve agir. No
        exemplo, a pessoa precisa devolver uma chave hoje.
      examples:
        - text: لَازِمْ أَرَجِّعْ الْمِفْتَاحْ الْيَوْمْ.
          meaning: "**O exemplo.** Tenho que devolver a chave hoje. `لَازِمْ` expressa a obrigação. `أَرَجِّعْ`
            significa aqui « eu devolvo », seguido de `الْمِفْتَاحْ`, a chave, e `الْيَوْمْ`, hoje. A
            consoante central dobrada pertence à forma `أَرَجِّعْ`."
          note: >-
            **Conserve a construção.** Depois de `لَازِمْ`, o verbo aqui não tem o prefixo b- comum. Ainda
            assim, identifica quem age. A expressão de necessidade se liga diretamente à ação.


            **Experimente.** Retire o prazo. Resposta: `لَازِمْ أَرَجِّعْ الْمِفْتَاحْ`. A obrigação
            permanece, mas a frase deixa de dizer quando.
    - subskill_id: possibility
      explanation: Você pode ouvir falar de um atraso antes de ele ser confirmado. Aqui, `يُمْكِنْ` significa «
        talvez » e permite mencionar o atraso sem tratá-lo como certo. O exemplo afirma o que pode acontecer
        com o trem.
      examples:
        - text: يُمْكِنْ الْقِطَارْ يِتْأَخَّرْ.
          meaning: "**O exemplo.** O trem pode atrasar. `يُمْكِنْ` funciona aqui como « talvez ». `الْقِطَارْ` vem antes
            de `يِتْأَخَّرْ`, a ação. Leia como uma possibilidade sobre o acontecimento inteiro, não como
            afirmação da capacidade do trem."
          note: >-
            **Considere o contexto.** A frase serve para discutir um atraso não confirmado; não é uma pergunta
            que pede permissão a alguém.


            **Experimente.** Alguém trata o atraso como confirmado. Qual palavra você deve mostrar? Resposta:
            `يُمْكِنْ`; o resultado continua em aberto.
    - subskill_id: certainty
      explanation: Quando você não pode confirmar o que alguém disse, `أَنَا مِشْ مُتْأَكِّدِة` expressa sua
        incerteza. A forma feminina descreve quem fala. A questão permanece aberta sem declarar que a outra
        pessoa esteja errada.
      examples:
        - text: أَنَا مِشْ مُتْأَكِّدِة مِنْ هَادْ.
          meaning: "**O exemplo.** `أَنَا` significa eu, `مِشْ` nega o adjetivo e `مُتْأَكِّدِة` descreve a pessoa como
            certa com concordância feminina. `مِنْ هَادْ` retoma esse assunto. Essa construção no presente não
            usa palavra separada equivalente ao « am » inglês."
          note: |-
            **Negação.** `مِشْ` nega o adjetivo. Sem ela, a pessoa afirma ter certeza.

            **Prática.** Que palavra você retiraria para expressar certeza? Resposta: `مِشْ`.
