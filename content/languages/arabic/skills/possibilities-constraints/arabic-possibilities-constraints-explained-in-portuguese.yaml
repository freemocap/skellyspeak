sections:
  - subskill_id: ability
    explanation: Ao descrever uma capacidade, você diz o que alguém consegue fazer. Em árabe padrão moderno,
      `أَسْتَطِيعُ` significa « sou capaz ». Ele pode ser seguido de `أَنْ` e de um verbo que nomeia a ação. O
      exemplo trata da capacidade de nadar de quem fala.
    examples:
      - text: أَسْتَطِيعُ أَنْ أَسْبَحَ.
        meaning: "**O exemplo.** Consigo nadar. `أَسْتَطِيعُ` significa « sou capaz »; `أَنْ` introduz a ação;
          `أَسْبَحَ` expressa « que eu nade » nessa construção. Os dois verbos indicam a mesma primeira
          pessoa, então não é preciso acrescentar `أَنَا`, eu."
        note: >-
          **Observe a forma.** Depois de `أَنْ`, esse verbo termina com uma vogal breve a na escrita
          totalmente vocalizada: `أَسْبَحَ`. Ele ainda marca a primeira pessoa; não é uma forma de dicionário
          invariável.


          **Experimente.** Qual palavra liga a capacidade à ação? Resposta: `أَنْ`.
  - subskill_id: permission
    explanation: Antes de usar o espaço ou os objetos de outra pessoa, talvez seja preciso pedir autorização.
      `هَلْ يُمْكِنُنِي` oferece uma maneira de perguntar « posso...? » em árabe padrão moderno. No exemplo, a
      pessoa quer permissão para sentar em um lugar específico.
    examples:
      - text: هَلْ يُمْكِنُنِي أَنْ أَجْلِسَ هُنَا؟
        meaning: "**O exemplo.** Posso sentar aqui? `هَلْ` inicia uma pergunta de sim ou não. Em `يُمْكِنُنِي`, a
          terminação `نِي` se refere a mim. `أَنْ أَجْلِسَ` apresenta a ação de sentar, e `هُنَا` significa
          aqui."
        note: >-
          **Mude o lugar.** Troque `هُنَا` por `هُنَاكَ`, lá. A estrutura de permissão permanece.


          **Experimente.** Peça para sentar lá. Resposta: `هَلْ يُمْكِنُنِي أَنْ أَجْلِسَ هُنَاكَ؟` Mantenha
          `أَنْ` antes do verbo de ação.
  - subskill_id: obligation
    explanation: Um prazo ou acordo pode tornar uma ação necessária. O árabe padrão moderno usa `يَجِبُ أَنْ`
      seguido de um verbo para expressar exigência. O verbo seguinte identifica quem deve agir. Aqui, devolver
      uma chave é responsabilidade de quem fala.
    examples:
      - text: يَجِبُ أَنْ أُعِيدَ الْمِفْتَاحَ الْيَوْمَ.
        meaning: "**O exemplo.** Tenho que devolver a chave hoje. `يَجِبُ` expressa necessidade. `أَنْ أُعِيدَ` nomeia
          minha ação de devolver. `الْمِفْتَاحَ` é a chave devolvida, e `الْيَوْمَ` é hoje. A marca de
          primeira pessoa está em `أُعِيدَ`, não em `يَجِبُ`."
        note: >-
          **Mude o prazo.** Use `غَدًا` para amanhã.


          **Experimente.** Passe o prazo para amanhã. Resposta: `يَجِبُ أَنْ أُعِيدَ الْمِفْتَاحَ غَدًا`.
          Conserve a ação e troque apenas a expressão temporal.
  - subskill_id: possibility
    explanation: Quando um resultado é incerto, você pode mencioná-lo sem afirmá-lo como fato. `رُبَّمَا`
      significa « talvez » e pode introduzir essa possibilidade. O trem pode atrasar, mas também pode chegar
      no horário.
    examples:
      - text: رُبَّمَا يَتَأَخَّرُ الْقِطَارُ.
        meaning: "**O exemplo.** O trem pode atrasar. `رُبَّمَا` significa talvez. `يَتَأَخَّرُ` nomeia o atraso;
          `الْقِطَارُ` é o trem. Neste exemplo, o verbo vem antes do sujeito. `رُبَّمَا` qualifica a afirmação
          sem dizer que o atraso ocorrerá com certeza."
        note: >-
          **Compare.** Sem `رُبَّمَا`, `يَتَأَخَّرُ الْقِطَارُ` afirma que o trem atrasa, com a leitura
          temporal dada pelo contexto.


          **Experimente.** Qual palavra deixa a afirmação inicial incerta? Resposta: `رُبَّمَا`.
  - subskill_id: certainty
    explanation: Você pode dizer que ainda não está pronto para confirmar uma afirmação. `لَسْتُ مُتَأَكِّدًا` ou
      `لَسْتُ مُتَأَكِّدَةً` significa « não tenho certeza ». O adjetivo concorda com quem fala; o exemplo usa
      o feminino. Isso expressa incerteza, não discordância.
    examples:
      - text: لَسْتُ مُتَأَكِّدَةً مِنْ ذٰلِكَ.
        meaning: "**O exemplo.** `لَسْتُ` significa « não estou ». `مُتَأَكِّدَةً` expressa « certa » com a forma
          feminina exigida aqui; `مِنْ ذٰلِكَ` significa « sobre isso ». Na escrita padrão totalmente
          vocalizada, o adjetivo tem terminação de acusativo depois de `لَسْتُ`."
        note: >-
          **Mude quem fala.** O masculino produz `لَسْتُ مُتَأَكِّدًا مِنْ ذٰلِكَ`. `لَسْتُ` continua igual
          para « eu ».


          **Experimente.** Que parte retoma a afirmação anterior? Resposta: `مِنْ ذٰلِكَ`. Não ter certeza não
          significa afirmar que a ideia é falsa.
