    disposition: supplement
    text: Recognize بَقْدَرْ, مُمْكِنْ, لَازِمْ and colloquial confidence predicates. Northern forms
      such as فِينِي can also express capability; do not restrict the whole declared Levantine
      variety to the Southern examples.
