language: arabic
skill_id: possibilities_constraints
guidance: Recognize ability, permission, obligation, possibility and confidence. Capability and
  permission can share an expression, with the exchange identifying which is intended. A
  deadline can ground an obligation. A possibility expression weakens commitment to a
  proposition, while uncertainty wording reports limited confidence. A contextual grant of
  permission can be short. A copied modal without a recoverable action or proposition is absent.
  A polite ability-shaped request does not necessarily assert the listener’s skill. Do not turn
  ambiguity between two successful subtypes within this group into uncertainty about whether any
  group function occurred. Distinguish prohibition, inability and lack of necessity. Evaluate
  negation and following verb forms in the selected variety, and do not require a formal modal
  construction in colloquial speech.
