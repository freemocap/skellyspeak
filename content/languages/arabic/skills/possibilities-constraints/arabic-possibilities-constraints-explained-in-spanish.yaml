sections:
  - subskill_id: ability
    explanation: Describir una capacidad es decir qué puede hacer alguien. En árabe estándar moderno,
      `أَسْتَطِيعُ` significa puedo. Puede ir seguido de `أَنْ` y un verbo que nombra la acción. El
      ejemplo trata de la capacidad de nadar.
    examples:
      - text: أَسْتَطِيعُ أَنْ أَسْبَحَ.
        meaning: "**El ejemplo.** Puedo nadar. `أَسْتَطِيعُ` significa puedo; `أَنْ` introduce la acción y
          `أَسْبَحَ` significa que nado en esta construcción. Los dos verbos se refieren a la misma
          primera persona, así que no hace falta añadir `أَنَا`, yo."
        note: >-
          **Observa la forma.** Después de `أَنْ`, este verbo termina en una a breve en la escritura
          plenamente vocalizada: `أَسْبَحَ`. Sigue marcado para yo; no es una forma de diccionario
          invariable.


          **Practica.** Identifica la palabra que une capacidad y acción. Respuesta: `أَنْ`.
  - subskill_id: permission
    explanation: Antes de usar un lugar o una pertenencia ajena quizá necesites preguntar si te dejan
      hacerlo. `هَلْ يُمْكِنُنِي` permite preguntar si puedo en árabe estándar moderno. En el
      ejemplo, quien habla solicita permiso para sentarse aquí.
    examples:
      - text: هَلْ يُمْكِنُنِي أَنْ أَجْلِسَ هُنَا؟
        meaning: "**El ejemplo.** ¿Puedo sentarme aquí? `هَلْ` inicia una pregunta de sí o no. En
          `يُمْكِنُنِي`, la terminación `نِي` se refiere a mí. `أَنْ أَجْلِسَ` indica la acción de
          sentarse y `هُنَا` significa aquí."
        note: >-
          **Cambia el lugar.** Sustituye `هُنَا` por `هُنَاكَ` para allí. La estructura de permiso
          se mantiene.


          **Practica.** Pide sentarte allí. Respuesta: `هَلْ يُمْكِنُنِي أَنْ أَجْلِسَ هُنَاكَ؟`
          Conserva `أَنْ` antes del verbo de acción.
  - subskill_id: obligation
    explanation: Un plazo o un acuerdo puede hacer necesaria una acción. El árabe estándar moderno usa
      `يَجِبُ أَنْ` seguido de un verbo para expresar un requisito. Ese verbo indica quién debe
      actuar. Aquí devolver una llave corresponde a quien habla.
    examples:
      - text: يَجِبُ أَنْ أُعِيدَ الْمِفْتَاحَ الْيَوْمَ.
        meaning: "**El ejemplo.** Debo devolver la llave hoy. `يَجِبُ` expresa necesidad. `أَنْ أُعِيدَ`
          nombra mi acción de devolver. `الْمِفْتَاحَ` es la llave y `الْيَوْمَ`, hoy. La marca de
          primera persona está en `أُعِيدَ`, no en `يَجِبُ`."
        note: >-
          **Cambia el plazo.** Usa `غَدًا` para mañana.


          **Practica.** Pasa el plazo a mañana. Respuesta: `يَجِبُ أَنْ أُعِيدَ الْمِفْتَاحَ غَدًا`.
          Mantén la misma acción y sustituye solo la expresión temporal.
  - subskill_id: possibility
    explanation: Si un resultado es incierto, puedes mencionarlo sin afirmarlo como hecho. `رُبَّمَا`
      significa quizá e introduce esa posibilidad. El ejemplo contempla que el tren se retrase, pero
      también deja abierta su puntualidad.
    examples:
      - text: رُبَّمَا يَتَأَخَّرُ الْقِطَارُ.
        meaning: "**El ejemplo.** Puede que el tren llegue tarde. `رُبَّمَا` significa quizá. `يَتَأَخَّرُ`
          nombra el retraso y `الْقِطَارُ` es el tren. Aquí el verbo precede al sujeto. `رُبَّمَا`
          reduce la certeza sin decir que el retraso ocurrirá."
        note: >-
          **Compara.** Sin `رُبَّمَا`, `يَتَأَخَّرُ الْقِطَارُ` afirma que el tren se retrasa o
          llega tarde, con la referencia temporal dada por el contexto.


          **Practica.** ¿Qué palabra vuelve tentativa la afirmación inicial? Respuesta: `رُبَّمَا`.
  - subskill_id: certainty
    explanation: Puedes decir que todavía no puedes confirmar una afirmación. `لَسْتُ مُتَأَكِّدًا` o
      `لَسْتُ مُتَأَكِّدَةً` significa no estoy seguro o segura. El adjetivo concuerda con quien
      habla; el ejemplo usa femenino. Expresa incertidumbre, no desacuerdo.
    examples:
      - text: لَسْتُ مُتَأَكِّدَةً مِنْ ذٰلِكَ.
        meaning: "**El ejemplo.** `لَسْتُ` significa no estoy. `مُتَأَكِّدَةً` es segura en femenino; `مِنْ
          ذٰلِكَ` significa sobre eso. El adjetivo lleva acusativo después de `لَسْتُ` en el árabe
          estándar plenamente vocalizado."
        note: >-
          **Cambia de hablante.** Con un hombre se usa `لَسْتُ مُتَأَكِّدًا مِنْ ذٰلِكَ`. `لَسْتُ`
          sigue igual para yo.


          **Practica.** ¿Qué parte remite a la afirmación anterior? Respuesta: `مِنْ ذٰلِكَ`. Dudar
          no implica declarar que sea falsa.
