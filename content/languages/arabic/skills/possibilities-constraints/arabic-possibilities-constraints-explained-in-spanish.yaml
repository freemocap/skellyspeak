variety_sections:
  arabic-levantine:
    - subskill_id: ability
      explanation: Hablar de capacidad permite explicar qué puedes hacer, sea una destreza aprendida o
        algo posible en esa situación. Una expresión levantina habitual para puedo es `بَقْدَرْ`,
        seguida de un verbo que nombra la actividad. Aquí se trata de nadar.
      examples:
        - text: بَقْدَرْ أَسْبَحْ.
          meaning: "**El ejemplo.** Puedo nadar. `بَقْدَرْ` significa puedo. `أَسْبَحْ` indica la acción sin
            el prefijo b habitual del presente. Ambos verbos se unen directamente y se refieren a la
            misma persona."
          note: >-
            **Conserva el patrón.** El prefijo de `بَقْدَرْ` no se copia al verbo siguiente. Hay
            alternativas regionales, entre ellas la septentrional `فِينِي` para puedo.


            **Practica.** ¿Qué parte nombra la actividad? Respuesta: `أَسْبَحْ`. La capacidad sola
            no informa de lo que sabes hacer.
    - subskill_id: permission
      explanation: Para obtener el acuerdo de alguien antes de actuar, `مُمْكِنْ` puede introducir una
        pregunta de permiso. Al hablar de un asiento libre, `مُمْكِنْ أَقْعُدْ هُونْ؟` pregunta si
        puedes sentarte aquí. Conviene preguntar a alguien que pueda decidir sobre ese asiento.
      examples:
        - text: مُمْكِنْ أَقْعُدْ هُونْ؟
          meaning: "**El ejemplo.** ¿Puedo sentarme aquí? `مُمْكِنْ` introduce el permiso; `أَقْعُدْ`
            identifica mi acción de sentarme y `هُونْ` significa aquí. La entonación interrogativa y
            esperar la respuesta hacen de la frase una petición."
          note: >-
            **Observa el segundo verbo.** Después de `مُمْكِنْ` en este patrón, la acción no lleva
            el prefijo b habitual. El verbo identifica qué harías y la expresión de lugar, dónde.


            **Practica.** ¿Qué palabra sitúa el asiento? Respuesta: `هُونْ`.
    - subskill_id: obligation
      explanation: Un objeto prestado puede tener que devolverse a una hora acordada. El árabe levantino
        usa `لَازِمْ` más un verbo para indicar que una acción es necesaria. El verbo expresa quién
        debe hacerla. Aquí quien habla tiene que devolver una llave hoy.
      examples:
        - text: لَازِمْ أَرَجِّعْ الْمِفْتَاحْ الْيَوْمْ.
          meaning: "**El ejemplo.** Debo devolver la llave hoy. `لَازِمْ` expresa la obligación. `أَرَجِّعْ`
            significa devuelvo aquí; después vienen `الْمِفْتَاحْ`, la llave, y `الْيَوْمْ`, hoy. La
            consonante central duplicada de `أَرَجِّعْ` forma parte del verbo."
          note: >-
            **Conserva la construcción.** El verbo después de `لَازِمْ` no lleva aquí el prefijo b
            habitual y sigue señalando a quien actúa. La expresión de obligación se une directamente
            a la acción.


            **Practica.** Quita el plazo. Respuesta: `لَازِمْ أَرَجِّعْ الْمِفْتَاحْ`. Sigue
            existiendo la obligación, pero ya no se dice cuándo.
    - subskill_id: possibility
      explanation: Puede que oigas hablar de un retraso antes de que se confirme. En esta situación,
        `يُمْكِنْ` significa quizá y permite mencionarlo sin presentarlo como seguro. El ejemplo
        trata de lo que podría sucederle al tren.
      examples:
        - text: يُمْكِنْ الْقِطَارْ يِتْأَخَّرْ.
          meaning: "**El ejemplo.** Puede que el tren llegue tarde. Aquí `يُمْكِنْ` funciona como quizá.
            `الْقِطَارْ` aparece antes de `يِتْأَخَّرْ`, el retraso. Interpreta toda la frase como
            posibilidad, no como capacidad del tren."
          note: >-
            **Usa el contexto.** Sirve para hablar de un retraso sin confirmar. No es una pregunta
            que solicite permiso.


            **Practica.** Alguien entiende que el retraso es seguro. ¿Qué palabra debes señalar?
            Respuesta: `يُمْكِنْ`; quien habla dejó abierto el resultado.
    - subskill_id: certainty
      explanation: Si no puedes confirmar algo que han dicho, puedes expresar incertidumbre con `أَنَا
        مِشْ مُتْأَكِّدِة`. Significa no estoy segura y el femenino concuerda con la hablante. Deja
        abierta la cuestión sin declarar equivocada a la otra persona.
      examples:
        - text: أَنَا مِشْ مُتْأَكِّدِة مِنْ هَادْ.
          meaning: "**El ejemplo.** `أَنَا` es yo, `مِشْ` niega el adjetivo y `مُتْأَكِّدِة` describe a la
            hablante como segura en femenino. `مِنْ هَادْ` remite a ese asunto. Esta estructura
            presente no tiene una palabra separada equivalente al estoy español."
          note: >-
            **Negación.** `مِشْ` niega el adjetivo. Sin esa palabra, la hablante dice que está
            segura.


            **Practica.** ¿Qué palabra quitarías para expresar certeza? Respuesta: `مِشْ`.
