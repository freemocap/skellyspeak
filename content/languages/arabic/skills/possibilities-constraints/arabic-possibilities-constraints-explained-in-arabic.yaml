sections:
  - subskill_id: ability
    explanation: عندما تصف قدرةً، تذكر ما يستطيع شخص فعله. في العربية الفصحى المعاصرة تعني `أَسْتَطِيعُ`
      «أنا قادر». قد تتبعها `أَنْ` وفعل يسمّي العمل. يصف المثال قدرة المتحدث على السباحة.
    examples:
      - text: أَسْتَطِيعُ أَنْ أَسْبَحَ.
        meaning: "**المثال.** أستطيع السباحة. تعني `أَسْتَطِيعُ` أنني قادر؛ وتقدّم `أَنْ` الفعل؛ وتعني
          `أَسْبَحَ` أنني أسبح في هذا التركيب. يحدد الفعلان فاعلًا واحدًا هو المتكلم، فلا حاجة إلى
          `أَنَا` منفصلة."
        note: >-
          **لاحظ الصيغة.** بعد `أَنْ` ينتهي هذا الفعل بفتحة قصيرة في الكتابة المشكولة: `أَسْبَحَ`.
          لا يزال يدل على المتكلم؛ وليس صيغة معجمية ثابتة.


          **جرّب.** حدد الكلمة التي تصل القدرة بالفعل. الإجابة: `أَنْ`.
  - subskill_id: permission
    explanation: قبل استعمال مساحة شخص أو ممتلكاته، قد تحتاج إلى سؤال هل الفعل مسموح. تتيح `هَلْ
      يُمْكِنُنِي` السؤال «هل يمكنني؟» في الفصحى المعاصرة. يريد المتحدث في المثال الإذن بالجلوس في
      موضع محدد.
    examples:
      - text: هَلْ يُمْكِنُنِي أَنْ أَجْلِسَ هُنَا؟
        meaning: "**المثال.** هل يمكنني الجلوس هنا؟ تبدأ `هَلْ` سؤال نعم أو لا. وتشير النهاية `نِي` في
          `يُمْكِنُنِي` إليّ. وتقدّم `أَنْ أَجْلِسَ` الفعل، أي الجلوس، وتعني `هُنَا` «هنا»."
        note: >-
          **غيّر المكان.** استبدل `هُنَا` بـ`هُنَاكَ` لـ«هناك». يبقى نمط الإذن كما هو.


          **جرّب.** اطلب الجلوس هناك. الإجابة: `هَلْ يُمْكِنُنِي أَنْ أَجْلِسَ هُنَاكَ؟` أبقِ `أَنْ`
          قبل فعل العمل.
  - subskill_id: obligation
    explanation: قد يجعل موعد نهائي أو اتفاق فعلًا ضروريًا. تستعمل الفصحى المعاصرة `يَجِبُ أَنْ` متبوعةً
      بفعل للتعبير عن الإلزام. يحدد الفعل التالي من يجب أن يتصرف. إعادة المفتاح هنا مسؤولية المتحدث.
    examples:
      - text: يَجِبُ أَنْ أُعِيدَ الْمِفْتَاحَ الْيَوْمَ.
        meaning: "**المثال.** يجب أن أعيد المفتاح اليوم. تعبّر `يَجِبُ` عن الضرورة. تسمّي `أَنْ أُعِيدَ`
          فعلي: إعادة شيء. `الْمِفْتَاحَ` هو المفتاح المعاد، و`الْيَوْمَ` اليوم. تظهر علامة المتكلم
          على `أُعِيدَ` لا على `يَجِبُ`."
        note: >-
          **غيّر الموعد.** استعمل `غَدًا` للغد.


          **جرّب.** انقل الموعد إلى الغد. الإجابة: `يَجِبُ أَنْ أُعِيدَ الْمِفْتَاحَ غَدًا`. أبقِ
          الفعل نفسه واستبدل تعبير الوقت فقط.
  - subskill_id: possibility
    explanation: عندما تكون النتيجة غير مؤكدة، يمكنك ذكرها من غير عرضها حقيقةً. تعني `رُبَّمَا` «ربما»
      وقد تقدّم هذا الاحتمال. يجيز المثال تأخر القطار ويترك إمكان وصوله في الوقت المحدد.
    examples:
      - text: رُبَّمَا يَتَأَخَّرُ الْقِطَارُ.
        meaning: "**المثال.** ربما يتأخر القطار. تعني `رُبَّمَا` «ربما». تسمّي `يَتَأَخَّرُ` التأخر؛
          و`الْقِطَارُ` هو القطار. يسبق الفعل الفاعل في هذا المثال. تقيّد `رُبَّمَا` الجملة من غير
          الجزم بتأخر القطار."
        note: >-
          **قارن.** من دون `رُبَّمَا`، تقول `يَتَأَخَّرُ الْقِطَارُ` إن القطار يتأخر، ويحدد السياق
          زمن العبارة.


          **جرّب.** أي كلمة تجعل القول الأصلي غير جازم؟ الإجابة: `رُبَّمَا`.
  - subskill_id: certainty
    explanation: يمكنك إخبار شخص أنك غير مستعد لتأكيد قول. تعني `لَسْتُ مُتَأَكِّدًا` أو `لَسْتُ
      مُتَأَكِّدَةً` أنك غير متأكد. تطابق الصفة المتحدث؛ ويستعمل المثال صيغة التأنيث. تعبّر عن الشك
      لا عن الخلاف.
    examples:
      - text: لَسْتُ مُتَأَكِّدَةً مِنْ ذٰلِكَ.
        meaning: "**المثال.** تعني `لَسْتُ` «لست». و`مُتَأَكِّدَةً` «متأكدة» بصيغة التأنيث المطلوبة هنا؛
          وتعني `مِنْ ذٰلِكَ` «من ذلك». تحمل الصفة علامة النصب بعد `لَسْتُ` في الفصحى المشكولة
          كليًا."
        note: >-
          **غيّر المتحدث.** تعطي صيغة التذكير `لَسْتُ مُتَأَكِّدًا مِنْ ذٰلِكَ`. تبقى `لَسْتُ` نفسها
          للمتكلم.


          **جرّب.** أي جزء يعود إلى الادعاء السابق؟ الإجابة: `مِنْ ذٰلِكَ`. لا يعني الشك أن الادعاء
          خاطئ.
