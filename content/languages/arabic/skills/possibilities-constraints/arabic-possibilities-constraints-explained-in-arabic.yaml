variety_sections:
  arabic-levantine:
    - subskill_id: ability
      explanation: يساعدك الحديث عن القدرة على شرح ما تستطيع فعله، سواء كان مهارة مكتسبة أو شيئًا تسمح به
        الظروف. من التعابير الشامية الشائعة لمعنى «أستطيع» `بَقْدَرْ`. يتبعها فعل يسمّي النشاط. يقول
        المتحدث هنا إنه يستطيع السباحة.
      examples:
        - text: بَقْدَرْ أَسْبَحْ.
          meaning: "**المثال.** أستطيع السباحة. تعني `بَقْدَرْ` «أستطيع». تقدّم `أَسْبَحْ` الفعل من غير باء
            المضارع المعتادة. يرتبط الفعلان مباشرة ويعودان إلى الشخص نفسه."
          note: >-
            **أبقِ النمط متصلًا.** لا يعني وجود الباء في `بَقْدَرْ` أن تكررها على الفعل التالي. توجد
            بدائل إقليمية، منها `فِينِي` الشمالية لمعنى «أستطيع».


            **جرّب.** أي جزء يسمّي النشاط؟ الإجابة: `أَسْبَحْ`. لا يخبر تعبير القدرة وحده المستمع
            بما تستطيع فعله.
    - subskill_id: permission
      explanation: عندما تريد موافقة شخص قبل أن تتصرف، قد تقدّم `مُمْكِنْ` سؤال إذن. في حديث عن مقعد شاغر،
        تسأل `مُمْكِنْ أَقْعُدْ هُونْ؟` هل يجوز لك الجلوس هنا. ينبغي أن يكون المخاطَب قادرًا على
        اتخاذ قرار بشأن المقعد.
      examples:
        - text: مُمْكِنْ أَقْعُدْ هُونْ؟
          meaning: "**المثال.** هل يمكنني الجلوس هنا؟ تقدّم `مُمْكِنْ` سؤال الإذن؛ وتحدد `أَقْعُدْ` فعلي، أي
            الجلوس؛ وتعني `هُونْ` «هنا». تجعل نبرة السؤال وانتظار رد المستمع العبارةَ طلبًا."
          note: >-
            **لاحظ الفعل الثاني.** بعد `مُمْكِنْ` في هذا النمط، استعمل الفعل من غير باء المضارع
            المعتادة. يحدد الفعل العمل وتخبر كلمة المكان المستمع أين.


            **جرّب.** أي كلمة تحدد موضع المقعد؟ الإجابة: `هُونْ`.
    - subskill_id: obligation
      explanation: قد يلزم رد غرض مستعار في وقت متفق عليه. تستعمل الشامية `لَازِمْ` متبوعةً بفعل لتقول إن
        العمل ضروري. يحدد الفعل من ينبغي أن يقوم به. يحتاج المتحدث في المثال إلى إعادة مفتاح اليوم.
      examples:
        - text: لَازِمْ أَرَجِّعْ الْمِفْتَاحْ الْيَوْمْ.
          meaning: "**المثال.** يجب أن أعيد المفتاح اليوم. تعبّر `لَازِمْ` عن الإلزام. وتعني `أَرَجِّعْ`
            «أعيد» هنا، وتتبعها `الْمِفْتَاحْ`، أي المفتاح، و`الْيَوْمْ`، أي اليوم. ينتمي تشديد
            الصامت الأوسط في `أَرَجِّعْ` إلى صيغة هذا الفعل."
          note: >-
            **أبقِ التركيب.** لا يأخذ الفعل بعد `لَازِمْ` هنا باء المضارع المعتادة. ومع ذلك يحدد من
            يقوم بالفعل. يرتبط تعبير الإلزام بالفعل مباشرة.


            **جرّب.** احذف الموعد النهائي. الإجابة: `لَازِمْ أَرَجِّعْ الْمِفْتَاحْ`. يبقى الإلزام
            لكن الجملة لا تحدد متى.
    - subskill_id: possibility
      explanation: قد تسمع باحتمال تأخير قبل تأكيده. تعني `يُمْكِنْ` في هذا الموقف «ربما» وتتيح ذكر
        التأخير من غير الجزم به. المثال خبر عما قد يحدث للقطار.
      examples:
        - text: يُمْكِنْ الْقِطَارْ يِتْأَخَّرْ.
          meaning: "**المثال.** قد يتأخر القطار. تعمل `يُمْكِنْ` هنا بمعنى «ربما». تسبق `الْقِطَارْ` الفعلَ
            `يِتْأَخَّرْ`. افهمها احتمالًا يتعلق بالحدث كله، لا ادعاءً بشأن قدرة القطار."
          note: >-
            **استعن بالسياق.** تفيد العبارة عند مناقشة تأخير غير مؤكد. وهي ليست بذاتها سؤالًا يطلب
            إذن شخص.


            **جرّب.** يعامل شخص الجملة خبرًا مؤكدًا عن التأخير. أي كلمة تشير إليها؟ الإجابة:
            `يُمْكِنْ`؛ فقد ترك المتحدث النتيجة مفتوحة.
    - subskill_id: certainty
      explanation: عندما لا تستطيع تأكيد قول شخص، يمكنك وصف شكك بـ`أَنَا مِشْ مُتْأَكِّدِة`. تعني أن
        المتحدثة غير متأكدة بصيغة التأنيث. تترك السؤال مفتوحًا بدل القول إن الآخر مخطئ.
      examples:
        - text: أَنَا مِشْ مُتْأَكِّدِة مِنْ هَادْ.
          meaning: "**المثال.** تعني `أَنَا` «أنا»، وتنفي `مِشْ` الصفة، وتصف `مُتْأَكِّدِة` المتحدثة باليقين
            بصيغة التأنيث. تعود `مِنْ هَادْ` إلى الأمر المذكور. لا توجد في هذا النمط الحاضر كلمة
            منفصلة تقابل «am» الإنجليزية."
          note: |-
            **النفي.** تنفي `مِشْ` الصفة. من دونها تقول المتحدثة إنها متأكدة.

            **تدرّب.** أي كلمة تحذفها للتعبير عن اليقين؟ الإجابة: `مِشْ`.
