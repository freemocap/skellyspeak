varieties:
  arabic-levantine:
    disposition: supplement
    text: The examples use Southern Levantine بَقْدَرْ for capability. Northern expressions such as
      فِينِي also occur. Context distinguishes capability, permission and requests.
    provenance: *a1
  arabic-modern-standard:
    disposition: supplement
    text: Modern Standard has formal capability and necessity constructions. لَسْتُ negates a
      nominal predicate for a first-person speaker.
    provenance: *a1
