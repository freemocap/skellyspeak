variety_sections:
  arabic-levantine:
    - subskill_id: ability
      explanation: Talking about ability lets you explain what you can do, whether it is a learned skill
        or something possible in the situation. A common Levantine expression for ‘I can’ is
        `بَقْدَرْ`. It is followed by a verb naming the activity. Here, the speaker says they can
        swim.
      examples:
        - text: بَقْدَرْ أَسْبَحْ.
          meaning: "**The example.** “I can swim.” `بَقْدَرْ` means I can. `أَسْبَحْ` gives the action
            without the ordinary present-tense b-prefix. The two verbs connect directly and
            refer to the same person."
          note: >-
            **Keep the pattern together.** The prefix on `بَقْدَرْ` does not mean you should copy it
            onto the following verb. Regional alternatives exist, including Northern `فِينِي` for I
            can.


            **Try it.** Which part names the activity? Answer: `أَسْبَحْ`. The ability expression
            alone does not tell the listener what you can do.
    - subskill_id: permission
      explanation: When you want someone's agreement before acting, `مُمْكِنْ` can introduce a permission
        question. In a conversation about a free seat, `مُمْكِنْ أَقْعُدْ هُونْ؟` asks whether you
        may sit here. The person you ask should be someone who can decide about the seat.
      examples:
        - text: مُمْكِنْ أَقْعُدْ هُونْ؟
          meaning: "**The example.** “May I sit here?” `مُمْكِنْ` introduces the permission question;
            `أَقْعُدْ` identifies my action, sit; `هُونْ` means here. Question intonation and
            waiting for the listener's answer make this a request."
          note: >-
            **Notice the second verb.** After `مُمْكِنْ` in this pattern, use the action without its
            ordinary b-prefix. The verb identifies the action and the place word tells the listener
            where.


            **Try it.** Which word locates the seat? Answer: `هُونْ`.
    - subskill_id: obligation
      explanation: A borrowed item may need to be returned by an agreed time. Levantine Arabic uses
        `لَازِمْ` followed by a verb to say that an action is necessary. The verb tells you who has
        to do it. In the example, the speaker needs to return a key today.
      examples:
        - text: لَازِمْ أَرَجِّعْ الْمِفْتَاحْ الْيَوْمْ.
          meaning: "**The example.** “I must return the key today.” `لَازِمْ` expresses the requirement.
            `أَرَجِّعْ` means I return something here, followed by `الْمِفْتَاحْ`, the key, and
            `الْيَوْمْ`, today. The doubled middle consonant in `أَرَجِّعْ` belongs to this verb
            form."
          note: >-
            **Keep the construction.** The verb after `لَازِمْ` here has no ordinary b-prefix. It
            still tells you who acts. The requirement expression connects directly to the action.


            **Try it.** Remove the deadline. Answer: `لَازِمْ أَرَجِّعْ الْمِفْتَاحْ`. The
            requirement remains, but the sentence no longer says when.
    - subskill_id: possibility
      explanation: You may hear about a possible delay before it is confirmed. In this situation,
        `يُمْكِنْ` means ‘maybe’ and lets you mention the delay without claiming it is certain. The
        example is a statement about what might happen to the train.
      examples:
        - text: يُمْكِنْ الْقِطَارْ يِتْأَخَّرْ.
          meaning: "**The example.** “The train may be late.” `يُمْكِنْ` works as maybe here. `الْقِطَارْ`
            comes before `يِتْأَخَّرْ`, the action. Read this as a possibility about the whole
            event, not as a claim about the train's ability."
          note: >-
            **Use the context.** This is useful when discussing an unconfirmed delay. It is not
            itself a question asking anyone's permission.


            **Try it.** Someone treats the sentence as a confirmed delay. Which word should you
            point to? Answer: `يُمْكِنْ`; the speaker left the outcome open.
    - subskill_id: certainty
      explanation: When you cannot confirm what someone has said, you can describe your uncertainty with
        `أَنَا مِشْ مُتْأَكِّدِة`. This means ‘I am not sure’ with feminine agreement for the
        speaker. It leaves the question open instead of declaring the other person wrong.
      examples:
        - text: أَنَا مِشْ مُتْأَكِّدِة مِنْ هَادْ.
          meaning: "**The example.** `أَنَا` is I, `مِشْ` negates the adjective, and `مُتْأَكِّدِة` describes
            the speaker as sure using feminine agreement. `مِنْ هَادْ` points back to that matter.
            This present-time pattern has no separate word for English “am.”"
          note: |-
            **Negation.** `مِشْ` negates the adjective. Without it, the speaker says she is sure.

            **Practice.** Which word would you remove to express certainty? Answer: `مِشْ`.
