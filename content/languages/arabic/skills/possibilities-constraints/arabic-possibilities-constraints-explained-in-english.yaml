sections:
  - subskill_id: ability
    explanation: When you describe an ability, you say what someone is capable of doing. In Modern
      Standard Arabic, `أَسْتَطِيعُ` means ‘I am able’. It can be followed by `أَنْ` and a verb
      naming the action. The example describes the speaker's ability to swim.
    examples:
      - text: أَسْتَطِيعُ أَنْ أَسْبَحَ.
        meaning: "**The example.** “I can swim.” `أَسْتَطِيعُ` means I am able; `أَنْ` introduces the
          action; `أَسْبَحَ` means that I swim in this construction. The two verbs identify the same
          first-person subject, so a separate `أَنَا`, I, is unnecessary."
        note: >-
          **Notice the form.** After `أَنْ`, this verb ends in a short a-vowel in fully vocalized
          writing: `أَسْبَحَ`. It is still marked for I; it is not an unchanged dictionary form.


          **Try it.** Identify the word joining ability to action. Answer: `أَنْ`.
  - subskill_id: permission
    explanation: Before using someone else's space or belongings, you may need to ask whether an action
      is allowed. `هَلْ يُمْكِنُنِي` provides a way to ask ‘May I…?’ in Modern Standard Arabic. In
      the example, the speaker wants permission to sit in a particular place.
    examples:
      - text: هَلْ يُمْكِنُنِي أَنْ أَجْلِسَ هُنَا؟
        meaning: "**The example.** “May I sit here?” `هَلْ` opens a yes/no question. In `يُمْكِنُنِي`, the
          ending `نِي` refers to me. `أَنْ أَجْلِسَ` supplies the action, to sit, and `هُنَا` means
          here."
        note: >-
          **Change the place.** Replace `هُنَا` with `هُنَاكَ` for there. The permission pattern
          stays intact.


          **Try it.** Ask to sit there. Answer: `هَلْ يُمْكِنُنِي أَنْ أَجْلِسَ هُنَاكَ؟` Keep
          `أَنْ` before the action verb.
  - subskill_id: obligation
    explanation: A deadline or an agreement can make an action necessary. Modern Standard Arabic uses
      `يَجِبُ أَنْ` followed by a verb to express a requirement. The verb that follows identifies
      who must act. Here, returning a key is the speaker's responsibility.
    examples:
      - text: يَجِبُ أَنْ أُعِيدَ الْمِفْتَاحَ الْيَوْمَ.
        meaning: "**The example.** “I must return the key today.” `يَجِبُ` states necessity. `أَنْ أُعِيدَ`
          names my action: returning something. `الْمِفْتَاحَ` is the key being returned, and
          `الْيَوْمَ` is today. The I-person marking is on `أُعِيدَ`, not on `يَجِبُ`."
        note: >-
          **Change the deadline.** Use `غَدًا` for tomorrow.


          **Try it.** Move the deadline to tomorrow. Answer: `يَجِبُ أَنْ أُعِيدَ الْمِفْتَاحَ
          غَدًا`. Keep the action the same and replace only the time expression.
  - subskill_id: possibility
    explanation: When an outcome is uncertain, you can mention it without presenting it as a fact.
      `رُبَّمَا` means ‘perhaps’ and can introduce that possibility. The example allows for a late
      train while leaving open the possibility that it will be on time.
    examples:
      - text: رُبَّمَا يَتَأَخَّرُ الْقِطَارُ.
        meaning: "**The example.** “The train may be late.” `رُبَّمَا` means perhaps. `يَتَأَخَّرُ` names
          being late; `الْقِطَارُ` is the train. This example places the verb before the subject.
          `رُبَّمَا` qualifies the statement without saying that the train definitely will be late."
        note: >-
          **Compare.** Without `رُبَّمَا`, `يَتَأَخَّرُ الْقِطَارُ` states that the train is late or
          gets delayed, with the time reading supplied by context.


          **Try it.** Which word makes the original statement tentative? Answer: `رُبَّمَا`.
  - subskill_id: certainty
    explanation: You can tell someone that you are not ready to confirm a claim. `لَسْتُ مُتَأَكِّدًا`
      or `لَسْتُ مُتَأَكِّدَةً` means ‘I am not sure’. The adjective agrees with the speaker; the
      example uses feminine agreement. It expresses uncertainty, not disagreement.
    examples:
      - text: لَسْتُ مُتَأَكِّدَةً مِنْ ذٰلِكَ.
        meaning: "**The example.** `لَسْتُ` means I am not. `مُتَأَكِّدَةً` is sure, in the feminine form
          required here; `مِنْ ذٰلِكَ` means about that. The adjective has an accusative ending
          after `لَسْتُ` in fully vocalized Standard Arabic."
        note: >-
          **Change the speaker.** Masculine agreement gives `لَسْتُ مُتَأَكِّدًا مِنْ ذٰلِكَ`.
          `لَسْتُ` stays the same for I.


          **Try it.** Which part points back to the previous claim? Answer: `مِنْ ذٰلِكَ`. Being
          unsure does not assert that the claim is false.
