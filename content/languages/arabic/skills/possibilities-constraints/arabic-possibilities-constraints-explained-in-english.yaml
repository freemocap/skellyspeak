sections:
  - subskill_id: ability
    explanation: A capability predicate can introduce the action the speaker can perform.
    examples:
      - text: أَسْتَطِيعُ أَنْ أَسْبَحَ.
        meaning: I can swim.
        note: Modern Standard Arabic. This reports ability in a discussion of swimming skills.
      - text: بَقْدَرْ أَسْبَحْ.
        meaning: I can swim.
        note: Levantine Arabic; conversational wording, with regional alternatives possible. This
          reports ability in a discussion of swimming skills.
  - subskill_id: permission
    explanation: A question about whether an action is possible can ask permission in the
      appropriate exchange.
    examples:
      - text: هَلْ يُمْكِنُنِي أَنْ أَجْلِسَ هُنَا؟
        meaning: May I sit here?
        note: Modern Standard Arabic. Ask the person responsible for the seat; the point is permission.
      - text: مُمْكِنْ أَقْعُدْ هُونْ؟
        meaning: May I sit here?
        note: Levantine Arabic; conversational wording, with regional alternatives possible. Ask the
          person responsible for the seat; the point is permission.
  - subskill_id: obligation
    explanation: An obligation expression and a following action can state a requirement.
    examples:
      - text: يَجِبُ أَنْ أُعِيدَ الْمِفْتَاحَ الْيَوْمَ.
        meaning: I must return the key today.
        note: Modern Standard Arabic. A return deadline establishes necessity.
      - text: لَازِمْ أَرَجِّعْ الْمِفْتَاحْ الْيَوْمْ.
        meaning: I must return the key today.
        note: Levantine Arabic; conversational wording, with regional alternatives possible. A return
          deadline establishes necessity.
  - subskill_id: possibility
    explanation: A possibility word can qualify a proposition without asserting that it is certain.
    examples:
      - text: رُبَّمَا يَتَأَخَّرُ الْقِطَارُ.
        meaning: The train may be late.
        note: Modern Standard Arabic. The speaker leaves the outcome open.
      - text: يُمْكِنْ الْقِطَارْ يِتْأَخَّرْ.
        meaning: The train may be late.
        note: Levantine Arabic; conversational wording, with regional alternatives possible. The speaker
          leaves the outcome open.
  - subskill_id: certainty
    explanation: A negative certainty predicate can limit confidence in a claim.
    examples:
      - text: لَسْتُ مُتَأَكِّدَةً مِنْ ذٰلِكَ.
        meaning: I am not sure about that.
        note: Modern Standard Arabic. A woman is speaking about the preceding claim.
      - text: أَنَا مِشْ مُتْأَكِّدِة مِنْ هَادْ.
        meaning: I am not sure about that.
        note: Levantine Arabic; conversational wording, with regional alternatives possible. A woman is
          speaking about the preceding claim.
