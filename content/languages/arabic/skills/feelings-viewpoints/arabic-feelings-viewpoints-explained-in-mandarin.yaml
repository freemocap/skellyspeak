variety_sections:
  arabic-levantine:
    - subskill_id: wants_intentions
      explanation: 想学习新技能，可以让别人知道你对什么感兴趣。这也可以开启关于课程的讨论，但没有声称你已经报名。
      examples:
        - text: بِدِّي أَتْعَلَّمْ السِّبَاحَة.
          meaning: "**例句。** 我想学游泳。`بِدِّي` 意为我想要；词尾指出说话人。`أَتْعَلَّمْ` 在这个从属位置表示我学习，`السِّبَاحَة` 是游泳。`بِدِّي`
            后面的动作不用普通的 b- 前缀。"
          note: 愿望形式后的动作不用通常的 b- 前缀。试一试：说我们想学游泳。答案：`بِدْنَا نِتْعَلَّمْ السِّبَاحَة`。表示愿望的词尾和学习动词都改为“我们”形式；游泳仍是要学的技能。
    - subskill_id: preferences
      explanation: 选饮料时，偏好是在比较选择，而不只是说其中一种好喝。这里茶比咖啡更合说话人的心意。
      examples:
        - text: بَحِبّ الشَّايْ أَكْتَرْ مِنْ الْقَهْوِة.
          meaning: "**例句。** 比起咖啡，我更喜欢茶。`بَحِبّ` 意为我喜欢；`الشَّايْ` 是茶。`أَكْتَرْ مِنْ` 意为比……更多，`الْقَهْوِة`
            是咖啡。这里通过比较喜欢的程度表达偏好，而不是另用一个“更喜欢”的动词。"
          note: 比较两种饮料时保留 `أَكْتَرْ مِنْ`。试一试：说你更喜欢咖啡。答案：`بَحِبّ الْقَهْوِة أَكْتَرْ مِنْ
            الشَّايْ`。对换饮料，就改变了首选；省掉比较，只会说你喜欢咖啡。
    - subskill_id: emotions
      explanation: 好消息可以改变你的心情。这句话让一位女性告诉别人消息使她高兴，而不是把消息本身描述为高兴。
      examples:
        - text: أَنَا مَبْسُوطَة بِهَادْ الْخَبَرْ.
          meaning: "**例句。** 我为这则消息感到高兴。`أَنَا` 是我，`مَبْسُوطَة` 是与女性说话人一致的高兴或满意。`بِهَادْ الْخَبَرْ`
            指因为这则消息。开头附着的介词把感受与促成它的事连起来；不需要独立的现在时“是”。"
          note: 男性说话人用 `مَبْسُوطْ`，而不是 `مَبْسُوطَة`。形容词对应高兴的人。试一试：阴性词尾描述消息吗？答案：不是；它描述说话的女性，`الْخَبَرْ` 才是她高兴的缘由。
    - subskill_id: opinions
      explanation: 大家在讨论几种解决办法。你可以把自己的判断作为个人看法说出来，让别人也能偏向另一种方案。
      examples:
        - text: بِرَأْيِي، هَادْ الْحَلّ أَحْسَنْ.
          meaning: "**例句。** 在我看来，这个办法更好。`بِرَأْيِي` 意为在我看来。`هَادْ الْحَلّ` 指这个办法，`أَحْسَنْ`
            意为更好。句中没有单独表示现在时“是”的词；办法与评价直接相连。"
          note: 保留第一人称词尾，也可以用这个开头表达另一种判断。说“更好”意味着有一个可理解的比较对象，并不代表各方面都完美。试一试：去掉 `بِرَأْيِي` 会怎样？答案：比较仍在，但明确标为个人观点的开头消失。
    - subskill_id: agreement_disagreement
      explanation: 有人提出一项建议，而你反对。点明所反对的提议，能清楚表达不同意见，又不把它变成对提议人的评价。
      examples:
        - text: أَنَا مِشْ مُوَافِقْ عَ هَادْ الِاقْتِرَاحْ.
          meaning: "**例句。** 我不同意这个提议。`أَنَا` 是我，`مِشْ` 是否定，`مُوَافِقْ` 表示赞同，这里用阳性一致形式。`عَ هَادْ الِاقْتِرَاحْ`
            指这个提议。这是以形容词作陈述，不是对普通现在时动词加否定。"
          note: 女性说话人用 `مُوَافِقَة`。否定词可能因地区而异，但本课练习 `مِشْ`。试一试：换成女性说话人。答案：`أَنَا مِشْ مُوَافِقَة عَ هَادْ
            الِاقْتِرَاحْ`；形容词改变，反对立场和所谈提议不变。
