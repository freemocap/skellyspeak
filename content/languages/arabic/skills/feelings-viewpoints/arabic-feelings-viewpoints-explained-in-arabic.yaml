variety_sections:
  arabic-levantine:
    - subskill_id: wants_intentions
      explanation: عندما تقول إنك تريد تعلّم مهارة جديدة، تخبر شخصًا بما يثير اهتمامك. قد يبدأ هذا حديثًا
        عن الدروس من غير الادعاء بأنك حجزتها بالفعل.
      examples:
        - text: بِدِّي أَتْعَلَّمْ السِّبَاحَة.
          meaning: "**المثال.** أريد تعلّم السباحة. تعني `بِدِّي` «أريد»؛ وتحدد نهايتها المتحدث. وتعني
            `أَتْعَلَّمْ` «أتعلّم» في هذا الموضع التابع، و`السِّبَاحَة` هي السباحة. يأتي الفعل بعد
            `بِدِّي` من غير باء المضارع المعتادة."
          note: "لا يأخذ الفعل بعد صيغة الرغبة باء المضارع المعتادة. **جرّب:** قل إننا نريد تعلّم السباحة.
            الإجابة: `بِدْنَا نِتْعَلَّمْ السِّبَاحَة`. تتغير لاحقة الرغبة وفعل التعلّم إلى «نحن»،
            بينما تبقى السباحة المهارة المطلوبة."
    - subskill_id: preferences
      explanation: عند اختيار مشروب، تقارن صيغة التفضيل بين الخيارات بدل القول إن أحدها لطيف فحسب. الشاي
        هنا خيار المتحدث الأول قبل القهوة.
      examples:
        - text: بَحِبّ الشَّايْ أَكْتَرْ مِنْ الْقَهْوِة.
          meaning: "**المثال.** أفضّل الشاي على القهوة. تعني `بَحِبّ` «أحب»؛ و`الشَّايْ` هو الشاي. وتعني
            `أَكْتَرْ مِنْ` «أكثر من»، و`الْقَهْوِة` القهوة. تبني الجملة التفضيل بمقارنة مقدار
            الإعجاب بدل استعمال فعل مستقل بمعنى «أفضّل»."
          note: "أبقِ `أَكْتَرْ مِنْ` لمقارنة المشروبين. **جرّب:** قل إنك تفضل القهوة على الشاي. الإجابة:
            `بَحِبّ الْقَهْوِة أَكْتَرْ مِنْ الشَّايْ`. يعكس تبديل المشروبين اختيارك؛ وبدون المقارنة
            تقول فقط إنك تحب القهوة."
    - subskill_id: emotions
      explanation: قد يغيّر الخبر السار شعورك. تتيح هذه الجملة لامرأة أن تخبر شخصًا بأنها سعيدة بالخبر،
        بدل وصف الخبر نفسه بأنه سعيد.
      examples:
        - text: أَنَا مَبْسُوطَة بِهَادْ الْخَبَرْ.
          meaning: "**المثال.** أنا سعيدة بهذا الخبر. تعني `أَنَا` «أنا»، وتعني `مَبْسُوطَة` سعيدة أو مسرورة
            مع علامة التأنيث. وتعني `بِهَادْ الْخَبَرْ` «بهذا الخبر». يصل حرف الجر المتصل الشعور بما
            أثاره؛ ولا حاجة إلى فعل منفصل في الحاضر بمعنى «am»."
          note: "يستعمل الرجل `مَبْسُوطْ` بدل `مَبْسُوطَة`. اربط الصفة بالشخص الذي يشعر بالسعادة. **جرّب:** هل
            تصف علامة التأنيث الخبر؟ الإجابة: لا؛ تصف المرأة المتحدثة، بينما يسمّي `الْخَبَرْ` سبب
            سعادتها."
    - subskill_id: opinions
      explanation: تُناقش عدة حلول. يمكنك تقديم حكمك بوصفه وجهة نظر، مع ترك المجال لشخص آخر كي يفضل حلًا
        مختلفًا.
      examples:
        - text: بِرَأْيِي، هَادْ الْحَلّ أَحْسَنْ.
          meaning: "**المثال.** في رأيي، هذا الحل أفضل. تعني `بِرَأْيِي` «في رأيي». تسمّي `هَادْ الْحَلّ` هذا
            الحل، وتعني `أَحْسَنْ` «أفضل». لا توجد كلمة منفصلة في الحاضر بمعنى «is»؛ فالحل مرتبط
            مباشرة بالحكم."
          note: "استعمل البداية مع حكم آخر، مع إبقاء لاحقة المتكلم فيها. يحتاج معنى «أفضل» إلى بديل مفهوم من
            السياق؛ ولا يعني أن كل جانب من الحل كامل. **جرّب:** احذف `بِرَأْيِي`؛ ما الذي يتغير؟
            الإجابة: تبقى المقارنة، لكن إطار الرأي الشخصي الصريح يختفي."
    - subskill_id: agreement_disagreement
      explanation: هناك اقتراح مطروح وأنت تعارضه. تجعل تسمية الاقتراح اختلافك واضحًا من غير تحويله إلى حكم
        على الشخص الذي قدّمه.
      examples:
        - text: أَنَا مِشْ مُوَافِقْ عَ هَادْ الِاقْتِرَاحْ.
          meaning: "**المثال.** لا أوافق على هذا الاقتراح. تعني `أَنَا` «أنا»، و`مِشْ` «لا»، و`مُوَافِقْ`
            موافقًا، هنا بصيغة التذكير. تشير `عَ هَادْ الِاقْتِرَاحْ` إلى هذا الاقتراح. الجملة قائمة
            على صفة، لا على نفي فعل مضارع عادي."
          note: "تستعمل المرأة `مُوَافِقَة`. قد تختلف أداة النفي إقليميًا، لكن هذا الدرس يدرّب على `مِشْ`.
            **جرّب:** غيّر المتحدث إلى امرأة. الإجابة: `أَنَا مِشْ مُوَافِقَة عَ هَادْ
            الِاقْتِرَاحْ`؛ تتغير الصفة، ويبقى الخلاف والاقتراح كما هما."
