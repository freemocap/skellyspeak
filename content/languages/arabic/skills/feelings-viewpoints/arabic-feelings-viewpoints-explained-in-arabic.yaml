sections:
  - subskill_id: wants_intentions
    explanation: عندما تقول إنك تريد تعلّم مهارة جديدة، تخبر شخصًا بما يثير اهتمامك. قد يبدأ هذا حديثًا
      عن الدروس من غير الادعاء بأنك حجزتها بالفعل.
    examples:
      - text: أُرِيدُ أَنْ أَتَعَلَّمَ السِّبَاحَةَ.
        meaning: "**المثال.** أريد تعلّم السباحة. تعني `أُرِيدُ` «أريد». تسمّي `أَنْ أَتَعَلَّمَ` الفعل
          المطلوب، أي التعلّم؛ وتعني `السِّبَاحَةَ` السباحة. يعود الفعلان إلى المتكلم، فلا حاجة إلى
          ضمير منفصل. وتقدّم `أَنْ` الفعل المرغوب."
        note: "بعد `أَنْ` ينتهي الفعل المشكول هنا بفتحة قصيرة. **جرّب:** قل إننا نريد تعلّم السباحة.
          الإجابة: `نُرِيدُ أَنْ نَتَعَلَّمَ السِّبَاحَةَ`. يتغير الفعلان إلى صيغة «نحن»؛ وتبقى
          `أَنْ` واصلةً الرغبة بفعل التعلّم."
  - subskill_id: preferences
    explanation: عند اختيار مشروب، تقارن صيغة التفضيل بين الخيارات بدل القول إن أحدها لطيف فحسب. الشاي
      هنا خيار المتحدث الأول قبل القهوة.
    examples:
      - text: أُفَضِّلُ الشَّايَ عَلَى الْقَهْوَةِ.
        meaning: "**المثال.** أفضّل الشاي على القهوة. تعني `أُفَضِّلُ` «أفضّل». تسمّي `الشَّايَ` المشروب
          المفضّل. وتقدّم `عَلَى الْقَهْوَةِ` القهوة خيارًا آخر. يهم الترتيب: يأتي المشروب المفضّل
          بعد الفعل."
        note: "يأتي المشروب المفضّل بعد `أُفَضِّلُ`، والبديل بعد `عَلَى`. **جرّب:** اعكس التفضيل. الإجابة:
          `أُفَضِّلُ الْقَهْوَةَ عَلَى الشَّايِ`. يغيّر تبادل الاسمين نهايتيهما المشكولتين لتناسبا
          موقعيهما النحويين الجديدين."
  - subskill_id: emotions
    explanation: قد يغيّر الخبر السار شعورك. تتيح هذه الجملة لامرأة أن تخبر شخصًا بأنها سعيدة بالخبر،
      بدل وصف الخبر نفسه بأنه سعيد.
    examples:
      - text: أَنَا سَعِيدَةٌ بِهٰذَا الْخَبَرِ.
        meaning: "**المثال.** أنا سعيدة بهذا الخبر. تعني `أَنَا` «أنا»، و`سَعِيدَةٌ` «سعيدة» بصيغة التأنيث.
          وتعني `بِهٰذَا الْخَبَرِ` «بهذا الخبر»: تصل `بِـ` الشعور بسبب حدوثه. لا توجد كلمة منفصلة
          في الحاضر تقابل «am» الإنجليزية."
        note: "يستعمل الرجل `أَنَا سَعِيدٌ بِهٰذَا الْخَبَرِ`. تطابق صفة الشعور المتحدث لا كلمة الخبر.
          **جرّب:** أي جزء يتغير إذا قال رجل الجملة؟ الإجابة: تصبح `سَعِيدَةٌ` هي `سَعِيدٌ`؛ وتبقى
          عبارة الخبر كما هي."
  - subskill_id: opinions
    explanation: تُناقش عدة حلول. يمكنك تقديم حكمك بوصفه وجهة نظر، مع ترك المجال لشخص آخر كي يفضل حلًا مختلفًا.
    examples:
      - text: فِي رَأْيِي، هٰذَا الْحَلُّ أَفْضَلُ.
        meaning: "**المثال.** في رأيي، هذا الحل أفضل. تعني `فِي رَأْيِي` «في رأيي»؛ وتدل اللاحقة الأخيرة على
          المتكلم. `هٰذَا الْحَلُّ` هو هذا الحل، وتعني `أَفْضَلُ` «أفضل». يُفهم الحل الآخر من
          الحديث، فلا حاجة إلى تكراره."
        note: "تؤطر البداية الحكم ولا تقدّم له دليلًا. إذا كانت البدائل غير واضحة، فسمّ الحل الذي تقارن به.
          **جرّب:** أي جزء يخبر المستمع لمن يعود هذا الحكم؟ الإجابة: `فِي رَأْيِي`، ولا سيما لاحقة
          المتكلم فيها."
  - subskill_id: agreement_disagreement
    explanation: هناك اقتراح مطروح وأنت تعارضه. تجعل تسمية الاقتراح اختلافك واضحًا من غير تحويله إلى حكم
      على الشخص الذي قدّمه.
    examples:
      - text: لَا أُوَافِقُ عَلَى هٰذَا الِاقْتِرَاحِ.
        meaning: "**المثال.** لا أوافق على هذا الاقتراح. تنفي `لَا` الفعل `أُوَافِقُ`، أي أوافق. وتعني
          `عَلَى هٰذَا الِاقْتِرَاحِ` «على هذا الاقتراح». تبقى صيغة المتكلم الفعلية واحدة سواء كان
          المتحدث رجلًا أو امرأة؛ ولا يستعمل المثال صفةً تطابق جنس المتحدث."
        note: "إذا حذفت `لَا` تحصل على الموافقة: `أُوَافِقُ عَلَى هٰذَا الِاقْتِرَاحِ`. يختلف الشك عن قولك
          إنك لا توافق. **جرّب:** أي كلمة تعكس موقفك؟ الإجابة: `لَا`؛ ويبقى الاقتراح نفسه."
