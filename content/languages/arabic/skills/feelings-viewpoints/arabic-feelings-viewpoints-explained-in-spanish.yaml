variety_sections:
  arabic-levantine:
    - subskill_id: wants_intentions
      explanation: Querer aprender una habilidad nueva comunica lo que te interesa. Puede iniciar una
        conversación sobre clases sin afirmar que ya te hayas inscrito.
      examples:
        - text: بِدِّي أَتْعَلَّمْ السِّبَاحَة.
          meaning: "**El ejemplo.** Quiero aprender a nadar. `بِدِّي` significa quiero; su terminación
            identifica a quien habla. `أَتْعَلَّمْ` significa aprendo en esta posición dependiente y
            `السِّبَاحَة` es natación. Después de `بِدِّي`, la acción aparece sin su prefijo b
            habitual."
          note: "La acción después de la expresión de deseo no lleva el prefijo b habitual. **Practica:** di
            que nosotros queremos aprender a nadar. Respuesta: `بِدْنَا نِتْعَلَّمْ السِّبَاحَة`.
            Tanto el sufijo del deseo como el verbo de aprender pasan a nosotros; nadar sigue siendo
            la habilidad deseada."
    - subskill_id: preferences
      explanation: Al elegir una bebida, una preferencia compara las opciones en vez de limitarse a decir
        que una es agradable. Aquí el té es la primera elección frente al café.
      examples:
        - text: بَحِبّ الشَّايْ أَكْتَرْ مِنْ الْقَهْوِة.
          meaning: "**El ejemplo.** Prefiero el té al café. `بَحِبّ` significa me gusta y `الشَّايْ` es té.
            `أَكْتَرْ مِنْ` significa más que y `الْقَهْوِة` es café. Esta preferencia se forma
            comparando cuánto te gustan las bebidas, sin usar un verbo independiente para preferir."
          note: "Conserva `أَكْتَرْ مِنْ` para comparar las dos bebidas. **Practica:** di que prefieres el
            café al té. Respuesta: `بَحِبّ الْقَهْوِة أَكْتَرْ مِنْ الشَّايْ`. Intercambiar las
            bebidas invierte la preferencia; sin comparación solo dirías que te gusta el café."
    - subskill_id: emotions
      explanation: Una buena noticia puede cambiar cómo te sientes. Esta oración permite a una mujer decir
        que la noticia la alegra, en vez de describir la propia noticia como feliz.
      examples:
        - text: أَنَا مَبْسُوطَة بِهَادْ الْخَبَرْ.
          meaning: "**El ejemplo.** Me alegra esta noticia. `أَنَا` es yo y `مَبْسُوطَة` significa feliz o
            contenta en femenino. `بِهَادْ الْخَبَرْ` significa por esta noticia. La preposición
            inicial unida al término conecta el sentimiento con su causa; no hace falta una palabra
            separada para el presente de estoy."
          note: "Un hombre usa `مَبْسُوطْ` en lugar de `مَبْسُوطَة`. El adjetivo describe a quien siente la
            emoción. **Practica:** ¿describe la terminación femenina a la noticia? Respuesta: no;
            describe a la mujer que habla, mientras `الْخَبَرْ` nombra el motivo de su alegría."
    - subskill_id: opinions
      explanation: Se están considerando varias soluciones. Puedes presentar tu juicio como un punto de
        vista y dejar espacio para que otra persona prefiera una solución distinta.
      examples:
        - text: بِرَأْيِي، هَادْ الْحَلّ أَحْسَنْ.
          meaning: "**El ejemplo.** En mi opinión, esta solución es mejor. `بِرَأْيِي` significa en mi
            opinión. `هَادْ الْحَلّ` nombra esta solución y `أَحْسَنْ` significa mejor. No hay un
            presente separado de es; la solución se enlaza directamente con el juicio."
          note: "Usa la introducción con otro juicio y conserva su sufijo de primera persona. Mejor requiere
            una alternativa conocida; no significa que todos los aspectos sean perfectos.
            **Practica:** quita `بِرَأْيِي`. ¿Qué cambia? Respuesta: la comparación permanece, pero
            desaparece el marco de opinión personal explícita."
    - subskill_id: agreement_disagreement
      explanation: Hay una propuesta sobre la mesa y te opones a ella. Nombrarla aclara tu desacuerdo sin
        convertirlo en un juicio sobre quien la planteó.
      examples:
        - text: أَنَا مِشْ مُوَافِقْ عَ هَادْ الِاقْتِرَاحْ.
          meaning: "**El ejemplo.** No estoy de acuerdo con esta propuesta. `أَنَا` significa yo, `مِشْ` es no
            y `مُوَافِقْ` expresa estar de acuerdo con forma masculina. `عَ هَادْ الِاقْتِرَاحْ`
            señala esta propuesta. Es una expresión con adjetivo, no la negación de un presente
            verbal habitual."
          note: "Una mujer usa `مُوَافِقَة`. La negación puede variar según la región; esta lección practica
            `مِشْ`. **Practica:** cambia la hablante a una mujer. Respuesta: `أَنَا مِشْ مُوَافِقَة
            عَ هَادْ الِاقْتِرَاحْ`; cambia el adjetivo, mientras se conservan el desacuerdo y la
            propuesta."
