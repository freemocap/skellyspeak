sections:
  - subskill_id: wants_intentions
    explanation: Querer aprender una habilidad nueva comunica lo que te interesa. Puede iniciar una
      conversación sobre clases sin afirmar que ya te hayas inscrito.
    examples:
      - text: أُرِيدُ أَنْ أَتَعَلَّمَ السِّبَاحَةَ.
        meaning: "**El ejemplo.** Quiero aprender a nadar. `أُرِيدُ` significa quiero. `أَنْ أَتَعَلَّمَ`
          nombra la acción deseada, aprender; `السِّبَاحَةَ` significa natación. Los dos verbos se
          refieren a yo, sin necesidad de un pronombre personal separado. `أَنْ` introduce la acción
          que se desea."
        note: "Después de `أَنْ`, la acción plenamente vocalizada termina aquí en una a breve. **Practica:**
          di que nosotros queremos aprender a nadar. Respuesta: `نُرِيدُ أَنْ نَتَعَلَّمَ
          السِّبَاحَةَ`. Ambos verbos pasan a nosotros y `أَنْ` sigue uniendo el deseo con el
          aprendizaje."
  - subskill_id: preferences
    explanation: Al elegir una bebida, una preferencia compara las opciones en vez de limitarse a decir
      que una es agradable. Aquí el té es la primera elección frente al café.
    examples:
      - text: أُفَضِّلُ الشَّايَ عَلَى الْقَهْوَةِ.
        meaning: "**El ejemplo.** Prefiero el té al café. `أُفَضِّلُ` significa prefiero. `الشَّايَ` es la
          bebida preferida, el té. `عَلَى الْقَهْوَةِ` introduce la otra opción, el café. El orden
          importa: la bebida después del verbo es la favorecida."
        note: "La bebida preferida sigue a `أُفَضِّلُ`; la alternativa sigue a `عَلَى`. **Practica:**
          invierte la preferencia. Respuesta: `أُفَضِّلُ الْقَهْوَةَ عَلَى الشَّايِ`. Al cambiar los
          nombres de posición cambian también sus finales vocalizados según la función gramatical."
  - subskill_id: emotions
    explanation: Una buena noticia puede cambiar cómo te sientes. Esta oración permite a una mujer decir
      que la noticia la alegra, en vez de describir la propia noticia como feliz.
    examples:
      - text: أَنَا سَعِيدَةٌ بِهٰذَا الْخَبَرِ.
        meaning: "**El ejemplo.** Me alegra esta noticia. `أَنَا` significa yo y `سَعِيدَةٌ` es feliz en
          femenino. `بِهٰذَا الْخَبَرِ` significa por esta noticia: `بِـ` conecta el sentimiento con
          su causa. En presente no hay una palabra separada equivalente a soy o estoy."
        note: "Un hombre usa `أَنَا سَعِيدٌ بِهٰذَا الْخَبَرِ`. El adjetivo de emoción concuerda con quien
          habla, no con la palabra noticia. **Practica:** ¿qué cambia si lo dice un hombre?
          Respuesta: `سَعِيدَةٌ` pasa a `سَعِيدٌ`; la expresión de la noticia permanece igual."
  - subskill_id: opinions
    explanation: Se están considerando varias soluciones. Puedes presentar tu juicio como un punto de
      vista y dejar espacio para que otra persona prefiera una solución distinta.
    examples:
      - text: فِي رَأْيِي، هٰذَا الْحَلُّ أَفْضَلُ.
        meaning: "**El ejemplo.** En mi opinión, esta solución es mejor. `فِي رَأْيِي` significa en mi
          opinión; el sufijo final expresa mi. `هٰذَا الْحَلُّ` es esta solución y `أَفْضَلُ`
          significa mejor. La otra solución se entiende por la conversación y no hace falta
          repetirla."
        note: "La introducción presenta el juicio, pero no aporta pruebas. Si no queda clara la alternativa,
          nombra con qué comparas. **Practica:** ¿qué parte dice de quién es el juicio? Respuesta:
          `فِي رَأْيِي`, especialmente su sufijo de mi."
  - subskill_id: agreement_disagreement
    explanation: Hay una propuesta sobre la mesa y te opones a ella. Nombrarla aclara tu desacuerdo sin
      convertirlo en un juicio sobre quien la planteó.
    examples:
      - text: لَا أُوَافِقُ عَلَى هٰذَا الِاقْتِرَاحِ.
        meaning: "**El ejemplo.** No estoy de acuerdo con esta propuesta. `لَا` niega `أُوَافِقُ`, estoy de
          acuerdo. `عَلَى هٰذَا الِاقْتِرَاحِ` significa con esta propuesta. El verbo de primera
          persona es igual para un hablante y una hablante; este ejemplo no usa un adjetivo de
          concordancia."
        note: "Al quitar `لَا` se expresa acuerdo: `أُوَافِقُ عَلَى هٰذَا الِاقْتِرَاحِ`. Tener dudas no
          equivale a expresar desacuerdo. **Practica:** ¿qué palabra invierte la postura? Respuesta:
          `لَا`; la propuesta sigue siendo la misma."
