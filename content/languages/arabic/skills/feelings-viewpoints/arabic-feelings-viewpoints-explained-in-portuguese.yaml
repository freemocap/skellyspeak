variety_sections:
  arabic-levantine:
    - subskill_id: wants_intentions
      explanation: Querer aprender uma habilidade mostra o que interessa a você. Isso pode iniciar uma conversa
        sobre aulas, sem dizer que já foram reservadas.
      examples:
        - text: بِدِّي أَتْعَلَّمْ السِّبَاحَة.
          meaning: "**O exemplo.** Quero aprender a nadar. `بِدِّي` significa eu quero; sua terminação identifica quem
            fala. `أَتْعَلَّمْ` significa eu aprendo nessa posição dependente, e `السِّبَاحَة` é natação. A
            ação depois de `بِدِّي` não leva seu prefixo b- comum."
          note: "A ação depois da forma de desejo não tem o prefixo b- comum. Experimente dizer que nós queremos
            aprender a nadar. Resposta: `بِدْنَا نِتْعَلَّمْ السِّبَاحَة`. Tanto o sufixo do desejo quanto o
            verbo de aprender mudam para « nós »; nadar permanece a habilidade desejada."
    - subskill_id: preferences
      explanation: Ao escolher uma bebida, uma preferência compara as opções em vez de apenas dizer que uma é
        agradável. Aqui, o chá é preferido ao café.
      examples:
        - text: بَحِبّ الشَّايْ أَكْتَرْ مِنْ الْقَهْوِة.
          meaning: "**O exemplo.** Prefiro chá a café. `بَحِبّ` significa eu gosto; `الشَّايْ` é chá. `أَكْتَرْ مِنْ`
            significa mais do que, e `الْقَهْوِة` é café. A preferência compara o quanto a pessoa gosta de
            cada bebida, sem usar um verbo separado para preferir."
          note: "Mantenha `أَكْتَرْ مِنْ` para comparar as duas bebidas. Experimente preferir café a chá. Resposta:
            `بَحِبّ الْقَهْوِة أَكْتَرْ مِنْ الشَّايْ`. Inverter as bebidas inverte a preferida; retirar a
            comparação só diria que você gosta de café."
    - subskill_id: emotions
      explanation: Uma boa notícia pode mudar como você se sente. A frase permite que uma mulher diga que está feliz
        com a notícia, sem atribuir felicidade à notícia.
      examples:
        - text: أَنَا مَبْسُوطَة بِهَادْ الْخَبَرْ.
          meaning: "**O exemplo.** Estou feliz com esta notícia. `أَنَا` é eu, e `مَبْسُوطَة` significa feliz ou
            contente com concordância feminina. `بِهَادْ الْخَبَرْ` significa com esta notícia. A preposição
            inicial ligada relaciona o sentimento ao que o provocou; não há palavra separada para « estou » no
            presente."
          note: "Um homem usa `مَبْسُوطْ` em vez de `مَبْسُوطَة`. Relacione o adjetivo à pessoa que sente a alegria.
            Experimente: a terminação feminina descreve a notícia? Resposta: não; descreve a mulher que fala,
            enquanto `الْخَبَرْ` nomeia aquilo que a alegra."
    - subskill_id: opinions
      explanation: Várias soluções estão em discussão. Você pode apresentar seu julgamento como opinião e deixar
        espaço para alguém preferir outra solução.
      examples:
        - text: بِرَأْيِي، هَادْ الْحَلّ أَحْسَنْ.
          meaning: "**O exemplo.** Na minha opinião, esta solução é melhor. `بِرَأْيِي` significa na minha opinião.
            `هَادْ الْحَلّ` nomeia esta solução, e `أَحْسَنْ` significa melhor. Não há palavra separada para «
            é » no presente; a solução se liga diretamente ao julgamento."
          note: "Use a expressão inicial com outro julgamento, mantendo seu sufixo de primeira pessoa. « Melhor » exige
            uma alternativa entendida, sem significar que tudo seja perfeito. Experimente retirar `بِرَأْيِي`.
            O que muda? Resposta: a comparação continua, mas desaparece a marca explícita de opinião pessoal."
    - subskill_id: agreement_disagreement
      explanation: Uma proposta está em discussão, e você se opõe. Nomear a proposta esclarece a discordância sem
        julgar a pessoa que a apresentou.
      examples:
        - text: أَنَا مِشْ مُوَافِقْ عَ هَادْ الِاقْتِرَاحْ.
          meaning: "**O exemplo.** Não concordo com esta proposta. `أَنَا` significa eu, `مِشْ` é não, e `مُوَافِقْ`
            expressa estar de acordo, com forma masculina aqui. `عَ هَادْ الِاقْتِرَاحْ` aponta para esta
            proposta. Trata-se de uma frase com adjetivo, não de um verbo comum do presente negado."
          note: "Uma mulher usa `مُوَافِقَة`. A palavra negativa varia entre regiões, mas esta lição pratica `مِشْ`.
            Experimente mudar a pessoa que fala para mulher. Resposta: `أَنَا مِشْ مُوَافِقَة عَ هَادْ
            الِاقْتِرَاحْ`; o adjetivo muda, enquanto a discordância e a proposta permanecem."
