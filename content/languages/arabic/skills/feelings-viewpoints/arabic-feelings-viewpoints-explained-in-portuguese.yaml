sections:
  - subskill_id: wants_intentions
    explanation: Querer aprender uma habilidade mostra o que interessa a você. Isso pode iniciar uma conversa
      sobre aulas sem afirmar que você já se inscreveu.
    examples:
      - text: أُرِيدُ أَنْ أَتَعَلَّمَ السِّبَاحَةَ.
        meaning: "**O exemplo.** Quero aprender a nadar. `أُرِيدُ` significa eu quero. `أَنْ أَتَعَلَّمَ` nomeia a
          ação desejada, aprender; `السِّبَاحَةَ` significa natação. Os dois verbos se referem a « eu »,
          dispensando um pronome separado. O conector `أَنْ` introduz a ação desejada."
        note: "Depois de `أَنْ`, a ação totalmente vocalizada termina aqui em uma vogal breve a. Experimente dizer que
          nós queremos aprender a nadar. Resposta: `نُرِيدُ أَنْ نَتَعَلَّمَ السِّبَاحَةَ`. Os dois verbos
          passam para « nós »; `أَنْ` continua ligando o desejo ao aprendizado."
  - subskill_id: preferences
    explanation: Ao escolher uma bebida, uma preferência compara as opções, em vez de apenas dizer que uma delas é
      agradável. Aqui, o chá é a primeira escolha em relação ao café.
    examples:
      - text: أُفَضِّلُ الشَّايَ عَلَى الْقَهْوَةِ.
        meaning: "**O exemplo.** Prefiro chá a café. `أُفَضِّلُ` significa eu prefiro. `الشَّايَ` nomeia a bebida
          preferida, o chá. `عَلَى الْقَهْوَةِ` introduz o café como outra opção. A ordem importa: a bebida
          depois do verbo é a favorecida."
        note: "A bebida preferida vem depois de `أُفَضِّلُ`; a alternativa, depois de `عَلَى`. Experimente inverter a
          preferência. Resposta: `أُفَضِّلُ الْقَهْوَةَ عَلَى الشَّايِ`. Mover os nomes também muda suas
          terminações na escrita vocalizada conforme as novas funções gramaticais."
  - subskill_id: emotions
    explanation: Uma boa notícia pode mudar como você se sente. A frase permite que uma mulher diga que ficou
      contente com a notícia, sem descrever a própria notícia como contente.
    examples:
      - text: أَنَا سَعِيدَةٌ بِهٰذَا الْخَبَرِ.
        meaning: "**O exemplo.** Estou feliz com esta notícia. `أَنَا` significa eu e `سَعِيدَةٌ` é feliz com
          concordância feminina. `بِهٰذَا الْخَبَرِ` significa com esta notícia: `بِـ` liga o sentimento à sua
          causa. Não há uma palavra separada de presente equivalente a « estou »."
        note: "Um homem usa `أَنَا سَعِيدٌ بِهٰذَا الْخَبَرِ`. O adjetivo do sentimento concorda com quem fala, não
          com a palavra notícia. Experimente: o que muda quando um homem diz a frase? Resposta: `سَعِيدَةٌ`
          vira `سَعِيدٌ`; a expressão sobre a notícia permanece."
  - subskill_id: opinions
    explanation: Várias soluções estão sendo discutidas. Você pode apresentar seu próprio julgamento como ponto de
      vista, deixando espaço para outra pessoa preferir outra solução.
    examples:
      - text: فِي رَأْيِي، هٰذَا الْحَلُّ أَفْضَلُ.
        meaning: "**O exemplo.** Na minha opinião, esta solução é melhor. `فِي رَأْيِي` significa na minha opinião; o
          sufixo final indica « minha ». `هٰذَا الْحَلُّ` é esta solução, e `أَفْضَلُ` significa melhor. A
          outra solução é entendida pela conversa, portanto não precisa ser repetida."
        note: "A expressão inicial apresenta o julgamento, mas não fornece provas. Se as alternativas não estiverem
          claras, nomeie aquela com a qual compara. Experimente: que parte identifica de quem é o julgamento?
          Resposta: `فِي رَأْيِي`, especialmente o sufixo de « minha »."
  - subskill_id: agreement_disagreement
    explanation: Uma proposta está sendo discutida, e você se opõe a ela. Nomear a proposta deixa a discordância
      clara sem transformar a resposta em julgamento da pessoa que sugeriu.
    examples:
      - text: لَا أُوَافِقُ عَلَى هٰذَا الِاقْتِرَاحِ.
        meaning: "**O exemplo.** Não concordo com esta proposta. `لَا` nega `أُوَافِقُ`, eu concordo. `عَلَى هٰذَا
          الِاقْتِرَاحِ` significa com esta proposta. O verbo na primeira pessoa é o mesmo para homem ou
          mulher; este exemplo não usa um adjetivo que concorde com o gênero."
        note: "Retirar `لَا` produz concordância: `أُوَافِقُ عَلَى هٰذَا الِاقْتِرَاحِ`. Estar em dúvida é diferente
          de discordar. Experimente: que palavra inverte a posição? Resposta: `لَا`; a proposta continua a
          mesma."
