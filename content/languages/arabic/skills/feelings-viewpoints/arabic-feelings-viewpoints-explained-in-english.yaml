varieties:
  arabic-levantine:
    disposition: supplement
    text: Levantine frequently uses بِدِّي for I want. Colloquial negative predicates may use مِشْ
      or مُو according to regional usage.
    provenance: *a1
  arabic-modern-standard:
    disposition: supplement
    text: Modern Standard often expresses wanting with أُرِيدُ and a following clause with أَنْ.
      Feeling adjectives agree with the person described.
    provenance: *a1
