variety_sections:
  arabic-levantine:
    - subskill_id: wants_intentions
      explanation: Wanting to learn a new skill tells someone what interests you. It can start a
        discussion about lessons without claiming that you have already booked them.
      examples:
        - text: بِدِّي أَتْعَلَّمْ السِّبَاحَة.
          meaning: "**The example.** I want to learn to swim. `بِدِّي` means I want; its ending identifies the
            speaker. `أَتْعَلَّمْ` means I learn in this dependent position, and `السِّبَاحَة` is
            swimming. The action after `بِدِّي` comes without its ordinary b-prefix."
          note: "The action after the wanting form has no ordinary b-prefix. Try it: say we want to learn to
            swim. Answer: `بِدْنَا نِتْعَلَّمْ السِّبَاحَة`. Both the wanting suffix and the
            learning verb change to we, while swimming remains the skill you want to learn."
    - subskill_id: preferences
      explanation: When choosing a drink, a preference compares the options rather than simply saying that
        one is pleasant. Here tea is the speaker’s first choice over coffee.
      examples:
        - text: بَحِبّ الشَّايْ أَكْتَرْ مِنْ الْقَهْوِة.
          meaning: "**The example.** I prefer tea to coffee. `بَحِبّ` means I like; `الشَّايْ` is tea.
            `أَكْتَرْ مِنْ` means more than, and `الْقَهْوِة` is coffee. This builds a preference by
            comparing the amount of liking, rather than using a separate verb meaning prefer."
          note: "Keep `أَكْتَرْ مِنْ` to compare the two drinks. Try it: say you prefer coffee to tea. Answer:
            `بَحِبّ الْقَهْوِة أَكْتَرْ مِنْ الشَّايْ`. Swapping the drinks reverses which you
            favor; omitting the comparison would only say that you like coffee."
    - subskill_id: emotions
      explanation: Good news can change how you feel. This sentence lets a woman tell someone that the
        news has made her happy, rather than describing the news itself as happy.
      examples:
        - text: أَنَا مَبْسُوطَة بِهَادْ الْخَبَرْ.
          meaning: "**The example.** I am happy about this news. `أَنَا` is I and `مَبْسُوطَة` means happy or
            pleased with feminine agreement. `بِهَادْ الْخَبَرْ` means about this news. The initial
            attached preposition connects the feeling to what prompted it; no separate present-tense
            am is needed."
          note: "A man uses `مَبْسُوطْ` instead of `مَبْسُوطَة`. Keep the adjective tied to the person feeling
            happy. Try it: does the feminine ending describe the news? Answer: no; it describes the
            woman speaking, while `الْخَبَرْ` names what she is happy about."
    - subskill_id: opinions
      explanation: Several solutions are being discussed. You can introduce your own judgment as a
        viewpoint, leaving room for another person to prefer a different solution.
      examples:
        - text: بِرَأْيِي، هَادْ الْحَلّ أَحْسَنْ.
          meaning: "**The example.** In my opinion, this solution is better. `بِرَأْيِي` means in my opinion.
            `هَادْ الْحَلّ` names this solution and `أَحْسَنْ` means better. There is no separate
            present-tense is; the solution is directly linked to the judgment."
          note: "Use the opening with another judgment while keeping its first-person suffix. Better needs an
            understood alternative; it does not mean every feature is perfect. Try it: remove
            `بِرَأْيِي`. What changes? Answer: the comparison remains, but the explicit
            personal-view frame disappears."
    - subskill_id: agreement_disagreement
      explanation: A proposal is on the table and you oppose it. Naming the proposal makes your
        disagreement clear without turning it into a judgment about the person who suggested it.
      examples:
        - text: أَنَا مِشْ مُوَافِقْ عَ هَادْ الِاقْتِرَاحْ.
          meaning: "**The example.** I do not agree with this proposal. `أَنَا` means I, `مِشْ` is not, and
            `مُوَافِقْ` is agreeing, here with masculine agreement. `عَ هَادْ الِاقْتِرَاحْ` points
            to this proposal. This is an adjective-based statement rather than a negated ordinary
            present verb."
          note: "A woman uses `مُوَافِقَة`. The negative word can vary regionally, but this lesson practices
            `مِشْ`. Try it: change the speaker to a woman. Answer: `أَنَا مِشْ مُوَافِقَة عَ هَادْ
            الِاقْتِرَاحْ`; the adjective changes, while the disagreement and proposal remain."
