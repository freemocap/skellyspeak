sections:
  - subskill_id: wants_intentions
    explanation: Wanting to learn a new skill tells someone what interests you. It can start a
      discussion about lessons without claiming that you have already booked them.
    examples:
      - text: أُرِيدُ أَنْ أَتَعَلَّمَ السِّبَاحَةَ.
        meaning: "**The example.** I want to learn to swim. `أُرِيدُ` means I want. `أَنْ أَتَعَلَّمَ` names
          what I want to do, to learn; `السِّبَاحَةَ` means swimming. Both verbs refer to I, so no
          separate personal pronoun is needed. The connector `أَنْ` introduces the desired action."
        note: "After `أَنْ`, the fully vocalized action ends in a short a-vowel here. Try it: say we want to
          learn to swim. Answer: `نُرِيدُ أَنْ نَتَعَلَّمَ السِّبَاحَةَ`. Both verbs change to we;
          `أَنْ` still links the wish to the learning action."
  - subskill_id: preferences
    explanation: When choosing a drink, a preference compares the options rather than simply saying that
      one is pleasant. Here tea is the speaker’s first choice over coffee.
    examples:
      - text: أُفَضِّلُ الشَّايَ عَلَى الْقَهْوَةِ.
        meaning: "**The example.** I prefer tea to coffee. `أُفَضِّلُ` means I prefer. `الشَّايَ` names the
          preferred drink, tea. `عَلَى الْقَهْوَةِ` introduces coffee as the other option. The order
          matters: the drink after the verb is the one you favor."
        note: "The preferred drink follows `أُفَضِّلُ`; the alternative follows `عَلَى`. Try it: reverse the
          preference. Answer: `أُفَضِّلُ الْقَهْوَةَ عَلَى الشَّايِ`. Moving the nouns also changes
          their fully vocalized endings to suit their new grammatical positions."
  - subskill_id: emotions
    explanation: Good news can change how you feel. This sentence lets a woman tell someone that the
      news has made her happy, rather than describing the news itself as happy.
    examples:
      - text: أَنَا سَعِيدَةٌ بِهٰذَا الْخَبَرِ.
        meaning: "**The example.** I am happy about this news. `أَنَا` means I and `سَعِيدَةٌ` is happy with
          feminine agreement. `بِهٰذَا الْخَبَرِ` means about this news: `بِـ` joins the feeling to
          its cause. There is no separate present-tense word corresponding to English am."
        note: "A man uses `أَنَا سَعِيدٌ بِهٰذَا الْخَبَرِ`. The feeling adjective agrees with the speaker,
          not with the word for news. Try it: which part changes when a man says the sentence?
          Answer: `سَعِيدَةٌ` becomes `سَعِيدٌ`; the news phrase stays the same."
  - subskill_id: opinions
    explanation: Several solutions are being discussed. You can introduce your own judgment as a
      viewpoint, leaving room for another person to prefer a different solution.
    examples:
      - text: فِي رَأْيِي، هٰذَا الْحَلُّ أَفْضَلُ.
        meaning: "**The example.** In my opinion, this solution is better. `فِي رَأْيِي` means in my
          opinion; the final suffix means my. `هٰذَا الْحَلُّ` is this solution, and `أَفْضَلُ`
          means better. The other solution is understood from the conversation, so it need not be
          repeated."
        note: "The opening frames the judgment; it does not supply evidence for it. If the alternatives are
          unclear, name the one you are comparing. Try it: which part tells the listener whose
          judgment this is? Answer: `فِي رَأْيِي`, especially its my suffix."
  - subskill_id: agreement_disagreement
    explanation: A proposal is on the table and you oppose it. Naming the proposal makes your
      disagreement clear without turning it into a judgment about the person who suggested it.
    examples:
      - text: لَا أُوَافِقُ عَلَى هٰذَا الِاقْتِرَاحِ.
        meaning: "**The example.** I do not agree with this proposal. `لَا` negates `أُوَافِقُ`, I agree.
          `عَلَى هٰذَا الِاقْتِرَاحِ` means with this proposal. The first-person verb is the same
          whether the speaker is a man or a woman; this example does not use an agreement
          adjective."
        note: "Removing `لَا` gives agreement: `أُوَافِقُ عَلَى هٰذَا الِاقْتِرَاحِ`. Being unsure is
          different from saying you disagree. Try it: which word reverses the position? Answer:
          `لَا`; the proposal remains the same."
