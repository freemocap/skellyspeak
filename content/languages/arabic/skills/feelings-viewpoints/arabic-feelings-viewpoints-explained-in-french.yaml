sections:
  - subskill_id: wants_intentions
    explanation: Vouloir apprendre une nouvelle compétence indique ce qui vous intéresse. Cela peut ouvrir une
      discussion sur des cours sans affirmer que vous les avez déjà réservés.
    examples:
      - text: أُرِيدُ أَنْ أَتَعَلَّمَ السِّبَاحَةَ.
        meaning: "**L’exemple.** Je veux apprendre à nager. `أُرِيدُ` signifie « je veux ». `أَنْ أَتَعَلَّمَ` nomme
          l’action souhaitée, apprendre ; `السِّبَاحَةَ` désigne la natation. Les deux verbes renvoient à « je
          », sans pronom personnel distinct. Le lien `أَنْ` introduit l’action désirée."
        note: "Après `أَنْ`, la forme entièrement vocalisée se termine ici par une voyelle a brève. Essayez : dites
          que nous voulons apprendre à nager. Réponse : `نُرِيدُ أَنْ نَتَعَلَّمَ السِّبَاحَةَ`. Les deux
          verbes passent à « nous » ; `أَنْ` relie toujours le souhait à l’apprentissage."
  - subskill_id: preferences
    explanation: Au moment de choisir une boisson, exprimer une préférence compare les possibilités au lieu de
      dire seulement que l’une plaît. Ici, la personne qui parle choisit d’abord le thé plutôt que le café.
    examples:
      - text: أُفَضِّلُ الشَّايَ عَلَى الْقَهْوَةِ.
        meaning: "**L’exemple.** Je préfère le thé au café. `أُفَضِّلُ` signifie « je préfère ». `الشَّايَ` nomme la
          boisson préférée, le thé. `عَلَى الْقَهْوَةِ` introduit l’autre possibilité, le café. L’ordre compte
          : la boisson juste après le verbe est celle qui plaît davantage."
        note: "La boisson préférée suit `أُفَضِّلُ` ; l’autre suit `عَلَى`. Essayez : inversez la préférence. Réponse
          : `أُفَضِّلُ الْقَهْوَةَ عَلَى الشَّايِ`. Déplacer les noms change aussi leurs terminaisons dans
          l’écriture entièrement vocalisée, selon leur nouveau rôle grammatical."
  - subskill_id: emotions
    explanation: Une bonne nouvelle peut changer votre humeur. Cette phrase permet à une femme de dire que la
      nouvelle la rend heureuse, sans décrire la nouvelle elle-même comme « heureuse ».
    examples:
      - text: أَنَا سَعِيدَةٌ بِهٰذَا الْخَبَرِ.
        meaning: "**L’exemple.** Je suis contente de cette nouvelle. `أَنَا` signifie « je » et `سَعِيدَةٌ` exprime la
          joie avec l’accord féminin. `بِهٰذَا الْخَبَرِ` signifie « à propos de cette nouvelle » : `بِـ`
          relie le sentiment à sa cause. Aucun mot distinct au présent ne correspond au verbe « être » de la
          traduction."
        note: "Un homme dit `أَنَا سَعِيدٌ بِهٰذَا الْخَبَرِ`. L’adjectif de sentiment s’accorde avec la personne qui
          parle, pas avec le nom de la nouvelle. Essayez : que change un homme dans cette phrase ? Réponse :
          `سَعِيدَةٌ` devient `سَعِيدٌ` ; l’expression désignant la nouvelle reste la même."
  - subskill_id: opinions
    explanation: Plusieurs solutions sont discutées. Vous pouvez présenter votre jugement comme un point de vue
      personnel, en laissant la possibilité à l’autre personne de préférer une autre solution.
    examples:
      - text: فِي رَأْيِي، هٰذَا الْحَلُّ أَفْضَلُ.
        meaning: "**L’exemple.** À mon avis, cette solution est meilleure. `فِي رَأْيِي` signifie « à mon avis » ; le
          suffixe final signifie « mon ». `هٰذَا الْحَلُّ` désigne cette solution et `أَفْضَلُ` signifie
          meilleure. L’autre solution se comprend dans la conversation et n’a pas besoin d’être répétée."
        note: "L’introduction présente le jugement sans fournir de preuve. Si les possibilités comparées ne sont pas
          claires, nommez l’autre solution. Essayez : quelle partie indique à qui appartient ce jugement ?
          Réponse : `فِي رَأْيِي`, notamment son suffixe possessif."
  - subskill_id: agreement_disagreement
    explanation: Une proposition est discutée et vous vous y opposez. La nommer rend votre désaccord clair sans
      juger la personne qui l’a formulée.
    examples:
      - text: لَا أُوَافِقُ عَلَى هٰذَا الِاقْتِرَاحِ.
        meaning: "**L’exemple.** Je ne suis pas d’accord avec cette proposition. `لَا` nie `أُوَافِقُ`, « je suis
          d’accord ». `عَلَى هٰذَا الِاقْتِرَاحِ` désigne la proposition concernée. Le verbe à la première
          personne a la même forme pour un homme et pour une femme ; cette phrase n’emploie pas d’adjectif
          accordé."
        note: "Enlever `لَا` exprime l’accord : `أُوَافِقُ عَلَى هٰذَا الِاقْتِرَاحِ`. Être incertain diffère d’un
          désaccord. Essayez : quel mot inverse la position ? Réponse : `لَا` ; la proposition reste
          identique."
