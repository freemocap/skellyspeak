varieties:
  arabic-levantine:
    disposition: supplement
    text: Recognize بِدِّي, liking comparisons and colloquial adjective negation. مِشْ and مُو occur
      in different regional usage; the guide’s choice is not an exclusive standard.
    provenance: *a1
  arabic-modern-standard:
    disposition: supplement
    text: Recognize أُرِيدُ with أَنْ, agreement verbs and nominal feeling predicates. Do not
      confuse a polite request with a report of personal preference merely because it contains a
      desire verb.
    provenance: *a1
