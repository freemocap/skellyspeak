language: arabic
skill_id: feelings_viewpoints
guidance: Assess desire, preference, emotion, opinion and agreement or disagreement. A desire
  construction names a wanted state or action; a future statement alone need not do so. A
  comparison of liking expresses preference. An emotional adjective can report a feeling without
  an overt present copula. An opinion marker can frame a judgment, while an agreement or
  rejection expression explicitly takes a stance on an identifiable proposition. A short choice
  can answer a preference question contextually; a drink name in an inventory does not establish
  liking. A bare acknowledgement need not mean agreement. A copied feeling word with no
  recoverable experiencer or stance is absent. Judge agreement and negation against the selected
  variety, preserving ordinary subject omission and avoiding an English-only model of how
  feelings must be expressed.
