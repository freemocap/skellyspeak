variety_sections:
  arabic-levantine:
    - subskill_id: wants_intentions
      explanation: 想學一項新技能，可以話畀人知你有乜興趣。呢句可以開始傾課程，但唔代表你已經報咗名。
      examples:
        - text: بِدِّي أَتْعَلَّمْ السِّبَاحَة.
          meaning: "**例句。** 我想學游水。 `بِدِّي` 係「我想」，詞尾指出講者。`أَتْعَلَّمْ` 喺呢個依附位置表示「我學」，`السِّبَاحَة`
            係游水。`بِدِّي` 後面嘅動作唔加一般 b 前綴。"
          note: 想要表達後面嘅動作冇一般 b 前綴。試下講我哋想學游水：`بِدْنَا نِتْعَلَّمْ السِّبَاحَة`。想嘅後綴同學習動詞都改成我哋，游水仍然係想學嘅技能。
    - subskill_id: preferences
      explanation: 揀飲品時，偏好係比較兩個選擇，唔止係話其中一樣好飲。呢度講者較鍾意茶，多過咖啡。
      examples:
        - text: بَحِبّ الشَّايْ أَكْتَرْ مِنْ الْقَهْوِة.
          meaning: "**例句。** 比起咖啡，我更鍾意茶。 `بَحِبّ` 係「我鍾意」，`الشَّايْ` 係茶。`أَكْتَرْ مِنْ` 係「多過」，`الْقَهْوِة`
            係咖啡。呢句比較鍾意嘅程度，嚟表達偏好。"
          note: 比較飲品時保留 `أَكْتَرْ مِنْ`。試下話咖啡比茶更啱你：`بَحِبّ الْقَهْوِة أَكْتَرْ مِنْ
            الشَّايْ`。調轉飲品就反轉偏好；刪走比較部分，只係話鍾意咖啡。
    - subskill_id: emotions
      explanation: 收到好消息，可以講自己嘅感受。呢句由女性講出，話自己因為消息而開心，唔係形容消息本身開心。
      examples:
        - text: أَنَا مَبْسُوطَة بِهَادْ الْخَبَرْ.
          meaning: "**例句。** 呢個消息令我好開心。 `أَنَا` 係「我」，`مَبْسُوطَة` 係配合女性嘅「開心、滿意」。`بِهَادْ الْخَبَرْ`
            係「因為呢個消息」。開頭連住嘅介詞連起感受同原因；現在式唔使另加「係」。"
          note: 男性用 `مَبْسُوطْ` 換走 `مَبْسُوطَة`。形容詞跟住感到開心嗰個人。試下：女性詞尾係咪形容消息？唔係；佢配合講緊嘢嘅女性，`الْخَبَرْ` 就指出令佢開心嘅事。
    - subskill_id: opinions
      explanation: 大家傾緊幾個解決方法。先表明係自己嘅睇法，可以清楚提出判斷，同時容許對方有另一個選擇。
      examples:
        - text: بِرَأْيِي، هَادْ الْحَلّ أَحْسَنْ.
          meaning: "**例句。** 我認為呢個方案比較好。 `بِرَأْيِي` 係「依我睇」。`هَادْ الْحَلّ` 係「呢個方法」，`أَحْسَنْ`
            係「更好」。現在式唔使另加「係」，方法直接連到判斷。"
          note: 可以喺開頭後面換另一個判斷，保留表示自己嘅後綴。「更好」要有已知比較對象，唔係話每一方面都完美。試下刪走 `بِرَأْيِي`：比較仍然存在，但冇咗明示「我嘅睇法」。
    - subskill_id: agreement_disagreement
      explanation: 大家正考慮一個提議，你唔贊成。指出反對嘅係邊個提議，可以清楚表達立場，唔使批評提出嗰個人。
      examples:
        - text: أَنَا مِشْ مُوَافِقْ عَ هَادْ الِاقْتِرَاحْ.
          meaning: "**例句。** 我唔同意呢個建議。 `أَنَا` 係「我」，`مِشْ` 係「唔」，`مُوَافِقْ` 係配合男性嘅「同意」。`عَ هَادْ الِاقْتِرَاحْ`
            指「呢個提議」。呢句用形容詞表達狀態，唔係否定一般現在式動詞。"
          note: 女性用 `مُوَافِقَة`。否定詞有地區差異，呢課就練習 `مِشْ`。試下改成女性講：`أَنَا مِشْ مُوَافِقَة عَ هَادْ
            الِاقْتِرَاحْ`；形容詞改咗，反對立場同提議保留。
