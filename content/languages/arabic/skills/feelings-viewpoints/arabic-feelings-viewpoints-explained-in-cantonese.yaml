sections:
  - subskill_id: wants_intentions
    explanation: 想學一項新技能，可以話畀人知你有乜興趣。呢句可以開始傾課程，但唔代表你已經報咗名。
    examples:
      - text: أُرِيدُ أَنْ أَتَعَلَّمَ السِّبَاحَةَ.
        meaning: "**例句。** 我想學游水。 `أُرِيدُ` 係「我想」。`أَنْ أَتَعَلَّمَ` 指想做嘅事「學習」，`السِّبَاحَةَ`
          係游水。兩個動詞都指「我」，唔使另加人稱代詞。`أَنْ` 接上想做嘅動作。"
        note: "`أَنْ` 後面呢個完整標音動作用短 a 元音收尾。試下講我哋想學游水：`نُرِيدُ أَنْ نَتَعَلَّمَ السِّبَاحَةَ`。兩個動詞都改成我哋，`أَنْ`
          仍然接起願望同學習動作。"
  - subskill_id: preferences
    explanation: 揀飲品時，偏好係比較兩個選擇，唔止係話其中一樣好飲。呢度講者較鍾意茶，多過咖啡。
    examples:
      - text: أُفَضِّلُ الشَّايَ عَلَى الْقَهْوَةِ.
        meaning: "**例句。** 比起咖啡，我更鍾意茶。 `أُفَضِّلُ` 係「我較鍾意」。`الشَّايَ` 指較鍾意嘅飲品茶。`عَلَى الْقَهْوَةِ`
          帶出另一個選擇咖啡。次序好重要：動詞後面嗰樣先係你偏好嘅。"
        note: 較鍾意嘅飲品跟住 `أُفَضِّلُ`，另一個選擇跟住 `عَلَى`。試下反轉偏好：`أُفَضِّلُ الْقَهْوَةَ عَلَى
          الشَّايِ`。名詞換位置，完整標音詞尾亦配合新語法位置改。
  - subskill_id: emotions
    explanation: 收到好消息，可以講自己嘅感受。呢句由女性講出，話自己因為消息而開心，唔係形容消息本身開心。
    examples:
      - text: أَنَا سَعِيدَةٌ بِهٰذَا الْخَبَرِ.
        meaning: "**例句。** 呢個消息令我好開心。 `أَنَا` 係「我」，`سَعِيدَةٌ` 係配合女性嘅「開心」。`بِهٰذَا الْخَبَرِ` 係「因為呢個消息」；`بِـ`
          將感受連到原因。現在式唔使另加相當於英文 am 嘅詞。"
        note: 男性可以講 `أَنَا سَعِيدٌ بِهٰذَا الْخَبَرِ`。感受形容詞配合講者，唔係配合「消息」個詞。試下：男性講時改邊部分？`سَعِيدَةٌ` 改成
          `سَعِيدٌ`，消息短語保留。
  - subskill_id: opinions
    explanation: 大家傾緊幾個解決方法。先表明係自己嘅睇法，可以清楚提出判斷，同時容許對方有另一個選擇。
    examples:
      - text: فِي رَأْيِي، هٰذَا الْحَلُّ أَفْضَلُ.
        meaning: "**例句。** 我認為呢個方案比較好。 `فِي رَأْيِي` 係「依我睇」，最後嘅後綴係「我嘅」。`هٰذَا الْحَلُّ` 係「呢個方法」，`أَفْضَلُ`
          係「更好」。比較緊嘅另一個方法，對話已經交代咗，唔使重複。"
        note: 開頭只係標明立場，唔係提供證據。如果唔清楚同乜比較，就要講明另一個方法。試下：邊部分指出係邊個嘅判斷？答案係 `فِي رَأْيِي`，尤其表示「我嘅」嘅後綴。
  - subskill_id: agreement_disagreement
    explanation: 大家正考慮一個提議，你唔贊成。指出反對嘅係邊個提議，可以清楚表達立場，唔使批評提出嗰個人。
    examples:
      - text: لَا أُوَافِقُ عَلَى هٰذَا الِاقْتِرَاحِ.
        meaning: "**例句。** 我唔同意呢個建議。 `لَا` 否定 `أُوَافِقُ`「我同意」。`عَلَى هٰذَا الِاقْتِرَاحِ`
          係「呢個提議」。無論講者係男性定女性，第一人稱動詞都一樣；呢句唔係用「同意」形容詞。"
        note: 刪走 `لَا` 就係同意：`أُوَافِقُ عَلَى هٰذَا الِاقْتِرَاحِ`。唔肯定同反對係兩回事。試下：邊個詞改變立場方向？答案係 `لَا`，所講嘅提議冇變。
