sections:
  - subskill_id: wants_intentions
    explanation: 現代標準語可以用表達想要嘅動詞，再接從屬動詞。黎凡特語常用 بَدّ 加人稱後綴，再接動詞。
    examples:
      - text: أُرِيدُ أَنْ أَتَعَلَّمَ السِّبَاحَةَ.
        meaning: 我想學游水。
        note: 現代標準阿拉伯語。表達願望，唔係承諾會上游水堂。
      - text: بِدِّي أَتْعَلَّمْ السِّبَاحَة.
        meaning: 我想學游水。
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。表達願望，唔係承諾會上游水堂。
  - subskill_id: preferences
    explanation: 偏好可以用喜愛程度比較，或者意思係「較鍾意」嘅動詞表達。
    examples:
      - text: أُفَضِّلُ الشَّايَ عَلَى الْقَهْوَةِ.
        meaning: 比起咖啡，我更鍾意茶。
        note: 現代標準阿拉伯語。較鍾意嘅選項係茶。
      - text: بَحِبّ الشَّايْ أَكْتَرْ مِنْ الْقَهْوِة.
        meaning: 比起咖啡，我更鍾意茶。
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。較鍾意嘅選項係茶。
  - subskill_id: emotions
    explanation: 名詞句可以描述講者嘅情緒，唔一定需要相當於英文 be 嘅動詞。
    examples:
      - text: أَنَا سَعِيدَةٌ بِهٰذَا الْخَبَرِ.
        meaning: 呢個消息令我好開心。
        note: 現代標準阿拉伯語。講者係女性，形容詞形式亦配合呢點。
      - text: أَنَا مَبْسُوطَة بِهَادْ الْخَبَرْ.
        meaning: 呢個消息令我好開心。
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。講者係女性，形容詞形式亦配合呢點。
  - subskill_id: opinions
    explanation: 相當於「我認為」嘅用語，可以表明之後係講者嘅判斷。
    examples:
      - text: فِي رَأْيِي، هٰذَا الْحَلُّ أَفْضَلُ.
        meaning: 我認為呢個方案比較好。
        note: 現代標準阿拉伯語。比較對象可以從正討論嘅方案推知。
      - text: بِرَأْيِي، هَادْ الْحَلّ أَحْسَنْ.
        meaning: 我認為呢個方案比較好。
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。比較對象可以從正討論嘅方案推知。
  - subskill_id: agreement_disagreement
    explanation: 明確表示唔同意，可以否定一個清楚嘅提議。
    examples:
      - text: لَا أُوَافِقُ عَلَى هٰذَا الِاقْتِرَاحِ.
        meaning: 我唔同意呢個建議。
        note: 現代標準阿拉伯語例句；同組黎凡特例句用男性形容詞形式，配合男性講者。
      - text: أَنَا مِشْ مُوَافِقْ عَ هَادْ الِاقْتِرَاحْ.
        meaning: 我唔同意呢個建議。
        note: 黎凡特阿拉伯語口語，其他地區可能有不同講法。呢度形容詞係男性形式，講者係男性。
