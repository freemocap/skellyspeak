variety_sections:
  arabic-levantine:
    - subskill_id: identification
      explanation: 介绍一位邻居，是把眼前这个人与你们的关系连起来。表达“这是我的邻居”时，不需要独立的现在时“是”。
      examples:
        - text: هَايْ جَارْتِي.
          meaning: "**例句。** 这是我的女邻居。`هَايْ` 指附近的阴性对象；`جَارْتِي` 意为我的女邻居。物主词尾仍附在名词上。句子是在介绍这个人，而不是描述她在做什么。"
          note: 这些指示词是南部形式，也有地方变体。试一试：按这个范例介绍男邻居。答案：`هَادْ جَارِي`。把 `هَايْ` 换成 `هَادْ`，女邻居名词改为阳性形式，保留“我的”词尾。
    - subskill_id: qualities_states
      explanation: 别人问一条路好不好通行时，描述宽窄就是有用的信息。这个句子说明道路的性质，而不只是给道路命名。
      examples:
        - text: هَادْ الطَّرِيقْ ضَيِّقْ.
          meaning: "**例句。** 这条路很窄。`هَادْ` 意为这，`الطَّرِيقْ` 是路，`ضَيِّقْ` 是窄。把道路与形容词直接连起来，就形成现在时描述。新信息是形容词，不是道路名称的一部分。"
          note: "`الطَّرِيقْ الضَّيِّقْ` 意为那条窄路：名词和形容词都带定冠词。例句中的描述形容词没有冠词。试一试：例句是在叫你移动吗？答案：不是；它描述宽度，没有移动动词。"
    - subskill_id: location_movement
      explanation: 有人在找钥匙。说明位置能告诉对方它现在在哪里，并不是请对方把钥匙送往某处。
      examples:
        - text: الْمِفْتَاحْ بِالْبَيْتْ.
          meaning: "**例句。** 钥匙在屋里。`الْمِفْتَاحْ` 指钥匙。`بِالْبَيْتْ` 把附着介词 `بِـ` 与房子结合，这里表示在屋里。无需独立的现在时“是”；地点就补足了陈述。"
          note: 办公室里用 `بِالْمَكْتَبْ`。换地点时保留附着介词。试一试：要换一个位置，应替换哪部分？答案：`بِالْبَيْتْ`；钥匙仍是被定位的东西。
    - subskill_id: possession_relations
      explanation: 你在确认自己能提供几把椅子。阿拉伯语可通过说东西“在你这里”来表达拥有；椅子名词本身也能标出数量为二。
      examples:
        - text: عِنْدِي كُرْسِيَّيْنْ.
          meaning: "**例句。** 我有两把椅子。`عِنْدِي` 意为我有。`كُرْسِيَّيْنْ` 是两把椅子，带口语双数词尾。数量体现在椅子上；`عِنْدِي` 的词尾指出持有者。"
          note: 一把椅子可说 `عِنْدِي كُرْسِي`。数量改为一时，不能仍保留双数词尾。试一试：把两把椅子改为一把。答案：用 `كُرْسِي` 取代 `كُرْسِيَّيْنْ`；拥有表达不变。
    - subskill_id: quantity_comparison
      explanation: 选搬哪个箱子时，重量可能是关键。比较会说出被评价的箱子，以及作为参照的另一只。
      examples:
        - text: هَادْ الصُّنْدُوقْ أَخَفّ مِنْ هَدَاكْ.
          meaning: "**例句。** 这个箱子比那个轻。`هَادْ الصُّنْدُوقْ` 指这个箱子。`أَخَفّ` 意为更轻，`مِنْ هَدَاكْ`
            意为比那个。近处的“这”和较远的“那”让人不必重复箱子一词，就能比较两个东西。"
          note: 在参照对象前保留 `مِنْ`。试一试：说那个箱子比这个轻。答案：`هَدَاكْ الصُّنْدُوقْ أَخَفّ مِنْ هَادْ`。对换指示词就反转比较，形容词和关系词不变。
