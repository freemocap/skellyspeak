variety_sections:
  arabic-levantine:
    - subskill_id: identification
      explanation: 介紹眼前嘅鄰居，就係將嗰個人同你嘅關係連起。阿拉伯語可以直接講「呢位係我鄰居」，唔使另加現在式嘅「係」。
      examples:
        - text: هَايْ جَارْتِي.
          meaning: "**例句。** 呢位係我女鄰居。 `هَايْ` 指附近嘅女性；`جَارْتِي` 係「我嘅女鄰居」。所有格後綴連住名詞。呢句係介紹邊個，唔係描述佢做緊乜。"
          note: 呢組係南部指示詞，其他地方亦有其他講法。試下用呢個示例介紹男性鄰居：`هَادْ جَارِي`。`هَايْ` 改成 `هَادْ`，女鄰居名詞改成男性形式，保留「我嘅」後綴。
    - subskill_id: qualities_states
      explanation: 有人問條路易唔易行，講闊窄就係有用資訊。呢句係描述條路嘅特徵，唔止係指出邊條路。
      examples:
        - text: هَادْ الطَّرِيقْ ضَيِّقْ.
          meaning: "**例句。** 呢條路窄。 `هَادْ` 係「呢」，`الطَّرِيقْ` 係條路，`ضَيِّقْ`
            係窄。路直接接形容詞，就係現在嘅描述。形容詞係新資訊，唔係路名嘅一部分。"
          note: "`الطَّرِيقْ الضَّيِّقْ` 係「條窄路」，名詞同形容詞都帶定冠詞。例句嘅描述形容詞唔帶冠詞。試下：呢句係咪叫你移動？唔係；佢描述闊窄，冇移動動詞。"
    - subskill_id: location_movement
      explanation: 有人搵緊鎖匙。位置陳述可以話畀佢知鎖匙而家喺邊，唔係叫佢帶去另一個地方。
      examples:
        - text: الْمِفْتَاحْ بِالْبَيْتْ.
          meaning: "**例句。** 條鎖匙喺屋入面。 `الْمِفْتَاحْ` 係鎖匙。`بِالْبَيْتْ` 將連住嘅介詞 `بِـ`
            同屋合埋，呢度係「喺屋企」。現在式唔使另加「係」，地方短語已經令句子完整。"
          note: 用 `بِالْمَكْتَبْ` 表示「喺辦公室」。換地方時保留連住嘅介詞。試下：講另一個位置，要換邊部分？答案係 `بِالْبَيْتْ`；搵緊嘅物件仍然係鎖匙。
    - subskill_id: possession_relations
      explanation: 大家數緊可以提供幾多張櫈。阿拉伯語可以用「喺我度」嚟表達擁有；櫈嘅名詞形式本身亦可以表示兩張。
      examples:
        - text: عِنْدِي كُرْسِيَّيْنْ.
          meaning: "**例句。** 我有兩張椅。 `عِنْدِي` 係「我有」。`كُرْسِيَّيْنْ` 用口語雙數詞尾表示兩張櫈。數量屬於櫈，`عِنْدِي` 嘅後綴就指出邊個有。"
          note: 一張櫈可以講 `عِنْدِي كُرْسِي`。改成一張時，唔可以保留雙數詞尾。試下將兩張改成一張：將 `كُرْسِيَّيْنْ` 換成 `كُرْسِي`，擁有嘅表達保留。
    - subskill_id: quantity_comparison
      explanation: 揀搬邊個箱，可能要睇重量。比較句要指出判斷緊邊個箱，以及攞嚟比較嘅另一個箱。
      examples:
        - text: هَادْ الصُّنْدُوقْ أَخَفّ مِنْ هَدَاكْ.
          meaning: "**例句。** 呢個箱比嗰個輕。 `هَادْ الصُّنْدُوقْ` 係呢個箱，`أَخَفّ` 係更輕，`مِنْ هَدَاكْ`
            係「比嗰個」。近嘅呢個同較遠嘅嗰個，令你唔使重複講箱。"
          note: 比較參照前面保留 `مِنْ`。試下話嗰個箱比呢個輕：`هَدَاكْ الصُّنْدُوقْ أَخَفّ مِنْ هَادْ`。調轉指示詞就調轉比較方向，形容詞同關係詞保留。
