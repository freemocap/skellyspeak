sections:
  - subskill_id: identification
    explanation: 介紹眼前嘅鄰居，就係將嗰個人同你嘅關係連起。阿拉伯語可以直接講「呢位係我鄰居」，唔使另加現在式嘅「係」。
    examples:
      - text: هٰذِهِ جَارَتِي.
        meaning: "**例句。** 呢位係我女鄰居。 `هٰذِهِ` 係指女性嘅「呢位」。`جَارَتِي`
          係「我嘅女鄰居」；名詞指出關係，連住嘅詞尾表示「我嘅」。指示詞加名詞，已經係完整介紹。"
        note: 介紹男性鄰居要改指示詞同名詞。試下講完整介紹：`هٰذَا جَارِي`。`هٰذَا` 指佢，`جَارِي` 講出關係，連住嘅「我嘅」後綴保留。
  - subskill_id: qualities_states
    explanation: 有人問條路易唔易行，講闊窄就係有用資訊。呢句係描述條路嘅特徵，唔止係指出邊條路。
    examples:
      - text: هٰذَا الطَّرِيقُ ضَيِّقٌ.
        meaning: "**例句。** 呢條路窄。 `هٰذَا الطَّرِيقُ` 係「呢條路」。`ضَيِّقٌ`
          係「窄」，提供描述。現在式唔使加「係」。完整標音時，呢度路嘅名詞同述語都用主格詞尾。"
        note: 比較 `الطَّرِيقُ الضَّيِّقُ`「條窄路」：形容詞加定冠詞後，係名詞短語，唔係呢個完整描述。試下：邊個詞提供特徵？答案係 `ضَيِّقٌ`，講條路點樣。
  - subskill_id: location_movement
    explanation: 有人搵緊鎖匙。位置陳述可以話畀佢知鎖匙而家喺邊，唔係叫佢帶去另一個地方。
    examples:
      - text: الْمِفْتَاحُ فِي الْبَيْتِ.
        meaning: "**例句。** 條鎖匙喺屋入面。 `الْمِفْتَاحُ` 係鎖匙，`فِي` 係「喺……入面」，`الْبَيْتِ`
          係屋。地方短語直接交代鎖匙位置，唔使另加現在式嘅「係」。完整標音時，`فِي` 後面名詞用屬格詞尾。"
        note: 可以換成 `فِي الْمَكْتَبِ`「喺辦公室」。位置唔同目的地，呢句冇去或者帶嘅動作。試下話鎖匙喺辦公室：`الْمِفْتَاحُ فِي
          الْمَكْتَبِ`，物件保留，只改位置。
  - subskill_id: possession_relations
    explanation: 大家數緊可以提供幾多張櫈。阿拉伯語可以用「喺我度」嚟表達擁有；櫈嘅名詞形式本身亦可以表示兩張。
    examples:
      - text: عِنْدِي كُرْسِيَّانِ.
        meaning: "**例句。** 我有兩張椅。 `عِنْدِي` 係「我有」，字面係「喺我度」，後綴指出我。`كُرْسِيَّانِ` 用雙數詞尾表示兩張櫈，呢句唔使再加一個「二」字。"
        note: 呢度雙數係主格，用 `ـانِ` 收尾。其他語法位置會用另一個双數詞尾，唔好任何地方都照加。試下：邊度表示兩張？答案喺 `كُرْسِيَّانِ` 入面；`عِنْدِي` 指邊個有。
  - subskill_id: quantity_comparison
    explanation: 揀搬邊個箱，可能要睇重量。比較句要指出判斷緊邊個箱，以及攞嚟比較嘅另一個箱。
    examples:
      - text: هٰذَا الصُّنْدُوقُ أَخَفُّ مِنْ ذٰلِكَ.
        meaning: "**例句。** 呢個箱比嗰個輕。 `هٰذَا الصُّنْدُوقُ` 係呢個箱，`أَخَفُّ` 係更輕，`مِنْ ذٰلِكَ`
          係「比嗰個」。第二個指示詞代指已見到或提過嘅箱，唔使再講一次名詞。"
        note: 比較參照之前保留 `مِنْ`。試下反過來話嗰個箱較輕：`ذٰلِكَ الصُّنْدُوقُ أَخَفُّ مِنْ هٰذَا`。前面係判斷較輕嘅箱，`مِنْ`
          後面指示詞係比較參照。
