sections:
  - subskill_id: identification
    explanation: Présenter une voisine relie la personne devant vous à sa relation avec vous. On peut dire « voici
      ma voisine » sans mot distinct pour « est » au présent.
    examples:
      - text: هٰذِهِ جَارَتِي.
        meaning: "**L’exemple.** Voici ma voisine. `هٰذِهِ` désigne un référent féminin proche. `جَارَتِي` signifie «
          ma voisine » : le nom donne la relation et sa terminaison attachée signifie « ma ». Le démonstratif
          et le nom forment ensemble une présentation complète."
        note: "Pour un voisin, changez le démonstratif et le nom. Essayez : présentez votre voisin. Réponse : `هٰذَا
          جَارِي`. `هٰذَا` le désigne et `جَارِي` nomme la relation ; le suffixe « mon » reste attaché."
  - subskill_id: qualities_states
    explanation: Quand quelqu’un demande si une route est facile à emprunter, en décrire la largeur apporte une
      information utile. Cette phrase dit une propriété de la route au lieu de simplement la nommer.
    examples:
      - text: هٰذَا الطَّرِيقُ ضَيِّقٌ.
        meaning: "**L’exemple.** Cette route est étroite. `هٰذَا الطَّرِيقُ` désigne cette route. `ضَيِّقٌ` signifie
          étroite et fournit la description. Il n’y a pas de verbe « être » distinct au présent. Dans
          l’écriture entièrement vocalisée, la route et son prédicat ont ici des terminaisons au nominatif."
        note: "Comparez `الطَّرِيقُ الضَّيِّقُ`, « la route étroite » : ajouter l’article défini à l’adjectif forme un
          groupe nominal plutôt que cette description complète. Essayez : quel mot fait de la phrase une
          description ? Réponse : `ضَيِّقٌ`, qui dit comment est la route."
  - subskill_id: location_movement
    explanation: Quelqu’un cherche une clé. Une indication de lieu dit où elle se trouve maintenant ; elle ne
      demande pas de l’emporter ailleurs.
    examples:
      - text: الْمِفْتَاحُ فِي الْبَيْتِ.
        meaning: "**L’exemple.** La clé est dans la maison. `الْمِفْتَاحُ` désigne la clé. `فِي` signifie « dans » et
          `الْبَيْتِ` la maison. L’expression de lieu situe la clé sans verbe « être » distinct au présent.
          Dans l’écriture entièrement vocalisée, le nom après `فِي` porte une terminaison au génitif."
        note: "Remplacez le lieu par `فِي الْمَكْتَبِ`, « dans le bureau », pour adapter la réponse. La position
          diffère de la destination : la phrase ne contient aucune action de déplacement ou de transport.
          Essayez : situez la clé dans le bureau. Réponse : `الْمِفْتَاحُ فِي الْمَكْتَبِ` garde l’objet et
          change sa position."
  - subskill_id: possession_relations
    explanation: Vous vérifiez combien de chaises vous pouvez fournir. L’arabe peut exprimer la possession en
      disant qu’une chose est « auprès de vous » ; le nom de la chaise peut lui-même indiquer qu’il y en a
      deux.
    examples:
      - text: عِنْدِي كُرْسِيَّانِ.
        meaning: "**L’exemple.** J’ai deux chaises. `عِنْدِي` exprime « j’ai » ; son suffixe renvoie à « moi ».
          `كُرْسِيَّانِ` signifie deux chaises grâce à sa terminaison du duel. Dans cet exemple, aucun mot
          distinct pour « deux » n’est nécessaire."
        note: "Ici, le duel est au nominatif avec la terminaison `ـانِ`. D’autres positions grammaticales ont une
          autre terminaison du duel : ne l’ajoutez pas partout. Essayez : où le nombre deux est-il exprimé ?
          Réponse : dans `كُرْسِيَّانِ` ; `عِنْدِي` désigne la personne qui possède les chaises."
  - subskill_id: quantity_comparison
    explanation: Pour choisir quelle boîte porter, le poids peut compter. Une comparaison nomme la boîte évaluée
      et l’autre boîte qui sert de référence.
    examples:
      - text: هٰذَا الصُّنْدُوقُ أَخَفُّ مِنْ ذٰلِكَ.
        meaning: "**L’exemple.** Cette boîte est plus légère que celle-là. `هٰذَا الصُّنْدُوقُ` désigne cette boîte.
          `أَخَفُّ` signifie plus légère ; `مِنْ ذٰلِكَ` signifie « que celle-là ». Le second démonstratif
          remplace la boîte déjà visible ou évoquée, sans répéter le nom."
        note: "Gardez `مِنْ` avant l’élément de référence. Essayez : dites plutôt que l’autre boîte est plus légère
          que celle-ci. Réponse : `ذٰلِكَ الصُّنْدُوقُ أَخَفُّ مِنْ هٰذَا`. La première boîte est celle que
          l’on juge plus légère ; le démonstratif après `مِنْ` donne la référence."
