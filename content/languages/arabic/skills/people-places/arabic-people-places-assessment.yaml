language: arabic
skill_id: people_places
guidance: Assess identification, descriptions, location or movement, possession or
  relationships, and quantity or comparison. A present nominal sentence may identify or describe
  without an overt be verb. A preposition with a suffixed possessor can express having; an
  attached possessive suffix can identify whose object it is. Comparison needs a recoverable
  standard or ordered alternatives, not merely a route number. A place phrase answering a
  where-question can succeed contextually. A copied demonstrative with no identifiable referent
  or relation is absent. Judge gender, number, definiteness and construction choices against the
  selected variety. Do not demand English articles or a have verb, and do not require Modern
  Standard case endings in Levantine conversation. Clear unsuccessful realization is not
  successful group evidence; ordinary subject omission is not itself failure.
provenance: &a1
  origin: ai
  authorship: AI-authored language-specific guidance, English explanations and original examples,
