varieties:
  arabic-levantine:
    disposition: supplement
    text: Use conversational demonstratives and possessive constructions. Examples use Southern
      Levantine forms such as هَادْ and هَايْ; other established regional forms are valid. Do
      not import the formal nominative dual ending or formal case vowels into colloquial
      assessment.
    provenance: *a1
  arabic-modern-standard:
    disposition: supplement
    text: Use Modern Standard demonstratives, agreement and case where the written or spoken
      register makes them relevant. Distinguish a definite noun plus indefinite predicate from a
      definite attributive adjective. Pausal pronunciation is not automatically an error.
    provenance: *a1
