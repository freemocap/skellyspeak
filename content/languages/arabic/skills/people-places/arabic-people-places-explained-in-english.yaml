variety_sections:
  arabic-levantine:
    - subskill_id: identification
      explanation: Introducing a neighbor means linking the person in front of you to a relationship. You
        can say this is my neighbor without a separate present-tense word for is.
      examples:
        - text: هَايْ جَارْتِي.
          meaning: "**The example.** This is my neighbor. `هَايْ` points to a feminine referent nearby;
            `جَارْتِي` means my female neighbor. The possessive suffix stays attached to the noun.
            The sentence identifies someone rather than describing what she is doing."
          note: "These demonstratives are Southern forms; local alternatives exist. Try it: introduce your
            male neighbor using this model. Answer: `هَادْ جَارِي`. Change `هَايْ` to `هَادْ` and
            the female-neighbor noun to its male form, keeping the my suffix."
    - subskill_id: qualities_states
      explanation: When someone asks whether a road is easy to pass, describing its width gives useful
        information. This sentence says something about the road rather than just naming it.
      examples:
        - text: هَادْ الطَّرِيقْ ضَيِّقْ.
          meaning: "**The example.** This road is narrow. `هَادْ` means this, `الطَّرِيقْ` is the road, and
            `ضَيِّقْ` is narrow. Linking the road directly to the adjective gives a present
            description. The adjective is the new information, rather than part of the road’s name."
          note: "`الطَّرِيقْ الضَّيِّقْ` means the narrow road: both noun and adjective are definite. The
            worked statement leaves the descriptive adjective without the article. Try it: is the
            example telling you to move? Answer: no; it describes width, without a movement verb."
    - subskill_id: location_movement
      explanation: Someone is looking for a key. A location statement tells them where it is now; it does
        not ask them to take it somewhere.
      examples:
        - text: الْمِفْتَاحْ بِالْبَيْتْ.
          meaning: "**The example.** The key is in the house. `الْمِفْتَاحْ` names the key. `بِالْبَيْتْ`
            combines the attached preposition `بِـ` with the house, giving in the house here. There
            is no separate present-tense is; the place completes the statement."
          note: "Use `بِالْمَكْتَبْ` for in the office. Keep the attached preposition when changing the place.
            Try it: which part should you replace to give a different location? Answer:
            `بِالْبَيْتْ`; the key stays the object being located."
    - subskill_id: possession_relations
      explanation: You are checking how many chairs you can provide. Arabic can express having something
        by saying it is with you; the chair noun itself can mark a count of two.
      examples:
        - text: عِنْدِي كُرْسِيَّيْنْ.
          meaning: "**The example.** I have two chairs. `عِنْدِي` means I have. `كُرْسِيَّيْنْ` is two chairs,
            with the spoken dual ending. The count belongs to the chairs; the suffix on `عِنْدِي`
            identifies their holder."
          note: "For one chair, say `عِنْدِي كُرْسِي`. Do not keep the dual ending when the count changes to
            one. Try it: change two chairs to one. Answer: replace `كُرْسِيَّيْنْ` with `كُرْسِي`;
            the possession expression stays the same."
    - subskill_id: quantity_comparison
      explanation: Choosing which box to carry may depend on weight. A comparison names the box you are
        judging and the other box used as the reference.
      examples:
        - text: هَادْ الصُّنْدُوقْ أَخَفّ مِنْ هَدَاكْ.
          meaning: "**The example.** This box is lighter than that one. `هَادْ الصُّنْدُوقْ` is this box.
            `أَخَفّ` means lighter and `مِنْ هَدَاكْ` means than that one. Near this and farther
            that let you compare two objects without repeating the word box."
          note: "Keep `مِنْ` before the reference object. Try it: say that box is lighter than this one.
            Answer: `هَدَاكْ الصُّنْدُوقْ أَخَفّ مِنْ هَادْ`. Reversing the demonstratives reverses
            the comparison, while the adjective and relation word remain."
