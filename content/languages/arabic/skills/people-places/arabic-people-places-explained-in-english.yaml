sections:
  - subskill_id: identification
    explanation: Introducing a neighbor means linking the person in front of you to a relationship. You
      can say this is my neighbor without a separate present-tense word for is.
    examples:
      - text: هٰذِهِ جَارَتِي.
        meaning: "**The example.** This is my neighbor. `هٰذِهِ` means this for a feminine referent.
          `جَارَتِي` means my female neighbor: the noun identifies her relationship to you and the
          attached ending means my. The demonstrative and noun together make a complete
          introduction."
        note: "For a male neighbor, change both the demonstrative and noun. Try it: introduce your male
          neighbor. Answer: `هٰذَا جَارِي`. `هٰذَا` points to him and `جَارِي` names the
          relationship; the attached my suffix remains."
  - subskill_id: qualities_states
    explanation: When someone asks whether a road is easy to pass, describing its width gives useful
      information. This sentence says something about the road rather than just naming it.
    examples:
      - text: هٰذَا الطَّرِيقُ ضَيِّقٌ.
        meaning: "**The example.** This road is narrow. `هٰذَا الطَّرِيقُ` means this road. `ضَيِّقٌ` means
          narrow and supplies the description. There is no present-tense is. In fully vocalized
          writing, the road and its predicate here have nominative endings."
        note: "Compare `الطَّرِيقُ الضَّيِّقُ`, the narrow road: adding the definite article to the
          adjective makes a noun phrase rather than this complete description. Try it: which word
          makes the statement a description? Answer: `ضَيِّقٌ`, saying what the road is like."
  - subskill_id: location_movement
    explanation: Someone is looking for a key. A location statement tells them where it is now; it does
      not ask them to take it somewhere.
    examples:
      - text: الْمِفْتَاحُ فِي الْبَيْتِ.
        meaning: "**The example.** The key is in the house. `الْمِفْتَاحُ` is the key. `فِي` means in and
          `الْبَيْتِ` is the house. The place phrase tells us where the key is without a separate
          present-tense is. The noun after `فِي` has a genitive ending in fully vocalized writing."
        note: "Replace the place with `فِي الْمَكْتَبِ`, in the office, to adapt the answer. Location is
          different from destination: this sentence contains no going or carrying action. Try it:
          place the key in the office. Answer: `الْمِفْتَاحُ فِي الْمَكْتَبِ` keeps the object and
          changes its location."
  - subskill_id: possession_relations
    explanation: You are checking how many chairs you can provide. Arabic can express having something
      by saying it is with you; the chair noun itself can mark a count of two.
    examples:
      - text: عِنْدِي كُرْسِيَّانِ.
        meaning: "**The example.** I have two chairs. `عِنْدِي` means I have, literally at me; its suffix
          means me or my in this expression. `كُرْسِيَّانِ` means two chairs, using the dual ending.
          No separate word for two is needed in this example."
        note: "Here the dual is nominative, ending in `ـانِ`. Other grammatical positions use a different
          dual ending, so this is not an ending to attach everywhere. Try it: where is the number
          two expressed? Answer: inside `كُرْسِيَّانِ`; `عِنْدِي` identifies who has them."
  - subskill_id: quantity_comparison
    explanation: Choosing which box to carry may depend on weight. A comparison names the box you are
      judging and the other box used as the reference.
    examples:
      - text: هٰذَا الصُّنْدُوقُ أَخَفُّ مِنْ ذٰلِكَ.
        meaning: "**The example.** This box is lighter than that one. `هٰذَا الصُّنْدُوقُ` means this box.
          `أَخَفُّ` means lighter; `مِنْ ذٰلِكَ` means than that one. The second demonstrative
          stands for the box already visible or mentioned, so the noun need not be repeated."
        note: "Keep `مِنْ` before the comparison reference. Try it: say that box is lighter than this one
          instead. Answer: `ذٰلِكَ الصُّنْدُوقُ أَخَفُّ مِنْ هٰذَا`. The first box is the one judged
          lighter; the demonstrative after `مِنْ` names the reference."
