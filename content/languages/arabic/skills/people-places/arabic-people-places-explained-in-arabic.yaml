variety_sections:
  arabic-levantine:
    - subskill_id: identification
      explanation: يعني تعريف الجار ربط الشخص الذي أمامك بعلاقة الجوار. يمكنك قول «هذه جارتي» من غير كلمة
        منفصلة في الحاضر بمعنى «هي».
      examples:
        - text: هَايْ جَارْتِي.
          meaning: "**المثال.** هذه جارتي. تشير `هَايْ` إلى مؤنث قريب؛ وتعني `جَارْتِي` جارتي. تبقى لاحقة
            الملكية متصلة بالاسم. تحدد الجملة هوية شخص ولا تصف ما يفعله."
          note: "أسماء الإشارة هذه صيغ جنوبية، ولها بدائل محلية. **جرّب:** عرّف بجارك الرجل وفق هذا النموذج.
            الإجابة: `هَادْ جَارِي`. غيّر `هَايْ` إلى `هَادْ` واسم الجارة إلى صيغة الجار، مع إبقاء
            لاحقة الملكية."
    - subskill_id: qualities_states
      explanation: عندما يسأل شخص هل يسهل المرور في طريق، يفيده وصف عرضه. تخبر الجملة بشيء عن الطريق بدل
        تسميته فقط.
      examples:
        - text: هَادْ الطَّرِيقْ ضَيِّقْ.
          meaning: "**المثال.** هذا الطريق ضيق. تعني `هَادْ` «هذا»، و`الطَّرِيقْ` الطريق، و`ضَيِّقْ` ضيقًا.
            يقدّم ربط الطريق بالصفة مباشرة وصفًا حاضرًا. الصفة معلومة جديدة، وليست جزءًا من اسم
            الطريق."
          note: "تعني `الطَّرِيقْ الضَّيِّقْ` «الطريق الضيق»: الاسم والصفة كلاهما معرفان. تبقى الصفة الوصفية
            في الجملة المدروسة بلا أداة تعريف. **جرّب:** هل يأمرك المثال بالحركة؟ الإجابة: لا؛ يصف
            عرض الطريق من غير فعل حركة."
    - subskill_id: location_movement
      explanation: يبحث شخص عن مفتاح. تخبره جملة المكان أين يوجد الآن؛ ولا تطلب منه نقله إلى مكان آخر.
      examples:
        - text: الْمِفْتَاحْ بِالْبَيْتْ.
          meaning: "**المثال.** المفتاح في البيت. يسمّي `الْمِفْتَاحْ` المفتاح. تجمع `بِالْبَيْتْ` حرف الجر
            المتصل `بِـ` بالبيت، فتعني «في البيت» هنا. لا يوجد فعل حاضر منفصل بمعنى «is»؛ ويكمل
            المكان الجملة."
          note: "استعمل `بِالْمَكْتَبْ` للمكان «في المكتب». أبقِ حرف الجر متصلًا عند تغيير المكان. **جرّب:**
            أي جزء تستبدله لذكر مكان آخر؟ الإجابة: `بِالْبَيْتْ`؛ ويبقى المفتاح الغرض الذي تحدد
            مكانه."
    - subskill_id: possession_relations
      explanation: تتحقق من عدد الكراسي التي تستطيع توفيرها. يمكن للعربية التعبير عن امتلاك شيء بقول إنه
        عندك؛ وقد يحمل اسم الكرسي نفسه علامة العدد اثنين.
      examples:
        - text: عِنْدِي كُرْسِيَّيْنْ.
          meaning: "**المثال.** عندي كرسيان. تعني `عِنْدِي` أن الشيء عندي. و`كُرْسِيَّيْنْ` كرسيان مع نهاية
            المثنى المنطوقة. يرتبط العدد بالكراسي؛ وتحدد لاحقة `عِنْدِي` من يملكها."
          note: "لكرسي واحد قل `عِنْدِي كُرْسِي`. لا تُبقِ نهاية المثنى عندما يتغير العدد إلى واحد. **جرّب:**
            غيّر الكرسيين إلى كرسي واحد. الإجابة: استبدل `كُرْسِيَّيْنْ` بـ`كُرْسِي`؛ وتبقى عبارة
            الملكية كما هي."
    - subskill_id: quantity_comparison
      explanation: قد يتوقف اختيار الصندوق الذي ستحمله على وزنه. تسمّي المقارنة الصندوق الذي تحكم عليه
        والصندوق الآخر الذي تقيس به.
      examples:
        - text: هَادْ الصُّنْدُوقْ أَخَفّ مِنْ هَدَاكْ.
          meaning: "**المثال.** هذا الصندوق أخف من ذاك. `هَادْ الصُّنْدُوقْ` هو هذا الصندوق. وتعني `أَخَفّ`
            «أخف»، وتعني `مِنْ هَدَاكْ` «من ذاك». يتيح اسم الإشارة للقريب والآخر للأبعد مقارنة غرضين
            من غير تكرار كلمة صندوق."
          note: "أبقِ `مِنْ` قبل الغرض المرجعي. **جرّب:** قل إن ذاك الصندوق أخف من هذا. الإجابة: `هَدَاكْ
            الصُّنْدُوقْ أَخَفّ مِنْ هَادْ`. يعكس تبديل اسمي الإشارة المقارنة، وتبقى الصفة وكلمة
            العلاقة كما هما."
