sections:
  - subskill_id: identification
    explanation: يعني تعريف الجار ربط الشخص الذي أمامك بعلاقة الجوار. يمكنك قول «هذه جارتي» من غير كلمة
      منفصلة في الحاضر بمعنى «هي».
    examples:
      - text: هٰذِهِ جَارَتِي.
        meaning: "**المثال.** هذه جارتي. تشير `هٰذِهِ` إلى مؤنث. وتعني `جَارَتِي` جارتي: يسمّي الاسم علاقتها
          بك، وتدل اللاحقة المتصلة على المتكلم. تشكل الإشارة والاسم معًا تعريفًا كاملًا."
        note: "للجار الرجل غيّر اسم الإشارة والاسم. **جرّب:** عرّف بجارك. الإجابة: `هٰذَا جَارِي`. تشير
          `هٰذَا` إليه، وتسمّي `جَارِي` العلاقة؛ وتبقى لاحقة الملكية للمتكلم."
  - subskill_id: qualities_states
    explanation: عندما يسأل شخص هل يسهل المرور في طريق، يفيده وصف عرضه. تخبر الجملة بشيء عن الطريق بدل
      تسميته فقط.
    examples:
      - text: هٰذَا الطَّرِيقُ ضَيِّقٌ.
        meaning: "**المثال.** هذا الطريق ضيق. تعني `هٰذَا الطَّرِيقُ` هذا الطريق. وتعني `ضَيِّقٌ` ضيقًا
          وتقدّم الوصف. لا يوجد فعل حاضر منفصل بمعنى «is». في الكتابة المشكولة كليًا، يحمل الطريق
          وخبره هنا علامتي الرفع."
        note: "قارن بـ`الطَّرِيقُ الضَّيِّقُ`، أي «الطريق الضيق»: تجعل إضافة أداة التعريف إلى الصفة التركيبَ
          عبارةً اسمية لا هذا الوصف المكتمل. **جرّب:** أي كلمة تجعل الجملة وصفًا؟ الإجابة:
          `ضَيِّقٌ`، فهي تخبر عن حال الطريق."
  - subskill_id: location_movement
    explanation: يبحث شخص عن مفتاح. تخبره جملة المكان أين يوجد الآن؛ ولا تطلب منه نقله إلى مكان آخر.
    examples:
      - text: الْمِفْتَاحُ فِي الْبَيْتِ.
        meaning: "**المثال.** المفتاح في البيت. `الْمِفْتَاحُ` هو المفتاح. وتعني `فِي` «داخل»، و`الْبَيْتِ`
          هو البيت. تخبر عبارة المكان أين يوجد المفتاح من غير فعل حاضر منفصل بمعنى «is». ويحمل الاسم
          بعد `فِي` علامة الجر في الكتابة المشكولة كليًا."
        note: "استبدل المكان بـ`فِي الْمَكْتَبِ`، أي في المكتب، لتعديل الجواب. يختلف الموقع عن الوجهة: لا
          تحتوي الجملة فعل ذهاب أو حمل. **جرّب:** ضع المفتاح في المكتب في وصفك. الإجابة:
          `الْمِفْتَاحُ فِي الْمَكْتَبِ`؛ يبقى الغرض ويتغير مكانه."
  - subskill_id: possession_relations
    explanation: تتحقق من عدد الكراسي التي تستطيع توفيرها. يمكن للعربية التعبير عن امتلاك شيء بقول إنه
      عندك؛ وقد يحمل اسم الكرسي نفسه علامة العدد اثنين.
    examples:
      - text: عِنْدِي كُرْسِيَّانِ.
        meaning: "**المثال.** عندي كرسيان. تعني `عِنْدِي` أن الشيء عندي؛ وتدل لاحقتها هنا على المتكلم. وتعني
          `كُرْسِيَّانِ` كرسيّان بصيغة المثنى المرفوع. لا حاجة إلى كلمة مستقلة للعدد اثنين في هذا المثال."
        note: "صيغة المثنى هنا مرفوعة وتنتهي بـ`ـانِ`. تستعمل مواقع نحوية أخرى نهاية مثنى مختلفة، فلا تضف
          هذه النهاية في كل موضع. **جرّب:** أين يظهر العدد اثنان؟ الإجابة: داخل `كُرْسِيَّانِ`؛
          وتحدد `عِنْدِي` من يملكهما."
  - subskill_id: quantity_comparison
    explanation: قد يتوقف اختيار الصندوق الذي ستحمله على وزنه. تسمّي المقارنة الصندوق الذي تحكم عليه
      والصندوق الآخر الذي تقيس به.
    examples:
      - text: هٰذَا الصُّنْدُوقُ أَخَفُّ مِنْ ذٰلِكَ.
        meaning: "**المثال.** هذا الصندوق أخف من ذاك. تعني `هٰذَا الصُّنْدُوقُ` هذا الصندوق. وتعني `أَخَفُّ`
          أخف؛ وتعني `مِنْ ذٰلِكَ` «من ذاك». يحل اسم الإشارة الثاني محل الصندوق المرئي أو المذكور
          سابقًا، فلا حاجة إلى تكرار الاسم."
        note: "أبقِ `مِنْ` قبل مرجع المقارنة. **جرّب:** قل إن ذاك الصندوق أخف من هذا بدلًا من ذلك. الإجابة:
          `ذٰلِكَ الصُّنْدُوقُ أَخَفُّ مِنْ هٰذَا`. الصندوق الأول هو المحكوم بأنه أخف؛ واسم الإشارة
          بعد `مِنْ` يسمّي مرجع المقارنة."
