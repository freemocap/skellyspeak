sections:
  - subskill_id: identification
    explanation: Apresentar uma vizinha relaciona a pessoa diante de você à relação que têm. É possível dizer «
      esta é minha vizinha » sem uma palavra separada de presente equivalente a « é ».
    examples:
      - text: هٰذِهِ جَارَتِي.
        meaning: "**O exemplo.** Esta é minha vizinha. `هٰذِهِ` significa esta para um referente feminino. `جَارَتِي`
          significa minha vizinha: o substantivo indica a relação, e a terminação ligada a ele significa
          minha. Demonstrativo e substantivo formam uma apresentação completa."
        note: "Para um vizinho, mude tanto o demonstrativo quanto o substantivo. Experimente apresentá-lo. Resposta:
          `هٰذَا جَارِي`. `هٰذَا` aponta para ele e `جَارِي` nomeia a relação; o sufixo de « meu » permanece."
  - subskill_id: qualities_states
    explanation: Quando alguém pergunta se é fácil passar por uma estrada, descrever sua largura fornece uma
      informação útil. A frase afirma uma propriedade da estrada, em vez de apenas nomeá-la.
    examples:
      - text: هٰذَا الطَّرِيقُ ضَيِّقٌ.
        meaning: "**O exemplo.** Esta estrada é estreita. `هٰذَا الطَّرِيقُ` significa esta estrada. `ضَيِّقٌ`
          significa estreita e fornece a descrição. Não há verbo separado de presente equivalente a « é ». Na
          escrita totalmente vocalizada, o nome e o predicativo têm aqui terminações de nominativo."
        note: "Compare `الطَّرِيقُ الضَّيِّقُ`, « a estrada estreita »: acrescentar o artigo ao adjetivo forma uma
          expressão nominal, não esta descrição completa. Experimente: qual palavra transforma a frase em
          descrição? Resposta: `ضَيِّقٌ`, que diz como é a estrada."
  - subskill_id: location_movement
    explanation: Alguém procura uma chave. Uma frase de localização diz onde ela está agora; não pede que seja
      levada a outro lugar.
    examples:
      - text: الْمِفْتَاحُ فِي الْبَيْتِ.
        meaning: "**O exemplo.** A chave está dentro da casa. `الْمِفْتَاحُ` é a chave. `فِي` significa em, e
          `الْبَيْتِ` é a casa. A expressão de lugar indica a posição sem verbo separado para « estar » no
          presente. Na escrita totalmente vocalizada, o nome depois de `فِي` tem terminação de genitivo."
        note: "Troque o lugar por `فِي الْمَكْتَبِ`, no escritório. Localização não é destino: não há ação de ir ou
          carregar. Experimente colocar a chave no escritório. Resposta: `الْمِفْتَاحُ فِي الْمَكْتَبِ`
          conserva o objeto e muda o lugar."
  - subskill_id: possession_relations
    explanation: Você verifica quantas cadeiras pode fornecer. O árabe pode expressar posse dizendo que algo está
      com você; o próprio substantivo cadeira pode marcar a quantidade dois.
    examples:
      - text: عِنْدِي كُرْسِيَّانِ.
        meaning: "**O exemplo.** Tenho duas cadeiras. `عِنْدِي` significa tenho, literalmente « junto a mim »; seu
          sufixo indica a pessoa que as possui. `كُرْسِيَّانِ` significa duas cadeiras, com a terminação do
          dual. Não é necessário acrescentar uma palavra separada para dois neste exemplo."
        note: "Aqui o dual está no nominativo e termina em `ـانِ`. Outras posições gramaticais usam outra terminação;
          ela não deve ser acrescentada em todos os casos. Experimente: onde aparece a quantidade dois?
          Resposta: em `كُرْسِيَّانِ`; `عِنْدِي` indica quem tem as cadeiras."
  - subskill_id: quantity_comparison
    explanation: A escolha da caixa a carregar pode depender do peso. A comparação nomeia a caixa avaliada e a
      outra caixa usada como referência.
    examples:
      - text: هٰذَا الصُّنْدُوقُ أَخَفُّ مِنْ ذٰلِكَ.
        meaning: "**O exemplo.** Esta caixa é mais leve que aquela. `هٰذَا الصُّنْدُوقُ` significa esta caixa.
          `أَخَفُّ` significa mais leve; `مِنْ ذٰلِكَ` é do que aquela. O segundo demonstrativo representa a
          caixa já visível ou mencionada, sem repetir o substantivo."
        note: "Mantenha `مِنْ` antes da referência da comparação. Experimente dizer que aquela caixa é mais leve que
          esta. Resposta: `ذٰلِكَ الصُّنْدُوقُ أَخَفُّ مِنْ هٰذَا`. A primeira caixa é a considerada mais
          leve; o demonstrativo depois de `مِنْ` nomeia a referência."
