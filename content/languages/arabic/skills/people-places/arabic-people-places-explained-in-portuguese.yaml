variety_sections:
  arabic-levantine:
    - subskill_id: identification
      explanation: Apresentar uma vizinha relaciona a pessoa diante de você à sua relação com ela. Não é preciso uma
        palavra separada de presente equivalente a « é ».
      examples:
        - text: هَايْ جَارْتِي.
          meaning: "**O exemplo.** Esta é minha vizinha. `هَايْ` aponta para um referente feminino próximo; `جَارْتِي`
            significa minha vizinha. O sufixo de posse fica ligado ao nome. A frase identifica a pessoa, em
            vez de descrever o que ela está fazendo."
          note: "Esses demonstrativos são formas meridionais; existem alternativas locais. Experimente apresentar seu
            vizinho com este modelo. Resposta: `هَادْ جَارِي`. Troque `هَايْ` por `هَادْ` e o nome feminino
            pelo masculino, mantendo o sufixo de « meu »."
    - subskill_id: qualities_states
      explanation: Quando alguém pergunta se é fácil passar por uma estrada, descrever sua largura ajuda. A frase
        descreve a estrada, em vez de simplesmente nomeá-la.
      examples:
        - text: هَادْ الطَّرِيقْ ضَيِّقْ.
          meaning: "**O exemplo.** Esta estrada é estreita. `هَادْ` significa esta, `الطَّرِيقْ` é a estrada e `ضَيِّقْ`
            significa estreita. Ligar diretamente o nome ao adjetivo forma uma descrição no presente. O
            adjetivo traz a informação nova e não integra o nome da estrada."
          note: "`الطَّرِيقْ الضَّيِّقْ` significa « a estrada estreita »: substantivo e adjetivo estão definidos. Na
            frase estudada, o adjetivo descritivo não tem artigo. Experimente: ela manda alguém se mover?
            Resposta: não; descreve a largura sem verbo de movimento."
    - subskill_id: location_movement
      explanation: Alguém procura uma chave. Uma frase de localização informa onde ela está agora, sem pedir que
        seja levada a outro lugar.
      examples:
        - text: الْمِفْتَاحْ بِالْبَيْتْ.
          meaning: "**O exemplo.** A chave está dentro da casa. `الْمِفْتَاحْ` nomeia a chave. `بِالْبَيْتْ` combina a
            preposição ligada `بِـ` com o nome da casa; aqui, o conjunto significa dentro da casa. Não há um
            verbo separado para « estar » no presente; o lugar completa a frase."
          note: "Use `بِالْمَكْتَبْ` para « no escritório ». Conserve a preposição ligada ao trocar o lugar.
            Experimente: que parte substituir para informar outra localização? Resposta: `بِالْبَيْتْ`; a
            chave continua sendo o objeto localizado."
    - subskill_id: possession_relations
      explanation: Você verifica quantas cadeiras pode fornecer. O árabe pode dizer que algo está com você para
        expressar posse; o próprio nome da cadeira pode marcar duas unidades.
      examples:
        - text: عِنْدِي كُرْسِيَّيْنْ.
          meaning: "**O exemplo.** Tenho duas cadeiras. `عِنْدِي` significa tenho. `كُرْسِيَّيْنْ` designa duas cadeiras
            com a terminação oral do dual. O número pertence ao substantivo cadeiras; o sufixo de `عِنْدِي`
            indica quem as possui."
          note: "Para uma cadeira, diga `عِنْدِي كُرْسِي`. Não mantenha a terminação dual quando o número passa a um.
            Experimente: passe de duas cadeiras a uma. Resposta: substitua `كُرْسِيَّيْنْ` por `كُرْسِي`; a
            expressão de posse não muda."
    - subskill_id: quantity_comparison
      explanation: O peso pode determinar qual caixa carregar. Uma comparação nomeia a caixa avaliada e a outra que
        serve de referência.
      examples:
        - text: هَادْ الصُّنْدُوقْ أَخَفّ مِنْ هَدَاكْ.
          meaning: "**O exemplo.** Esta caixa é mais leve que aquela. `هَادْ الصُّنْدُوقْ` é esta caixa. `أَخَفّ`
            significa mais leve e `مِنْ هَدَاكْ` significa do que aquela. O demonstrativo próximo e o mais
            distante permitem comparar dois objetos sem repetir « caixa »."
          note: "Mantenha `مِنْ` antes do objeto de referência. Experimente dizer que aquela caixa é mais leve que esta.
            Resposta: `هَدَاكْ الصُّنْدُوقْ أَخَفّ مِنْ هَادْ`. Inverter os demonstrativos inverte a
            comparação; o adjetivo e a relação permanecem."
