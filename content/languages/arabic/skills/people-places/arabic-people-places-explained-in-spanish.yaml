sections:
  - subskill_id: identification
    explanation: Presentar a una vecina consiste en relacionar a la persona ante ti con un vínculo.
      Puedes decir esta es mi vecina sin una palabra independiente para es en presente.
    examples:
      - text: هٰذِهِ جَارَتِي.
        meaning: "**El ejemplo.** Esta es mi vecina. `هٰذِهِ` significa esta para un referente femenino.
          `جَارَتِي` significa mi vecina: el nombre indica la relación contigo y la terminación
          unida expresa mi. Juntos, el demostrativo y el nombre forman una presentación completa."
        note: "Para un vecino, cambia tanto el demostrativo como el nombre. **Practica:** presenta a tu
          vecino. Respuesta: `هٰذَا جَارِي`. `هٰذَا` lo señala y `جَارِي` nombra la relación; se
          conserva el sufijo de mi."
  - subskill_id: qualities_states
    explanation: Si alguien pregunta si una carretera es fácil de transitar, describir su anchura aporta
      información útil. Esta oración dice cómo es la carretera, no solo la nombra.
    examples:
      - text: هٰذَا الطَّرِيقُ ضَيِّقٌ.
        meaning: "**El ejemplo.** Este camino es estrecho. `هٰذَا الطَّرِيقُ` significa este camino.
          `ضَيِّقٌ` significa estrecho y aporta la descripción. No hay un es presente independiente.
          En la escritura plenamente vocalizada, el nombre y el predicado llevan aquí terminaciones
          nominativas."
        note: "Compara `الطَّرِيقُ الضَّيِّقُ`, el camino estrecho: el artículo en el adjetivo forma parte
          de una expresión nominal, no de esta descripción completa. **Practica:** ¿qué palabra
          convierte la frase en descripción? Respuesta: `ضَيِّقٌ`, que dice cómo es el camino."
  - subskill_id: location_movement
    explanation: Alguien busca una llave. Una oración de lugar indica dónde está ahora; no pide llevarla
      a otro sitio.
    examples:
      - text: الْمِفْتَاحُ فِي الْبَيْتِ.
        meaning: "**El ejemplo.** La llave está en la casa. `الْمِفْتَاحُ` es la llave. `فِي` significa en y
          `الْبَيْتِ`, la casa. La expresión de lugar indica su posición sin un está presente
          separado. Tras `فِي`, el nombre lleva terminación de genitivo en la escritura plenamente
          vocalizada."
        note: "Sustituye el lugar por `فِي الْمَكْتَبِ`, en la oficina, para adaptar la respuesta. Ubicación
          y destino son distintos: aquí no hay ningún verbo de ir o llevar. **Practica:** sitúa la
          llave en la oficina. Respuesta: `الْمِفْتَاحُ فِي الْمَكْتَبِ`; se conserva el objeto y
          cambia el lugar."
  - subskill_id: possession_relations
    explanation: Compruebas cuántas sillas puedes proporcionar. El árabe puede expresar posesión
      indicando que algo está contigo; el propio nombre de silla puede marcar una cantidad de dos.
    examples:
      - text: عِنْدِي كُرْسِيَّانِ.
        meaning: "**El ejemplo.** Tengo dos sillas. `عِنْدِي` significa tengo, literalmente junto a mí; su
          sufijo señala a quien las tiene. `كُرْسِيَّانِ` significa dos sillas gracias a la
          terminación dual. Aquí no hace falta una palabra independiente para dos."
        note: "El dual lleva aquí nominativo y termina en `ـانِ`. Otras funciones gramaticales usan otra
          terminación dual, por lo que no se añade esta en todas partes. **Practica:** ¿dónde se
          expresa el número dos? Respuesta: dentro de `كُرْسِيَّانِ`; `عِنْدِي` identifica a quien
          las posee."
  - subskill_id: quantity_comparison
    explanation: Elegir qué caja cargar puede depender del peso. Una comparación nombra la caja evaluada
      y la otra que sirve de referencia.
    examples:
      - text: هٰذَا الصُّنْدُوقُ أَخَفُّ مِنْ ذٰلِكَ.
        meaning: "**El ejemplo.** Esta caja es más ligera que aquella. `هٰذَا الصُّنْدُوقُ` significa esta
          caja. `أَخَفُّ` es más ligera; `مِنْ ذٰلِكَ` indica que aquella. El segundo demostrativo
          sustituye a una caja ya visible o mencionada, sin repetir el nombre."
        note: "Conserva `مِنْ` antes de la referencia de la comparación. **Practica:** di que aquella caja
          es más ligera que esta. Respuesta: `ذٰلِكَ الصُّنْدُوقُ أَخَفُّ مِنْ هٰذَا`. La primera
          caja es la evaluada como más ligera y el demostrativo después de `مِنْ` da la referencia."
