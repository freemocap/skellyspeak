variety_sections:
  arabic-levantine:
    - subskill_id: identification
      explanation: Presentar a una vecina consiste en relacionar a la persona ante ti con un vínculo.
        Puedes decir esta es mi vecina sin una palabra independiente para es en presente.
      examples:
        - text: هَايْ جَارْتِي.
          meaning: "**El ejemplo.** Esta es mi vecina. `هَايْ` señala a una mujer cercana; `جَارْتِي`
            significa mi vecina. El sufijo posesivo va unido al nombre. La oración identifica a
            alguien, sin describir qué está haciendo."
          note: "Estos demostrativos son formas meridionales y existen alternativas locales. **Practica:**
            presenta a tu vecino con este modelo. Respuesta: `هَادْ جَارِي`. Cambia `هَايْ` por
            `هَادْ` y la palabra femenina de vecina por la masculina; conserva el sufijo de mi."
    - subskill_id: qualities_states
      explanation: Si alguien pregunta si una carretera es fácil de transitar, describir su anchura aporta
        información útil. Esta oración dice cómo es la carretera, no solo la nombra.
      examples:
        - text: هَادْ الطَّرِيقْ ضَيِّقْ.
          meaning: "**El ejemplo.** Este camino es estrecho. `هَادْ` significa este, `الطَّرِيقْ` es el camino
            y `ضَيِّقْ`, estrecho. Unir directamente el camino con el adjetivo da una descripción
            presente. El adjetivo es la información nueva, no parte del nombre del camino."
          note: "`الطَّرِيقْ الضَّيِّقْ` significa el camino estrecho: nombre y adjetivo son definidos. En la
            oración descriptiva, el adjetivo no lleva artículo. **Practica:** ¿indica el ejemplo que
            te muevas? Respuesta: no; describe la anchura, sin verbo de movimiento."
    - subskill_id: location_movement
      explanation: Alguien busca una llave. Una oración de lugar indica dónde está ahora; no pide llevarla
        a otro sitio.
      examples:
        - text: الْمِفْتَاحْ بِالْبَيْتْ.
          meaning: "**El ejemplo.** La llave está en la casa. `الْمِفْتَاحْ` nombra la llave. `بِالْبَيْتْ`
            combina la preposición unida `بِـ` con la casa y aquí significa en la casa. No hay un
            está presente separado: el lugar completa la oración."
          note: "Usa `بِالْمَكْتَبْ` para en la oficina. Conserva la preposición unida al cambiar el lugar.
            **Practica:** ¿qué parte debes sustituir para dar otra ubicación? Respuesta:
            `بِالْبَيْتْ`; la llave sigue siendo el objeto localizado."
    - subskill_id: possession_relations
      explanation: Compruebas cuántas sillas puedes proporcionar. El árabe puede expresar posesión
        indicando que algo está contigo; el propio nombre de silla puede marcar una cantidad de dos.
      examples:
        - text: عِنْدِي كُرْسِيَّيْنْ.
          meaning: "**El ejemplo.** Tengo dos sillas. `عِنْدِي` significa tengo. `كُرْسِيَّيْنْ` son dos
            sillas, con la terminación dual hablada. La cantidad corresponde a las sillas; el sufijo
            de `عِنْدِي` identifica a quien las tiene."
          note: "Para una sola silla, di `عِنْدِي كُرْسِي`. No conserves el dual si cambia la cantidad a una.
            **Practica:** cambia dos sillas por una. Respuesta: sustituye `كُرْسِيَّيْنْ` por
            `كُرْسِي`; la expresión posesiva permanece igual."
    - subskill_id: quantity_comparison
      explanation: Elegir qué caja cargar puede depender del peso. Una comparación nombra la caja evaluada
        y la otra que sirve de referencia.
      examples:
        - text: هَادْ الصُّنْدُوقْ أَخَفّ مِنْ هَدَاكْ.
          meaning: "**El ejemplo.** Esta caja es más ligera que aquella. `هَادْ الصُّنْدُوقْ` es esta caja.
            `أَخَفّ` significa más ligera y `مِنْ هَدَاكْ`, que aquella. Este cercano y aquel más
            lejano permiten comparar dos objetos sin repetir caja."
          note: "Conserva `مِنْ` antes de la referencia. **Practica:** di que aquella caja es más ligera que
            esta. Respuesta: `هَدَاكْ الصُّنْدُوقْ أَخَفّ مِنْ هَادْ`. Invertir los demostrativos
            invierte la comparación; el adjetivo y la palabra de relación no cambian."
