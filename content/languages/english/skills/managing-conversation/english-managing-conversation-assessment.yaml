skill_id: managing_conversation
language: english
guidance: Look for an appropriate greeting, closing, acknowledgement,
  clarification request, rephrasing, repair or turn/topic management. What do
  you mean by that? correctly requests clarification. What you meaning by that?
  does not correctly form that request. Sorry? can be a valid contextual request
  for repetition. Judge whether a repair or acknowledgement refers coherently to
  prior speech. An ordinary question about a new fact does not become
  conversational repair merely because it is a question. Credit requires correct
  use of this function, not an unsuccessful attempt. Unrelated errors do not
  invalidate a successful instance. Use unclear when the available context
  cannot establish the function. The listed forms are examples, not an
  exhaustive whitelist.
