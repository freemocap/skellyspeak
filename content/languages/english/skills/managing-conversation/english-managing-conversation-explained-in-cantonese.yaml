skill_id: managing_conversation
language: english
explanation_language: cantonese
shared_explanation: skills/managing-conversation/managing-conversation-explained-in-cantonese.yaml
sections:
  - subskill_id: opening_closing
    explanation: 結束語幫雙方知道對話就嚟完。同比較快會再見嘅人傾完，先講一句友善評語再道別，就唔會突然中斷交流。
    examples:
      - text: It was good to talk. See you tomorrow.
        meaning: "`It was good to talk` 正面回顧啱啱嘅對話。`See you tomorrow` 係提到下次見面嘅簡短道別。省略咗嘅內容大家明白，唔使每次講完整句。"
        note: >-
          開始可以用問候，例如 `Hello, how are you?`；結束就用道別。`See you tomorrow` 適合預計聽日再見。如果唔知幾時，`See you later`
          冇咁具體。


          **試一試。** 下次星期五見，點樣結束對話？答案係 `It was good to talk. See you on Friday`；`on Friday`
          指實際日子，`tomorrow` 就係翌日。
  - subskill_id: acknowledging
    explanation: 回應表示對方嘅訊息已經傳到你。有人解釋喺邊度攞包裹後，一句短回應可以表示你跟得到指示，對方可以繼續或者結束。
    examples:
      - text: Right, I understand.
        meaning: 呢個情境中 `Right` 表示收到解釋。`I understand` 話你明白意思。兩句一齊回應啱啱講嘅內容，唔使重複成段解釋。
        note: >-
          明白同同意唔同。意思清楚但唔贊成，可以講 `I understand, but I disagree`。仍然唔肯定時，要問具體問題，唔好假裝明白。


          **試一試。** 對方話包裹喺接待處，確認重點：`Right, I understand. I’ll collect it at
          reception`。重複關鍵地點，對方有需要就可以更正你。
  - subskill_id: clarification
    explanation: 澄清可以補返對話入面唔明嘅地方。你可能要對方重複聽漏嘅說話、解釋生字，或者換個方法講同一個意思。問句嘅用詞可以指出你需要邊種幫助。
    examples:
      - text: What do you mean by the second option?
        meaning: 你講嘅第二個選擇係指乜嘢？
        note: >-
          **拆開嚟睇。** `Mean by` 係問對方用某個講法時想表達乜嘢。`The second option` 重複唔明嘅部分。對方可以答 `I mean taking the
          train instead of the bus`，即係搭火車而唔搭巴士，補返缺少嘅資料。


          **揀所需嘅幫助。** 如果係聽唔清聲音，可以問 `Could you repeat the last part?`。如果估到一個意思，就用 `Do you mean taking
          the train?`，畀對方確認或者糾正。


          **試一試。** 有人話 `Use the usual entrance`，但你唔知係邊個入口。其中一個問法係 `What do you mean by the usual
          entrance?`。重複唔明嘅短語，對方就知你想問乜。
  - subskill_id: rephrasing
    explanation: 第一個解釋難跟時，換個講法可以幫到對方。你解釋完時間表，朋友仍然唔知對出發有咩影響，就用簡單啲嘅說話重講實際重點。
    examples:
      - text: In other words, we need to leave before lunch.
        meaning: "`In other words` 表示同一意思嘅另一種講法。`We need to leave` 講必須離開，`before lunch` 交代時間。新句子令上文更容易用得著。"
        note: >-
          要重述意思，唔係只換一個生字。如果真係改計劃，就講清楚：`Actually, let’s leave after lunch` 係新決定，唔係舊意思嘅另一版本。


          **試一試。** 幫遊客講清楚 `The last entry is at four`。其中一個答案係 `In other words, we need to arrive by
          four`；`by four` 指最遲到達時間。
  - subskill_id: correcting_misunderstanding
    explanation: 更正係將聽錯嘅細節換成你原本想講嘅。你講星期二，朋友重複星期四，就講出兩個日子，令分別清楚。短句更正往往比重講成段對話有效。
    examples:
      - text: I meant Tuesday, not Thursday.
        meaning: "`I meant` 指你原本想表達嘅意思；`meant` 係 `mean` 嘅過去式。`Tuesday` 提供正確日子，`not Thursday` 排除朋友理解嗰個日子。"
        note: >-
          `I meant Tuesday` 更正訊息。`I’ve changed it to Tuesday` 就表示計劃本身改咗。如果係你令對方混淆，可以加 `Sorry, I
          meant Tuesday`，但仍然要清楚更正。


          **試一試。** 朋友聽到十五，但你講五十。答案係 `I meant fifty, not fifteen`；先講正確數字，再明確排除錯嗰個。
  - subskill_id: turns_topics
    explanation: 有時你未問完，對話已經轉去下一項。開會時可以先示意想就而家嘅主題講一陣，幫大家理解你點解插話。
    examples:
      - text: Before we move on, can I ask about the price?
        meaning: "`Before we move on` 指離開而家嘅主題之前。`Can I ask` 請求發言空間；`about the price` 講清楚想問價錢。呢度 `move on`
          係討論繼續，唔係身體移動。"
        note: |-
          想轉新話題，可以用 `By the way, how was your trip?`。想留喺原本主題，就講未處理完嗰點。可以嘅話等合適停頓先講；一句客氣說話唔代表任何插話都合適。

          **試一試。** 大家轉話題前想問送貨。答案係 `Before we move on, can I ask about delivery?`；講明送貨，就清楚交代想要嘅發言空間。
