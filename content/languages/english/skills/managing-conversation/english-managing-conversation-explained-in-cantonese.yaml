sections:
  - subskill_id: opening_closing
    explanation: 按情境用問候或道別語。結束語亦可以表示今次交流到此為止。
    examples:
      - text: It was good to talk. See you tomorrow.
        meaning: 講者結束對話，並表示之後再見。
        note: 呢個道別係用嚟結束交流，唔係只描述將來事件。
  - subskill_id: acknowledging
    explanation: 表示你收到或明白對方嘅話。
    examples:
      - text: Right, I understand.
        meaning: 講者表示明白之前嘅解釋。
        note: 呢個回應依賴對方啱啱講過嘅內容。
  - subskill_id: clarification
    explanation: 澄清可以補返對話入面唔明嘅地方。你可能要對方重複聽漏嘅說話、解釋生字，或者換個方法講同一個意思。問句嘅用詞可以指出你需要邊種幫助。
    examples:
      - text: What do you mean by the second option?
        meaning: 你講嘅第二個選擇係指乜嘢？
        note: >-
          **拆開嚟睇。** `Mean by` 係問對方用某個講法時想表達乜嘢。`The second option` 重複唔明嘅部分。對方可以答 `I mean taking the
          train instead of the bus`，即係搭火車而唔搭巴士，補返缺少嘅資料。


          **揀所需嘅幫助。** 如果係聽唔清聲音，可以問 `Could you repeat the last part?`。如果估到一個意思，就用 `Do you mean taking
          the train?`，畀對方確認或者糾正。


          **試一試。** 有人話 `Use the usual entrance`，但你唔知係邊個入口。其中一個問法係 `What do you mean by the usual
          entrance?`。重複唔明嘅短語，對方就知你想問乜。
  - subskill_id: rephrasing
    explanation: 第一個講法唔清楚時，用另一種方式重述原意。
    examples:
      - text: In other words, we need to leave before lunch.
        meaning: 講者換個講法，交代出發安排嘅限制。
        note: in other words 表明新講法同之前嗰句講緊同一個意思。
  - subskill_id: correcting_misunderstanding
    explanation: 將對方理解錯嘅內容，同你本來想講嘅內容作對比。
    examples:
      - text: I meant Tuesday, not Thursday.
        meaning: 本來講緊嘅日子係星期二。
        note: meant 同 not 明確指出邊個日子先啱，修正誤解。
  - subskill_id: turns_topics
    explanation: 想插話或轉話題時，先畀提示，方便對方跟得上。
    examples:
      - text: Before we move on, can I ask about the price?
        meaning: 講者想攞一個發言機會講價錢。
        note: before we move on 喺度安排討論流程，唔係交代對話以外某件事嘅時間。
