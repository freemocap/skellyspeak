sections:
  - subskill_id: opening_closing
    explanation: Use a greeting or farewell appropriate to the encounter. A closing can also signal that
      the interaction is ending.
    examples:
      - text: It was good to talk. See you tomorrow.
        meaning: The speaker closes the conversation and anticipates another meeting.
        note: The farewell manages the encounter rather than just describing a future event.
  - subskill_id: acknowledging
    explanation: Show that you received or followed what the other person said.
    examples:
      - text: Right, I understand.
        meaning: The speaker acknowledges the preceding explanation.
        note: This response depends on something another participant has just said.
  - subskill_id: clarification
    explanation: Clarification helps repair a gap in understanding during a conversation. You might need
      someone to repeat what you missed, explain an unfamiliar word or say the same idea another
      way. The wording of your question can tell the other person which kind of help you need.
    examples:
      - text: What do you mean by the second option?
        meaning: "**How it works.** `Mean by` asks how the other person is using an expression. `The second
          option` repeats the unclear part. A useful reply could be `I mean taking the train instead
          of the bus`, which supplies the missing detail."
        note: >-
          **Choose the help you need.** If you missed the sound, ask `Could you repeat the last
          part?` If you have a possible interpretation, check it: `Do you mean taking the train?`
          That lets your partner confirm or correct your understanding.


          **Try it.** Someone says `Use the usual entrance`, but you do not know which entrance that
          is. One answer: `What do you mean by the usual entrance?` Repeating the unclear phrase
          makes the question specific.
  - subskill_id: rephrasing
    explanation: Restate your meaning with a different formulation when the first version was unclear.
    examples:
      - text: In other words, we need to leave before lunch.
        meaning: The speaker restates the intended departure constraint.
        note: In other words marks the connection to the earlier formulation.
  - subskill_id: correcting_misunderstanding
    explanation: Contrast the mistaken interpretation with the meaning you intended.
    examples:
      - text: I meant Tuesday, not Thursday.
        meaning: The intended day is Tuesday.
        note: Meant and not explicitly repair the mistaken day.
  - subskill_id: turns_topics
    explanation: Signal a turn request or a topic change so the listener can follow the conversation.
    examples:
      - text: Before we move on, can I ask about the price?
        meaning: The speaker requests a turn about the price.
        note: Before we move on manages the discussion, not the time of an external event.
