sections:
  - subskill_id: requests
    explanation: الطلب يدعو شخصًا آخر إلى فعل شيء. عندما تكون يداك مشغولتين، قد تحتاج إلى من يمسك
      صندوقًا لحظةً. يجعل السؤال الذي يبدأ بـ`Could you` الطلب أقل مباشرة من الأمر `Hold this box`.
    examples:
      - text: Could you hold this box for a moment?
        meaning: تخاطب `Could you` الشخص الذي سيساعدك؛ وتحدد `hold this box` الفعل المطلوب. وتبين `For a
          moment` أن المساعدة قصيرة. بعد `could` استعمل الفعل الأساسي `hold` من دون `to`.
        note: >-
          تطلب `Could you hold this box?` من المخاطَب أن يفعل شيئًا. أما `Could I put this box
          here?` فتطلب الإذن لفعل تقوم به أنت. من الردود الممكنة `Sure` مع أخذ الصندوق.


          **جرّب.** اطلب من شخص إغلاق الباب بأدب. الإجابة: `Could you close the door, please?` الشخص
          المخاطَب هو `you`، ويبقى `close` في صورته الأساسية.
  - subskill_id: offers_invitations
    explanation: تمنح الدعوة شخصًا خيار الانضمام إلى نشاط. إذا كانت مجموعتك ذاهبةً لتناول الغداء، ترحّب
      عبارة `Would you like to` بشخص آخر من غير افتراض أنه سيأتي. ويمكن استعمال البداية نفسها لعرض
      شيء قد يريده.
    examples:
      - text: Would you like to join us for lunch?
        meaning: تقدّم `Would you like to` الفعل المقترح. وتعني `Join us` المشاركة مع مجموعتنا؛ وتحدد `for
          lunch` المناسبة. أبقِ `to` قبل `join` في هذا التعبير.
        note: >-
          قارن بـ`Would you like some tea?`: يأتي شيء بعد `like`، فلا يوجد فعل عمل ولا `to`. وإذا
          أردت عرض مساعدتك أنت، فقل `Shall I carry that?`؛ حينها ستكون أنت من يقوم بالفعل.


          **جرّب.** ادعُ صديقًا إلى نزهة مشيًا. الإجابة: `Would you like to go for a walk?` استعمل
          `to go` لأن المشي هو النشاط المقترح. تقبل `Yes, thanks` الدعوة؛ وترفضها `Sorry, I cannot
          today`.
  - subskill_id: suggestions
    explanation: يضع الاقتراح خيارًا أمام قرار مشترك. عند اختيار الطريق، يمكنك ذكر طريق أكثر هدوءًا دون
      الإصرار عليه. وتعرض `We could` فعلًا متاحًا للمجموعة كي تنظر فيه.
    examples:
      - text: We could take the quieter route.
        meaning: تشمل `We` المتحدث ورفاقه. وتقترح `Could take` فعلًا ممكنًا؛ وتشير `the quieter route` إلى
          طريق أقل ضجيجًا من غيره. الفعل بعد `could` هو `take` وليس `to take`.
        note: >-
          توصي `We should take the quieter route` بهذا الخيار بقوة أكبر. وقد تعلن `We will take it`
          قرارًا. يترك الاقتراح مجالًا لرد مثل `Good idea` أو `That takes too long`.


          **جرّب.** اقترح الذهاب بالحافلة من غير إعلان قرار. الإجابة: `We could take the bus`. تبقي
          `Could` الأمر خيارًا للنقاش.
  - subskill_id: commitments
    explanation: يُعلم الالتزامُ شخصًا آخر بما يستطيع الاعتماد عليك للقيام به. إذا احتاج صديق عنوانًا،
      فإن ردك بأنك سترسله الليلة يحدد من سيتولى هذه المهمة. ويمكن أن تعبّر `I will` عن هذا القرار أو
      الوعد.
    examples:
      - text: I will send you the address tonight.
        meaning: تعيّن `I` الشخص المسؤول. وتلتزم `Will send` بالفعل في هذا الحوار؛ ويحدد `you` المتلقي،
          و`the address` ما سيُرسل، و`tonight` موعده. وصيغة الاختصار اليومية هي `I’ll`.
        note: >-
          يميّز السياق الالتزام عن التوقع. تتنبأ `It will rain tonight` بالطقس ولا تعد بفعل. يسمّي
          الالتزام المفيد مهمةً ووقتًا تستطيع الوفاء به.


          **جرّب.** يطلب منك صديق أن تتصل غدًا، فتوافق. الإجابة: `I’ll call you tomorrow`. يأتي
          الفعل الأساسي `call` بعد `Will`، ويبيّن `tomorrow` الوقت.
  - subskill_id: accepting_declining
    explanation: تُعلم الإجابة الواضحة الطرفَ الآخر هل يضعك ضمن خطته. إذا دُعيت إلى العشاء، يمكنك شكر
      المضيف ثم القول إنك لا تستطيع البقاء. يجوز أن تذكر سببًا موجزًا، لكنك لا تحتاج إلى عذر طويل.
    examples:
      - text: Thanks, but I cannot stay for dinner.
        meaning: تعبّر `Thanks` عن الشكر على الدعوة. وتقدّم `But` القيد؛ وتقول `cannot stay` إنك لا تستطيع البقاء،
          وتحدد `for dinner` الدعوة التي ترفضها. وفي الكلام اليومي تشيع `can’t`.
        note: >-
          تقبل `Thanks, I’d love to` الدعوة. وتترك `Maybe` الجواب غير محسوم، فتجنّبها إذا كنت تعلم
          أنك لا تستطيع الحضور. ويمكنك اقتراح بديل: `Could we have lunch tomorrow?`


          **جرّب.** ارفض دعوةً إلى البقاء لتناول القهوة. إجابة ممكنة: `Thanks, but I can’t stay for
          coffee`. تحافظ هذه الجملة على الشكر وتصرّح بالرفض.
  - subskill_id: negotiating_plans
    explanation: يعني التفاوض على خطة إيجاد خيار يناسب الطرفين. إذا كانت الخامسة مبكرة جدًا، فاقترح
      السادسة مع الإبقاء على اللقاء نفسه. يسهل الرد على بديل محدد أكثر من مجرد القول إن الخطة لا
      تناسبك.
    examples:
      - text: Could we meet at six instead of five?
        meaning: تطلب `Could we meet` من المجموعة النظر في تغيير. وتقترح `At six` الوقت الجديد؛ وتحدد
          `instead of five` ما سيحل محله. بعد `could` يبقى `meet` في صورته الأساسية.
        note: >-
          تطرح `At six or five?` خيارين دون اقتراح استبدال أحدهما بالآخر بوضوح. وتوضح `Instead of`
          التغيير الذي تقصده. قد يوافق شريكك أو يقترح مقابلًا: `Six is too late. How about half past
          five?`


          **جرّب.** أبقِ النشاط لكن انقله من الاثنين إلى الأربعاء. الإجابة: `Could we meet on
          Wednesday instead of Monday?` استعمل `on` مع الأيام، بينما يُستعمل `at` مع أوقات الساعة.
