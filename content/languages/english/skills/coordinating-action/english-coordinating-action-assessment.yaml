skill_id: coordinating_action
language: english
guidance: Judge whether the learner successfully requests, offers, invites,
  suggests, commits, responds to a proposal, or negotiates action. Could you
  hold this? is a valid request; Could you to hold this? does not correctly form
  that request. Yes, please can accept an offer supplied by context. I will send
  it can commit the speaker, but an unrelated prediction with will is not
  necessarily a commitment. Distinguish information questions and descriptions
  of ability from action-directed uses by the preceding exchange. Credit
  requires correct use of this function, not an unsuccessful attempt. Unrelated
  errors do not invalidate a successful instance. Use unclear when the available
  context cannot establish the function. The listed forms are examples, not an
  exhaustive whitelist.
