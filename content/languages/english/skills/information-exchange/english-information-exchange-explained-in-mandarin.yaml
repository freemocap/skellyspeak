sections:
  - subskill_id: asking_information
    explanation: 信息问句告诉对方你想查明什么。`where`、`when` 和 `what` 等词指出缺少的是哪种细节。问句其余部分的语序取决于动词；把完整例句学会，有助于换一个细节继续使用同一句式。
    examples:
      - text: Where does your sister work?
        meaning: "**句子怎么组成。** `Where` 询问地点。`Does` 放在 `your sister` 前；`work` 保持原形。比较陈述句 `Your sister works at the
          library`。在问句中，语法变化由 `does` 承担，因此不能再给 `work` 加 `-s`。"
        note: >-
          **比较。** `When does your sister work?` 改问时间。若要问谁做这个动作，则用另一句式：`Who works at the library?` 这里 `who`
          本身指未知的人，所以不需要 `do` 或 `does`。使用 `be` 时问 `Where is your sister?`


          **练一练。** 问他们住在哪里。答案：`Where do they live?` 与 `they` 搭配用 `do`，`live` 保持原形。
  - subskill_id: answering_information
    explanation: 简短回答往往就够了。新认识的人问你在哪里工作，给出地点即可；如果背景不清楚，也可以说完整句子。问句已经提供你无需重复的信息。
    examples:
      - text: At the library.
        meaning: "`At` 引出工作地点，`the library` 说出图书馆。接在 `Where do you work?` 后，回答 `At the library` 就足够。完整句子是 `I work at
          the library`。"
        note: >-
          回答应符合所问细节：`At seven` 回答时间，而 `At the library` 回答地点。是非问句需要不同的回答：`Do you work at the library?` 可以答
          `Yes, I do`。


          **练一练。** 别人问 `Where do you study?`，而你在家学习。答案：`At home`。地点已经回答了问题，不必重复 `I study`。
  - subskill_id: checking_facts
    explanation: 核实事实可以避免依据错误细节行动。去购物前，你可能听说关门时间是七点，想请人确认。是非问句把这个待核实的事实交给听话人。
    examples:
      - text: Does the shop close at seven?
        meaning: 因为 `the shop` 是单数，问句以 `Does` 开头。`Close` 用动词原形；`at seven` 给出待核实的时刻。比较陈述句 `The shop closes at
          seven`：问句有 `does`，所以 `close` 末尾不再带 `-s`。
        note: >-
          有帮助的回答可以确认或纠正：`Yes, it does` 或 `No, it closes at six`。如果你根本没有拟定的时间，则改问 `What time does the shop
          close?`。


          **练一练。** 核实 `The buses stop here` 这个说法。答案：`Do the buses stop here?` 复数 `the buses` 搭配 `do`，`stop`
          不变。
  - subskill_id: useful_detail
    explanation: 有用的细节能让指路更容易跟随。找入口的人需要位置，也可能需要看得见的地标。先给主要答案，再补上能帮对方认出正确地点的细节。
    examples:
      - text: The entrance is on the left, beside the blue sign.
        meaning: "`The entrance` 指要找的入口。`On the left` 给出位置，`beside the blue sign` 增加地标：入口就在蓝色标牌旁边。两个短语描述的是同一个入口。"
        note: >-
          选择听话人能找到的地标。`Beside` 表示旁边；`behind` 则把入口放在标牌后方。只有真正帮助定位时，更多的词才有用。


          **练一练。** 给 `The lift is on the right` 加一个地标。一种答案：`The lift is on the right, beside
          reception`。接待处帮助听话人辨认电梯。
