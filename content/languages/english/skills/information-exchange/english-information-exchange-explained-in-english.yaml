sections:
  - subskill_id: asking_information
    explanation: Many questions place an auxiliary before the subject.
      Present-simple questions often use do or does; subject questions can omit
      do.
    examples:
      - text: Where does your sister work?
        meaning: The speaker asks for the location of the sister’s workplace.
        note: Does carries the question construction; work stays in its base form.
  - subskill_id: answering_information
    explanation: Give the requested information. A phrase can answer a question
      without repeating its entire clause.
    examples:
      - text: At the library.
        meaning: In answer to Where do you work?, the workplace is the library.
        note: The preceding question makes this fragment a relevant and complete answer.
  - subskill_id: checking_facts
    explanation: Ask whether a specific detail or proposition is correct.
    examples:
      - text: Does the shop close at seven?
        meaning: The speaker checks the proposed closing time.
        note: The question seeks confirmation of a concrete fact.
  - subskill_id: useful_detail
    explanation: Add information that helps the listener identify or understand the
      relevant thing.
    examples:
      - text: The entrance is on the left, beside the blue sign.
        meaning: The speaker identifies the entrance precisely.
        note: Beside the blue sign adds a useful identifying detail.
