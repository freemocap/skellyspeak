sections:
  - subskill_id: asking_information
    explanation: An information question tells the other person what you want to find out. Words such as
      `where`, `when` and `what` identify the missing detail. The order of the rest of the question
      depends on its verb; learning the whole example helps you reuse the pattern with a different
      detail.
    examples:
      - text: Where does your sister work?
        meaning: "**How it works.** `Where` asks for a place. `Does` comes before `your sister`; `work`
          stays in its plain form. Compare the statement `Your sister works at the library`. In the
          question, `does` carries the grammatical change, so do not also add `-s` to `work`."
        note: >-
          **Compare.** `When does your sister work?` asks about time instead. A different pattern is
          needed when asking who does the action: `Who works at the library?` Here `who` itself
          names the unknown person, so no `do` or `does` is needed. With `be`, ask `Where is your
          sister?`


          **Try it.** Ask where they live. Answer: `Where do they live?` Use `do` with `they` and
          keep `live` in its plain form.
  - subskill_id: answering_information
    explanation: A short answer is often all someone needs. If a new acquaintance asks where you work,
      give the place; you can add a full sentence if the context is unclear. The question supplies
      the information you do not repeat.
    examples:
      - text: At the library.
        meaning: "`At` introduces the workplace and `the library` names it. After `Where do you work?`, `At
          the library` is enough. The full version is `I work at the library`."
        note: >-
          Answer the kind of detail requested: `At seven` answers a time question, while `At the
          library` answers a place question. A yes/no question needs a different response: `Do you
          work at the library?` can take `Yes, I do`.


          **Try it.** Someone asks `Where do you study?`, and you study at home. Answer: `At home`.
          The place answers the question; you do not need to repeat `I study`.
  - subskill_id: checking_facts
    explanation: Checking a fact helps you avoid acting on a wrong detail. Before going shopping, you
      might have heard that closing time is seven and want confirmation. A yes/no question puts that
      proposed fact to the listener.
    examples:
      - text: Does the shop close at seven?
        meaning: "`Does` starts the question because `the shop` is singular. `Close` is the plain verb form;
          `at seven` gives the time being checked. Compare the statement `The shop closes at seven`:
          the question uses `does`, so `close` loses its final `-s`."
        note: >-
          A helpful reply can confirm or correct: `Yes, it does` or `No, it closes at six`. If you
          have no proposed time, ask `What time does the shop close?` instead.


          **Try it.** Check the claim `The buses stop here`. Answer: `Do the buses stop here?` Use
          `do` with plural `the buses`, and keep `stop` unchanged.
  - subskill_id: useful_detail
    explanation: Useful detail makes directions easier to follow. Someone looking for an entrance needs
      a location and perhaps a visible landmark. Begin with the main answer, then add the detail
      that helps them recognise the right place.
    examples:
      - text: The entrance is on the left, beside the blue sign.
        meaning: "`The entrance` identifies the thing being located. `On the left` gives its position, and
          `beside the blue sign` adds a landmark: it is next to that sign. Both phrases describe the
          same entrance."
        note: >-
          Choose a landmark the listener can find. `Beside` means next to; `behind` would put the
          entrance on the far side of the sign. More words are useful only if they make the location
          clearer.


          **Try it.** Add a landmark to `The lift is on the right`. One answer: `The lift is on the
          right, beside reception`. Reception helps the listener identify the lift.
