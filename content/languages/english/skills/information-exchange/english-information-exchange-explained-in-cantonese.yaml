sections:
  - subskill_id: asking_information
    explanation: 資料問句講清楚你想知啲乜。`Where`、`when` 同 `what` 等字指出缺少邊項資料。其餘部分嘅次序要睇動詞；學成句例句，可以幫你換另一項資料嚟問。
    examples:
      - text: Where does your sister work?
        meaning: 你家姐或者妹妹喺邊度返工？
        note: >-
          **拆開嚟睇。** `Where` 問地方。`Does` 放喺 `your sister` 前面；`work` 用原形。比較陳述句 `Your sister works at
          the library`：問句由 `does` 負責文法變化，`work` 就唔再加 `-s`。


          **比較。** `When does your sister work?` 改為問時間。如果問做動作嘅人係邊個，就用 `Who works at the library?`。呢度
          `who` 本身代表未知嘅人，唔需要 `do` 或 `does`。動詞係 `be` 時，用 `Where is your sister?`。


          **試一試。** 問佢哋住邊度。答案：`Where do they live?`。`They` 配 `do`，`live` 保持原形。
  - subskill_id: answering_information
    explanation: 簡短答案往往已經夠用。新相識問你喺邊度返工，就答地點；如果上文唔清楚，可以用完整句子。問題已經提供咗唔需要再重複嘅資料。
    examples:
      - text: At the library.
        meaning: "`At` 引出工作地點，`the library` 指圖書館。對方問 `Where do you work?`，答 `At the library` 就夠。完整講法係 `I
          work at the library`。"
        note: >-
          答案要配合問題要嘅資料：`At seven` 答時間，`At the library` 答地點。係非問句就要另一種回應：`Do you work at the library?`
          可以答 `Yes, I do`。


          **試一試。** 對方問 `Where do you study?`，而你喺屋企讀書。答案係 `At home`；地點已經回答咗問題，唔使重複 `I study`。
  - subskill_id: checking_facts
    explanation: 核實事實可以避免按錯誤資料行動。去買嘢之前，你可能聽講七點關門，想確認一下。係非問句將呢個可能正確嘅資料交畀對方核實。
    examples:
      - text: Does the shop close at seven?
        meaning: "`The shop` 係單數，所以問題用 `Does` 開頭。`Close` 係動詞原形；`at seven` 指要核實嘅時間。比較陳述句 `The shop closes at
          seven`：問句有 `does`，`close` 就唔再加 `-s`。"
        note: >-
          回應可以確認或更正：`Yes, it does` 或 `No, it closes at six`。如果完全唔知時間，就問 `What time does the shop
          close?`。


          **試一試。** 核實 `The buses stop here`。答案係 `Do the buses stop here?`；複數 `the buses` 配
          `do`，`stop` 保持原形。
  - subskill_id: useful_detail
    explanation: 有用細節令指路更容易跟。搵入口嘅人需要知道位置，亦可能需要睇得見嘅地標。先答主要位置，再加幫到佢認出地方嘅資料。
    examples:
      - text: The entrance is on the left, beside the blue sign.
        meaning: "`The entrance` 指要搵嘅入口。`On the left` 交代喺左邊，`beside the blue sign`
          加上地標，即係喺藍色招牌旁邊。兩個短語都描述同一個入口。"
        note: >-
          要揀對方搵得到嘅地標。`Beside` 係旁邊；改成 `behind` 就係喺招牌後面。加資料要令位置更清楚先有用。


          **試一試。** 幫 `The lift is on the right` 加一個地標。其中一個答案係 `The lift is on the right, beside
          reception`；接待處幫對方認出部升降機。
