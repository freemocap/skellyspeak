shared_explanation: skills/time-events/time-events-explained-in-cantonese.yaml
sections:
  - subskill_id: present_events
    explanation: 按目前狀態、習慣或進行中活動，選擇合適嘅現在時結構。英文會用動詞形式區分，唔係只加「而家」就得。
    examples:
      - text: She works at the museum.
        meaning: 喺博物館返工係佢目前嘅固定工作情況。
        note: works 表達平常或固定情況，唔一定係講呢一刻做緊嘅活動。
  - subskill_id: past_events
    explanation: 較早發生嘅事件要用合適過去時結構。好多常見動詞有不規則過去式；唔可以只加時間詞而完全唔理動詞形式。
    examples:
      - text: Yesterday we went to the harbour.
        meaning: 嗰次行程發生喺噚日。
        note: went 係 go 嘅過去式；yesterday 交代時間。
  - subskill_id: future_events
    explanation: 將來計劃同事件可以用 going to、will，或者配合適當語境嘅現在時形式。
    examples:
      - text: We are meeting at the station tomorrow.
        meaning: 見面已安排喺聽日。
        note: 現在進行式喺呢度講將來安排；tomorrow 支持呢個理解。
  - subskill_id: duration_frequency
    explanation: 時間短語可以表達持續幾耐，或者幾密發生一次。
    examples:
      - text: I practise for twenty minutes every evening.
        meaning: 每晚練習二十分鐘。
        note: for twenty minutes 交代時長；every evening 交代頻率。
  - subskill_id: event_sequence
    explanation: 用 first、then、before、after 等詞交代事件次序。
    examples:
      - text: First we packed, then we called a taxi.
        meaning: 先執好行李，之後先叫的士。
        note: then 表示先後，本身唔表示因果。
  - subskill_id: event_phase
    explanation: 進行式可以表達事件當時正進行；其他結構可以標示完成。呢啲動詞形式唔可以同廣東話嘅「緊」「咗」逐個固定配對。
    examples:
      - text: I was cooking when the lights went out.
        meaning: 突然停電嗰陣，煮飯活動正進行緊。
        note: was cooking 交代持續中嘅背景；went out 引入打斷嗰個背景嘅事件。
