sections:
  - subskill_id: wants_intentions
    explanation: want to 同 plan to 後面接行動，分別表達想做或計劃做嘅事。
    examples:
      - text: I plan to study tonight.
        meaning: 講者打算今晚溫習。
        note: 呢度表達個人打算，唔係向另一個人作承諾。
  - subskill_id: preferences
    explanation: 可以用 like、prefer 或比較句，講自己嘅喜好同選擇。
    examples:
      - text: I prefer tea to coffee.
        meaning: 比起咖啡，講者更鍾意茶。
        note: prefer 將較鍾意嘅選項同另一個選項連起嚟。
  - subskill_id: emotions
    explanation: 講出感受；有需要時再交代引起呢種感受嘅事。
    examples:
      - text: I feel nervous about the interview.
        meaning: 個面試令講者緊張。
        note: nervous 描述情緒狀態。
  - subskill_id: opinions
    explanation: 當區分事實同意見有需要時，要表明呢個係你嘅評價。
    examples:
      - text: I think this plan is too expensive.
        meaning: 講者認為呢個計劃太貴。
        note: I think 引入個人觀點，唔係表示同意上文某個說法。
  - subskill_id: agreement_disagreement
    explanation: 回應要連到你贊同或質疑嘅立場。
    examples:
      - text: I agree that we need more time.
        meaning: 講者同意需要多啲時間。
        note: 同意要有清楚對象；呢度由 that 後面嘅子句交代贊同乜嘢。
