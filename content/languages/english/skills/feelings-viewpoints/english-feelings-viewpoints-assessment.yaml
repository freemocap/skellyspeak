skill_id: feelings_viewpoints
language: english
guidance: Look for a correctly expressed desire, intention, preference, emotion,
  opinion or alignment with a position. I want to leave and I prefer tea to
  coffee are valid; I want leave is not a correct ordinary want-plus-infinitive
  construction. I agree can be a complete contextual response to a stated
  opinion. A factual description without a viewpoint is not sufficient just
  because it includes I. Do not treat every future statement as an intention.
  Credit requires correct use of this function, not an unsuccessful attempt.
  Unrelated errors do not invalidate a successful instance. Use unclear when the
  available context cannot establish the function. The listed forms are
  examples, not an exhaustive whitelist.
