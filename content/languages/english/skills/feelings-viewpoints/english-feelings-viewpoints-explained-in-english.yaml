sections:
  - subskill_id: wants_intentions
    explanation: A wish and a plan do different jobs. You may want to study but have no time set aside;
      saying you plan to study tells a friend that this is your intended activity. It still does not
      guarantee the activity will happen.
    examples:
      - text: I plan to study tonight.
        meaning: "`I plan` states the intention, `to study` names the intended action, and `tonight` gives
          its time. After `plan`, link the next action with `to` and its plain verb form. Change the
          person to get `She plans to study tonight`."
        note: >-
          Compare `I want to study tonight`: it states a desire, which may not yet be a plan. `I am
          studying tonight` can present it as an arrangement.


          **Try it.** Say you intend to cook tomorrow. Answer: `I plan to cook tomorrow`. Keep `to`
          before `cook`; it links planning to the intended action.
  - subskill_id: preferences
    explanation: A preference tells someone which option you like better. When a host offers two drinks,
      you can name tea as your first choice without saying you dislike coffee. `Prefer` makes the
      comparison explicit.
    examples:
      - text: I prefer tea to coffee.
        meaning: "`I prefer` introduces your choice. `Tea` is the preferred option; `to coffee` gives the
          alternative. In this comparison, `to` connects two things, rather than introducing an
          action. Reversing them changes your preference: `I prefer coffee to tea`."
        note: >-
          Use `to` here rather than `than`: `I prefer tea to coffee`. Saying `I like tea` alone does
          not compare the drinks. You can also describe activities: `I prefer walking to driving`.


          **Try it.** You like mornings better than evenings. Answer: `I prefer mornings to
          evenings`. Put your preferred choice first and the alternative after `to`.
  - subskill_id: emotions
    explanation: Naming a feeling helps another person understand your reaction. Before an interview,
      you might be worried about what will happen. `Feel` followed by a describing word gives the
      feeling; `about` can introduce what it concerns.
    examples:
      - text: I feel nervous about the interview.
        meaning: "`I feel` reports the speaker’s experience. `Nervous` describes the feeling, and `about the
          interview` identifies its focus. The describing word does not change for a different
          person: `She feels nervous`."
        note: >-
          `I am nervous` also describes the state. `Nervous` describes a person’s feeling;
          `nerve-racking` can describe an experience that causes it: `The interview was
          nerve-racking`. Do not use those words interchangeably.


          **Try it.** Describe feeling excited about a trip. Answer: `I feel excited about the
          trip`. `Excited` names your feeling, while `about the trip` explains what it concerns.
  - subskill_id: opinions
    explanation: An opinion lets you contribute your judgement to a discussion. If a group is choosing a
      plan, you may think its cost is a problem. `I think` presents the following statement as your
      view and leaves room for others to respond.
    examples:
      - text: I think this plan is too expensive.
        meaning: "`I think` introduces the judgement. `This plan is too expensive` states it: `too` means
          the cost exceeds what is suitable, not simply that the cost is high. You can add a reason,
          such as `It uses our whole budget`."
        note: >-
          Compare `very expensive`, which describes a high price without itself saying it is
          excessive. `I don’t think this plan is affordable` is a common way to give a negative
          opinion.


          **Try it.** Give your view that a room is excessively small. Answer: `I think this room is
          too small`. `Too` communicates a problem with its size.
  - subskill_id: agreement_disagreement
    explanation: Agreement responds to someone else’s view. If a teammate says the work needs another
      day, you can accept that point explicitly. Naming what you agree with helps when a discussion
      contains several different proposals.
    examples:
      - text: I agree that we need more time.
        meaning: "`I agree` says you share the view. `That we need more time` spells out the point accepted;
          `that` links the agreement to a complete statement. With a person, use `with`: `I agree
          with you`."
        note: >-
          To disagree without attacking the person, try `I see your point, but I think we have
          enough time`. Understanding a point is not necessarily accepting it. Avoid the incorrect
          form `I am agree`; `agree` is already the main verb.


          **Try it.** Agree that the room is too small. Answer: `I agree that the room is too
          small`. The words after `that` identify the shared judgement.
