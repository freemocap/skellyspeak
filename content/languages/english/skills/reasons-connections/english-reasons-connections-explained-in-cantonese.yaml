sections:
  - subskill_id: causes_reasons
    explanation: because 可以引入情況或決定背後嘅原因。
    examples:
      - text: We stayed inside because the road was flooded.
        meaning: 水浸解釋咗點解大家留喺室內。
        note: 兩個子句係因果關係，唔係單純按時間排列。
  - subskill_id: consequences
    explanation: so 可以將一個情況同結果連起嚟。
    examples:
      - text: The bus was full, so we walked.
        meaning: 巴士滿咗，所以大家改為行路。
        note: 第二個子句被表達為前面情況帶嚟嘅結果。
  - subskill_id: conditions
    explanation: if 子句可以提出結果成立嘅條件。要按開放可能性或假設情況選擇形式，唔係見到「如果」就只得一種英文時態。
    examples:
      - text: If it rains, we will eat indoors.
        meaning: 係咪喺室內食，要睇會唔會落雨。
        note: rains 雖然係現在式，喺呢個條件句入面講緊將來可能落雨。
  - subskill_id: contrast
    explanation: but 同 although 可以連結有對比，或者組合起嚟出乎預期嘅意思。
    examples:
      - text: The route is longer, but it is safer.
        meaning: 路程較遠，但安全程度較高，兩點形成對比。
        note: but 標示兩個評價之間嘅對比。
  - subskill_id: supporting_claims
    explanation: 提供支持論點嘅理由，唔好只重複個論點。
    examples:
      - text: The shop is open; I can see customers inside.
        meaning: 見到有客人，支持間舖仲開緊嘅判斷。
        note: 第二個子句為第一個提供證據。
