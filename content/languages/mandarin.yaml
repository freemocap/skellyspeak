    location: Chengdu, China
    occupation: Bike courier saving up for a tea shop
    background: Moved to Chengdu from a small town in Yunnan. Shares a flat with two friends and far too
      many plants.
    currentSituation: Saving money, learning to brew pu'er properly, and training for a hundred-kilometre ride.
    interests:
