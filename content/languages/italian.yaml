# yaml-language-server: $schema=../schemas/language.yaml
schema_version: 1
identity:
  id: italian
  name: Italian
  native_name: Italiano
  family: indo-european
  review: needs_review
integrations:
  language_tag: it
  transcription: it
definitions:
  orthographies:
    standard-italian:
      script: latin
      guidance:
      - scope: target_writing
        text: Use standard Italian spelling, retaining required accents such as è, perché and città and
          distinguishing apostrophes from accents, as in un po’. Preserve quoted source spelling exactly;
          do not substitute an apostrophe for an accented capital letter.
        sources:
        - treccani_italian_accents
      - scope: explanation_writing
        text: Use standard Italian spelling, retaining required accents such as è, perché and città and
          distinguishing apostrophes from accents, as in un po’. Preserve quoted source spelling exactly;
          do not substitute an apostrophe for an accented capital letter.
        sources:
        - treccani_italian_accents
  romanization_schemes: {}
defaults:
  variety: italian-italy
  orthography:
    local: standard-italian
  scalars: {}
  romanization:
    mode: disabled
  supported_romanizations: []
traits: []
varieties:
- id: italian-italy
  name: Italy
  description: Contemporary Italian in Italy, using standard written Italian without prescribing one regional accent.
  review: needs_review
  sources:
  - treccani_italian_accents
  overrides: {}
  guidance: []
guidance:
- scope: assessment
  text: Distinguish standard written Italian from regional usage. Do not infer a pronunciation error from
    spelling alone.
  sources:
  - treccani_italian_accents
learning:
  goal_material:
    courtesy:
      tokens:
      - grazie
conversation:
  greeting:
    text: ciao
    romanizations: {}
  default_partner:
    name: Elena
    romanizedName: null
    age: 36
    location: Bologna, Italy
    occupation: Repairs bicycles at a neighbourhood workshop
    background: Grew up near Modena and moved to Bologna for work. Shares a flat with a friend who studies
      architecture.
    currentSituation: Reorganising the workshop and planning a short train trip to visit her sister.
    interests:
    - repairing old tools
    - walking in city parks
    opinions:
    - Repairs should come with an explanation of what failed.
    - A short trip can be as satisfying as a long holiday.
    interestingFacts:
    - Keeps a sketchbook of unusual bicycle frames.
    - Learned to sew to mend her work clothes.
    favoriteBooks:
    - Il barone rampante — Italo Calvino
    - Lessico famigliare — Natalia Ginzburg
    favoriteMovies:
    - Il posto (1961)
    - Paterson (2016)
    manner: Direct and curious. Asks concrete questions and admits when she does not know something.
    quirks:
    - Sketches ideas on scrap paper.
    - Remembers places by their street trees.
    vibe:
    - 🚲
    - 📓
