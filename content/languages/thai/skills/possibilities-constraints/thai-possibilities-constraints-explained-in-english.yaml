sections:
  - subskill_id: ability
    explanation: เป็น after an activity can indicate knowing how to perform it.
    examples:
      - text: ฉันว่ายน้ำเป็น
        meaning: I know how to swim.
        note: เป็น here expresses acquired ability, not an identifying copula.
  - subskill_id: permission
    explanation: An action followed by ได้ไหม can request permission.
    examples:
      - text: ฉันวางกระเป๋าไว้ตรงนี้ได้ไหม
        meaning: May I leave my bag here?
        note: Address the person responsible for the space to establish the permission context.
  - subskill_id: obligation
    explanation: ต้อง before an action states a requirement.
    examples:
      - text: ฉันต้องคืนกุญแจวันนี้
        meaning: I must return the key today.
        note: วันนี้ gives the deadline and ต้อง makes returning necessary.
  - subskill_id: possibility
    explanation: อาจจะ can qualify an event as possible.
    examples:
      - text: เย็นนี้ฝนอาจจะตก
        meaning: It may rain this evening.
        note: The weather outcome remains uncertain.
  - subskill_id: certainty
    explanation: ไม่แน่ใจ expresses uncertainty about a following proposition.
    examples:
      - text: ฉันไม่แน่ใจว่าร้านยังเปิดอยู่
        meaning: I am not sure the shop is still open.
        note: The speaker does not assert that the shop has closed.
