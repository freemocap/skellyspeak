sections:
  - subskill_id: ability
    explanation: 活動後嘅เป็น可以表示識做嗰件事。
    examples:
      - text: ฉันว่ายน้ำเป็น
        meaning: 我識游水。
        note: 呢度เป็น表示學識嘅能力，唔係身份識別繫詞。
  - subskill_id: permission
    explanation: 動作後加ได้ไหม，可以請求許可。
    examples:
      - text: ฉันวางกระเป๋าไว้ตรงนี้ได้ไหม
        meaning: 我可唔可以放個袋喺度？
        note: 向管理地方嘅人講，確立請求許可嘅語境。
  - subskill_id: obligation
    explanation: 動作前嘅ต้อง表示要求。
    examples:
      - text: ฉันต้องคืนกุญแจวันนี้
        meaning: 我今日一定要還鎖匙。
        note: วันนี้交代限期，ต้อง令歸還成為必要。
  - subskill_id: possibility
    explanation: อาจจะ將事件限定為可能。
    examples:
      - text: เย็นนี้ฝนอาจจะตก
        meaning: 今晚可能落雨。
        note: 天氣結果仍然未肯定。
  - subskill_id: certainty
    explanation: ไม่แน่ใจ表達對後面命題唔肯定。
    examples:
      - text: ฉันไม่แน่ใจว่าร้านยังเปิดอยู่
        meaning: 我唔肯定間舖頭係咪仲開緊。
        note: 講者冇斷言舖頭已經閂咗。
