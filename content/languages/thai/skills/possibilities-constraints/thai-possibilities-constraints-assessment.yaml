guidance: Recognize ability, permission, obligation, possibility and certainty. เป็น after a
  skill verb phrase can express knowing how; ได้ after an action can concern ability,
  opportunity or permission according to context. วางกระเป๋าไว้ตรงนี้ได้ไหม can ask permission
  from the person responsible for a space. ต้องคืนกุญแจ gives necessity; ไม่ต้อง removes need
  rather than prohibiting. อาจจะฝนตก presents possibility, while ไม่แน่ใจ limits confidence. ได้
  can grant a preceding permission request contextually. An isolated copied modal without a
  recoverable action is absent. A polite request with ได้ไหม does not automatically assert
  capability. If ability and opportunity are both plausible successful group meanings, do not
  label the entire use unclear merely because the subtype differs. Do not confuse preverbal ได้
  in a past-event construction with postverbal permission or capacity.
