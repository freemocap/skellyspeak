skill_id: information_exchange
explanation_language: english
shared_explanation: skills/information-exchange/information-exchange-explained-in-english.yaml
sections:
  - subskill_id: asking_information
    explanation: กี่โมง asks for clock time after the event expression.
    examples:
      - text: ร้านปิดกี่โมง
        meaning: What time does the shop close?
        note: The unknown information is the closing hour.
  - subskill_id: answering_information
    explanation: An hour expression can directly answer a preceding time question.
    examples:
      - text: ห้าโมงเย็น
        meaning: At five in the afternoon.
        note: Reply to the shop closing-time question; เย็น disambiguates the time of day.
  - subskill_id: checking_facts
    explanation: ใช่ไหม after a proposition asks whether it is correct.
    examples:
      - text: ร้านปิดห้าโมงเย็นใช่ไหม
        meaning: The shop closes at five in the afternoon, right?
        note: The speaker supplies a candidate closing time.
  - subskill_id: useful_detail
    explanation: A location phrase can give the distinguishing information a listener needs.
    examples:
      - text: ทางเข้าอยู่ทางด้านลาน
        meaning: The entrance is on the courtyard side.
        note: Use when explaining how to find the entrance.
