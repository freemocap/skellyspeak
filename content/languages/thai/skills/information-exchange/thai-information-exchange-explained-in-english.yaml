language: thai
skill_id: information_exchange
explanation_language: english
shared_explanation: skills/information-exchange/information-exchange-explained-in-english.yaml
sections:
  - subskill_id: asking_information
    explanation: You need the shop’s closing time before travelling there. `ร้านปิด` names the event, and `กี่โมง`
      asks the unknown clock time. The question word follows the event in this sentence; Thai does not add an
      English-style “does.”
    examples:
      - text: ร้านปิดกี่โมง
        meaning: What time does the shop close?
        note: "Try asking when the shop opens. Answer: `ร้านเปิดกี่โมง` `กี่โมง` still asks for a clock time; `เปิด`
          changes the event to opening."
  - subskill_id: answering_information
    explanation: The previous speaker asked when the shop closes. `ห้าโมงเย็น` gives five in the evening, rather
      than five in the morning; `เย็น` follows the hour. The closing event need not be repeated because the
      question supplies it. Without that exchange, the short answer would need context.
    examples:
      - text: ห้าโมงเย็น
        meaning: At five in the afternoon.
        note: "Try answering that it closes at six in the evening. Answer: `หกโมงเย็น` The new hour fills the same
          information gap, and `เย็น` still marks the evening."
  - subskill_id: checking_facts
    explanation: You think the shop closes at five in the evening and seek confirmation. `ร้านปิดห้าโมงเย็น` first
      states that proposed fact. Final `ใช่ไหม` asks whether it is right, unlike a plain `กี่โมง` question
      seeking an unknown time.
    examples:
      - text: ร้านปิดห้าโมงเย็นใช่ไหม
        meaning: The shop closes at five in the afternoon, right?
        note: "Try checking whether the shop closes at six in the evening. Answer: `ร้านปิดหกโมงเย็นใช่ไหม` The
          proposed hour changes, while `ใช่ไหม` still requests confirmation."
  - subskill_id: useful_detail
    explanation: A visitor sees the building but cannot find its entrance. `ทางเข้า` names the entrance; `อยู่`
      places it somewhere, and `ทางด้านลาน` identifies the courtyard side. The detail is useful because it
      distinguishes this side from another possible approach.
    examples:
      - text: ทางเข้าอยู่ทางด้านลาน
        meaning: The entrance is on the courtyard side.
        note: "Try saying the entrance is on the road side. Answer: `ทางเข้าอยู่ทางด้านถนน` The location frame
          remains; `ถนน` changes the side the visitor should approach."
