skill_id: information_exchange
explanation_language: cantonese
shared_explanation: skills/information-exchange/information-exchange-explained-in-cantonese.yaml
sections:
  - subskill_id: asking_information
    explanation: กี่โมง放喺事件表達後面，問鐘點。
    examples:
      - text: ร้านปิดกี่โมง
        meaning: 間舖頭幾點閂門？
        note: 未知資料係關門時間。
  - subskill_id: answering_information
    explanation: 鐘點表達可以直接回答前面嘅時間問題。
    examples:
      - text: ห้าโมงเย็น
        meaning: 下晝五點。
        note: 回應舖頭關門時間；เย็น交代一日邊個時段，避免混淆。
  - subskill_id: checking_facts
    explanation: 命題後面嘅ใช่ไหม問內容啱唔啱。
    examples:
      - text: ร้านปิดห้าโมงเย็นใช่ไหม
        meaning: 間舖頭下晝五點閂門，係咪？
        note: 講者提供一個候選關門時間。
  - subskill_id: useful_detail
    explanation: 位置短語可以提供聽者需要嘅分辨資料。
    examples:
      - text: ทางเข้าอยู่ทางด้านลาน
        meaning: 入口喺庭院嗰邊。
        note: 解釋點搵入口時用。
