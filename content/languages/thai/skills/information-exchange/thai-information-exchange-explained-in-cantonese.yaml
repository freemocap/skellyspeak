sections:
  - subskill_id: asking_information
    explanation: 出門去舖頭前，你要知幾點關門。`ร้านปิด` 指關門事件，`กี่โมง` 問未知鐘點。呢句嘅疑問詞放喺事件後；泰語毋須英文式「does」。
    examples:
      - text: ร้านปิดกี่โมง
        meaning: 間舖頭幾點閂門？
        note: 試吓問舖頭幾點開門。答案：`ร้านเปิดกี่โมง`。`กี่โมง` 仍問鐘點；`เปิด` 將事件改成開門。
  - subskill_id: answering_information
    explanation: 上一位講者問舖頭幾點關。`ห้าโมงเย็น` 係傍晚五點，唔係朝早五點；`เย็น` 放喺鐘點後面。關門事件由問題承接，毋須重複；冇呢段對話，短答就要其他語境。
    examples:
      - text: ห้าโมงเย็น
        meaning: 下晝五點。
        note: 試吓答傍晚六點關。答案：`หกโมงเย็น`。新鐘點填入同一個資訊空位；`เย็น` 仍指傍晚。
  - subskill_id: checking_facts
    explanation: 你以為舖頭傍晚五點關，想核實。`ร้านปิดห้าโมงเย็น` 先提出待查說法。句尾 `ใช่ไหม` 問係咪啱，同 `กี่โมง` 問未知鐘點唔同。
    examples:
      - text: ร้านปิดห้าโมงเย็นใช่ไหม
        meaning: 間舖頭下晝五點閂門，係咪？
        note: 試吓核實舖頭係咪傍晚六點關。答案：`ร้านปิดหกโมงเย็นใช่ไหม`。待查鐘點改咗；`ใช่ไหม` 仍係求證。
  - subskill_id: useful_detail
    explanation: 訪客見到棟樓，但搵唔到入口。`ทางเข้า` 指入口；`อยู่` 講位置，`ทางด้านลาน` 指庭院嗰邊。呢個細節有用，因為可以同另一邊入口方向分開。
    examples:
      - text: ทางเข้าอยู่ทางด้านลาน
        meaning: 入口喺庭院嗰邊。
        note: 試吓話入口喺馬路嗰邊。答案：`ทางเข้าอยู่ทางด้านถนน`。位置結構保留；`ถนน` 改訪客應行去嘅一邊。
