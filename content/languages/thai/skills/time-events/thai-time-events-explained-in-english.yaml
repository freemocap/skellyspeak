language: thai
skill_id: time_events
explanation_language: english
shared_explanation: skills/time-events/time-events-explained-in-english.yaml
sections:
  - subskill_id: present_events
    explanation: Someone asks what you are doing at this moment. `ตอนนี้` fixes the present moment;
      `ฉันกำลังซ่อมจักรยาน` uses `กำลัง` before the repair activity to show it is in progress. Thai does not
      change the verb ending to express an English-style continuous tense.
    examples:
      - text: ตอนนี้ฉันกำลังซ่อมจักรยาน
        meaning: I am repairing a bicycle now.
        note: "Try saying you are reading a book now. Answer: `ตอนนี้ฉันกำลังอ่านหนังสือ` `ตอนนี้` and `กำลัง` keep
          the ongoing-now reading; `อ่านหนังสือ` changes the activity."
  - subskill_id: past_events
    explanation: You report a bicycle repair that happened yesterday. `เมื่อวาน` anchors the event in the past;
      `ฉันซ่อมจักรยาน` names the activity without a past-tense ending on `ซ่อม`. Whether the repair was
      completed can depend on the wider context; the time word alone does not encode its endpoint.
    examples:
      - text: เมื่อวานฉันซ่อมจักรยาน
        meaning: Yesterday I repaired a bicycle.
        note: "Try reporting that you repaired the radio yesterday. Answer: `เมื่อวานฉันซ่อมวิทยุ` `เมื่อวาน` still
          anchors the event in the past; `ซ่อมวิทยุ` changes the item."
  - subskill_id: future_events
    explanation: You have arranged to collect repair parts tomorrow. `พรุ่งนี้` sets the future day;
      `ฉันจะไปรับอะไหล่` uses `จะ` for the planned action and `ไปรับ` for going to collect the parts. Thai
      verbs do not acquire a future suffix, and the time word plus plan provide the reference.
    examples:
      - text: พรุ่งนี้ฉันจะไปรับอะไหล่
        meaning: Tomorrow I will go and collect the parts.
        note: "Try saying you will collect the key tomorrow. Answer: `พรุ่งนี้ฉันจะไปรับกุญแจ` `พรุ่งนี้` and `จะ`
          keep the future plan; `กุญแจ` changes what you collect."
  - subskill_id: duration_frequency
    explanation: "You are describing a regular swimming habit. `สัปดาห์ละ` establishes a per-week rate; `สองครั้ง`
      counts two occasions. This gives frequency rather than the duration of a single swim: `สองชั่วโมง` would
      describe two hours instead."
    examples:
      - text: ฉันว่ายน้ำสัปดาห์ละสองครั้ง
        meaning: I swim twice a week.
        note: "Try saying you swim three times a week. Answer: `ฉันว่ายน้ำสัปดาห์ละสามครั้ง` `สัปดาห์ละ` keeps the
          weekly rate; `สามครั้ง` changes the number of occasions."
  - subskill_id: event_sequence
    explanation: You are giving kitchen preparation instructions. `ล้างมือก่อน` puts washing hands first;
      `แล้วค่อย` introduces preparing the vegetables only after that step. The sentence orders actions rather
      than merely listing two tasks.
    examples:
      - text: ล้างมือก่อน แล้วค่อยเตรียมผัก
        meaning: Wash your hands first, then prepare the vegetables.
        note: "Try instructing someone to wash hands before cutting vegetables. Answer: `ล้างมือก่อน แล้วค่อยหั่นผัก`
          `ก่อน` and `แล้วค่อย` preserve the order; `หั่นผัก` supplies the second task."
  - subskill_id: event_phase
    explanation: A friend asks whether you got to the end of this book. `หนังสือเล่มนี้` identifies this
      particular volume with classifier `เล่ม`; `อ่าน...จบ` presents reading through to the endpoint. Final
      `แล้ว` presents that completed state as reached. The sentence says more than merely that reading
      happened sometime.
    examples:
      - text: ฉันอ่านหนังสือเล่มนี้จบแล้ว
        meaning: I have finished reading this book.
        note: "Try saying you finished reading this article. Answer: `ฉันอ่านบทความนี้จบแล้ว` `อ่าน...จบแล้ว` keeps
          the endpoint and achieved-state reading; `บทความนี้` replaces the book."
