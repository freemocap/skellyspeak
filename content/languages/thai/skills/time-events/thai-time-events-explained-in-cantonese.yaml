skill_id: time_events
explanation_language: cantonese
shared_explanation: skills/time-events/time-events-explained-in-cantonese.yaml
sections:
  - subskill_id: present_events
    explanation: 活動前面嘅กำลัง將活動表達成進行中。
    examples:
      - text: ตอนนี้ฉันกำลังซ่อมจักรยาน
        meaning: 我而家整緊單車。
        note: ตอนนี้將活動定位到目前情況。
  - subskill_id: past_events
    explanation: 過去時間表達可以定位事件，唔使改動詞。
    examples:
      - text: เมื่อวานฉันซ่อมจักรยาน
        meaning: 我尋日整咗架單車。
        note: เมื่อวาน確立過去時間；ซ่อม冇時態詞尾。
  - subskill_id: future_events
    explanation: จะ配合時間表達，可以引出將來行動。
    examples:
      - text: พรุ่งนี้ฉันจะไปรับอะไหล่
        meaning: 我聽日會去攞零件。
        note: พรุ่งนี้交代日子；ไปรับ結合去同領取。
  - subskill_id: duration_frequency
    explanation: ละ設定每段時間嘅頻率，ครั้ง數次數。
    examples:
      - text: ฉันว่ายน้ำสัปดาห์ละสองครั้ง
        meaning: 我一個星期游兩次水。
        note: 呢個係頻率，唔係一次游幾耐。
  - subskill_id: event_sequence
    explanation: ก่อน同แล้วค่อย排列步驟。
    examples:
      - text: ล้างมือก่อน แล้วค่อยเตรียมผัก
        meaning: 先洗手，再準備啲蔬菜。
        note: 指令語境交代對邊個講。
  - subskill_id: event_phase
    explanation: 閱讀後面嘅จบ表示到達終點，แล้ว表達已達成狀態。
    examples:
      - text: ฉันอ่านหนังสือเล่มนี้จบแล้ว
        meaning: 我已經睇完呢本書。
        note: 句子表示閱讀完成，唔係淨係較早發生過。
