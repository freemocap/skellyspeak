sections:
  - subskill_id: causes_reasons
    explanation: เพราะ引出前述情況嘅原因。
    examples:
      - text: ฉันอยู่บ้านเพราะฝนตก
        meaning: 因為落緊雨，我留喺屋企。
        note: 當前語境交代時間；落雨係原因。
  - subskill_id: consequences
    explanation: เลย可以連接事件同結果。
    examples:
      - text: รถเมล์ไม่มา ฉันเลยเดินไป
        meaning: 架巴士冇嚟，所以我行咗過去。
        note: 講述過去行程時，行路係巴士冇嚟之後嘅應對。
  - subskill_id: conditions
    explanation: ถ้า引出條件，另一個分句交代相應結果。
    examples:
      - text: ถ้าพรุ่งนี้ฝนตก เราจะอยู่บ้าน
        meaning: 如果聽日落雨，我哋就留喺屋企。
        note: 計劃取決於天氣條件。
  - subskill_id: contrast
    explanation: แต่連接討論中有對比嘅描述。
    examples:
      - text: ทางสั้นแต่ชัน
        meaning: 條路短，但好斜。
        note: 揀路線時，兩個性質有唔同影響。
  - subskill_id: supporting_claims
    explanation: 原因分句可以為推論提供證據。
    examples:
      - text: ฉันคิดว่ามีคนอยู่บ้าน เพราะไฟยังเปิดอยู่
        meaning: 我諗有人喺屋企，因為盞燈仲開住。
        note: 燈光支持推論，唔係造成有人嘅原因。
