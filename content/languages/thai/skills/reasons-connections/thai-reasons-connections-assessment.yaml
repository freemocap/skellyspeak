skill_id: reasons_connections
guidance: Assess reasons, consequences, conditions, contrast and support for claims. เพราะ
  introduces a reason; เลย can present a consequence. ถ้าพรุ่งนี้ฝนตก เราจะอยู่บ้าน establishes
  a condition and a dependent plan without tense conjugation. แต่ contrasts properties, whereas
  แล้ว can simply order events. An illuminated window can support an inference of occupancy
  rather than cause occupancy. เพราะฝนตก can answer an identifiable why-question contextually. A
  copied connector without recoverable related propositions is absent. Do not count every
  sequence as causation or require a separate explicit connector when a coherent relation is
  already expressed. Judge whether stated evidence actually supports the claim. Preserve
  contextual omission and correct particle placement, and distinguish a future plan conditional
  on weather from an unconditional prediction about what will happen.
