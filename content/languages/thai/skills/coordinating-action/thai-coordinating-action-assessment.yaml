skill_id: coordinating_action
guidance: Assess requests, offers or invitations, suggestions, commitments, acceptance or
  refusal, and negotiation. ช่วยย้ายกล่องนี้ไปที่ประตูหน่อย requests help;
  เดี๋ยวฉันถือกระเป๋าให้ offers to carry a bag. พักกันสักครู่ไหม proposes a shared break.
  พรุ่งนี้ฉันจะเอาเครื่องมือมา can undertake a task in planning, but future marking alone does
  not establish commitment. วันนี้ไปไม่ได้ can decline an invitation and a proposed Saturday
  meeting can negotiate an alternative. ได้ can accept a prior concrete proposal contextually. A
  copied หน่อย without a recoverable request is absent. Politeness depends on reference terms,
  particles and social context; absence of ครับ or ค่ะ is not automatically failed coordination.
  Determine who is to act and what response is sought, preserving natural omissions and
  distinguishing permission questions from requests that the listener perform an action.
