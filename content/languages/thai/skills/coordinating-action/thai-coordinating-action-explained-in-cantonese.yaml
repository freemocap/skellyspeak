sections:
  - subskill_id: requests
    explanation: ช่วย配合動作同หน่อย，可以請人幫手。
    examples:
      - text: ช่วยย้ายกล่องนี้ไปที่ประตูหน่อย
        meaning: 唔該幫手搬呢個箱去門口。
        note: 適合合作情境；額外禮貌語氣詞要按講者同雙方關係選擇。
  - subskill_id: offers_invitations
    explanation: 即將行動嘅陳述配合ให้，可以主動提出幫忙。
    examples:
      - text: เดี๋ยวฉันถือกระเป๋าให้
        meaning: 我幫你拎個袋。
        note: 聽者係語境中已知嘅受益者；講者自願行動。
  - subskill_id: suggestions
    explanation: กัน表示共同參與，ไหม可以邀請對方接受提議。
    examples:
      - text: พักกันสักครู่ไหม
        meaning: 不如我哋抖一陣？
        note: 休息提議包括講者同聽者。
  - subskill_id: commitments
    explanation: 將來陳述可以表示負責約定嘅工作。
    examples:
      - text: พรุ่งนี้ฉันจะเอาเครื่องมือมา
        meaning: 聽日我會帶工具嚟。
        note: 分工時用，講者承擔帶工具嘅責任。
  - subskill_id: accepting_declining
    explanation: 表達冇辦法出席，可以拒絕邀請。
    examples:
      - text: ขอโทษ วันนี้ฉันไปไม่ได้
        meaning: 唔好意思，我今日去唔到。
        note: 之前邀請交代咗拒絕邊個活動。
  - subskill_id: negotiating_plans
    explanation: 先講時間限制，再提出替代方案。
    examples:
      - text: วันศุกร์ฉันไม่ว่าง เจอกันวันเสาร์แทนได้ไหม
        meaning: 我星期五唔得閒。可唔可以改星期六見？
        note: แทน將星期六標示為替代日子。
