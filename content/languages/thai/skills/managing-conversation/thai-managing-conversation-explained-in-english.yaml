skill_id: managing_conversation
explanation_language: english
shared_explanation: skills/managing-conversation/managing-conversation-explained-in-english.yaml
sections:
  - subskill_id: opening_closing
    explanation: A farewell can name the next expected meeting.
    examples:
      - text: แล้วเจอกันสัปดาห์หน้า
        meaning: See you next week.
        note: This closes the current exchange.
  - subskill_id: acknowledging
    explanation: เข้าใจแล้ว acknowledges that understanding has been reached.
    examples:
      - text: อ๋อ ตอนนี้เข้าใจแล้ว
        meaning: Ah, now I understand.
        note: Use after an explanation; understanding need not mean agreement.
  - subskill_id: clarification
    explanation: A question can ask the other speaker to repeat the preceding contribution.
    examples:
      - text: พูดอีกครั้งได้ไหม
        meaning: Could you say that again?
        note: The context supplies the speaker and material to repeat.
  - subskill_id: rephrasing
    explanation: พูดอีกอย่างก็คือ introduces another formulation.
    examples:
      - text: พูดอีกอย่างก็คือ ต้องจองล่วงหน้า
        meaning: In other words, you need to book in advance.
        note: Use after explaining how a booking procedure works.
  - subskill_id: correcting_misunderstanding
    explanation: หมายถึง identifies the intended meaning and contrasts it with a mistaken one.
    examples:
      - text: ฉันหมายถึงวันเสาร์ ไม่ใช่วันศุกร์
        meaning: I mean Saturday, not Friday.
        note: The speaker corrects the day understood by the listener.
  - subskill_id: turns_topics
    explanation: A permission-shaped request can manage a topic transition.
    examples:
      - text: ขอถามเรื่องอื่นหน่อยได้ไหม
        meaning: May I ask about something else?
        note: The requested action concerns the conversation itself.
