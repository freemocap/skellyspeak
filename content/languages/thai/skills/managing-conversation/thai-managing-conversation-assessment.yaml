guidance: Recognize contact opening or closing, acknowledgement, clarification, rephrasing,
  correcting misunderstanding and managing turns or topics. แล้วเจอกัน closes contact with
  expected future meeting. ตอนนี้เข้าใจแล้ว acknowledges comprehension without necessarily
  agreement. พูดอีกครั้งได้ไหม asks for repetition of the prior contribution. พูดอีกอย่างก็คือ
  introduces a reformulation; หมายถึง identifies intended meaning in a repair.
  ขอถามเรื่องอื่นหน่อยได้ไหม requests a topic transition. A greeting quoted in a vocabulary list
  is absent as actual conversational work. A short อ๋อ can acknowledge a particular explanation
  contextually, but its function depends on the exchange. Do not demand long repair sentences,
  assume a missing antecedent or equate every information question with clarification. Judge the
  interactional effect and allow appropriate variations in pronouns and polite particles.
