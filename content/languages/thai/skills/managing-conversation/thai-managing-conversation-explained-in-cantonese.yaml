sections:
  - subskill_id: opening_closing
    explanation: 道別可以交代預期下次見面時間。
    examples:
      - text: แล้วเจอกันสัปดาห์หน้า
        meaning: 下星期見。
        note: 呢句結束今次交談。
  - subskill_id: acknowledging
    explanation: เข้าใจแล้ว確認已經理解。
    examples:
      - text: อ๋อ ตอนนี้เข้าใจแล้ว
        meaning: 哦，我而家明喇。
        note: 解釋後用；明白唔一定表示同意。
  - subskill_id: clarification
    explanation: 問句可以請對方重複上一段發言。
    examples:
      - text: พูดอีกครั้งได้ไหม
        meaning: 可唔可以再講一次？
        note: 語境交代邊個再講同重複乜內容。
  - subskill_id: rephrasing
    explanation: พูดอีกอย่างก็คือ引出另一種講法。
    examples:
      - text: พูดอีกอย่างก็คือ ต้องจองล่วงหน้า
        meaning: 即係話，你要預先訂位。
        note: 解釋訂位程序之後用。
  - subskill_id: correcting_misunderstanding
    explanation: หมายถึง指出真正意思，並同錯誤理解作對比。
    examples:
      - text: ฉันหมายถึงวันเสาร์ ไม่ใช่วันศุกร์
        meaning: 我係指星期六，唔係星期五。
        note: 講者更正聽者理解錯咗嘅日子。
  - subskill_id: turns_topics
    explanation: 許可形式嘅請求可以管理轉話題。
    examples:
      - text: ขอถามเรื่องอื่นหน่อยได้ไหม
        meaning: 我可唔可以問另一件事？
        note: 請求嘅行動關乎對話本身。
