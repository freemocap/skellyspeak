sections:
  - subskill_id: opening_closing
    explanation: 你約好下星期再見，依家要離開。`แล้วเจอกัน` 係預期再見嘅道別語；`สัปดาห์หน้า` 補上預期時間。呢句結束目前對話，唔係重新協商。
    examples:
      - text: แล้วเจอกันสัปดาห์หน้า
        meaning: 下星期見。
        note: 試吓道別並講聽日再見。答案：`แล้วเจอกันพรุ่งนี้`。道別語保留；`พรุ่งนี้` 改下次見面時間。
  - subskill_id: acknowledging
    explanation: 同事啱啱解釋咗難明步驟。`อ๋อ` 表示領會；`ตอนนี้เข้าใจแล้ว` 話而家已經明白。呢度 `แล้ว` 講狀態改變，唔係通用過去式字尾。表示聽明唔自動等於同意建議。
    examples:
      - text: อ๋อ ตอนนี้เข้าใจแล้ว
        meaning: 哦，我而家明喇。
        note: 試吓唔講「而家」，只回應已經明白。答案：`อ๋อ เข้าใจแล้ว`。`เข้าใจแล้ว` 仍話俾同事知解釋已經清楚。
  - subskill_id: clarification
    explanation: 你冇聽清對方啱啱講乜。`พูดอีกครั้ง` 請對方再講一次；`ได้ไหม` 將呢個行動變成問句。喺語境中，句子要求重複上一句，唔係查問外面嘅新事實。
    examples:
      - text: พูดอีกครั้งได้ไหม
        meaning: 可唔可以再講一次？
        note: 試吓改為請佢再解釋一次。答案：`อธิบายอีกครั้งได้ไหม`。`อีกครั้งได้ไหม` 仍請對方再做；`อธิบาย` 要求解釋，唔係照原話重複。
  - subskill_id: rephrasing
    explanation: 訪客已聽到呢項服務要求到場前預約。`พูดอีกอย่างก็คือ` 標示用另一種講法重述；`ต้องจองล่วงหน้า` 講明要預先預約。新講法要保留已知規則，唔好無端加新條件。
    examples:
      - text: พูดอีกอย่างก็คือ ต้องจองล่วงหน้า
        meaning: 即係話，你要預先訂位。
        note: 試吓改講成「來之前要預約」。答案：`พูดอีกอย่างก็คือ ต้องจองก่อนมา`。開頭仍標示重述；`ก่อนมา` 講清時間。
  - subskill_id: correcting_misunderstanding
    explanation: 對方以為你指星期五，其實你指星期六。`ฉันหมายถึงวันเสาร์` 講真正日子；`ไม่ใช่วันศุกร์` 明確否定誤聽日子。兩日都講出嚟，比淨係重複星期六更容易修正安排。
    examples:
      - text: ฉันหมายถึงวันเสาร์ ไม่ใช่วันศุกร์
        meaning: 我係指星期六，唔係星期五。
        note: 試吓更正：對方聽成星期六，但你指星期日。答案：`ฉันหมายถึงวันอาทิตย์ ไม่ใช่วันเสาร์`。真正日子先出現；`ไม่ใช่` 否定誤聽日子。
  - subskill_id: turns_topics
    explanation: 小組傾完一件事，你想提出另一個話題。`ขอถาม` 請求發問機會；`เรื่องอื่น` 指另一件事。`หน่อยได้ไหม` 緩和轉場請求。呢條問句管理對話，未開始查問新議題嘅答案。
    examples:
      - text: ขอถามเรื่องอื่นหน่อยได้ไหม
        meaning: 我可唔可以問另一件事？
        note: 試吓問可否接住講時間表。答案：`ขอถามเรื่องตารางเวลาหน่อยได้ไหม`。請求式問句保留；`เรื่องตารางเวลา` 指下一話題。
