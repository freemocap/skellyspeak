sections:
  - subskill_id: identification
    explanation: 你向訪客介紹鄰居。`นี่คือ` 指出並辨認人物；`เพื่อนบ้าน` 講關係，`ของฉัน` 將鄰居同講者連起來。句子辨認一個人，唔係講地點或訪客嘅特質。
    examples:
      - text: นี่คือเพื่อนบ้านของฉัน
        meaning: 呢位係我鄰居。
        note: 試吓介紹你嘅老師。答案：`นี่คือครูของฉัน`。`นี่คือ` 仍辨認人物；`ครูของฉัน` 改變關係。
  - subskill_id: qualities_states
    explanation: 有人問呢條路點樣。`ถนนสายนี้` 指呢一條路；`แคบ` 直接講佢窄。泰語喺呢種性質句可直接用描述詞，唔使照英文「is」另加 `เป็น`。
    examples:
      - text: ถนนสายนี้แคบ
        meaning: 呢條路好窄。
        note: 試吓話呢條路闊。答案：`ถนนสายนี้กว้าง`。路嘅指稱不變；`กว้าง` 講相反特質。
  - subskill_id: location_movement
    explanation: 朋友搵鎖匙。`กุญแจ` 指物件；`อยู่` 講佢位於某處，`บนโต๊ะ` 指枱面上。呢句答靜態「喺邊」，唔係講向枱移動。
    examples:
      - text: กุญแจอยู่บนโต๊ะ
        meaning: 鎖匙喺張枱上面。
        note: 試吓話鎖匙喺枱底。答案：`กุญแจอยู่ใต้โต๊ะ`。`อยู่` 保留位置意思；`ใต้โต๊ะ` 改變方位。
  - subskill_id: possession_relations
    explanation: 你點算畀客人用嘅摺椅。`ฉันมี` 表示講者有；`เก้าอี้พับ` 係物件。`สองตัว` 將數字放喺量詞 `ตัว` 前；椅作有腳傢俬用呢個量詞。句子數兩張椅，唔係第二號款式。
    examples:
      - text: ฉันมีเก้าอี้พับสองตัว
        meaning: 我有兩張摺椅。
        note: 試吓話你有三張摺椅。答案：`ฉันมีเก้าอี้พับสามตัว`。`มี` 保留持有意思；`สามตัว` 改數量，保留椅嘅量詞。
  - subskill_id: quantity_comparison
    explanation: 你揀邊個箱容易搬。`กล่องนี้` 係被評價嘅呢個箱；`เบา` 講輕。`กว่า` 引出比較基準 `กล่องนั้น`。句子比較重量，唔係箱嘅數量。
    examples:
      - text: กล่องนี้เบากว่ากล่องนั้น
        meaning: 呢個箱比嗰個箱輕。
        note: 試吓話呢個箱比嗰個重。答案：`กล่องนี้หนักกว่ากล่องนั้น`。`หนัก` 將重量性質反轉；`กว่า` 保留比較結構。
