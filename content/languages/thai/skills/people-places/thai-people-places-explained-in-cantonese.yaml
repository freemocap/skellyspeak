sections:
  - subskill_id: identification
    explanation: นี่คือ引出身份識別，ของ可以將一個人同講者連起來。
    examples:
      - text: นี่คือเพื่อนบ้านของฉัน
        meaning: 呢位係我鄰居。
        note: ฉัน係第一人稱選項之一；亦可以用其他符合社交場合嘅自稱。
  - subskill_id: qualities_states
    explanation: 形容詞可以直接表達性質述語。
    examples:
      - text: ถนนสายนี้แคบ
        meaning: 呢條路好窄。
        note: สายนี้識別呢條路；แคบ直接提供性質，唔加เป็น。
  - subskill_id: location_movement
    explanation: อยู่配合位置短語交代物件喺邊。
    examples:
      - text: กุญแจอยู่บนโต๊ะ
        meaning: 鎖匙喺張枱上面。
        note: บนโต๊ะ指出承托物件嘅表面。
  - subskill_id: possession_relations
    explanation: มี可以表示擁有；數物件時，量詞放喺名詞後嘅數字後面。
    examples:
      - text: ฉันมีเก้าอี้พับสองตัว
        meaning: 我有兩張摺凳。
        note: สองตัว數凳，唔會加複數詞尾。
  - subskill_id: quantity_comparison
    explanation: กว่า喺比較中引出基準。
    examples:
      - text: กล่องนี้เบากว่ากล่องนั้น
        meaning: 呢個箱比嗰個箱輕。
        note: เบา關乎重量；กว่า將呢個性質連到另一個箱。
