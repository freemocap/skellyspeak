skill_id: people_places
guidance: Assess identification, qualities, location or movement, possession or relationships,
  and quantity or comparison. นี่คือเพื่อนบ้านของฉัน identifies a person; ถนนสายนี้แคบ
  predicates narrowness without requiring เป็น before the adjective. กุญแจอยู่บนโต๊ะ locates an
  object; ไปที่ประตู gives a destination. ของ can mark possession and มี can state having
  something. เก้าอี้สองตัว counts chairs with the classifier after the number; รถเมล์สายสอง
  identifies a route rather than a quantity. เบากว่า compares weight. บนโต๊ะ can answer a
  where-question contextually. A copied classifier or disconnected noun list is absent. Do not
  impose gender agreement, plural endings or spaces between every written word. Thai reference
  terms and omitted subjects depend on social and discourse context. Judge the relation actually
  expressed and relevant ordering rather than requiring one memorized copular formula.
