sections:
  - subskill_id: wants_intentions
    explanation: 你講想習得嘅技能。`ฉันอยาก` 表示講者願望；`เรียนเย็บผ้า` 指想學縫紉。泰語可以將想做嘅活動直接放喺 `อยาก` 後面，唔使英文式「to」。想學唔等於已經識。
    examples:
      - text: ฉันอยากเรียนเย็บผ้า
        meaning: 我想學縫紉。
        note: 試吓話想學煮食。答案：`ฉันอยากเรียนทำอาหาร`。`อยาก` 仍表願望；`เรียนทำอาหาร` 指新嘅學習目標。
  - subskill_id: preferences
    explanation: 你喺茶同咖啡之間揀。`ฉันชอบชา` 指茶係你鍾意嘅飲品；`มากกว่า` 再將喜好同 `กาแฟ` 比較。句子講相對偏好，唔代表你唔鍾意咖啡。飲品名詞毋須加英文式比較字尾。
    examples:
      - text: ฉันชอบชามากกว่ากาแฟ
        meaning: 比起咖啡，我鍾意茶多啲。
        note: 試吓話比起茶更鍾意咖啡。答案：`ฉันชอบกาแฟมากกว่าชา`。兩種飲品喺 `มากกว่า` 前後交換位置；仍係講偏好。
  - subskill_id: emotions
    explanation: 你啱啱聽到好消息，講自己感受。`ฉันดีใจ` 係講者高興；`ที่ได้ยินข่าวนี้` 指聽到呢個消息令你有呢種感受。呢度 `ได้ยิน` 係「聽到」，唔應將入面嘅 `ได้` 當成問許可。
    examples:
      - text: ฉันดีใจที่ได้ยินข่าวนี้
        meaning: 聽到呢個消息，我好開心。
        note: 試吓話見到呢位朋友令你好高興。答案：`ฉันดีใจที่ได้เจอเพื่อนคนนี้`。`ดีใจ` 保留情緒；`ที่ได้...` 子句改變觸發感受嘅事。
  - subskill_id: opinions
    explanation: 你評價討論中嘅方法。`ฉันคิดว่า` 將後面說法標成你嘅睇法；`วิธีนี้` 指呢個方法。`ง่ายกว่า` 話佢比對話已知嘅另一方法容易。呢句係判斷，唔係叫人採用。
    examples:
      - text: ฉันคิดว่าวิธีนี้ง่ายกว่า
        meaning: 我覺得呢個方法容易啲。
        note: 試吓表示你認為呢條路比另一條短。答案：`ฉันคิดว่าทางนี้สั้นกว่า`。`คิดว่า` 仍標示意見；`สั้นกว่า` 提供新比較。
  - subskill_id: agreement_disagreement
    explanation: 有人提出改動，你表明反對。`เห็นด้วย` 係同意一種睇法；前面 `ไม่` 將立場反轉。`กับข้อเสนอนี้` 指呢個被反對嘅建議。句子講同唔同意，唔係有冇聽明。
    examples:
      - text: ฉันไม่เห็นด้วยกับข้อเสนอนี้
        meaning: 我唔同意呢個建議。
        note: 試吓反對呢個計劃。答案：`ฉันไม่เห็นด้วยกับแผนนี้`。`ไม่เห็นด้วย` 保留反對；`กับแผนนี้` 指新嘅反對對象。
