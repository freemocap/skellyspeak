sections:
  - subskill_id: wants_intentions
    explanation: 活動前面嘅อยาก表達願望。
    examples:
      - text: ฉันอยากเรียนเย็บผ้า
        meaning: 我想學縫紉。
        note: เรียนเย็บผ้า交代想學嘅活動。
  - subskill_id: preferences
    explanation: ชอบ配合มากกว่า，比較兩個選項嘅喜好。
    examples:
      - text: ฉันชอบชามากกว่ากาแฟ
        meaning: 比起咖啡，我鍾意茶多啲。
        note: 茶係較鍾意嘅選項。
  - subskill_id: emotions
    explanation: ดีใจ描述高興，可以接分句交代因乜嘢而起。
    examples:
      - text: ฉันดีใจที่ได้ยินข่าวนี้
        meaning: 聽到呢個消息，我好開心。
        note: 消息引起感受，冇性別配合變化。
  - subskill_id: opinions
    explanation: คิดว่า引出個人判斷內容。
    examples:
      - text: ฉันคิดว่าวิธีนี้ง่ายกว่า
        meaning: 我覺得呢個方法容易啲。
        note: 比較關乎之前討論緊嘅方法。
  - subskill_id: agreement_disagreement
    explanation: เห็นด้วย表示同意，加ไม่就變成否定。
    examples:
      - text: ฉันไม่เห็นด้วยกับข้อเสนอนี้
        meaning: 我唔同意呢個建議。
        note: กับข้อเสนอนี้指出反對乜嘢。
