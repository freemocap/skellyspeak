language: thai
skill_id: feelings_viewpoints
explanation_language: english
shared_explanation: skills/feelings-viewpoints/feelings-viewpoints-explained-in-english.yaml
sections:
  - subskill_id: wants_intentions
    explanation: You are describing a skill you hope to acquire. `ฉันอยาก` expresses the speaker’s desire;
      `เรียนเย็บผ้า` says the desired activity is learning to sew. Thai can put the wanted activity after
      `อยาก` without an English-style “to.” Wanting to learn does not assert that you can already sew.
    examples:
      - text: ฉันอยากเรียนเย็บผ้า
        meaning: I want to learn to sew.
        note: "Try expressing a desire to learn to cook. Answer: `ฉันอยากเรียนทำอาหาร` `อยาก` still marks desire, and
          `เรียนทำอาหาร` names the new skill to learn."
  - subskill_id: preferences
    explanation: You are choosing between tea and coffee. `ฉันชอบชา` identifies tea as what you like; `มากกว่า`
      then compares that liking with `กาแฟ`. The construction expresses a relative preference, not a claim
      that you dislike coffee. Thai does not need a comparative ending on the drink names.
    examples:
      - text: ฉันชอบชามากกว่ากาแฟ
        meaning: I prefer tea to coffee.
        note: "Try saying you prefer coffee to tea. Answer: `ฉันชอบกาแฟมากกว่าชา` The two drinks exchange places
          around `มากกว่า`; the speaker still reports a preference."
  - subskill_id: emotions
    explanation: You have just heard good news and describe your reaction. `ฉันดีใจ` says the speaker is glad;
      `ที่ได้ยินข่าวนี้` identifies hearing this news as the occasion for the feeling. `ได้ยิน` here means
      “hear,” so its `ได้` should not be mistaken for a permission request.
    examples:
      - text: ฉันดีใจที่ได้ยินข่าวนี้
        meaning: I am glad to hear this news.
        note: "Try saying you are glad to see this friend. Answer: `ฉันดีใจที่ได้เจอเพื่อนคนนี้` `ดีใจ` keeps the
          emotion; the `ที่ได้...` clause changes what prompted it."
  - subskill_id: opinions
    explanation: You are evaluating a method under discussion. `ฉันคิดว่า` frames the following statement as your
      view; `วิธีนี้` names this method. `ง่ายกว่า` says it is easier than an alternative that the
      conversation already supplies. This is a judgment, rather than an instruction to use the method.
    examples:
      - text: ฉันคิดว่าวิธีนี้ง่ายกว่า
        meaning: I think this method is easier.
        note: "Try giving your view that this route is shorter than the alternative. Answer: `ฉันคิดว่าทางนี้สั้นกว่า`
          `คิดว่า` still marks an opinion, and `สั้นกว่า` gives the new comparison."
  - subskill_id: agreement_disagreement
    explanation: Someone proposes a change and you reject it. `เห็นด้วย` means to agree with a view; `ไม่` before
      it reverses the stance. `กับข้อเสนอนี้` identifies this proposal as what you disagree with. The sentence
      concerns alignment with a proposal, not whether you understood the speaker.
    examples:
      - text: ฉันไม่เห็นด้วยกับข้อเสนอนี้
        meaning: I disagree with this proposal.
        note: "Try disagreeing with this plan. Answer: `ฉันไม่เห็นด้วยกับแผนนี้` `ไม่เห็นด้วย` keeps the dissent;
          `กับแผนนี้` names the new object of disagreement."
