sections:
  - subskill_id: wants_intentions
    explanation: อยาก before an activity expresses desire.
    examples:
      - text: ฉันอยากเรียนเย็บผ้า
        meaning: I want to learn to sew.
        note: เรียนเย็บผ้า names the desired learning activity.
  - subskill_id: preferences
    explanation: ชอบ with มากกว่า compares liking for two alternatives.
    examples:
      - text: ฉันชอบชามากกว่ากาแฟ
        meaning: I prefer tea to coffee.
        note: Tea is the preferred option.
  - subskill_id: emotions
    explanation: ดีใจ describes gladness and can take a clause identifying its occasion.
    examples:
      - text: ฉันดีใจที่ได้ยินข่าวนี้
        meaning: I am glad to hear this news.
        note: The news prompts the feeling; no gender agreement is involved.
  - subskill_id: opinions
    explanation: คิดว่า introduces the content of a personal judgment.
    examples:
      - text: ฉันคิดว่าวิธีนี้ง่ายกว่า
        meaning: I think this method is easier.
        note: The comparison concerns methods already under discussion.
  - subskill_id: agreement_disagreement
    explanation: เห็นด้วย expresses agreement; ไม่ negates it.
    examples:
      - text: ฉันไม่เห็นด้วยกับข้อเสนอนี้
        meaning: I disagree with this proposal.
        note: กับข้อเสนอนี้ identifies what is rejected.
