# yaml-language-server: $schema=../rust-schemas/teaching-policy.yaml
guidance:
  - scope: target_writing
    text: Generate target-language wording consistently in the selected variety and writing convention.
      Match the situation and relationship without adding regional slang just to signal identity.
      A broad regional profile does not prescribe one local accent or make other local forms wrong.
      Partner biography and earlier messages do not override the selected variety. Apply these rules
      to new replies, examples and corrections; preserve source quotations, existing names and identifiers.
    sources:
      - asha_language_variation
  - scope: explanation_writing
    text: Generate explanatory prose in the selected explanation variety and writing convention,
      independently of the target variety. Use clear, context-appropriate wording without forced
      regional slang. Target-language examples retain their target variety. Preserve verbatim
      quotations, names and identifiers exactly.
    sources:
      - asha_language_variation
  - scope: assessment
    text: Copy evidence character-for-character from learner text. Never correct spelling or translate
      evidence quotes. Keep proposed corrections separate from evidence quotes and follow the task's
      response schema. Never invent errors.
    sources:
      - hattie_timperley2007
  - scope: assessment
    text: A valid form from another variety is not a learner error. If useful, explain how the selected
      variety would express it as an alternative, without recording it as incorrect. Regional
      spelling, vocabulary and register are not evidence of a pronunciation error. Uncertain usage
      remains uncertain; do not impose a single local norm on a broad regional profile.
    sources:
      - asha_language_variation
  - scope: pragmatics
    text: Support the learner’s chosen purpose through dialogue. The conversation partner remains a
      partner, never an examiner; feedback concerns the work, never the person.
    sources:
      - freire1970
      - hooks1994
      - illich1973
feedback:
  correct_only: useful_language
  skip_sources: []
  intensity:
    light:
      start_at: explicit
      show_logged: false
    standard:
      start_at: explicit
      show_logged: true
    thorough:
      start_at: explicit
      show_logged: true
  never:
    - praise_the_person
    - correct_in_partner_voice
    - block_continuing
  sources:
    - lyster_ranta1997
    - lyster_saito2010
    - aljaafreh_lantolf1994
    - hattie_timperley2007
estimator:
  version: 1
  initial_rating: 0
  learning_rate: 0.4
  initial_half_life_days: 3
  min_half_life_days: 0.25
  max_half_life_days: 180
  success_growth: 1.5
  failure_shrink: 0.7
  due_recall: 0.7
  minimum_independent_observations: 5
  support:
    none: 1
    partner_clarify: 0.85
    hint: 0.7
    elicit: 0.55
    metalinguistic: 0.4
    suggestion: 0.2
    revision: 0.2
    explicit: 0.1
  sources:
    - pelanek2016
    - settles_meeder2016
game:
  version: 1
  rules:
    - evidence_caused
    - truthful
    - never_punish_stopping
  base:
    demonstrated: 10
    partial: 4
    repair: 12
  support:
    none: 1.5
    partner_clarify: 1.3
    hint: 1.2
    elicit: 1
    metalinguistic: 0.8
    suggestion: 0.5
    revision: 0.5
    explicit: 0.3
  difficulty:
    absolute_zero: 1
    beginner: 1
    intermediate: 1.2
    advanced: 1.4
    fluent: 1.5
  novelty:
    first_ever: 2
    first_this_week: 1.2
    routine: 1
  tiers:
    construct_discovered: 3
    repair: 2
    xp_tick: 0
  never_from:
    - time
    - message_count
    - login
    - coach_output
  sources:
    - zagal2013
