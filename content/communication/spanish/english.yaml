groups:
  people_places:
    assessment: "Spanish can identify with ser, describe properties with ser or estar according to meaning, locate with estar and prepositions, express possession with possessives or de, and compare with más/menos ... que. Check the construction used, including agreement where it establishes the description. Do not reduce ser/estar to permanent/temporary. Correct identification alone is sufficient for this group; a wrong description elsewhere does not erase it."
    sections:
      - subskill: identification
        explanation: "Use ser to identify a person or thing. Spanish can omit a subject pronoun when the verb and context identify the subject."
        examples:
          - text: "Soy Ana."
            meaning: "I am Ana."
            note: "Soy identifies the speaker."
      - subskill: qualities_states
        explanation: "Choose ser or estar for the intended description. They can change the meaning; permanence alone is not the rule."
        examples:
          - text: "La puerta está abierta."
            meaning: "The door is open."
            note: "Estar describes the door's current state."
      - subskill: location_movement
        explanation: "Use location or movement verbs with a phrase that names the place or path."
        examples:
          - text: "El libro está en la mesa."
            meaning: "The book is on the table."
            note: "Estar en locates the book relative to the table."
      - subskill: possession_relations
        explanation: "Possessives and de can express ownership or relationships. A possessive agrees with the possessed noun, not the owner."
        examples:
          - text: "Es el libro de mi hermana."
            meaning: "It is my sister's book."
            note: "De names the relationship to the book."
      - subskill: quantity_comparison
        explanation: "Use numbers and quantity words for amounts; más ... que and menos ... que compare a quality or quantity."
        examples:
          - text: "Esta caja es más grande que esa."
            meaning: "This box is bigger than that one."
            note: "Más grande que supplies the comparison and its reference."
    varieties:
      spanish-spain:
        assessment: "These core examples are usable in Spain. Accept valid regional uses rather than requiring one national norm. Both simple and compound past constructions may be appropriate depending on context; do not require a compound past simply because an event happened today. Vosotros forms are available for informal plural address; ustedes forms are also grammatical in their appropriate variety or register."
        detail: null
        origin: ai
        review: needs_review
        authorship: AI-generated variety supplement; no independent human review.
      spanish-mexico:
        assessment: "These core examples are usable in Mexico. Ustedes is the usual plural address form and takes third-person plural agreement. Do not require vosotros or a Spain-specific past-tense preference. Judge the actual context and construction; valid local choices do not count as errors."
