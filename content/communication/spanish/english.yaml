  information_exchange:
    assessment: "Spanish questions can use interrogatives such as qué, dónde and cuándo, or yes/no intonation. Omitted opening punctuation alone should not defeat an otherwise correct conversational question. Contextually appropriate fragments can answer a question: en casa can answer ¿Dónde estás? Check relevance against the actual question, not sentence length. ¿Llegas a las ocho? can check a time; ¿Qué quieres decir? repairs understanding instead. Requests phrased with ¿Puedes...? need not ask for information."
    sections:
      - subskill: asking_information
        explanation: "Use the question expression that matches the information you need. Context and intonation also form yes/no questions."
        examples:
          - text: "¿Dónde está la estación?"
            meaning: "Where is the station?"
            note: "Dónde asks for a location."
      - subskill: answering_information
        explanation: "A relevant short answer can supply exactly what the question asks for without repeating its verb."
        examples:
          - text: "En casa."
            meaning: "At home."
            note: "This answers ¿Dónde estás?; without that question its response function is uncertain."
      - subskill: checking_facts
        explanation: "Ask for confirmation of a proposition or detail you already have in mind."
        examples:
          - text: "¿Llegas a las ocho?"
            meaning: "Are you arriving at eight?"
            note: "When confirming an arrangement, this checks the proposed arrival time."
      - subskill: useful_detail
        explanation: "Add details that help answer the actual question. Length alone does not make an answer useful."
        examples:
          - text: "Está al lado del banco, frente al parque."
            meaning: "It is beside the bank, opposite the park."
            note: "In an exchange about directions, the two landmarks make the location more precise."
