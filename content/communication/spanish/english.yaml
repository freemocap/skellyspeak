  time_events:
    assessment: "Judge the time relationship the learner actually expresses. Spanish uses present forms for current situations and habits; preterite for bounded past events; imperfect for past background or habits; and ir a + infinitive, future forms, or contextually future present forms for later events. Historical present can narrate past events when context supports it. Estar + gerund expresses an ongoing activity; ya + an appropriate completed construction can mark completion. Ayer fui al mercado correctly locates a completed event. Ayer yo ir al mercado is an unsuccessful finite past construction, not a correct past use. Ayer alone can be a correct contextual answer to ¿Cuándo fuiste? Missing an article elsewhere does not defeat a correctly formed temporal construction. Sequence does not imply cause. A hypothetical or polite past-form expression is not necessarily past reference."
    sections:
      - subskill: present_events
        explanation: "Present-tense forms can describe current situations or habits. The surrounding exchange tells you which meaning applies."
        examples:
          - text: "Trabajo aquí."
            meaning: "I work here."
            note: "The present describes the speaker's current work situation."
      - subskill: past_events
        explanation: "Use a past construction that matches what you mean. Fui can describe a completed trip; iba can describe an ongoing or habitual past situation. A short answer can inherit its time frame from the question."
        examples:
          - text: "Ayer fui al mercado."
            meaning: "Yesterday I went to the market."
            note: "Fui with ayer expresses a completed earlier trip; an unrelated article mistake would not change that temporal construction."
      - subskill: future_events
        explanation: "Ir a followed by an infinitive is one way to talk about a planned future action. Future forms and contextually future present forms are also possible."
        examples:
          - text: "Mañana voy a cocinar."
            meaning: "Tomorrow I am going to cook."
            note: "Mañana and voy a cocinar establish future reference."
      - subskill: duration_frequency
        explanation: "Use time phrases to state how long or how often something happens."
        examples:
          - text: "Estudio español todos los días."
            meaning: "I study Spanish every day."
            note: "Todos los días states the frequency."
      - subskill: event_sequence
        explanation: "Primero, después and other linking expressions can place events in order without claiming that one caused another."
        examples:
          - text: "Primero cenamos y después salimos."
            meaning: "First we had dinner and then we went out."
            note: "The two events have an explicit order; context supplies their past reading."
      - subskill: event_phase
        explanation: "Estar with a gerund can describe an activity in progress. Completed actions use other constructions appropriate to the time frame."
        examples:
          - text: "Estoy leyendo."
            meaning: "I am reading."
            note: "Estoy plus leyendo presents the activity as ongoing."
