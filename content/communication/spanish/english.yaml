  possibilities_constraints:
    assessment: "Spanish poder can express ability, permission or possibility; use the exchange to distinguish them. Tengo que + infinitive and hay que + infinitive express requirements; tengo de ir is not the corresponding tener que construction. Puede que + subjunctive expresses possibility. No estoy seguro expresses uncertainty. A future form can express conjecture rather than future time. A question such as ¿Puedes cerrar la puerta? usually requests action rather than testing ability. Do not credit this group from its modal form alone."
    sections:
      - subskill: ability
        explanation: "Poder plus an infinitive can express ability. Saber plus an infinitive can express knowing how to do something."
        examples:
          - text: "Sé nadar."
            meaning: "I know how to swim."
            note: "Saber describes learned ability."
      - subskill: permission
        explanation: "A question with poder can ask whether an action is allowed; the situation identifies the permission reading."
        examples:
          - text: "¿Puedo entrar?"
            meaning: "May I come in?"
            note: "At a doorway, the speaker asks for permission."
      - subskill: obligation
        explanation: "Tener que plus an infinitive states a personal requirement. Hay que can state a general requirement."
        examples:
          - text: "Tengo que salir."
            meaning: "I have to leave."
            note: "Que belongs between tengo and the infinitive."
      - subskill: possibility
        explanation: "Puede que plus a subjunctive clause presents something as possible."
        examples:
          - text: "Puede que llueva."
            meaning: "It may rain."
            note: "Llueva follows puede que in this possibility construction."
      - subskill: certainty
        explanation: "Expressions such as no estoy seguro state how certain the speaker is. They need not predict an event."
        examples:
          - text: "No estoy seguro."
            meaning: "I am not sure."
            note: "A masculine speaker marks uncertainty about the current proposition."
