  feelings_viewpoints:
    assessment: "Spanish expresses desire with querer + infinitive for one's own action, preferences with preferir or gustar constructions, emotion with forms such as estar contento, and opinions with creo que or evaluative wording. In gustar constructions, the liked item controls agreement: me gusta el café; me gustan los libros. Estoy de acuerdo and no estoy de acuerdo respond to a position. Count a correct function, not every assertion as an opinion. A request framed with quiero is still an action request when context makes that its purpose."
    sections:
      - subskill: wants_intentions
        explanation: "Querer followed by an infinitive can express what the subject wants to do."
        examples:
          - text: "Quiero descansar."
            meaning: "I want to rest."
            note: "The subject of wanting is also the intended subject of resting."
      - subskill: preferences
        explanation: "Preferir states a preference; gustar uses the thing liked as its grammatical subject."
        examples:
          - text: "Me gustan estos libros."
            meaning: "I like these books."
            note: "Gustan agrees with plural libros."
      - subskill: emotions
        explanation: "Name your feeling with an appropriate expression. Adjectives used with estar agree with the person described."
        examples:
          - text: "Estoy contenta."
            meaning: "I am happy."
            note: "A feminine speaker describes her emotional state."
      - subskill: opinions
        explanation: "Creo que can introduce your view of a proposition. An evaluation can also state your opinion directly."
        examples:
          - text: "Creo que es una buena idea."
            meaning: "I think it is a good idea."
            note: "The speaker presents an evaluation as their view."
      - subskill: agreement_disagreement
        explanation: "Respond to a known position with agreement, disagreement or a qualification."
        examples:
          - text: "No estoy de acuerdo."
            meaning: "I disagree."
            note: "The preceding position is needed to know what is being rejected."
