  coordinating_action:
    assessment: "Spanish can request action with an imperative or a conventional question such as ¿Puedes repetirlo?; do not require an imperative. Te ayudo can offer assistance; ¿Quieres venir? can invite participation. Podemos... can propose joint action. Acepto and lo siento, no puedo can accept or decline an identifiable proposal. Promise or commitment requires an undertaking in context, not merely a future form. Suggestions and negotiating an alternative are distinct functions but earn at most one group award together."
    sections:
      - subskill: requests
        explanation: "Ask for an action directly or with a conventional polite question. Poder in a request is not necessarily a question about physical ability."
        examples:
          - text: "¿Puedes cerrar la puerta, por favor?"
            meaning: "Can you close the door, please?"
            note: "The expected response is closing the door."
      - subskill: offers_invitations
        explanation: "Offer your help or invite the other person to join an activity."
        examples:
          - text: "¿Quieres venir a cenar?"
            meaning: "Would you like to come for dinner?"
            note: "In this setting the question invites participation."
      - subskill: suggestions
        explanation: "Podemos followed by an infinitive can propose something to do together."
        examples:
          - text: "Podemos ir mañana."
            meaning: "We could go tomorrow."
            note: "In a planning exchange, this proposes an option."
      - subskill: commitments
        explanation: "Use wording that undertakes responsibility when making a commitment; future time alone is not a promise."
        examples:
          - text: "Te prometo que voy a llamarte."
            meaning: "I promise I will call you."
            note: "Prometo makes the undertaking explicit."
      - subskill: accepting_declining
        explanation: "A short acceptance or refusal depends on the proposal it answers. You can decline politely without a long explanation."
        examples:
          - text: "Lo siento, no puedo."
            meaning: "Sorry, I cannot."
            note: "Following an invitation, this declines it."
      - subskill: negotiating_plans
        explanation: "Respond to a proposed plan with an alternative that addresses the obstacle."
        examples:
          - text: "A las seis no puedo; ¿quedamos a las siete?"
            meaning: "I cannot make six; shall we meet at seven?"
            note: "The speaker changes the proposed time to resolve a constraint."
