  reasons_connections:
    assessment: "Spanish porque introduces a reason, por eso a consequence, si a condition, and pero an opposition. Ordinary open conditions can use si + present indicative with an appropriate outcome. Do not accept a connector alone as proof that the two clauses form its intended relation. A condition and a reason differ; primero ... después establishes sequence but not causation. Evidence such as the lights being on can support a stated inference. Check that the learner links recoverable propositions coherently."
    sections:
      - subskill: causes_reasons
        explanation: "Porque connects an event or choice to its reason."
        examples:
          - text: "Me quedo porque estoy cansada."
            meaning: "I am staying because I am tired."
            note: "The second clause gives the reason for staying."
      - subskill: consequences
        explanation: "Por eso presents a result of the preceding situation."
        examples:
          - text: "Llueve; por eso llevo paraguas."
            meaning: "It is raining, so I am carrying an umbrella."
            note: "The umbrella follows as a response to the rain."
      - subskill: conditions
        explanation: "Si introduces a condition. For an open condition, present indicative can describe the condition."
        examples:
          - text: "Si llueve, me quedo en casa."
            meaning: "If it rains, I will stay home."
            note: "Staying home depends on the rain."
      - subskill: contrast
        explanation: "Pero can connect opposing facts or expectations."
        examples:
          - text: "Es caro, pero es útil."
            meaning: "It is expensive, but it is useful."
            note: "The second evaluation contrasts with the first."
      - subskill: supporting_claims
        explanation: "Give a reason or observation that supports accepting your claim, not just a stronger repetition."
        examples:
          - text: "Creo que está en casa porque la luz está encendida."
            meaning: "I think they are home because the light is on."
            note: "The light is evidence supporting the inference."
