# Evidence-only effort rewards. Numeric tuning is a product decision.
version: 1
rules: [evidence_caused, truthful, never_punish_stopping]
base: { demonstrated: 10, partial: 4, repair: 12 }
support: { none: 1.5, partner_clarify: 1.3, hint: 1.2, elicit: 1.0, metalinguistic: 0.8, suggestion: 0.5, revision: 0.5, explicit: 0.3 }
difficulty: { absolute_zero: 1.0, beginner: 1.0, intermediate: 1.2, advanced: 1.4, fluent: 1.5 }
novelty: { first_ever: 2.0, first_this_week: 1.2, routine: 1.0 }
tiers: { construct_discovered: 3, repair: 2, xp_tick: 0 }
never_from: [time, message_count, login, coach_output]
sources: [zagal2013]
