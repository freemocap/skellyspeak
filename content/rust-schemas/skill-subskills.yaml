$schema: http://json-schema.org/draft-07/schema#
additionalProperties: false
definitions:
  EvidenceContext:
    oneOf:
    - description: The current contribution can establish the function. Read available context to disambiguate it; this does not mean previous contributions are ignored.
      enum:
      - contribution
      type: string
    - description: A preceding contribution or shared proposal must be available to judge it.
      enum:
      - exchange
      type: string
  Generation:
    additionalProperties: false
    properties:
      model:
        type: string
      source_revisions:
        additionalProperties:
          type: string
        type: object
    required:
    - model
    - source_revisions
    type: object
  GenerationRecord:
    anyOf:
    - $ref: '#/definitions/Generation'
    - type: 'null'
  GuideOrigin:
    enum:
    - human
    - ai
    - mixed
    type: string
  Provenance:
    additionalProperties: false
    properties:
      authorship:
        type: string
      generation:
        allOf:
        - $ref: '#/definitions/GenerationRecord'
        description: Null is an explicit statement that generation metadata was not recorded.
      origin:
        $ref: '#/definitions/GuideOrigin'
      review:
        $ref: '#/definitions/Review'
      sources:
        items:
          type: string
        type: array
    required:
    - authorship
    - generation
    - origin
    - review
    - sources
    type: object
  Review:
    additionalProperties: false
    properties:
      revision:
        type: string
      scope:
        type: string
      status:
        $ref: '#/definitions/ReviewStatus'
    required:
    - revision
    - scope
    - status
    type: object
  ReviewStatus:
    enum:
    - needs_review
    - reviewed
    type: string
  Subskill:
    additionalProperties: false
    properties:
      boundary:
        type: string
      context:
        $ref: '#/definitions/EvidenceContext'
      counterexample:
        type: string
      id:
        type: string
      name:
        type: string
      neighbors:
        items:
          type: string
        type: array
      positive_evidence:
        type: string
      purpose:
        type: string
    required:
    - boundary
    - context
    - counterexample
    - id
    - name
    - neighbors
    - positive_evidence
    - purpose
    type: object
properties:
  provenance:
    $ref: '#/definitions/Provenance'
  revision:
    type: string
  schema_version:
    format: uint32
    minimum: 0.0
    type: integer
  skill_id:
    type: string
  subskills:
    items:
      $ref: '#/definitions/Subskill'
    type: array
required:
- provenance
- revision
- schema_version
- skill_id
- subskills
title: Subskills
type: object
