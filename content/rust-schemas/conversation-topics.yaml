$schema: http://json-schema.org/draft-07/schema#
definitions:
  ConversationTopic:
    additionalProperties: false
    properties:
      glyph:
        description: 'One emoji identifying the scene. Shared across languages: decorative, and never the only carrier of the card''s meaning.'
        type: string
      id:
        type: string
      labels:
        additionalProperties:
          type: string
        description: 'The scene name in every language. Read twice per card: once at the conversation''s target language, once at its explanation language.'
        type: object
      romanizations:
        additionalProperties:
          type: string
        description: 'The label transliterated, keyed by romanization SCHEME key ("mandarin:pinyin"), not by language: `supported_romanizations` is a list and a language may offer more than one scheme.'
        type: object
      subject:
        type: string
    required:
    - glyph
    - id
    - labels
    - romanizations
    - subject
    type: object
items:
  $ref: '#/definitions/ConversationTopic'
title: Array_of_ConversationTopic
type: array
