$schema: http://json-schema.org/draft-07/schema#
additionalProperties: false
definitions:
  Generation:
    additionalProperties: false
    properties:
      model:
        type: string
      source_revisions:
        additionalProperties:
          type: string
        type: object
    required:
    - model
    - source_revisions
    type: object
  GenerationRecord:
    anyOf:
    - $ref: '#/definitions/Generation'
    - type: 'null'
  GuideOrigin:
    enum:
    - human
    - ai
    - mixed
    type: string
  Provenance:
    additionalProperties: false
    properties:
      authorship:
        type: string
      generation:
        allOf:
        - $ref: '#/definitions/GenerationRecord'
        description: Null is an explicit statement that generation metadata was not recorded.
      origin:
        $ref: '#/definitions/GuideOrigin'
      review:
        $ref: '#/definitions/Review'
      sources:
        items:
          type: string
        type: array
    required:
    - authorship
    - generation
    - origin
    - review
    - sources
    type: object
  Review:
    additionalProperties: false
    properties:
      revision:
        type: string
      scope:
        type: string
      status:
        $ref: '#/definitions/ReviewStatus'
    required:
    - revision
    - scope
    - status
    type: object
  ReviewStatus:
    enum:
    - needs_review
    - reviewed
    type: string
properties:
  boundary:
    type: string
  id:
    type: string
  name:
    type: string
  provenance:
    $ref: '#/definitions/Provenance'
  purpose:
    type: string
  revision:
    type: string
  schema_version:
    format: uint32
    minimum: 0.0
    type: integer
required:
- boundary
- id
- name
- provenance
- purpose
- revision
- schema_version
title: Definition
type: object
