explanation_language: mandarin
title: 管理对话
introduction: 开始和结束对话、轮流发言，并澄清没听懂的内容。
sections:
  - subskill_id: opening_closing
    title: 开场与结束
    concept: 开始一段对话，或让对话告一段落。
  - subskill_id: acknowledging
    title: 回应与确认听到
    concept: 让对方知道你听到了，并作出合适回应。
  - subskill_id: clarification
    title: 请求澄清
    concept: 对没听清或没理解的内容请求帮助。
  - subskill_id: rephrasing
    title: 换种说法
    concept: 用另一种说法表达同一件事，让意思更清楚。
  - subskill_id: correcting_misunderstanding
    title: 纠正误解
    concept: 当别人理解错了你的意思时，说明原意。
  - subskill_id: turns_topics
    title: 发言轮次与话题
    concept: 轮流发言，并帮助对话转到不同话题。
