    title: Situations présentes
    concept: Parler des situations, des activités et des habitudes actuelles.
  - subskill_id: past_events
    title: Événements passés
    concept: Parler de ce qui s’est produit auparavant.
  - subskill_id: future_events
    title: Événements futurs
    concept: Parler de ce qui se produira ou pourrait se produire plus tard.
  - subskill_id: duration_frequency
    title: Durée et fréquence
    concept: Dire combien de temps dure une chose ou à quelle fréquence elle se produit.
  - subskill_id: event_sequence
    title: Enchaînement
    concept: Préciser ce qui se produit d’abord, ensuite et enfin.
  - subskill_id: event_phase
    title: Déroulement et achèvement
    concept: Dire si une action commence, se poursuit ou se termine.
